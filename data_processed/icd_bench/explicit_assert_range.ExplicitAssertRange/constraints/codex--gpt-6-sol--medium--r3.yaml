  \ prints the reason,\nincluding compilation errors. Use it as often as you like.\n\
  \n# Output format\n\nWrite `constraints.json` in the current folder, in this format:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isPositive('some_column')\"\n        }\n    ]\n}\n\nReturn constraints for\
  \ the `{{TARGET_COLUMN}}` column only.\n\nUse only the PyDeequ `Check` object's\
  \ methods in `code_for_constraint`. Each\nentry names the single column it constrains;\
  \ for a constraint spanning several\ncolumns, name the one it is primarily about.\n"
prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis code consumes the dataset as the dataframe `df`. It is an\
  \ excerpt of a\nlarger program, so names it uses but does not define come from that\
  \ program.\n\n```python\nobserved_statuses = df[\"status\"].nunique(dropna=True)\n\
  allowed_values = {COMPLETED, CANCELLED, IN_PROGRESS, UNDER_REVIEW}\nunexpected =\
  \ observed_statuses - allowed_values\nassert len(unexpected) == 0\n```\n\nThe same\
  \ code is on disk at `./code/snippet.py`, so you can search it or run parts\nof\
  \ it against the staged table rather than working from the listing alone.\n\n# The\
  \ data\n\nA sample of data that the program can process:\n\n booking_id  cost  \
  \  status\n          1     1 COMPLETED\n          2    10 COMPLETED\n          3\
  \    10 CANCELLED\n          4   100 CANCELLED\n\nThe full sample is on disk at\
  \ `./data/tables/observed_data.csv`. You have complete access to it:\nload it with\
  \ pandas, profile it, run whatever analysis helps. It is a throwaway\ncopy -- nothing\
  \ you do to it has any effect outside this workspace.\n\n# Verifying your constraints\n\
  \nYou can execute PyDeequ constraint code against the staged table and read back\n\
  the result of every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, in this format:\n\n\
  {\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isPositive('some_column')\"\n        }\n    ]\n}\n\nReturn constraints for\
  \ the `status` column only.\n\nUse only the PyDeequ `Check` object's methods in\
  \ `code_for_constraint`. Each\nentry names the single column it constrains; for\
  \ a constraint spanning several\ncolumns, name the one it is primarily about.\n\n\
  # Workspace boundary\n\nYour workspace is the current folder, and for this task\
  \ nothing else exists.\n\n- Read, list, search and write only inside this folder:\
  \ `./data`, `./code`,\n  `deequ_check.py`, `task.txt`, and whatever you create here.\n\
  - Do not touch anything outside it. That means no parent directory (`..`), no\n\
  \  other folder under /tmp, no home directory (`~`, $HOME), and no absolute path\n\
  \  anywhere else on the filesystem.\n- Do not search the wider filesystem -- no\
  \ `rg`, `grep`, `find`, `ls` or\n  `python` over `/`, `/tmp`, `..`, `~` or any path\
  \ outside this folder -- for\n  related data, prompts, examples, other runs, or\
  \ previous answers. There is\n  nothing out there you are allowed to use, and a\
  \ run that looks is discarded.\n- Running `python`, `deequ_check.py` and the tools\
  \ on your PATH is fine; the\n  boundary is about what you read and write, not which\
  \ interpreter runs.\n\nEverything you need is here. Work only from it.\n"
