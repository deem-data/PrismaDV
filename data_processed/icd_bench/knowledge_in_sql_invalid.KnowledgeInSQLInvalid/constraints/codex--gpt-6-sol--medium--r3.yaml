  \ program.\n\n```python\ntarget_col = 'status'\n\nnum_invalid_entries = duckdb.sql(f'''\n\
  \    SELECT COUNT(*) FROM df\n    WHERE {target_col} IS NOT NULL AND \n    {target_col}\
