  \ alone.\n\n# The data\n\nA sample of data that the program can process:\n\n booking_id\
  \  cost    status\n          1     1 COMPLETED\n          2    10 COMPLETED\n  \
  \        3    10 CANCELLED\n          4   100 CANCELLED\n\nThe full sample is on\
  \ disk at `./data/tables/observed_data.csv`. You have complete access to it:\nload\
