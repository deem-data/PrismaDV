    assumptions:
    - text: 'The ''profit'' column can contain null values as the code explicitly
        drops rows with missing ''profit'' values using `dropna`. However, not all
        values should be null so that the resulting dataset is non-empty.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty
        profit values", lambda x: x > 0)'
      sources:
