        end_line: 2
        file: ''
      uid: dfe7e59c-dd8f-4b3d-a785-c249f0697283
    - text: 'The ''profit'' column must be greater than the ''cost'' column for non-null
        rows because `math.log` is applied to `profit - cost`, which requires strictly
        positive inputs (`profit - cost > 0`).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN (CASE
        WHEN `profit` > `cost` THEN 1 ELSE 0 END) ELSE 1 END", "Profit greater than
        cost", lambda x: x == 1)'
