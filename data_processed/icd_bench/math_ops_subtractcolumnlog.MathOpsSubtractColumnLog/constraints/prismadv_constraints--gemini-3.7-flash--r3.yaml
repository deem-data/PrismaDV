        end_line: 1
        file: ''
      uid: 2523041d-4d85-4196-a483-ef8e1abb7c07
    - text: 'The ''profit'' column should be of numeric data type because the code
        performs subtraction between ''profit'' and ''cost''.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("profit", ConstrainableDataTypes.Numeric)'
