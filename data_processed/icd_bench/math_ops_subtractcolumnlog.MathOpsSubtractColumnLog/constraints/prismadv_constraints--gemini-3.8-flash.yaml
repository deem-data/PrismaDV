    assumptions:
    - text: 'The ''profit'' column can contain missing values because the code explicitly
        drops null values using dropna. However, it should not be completely null
        so that downstream operations can proceed. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `profit` IS NOT NULL
        THEN 1 ELSE 0 END", "Non-empty profit", lambda x: x > 0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: b83c032f-c16a-4611-93e8-e4aefee91cd5
    - text: The 'profit' column must be numeric (integral or fractional) to support
        the subtraction operation with 'cost'. We could represent this assumption
        as a deequ constraint checking the data type of the column.
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: c2c21c44-49de-4621-a230-20e8899aff04
    - text: 'The ''profit'' column must be strictly greater than ''cost'' for valid
        rows, because ''profit_after_cost'' is passed into ''math.log'', which requires
        strictly positive values (> 0) to avoid a ValueError. We could represent this
        assumption as a deequ constraint like this: .satisfies("CASE WHEN `profit`
        IS NOT NULL AND `cost` IS NOT NULL THEN CASE WHEN `profit` > `cost` THEN 1
        ELSE 0 END ELSE 1 END", "Profit greater than cost", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: 51c701c3-b547-4fa3-a0aa-921eb7602abb
