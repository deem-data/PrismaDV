    assumptions:
    - text: 'The ''profit'' column can contain missing values because the code explicitly
        removes them using dropna on subset [''profit'', ''cost'']. However, not all
        rows should be null to ensure the dataframe is not empty for downstream calculations.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty
        profit", lambda x: x > 0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 3b634937-7bb2-4ddd-b6c8-64bd7be3c7f4
    - text: 'The ''profit'' column should be of numeric type (integral or fractional)
        because it is used in an arithmetic subtraction operation with ''cost''.

        We could represent this assumption as a deequ constraint like this:

        .isDataType("profit", org.apache.spark.sql.types.NumericType)'
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: 9d7b850a-a812-4c9f-9524-e2bb929715b0
    - text: 'The values in the ''profit'' column must be strictly greater than ''cost''
        for non-null rows, because the difference (profit - cost) is passed to math.log,
        which requires strictly positive inputs (> 0).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN CASE
        WHEN `profit` > `cost` THEN 1 ELSE 0 END ELSE 1 END", "Profit greater than
        cost", lambda x: x == 1.0)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: afcd4e8c-449d-47ed-acbe-6be2fd4a3e37
