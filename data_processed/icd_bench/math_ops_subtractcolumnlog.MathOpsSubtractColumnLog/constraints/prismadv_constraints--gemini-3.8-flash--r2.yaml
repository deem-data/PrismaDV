      level: error
      uid: ced6d070-fcf1-4041-a8ff-1b4a7502093d
      source_assumptions:
      - cbbe550d-2522-494b-a903-e11fdc0c7ecf
    assumptions:
    - text: 'The ''profit'' column can contain missing (null) values because the code
        explicitly drops null values using dropna(subset=[''profit'', ''cost'']).
        However, not all values should be null to ensure the resulting dataset is
        not empty.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty
        profit", lambda x: x > 0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 8150e7cc-088f-4018-8ade-1a0ceee1529b
    - text: 'The ''profit'' column must be of a numeric data type (e.g., Integer or
        Decimal/Float) to support arithmetic subtraction with the ''cost'' column.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("profit", ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: 69740f54-c582-4672-98fa-64f2430c3621
    - text: 'The ''profit'' column must be strictly greater than the ''cost'' column
        for non-null rows, because the difference ''profit_after_cost'' is passed
        to math.log(), which requires strictly positive values (x > 0).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN CASE
        WHEN `profit` > `cost` THEN 1 ELSE 0 END ELSE 1 END", "Profit Greater Than
        Cost", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: cbbe550d-2522-494b-a903-e11fdc0c7ecf
