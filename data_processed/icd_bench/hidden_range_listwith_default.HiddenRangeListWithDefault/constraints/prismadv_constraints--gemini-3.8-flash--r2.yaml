constraints:
  status:
    code:
    - suggestion: .satisfies('`status` IS NULL OR `status` IN (-1, 0, 1, 2, 3)', 'Valid
        Status Values')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2635febe-bd9d-40b3-87e0-35237eb3b847
      source_assumptions:
      - ba499885-517b-4eac-b998-04fcfa39d57b
    - suggestion: .hasDataType('status', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9c18ad10-1ee7-4dd5-b449-c2aa142ac521
      source_assumptions:
      - d3e01227-b816-4dd4-9de2-44666ec4b17d
    assumptions:
    - text: 'The ''status'' column values (when not null) should be integers in the
        set {-1, 0, 1, 2, 3}. The code defines a skip action as -1 and uses the status
        value to index into ''action_per_status'' of length 4, which requires non-skipped
        status values to be valid indices [0, 3].

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`status` IS NULL OR `status` IN (-1, 0, 1, 2, 3)", "Valid Status
        Values", lambda x: x == 1.0)

        '
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      - start_line: 5
        end_line: 6
        file: ''
      uid: ba499885-517b-4eac-b998-04fcfa39d57b
    - text: 'The ''status'' column can contain null values because the code explicitly
        checks `not pd.isna(row[''status''])` before attempting to access or index
        with it.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` IS NULL THEN 1 ELSE 0 END", "Has Nulls Allowed",
        lambda x: x >= 0)

        '
      sources:
      - start_line: 5
        end_line: 5
        file: ''
      uid: a7ea564e-3996-458a-b0c4-9a7f808d3f49
    - text: 'The ''status'' column should have an integral data type because its values
        are used directly as indices for the ''action_per_status'' list, and list
        indexing in Python requires integers.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("status", ConstrainableDataTypes.Integral)

        '
      sources:
      - start_line: 6
        end_line: 6
        file: ''
      uid: d3e01227-b816-4dd4-9de2-44666ec4b17d
