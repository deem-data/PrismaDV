        end_line: 6
        file: ''
      uid: 8744f659-52ad-4f67-b785-dc91a357ad4a
    - text: 'When not null, the values in the ''status'' column must be either the
        skip_action value (-1) or valid 0-based indices for the 4-element list ''action_per_status''
        (i.e., integers in {-1, 0, 1, 2, 3}). Any other values would cause an IndexError
        or unexpected indexing behavior when accessing ''action_per_status[row[''status'']]''.
        We could represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `status` IS NULL OR `status` IN (-1, 0, 1, 2, 3) THEN 1 ELSE 0 END",
        "Valid Status Indices", lambda x: x == 1)'
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: 1fcdde9a-c159-466b-9a14-a5696729a1c9
    - text: 'The ''status'' column should be of integral type because its values are
        directly used as list indices in ''action_per_status[row[''status'']]''. We
        could represent this assumption as a deequ constraint like this: .hasDataType("status",
        org.apache.spark.sql.types.IntegerType)'
      sources:
