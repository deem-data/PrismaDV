    assumptions:
    - text: 'The ''status'' column can contain null values or -1 because the code
        explicitly handles missing values and skips processing when status equals
        -1. We could represent this assumption as a deequ constraint like this: .isComplete(''status'',
        lambda x: False)'
      sources:
      - start_line: 2
        end_line: 5
        file: ''
      uid: 5d2a3233-5227-4c04-b6fd-b367092e49f9
    - text: 'The ''status'' column values, when not null, must be integers within
        the allowed set {-1, 0, 1, 2, 3} because valid non-negative statuses are used
        to index into ''action_per_status'', which contains 4 elements (indices 0
        to 3), and -1 is the skip action code. We could represent this assumption
        as a deequ constraint like this: .satisfies("`status` IS NULL OR `status`
        IN (-1, 0, 1, 2, 3)", "Valid status values", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: a0471a56-9888-4ac9-a7ee-810cdd9b8ce0
