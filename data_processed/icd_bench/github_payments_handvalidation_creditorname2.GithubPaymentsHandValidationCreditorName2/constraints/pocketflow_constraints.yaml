constraints:
- .isComplete("creditor_name")
- .hasDataType("creditor_name", ConstrainableDataTypes.String())
- '.hasMinLength("creditor_name", lambda v: v >= 3)'
- '.hasMaxLength("creditor_name", lambda v: v <= 100)'
- .hasPattern("creditor_name", r"^(?=.*\\S).+$")
- .hasPattern("creditor_name", r"^(?!\\s).*(?<!\\s)$")
- .hasPattern("creditor_name", r"^[\\p{L}\\d .,&/()\\-]+$")
