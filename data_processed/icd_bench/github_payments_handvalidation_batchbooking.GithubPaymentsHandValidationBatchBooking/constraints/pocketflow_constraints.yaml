constraints:
- .isComplete('batch_booking')
- '.satisfies("length(trim(batch_booking)) > 0", ''batch_booking_not_blank'', lambda
  v: v == 1.0)'
- '.hasPattern(''batch_booking'', r''^(?i)\s*(true|false)\s*$'', ''batch_booking_boolean_token_pattern'',
  lambda v: v == 1.0)'
- '.satisfies("lower(trim(batch_booking)) in (''true'',''false'')", ''batch_booking_allowed_values_ci'',
  lambda v: v == 1.0)'
- '.satisfies(''length(trim(batch_booking)) between 4 and 5'', ''batch_booking_length_bounds'',
  lambda v: v == 1.0)'
