    assumptions:
    - text: 'The ''cost'' column should not contain null values, as subtracting a
        constant and applying math.log requires valid numeric values without nulls.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("cost")'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: e8302948-39b9-4ec4-97c1-fbbbe41ff79e
    - text: 'The ''cost'' column must have values strictly greater than 23, because
        the code computes math.log(cost - 23) which requires a strictly positive domain
        (cost - 23 > 0, i.e., cost > 23).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`cost` > 23", "cost greater than 23", lambda x: x == 1.0)'
      sources:
