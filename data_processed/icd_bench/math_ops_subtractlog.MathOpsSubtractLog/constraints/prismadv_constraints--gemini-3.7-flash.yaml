        end_line: 2
        file: ''
      uid: f4856721-1032-43e5-9043-e34ddbf3c3c1
    - text: 'The ''cost'' column should be of numeric data type (integral or fractional)
        to support arithmetic operations and math.log calculations.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("cost", ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 6ca149d4-b572-4512-9aa2-0b5d71b8d360
