    assumptions:
    - text: 'The ''cost'' column should not contain null values because it is used
        directly in arithmetic subtraction and passed into ''math.log'', which cannot
        accept null or missing values. We could represent this assumption as a deequ
        constraint like this: .isComplete("cost")'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: bdabff69-87a7-4390-a545-85ec5055f4b9
    - text: 'The ''cost'' column values must be strictly greater than 23 because the
        code subtracts 23 from ''cost'' and then applies ''math.log'' to the result.
        ''math.log'' requires a strictly positive input (> 0), so ''cost'' - 23 >
        0, which means ''cost'' > 23. We could represent this assumption as a deequ
        constraint like this: .satisfies("`cost` > 23", "Cost strictly greater than
        23", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: c9d59097-4eba-4f6e-9ef6-cfba1dc75f56
    - text: 'The ''cost'' column must have a numeric data type (integral or fractional)
        to allow subtraction and calculation of logarithms. We could represent this
        assumption as a deequ constraint like this: .hasDataType("cost", ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 9b5aa96b-2e2b-47c0-8fd4-8aacf0362e8d
