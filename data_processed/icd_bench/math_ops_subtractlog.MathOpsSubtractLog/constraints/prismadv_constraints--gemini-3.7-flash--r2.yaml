        end_line: 2
        file: ''
      uid: c0ed6c4e-67e1-4b3e-819e-f596c9bdd2fd
    - text: 'The ''cost'' column must be strictly greater than 23 because the code
        computes math.log(cost - 23), which requires the operand (cost - 23) to be
        strictly positive (> 0) to avoid a math domain error.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`cost` > 23", "Cost greater than 23", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: de9217aa-1568-4b13-b0b9-d75226ff9c57
