constraints:
  unit_price:
    code:
    - suggestion: '.satisfies("`unit_price` IS NULL OR (`unit_price` >= 0 AND `unit_price`
        = FLOOR(`unit_price`) AND NOT isnan(`unit_price`) AND `unit_price` < CAST(''Infinity''
        AS DOUBLE))", "unit_price_is_whole_nonnegative_finite_copper", lambda x: x
        == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0be301b7-015b-4ae0-9d1a-34245df8f902
      source_assumptions:
      - 31d42374-c39f-465e-8f76-7c3523ac49d9
      - 0ed78582-3f35-402d-9f43-7a4350750593
    - suggestion: '.satisfies("`unit_price` IS NULL OR `buyout` IS NULL OR `buyout`
        = 0", "unit_price_and_buyout_are_alternative_sources", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 93001cfb-2d5e-4fd3-9499-3d9210058c53
      source_assumptions:
      - eae46021-4a51-475c-8293-e9993b01bbf0
    - suggestion: '.satisfies("`unit_price` IS NOT NULL OR (`buyout` IS NOT NULL AND
        `buyout` > 0)", "buyout_present_when_unit_price_missing", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 49b8616c-41aa-4779-8d4c-5a0c6a2cd4b3
      source_assumptions:
      - 38bd4aff-4513-4db9-a29a-f3442b0b97c0
    assumptions:
    - text: The 'unit_price' column may contain null values. The code replaces nulls
        with zero before adding the two price columns, so input validation should
        allow null 'unit_price' values.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 31d42374-c39f-465e-8f76-7c3523ac49d9
    - text: Every non-null 'unit_price' should be a finite, non-negative numeric value
        representing a whole number of copper pieces. Fractional, negative, or non-finite
        values would not represent the expected price and could make the fixed-position
        currency slicing incorrect.
      sources:
      - start_line: 2
        end_line: 7
        file: ''
      uid: 0ed78582-3f35-402d-9f43-7a4350750593
    - text: For rows with a non-null 'unit_price', 'buyout' should be null or zero;
        otherwise, the code adds two prices that are intended to be alternative cost
        sources.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: eae46021-4a51-475c-8293-e9993b01bbf0
    - text: For rows where 'unit_price' is null, 'buyout' should contain a price.
        Otherwise, filling both missing prices with zero produces a zero cost for
        an item with no supplied price.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 38bd4aff-4513-4db9-a29a-f3442b0b97c0
