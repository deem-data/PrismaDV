  unit_price:
    code:
    - suggestion: .satisfies('`unit_price` IS NULL OR (`unit_price` >= 0 AND `unit_price`
        <= 1.7976931348623157E308 AND `unit_price` = FLOOR(`unit_price`))', 'unit_price_is_finite_nonnegative_whole_copper')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ce12babc-6c8c-4254-8f88-357dc15b3459
      source_assumptions:
      - 96402230-d72c-4dd6-ad9f-651b7cff1275
      - 53bb235f-102f-4dda-87bb-149b88fae72b
    - suggestion: .satisfies('`unit_price` IS NULL OR `unit_price` <= 0 OR `buyout`
        IS NULL OR `buyout` = 0', 'positive_unit_price_excludes_buyout')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e9e75025-c26f-44ce-bfa2-63a4eb6d5b48
      source_assumptions:
      - d91e55e6-dd22-4474-9993-cfa74912169b
    assumptions:
    - text: The 'unit_price' column may contain null values. The code replaces nulls
        with zero when combining it with 'buyout', so input validation should not
        require 'unit_price' to be complete.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 96402230-d72c-4dd6-ad9f-651b7cff1275
    - text: Non-null 'unit_price' values should be finite, non-negative numeric amounts
        in whole copper units. The code adds them to 'buyout' and then uses fixed
        string positions to split the resulting cost into gold, silver, and copper;
        negative, fractional-copper, or non-finite values would not fit that format.
      sources:
      - start_line: 2
        end_line: 7
        file: ''
      uid: 53bb235f-102f-4dda-87bb-149b88fae72b
    - text: For a row with a non-null, positive 'unit_price', 'buyout' should be null
        or zero. The code describes these as alternative cost sources but adds them
        together, so two positive prices would produce an incorrect cost.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: d91e55e6-dd22-4474-9993-cfa74912169b
