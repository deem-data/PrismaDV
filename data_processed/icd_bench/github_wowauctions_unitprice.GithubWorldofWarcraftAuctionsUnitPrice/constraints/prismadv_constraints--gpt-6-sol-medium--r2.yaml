    code:
    - suggestion: .satisfies("`unit_price` IS NULL OR (try_cast(`unit_price` AS DOUBLE)
        IS NOT NULL AND NOT isnan(try_cast(`unit_price` AS DOUBLE)) AND try_cast(`unit_price`
        AS DOUBLE) >= 0 AND try_cast(`unit_price` AS DOUBLE) = floor(try_cast(`unit_price`
        AS DOUBLE)))", "Valid whole-number unit price in copper")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5b943e13-8b75-4425-a5c0-fa6b70591512
      source_assumptions:
      - 58f9539e-9717-432c-b0b4-6891c4791c82
      - 7aac2c4d-9a1f-4021-9cd8-61dc739b0746
    - suggestion: .satisfies("`unit_price` IS NULL OR `buyout` IS NULL OR `buyout`
        = 0", "Alternative price sources are not both populated")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 40e9231c-dfbb-4233-b014-716cc666fedc
      source_assumptions:
      - 58f9539e-9717-432c-b0b4-6891c4791c82
      - 6b9d4a5e-5187-470a-936e-eb513330f4c6
    assumptions:
    - text: The 'unit_price' column may contain null values; the code treats them
        as zero when calculating cost. Input validation should allow nulls rather
        than require complete data.
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: 58f9539e-9717-432c-b0b4-6891c4791c82
    - text: Non-null 'unit_price' values should be numeric, nonnegative, whole-number
        amounts in copper units. The code adds them to 'buyout' and then splits the
        resulting cost into currency denominations using string slices.
      sources:
      - start_line: 2
        end_line: 7
        file: ''
      uid: 7aac2c4d-9a1f-4021-9cd8-61dc739b0746
    - text: For a row with a non-null 'unit_price', 'buyout' should be null or zero.
        The code describes these as alternative price sources but adds them together,
        so two populated prices would be double-counted.
      sources:
      - start_line: 1
        end_line: 2
        file: ''
      uid: 6b9d4a5e-5187-470a-936e-eb513330f4c6
