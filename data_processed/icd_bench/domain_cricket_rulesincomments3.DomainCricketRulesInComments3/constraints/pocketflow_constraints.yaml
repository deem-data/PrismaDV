constraints:
- .isComplete('result_margin')
- .hasType('result_margin', ConstrainableDataTypes.Integral)
- .isNonNegative('result_margin')
- '.satisfies(''result <> "wickets" OR result_margin <= 10'', ''wickets_margin_at_most_10'',
  lambda d: d == 1.0)'
- '.satisfies(''result_margin <= target_runs'', ''margin_at_most_target_runs'', lambda
  d: d == 1.0)'
