constraints:
- .isComplete('umpire1')
- .hasDataType('umpire1', ConstrainableDataTypes.String)
- .satisfies("length(trim(umpire1)) > 0", "umpire1_not_blank")
- .satisfies("length(trim(umpire1)) = length(umpire1)", "umpire1_no_leading_trailing_spaces")
- .satisfies("umpire1 RLIKE '^[A-Za-z .-]+$'", "umpire1_valid_chars")
- .satisfies("NOT (umpire1 RLIKE '.*[0-9].*')", "umpire1_no_digits")
- .satisfies("regexp_replace(umpire1, '  +', ' ') = umpire1", "umpire1_no_multiple_spaces")
