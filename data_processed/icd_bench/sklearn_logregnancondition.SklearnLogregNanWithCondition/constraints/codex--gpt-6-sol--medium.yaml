  model = LogisticRegression().fit(X, y)\ndeploy_model(model)\n```\n\nThe same code\
  \ is on disk at `./code/snippet.py`, so you can search it or run parts\nof it against\
  \ the staged table rather than working from the listing alone.\n\n# The data\n\n\
