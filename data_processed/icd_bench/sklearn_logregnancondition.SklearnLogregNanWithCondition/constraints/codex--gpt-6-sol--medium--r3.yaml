  \ program.\n\n```python\nimport math\nimport numpy as np\nfrom sklearn.preprocessing\
  \ import OneHotEncoder\nfrom sklearn.linear_model import LogisticRegression\ndf\
  \ = df[df['location'] == 'A']\nlocations = OneHotEncoder(sparse_output=False).fit_transform(df['location'])\n\
  X = np.column_stack((locations, df['cost'].values.reshape(-1, 1)))\ny = df['status']=='COMPLETED'\n\
  model = LogisticRegression().fit(X, y)\ndeploy_model(model)\n```\n\nThe same code\
  \ is on disk at `./code/snippet.py`, so you can search it or run parts\nof it against\
  \ the staged table rather than working from the listing alone.\n\n# The data\n\n\
