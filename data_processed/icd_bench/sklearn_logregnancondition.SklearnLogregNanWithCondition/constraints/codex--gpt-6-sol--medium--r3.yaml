  \   status\n          1     1        A   COMPLETED\n          2    10        B IN_PROGRESS\n\
  \          3    10        A   COMPLETED\n          4   100        C   CANCELLED\n\
  \nThe full sample is on disk at `./data/tables/observed_data.csv`. You have complete\
  \ access to it:\nload it with pandas, profile it, run whatever analysis helps. It\
  \ is a throwaway\ncopy -- nothing you do to it has any effect outside this workspace.\n\
  \n# Verifying your constraints\n\nYou can execute PyDeequ constraint code against\
  \ the staged table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ in this format:\n\n{\n    \"constraints\": [\n        {\n            \"column_name\"\
  : \"some_column\",\n            \"code_for_constraint\": \".isComplete('some_column')\"\
  \n        },\n        {\n            \"column_name\": \"some_column\",\n       \
  \     \"code_for_constraint\": \".isPositive('some_column')\"\n        }\n    ]\n\
  }\n\nReturn constraints for the `cost` column only.\n\nUse only the PyDeequ `Check`\
  \ object's methods in `code_for_constraint`. Each\nentry names the single column\
