constraints:
- .isComplete(''result'')
- .hasDataType(''result'', ConstrainableDataTypes.String)
- .isContainedIn(''result'', [''runs'', ''wickets''])
- '.satisfies("CASE WHEN toss_decision = ''''bat'''' AND winner = toss_winner THEN
  result = ''''runs'''' ELSE true END", "bat_toss_winner_means_runs", lambda v: v
  == 1.0)'
- '.satisfies("CASE WHEN toss_decision = ''''field'''' AND winner != toss_winner THEN
  result = ''''runs'''' ELSE true END", "field_toss_loser_means_runs", lambda v: v
  == 1.0)'
- '.satisfies("CASE WHEN toss_decision = ''''field'''' AND winner = toss_winner THEN
  result = ''''wickets'''' ELSE true END", "field_toss_winner_means_wickets", lambda
  v: v == 1.0)'
- '.satisfies("CASE WHEN toss_decision = ''''bat'''' AND winner != toss_winner THEN
  result = ''''wickets'''' ELSE true END", "bat_toss_loser_means_wickets", lambda
  v: v == 1.0)'
