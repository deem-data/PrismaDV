        file: ''
      uid: 5fd9ca5f-57c9-49a4-9b0e-51364b2c5a82
    - text: 'The ''result'' column must be ''wickets'' when the team fielding first
        wins (i.e., when toss_decision is ''field'' and winner equals toss_winner,
        or when toss_decision is ''bat'' and winner does not equal toss_winner). We
        could represent this assumption as a deequ constraint like this: .satisfies("CASE
