        The code sends an email for each completed booking without filling or excluding
        missing email values; the dataset contains a null email, so this condition
        should be checked specifically for completed bookings.
      sources:
      - start_line: 1
        end_line: 4
        file: ''
      uid: c4c32707-ec13-48df-9a2d-9cd4bd868f74
    - text: For every input row where 'status' is 'COMPLETED', 'email' should be a
        valid email address string, so it can be used as the recipient by send_email.
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: 6d95280f-51e1-4890-ba87-ff695b33a896
