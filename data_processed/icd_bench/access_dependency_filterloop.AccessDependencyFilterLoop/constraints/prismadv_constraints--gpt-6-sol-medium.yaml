    - suggestion: '.satisfies("CASE WHEN `status` = ''COMPLETED'' THEN typeof(`email`)
        = ''string'' AND `email` RLIKE ''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}$''
        ELSE TRUE END", "completed_booking_email_valid", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7962f3c2-5828-49fb-bd3e-ab9286385b7a
      source_assumptions:
      - e1b7e260-56e2-4c4a-8cda-5189d4b03142
    assumptions:
    - text: For every input row where 'status' is 'COMPLETED', 'email' should be non-null
        and non-blank. The code drops rows with missing status but does not handle
        missing email addresses before attempting to send a message. Missing emails
        in other status categories are acceptable.
      sources:
      - start_line: 1
        end_line: 4
        file: ''
      uid: 83db2e37-b708-4666-a9d4-e38a008f5776
    - text: For every input row where 'status' is 'COMPLETED', 'email' should be a
        string in a valid email-address format, so it can be used as the recipient
        address.
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: e1b7e260-56e2-4c4a-8cda-5189d4b03142
