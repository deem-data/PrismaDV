  email:
    code:
    - suggestion: .satisfies("`status` IS NULL OR `status` <> 'COMPLETED' OR `email`
        IS NOT NULL", "completed_booking_has_email")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: aeb69cb3-4014-4fa3-9c8c-a6e03ec8dc30
      source_assumptions:
      - 809ddb9d-2ef2-46a2-aaed-6e4c1a70d303
      - 4b182a6c-f6ce-45f9-8c60-6f2e1dd84f63
    - suggestion: .satisfies("`status` IS NULL OR `status` <> 'COMPLETED' OR (`email`
        IS NOT NULL AND trim(`email`) <> '' AND `email` RLIKE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}$')",
        "completed_booking_has_valid_email")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dead14ab-c343-4de8-9986-d9f3c4628722
      source_assumptions:
      - a31ac76e-b984-43a2-ad71-0dc8f5a49025
    assumptions:
    - text: The input data should contain an 'email' column, because the code reads
        it to send notifications for completed bookings.
      sources:
      - start_line: 3
        end_line: 4
        file: ''
      uid: 809ddb9d-2ef2-46a2-aaed-6e4c1a70d303
    - text: For every input row where 'status' is 'COMPLETED', 'email' should be non-null.
        Null emails in other rows are acceptable because those rows are not used to
        send notifications.
      sources:
      - start_line: 1
        end_line: 4
        file: ''
      uid: 4b182a6c-f6ce-45f9-8c60-6f2e1dd84f63
    - text: For every input row where 'status' is 'COMPLETED', 'email' should be a
        non-empty, valid email address so it can be used as a notification recipient.
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: a31ac76e-b984-43a2-ad71-0dc8f5a49025
