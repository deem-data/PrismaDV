      uid: 9c2261f0-fa1f-4d6a-ac88-4b60242ca5f4
      source_assumptions:
      - 44ea6e06-e22d-4e92-99c0-070f72687409
    assumptions:
    - text: 'The ''email'' column should not be null for rows where ''status'' is
        ''COMPLETED'', as the code directly passes ''email'' to ''send_email'' for
        every completed booking without checking for null values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' THEN `email` IS NOT NULL ELSE
        TRUE END", "Email Not Null For Completed Bookings", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: 58f52e1d-eb3f-4418-80a8-9318424ad4c9
    - text: 'The ''email'' column should contain valid email address formats when
        present, as the values are passed directly to the ''send_email'' function.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("email", r"^[^@\s]+@[^@\s]+\.[^@\s]+$", lambda x: x >= 0.75)'
      sources:
      - start_line: 4
        end_line: 4
        file: ''
      uid: 44ea6e06-e22d-4e92-99c0-070f72687409
