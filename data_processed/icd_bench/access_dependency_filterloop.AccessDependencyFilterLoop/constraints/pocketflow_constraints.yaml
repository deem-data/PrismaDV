constraints:
- .hasDataType('email', ConstrainableDataTypes.String)
- '.hasCompleteness(''email'', lambda v: v == 1.0, where="status = ''COMPLETED''")'
- '.hasPattern(''email'', r''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'',
  lambda v: v == 1.0, where="status = ''COMPLETED''")'
- '.satisfies("length(trim(email)) > 0", ''nonempty email when completed'', lambda
  v: v == 1.0, where="status = ''COMPLETED''")'
- '.satisfies("email = trim(email)", ''no leading or trailing spaces when completed'',
  lambda v: v == 1.0, where="status = ''COMPLETED''")'
