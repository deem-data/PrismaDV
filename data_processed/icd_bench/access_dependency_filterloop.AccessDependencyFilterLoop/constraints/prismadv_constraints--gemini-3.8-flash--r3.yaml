    assumptions:
    - text: 'The ''email'' column should not be null for rows where ''status'' is
        ''COMPLETED'', because the code iterates over completed bookings and passes
        ''email'' to `send_email` without checking for or handling missing values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' THEN (`email` IS NOT NULL)
        ELSE 1 END", "Email Not Null for Completed Bookings", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: 0a72fecd-dd4d-4803-8caa-5e884457e5c7
    - text: 'The ''email'' column should contain valid email addresses matching an
        email pattern, because the code passes ''email'' directly to `send_email`,
        which assumes valid recipient addresses.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("email", "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$",
