constraints:
  email:
    code:
    - suggestion: '.satisfies("CASE WHEN `status` = ''COMPLETED'' AND `email` IS NULL
        THEN 0 ELSE 1 END", "Email Not Null For Completed Bookings", lambda x: x ==
        1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2c2083a4-bfc1-49a1-b62c-d564d93d19e0
      source_assumptions:
      - 25d2dce3-0d6c-480b-949e-f65175049bc8
    - suggestion: '.satisfies("CASE WHEN `status` = ''COMPLETED'' THEN (CASE WHEN
        `email` LIKE ''%@%.%'' THEN 1 ELSE 0 END) ELSE 1 END", "Valid Email Format
        For Completed Bookings", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5c8a11ab-ae19-4aa1-a398-8aea3542e174
      source_assumptions:
      - 4cd587e7-fe98-4b44-9f27-3b2e43176414
    assumptions:
    - text: 'The ''email'' column should not contain null values when ''status'' is
        ''COMPLETED'', because the code iterates over all completed bookings and passes
        `row[''email'']` to the `send_email` function without checking for or handling
        missing values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' AND `email` IS NULL THEN 0
        ELSE 1 END", "Email Not Null For Completed Bookings", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: 25d2dce3-0d6c-480b-949e-f65175049bc8
    - text: 'The ''email'' column should contain valid email address strings (e.g.,
        containing ''@'') for completed bookings, as they are directly passed as recipient
        addresses to the `send_email` function.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' THEN (CASE WHEN `email` LIKE
        ''%@%.%'' THEN 1 ELSE 0 END) ELSE 1 END", "Valid Email Format For Completed
        Bookings", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 4
        file: ''
      uid: 4cd587e7-fe98-4b44-9f27-3b2e43176414
