constraints:
- .isComplete('email', where="status = 'COMPLETED'")
- '.hasPattern(''email'', r''[^\s@]+@[^\s@]+\.[^\s@]+'', lambda v: v == 1.0, where="status
  = ''COMPLETED''")'
- .hasDataType('email', ConstrainableDataTypes.String)
- .satisfies("length(trim(email)) = length(email)", 'no_leading_trailing_spaces',
  where="status = 'COMPLETED'")
- '.hasMinLength(''email'', 6, lambda v: v >= 6, where="status = ''COMPLETED''")'
- '.hasUniqueness([''email''], lambda v: v == 1.0, where="status = ''COMPLETED''")'
