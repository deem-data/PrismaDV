      uid: 5c597faf-f7c7-4e3d-9965-faf14ee05786
      source_assumptions:
      - 48efe3ec-c8de-4734-93a3-9650c7bad3cb
    assumptions:
    - text: 'The ''email'' column should not be null when ''status'' is ''COMPLETED'',
        because the code calls ''send_email'' with ''row[''email'']'' for completed
        bookings without verifying if the email is missing. We could represent this
        assumption as a deequ constraint like this: .satisfies("CASE WHEN `status`
        = ''COMPLETED'' AND `email` IS NULL THEN 0 ELSE 1 END", "Email is not null
        for completed bookings", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: 6d4a735c-90a3-4a11-a032-99ab24e2e63d
    - text: 'The ''email'' column should be of string type and follow a valid email
        format for completed bookings so that ''send_email'' can execute successfully.
        We could represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `status` = ''COMPLETED'' THEN (`email` LIKE ''%@%.%'') ELSE 1 END", "Valid
        email format for completed bookings", lambda x: x == 1)'
      sources:
