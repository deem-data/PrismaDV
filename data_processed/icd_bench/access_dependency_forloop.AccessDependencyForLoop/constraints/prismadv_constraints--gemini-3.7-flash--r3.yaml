        the status is ''COMPLETED'' without checking if the email is null. We could
        represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `status` = ''COMPLETED'' AND `email` IS NULL THEN 0 ELSE 1 END", "Non-null
        email for COMPLETED status", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: 79fdcdf2-8ed4-4880-a847-56c0ef6be2ce
    - text: 'The ''email'' column should be of string type, as its values are passed
        to `send_email` as the recipient address. We could represent this assumption
        as a deequ constraint like this: .hasDataType("email", ConstrainableDataTypes.String)'
      sources:
      - start_line: 3
        end_line: 3
        file: ''
      uid: 38613317-a113-4be4-91a1-cb282678eea8
