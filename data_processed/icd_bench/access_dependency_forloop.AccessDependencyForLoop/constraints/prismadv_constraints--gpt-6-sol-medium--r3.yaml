      - start_line: 2
        end_line: 3
        file: ''
      uid: dfafd0b8-3b49-4a2e-b558-403c69502204
    - text: For every row whose 'status' is 'COMPLETED', 'email' should be a non-empty
        string in a valid email-address format so it can be passed to send_email.
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: 0b83d5b4-bc4e-4c70-8651-4a542a719989
