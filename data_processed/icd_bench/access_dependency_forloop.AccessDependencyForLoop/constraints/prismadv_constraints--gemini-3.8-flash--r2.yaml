    assumptions:
    - text: 'The ''email'' column should not be null when the ''status'' column is
        ''COMPLETED'', because the code invokes ''send_email'' with ''row[''email'']''
        without checking for null values once status is verified as completed. We
        could represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `status` = ''COMPLETED'' THEN `email` IS NOT NULL ELSE TRUE END", "Email
        not null for completed status", lambda x: x == 1)'
      sources:
      - start_line: 2
        end_line: 3
        file: ''
      uid: aca25db8-65d8-4af5-893b-3f2ad46cf835
    - text: 'The ''email'' column values should follow a valid email format when present,
        as they are passed directly to ''send_email''. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `email` IS NOT NULL
        THEN `email` REGEXP ''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$''
        ELSE TRUE END", "Valid Email Format", lambda x: x == 1)'
      sources:
      - start_line: 3
        end_line: 3
        file: ''
      uid: 928d705e-c582-423c-8d11-a476e9603917
