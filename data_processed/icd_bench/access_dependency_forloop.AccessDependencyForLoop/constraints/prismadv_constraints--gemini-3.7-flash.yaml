        could represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `status` = ''COMPLETED'' THEN CASE WHEN `email` IS NOT NULL THEN 1 ELSE
        0 END ELSE 1 END", "Email Not Null for Completed Bookings", lambda x: x ==
        1)'
