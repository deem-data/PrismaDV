        \\n{held}/{len(codes)} constraint(s) hold on table '{args.table}' \"\n   \
        \       f\"({len(dataframe)} rows).\")\n\n    try:\n        spark.sparkContext._gateway.shutdown_callback_server()\n\
        \    except Exception:\n        pass\n    try:\n        spark.stop()\n   \
        \ except Exception:\n        pass\n    return 0\n\n\nif __name__ == \"__main__\"\
        :\n    code = main()\n    sys.stdout.flush()\n    os._exit(code)\n"
