        \ to do with the constraint. The jars were resolved once by the driver\n \
        \   that staged this file; naming them directly removes the resolution step,\
        \ and\n    with it the network and $HOME-write dependencies.\n    \"\"\"\n\
        \    from pyspark.sql import SparkSession\n\n    jars = [line.strip() for\
        \ line in JARS_FILE.read_text(encoding=\"utf-8\").split() if line.strip()]\n\
        \    if not jars:\n        raise RuntimeError(f\"{JARS_FILE.name} is empty;\
        \ the Deequ classpath cannot be pinned\")\n    # `spark.jars` takes URIs;\
        \ the driver classpath takes plain filesystem paths.\n    local = [jar[len(\"\
        file://\"):] if jar.startswith(\"file://\") else jar for jar in jars]\n  \
        \  return (\n        SparkSession.builder.appName(\"deequ-local\")\n     \
        \   .master(\"local[2]\")\n        .config(\"spark.driver.memory\", \"4g\"\
        )\n        .config(\"spark.jars\", \",\".join(jars))\n        .config(\"spark.driver.extraClassPath\"\
        , \":\".join(local))\n        .config(\"spark.executor.extraClassPath\", \"\
        :\".join(local))\n        .config(\"spark.driver.host\", \"localhost\")\n\
        \        .config(\"spark.ui.enabled\", \"false\")\n        .config(\"spark.sql.execution.arrow.pyspark.enabled\"\
        , \"true\")\n        .getOrCreate()\n    )\n\n\ndef load_codes(path: Path)\
        \ -> list[str]:\n    \"\"\"Accept JSON, or one constraint per line so quoting\
        \ never blocks a check.\"\"\"\n    text = path.read_text(encoding=\"utf-8\"\
        ).strip()\n    if not text:\n        return []\n    if text.lstrip()[0] in\
        \ \"[{\":\n        try:\n            payload = json.loads(text)\n        except\
