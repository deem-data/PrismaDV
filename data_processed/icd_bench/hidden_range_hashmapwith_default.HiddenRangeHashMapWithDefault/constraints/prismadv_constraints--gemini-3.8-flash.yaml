    assumptions:
    - text: 'The ''status'' column can contain null values, as the code explicitly
        checks `if not pd.isna(row[''status''])` before processing.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` IS NULL THEN 1 ELSE 0 END", "Status Can Be
        Null", lambda x: x >= 0.0)'
      sources:
      - start_line: 11
        end_line: 11
        file: ''
      uid: 38312039-5eba-46a8-bc72-17408ead3833
    - text: 'The ''status'' column values should belong to the predefined set of expected
        statuses (''COMPLETED'', ''CANCELLED'', ''IN_PROGRESS'', ''UNDER_REVIEW'',
        ''NO_ACTION''), as the code uses `status` to look up actions in the `action_per_status`
        dictionary or ignores the row if the status is ''NO_ACTION''.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` IS NULL OR `status` IN (''COMPLETED'', ''CANCELLED'',
        ''IN_PROGRESS'', ''UNDER_REVIEW'', ''NO_ACTION'') THEN 1 ELSE 0 END", "Valid
        Status Values", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 12
        file: ''
      uid: 943483d4-5235-4864-81d5-fbcd10b3af9b
