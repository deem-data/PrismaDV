constraints:
- .hasDataType('status', ConstrainableDataTypes.String())
- .satisfies("status IS NULL OR status IN ('COMPLETED','CANCELLED','IN_PROGRESS','UNDER_REVIEW','NO_ACTION')",
  'status_allowed')
- .hasPattern('status', '^[A-Z_]+$')
- .satisfies("status IS NULL OR TRIM(status) = status", 'status_trimmed')
- .satisfies("status IS NULL OR status <> ''", 'status_not_empty')
constraints_by_name:
  has_data_type: .hasDataType('status', ConstrainableDataTypes.String())
  allowed_values: .satisfies("status IS NULL OR status IN ('COMPLETED','CANCELLED','IN_PROGRESS','UNDER_REVIEW','NO_ACTION')",
    'status_allowed')
  uppercase_pattern: .hasPattern('status', '^[A-Z_]+$')
  trimmed: .satisfies("status IS NULL OR TRIM(status) = status", 'status_trimmed')
  not_empty: .satisfies("status IS NULL OR status <> ''", 'status_not_empty')
