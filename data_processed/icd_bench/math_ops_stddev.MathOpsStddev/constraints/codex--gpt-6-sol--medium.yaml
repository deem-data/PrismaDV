  \ $HOME), and no absolute path\n  anywhere else on the filesystem.\n- Do not search\
  \ the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python` over `/`,\
  \ `/tmp`, `..`, `~` or any path outside this folder -- for\n  related data, prompts,\
  \ examples, other runs, or previous answers. There is\n  nothing out there you are\
  \ allowed to use, and a run that looks is discarded.\n- Running `python`, `deequ_check.py`\
  \ and the tools on your PATH is fine; the\n  boundary is about what you read and\
  \ write, not which interpreter runs.\n\nEverything you need is here. Work only from\
  \ it.\n"
