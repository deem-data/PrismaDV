constraints:
- .isComplete('behaviour')
- .hasDataType('behaviour', ConstrainableDataTypes.String)
- .isContainedIn('behaviour', ['killer','socializer','achiever','explorer'])
- .hasPattern('behaviour', r'^(killer|socializer|achiever|explorer)$')
- '.hasMinLength(''behaviour'', lambda v: v >= 6)'
- '.hasMaxLength(''behaviour'', lambda v: v <= 10)'
- '.hasApproxCountDistinct(''behaviour'', lambda v: v <= 4)'
