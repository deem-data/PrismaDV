    assumptions:
    - text: 'The ''behaviour'' column is expected to contain categorical values representing
        Bartle player types, specifically ''killer'', ''socializer'', ''achiever'',
        and ''explorer''.

        We could represent this assumption as a deequ constraint like this:

        .isContainedIn(''behaviour'', [''killer'', ''socializer'', ''achiever'', ''explorer'',
        ''''])

        '
      sources:
      - start_line: 3
        end_line: 7
        file: ''
      uid: 3f280572-abcf-48b9-a550-fafbea696cd2
    - text: 'The ''behaviour'' column must contain at least one non-zero occurrence
        across the target categories (''killer'', ''socializer'', ''achiever'', ''explorer'')
        so that the sizes passed to the pie chart sum to a positive number and can
        be plotted.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `behaviour` IN (''killer'', ''socializer'', ''achiever'',
        ''explorer'') THEN 1 ELSE 0 END", "Non-empty categories for pie chart", lambda
        x: x > 0)

        '
