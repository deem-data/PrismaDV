constraints:
- .isComplete('batch_booking')
- .satisfies("length(trim(batch_booking)) > 0", 'batch_booking_not_empty')
- .satisfies("lower(trim(batch_booking)) IN ('true','false')", 'batch_booking_boolean_values')
- .hasPattern('batch_booking', '(?i)^(true|false)$')
- '.hasNumberOfDistinctValues(''batch_booking'', lambda v: v <= 2)'
- .isContainedIn('batch_booking', ['true','false','True','False'])
