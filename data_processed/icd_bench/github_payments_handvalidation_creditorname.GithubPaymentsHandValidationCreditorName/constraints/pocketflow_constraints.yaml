constraints:
- .isComplete('creditor_name')
- .hasDataType('creditor_name', ConstrainableDataTypes.String)
- '.hasMinLength(''creditor_name'', lambda v: v >= 2)'
- '.hasMaxLength(''creditor_name'', lambda v: v <= 120)'
- '.hasPattern(''creditor_name'', r"^[A-Za-z0-9][A-Za-z0-9 .&()''/-]*$", lambda v:
  v == 1.0)'
- '.satisfies("NOT(creditor_name rlike ''^[0-9]+$'')", lambda v: v == 1.0, "creditor_name
  not purely numeric")'
