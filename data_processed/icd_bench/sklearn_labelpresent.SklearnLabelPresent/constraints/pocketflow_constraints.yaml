constraints:
- .isComplete('status')
- .isContainedIn('status', ['COMPLETED', 'IN_PROGRESS', 'CANCELLED'])
- '.hasPattern(''status'', r''^[A-Z_]+$'', lambda v: v == 1.0)'
- '.hasNumberOfDistinctValues(''status'', lambda n: n >= 2)'
- '.hasMinLength(''status'', lambda v: v >= 2)'
- '.hasMaxLength(''status'', lambda v: v <= 20)'
