constraints:
- .isComplete('result_margin')
- .hasDataType('result_margin', ConstrainableDataTypes.Integral)
- .isNonNegative('result_margin')
- .satisfies("(result <> 'wickets') OR (result_margin <= 10)", 'wickets_margin_at_most_10')
- .satisfies('result_margin <= target_runs', 'margin_not_exceed_target_runs')
