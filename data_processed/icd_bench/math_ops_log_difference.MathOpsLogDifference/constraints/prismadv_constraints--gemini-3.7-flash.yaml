    assumptions:
    - text: 'The ''cost'' column should not contain null values because it is used
        directly in subtraction and transformed with ''math.log'' without prior missing
        value handling.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("cost")

        '
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: bcf43db6-bde0-42f8-843c-9d48e7cd70f6
    - text: 'The ''cost'' column must have a numeric data type (Integral or Fractional)
        to support arithmetic operations and logarithmic transformation.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("cost", ConstrainableDataTypes.Numeric, lambda x: x == 1.0)

        '
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 946fdfb2-a0cf-4fa6-9475-0b4e8e61fe9a
    - text: 'The ''cost'' column values must be strictly greater than the ''reduction''
        column values (`cost > reduction`) because `math.log` requires strictly positive
        inputs (> 0) and will raise a ValueError for non-positive values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`cost` > `reduction`", "Cost Strictly Greater Than Reduction",
        lambda x: x == 1.0)

        '
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 90ae4ffd-ca57-4f2d-b685-0a3eb9410ec5
