        end_line: 1
        file: ''
      uid: 70fe9333-26d4-4e39-ac1e-b28b98977cba
    - text: 'The values in the ''cost'' column must be strictly greater than the values
        in the ''reduction'' column (i.e., `cost > reduction`) so that `cost - reduction`
        is positive, preventing a math domain error when applying `math.log`. We could
        represent this assumption as a deequ constraint like this: .satisfies("`cost`
        > `reduction`", "Cost greater than reduction", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: b04c2f75-7f0a-4e4c-95f6-42cfc27e8353
