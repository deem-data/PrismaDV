    assumptions:
    - text: 'The ''cost'' column must not contain null values because it is used directly
        in arithmetic subtraction and passed to math.log via apply without handling
        nulls.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("cost")'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 81805b64-6567-4b80-b225-1486c745a638
    - text: 'The values in the ''cost'' column must be strictly greater than the corresponding
        values in the ''reduction'' column (cost > reduction), because math.log requires
        a strictly positive input (> 0) and will raise a ValueError if the argument
        is less than or equal to zero.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`cost` > `reduction`", "Cost Strictly Greater Than Reduction",
        lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 75a460be-7109-4c46-bbb5-2c7792a09129
