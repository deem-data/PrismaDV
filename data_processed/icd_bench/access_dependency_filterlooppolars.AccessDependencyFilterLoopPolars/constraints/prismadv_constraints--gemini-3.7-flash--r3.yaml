        failed on data sample: Value: 0.75 does not meet the constraint requirement!'
      level: warning
      uid: a68ac1b8-fccb-42ac-908e-b2c12ebdf515
      source_assumptions:
      - 71b66872-169d-4ad8-842b-1493e52c0cb5
    assumptions:
    - text: 'The ''email'' column must not contain null values for rows where ''status''
        is ''COMPLETED'', because ''send_email'' is called on each completed booking''s
        email without checking for missing values. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `status` = ''COMPLETED''
        AND `email` IS NULL THEN 0 ELSE 1 END", "Completed Bookings Email Not Null",
        lambda x: x == 1.0)'
      sources:
      - start_line: 2
        end_line: 5
        file: ''
      uid: 55076b6b-1681-4fac-89ba-a41630c9f813
    - text: 'The ''email'' column should be of string type and contain valid email
        addresses since it is passed as the recipient address to the ''send_email''
        function. We could represent this assumption as a deequ constraint like this:
        .hasDataType("email", ConstrainableDataTypes.String)'
      sources:
      - start_line: 4
        end_line: 5
        file: ''
      uid: 71b66872-169d-4ad8-842b-1493e52c0cb5
