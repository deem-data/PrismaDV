    assumptions:
    - text: 'The ''email'' column should not be null for records where ''status''
        is ''COMPLETED'', because the code filters for completed bookings and calls
        ''send_email'' using ''email'' without any null checks or fallback values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' THEN `email` IS NOT NULL ELSE
        TRUE END", "Email Not Null for Completed Bookings", lambda x: x == 1)'
      sources:
      - start_line: 3
        end_line: 5
        file: ''
      uid: daf483e5-45da-4e33-9bd1-edf46a904b91
    - text: 'The ''email'' column should be of type String and follow a valid email
        format for completed bookings, as values from this column are directly passed
        to the ''send_email'' function.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `status` = ''COMPLETED'' THEN `email` LIKE ''%@%.%''
        ELSE TRUE END", "Valid Email Format for Completed Bookings", lambda x: x ==
        1)'
      sources:
      - start_line: 3
        end_line: 5
        file: ''
      uid: 315c5433-6ad3-4250-9acd-c02fe6ca2e46
