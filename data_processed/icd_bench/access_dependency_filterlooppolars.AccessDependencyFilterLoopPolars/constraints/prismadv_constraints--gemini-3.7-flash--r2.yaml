        addresses when ''status'' is ''COMPLETED'', as they are passed directly into
        the send_email function. We could represent this assumption as a deequ constraint
        or regex check like this: .satisfies("CASE WHEN `status` = ''COMPLETED'' AND
        `email` IS NOT NULL THEN (CASE WHEN `email` LIKE ''%@%.%'' THEN 1 ELSE 0 END)
