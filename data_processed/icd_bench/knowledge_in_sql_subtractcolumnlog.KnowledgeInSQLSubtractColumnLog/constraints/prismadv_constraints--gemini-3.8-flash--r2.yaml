constraints:
  profit:
    code:
    - suggestion: '.satisfies(''CASE WHEN `profit` IS NOT NULL THEN 1 ELSE 0 END'',
        ''Profit Column Nullability'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 620a5b0b-2272-4175-9805-74fb648c2533
      source_assumptions:
      - b5f5836c-ed4a-498e-b751-b64bc2c2db59
    - suggestion: .hasDataType('profit', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9ff8f354-38ad-4d7e-8a14-a8cc54c5d5ea
      source_assumptions:
      - 2d9e5366-9469-4e56-a30d-26717b410b12
    - suggestion: '.satisfies(''CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL
        THEN CASE WHEN `profit` > `cost` THEN 1 ELSE 0 END ELSE 1 END'', ''Profit
        Greater Than Cost'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8f12d68b-0b3a-48e6-aa4d-c37695fce0fa
      source_assumptions:
      - a9a32bee-731c-45a8-98a0-c7c043bc30c0
    assumptions:
    - text: 'The ''profit'' column can contain null values, as the code explicitly
        filters rows using `WHERE profit IS NOT NULL OR cost is NOT NULL`. However,
        the column should not be entirely null. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `profit` IS NOT NULL
        THEN 1 ELSE 0 END", "Profit Column Nullability", lambda x: x > 0)'
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: b5f5836c-ed4a-498e-b751-b64bc2c2db59
    - text: The 'profit' column should be of numeric data type (integral or fractional)
        to support the arithmetic subtraction operation `profit - cost`.
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: 2d9e5366-9469-4e56-a30d-26717b410b12
    - text: 'The ''profit'' column should be strictly greater than ''cost'' when both
        values are present, because `math.log` is applied to `profit_after_cost` (`profit
        - cost`), which requires inputs to be strictly positive (> 0) to avoid a math
        domain error. We could represent this assumption as a deequ constraint like
        this: .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN
        CASE WHEN `profit` > `cost` THEN 1 ELSE 0 END ELSE 1 END", "Profit Greater
        Than Cost", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: a9a32bee-731c-45a8-98a0-c7c043bc30c0
