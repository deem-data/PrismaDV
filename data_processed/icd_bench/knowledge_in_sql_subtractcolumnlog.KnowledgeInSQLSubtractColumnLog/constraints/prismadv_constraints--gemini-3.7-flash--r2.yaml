      - b16fba99-3b70-4c38-96ef-0c1a72a6c5a0
    - suggestion: '.satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL
        THEN `profit` > `cost` ELSE TRUE END", "Profit Greater Than Cost", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b53b9ce5-2a7b-4fd4-8e6d-b7188d5ffc72
      source_assumptions:
      - aaaabc20-203e-41e4-8dda-24408653c488
    - suggestion: '.satisfies("CASE WHEN `cost` IS NOT NULL THEN `profit` IS NOT NULL
        ELSE TRUE END", "Profit Not Null When Cost Present", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 403aaf78-e50c-4fd0-867b-3211b880c142
      source_assumptions:
      - 40fd58bb-54c2-4a68-ac0e-7ac014110d82
    assumptions:
    - text: The 'profit' column must be of a numeric data type (Integer or Float)
        because it is involved in arithmetic subtraction ('profit - cost') and logarithmic
        transformation.
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: b16fba99-3b70-4c38-96ef-0c1a72a6c5a0
    - text: 'The value of ''profit'' must be greater than ''cost'' (i.e., ''profit
        - cost > 0'') when both are present, because ''math.log'' requires strictly
        positive arguments and will raise a ValueError if ''profit_after_cost'' is
        less than or equal to 0. We could represent this assumption as a deequ constraint:
        .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN `profit`
        > `cost` ELSE TRUE END", "Profit Greater Than Cost", lambda x: x == 1.0)'
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: aaaabc20-203e-41e4-8dda-24408653c488
    - text: 'The ''profit'' column should not be NULL when selected for processing,
        because ''profit - cost'' resulting in a NULL value would lead to a TypeError
        when passed to ''math.log''. We could represent this assumption as a deequ
        constraint: .satisfies("CASE WHEN `cost` IS NOT NULL THEN `profit` IS NOT
        NULL ELSE TRUE END", "Profit Not Null When Cost Present", lambda x: x == 1.0)'
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: 40fd58bb-54c2-4a68-ac0e-7ac014110d82
