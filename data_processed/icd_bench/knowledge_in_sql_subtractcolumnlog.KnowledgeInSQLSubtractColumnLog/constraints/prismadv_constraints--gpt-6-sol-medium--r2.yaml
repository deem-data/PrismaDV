      source_assumptions:
      - 1c9f631e-7ff9-4531-bc44-e130c0392d50
    assumptions:
    - text: The input `profit` column should contain no null values. The WHERE clause
        retains a row when `cost` is non-null even if `profit` is null; that would
        produce a null `profit_after_cost` and cause `math.log` to fail.
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: f7435b16-9ef6-492b-961d-b738da5faf01
    - text: The input `profit` column should contain numeric values so that `profit
        - cost` is valid. The observed values are integral; the code does not require
        `profit` to be limited to the observed values 100, 1000, and 10000.
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: 33068a81-ee1c-4ead-9138-040468af4218
    - text: For every input row, `profit` should be strictly greater than `cost`,
        and `cost` should be non-null. Because non-null `profit` causes the WHERE
        clause to retain the row, these conditions are needed to make every resulting
        `profit - cost` value positive and valid for `math.log`.
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: 1c9f631e-7ff9-4531-bc44-e130c0392d50
