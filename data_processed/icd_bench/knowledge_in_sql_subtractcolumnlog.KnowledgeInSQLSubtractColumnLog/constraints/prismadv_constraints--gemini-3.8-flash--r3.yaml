    assumptions:
    - text: 'The ''profit'' column should be greater than the ''cost'' column (i.e.,
        `profit > cost`) when neither is null, because the downstream code applies
        `math.log` to `profit_after_cost` (`profit - cost`), which requires strictly
        positive values (x > 0) to avoid a ValueError. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `profit` IS NOT NULL
        AND `cost` IS NOT NULL THEN CASE WHEN `profit` > `cost` THEN 1 ELSE 0 END
        ELSE 1 END", "Profit Greater Than Cost", lambda x: x == 1)'
      sources:
