        end_line: 4
        file: ''
      uid: 83fb4bc6-4a93-48b3-a1ee-4b1a96671793
    - text: 'The ''profit'' column should have a numeric data type (integral or fractional)
        because the code performs an arithmetic subtraction (`profit - cost`). We
        could represent this assumption as a deequ constraint like this: .isDataType("profit",
