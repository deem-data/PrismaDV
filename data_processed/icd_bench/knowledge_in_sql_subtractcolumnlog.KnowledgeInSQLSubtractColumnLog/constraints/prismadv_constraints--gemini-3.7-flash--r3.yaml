      level: error
      uid: b557becf-6987-4872-a431-2a433889507a
      source_assumptions:
      - 8589c136-7458-45fc-aac3-349b0f8062a2
    - suggestion: .hasDataType('profit', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2136c6a0-9f6a-4241-8db4-cd6d2fa6d04c
      source_assumptions:
      - 7a243458-0746-4311-965d-fa54dc989db7
    assumptions:
    - text: 'The ''profit'' column must be greater than ''cost'' (i.e., ''profit -
        cost > 0'') whenever both are not null, because `math.log` is applied to `profit_after_cost`
        and requires strictly positive numbers to avoid a math domain error.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NOT NULL AND `cost` IS NOT NULL THEN `profit`
        > `cost` ELSE TRUE END", "Profit Greater Than Cost", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: 8589c136-7458-45fc-aac3-349b0f8062a2
    - text: 'The ''profit'' column is expected to have a numeric data type (such as
        Integral or Fractional) to support arithmetic operations like subtraction
        with the ''cost'' column.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("profit", ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: 7a243458-0746-4311-965d-fa54dc989db7
    - text: 'The ''profit'' column is assumed to potentially contain null values,
        as the query explicitly checks for nulls with ''WHERE profit IS NOT NULL OR
        cost is NOT NULL''.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `profit` IS NULL THEN 1 ELSE 0 END", "Profit May Contain
        Nulls", lambda x: x >= 0)'
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: 399e5eb6-af51-44a6-a0ac-121c3719e083
