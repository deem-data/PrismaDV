      source_assumptions:
      - 7468ade5-7576-41b9-b8d1-35dd33b7659d
    assumptions:
    - text: The input `profit` column should contain no null values. The SQL filter
        uses `OR`, so a row with null `profit` can still pass when `cost` is non-null;
        subtracting from null would produce a null value that cannot be passed to
        `math.log`.
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: 3ee93283-48ce-459d-abf1-ac30232c2fe8
    - text: The input `profit` column should contain numeric values suitable for subtraction.
        Its observed data type is integral.
      sources:
      - start_line: 2
        end_line: 2
        file: ''
      uid: f79f7610-2dee-4936-96f5-de279a388d34
    - text: For every input row, `profit` should be greater than the corresponding
        `cost` so that `profit - cost` is strictly positive, as required by `math.log`.
        This also requires a non-null `cost` on every processed row; a constraint
        on `profit` alone cannot ensure that.
      sources:
      - start_line: 2
        end_line: 6
        file: ''
      uid: 7468ade5-7576-41b9-b8d1-35dd33b7659d
