      uid: 4aa8c872-8898-473b-b5d2-93841689b169
      source_assumptions:
      - 8ead6a9f-7ee8-43dc-9ceb-eb5eb95d4d27
    assumptions:
    - text: 'The ''profit'' column must be numeric (integral or fractional) because
        arithmetic subtraction (''profit - cost'') is performed on it. We could represent
        this assumption as a deequ constraint like this: .isDataType(''profit'', ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: 622168ef-b083-466a-a3cb-76a18e1cb728
    - text: 'The ''profit'' column must not be null and must be strictly greater than
        ''cost'' (i.e., `profit - cost > 0`), because ''math.log'' is applied directly
        to ''profit_after_cost'', which requires positive numbers and will fail with
        a ValueError or TypeError if the result is non-positive or null. We could
        represent this assumption as a deequ constraint like this: .satisfies("profit
        IS NOT NULL AND cost IS NOT NULL AND (profit - cost) > 0", "Profit After Cost
        Greater Than Zero", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 6
        file: ''
      uid: 8ead6a9f-7ee8-43dc-9ceb-eb5eb95d4d27
