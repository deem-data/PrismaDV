        We could represent this assumption as a deequ constraint like this:

        .isComplete("cost")'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: eaf31d1a-0c23-4877-aa4d-fdd935206a27
    - text: 'The ''cost'' column must contain strictly positive numbers (cost > 0),
        because math.log is only defined for positive values and will raise a ValueError
        if given zero or negative numbers.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`cost` > 0", "Cost Strictly Positive", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 1
        file: ''
      uid: 286b35b0-19cc-415f-8298-41d5fe03a7b9
