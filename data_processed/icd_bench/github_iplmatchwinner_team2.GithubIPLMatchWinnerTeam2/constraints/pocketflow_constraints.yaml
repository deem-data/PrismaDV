constraints:
- .isComplete('Team1')
- .isContainedIn('Team1', ['Rajasthan Royals', 'Gujarat Titans', 'Royal Challengers
  Bangalore', 'Lucknow Super Giants', 'Kolkata Knight Riders', 'Sunrisers Hyderabad',
  'Punjab Kings', 'Delhi Capitals', 'Mumbai Indians', 'Chennai Super Kings'])
- .satisfies('`Team1` NOT IN (''Kings XI Punjab'',''Delhi Daredevils'',''Gujarat Lions'',''Deccan
  Chargers'')', 'Team1 has no deprecated franchise names')
- .hasPattern('Team1', r'^[A-Za-z ]+$')
- .satisfies('length(trim(`Team1`)) > 0', 'Team1 not blank or whitespace')
- .hasMinLength('Team1', 3)
