        end_line: 5
        file: ''
      uid: 1f46bc7b-f72f-414c-a3f8-22971ef7536e
    - text: 'When not null, values in the ''status'' column must be integers in the
        range [0, 3] (i.e., {0, 1, 2, 3}) because they are used as zero-based indices
        to access elements in the 4-element list `action_per_status`. Any non-integer
        value or integer value outside this range could cause an IndexError or unexpected
        behavior. We could represent this assumption as a deequ constraint like this:
        .satisfies("CASE WHEN `status` IS NULL OR `status` IN (0, 1, 2, 3) THEN 1
        ELSE 0 END", "Valid Status Indices", lambda x: x == 1.0)'
      sources:
      - start_line: 1
        end_line: 5
        file: ''
      uid: 47d85a7e-156a-482e-a19e-ec9ce98b661d
