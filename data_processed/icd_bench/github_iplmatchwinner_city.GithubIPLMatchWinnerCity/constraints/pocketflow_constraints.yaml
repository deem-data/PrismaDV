constraints:
- .isComplete('City')
- .hasDataType('City', ConstrainableDataTypes.String)
- '.hasPattern(''City'', ''^(?!.*Bangalore).*$'', lambda d: d == 1.0)'
- '.hasPattern(''City'', ''^(?!.*Dharamsala).*$'', lambda d: d == 1.0)'
- '.hasPattern(''City'', ''^[A-Za-z ]+$'', lambda d: d == 1.0)'
- '.hasPattern(''City'', ''^\S(?:.*\S)?$'', lambda d: d == 1.0)'
- '.hasMinLength(''City'', lambda d: d >= 3)'
- '.hasMaxLength(''City'', lambda d: d <= 25)'
