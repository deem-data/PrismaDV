constraints:
- .isComplete('email', where="status = 'COMPLETED'")
- .hasPattern('email', '[^@]+@[^@]+\.[^@]+', where="status = 'COMPLETED'")
- .isUnique('email', where="status = 'COMPLETED'")
- '.hasMinLength(''email'', lambda v: v >= 6, where="status = ''COMPLETED''")'
- '.hasMaxLength(''email'', lambda v: v <= 254, where="status = ''COMPLETED''")'
- '.satisfies(''length(trim(email)) = length(email)'', ''email_trimmed'', lambda v:
  v == 1.0, where="status = ''COMPLETED''")'
