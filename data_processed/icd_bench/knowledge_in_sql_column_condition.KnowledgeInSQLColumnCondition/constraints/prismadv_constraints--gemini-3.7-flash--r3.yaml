      level: error
      uid: 9af40bb1-2857-48ac-92fb-3b52ba9e8cf7
      source_assumptions:
      - a51ccd38-36b2-4da9-813e-fb739ce9ecf0
    assumptions:
    - text: 'The ''email'' column should not be null when ''status'' is ''COMPLETED'',
        because the code fetches emails for completed records and directly passes
        them to ''send_confirmation_mail'' without checking for null values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN status = ''COMPLETED'' AND `email` IS NULL THEN 0 ELSE
        1 END", "Email Not Null When Completed", lambda x: x == 1.0)

        '
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: ec854b61-7f28-4270-a4cd-54e8792c989b
    - text: 'The ''email'' column should be of string type and contain valid email
        formats for records where ''status'' is ''COMPLETED'' so that ''send_confirmation_mail''
        can successfully process the addresses.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("email", ConstrainableDataTypes.String)

        '
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: a51ccd38-36b2-4da9-813e-fb739ce9ecf0
