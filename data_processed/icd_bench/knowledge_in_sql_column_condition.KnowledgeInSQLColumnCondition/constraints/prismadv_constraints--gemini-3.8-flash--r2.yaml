constraints:
  email:
    code:
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NULL
        THEN 0 ELSE 1 END", "Email not null when completed", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 563a4c17-6fb7-4f31-8d60-fe8b323f70d5
      source_assumptions:
      - 9c83312e-6632-4aea-b938-02706111c664
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' THEN (CASE WHEN email
        LIKE ''%@%.%'' THEN 1 ELSE 0 END) ELSE 1 END", "Valid email format when completed",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2918a04d-f211-4a29-b896-21ae80e05655
      source_assumptions:
      - 2257c268-a10d-4076-973f-5946da6857ef
    assumptions:
    - text: 'The ''email'' column should not contain null values when ''status'' is
        ''COMPLETED'', because the code queries emails for completed transactions
        and immediately passes them to `send_confirmation_mail` without checking for
        nulls. We could represent this assumption as a deequ constraint like this:
        .satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NULL THEN 0 ELSE
        1 END", "Email not null when completed", lambda x: x == 1)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 9c83312e-6632-4aea-b938-02706111c664
    - text: 'The ''email'' column should follow a valid email pattern (containing
        ''@'' and a domain) for rows where ''status'' is ''COMPLETED'', because the
        code sends confirmation emails directly to these addresses. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN status
        = ''COMPLETED'' THEN (CASE WHEN email LIKE ''%@%.%'' THEN 1 ELSE 0 END) ELSE
        1 END", "Valid email format when completed", lambda x: x == 1)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 2257c268-a10d-4076-973f-5946da6857ef
