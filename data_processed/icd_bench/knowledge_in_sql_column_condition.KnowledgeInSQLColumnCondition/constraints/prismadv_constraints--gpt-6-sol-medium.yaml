    assumptions:
    - text: 'Rows with status = ''COMPLETED'' should have a non-null, non-empty email.
        The code sends every selected email without checking for missing values; the
        null observed in the dataset is acceptable only if it belongs to a row that
        is not selected. This can be validated with: status <> ''COMPLETED'' OR (email
        IS NOT NULL AND TRIM(email) <> '''').'
      sources:
      - start_line: 5
        end_line: 9
        file: ''
      uid: da9b97d1-663f-4289-a1bb-82235b8bd749
    - text: Rows with status = 'COMPLETED' should have an email in a usable email-address
        format, since each selected value is passed directly to send_confirmation_mail.
