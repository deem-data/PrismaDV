constraints:
  email:
    code:
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' THEN (CASE WHEN email
        IS NOT NULL THEN 1 ELSE 0 END) ELSE 1 END", "Email Not Null When Completed",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e5188fd6-f594-4e72-989e-7db4c7ea3d69
      source_assumptions:
      - 29a15561-b248-4bd9-b8f9-d4dacf53ded1
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NOT NULL
        THEN (CASE WHEN email LIKE ''%@%'' THEN 1 ELSE 0 END) ELSE 1 END", "Valid
        Email Pattern When Completed", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3c9ae4c8-a93b-4cd3-af77-3b23e8af6ca4
      source_assumptions:
      - 1b82ce45-a75c-423a-9fc3-6f1857b818c0
    assumptions:
    - text: 'The ''email'' column should not contain null values for rows where ''status''
        is ''COMPLETED'', as the code selects emails for completed records and directly
        passes them to ''send_confirmation_mail'' without checking for null values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN status = ''COMPLETED'' THEN (CASE WHEN email IS NOT
        NULL THEN 1 ELSE 0 END) ELSE 1 END", "Email Not Null When Completed", lambda
        x: x == 1.0)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 29a15561-b248-4bd9-b8f9-d4dacf53ded1
    - text: 'The ''email'' column should contain valid email address strings (such
        as containing ''@'') for rows with ''COMPLETED'' status, as each value is
        passed directly to the ''send_confirmation_mail'' function.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NOT NULL THEN (CASE
        WHEN email LIKE ''%@%'' THEN 1 ELSE 0 END) ELSE 1 END", "Valid Email Pattern
        When Completed", lambda x: x == 1.0)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 1b82ce45-a75c-423a-9fc3-6f1857b818c0
