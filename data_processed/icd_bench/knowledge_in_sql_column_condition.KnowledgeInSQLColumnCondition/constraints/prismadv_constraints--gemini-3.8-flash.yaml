constraints:
  email:
    code:
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' THEN (email IS NOT
        NULL) ELSE TRUE END", "Email Not Null When Completed", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2869d235-4532-4319-bf46-dde113828ac1
      source_assumptions:
      - 924ae3f6-785a-4859-be95-6b1ad04277ea
    - suggestion: '.satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NOT NULL
        THEN email LIKE ''%_@__%.__%'' ELSE TRUE END", "Valid Email Format When Completed",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0fdbe94a-5e28-42da-9859-0f3010589cfb
      source_assumptions:
      - 7f248a25-fb8c-4bfb-b2e5-ff6e6394ab82
    assumptions:
    - text: 'The ''email'' column should not be null when ''status'' is ''COMPLETED'',
        because the query retrieves emails for all completed rows without filtering
        for null values and passes each email directly to ''send_confirmation_mail(row[0])''.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN status = ''COMPLETED'' THEN (email IS NOT NULL) ELSE
        TRUE END", "Email Not Null When Completed", lambda x: x == 1)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 924ae3f6-785a-4859-be95-6b1ad04277ea
    - text: 'The ''email'' column should contain valid email addresses for rows where
        ''status'' is ''COMPLETED'', as the values are directly passed to ''send_confirmation_mail(row[0])''.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN status = ''COMPLETED'' AND email IS NOT NULL THEN email
        LIKE ''%_@__%.__%'' ELSE TRUE END", "Valid Email Format When Completed", lambda
        x: x == 1)'
      sources:
      - start_line: 4
        end_line: 9
        file: ''
      uid: 7f248a25-fb8c-4bfb-b2e5-ff6e6394ab82
