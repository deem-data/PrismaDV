        email, because the code passes each selected email directly to send_confirmation_mail
        without handling missing values. Emails in other rows may be null. This can
        be validated with a row-level condition: CASE WHEN status = ''COMPLETED''
        THEN email IS NOT NULL AND TRIM(email) <> '''' ELSE TRUE END.'
