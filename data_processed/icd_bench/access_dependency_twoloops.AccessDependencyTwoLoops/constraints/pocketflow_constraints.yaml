constraints:
- .isComplete('email', where="status = 'COMPLETED'")
- '.hasPattern(''email'', r''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'', lambda
  v: v == 1.0, where="status = ''COMPLETED''")'
- '.hasPattern(''email'', r''^\S+$'', lambda v: v == 1.0, where="status = ''COMPLETED''")'
- '.hasPattern(''email'', r''^.{1,254}$'', lambda v: v == 1.0, where="status = ''COMPLETED''")'
- '.hasUniqueness(''email'', lambda v: v == 1.0, where="status = ''COMPLETED''")'
