function_source: "def run_code():\n  return {\n    \"constraints\": [\n      \".isComplete('category')\"\
  ,\n      \".isNonNegative('category')\",\n      \".isContainedIn('category', [0.0,\
  \ 1.0])\",\n      \".hasMin('category', lambda v: v == 0.0)\",\n      \".hasMax('category',\
  \ lambda v: v == 1.0)\",\n      \".hasNumberOfDistinctValues('category', lambda\
  \ v: v == 2)\"\n    ]\n  }\n"
constraints_under_test:
- .isComplete('category')
- .isNonNegative('category')
- .isContainedIn('category', [0.0, 1.0])
- '.hasMin(''category'', lambda v: v == 0.0)'
- '.hasMax(''category'', lambda v: v == 1.0)'
- '.hasNumberOfDistinctValues(''category'', lambda v: v == 2)'
