constraints:
- .isComplete('zone')
- ".contains('zone', r'.*Dalaran\u7AF6\u6280\u5834.*', lambda v: v <= 0.0, name='containsForbiddenOldValue')"
- .hasPattern('zone', r'^[A-Za-z][A-Za-z\' -]*[A-Za-z]$', name='hasPattern')
- .hasMaxLength('zone', 40, name='hasMaxLength')
- .hasMinLength('zone', 3, name='hasMinLength')
