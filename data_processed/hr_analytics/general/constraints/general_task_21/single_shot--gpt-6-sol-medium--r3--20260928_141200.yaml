constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age >= 18', 'adult employee age')
      - Valid
    assumptions: []
    column_name: Age
  Age,AgeGroup:
    code:
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age >= 55 AND
        AgeGroup = '55+')", 'age group matches age')
      - Valid
    assumptions: []
    column_name: Age,AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome,SalarySlab:
    code:
    - - .satisfies("SalarySlab = CASE WHEN MonthlyIncome <= 5000 THEN 'Upto 5k' WHEN
        MonthlyIncome <= 10000 THEN '5k-10k' WHEN MonthlyIncome <= 15000 THEN '10k-15k'
        ELSE '15k+' END", 'salary slab matches monthly income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome,SalarySlab
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TotalWorkingYears,YearsAtCompany,YearsInCurrentRole:
    code:
    - - .satisfies('TotalWorkingYears >= YearsAtCompany AND YearsAtCompany >= YearsInCurrentRole
        AND YearsInCurrentRole >= 0', 'nonnegative experience and role tenure gaps')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears,YearsAtCompany,YearsInCurrentRole
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  dataset:
    code:
    - - '.hasSize(lambda n: n > 0)'
      - Valid
    assumptions: []
    column_name: dataset
