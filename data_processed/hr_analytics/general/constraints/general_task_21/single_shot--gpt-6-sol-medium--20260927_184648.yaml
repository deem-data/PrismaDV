constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('`Age` >= 18', 'adult_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("`AgeGroup` = CASE WHEN `Age` >= 55 THEN '55+' WHEN `Age` >= 46
        THEN '46-55' WHEN `Age` >= 36 THEN '36-45' WHEN `Age` >= 26 THEN '26-35' ELSE
        '18-25' END", 'age_group_matches_age')
      - Invalid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    - - '.satisfies("`Attrition` = ''No''", ''attrition_no_present'', lambda fraction:
        fraction > 0)'
      - Valid
    - - '.satisfies("`Attrition` = ''Yes''", ''attrition_yes_present'', lambda fraction:
        fraction > 0)'
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    - - '.satisfies("`OverTime` = ''No''", ''overtime_no_present'', lambda fraction:
        fraction > 0)'
      - Valid
    - - '.satisfies("`OverTime` = ''Yes''", ''overtime_yes_present'', lambda fraction:
        fraction > 0)'
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("`SalarySlab` = CASE WHEN `MonthlyIncome` <= 5000 THEN 'Upto 5k'
        WHEN `MonthlyIncome` <= 10000 THEN '5k-10k' WHEN `MonthlyIncome` <= 15000
        THEN '10k-15k' ELSE '15k+' END", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TotalWorkingYears, YearsAtCompany:
    code:
    - - .satisfies('`TotalWorkingYears` >= `YearsAtCompany`', 'nonnegative_experience_gap')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears, YearsAtCompany
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsAtCompany, YearsInCurrentRole:
    code:
    - - .satisfies('`YearsAtCompany` >= `YearsInCurrentRole`', 'nonnegative_role_gap')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, YearsInCurrentRole
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .isNonNegative('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
