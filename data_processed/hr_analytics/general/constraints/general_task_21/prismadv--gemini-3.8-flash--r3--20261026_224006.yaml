        the square root produces NaN and causes downstream rank conversion to fail.
        We could represent this assumption as a deequ constraint like this: .satisfies(''`TotalWorkingYears`
        >= `YearsAtCompany`'', ''ExpGapNonNegative'', lambda x: x == 1.0)'
