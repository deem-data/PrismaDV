      - start_line: 126
        end_line: 126
        file: ''
      uid: 8b52252d-65b9-4e84-963c-52f7626fd79d
    - text: 'The ''YearsAtCompany'' column values should be less than or equal to
        ''TotalWorkingYears'' because the code calculates ''exp_gap_root = np.sqrt(df[''TotalWorkingYears'']
