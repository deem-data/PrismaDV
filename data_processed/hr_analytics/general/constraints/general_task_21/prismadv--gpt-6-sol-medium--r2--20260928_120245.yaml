        <= YearsAtCompany <= TotalWorkingYears. Both gaps are square-rooted, so negative
        gaps would produce invalid risk-score inputs; the nonnegative lower bound
        also makes the tenure values meaningful. A row-level constraint can check
        this ordering across all three columns.
