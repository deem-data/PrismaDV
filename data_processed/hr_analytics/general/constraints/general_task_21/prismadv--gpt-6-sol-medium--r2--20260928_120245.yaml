  '["Department","JobRole"]':
    code:
    - suggestion: .satisfies("CASE WHEN `JobRole` IN ('Research Scientist', 'Laboratory
        Technician', 'Research Director', 'Manufacturing Director') THEN `Department`
        = 'Research & Development' WHEN `JobRole` IN ('Sales Executive', 'Sales Representative')
        THEN `Department` = 'Sales' ELSE TRUE END", "verified_job_role_department_mapping")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b8d56bd0-937c-4530-8a0c-e7bfecc79d6b
      source_assumptions:
      - f4103a29-10c8-4e82-b956-108649cd6639
    assumptions:
    - text: 'For every row whose JobRole appears in role_to_dept, Department should
        equal the mapped department: Research Scientist, Laboratory Technician, Research
        Director, and Manufacturing Director map to Research & Development; Sales
        Executive, Sales Representative, and Healthcare Representative map to Sales.
        This can be checked with a conditional row-level constraint. However, the
        supplied counts make the full mapping impossible: those three Sales-mapped
        roles total 302 employees, while Sales contains only 250. Verify the Healthcare
        Representative mapping before enforcing this constraint.'
      sources:
      - start_line: 70
        end_line: 81
        file: ''
