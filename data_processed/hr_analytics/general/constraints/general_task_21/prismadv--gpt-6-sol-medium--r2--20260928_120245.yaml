    assumptions:
    - text: For every employee, 'TotalWorkingYears', 'YearsAtCompany', and 'YearsInCurrentRole'
        should all remain non-null after numeric conversion. Otherwise, the tenure
        gaps can become null and propagate into the risk score and ranking. This can
        be checked with a row-level constraint requiring all three columns to be non-null.
