    assumptions:
    - text: 'For every record, ''SalarySlab'' should equal the category obtained from
        ''MonthlyIncome'' using these boundaries: ''Upto 5k'' for 0 < income <= 5000,
        ''5k-10k'' for 5000 < income <= 10000, ''10k-15k'' for 10000 < income <= 15000,
        and ''15k+'' for income > 15000. This also requires a positive income for
        every record, so the salary logarithm is defined. A row-level conditional
        constraint can check each income range against its corresponding slab.'
