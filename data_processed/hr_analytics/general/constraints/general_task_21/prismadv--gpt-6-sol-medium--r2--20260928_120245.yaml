        non-null SalarySlab in {'Upto 5k', '5k-10k', '10k-15k', '15k+'} and a non-null
        Attrition value in {'Yes', 'No'}. Otherwise, an invalid Attrition value is
        silently counted as 'No', or a missing SalarySlab is excluded from the grouped
        rate. This can be checked with a row-level constraint requiring both conditions.
      sources:
      - start_line: 52
        end_line: 52
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: de8bc61f-c5eb-4388-884b-26c839d310e4
    - text: Each of the four expected SalarySlab categories should have at least one
        row with a valid Attrition value, so that the salary-slab attrition-rate output
        contains an observed rate for every expected category. This can be checked
        by counting rows satisfying Attrition IN ('Yes', 'No') for each SalarySlab
        category and requiring every count to be greater than zero.
      sources:
      - start_line: 29
        end_line: 33
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      - start_line: 141
        end_line: 141
