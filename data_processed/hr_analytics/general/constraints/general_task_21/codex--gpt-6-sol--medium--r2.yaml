  \ '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 511,\
  \ 'Department': 'Sales', 'DistanceFromHome': 2, 'Education': 2, 'EducationField':\
  \ 'Medical', 'EmployeeCount': 1, 'EmployeeNumber': 1898, 'EnvironmentSatisfaction':\
