constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age >= 18', 'adult_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(Age < 26 AND AgeGroup = '18-25') OR (Age >= 26 AND Age < 36 AND
        AgeGroup = '26-35') OR (Age >= 36 AND Age < 46 AND AgeGroup = '36-45') OR
        (Age >= 46 AND Age < 55 AND AgeGroup = '46-55') OR (Age >= 55 AND AgeGroup
        = '55+')", 'age_group_matches_age')
      - Invalid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.hasNumberOfDistinctValues(''Attrition'', lambda x: x == 2)'
      - Invalid
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - '.hasNumberOfDistinctValues(''OverTime'', lambda x: x == 2)'
      - Invalid
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
        > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears >= YearsAtCompany', 'nonnegative_experience_gap')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .isNonNegative('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsAtCompany >= YearsInCurrentRole', 'nonnegative_role_gap')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
