    - text: '''TotalWorkingYears'' must be greater than or equal to ''YearsAtCompany''
        (i.e., TotalWorkingYears >= YearsAtCompany) for every record. The code calculates
        the experience gap as `df[''TotalWorkingYears''] - df[''YearsAtCompany'']`
        and subsequently computes its square root using `np.sqrt(exp_gap)`. If ''TotalWorkingYears''
        is less than ''YearsAtCompany'', the subtraction results in a negative value,
        causing `np.sqrt` to produce NaN values and corrupt downstream risk scoring.
        This can be expressed as a Deequ constraint: `.satisfies(''TotalWorkingYears
        >= YearsAtCompany'', ''TotalWorkingYears_GTE_YearsAtCompany'')`.'
