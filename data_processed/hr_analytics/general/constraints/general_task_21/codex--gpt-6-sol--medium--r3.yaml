prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef sigmoid(x:\
  \ np.ndarray) -> np.ndarray:\n    return 1.0 / (1.0 + np.exp(-x))\n\n\ndef age_to_group(age:\
  \ float) -> str:\n    if pd.isna(age):\n        return np.nan\n    a = int(age)\n\
  \    if a >= 55:\n        return '55+'\n    elif a >= 46:\n        return '46-55'\n\
  \    elif a >= 36:\n        return '36-45'\n    elif a >= 26:\n        return '26-35'\n\
  \    else:\n        return '18-25'\n\n\ndef compute_salary_slab(series: pd.Series)\
  \ -> pd.Series:\n    bins = [0, 5000, 10000, 15000, np.inf]\n    labels = ['Upto\
  \ 5k', '5k-10k', '10k-15k', '15k+']\n    cats = pd.cut(series, bins=bins, labels=labels,\
  \ right=True, include_lowest=False)\n    return cats.astype(str)\n\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\nos.makedirs(args.output,\
  \ exist_ok=True)\n\ninput_csv = os.path.join(args.input, 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\
  \nnumeric_cols = [\n    'Age', 'MonthlyIncome', 'YearsAtCompany', 'YearsInCurrentRole',\
  \ 'TotalWorkingYears'\n]\nfor c in numeric_cols:\n    df[c] = pd.to_numeric(df[c],\
  \ errors='coerce')\n\ndf['AttritionFlag'] = (df['Attrition'] == 'Yes').astype(int)\n\
  base_rate = float(df['AttritionFlag'].mean())\nbase_logit = float(np.log(base_rate\
  \ / (1 - base_rate))) if 0 < base_rate < 1 else 0.0\n\ncomputed_age_group = df['Age'].apply(age_to_group)\n\
  age_group_rates = df.groupby('AgeGroup', dropna=False)['AttritionFlag'].mean()\n\
  \nmi = df['MonthlyIncome']\nsalary_log = np.log(mi)\n\nslab_from_income = compute_salary_slab(mi)\n\
  slab_rates = df.groupby('SalarySlab')['AttritionFlag'].mean()\n\nexp_gap = df['TotalWorkingYears']\
  \ - df['YearsAtCompany']\nrole_gap = df['YearsAtCompany'] - df['YearsInCurrentRole']\n\
  exp_gap_root = np.sqrt(exp_gap)\nrole_gap_root = np.sqrt(role_gap)\n\nrole_to_dept\
  \ = {\n    'Research Scientist': 'Research & Development',\n    'Laboratory Technician':\
  \ 'Research & Development',\n    'Research Director': 'Research & Development',\n\
  \    'Manufacturing Director': 'Research & Development',\n    'Sales Executive':\
  \ 'Sales',\n    'Sales Representative': 'Sales',\n    'Healthcare Representative':\
  \ 'Sales',\n}\nmask_roles = df['JobRole'].isin(role_to_dept.keys())\nexpected_dept\
  \ = df.loc[mask_roles, 'JobRole'].map(role_to_dept)\nactual_dept = df.loc[mask_roles,\
  \ 'Department']\ndept_rates = df.groupby('Department')['AttritionFlag'].mean()\n\
  \not_rates = df.groupby('OverTime')['AttritionFlag'].mean()\nrate_yes = float(ot_rates.get('Yes',\
  \ np.nan))\nrate_no = float(ot_rates.get('No', np.nan))\nage_effect = df['AgeGroup'].map(age_group_rates).fillna(base_rate)\
  \ - base_rate\ndepartment_effect = df['Department'].map(dept_rates).fillna(base_rate)\
  \ - base_rate\nslab_effect = df['SalarySlab'].map(slab_rates).fillna(base_rate)\
  \ - base_rate\n\not_effect = np.where(df['OverTime'] == 'Yes', rate_yes - base_rate,\
  \ rate_no - base_rate)\n\nstd_log = float(salary_log.std(ddof=0))\nif std_log >\
  \ 0:\n    salary_log_z = (salary_log - float(salary_log.mean())) / std_log\nelse:\n\
  \    salary_log_z = pd.Series(0.0, index=df.index)\n\nrole_tenure_index = 1.0 /\
  \ (1.0 + role_gap_root.replace(0, 0.0))\nexperience_index = exp_gap_root\n\nw_age\
  \ = 1.2\nw_dept = 1.0\nw_slab = 1.1\nw_ot = 0.8\nw_salary = 0.5\nw_tenure = 0.7\n\
  \nz = (\n        base_logit\n        + w_age * age_effect.values\n        + w_dept\
  \ * department_effect.values\n        + w_slab * slab_effect.values\n        + w_ot\
  \ * ot_effect\n        + w_salary * (-salary_log_z.values)\n        + w_tenure *\
  \ (0.6 * role_tenure_index.values - 0.4 * experience_index.values)\n)\n\nrisk =\
  \ sigmoid(z)\n\nout = pd.DataFrame({\n    'EmpID': df['EmpID'],\n    'AttritionRisk':\
  \ risk\n})\n\nout['Rank'] = out['AttritionRisk'].rank(method='first', ascending=False).astype(int)\n\
  percentile = out['AttritionRisk'].rank(pct=True)\nout['Priority'] = np.where(\n\
  \    percentile >= 0.85, 'High', np.where(percentile >= 0.60, 'Medium', 'Low')\n\
  )\nactions = {'High': 'Retention Outreach', 'Medium': 'Manager Check-in', 'Low':\
  \ 'Monitor'}\nout['Action'] = out['Priority'].map(actions)\n\nscores_path = os.path.join(args.output,\
  \ 'attrition_risk_scores.csv')\nout.sort_values(['Priority', 'AttritionRisk'], ascending=[False,\
  \ False]).to_csv(scores_path, index=False)\n\nmetrics = {\n    'base_attrition_rate':\
  \ float(base_rate),\n    'overtime_attrition_rate': {'Yes': float(rate_yes), 'No':\
  \ float(rate_no)},\n    'age_group_attrition_rate': {str(k): float(v) for k, v in\
  \ age_group_rates.to_dict().items()},\n    'salary_slab_attrition_rate': {str(k):\
  \ float(v) for k, v in slab_rates.to_dict().items()},\n    'department_attrition_rate':\
  \ {str(k): float(v) for k, v in dept_rates.to_dict().items()}\n}\nwith open(os.path.join(args.output,\
  \ 'calibration_metrics.json'), 'w') as f:\n    json.dump(metrics, f, indent=2)\n\
  \n```\n\nThe same program is on disk at `./code/general_task_21.py`, so you can\
  \ run it against the\nstaged table, step through it, or search it, rather than working\
