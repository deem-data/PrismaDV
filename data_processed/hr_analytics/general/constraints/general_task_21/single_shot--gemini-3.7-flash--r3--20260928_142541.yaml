constraints:
  Age:
    code:
    - - .isComplete('Age').isNonNegative('Age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition').isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Research & Development',
        'Sales', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Research Scientist', 'Laboratory
        Technician', 'Research Director', 'Manufacturing Director', 'Sales Executive',
        'Sales Representative', 'Healthcare Representative', 'Manager', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').isNonNegative('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears >= YearsAtCompany', 'exp_gap_validity')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany >= YearsInCurrentRole', 'role_gap_validity')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').isNonNegative('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
