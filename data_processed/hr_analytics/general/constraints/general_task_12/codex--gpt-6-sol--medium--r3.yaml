prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef compute_age_group(age_series:\
  \ pd.Series) -> pd.Series:\n    bins = [18, 25, 35, 45, 55, np.inf]\n    labels\
  \ = ['18-25', '26-35', '36-45', '46-55', '55+']\n    return pd.cut(age_series, bins=bins,\
  \ labels=labels, right=True, include_lowest=True).astype(str)\n\n\ndef map_income_to_slab(income_series:\
  \ pd.Series) -> pd.Series:\n    s = income_series.astype(float)\n    conditions\
  \ = [\n        (s > 0) & (s <= 5000),\n        (s > 5000) & (s <= 10000),\n    \
  \    (s > 10000) & (s <= 15000),\n        (s > 15000)\n    ]\n    choices = ['Upto\
  \ 5k', '5k-10k', '10k-15k', '15k+']\n    return np.select(conditions, choices, default=None)\n\
  \n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_file = os.path.join(args.input, 'new_data.csv')\n\
  \    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\
  \n    # Age range guard prior to age-based segmentation\n    # Age group consistency\
  \ guard prior to using AgeGroup for segmentation\n    # Age band segmentation (dashboard\
  \ tile)\n    age_order = pd.CategoricalDtype(categories=['18-25', '26-35', '36-45',\
  \ '46-55', '55+'], ordered=True)\n    seg = df[['AgeGroup']].copy()\n    seg['AgeGroup']\
  \ = seg['AgeGroup'].astype(age_order)\n    age_band = (\n        seg.groupby('AgeGroup',\
  \ dropna=False)\n        .size()\n        .reset_index(name='headcount')\n     \
  \   .sort_values('AgeGroup')\n    )\n    age_band['share'] = age_band['headcount']\
  \ / len(df)\n    age_band.to_csv(os.path.join(args.output, 'age_band_distribution.csv'),\
  \ index=False)\n\n    # Salary band compliance checks prior to salary analytics\n\
  \    # Salary band summary (dashboard tile)\n    slab_order = pd.CategoricalDtype(categories=['Upto\
  \ 5k', '5k-10k', '10k-15k', '15k+'], ordered=True)\n    salary_summary = df[['SalarySlab']].copy()\n\
  \    salary_summary['SalarySlab'] = salary_summary['SalarySlab'].astype(slab_order)\n\
  \    salary_summary = (\n        salary_summary.groupby('SalarySlab', dropna=False)\n\
  \        .size()\n        .reset_index(name='headcount')\n        .sort_values('SalarySlab')\n\
  \    )\n    salary_summary['share'] = salary_summary['headcount'] / len(df)\n  \
  \  salary_summary.to_csv(os.path.join(args.output, 'salary_band_summary.csv'), index=False)\n\
  \n    # Role-Department consistency check prior to cross-tab/pipeline by org\n \
  \   role_to_dept = {\n        'Sales Executive': 'Sales',\n        'Sales Representative':\
  \ 'Sales',\n        'Healthcare Representative': 'Research & Development',\n   \
  \     'Research Scientist': 'Research & Development',\n        'Laboratory Technician':\
  \ 'Research & Development',\n        'Research Director': 'Research & Development',\n\
  \        'Manufacturing Director': 'Research & Development',\n        'Human Resources':\
  \ 'Human Resources'\n    }\n    # Role-Department matrix (dashboard tile)\n    role_dept_matrix\
  \ = (\n        df.pivot_table(index='Department', columns='JobRole', aggfunc='size',\
  \ fill_value=0)\n        .reset_index()\n    )\n    role_dept_matrix.to_csv(os.path.join(args.output,\
  \ 'role_department_matrix.csv'), index=False)\n\n    # Manager tenure coverage guard\
  \ prior to using it in pipeline metrics\n    # Tenure relationship guards prior\
  \ to ratios used in pipeline scoring\n    # Promotion pipeline metrics (dashboard\
  \ tile)\n    pipeline_df = df.copy()\n\n    # Readiness flags\n    pipeline_df['ready_now']\
  \ = (\n            (pipeline_df['PerformanceRating'] >= 4) &\n            (pipeline_df['YearsInCurrentRole']\
  \ >= 2) &\n            (pipeline_df['YearsSinceLastPromotion'] >= 2)\n    )\n  \
  \  pipeline_df['ready_soon'] = (\n            (~pipeline_df['ready_now']) &\n  \
  \          (pipeline_df['PerformanceRating'] >= 3) &\n            (pipeline_df['YearsInCurrentRole']\
  \ >= 1) &\n            (pipeline_df['YearsSinceLastPromotion'] >= 1)\n    )\n\n\
  \    # Ratios used in scoring and reporting\n    pipeline_df['internal_tenure_ratio']\
  \ = np.where(\n        pipeline_df['YearsAtCompany'] > 0,\n        pipeline_df['YearsInCurrentRole']\
  \ / pipeline_df['YearsAtCompany'],\n        np.nan\n    )\n    pipeline_df['company_to_career_ratio']\
  \ = np.where(\n        pipeline_df['TotalWorkingYears'] > 0,\n        pipeline_df['YearsAtCompany']\
  \ / pipeline_df['TotalWorkingYears'],\n        np.nan\n    )\n\n    agg = (\n  \
  \      pipeline_df\n        .groupby(['Department', 'JobLevel'], as_index=False)\n\
  \        .agg(\n            headcount=('EmpID', 'count'),\n            ready_now_count=('ready_now',\
  \ 'sum'),\n            ready_soon_count=('ready_soon', 'sum'),\n            avg_performance=('PerformanceRating',\
  \ 'mean'),\n            avg_years_in_role=('YearsInCurrentRole', 'mean'),\n    \
  \        avg_years_since_last_promotion=('YearsSinceLastPromotion', 'mean'),\n \
  \           avg_years_with_manager=('YearsWithCurrManager', 'mean'),\n         \
  \   avg_internal_tenure_ratio=('internal_tenure_ratio', 'mean'),\n            avg_company_to_career_ratio=('company_to_career_ratio',\
  \ 'mean')\n        )\n        .sort_values(['Department', 'JobLevel'])\n    )\n\
  \    agg.to_csv(os.path.join(args.output, 'promotion_pipeline.csv'), index=False)\n\
  \n    # Supplemental: manager stability by department for the dashboard\n    manager_stability\
  \ = (\n        pipeline_df.groupby('Department', as_index=False)\n        .agg(avg_years_with_manager=('YearsWithCurrManager',\
  \ 'mean'))\n        .sort_values('Department')\n    )\n    manager_stability.to_csv(os.path.join(args.output,\
  \ 'manager_stability_by_department.csv'), index=False)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_12.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 771, 'EmpID': 'RM777', 'Age': 20,\
  \ 'AgeGroup': '18-25', 'Attrition': 'Yes', 'BusinessTravel': 'Travel_Frequently',\
  \ 'DailyRate': 769, 'Department': 'Sales', 'DistanceFromHome': 9, 'Education': 3,\
  \ 'EducationField': 'Marketing', 'EmployeeCount': 1, 'EmployeeNumber': 1077, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Female', 'HourlyRate': 54, 'JobInvolvement': 3, 'JobLevel': 1, 'JobRole':\
