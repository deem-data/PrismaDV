      - - .isComplete('TotalWorkingYears')
        - Valid
      - - .isNonNegative('TotalWorkingYears')
        - Valid
      assumptions: []
      column_name: TotalWorkingYears
    YearsAtCompany:
      code:
      - - .isComplete('YearsAtCompany')
        - Valid
      - - .isNonNegative('YearsAtCompany')
        - Valid
      - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'company_tenure_within_career')
        - Valid
      assumptions: []
      column_name: YearsAtCompany
    YearsInCurrentRole:
      code:
      - - .isComplete('YearsInCurrentRole')
        - Valid
      - - .isNonNegative('YearsInCurrentRole')
        - Valid
      - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role_tenure_within_company')
        - Valid
      assumptions: []
      column_name: YearsInCurrentRole
    YearsSinceLastPromotion:
      code:
      - - .isComplete('YearsSinceLastPromotion')
        - Valid
      - - .isNonNegative('YearsSinceLastPromotion')
        - Valid
      - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company')
        - Valid
      assumptions: []
      column_name: YearsSinceLastPromotion
    YearsWithCurrManager:
      code:
      - - '.hasCompleteness(''YearsWithCurrManager'', lambda value: value >= 0.95)'
        - Valid
      - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager <= YearsAtCompany',
          'manager_tenure_within_company')
        - Valid
      - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager >= 0',
          'manager_tenure_nonnegative')
        - Valid
      assumptions: []
      column_name: YearsWithCurrManager
