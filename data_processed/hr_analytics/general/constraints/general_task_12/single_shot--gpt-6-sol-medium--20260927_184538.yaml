constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age >= 18', 'adult_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age > 55 AND
        AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel').satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Sales Executive', 'Sales
        Representative', 'Healthcare Representative', 'Research Scientist', 'Laboratory
        Technician', 'Research Director', 'Manufacturing Director', 'Human Resources',
        'Manager'])
      - Valid
    - - .satisfies("(JobRole IN ('Sales Executive', 'Sales Representative', 'Healthcare
        Representative') AND Department = 'Sales') OR (JobRole IN ('Research Scientist',
        'Laboratory Technician', 'Research Director', 'Manufacturing Director') AND
        Department = 'Research & Development') OR (JobRole = 'Human Resources' AND
        Department = 'Human Resources') OR JobRole = 'Manager'", 'role_matches_department')
      - Invalid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').satisfies('MonthlyIncome > 0', 'positive_monthly_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').satisfies('PerformanceRating IN (3, 4)',
        'valid_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(MonthlyIncome > 0 AND MonthlyIncome <= 5000 AND SalarySlab =
        'Upto 5k') OR (MonthlyIncome > 5000 AND MonthlyIncome <= 10000 AND SalarySlab
        = '5k-10k') OR (MonthlyIncome > 10000 AND MonthlyIncome <= 15000 AND SalarySlab
        = '10k-15k') OR (MonthlyIncome > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').satisfies('TotalWorkingYears >= 0', 'nonnegative_total_working_years')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').satisfies('YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears', 'company_tenure_within_career')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole
        <= YearsAtCompany', 'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').satisfies('YearsSinceLastPromotion
        >= 0 AND YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda value: value >= 0.90).satisfies(''YearsWithCurrManager
        IS NULL OR (YearsWithCurrManager >= 0 AND YearsWithCurrManager <= YearsAtCompany)'',
        ''manager_tenure_within_company_tenure'')'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
