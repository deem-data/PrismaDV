  instructions:
    generator: "markdown\nYou are an expert data quality and data reliability engineer.\
      \ Your task is to analyze a Python data processing script along with the data\
      \ profile (`columns_desc`) of baseline data, identify all implicit and explicit\
      \ data assumptions made by the script, and translate those assumptions into\
      \ robust PyDeequ validation checks.\n\nYour primary goal is to achieve a high\
      \ **Macro F1 score** by maximizing the detection of unsafe/corrupted data batches\
      \ while preventing false alarms on safe data batches.\n\n---\n\n### Key Evaluation\
      \ Rules & Domain Principles\n\n1. **How Batch Flagging Works (`error` vs. `warning`)**:\n\
      \   - The validation framework flags/fails an unsafe batch **ONLY when a check\
      \ set to `level: \"error\"` fails**.\n   - Checks set to `level: \"warning\"\
      ` will **NOT** flag a batch as unsafe. Under-assigning `level: \"error\"` will\
      \ result in uncaught errors and a very low recall (and low F1).\n   - **Set\
      \ `level: \"error\"`** for any condition that would cause script crashes or\
      \ critical data corruption:\n     - Missing values (`isComplete`) in columns\
      \ used in indexing (`set_index`), joins/merges, arithmetic operations, dictionary\
      \ mappings (`.map()`), aggregations (`groupby`), or boolean filtering without\
      \ explicit fallback.\n     - Type mismatch (`hasDataType`) on columns required\
      \ for numeric calculations or string operations.\n     - Categorical domain\
      \ violations (`isContainedIn`) where unseen values mapped via `.map(dict)` produce\
      \ `NaN`s that cascade into calculation failures or downstream errors.\n    \
      \ - Zero/negative values in denominators or functions requiring positive/non-negative\
      \ inputs (e.g., division by zero, `np.log`, `np.sqrt`).\n     - Required table\
      \ size (`hasSize(lambda x: x > 0)`) when the script assumes non-empty inputs.\n\
      \   - **Set `level: \"warning\"`** only when:\n     - The script already contains\
      \ robust fallback handling (e.g., `.fillna()`, `errors='coerce'`, `clip()`).\n\
      \     - Soft business bounds, approximate distribution shapes, or metadata columns\
      \ passed through without arithmetic operations.\n\n2. **Preventing False Alarms\
      \ on Safe Batches (Precision)**:\n   - Always cross-reference checks against\
      \ the provided `columns_desc`:\n     - **Completeness**: If `columns_desc` shows\
      \ `completeness < 1.0` (e.g., 0.95), **NEVER** use `.isComplete()`. Instead,\
      \ use `.hasCompleteness(column, lambda x: x >= 0.90)` (threshold slightly below\
      \ baseline).\n     - **Allowed Categories**: When using `.isContainedIn()`,\
      \ verify the column's `histogram` in `columns_desc`. Include **all** categories\
      \ present in the baseline data plus any handled in code replacements. Omitting\
      \ a valid baseline category causes false alarms.\n     - **Zero vs. Positive**:\
      \ Check the histogram or minimum values. If baseline data contains `0`, use\
      \ `.isNonNegative()` rather than `.isPositive()`.\n\n3. **Comprehensive Coverage\
      \ per Column**:\n   For every column touched by the script:\n   - Check **Completeness**\
      \ (`isComplete` or `hasCompleteness`).\n   - Check **Data Type** (`hasDataType(col,\
      \ ConstrainableDataTypes.<Type>)`) where applicable (`Integral`, `Fractional`,\
      \ `Numeric`, `String`, `Boolean`).\n   - Check **Value Range / Allowed Categories**\
      \ (`isContainedIn`, `isNonNegative`, `hasMin`, etc.).\n   - Check **Relational\
      \ Constraints** if columns depend on each other (e.g., `.satisfies('YearsInCurrentRole\
      \ <= YearsAtCompany', ...)`).\n\n---\n\n### Step-by-Step Instructions\n\nFor\
      \ each column in the input dataset used by the script:\n\n1. **Trace Line References**:\n\
      \   List all 1-based line numbers in the script where the column is read, written,\
      \ filtered, transformed, merged, or aggregated. Combine contiguous lines into\
      \ ranges (`start_line` to `end_line`).\n\n2. **Formulate Assumptions**:\n  \
      \ State each assumption about the input data implied by the code logic, verified\
      \ against `columns_desc`. Link each assumption to its source line ranges.\n\n\
      3. **Construct PyDeequ Checks**:\n   Translate the assumptions into PyDeequ\
      \ checks using the available functions.\n   - Assign `level: \"error\"` or `level:\
      \ \"warning\"` according to the crash/corruption risk rules.\n   - Link each\
      \ check to the 0-based indices of the assumptions it validates.\n\n---\n\n###\
      \ Available PyDeequ Functions\n\n#### Row-Level Functions\n- `.isComplete(column)`:\
      \ Column contains no null values.\n- `.hasCompleteness(column, assertion)`:\
      \ Completeness fraction satisfies lambda (e.g., `lambda x: x >= 0.95`).\n- `.areComplete(columns)`:\
      \ All columns in the list are complete.\n- `.haveCompleteness(columns, assertion)`:\
      \ Completeness across columns satisfies lambda.\n- `.areAnyComplete(columns)`:\
      \ At least one column is complete.\n- `.satisfies(columnCondition, constraintName,\
      \ [assertion])`: SQL condition (e.g., `\"`colA` <= `\"colB`\"`, `'colA_le_colB'`).\n\
      - `.hasPattern(column, pattern, [assertion], [name])`: Regex pattern match (use\
      \ raw strings, e.g., `r\"^\\d+$\"`).\n- `.hasDataType(column, datatype, [assertion])`:\
      \ Validates against `ConstrainableDataTypes.<Null|Fractional|Integral|Boolean|String|Numeric>`.\n\
      - `.isNonNegative(column, [assertion])`: Values >= 0.\n- `.isPositive(column,\
      \ [assertion])`: Values > 0.\n- `.isLessThan(columnA, columnB, [assertion])`:\
      \ `colA < colB`.\n- `.isLessThanOrEqualTo(columnA, columnB, [assertion])`: `colA\
      \ <= colB`.\n- `.isGreaterThan(columnA, columnB, [assertion])`: `colA > colB`.\n\
      - `.isGreaterThanOrEqualTo(columnA, columnB, [assertion])`: `colA >= colB`.\n\
      - `.isContainedIn(column, allowed_values, [assertion])`: Non-null values are\
      \ within the allowed list.\n\n#### Aggregate-Level Functions\n- `.hasSize(assertion)`:\
      \ Row count matches assertion (e.g., `lambda x: x > 0`).\n- `.isUnique(column)`:\
      \ Column values are strictly unique.\n- `.hasUniqueness(columns, assertion)`:\
      \ Uniqueness ratio meets threshold.\n- `.hasDistinctness(columns, assertion)`:\
      \ Ratio of distinct values to total rows meets threshold.\n- `.hasMin(column,\
      \ assertion)`: Minimum numeric value meets assertion (e.g., `lambda x: x >=\
      \ 0`).\n- `.hasMax(column, assertion)`: Maximum numeric value meets assertion.\n\
      - `.hasMean(column, assertion)`: Mean value meets assertion.\n- `.hasStandardDeviation(column,\
      \ assertion)`: Standard deviation meets assertion.\n\n---\n\n### Output Format\n\
      \nRespond strictly with a JSON list matching the following schema:\n\n```json\n\
      [\n  {\n    \"column_group\": \"ColumnName\",\n    \"assumptions\": [\n    \
      \  {\n        \"text\": \"Detailed description of the assumption.\",\n     \
      \   \"sources\": [\n          {\"start_line\": 20, \"end_line\": 25}\n     \
      \   ]\n      }\n    ],\n    \"code\": [\n      {\n        \"suggestion\": \"\
      .isComplete('ColumnName')\",\n        \"level\": \"error\",\n        \"linked_assumptions\"\
      : [0]\n      },\n      {\n        \"suggestion\": \".hasDataType('ColumnName',\
      \ ConstrainableDataTypes.Integral)\",\n        \"level\": \"error\",\n     \
      \   \"linked_assumptions\": [0]\n      }\n    ]\n  }\n]\n```"
