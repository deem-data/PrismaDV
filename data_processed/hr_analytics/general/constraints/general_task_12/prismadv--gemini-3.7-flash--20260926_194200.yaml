  '["Department","JobRole"]':
    code: []
    assumptions:
    - text: 'Each ''JobRole'' should be consistently associated with its valid corresponding
        ''Department'' (for example, ''Sales Executive'', ''Sales Representative'',
        and ''Healthcare Representative'' in ''Sales''; ''Research Scientist'', ''Laboratory
        Technician'', ''Research Director'', and ''Manufacturing Director'' in ''Research
        & Development''; and ''Human Resources'' in ''Human Resources''). We can express
        this constraint using Deequ''s satisfies or compliance rule: `satisfies("CASE
        WHEN JobRole IN (''Sales Executive'', ''Sales Representative'', ''Healthcare
        Representative'') THEN Department = ''Sales'' WHEN JobRole IN (''Research
        Scientist'', ''Laboratory Technician'', ''Research Director'', ''Manufacturing
        Director'') THEN Department = ''Research & Development'' WHEN JobRole = ''Human
        Resources'' THEN Department = ''Human Resources'' ELSE true END", ''ValidRoleDepartmentMapping'')`.'
