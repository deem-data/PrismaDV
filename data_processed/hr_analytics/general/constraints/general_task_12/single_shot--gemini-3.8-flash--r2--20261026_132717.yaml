constraints:
  Age:
    code:
    - - .satisfies('Age >= 18', 'age_guard_adult')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    - - .satisfies('JobLevel >= 1 AND JobLevel <= 5', 'job_level_range')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    - - .isContainedIn('JobRole', ['Sales Executive', 'Sales Representative', 'Healthcare
        Representative', 'Research Scientist', 'Laboratory Technician', 'Research
        Director', 'Manufacturing Director', 'Manager', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: JobRole
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('PerformanceRating >= 1 AND PerformanceRating <= 4', 'performance_rating_range')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'company_tenure_le_career_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .isNonNegative('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role_tenure_le_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda c: c >= 0.95)'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
