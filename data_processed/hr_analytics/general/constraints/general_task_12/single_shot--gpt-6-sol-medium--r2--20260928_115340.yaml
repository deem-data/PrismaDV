constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age BETWEEN 18 AND 60', 'valid_age_range')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age > 55 AND
        AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel').satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Sales Executive', 'Sales
        Representative', 'Healthcare Representative', 'Research Scientist', 'Laboratory
        Technician', 'Research Director', 'Manufacturing Director', 'Human Resources',
        'Manager'])
      - Valid
    assumptions: []
    column_name: JobRole
  JobRole, Department:
    code:
    - - .satisfies("(JobRole IN ('Sales Executive', 'Sales Representative') AND Department
        = 'Sales') OR (JobRole IN ('Healthcare Representative', 'Research Scientist',
        'Laboratory Technician', 'Research Director', 'Manufacturing Director') AND
        Department = 'Research & Development') OR (JobRole = 'Human Resources' AND
        Department = 'Human Resources') OR JobRole = 'Manager'", 'role_matches_department')
      - Valid
    assumptions: []
    column_name: JobRole, Department
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
        > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears, YearsAtCompany, YearsInCurrentRole, YearsSinceLastPromotion, YearsWithCurrManager:
    code:
    - - .satisfies('TotalWorkingYears >= 0 AND YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears AND YearsInCurrentRole >= 0 AND YearsInCurrentRole <=
        YearsAtCompany AND YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion
        <= YearsAtCompany AND (YearsWithCurrManager IS NULL OR (YearsWithCurrManager
        >= 0 AND YearsWithCurrManager <= YearsAtCompany))', 'consistent_tenure')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears, YearsAtCompany, YearsInCurrentRole, YearsSinceLastPromotion,
      YearsWithCurrManager
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.95)'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
