        \n    csv_path = TABLES_DIR / f\"{args.table}.csv\"\n    if not csv_path.exists():\n\
        \        available = sorted(p.stem for p in TABLES_DIR.glob(\"*.csv\"))\n\
        \        print(f\"no such table: {args.table}. available: {available}\")\n\
        \        return 2\n\n    codes = load_codes(Path(args.constraints))\n    if\
        \ not codes:\n        print(\"no constraint code found in the given file\"\
        )\n        return 2\n\n    dataframe = pd.read_csv(csv_path)\n    manager\
        \ = DeequDataQualityManager()\n    spark_df, spark = manager.spark_df_from_pandas_df(dataframe,\
        \ spark_session=build_spark())\n    results = manager.validate_constraints_with_reasons(spark,\
        \ spark_df, codes, isolated_check=True)\n\n    held = 0\n    for code, (is_valid,\
        \ reason) in zip(codes, results):\n        held += int(bool(is_valid))\n \
        \       print(f\"[{'HOLDS' if is_valid else 'FAILS'}] {code}\")\n        if\
        \ not is_valid:\n            print(f\"          reason: {reason}\")\n    print(f\"\
