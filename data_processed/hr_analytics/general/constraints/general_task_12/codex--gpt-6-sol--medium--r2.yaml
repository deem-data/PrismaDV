        \                else:\n                    codes.append(item.get(\"code_for_constraint\"\
        ) or item.get(\"suggestion\"))\n            return [code for code in codes\
        \ if code]\n    codes = []\n    for line in text.splitlines():\n        line\
        \ = line.strip()\n        if not line or line.startswith(\"#\"):\n       \
        \     continue\n        codes.append(line)\n    return codes\n\n\ndef main()\
        \ -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n   \
        \ parser.add_argument(\"--table\", required=True, help=\"Table name (file\
        \ stem under data/tables).\")\n    parser.add_argument(\"--constraints\",\
