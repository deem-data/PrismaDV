        from prismadv.dq_manager import DeequDataQualityManager  # noqa: E402\n\n\
        HERE = Path(__file__).resolve().parent\nTABLES_DIR = HERE / \"data\" / \"\
        tables\"\nJARS_FILE = HERE / \"deequ_jars.txt\"\n\n\ndef build_spark():\n\
        \    \"\"\"A Spark session whose Deequ classpath is pinned to already-resolved\
        \ jars.\n\n    The default session config asks Spark to fetch `spark.jars.packages`\
        \ through\n    Ivy. That cannot work here: Ivy writes its resolution cache\
