constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age >= 18', 'AgeRangeGuard')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel').isContainedIn('JobLevel', ['1', '2', '3', '4', '5'])
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Sales Executive', 'Sales
        Representative', 'Healthcare Representative', 'Research Scientist', 'Laboratory
        Technician', 'Research Director', 'Manufacturing Director', 'Manager', 'Human
        Resources'])
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').isContainedIn('PerformanceRating', ['3',
        '4'])
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').isNonNegative('TotalWorkingYears').satisfies('YearsAtCompany
        <= TotalWorkingYears', 'CompanyTenureLTETotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').isNonNegative('YearsAtCompany').satisfies('YearsInCurrentRole
        <= YearsAtCompany', 'RoleTenureLTECompanyTenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').isNonNegative('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').isNonNegative('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.95).satisfies(''YearsWithCurrManager
        IS NULL OR YearsWithCurrManager >= 0'', ''YearsWithCurrManagerNonNegative'')'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
