constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age >= 18', 'age_in_supported_range')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .satisfies("AgeGroup = CASE WHEN Age <= 25 THEN '18-25' WHEN Age <= 35 THEN
        '26-35' WHEN Age <= 45 THEN '36-45' WHEN Age <= 55 THEN '46-55' ELSE '55+'
        END", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    - - .satisfies("(JobRole IN ('Sales Executive', 'Sales Representative') AND Department
        = 'Sales') OR (JobRole IN ('Healthcare Representative', 'Research Scientist',
        'Laboratory Technician', 'Research Director', 'Manufacturing Director') AND
        Department = 'Research & Development') OR (JobRole = 'Human Resources' AND
        Department = 'Human Resources') OR (JobRole = 'Manager' AND Department IN
        ('Sales', 'Research & Development', 'Human Resources'))", 'role_matches_department')
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .satisfies("SalarySlab = CASE WHEN MonthlyIncome <= 5000 THEN 'Upto 5k' WHEN
        MonthlyIncome <= 10000 THEN '5k-10k' WHEN MonthlyIncome <= 15000 THEN '10k-15k'
        ELSE '15k+' END", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany AND YearsSinceLastPromotion
        <= YearsAtCompany AND YearsAtCompany <= TotalWorkingYears', 'tenure_relationships')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .isNonNegative('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.95)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'manager_tenure_relationship')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
