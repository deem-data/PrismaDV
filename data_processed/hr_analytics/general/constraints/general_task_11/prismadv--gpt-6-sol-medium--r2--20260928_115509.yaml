    assumptions:
    - text: PerformanceRating, JobLevel, YearsInCurrentRole, YearsSinceLastPromotion,
        and MonthlyIncome should all be non-null for each employee. The script uses
        them together to determine promotion eligibility and calculate compensation
        amounts. This can be checked with a row-level constraint requiring all five
        columns to be non-null.
      sources:
      - start_line: 43
        end_line: 56
        file: ''
      uid: 75ed78c1-38e8-4c50-a2c0-39d82141982d
    - text: 'Each employee''s PerformanceRating should be either 3 or 4, and JobLevel
        should be between 1 and 5. These are the joint input domains covered by the
        merit-guideline and promotion-raise mappings. For example: .satisfies("PerformanceRating
