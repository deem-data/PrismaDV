        4, YearsInCurrentRole >= 2, YearsSinceLastPromotion >= 1, and JobLevel BETWEEN
        1 AND 4 to MonthlyIncome > 0.
      sources:
      - start_line: 46
        end_line: 56
        file: ''
      uid: 6f589721-65bb-416f-9172-9b1369c8cb45
