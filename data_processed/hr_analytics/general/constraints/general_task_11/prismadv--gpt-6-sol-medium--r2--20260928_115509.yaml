    assumptions:
    - text: Every employee record included in the department budget should have a
        non-null Department, EmpID, and MonthlyIncome. Otherwise, grouping may omit
        the record, or the department's EmpID headcount and MonthlyIncome base-pay
        sum may describe different sets of employees. This can be checked with a row-level
        constraint requiring all three columns to be non-null.
      sources:
      - start_line: 68
        end_line: 70
        file: ''
      uid: 865d9234-e197-481e-875e-e6aec29ee6e6
    - text: For each record counted through EmpID in a Department, MonthlyIncome should
        be greater than zero, so the department's base-pay sum represents pay for
        its counted employees. This can be checked with a constraint such as `Department
        IS NOT NULL AND EmpID IS NOT NULL AND MonthlyIncome > 0`.
      sources:
      - start_line: 68
        end_line: 70
        file: ''
      uid: 33f2d2cc-b877-4707-842f-12f878387bf4
    - text: An EmpID should be associated with no more than one Department in the
        input; otherwise, the same employee can contribute to multiple department
        budgets. This can be checked by requiring `COUNT(DISTINCT Department) <= 1`
        for each EmpID. This does not assume EmpID is unique across rows.
      sources:
      - start_line: 68
        end_line: 75
        file: ''
      uid: 50021eca-d2d8-433c-a7a8-6f241d97d1e7
