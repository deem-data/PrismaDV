  \ '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 468,\
  \ 'Department': 'Research & Development', 'DistanceFromHome': 28, 'Education': 4,\
  \ 'EducationField': 'Medical', 'EmployeeCount': 1, 'EmployeeNumber': 2054, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Female', 'HourlyRate': 73, 'JobInvolvement': 2, 'JobLevel': 1, 'JobRole':\
