prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\nos.makedirs(args.output, exist_ok=True)\n\ndf = pd.read_csv(input_csv)\n\
  \n# Normalize BusinessTravel values used downstream\ntravel_map = {\n    'TravelRarely':\
  \ 'Travel_Rarely',\n    'Travel_Rarely': 'Travel_Rarely',\n    'Travel_Frequently':\
  \ 'Travel_Frequently',\n    'Non-Travel': 'Non-Travel'\n}\ndf['BusinessTravel']\
  \ = df['BusinessTravel'].map(lambda x: travel_map.get(x, x))\ndf = df.set_index('EmployeeNumber',\
  \ drop=False)\n# Merit guideline by performance\nperf_guideline_pct = {3: 0.12,\
  \ 4: 0.18}\ndf['perf_guideline_pct'] = df['PerformanceRating'].map(perf_guideline_pct)\n\
  \n# Cap by salary slab\nslab_cap_pct = {'Upto 5k': 0.20, '5k-10k': 0.18, '10k-15k':\
  \ 0.15, '15k+': 0.12}\ndf['slab_cap_pct'] = df['SalarySlab'].map(slab_cap_pct)\n\
  \n# Multipliers that depend on normalized categorical assumptions\ndf['age_weight']\
  \ = np.where(df['AgeGroup'] == '26-35', 1.02, 1.00)\ntravel_multiplier_map = {'Travel_Frequently':\
  \ 1.01, 'Travel_Rarely': 1.00, 'Non-Travel': 1.00}\ndf['travel_multiplier'] = df['BusinessTravel'].map(travel_multiplier_map)\n\
  \n# Proposed merit percent and amount\nbase_merit_pct = np.minimum(df['perf_guideline_pct'],\
  \ df['PercentSalaryHike'] / 100.0)\nadjusted_merit_pct = base_merit_pct * df['age_weight']\
  \ * df['travel_multiplier']\ndf['proposed_merit_pct'] = np.minimum(adjusted_merit_pct,\
  \ df['slab_cap_pct'])\ndf['proposed_merit_amount'] = (df['MonthlyIncome'] * df['proposed_merit_pct']).round(2)\n\
  \n# Promotion eligibility and impact\neligible = (\n        (df['PerformanceRating']\
  \ == 4) &\n        (df['YearsInCurrentRole'] >= 2) &\n        (df['YearsSinceLastPromotion']\
  \ >= 1) &\n        (df['JobLevel'] < 5)\n)\ndf['promotion_eligible'] = eligible\n\
  promo_raise_pct_map = {1: 0.10, 2: 0.08, 3: 0.07, 4: 0.06, 5: 0.0}\ndf['promotion_raise_pct']\
  \ = df['JobLevel'].map(promo_raise_pct_map)\ndf.loc[~df['promotion_eligible'], 'promotion_raise_pct']\
  \ = 0.0\ndf['promotion_amount'] = (df['MonthlyIncome'] * df['promotion_raise_pct']).round(2)\n\
  \n# Supplemental pools that implicitly rely on cohort distribution assumptions\n\
  low_slab_mask = df['SalarySlab'].isin(['Upto 5k', '5k-10k'])\ndf['compression_pool_share']\
  \ = np.where(low_slab_mask, 0.003, 0.0)\ndf['compression_amount'] = (df['MonthlyIncome']\
  \ * df['compression_pool_share']).round(2)\n\nage_26_35_mask = (df['AgeGroup'] ==\
  \ '26-35')\ndf['emerging_talent_supp_pct'] = np.where(age_26_35_mask, 0.005, 0.0)\n\
  df['emerging_talent_amount'] = (df['MonthlyIncome'] * df['emerging_talent_supp_pct']).round(2)\n\
  \n# Department-level budgets\nagg = df.groupby('Department').agg(\n    headcount=('EmpID',\
  \ 'count'),\n    base_pay=('MonthlyIncome', 'sum'),\n    merit_pool=('proposed_merit_amount',\
  \ 'sum'),\n    promotion_pool=('promotion_amount', 'sum'),\n    compression_pool=('compression_amount',\
  \ 'sum'),\n    emerging_talent_pool=('emerging_talent_amount', 'sum')\n).reset_index()\n\
  \nagg['total_budget'] = (\n            agg['merit_pool'] + agg['promotion_pool']\
  \ + agg['compression_pool'] + agg['emerging_talent_pool']).round(2)\n\n# Output\
  \ files\nbudgets_out = os.path.join(args.output, 'department_compensation_budgets.csv')\n\
  agg.to_csv(budgets_out, index=False)\n\ndetails_cols = [\n    'EmployeeNumber',\
  \ 'EmpID', 'Department', 'MonthlyIncome', 'SalarySlab', 'PerformanceRating', 'PercentSalaryHike',\n\
  \    'proposed_merit_pct', 'proposed_merit_amount', 'promotion_eligible', 'promotion_raise_pct',\
  \ 'promotion_amount',\n    'BusinessTravel', 'age_weight', 'travel_multiplier',\
  \ 'compression_amount', 'emerging_talent_amount'\n]\nemp_out = os.path.join(args.output,\
  \ 'employee_compensation_proposals.csv')\ndf[details_cols].to_csv(emp_out, index=False)\n\
  \n```\n\nThe same program is on disk at `./code/general_task_11.py`, so you can\
  \ run it against the\nstaged table, step through it, or search it, rather than working\
