constraints:
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  BusinessTravel:
    code:
    - - .isContainedIn('BusinessTravel', ['TravelRarely', 'Travel_Rarely', 'Travel_Frequently',
        'Non-Travel'])
      - Valid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  JobLevel:
    code:
    - - .satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - .satisfies('MonthlyIncome > 0', 'positive_monthly_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PercentSalaryHike:
    code:
    - - .satisfies('PercentSalaryHike BETWEEN 0 AND 100', 'valid_salary_hike_percent')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .satisfies('PerformanceRating IN (3, 4)', 'mapped_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  YearsInCurrentRole:
    code:
    - - .satisfies('YearsInCurrentRole >= 0', 'nonnegative_years_in_current_role')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion >= 0', 'nonnegative_years_since_last_promotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
