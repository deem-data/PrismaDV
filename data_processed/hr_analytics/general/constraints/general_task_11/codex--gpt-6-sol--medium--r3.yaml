  \ 2, 'WorkLifeBalance': 4, 'YearsAtCompany': 20, 'YearsSinceLastPromotion': 5, 'YearsWithCurrManager':\
  \ 6.0, 'YearsInCurrentRole': 17}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
