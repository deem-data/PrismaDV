        end_line: 32
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      - start_line: 59
        end_line: 61
        file: ''
      uid: dbf3a865-5957-49b4-8cd6-cf260d63d690
    - text: For every employee included in the merit calculation, PerformanceRating
        should be either 3 or 4, PercentSalaryHike should be a nonnegative percentage
        no greater than 100, and MonthlyIncome should be positive. These fields are
        used together to calculate a monetary merit proposal; an unmapped rating or
        invalid pay input would produce a missing or nonsensical amount.
