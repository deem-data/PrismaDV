    assumptions:
    - text: 'Each employee''s SalarySlab should agree with MonthlyIncome: ''Upto 5k''
        for income at or below 5000, ''5k-10k'' for income above 5000 and at or below
        10000, ''10k-15k'' for income above 10000 and at or below 15000, and ''15k+''
        for income above 15000. Otherwise, the merit cap and compression allocation
        may be applied to the wrong employee.'
      sources:
