      - start_line: 27
        end_line: 28
        file: ''
      - start_line: 40
        end_line: 43
        file: ''
      uid: a391dac2-ce4a-4cf0-bb2c-5b82f880d2f1
    - text: Each employee should have both a recognized AgeGroup ('18-25', '26-35',
        '36-45', '46-55', or '55+') and a BusinessTravel value that normalizes to
        'Travel_Frequently', 'Travel_Rarely', or 'Non-Travel'. Both fields contribute
        multipliers to the same merit calculation; an unrecognized travel value yields
        a missing multiplier.
      sources:
