    - text: Every employee record should have both 'EmployeeNumber' and 'EmpID'. 'EmployeeNumber'
        is retained as the index and written to the employee-level output, while 'EmpID'
        is counted for departmental headcount. A row missing either identifier could
        therefore appear in one part of the output but not be represented correctly
        in the other. Validate that both columns are non-null on every row.
