    - text: "Attrition should be either 'Yes' or 'No' for every row included in a\
        \ Department\u2013JobRole group. Other values would contribute to headcount\
        \ but be counted neither as attrition nor as active employees for the budget.\
        \ Check that Department IS NULL OR JobRole IS NULL OR Attrition IN ('Yes',\
