    assumptions:
    - text: Every record should have both a non-null 'Department' and a non-null 'JobRole'.
        The groupby operation drops records with a null in either column, which would
        omit them from the planning output. This can be checked with .satisfies("Department
        IS NOT NULL AND JobRole IS NOT NULL", "department_role_present").
