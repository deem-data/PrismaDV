    assumptions:
    - text: "Each employee\u2019s JobRole should be compatible with their Department:\
        \ 'Sales Representative' and 'Sales Executive' belong to 'Sales'; 'Human Resources'\
        \ belongs to 'Human Resources'; 'Research Director', 'Research Scientist',\
        \ 'Manufacturing Director', 'Healthcare Representative', and 'Laboratory Technician'\
        \ belong to 'Research & Development'. 'Manager' may occur in any of the three\
        \ departments. This can be checked as a row-level conditional constraint on\
        \ Department and JobRole."
      sources:
      - start_line: 70
        end_line: 75
        file: ''
      uid: c1931490-7f0f-475c-be3b-cefe93176bd4
    - text: For every (Department, JobRole) group, EmployeeCount should equal 1 on
        every row. The script sums EmployeeCount as headcount but counts employees
        with Attrition = 'Yes' by row; unit counts ensure that attrition_count / headcount
        is an employee attrition rate between 0 and 1.
      sources:
      - start_line: 70
        end_line: 75
        file: ''
      uid: ba1794c1-b2a7-4cf1-ac7f-8f7d8b1ee717
    - text: "For each row included in a (Department, JobRole) group, Attrition should\
        \ be either 'Yes' or 'No'. These are the only values the script recognizes\
        \ when counting attrition and allocating active employees\u2019 compensation;\
        \ other values would enter headcount without being classified in either calculation."
      sources:
      - start_line: 67
        end_line: 75
        file: ''
      uid: 5fdf7485-9846-412b-b534-03587688a4c5
  '["Department","JobRole"]':
