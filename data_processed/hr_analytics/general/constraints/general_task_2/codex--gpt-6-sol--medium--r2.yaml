prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_file = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\n    # Coerce numeric columns\n\
  \    numeric_cols = [\n        'MonthlyIncome', 'PercentSalaryHike', 'JobLevel',\
  \ 'EmployeeNumber', 'EmployeeCount', 'StandardHours', 'Age',\n        'YearsAtCompany',\
  \ 'YearsInCurrentRole', 'YearsWithCurrManager', 'YearsSinceLastPromotion', 'TotalWorkingYears',\n\
  \        'PerformanceRating'\n    ]\n    for c in numeric_cols:\n        if c in\
  \ df.columns:\n            df[c] = pd.to_numeric(df[c], errors='coerce')\n    #\
  \ Use EmpID as stable index for downstream logic that assumes 1:1 mapping\n    df\
  \ = df.set_index('EmpID', drop=False)\n    df['BusinessTravel'] = df['BusinessTravel'].replace({'TravelRarely':\
  \ 'Travel_Rarely'})\n    # Compensation modeling components\n    benefits_rate_map\
  \ = {'18-25': 0.25, '26-35': 0.28, '36-45': 0.30, '46-55': 0.33, '55+': 0.35}\n\
  \    df['benefits_rate'] = df['AgeGroup'].map(benefits_rate_map).astype(float)\n\
  \n    travel_premium_map = {'Non-Travel': 0.00, 'Travel_Rarely': 0.02, 'Travel_Frequently':\
  \ 0.05}\n    df['travel_premium'] = df['BusinessTravel'].map(travel_premium_map).astype(float)\n\
  \n    overtime_premium_map = {'No': 0.0, 'Yes': 0.10}\n    df['overtime_premium']\
  \ = df['OverTime'].map(overtime_premium_map).astype(float)\n\n    slab_premium_map\
  \ = {'Upto 5k': 0.00, '5k-10k': 0.02, '10k-15k': 0.04, '15k+': 0.06}\n    df['slab_premium']\
  \ = df['SalarySlab'].map(slab_premium_map).astype(float)\n\n    df['joblevel_adj']\
  \ = 0.005 * (df['JobLevel'] - 1).astype(float)\n\n    df['manager_adj'] = np.where(df['YearsWithCurrManager'].fillna(0)\
  \ < 1, 0.01, 0.0)\n\n    df['fte'] = df['StandardHours'] / 80.0\n\n    df['adj_income']\
  \ = df['MonthlyIncome'] * (1.0 + df['PercentSalaryHike'] / 100.0)\n\n    df['monthly_comp_w_overheads']\
  \ = (\n            df['adj_income'] * (\n            1.0\n            + df['benefits_rate']\n\
  \            + df['travel_premium']\n            + df['overtime_premium']\n    \
  \        + df['slab_premium']\n            + df['joblevel_adj']\n            + df['manager_adj']\n\
  \    ) * df['fte']\n    )\n\n    df['quarterly_comp'] = df['monthly_comp_w_overheads']\
  \ * 3.0\n\n    # Active employees budget only\n    df['active_quarterly_comp'] =\
  \ np.where(df['Attrition'] == 'No', df['quarterly_comp'], 0.0)\n\n    # Group-level\
  \ metrics\n    grouped = df.groupby(['Department', 'JobRole'], as_index=False).agg(\n\
  \        headcount=('EmployeeCount', 'sum'),\n        attrition_count=('Attrition',\
  \ lambda s: (s == 'Yes').sum()),\n        quarterly_budget=('active_quarterly_comp',\
  \ 'sum')\n    )\n    grouped['attrition_rate'] = grouped['attrition_count'] / grouped['headcount']\n\
  \n    out_path = os.path.join(args.output, 'dept_role_quarterly_planning.csv')\n\
  \    grouped.to_csv(out_path, index=False)\n\n\nif __name__ == '__main__':\n   \
  \ main()\n\n```\n\nThe same program is on disk at `./code/general_task_2.py`, so\
  \ you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 505, 'EmpID': 'RM1351', 'Age': 27,\
  \ 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate':\
  \ 511, 'Department': 'Sales', 'DistanceFromHome': 2, 'Education': 2, 'EducationField':\
  \ 'Medical', 'EmployeeCount': 1, 'EmployeeNumber': 1898, 'EnvironmentSatisfaction':\
  \ 1, 'Gender': 'Female', 'HourlyRate': 89, 'JobInvolvement': 4, 'JobLevel': 2, 'JobRole':\
  \ 'Sales Executive', 'JobSatisfaction': 3, 'MaritalStatus': 'Single', 'MonthlyIncome':\
  \ 6500, 'SalarySlab': '5k-10k', 'MonthlyRate': 26997, 'NumCompaniesWorked': 0, 'Over18':\
  \ 'Y', 'OverTime': 'No', 'PercentSalaryHike': 14, 'PerformanceRating': 3, 'RelationshipSatisfaction':\
  \ 2, 'StandardHours': 80, 'StockOptionLevel': 0, 'TotalWorkingYears': 9, 'TrainingTimesLastYear':\
  \ 5, 'WorkLifeBalance': 2, 'YearsAtCompany': 8, 'YearsSinceLastPromotion': 0, 'YearsWithCurrManager':\
  \ 7.0, 'YearsInCurrentRole': 7}, {'id': 311, 'EmpID': 'RM125', 'Age': 31, 'AgeGroup':\
  \ '26-35', 'Attrition': 'Yes', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 249,\
  \ 'Department': 'Sales', 'DistanceFromHome': 6, 'Education': 4, 'EducationField':\
  \ 'Life Sciences', 'EmployeeCount': 1, 'EmployeeNumber': 163, 'EnvironmentSatisfaction':\
  \ 2, 'Gender': 'Male', 'HourlyRate': 76, 'JobInvolvement': 1, 'JobLevel': 2, 'JobRole':\
  \ 'Sales Executive', 'JobSatisfaction': 3, 'MaritalStatus': 'Married', 'MonthlyIncome':\
  \ 6172, 'SalarySlab': '5k-10k', 'MonthlyRate': 20739, 'NumCompaniesWorked': 4, 'Over18':\
  \ 'Y', 'OverTime': 'Yes', 'PercentSalaryHike': 18, 'PerformanceRating': 3, 'RelationshipSatisfaction':\
  \ 2, 'StandardHours': 80, 'StockOptionLevel': 0, 'TotalWorkingYears': 12, 'TrainingTimesLastYear':\
  \ 3, 'WorkLifeBalance': 2, 'YearsAtCompany': 7, 'YearsSinceLastPromotion': 7, 'YearsWithCurrManager':\
  \ 7.0, 'YearsInCurrentRole': 7}, {'id': 465, 'EmpID': 'RM594', 'Age': 36, 'AgeGroup':\
  \ '36-45', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 676,\
  \ 'Department': 'Research & Development', 'DistanceFromHome': 1, 'Education': 3,\
  \ 'EducationField': 'Other', 'EmployeeCount': 1, 'EmployeeNumber': 823, 'EnvironmentSatisfaction':\
  \ 3, 'Gender': 'Female', 'HourlyRate': 35, 'JobInvolvement': 3, 'JobLevel': 2, 'JobRole':\
  \ 'Manufacturing Director', 'JobSatisfaction': 2, 'MaritalStatus': 'Married', 'MonthlyIncome':\
  \ 5228, 'SalarySlab': '5k-10k', 'MonthlyRate': 23361, 'NumCompaniesWorked': 0, 'Over18':\
