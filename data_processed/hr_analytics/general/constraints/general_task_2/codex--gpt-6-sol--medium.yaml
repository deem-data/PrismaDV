  \ 'Y', 'OverTime': 'No', 'PercentSalaryHike': 14, 'PerformanceRating': 3, 'RelationshipSatisfaction':\
  \ 2, 'StandardHours': 80, 'StockOptionLevel': 0, 'TotalWorkingYears': 5, 'TrainingTimesLastYear':\
  \ 3, 'WorkLifeBalance': 1, 'YearsAtCompany': 5, 'YearsSinceLastPromotion': 0, 'YearsWithCurrManager':\
  \ 4.0, 'YearsInCurrentRole': 4}, {'id': 224, 'EmpID': 'RM876', 'Age': 44, 'AgeGroup':\
  \ '36-45', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 200,\
  \ 'Department': 'Research & Development', 'DistanceFromHome': 29, 'Education': 4,\
  \ 'EducationField': 'Other', 'EmployeeCount': 1, 'EmployeeNumber': 1225, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Male', 'HourlyRate': 32, 'JobInvolvement': 3, 'JobLevel': 2, 'JobRole':\
  \ 'Research Scientist', 'JobSatisfaction': 4, 'MaritalStatus': 'Single', 'MonthlyIncome':\
  \ 4541, 'SalarySlab': 'Upto 5k', 'MonthlyRate': 7744, 'NumCompaniesWorked': 1, 'Over18':\
