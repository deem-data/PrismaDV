  \ 2, 'StandardHours': 80, 'StockOptionLevel': 0, 'TotalWorkingYears': 20, 'TrainingTimesLastYear':\
  \ 3, 'WorkLifeBalance': 3, 'YearsAtCompany': 20, 'YearsSinceLastPromotion': 13,\
  \ 'YearsWithCurrManager': 17.0, 'YearsInCurrentRole': 11}, {'id': 543, 'EmpID':\
  \ 'RM1116', 'Age': 34, 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel':\
  \ 'Travel_Rarely', 'DailyRate': 479, 'Department': 'Research & Development', 'DistanceFromHome':\
  \ 7, 'Education': 4, 'EducationField': 'Medical', 'EmployeeCount': 1, 'EmployeeNumber':\
  \ 1577, 'EnvironmentSatisfaction': 1, 'Gender': 'Male', 'HourlyRate': 35, 'JobInvolvement':\
  \ 3, 'JobLevel': 1, 'JobRole': 'Research Scientist', 'JobSatisfaction': 4, 'MaritalStatus':\
  \ 'Single', 'MonthlyIncome': 2972, 'SalarySlab': 'Upto 5k', 'MonthlyRate': 22061,\
  \ 'NumCompaniesWorked': 1, 'Over18': 'Y', 'OverTime': 'No', 'PercentSalaryHike':\
