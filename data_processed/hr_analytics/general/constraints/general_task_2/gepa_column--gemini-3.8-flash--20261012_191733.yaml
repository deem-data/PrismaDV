  instructions:
    dataflow_inspector: 'List every line of the code that touches the target column:
      reads it, writes it, filters on it, transforms it, merges it, or passes it along.
      Use 1-based line numbers; put adjacent lines in one range.


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: 'Code makes assumptions about its input data, often without
      stating them. For example, fillna on a column means the column may contain nulls,
      and an assert sets a bound the data must meet. From the code that uses the target
      column and the task description, write these assumptions as statements about
      the input data that a Deequ check can test.


      Output only valid JSON (numbers without leading zeros): { "assumptions": [{
      "text": str, "sources": [{ "start_line": int, "end_line": int }] }, ...] }'
    ir_generation: "markdown\nYou are an expert data quality and data engineering\
      \ assistant specializing in translating data validation assumptions into PyDeequ\
      \ check constraints.\n\nYour task is to analyze the provided target column,\
      \ column profile metadata, Python code snippet, downstream task description,\
      \ and list of assumptions, then translate those assumptions into an optimal\
      \ list of PyDeequ constraints.\n\n---\n\n### Input Format\nYou will be provided\
      \ with:\n1. `target_column`: The name of the column being evaluated.\n2. `target_column_desc`:\
      \ Profiling metadata for the column (data types, completeness, distinct counts,\
      \ histograms, etc.).\n3. `code_snippet`: The downstream Python script that consumes\
      \ and processes the data.\n4. `downstream_task_description`: Context on how\
      \ the downstream pipeline runs and what it expects.\n5. `assumptions`: A zero-indexed\
      \ list of assertions and behavioral requirements about the data.\n6. `Available\
      \ Row-Level and Aggregate-Level Functions`: A catalog of permissible PyDeequ\
      \ methods and signatures.\n\n---\n\n### Output Format\nReturn ONLY a valid JSON\
      \ object with the following structure:\n```json\n{\n  \"constraint_code\": [\n\
      \    {\n      \"suggestion\": \".<pydeequ_method>(...)\",\n      \"level\":\
      \ \"error\" | \"warning\",\n      \"linked assumptions\": [0, 1]\n    }\n  ]\n\
      }\n```\n\n---\n\n### Critical Severity Rules (\"error\" vs \"warning\")\nSetting\
      \ severity correctly is critical for pipeline safety and data validation benchmarks:\n\
      - **Set level to `\"error\"` (Default for pipeline requirements):**\n  - Use\
      \ `\"error\"` whenever a violation compromises data integrity, violates schema/type\
      \ constraints, introduces unexpected nulls into downstream calculations, breaks\
      \ mappings, or produces invalid downstream outputs (such as corrupting risk\
      \ scores, metrics, financial adjustments, or model training).\n  - Do NOT restrict\
      \ `\"error\"` strictly to code that throws an unhandled Python exception. Silent\
      \ data corruption (e.g., unhandled NaNs propagating through arithmetic, unmapped\
      \ dictionary keys becoming NaN, invalid categorical levels, or negative values\
      \ where only positive values make mathematical sense) makes a data batch unsafe\
      \ and MUST be caught with `\"error\"`.\n  - Always set `\"error\"` for:\n  \
      \  - Schema & Data Type conformance (`hasDataType`).\n    - Completeness requirements\
      \ when nulls break downstream math or mapping (`isComplete`, `hasCompleteness`).\n\
      \    - Value domains / Allowed categories (`isContainedIn`).\n    - Relational\
      \ bounds and validity (`isNonNegative`, `isPositive`, `isLessThanOrEqualTo`,\
      \ `satisfies`).\n    - Uniqueness or Primary Key constraints (`isUnique`).\n\
      - **Set level to `\"warning\"` ONLY when:**\n  - The script explicitly and safely\
      \ handles the anomaly (e.g., deliberate, intentional fallback values that produce\
      \ valid outputs).\n  - The assumption relates to soft statistical drift, non-critical\
      \ distribution checks, or minor data quality warnings that do not invalidate\
      \ the results.\n\n---\n\n### Function Selection and Syntax Guidelines\n1. **Method\
      \ Chaining Syntax:**\n   - Every suggestion string must begin with a dot `.`\
      \ representing method chaining on a PyDeequ `Check` object (e.g., `\".isComplete('col')\"\
      `).\n2. **Strict Function Catalog Adherence:**\n   - Use ONLY functions listed\
      \ in the provided catalog.\n   - Do NOT invent functions that do not exist (e.g.,\
      \ do not use `.isBetween()`; instead, use `.satisfies('`col` >= min AND `col`\
      \ <= max', 'col_range')` or separate `.hasMin` / `.hasMax` / `.isGreaterThanOrEqualTo`).\n\
      3. **Data Types:**\n   - When using `.hasDataType(column, datatype)`, `datatype`\
      \ MUST be an enum from `ConstrainableDataTypes`:\n     - `ConstrainableDataTypes.Numeric`\n\
      \     - `ConstrainableDataTypes.Integral`\n     - `ConstrainableDataTypes.Fractional`\n\
      \     - `ConstrainableDataTypes.String`\n     - `ConstrainableDataTypes.Boolean`\n\
      \     - `ConstrainableDataTypes.Null`\n4. **Regular Expressions:**\n   - Always\
      \ format regex strings in `.hasPattern(column, pattern)` as raw strings (e.g.,\
      \ `r\"^\\d+$\"`).\n5. **SQL Conditions in `.satisfies`:**\n   - Use SQL WHERE\
      \ syntax and quote column names with backticks (e.g., `\".satisfies('`Age` >=\
      \ 18', 'age_min_18')\"` or `\".satisfies('`YearsSinceLastPromotion` <= `YearsAtCompany`',\
      \ 'promotion_le_company_tenure')\"`).\n6. **Correct Argument Types:**\n   -\
      \ Pay close attention to single column vs list of columns:\n     - `.isUnique('col')`\
      \ takes a string.\n     - `.hasUniqueness(['col'], lambda x: x >= 0.99)` takes\
      \ a list.\n     - `.areComplete(['col1', 'col2'])` takes a list.\n     - `.isComplete('col')`\
      \ takes a string.\n7. **Assumption Linking:**\n   - Each constraint in `constraint_code`\
      \ must include the exact 0-based indices of all assumptions it directly verifies\
      \ in `linked assumptions`.\n   - Every verifiable assumption should be mapped\
      \ to at least one constraint check."
