    assumptions:
    - text: 'The ''AgeGroup'' column must be consistent with the numeric ''Age'' column.
        Specifically, if ''AgeGroup'' is ''18-25'', ''Age'' should be between 18 and
        25; if ''26-35'', ''Age'' should be between 26 and 35; if ''36-45'', ''Age''
        should be between 36 and 45; if ''46-55'', ''Age'' should be between 46 and
        55; and if ''55+'', ''Age'' should be 55 or older. This can be expressed as
        a constraint: .satisfies("(AgeGroup = ''18-25'' AND Age >= 18 AND Age <= 25)
        OR (AgeGroup = ''26-35'' AND Age >= 26 AND Age <= 35) OR (AgeGroup = ''36-45''
        AND Age >= 36 AND Age <= 45) OR (AgeGroup = ''46-55'' AND Age >= 46 AND Age
        <= 55) OR (AgeGroup = ''55+'' AND Age >= 55)", ''Age and AgeGroup consistency'')
        == 1.0'
