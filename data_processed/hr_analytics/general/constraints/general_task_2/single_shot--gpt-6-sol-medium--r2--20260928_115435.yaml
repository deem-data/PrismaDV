constraints:
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition').isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  BusinessTravel:
    code:
    - - .isComplete('BusinessTravel').isContainedIn('BusinessTravel', ['Non-Travel',
        'Travel_Rarely', 'TravelRarely', 'Travel_Frequently'])
      - Valid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    - - .isUnique('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeCount:
    code:
    - - .isComplete('EmployeeCount').satisfies('EmployeeCount = 1', 'one_employee_per_row')
      - Valid
    assumptions: []
    column_name: EmployeeCount
  JobLevel:
    code:
    - - .isComplete('JobLevel').satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Research Director', 'Sales
        Representative', 'Research Scientist', 'Manufacturing Director', 'Healthcare
        Representative', 'Sales Executive', 'Manager', 'Human Resources', 'Laboratory
        Technician'])
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike').satisfies('PercentSalaryHike >= 0', 'nonnegative_salary_hike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .isComplete('StandardHours').satisfies('StandardHours = 80', 'standard_hours_is_80')
      - Valid
    assumptions: []
    column_name: StandardHours
  YearsWithCurrManager:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager >= 0', 'nonnegative_manager_tenure_when_present')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
