  \ 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 201, 'Department': 'Research\
  \ & Development', 'DistanceFromHome': 5, 'Education': 3, 'EducationField': 'Technical\
  \ Degree', 'EmployeeCount': 1, 'EmployeeNumber': 197, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Female', 'HourlyRate': 84, 'JobInvolvement': 3, 'JobLevel': 1, 'JobRole':\
  \ 'Research Scientist', 'JobSatisfaction': 1, 'MaritalStatus': 'Divorced', 'MonthlyIncome':\
  \ 3204, 'SalarySlab': 'Upto 5k', 'MonthlyRate': 10415, 'NumCompaniesWorked': 5,\
  \ 'Over18': 'Y', 'OverTime': 'No', 'PercentSalaryHike': 14, 'PerformanceRating':\
  \ 3, 'RelationshipSatisfaction': 4, 'StandardHours': 80, 'StockOptionLevel': 1,\
  \ 'TotalWorkingYears': 8, 'TrainingTimesLastYear': 3, 'WorkLifeBalance': 3, 'YearsAtCompany':\
  \ 3, 'YearsSinceLastPromotion': 2, 'YearsWithCurrManager': nan, 'YearsInCurrentRole':\
  \ 2}, {'id': 337, 'EmpID': 'RM1025', 'Age': 47, 'AgeGroup': '46-55', 'Attrition':\
  \ 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 359, 'Department': 'Research\
  \ & Development', 'DistanceFromHome': 2, 'Education': 4, 'EducationField': 'Medical',\
  \ 'EmployeeCount': 1, 'EmployeeNumber': 1443, 'EnvironmentSatisfaction': 1, 'Gender':\
  \ 'Female', 'HourlyRate': 82, 'JobInvolvement': 3, 'JobLevel': 4, 'JobRole': 'Research\
  \ Director', 'JobSatisfaction': 3, 'MaritalStatus': 'Married', 'MonthlyIncome':\
  \ 17169, 'SalarySlab': '15k+', 'MonthlyRate': 26703, 'NumCompaniesWorked': 3, 'Over18':\
