  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
