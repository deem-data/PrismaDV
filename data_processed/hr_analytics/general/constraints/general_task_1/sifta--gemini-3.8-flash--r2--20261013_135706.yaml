      - Match the exact column name case-sensitively (as a string literal, column
      selection, or attribute).

      - When the target column appears inside a multi-line collection (e.g., `cols
      = [..., ''target_col'', ...]`), include the lines defining that collection variable
      (from the variable assignment through the collection definition) AND the lines
      where that variable is used to index, loop over, or manipulate the dataframe
      (e.g., `df[cols]` or `for c in cols:`).

      - Carefully verify line numbers against the provided script; do not return unrelated
      lines.


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. Analyze how the code uses the target column to identify assumptions\
      \ required for correct execution:\n- Identify critical requirements where violations\
      \ would cause runtime crashes or silent calculation errors (e.g., unmapped dictionary\
      \ keys or missing values propagating NaNs through downstream arithmetic formulas,\
      \ financial/budget metrics, or group aggregations).\n- Defensive code (such\
      \ as np.clip, clip, min, or max) bounds mathematical formulas but does NOT mean\
      \ the code tolerates corrupt data; out-of-domain inputs silently bias calculations.\n\
      - Leverage domain semantics and column descriptions (e.g., HR analytics conventions):\n\
      \  - Physical/logical non-negativity: counts, tenures, durations, ages, and\
      \ monetary amounts (e.g., YearsSinceLastPromotion, YearsAtCompany, TotalWorkingYears,\
      \ MonthlyIncome, Age) must be non-negative (>= 0).\n  - Completeness: if target_column_desc\
      \ indicates completeness is 1.0 (or near 1.0) and the column is loaded, coerced,\
      \ or referenced in the script, assume it must be non-null (isComplete).\n  -\
      \ Rating scales and discrete values: bounded survey ratings (e.g., EnvironmentSatisfaction,\
      \ JobSatisfaction, WorkLifeBalance on 1-4 scale) must fall strictly within their\
      \ valid defined domain [1, 4].\n  - DO NOT invent speculative cross-column relational\
      \ inequalities (such as sub-tenure <= total tenure, or columnA <= columnB) unless\
      \ the code explicitly compares them or computes their difference. In real-world\
      \ data, uncomputed cross-column constraints regularly fail on safe edge cases\
      \ and cause costly false alarms.\n- Distinguish critical requirements from conditions\
      \ the code gracefully tolerates (e.g., non-critical metadata columns with intentional\
      \ business fallback defaults like fillna('Unknown')).\n- Ground assumptions\
      \ in the observed code logic and target column characteristics rather than inventing\
      \ generic data quality rules.\n\nFrom the code that uses the target column and\
      \ the task description, write these assumptions as statements about the input\
      \ data that a Deequ check can test.\n\nOutput only valid JSON (numbers without\
      \ leading zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint severity\
      \ rules:\n- Set level \"error\" if data failing the check represents corrupt\
      \ data that would crash the code OR silently produce incorrect results (e.g.,\
      \ unexpected values or nulls propagating NaNs through mappings and arithmetic\
      \ formulas, corrupted aggregations, negative durations/tenures/ages/incomes,\
      \ or out-of-domain rating scales).\n- CRITICAL REQUIREMENT: For every target\
      \ column, ensure at least one primary constraint (such as `.isComplete()` when\
      \ completeness is 1.0, `.isNonNegative()` for non-negative metrics, or `.isContainedIn()`\
      \ for defined categories/scales) is set to level \"error\". A suite with zero\
      \ error-level checks can never flag an erroneous batch, causing missed errors.\n\
      - Do NOT set speculative cross-column relational checks (e.g., `.isGreaterThanOrEqualTo('colA',\
      \ 'colB')`) to \"error\" unless the code explicitly depends on that relationship\
      \ without fallback; otherwise, safe partitions will be falsely rejected.\n-\
      \ Set level \"warning\" only for secondary conditions that the code tolerates\
      \ without corrupting downstream results (e.g., loose statistical distribution\
      \ drift or intentional fallback defaults).\n\nLink each check to the indices\
      \ (from 0) of the assumptions it tests.\n\nOutput: {\"constraint_code\": [{\"\
      suggestion\": PyDeequ code (starting with \".\" or a function), \"level\": \"\
      warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
