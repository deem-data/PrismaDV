        \ Scientist\", \"Laboratory Technician\", \"Research Director\", \"Manufacturing\
        \ Director\"}\nhr_roles = {\"Human Resources\"}\n# Department share check\
        \ prior to department-weighted metrics\nrd_share = (df[\"Department\"] ==\
        \ \"Research & Development\").mean()\n# ---- Age and AgeGroup integrity used\
        \ for risk segmentation ----\nallowed_age_groups = {\"18-25\", \"26-35\",\
        \ \"36-45\", \"46-55\", \"55+\"}\nage = df[\"Age\"]\nageg = df[\"AgeGroup\"\
        ]\nmajor_groups = df[\"AgeGroup\"].isin([\"26-35\", \"36-45\"]).mean()\n#\
        \ ---- Tenure logical constraints and coverage ----\n# Features derived from\
        \ tenure that depend on constraints above\nexternal_experience = (df[\"TotalWorkingYears\"\
        ] - df[\"YearsAtCompany\"]).clip(lower=0)\ncareer_start_age = df[\"Age\"]\
        \ - df[\"TotalWorkingYears\"]\nmanager_ratio = np.where(df[\"YearsAtCompany\"\
        ] > 0, df[\"YearsWithCurrManager\"].fillna(0) / df[\"YearsAtCompany\"], 1.0)\n\
        manager_ratio = np.clip(manager_ratio, 0.0, 1.0)\n\n# Use square root; requires\
        \ non-negative external_experience\next_exp_signal = np.sqrt(external_experience)\n\
        career_start_signal = (career_start_age - 15).clip(lower=0)\n\n# ---- Performance\
        \ and compensation change checks ----\n# Performance factors for risk scoring\n\
        perf_adj = np.where(df[\"PerformanceRating\"] == 4, 0.95, 1.05)\ncomp_change_norm\
        \ = (25 - df[\"PercentSalaryHike\"]) / 14.0\ncomp_change_norm = np.clip(comp_change_norm,\
        \ 0.0, 2.0)\n\n# ---- Attrition and OverTime distribution checks for calibration\
        \ ----\nattr = (df[\"Attrition\"] == \"Yes\").astype(int)\not_yes = (df[\"\
        OverTime\"] == \"Yes\")\n\noverall_attr_rate = attr.mean()\not_yes_prop =\
        \ ot_yes.mean()\nrate_yes = np.where(ot_yes.sum() > 0, attr[ot_yes].mean(),\
        \ np.nan)\nrate_no = np.where((~ot_yes).sum() > 0, attr[~ot_yes].mean(), np.nan)\n\
        # Calibrate OT multiplier from observed rates\not_multiplier = np.where(ot_yes,\
        \ np.log((rate_yes + 1e-6) / (rate_no + 1e-6)), 0.0)\n\n# ---- Risk scoring\
        \ ----\n# Satisfaction composite (normalized to 0..1 dissatisfaction)\nsatisfaction_cols\
        \ = [\"JobSatisfaction\", \"EnvironmentSatisfaction\", \"WorkLifeBalance\"\
        ]\nsat_mean = df[satisfaction_cols].mean(axis=1)\ndissat = 1.0 - (sat_mean\
        \ - 1.0) / 3.0\n\ndissat = np.clip(dissat, 0.0, 1.0)\n\n# Tenure-related signals\n\
        no_promo_signal = np.where(df[\"YearsAtCompany\"] > 0,\n                 \
        \          df[\"YearsSinceLastPromotion\"] / df[\"YearsAtCompany\"],\n   \
        \                        0.0)\nno_promo_signal = np.clip(no_promo_signal,\
        \ 0.0, 1.0)\n\nrole_stagnation = 1.0 - manager_ratio\n\n# Age weighting\n\
        age_weights = {\n    \"18-25\": 1.10,\n    \"26-35\": 1.00,\n    \"36-45\"\
        : 0.95,\n    \"46-55\": 0.90,\n    \"55+\": 0.88,\n}\nage_w = df[\"AgeGroup\"\
        ].map(age_weights).astype(float)\n\n# Department influence (calibrated with\
        \ R&D majority)\ndept_weight = df[\"Department\"].map({\n    \"Research &\
        \ Development\": 0.0 + np.log(max(rd_share, 1e-6) / 0.60),\n    \"Sales\"\
        : 0.05,\n    \"Human Resources\": 0.02,\n}).astype(float)\n\n# Compensation\
        \ progression signal leveraged from global bands\ncomp_progression_signal\
        \ = progression_index\n\n# Assemble linear score\nintercept = np.log(overall_attr_rate\
        \ / max(1e-6, 1 - overall_attr_rate))\nlinear_score = (\n        intercept\n\
        \        + 0.8 * dissat\n        + 0.6 * no_promo_signal\n        + 0.4 *\
        \ role_stagnation\n        + 0.3 * comp_change_norm\n        + 0.35 * ot_multiplier\n\
        \        + 0.1 * (ext_exp_signal / (ext_exp_signal.max() if ext_exp_signal.max()\
        \ > 0 else 1))\n        + 0.05 * (career_start_signal / (career_start_signal.max()\
        \ if career_start_signal.max() > 0 else 1))\n        + 0.2 * dept_weight\n\
        \        - 0.1 * comp_progression_signal\n)\n\nrisk_score = logistic(linear_score)\
        \ * age_w * perf_adj\nrisk_score = np.clip(risk_score, 0.0, 1.0)\n\n# Build\
        \ attrition risk output\nrisk_out = df[[\"EmpID\", \"EmployeeNumber\", \"\
        Department\", \"JobRole\", \"AgeGroup\", \"OverTime\", \"PerformanceRating\"\
        ,\n               \"PercentSalaryHike\"]].copy()\nrisk_out[\"attrition_risk_score\"\
        ] = risk_score\nrisk_out_path = os.path.join(args.output, \"attrition_risk_scores.csv\"\
        )\nrisk_out.to_csv(risk_out_path, index=False)\n\n# ---- Pay-band audit outputs\
        \ ----\n# Group audit by Department and SalarySlab\nsalary_ok = row_ok\n\n\
        pay_audit = (\n    df.assign(salary_ok=salary_ok)\n    .groupby([\"Department\"\
        , \"SalarySlab\"], observed=False)\n    .agg(\n        headcount=(\"EmpID\"\
        , \"count\"),\n        median_income=(\"MonthlyIncome\", \"median\"),\n  \
