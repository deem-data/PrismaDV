        ] = risk_score\nrisk_out_path = os.path.join(args.output, \"attrition_risk_scores.csv\"\
        )\nrisk_out.to_csv(risk_out_path, index=False)\n\n# ---- Pay-band audit outputs\
        \ ----\n# Group audit by Department and SalarySlab\nsalary_ok = row_ok\n\n\
        pay_audit = (\n    df.assign(salary_ok=salary_ok)\n    .groupby([\"Department\"\
        , \"SalarySlab\"], observed=False)\n    .agg(\n        headcount=(\"EmpID\"\
        , \"count\"),\n        median_income=(\"MonthlyIncome\", \"median\"),\n  \
        \      min_income=(\"MonthlyIncome\", \"min\"),\n        max_income=(\"MonthlyIncome\"\
        , \"max\"),\n        pct_in_range=(\"salary_ok\", \"mean\"),\n    )\n    .reset_index()\n\
        )\n\n# Add global band progression index so auditors can compare progression\
        \ health\npay_audit[\"band_progression_index\"] = progression_index\n\npay_out_path\
        \ = os.path.join(args.output, \"pay_band_audit.csv\")\npay_audit.to_csv(pay_out_path,\
        \ index=False)\n\n# Also produce a small JSON summary for governance dashboards\n\
        summary = {\n    \"overall_attrition_rate\": float(overall_attr_rate),\n \
        \   \"overtime_yes_proportion\": float(ot_yes_prop),\n    \"overtime_attrition_ratio\"\
        : float(rate_yes / max(1e-9, rate_no)),\n    \"rd_share\": float(rd_share),\n\
        \    \"age_majority_share_26_45\": float(major_groups),\n    \"band_progression_index\"\
        : float(progression_index),\n}\nwith open(os.path.join(args.output, \"kpi_summary.json\"\
        ), \"w\") as f:\n    json.dump(summary, f)\n\n```\n\nThe same program is on\
        \ disk at `./code/general_task_1.py`, so you can run it against the\nstaged\
        \ table, step through it, or search it, rather than working from the\nlisting\
