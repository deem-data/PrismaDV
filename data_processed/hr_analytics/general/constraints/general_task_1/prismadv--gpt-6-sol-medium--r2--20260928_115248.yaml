      - start_line: 51
        end_line: 54
        file: ''
      - start_line: 100
        end_line: 108
        file: ''
      uid: 150de5c1-cee7-417b-8355-3b75bf010dc0
    - text: 'Each Age value should agree with its row''s AgeGroup: 18-25 for ages
        18 through 25, 26-35 for 26 through 35, 36-45 for 36 through 45, 46-55 for
        46 through 55, and 55+ for ages above 55. The code uses Age to derive a career-start
        signal but AgeGroup to weight the same row''s risk score.'
      sources:
      - start_line: 51
        end_line: 59
        file: ''
      - start_line: 100
        end_line: 108
        file: ''
      - start_line: 130
        end_line: 135
        file: ''
      uid: ef253090-323f-4527-a7fe-0009ab42b5a6
    - text: Age minus TotalWorkingYears should generally be at least 15, so the implied
        career-start age is plausible. Values below 15 are silently clipped to a zero
        career-start signal rather than flagged.
