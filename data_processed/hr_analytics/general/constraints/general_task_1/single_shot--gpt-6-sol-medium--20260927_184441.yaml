constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 60', 'age_in_expected_range')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age > 55)", 'age_matches_age_group')
      - Valid
    - - '.satisfies("AgeGroup IN (''26-35'', ''36-45'')", ''age_26_45_majority'',
        lambda x: x >= 0.65)'
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    - - '.satisfies("Attrition = ''Yes'' AND OverTime = ''No''", ''non_overtime_attrition_cases_present'',
        lambda x: x > 0)'
      - Valid
    - - '.satisfies("Attrition = ''Yes'' AND OverTime = ''Yes''", ''overtime_attrition_cases_present'',
        lambda x: x > 0)'
      - Valid
    - - '.satisfies("Attrition = ''Yes''", ''plausible_attrition_rate'', lambda x:
        0.05 <= x <= 0.35)'
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    - - '.satisfies("Department = ''Research & Development''", ''rd_majority_share'',
        lambda x: x >= 0.60)'
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    - - .satisfies("(Department = 'Sales' AND JobRole IN ('Sales Executive', 'Sales
        Representative', 'Manager')) OR (Department = 'Research & Development' AND
        JobRole IN ('Research Scientist', 'Laboratory Technician', 'Research Director',
        'Manufacturing Director', 'Healthcare Representative', 'Manager')) OR (Department
        = 'Human Resources' AND JobRole IN ('Human Resources', 'Manager'))", 'department_role_compatible')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4 AND EnvironmentSatisfaction BETWEEN
        1 AND 4 AND WorkLifeBalance BETWEEN 1 AND 4', 'valid_satisfaction_scores')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    - - '.satisfies("OverTime = ''Yes''", ''plausible_overtime_share'', lambda x:
        0.15 <= x <= 0.40)'
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike')
      - Valid
    - - .satisfies('PercentSalaryHike BETWEEN 11 AND 25', 'valid_salary_hike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome > 0 AND MonthlyIncome
        <= 5000) OR (SalarySlab = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome
        <= 10000) OR (SalarySlab = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome
        <= 15000) OR (SalarySlab = '15k+' AND MonthlyIncome > 15000)", 'income_matches_salary_slab')
      - Valid
    - - '.satisfies("SalarySlab = ''10k-15k''", ''10k_15k_band_present'', lambda x:
        x > 0)'
      - Valid
    - - '.satisfies("SalarySlab = ''15k+''", ''15k_plus_band_present'', lambda x:
        x > 0)'
      - Valid
    - - '.satisfies("SalarySlab = ''5k-10k''", ''5k_10k_band_present'', lambda x:
        x > 0)'
      - Valid
    - - '.satisfies("SalarySlab = ''Upto 5k''", ''upto_5k_band_present'', lambda x:
        x > 0)'
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears >= 0 AND YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears AND Age - TotalWorkingYears >= 15', 'valid_working_years')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole <= YearsAtCompany',
        'valid_current_role_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion <= YearsAtCompany',
        'valid_promotion_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.95)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'valid_manager_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
