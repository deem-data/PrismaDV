constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies("(`AgeGroup` = '18-25' AND `Age` BETWEEN 18 AND 25) OR (`AgeGroup`
        = '26-35' AND `Age` BETWEEN 26 AND 35) OR (`AgeGroup` = '36-45' AND `Age`
        BETWEEN 36 AND 45) OR (`AgeGroup` = '46-55' AND `Age` BETWEEN 46 AND 55) OR
        (`AgeGroup` = '55+' AND `Age` >= 55)", 'age matches age group')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.hasCompliance(''attrition cases present'', "`Attrition` = ''Yes''", lambda
        x: x > 0)'
      - Invalid
    - - '.hasCompliance(''non-attrition cases present'', "`Attrition` = ''No''", lambda
        x: x > 0)'
      - Invalid
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - '.hasCompliance(''R&D majority'', "`Department` = ''Research & Development''",
        lambda x: x > 0.5)'
      - Invalid
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    - - .satisfies('`EnvironmentSatisfaction` BETWEEN 1 AND 4', 'valid environment
        satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('`JobSatisfaction` BETWEEN 1 AND 4', 'valid job satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .satisfies("(`SalarySlab` = 'Upto 5k' AND `MonthlyIncome` > 0 AND `MonthlyIncome`
        <= 5000) OR (`SalarySlab` = '5k-10k' AND `MonthlyIncome` > 5000 AND `MonthlyIncome`
        <= 10000) OR (`SalarySlab` = '10k-15k' AND `MonthlyIncome` > 10000 AND `MonthlyIncome`
        <= 15000) OR (`SalarySlab` = '15k+' AND `MonthlyIncome` > 15000)", 'income
        matches salary slab')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - '.hasCompliance(''non-overtime cases present'', "`OverTime` = ''No''", lambda
        x: x > 0)'
      - Invalid
    - - '.hasCompliance(''overtime cases present'', "`OverTime` = ''Yes''", lambda
        x: x > 0)'
      - Invalid
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike')
      - Valid
    - - .isNonNegative('PercentSalaryHike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('`PerformanceRating` IN (3, 4)', 'valid performance rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - '.hasCompliance(''10k-15k band present'', "`SalarySlab` = ''10k-15k''", lambda
        x: x > 0)'
      - Invalid
    - - '.hasCompliance(''15k+ band present'', "`SalarySlab` = ''15k+''", lambda x:
        x > 0)'
      - Invalid
    - - '.hasCompliance(''5k-10k band present'', "`SalarySlab` = ''5k-10k''", lambda
        x: x > 0)'
      - Invalid
    - - '.hasCompliance(''Upto 5k band present'', "`SalarySlab` = ''Upto 5k''", lambda
        x: x > 0)'
      - Invalid
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('`WorkLifeBalance` BETWEEN 1 AND 4', 'valid work-life balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('`YearsAtCompany` <= `TotalWorkingYears`', 'company tenure does
        not exceed total experience')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('`YearsSinceLastPromotion` <= `YearsAtCompany`', 'promotion tenure
        does not exceed company tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('`YearsWithCurrManager` IS NULL OR (`YearsWithCurrManager` >= 0
        AND `YearsWithCurrManager` <= `YearsAtCompany`)', 'manager tenure is valid
        when present')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
