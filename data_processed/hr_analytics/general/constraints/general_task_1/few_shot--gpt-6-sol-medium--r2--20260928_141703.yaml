constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - '.satisfies("(AgeGroup = ''18-25'' AND Age BETWEEN 18 AND 25) OR (AgeGroup
        = ''26-35'' AND Age BETWEEN 26 AND 35) OR (AgeGroup = ''36-45'' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = ''46-55'' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = ''55+'' AND Age > 55)", ''age_matches_age_group'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.hasNumberOfDistinctValues(''Attrition'', lambda x: x == 2)'
      - Invalid
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  EnvironmentSatisfaction:
    code:
    - - '.satisfies(''EnvironmentSatisfaction BETWEEN 1 AND 4'', ''valid_environment_satisfaction'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - '.satisfies(''JobSatisfaction BETWEEN 1 AND 4'', ''valid_job_satisfaction'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - '.satisfies("(SalarySlab = ''Upto 5k'' AND MonthlyIncome <= 5000) OR (SalarySlab
        = ''5k-10k'' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = ''10k-15k'' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = ''15k+'' AND MonthlyIncome > 15000)", ''income_matches_salary_slab'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  OverTime:
    code:
    - - '.hasNumberOfDistinctValues(''OverTime'', lambda x: x == 2)'
      - Invalid
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike')
      - Valid
    - - .isNonNegative('PercentSalaryHike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - '.hasNumberOfDistinctValues(''SalarySlab'', lambda x: x == 4)'
      - Invalid
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TotalWorkingYears, YearsAtCompany, YearsSinceLastPromotion:
    code:
    - - '.satisfies(''TotalWorkingYears >= 0 AND YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears AND YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion
        <= YearsAtCompany'', ''valid_tenure'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: TotalWorkingYears, YearsAtCompany, YearsSinceLastPromotion
  WorkLifeBalance:
    code:
    - - '.satisfies(''WorkLifeBalance BETWEEN 1 AND 4'', ''valid_work_life_balance'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.satisfies(''YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)'', ''valid_manager_tenure'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
