        end_line: 59
        file: ''
      uid: bb8334cc-9687-480e-b4a8-1afe5168d3fa
    - text: Every 'Age' value should be non-null and numeric, preferably an integer.
        The code subtracts TotalWorkingYears from Age without filling missing values,
        and the resulting signal contributes to each employee's risk score.
