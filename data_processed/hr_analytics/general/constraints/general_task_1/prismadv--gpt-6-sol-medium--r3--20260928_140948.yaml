      - start_line: 51
        end_line: 54
        file: ''
      - start_line: 100
        end_line: 108
        file: ''
      uid: 0f701b17-f561-4edd-a5de-526d62eb9f46
    - text: More than half of rows should have 'AgeGroup' equal to '26-35' or '36-45'.
