        end_line: 55
        file: ''
      - start_line: 100
        end_line: 108
        file: ''
      uid: bce15e96-840c-4f96-aa2b-da6d2b17e9b3
    - text: '''AgeGroup'' should agree with ''Age'' on each row: ''18-25'' requires
        Age between 18 and 25; ''26-35'', between 26 and 35; ''36-45'', between 36
