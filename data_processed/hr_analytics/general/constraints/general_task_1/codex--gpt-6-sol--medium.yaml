      code:
      - - .isComplete('Attrition')
        - Valid
      - - .isContainedIn('Attrition', ['Yes', 'No'])
        - Valid
      - - '.satisfies("Attrition = ''Yes''", ''nondegenerate_attrition_rate'', lambda
          fraction: 0 < fraction < 1)'
        - Valid
      - - '.satisfies("OverTime = ''No'' AND Attrition = ''Yes''", ''non_overtime_attrition_present'',
          lambda fraction: fraction > 0)'
        - Valid
      - - '.satisfies("OverTime = ''Yes'' AND Attrition = ''Yes''", ''overtime_attrition_present'',
          lambda fraction: fraction > 0)'
        - Valid
      assumptions: []
      column_name: Attrition
    Department:
