        \ index=False)\n\n# Also produce a small JSON summary for governance dashboards\n\
        summary = {\n    \"overall_attrition_rate\": float(overall_attr_rate),\n \
        \   \"overtime_yes_proportion\": float(ot_yes_prop),\n"
