      - - .isComplete('EnvironmentSatisfaction')
        - Valid
      - - .satisfies('EnvironmentSatisfaction BETWEEN 1 AND 4', 'environment_satisfaction_scale')
        - Valid
      assumptions: []
      column_name: EnvironmentSatisfaction
    JobRole:
