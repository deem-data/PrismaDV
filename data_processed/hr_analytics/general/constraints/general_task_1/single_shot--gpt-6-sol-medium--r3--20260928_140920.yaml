constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - '.satisfies("(AgeGroup = ''18-25'' AND Age BETWEEN 18 AND 25) OR (AgeGroup
        = ''26-35'' AND Age BETWEEN 26 AND 35) OR (AgeGroup = ''36-45'' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = ''46-55'' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = ''55+'' AND Age >= 55)", ''age_matches_age_group'', lambda p: p == 1.0)'
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - '.satisfies("AgeGroup IN (''26-35'', ''36-45'')", ''age_26_45_majority'',
        lambda p: p > 0.50)'
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    - - '.satisfies("Attrition = ''Yes''", ''attrition_rate_for_calibration'', lambda
        p: 0.08 <= p <= 0.35)'
      - Valid
    assumptions: []
    column_name: Attrition
  Attrition, OverTime:
    code:
    - - '.satisfies("Attrition = ''Yes'' AND OverTime = ''No''", ''overtime_no_attrition_cases_present'',
        lambda p: p > 0.0)'
      - Valid
    - - '.satisfies("Attrition = ''Yes'' AND OverTime = ''Yes''", ''overtime_yes_attrition_cases_present'',
        lambda p: p > 0.0)'
      - Valid
    assumptions: []
    column_name: Attrition, OverTime
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    - - '.satisfies("Department = ''Research & Development''", ''rd_share_for_weighting'',
        lambda p: 0.55 <= p <= 0.80)'
      - Valid
    assumptions: []
    column_name: Department
  Department, JobRole:
    code:
    - - '.satisfies("JobRole NOT IN (''Research Scientist'', ''Laboratory Technician'',
        ''Research Director'', ''Manufacturing Director'') OR Department = ''Research
        & Development''", ''research_roles_in_rd'', lambda p: p == 1.0)'
      - Valid
    - - '.satisfies("JobRole NOT IN (''Sales Executive'', ''Sales Representative'')
        OR Department = ''Sales''", ''sales_roles_in_sales'', lambda p: p == 1.0)'
      - Valid
    assumptions: []
    column_name: Department, JobRole
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    - - .isContainedIn('EnvironmentSatisfaction', ['1', '2', '3', '4'])
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    - - .isContainedIn('JobRole', ['Sales Executive', 'Sales Representative', 'Research
        Scientist', 'Laboratory Technician', 'Research Director', 'Manufacturing Director',
        'Healthcare Representative', 'Human Resources', 'Manager'])
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .isContainedIn('JobSatisfaction', ['1', '2', '3', '4'])
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - '.satisfies("(SalarySlab = ''Upto 5k'' AND MonthlyIncome > 0 AND MonthlyIncome
        <= 5000) OR (SalarySlab = ''5k-10k'' AND MonthlyIncome > 5000 AND MonthlyIncome
        <= 10000) OR (SalarySlab = ''10k-15k'' AND MonthlyIncome > 10000 AND MonthlyIncome
        <= 15000) OR (SalarySlab = ''15k+'' AND MonthlyIncome > 15000)", ''income_matches_salary_slab'',
        lambda p: p == 1.0)'
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    - - '.satisfies("OverTime = ''Yes''", ''overtime_share_for_calibration'', lambda
        p: 0.10 <= p <= 0.45)'
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike')
      - Valid
    - - '.satisfies(''PercentSalaryHike BETWEEN 11 AND 25'', ''salary_hike_in_expected_range'',
        lambda p: p == 1.0)'
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .isContainedIn('PerformanceRating', ['3', '4'])
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - '.satisfies("SalarySlab = ''10k-15k''", ''10k_15k_band_present'', lambda p:
        p > 0.0)'
      - Valid
    - - '.satisfies("SalarySlab = ''15k+''", ''15k_plus_band_present'', lambda p:
        p > 0.0)'
      - Valid
    - - '.satisfies("SalarySlab = ''5k-10k''", ''5k_10k_band_present'', lambda p:
        p > 0.0)'
      - Valid
    - - '.satisfies("SalarySlab = ''Upto 5k''", ''upto_5k_band_present'', lambda p:
        p > 0.0)'
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TotalWorkingYears, YearsAtCompany, YearsSinceLastPromotion, YearsWithCurrManager, Age:
    code:
    - - '.satisfies(''TotalWorkingYears >= 0 AND YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears AND YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion
        <= YearsAtCompany AND Age - TotalWorkingYears >= 15 AND (YearsWithCurrManager
        IS NULL OR (YearsWithCurrManager >= 0 AND YearsWithCurrManager <= YearsAtCompany))'',
        ''tenure_and_career_consistency'', lambda p: p == 1.0)'
      - Valid
    assumptions: []
    column_name: TotalWorkingYears, YearsAtCompany, YearsSinceLastPromotion, YearsWithCurrManager,
      Age
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .isContainedIn('WorkLifeBalance', ['1', '2', '3', '4'])
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda p: p >= 0.94)'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
