  \ '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate': 201,\
  \ 'Department': 'Research & Development', 'DistanceFromHome': 5, 'Education': 3,\
  \ 'EducationField': 'Technical Degree', 'EmployeeCount': 1, 'EmployeeNumber': 197,\
  \ 'EnvironmentSatisfaction': 4, 'Gender': 'Female', 'HourlyRate': 84, 'JobInvolvement':\
