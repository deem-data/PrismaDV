constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 70', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age >= 56 AND
        AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    - - .satisfies('EnvironmentSatisfaction BETWEEN 1 AND 4', 'valid_environment_satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .satisfies("(MonthlyIncome BETWEEN 0 AND 5000 AND SalarySlab = 'Upto 5k')
        OR (MonthlyIncome BETWEEN 5001 AND 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        BETWEEN 10001 AND 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome >= 15001
        AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany >= 0 AND TotalWorkingYears >= YearsAtCompany',
        'valid_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole BETWEEN 0 AND YearsAtCompany', 'valid_role_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion BETWEEN 0 AND YearsAtCompany', 'valid_promotion_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager BETWEEN 0
        AND YearsAtCompany', 'valid_manager_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
