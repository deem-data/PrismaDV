constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age BETWEEN 18 AND 70', 'valid_age_for_normalization')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age >= 55)", 'age_matches_age_group')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction').satisfies('EnvironmentSatisfaction
        BETWEEN 1 AND 4', 'valid_environment_satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction').satisfies('JobSatisfaction BETWEEN 1 AND 4',
        'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').satisfies('MonthlyIncome > 0', 'positive_monthly_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome BETWEEN 1 AND 5000)
        OR (SalarySlab = '5k-10k' AND MonthlyIncome BETWEEN 5001 AND 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome BETWEEN 10001 AND 15000) OR (SalarySlab = '15k+'
        AND MonthlyIncome >= 15001)", 'income_matches_salary_slab')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').satisfies('TotalWorkingYears >= YearsAtCompany',
        'total_working_years_cover_company_tenure')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance').satisfies('WorkLifeBalance BETWEEN 1 AND 4',
        'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').satisfies('YearsAtCompany >= 0', 'nonnegative_years_at_company')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').satisfies('YearsInCurrentRole BETWEEN 0
        AND YearsAtCompany', 'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').satisfies('YearsSinceLastPromotion
        BETWEEN 0 AND YearsAtCompany', 'promotion_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager BETWEEN 0
        AND YearsAtCompany', 'manager_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
