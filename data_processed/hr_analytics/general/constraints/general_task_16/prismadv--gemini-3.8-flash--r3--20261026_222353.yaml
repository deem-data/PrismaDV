        defined age group brackets start at 18 (''18-25'') and the normalization formula
        `(df[''Age''] - 18) / (70 - 18)` assumes a lower bound of 18. Values below
        18 would fail to map to any age group and produce negative normalized age
        values. We could represent this assumption as a deequ constraint like this:
        .satisfies(''Age >= 18'', ''Age greater than or equal to 18'')'
