constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 70', 'Age within normalization range')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age >= 55)", 'Age matches age group')
      - Valid
    assumptions: []
    column_name: AgeGroup
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    - - .satisfies('EnvironmentSatisfaction BETWEEN 1 AND 4', 'Valid environment satisfaction
        score')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'Valid job satisfaction score')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .satisfies("MonthlyIncome IS NULL OR (SalarySlab = 'Upto 5k' AND MonthlyIncome
        BETWEEN 0 AND 5000) OR (SalarySlab = '5k-10k' AND MonthlyIncome BETWEEN 5001
        AND 10000) OR (SalarySlab = '10k-15k' AND MonthlyIncome BETWEEN 10001 AND
        15000) OR (SalarySlab = '15k+' AND MonthlyIncome >= 15001)", 'Monthly income
        matches salary slab')
      - Valid
    - - .satisfies('MonthlyIncome IS NULL OR MonthlyIncome >= 0', 'Available monthly
        income is nonnegative')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'Valid work-life balance score')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'Company tenure does not
        exceed total working years')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole BETWEEN 0 AND YearsAtCompany', 'Role tenure
        within company tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion BETWEEN 0 AND YearsAtCompany', 'Promotion
        interval within company tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager BETWEEN 0
        AND YearsAtCompany', 'Available manager tenure within company tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
