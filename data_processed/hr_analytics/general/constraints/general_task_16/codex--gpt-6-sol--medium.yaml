prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    df = pd.read_csv(input_csv)\n\n    # Ensure numeric dtypes\
  \ where needed\n    numeric_cols = [\n        'Age', 'MonthlyIncome', 'YearsAtCompany',\
  \ 'TotalWorkingYears',\n        'YearsInCurrentRole', 'YearsSinceLastPromotion',\
  \ 'YearsWithCurrManager',\n        'WorkLifeBalance', 'JobSatisfaction', 'EnvironmentSatisfaction'\n\
  \    ]\n    for c in numeric_cols:\n        if c in df.columns:\n            df[c]\
  \ = pd.to_numeric(df[c], errors='coerce')\n\n    # Mappings used in downstream logic\n\
  \    salary_slab_bounds = {\n        'Upto 5k': (0, 5000),\n        '5k-10k': (5001,\
  \ 10000),\n        '10k-15k': (10001, 15000),\n        '15k+': (15001, np.inf),\n\
  \    }\n    salary_slab_ordinal = {'Upto 5k': 1, '5k-10k': 2, '10k-15k': 3, '15k+':\
  \ 4}\n\n    age_group_bounds = {\n        '18-25': (18, 25),\n        '26-35': (26,\
  \ 35),\n        '36-45': (36, 45),\n        '46-55': (46, 55),\n        '55+': (55,\
  \ np.inf),\n    }\n    age_group_ordinal = {'18-25': 1, '26-35': 2, '36-45': 3,\
  \ '46-55': 4, '55+': 5}\n\n    def age_to_group(age_val):\n        if pd.isna(age_val):\n\
  \            return np.nan\n        for k, (low, high) in age_group_bounds.items():\n\
  \            if k == '55+':\n                if age_val >= 55:\n               \
  \     return '55+'\n            else:\n                if low <= age_val <= high:\n\
  \                    return k\n        return np.nan\n\n    # Guard before using\
  \ Age in normalization and downstream risk features\n    # Prepare age group ordinal\
  \ and cross features\n    df['DerivedAgeGroup'] = df['Age'].apply(age_to_group)\n\
  \    df['AgeGroupOrd'] = df['AgeGroup'].map(age_group_ordinal)\n    df['AgeNorm']\
  \ = (df['Age'] - 18) / (70 - 18)\n\n    # Compensation features rely on slab ranges\
  \ being consistent with MonthlyIncome\n    # Use slab for calibration/imputation\
  \ and risk shaping; requires strong monotonic relationship\n    df['SlabOrd'] =\
  \ df['SalarySlab'].map(salary_slab_ordinal)\n    # Impute MonthlyIncome from slab\
  \ medians if needed (future-proof); used in downstream scoring\n    slab_median_income\
  \ = df.groupby('SalarySlab')['MonthlyIncome'].transform('median')\n    df['MonthlyIncomeFilled']\
  \ = df['MonthlyIncome'].fillna(slab_median_income)\n\n    # Rank within slab to\
  \ capture relative pay position independent of slab width\n    df['IncomeRankInSlab']\
  \ = df.groupby('SalarySlab')['MonthlyIncomeFilled'].rank(pct=True)\n\n    # Tenure-related\
  \ constraints before computing ratios\n    yac = df['YearsAtCompany']\n    total\
  \ = df['TotalWorkingYears']\n    role = df['YearsInCurrentRole']\n    promo = df['YearsSinceLastPromotion']\n\
  \    mgr = df['YearsWithCurrManager'].fillna(0)\n    # Safe ratios for tenure dynamics\
  \ (avoid divide-by-zero with YearsAtCompany==0)\n    yac_nonzero = yac.replace(0,\
  \ np.nan)\n    df['RoleTenureRatio'] = (role / yac_nonzero).clip(lower=0, upper=1).fillna(0)\n\
  \    df['MgrTenureRatio'] = (mgr / yac_nonzero).clip(lower=0, upper=1).fillna(0)\n\
  \    df['SincePromoRatio'] = (promo / yac_nonzero).clip(lower=0, upper=1).fillna(0)\n\
  \n    # Additional features\n    df['OverTimeInd'] = (df['OverTime'] == 'Yes').astype(int)\n\
  \    # Normalize satisfaction scores to [0,1] where higher is better\n    for col\
  \ in ['WorkLifeBalance', 'JobSatisfaction', 'EnvironmentSatisfaction']:\n      \
  \  df[col] = pd.to_numeric(df[col], errors='coerce')\n    df['WLBScore'] = ((df['WorkLifeBalance']\
  \ - 1) / 3).clip(0, 1)\n    df['JobSatScore'] = ((df['JobSatisfaction'] - 1) / 3).clip(0,\
  \ 1)\n    df['EnvSatScore'] = ((df['EnvironmentSatisfaction'] - 1) / 3).clip(0,\
  \ 1)\n\n    # Age-group risk baseline (ordered)\n    age_group_risk_lookup = {\n\
  \        1: 0.65,  # 18-25\n        2: 0.55,  # 26-35\n        3: 0.45,  # 36-45\n\
  \        4: 0.50,  # 46-55\n        5: 0.60,  # 55+\n    }\n    df['AgeGroupRisk']\
  \ = df['AgeGroupOrd'].map(age_group_risk_lookup).fillna(0.5)\n\n    # Compensation-related\
  \ risk: lower slab and lower rank within slab => higher risk\n    df['SlabRiskComponent']\
  \ = (5 - df['SlabOrd']) / 4.0  # 1.0 for lowest slab -> 0.25 for highest\n    df['WithinSlabUnderpay']\
  \ = 1.0 - df['IncomeRankInSlab']  # 1.0 = bottom of slab\n\n    # Combine features\
  \ into a risk score using a logistic transform\n    # Weights reflect domain heuristics\n\
  \    w = {\n        'bias': -1.0,\n        'overtime': 1.2,\n        'wlb': -1.0,\n\
  \        'jobsat': -0.8,\n        'envsat': -0.5,\n        'role_ratio': 0.6,\n\
  \        'mgr_ratio': 0.4,\n        'promo_ratio': 0.7,\n        'age_group': 0.5,\n\
  \        'slab_ord': 0.8,\n        'within_slab': 0.6,\n    }\n\n    linear = (\n\
  \            w['bias']\n            + w['overtime'] * df['OverTimeInd']\n      \
  \      + w['wlb'] * df['WLBScore']\n            + w['jobsat'] * df['JobSatScore']\n\
  \            + w['envsat'] * df['EnvSatScore']\n            + w['role_ratio'] *\
  \ df['RoleTenureRatio']\n            + w['mgr_ratio'] * df['MgrTenureRatio']\n \
  \           + w['promo_ratio'] * df['SincePromoRatio']\n            + w['age_group']\
  \ * df['AgeGroupRisk']\n            + w['slab_ord'] * df['SlabRiskComponent']\n\
  \            + w['within_slab'] * df['WithinSlabUnderpay']\n    )\n\n    df['AttritionRiskScore']\
  \ = 1.0 / (1.0 + np.exp(-linear))\n\n    # Tiering for prioritization\n    bins\
  \ = [0.0, 0.35, 0.60, 1.0]\n    labels = ['Low', 'Medium', 'High']\n    df['RiskTier']\
  \ = pd.cut(df['AttritionRiskScore'], bins=bins, labels=labels, include_lowest=True,\
  \ right=True)\n\n    # Output final scores\n    out_cols = [\n        'EmpID', 'Department',\
  \ 'JobRole', 'Age', 'AgeGroup', 'MonthlyIncome', 'SalarySlab',\n        'YearsAtCompany',\
  \ 'OverTime', 'WorkLifeBalance', 'JobSatisfaction', 'EnvironmentSatisfaction',\n\
  \        'AttritionRiskScore', 'RiskTier'\n    ]\n    present_out_cols = [c for\
  \ c in out_cols if c in df.columns]\n    result_df = df[present_out_cols + ['SlabRiskComponent',\
  \ 'WithinSlabUnderpay', 'RoleTenureRatio', 'MgrTenureRatio',\n                 \
  \                      'SincePromoRatio']]\n\n    output_csv = os.path.join(args.output,\
  \ 'attrition_risk_scores.csv')\n    result_df.to_csv(output_csv, index=False)\n\n\
  \    if __name__ == '__main__':\n        main()\n\n```\n\nThe same program is on\
  \ disk at `./code/general_task_16.py`, so you can run it against the\nstaged table,\
  \ step through it, or search it, rather than working from the\nlisting alone.\n\n\
  # The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 45, 'EmpID': 'RM1461', 'Age': 29, 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel':\
  \ 'Travel_Rarely', 'DailyRate': 468, 'Department': 'Research & Development', 'DistanceFromHome':\
  \ 28, 'Education': 4, 'EducationField': 'Medical', 'EmployeeCount': 1, 'EmployeeNumber':\
  \ 2054, 'EnvironmentSatisfaction': 4, 'Gender': 'Female', 'HourlyRate': 73, 'JobInvolvement':\
