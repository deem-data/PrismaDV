      - start_line: 20
        end_line: 27
        file: ''
      uid: e7cc308b-9c96-4b20-ae8c-8ecf77db23e3
    - text: 'The ''Age'' column is expected to have values of at least 18, representing
        adult working age, as the age group mapping begins at 18 and the normalization
        formula treats 18 as the lower bound ((df[''Age''] - 18) / (70 - 18)).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Age` >= 18 THEN 1 ELSE 0 END", "Age At Least 18", lambda
        x: x == 1.0)'
      sources:
      - start_line: 38
        end_line: 57
        file: ''
      - start_line: 61
        end_line: 63
        file: ''
      uid: f9f9a7ba-9ed2-48ba-9799-51972e6188c2
