    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('PerformanceRating BETWEEN 1 AND 4', 'valid_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  StockOptionLevel:
    code:
    - - .isComplete('StockOptionLevel')
      - Valid
    - - .satisfies('StockOptionLevel BETWEEN 0 AND 3', 'valid_stock_option_level')
      - Valid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears <= Age - 18', 'experience_fits_age')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TrainingTimesLastYear:
    code:
    - - .isComplete('TrainingTimesLastYear')
      - Valid
    - - .satisfies('TrainingTimesLastYear BETWEEN 0 AND 6', 'valid_training_count')
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany >= 0 AND YearsAtCompany <= TotalWorkingYears',
        'company_tenure_fits_experience')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x > 0)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager <= YearsAtCompany',
        'manager_tenure_fits_company_tenure')
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager >= 0', 'nonnegative_manager_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
