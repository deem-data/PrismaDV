constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age BETWEEN 18 AND 70', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25')
        OR (Age BETWEEN 26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45
        AND AgeGroup = '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55')
        OR (Age > 55 AND AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.isComplete(''Attrition'').isContainedIn(''Attrition'', [''Yes'', ''No'']).satisfies("Attrition
        = ''Yes''", ''attrition_yes_rate'', lambda rate: 0.10 <= rate <= 0.25)'
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .isComplete('DistanceFromHome').satisfies('DistanceFromHome BETWEEN 1 AND
        30', 'valid_distance_from_home')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction').satisfies('EnvironmentSatisfaction
        BETWEEN 1 AND 4', 'valid_environment_satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction').satisfies('JobSatisfaction BETWEEN 1 AND 4',
        'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').satisfies("(MonthlyIncome <= 5000 AND SalarySlab
        = 'Upto 5k') OR (MonthlyIncome > 5000 AND MonthlyIncome <= 10000 AND SalarySlab
        = '5k-10k') OR (MonthlyIncome > 10000 AND MonthlyIncome <= 15000 AND SalarySlab
        = '10k-15k') OR (MonthlyIncome > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  StockOptionLevel:
    code:
    - - .isComplete('StockOptionLevel').satisfies('StockOptionLevel BETWEEN 0 AND
        3', 'valid_stock_option_level')
      - Valid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').satisfies('TotalWorkingYears >= 0 AND TotalWorkingYears
        <= Age - 18', 'valid_total_working_years')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TrainingTimesLastYear:
    code:
    - - .isComplete('TrainingTimesLastYear').satisfies('TrainingTimesLastYear BETWEEN
        0 AND 6', 'valid_training_times')
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance').satisfies('WorkLifeBalance BETWEEN 1 AND 4',
        'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').satisfies('YearsAtCompany >= 0 AND YearsAtCompany
        <= TotalWorkingYears', 'valid_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole
        <= YearsAtCompany', 'valid_current_role_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').satisfies('YearsSinceLastPromotion
        >= 0 AND YearsSinceLastPromotion <= YearsAtCompany', 'valid_promotion_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda completeness: completeness
        >= 0.90).satisfies(''YearsWithCurrManager IS NULL OR (YearsWithCurrManager
        >= 0 AND YearsWithCurrManager <= YearsAtCompany)'', ''valid_manager_tenure'')'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
