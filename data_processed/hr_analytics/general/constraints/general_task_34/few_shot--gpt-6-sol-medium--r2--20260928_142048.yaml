constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 70', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  Attrition:
    code:
    - - '.hasCompliance(''attrition_yes_rate'', "Attrition = ''Yes''", lambda x: 0.10
        <= x <= 0.25)'
      - Invalid
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .satisfies('DistanceFromHome >= 0', 'nonnegative_distance_from_home')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EnvironmentSatisfaction:
    code:
    - - .satisfies('EnvironmentSatisfaction BETWEEN 1 AND 4', 'valid_environment_satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .satisfies('PerformanceRating IN (3, 4)', 'valid_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  StockOptionLevel:
    code:
    - - .satisfies('StockOptionLevel BETWEEN 0 AND 3', 'valid_stock_option_level')
      - Valid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - .satisfies('TotalWorkingYears >= 0 AND TotalWorkingYears <= Age - 18', 'experience_fits_age')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TrainingTimesLastYear:
    code:
    - - .satisfies('TrainingTimesLastYear BETWEEN 0 AND 6', 'valid_training_times_last_year')
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  WorkLifeBalance:
    code:
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .satisfies('YearsAtCompany >= 0 AND YearsAtCompany <= TotalWorkingYears',
        'company_tenure_fits_experience')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion <= YearsAtCompany',
        'promotion_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x > 0)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'manager_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
