constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 60', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age >= 55)", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    - - '.satisfies("Attrition = ''Yes''", ''attrition_yes_rate'', lambda fraction:
        0.12 <= fraction <= 0.25)'
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .satisfies('DistanceFromHome >= 0', 'nonnegative_distance_from_home')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EnvironmentSatisfaction:
    code:
    - - .satisfies('EnvironmentSatisfaction BETWEEN 1 AND 4', 'valid_environment_satisfaction')
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome BETWEEN 5000 AND 10000) OR (SalarySlab = '10k-15k'
        AND MonthlyIncome BETWEEN 10000 AND 15000) OR (SalarySlab = '15k+' AND MonthlyIncome
        >= 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  StockOptionLevel:
    code:
    - - .satisfies('StockOptionLevel BETWEEN 0 AND 3', 'valid_stock_option_level')
      - Valid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears BETWEEN 0 AND Age - 18', 'working_years_fit_age')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TrainingTimesLastYear:
    code:
    - - .satisfies('TrainingTimesLastYear BETWEEN 0 AND 6', 'valid_training_times')
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  WorkLifeBalance:
    code:
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany BETWEEN 0 AND TotalWorkingYears', 'company_tenure_fits_experience')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .satisfies('YearsInCurrentRole BETWEEN 0 AND YearsAtCompany', 'role_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion BETWEEN 0 AND YearsAtCompany', 'promotion_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda fraction: fraction >= 0.90)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager BETWEEN 0
        AND YearsAtCompany', 'manager_tenure_fits_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
