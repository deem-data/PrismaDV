    assumptions:
    - text: 'For every employee, ''SalarySlab'' should agree with ''MonthlyIncome'':
        ''Upto 5k'' when income is at most 5000; ''5k-10k'' when income is greater
        than 5000 and at most 10000; ''10k-15k'' when income is greater than 10000
        and at most 15000; and ''15k+'' when income is greater than 15000. This can
        be checked with a row-level conditional constraint. Boundary ownership should
        be confirmed against the dataset''s salary-slab convention.'
