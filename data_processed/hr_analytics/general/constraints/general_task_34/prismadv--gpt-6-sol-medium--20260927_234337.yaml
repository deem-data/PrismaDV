    assumptions:
    - text: 'JobRole and Department should be consistent: ''Sales Executive'' and
        ''Sales Representative'' belong to ''Sales''; ''Human Resources'' belongs
        to ''Human Resources''; ''Research Director'', ''Research Scientist'', ''Manufacturing
        Director'', ''Healthcare Representative'', and ''Laboratory Technician'' belong
        to ''Research & Development''. ''Manager'' may belong to any of the three
        departments. This keeps the role shown in an alert consistent with the department
        used to route it to an HRBP. A Deequ constraint could use .satisfies("(JobRole
        IN (''Sales Executive'', ''Sales Representative'') AND Department = ''Sales'')
        OR (JobRole = ''Human Resources'' AND Department = ''Human Resources'') OR
        (JobRole IN (''Research Director'', ''Research Scientist'', ''Manufacturing
        Director'', ''Healthcare Representative'', ''Laboratory Technician'') AND
        Department = ''Research & Development'') OR (JobRole = ''Manager'' AND Department
        IN (''Sales'', ''Research & Development'', ''Human Resources''))", "job_role_department_consistency")
        with compliance 1.0.'
