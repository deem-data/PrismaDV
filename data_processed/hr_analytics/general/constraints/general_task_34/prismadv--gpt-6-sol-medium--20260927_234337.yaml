    - suggestion: '.satisfies("CASE WHEN (`MonthlyIncome` <= 5000 AND `SalarySlab`
        = ''Upto 5k'') OR (`MonthlyIncome` > 5000 AND `MonthlyIncome` <= 10000 AND
        `SalarySlab` = ''5k-10k'') OR (`MonthlyIncome` > 10000 AND `MonthlyIncome`
        <= 15000 AND `SalarySlab` = ''10k-15k'') OR (`MonthlyIncome` > 15000 AND `SalarySlab`
        = ''15k+'') THEN 1 ELSE 0 END = 1", "salary_slab_matches_monthly_income",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
