        pairing. Sales Representative and Sales Executive should have Department =
        'Sales'; Human Resources should have Department = 'Human Resources'; Research
        Director, Research Scientist, Manufacturing Director, Healthcare Representative,
        and Laboratory Technician should have Department = 'Research & Development'.
        Manager may occur in any of the three listed departments. A row-level compliance
        constraint can check that every (Department, JobRole) pair belongs to this
        allowed set. This helps ensure that alerts carrying a JobRole are routed to
        the HRBP for the corresponding Department.
