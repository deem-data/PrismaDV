    assumptions:
    - text: The input must contain an 'Age' column with a non-null, numeric whole-number
        value for every row. The code performs arithmetic and comparisons on Age without
        converting its type or filling missing values, and it includes Age in the
        output.
      sources:
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 50
        end_line: 50
        file: ''
      - start_line: 56
        end_line: 57
        file: ''
      - start_line: 90
        end_line: 99
        file: ''
      uid: b05cf72d-1e22-40ed-89b0-d3384fd3514d
    - text: Age should be at least 18 for every employee. The calculation of potential
        working years uses Age minus 18, treating 18 as the starting age; values below
        18 would be clipped to zero rather than rejected.
      sources:
      - start_line: 50
        end_line: 51
        file: ''
      uid: cb91ba75-0d3f-4f43-bb71-abd2c1145db9
