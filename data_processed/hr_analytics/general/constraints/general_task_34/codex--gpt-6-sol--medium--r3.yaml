prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef sigmoid(x):\n    return\
  \ 1.0 / (1.0 + np.exp(-x))\n\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--input',\
  \ type=str, required=True)\nparser.add_argument('--output', type=str, required=True)\n\
  args = parser.parse_args()\n\ninput_csv = os.path.join(args.input, 'new_data.csv')\n\
  os.makedirs(args.output, exist_ok=True)\n\ndf = pd.read_csv(input_csv)\ndf = df.set_index('EmpID',\
  \ drop=False)\n\n# Age integrity checks before age-derived features\n# Salary slab\
  \ alignment before slab-driven features\n# Experience consistency before tenure-dependent\
  \ calculations\n# Attrition label sanity and base-rate stability before threshold\
  \ calibration\n# Feature engineering\nretirement_age = 70\nyears_to_retirement =\
  \ (retirement_age - df['Age']).clip(lower=0)\n\nslab_to_tier = {'Upto 5k': 3, '5k-10k':\
  \ 2, '10k-15k': 1, '15k+': 0}\ndf['salary_tier'] = df['SalarySlab'].map(slab_to_tier)\n\
  \nis_overtime = (df['OverTime'] == 'Yes').astype(float)\njs_low = 1.0 - (df['JobSatisfaction']\
  \ - 1.0) / 3.0\nenv_low = 1.0 - (df['EnvironmentSatisfaction'] - 1.0) / 3.0\nwlb_low\
  \ = 1.0 - (df['WorkLifeBalance'] - 1.0) / 3.0\n\ndistance_norm = (df['DistanceFromHome']\
  \ / 30.0).clip(upper=1.0)\n\npromo_norm = (df['YearsSinceLastPromotion'] / 10.0).clip(upper=1.0)\n\
  \nmanager_years = df['YearsWithCurrManager'].fillna(df['YearsWithCurrManager'].median())\n\
  manager_short = 1.0 - (manager_years / 10.0).clip(upper=1.0)\n\nperf_low = (df['PerformanceRating']\
  \ <= 3).astype(float)\ntrain_low = 1.0 - (df['TrainingTimesLastYear'] / 6.0).clip(upper=1.0)\n\
  stock_deficit = 1.0 - (df['StockOptionLevel'] / 3.0).clip(upper=1.0)\n\nexperience_cap\
  \ = (df['Age'] - 18).clip(lower=0)\nexperience_gap = (experience_cap - df['TotalWorkingYears']).clip(lower=0)\n\
  \ntenure_ratio = df['YearsAtCompany'] / df['TotalWorkingYears'].replace(0, np.nan)\n\
  tenure_ratio = tenure_ratio.fillna(0.0).clip(upper=1.0)\n\nage_youngish = (df['Age']\
  \ <= 25).astype(float)\nage_senior = (df['Age'] >= 55).astype(float)\n\n# Risk model\n\
  linear = (\n        0.5\n        + 0.60 * is_overtime\n        + 0.50 * wlb_low\n\
  \        + 0.45 * js_low\n        + 0.40 * env_low\n        + 0.30 * distance_norm\n\
  \        + 0.50 * promo_norm\n        + 0.40 * (df['salary_tier'] / 3.0)\n     \
  \   + 0.15 * train_low\n        + 0.25 * perf_low\n        + 0.20 * stock_deficit\n\
  \        + 0.20 * manager_short\n        + 0.20 * (1.0 - tenure_ratio)\n       \
  \ + 0.20 * age_youngish\n        + 0.10 * age_senior\n)\n\n# Calibration and score\n\
  score = sigmoid(linear - 2.0)\nbase_yes = (df['Attrition'] == 'Yes').mean()\nalert_share\
  \ = float(np.clip(2.0 * base_yes, 0.10, 0.40))\nthreshold = float(pd.Series(score).quantile(1.0\
  \ - alert_share))\n\nrisk_band = pd.cut(\n    score,\n    bins=[-np.inf, threshold\
  \ * 0.8, threshold, np.inf],\n    labels=['low', 'medium', 'high']\n)\n\nout_df\
  \ = pd.DataFrame({\n    'EmpID': df['EmpID'],\n    'Department': df['Department'],\n\
  \    'JobRole': df['JobRole'],\n    'Age': df['Age'],\n    'MonthlyIncome': df['MonthlyIncome'],\n\
  \    'SalarySlab': df['SalarySlab'],\n    'risk_score': score,\n    'risk_band':\
  \ risk_band.astype(str)\n}).set_index('EmpID', drop=False)\n\nout_path_scores =\
  \ os.path.join(args.output, 'attrition_risk_scores.csv')\nout_df.to_csv(out_path_scores,\
  \ index=False)\n\nhrbp_map = {\n    'Sales': 'hrbp_sales@example.com',\n    'Research\
  \ & Development': 'hrbp_rd@example.com',\n    'Human Resources': 'hrbp_hr@example.com'\n\
  }\n\nalerts = out_df[out_df['risk_band'] == 'high'].copy()\nalerts['hrbp_owner']\
  \ = alerts['Department'].map(hrbp_map).fillna('hrbp_general@example.com')\nalerts['alert_priority']\
  \ = np.where(alerts['risk_score'] >= max(threshold, alerts['risk_score'].quantile(0.90)),\
  \ 'P1',\n                                    'P2')\n\nalerts_path = os.path.join(args.output,\
  \ 'hrbp_alerts.csv')\nalerts[['EmpID', 'Department', 'JobRole', 'risk_score', 'alert_priority',\
  \ 'hrbp_owner']].to_csv(alerts_path,\n                                         \
  \                                                       index=False)\n\nworkload\
  \ = alerts.groupby('hrbp_owner', as_index=False).size().rename(columns={'size':\
  \ 'alert_count'})\nworkload_path = os.path.join(args.output, 'hrbp_workload.csv')\n\
  workload.to_csv(workload_path, index=False)\n\nsummary = {\n    'base_yes_rate':\
  \ round(float(base_yes), 4),\n    'alert_share_target': alert_share,\n    'threshold':\
  \ threshold,\n    'alerts_count': int(alerts.shape[0])\n}\n\nwith open(os.path.join(args.output,\
  \ 'run_summary.json'), 'w') as f:\n    import json\n\n    json.dump(summary, f,\
  \ indent=2)\n\n```\n\nThe same program is on disk at `./code/general_task_34.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 771, 'EmpID': 'RM777', 'Age': 20,\
  \ 'AgeGroup': '18-25', 'Attrition': 'Yes', 'BusinessTravel': 'Travel_Frequently',\
  \ 'DailyRate': 769, 'Department': 'Sales', 'DistanceFromHome': 9, 'Education': 3,\
  \ 'EducationField': 'Marketing', 'EmployeeCount': 1, 'EmployeeNumber': 1077, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Female', 'HourlyRate': 54, 'JobInvolvement': 3, 'JobLevel': 1, 'JobRole':\
  \ 'Sales Representative', 'JobSatisfaction': 4, 'MaritalStatus': 'Single', 'MonthlyIncome':\
