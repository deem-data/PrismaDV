prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\nos.makedirs(args.output, exist_ok=True)\n\ndf = pd.read_csv(input_csv)\n\
  df = df.set_index('EmpID', drop=False)\ndf['BusinessTravel'] = df['BusinessTravel'].replace({'TravelRarely':\
  \ 'Travel_Rarely'})\n# Rating gap used to differentiate merit for high performers\n\
  rating_means = df.groupby('PerformanceRating')['PercentSalaryHike'].mean()\nrating_gap_pct\
  \ = (rating_means[4] - rating_means[3]) if (3 in rating_means.index and 4 in rating_means.index)\
  \ else 1.5\n\n# Compute components for merit planning\nslab_base_rate_map = {\n\
  \    'Upto 5k': 0.060,\n    '5k-10k': 0.050,\n    '10k-15k': 0.040,\n    '15k+':\
  \ 0.030,\n}\ndf['slab_base_rate'] = df['SalarySlab'].map(slab_base_rate_map)\n\n\
  # Guard before use of slab_base_rate\ntravel_adj_map = {\n    'Non-Travel': 0.000,\n\
  \    'Travel_Rarely': 0.002,\n    'Travel_Frequently': 0.005,\n}\ndf['travel_adj']\
  \ = df['BusinessTravel'].map(travel_adj_map)\n\n# Use AgeGroup cohort weighting\
  \ after validation\nage_cohort_adj_map = {\n    '18-25': 0.002,\n    '26-35': 0.001,\n\
  \    '36-45': 0.000,\n    '46-55': 0.000,\n    '55+': 0.000,\n}\ndf['age_adj'] =\
  \ df['AgeGroup'].map(age_cohort_adj_map)\n\n# Guard before use of age_adj mapping\n\
  # Rating-based component leans on observed gap between PR=4 and PR=3\nbase_rating_component\
  \ = np.where(df['PerformanceRating'] == 4, 0.030 + rating_gap_pct / 100.0, 0.030)\n\
  \n# Tenure-based smoothing; safe division ensured by earlier zero-constraints\n\
  yac = df['YearsAtCompany']\nyicr = df['YearsInCurrentRole']\nratio = np.where(yac\
  \ > 0, (yicr / yac).clip(upper=1.0), 0.0)\n\ndf['MeritIncreasePct'] = (\n      \
  \  df['slab_base_rate'] +\n        base_rating_component +\n        df['travel_adj']\
  \ +\n        df['age_adj'] +\n        (1 - ratio) * 0.010\n)\n\n# Cap to reasonable\
  \ quarterly range [0.0, 0.20]\ndf['MeritIncreasePct'] = df['MeritIncreasePct'].clip(lower=0.0,\
  \ upper=0.20)\n\ndf['MeritIncreaseAmt'] = (df['MonthlyIncome'] * df['MeritIncreasePct']).round(2)\n\
  \n# Promotion eligibility rules using validated fields\neligible = (\n        (df['PerformanceRating']\
  \ == 4) &\n        (df['JobLevel'] < 5) &\n        (df['YearsInCurrentRole'] >=\
  \ 1) &\n        (df['YearsSinceLastPromotion'] >= 1) &\n        (df['TotalWorkingYears']\
  \ >= 2)\n)\ndf['PromotionEligible'] = eligible\n\n# Department-level aggregation\
  \ for planning\ndept_summary = (\n    df.groupby('Department')\n    .agg(\n    \
  \    Headcount=('EmpID', 'count'),\n        MeritPool=('MeritIncreaseAmt', 'sum'),\n\
  \        AvgMeritPct=('MeritIncreasePct', 'mean'),\n        Promotions=('PromotionEligible',\
  \ 'sum')\n    )\n    .reset_index()\n)\n\n# Per-employee plan\nplan_cols = [\n \
  \   'EmpID', 'Department', 'JobLevel', 'MonthlyIncome', 'SalarySlab', 'PerformanceRating',\n\
  \    'PercentSalaryHike', 'BusinessTravel', 'AgeGroup', 'YearsAtCompany', 'YearsInCurrentRole',\n\
  \    'MeritIncreasePct', 'MeritIncreaseAmt', 'PromotionEligible'\n]\nemployee_plan\
  \ = df[plan_cols].copy()\n\nemployee_plan.to_csv(os.path.join(args.output, 'employee_comp_plan.csv'),\
  \ index=False)\ndept_summary.to_csv(os.path.join(args.output, 'department_comp_summary.csv'),\
  \ index=False)\n\n```\n\nThe same program is on disk at `./code/general_task_3.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 505, 'EmpID': 'RM1351', 'Age': 27,\
  \ 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate':\
  \ 511, 'Department': 'Sales', 'DistanceFromHome': 2, 'Education': 2, 'EducationField':\
  \ 'Medical', 'EmployeeCount': 1, 'EmployeeNumber': 1898, 'EnvironmentSatisfaction':\
  \ 1, 'Gender': 'Female', 'HourlyRate': 89, 'JobInvolvement': 4, 'JobLevel': 2, 'JobRole':\
  \ 'Sales Executive', 'JobSatisfaction': 3, 'MaritalStatus': 'Single', 'MonthlyIncome':\
