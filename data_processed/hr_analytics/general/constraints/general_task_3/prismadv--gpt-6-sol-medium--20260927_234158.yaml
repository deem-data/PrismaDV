        end_line: 99
        file: ''
      uid: 8bd95795-f4c7-4424-a202-d70acd03225c
    - text: Every 'MonthlyIncome' value should be non-null and numeric. The script
        multiplies it by 'MeritIncreasePct' without filling missing values or converting
        types; missing or nonnumeric values would prevent a valid per-employee merit
        amount and could distort the department merit pool.
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 82
        end_line: 89
        file: ''
      uid: f1b8e565-4298-4417-b649-dfe165f77905
    - text: '''MonthlyIncome'' should be greater than zero for every employee. A zero
        or negative income would produce a zero or negative merit increase amount
        despite the calculated merit percentage.'
      sources:
      - start_line: 67
        end_line: 69
        file: ''
      uid: 784f7fe4-493f-4d5a-bc23-57971abe61de
    - text: '''MonthlyIncome'' should agree with the employee''s ''SalarySlab'', since
        the slab determines the base merit rate applied to that income. For example,
        ''Upto 5k'' should correspond to income at or below 5000, ''5k-10k'' to income
        between 5000 and 10000, ''10k-15k'' to income between 10000 and 15000, and
        ''15k+'' to income at or above 15000. Exact treatment of boundary values should
        follow the dataset''s slab definitions.'
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 58
        end_line: 69
        file: ''
      uid: 8c15fd82-9e73-40b3-bb49-6281354f5dc7
