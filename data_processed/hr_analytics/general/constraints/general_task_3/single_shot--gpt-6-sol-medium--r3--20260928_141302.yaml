constraints:
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  BusinessTravel:
    code:
    - - .isComplete('BusinessTravel').isContainedIn('BusinessTravel', ['Non-Travel',
        'Travel_Rarely', 'TravelRarely', 'Travel_Frequently'])
      - Valid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel').satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike').satisfies('PercentSalaryHike BETWEEN 0 AND
        100', 'valid_salary_hike_percentage')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  SalarySlab, MonthlyIncome:
    code:
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome < 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome >= 5000 AND MonthlyIncome < 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome >= 10000 AND MonthlyIncome < 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome >= 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab, MonthlyIncome
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').satisfies('TotalWorkingYears >= 0', 'nonnegative_total_working_years')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').satisfies('YearsAtCompany >= 0', 'nonnegative_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsAtCompany, YearsInCurrentRole:
    code:
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, YearsInCurrentRole
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').satisfies('YearsInCurrentRole >= 0', 'nonnegative_role_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').satisfies('YearsSinceLastPromotion
        >= 0', 'nonnegative_years_since_promotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
