constraints:
  constraints:
    Age:
      code:
      - - .isComplete('Age')
        - Valid
      assumptions: []
      column_name: Age
    AgeGroup:
      code:
      - - .isComplete('AgeGroup')
        - Valid
      - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
        - Valid
      - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup
          = '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
          36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
          = '55+' AND Age > 55)", 'age_matches_age_group')
        - Valid
      assumptions: []
      column_name: AgeGroup
    Attrition:
      code:
      - - .isComplete('Attrition')
        - Valid
      - - .isContainedIn('Attrition', ['Yes', 'No'])
        - Valid
      assumptions: []
      column_name: Attrition
    Department:
      code:
      - - .isComplete('Department')
        - Valid
      - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human
          Resources'])
        - Valid
      assumptions: []
      column_name: Department
    DistanceFromHome:
      code:
      - - .isComplete('DistanceFromHome')
        - Valid
      - - .isPositive('DistanceFromHome')
        - Valid
      assumptions: []
      column_name: DistanceFromHome
    EmpID:
      code:
      - - .isComplete('EmpID')
        - Valid
      - - .isUnique('EmpID')
        - Valid
      assumptions: []
      column_name: EmpID
    JobRole:
      code:
      - - .isComplete('JobRole')
        - Valid
      - - .satisfies("(JobRole = 'Manager') OR (Department = 'Sales' AND JobRole IN
          ('Sales Executive', 'Sales Representative')) OR (Department = 'Human Resources'
          AND JobRole = 'Human Resources') OR (Department = 'Research & Development'
          AND JobRole IN ('Healthcare Representative', 'Laboratory Technician', 'Manufacturing
          Director', 'Research Director', 'Research Scientist'))", 'department_role_consistency')
        - Valid
      assumptions: []
      column_name: JobRole
    JobSatisfaction:
      code:
      - - .isComplete('JobSatisfaction')
        - Valid
      - - .satisfies('JobSatisfaction IN (1, 2, 3, 4)', 'mapped_job_satisfaction')
        - Valid
      assumptions: []
      column_name: JobSatisfaction
    MonthlyIncome:
      code:
      - - .isComplete('MonthlyIncome')
        - Valid
      - - .isPositive('MonthlyIncome')
        - Valid
      assumptions: []
      column_name: MonthlyIncome
    OverTime:
      code:
      - - .isComplete('OverTime')
        - Valid
      - - .isContainedIn('OverTime', ['Yes', 'No'])
        - Valid
      assumptions: []
      column_name: OverTime
    PercentSalaryHike:
      code:
      - - .isComplete('PercentSalaryHike')
        - Valid
      - - .satisfies('PercentSalaryHike >= 0 AND PercentSalaryHike <= 100', 'valid_hike_percentage')
        - Valid
      assumptions: []
      column_name: PercentSalaryHike
    PerformanceRating:
      code:
      - - .isComplete('PerformanceRating')
        - Valid
      - - .satisfies('PerformanceRating IN (3, 4)', 'mapped_performance_rating')
        - Valid
      assumptions: []
      column_name: PerformanceRating
    SalarySlab:
      code:
      - - .isComplete('SalarySlab')
        - Valid
      - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
        - Valid
      - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
          = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
          = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
          = '15k+' AND MonthlyIncome > 15000)", 'income_matches_salary_slab')
        - Valid
      assumptions: []
      column_name: SalarySlab
    WorkLifeBalance:
      code:
      - - .isComplete('WorkLifeBalance')
        - Valid
      - - .satisfies('WorkLifeBalance IN (1, 2, 3, 4)', 'mapped_work_life_balance')
        - Valid
      assumptions: []
      column_name: WorkLifeBalance
    YearsAtCompany:
      code:
      - - .isComplete('YearsAtCompany')
        - Valid
      - - .isNonNegative('YearsAtCompany')
        - Valid
      assumptions: []
      column_name: YearsAtCompany
    YearsSinceLastPromotion:
      code:
      - - .isComplete('YearsSinceLastPromotion')
        - Valid
      - - .isNonNegative('YearsSinceLastPromotion')
        - Valid
      - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_within_tenure')
        - Valid
      assumptions: []
      column_name: YearsSinceLastPromotion
    YearsWithCurrManager:
      code:
      - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
          YearsWithCurrManager <= YearsAtCompany)', 'manager_tenure_within_company_tenure')
        - Valid
      assumptions: []
      column_name: YearsWithCurrManager
