    assumptions:
    - text: 'SalarySlab should agree with MonthlyIncome for every employee: ''Upto
        5k'' corresponds to income greater than 0 and at most 5000; ''5k-10k'' to
        greater than 5000 and at most 10000; ''10k-15k'' to greater than 10000 and
        at most 15000; and ''15k+'' to greater than 15000. Otherwise, the cap applied
        to that employee''s income may be incorrect. Validate with a row-level conditional
        constraint on SalarySlab and MonthlyIncome.'
