        recommended percentage: rating 3 requires PercentSalaryHike >= 0, and rating
        4 requires PercentSalaryHike >= -2 after its two-point bonus. This prevents
        the capped percentage from becoming a negative merit adjustment. A row-level
        constraint can check `(PerformanceRating = 3 AND PercentSalaryHike >= 0) OR
        (PerformanceRating = 4 AND PercentSalaryHike >= -2)`.'
