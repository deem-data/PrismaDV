  '["MonthlyIncome","PercentSalaryHike","PerformanceRating","SalarySlab"]':
    code: []
    assumptions:
    - text: 'The columns ''PerformanceRating'', ''PercentSalaryHike'', ''SalarySlab'',
        and ''MonthlyIncome'' are used together to compute ''approved_amount''. All
        four columns must be non-null and contain valid values (e.g., PerformanceRating
        in {3, 4}, SalarySlab in {''Upto 5k'', ''5k-10k'', ''10k-15k'', ''15k+''},
        and non-negative values for MonthlyIncome and PercentSalaryHike) so that the
        computed ''approved_amount'' is non-null and valid. We could represent this
        as a Deequ constraint like: .satisfies("PerformanceRating IS NOT NULL AND
        PercentSalaryHike IS NOT NULL AND SalarySlab IS NOT NULL AND MonthlyIncome
        IS NOT NULL", "Merit calculation inputs must not be null")'
      sources:
      - start_line: 18
        end_line: 24
        file: ''
      uid: 0a1c3b9b-4df1-48b2-b3e1-03dd1f051d90
    - text: 'The ''MonthlyIncome'' column should be consistent with the categorization
        in ''SalarySlab'' (e.g., records with SalarySlab ''Upto 5k'' should correspond
        to MonthlyIncome <= 5000, ''5k-10k'' should correspond to 5000 < MonthlyIncome
        <= 10000, ''10k-15k'' to 10000 < MonthlyIncome <= 15000, and ''15k+'' to MonthlyIncome
        > 15000). We could represent this as a Deequ constraint like: .satisfies("(SalarySlab
        = ''Upto 5k'' AND MonthlyIncome <= 5000) OR (SalarySlab = ''5k-10k'' AND MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab = ''10k-15k'' AND MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab = ''15k+'' AND MonthlyIncome
        > 15000)", "MonthlyIncome must align with SalarySlab")'
      sources:
      - start_line: 21
        end_line: 24
        file: ''
      uid: 402d10b4-583c-4677-ba2f-d524dae955b6
  '["MonthlyIncome","SalarySlab"]':
