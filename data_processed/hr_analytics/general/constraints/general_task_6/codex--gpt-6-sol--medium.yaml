        \ = df['PerformanceRating'].map(rating_bonus_map)\ndf['recommended_percent']\
        \ = df['PercentSalaryHike'] + df['rating_bonus']\ncap_map = {'Upto 5k': 20.0,\
        \ '5k-10k': 15.0, '10k-15k': 12.0, '15k+': 10.0}\ndf['cap_percent'] = df['SalarySlab'].map(cap_map)\n\
        df['approved_percent'] = np.minimum(df['recommended_percent'], df['cap_percent'])\n\
        df['approved_amount'] = df['MonthlyIncome'] * (df['approved_percent'] / 100.0)\n\
        \n# Department budgets, relies on Department/JobRole consistency\ndept_budget\
        \ = df.groupby('Department', as_index=False).agg(\n    Headcount=('EmpID',\
        \ 'count'),\n    MeritBudget=('approved_amount', 'sum')\n)\n\ndepartment_budget_path\
        \ = os.path.join(args.output, 'dept_budgets.csv')\ndept_budget.to_csv(department_budget_path,\
        \ index=False)\n\n# Attrition risk scoring\nage_weight_map = {\n    '18-25':\
        \ 0.5,\n    '26-35': 0.2,\n    '36-45': 0.0,\n    '46-55': -0.2,\n    '55+':\
        \ -0.3\n}\ndf['age_weight'] = df['AgeGroup'].map(age_weight_map)\n\nyac =\
        \ pd.to_numeric(df['YearsAtCompany'], errors='coerce')\nysp = pd.to_numeric(df['YearsSinceLastPromotion'],\
        \ errors='coerce')\n# Features for risk\nsafe_yac = yac.fillna(0)\nsafe_ysp\
        \ = ysp.fillna(0)\nden = safe_yac.replace(0, np.nan)\ntenure_ratio = (safe_ysp\
        \ / den).fillna(0.0)\n\not_flag = (df['OverTime'] == 'Yes').astype(float)\n\
        job_sat_map = {1: 0.4, 2: 0.2, 3: -0.1, 4: -0.2}\nwlb_map = {1: 0.5, 2: 0.2,\
        \ 3: 0.0, 4: -0.1}\njob_penalty = df['JobSatisfaction'].map(job_sat_map).astype(float)\n\
        wlb_penalty = df['WorkLifeBalance'].map(wlb_map).astype(float)\n\nmax_dist\
        \ = max(1.0, float(df['DistanceFromHome'].max()))\ndist_norm = df['DistanceFromHome'].astype(float)\
        \ / max_dist\n\nmgr_tenure = df['YearsWithCurrManager'].fillna(0).astype(float)\n\
        mgr_penalty = np.where(mgr_tenure < 1.0, 0.2, 0.0)\nyes_rate = (df['Attrition']\
        \ == 'Yes').mean()\nintercept = float(np.log((yes_rate + 1e-6) / (1.0 - yes_rate\
        \ + 1e-6)))\n\nraw_score = (\n        intercept\n        + 1.2 * ot_flag\n\
        \        + 0.8 * job_penalty\n        + 0.7 * wlb_penalty\n        + 0.6 *\
        \ df['age_weight'].astype(float)\n        + 0.7 * tenure_ratio.astype(float)\n\
