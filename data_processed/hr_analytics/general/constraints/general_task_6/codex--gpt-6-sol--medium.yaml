prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_path = os.path.join(args.input,\
  \ 'new_data.csv')\nos.makedirs(args.output, exist_ok=True)\n\ndf = pd.read_csv(input_path)\n\
  \n# Merit cycle computations\nrating_bonus_map = {3: 0.0, 4: 2.0}\ndf['rating_bonus']\
  \ = df['PerformanceRating'].map(rating_bonus_map)\ndf['recommended_percent'] = df['PercentSalaryHike']\
  \ + df['rating_bonus']\ncap_map = {'Upto 5k': 20.0, '5k-10k': 15.0, '10k-15k': 12.0,\
  \ '15k+': 10.0}\ndf['cap_percent'] = df['SalarySlab'].map(cap_map)\ndf['approved_percent']\
  \ = np.minimum(df['recommended_percent'], df['cap_percent'])\ndf['approved_amount']\
  \ = df['MonthlyIncome'] * (df['approved_percent'] / 100.0)\n\n# Department budgets,\
  \ relies on Department/JobRole consistency\ndept_budget = df.groupby('Department',\
  \ as_index=False).agg(\n    Headcount=('EmpID', 'count'),\n    MeritBudget=('approved_amount',\
  \ 'sum')\n)\n\ndepartment_budget_path = os.path.join(args.output, 'dept_budgets.csv')\n\
  dept_budget.to_csv(department_budget_path, index=False)\n\n# Attrition risk scoring\n\
  age_weight_map = {\n    '18-25': 0.5,\n    '26-35': 0.2,\n    '36-45': 0.0,\n  \
  \  '46-55': -0.2,\n    '55+': -0.3\n}\ndf['age_weight'] = df['AgeGroup'].map(age_weight_map)\n\
  \nyac = pd.to_numeric(df['YearsAtCompany'], errors='coerce')\nysp = pd.to_numeric(df['YearsSinceLastPromotion'],\
  \ errors='coerce')\n# Features for risk\nsafe_yac = yac.fillna(0)\nsafe_ysp = ysp.fillna(0)\n\
  den = safe_yac.replace(0, np.nan)\ntenure_ratio = (safe_ysp / den).fillna(0.0)\n\
  \not_flag = (df['OverTime'] == 'Yes').astype(float)\njob_sat_map = {1: 0.4, 2: 0.2,\
  \ 3: -0.1, 4: -0.2}\nwlb_map = {1: 0.5, 2: 0.2, 3: 0.0, 4: -0.1}\njob_penalty =\
  \ df['JobSatisfaction'].map(job_sat_map).astype(float)\nwlb_penalty = df['WorkLifeBalance'].map(wlb_map).astype(float)\n\
  \nmax_dist = max(1.0, float(df['DistanceFromHome'].max()))\ndist_norm = df['DistanceFromHome'].astype(float)\
  \ / max_dist\n\nmgr_tenure = df['YearsWithCurrManager'].fillna(0).astype(float)\n\
  mgr_penalty = np.where(mgr_tenure < 1.0, 0.2, 0.0)\nyes_rate = (df['Attrition']\
  \ == 'Yes').mean()\nintercept = float(np.log((yes_rate + 1e-6) / (1.0 - yes_rate\
  \ + 1e-6)))\n\nraw_score = (\n        intercept\n        + 1.2 * ot_flag\n     \
  \   + 0.8 * job_penalty\n        + 0.7 * wlb_penalty\n        + 0.6 * df['age_weight'].astype(float)\n\
  \        + 0.7 * tenure_ratio.astype(float)\n        + 0.5 * dist_norm.astype(float)\n\
  \        + 0.3 * mgr_penalty.astype(float)\n)\n\nrisk_score = 1.0 / (1.0 + np.exp(-raw_score))\n\
  df['AttritionRiskScore'] = risk_score\nbins = [0.0, 0.4, 0.6, 1.0]\nlabels = ['Low',\
  \ 'Medium', 'High']\ndf['RiskTier'] = pd.cut(df['AttritionRiskScore'], bins=bins,\
  \ labels=labels, include_lowest=True, right=False)\n\n# Outputs\nrisk_cols = ['EmpID',\
  \ 'Department', 'JobRole', 'AgeGroup', 'AttritionRiskScore', 'RiskTier']\nrisk_out\
  \ = os.path.join(args.output, 'risk_scores.csv')\ndf[risk_cols].to_csv(risk_out,\
  \ index=False)\n\nmerit_cols = ['EmpID', 'MonthlyIncome', 'SalarySlab', 'PercentSalaryHike',\
  \ 'PerformanceRating', 'rating_bonus',\n              'cap_percent', 'approved_percent',\
  \ 'approved_amount']\nmerit_out = os.path.join(args.output, 'merit_adjustments.csv')\n\
  df[merit_cols].to_csv(merit_out, index=False)\n\n```\n\nThe same program is on disk\
  \ at `./code/general_task_6.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 45,\
