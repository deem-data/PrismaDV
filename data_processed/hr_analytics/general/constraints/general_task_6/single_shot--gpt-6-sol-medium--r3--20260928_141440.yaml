constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age >= 18 AND Age <= 60', 'valid_employee_age')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age > 55 AND
        AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition').isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department').isContainedIn('Department', ['Sales', 'Research
        & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  Department, JobRole:
    code:
    - - .satisfies("(JobRole IN ('Sales Executive', 'Sales Representative') AND Department
        = 'Sales') OR (JobRole IN ('Research Director', 'Research Scientist', 'Manufacturing
        Director', 'Healthcare Representative', 'Laboratory Technician') AND Department
        = 'Research & Development') OR (JobRole = 'Human Resources' AND Department
        = 'Human Resources') OR JobRole = 'Manager'", 'department_job_role_consistency')
      - Valid
    assumptions: []
    column_name: Department, JobRole
  DistanceFromHome:
    code:
    - - .isComplete('DistanceFromHome').isPositive('DistanceFromHome')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole').isContainedIn('JobRole', ['Research Director', 'Sales
        Representative', 'Research Scientist', 'Manufacturing Director', 'Healthcare
        Representative', 'Sales Executive', 'Manager', 'Human Resources', 'Laboratory
        Technician'])
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction').satisfies('JobSatisfaction IN (1, 2, 3, 4)',
        'mapped_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
        > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  OverTime:
    code:
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike').satisfies('PercentSalaryHike >= 0 AND PercentSalaryHike
        <= 100', 'valid_percent_salary_hike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating').satisfies('PerformanceRating IN (3, 4)',
        'mapped_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance').satisfies('WorkLifeBalance IN (1, 2, 3, 4)',
        'mapped_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsAtCompany, YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, YearsSinceLastPromotion
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').isNonNegative('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'valid_optional_manager_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
