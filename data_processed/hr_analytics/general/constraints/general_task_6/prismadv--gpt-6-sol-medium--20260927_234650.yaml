    assumptions:
    - text: Both 'YearsAtCompany' and 'YearsSinceLastPromotion' should be present
        and numeric for every employee. Otherwise, the code silently substitutes zero
        when calculating tenure_ratio. This can be checked with a row-level constraint
        requiring both columns to be non-null and numeric.
      sources:
      - start_line: 45
        end_line: 51
        file: ''
      uid: 906b5bfc-0d0c-4b26-86b1-39586e9d422a
    - text: For every employee, 0 <= 'YearsSinceLastPromotion' <= 'YearsAtCompany'.
        In particular, an employee with zero years at the company should have zero
        years since their last promotion. This keeps the tenure ratio used in risk
        scoring between 0 and 1 when 'YearsAtCompany' is positive. A Deequ constraint
        could use .satisfies("YearsAtCompany >= 0 AND YearsSinceLastPromotion >= 0
        AND YearsSinceLastPromotion <= YearsAtCompany", "valid_promotion_tenure").
      sources:
