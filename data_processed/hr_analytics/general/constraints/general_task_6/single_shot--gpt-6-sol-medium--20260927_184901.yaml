constraints:
  Age:
    code:
    - - .satisfies('Age >= 18', 'adult_employee_age')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age > 55)", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  Department, JobRole:
    code:
    - - .satisfies("(Department = 'Sales' AND JobRole IN ('Sales Executive', 'Sales
        Representative', 'Manager')) OR (Department = 'Research & Development' AND
        JobRole IN ('Research Director', 'Research Scientist', 'Manufacturing Director',
        'Healthcare Representative', 'Laboratory Technician', 'Manager')) OR (Department
        = 'Human Resources' AND JobRole IN ('Human Resources', 'Manager'))", 'job_role_matches_department')
      - Valid
    assumptions: []
    column_name: Department, JobRole
  DistanceFromHome:
    code:
    - - .isPositive('DistanceFromHome')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isContainedIn('JobSatisfaction', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .satisfies('PercentSalaryHike BETWEEN 0 AND 100', 'valid_percent_salary_hike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  WorkLifeBalance:
    code:
    - - .isContainedIn('WorkLifeBalance', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsAtCompany, YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, YearsSinceLastPromotion
  YearsSinceLastPromotion:
    code:
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager, YearsAtCompany:
    code:
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'manager_tenure_valid_when_present')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager, YearsAtCompany
