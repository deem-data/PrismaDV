  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    - - .satisfies("`JobRole` <> 'Human Resources' OR `Department` = 'Human Resources'",
        'hr_role_department_consistency')
      - Valid
    - - .satisfies("`JobRole` IN ('Research Director', 'Sales Representative', 'Research
        Scientist', 'Manufacturing Director', 'Healthcare Representative', 'Sales
        Executive', 'Manager', 'Human Resources', 'Laboratory Technician')", 'known_job_role')
      - Valid
    - - .satisfies("`JobRole` NOT IN ('Research Director', 'Research Scientist', 'Manufacturing
        Director', 'Healthcare Representative', 'Laboratory Technician') OR `Department`
        = 'Research & Development'", 'research_role_department_consistency')
      - Valid
    - - .satisfies("`JobRole` NOT IN ('Sales Executive', 'Sales Representative') OR
        `Department` = 'Sales'", 'sales_role_department_consistency')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('`JobSatisfaction` IN (1, 2, 3, 4)', 'mapped_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isComplete('PercentSalaryHike')
      - Valid
    - - .satisfies('`PercentSalaryHike` >= 0 AND `PercentSalaryHike` <= 100', 'valid_salary_hike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('`PerformanceRating` IN (3, 4)', 'mapped_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('`WorkLifeBalance` IN (1, 2, 3, 4)', 'mapped_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .satisfies('`YearsAtCompany` >= 0', 'nonnegative_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('`YearsSinceLastPromotion` >= 0 AND `YearsSinceLastPromotion` <=
        `YearsAtCompany`', 'valid_promotion_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .satisfies('`YearsWithCurrManager` IS NULL OR (`YearsWithCurrManager` >= 0
        AND `YearsWithCurrManager` <= `YearsAtCompany`)', 'valid_manager_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
