    - suggestion: '.satisfies("CASE WHEN `SalarySlab` = ''Upto 5k'' THEN `MonthlyIncome`
        <= 5000 WHEN `SalarySlab` = ''5k-10k'' THEN `MonthlyIncome` > 5000 AND `MonthlyIncome`
        <= 10000 WHEN `SalarySlab` = ''10k-15k'' THEN `MonthlyIncome` > 10000 AND
        `MonthlyIncome` <= 15000 WHEN `SalarySlab` = ''15k+'' THEN `MonthlyIncome`
        > 15000 ELSE FALSE END", "income_matches_salary_slab", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 030818dc-44e4-4e32-ade9-54b2379e4e38
      source_assumptions:
      - f3d53dd8-f2be-4a0b-bc1f-a84b35677a06
    assumptions:
    - text: The input 'MonthlyIncome' column should be present and contain no null
        or blank values. Missing or nonnumeric values are coerced to null, but the
        final conversion of 'NewMonthlyIncome' to a nonnullable integer requires a
        valid income for every row.
      sources:
      - start_line: 53
        end_line: 65
        file: ''
      - start_line: 103
        end_line: 112
        file: ''
      uid: 8fa48601-49ef-476b-b7f8-141e645c4ce5
    - text: Every 'MonthlyIncome' value should be a finite, whole-number monthly salary
        that can be converted to a numeric value. The code uses income in division,
        ranking, and raise calculations, then outputs the result as an integer.
      sources:
      - start_line: 65
        end_line: 70
        file: ''
      - start_line: 87
        end_line: 87
        file: ''
      - start_line: 103
        end_line: 112
        file: ''
      uid: f68128ac-7e41-433c-9c90-07a94cb88910
    - text: Each 'MonthlyIncome' value should be positive. Zero or negative values
        would not represent a monthly salary and would distort compensation ratios,
        salary rankings, and raise recommendations.
      sources:
      - start_line: 68
        end_line: 77
        file: ''
      - start_line: 87
        end_line: 87
        file: ''
      - start_line: 103
        end_line: 112
        file: ''
      uid: 1b2462b8-ce84-42b6-9fbe-5234463873c3
    - text: 'Each row''s input ''MonthlyIncome'' should agree with its ''SalarySlab'':
        ''Upto 5k'' for income at most 5000, ''5k-10k'' for 5000 < income <= 10000,
        ''10k-15k'' for 10000 < income <= 15000, and ''15k+'' for income > 15000.
        The script uses the supplied slab, rather than recalculating it, to select
        the midpoint and promotion band threshold.'
      sources:
      - start_line: 8
        end_line: 19
        file: ''
      - start_line: 22
        end_line: 30
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      - start_line: 101
