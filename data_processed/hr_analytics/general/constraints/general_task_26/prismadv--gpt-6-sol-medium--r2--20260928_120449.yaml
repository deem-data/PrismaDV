        end_line: 70
        file: ''
      - start_line: 101
        end_line: 101
        file: ''
      - start_line: 116
        end_line: 119
        file: ''
      uid: 7bf83c71-3469-4b96-83e4-06cca33da898
    - text: Every 'SalarySlab' value should be exactly one of 'Upto 5k', '5k-10k',
        '10k-15k', or '15k+'. These are the labels recognized by the band-midpoint
        mapping and salary-band logic; other values would have no band midpoint.
      sources:
      - start_line: 8
        end_line: 19
        file: ''
      - start_line: 22
        end_line: 30
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      uid: 5faddd65-8b1b-4cc3-8268-780ce8462272
    - text: 'Each input ''SalarySlab'' should agree with its numeric ''MonthlyIncome'':
        ''Upto 5k'' when income is at most 5000, ''5k-10k'' when income is greater
        than 5000 and at most 10000, ''10k-15k'' when income is greater than 10000
        and at most 15000, and ''15k+'' when income is greater than 15000. Income
        should be present and numeric for this check. The code uses the existing slab
