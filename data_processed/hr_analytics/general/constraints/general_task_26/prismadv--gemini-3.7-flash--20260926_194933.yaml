  '["JobLevel","MonthlyIncome","PerformanceRating","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: 'There should be a positive correlation between ''JobLevel'' and ''MonthlyIncome'',
        as higher job levels typically correspond to higher monthly income brackets.
        We could represent this assumption as a Deequ constraint like: .hasCorrelation("JobLevel",
        "MonthlyIncome", _ > 0.5)'
      sources:
      - start_line: 87
        end_line: 87
        file: ''
      - start_line: 90
        end_line: 95
        file: ''
      uid: 1dc3223e-c113-4cb7-8402-c84c2a97617d
    - text: The columns 'PerformanceRating', 'YearsSinceLastPromotion', 'JobLevel',
        and 'MonthlyIncome' are jointly evaluated to determine promotion recommendations
        and compensation increases, requiring them to be mutually consistent and non-null
        for valid ranking and threshold comparisons.
      sources:
      - start_line: 87
        end_line: 95
        file: ''
      - start_line: 97
        end_line: 104
        file: ''
      uid: 46eae229-fbc6-4583-8d40-cc578ab6fb60
  '["JobLevel","MonthlyIncome"]':
    code: []
    assumptions:
    - text: 'The columns ''JobLevel'' and ''MonthlyIncome'' are expected to have a
        positive correlation, where higher job levels correspond to higher monthly
        income values on average across the organization. In Deequ, this can be expressed
        as: .hasCorrelation(''JobLevel'', ''MonthlyIncome'', _ > 0.5)'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 87
        end_line: 95
        file: ''
      uid: a4f82b02-778a-4bdb-b6c3-dec136e6af4d
  '["MonthlyIncome","SalarySlab"]':
    code: []
    assumptions:
    - text: 'The ''SalarySlab'' column should be consistent with the ''MonthlyIncome''
        column according to the income bands: ''Upto 5k'' for MonthlyIncome <= 5000,
        ''5k-10k'' for MonthlyIncome between 5001 and 10000, ''10k-15k'' for MonthlyIncome
        between 10001 and 15000, and ''15k+'' for MonthlyIncome > 15000. We could
        represent this assumption as a Deequ constraint like: .satisfies("CASE WHEN
        SalarySlab = ''Upto 5k'' THEN MonthlyIncome <= 5000 WHEN SalarySlab = ''5k-10k''
        THEN MonthlyIncome > 5000 AND MonthlyIncome <= 10000 WHEN SalarySlab = ''10k-15k''
        THEN MonthlyIncome > 10000 AND MonthlyIncome <= 15000 WHEN SalarySlab = ''15k+''
        THEN MonthlyIncome > 15000 ELSE FALSE END", ''SalarySlab_MonthlyIncome_Consistency'')'
      sources:
      - start_line: 8
        end_line: 20
        file: ''
      - start_line: 22
        end_line: 31
        file: ''
      - start_line: 34
        end_line: 41
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      uid: 5116066d-480f-41d7-8aab-906855024593
  '["TotalWorkingYears","YearsAtCompany"]':
    code:
    - suggestion: .isLessThanOrEqualTo('YearsAtCompany', 'TotalWorkingYears')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 15c19d99-8933-4396-b2f3-f7947b31143c
      source_assumptions:
      - aaed0da6-929a-4c37-ae16-63e6d6a8a6d3
    assumptions:
    - text: 'The ''YearsAtCompany'' must be less than or equal to ''TotalWorkingYears''
        for each employee record, reflecting the domain rule that tenure at the current
        company cannot exceed an employee''s total career working years. This can
        be represented in Deequ as: .satisfies(''YearsAtCompany <= TotalWorkingYears'',
        ''YearsAtCompany <= TotalWorkingYears'')'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 80
        end_line: 84
        file: ''
      uid: aaed0da6-929a-4c37-ae16-63e6d6a8a6d3
  '["YearsAtCompany","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: 'The value of ''YearsSinceLastPromotion'' should be less than or equal
        to ''YearsAtCompany'' for each employee, as an employee cannot have gone more
        years since their last promotion than their total tenure at the company. We
        could represent this assumption as a deequ constraint like this: .satisfies("YearsSinceLastPromotion
        <= YearsAtCompany", "YearsSinceLastPromotion <= YearsAtCompany")'
      sources:
      - start_line: 81
        end_line: 84
        file: ''
      uid: 4fb939a7-f779-480f-a406-f0074cd6e1ce
