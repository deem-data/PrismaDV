constraints:
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    - - .satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('PerformanceRating IN (3, 4)', 'valid_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
        > 15000 AND SalarySlab = '15k+')", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    - - .satisfies('TotalWorkingYears >= YearsAtCompany', 'working_years_cover_company_tenure')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_years_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
