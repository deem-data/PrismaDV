prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef assign_salary_slab(income):\n\
  \    if pd.isna(income):\n        return np.nan\n    v = float(income)\n    if v\
  \ <= 5000:\n        return \"Upto 5k\"\n    elif v <= 10000:\n        return \"\
  5k-10k\"\n    elif v <= 15000:\n        return \"10k-15k\"\n    else:\n        return\
  \ \"15k+\"\n\n\ndef get_band_midpoints(df):\n    mid = {\n        \"Upto 5k\": 2500.0,\n\
  \        \"5k-10k\": 7500.0,\n        \"10k-15k\": 12500.0,\n        \"15k+\": df.loc[df[\"\
  SalarySlab\"] == \"15k+\", \"MonthlyIncome\"].median(),\n    }\n    if pd.isna(mid[\"\
  15k+\"]):\n        mid[\"15k+\"] = 17500.0\n    return mid\n\n\ndef next_band_lower_bound(slab):\n\
  \    if slab == \"Upto 5k\":\n        return 5001\n    if slab == \"5k-10k\":\n\
  \        return 10001\n    if slab == \"10k-15k\":\n        return 15001\n    return\
  \ None\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_file = os.path.join(args.input, 'new_data.csv')\n\
  \    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\
  \n    # Coerce types that are required for analytics\n    for col in [\n       \
  \ \"MonthlyIncome\",\n        \"JobLevel\",\n        \"PerformanceRating\",\n  \
  \      \"YearsAtCompany\",\n        \"TotalWorkingYears\",\n        \"YearsSinceLastPromotion\"\
  ,\n    ]:\n        if col in df.columns:\n            df[col] = pd.to_numeric(df[col],\
  \ errors='coerce')\n\n    # Guard use of band logic against invalid slab-income\
  \ alignments\n    band_mid = get_band_midpoints(df)\n    df[\"BandMidpoint\"] =\
  \ df[\"SalarySlab\"].map(band_mid)\n    df[\"CompaRatio\"] = df[\"MonthlyIncome\"\
  ] / df[\"BandMidpoint\"]\n\n    rating_raise = {3: 0.03, 4: 0.08}\n    df[\"BaseRaisePct\"\
  ] = df[\"PerformanceRating\"].map(rating_raise).fillna(0.0)\n\n    df[\"MarketAdjPct\"\
  ] = np.where(\n        df[\"CompaRatio\"] < 0.90, 0.02,\n        np.where(df[\"\
  CompaRatio\"] > 1.10, -0.01, 0.0)\n    )\n\n    # Tenure-derived calculations rely\
  \ on hierarchical year consistency\n    df[\"TenureRatio\"] = np.where(df[\"YearsAtCompany\"\
  ] > 0,\n                                 df[\"YearsSinceLastPromotion\"] / df[\"\
  YearsAtCompany\"],\n                                 0.0)\n    df[\"TenureAdjPct\"\
  ] = np.minimum(0.02, 0.02 * df[\"TenureRatio\"])\n\n    # Level-salary relationship\
  \ sanity prior to percentile-based promotion gating\n    df[\"LevelPercentile\"\
  ] = df.groupby(\"JobLevel\")[\"MonthlyIncome\"].rank(pct=True, method=\"average\"\
  )\n\n    # High-level compensation tiering alignment before using level-based logic\n\
  \    df[\"PromotionRecommended\"] = (\n            (df[\"PerformanceRating\"] >=\
  \ 4) &\n            (df[\"YearsSinceLastPromotion\"] >= 2) &\n            (df[\"\
  LevelPercentile\"] >= 0.85) &\n            (df[\"JobLevel\"] < df[\"JobLevel\"].max())\n\
  \    )\n\n    df[\"RecommendedRaisePct\"] = df[[\"BaseRaisePct\", \"MarketAdjPct\"\
  , \"TenureAdjPct\"]].sum(axis=1)\n    df[\"PromoKickerPct\"] = np.where(df[\"PromotionRecommended\"\
  ], 0.10, 0.0)\n    df[\"TotalRaisePct\"] = (df[\"RecommendedRaisePct\"] + df[\"\
  PromoKickerPct\"]).clip(lower=0.0, upper=0.20)\n\n    df[\"NextBandMin\"] = df[\"\
  SalarySlab\"].map(next_band_lower_bound)\n\n    new_income = (df[\"MonthlyIncome\"\
  ] * (1.0 + df[\"TotalRaisePct\"]))\n    new_income = new_income.round(0).astype(\"\
  Int64\")\n\n    promo_mask = df[\"PromotionRecommended\"] & df[\"NextBandMin\"].notna()\n\
  \    if promo_mask.any():\n        nbmin = df.loc[promo_mask, \"NextBandMin\"].astype(int)\n\
  \        boosted = np.maximum(new_income.loc[promo_mask].astype(int).values, nbmin.values)\n\
  \        new_income.loc[promo_mask] = boosted\n\n    df[\"NewMonthlyIncome\"] =\
  \ new_income.astype(int)\n    df[\"NewSalarySlab\"] = df[\"NewMonthlyIncome\"].apply(assign_salary_slab)\n\
  \    df[\"NewJobLevel\"] = np.where(df[\"PromotionRecommended\"], df[\"JobLevel\"\
  ] + 1, df[\"JobLevel\"])\n\n    out_cols = [\n        \"EmpID\",\n        \"JobLevel\"\
  ,\n        \"SalarySlab\",\n        \"MonthlyIncome\",\n        \"PerformanceRating\"\
  ,\n        \"YearsAtCompany\",\n        \"TotalWorkingYears\",\n        \"YearsSinceLastPromotion\"\
  ,\n        \"PromotionRecommended\",\n        \"NewJobLevel\",\n        \"RecommendedRaisePct\"\
  ,\n        \"PromoKickerPct\",\n        \"TotalRaisePct\",\n        \"NewMonthlyIncome\"\
  ,\n        \"NewSalarySlab\",\n    ]\n    existing_cols = [c for c in out_cols if\
  \ c in df.columns]\n    df_out = df[existing_cols]\n\n    out_path = os.path.join(args.output,\
  \ 'compensation_recommendations.csv')\n    df_out.to_csv(out_path, index=False)\n\
  \n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on disk\
  \ at `./code/general_task_26.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
