      \ data that would crash the code OR silently produce incorrect results (e.g.,\
      \ unexpected values or nulls propagating NaNs through mappings and arithmetic\
      \ formulas, corrupted aggregations, negative durations/tenures/ages/incomes,\
      \ or out-of-domain rating scales).\n- CRITICAL REQUIREMENT: For every target\
      \ column, ensure at least one primary constraint (such as `.isComplete()` when\
      \ completeness is 1.0, `.isNonNegative()` for non-negative metrics, or `.isContainedIn()`\
      \ for defined categories/scales) is set to level \"error\". A suite with zero\
      \ error-level checks can never flag an erroneous batch, causing missed errors.\n\
      - Do NOT set speculative cross-column relational checks (e.g., `.isGreaterThanOrEqualTo('colA',\
