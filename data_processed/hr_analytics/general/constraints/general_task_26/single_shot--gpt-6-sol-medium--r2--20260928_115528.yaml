constraints:
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    - - .satisfies('JobLevel BETWEEN 1 AND 5', 'valid job level')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobLevel, MonthlyIncome:
    code:
    - - '.hasCorrelation(''JobLevel'', ''MonthlyIncome'', lambda value: value > 0.6)'
      - Valid
    assumptions: []
    column_name: JobLevel, MonthlyIncome
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('PerformanceRating IN (3, 4)', 'supported performance rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    assumptions: []
    column_name: SalarySlab
  SalarySlab, MonthlyIncome:
    code:
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'salary slab matches monthly income')
      - Valid
    assumptions: []
    column_name: SalarySlab, MonthlyIncome
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsSinceLastPromotion, YearsAtCompany, TotalWorkingYears:
    code:
    - - .satisfies('YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion <= YearsAtCompany
        AND YearsAtCompany <= TotalWorkingYears', 'consistent tenure hierarchy')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion, YearsAtCompany, TotalWorkingYears
