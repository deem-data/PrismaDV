        end_line: 93
        file: ''
      uid: ebed797e-d360-42af-bf24-6121e7ab8945
    - text: '''YearsSinceLastPromotion'' should be at least 0. A negative elapsed
        time would produce a negative tenure adjustment and would not satisfy the
        promotion eligibility threshold.'
      sources:
      - start_line: 81
        end_line: 84
        file: ''
      - start_line: 90
        end_line: 93
        file: ''
      uid: 4242fec1-5041-48fc-ac6a-6f78ee437538
    - text: For each row, 'YearsSinceLastPromotion' should not exceed 'YearsAtCompany'.
        This preserves the hierarchical tenure relationship assumed by the ratio calculation;
        when 'YearsAtCompany' is 0, 'YearsSinceLastPromotion' should also be 0.
      sources:
      - start_line: 80
        end_line: 84
        file: ''
      uid: 2d4849fb-a42b-451e-a46c-3096499715e1
  '["JobLevel","MonthlyIncome","PerformanceRating","YearsSinceLastPromotion"]':
    code:
    - suggestion: .satisfies('TRY_CAST(`PerformanceRating` AS DOUBLE) IS NOT NULL
        AND TRY_CAST(`YearsSinceLastPromotion` AS DOUBLE) IS NOT NULL AND TRY_CAST(`JobLevel`
        AS DOUBLE) IS NOT NULL AND TRY_CAST(`MonthlyIncome` AS DOUBLE) IS NOT NULL',
