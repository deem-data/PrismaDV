    - suggestion: .satisfies('`YearsSinceLastPromotion` IS NOT NULL AND `YearsAtCompany`
        IS NOT NULL AND `TotalWorkingYears` IS NOT NULL AND `YearsSinceLastPromotion`
        >= 0 AND `YearsSinceLastPromotion` <= `YearsAtCompany` AND `YearsAtCompany`
