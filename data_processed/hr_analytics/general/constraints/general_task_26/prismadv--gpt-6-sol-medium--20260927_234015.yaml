      source_assumptions:
      - 94af3dd1-278b-458f-b712-f45adfa53105
    assumptions:
    - text: For every employee, 'PerformanceRating', 'YearsSinceLastPromotion', 'JobLevel',
        and 'MonthlyIncome' should all be non-null and numeric. A missing value could
        silently prevent a promotion recommendation or produce a missing income that
        fails the final integer conversion. This can be checked with a row-level constraint
        requiring all four columns to be non-null and numeric.
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 87
        end_line: 95
        file: ''
      - start_line: 103
        end_line: 114
        file: ''
      uid: 5b677cf5-ffc5-4f38-847c-b079783494a1
    - text: For each employee, 'YearsSinceLastPromotion' should be non-negative and
        no greater than 'YearsAtCompany'; 'YearsAtCompany' should be no greater than
        'TotalWorkingYears'. This keeps the tenure ratio and promotion-tenure test
        consistent with the employee's work history.
      sources:
      - start_line: 80
        end_line: 84
        file: ''
      - start_line: 90
        end_line: 94
        file: ''
      uid: 63dc0097-c8c3-4bb8-8481-f56528fffd69
    - text: 'Each employee''s ''SalarySlab'' should agree with ''MonthlyIncome'':
        ''Upto 5k'' for income at most 5000, ''5k-10k'' for income from 5001 through
        10000, ''10k-15k'' for income from 10001 through 15000, and ''15k+'' for income
        above 15000. Otherwise the slab-derived midpoint and next-band minimum are
        applied to the wrong income range.'
      sources:
      - start_line: 8
        end_line: 19
        file: ''
      - start_line: 22
        end_line: 40
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      - start_line: 101
        end_line: 110
        file: ''
      uid: 94af3dd1-278b-458f-b712-f45adfa53105
    - text: "The median 'MonthlyIncome' should be non-decreasing as 'JobLevel' increases.\
        \ This is an aggregate level\u2013salary sanity check, not a requirement that\
        \ every higher-level employee earn more than every lower-level employee; the\
        \ code uses within-level income percentiles to gate promotions."
      sources:
      - start_line: 86
        end_line: 94
        file: ''
      uid: a15cdcdd-6079-46db-a5d2-b7daf69d9740
