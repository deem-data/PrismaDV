  '["JobLevel","MonthlyIncome","PerformanceRating","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: The 'JobLevel' and 'MonthlyIncome' columns are used together to calculate
        the within-level salary percentile using `df.groupby('JobLevel')['MonthlyIncome'].rank()`.
        Both columns must be non-null and numeric so that records can be correctly
        grouped by job level and ranked by monthly income.
      sources:
      - start_line: 87
        end_line: 87
        file: ''
      uid: 73ada05b-1398-4018-a9d7-fa4810fbe2cc
    - text: The columns 'PerformanceRating', 'YearsSinceLastPromotion', 'JobLevel',
        and 'MonthlyIncome' (via 'LevelPercentile') are evaluated together in boolean
        conditions to determine promotion eligibility ('PromotionRecommended'). They
        must be consistently populated across records to ensure accurate logical evaluation.
      sources:
      - start_line: 87
        end_line: 95
        file: ''
      uid: a01c68f5-9205-4064-83b5-1eb33d298f91
  '["JobLevel","MonthlyIncome"]':
    code: []
    assumptions:
    - text: 'There should be a strong positive correlation between ''MonthlyIncome''
        and ''JobLevel'', as higher job levels are expected to correspond to higher
        monthly income when computing level-based percentiles and promotion evaluations.
        This can be expressed as a Deequ correlation constraint: .hasCorrelation("JobLevel",
        "MonthlyIncome", lambda c: c > 0.5)'
      sources:
      - start_line: 87
        end_line: 95
        file: ''
      uid: f45338db-2e98-40ac-9b32-c39192ab4446
  '["MonthlyIncome","SalarySlab"]':
    code:
    - suggestion: .satisfies("(`SalarySlab` = 'Upto 5k' AND `MonthlyIncome` <= 5000)
        OR (`SalarySlab` = '5k-10k' AND `MonthlyIncome` > 5000 AND `MonthlyIncome`
        <= 10000) OR (`SalarySlab` = '10k-15k' AND `MonthlyIncome` > 10000 AND `MonthlyIncome`
        <= 15000) OR (`SalarySlab` = '15k+' AND `MonthlyIncome` > 15000)", "SalarySlab_MonthlyIncome_Consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 65fb81d7-f710-4ebc-bafe-1be48127ac9c
      source_assumptions:
      - 514136ca-426c-424e-8062-24159c3b0ed9
    assumptions:
    - text: 'The values in ''SalarySlab'' must be consistent with the corresponding
        ranges in ''MonthlyIncome'': ''Upto 5k'' corresponds to MonthlyIncome <= 5000,
        ''5k-10k'' corresponds to 5000 < MonthlyIncome <= 10000, ''10k-15k'' corresponds
        to 10000 < MonthlyIncome <= 15000, and ''15k+'' corresponds to MonthlyIncome
        > 15000. This relationship can be expressed with conditional constraints or
        a custom check such as: .satisfies("(SalarySlab == ''Upto 5k'' AND MonthlyIncome
        <= 5000) OR (SalarySlab == ''5k-10k'' AND MonthlyIncome > 5000 AND MonthlyIncome
        <= 10000) OR (SalarySlab == ''10k-15k'' AND MonthlyIncome > 10000 AND MonthlyIncome
        <= 15000) OR (SalarySlab == ''15k+'' AND MonthlyIncome > 15000)", ''SalarySlab_MonthlyIncome_Consistency'')'
      sources:
      - start_line: 8
        end_line: 19
        file: ''
      - start_line: 22
        end_line: 31
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      uid: 514136ca-426c-424e-8062-24159c3b0ed9
  '["TotalWorkingYears","YearsAtCompany"]':
    code:
    - suggestion: .isLessThanOrEqualTo('YearsAtCompany', 'TotalWorkingYears')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6d0292e3-07e5-41e4-b665-2ce71cf39c52
      source_assumptions:
      - 05e8ccfb-a761-46d1-906f-9871ff363d06
    assumptions:
    - text: 'The number of years spent at the company (''YearsAtCompany'') must not
        exceed the total working years (''TotalWorkingYears'') for any employee. We
        can express this constraint as: .satisfies(''YearsAtCompany <= TotalWorkingYears'',
        ''YearsAtCompanyLeqTotalWorkingYears'')'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 80
        end_line: 84
        file: ''
      uid: 05e8ccfb-a761-46d1-906f-9871ff363d06
  '["YearsAtCompany","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: 'The value of ''YearsSinceLastPromotion'' should be less than or equal
        to ''YearsAtCompany'' for each record, as the time since the last promotion
        at the company cannot exceed the total tenure at the company. We could represent
        this assumption as a deequ constraint like this:

        .satisfies("YearsSinceLastPromotion <= YearsAtCompany", "YearsSinceLastPromotion_le_YearsAtCompany")

        '
      sources:
      - start_line: 80
        end_line: 84
        file: ''
      uid: 8d6cd8e0-de4c-4e41-9db7-24d8c0038ebf
