        to coerce it to a numeric data type.
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      uid: a07923d5-653a-49c2-9fe8-3200f196a40f
  YearsAtCompany:
    code:
    - suggestion: .isNonNegative('YearsAtCompany')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9368be73-d506-455f-a81b-496e956c1e50
      source_assumptions:
      - 684f339d-bc2e-4586-853e-d69ed6e3d760
    assumptions:
    - text: 'The ''YearsAtCompany'' column should be numeric and contain non-negative
        values (greater than or equal to 0), as it represents tenure and is evaluated
        in comparison operations (such as checking if tenure is greater than 0) and
        used in tenure ratio calculations. We could represent this assumption as a
        deequ constraint like this: .satisfies("CASE WHEN `YearsAtCompany` >= 0 THEN
        1 ELSE 0 END", "Non-negative YearsAtCompany", lambda x: x == 1.0)'
      sources:
