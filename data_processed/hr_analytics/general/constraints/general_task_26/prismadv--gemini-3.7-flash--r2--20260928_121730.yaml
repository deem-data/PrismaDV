  PerformanceRating:
    code:
    - suggestion: .hasDataType('PerformanceRating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 3376a40a-869e-4cad-98d2-f105e107fc72
      source_assumptions:
