      source_assumptions:
      - a457eb87-4c56-42ec-8d96-f174fd15033f
    assumptions:
    - text: 'The ''JobLevel'' column should contain numeric values and should be convertible
        to numbers, as the code applies ''pd.to_numeric'' and performs grouping, comparisons,
        and arithmetic operations (e.g., ''df["JobLevel"] + 1''). We could represent
        this assumption as a deequ constraint like this: .isDataType(''JobLevel'',
        org.apache.spark.sql.types.IntegerType)'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 87
        end_line: 87
        file: ''
      - start_line: 94
        end_line: 94
        file: ''
      - start_line: 114
        end_line: 114
        file: ''
      uid: 292934c3-c307-4beb-a8b1-78042456b3cb
    - text: 'The ''JobLevel'' column should be non-null and completely populated,
        as it is used to group records for percentile calculations, compare against
        the maximum level, and compute ''NewJobLevel''. We could represent this assumption
        as a deequ constraint like this: .isComplete(''JobLevel'')'
