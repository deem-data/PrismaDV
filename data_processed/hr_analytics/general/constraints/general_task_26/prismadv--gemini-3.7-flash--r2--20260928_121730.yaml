      source_assumptions:
      - 3acba6bc-2d40-4484-8065-97fb87a6fe91
    assumptions:
    - text: 'The ''PerformanceRating'' column should contain numeric values or values
        convertible to numbers, as the script converts it using ''pd.to_numeric''
        and performs numeric comparisons such as ''df["PerformanceRating"] >= 4''.
        We could represent this assumption as a deequ constraint like this: .isDataType(''PerformanceRating'',
        ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 90
        end_line: 95
        file: ''
      uid: 434bdd29-c3b8-4fa9-9c5b-921fad0a0fd1
    - text: 'The ''PerformanceRating'' column is expected to contain valid rating
        values such as 3 and 4, which are mapped to specific raise percentages ({3:
        0.03, 4: 0.08}) and evaluated for promotion eligibility (>= 4). We could represent
        this assumption as a deequ constraint like this: .isContainedIn(''PerformanceRating'',
        Array(''3'', ''4''))'
      sources:
      - start_line: 72
        end_line: 73
        file: ''
      - start_line: 90
        end_line: 95
        file: ''
      uid: 3acba6bc-2d40-4484-8065-97fb87a6fe91
  SalarySlab:
    code:
    - suggestion: .isComplete('SalarySlab')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 381d4ca9-6a5e-4568-a053-37bf6ab326d2
      source_assumptions:
      - e426e8d8-8a66-4f09-b4a4-333a5d977edc
    - suggestion: .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7a0a5f26-2b6d-4f2b-8fbc-bbfe9386ed68
      source_assumptions:
      - 3a3c5b99-d9e8-492e-a8be-69a2870bccf7
    assumptions:
    - text: 'The ''SalarySlab'' column should not contain null values because it is
        mapped to midpoint values and used directly in compa-ratio calculations without
        null imputation. We could represent this assumption as a deequ constraint
        like this: .isComplete(''SalarySlab'')'
      sources:
      - start_line: 22
        end_line: 31
        file: ''
      - start_line: 69
        end_line: 70
        file: ''
      uid: e426e8d8-8a66-4f09-b4a4-333a5d977edc
    - text: 'The ''SalarySlab'' column should only contain values from the expected
        categories: ''Upto 5k'', ''5k-10k'', ''10k-15k'', and ''15k+'', as the code
        explicitly maps midpoint salaries and next band bounds based on these exact
        values. Any unexpected value would result in NaN during mapping and disrupt
        subsequent compensation calculations. We could represent this assumption as
        a deequ constraint like this: .isContainedIn(''SalarySlab'', [''Upto 5k'',
        ''5k-10k'', ''10k-15k'', ''15k+''])'
      sources:
      - start_line: 22
        end_line: 31
        file: ''
      - start_line: 34
        end_line: 41
        file: ''
      - start_line: 69
        end_line: 70
        file: ''
      - start_line: 101
        end_line: 101
        file: ''
      uid: 3a3c5b99-d9e8-492e-a8be-69a2870bccf7
