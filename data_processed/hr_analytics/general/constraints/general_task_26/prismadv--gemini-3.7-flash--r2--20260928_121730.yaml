  MonthlyIncome:
    code:
    - suggestion: .isComplete('MonthlyIncome')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: dfdee12a-e8c1-402f-86aa-98d36ac4a146
      source_assumptions:
      - 167a1fdf-e310-43a1-9d05-14cd953c2b68
    - suggestion: .isNonNegative('MonthlyIncome')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 729c4e5b-eaec-48ee-8d99-f87ea79c4e1e
      source_assumptions:
      - ce3ffe63-7070-4b87-9259-6da247933897
    assumptions:
    - text: 'The ''MonthlyIncome'' column should not contain null values, as it is
        used in calculations and converted to standard integer type via `astype(int)`,
        which raises an error if NaN values are present. We could represent this assumption
        as a deequ constraint like this: .isComplete(''MonthlyIncome'')'
      sources:
      - start_line: 103
        end_line: 112
        file: ''
      uid: 167a1fdf-e310-43a1-9d05-14cd953c2b68
    - text: 'The ''MonthlyIncome'' column should contain non-negative numeric values
        (>= 0) representing employee monthly earnings for computing compa-ratios,
        level-based rank percentiles, and raise adjustments. We could represent this
        assumption as a deequ constraint like this: .satisfies(''`MonthlyIncome` >=
        0'', ''MonthlyIncome is non-negative'', lambda x: x == 1.0)'
      sources:
      - start_line: 56
        end_line: 65
        file: ''
      - start_line: 70
        end_line: 70
        file: ''
      - start_line: 87
        end_line: 87
