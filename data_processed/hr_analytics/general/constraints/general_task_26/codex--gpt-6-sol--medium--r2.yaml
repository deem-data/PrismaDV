  \ 'NumCompaniesWorked': 0, 'Over18': 'Y', 'OverTime': 'No', 'PercentSalaryHike':\
  \ 14, 'PerformanceRating': 3, 'RelationshipSatisfaction': 2, 'StandardHours': 80,\
  \ 'StockOptionLevel': 0, 'TotalWorkingYears': 9, 'TrainingTimesLastYear': 5, 'WorkLifeBalance':\
  \ 2, 'YearsAtCompany': 8, 'YearsSinceLastPromotion': 0, 'YearsWithCurrManager':\
