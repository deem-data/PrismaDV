  '["JobLevel","MonthlyIncome","PerformanceRating","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: There should be a strong positive correlation between 'JobLevel' and 'MonthlyIncome',
        as employee income typically scales with job level, which is critical for
        grouping and percentile ranking.
      sources:
      - start_line: 87
        end_line: 87
        file: ''
      uid: 32614958-4816-4dc6-8ded-e124ef862827
    - text: '''PerformanceRating'', ''YearsSinceLastPromotion'', ''JobLevel'', and
        ''MonthlyIncome'' are evaluated together to determine promotion recommendations.
        The columns must contain valid numerical values without nulls for the combined
        boolean gating logic to function properly.'
      sources:
      - start_line: 87
        end_line: 95
        file: ''
      uid: 7a529d56-691c-4ade-a81f-8a368475e472
  '["JobLevel","MonthlyIncome"]':
    code: []
    assumptions:
    - text: 'The ''JobLevel'' and ''MonthlyIncome'' columns are expected to have a
        positive correlation, where higher job levels correspond to higher monthly
        income. The downstream promotion and ranking logic groups monthly income by
        job level to calculate salary percentiles within each level. We could represent
        this assumption as a Deequ constraint like this: .hasCorrelation(''JobLevel'',
        ''MonthlyIncome'', _ > 0.5)'
      sources:
      - start_line: 87
        end_line: 95
        file: ''
      uid: 423d2030-c083-42ce-be10-7b4445664823
  '["MonthlyIncome","SalarySlab"]':
    code:
    - suggestion: .satisfies("(`SalarySlab` = 'Upto 5k' AND `MonthlyIncome` <= 5000)
        OR (`SalarySlab` = '5k-10k' AND `MonthlyIncome` > 5000 AND `MonthlyIncome`
        <= 10000) OR (`SalarySlab` = '10k-15k' AND `MonthlyIncome` > 10000 AND `MonthlyIncome`
        <= 15000) OR (`SalarySlab` = '15k+' AND `MonthlyIncome` > 15000)", "SalarySlab_MonthlyIncome_Consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 20486d16-ab3d-49c3-8fc1-e39a4f684d4a
      source_assumptions:
      - d8ccfc5a-8d92-46d7-a897-eafb76bdd139
    assumptions:
    - text: 'The ''SalarySlab'' column should be consistent with ''MonthlyIncome''
        based on the salary slab ranges: ''Upto 5k'' for MonthlyIncome <= 5000, ''5k-10k''
        for MonthlyIncome > 5000 and <= 10000, ''10k-15k'' for MonthlyIncome > 10000
        and <= 15000, and ''15k+'' for MonthlyIncome > 15000. We could represent this
        assumption as a Deequ constraint like this: .satisfies("(SalarySlab = ''Upto
        5k'' AND MonthlyIncome <= 5000) OR (SalarySlab = ''5k-10k'' AND MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab = ''10k-15k'' AND MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab = ''15k+'' AND MonthlyIncome
        > 15000)", "SalarySlab_MonthlyIncome_Consistency")'
      sources:
      - start_line: 8
        end_line: 19
        file: ''
      - start_line: 22
        end_line: 31
        file: ''
      - start_line: 68
        end_line: 70
        file: ''
      uid: d8ccfc5a-8d92-46d7-a897-eafb76bdd139
