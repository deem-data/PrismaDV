  '["JobLevel","PerformanceRating","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: 'The columns ''JobLevel'', ''PerformanceRating'', and ''YearsSinceLastPromotion''
        must all be non-null and numeric. They are evaluated together in boolean conditions
