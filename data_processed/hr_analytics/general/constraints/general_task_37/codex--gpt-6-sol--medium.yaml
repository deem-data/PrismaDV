prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\nos.makedirs(args.output,\
  \ exist_ok=True)\n\ninput_file = os.path.join(args.input, 'new_data.csv')\ndf =\
  \ pd.read_csv(input_file)\n\n# Derive fields used by downstream eligibility/compensation\
  \ logic\nagegroup_to_stage = {\n    '18-25': 'early',\n    '26-35': 'early',\n \
  \   '36-45': 'mid',\n    '46-55': 'senior',\n    '55+': 'late'\n}\ndf['CareerStage']\
  \ = df['AgeGroup'].map(agegroup_to_stage).fillna('unknown')\n# Tenure relationship\
  \ checks before computing ratios and derived features\n# Ratios and derived tenure\
  \ features\nratio_in_role = df['YearsInCurrentRole'] / df['YearsAtCompany']\nratio_in_role\
  \ = ratio_in_role.replace([np.inf, -np.inf], np.nan).fillna(0.0)\nstagnation_years\
  \ = df['YearsAtCompany'] - df['YearsSinceLastPromotion']\nsqrt_stagnation = np.sqrt(stagnation_years.clip(lower=0))\n\
  \n# Department and JobRole alignment checks before budget multipliers\n# Budget\
  \ multipliers by department\nbudget_multipliers = {\n    'Sales': 1.00,\n    'Research\
  \ & Development': 1.05,\n    'Human Resources': 0.95\n}\ndf['BudgetMultiplier']\
  \ = df['Department'].map(budget_multipliers).fillna(1.00)\n\n# Salary slab alignment\
  \ and medians before compa ratios and caps\nslab_order = ['Upto 5k', '5k-10k', '10k-15k',\
  \ '15k+']\nslab_bounds = {\n    'Upto 5k': (0, 5000),  # (0, 5000]\n    '5k-10k':\
  \ (5000, 10000),  # (5000, 10000]\n    '10k-15k': (10000, 15000),  # (10000, 15000]\n\
  \    '15k+': (15000, np.inf)  # (15000, inf)\n}\nslab_caps = {\n    'Upto 5k': 0.15,\n\
  \    '5k-10k': 0.12,\n    '10k-15k': 0.10,\n    '15k+': 0.08\n}\n\nslab_medians\
  \ = df.groupby('SalarySlab')['MonthlyIncome'].median()\n# Compa-ratio relative to\
  \ slab median\ndf['SlabMedian'] = df['SalarySlab'].map(slab_medians.to_dict())\n\
  df['CompaRatio'] = (df['MonthlyIncome'] / df['SlabMedian']).replace([np.inf, -np.inf],\
  \ np.nan).fillna(1.0)\n\n# Base raise by performance\nbase_raise = np.where(df['PerformanceRating']\
  \ >= 4, 0.08, 0.03)\n# Adjust for stagnation and time in role; diminish if already\
  \ above slab median\nstagnation_adj = 1.0 + 0.02 * sqrt_stagnation.clip(upper=5)\n\
  role_time_adj = 1.0 + 0.03 * ratio_in_role.clip(upper=1)\nmarket_adj = 1.0 + 0.02\
  \ * (1 - df['CompaRatio'].clip(upper=1))\nbudget_adj = df['BudgetMultiplier']\n\n\
  recommended_raise = base_raise * stagnation_adj * role_time_adj * market_adj * budget_adj\n\
  \n# Cap by slab policy\ncap_series = df['SalarySlab'].map(slab_caps)\nrecommended_raise\
  \ = np.minimum(recommended_raise, cap_series)\nrecommended_raise = recommended_raise.clip(lower=0.0)\n\
  \nnew_income = (df['MonthlyIncome'] * (1.0 + recommended_raise)).round(2)\n\n# Promotion\
  \ eligibility rules using career stage thresholds\nrequired_years_by_stage = {\n\
  \    'early': 2,\n    'mid': 2,\n    'senior': 1,\n    'late': 1\n}\nrequired_years\
  \ = df['CareerStage'].map(required_years_by_stage).fillna(2)\n\neligible_promo =\
  \ (\n        (df['PerformanceRating'] >= 4) &\n        (df['YearsInCurrentRole']\
  \ >= required_years) &\n        (df['YearsSinceLastPromotion'] >= 1) &\n       \
  \ (df['JobLevel'] < 5) &\n        (df['Attrition'].str.upper() == 'NO')\n)\n\n#\
  \ Output datasets for downstream engine\ncomp_out = df[['EmpID', 'EmployeeNumber',\
  \ 'Department', 'JobRole', 'SalarySlab', 'MonthlyIncome']].copy()\ncomp_out['RecommendedRaisePct']\
  \ = recommended_raise.round(4)\ncomp_out['NewMonthlyIncome'] = new_income\ncomp_out['CompaRatio']\
  \ = df['CompaRatio'].round(4)\n\npromo_out = df[\n    ['EmpID', 'EmployeeNumber',\
  \ 'Department', 'JobRole', 'JobLevel', 'PerformanceRating', 'YearsInCurrentRole',\n\
  \     'YearsSinceLastPromotion', 'CareerStage']].copy()\npromo_out['EligibleForPromotion']\
  \ = eligible_promo\n\ncomp_out.to_csv(os.path.join(args.output, 'compensation_recommendations.csv'),\
  \ index=False)\npromo_out.to_csv(os.path.join(args.output, 'promotion_eligibility.csv'),\
  \ index=False)\n\n# A filtered pre-validated subset that meets eligibility or high\
  \ performers for downstream engine\ndownstream_feed = df.loc[\n    (eligible_promo)\
  \ | (df['PerformanceRating'] >= 4), ['EmpID', 'EmployeeNumber', 'Department', 'JobRole',\
  \ 'JobLevel',\n                                                        'PerformanceRating',\
  \ 'MonthlyIncome', 'SalarySlab',\n                                             \
  \           'CareerStage']].copy()\ndownstream_feed['RecommendedRaisePct'] = recommended_raise.round(4)\n\
  downstream_feed['NewMonthlyIncome'] = new_income\n\ndownstream_feed.to_csv(os.path.join(args.output,\
  \ 'prevalidated_feed.csv'), index=False)\n\n```\n\nThe same program is on disk at\
  \ `./code/general_task_37.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 45,\
  \ 'EmpID': 'RM1461', 'Age': 29, 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel':\
  \ 'Travel_Rarely', 'DailyRate': 468, 'Department': 'Research & Development', 'DistanceFromHome':\
  \ 28, 'Education': 4, 'EducationField': 'Medical', 'EmployeeCount': 1, 'EmployeeNumber':\
