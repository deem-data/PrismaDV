constraints:
  constraints:
    Age:
      code:
      - - .isComplete('Age')
        - Valid
      assumptions: []
      column_name: Age
    AgeGroup:
      code:
      - - .isComplete('AgeGroup')
        - Valid
      - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
        - Valid
      - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
          26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup
          = '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age >=
          56 AND AgeGroup = '55+')", 'age_group_matches_age')
        - Valid
      assumptions: []
      column_name: AgeGroup
    Attrition:
      code:
      - - .isComplete('Attrition')
        - Valid
      - - .satisfies("upper(Attrition) IN ('YES', 'NO')", 'valid_attrition')
        - Valid
      assumptions: []
      column_name: Attrition
    Department:
      code:
      - - .isComplete('Department')
        - Valid
      - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human
          Resources'])
        - Valid
      assumptions: []
      column_name: Department
    EmpID:
      code:
      - - .isComplete('EmpID')
        - Valid
      - - .isUnique('EmpID')
        - Valid
      assumptions: []
      column_name: EmpID
    EmployeeNumber:
      code:
      - - .isComplete('EmployeeNumber')
        - Valid
      - - .isUnique('EmployeeNumber')
        - Valid
      assumptions: []
      column_name: EmployeeNumber
    JobLevel:
      code:
      - - .isComplete('JobLevel')
        - Valid
      - - .satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
        - Valid
      assumptions: []
      column_name: JobLevel
    JobRole:
      code:
      - - .isComplete('JobRole')
        - Valid
      - - .satisfies("(Department = 'Sales' AND JobRole IN ('Sales Executive', 'Sales
          Representative', 'Manager')) OR (Department = 'Human Resources' AND JobRole
          IN ('Human Resources', 'Manager')) OR (Department = 'Research & Development'
          AND JobRole IN ('Research Scientist', 'Laboratory Technician', 'Manufacturing
          Director', 'Healthcare Representative', 'Research Director', 'Manager'))",
          'role_matches_department')
        - Valid
      assumptions: []
      column_name: JobRole
    MonthlyIncome:
      code:
      - - .isComplete('MonthlyIncome')
        - Valid
      - - .isPositive('MonthlyIncome')
        - Valid
      assumptions: []
      column_name: MonthlyIncome
    PerformanceRating:
      code:
      - - .isComplete('PerformanceRating')
        - Valid
      - - .satisfies('PerformanceRating IN (3, 4)', 'valid_performance_rating')
        - Valid
      assumptions: []
      column_name: PerformanceRating
    SalarySlab:
      code:
      - - .isComplete('SalarySlab')
        - Valid
      - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
        - Valid
      - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome > 0 AND MonthlyIncome
          <= 5000) OR (SalarySlab = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome
          <= 10000) OR (SalarySlab = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome
          <= 15000) OR (SalarySlab = '15k+' AND MonthlyIncome > 15000)", 'salary_slab_matches_income')
        - Valid
      assumptions: []
      column_name: SalarySlab
    YearsAtCompany:
      code:
      - - .isComplete('YearsAtCompany')
        - Valid
      - - .isNonNegative('YearsAtCompany')
        - Valid
      assumptions: []
      column_name: YearsAtCompany
    YearsInCurrentRole:
      code:
      - - .isComplete('YearsInCurrentRole')
        - Valid
      - - .isNonNegative('YearsInCurrentRole')
        - Valid
      - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role_tenure_within_company_tenure')
        - Valid
      assumptions: []
      column_name: YearsInCurrentRole
    YearsSinceLastPromotion:
      code:
      - - .isComplete('YearsSinceLastPromotion')
        - Valid
      - - .isNonNegative('YearsSinceLastPromotion')
        - Valid
      - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company_tenure')
        - Valid
      assumptions: []
      column_name: YearsSinceLastPromotion
