  \ 'NumCompaniesWorked': 1, 'Over18': 'Y', 'OverTime': 'No', 'PercentSalaryHike':\
  \ 14, 'PerformanceRating': 3, 'RelationshipSatisfaction': 2, 'StandardHours': 80,\
