    - text: Promotion eligibility is jointly determined by 'AgeGroup', 'PerformanceRating',
        'YearsInCurrentRole', 'YearsSinceLastPromotion', 'JobLevel', and 'Attrition'.
        Specifically, an employee is considered eligible for promotion when 'PerformanceRating'
        >= 4, 'JobLevel' < 5, 'Attrition' equals 'No' (case-insensitive), 'YearsSinceLastPromotion'
        >= 1, and 'YearsInCurrentRole' satisfies the age group threshold (>= 2 for
        '18-25', '26-35', '36-45'; >= 1 for '46-55', '55+'). These columns must have
        valid, non-null values to evaluate promotion eligibility correctly.
