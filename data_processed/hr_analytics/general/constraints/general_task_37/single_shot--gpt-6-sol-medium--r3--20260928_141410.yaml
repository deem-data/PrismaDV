constraints:
  Age:
    code:
    - - .satisfies('Age >= 18 AND Age <= 100', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  AgeGroup, Age:
    code:
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age >= 55)", 'age_matches_age_group')
      - Valid
    assumptions: []
    column_name: AgeGroup, Age
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  Department, JobRole:
    code:
    - - .satisfies("(JobRole NOT IN ('Sales Executive', 'Sales Representative') OR
        Department = 'Sales') AND (JobRole NOT IN ('Research Scientist', 'Research
        Director', 'Laboratory Technician', 'Manufacturing Director', 'Healthcare
        Representative') OR Department = 'Research & Development') AND (JobRole <>
        'Human Resources' OR Department = 'Human Resources')", 'department_matches_job_role')
      - Valid
    assumptions: []
    column_name: Department, JobRole
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeNumber:
    code:
    - - .isComplete('EmployeeNumber')
      - Valid
    assumptions: []
    column_name: EmployeeNumber
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    - - .satisfies('JobLevel BETWEEN 1 AND 5', 'valid_job_level')
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .satisfies('PerformanceRating IN (3, 4)', 'valid_performance_rating')
      - Valid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  SalarySlab, MonthlyIncome:
    code:
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'income_matches_salary_slab')
      - Valid
    assumptions: []
    column_name: SalarySlab, MonthlyIncome
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsAtCompany, TotalWorkingYears:
    code:
    - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'company_tenure_within_working_years')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, TotalWorkingYears
  YearsAtCompany, YearsInCurrentRole, YearsSinceLastPromotion, TotalWorkingYears:
    code:
    - - .satisfies('YearsAtCompany >= 0 AND YearsInCurrentRole >= 0 AND YearsSinceLastPromotion
        >= 0 AND TotalWorkingYears >= 0', 'nonnegative_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany, YearsInCurrentRole, YearsSinceLastPromotion, TotalWorkingYears
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsInCurrentRole, YearsAtCompany:
    code:
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole, YearsAtCompany
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsSinceLastPromotion, YearsAtCompany:
    code:
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion, YearsAtCompany
