      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
