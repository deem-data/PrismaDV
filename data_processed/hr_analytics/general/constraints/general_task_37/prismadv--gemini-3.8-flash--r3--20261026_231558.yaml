  '["AgeGroup","Attrition","JobLevel","PerformanceRating","YearsInCurrentRole","YearsSinceLastPromotion"]':
    code: []
    assumptions:
    - text: 'Employees in the ''18-25'' AgeGroup cannot have an unrealistic tenure
        in their current role. Demographically, assuming legal working age starts
        at 18, an employee in the ''18-25'' age bracket should have YearsInCurrentRole
        of at most 7 years. Additionally, based on the CareerStage mapping, employees
        in ''18-25'', ''26-35'', and ''36-45'' require at least 2 years in their current
        role for promotion eligibility, while those in ''46-55'' and ''55+'' require
        at least 1 year. We can represent the tenure consistency check in Deequ as:
        .satisfies("AgeGroup != ''18-25'' OR YearsInCurrentRole <= 7", "Tenure_AgeGroup_Consistency")'
      sources:
      - start_line: 18
        end_line: 25
        file: ''
      - start_line: 80
        end_line: 90
        file: ''
      uid: b2813064-c0a7-4207-b543-9d4e14e15ab9
    - text: 'Promotion eligibility requires the joint satisfaction of multiple conditions
        across Attrition, JobLevel, PerformanceRating, YearsSinceLastPromotion, and
        YearsInCurrentRole. Specifically, departed employees (Attrition == ''Yes'')
        and employees at executive level (JobLevel >= 5) are ineligible for promotion
        regardless of tenure or performance rating. The columns JobLevel, PerformanceRating,
        YearsSinceLastPromotion, and YearsInCurrentRole are assumed to be non-null
        and valid integers where JobLevel is in [1, 5] and PerformanceRating is in
        [3, 4]. We can express the rule that departed employees cannot meet the eligible
        criteria in Deequ as: .satisfies("Attrition == ''No'' OR NOT (PerformanceRating
        >= 4 AND YearsSinceLastPromotion >= 1 AND JobLevel < 5)", "InactiveEmployeesCannotBeEligibleForPromotion")'
      sources:
      - start_line: 88
        end_line: 94
        file: ''
      uid: 0231f029-246f-401c-8cfe-a03d5488c781
