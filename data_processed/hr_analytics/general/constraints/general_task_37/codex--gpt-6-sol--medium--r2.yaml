  \ 2, 'WorkLifeBalance': 3, 'YearsAtCompany': 9, 'YearsSinceLastPromotion': 0, 'YearsWithCurrManager':\
  \ 5.0, 'YearsInCurrentRole': 7}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
