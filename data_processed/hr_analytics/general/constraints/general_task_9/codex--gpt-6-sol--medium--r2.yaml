        \ 0.10,\n        'risk_js': 0.12,\n        'risk_role_stagnation': 0.10,\n\
        \        'risk_promo_lag': 0.10,\n        'risk_mgr_churn': 0.08,\n      \
        \  'risk_age_band': 0.05,\n        'risk_commute': 0.05,\n    }\n    df['risk_raw']\
        \ = (\n        w['risk_income'] * df['risk_income'] +\n        w['risk_ot']\
        \ * df['risk_ot'] +\n        w['risk_wlb'] * df['risk_wlb'] +\n        w['risk_js']\
        \ * df['risk_js'] +\n        w['risk_role_stagnation'] * df['risk_role_stagnation']\
        \ +\n        w['risk_promo_lag'] * df['risk_promo_lag'] +\n        w['risk_mgr_churn']\
