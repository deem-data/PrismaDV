        \ 'Attrition'] == 'Yes').mean()\n    rate_ot_no = (df.loc[ot_no, 'Attrition']\
        \ == 'Yes').mean()\n    uplift_ot = max(0.0, min(1.0, (rate_ot_yes / rate_ot_no)\
        \ - 1.0)) if rate_ot_no > 0 else 0.0\n    df['risk_ot'] = np.where(df['OverTime']\
        \ == 'Yes', uplift_ot, 0.0)\n\n    # WorkLifeBalance risk: center at 3\n \
        \   wlb_map = {1: 1.0, 2: 0.5, 3: 0.0, 4: -0.05}\n    df['risk_wlb'] = df['WorkLifeBalance'].map(wlb_map).fillna(0.0)\n\
        \n    # JobSatisfaction risk: lower satisfaction -> higher risk\n    df['risk_js']\
        \ = (4 - df['JobSatisfaction']) / 3.0\n    df['risk_js'] = df['risk_js'].clip(lower=0.0,\
        \ upper=1.0)\n\n    # Tenure risks\n    # Role stagnation: ratio of time in\
