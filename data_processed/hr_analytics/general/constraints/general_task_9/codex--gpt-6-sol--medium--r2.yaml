        - Valid
      assumptions: []
      column_name: MonthlyIncome
    OverTime:
      code:
      - - .isComplete('OverTime')
        - Valid
      - - .isContainedIn('OverTime', ['Yes', 'No'])
        - Valid
      - - '.satisfies("OverTime = ''Yes''", ''overtime cohort exists'', lambda fraction:
          fraction > 0)'
        - Valid
      assumptions: []
      column_name: OverTime
    SalarySlab:
      code:
      - - .isComplete('SalarySlab')
        - Valid
      - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
        - Valid
      - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
          > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
          > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
          > 15000 AND SalarySlab = '15k+')", 'salary slab matches income')
        - Valid
      assumptions: []
      column_name: SalarySlab
    TotalWorkingYears:
      code:
      - - .isComplete('TotalWorkingYears')
        - Valid
      - - .isNonNegative('TotalWorkingYears')
        - Valid
      - - .satisfies('TotalWorkingYears <= Age - 18', 'working years within adult
          age')
        - Valid
      - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'company tenure within
          career tenure')
        - Valid
      assumptions: []
      column_name: TotalWorkingYears
    WorkLifeBalance:
      code:
      - - .isComplete('WorkLifeBalance')
        - Valid
      - - .satisfies('WorkLifeBalance IN (1, 2, 3, 4)', 'valid work life scale')
        - Valid
      assumptions: []
      column_name: WorkLifeBalance
    YearsAtCompany:
      code:
      - - .isComplete('YearsAtCompany')
        - Valid
      - - .isNonNegative('YearsAtCompany')
        - Valid
      assumptions: []
      column_name: YearsAtCompany
    YearsInCurrentRole:
      code:
      - - .isComplete('YearsInCurrentRole')
        - Valid
      - - .isNonNegative('YearsInCurrentRole')
        - Valid
      - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'role tenure within company
          tenure')
        - Valid
      assumptions: []
      column_name: YearsInCurrentRole
    YearsSinceLastPromotion:
      code:
      - - .isComplete('YearsSinceLastPromotion')
        - Valid
      - - .isNonNegative('YearsSinceLastPromotion')
        - Valid
      - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion lag within
          company tenure')
        - Valid
      assumptions: []
      column_name: YearsSinceLastPromotion
    YearsWithCurrManager:
      code:
      - - '.hasCompleteness(''YearsWithCurrManager'', lambda fraction: fraction >=
          0.95)'
        - Valid
      - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
          YearsWithCurrManager <= YearsAtCompany)', 'manager tenure within company
          tenure')
        - Valid
      assumptions: []
      column_name: YearsWithCurrManager
