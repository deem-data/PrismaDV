constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 60', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age > 55 AND
        AgeGroup = '55+')", 'age_group_matches_age')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .satisfies('DistanceFromHome BETWEEN 0 AND 30', 'valid_commute_distance')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome > 5000 AND MonthlyIncome <= 10000) OR (SalarySlab
        = '10k-15k' AND MonthlyIncome > 10000 AND MonthlyIncome <= 15000) OR (SalarySlab
        = '15k+' AND MonthlyIncome > 15000)", 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isNonNegative('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isNonNegative('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'company_tenure_within_career')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole <= YearsAtCompany',
        'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion <= YearsAtCompany',
        'promotion_lag_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda value: value >= 0.90)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR (YearsWithCurrManager >= 0 AND
        YearsWithCurrManager <= YearsAtCompany)', 'manager_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
