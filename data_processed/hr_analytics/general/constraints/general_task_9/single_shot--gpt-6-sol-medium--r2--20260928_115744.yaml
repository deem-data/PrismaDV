constraints:
  Age:
    code:
    - - .isComplete('Age').satisfies('Age BETWEEN 18 AND 60', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  Age, AgeGroup:
    code:
    - - .satisfies("(Age BETWEEN 18 AND 25 AND AgeGroup = '18-25') OR (Age BETWEEN
        26 AND 35 AND AgeGroup = '26-35') OR (Age BETWEEN 36 AND 45 AND AgeGroup =
        '36-45') OR (Age BETWEEN 46 AND 55 AND AgeGroup = '46-55') OR (Age >= 55 AND
        AgeGroup = '55+')", 'age_matches_age_group')
      - Valid
    assumptions: []
    column_name: Age, AgeGroup
  AgeGroup:
    code:
    - - .isComplete('AgeGroup').isContainedIn('AgeGroup', ['18-25', '26-35', '36-45',
        '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.hasCompliance(''attrition_yes_share'', "Attrition = ''Yes''", lambda x:
        0.10 <= x <= 0.30)'
      - Invalid
    - - .isComplete('Attrition').isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .isComplete('DistanceFromHome').satisfies('DistanceFromHome >= 0', 'nonnegative_commute_distance')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction').satisfies('JobSatisfaction IN (1, 2, 3, 4)',
        'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome').satisfies('MonthlyIncome > 0', 'positive_monthly_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  MonthlyIncome, SalarySlab:
    code:
    - - .satisfies("(MonthlyIncome <= 5000 AND SalarySlab = 'Upto 5k') OR (MonthlyIncome
        > 5000 AND MonthlyIncome <= 10000 AND SalarySlab = '5k-10k') OR (MonthlyIncome
        > 10000 AND MonthlyIncome <= 15000 AND SalarySlab = '10k-15k') OR (MonthlyIncome
        > 15000 AND SalarySlab = '15k+')", 'income_matches_salary_slab')
      - Valid
    assumptions: []
    column_name: MonthlyIncome, SalarySlab
  OverTime:
    code:
    - - '.hasCompliance(''overtime_yes_share'', "OverTime = ''Yes''", lambda x: 0.15
        <= x <= 0.40)'
      - Invalid
    - - .isComplete('OverTime').isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab').isContainedIn('SalarySlab', ['Upto 5k', '5k-10k',
        '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears').satisfies('TotalWorkingYears >= YearsAtCompany',
        'working_years_cover_company_tenure')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance').satisfies('WorkLifeBalance IN (1, 2, 3, 4)',
        'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany').satisfies('YearsAtCompany >= 0', 'nonnegative_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole').satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole
        <= YearsAtCompany', 'valid_role_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion').satisfies('YearsSinceLastPromotion
        >= 0 AND YearsSinceLastPromotion <= YearsAtCompany', 'valid_promotion_lag')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.90).satisfies(''YearsWithCurrManager
        IS NULL OR (YearsWithCurrManager >= 0 AND YearsWithCurrManager <= YearsAtCompany)'',
        ''valid_manager_tenure'')'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
