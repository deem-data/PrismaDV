prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport json\nimport re\nimport numpy as np\nimport pandas as pd\n\n\n\
  def main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_file = os.path.join(args.input, 'new_data.csv')\n\
  \    df = pd.read_csv(input_file)\n\n    # Normalize dtypes used downstream\n  \
  \  numeric_cols = [\n        'Age', 'MonthlyIncome', 'YearsAtCompany', 'YearsSinceLastPromotion',\
  \ 'YearsInCurrentRole',\n        'TotalWorkingYears', 'YearsWithCurrManager', 'WorkLifeBalance',\
  \ 'JobSatisfaction',\n        'DistanceFromHome'\n    ]\n    for c in numeric_cols:\n\
  \        if c in df.columns:\n            df[c] = pd.to_numeric(df[c], errors='coerce')\n\
  \    df = df.set_index('EmpID', drop=False)\n\n    # Age and AgeGroup checks before\
  \ age-derived features\n    # Income/Salaries checks before income-derived features\n\
  \    # Tenure and manager fields checks before tenure-derived ratios\n    # Categorical\
  \ and target distribution checks before rate-based calibration\n    # Derived features\
  \ for risk scoring\n    # Income risk from SalarySlab (heavier risk on lower slabs)\n\
  \    slab_weight = {\n        'Upto 5k': 1.0,\n        '5k-10k': 0.6,\n        '10k-15k':\
  \ 0.3,\n        '15k+': 0.0,\n    }\n    df['risk_income'] = df['SalarySlab'].map(slab_weight)\n\
  \n    # Overtime risk scaled by observed uplift\n    ot_yes = df['OverTime'] ==\
  \ 'Yes'\n    ot_no = df['OverTime'] == 'No'\n    rate_ot_yes = (df.loc[ot_yes, 'Attrition']\
  \ == 'Yes').mean()\n    rate_ot_no = (df.loc[ot_no, 'Attrition'] == 'Yes').mean()\n\
  \    uplift_ot = max(0.0, min(1.0, (rate_ot_yes / rate_ot_no) - 1.0)) if rate_ot_no\
  \ > 0 else 0.0\n    df['risk_ot'] = np.where(df['OverTime'] == 'Yes', uplift_ot,\
  \ 0.0)\n\n    # WorkLifeBalance risk: center at 3\n    wlb_map = {1: 1.0, 2: 0.5,\
  \ 3: 0.0, 4: -0.05}\n    df['risk_wlb'] = df['WorkLifeBalance'].map(wlb_map).fillna(0.0)\n\
  \n    # JobSatisfaction risk: lower satisfaction -> higher risk\n    df['risk_js']\
  \ = (4 - df['JobSatisfaction']) / 3.0\n    df['risk_js'] = df['risk_js'].clip(lower=0.0,\
  \ upper=1.0)\n\n    # Tenure risks\n    # Role stagnation: ratio of time in current\
  \ role vs company tenure\n    denom = df['YearsAtCompany'].replace(0, np.nan)\n\
  \    df['role_ratio'] = (df['YearsInCurrentRole'] / denom).fillna(0.0)\n    df['risk_role_stagnation']\
  \ = df['role_ratio'].clip(0, 1)\n\n    # Promotion lag risk, capped\n    df['risk_promo_lag']\
  \ = (df['YearsSinceLastPromotion'] / 5.0).clip(0, 1)\n\n    # Manager continuity\
  \ risk: short time with manager relative to tenure\n    df['mgr_ratio'] = (df['YearsWithCurrManager']\
  \ / denom).replace([np.inf, -np.inf], np.nan).fillna(0.0)\n    df['risk_mgr_churn']\
  \ = (1.0 - df['mgr_ratio']).clip(0, 1)\n\n    # Age band risk: slight bump for early-career\
  \ groups\n    age_risk_map = {\n        '18-25': 0.25,\n        '26-35': 0.15,\n\
  \        '36-45': 0.05,\n        '46-55': 0.00,\n        '55+': 0.00,\n    }\n \
  \   df['risk_age_band'] = df['AgeGroup'].map(age_risk_map).fillna(0.0)\n\n    #\
  \ Commute risk (proxy)\n    df['risk_commute'] = (df['DistanceFromHome'] / 30.0).clip(0,\
  \ 1)\n\n    # Combine with weights (sum ~ 1.0)\n    w = {\n        'risk_income':\
  \ 0.25,\n        'risk_ot': 0.15,\n        'risk_wlb': 0.10,\n        'risk_js':\
  \ 0.12,\n        'risk_role_stagnation': 0.10,\n        'risk_promo_lag': 0.10,\n\
  \        'risk_mgr_churn': 0.08,\n        'risk_age_band': 0.05,\n        'risk_commute':\
  \ 0.05,\n    }\n    df['risk_raw'] = (\n        w['risk_income'] * df['risk_income']\
  \ +\n        w['risk_ot'] * df['risk_ot'] +\n        w['risk_wlb'] * df['risk_wlb']\
  \ +\n        w['risk_js'] * df['risk_js'] +\n        w['risk_role_stagnation'] *\
  \ df['risk_role_stagnation'] +\n        w['risk_promo_lag'] * df['risk_promo_lag']\
  \ +\n        w['risk_mgr_churn'] * df['risk_mgr_churn'] +\n        w['risk_age_band']\
  \ * df['risk_age_band'] +\n        w['risk_commute'] * df['risk_commute']\n    )\n\
  \n    # Squash to [0,1]\n    df['risk_score'] = df['risk_raw'].clip(0, 1)\n\n  \
  \  # Threshold calibrated by target prevalence\n    overall_attr_rate = (df['Attrition']\
  \ == 'Yes').mean()\n    high_threshold = float(np.clip(2.0 * overall_attr_rate,\
  \ 0.20, 0.50))\n    med_threshold = high_threshold / 2.0\n\n    df['risk_tier']\
  \ = np.where(\n        df['risk_score'] >= high_threshold, 'High',\n        np.where(df['risk_score']\
  \ >= med_threshold, 'Medium', 'Low')\n    )\n\n    # Recommended action based on\
  \ top contributing risks\n    def recommend_action(row):\n        if row['risk_tier']\
  \ != 'High':\n            return 'Monitor'\n        # Priority: compensation, work-life,\
  \ manager, growth\n        if row['risk_income'] >= 0.8 and row['JobSatisfaction']\
  \ <= 2:\n            return 'CompensationReview'\n        if (row['OverTime'] ==\
  \ 'Yes') and (row['WorkLifeBalance'] <= 2):\n            return 'FlexibleSchedule'\n\
  \        if row['risk_role_stagnation'] >= 0.7 or row['risk_promo_lag'] >= 0.8:\n\
  \            return 'CareerProgressionPlan'\n        if row['risk_mgr_churn'] >=\
  \ 0.7:\n            return 'ManagerCheckIn'\n        return 'Engagement1on1'\n\n\
  \    df['recommended_action'] = df.apply(recommend_action, axis=1)\n\n    # Prepare\
  \ outputs\n    scores_cols = [\n        'EmpID', 'Department', 'JobRole', 'Age',\
  \ 'AgeGroup', 'MonthlyIncome', 'SalarySlab',\n        'OverTime', 'WorkLifeBalance',\
  \ 'JobSatisfaction', 'YearsAtCompany', 'YearsInCurrentRole',\n        'YearsSinceLastPromotion',\
  \ 'YearsWithCurrManager', 'TotalWorkingYears',\n        'risk_score', 'risk_tier',\
  \ 'recommended_action'\n    ]\n    scores_df = df[scores_cols].copy()\n\n    actions_df\
  \ = scores_df.loc[scores_df['risk_tier'] == 'High', ['EmpID', 'Department', 'JobRole',\
  \ 'recommended_action']].copy()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \    scores_path = os.path.join(args.output, 'employee_risk_scores.csv')\n    actions_path\
  \ = os.path.join(args.output, 'retention_actions.csv')\n    scores_df.to_csv(scores_path,\
  \ index=False)\n    actions_df.to_csv(actions_path, index=False)\n\n    # Summary\
  \ metrics for monitoring\n    metrics = {\n        'n_employees': int(df.shape[0]),\n\
  \        'overall_attrition_rate': overall_attr_rate,\n        'high_risk_threshold':\
  \ high_threshold,\n        'high_risk_count': int((df['risk_tier'] == 'High').sum()),\n\
  \        'medium_risk_count': int((df['risk_tier'] == 'Medium').sum()),\n      \
  \  'low_risk_count': int((df['risk_tier'] == 'Low').sum()),\n        'upto5k_share':\
  \ float((df['SalarySlab'] == 'Upto 5k').mean()),\n        'age_26_35_share': float((df['AgeGroup']\
  \ == '26-35').mean())\n    }\n    with open(os.path.join(args.output, 'metrics.json'),\
  \ 'w') as f:\n        json.dump(metrics, f)\n\n\nif __name__ == '__main__':\n  \
  \  main()\n\n```\n\nThe same program is on disk at `./code/general_task_9.py`, so\
  \ you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 45, 'EmpID': 'RM1461', 'Age': 29,\
  \ 'AgeGroup': '26-35', 'Attrition': 'No', 'BusinessTravel': 'Travel_Rarely', 'DailyRate':\
  \ 468, 'Department': 'Research & Development', 'DistanceFromHome': 28, 'Education':\
  \ 4, 'EducationField': 'Medical', 'EmployeeCount': 1, 'EmployeeNumber': 2054, 'EnvironmentSatisfaction':\
  \ 4, 'Gender': 'Female', 'HourlyRate': 73, 'JobInvolvement': 2, 'JobLevel': 1, 'JobRole':\
  \ 'Research Scientist', 'JobSatisfaction': 1, 'MaritalStatus': 'Single', 'MonthlyIncome':\
  \ 3785, 'SalarySlab': 'Upto 5k', 'MonthlyRate': 8489, 'NumCompaniesWorked': 1, 'Over18':\
