        -- checker --\n\"\"\"Run PyDeequ constraint code against the example tables\
        \ and report results.\"\"\"\nimport argparse\nimport json\nimport os\nimport\
        \ sys\nfrom pathlib import Path\n\nimport prismadv  # noqa: F401\n\nos.environ.pop(\"\
