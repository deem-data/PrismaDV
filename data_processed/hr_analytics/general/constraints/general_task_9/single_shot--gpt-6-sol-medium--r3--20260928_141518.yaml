constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('Age BETWEEN 18 AND 70', 'plausible_employee_age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(AgeGroup = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup =
        '26-35' AND Age BETWEEN 26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN
        36 AND 45) OR (AgeGroup = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup
        = '55+' AND Age >= 55)", 'age_matches_age_group')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - '.hasCompliance(''attrition_yes_share'', "Attrition = ''Yes''", lambda x:
        0.10 <= x <= 0.30)'
      - Invalid
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .isComplete('DistanceFromHome')
      - Valid
    - - .satisfies('DistanceFromHome >= 0', 'nonnegative_commute_distance')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .satisfies('JobSatisfaction BETWEEN 1 AND 4', 'valid_job_satisfaction')
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .satisfies('MonthlyIncome > 0', 'positive_monthly_income')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - '.hasCompliance(''overtime_yes_share'', "OverTime = ''Yes''", lambda x: 0.10
        <= x <= 0.50)'
      - Invalid
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    - - .satisfies("(SalarySlab = 'Upto 5k' AND MonthlyIncome <= 5000) OR (SalarySlab
        = '5k-10k' AND MonthlyIncome BETWEEN 5000 AND 10000) OR (SalarySlab = '10k-15k'
        AND MonthlyIncome BETWEEN 10000 AND 15000) OR (SalarySlab = '15k+' AND MonthlyIncome
        >= 15000)", 'income_matches_salary_slab')
      - Valid
    assumptions: []
    column_name: SalarySlab
  TotalWorkingYears:
    code:
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .satisfies('WorkLifeBalance BETWEEN 1 AND 4', 'valid_work_life_balance')
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .satisfies('YearsAtCompany >= 0 AND YearsAtCompany <= TotalWorkingYears',
        'company_tenure_within_career')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole >= 0 AND YearsInCurrentRole <= YearsAtCompany',
        'role_tenure_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    - - .satisfies('YearsSinceLastPromotion >= 0 AND YearsSinceLastPromotion <= YearsAtCompany',
        'promotion_lag_within_company_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda x: x >= 0.94)'
      - Valid
    - - .satisfies('YearsWithCurrManager IS NULL OR YearsWithCurrManager >= 0', 'nonnegative_manager_tenure_when_present')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
