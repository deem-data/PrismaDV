      source_assumptions:
      - afb7ff4f-cea6-4451-87a1-bab14ed602f4
    assumptions:
    - text: The input data must contain a 'YearsWithCurrManager' column. The script
        uses it to calculate manager-related risk and includes it in the scores output.
      sources:
      - start_line: 69
        end_line: 70
        file: ''
      - start_line: 140
        end_line: 146
        file: ''
      uid: 0817a662-7c1e-41ba-918c-036e47ca5058
    - text: Every non-null 'YearsWithCurrManager' value should be convertible to a
        finite number. Otherwise, numeric conversion silently turns invalid values
        into nulls, which the manager-risk calculation treats as a ratio of zero.
      sources:
      - start_line: 18
        end_line: 26
        file: ''
      - start_line: 69
        end_line: 70
        file: ''
      uid: 55bc88f4-75a9-4217-b4d0-8eb2c30a1e7b
    - text: '''YearsWithCurrManager'' may contain nulls, but at least 95% of input
        rows should have a non-null value, consistent with the observed completeness
        of approximately 95.35%. Each null is treated as a zero manager-to-company-tenure
        ratio, increasing the calculated manager-churn risk.'
      sources:
      - start_line: 69
        end_line: 70
        file: ''
      - start_line: 93
        end_line: 106
        file: ''
      uid: 6730ceb3-c688-4d08-abac-4d2a2f085dcc
    - text: For non-null values, 'YearsWithCurrManager' should be at least zero and
        should not exceed 'YearsAtCompany' when that column is non-null. Time with
        the current manager cannot be negative or exceed company tenure; values outside
        that range would produce misleading ratios that are subsequently clipped.
      sources:
      - start_line: 61
        end_line: 61
        file: ''
      - start_line: 68
        end_line: 70
