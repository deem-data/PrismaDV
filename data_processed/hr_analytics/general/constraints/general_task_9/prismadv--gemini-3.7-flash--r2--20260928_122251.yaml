  '["Age","AgeGroup"]':
    code: []
    assumptions:
    - text: 'The ''AgeGroup'' column should correspond consistently to the numeric
        values in ''Age'' across all records (e.g., ''18-25'' for Age 18 to 25, ''26-35''
        for Age 26 to 35, ''36-45'' for Age 36 to 45, ''46-55'' for Age 46 to 55,
        and ''55+'' for Age >= 55). We could represent this assumption as a Deequ
        constraint like this: .satisfies("CASE WHEN Age >= 18 AND Age <= 25 THEN AgeGroup
        = ''18-25'' WHEN Age >= 26 AND Age <= 35 THEN AgeGroup = ''26-35'' WHEN Age
        >= 36 AND Age <= 45 THEN AgeGroup = ''36-45'' WHEN Age >= 46 AND Age <= 55
        THEN AgeGroup = ''46-55'' WHEN Age >= 55 THEN AgeGroup = ''55+'' ELSE FALSE
        END", "Age matches AgeGroup")'
