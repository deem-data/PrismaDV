        file: ''
      - start_line: 164
        end_line: 165
        file: ''
      uid: e14e9797-40ca-468f-9216-ab87f0e4a6ca
    - text: Every 'AgeGroup' value should be non-null and exactly one of '18-25',
        '26-35', '36-45', '46-55', or '55+'. The input currently contains only these
        five non-null string values. Missing values, alternate spellings, or extra
        whitespace would silently receive the default age-band risk of 0.0.
      sources:
      - start_line: 73
        end_line: 80
        file: ''
      uid: 642104d1-860e-4882-84df-99bd3cf6eff4
    - text: Where 'Age' is present and numeric, 'AgeGroup' should describe that employee's
        age. For example, an age from 26 through 35 should have 'AgeGroup' equal to
        '26-35'. The script uses the supplied group for risk scoring rather than deriving
        it from 'Age', so inconsistent values would produce an incorrect age-band
        contribution.
      sources:
      - start_line: 18
        end_line: 26
        file: ''
      - start_line: 73
        end_line: 80
        file: ''
      uid: 26a6caf7-bbab-4b2b-a214-42d461766394
