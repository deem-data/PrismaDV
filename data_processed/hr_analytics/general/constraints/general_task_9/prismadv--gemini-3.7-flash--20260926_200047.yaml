  '["OverTime","WorkLifeBalance"]':
    code: []
    assumptions:
    - text: The columns 'OverTime' and 'WorkLifeBalance' are jointly evaluated to
        determine whether to assign the retention action 'FlexibleSchedule' when an
        employee works overtime ('OverTime' == 'Yes') and has a low work-life balance
        score ('WorkLifeBalance' <= 2). Both columns are assumed to be complete (non-null),
        with 'OverTime' containing categorical string values ('Yes', 'No') and 'WorkLifeBalance'
        containing numeric rating values (e.g., integers 1 to 4).
