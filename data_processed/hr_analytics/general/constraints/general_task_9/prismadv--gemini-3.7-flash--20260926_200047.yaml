  '["MonthlyIncome","SalarySlab"]':
    code: []
    assumptions:
    - text: The 'SalarySlab' column represents salary brackets corresponding to the
        'MonthlyIncome' column, where 'Upto 5k' corresponds to MonthlyIncome <= 5000,
        '5k-10k' corresponds to 5000 <= MonthlyIncome <= 10000, '10k-15k' corresponds
        to 10000 <= MonthlyIncome <= 15000, and '15k+' corresponds to MonthlyIncome
        >= 15000. Each record's MonthlyIncome should fall within the bounds defined
        by its SalarySlab.
