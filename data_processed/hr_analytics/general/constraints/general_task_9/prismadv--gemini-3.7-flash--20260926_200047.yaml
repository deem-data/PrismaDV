  '["YearsAtCompany","YearsInCurrentRole"]':
    code: []
    assumptions:
    - text: 'The value of ''YearsInCurrentRole'' should be less than or equal to ''YearsAtCompany''
        for every employee, as an employee cannot spend more years in their current
        role than their total tenure at the company. We could represent this assumption
        as a Deequ constraint like this: .satisfies("YearsInCurrentRole <= YearsAtCompany",
        "YearsInCurrentRole_le_YearsAtCompany")'
