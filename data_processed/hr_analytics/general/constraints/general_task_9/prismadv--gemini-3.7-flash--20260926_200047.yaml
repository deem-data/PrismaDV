  '["Age","AgeGroup"]':
    code: []
    assumptions:
    - text: The values in 'Age' and 'AgeGroup' must be mutually consistent such that
        the employee's 'Age' falls within the range specified by 'AgeGroup' ('18-25'
        implies 18 <= Age <= 25, '26-35' implies 26 <= Age <= 35, '36-45' implies
        36 <= Age <= 45, '46-55' implies 46 <= Age <= 55, and '55+' implies Age >=
        55). We could represent this assumption as a Deequ constraint or custom verification
        across both columns.
      sources:
      - start_line: 19
        end_line: 26
        file: ''
      - start_line: 73
