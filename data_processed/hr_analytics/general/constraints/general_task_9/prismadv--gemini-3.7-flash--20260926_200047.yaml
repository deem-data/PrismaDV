  '["Age","TotalWorkingYears"]':
    code: []
    assumptions:
    - text: 'The ''TotalWorkingYears'' of an employee must not exceed their ''Age''.
        Logically, a person''s total working experience cannot be greater than their
        age (and is typically at least ''Age - 18''). We can express this constraint
        in Deequ as: .satisfies("Age >= TotalWorkingYears", "TotalWorkingYears_le_Age")'
      sources:
      - start_line: 19
        end_line: 26
        file: ''
      - start_line: 140
        end_line: 146
        file: ''
      uid: 8ac5247e-2c3e-4996-a003-dee6a30f2087
  '["Attrition","OverTime"]':
    code: []
    assumptions:
    - text: Both 'Attrition' and 'OverTime' columns must contain valid binary responses
        (such as 'Yes' and 'No') without null values, so that the conditional attrition
        rates for employees working overtime (rate_ot_yes) versus not working overtime
        (rate_ot_no) can be computed reliably.
      sources:
      - start_line: 44
        end_line: 49
        file: ''
      uid: 5f78118a-8d46-4e6c-864a-814da620fdab
  '["Department","JobRole"]':
    code: []
    assumptions:
    - text: 'Each ''JobRole'' corresponds to a specific valid ''Department''. For
        example, roles like ''Sales Executive'' and ''Sales Representative'' must
        belong to the ''Sales'' department; ''Research Scientist'', ''Laboratory Technician'',
        ''Research Director'', ''Healthcare Representative'', and ''Manufacturing
        Director'' must belong to the ''Research & Development'' department; and ''Human
        Resources'' roles must belong to the ''Human Resources'' department. We can
        represent this with a Deequ constraint such as: .satisfies("(JobRole IN (''Sales
        Executive'', ''Sales Representative'') AND Department = ''Sales'') OR (JobRole
        IN (''Research Scientist'', ''Laboratory Technician'', ''Research Director'',
        ''Healthcare Representative'', ''Manufacturing Director'') AND Department
        = ''Research & Development'') OR (JobRole = ''Human Resources'' AND Department
        = ''Human Resources'') OR (JobRole = ''Manager'' AND Department IN (''Sales'',
        ''Research & Development'', ''Human Resources''))", ''valid_job_role_department_mapping'')'
      sources:
      - start_line: 140
        end_line: 148
        file: ''
      uid: 9f575084-2087-43c3-9ffe-8ae20152dbb6
    - text: 'Both ''Department'' and ''JobRole'' columns are required and must not
        contain null values in the dataset. We can represent this assumption as: .hasCompleteness(''Department'',
        _ == 1.0).hasCompleteness(''JobRole'', _ == 1.0)'
      sources:
      - start_line: 140
        end_line: 148
        file: ''
      uid: a813a001-4ff1-4944-b54d-2892cb165e0e
  '["JobSatisfaction","SalarySlab"]':
    code: []
    assumptions:
    - text: The columns 'SalarySlab' and 'JobSatisfaction' must not be null and must
        contain valid values (with 'SalarySlab' belonging to {'Upto 5k', '5k-10k',
        '10k-15k', '15k+'} and 'JobSatisfaction' being a numeric scale from 1 to 4)
        so that 'risk_income' and 'risk_js' are computed without generating NaN values
        when calculating composite risk and evaluating the recommendation condition
        'row["risk_income"] >= 0.8 and row["JobSatisfaction"] <= 2'.
