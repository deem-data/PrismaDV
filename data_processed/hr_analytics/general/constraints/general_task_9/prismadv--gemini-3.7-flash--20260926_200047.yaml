  '["TotalWorkingYears","YearsAtCompany"]':
    code: []
    assumptions:
    - text: 'The number of years an employee has worked at the company (''YearsAtCompany'')
        must be less than or equal to their total career working years (''TotalWorkingYears'').
        This can be expressed as a Deequ constraint: .satisfies(''YearsAtCompany <=
        TotalWorkingYears'', ''YearsAtCompany <= TotalWorkingYears'').'
      sources:
