        should be less than or equal to the total number of years spent at the company
        (''YearsAtCompany'') for each employee. We can represent this assumption as
        a Deequ constraint: .satisfies("YearsSinceLastPromotion <= YearsAtCompany",
        "YearsSinceLastPromotion <= YearsAtCompany")'
