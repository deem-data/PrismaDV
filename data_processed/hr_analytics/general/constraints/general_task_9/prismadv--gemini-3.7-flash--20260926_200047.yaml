        ''YearsAtCompany'', as an employee cannot spend more years with their current
        manager than their total tenure at the company. This ensures that the manager
        ratio (''mgr_ratio'' = ''YearsWithCurrManager'' / ''YearsAtCompany'') naturally
        falls between 0 and 1. We could represent this assumption as a Deequ constraint
        like: .satisfies("YearsWithCurrManager <= YearsAtCompany", "YearsWithCurrManager_le_YearsAtCompany")'
