constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - '.satisfies(''Age >= 18 AND Age <= 70'', ''Age in [18,70]'', lambda r: r ==
        1.0)'
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - '.satisfies("CASE WHEN Age BETWEEN 18 AND 25 THEN AgeGroup = ''18-25'' WHEN
        Age BETWEEN 26 AND 35 THEN AgeGroup = ''26-35'' WHEN Age BETWEEN 36 AND 45
        THEN AgeGroup = ''36-45'' WHEN Age BETWEEN 46 AND 55 THEN AgeGroup = ''46-55''
        WHEN Age >= 55 THEN AgeGroup = ''55+'' ELSE false END", ''Age consistent with
        AgeGroup'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  BusinessTravel:
    code:
    - - .isContainedIn('BusinessTravel', ['Non-Travel', 'Travel_Rarely', 'Travel_Frequently'])
      - Invalid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .isContainedIn('Department', ['Research & Development', 'Sales', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmployeeCount:
    code:
    - - .isContainedIn('EmployeeCount', [1])
      - Invalid
    assumptions: []
    column_name: EmployeeCount
  EnvironmentSatisfaction:
    code:
    - - .isComplete('EnvironmentSatisfaction')
      - Valid
    - - '.satisfies(''EnvironmentSatisfaction >= 1 AND EnvironmentSatisfaction <=
        4'', ''EnvironmentSatisfaction in [1,4]'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: EnvironmentSatisfaction
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - '.satisfies(''JobSatisfaction >= 1 AND JobSatisfaction <= 4'', ''JobSatisfaction
        in [1,4]'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - '.satisfies("CASE WHEN SalarySlab = ''Upto 5k'' THEN MonthlyIncome BETWEEN
        0 AND 5000 WHEN SalarySlab = ''5k-10k'' THEN MonthlyIncome BETWEEN 5001 AND
        10000 WHEN SalarySlab = ''10k-15k'' THEN MonthlyIncome BETWEEN 10001 AND 15000
        WHEN SalarySlab = ''15k+'' THEN MonthlyIncome >= 15001 ELSE false END", ''MonthlyIncome
        matches SalarySlab bounds'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .isContainedIn('StandardHours', [80])
      - Invalid
    assumptions: []
    column_name: StandardHours
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - '.satisfies(''WorkLifeBalance >= 1 AND WorkLifeBalance <= 4'', ''WorkLifeBalance
        in [1,4]'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isNonNegative('YearsInCurrentRole')
      - Valid
    - - '.satisfies(''YearsInCurrentRole <= YearsAtCompany'', ''Role tenure <= YearsAtCompany'',
        lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isNonNegative('YearsSinceLastPromotion')
      - Valid
    - - '.satisfies(''YearsSinceLastPromotion <= YearsAtCompany'', ''Since last promotion
        <= YearsAtCompany'', lambda r: r == 1.0)'
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .isNonNegative('YearsWithCurrManager')
      - Valid
    - - '.satisfies(''YearsWithCurrManager <= YearsAtCompany'', ''Manager tenure <=
        YearsAtCompany'', lambda r: r == 1.0)'
      - Invalid
    assumptions: []
    column_name: YearsWithCurrManager
