constraints:
  Age:
    code:
    - - .hasDataType('Age', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMax(''Age'', lambda v: v <= 70)'
      - Valid
    - - '.hasMin(''Age'', lambda v: v >= 18)'
      - Valid
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .hasDataType('DistanceFromHome', ConstrainableDataTypes.Integral)
      - Valid
    - - .isNonNegative('DistanceFromHome')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - '.hasPattern(''EmpID'', r''^[A-Z]{2}[0-9]{3}$'', lambda v: v >= 0.95)'
      - Invalid
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeCount:
    code:
    - - .isContainedIn('EmployeeCount', [1])
      - Invalid
    assumptions: []
    column_name: EmployeeCount
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  JobLevel:
    code:
    - - '.hasMax(''JobLevel'', lambda v: v <= 5)'
      - Valid
    - - '.hasMin(''JobLevel'', lambda v: v >= 1)'
      - Valid
    assumptions: []
    column_name: JobLevel
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  MonthlyIncome:
    code:
    - - .hasDataType('MonthlyIncome', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isNonNegative('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .isContainedIn('StandardHours', [80])
      - Invalid
    assumptions: []
    column_name: StandardHours
  StockOptionLevel:
    code:
    - - '.hasMax(''StockOptionLevel'', lambda v: v <= 3)'
      - Valid
    - - '.hasMin(''StockOptionLevel'', lambda v: v >= 0)'
      - Valid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - '.satisfies(''TotalWorkingYears <= Age - 18'', ''experience_le_age_minus_18'',
        lambda v: v >= 0.99)'
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  TrainingTimesLastYear:
    code:
    - - '.hasMax(''TrainingTimesLastYear'', lambda v: v <= 6)'
      - Valid
    - - '.hasMin(''TrainingTimesLastYear'', lambda v: v >= 0)'
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  YearsAtCompany:
    code:
    - - '.satisfies(''YearsAtCompany <= TotalWorkingYears'', ''tenure_le_total'',
        lambda v: v >= 0.99)'
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda v: v >= 0.95)'
      - Valid
    - - .hasDataType('YearsWithCurrManager', ConstrainableDataTypes.Fractional)
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
