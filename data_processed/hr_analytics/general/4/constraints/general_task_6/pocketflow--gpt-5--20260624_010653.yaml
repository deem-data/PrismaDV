constraints:
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  MonthlyIncome:
    code:
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isNonNegative('PercentSalaryHike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .isContainedIn('StandardHours', [80])
      - Invalid
    assumptions: []
    column_name: StandardHours
  YearsSinceLastPromotion:
    code:
    - - .satisfies('YearsSinceLastPromotion <= YearsAtCompany', 'promotion_leq_tenure')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
