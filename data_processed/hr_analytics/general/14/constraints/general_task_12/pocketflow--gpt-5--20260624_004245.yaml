constraints:
  Age:
    code:
    - - .satisfies('Age >= 18', 'min age guard')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    - - .satisfies("(AgeGroup IN ('18-25','26-35','36-45','46-55','55+') AND ((AgeGroup
        = '18-25' AND Age BETWEEN 18 AND 25) OR (AgeGroup = '26-35' AND Age BETWEEN
        26 AND 35) OR (AgeGroup = '36-45' AND Age BETWEEN 36 AND 45) OR (AgeGroup
        = '46-55' AND Age BETWEEN 46 AND 55) OR (AgeGroup = '55+' AND Age > 55)))",
        'age-agegroup alignment')
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: Attrition
  DailyRate:
    code:
    - - .isNonNegative('DailyRate')
      - Valid
    assumptions: []
    column_name: DailyRate
  EmployeeCount:
    code:
    - - .satisfies("EmployeeCount = 1", 'constant employee count')
      - Valid
    assumptions: []
    column_name: EmployeeCount
  EnvironmentSatisfaction:
    code:
    - - .isContainedIn('EnvironmentSatisfaction', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: EnvironmentSatisfaction
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  JobInvolvement:
    code:
    - - .isContainedIn('JobInvolvement', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: JobInvolvement
  JobSatisfaction:
    code:
    - - .isContainedIn('JobSatisfaction', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isNonNegative('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes', 'No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  RelationshipSatisfaction:
    code:
    - - .isContainedIn('RelationshipSatisfaction', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: RelationshipSatisfaction
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .satisfies("StandardHours = 80", 'standard hours fixed')
      - Valid
    assumptions: []
    column_name: StandardHours
  WorkLifeBalance:
    code:
    - - .isContainedIn('WorkLifeBalance', [1, 2, 3, 4])
      - Invalid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .satisfies('YearsAtCompany <= TotalWorkingYears', 'tenure monotonicity company<=career')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany', 'tenure monotonicity role<=company')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsWithCurrManager:
    code:
    - - '.hasCompleteness(''YearsWithCurrManager'', lambda v: v >= 0.95)'
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
  role_department:
    code:
    - - .satisfies("CASE WHEN JobRole IN ('Sales Executive','Sales Representative','Healthcare
        Representative') THEN Department = 'Sales' WHEN JobRole IN ('Research Scientist','Laboratory
        Technician','Research Director','Manufacturing Director') THEN Department
        = 'Research & Development' WHEN JobRole = 'Human Resources' THEN Department
        = 'Human Resources' ELSE true END", 'role_department mapping')
      - Invalid
    assumptions: []
    column_name: role_department
