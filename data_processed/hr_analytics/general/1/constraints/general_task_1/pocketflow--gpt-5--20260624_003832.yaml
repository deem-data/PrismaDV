constraints:
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25','26-35','36-45','46-55','55+'])
      - Valid
    - - '.satisfies("((Age >= 18 AND Age <= 25 AND AgeGroup = ''18-25'') OR (Age >=
        26 AND Age <= 35 AND AgeGroup = ''26-35'') OR (Age >= 36 AND Age <= 45 AND
        AgeGroup = ''36-45'') OR (Age >= 46 AND Age <= 55 AND AgeGroup = ''46-55'')
        OR (Age >= 56 AND AgeGroup = ''55+''))", ''age_group_alignment'', lambda v:
        v >= 0.98)'
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isContainedIn('Department', ['Sales', 'Research & Development', 'Human Resources'])
      - Valid
    - - '.satisfies("(Department = ''Sales'' AND JobRole IN (''Sales Executive'',''Sales
        Representative'')) OR (Department = ''Research & Development'' AND JobRole
        IN (''Research Scientist'',''Laboratory Technician'',''Research Director'',''Manufacturing
        Director'')) OR (Department = ''Human Resources'' AND JobRole IN (''Human
        Resources''))", ''dept_role_alignment'', lambda r: r == 1.0)'
      - Invalid
    assumptions: []
    column_name: Department
  EmployeeCount:
    code:
    - - '.satisfies(''EmployeeCount = 1'', ''employee_count_one'', lambda v: v ==
        1.0)'
      - Valid
    assumptions: []
    column_name: EmployeeCount
  JobSatisfaction:
    code:
    - - .isContainedIn('JobSatisfaction', [1,2,3,4])
      - Invalid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - '.hasMin(''MonthlyIncome'', lambda v: v > 0)'
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - .isNonNegative('PercentSalaryHike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3,4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - '.satisfies(''StandardHours = 80'', ''std_hours_80'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: StandardHours
  WorkLifeBalance:
    code:
    - - .isContainedIn('WorkLifeBalance', [1,2,3,4])
      - Invalid
    assumptions: []
    column_name: WorkLifeBalance
