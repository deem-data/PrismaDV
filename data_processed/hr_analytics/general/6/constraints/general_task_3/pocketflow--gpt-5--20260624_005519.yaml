constraints:
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25','26-35','36-45','46-55','55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isContainedIn('Attrition', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: Attrition
  BusinessTravel:
    code:
    - - .isComplete('BusinessTravel')
      - Valid
    - - .isContainedIn('BusinessTravel', ['Non-Travel','Travel_Rarely','Travel_Frequently','TravelRarely'])
      - Valid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    - - .isContainedIn('Department', ['Sales','Research & Development','Human Resources'])
      - Valid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - .hasUniqueness(['EmpID'])
      - Invalid
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeCount:
    code:
    - - '.hasMax(''EmployeeCount'', lambda v: v == 1)'
      - Valid
    - - '.hasMin(''EmployeeCount'', lambda v: v == 1)'
      - Valid
    assumptions: []
    column_name: EmployeeCount
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male','Female'])
      - Valid
    assumptions: []
    column_name: Gender
  JobLevel:
    code:
    - - .isComplete('JobLevel')
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - '.hasMin(''MonthlyIncome'', lambda v: v > 0)'
      - Valid
    - - .isComplete('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  PercentSalaryHike:
    code:
    - - '.hasMax(''PercentSalaryHike'', lambda v: v <= 100)'
      - Valid
    - - '.hasMin(''PercentSalaryHike'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('PercentSalaryHike')
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isComplete('PerformanceRating')
      - Valid
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k','5k-10k','10k-15k','15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - '.hasMax(''StandardHours'', lambda v: v == 80)'
      - Valid
    - - '.hasMin(''StandardHours'', lambda v: v == 80)'
      - Valid
    assumptions: []
    column_name: StandardHours
  StockOptionLevel:
    code:
    - - .isContainedIn('StockOptionLevel', [0,1,2,3])
      - Invalid
    assumptions: []
    column_name: StockOptionLevel
  TotalWorkingYears:
    code:
    - - '.hasMin(''TotalWorkingYears'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('TotalWorkingYears')
      - Valid
    assumptions: []
    column_name: TotalWorkingYears
  YearsAtCompany:
    code:
    - - '.hasMin(''YearsAtCompany'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - '.hasMin(''YearsInCurrentRole'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('YearsInCurrentRole')
      - Valid
    - - .satisfies('YearsInCurrentRole <= YearsAtCompany', ['YearsInCurrentRole',
        'YearsAtCompany'], 'yicr_le_yac')
      - Invalid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - '.hasMin(''YearsSinceLastPromotion'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
