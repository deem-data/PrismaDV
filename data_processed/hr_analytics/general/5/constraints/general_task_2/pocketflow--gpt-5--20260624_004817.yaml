constraints:
  AgeGroup:
    code:
    - - .isContainedIn('AgeGroup', ['18-25', '26-35', '36-45', '46-55', '55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  BusinessTravel:
    code:
    - - .isContainedIn('BusinessTravel', ['Non-Travel', 'Travel_Rarely', 'Travel_Frequently',
        'TravelRarely'])
      - Valid
    assumptions: []
    column_name: BusinessTravel
  EmpID:
    code:
    - - .isComplete('EmpID')
      - Valid
    - - .isUnique('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeCount:
    code:
    - - .isContainedIn('EmployeeCount', [1])
      - Invalid
    assumptions: []
    column_name: EmployeeCount
  JobLevel:
    code:
    - - '.hasMax(''JobLevel'', lambda v: v <= 5)'
      - Valid
    - - '.hasMin(''JobLevel'', lambda v: v >= 1)'
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['No', 'Yes'])
      - Valid
    assumptions: []
    column_name: OverTime
  PercentSalaryHike:
    code:
    - - '.hasMax(''PercentSalaryHike'', lambda v: v <= 100)'
      - Valid
    - - '.hasMin(''PercentSalaryHike'', lambda v: v >= 0)'
      - Valid
    assumptions: []
    column_name: PercentSalaryHike
  PerformanceRating:
    code:
    - - .isContainedIn('PerformanceRating', [3, 4])
      - Invalid
    assumptions: []
    column_name: PerformanceRating
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k', '5k-10k', '10k-15k', '15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - '.hasMax(''StandardHours'', lambda v: v == 80.0)'
      - Valid
    - - '.hasMin(''StandardHours'', lambda v: v == 80.0)'
      - Valid
    assumptions: []
    column_name: StandardHours
