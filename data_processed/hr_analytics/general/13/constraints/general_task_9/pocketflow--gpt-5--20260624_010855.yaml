constraints:
  Age:
    code:
    - - .hasDataType('Age', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMin(''Age'', lambda v: v >= 18)'
      - Valid
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .isComplete('AgeGroup')
      - Valid
    - - .isContainedIn('AgeGroup', ['18-25','26-35','36-45','46-55','55+'])
      - Valid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: Attrition
  Department:
    code:
    - - .isComplete('Department')
      - Valid
    assumptions: []
    column_name: Department
  DistanceFromHome:
    code:
    - - .isComplete('DistanceFromHome')
      - Valid
    - - .isNonNegative('DistanceFromHome')
      - Valid
    assumptions: []
    column_name: DistanceFromHome
  EmpID:
    code:
    - - '.hasPattern(''EmpID'', r''^RM\d{3}$'', lambda v: v >= 0.9)'
      - Invalid
    - - .isComplete('EmpID')
      - Valid
    - - .isUnique('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  JobRole:
    code:
    - - .isComplete('JobRole')
      - Valid
    assumptions: []
    column_name: JobRole
  JobSatisfaction:
    code:
    - - .isComplete('JobSatisfaction')
      - Valid
    - - .isContainedIn('JobSatisfaction', [1,2,3,4])
      - Invalid
    assumptions: []
    column_name: JobSatisfaction
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isNonNegative('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  OverTime:
    code:
    - - .isComplete('OverTime')
      - Valid
    - - .isContainedIn('OverTime', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isComplete('SalarySlab')
      - Valid
    - - .isContainedIn('SalarySlab', ['Upto 5k','5k-10k','10k-15k','15k+'])
      - Valid
    assumptions: []
    column_name: SalarySlab
  WorkLifeBalance:
    code:
    - - .isComplete('WorkLifeBalance')
      - Valid
    - - .isContainedIn('WorkLifeBalance', [1,2,3,4])
      - Invalid
    assumptions: []
    column_name: WorkLifeBalance
  YearsAtCompany:
    code:
    - - .isComplete('YearsAtCompany')
      - Valid
    - - .isNonNegative('YearsAtCompany')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
  YearsInCurrentRole:
    code:
    - - .isComplete('YearsInCurrentRole')
      - Valid
    assumptions: []
    column_name: YearsInCurrentRole
  YearsSinceLastPromotion:
    code:
    - - .isComplete('YearsSinceLastPromotion')
      - Valid
    assumptions: []
    column_name: YearsSinceLastPromotion
  YearsWithCurrManager:
    code:
    - - .hasDataType('YearsWithCurrManager', ConstrainableDataTypes.Fractional)
      - Valid
    - - .isComplete('YearsWithCurrManager')
      - Invalid
    - - .isNonNegative('YearsWithCurrManager')
      - Valid
    assumptions: []
    column_name: YearsWithCurrManager
