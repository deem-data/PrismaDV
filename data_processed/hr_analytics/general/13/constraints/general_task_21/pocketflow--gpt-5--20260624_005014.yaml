constraints:
  Age:
    code:
    - - '.hasMax(''Age'', lambda v: v <= 100)'
      - Valid
    - - '.hasMin(''Age'', lambda v: v >= 18)'
      - Valid
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  AgeGroup:
    code:
    - - .satisfies('(Age IS NULL) OR (AgeGroup IS NULL) OR CASE WHEN Age >= 55 THEN
        \'55+\' WHEN Age >= 46 THEN \'46-55\' WHEN Age >= 36 THEN \'36-45\' WHEN Age
        >= 26 THEN \'26-35\' ELSE \'18-25\' END = AgeGroup', 'age_matches_group')
      - Invalid
    assumptions: []
    column_name: AgeGroup
  Attrition:
    code:
    - - .isComplete('Attrition')
      - Valid
    - - .isContainedIn('Attrition', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: Attrition
  BusinessTravel:
    code:
    - - .isContainedIn('BusinessTravel', ['Travel_Rarely','Travel_Frequently','Non-Travel'])
      - Invalid
    assumptions: []
    column_name: BusinessTravel
  Department:
    code:
    - - .satisfies('CASE WHEN JobRole IN (\'Research Scientist\', \'Laboratory Technician\',
        \'Research Director\', \'Manufacturing Director\') THEN Department = \'Research
        & Development\' WHEN JobRole IN (\'Sales Executive\', \'Sales Representative\',
        \'Healthcare Representative\') THEN Department = \'Sales\' ELSE true END',
        'role_department_consistency')
      - Invalid
    assumptions: []
    column_name: Department
  EmpID:
    code:
    - - '.hasUniqueness([''EmpID''], lambda v: v >= 0.95)'
      - Valid
    - - .isComplete('EmpID')
      - Valid
    assumptions: []
    column_name: EmpID
  EmployeeCount:
    code:
    - - .satisfies('EmployeeCount = 1', 'employee_count_is_one')
      - Valid
    assumptions: []
    column_name: EmployeeCount
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male','Female'])
      - Valid
    assumptions: []
    column_name: Gender
  JobLevel:
    code:
    - - '.hasMax(''JobLevel'', lambda v: v <= 5)'
      - Valid
    - - '.hasMin(''JobLevel'', lambda v: v >= 1)'
      - Valid
    assumptions: []
    column_name: JobLevel
  MonthlyIncome:
    code:
    - - .isComplete('MonthlyIncome')
      - Valid
    - - .isPositive('MonthlyIncome')
      - Valid
    assumptions: []
    column_name: MonthlyIncome
  Over18:
    code:
    - - .isContainedIn('Over18', ['Y'])
      - Valid
    assumptions: []
    column_name: Over18
  OverTime:
    code:
    - - .isContainedIn('OverTime', ['Yes','No'])
      - Valid
    assumptions: []
    column_name: OverTime
  SalarySlab:
    code:
    - - .isContainedIn('SalarySlab', ['Upto 5k','5k-10k','10k-15k','15k+'])
      - Valid
    - - .satisfies('(MonthlyIncome IS NULL) OR (SalarySlab IS NULL) OR CASE WHEN MonthlyIncome
        <= 5000 THEN \'Upto 5k\' WHEN MonthlyIncome <= 10000 THEN \'5k-10k\' WHEN
        MonthlyIncome <= 15000 THEN \'10k-15k\' ELSE \'15k+\' END = SalarySlab', 'salary_slab_matches_income')
      - Valid
    assumptions: []
    column_name: SalarySlab
  StandardHours:
    code:
    - - .satisfies('StandardHours = 80', 'standard_hours_is_80')
      - Valid
    assumptions: []
    column_name: StandardHours
  StockOptionLevel:
    code:
    - - .isContainedIn('StockOptionLevel', [0,1,2,3])
      - Invalid
    assumptions: []
    column_name: StockOptionLevel
  TrainingTimesLastYear:
    code:
    - - .satisfies('TrainingTimesLastYear >= 0 AND TrainingTimesLastYear <= 6', 'training_range')
      - Valid
    assumptions: []
    column_name: TrainingTimesLastYear
  YearsAtCompany:
    code:
    - - .satisfies('(YearsAtCompany >= 0) AND (TotalWorkingYears >= YearsAtCompany)
        AND (YearsInCurrentRole <= YearsAtCompany)', 'valid_tenures')
      - Valid
    assumptions: []
    column_name: YearsAtCompany
