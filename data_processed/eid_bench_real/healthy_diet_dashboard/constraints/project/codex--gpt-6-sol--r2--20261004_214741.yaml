        \n# Verifying your constraints\n\nYou can execute PyDeequ constraint code\
        \ against a staged table and read back the\nresult of every check:\n\n```\n\
        python deequ_check.py --table <table_name> --constraints <file>\n```\n\nwhere\
        \ the table is named by its file stem and the constraints file is plain text\n\
        with one PyDeequ `Check` call per line, for example:\n\n```\n.isComplete(\"\
        age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"\
        closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure\
        \ prints the reason,\nincluding compilation errors. Use it as often as you\
        \ like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
        \ containing the union of what you\nsettled on for every column:\n\n{\n  \
        \  \"constraints\": [\n        {\n            \"table_name\": \"some_table\"\
        ,\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
        : \".isComplete('some_column')\"\n        },\n        {\n            \"table_name\"\
        : \"another_table\",\n            \"column_name\": \"another_column\",\n \
        \           \"code_for_constraint\": \".isPositive('another_column')\"\n \
        \       }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
        \ Each\nentry names the single table and column it constrains; for a constraint\
        \ spanning\nseveral columns of one table, name the one it is primarily about.\
        \ Constraints are\nchecked against one table at a time, so do not write one\
        \ that spans two tables.\n\n# Workspace boundary\n\nYour workspace is the\
        \ current folder, and for this task nothing else exists.\n\n- Read, list,\
        \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
