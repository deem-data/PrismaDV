        \ no home directory (`~`, $HOME), and no absolute path\n  anywhere else on\
        \ the filesystem.\n- Do not search the wider filesystem -- no `rg`, `grep`,\
        \ `find`, `ls` or\n  `python` over `/`, `/tmp`, `..`, `~` or any path outside\
