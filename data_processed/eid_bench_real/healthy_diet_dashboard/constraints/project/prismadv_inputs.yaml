    content: "\"\"\"Adapter implementation for the Healthy Diet Dashboard RealETLBench\
      \ case.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport shutil\n\
      import subprocess\nimport sys\nfrom pathlib import Path\nfrom typing import\
      \ Any\n\nimport pandas as pd\n\n\nADAPTER_DIR = Path(__file__).resolve().parent\n\
      EXAMPLE_DIR = ADAPTER_DIR.parent\nSOURCE_REPO = ADAPTER_DIR / \"source_repo\"\
      \nALL_SCRIPTS = (\"clean_data\",)\n\nRAW_TABLE = \"price_of_healthy_diet.csv\"\
      \nCOUNTRY_CODES_TABLE = \"country_codes.csv\"\nCONTINENT_TABLE = \"countries_by_continents.csv\"\
      \nOUTPUT_CSV = \"cleaned_price_of_healthy_diet.csv\"\nOUTPUT_PARQUET = \"cleaned_price_of_healthy_diet.parquet\"\
      \n\n\ndef clean_output_dir(output_dir: Path) -> None:\n    if output_dir.exists():\n\
      \        shutil.rmtree(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n\
      \n\ndef ensure_dirs(*paths: Path) -> None:\n    for path in paths:\n       \
      \ path.mkdir(parents=True, exist_ok=True)\n\n\ndef find_input(input_dir: Path,\
      \ name: str) -> Path:\n    path = input_dir / name\n    if not path.exists():\n\
      \        raise FileNotFoundError(f\"{name} not found under {input_dir}\")\n\
      \    return path\n\n\ndef run_python(args: list[str]) -> None:\n    subprocess.run([sys.executable,\
      \ *args], cwd=SOURCE_REPO, check=True)\n\n\ndef write_summary(output_dir: Path,\
      \ payload: dict[str, Any]) -> None:\n    (output_dir / \"summary.json\").write_text(\n\
      \        json.dumps(payload, indent=2, sort_keys=True) + \"\\n\", encoding=\"\
      utf-8\"\n    )\n\n\ndef _numeric_summary(series: pd.Series) -> dict[str, Any]:\n\
      \    s = pd.to_numeric(series, errors=\"coerce\")\n    finite = s.dropna()\n\
      \    if finite.empty:\n        return {\"count\": 0, \"missing\": int(series.isna().sum()),\
      \ \"min\": None, \"max\": None, \"mean\": None}\n    return {\n        \"count\"\
      : int(finite.size),\n        \"missing\": int(series.size - finite.size),\n\
      \        \"min\": float(finite.min()),\n        \"max\": float(finite.max()),\n\
      \        \"mean\": float(finite.mean()),\n    }\n\n\ndef run_clean_data(input_dir:\
      \ Path, output_dir: Path) -> dict[str, Any]:\n    raw_csv = find_input(input_dir,\
      \ RAW_TABLE)\n    codes_csv = find_input(input_dir, COUNTRY_CODES_TABLE)\n \
      \   continent_csv = find_input(input_dir, CONTINENT_TABLE)\n\n    data_dir =\
      \ output_dir / \"data\" / \"processed\"\n    ensure_dirs(data_dir)\n\n    run_python([\n\
      \        \"src/scripts/clean_data.py\",\n        \"--raw_data\", str(raw_csv),\n\
      \        \"--country_codes\", str(codes_csv),\n        \"--continent_lookup\"\
      , str(continent_csv),\n        \"--save_to\", str(data_dir),\n    ])\n\n   \
      \ output_csv = data_dir / OUTPUT_CSV\n    output_parquet = data_dir / OUTPUT_PARQUET\n\
      \n    raw_df = pd.read_csv(raw_csv, encoding=\"utf-8-sig\")\n    codes_df =\
      \ pd.read_csv(codes_csv, encoding=\"utf-8-sig\")\n    continent_df = pd.read_csv(continent_csv,\
      \ encoding=\"utf-8-sig\")\n    clean_df = pd.read_csv(output_csv, encoding=\"\
      utf-8-sig\")\n\n    columns = list(clean_df.columns)\n    year_summary = _numeric_summary(clean_df[\"\
      year\"]) if \"year\" in clean_df.columns else {}\n    year_range = (\n     \
      \   [int(year_summary[\"min\"]), int(year_summary[\"max\"])]\n        if year_summary.get(\"\
      min\") is not None\n        else [None, None]\n    )\n\n    rows_per_region\
      \ = (\n        clean_df[\"region\"].fillna(\"<missing>\").value_counts().sort_index().to_dict()\n\
      \        if \"region\" in clean_df.columns\n        else {}\n    )\n    countries_per_region\
      \ = (\n        clean_df.dropna(subset=[\"region\", \"country\"])\n        .groupby(\"\
      region\")[\"country\"]\n        .nunique()\n        .sort_index()\n        .to_dict()\n\
      \        if {\"region\", \"country\"}.issubset(clean_df.columns)\n        else\
      \ {}\n    )\n    cost_categories = (\n        sorted(clean_df[\"cost_category\"\
      ].dropna().unique().tolist())\n        if \"cost_category\" in clean_df.columns\n\
      \        else []\n    )\n    regions = (\n        sorted(clean_df[\"region\"\
      ].dropna().unique().tolist())\n        if \"region\" in clean_df.columns\n \
      \       else []\n    )\n\n    summary = {\n        \"script_id\": \"clean_data\"\
      ,\n        \"inputs\": {\n            \"raw_rows\": int(len(raw_df)),\n    \
      \        \"raw_columns\": list(raw_df.columns),\n            \"country_codes_rows\"\
      : int(len(codes_df)),\n            \"continent_lookup_rows\": int(len(continent_df)),\n\
      \        },\n        \"outputs\": {\n            \"cleaned_csv_exists\": output_csv.exists(),\n\
      \            \"cleaned_parquet_exists\": output_parquet.exists(),\n        \
      \    \"rows\": int(len(clean_df)),\n            \"columns\": columns,\n    \
      \        \"column_count\": len(columns),\n            \"alpha3_column_present\"\
      : \"Alpha-3 code\" in columns,\n            \"alpha3_missing_rows\": int(clean_df[\"\
      Alpha-3 code\"].isna().sum())\n                if \"Alpha-3 code\" in columns\
      \ else None,\n            \"region_missing_rows\": int(clean_df[\"region\"].isna().sum())\n\
      \                if \"region\" in columns else None,\n            \"country_missing_rows\"\
      : int(clean_df[\"country\"].isna().sum())\n                if \"country\" in\
      \ columns else None,\n        },\n        \"stats\": {\n            \"n_countries\"\
      : int(clean_df[\"country\"].nunique()) if \"country\" in columns else 0,\n \
      \           \"regions\": regions,\n            \"cost_categories\": cost_categories,\n\
      \            \"year_range\": year_range,\n            \"cost_healthy_diet_ppp_usd\"\
      : _numeric_summary(clean_df[\"cost_healthy_diet_ppp_usd\"])\n              \
      \  if \"cost_healthy_diet_ppp_usd\" in columns else {},\n            \"rows_per_region\"\
      : {str(k): int(v) for k, v in rows_per_region.items()},\n            \"countries_per_region\"\
      : {str(k): int(v) for k, v in countries_per_region.items()},\n        },\n \
      \   }\n    return summary\n\n\ndef run_script(script_id: str, input_dir: Path,\
      \ output_dir: Path) -> None:\n    if script_id not in ALL_SCRIPTS:\n       \
      \ raise ValueError(f\"unknown script_id: {script_id}\")\n\n    clean_output_dir(output_dir)\n\
      \n    if script_id == \"clean_data\":\n        summary = run_clean_data(input_dir,\
      \ output_dir)\n    else:\n        raise AssertionError(script_id)\n\n    write_summary(output_dir,\
      \ summary)\n"
