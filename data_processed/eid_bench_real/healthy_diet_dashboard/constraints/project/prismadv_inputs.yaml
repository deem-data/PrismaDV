    content: "\"\"\"\nCleans the \"price_of_healthy_diet\" dataset by joining with\
      \ country code lookup table\nand fixing regions/continents using a countries-by-continent\
      \ lookup.\n\nAdapted for RealETLBench: input/output paths are parameterized\
      \ via CLI options so the\nbenchmark adapter can stage clean or corrupted tables\
      \ into a chosen directory.\n\"\"\"\n\nfrom pathlib import Path\nimport unicodedata\n\
      \nimport click\nimport pandas as pd\n\n\ndef _normalize_country_names(country_series:\
      \ pd.Series) -> pd.Series:\n    \"\"\"standardize country names to match countries_by_continents\
      \ lookup\"\"\"\n\n    name_map = {\n        \"Burkina Faso\": \"Burkina\",\n\
      \        \"Bolivia (Plurinational State of)\": \"Bolivia\",\n        \"Brunei\
      \ Darussalam\": \"Brunei\",\n        \"Cabo Verde\": \"Cape Verde\",\n     \
      \   \"China, mainland\": \"China\",\n        \"China, Hong Kong SAR\": \"Hong\
      \ Kong\",\n        \"China, Taiwan Province of\": \"Taiwan\",\n        \"C\xF4\
      te d'Ivoire\": \"Ivory Coast\",\n        \"Democratic Republic of the Congo\"\
      : \"Democratic Republic of Congo\",\n        \"Eswatini\": \"Swaziland\",\n\
      \        \"Iran (Islamic Republic of)\": \"Iran\",\n        \"Lao People's Democratic\
      \ Republic\": \"Laos\",\n        \"Myanmar\": \"Burma (Myanmar)\",\n       \
      \ \"North Macedonia\": \"Macedonia\",\n        \"Republic of Korea\": \"South\
      \ Korea\",\n        \"Republic of Moldova\": \"Moldova\",\n        \"Russian\
      \ Federation\": \"Russia\",\n        \"Syrian Arab Republic\": \"Syria\",\n\
      \        \"T\xFCrkiye\": \"Turkey\",\n        \"United Kingdom of Great Britain\
      \ and Northern Ireland\": \"United Kingdom\",\n        \"United Republic of\
      \ Tanzania\": \"Tanzania\",\n        \"United States of America\": \"United\
      \ States\",\n        \"Viet Nam\": \"Vietnam\",\n        \"Netherlands (Kingdom\
      \ of the)\": \"Netherlands\",\n    }\n\n    def _canon(s: str) -> str:\n   \
      \     s = unicodedata.normalize(\"NFKC\", s)\n        s = s.replace(\"\u2019\
      \", \"'\").replace(\"\u2018\", \"'\")\n        s = s.replace(\"\_\", \" \")\n\
      \        return s.strip()\n\n    return country_series.astype(str).map(_canon).replace(name_map)\n\
      \n\ndef clean_dataset(raw_data: Path, country_codes: Path, continent_lookup:\
      \ Path, save_to: Path) -> pd.DataFrame:\n    \"\"\"\n    Load and clean the\
      \ price_of_healthy_diet data by joining with country code lookups,\n    then\
      \ fix region using countries_by_continent lookup.\n\n    Returns:\n        pd.DataFrame:\
      \ Cleaned dataset with country information and corrected region.\n    \"\"\"\
      \n    df_price = pd.read_csv(raw_data)\n    df_codes = pd.read_csv(country_codes)\n\
      \    df_continent = pd.read_csv(continent_lookup)\n\n    print(\"Joining datasets\
      \ on country code...\")\n    codes_keep = [\"Numeric\", \"Alpha-2 code\", \"\
      Alpha-3 code\"]\n    df_clean = df_price.merge(\n        df_codes[codes_keep],\n\
      \        left_on=\"country_code\",\n        right_on=\"Numeric\",\n        how=\"\
      left\",\n    )\n\n    df_clean[\"region_original\"] = df_clean[\"region\"]\n\
      \n    df_clean[\"country_for_lookup\"] = _normalize_country_names(df_clean[\"\
      country\"])\n\n    df_clean[\"country\"] = df_clean[\"country_for_lookup\"]\n\
      \n    if not {\"Continent\", \"Country\"}.issubset(df_continent.columns):\n\
      \        raise ValueError(\n            \"countries_by_continent.csv must contain\
      \ columns: 'Country' and 'Continent'.\"\n        )\n\n    df_clean = df_clean.merge(\n\
      \        df_continent[[\"Country\", \"Continent\"]],\n        left_on=\"country_for_lookup\"\
      ,\n        right_on=\"Country\",\n        how=\"left\",\n    )\n\n    manual_continent_overrides\
      \ = {\n        \"Aruba\": \"North America\",\n        \"Bermuda\": \"North America\"\
      ,\n        \"British Virgin Islands\": \"North America\",\n        \"Cayman\
      \ Islands\": \"North America\",\n        \"Cura\xE7ao\": \"North America\",\n\
      \        \"Sint Maarten (Dutch part)\": \"North America\",\n        \"Turks\
      \ and Caicos Islands\": \"North America\",\n        \"Palestine\": \"Asia\"\
      ,\n    }\n    df_clean[\"Continent\"] = df_clean[\"Continent\"].fillna(\n  \
      \      df_clean[\"country\"].map(manual_continent_overrides)\n    )\n\n    df_clean[\"\
      region\"] = df_clean[\"Continent\"].fillna(df_clean[\"region\"])\n\n    unmatched\
      \ = (\n        df_clean.loc[df_clean[\"Continent\"].isna(), \"country_for_lookup\"\
      ]\n        .dropna()\n        .unique()\n        .tolist()\n    )\n    if len(unmatched)\
      \ > 0:\n        unmatched = sorted(unmatched)\n        print(\"Warning: some\
      \ countries did not match countries_by_continent lookup:\")\n        print(unmatched)\n\
      \n    df_clean = df_clean.drop(\n        columns=[\n            \"Country\"\
      ,\n            \"Continent\",\n            \"country_for_lookup\",\n       \
      \     \"Numeric\",\n            \"Alpha-2 code\",\n            \"region_original\"\
      ,\n        ],\n        errors=\"ignore\",\n    )\n\n    save_to.mkdir(parents=True,\
      \ exist_ok=True)\n    output_path = save_to / \"cleaned_price_of_healthy_diet.csv\"\
      \n    df_clean.to_csv(output_path, index=False)\n    print(f\"CSV saved to:\
      \ {output_path}\")\n\n    parquet_path = save_to / \"cleaned_price_of_healthy_diet.parquet\"\
      \n    df_clean.to_parquet(parquet_path, index=False)\n    print(f\"Parquet saved\
      \ to: {parquet_path}\")\n\n    return df_clean\n\n\n@click.command()\n@click.option(\"\
      --raw_data\", type=click.Path(exists=True, path_type=Path), required=True,\n\
      \              help=\"Path to raw price_of_healthy_diet_clean.csv.\")\n@click.option(\"\
      --country_codes\", type=click.Path(exists=True, path_type=Path), required=True,\n\
      \              help=\"Path to country_codes.csv lookup.\")\n@click.option(\"\
      --continent_lookup\", type=click.Path(exists=True, path_type=Path), required=True,\n\
      \              help=\"Path to countries_by_continents.csv lookup.\")\n@click.option(\"\
      --save_to\", type=click.Path(path_type=Path), required=True,\n             \
      \ help=\"Directory where the cleaned csv/parquet will be written.\")\ndef main(raw_data:\
      \ Path, country_codes: Path, continent_lookup: Path, save_to: Path) -> None:\n\
      \    clean_dataset(raw_data, country_codes, continent_lookup, save_to)\n\n\n\
      if __name__ == \"__main__\":\n    main()\n"
