    \ \t\t) RAWDATA\n      0895: \t) e\n      0896: \tWHERE (2 * e.start_ordinal)\
    \ - e.overall_ord = 0\n      0897: )\n      0898: \n      0899: , cteDrugExposureEnds\
    \ (person_id, drug_concept_id, drug_exposure_start_datetime, drug_sub_exposure_end_datetime)\
    \ AS\n      0900: (\n      0901: SELECT\n      0902: \tdt.person_id\n      0903:\
    \ \t, dt.ingredient_concept_id\n      0904: \t, dt.drug_exposure_start_datetime\n\
    \      0905: \t, MIN(e.end_datetime) AS drug_sub_exposure_end_datetime\n     \
