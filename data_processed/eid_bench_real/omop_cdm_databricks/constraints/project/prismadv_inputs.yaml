    \ is negative, and this can set the end_date before the start_date, which we don't\
    \ want. So we're just looking over those rows. This is a data-quality issue.\n\
    \      0872: )\n      0873: \n      0874: , cteSubExposureEndDates (person_id,\
    \ ingredient_concept_id, end_datetime) AS --- A preliminary sorting that groups\
    \ all of the overlapping exposures into one exposure so that we don't double-count\
    \ non-gap-days\n      0875: (\n      0876: \tSELECT person_id, ingredient_concept_id,\
    \ event_date AS end_datetime\n      0877: \tFROM\n      0878: \t(\n      0879:\
    \ \t\tSELECT person_id, ingredient_concept_id, event_date, event_type,\n     \
    \ 0880: \t\tMAX(start_ordinal) OVER (PARTITION BY person_id, ingredient_concept_id\
    \ ORDER BY event_date, event_type ROWS unbounded preceding) AS start_ordinal,\n\
    \      0881: \t\t-- this pulls the current START down from the prior rows so that\
    \ the NULLs\n      0882: \t\t-- from the END DATES will contain a value we can\
