  - path: case.py
    line_count: 337
    char_count: 12824
    content: "\"\"\"Adapter implementation for the OMOP CDM Databricks RealETLBench\
      \ case.\n\nThe upstream Databricks notebooks live under `adapter/source_repo/`\
      \ and have\nbeen edited in-place to be locally runnable (no `dbutils`, no `delta.\\\
      `path\\``,\nno `-- COMMAND ----------` cell separators, no Hive-only `CREATE\
      \ OR REPLACE\nTABLE`, no Delta-only `USING DELTA`). This file orchestrates them:\n\
      \n1. boot a local Spark session with Hive support + parquet defaults\n2. register\
      \ the Synthea CSV inputs as bronze temp views\n   (`source_repo/1-data-ingest.py::register_bronze_views`)\n\
      3. execute the OMOP CDM DDL (`source_repo/2-omop531-cdm-setup.sql`)\n4. INSERT\
      \ OVERWRITE the OMOP vocab tables from the pre-filtered Athena\n   subset under\
      \ `files/clean/tables/vocab/`\n5. run the source-to-vocab map building SQL (`source_repo/3-omop-vocab-setup.sql`)\n\
      6. execute the Synthea\u2192OMOP ETL (`source_repo/4-omop531-etl-synthea.sql`)\n\
      7. (drug_analysis) run the four analytical queries from\n   `source_repo/6-drug-analysis.py::run_drug_analysis`\n\
      8. (chf_cohort) export OMOP tables to SQLite, shell out to\n   `pixi run --\
      \ Rscript source_repo/5-CHF-cohort-building.r`\n\"\"\"\n\nfrom __future__ import\
      \ annotations\n\nimport importlib.util\nimport json\nimport os\nimport re\n\
      import shutil\nimport subprocess\nimport sys\nfrom pathlib import Path\nfrom\
      \ typing import Any\n\n\nADAPTER_DIR = Path(__file__).resolve().parent\nEXAMPLE_DIR\
      \ = ADAPTER_DIR.parent\nSOURCE_REPO = ADAPTER_DIR / \"source_repo\"\n\nDATA_INGEST_PY\
      \ = SOURCE_REPO / \"1-data-ingest.py\"\nCDM_SETUP_SQL = SOURCE_REPO / \"2-omop531-cdm-setup.sql\"\
      \nVOCAB_SETUP_SQL = SOURCE_REPO / \"3-omop-vocab-setup.sql\"\nETL_SQL = SOURCE_REPO\
      \ / \"4-omop531-etl-synthea.sql\"\nCHF_R_SCRIPT = SOURCE_REPO / \"5-CHF-cohort-building.r\"\
      \nDRUG_ANALYSIS_PY = SOURCE_REPO / \"6-drug-analysis.py\"\n\nPIXI_BIN = Path.home()\
      \ / \".pixi\" / \"bin\" / \"pixi\"\n\nALL_SCRIPTS = (\"sql_etl\", \"drug_analysis\"\
      , \"chf_cohort\")\nOMOP_OUTPUT_TABLES = (\n    \"cdm_source\", \"condition_era\"\
      , \"condition_occurrence\",\n    \"drug_era\", \"drug_exposure\", \"measurement\"\
      ,\n    \"observation_period\", \"person\", \"procedure_occurrence\", \"visit_occurrence\"\
      ,\n)\nVOCAB_TABLES = (\n    \"CONCEPT\", \"CONCEPT_RELATIONSHIP\", \"CONCEPT_ANCESTOR\"\
      ,\n    \"VOCABULARY\", \"DOMAIN\", \"CONCEPT_CLASS\", \"RELATIONSHIP\",\n)\n\
      CHF_REQUIRED_TABLES = (\n    \"condition_occurrence\", \"drug_exposure\", \"\
      observation_period\",\n    \"visit_occurrence\", \"person\", \"concept\", \"\
      concept_ancestor\",\n)\n\n\n# ---- module-load helpers for upstream Python files\
      \ -----------------------\n\ndef _load_source_module(name: str, path: Path)\
      \ -> Any:\n    spec = importlib.util.spec_from_file_location(name, path)\n \
      \   assert spec is not None and spec.loader is not None\n    module = importlib.util.module_from_spec(spec)\n\
      \    spec.loader.exec_module(module)\n    return module\n\n\n# Upstream Python\
      \ files are loaded lazily inside the script runners so that\n# pyspark import\
      \ only happens when a script actually runs.\n\ndef _load_data_ingest() -> Any:\n\
      \    return _load_source_module(\"source_repo_data_ingest\", DATA_INGEST_PY)\n\
      \n\ndef _load_drug_analysis() -> Any:\n    return _load_source_module(\"source_repo_drug_analysis\"\
      , DRUG_ANALYSIS_PY)\n\n\n# ---- Spark session -------------------------------------------------------\n\
      \ndef ensure_local_java_compat() -> None:\n    compat_flag = \"-Djava.security.manager=allow\"\
      \n    current = os.environ.get(\"SPARK_SUBMIT_OPTS\", \"\").strip()\n    if\
      \ compat_flag not in current.split():\n        os.environ[\"SPARK_SUBMIT_OPTS\"\
      ] = f\"{compat_flag} {current}\".strip()\n\n\ndef create_spark(app_name: str,\
      \ output_dir: Path) -> Any:\n    ensure_local_java_compat()\n    from pyspark.sql\
      \ import SparkSession\n\n    warehouse = output_dir / \"_warehouse\"\n    derby\
      \ = output_dir / \"_derby\"\n    warehouse.mkdir(parents=True, exist_ok=True)\n\
      \    derby.mkdir(parents=True, exist_ok=True)\n    spark = (\n        SparkSession.builder.master(\"\
      local[2]\")\n        .appName(app_name)\n        .config(\"spark.sql.warehouse.dir\"\
      , str(warehouse))\n        .config(\"spark.sql.sources.default\", \"parquet\"\
      )\n        .config(\"spark.sql.legacy.createHiveTableByDefault\", \"false\"\
      )\n        .config(\"spark.sql.storeAssignmentPolicy\", \"LEGACY\")\n      \
      \  .config(\"spark.sql.legacy.timeParserPolicy\", \"LEGACY\")\n        .config(\"\
      spark.sql.legacy.parquet.datetimeRebaseModeInWrite\", \"LEGACY\")\n        .config(\"\
      spark.sql.legacy.parquet.datetimeRebaseModeInRead\", \"LEGACY\")\n        .config(\"\
      spark.driver.extraJavaOptions\",\n                f\"-Dderby.system.home={derby}\"\
      )\n        .enableHiveSupport()\n        .getOrCreate()\n    )\n    spark.sparkContext.setLogLevel(\"\
      ERROR\")\n    return spark\n\n\n# ---- SQL execution -------------------------------------------------------\n\
      \n# Match `-- [python cell handled by Python adapter] ...` lines that the\n\
      # upstream-edit step left behind in the SQL files.\n_PYTHON_PLACEHOLDER_RE =\
      \ re.compile(r\"^\\s*--\\s*\\[python cell.*$\", re.MULTILINE)\n\n\ndef split_sql_statements(sql_text:\
      \ str) -> list[str]:\n    \"\"\"Strip line comments + placeholder markers, then\
      \ split on `;`.\"\"\"\n    text = _PYTHON_PLACEHOLDER_RE.sub(\"\", sql_text)\n\
      \    cleaned_lines = []\n    for line in text.splitlines():\n        if line.strip().startswith(\"\
      --\"):\n            continue\n        cleaned_lines.append(line)\n    return\
      \ [stmt.strip() for stmt in \"\\n\".join(cleaned_lines).split(\";\") if stmt.strip()]\n\
      \n\ndef execute_sql_file(spark: Any, path: Path) -> dict[str, Any]:\n    statements\
      \ = split_sql_statements(path.read_text(encoding=\"utf-8\"))\n    executed =\
      \ 0\n    failures: list[dict[str, Any]] = []\n    for index, stmt in enumerate(statements):\n\
      \        try:\n            spark.sql(stmt)\n            executed += 1\n    \
      \    except Exception as exc:  # noqa: BLE001\n            failures.append({\n\
      \                \"file\": path.name,\n                \"stmt_index\": index,\n\
      \                \"statement_head\": stmt.splitlines()[0][:160],\n         \
      \       \"error\": f\"{type(exc).__name__}: {exc}\"[:400],\n            })\n\
      \    return {\n        \"file\": path.name,\n        \"statements_total\": len(statements),\n\
      \        \"statements_executed\": executed,\n        \"failures\": failures,\n\
      \    }\n\n\n# ---- Vocab loading -------------------------------------------------------\n\
      \ndef load_vocab_subset(spark: Any, input_dir: Path) -> dict[str, int]:\n  \
      \  from pyspark.sql import functions as F\n\n    vocab_dir = input_dir / \"\
      vocab\"\n    if not vocab_dir.exists():\n        raise FileNotFoundError(\n\
      \            f\"vocab subset not found at {vocab_dir}. \"\n            f\"Generate\
      \ it with `uv run python scripts/filter_omop_vocab.py`.\"\n        )\n    counts:\
      \ dict[str, int] = {}\n    for table in VOCAB_TABLES:\n        path = vocab_dir\
      \ / f\"{table}.csv.gz\"\n        if not path.exists():\n            raise FileNotFoundError(f\"\
      missing {path}\")\n        df = spark.read.csv(str(path), header=True, inferSchema=True)\n\
      \        for col in (\"valid_start_date\", \"valid_end_date\"):\n          \
      \  if col in df.columns:\n                df = df.withColumn(col, F.to_date(F.col(col),\
      \ \"yyyy-MM-dd\"))\n        df.createOrReplaceTempView(f\"_load_{table.lower()}\"\
      )\n        column_list = \", \".join(df.columns)\n        spark.sql(\n     \
      \       f\"INSERT OVERWRITE TABLE {table} ({column_list}) \"\n            f\"\
      SELECT {column_list} FROM _load_{table.lower()}\"\n        )\n        counts[table]\
      \ = df.count()\n    return counts\n\n\n# ---- OMOP table accounting ----------------------------------------------\n\
      \ndef collect_omop_table_counts(spark: Any) -> dict[str, int | None]:\n    counts:\
      \ dict[str, int | None] = {}\n    for table in OMOP_OUTPUT_TABLES:\n       \
      \ try:\n            counts[table] = int(spark.sql(f\"SELECT COUNT(*) AS n FROM\
      \ {table}\").collect()[0][\"n\"])\n        except Exception:\n            counts[table]\
      \ = None\n    return counts\n\n\n# ---- Pipeline orchestration ---------------------------------------------\n\
      \ndef _build_omop_dataset(spark: Any, input_dir: Path) -> dict[str, Any]:\n\
      \    data_ingest = _load_data_ingest()\n    bronze_counts = data_ingest.register_bronze_views(spark,\
      \ input_dir)\n    cdm_setup_report = execute_sql_file(spark, CDM_SETUP_SQL)\n\
      \    vocab_counts = load_vocab_subset(spark, input_dir)\n    vocab_map_report\
      \ = execute_sql_file(spark, VOCAB_SETUP_SQL)\n    etl_report = execute_sql_file(spark,\
      \ ETL_SQL)\n    omop_counts = collect_omop_table_counts(spark)\n    return {\n\
      \        \"bronze_input_counts\": bronze_counts,\n        \"cdm_setup\": cdm_setup_report,\n\
      \        \"vocab_loaded\": vocab_counts,\n        \"vocab_maps\": vocab_map_report,\n\
      \        \"etl\": etl_report,\n        \"omop_output_counts\": omop_counts,\n\
      \    }\n\n\n# ---- Script entry points ------------------------------------------------\n\
      \ndef clean_output_dir(output_dir: Path) -> None:\n    if output_dir.exists():\n\
      \        shutil.rmtree(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n\
      \n\ndef write_summary(output_dir: Path, payload: dict[str, Any]) -> None:\n\
      \    (output_dir / \"summary.json\").write_text(\n        json.dumps(payload,\
      \ indent=2, sort_keys=True) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\ndef run_sql_etl(input_dir:\
      \ Path, output_dir: Path) -> dict[str, Any]:\n    spark = create_spark(\"omop_cdm_databricks_sql_etl\"\
      , output_dir)\n    try:\n        result = _build_omop_dataset(spark, input_dir)\n\
      \    finally:\n        spark.stop()\n    return {\"script_id\": \"sql_etl\"\
      , **result}\n\n\ndef run_drug_analysis(input_dir: Path, output_dir: Path) ->\
      \ dict[str, Any]:\n    spark = create_spark(\"omop_cdm_databricks_drug_analysis\"\
      , output_dir)\n    try:\n        pipeline = _build_omop_dataset(spark, input_dir)\n\
      \        drug_analysis_module = _load_drug_analysis()\n        analysis = drug_analysis_module.run_drug_analysis(spark)\n\
      \    finally:\n        spark.stop()\n    return {\"script_id\": \"drug_analysis\"\
      , \"pipeline\": pipeline, \"analysis\": analysis}\n\n\n# ---- chf_cohort ---------------------------------------------------------\n\
      \ndef export_omop_tables_to_sqlite(spark: Any, sqlite_path: Path,\n        \
      \                         tables: tuple[str, ...] = CHF_REQUIRED_TABLES) ->\
      \ dict[str, int]:\n    import sqlite3\n\n    if sqlite_path.exists():\n    \
      \    sqlite_path.unlink()\n    sqlite_path.parent.mkdir(parents=True, exist_ok=True)\n\
      \    counts: dict[str, int] = {}\n    with sqlite3.connect(str(sqlite_path))\
      \ as conn:\n        for table in tables:\n            pdf = spark.sql(f\"SELECT\
      \ * FROM {table}\").toPandas()\n            for col in pdf.columns:\n      \
      \          dtype_name = str(pdf[col].dtype).lower()\n                if \"datetime\"\
      \ in dtype_name or \"date\" in dtype_name:\n                    pdf[col] = pdf[col].astype(\"\
      string\").where(pdf[col].notna(), None)\n            pdf.to_sql(table, conn,\
      \ if_exists=\"replace\", index=False)\n            counts[table] = int(len(pdf))\n\
      \    return counts\n\n\ndef run_chf_cohort(input_dir: Path, output_dir: Path)\
      \ -> dict[str, Any]:\n    if not PIXI_BIN.exists():\n        raise FileNotFoundError(\n\
      \            f\"pixi binary not found at {PIXI_BIN}; install with \"\n     \
      \       \"`curl -fsSL https://pixi.sh/install.sh | bash` and run `pixi install`\
      \ \"\n            \"in this example directory.\"\n        )\n    spark = create_spark(\"\
      omop_cdm_databricks_chf_cohort\", output_dir)\n    try:\n        pipeline =\
      \ _build_omop_dataset(spark, input_dir)\n        sqlite_path = output_dir /\
      \ \"omop_for_r.sqlite\"\n        table_counts = export_omop_tables_to_sqlite(spark,\
      \ sqlite_path)\n    finally:\n        spark.stop()\n\n    cohort_json_path =\
      \ output_dir / \"chf_cohort_summary.json\"\n    proc = subprocess.run(\n   \
      \     [str(PIXI_BIN), \"run\", \"--manifest-path\", str(EXAMPLE_DIR / \"pixi.toml\"\
      ),\n         \"--\", \"Rscript\", str(CHF_R_SCRIPT), str(sqlite_path), str(cohort_json_path)],\n\
      \        capture_output=True,\n        text=True,\n        cwd=str(EXAMPLE_DIR),\n\
      \    )\n    r_stdout = (proc.stdout or \"\").strip().splitlines()\n    r_stderr\
      \ = (proc.stderr or \"\").strip().splitlines()\n    if proc.returncode != 0:\n\
      \        return {\n            \"script_id\": \"chf_cohort\",\n            \"\
      pipeline\": pipeline,\n            \"sqlite_export_counts\": table_counts,\n\
      \            \"status\": \"rscript_failed\",\n            \"rscript_returncode\"\
      : proc.returncode,\n            \"rscript_stdout_tail\": r_stdout[-10:],\n \
      \           \"rscript_stderr_tail\": r_stderr[-20:],\n        }\n    cohort_summary\
      \ = json.loads(cohort_json_path.read_text(encoding=\"utf-8\"))\n    return {\n\
      \        \"script_id\": \"chf_cohort\",\n        \"pipeline\": pipeline,\n \
      \       \"sqlite_export_counts\": table_counts,\n        \"rscript_stdout_tail\"\
      : r_stdout[-5:],\n        \"cohort\": cohort_summary,\n    }\n\n\ndef run_script(script_id:\
      \ str, input_dir: Path, output_dir: Path) -> None:\n    if script_id not in\
      \ ALL_SCRIPTS:\n        raise ValueError(f\"unknown script_id: {script_id}\"\
      )\n    clean_output_dir(output_dir)\n    if script_id == \"sql_etl\":\n    \
      \    summary = run_sql_etl(input_dir, output_dir)\n    elif script_id == \"\
      drug_analysis\":\n        summary = run_drug_analysis(input_dir, output_dir)\n\
      \    elif script_id == \"chf_cohort\":\n        summary = run_chf_cohort(input_dir,\
      \ output_dir)\n    else:\n        raise AssertionError(script_id)\n    write_summary(output_dir,\
      \ summary)\n"
  - path: source_repo/1-data-ingest.py
    line_count: 72
    char_count: 2920
    content: "# Synthea bronze ingestion \u2014 local PySpark port of the upstream\
      \ Databricks notebook.\n#\n# The upstream notebook reads Synthea CSVs from `/dbfs/<synthea_path>/`\
      \ listed\n# via `dbutils.fs.ls(...)`, then writes them as delta tables in the\
      \ bronze\n# layer. For the local RealETLBench adapter we expose a single function\n\
      # `register_bronze_views(spark, input_dir)` that registers CSV-backed temp\n\
      # views matching the table names the downstream OMOP ETL expects.\n#\n# Three\
      \ downstream changes vs. upstream:\n#   - No DBFS \u2014 Synthea CSVs are read\
      \ directly from `<input_dir>/*.csv`.\n#   - No delta writes \u2014 bronze tables\
      \ are Spark temporary views (the OMOP ETL\n#     reads from them by name, not\
      \ by delta path).\n#   - The benchmark only stages six of the upstream's sixteen\
      \ Synthea tables;\n#     `immunizations` is stubbed empty (the OMOP ETL does\
      \ a LEFT JOIN on it)\n#     and `procedures.DATE` is renamed to `procedures.START`\
      \ to match the\n#     upstream Synthea schema.\nfrom __future__ import annotations\n\
      from pathlib import Path\nfrom typing import Any\n\n\n# Six Synthea tables our\
      \ 3,000-patient bundled subset actually contains.\nSYNTHEA_INPUT_TABLES = (\n\
      \    \"patients\",\n    \"encounters\",\n    \"conditions\",\n    \"medications\"\
      ,\n    \"observations\",\n    \"procedures\",\n)\n\n# Tables the upstream ETL\
      \ references but our subset does not include \u2014 they\n# are registered as\
      \ empty stub views with the relevant Synthea schema.\nSYNTHEA_STUB_TABLES =\
      \ (\"immunizations\",)\n\n\ndef register_bronze_views(spark: Any, input_dir:\
      \ Path) -> dict[str, int]:\n    \"\"\"Mirror the upstream `for table_name in\
      \ [...]: sql(\"CREATE VIEW ... FROM\n    delta.path/\")` Python loop by registering\
      \ CSV-backed temp views.\n\n    Returns {table_name: row_count} for diagnostic\
      \ reporting.\n    \"\"\"\n    from pyspark.sql.types import (\n        StructType,\n\
      \        StructField,\n        StringType,\n        DateType,\n        DoubleType,\n\
      \    )\n\n    counts: dict[str, int] = {}\n    for table_name in SYNTHEA_INPUT_TABLES:\n\
      \        path = input_dir / f\"{table_name}.csv\"\n        if not path.exists():\n\
      \            raise FileNotFoundError(f\"missing required Synthea input: {path}\"\
      )\n        df = spark.read.csv(str(path), header=True, inferSchema=True)\n \
      \       if table_name == \"procedures\" and \"DATE\" in df.columns and \"START\"\
      \ not in df.columns:\n            df = df.withColumnRenamed(\"DATE\", \"START\"\
      )\n        df.createOrReplaceTempView(table_name)\n        counts[table_name]\
      \ = df.count()\n\n    immunizations_schema = StructType([\n        StructField(\"\
      DATE\", DateType(), True),\n        StructField(\"PATIENT\", StringType(), True),\n\
      \        StructField(\"ENCOUNTER\", StringType(), True),\n        StructField(\"\
      CODE\", StringType(), True),\n        StructField(\"DESCRIPTION\", StringType(),\
      \ True),\n        StructField(\"BASE_COST\", DoubleType(), True),\n    ])\n\
      \    spark.createDataFrame([], immunizations_schema).createOrReplaceTempView(\"\
      immunizations\")\n    counts[\"immunizations\"] = 0\n    return counts\n"
  - path: source_repo/2-omop531-cdm-setup.sql
    line_count: 591
    char_count: 14150
    content: "-- [python cell handled by Python adapter] import json\n\n-- [python\
      \ cell handled by Python adapter] sql(f\"DROP DATABASE IF EXISTS {omop_version}\
      \ CASCADE;\")\n\nDROP TABLE IF EXISTS CONCEPT;\nCREATE TABLE CONCEPT (\n  CONCEPT_ID\
      \ LONG,\n  CONCEPT_NAME STRING,\n  DOMAIN_ID STRING,\n  VOCABULARY_ID STRING,\n\
      \  CONCEPT_CLASS_ID STRING,\n  STANDARD_CONCEPT STRING,\n  CONCEPT_CODE STRING,\n\
      \  VALID_START_DATE DATE,\n  VALID_END_DATE DATE,\n  INVALID_REASON STRING\n\
      );\n\nDROP TABLE IF EXISTS VOCABULARY;\nCREATE TABLE VOCABULARY (\n  VOCABULARY_ID\
      \ STRING,\n  VOCABULARY_NAME STRING,\n  VOCABULARY_REFERENCE STRING,\n  VOCABULARY_VERSION\
      \ STRING,\n  VOCABULARY_CONCEPT_ID LONG\n);\n\nDROP TABLE IF EXISTS DOMAIN;\n\
      CREATE TABLE DOMAIN (\n  DOMAIN_ID STRING,\n  DOMAIN_NAME STRING,\n  DOMAIN_CONCEPT_ID\
      \ LONG\n);\n\nDROP TABLE IF EXISTS CONCEPT_CLASS;\nCREATE TABLE CONCEPT_CLASS\
      \ (\n  CONCEPT_CLASS_ID STRING,\n  CONCEPT_CLASS_NAME STRING,\n  CONCEPT_CLASS_CONCEPT_ID\
      \ LONG\n);\n\nDROP TABLE IF EXISTS CONCEPT_RELATIONSHIP;\nCREATE TABLE CONCEPT_RELATIONSHIP\
      \ (\n  CONCEPT_ID_1 LONG,\n  CONCEPT_ID_2 LONG,\n  RELATIONSHIP_ID STRING,\n\
