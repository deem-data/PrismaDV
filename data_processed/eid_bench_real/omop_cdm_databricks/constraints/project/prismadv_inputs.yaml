    \ drug_exposure_end_datetime) AS\n      0849: (-- Normalize DRUG_EXPOSURE_END_DATE\
    \ to either the existing drug exposure end date, or add days supply, or add 1\
    \ day to the start date\n      0850: \tSELECT\n      0851: \t\td.drug_exposure_id\n\
    \      0852: \t\t, d.person_id\n      0853: \t\t, c.concept_id AS ingredient_concept_id\n\
    \      0854: \t\t, d.drug_exposure_start_datetime AS drug_exposure_start_datetime\n\
    \      0855: \t\t, d.days_supply AS days_supply\n      0856: \t\t, COALESCE(\n\
    \      0857: \t\t\t---NULLIF returns NULL if both values are the same, otherwise\
    \ it returns the first parameter\n      0858: \t\t\tifnull(drug_exposure_end_datetime,\
    \ NULL),\n      0859: \t\t\t---If drug_exposure_end_date != NULL, return drug_exposure_end_date,\
    \ otherwise go to next case\n      0860: \t\t\tifnull(date_add(drug_exposure_start_datetime,cast(days_supply\
    \ as int)), drug_exposure_start_datetime),\n      0861: \t\t\t---If days_supply\
    \ != NULL or 0, return drug_exposure_start_date + days_supply, otherwise go to\
    \ next case\n      0862: \t\t\tdate_add(drug_exposure_start_datetime,1)\n    \
    \  0863: \t\t\t---Add 1 day to the drug_exposure_start_date since there is no\
    \ end_date or INTERVAL for the days_supply\n      0864: \t\t) AS drug_exposure_end_datetime\n\
    \      0865: \tFROM drug_exposure d\n      0866: \t\tINNER JOIN concept_ancestor\
    \ ca ON ca.descendant_concept_id = d.drug_concept_id\n      0867: \t\tINNER JOIN\
    \ concept c ON ca.ancestor_concept_id = c.concept_id\n      0868: \t\tWHERE c.vocabulary_id\
    \ = 'RxNorm' ---8 selects RxNorm from the vocabulary_id\n      0869: \t\tAND c.concept_class_id\
    \ = 'Ingredient'\n      0870: \t\tAND d.drug_concept_id != 0 ---Our unmapped drug_concept_id's\
    \ are set to 0, so we don't want different drugs wrapped up in the same era\n\
