  - path: source_repo/6-drug-analysis.py
    line_count: 175
    char_count: 6251
    content: "# Drug Usage Trends \u2014 local PySpark port of the upstream Databricks\
      \ notebook.\n#\n# In the upstream notebook this file is a Databricks notebook\
      \ with mixed\n# `# MAGIC %sql` and `# MAGIC %python` cells. For the local RealETLBench\n\
      # adapter we expose a single function `run_drug_analysis(spark)` that runs the\n\
      # same four analytical queries against an existing Spark session (the OMOP\n\
      # tables must already be populated by the SQL ETL).\n#\n# Three downstream changes\
      \ vs. upstream:\n#   - No `USE omop531;` \u2014 we rely on Spark's default database\
      \ for managed tables.\n#   - No plotly rendering \u2014 we capture row counts\
      \ and the top-N sample rows so\n#     the adapter can serialize an analytical\
      \ summary to JSON.\n#   - The FP-Growth (mllib) frequent-itemset example is\
      \ not ported; the cosine\n#     similarity example covers the same drug-pair\
      \ signal with simpler code.\nfrom __future__ import annotations\nfrom typing\
      \ import Any\n\n\n# Example 1: usage of Oxycodone (concept_id 1124957) stratified\
      \ by age, year, gender.\nOXYCODONE_USAGE = \"\"\"\nSELECT\n    tt.drug_concept_name,\n\
      \    tt.drug_concept_id,\n    count(1) AS s_count,\n    tt.age_band,\n    tt.year_of_era,\n\
      \    tt.gender\nFROM (\n    SELECT\n        floor((extract(year FROM t.drug_era_start_date)\
      \ - p.year_of_birth) / 10) AS age_band,\n        extract(year FROM t.drug_era_start_date)\
      \ AS year_of_era,\n        p.gender_concept_id,\n        t.drug_concept_id,\n\
      \        c.concept_name AS drug_concept_name,\n        c1.concept_name AS gender\n\
      \    FROM drug_era t, person p, concept c, concept c1\n    WHERE t.person_id\
      \ = p.person_id\n      AND c.concept_id = t.drug_concept_id\n      AND c1.concept_id\
      \ = p.gender_concept_id\n      AND c.concept_id = 1124957\n) tt\nWHERE tt.year_of_era\
      \ > 2000\nGROUP BY tt.age_band, tt.year_of_era, tt.gender, tt.drug_concept_name,\
      \ tt.drug_concept_id\nORDER BY tt.age_band, tt.year_of_era, tt.drug_concept_id\n\
      \"\"\"\n\n# Example 2: top drugs prescribed by year.\nTOP_DRUGS_BY_YEAR = \"\
      \"\"\nWITH tt AS (\n    SELECT\n        extract(year FROM t.drug_era_start_date)\
      \ AS year_of_era,\n        t.drug_concept_id,\n        c.concept_name AS drug_concept_name\n\
      \    FROM drug_era t, concept c\n    WHERE t.drug_concept_id = c.concept_id\n\
      )\nSELECT\n    tt.drug_concept_name,\n    tt.drug_concept_id,\n    tt.year_of_era,\n\
      \    count(1) AS drug_count\nFROM tt\nGROUP BY tt.drug_concept_name, tt.year_of_era,\
      \ tt.drug_concept_id\nORDER BY drug_count DESC\n\"\"\"\n\n# Example 3: age-at-first-exposure\
      \ distribution for Hydrocodone vs Oxycodone.\nAGE_DISTRIBUTION = \"\"\"\nSELECT\n\
      \    extract(year FROM (min(t.drug_era_start_date) OVER (PARTITION BY t.person_id,\
      \ t.drug_concept_id))) - p.year_of_birth AS age,\n    c.concept_name AS d_concept_name\n\
      FROM drug_era t, person p, concept c\nWHERE t.person_id = p.person_id\n  AND\
      \ t.drug_concept_id = c.concept_id\n  AND t.drug_concept_id IN (1124957, 1174888)\n\
      \"\"\"\n\n# Example 4.1: pairwise co-prescription cosine similarity.\nCOPRESCRIBED_VIEW\
      \ = \"\"\"\nCREATE OR REPLACE TEMPORARY VIEW COPRESCRIBED AS\nWITH drugs_and_names\
      \ AS (\n    SELECT PERSON_ID, c.concept_name AS drug_concept_name,\n       \
      \    DRUG_CONCEPT_ID, DRUG_ERA_START_DATE, DRUG_ERA_END_DATE\n    FROM drug_era\
      \ JOIN concept c\n    WHERE DRUG_CONCEPT_ID = c.concept_id\n),\ndrugs AS (\n\
      \    SELECT d1.PERSON_ID,\n           d1.DRUG_CONCEPT_ID AS drug_id1,\n    \
      \       d2.DRUG_CONCEPT_ID AS drug_id2,\n           d1.drug_concept_name AS\
      \ drug1,\n           d2.drug_concept_name AS drug2,\n           d1.DRUG_ERA_START_DATE\
      \ AS d1_start,\n           d1.DRUG_ERA_END_DATE   AS d1_end,\n           d2.DRUG_ERA_START_DATE\
      \ AS d2_start,\n           d2.DRUG_ERA_END_DATE   AS d2_end\n    FROM drugs_and_names\
      \ d1 JOIN drugs_and_names d2\n    WHERE d1.PERSON_ID = d2.PERSON_ID\n      AND\
      \ ABS(datediff(d1.DRUG_ERA_START_DATE, d2.DRUG_ERA_START_DATE)) <= 5\n     \
      \ AND ABS(datediff(d1.DRUG_ERA_END_DATE,   d2.DRUG_ERA_END_DATE))   <= 5\n),\n\
      counts AS (\n    SELECT drug1, drug2, count(*) AS count_d1d2\n    FROM drugs\
      \ GROUP BY 1, 2\n),\npairwise_sums AS (\n    SELECT drug1, drug2, count_d1d2,\n\
      \        sum(count_d1d2) OVER (PARTITION BY drug1) AS sum_d1,\n        sum(count_d1d2)\
      \ OVER (PARTITION BY drug2) AS sum_d2,\n        sum(count_d1d2) OVER ()    \
      \                AS sum_all\n    FROM counts\n)\nSELECT drug1, drug2, count_d1d2,\n\
      \       count_d1d2 / sum_d1 AS supp_d1d2,\n       count_d1d2 / sum_d2 AS supp_d2d1,\n\
      \       sum_d1 / sum_all     AS supp_d1,\n       sum_d2 / sum_all     AS supp_d2\n\
      FROM pairwise_sums\n\"\"\"\n\nCOPRESCRIBED_COSINE = \"\"\"\nSELECT drug1, drug2,\
      \ supp_d1d2,\n       log(supp_d1d2 / sqrt(supp_d1 * supp_d2)) AS lod_cosine_d1d2,\n\
      \       log(supp_d1d2) - log(supp_d1)             AS lod_d1d2\nFROM COPRESCRIBED\n\
      ORDER BY lod_cosine_d1d2 DESC\n\"\"\"\n\n\ndef _rows_as_dicts(spark_df: Any,\
      \ limit: int) -> list[dict[str, Any]]:\n    rows = spark_df.limit(limit).collect()\n\
      \    out: list[dict[str, Any]] = []\n    for row in rows:\n        d = row.asDict(recursive=True)\n\
      \        for key, val in list(d.items()):\n            if val is None or isinstance(val,\
      \ (bool, int, float, str)):\n                continue\n            try:\n  \
      \              d[key] = float(val)\n            except Exception:\n        \
      \        d[key] = str(val)\n        out.append(d)\n    return out\n\n\ndef run_drug_analysis(spark:\
      \ Any) -> dict[str, Any]:\n    \"\"\"Run the four analytical queries against\
      \ the already-populated OMOP CDM.\n\n    Returns a JSON-serializable dict with\
      \ row counts and top-N samples per\n    query \u2014 enough for the benchmark\
      \ to compare clean and corrupted runs.\n    \"\"\"\n    oxycodone = spark.sql(OXYCODONE_USAGE)\n\
      \    top_drugs = spark.sql(TOP_DRUGS_BY_YEAR)\n    age_dist = spark.sql(AGE_DISTRIBUTION)\n\
      \    spark.sql(COPRESCRIBED_VIEW)\n    cosine = spark.sql(COPRESCRIBED_COSINE)\n\
      \n    return {\n        \"oxycodone_usage_by_age_year_gender\": {\n        \
      \    \"total_rows\": oxycodone.count(),\n            \"sample_rows\": _rows_as_dicts(oxycodone,\
      \ 10),\n        },\n        \"top_drugs_by_year\": {\n            \"total_rows\"\
      : top_drugs.count(),\n            \"top_10_rows\": _rows_as_dicts(top_drugs,\
      \ 10),\n        },\n        \"age_distribution_hydrocodone_vs_oxycodone\": {\n\
      \            \"total_rows\": age_dist.count(),\n            \"sample_rows\"\
      : _rows_as_dicts(age_dist, 10),\n        },\n        \"coprescribed_cosine\"\
      : {\n            \"total_rows\": cosine.count(),\n            \"top_10_pairs\"\
      : _rows_as_dicts(cosine, 10),\n        },\n    }\n"
