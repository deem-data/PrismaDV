    \ ,\n  0 as provider_id,\n  fv.visit_occurrence_id_new AS visit_occurrence_id,\n\
    \  0 as visit_detail_id,\n  o.code AS measurement_source_value,\n  coalesce(srctosrcvm.source_concept_id,0)\
    \ AS measurement_source_concept_id,\n  o.units AS unit_source_value,\n  o.value\
    \ AS value_source_value\nfrom observations o\ninner join source_to_standard_vocab_map\
    \  srctostdvm\n  on srctostdvm.source_code             = o.code\n and srctostdvm.target_domain_id\
    \        = 'Measurement'\n and srctostdvm.source_vocabulary_id    = 'LOINC'\n\
    \ and srctostdvm.target_standard_concept = 'S'\n and (srctostdvm.target_invalid_reason\
    \ IS NULL OR srctostdvm.target_invalid_reason = '')\nleft join source_to_standard_vocab_map\
    \  srcmap1\n  on srcmap1.source_code                = o.units\n and srcmap1.target_vocabulary_id\
    \       = 'UCUM'\n and srcmap1.target_standard_concept    = 'S'\n and (srcmap1.target_invalid_reason\
    \ IS NULL OR srcmap1.target_invalid_reason = '')\nleft join source_to_standard_vocab_map\
    \  srcmap2\n  on srcmap2.source_code                = o.value\n and srcmap2.target_domain_id\
    \           = 'Meas value'\n and srcmap2.target_standard_concept    = 'S'\n and\
    \ (srcmap2.target_invalid_reason IS NULL OR srcmap2.target_invalid_reason = '')\n\
    left join source_to_source_vocab_map srctosrcvm\n  on srctosrcvm.source_code \
    \            = o.code\n and srctosrcvm.source_vocabulary_id    = 'LOINC'\nleft\
    \ join final_visit_ids fv\n  on fv.encounter_id                    = o.encounter\n\
    inner join person p\n  on p.person_source_value              = o.patient\n  )\
    \ tmp;\n\nSELECT\n  *\nFROM\n  measurement\nLIMIT\n  100;\n\nINSERT OVERWRITE\
    \ procedure_occurrence\nSELECT\n  row_number()over(order by p.person_id),\n  p.person_id,\n\
    \  coalesce(srctostdvm.target_concept_id, 0) as target_concept_id,\n  pr.start,\n\
    \  pr.start,\n  38000275,\n  0,\n  null,\n  0,\n  fv.visit_occurrence_id_new AS\
    \ visit_occurrence_id,\n  0,\n  pr.code,\n  coalesce(srctosrcvm.source_concept_id,0),\n\
    \  NULL\nfrom procedures pr\ninner join source_to_standard_vocab_map  srctostdvm\n\
    \  on srctostdvm.source_code             = pr.code\n and srctostdvm.target_domain_id\
    \        = 'Procedure'\n and srctostdvm.source_vocabulary_id    = 'SNOMED'\n and\
    \ srctostdvm.target_standard_concept = 'S'\n and (srctostdvm.target_invalid_reason\
    \ IS NULL OR srctostdvm.target_invalid_reason = '')\nleft join source_to_source_vocab_map\
    \ srctosrcvm\n  on srctosrcvm.source_code             = pr.code\n and srctosrcvm.source_vocabulary_id\
    \    = 'SNOMED'\nleft join final_visit_ids fv\n  on fv.encounter_id = pr.encounter\n\
    inner join person p\n  on p.person_source_value    = pr.patient;\n\nSELECT\n \
    \ *\nFROM\n  procedure_occurrence\nLIMIT\n  100;\n\nINSERT OVERWRITE drug_exposure\n\
    SELECT row_number()over(order by person_id) AS drug_exposure_id,\nperson_id,\n\
    drug_concept_id,\ndrug_exposure_start_date,\ndrug_exposure_start_datetime,\ndrug_exposure_end_date,\n\
    drug_exposure_end_datetime,\nverbatim_end_date,\ndrug_type_concept_id,\nstop_reason,\n\
    refills,\nquantity,\ndays_supply,\nsig,\nroute_concept_id,\nlot_number,\nprovider_id,\n\
    visit_occurrence_id,\nvisit_detail_id,\ndrug_source_value,\ndrug_source_concept_id,\n\
    route_source_value,\ndose_unit_source_value\n  from (\nselect\n  p.person_id,\n\
    \  coalesce(srctostdvm.target_concept_id,0) as drug_concept_id,\n  c.start AS\
    \ drug_exposure_start_date,\n  c.start AS drug_exposure_start_datetime,\n  coalesce(c.stop,c.start)\
    \ AS drug_exposure_end_date,\n  coalesce(c.stop,c.start) AS drug_exposure_end_datetime,\n\
    \  c.stop AS verbatim_end_date,\n  581452 as drug_type_concept_id,\n  null as\
    \  stop_reason,\n  0 as refills,\n  0 as quantity,\n  coalesce(datediff(c.stop,c.start),0)\
    \ as days_supply,\n  null as  sig,\n  0 as route_concept_id,\n  0 as lot_number,\n\
    \  0 as provider_id,\n  fv.visit_occurrence_id_new AS visit_occurrence_id,\n \
    \ 0 as visit_detail_id,\n  c.code AS drug_source_value,\n  coalesce(srctosrcvm.source_concept_id,0)\
    \ AS drug_source_concept_id,\n  null as  route_source_value,\n  null as  dose_unit_source_value\n\
    from conditions c\n join source_to_standard_vocab_map   srctostdvm\non srctostdvm.source_code\
    \             = c.code\n and srctostdvm.target_domain_id        = 'Drug'\n and\
    \ srctostdvm.source_vocabulary_id    = 'RxNorm'\n and srctostdvm.target_standard_concept\
    \ = 'S'\n and (srctostdvm.target_invalid_reason IS NULL OR srctostdvm.target_invalid_reason\
    \ = '')\nleft join source_to_source_vocab_map srctosrcvm\n  on srctosrcvm.source_code\
    \             = c.code\n and srctosrcvm.source_vocabulary_id    = 'RxNorm'\nleft\
    \ join final_visit_ids fv\n  on fv.encounter_id = c.encounter\njoin person p\n\
    \  on p.person_source_value              = c.patient\nunion all\nselect\n  p.person_id,\n\
    \  coalesce(srctostdvm.target_concept_id,0) as drug_concept_id,\n  m.start,\n\
    \  m.start,\n  coalesce(m.stop,m.start),\n  coalesce(m.stop,m.start),\n  m.stop,\n\
    \  38000177,\n  null,\n  0,\n  0,\n  coalesce(datediff(m.stop,m.start),0),\n \
    \ null,\n  0,\n  0,\n  0,\n  fv.visit_occurrence_id_new AS visit_occurrence_id,\n\
    \  0,\n  m.code,\n  coalesce(srctosrcvm.source_concept_id,0),\n  null,\n  null\
    \ \nfrom medications m\n  join source_to_standard_vocab_map   srctostdvm\non srctostdvm.source_code\
    \             = m.code\n and srctostdvm.target_domain_id        = 'Drug'\n and\
    \ srctostdvm.source_vocabulary_id    = 'RxNorm'\n and srctostdvm.target_standard_concept\
    \ = 'S'\n and (srctostdvm.target_invalid_reason IS  NULL OR srctostdvm.target_invalid_reason\
    \ = '')\nleft join source_to_source_vocab_map srctosrcvm\n  on srctosrcvm.source_code\
    \             = m.code\n and srctosrcvm.source_vocabulary_id    = 'RxNorm'\nleft\
    \ join final_visit_ids fv\n  on fv.encounter_id = m.encounter\njoin person p\n\
    \  on p.person_source_value              = m.patient\nunion all\nselect\n  p.person_id,\n\
    \  coalesce(srctostdvm.target_concept_id,0) as drug_concept_id,\n  i.date,\n \
    \ i.date,\n  i.date,\n  i.date,\n  i.date,\n  581452,\n  null,\n  0,\n  0,\n \
    \ 0,\n  null,\n  0,\n  0,\n  0,\n  fv.visit_occurrence_id_new AS visit_occurrence_id,\n\
    \  0,\n  i.code,\n  coalesce(srctosrcvm.source_concept_id,0),\n  null,\n  null\n\
    from immunizations i\n  left join source_to_standard_vocab_map   srctostdvm\n\
    on srctostdvm.source_code             = i.code\n and srctostdvm.target_domain_id\
    \        = 'Drug'\n and srctostdvm.source_vocabulary_id    = 'CVX'\n and srctostdvm.target_standard_concept\
    \ = 'S'\n and (srctostdvm.target_invalid_reason IS NULL OR srctostdvm.target_invalid_reason\
    \ = '')\nleft join source_to_source_vocab_map srctosrcvm\n  on srctosrcvm.source_code\
    \             = i.code\n and srctosrcvm.source_vocabulary_id    = 'CVX'\nleft\
    \ join final_visit_ids fv\n  on fv.encounter_id = i.encounter\njoin person p\n\
    \  on p.person_source_value = i.patient\n  ) tmp;\n\nSELECT\n  *\nFROM\n  drug_exposure\n\
    LIMIT\n  100;\n\nINSERT OVERWRITE condition_era (\nWITH cteConditionTarget (condition_occurrence_id,\
    \ person_id, condition_concept_id, condition_start_datetime, condition_end_datetime)\
    \ AS\n(\n\tSELECT\n\t\tco.condition_occurrence_id\n\t\t, co.person_id\n\t\t, co.condition_concept_id\n\
    \t\t, co.condition_start_datetime\n\t\t, COALESCE(co.condition_end_datetime, date_add(condition_start_datetime,1))\
    \ AS condition_end_datetime\n\tFROM condition_occurrence co\n\t/* Depending on\
    \ the needs of your data, you can put more filters on to your code. We assign\
    \ 0 to our unmapped condition_concept_id's,\n\t * and since we don't want different\
    \ conditions put in the same era, we put in the filter below.\n \t */\n\t---WHERE\
    \ condition_concept_id != 0\n),\n--------------------------------------------------------------------------------------------------------------\n\
    cteEndDates (person_id, condition_concept_id, end_date) AS -- the magic\n(\n\t\
    SELECT\n\t\tperson_id\n\t\t, condition_concept_id\n\t\t, date_add(event_date,-30)\
    \ AS end_date -- unpad the end date\n\tFROM\n\t(\n\t\tSELECT\n\t\t\tperson_id\n\
    \t\t\t, condition_concept_id\n\t\t\t, event_date\n\t\t\t, event_type\n\t\t\t,\
    \ MAX(start_ordinal) OVER (PARTITION BY person_id, condition_concept_id ORDER\
    \ BY event_date, event_type ROWS UNBOUNDED PRECEDING) AS start_ordinal -- this\
    \ pulls the current START down from the prior rows so that the NULLs from the\
    \ END DATES will contain a value we can compare with\n\t\t\t, ROW_NUMBER() OVER\
    \ (PARTITION BY person_id, condition_concept_id ORDER BY event_date, event_type)\
    \ AS overall_ord -- this re-numbers the inner UNION so all rows are numbered ordered\
    \ by the event date\n\t\tFROM\n\t\t(\n\t\t\t-- select the start dates, assigning\
    \ a row number to each\n\t\t\tSELECT\n\t\t\t\tperson_id\n\t\t\t\t, condition_concept_id\n\
    \t\t\t\t, condition_start_datetime AS event_date\n\t\t\t\t, -1 AS event_type\n\
    \t\t\t\t, ROW_NUMBER() OVER (PARTITION BY person_id, condition_concept_id ORDER\
    \ BY condition_start_datetime) AS start_ordinal\n\t\t\tFROM cteConditionTarget\n\
    \t\t\tUNION ALL\n\t\t\t-- pad the end dates by 30 to allow a grace period for\
    \ overlapping ranges.\n\t\t\tSELECT\n\t\t\t\tperson_id\n\t\t\t    , condition_concept_id\n\
    \t\t\t\t, date_add(condition_end_datetime,30)\n\t\t\t\t, 1 AS event_type\n\t\t\
    \t\t, NULL\n\t\t\tFROM cteConditionTarget\n\t\t) RAWDATA\n\t) e\n\tWHERE (2 *\
    \ e.start_ordinal) - e.overall_ord = 0\n),\n--------------------------------------------------------------------------------------------------------------\n\
    cteConditionEnds (person_id, condition_concept_id, condition_start_datetime, era_end_datetime)\
    \ AS\n(\nSELECT\n        c.person_id\n\t, c.condition_concept_id\n\t, c.condition_start_datetime\n\
    \t, MIN(e.end_date) AS era_end_datetime\nFROM cteConditionTarget c\nINNER JOIN\
    \ cteEndDates e ON c.person_id = e.person_id AND c.condition_concept_id = e.condition_concept_id\
    \ AND e.end_date >= c.condition_start_datetime\nGROUP BY\n        c.condition_occurrence_id\n\
    \t, c.person_id\n\t, c.condition_concept_id\n\t, c.condition_start_datetime\n\
    )\n--------------------------------------------------------------------------------------------------------------\n\
    SELECT\n    row_number()over(order by person_id) AS condition_era_id\n\t, person_id\n\
    \t, condition_concept_id\n\t, MIN(condition_start_datetime) AS condition_era_start_datetime\n\
    \t, era_end_datetime AS condition_era_end_datetime\n\t, COUNT(*) AS condition_occurrence_count\n\
    FROM cteConditionEnds\nGROUP BY person_id, condition_concept_id, era_end_datetime)\n\
    ;\n\nSELECT\n  *\nFROM\n  condition_era\nLIMIT\n  100;\n\nINSERT OVERWRITE drug_era\
    \ (\nWITH\nctePreDrugTarget(drug_exposure_id, person_id, ingredient_concept_id,\
    \ drug_exposure_start_datetime, days_supply, drug_exposure_end_datetime) AS\n\
    (-- Normalize DRUG_EXPOSURE_END_DATE to either the existing drug exposure end\
    \ date, or add days supply, or add 1 day to the start date\n\tSELECT\n\t\td.drug_exposure_id\n\
    \t\t, d.person_id\n\t\t, c.concept_id AS ingredient_concept_id\n\t\t, d.drug_exposure_start_datetime\
    \ AS drug_exposure_start_datetime\n\t\t, d.days_supply AS days_supply\n\t\t, COALESCE(\n\
    \t\t\t---NULLIF returns NULL if both values are the same, otherwise it returns\
    \ the first parameter\n\t\t\tifnull(drug_exposure_end_datetime, NULL),\n\t\t\t\
    ---If drug_exposure_end_date != NULL, return drug_exposure_end_date, otherwise\
    \ go to next case\n\t\t\tifnull(date_add(drug_exposure_start_datetime,cast(days_supply\
    \ as int)), drug_exposure_start_datetime),\n\t\t\t---If days_supply != NULL or\
    \ 0, return drug_exposure_start_date + days_supply, otherwise go to next case\n\
    \t\t\tdate_add(drug_exposure_start_datetime,1)\n\t\t\t---Add 1 day to the drug_exposure_start_date\
    \ since there is no end_date or INTERVAL for the days_supply\n\t\t) AS drug_exposure_end_datetime\n\
    \tFROM drug_exposure d\n\t\tINNER JOIN concept_ancestor ca ON ca.descendant_concept_id\
    \ = d.drug_concept_id\n\t\tINNER JOIN concept c ON ca.ancestor_concept_id = c.concept_id\n\
    \t\tWHERE c.vocabulary_id = 'RxNorm' ---8 selects RxNorm from the vocabulary_id\n\
    \t\tAND c.concept_class_id = 'Ingredient'\n\t\tAND d.drug_concept_id != 0 ---Our\
    \ unmapped drug_concept_id's are set to 0, so we don't want different drugs wrapped\
    \ up in the same era\n\t\tAND coalesce(d.days_supply,0) >= 0 ---We have cases\
    \ where days_supply is negative, and this can set the end_date before the start_date,\
    \ which we don't want. So we're just looking over those rows. This is a data-quality\
    \ issue.\n)\n\n, cteSubExposureEndDates (person_id, ingredient_concept_id, end_datetime)\
    \ AS --- A preliminary sorting that groups all of the overlapping exposures into\
    \ one exposure so that we don't double-count non-gap-days\n(\n\tSELECT person_id,\
    \ ingredient_concept_id, event_date AS end_datetime\n\tFROM\n\t(\n\t\tSELECT person_id,\
    \ ingredient_concept_id, event_date, event_type,\n\t\tMAX(start_ordinal) OVER\
    \ (PARTITION BY person_id, ingredient_concept_id ORDER BY event_date, event_type\
    \ ROWS unbounded preceding) AS start_ordinal,\n\t\t-- this pulls the current START\
    \ down from the prior rows so that the NULLs\n\t\t-- from the END DATES will contain\
    \ a value we can compare with\n\t\tROW_NUMBER() OVER (PARTITION BY person_id,\
    \ ingredient_concept_id ORDER BY event_date, event_type) AS overall_ord\n\t\t\t\
    -- this re-numbers the inner UNION so all rows are numbered ordered by the event\
    \ date\n\t\tFROM (\n\t\t\t-- select the start dates, assigning a row number to\
    \ each\n\t\t\tSELECT person_id, ingredient_concept_id, drug_exposure_start_datetime\
    \ AS event_date,\n\t\t\t-1 AS event_type,\n\t\t\tROW_NUMBER() OVER (PARTITION\
    \ BY person_id, ingredient_concept_id ORDER BY drug_exposure_start_datetime) AS\
    \ start_ordinal\n\t\t\tFROM ctePreDrugTarget\n\t\t\tUNION ALL\n\t\t\tSELECT person_id,\
    \ ingredient_concept_id, drug_exposure_end_datetime, 1 AS event_type, NULL\n\t\
    \t\tFROM ctePreDrugTarget\n\t\t) RAWDATA\n\t) e\n\tWHERE (2 * e.start_ordinal)\
    \ - e.overall_ord = 0\n)\n\n, cteDrugExposureEnds (person_id, drug_concept_id,\
    \ drug_exposure_start_datetime, drug_sub_exposure_end_datetime) AS\n(\nSELECT\n\
    \tdt.person_id\n\t, dt.ingredient_concept_id\n\t, dt.drug_exposure_start_datetime\n\
    \t, MIN(e.end_datetime) AS drug_sub_exposure_end_datetime\nFROM ctePreDrugTarget\
    \ dt\nINNER JOIN cteSubExposureEndDates e ON dt.person_id = e.person_id AND dt.ingredient_concept_id\
    \ = e.ingredient_concept_id AND e.end_datetime >= dt.drug_exposure_start_datetime\n\
    GROUP BY\n      \tdt.drug_exposure_id\n      \t, dt.person_id\n\t, dt.ingredient_concept_id\n\
    \t, dt.drug_exposure_start_datetime\n)\n--------------------------------------------------------------------------------------------------------------\n\
    , cteSubExposures(row_number, person_id, drug_concept_id, drug_sub_exposure_start_datetime,\
    \ drug_sub_exposure_end_datetime, drug_exposure_count) AS\n(\n\tSELECT ROW_NUMBER()\
    \ OVER (PARTITION BY person_id, drug_concept_id, drug_sub_exposure_end_datetime\
    \ ORDER BY person_id)\n\t\t, person_id, drug_concept_id, MIN(drug_exposure_start_datetime)\
    \ AS drug_sub_exposure_start_datetime, drug_sub_exposure_end_datetime, COUNT(*)\
    \ AS drug_exposure_count\n\tFROM cteDrugExposureEnds\n\tGROUP BY person_id, drug_concept_id,\
    \ drug_sub_exposure_end_datetime\n\t--ORDER BY person_id, drug_concept_id\n)\n\
    --------------------------------------------------------------------------------------------------------------\n\
    /*Everything above grouped exposures into sub_exposures if there was overlap between\
    \ exposures.\n *So there was no persistence window. Now we can add the persistence\
    \ window to calculate eras.\n */\n--------------------------------------------------------------------------------------------------------------\n\
    , cteFinalTarget(row_number, person_id, ingredient_concept_id, drug_sub_exposure_start_datetime,\
    \ drug_sub_exposure_end_datetime, drug_exposure_count, days_exposed) AS\n(\n\t\
    SELECT row_number, person_id, drug_concept_id, drug_sub_exposure_start_datetime,\
    \ drug_sub_exposure_end_datetime, drug_exposure_count\n\t\t, datediff(drug_sub_exposure_end_datetime,drug_sub_exposure_start_datetime)\
    \ AS days_exposed\n\tFROM cteSubExposures\n)\n--------------------------------------------------------------------------------------------------------------\n\
    , cteEndDates (person_id, ingredient_concept_id, end_datetime) AS -- the magic\n\
    (\n\tSELECT person_id, ingredient_concept_id, date_add(event_date,-30) AS end_datetime\
    \ -- unpad the end date\n\tFROM\n\t(\n\t\tSELECT person_id, ingredient_concept_id,\
    \ event_date, event_type,\n\t\tMAX(start_ordinal) OVER (PARTITION BY person_id,\
    \ ingredient_concept_id ORDER BY event_date, event_type ROWS UNBOUNDED PRECEDING)\
    \ AS start_ordinal,\n\t\t-- this pulls the current START down from the prior rows\
    \ so that the NULLs\n\t\t-- from the END DATES will contain a value we can compare\
    \ with\n\t\tROW_NUMBER() OVER (PARTITION BY person_id, ingredient_concept_id ORDER\
    \ BY event_date, event_type) AS overall_ord\n\t\t\t-- this re-numbers the inner\
    \ UNION so all rows are numbered ordered by the event date\n\t\tFROM (\n\t\t\t\
    -- select the start dates, assigning a row number to each\n\t\t\tSELECT person_id,\
    \ ingredient_concept_id, drug_sub_exposure_start_datetime AS event_date,\n\t\t\
    \t-1 AS event_type,\n\t\t\tROW_NUMBER() OVER (PARTITION BY person_id, ingredient_concept_id\
    \ ORDER BY drug_sub_exposure_start_datetime) AS start_ordinal\n\t\t\tFROM cteFinalTarget\n\
    \t\t\tUNION ALL\n\t\t\t-- pad the end dates by 30 to allow a grace period for\
    \ overlapping ranges.\n\t\t\tSELECT person_id, ingredient_concept_id, date_add(drug_sub_exposure_end_datetime,30),\
    \ 1 AS event_type, NULL\n\t\t\tFROM cteFinalTarget\n\t\t) RAWDATA\n\t) e\n\tWHERE\
    \ (2 * e.start_ordinal) - e.overall_ord = 0\n\n)\n, cteDrugEraEnds (person_id,\
    \ drug_concept_id, drug_sub_exposure_start_datetime, drug_era_end_datetime, drug_exposure_count,\
    \ days_exposed) AS\n(\nSELECT\n\tft.person_id\n\t, ft.ingredient_concept_id\n\t\
    , ft.drug_sub_exposure_start_datetime\n\t, MIN(e.end_datetime) AS era_end_datetime\n\
    \t, drug_exposure_count\n\t, days_exposed\nFROM cteFinalTarget ft\nJOIN cteEndDates\
    \ e ON ft.person_id = e.person_id AND ft.ingredient_concept_id = e.ingredient_concept_id\
    \ AND e.end_datetime >= ft.drug_sub_exposure_start_datetime\nGROUP BY\n      \t\
    ft.person_id\n\t, ft.ingredient_concept_id\n\t, ft.drug_sub_exposure_start_datetime\n\
    \t, drug_exposure_count\n\t, days_exposed\n)\nSELECT\n    row_number()over(order\
    \ by person_id) drug_era_id\n\t, person_id\n\t, drug_concept_id\n\t, MIN(drug_sub_exposure_start_datetime)\
    \ AS drug_era_start_datetime\n\t, drug_era_end_datetime\n\t, SUM(drug_exposure_count)\
    \ AS drug_exposure_count\n\t, datediff(date_add(drug_era_end_datetime,cast(-(datediff(drug_era_end_datetime,MIN(drug_sub_exposure_start_datetime))-SUM(days_exposed))\
    \ as int)),'1970-01-01') as gap_days\nFROM cteDrugEraEnds dee\nGROUP BY person_id,\
    \ drug_concept_id, drug_era_end_datetime\n);\n\nSELECT * FROM drug_era LIMIT 100;\n\
    \nINSERT OVERWRITE cdm_source \nSELECT\n'Synthea synthetic health database',\n\
    'Synthea',\n'Databricks HLS',\n'SyntheaTM is a Synthetic Patient Population Simulator.\
    \ The goal is to output synthetic, realistic (but not real), patient data and\
    \ associated health records in a variety of formats.',\n'https://synthetichealth.github.io/synthea/',\n\
    'https://github.com/databricks/hls-solution-accelerators/',\ncurrent_date(), --\
    \ NB: Set this value to the day the source data was pulled\ncurrent_date(), \n\
    'v5.3.1',\nvocabulary_version\nfrom vocabulary \nwhere vocabulary_id = 'None';\n\
    \nSELECT * FROM cdm_source LIMIT 100;\n\n# File: source_repo/5-CHF-cohort-building.r\n\
    # CHF cohort identification, ported from the upstream\n# `adapter/source_repo/r_scripts/5-CHF-cohort-building.r`.\n\
    #\n# The upstream targets Databricks SparkR. This port runs against a SQLite\n\
    # database that the Python adapter writes after the OMOP CDM ETL. Spark SQL\n\
    # CTEs translate to SQLite with three small syntax tweaks:\n#   - `date_add(d,\
    \ n)`  \u2192 `date(d, '+n days')`\n#   - `DATEDIFF(a, b)`  \u2192 `CAST(julianday(a)\
    \ - julianday(b) AS INTEGER)`\n#   - `YEAR(d)`         \u2192 `CAST(strftime('%Y',\
    \ d) AS INTEGER)`\n#\n# Arguments (positional): <sqlite-db-path> <output-json-path>\n\
    \nsuppressPackageStartupMessages({\n  library(DBI)\n  library(RSQLite)\n  library(glue)\n\
    \  library(jsonlite)\n})\n\nargs <- commandArgs(trailingOnly = TRUE)\nif (length(args)\
    \ != 2) {\n  stop(\"usage: Rscript chf_cohort.R <sqlite-db> <output-json>\")\n\
    }\nsqlite_db    <- args[[1]]\noutput_json  <- args[[2]]\n\ncon <- dbConnect(RSQLite::SQLite(),\
    \ sqlite_db)\non.exit(dbDisconnect(con), add = TRUE)\n\ntarget_condition_concept_id\
    \ <- 4229440  # Chronic congestive heart failure (disorder)\ntarget_drug_concept_id\
    \      <- 1719286  # 10 ML Furosemide 10 MG/ML Injection\n\n# 1. Target cohort:\
    \ newly-diagnosed CHF patients with 3+ years of prior\n#    observation and no\
    \ prior Furosemide exposure.\ntarget_cohort_query <- glue(\"\nWITH targetConditionSet\
    \ AS (\n    SELECT person_id, MIN(condition_start_date) AS condition_start_date\n\
    \    FROM condition_occurrence\n    WHERE condition_concept_id IN (\n        SELECT\
    \ descendant_concept_id FROM concept_ancestor\n        WHERE ancestor_concept_id\
    \ IN ({target_condition_concept_id})\n    )\n    GROUP BY person_id\n),\ntargetDrugExposure\
    \ AS (\n    SELECT person_id, MIN(drug_exposure_start_date) AS drug_exposure_start_date\n\
    \    FROM drug_exposure\n    WHERE drug_concept_id IN (\n        SELECT descendant_concept_id\
    \ FROM concept_ancestor\n        WHERE ancestor_concept_id IN ({target_drug_concept_id})\n\
    \    )\n    GROUP BY person_id\n)\nSELECT 1 AS cohort_definition_id,\n       t.person_id\
    \ AS subject_id,\n       t.condition_start_date AS cohort_start_date,\n      \
    \ op.observation_period_end_date AS cohort_end_date\nFROM targetConditionSet t\n\
    INNER JOIN observation_period op\n  ON t.person_id = op.person_id\n  AND t.condition_start_date\
    \ >= date(op.observation_period_start_date, '+1095 days')\n  AND t.condition_start_date\
    \ <= op.observation_period_end_date\nLEFT JOIN targetDrugExposure dx\n  ON t.person_id\
    \ = dx.person_id\n  AND t.condition_start_date > dx.drug_exposure_start_date\n\
    WHERE dx.person_id IS NULL\n\")\ndbExecute(con, \"DROP TABLE IF EXISTS targetCohort\"\
    )\ndbExecute(con, paste0(\"CREATE TABLE targetCohort AS \", target_cohort_query))\n\
    target_rows <- dbGetQuery(con, \"SELECT COUNT(*) AS n FROM targetCohort\")$n\n\
    \n# 2. Outcome cohort: ER visits.\noutcome_concept_id <- 9203  # Emergency Room\
    \ Visit\noutcome_cohort_query <- glue(\"\nSELECT 2 AS cohort_definition_id,\n\
    \       v.person_id AS subject_id,\n       v.visit_start_date AS cohort_start_date,\n\
    \       v.visit_end_date AS cohort_end_date\nFROM visit_occurrence v\nWHERE v.visit_concept_id\
    \ IN ({outcome_concept_id})\nGROUP BY v.person_id, v.visit_start_date, v.visit_end_date\n\
    \")\ndbExecute(con, \"DROP TABLE IF EXISTS outcomeCohort\")\ndbExecute(con, paste0(\"\
    CREATE TABLE outcomeCohort AS \", outcome_cohort_query))\noutcome_rows <- dbGetQuery(con,\
    \ \"SELECT COUNT(*) AS n FROM outcomeCohort\")$n\n\n# 3. Union into a single cohort\
    \ table.\ndbExecute(con, \"DROP TABLE IF EXISTS CHF_cohort\")\ndbExecute(con,\
    \ \"\nCREATE TABLE CHF_cohort AS\nSELECT * FROM targetCohort\nUNION ALL\nSELECT\
    \ * FROM outcomeCohort\n\")\nunion_rows <- dbGetQuery(con, \"SELECT COUNT(*) AS\
    \ n FROM CHF_cohort\")$n\n\n# 4. Incidence rate stratified by age band and gender.\n\
    incident_rate_query <- \"\nWITH tar AS (\n    SELECT c.concept_name AS gender,\n\
    \           (CAST(strftime('%Y', chf.cohort_start_date) AS INTEGER) - p.year_of_birth)\
    \ / 10 * 10 AS age,\n           chf.subject_id,\n           chf.cohort_start_date,\n\
    \           CASE\n             WHEN date(chf.cohort_start_date, '+7 days') > op.observation_period_end_date\n\
    \               THEN op.observation_period_end_date\n             ELSE date(chf.cohort_start_date,\
    \ '+7 days')\n           END AS cohort_end_date\n    FROM CHF_cohort chf\n   \
    \ INNER JOIN observation_period op\n      ON chf.subject_id = op.person_id\n \
    \     AND op.observation_period_start_date < chf.cohort_start_date\n      AND\
    \ op.observation_period_end_date > chf.cohort_start_date\n    INNER JOIN person\
    \ p ON chf.subject_id = p.person_id\n    INNER JOIN concept c ON p.gender_concept_id\
    \ = c.concept_id\n    WHERE chf.cohort_definition_id = 1\n)\nSELECT days.gender,\n\
    \       days.age,\n       days.days,\n       CASE WHEN events.events IS NULL THEN\
    \ 0 ELSE events.events END AS events,\n       CASE WHEN days.days = 0 THEN NULL\n\
    \            ELSE 1000.0 * (CASE WHEN events.events IS NULL THEN 0 ELSE events.events\
    \ END) / days.days / 7.0\n       END AS incidence_rate_per_1000_person_weeks\n\
    FROM (\n    SELECT gender, age,\n           SUM(CAST(julianday(cohort_end_date)\
    \ - julianday(cohort_start_date) AS INTEGER)) AS days\n    FROM tar\n    GROUP\
    \ BY gender, age\n) days\nLEFT JOIN (\n    SELECT tar.gender, tar.age, COUNT(*)\
    \ AS events\n    FROM tar\n    INNER JOIN CHF_cohort chf\n      ON tar.subject_id\
    \ = chf.subject_id\n      AND tar.cohort_start_date <= chf.cohort_start_date\n\
    \      AND tar.cohort_end_date   >= chf.cohort_start_date\n    WHERE chf.cohort_definition_id\
    \ = 2\n    GROUP BY tar.gender, tar.age\n) events\nON days.gender = events.gender\
    \ AND days.age = events.age\nORDER BY days.gender, days.age\n\"\nincident_rate\
    \ <- dbGetQuery(con, incident_rate_query)\n\n# 5. Top-line target-cohort summary\
    \ (gender \xD7 age band).\ntarget_cohort_breakdown_query <- \"\nSELECT c.concept_name\
    \ AS gender,\n       (CAST(strftime('%Y', chf.cohort_start_date) AS INTEGER) -\
    \ p.year_of_birth) / 10 * 10 AS age_band,\n       COUNT(*) AS n_patients\nFROM\
    \ CHF_cohort chf\nINNER JOIN person p ON chf.subject_id = p.person_id\nINNER JOIN\
    \ concept c ON p.gender_concept_id = c.concept_id\nWHERE chf.cohort_definition_id\
    \ = 1\nGROUP BY c.concept_name, age_band\nORDER BY c.concept_name, age_band\n\"\
    \ntarget_breakdown <- dbGetQuery(con, target_cohort_breakdown_query)\n\nsummary\
    \ <- list(\n  target_condition_concept_id = target_condition_concept_id,\n  target_drug_concept_id\
    \      = target_drug_concept_id,\n  outcome_concept_id          = outcome_concept_id,\n\
    \  target_cohort_rows          = target_rows,\n  outcome_cohort_rows         =\
    \ outcome_rows,\n  chf_cohort_union_rows       = union_rows,\n  target_cohort_by_age_gender\
    \ = target_breakdown,\n  incident_rate               = incident_rate\n)\n\nwriteLines(toJSON(summary,\
    \ dataframe = \"rows\", pretty = TRUE, auto_unbox = TRUE), output_json)\ncat(\"\
    wrote \", output_json, \"\\n\", sep = \"\")\n\n# File: source_repo/6-drug-analysis.py\n\
    # Drug Usage Trends \u2014 local PySpark port of the upstream Databricks notebook.\n\
    #\n# In the upstream notebook this file is a Databricks notebook with mixed\n\
    # `# MAGIC %sql` and `# MAGIC %python` cells. For the local RealETLBench\n# adapter\
    \ we expose a single function `run_drug_analysis(spark)` that runs the\n# same\
    \ four analytical queries against an existing Spark session (the OMOP\n# tables\
    \ must already be populated by the SQL ETL).\n#\n# Three downstream changes vs.\
    \ upstream:\n#   - No `USE omop531;` \u2014 we rely on Spark's default database\
    \ for managed tables.\n#   - No plotly rendering \u2014 we capture row counts\
    \ and the top-N sample rows so\n#     the adapter can serialize an analytical\
    \ summary to JSON.\n#   - The FP-Growth (mllib) frequent-itemset example is not\
    \ ported; the cosine\n#     similarity example covers the same drug-pair signal\
    \ with simpler code.\nfrom __future__ import annotations\nfrom typing import Any\n\
    \n\n# Example 1: usage of Oxycodone (concept_id 1124957) stratified by age, year,\
    \ gender.\nOXYCODONE_USAGE = \"\"\"\nSELECT\n    tt.drug_concept_name,\n    tt.drug_concept_id,\n\
    \    count(1) AS s_count,\n    tt.age_band,\n    tt.year_of_era,\n    tt.gender\n\
    FROM (\n    SELECT\n        floor((extract(year FROM t.drug_era_start_date) -\
    \ p.year_of_birth) / 10) AS age_band,\n        extract(year FROM t.drug_era_start_date)\
    \ AS year_of_era,\n        p.gender_concept_id,\n        t.drug_concept_id,\n\
    \        c.concept_name AS drug_concept_name,\n        c1.concept_name AS gender\n\
    \    FROM drug_era t, person p, concept c, concept c1\n    WHERE t.person_id =\
    \ p.person_id\n      AND c.concept_id = t.drug_concept_id\n      AND c1.concept_id\
    \ = p.gender_concept_id\n      AND c.concept_id = 1124957\n) tt\nWHERE tt.year_of_era\
    \ > 2000\nGROUP BY tt.age_band, tt.year_of_era, tt.gender, tt.drug_concept_name,\
    \ tt.drug_concept_id\nORDER BY tt.age_band, tt.year_of_era, tt.drug_concept_id\n\
    \"\"\"\n\n# Example 2: top drugs prescribed by year.\nTOP_DRUGS_BY_YEAR = \"\"\
    \"\nWITH tt AS (\n    SELECT\n        extract(year FROM t.drug_era_start_date)\
    \ AS year_of_era,\n        t.drug_concept_id,\n        c.concept_name AS drug_concept_name\n\
    \    FROM drug_era t, concept c\n    WHERE t.drug_concept_id = c.concept_id\n\
    )\nSELECT\n    tt.drug_concept_name,\n    tt.drug_concept_id,\n    tt.year_of_era,\n\
    \    count(1) AS drug_count\nFROM tt\nGROUP BY tt.drug_concept_name, tt.year_of_era,\
    \ tt.drug_concept_id\nORDER BY drug_count DESC\n\"\"\"\n\n# Example 3: age-at-first-exposure\
    \ distribution for Hydrocodone vs Oxycodone.\nAGE_DISTRIBUTION = \"\"\"\nSELECT\n\
    \    extract(year FROM (min(t.drug_era_start_date) OVER (PARTITION BY t.person_id,\
    \ t.drug_concept_id))) - p.year_of_birth AS age,\n    c.concept_name AS d_concept_name\n\
    FROM drug_era t, person p, concept c\nWHERE t.person_id = p.person_id\n  AND t.drug_concept_id\
    \ = c.concept_id\n  AND t.drug_concept_id IN (1124957, 1174888)\n\"\"\"\n\n# Example\
    \ 4.1: pairwise co-prescription cosine similarity.\nCOPRESCRIBED_VIEW = \"\"\"\
    \nCREATE OR REPLACE TEMPORARY VIEW COPRESCRIBED AS\nWITH drugs_and_names AS (\n\
    \    SELECT PERSON_ID, c.concept_name AS drug_concept_name,\n           DRUG_CONCEPT_ID,\
    \ DRUG_ERA_START_DATE, DRUG_ERA_END_DATE\n    FROM drug_era JOIN concept c\n \
    \   WHERE DRUG_CONCEPT_ID = c.concept_id\n),\ndrugs AS (\n    SELECT d1.PERSON_ID,\n\
    \           d1.DRUG_CONCEPT_ID AS drug_id1,\n           d2.DRUG_CONCEPT_ID AS\
    \ drug_id2,\n           d1.drug_concept_name AS drug1,\n           d2.drug_concept_name\
    \ AS drug2,\n           d1.DRUG_ERA_START_DATE AS d1_start,\n           d1.DRUG_ERA_END_DATE\
    \   AS d1_end,\n           d2.DRUG_ERA_START_DATE AS d2_start,\n           d2.DRUG_ERA_END_DATE\
    \   AS d2_end\n    FROM drugs_and_names d1 JOIN drugs_and_names d2\n    WHERE\
    \ d1.PERSON_ID = d2.PERSON_ID\n      AND ABS(datediff(d1.DRUG_ERA_START_DATE,\
    \ d2.DRUG_ERA_START_DATE)) <= 5\n      AND ABS(datediff(d1.DRUG_ERA_END_DATE,\
    \   d2.DRUG_ERA_END_DATE))   <= 5\n),\ncounts AS (\n    SELECT drug1, drug2, count(*)\
    \ AS count_d1d2\n    FROM drugs GROUP BY 1, 2\n),\npairwise_sums AS (\n    SELECT\
    \ drug1, drug2, count_d1d2,\n        sum(count_d1d2) OVER (PARTITION BY drug1)\
    \ AS sum_d1,\n        sum(count_d1d2) OVER (PARTITION BY drug2) AS sum_d2,\n \
    \       sum(count_d1d2) OVER ()                    AS sum_all\n    FROM counts\n\
    )\nSELECT drug1, drug2, count_d1d2,\n       count_d1d2 / sum_d1 AS supp_d1d2,\n\
    \       count_d1d2 / sum_d2 AS supp_d2d1,\n       sum_d1 / sum_all     AS supp_d1,\n\
    \       sum_d2 / sum_all     AS supp_d2\nFROM pairwise_sums\n\"\"\"\n\nCOPRESCRIBED_COSINE\
    \ = \"\"\"\nSELECT drug1, drug2, supp_d1d2,\n       log(supp_d1d2 / sqrt(supp_d1\
    \ * supp_d2)) AS lod_cosine_d1d2,\n       log(supp_d1d2) - log(supp_d1)      \
    \       AS lod_d1d2\nFROM COPRESCRIBED\nORDER BY lod_cosine_d1d2 DESC\n\"\"\"\n\
    \n\ndef _rows_as_dicts(spark_df: Any, limit: int) -> list[dict[str, Any]]:\n \
    \   rows = spark_df.limit(limit).collect()\n    out: list[dict[str, Any]] = []\n\
    \    for row in rows:\n        d = row.asDict(recursive=True)\n        for key,\
    \ val in list(d.items()):\n            if val is None or isinstance(val, (bool,\
    \ int, float, str)):\n                continue\n            try:\n           \
    \     d[key] = float(val)\n            except Exception:\n                d[key]\
    \ = str(val)\n        out.append(d)\n    return out\n\n\ndef run_drug_analysis(spark:\
    \ Any) -> dict[str, Any]:\n    \"\"\"Run the four analytical queries against the\
    \ already-populated OMOP CDM.\n\n    Returns a JSON-serializable dict with row\
    \ counts and top-N samples per\n    query \u2014 enough for the benchmark to compare\
    \ clean and corrupted runs.\n    \"\"\"\n    oxycodone = spark.sql(OXYCODONE_USAGE)\n\
    \    top_drugs = spark.sql(TOP_DRUGS_BY_YEAR)\n    age_dist = spark.sql(AGE_DISTRIBUTION)\n\
    \    spark.sql(COPRESCRIBED_VIEW)\n    cosine = spark.sql(COPRESCRIBED_COSINE)\n\
    \n    return {\n        \"oxycodone_usage_by_age_year_gender\": {\n          \
    \  \"total_rows\": oxycodone.count(),\n            \"sample_rows\": _rows_as_dicts(oxycodone,\
    \ 10),\n        },\n        \"top_drugs_by_year\": {\n            \"total_rows\"\
    : top_drugs.count(),\n            \"top_10_rows\": _rows_as_dicts(top_drugs, 10),\n\
    \        },\n        \"age_distribution_hydrocodone_vs_oxycodone\": {\n      \
    \      \"total_rows\": age_dist.count(),\n            \"sample_rows\": _rows_as_dicts(age_dist,\
    \ 10),\n        },\n        \"coprescribed_cosine\": {\n            \"total_rows\"\
    : cosine.count(),\n            \"top_10_pairs\": _rows_as_dicts(cosine, 10),\n\
    \        },\n    }\n\n# File: pyproject.toml\n[project]\nname = \"realetlbench-omop-cdm-databricks\"\
    \nversion = \"0.1.0\"\ndescription = \"RealETLBench environment for the databricks-industry-solutions/omop-cdm\
    \ Synthea\u2192OMOP ETL pipeline\"\nrequires-python = \">=3.11,<3.12\"\ndependencies\
    \ = [\n  \"pandas>=2.1,<3\",\n  \"pyspark==3.5.1\",\n]\n\n[tool.uv]\npackage =\
    \ false\n\n# File: pixi.toml\n[workspace]\nname = \"realetlbench-omop-cdm-databricks-r\"\
    \ndescription = \"Example-local R environment for the CHF cohort downstream script\"\
    \nchannels = [\"conda-forge\"]\nplatforms = [\"osx-arm64\", \"osx-64\", \"linux-64\"\
    ]\n\n[dependencies]\n# Pinned to r-base 4.4 because r-rsqlite-3.52 on osx-arm64\
    \ ships against r44.\n# r-duckdb has no osx-arm64 build in conda-forge, so we\
    \ use SQLite instead;\n# the upstream's Spark-SQL CTEs run on SQLite with minor\
    \ syntax tweaks.\nr-base = \">=4.4,<4.5\"\nr-dplyr = \"*\"\nr-glue = \"*\"\nr-jsonlite\
    \ = \"*\"\nr-dbi = \"*\"\nr-rsqlite = \"*\"\n\n[tasks]\nchf-cohort = { cmd = \"\
    Rscript adapter/source_repo/5-CHF-cohort-building.r\" }\n"
