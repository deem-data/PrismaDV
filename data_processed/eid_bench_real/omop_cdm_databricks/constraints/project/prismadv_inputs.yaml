    \n\n-- [python cell handled by Python adapter] sql(f\"USE {omop_version};\")\n\
    \nCREATE OR REPLACE TEMPORARY VIEW IP_VISITS AS (\nWITH CTE_END_DATES AS (\n \
    \ SELECT\n    patient,\n    encounterclass,\n    DATE_ADD(EVENT_DATE, -1) AS END_DATE\n\
    \  FROM\n    (\n      SELECT\n        patient,\n        encounterclass,\n    \
    \    EVENT_DATE,\n        EVENT_TYPE,\n        MAX(START_ORDINAL) OVER (\n   \
    \       PARTITION BY patient,\n          encounterclass\n          ORDER BY\n\
    \            EVENT_DATE,\n            EVENT_TYPE ROWS UNBOUNDED PRECEDING\n  \
    \      ) AS START_ORDINAL,\n        ROW_NUMBER() OVER (\n          PARTITION BY\
    \ patient,\n          encounterclass\n          ORDER BY\n            EVENT_DATE,\n\
    \            EVENT_TYPE\n        ) AS OVERALL_ORD\n      FROM\n        (\n   \
    \       SELECT\n            patient,\n            encounterclass,\n          \
    \  start AS EVENT_DATE,\n            -1 AS EVENT_TYPE,\n            ROW_NUMBER\
    \ () OVER (\n              PARTITION BY patient,\n              encounterclass\n\
    \              ORDER BY\n                start,\n                stop\n      \
    \      ) AS START_ORDINAL\n          FROM\n            encounters\n          WHERE\n\
    \            encounterclass = 'inpatient'\n          UNION ALL\n          SELECT\n\
    \            patient,\n            encounterclass,\n            DATE_ADD(stop,\
    \ 1),\n            1 AS EVENT_TYPE,\n            NULL\n          FROM\n      \
    \      encounters\n          WHERE\n            encounterclass = 'inpatient'\n\
    \        ) RAWDATA\n    ) E\n  WHERE\n    (2 * E.START_ORDINAL - E.OVERALL_ORD\
    \ = 0)\n),\nCTE_VISIT_ENDS AS (\n  SELECT\n    MIN(V.id) AS encounter_id,\n  \
    \  V.patient,\n    V.encounterclass,\n    V.start AS VISIT_START_DATE,\n    MIN(E.END_DATE)\
    \ AS VISIT_END_DATE\n  FROM\n    encounters V\n    INNER JOIN CTE_END_DATES E\
    \ ON V.patient = E.patient\n    AND V.encounterclass = E.encounterclass\n    AND\
    \ E.END_DATE >= V.start\n  GROUP BY\n    V.patient,\n    V.encounterclass,\n \
    \   V.start\n)\nSELECT\n  T2.encounter_id,\n  T2.patient,\n  T2.encounterclass,\n\
    \  T2.VISIT_START_DATE,\n  T2.VISIT_END_DATE\nFROM\n  (\n    SELECT\n      encounter_id,\n\
    \      patient,\n      encounterclass,\n      MIN(VISIT_START_DATE) AS VISIT_START_DATE,\n\
    \      VISIT_END_DATE\n    FROM\n      CTE_VISIT_ENDS\n    GROUP BY\n      encounter_id,\n\
    \      patient,\n      encounterclass,\n      VISIT_END_DATE\n  ) T2\n);\n\nCREATE\
    \ OR REPLACE TEMPORARY VIEW ER_VISITS AS\nSELECT\n  T2.encounter_id,\n  T2.patient,\n\
    \  T2.encounterclass,\n  T2.VISIT_START_DATE,\n  T2.VISIT_END_DATE\nFROM\n  (\n\
    \    SELECT\n      MIN(encounter_id) AS encounter_id,\n      patient,\n      encounterclass,\n\
    \      VISIT_START_DATE,\n      MAX(VISIT_END_DATE) AS VISIT_END_DATE\n    FROM\n\
    \      (\n        SELECT\n          CL1.id AS encounter_id,\n          CL1.patient,\n\
    \          CL1.encounterclass,\n          CL1.start AS VISIT_START_DATE,\n   \
    \       CL2.stop AS VISIT_END_DATE\n        FROM\n          encounters CL1\n \
    \         INNER JOIN encounters CL2 ON CL1.patient = CL2.patient\n          AND\
    \ CL1.start = CL2.start\n          AND CL1.encounterclass = CL2.encounterclass\n\
    \        WHERE\n          CL1.encounterclass in ('emergency', 'urgent')\n    \
    \  ) T1\n    GROUP BY\n      patient,\n      encounterclass,\n      VISIT_START_DATE\n\
    \  ) T2;\n\nCREATE\nOR REPLACE TEMPORARY VIEW OP_VISITS AS WITH CTE_VISITS_DISTINCT\
    \ AS (\n  SELECT\n    MIN(id) AS encounter_id,\n    patient,\n    encounterclass,\n\
    \    start AS VISIT_START_DATE,\n    stop AS VISIT_END_DATE\n  FROM\n    encounters\n\
    \  WHERE\n    encounterclass in ('ambulatory', 'wellness', 'outpatient')\n  GROUP\
    \ BY\n    patient,\n    encounterclass,\n    start,\n    stop\n)\nSELECT\n  MIN(encounter_id)\
    \ AS encounter_id,\n  patient,\n  encounterclass,\n  VISIT_START_DATE,\n  MAX(VISIT_END_DATE)\
    \ AS VISIT_END_DATE\nFROM\n  CTE_VISITS_DISTINCT\nGROUP BY\n  patient,\n  encounterclass,\n\
    \  VISIT_START_DATE;\n\nDROP TABLE IF EXISTS all_visits;\nCREATE TABLE all_visits\n\
    SELECT\n  *,\n  ROW_NUMBER() OVER(\n    ORDER BY\n      patient\n  ) as visit_occurrence_id\n\
    FROM\n  (\n    SELECT\n      *\n    FROM\n      IP_VISITS\n    UNION ALL\n   \
