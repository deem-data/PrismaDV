    \ \t\t\tFROM cteFinalTarget\n      0956: \t\t) RAWDATA\n      0957: \t) e\n  \
    \    0958: \tWHERE (2 * e.start_ordinal) - e.overall_ord = 0\n      0959: \n \
    \     0960: )\n      0961: , cteDrugEraEnds (person_id, drug_concept_id, drug_sub_exposure_start_datetime,\
    \ drug_era_end_datetime, drug_exposure_count, days_exposed) AS\n      0962: (\n\
    \      0963: SELECT\n      0964: \tft.person_id\n      0965: \t, ft.ingredient_concept_id\n\
