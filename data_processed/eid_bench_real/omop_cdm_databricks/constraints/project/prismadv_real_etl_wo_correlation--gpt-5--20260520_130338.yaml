        file: source_repo/4-omop531-etl-synthea.sql
      uid: 2a8067f7-e732-4d01-8e4a-291b65ca8c2d
    - text: Within the procedures table, ENCOUNTER should functionally determine PATIENT
        (for any given ENCOUNTER value, all rows share the same PATIENT), reflecting
        that an encounter ID belongs to exactly one patient.
