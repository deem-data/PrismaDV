  column_name: DESCRIPTION
  code_for_constraint: .isComplete("DESCRIPTION")
- table_name: medications
  column_name: BASE_COST
  code_for_constraint: .satisfies("BASE_COST IS NOT NULL AND BASE_COST > 0", "positive_medication_base_cost")
