  column_name: ENCOUNTERCLASS
  code_for_constraint: .isContainedIn("ENCOUNTERCLASS", ["wellness", "ambulatory",
    "outpatient", "emergency", "inpatient", "urgent", "urgentcare"])
- table_name: encounters
  column_name: CODE
  code_for_constraint: .satisfies("CODE IS NOT NULL AND CODE > 0", "valid_encounter_code")
