    >= 0", "nonnegative_base_encounter_cost")
- table_name: encounters
  column_name: TOTAL_CLAIM_COST
  code_for_constraint: .satisfies("TOTAL_CLAIM_COST IS NOT NULL AND TOTAL_CLAIM_COST
    = BASE_ENCOUNTER_COST", "claim_matches_base_encounter_cost")
- table_name: encounters
  column_name: PAYER_COVERAGE
  code_for_constraint: .satisfies("PAYER_COVERAGE IS NOT NULL AND PAYER_COVERAGE >=
    0 AND PAYER_COVERAGE <= TOTAL_CLAIM_COST", "valid_encounter_payer_coverage")
- table_name: encounters
  column_name: REASONCODE
  code_for_constraint: .satisfies("(REASONCODE IS NULL AND REASONDESCRIPTION IS NULL)
    OR (REASONCODE IS NOT NULL AND REASONDESCRIPTION IS NOT NULL)", "encounter_reason_fields_present_together")
- table_name: medications
  column_name: START
  code_for_constraint: .satisfies("CAST(START AS DATE) IS NOT NULL", "valid_medication_start_date")
- table_name: medications
  column_name: STOP
