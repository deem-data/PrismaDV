- table_name: encounters
  column_name: START
  code_for_constraint: .satisfies("CAST(START AS TIMESTAMP) IS NOT NULL", "valid_encounter_start")
- table_name: encounters
  column_name: STOP
  code_for_constraint: .satisfies("CAST(STOP AS TIMESTAMP) IS NOT NULL AND CAST(STOP
    AS TIMESTAMP) >= CAST(START AS TIMESTAMP)", "valid_encounter_stop")
