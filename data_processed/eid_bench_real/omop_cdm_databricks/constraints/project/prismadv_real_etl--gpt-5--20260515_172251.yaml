        file: source_repo/4-omop531-etl-synthea.sql
      uid: b417aa79-6c47-4c06-a7d1-35c570562227
    - text: 'For a given CODE, the representation of VALUE should be internally consistent:
        most rows for the same CODE should be of the same type (predominantly numeric
        or predominantly non-numeric categorical).'
