    assumptions:
    - text: Within observations, CODE should be a populated LOINC-style code identifying
        the measurement concept, VALUE should be populated (as the raw source string),
        and UNITS may be null.
      sources:
      - start_line: 541
        end_line: 545
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 536
        end_line: 539
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 527
        end_line: 527
        file: source_repo/4-omop531-etl-synthea.sql
      uid: 412e44b4-f2eb-4007-8694-e59702afd600
    - text: 'VALUE is expected to be either numeric (parsable as a float) or a categorical
        label, but not both for a given row: the ETL first casts VALUE to float and
        otherwise treats the original string as a concept-coded measurement value.'
      sources:
      - start_line: 527
        end_line: 527
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 551
        end_line: 555
        file: source_repo/4-omop531-etl-synthea.sql
      uid: 26c2790e-5dee-44aa-96bb-896f5ab1cbf8
    - text: When UNITS is present, it should be a UCUM-formatted unit string (e.g.,
        kg, cm, kg/m2, mm[Hg]); dimensionless measures may use a placeholder like
        '{score}'.
      sources:
      - start_line: 546
        end_line: 550
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 538
        end_line: 538
        file: source_repo/4-omop531-etl-synthea.sql
      uid: 606a5c55-2c3e-46fc-a4ab-a2da8b264074
    - text: For a given CODE, UNITS should be consistent across rows (typically a
        single dominant unit per code); large variation in UNITS for the same CODE
        likely indicates data issues.
      sources:
      - start_line: 541
        end_line: 545
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 546
        end_line: 550
        file: source_repo/4-omop531-etl-synthea.sql
      uid: 005f40a6-fa7b-4d74-8afa-4108994dbe7c
    - text: For rows where UNITS indicates a physical unit (e.g., kg, kg/m2, cm, mm[Hg])
        or a dimensionless placeholder like '{score}', VALUE should be a numeric string
        parsable as a float.
      sources:
      - start_line: 527
        end_line: 527
        file: source_repo/4-omop531-etl-synthea.sql
      - start_line: 538
