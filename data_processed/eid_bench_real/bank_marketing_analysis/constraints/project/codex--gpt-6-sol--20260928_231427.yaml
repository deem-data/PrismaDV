  \n# Verifying your constraints\n\nYou can execute PyDeequ constraint code against\
  \ a staged table and read back the\nresult of every check:\n\n```\n{{CHECKER_CMD}}\n\
  ```\n\nwhere the table is named by its file stem and the constraints file is plain\
  \ text\nwith one PyDeequ `Check` call per line, for example:\n\n```\n.isComplete(\"\
  age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"\
  ])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints\
  \ the reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
