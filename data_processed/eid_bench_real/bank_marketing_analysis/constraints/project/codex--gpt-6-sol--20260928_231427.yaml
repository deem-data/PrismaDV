        \ showing the trade-off between the true positive rate (TPR)\n    and false\
        \ positive rate (FPR) at various threshold settings. \n    The Area Under\
        \ the Curve (AUC) is also calculated and displayed in the plot.\n\n    Parameters:\n\
        \    - model: A trained machine learning model that supports probability prediction.\n\
        \    - testing_x: Test dataset (features).\n    - testing_y: True labels for\
        \ the test dataset.\n    - name (str): The name of the model, used for labeling\
        \ the plot.\n    - figsize (tuple): The size of the figure in which the ROC\
        \ curve is plotted (default is (5, 5)).\n\n    Returns:\n    - fpr (array):\
        \ An array containing the false positive rates.\n    - tpr (array): An array\
