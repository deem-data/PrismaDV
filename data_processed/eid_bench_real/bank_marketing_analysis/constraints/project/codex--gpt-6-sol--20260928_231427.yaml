        \ The type of variables ('categorical', 'continuous', or 'log'). Default is\
        \ 'categorical'.\n    - target_var (str, optional): The target variable for\
        \ grouping and coloring the plots. Default is 'y'.\n    - ignore_vars (list,\
        \ optional): A list of variables to ignore when creating plots. Default is\
        \ None.\n\n    Returns:\n    - alt.Chart: The Altair chart containing the\
        \ visualizations.\n    \"\"\"\n\n    validate_input(data, variables, var_type,\
        \ target_var, ignore_vars)\n\n\n    charts = []\n\n    for i, var in enumerate(variables):\n\
        \        if var not in data.columns or (ignore_vars and var in ignore_vars):\n\
        \            continue  \n\n        if var_type == 'categorical':\n       \
        \     num_rows = len(data[var].unique())\n\n            chart = alt.Chart(data).mark_bar(stroke=None).encode(\n\
        \                x=alt.X('count()', title='Count'),\n                y=alt.Y(target_var\
        \ + ':N', title=None),\n                color=alt.Color(target_var + ':N',\
