        def validate_input(data, variables, var_type, target_var, ignore_vars):\n\
        \    if not isinstance(data, pd.DataFrame):\n        raise ValueError(\"Input\
        \ 'data' must be a DataFrame.\")\n    if not isinstance(variables, list):\n\
