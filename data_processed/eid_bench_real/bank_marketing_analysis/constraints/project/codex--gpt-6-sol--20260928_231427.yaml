  \   {\n            \"table_name\": \"some_table\",\n            \"column_name\"\
  : \"some_column\",\n            \"code_for_constraint\": \".isComplete('some_column')\"\
  \n        },\n        {\n            \"table_name\": \"another_table\",\n      \
  \      \"column_name\": \"another_column\",\n            \"code_for_constraint\"\
