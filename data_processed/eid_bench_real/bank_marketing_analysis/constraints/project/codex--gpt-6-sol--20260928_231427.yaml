        \ compute_roc_curve(model, testing_x, testing_y)\n\n    # Plot the ROC curve\n\
        \    fig, ax = plt.subplots(figsize=figsize, facecolor=\"white\")\n    ax.set_title('Receiver\
        \ Operating Characteristic')\n    ax.plot(fpr, tpr, 'b', label='{} : {:0.3f}'.format(name,\
