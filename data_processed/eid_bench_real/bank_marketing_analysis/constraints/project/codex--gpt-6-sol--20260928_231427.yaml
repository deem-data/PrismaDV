        \ list):\n        raise ValueError(\"Input 'ignore_vars' must be a list if\
        \ provided.\")\n\n\ndef plot_variables(data: pd.DataFrame, \n            \
        \       variables: list, \n                   var_type: str = 'categorical',\
        \ \n                   target_var: str = 'y', \n                   ignore_vars:\
        \ list = None) -> alt.Chart:\n    \"\"\"\n    Create grouped bar plots for\
        \ categorical variables, histograms for continuous variables, \n    and histograms\
        \ for log-transformed continuous variables. The plots are grouped and colored\
        \ \n    by the target variable.\n\n    Parameters:\n    - data (DataFrame):\
