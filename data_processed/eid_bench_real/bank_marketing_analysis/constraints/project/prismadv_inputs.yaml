    content: "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as\
      \ plt\nimport altair as alt\nfrom sklearn import metrics\n\ndef compute_roc_curve(model,\
      \ testing_x, testing_y):\n    \"\"\"\n    Compute the Receiver Operating Characteristic\
      \ (ROC) curve.\n\n    This function takes a machine learning model and test\
      \ data as inputs.\n    It computes the ROC curve using the model's probability\
      \ predictions on the test data.\n\n    Parameters:\n    - model: A trained machine\
      \ learning model that supports probability prediction.\n    - testing_x: Test\
      \ dataset (features).\n    - testing_y: True labels for the test dataset.\n\n\
      \    Returns:\n    - fpr (array): An array containing the false positive rates.\n\
      \    - tpr (array): An array containing the true positive rates.\n    - roc_auc\
      \ (float): The computed area under the ROC curve.\n\n    \"\"\"\n    # Input\
      \ validation\n    if model is None:\n        raise ValueError(\"No model provided.\
      \ Please provide a machine learning model.\")\n    if not hasattr(model, 'predict_proba'):\n\
      \        raise ValueError(\"The provided model does not support probability\
      \ predictions.\")\n    if testing_x is None or testing_y is None:\n        raise\
      \ ValueError(\"Test data and labels must not be None.\")\n    \n    # Compute\
      \ ROC curve and ROC area\n    predict_prob = model.predict_proba(testing_x)\n\
      \    fpr, tpr, threshold = metrics.roc_curve(testing_y, predict_prob[:,1])\n\
      \    roc_auc = metrics.auc(fpr, tpr)\n\n    return fpr, tpr, roc_auc\n\ndef\
      \ compute_and_plot_roc_curve(model, testing_x, testing_y, name, figsize=(5,5)):\n\
      \    \"\"\"\n    Plot the Receiver Operating Characteristic (ROC) curve based\
      \ on the results from compute_roc_curve().\n\n    This function takes a machine\
      \ learning model, test data, and the name of the model as inputs.\n    It computes\
      \ the ROC curve using the model's probability predictions on the test data using\
      \ compute_roc_curve().\n    The function plots the ROC curve, showing the trade-off\
      \ between the true positive rate (TPR)\n    and false positive rate (FPR) at\
      \ various threshold settings. \n    The Area Under the Curve (AUC) is also calculated\
      \ and displayed in the plot.\n\n    Parameters:\n    - model: A trained machine\
      \ learning model that supports probability prediction.\n    - testing_x: Test\
      \ dataset (features).\n    - testing_y: True labels for the test dataset.\n\
      \    - name (str): The name of the model, used for labeling the plot.\n    -\
      \ figsize (tuple): The size of the figure in which the ROC curve is plotted\
      \ (default is (5, 5)).\n\n    Returns:\n    - fpr (array): An array containing\
      \ the false positive rates.\n    - tpr (array): An array containing the true\
      \ positive rates.\n    - roc_auc (float): The computed area under the ROC curve.\n\
      \n    \"\"\"\n    # Input validation\n    if not isinstance(name, str):\n  \
      \      raise ValueError(\"Model name must be a string.\")\n    \n    # Compute\
      \ the ROC curve\n    fpr, tpr, roc_auc = compute_roc_curve(model, testing_x,\
      \ testing_y)\n\n    # Plot the ROC curve\n    fig, ax = plt.subplots(figsize=figsize,\
      \ facecolor=\"white\")\n    ax.set_title('Receiver Operating Characteristic')\n\
      \    ax.plot(fpr, tpr, 'b', label='{} : {:0.3f}'.format(name, roc_auc))\n  \
      \  ax.legend(loc='lower right')\n    ax.plot([0, 1], [0, 1], 'r--')\n    ax.set_xlim([0,\
      \ 1])\n    ax.set_ylim([0, 1])\n    ax.set_ylabel('True Positive Rate')\n  \
      \  ax.set_xlabel('False Positive Rate')\n    \n    return fig, ax, fpr, tpr,\
      \ roc_auc"
