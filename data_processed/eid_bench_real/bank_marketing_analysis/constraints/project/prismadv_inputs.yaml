    content: "\"\"\"Adapter implementation for the Bank Marketing Analysis RealETLBench\
      \ case.\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport json\n\
      import shutil\nimport subprocess\nimport sys\nfrom pathlib import Path\nfrom\
      \ typing import Any\n\nimport pandas as pd\n\n\nADAPTER_DIR = Path(__file__).resolve().parent\n\
      EXAMPLE_DIR = ADAPTER_DIR.parent\nSOURCE_REPO = ADAPTER_DIR / \"source_repo\"\
      \nALL_SCRIPTS = (\"preprocess\", \"eda\", \"fit_classifier\", \"feature_importance\"\
      )\n\n\ndef clean_output_dir(output_dir: Path) -> None:\n    if output_dir.exists():\n\
      \        shutil.rmtree(output_dir)\n    output_dir.mkdir(parents=True, exist_ok=True)\n\
      \n\ndef ensure_dirs(*paths: Path) -> None:\n    for path in paths:\n       \
      \ path.mkdir(parents=True, exist_ok=True)\n\n\ndef find_bank_csv(input_dir:\
      \ Path) -> Path:\n    path = input_dir / \"bank_marketing.csv\"\n    if not\
      \ path.exists():\n        raise FileNotFoundError(f\"bank_marketing.csv not\
      \ found under {input_dir}\")\n    return path\n\n\ndef run_python(args: list[str])\
      \ -> None:\n    subprocess.run([sys.executable, *args], cwd=SOURCE_REPO, check=True)\n\
      \n\ndef value_counts_csv(path: Path, column: str) -> dict[str, int]:\n    with\
      \ path.open(newline=\"\", encoding=\"utf-8\") as fh:\n        reader = csv.DictReader(fh)\n\
      \        counts: dict[str, int] = {}\n        for row in reader:\n         \
      \   value = row[column]\n            counts[value] = counts.get(value, 0) +\
      \ 1\n    return dict(sorted(counts.items()))\n\n\ndef csv_header(path: Path)\
      \ -> list[str]:\n    with path.open(newline=\"\", encoding=\"utf-8\") as fh:\n\
      \        return next(csv.reader(fh))\n\n\ndef csv_row_count(path: Path) -> int:\n\
      \    with path.open(newline=\"\", encoding=\"utf-8\") as fh:\n        return\
      \ max(sum(1 for _ in fh) - 1, 0)\n\n\ndef write_summary(output_dir: Path, payload:\
      \ dict[str, Any]) -> None:\n    (output_dir / \"summary.json\").write_text(\n\
      \        json.dumps(payload, indent=2, sort_keys=True) + \"\\n\", encoding=\"\
      utf-8\"\n    )\n\n\ndef run_preprocess(input_dir: Path, output_dir: Path) ->\
      \ dict[str, Any]:\n    raw_csv = find_bank_csv(input_dir)\n    data_dir = output_dir\
      \ / \"data\" / \"processed\"\n    model_dir = output_dir / \"results\" / \"\
      models\"\n    ensure_dirs(data_dir, model_dir)\n\n    run_python([\n       \
      \ \"scripts/split_and_process.py\",\n        \"--raw_data\",\n        str(raw_csv),\n\
      \        \"--save_to\",\n        str(data_dir),\n        \"--preprocessor_to\"\
      ,\n        str(model_dir),\n        \"--seed\",\n        \"522\",\n    ])\n\n\
      \    x_train = data_dir / \"X_train.csv\"\n    x_train_trans = data_dir / \"\
      X_train_trans.csv\"\n    y_train = data_dir / \"y_train.csv\"\n    y_test =\
      \ data_dir / \"y_test.csv\"\n    y_train_resmp = data_dir / \"y_train_resmp.csv\"\
      \n    bank_train = data_dir / \"bank_train.csv\"\n    bank_test = data_dir /\
      \ \"bank_test.csv\"\n    preprocessor = model_dir / \"bank_preprocessor.pickle\"\
      \n\n    x_train_header = csv_header(x_train)\n    x_train_trans_header = csv_header(x_train_trans)\n\
      \n    summary = {\n        \"script_id\": \"preprocess\",\n        \"raw_rows\"\
      : csv_row_count(raw_csv),\n        \"raw_columns\": csv_header(raw_csv),\n \
      \       \"train_rows\": csv_row_count(bank_train),\n        \"test_rows\": csv_row_count(bank_test),\n\
      \        \"x_train_columns\": x_train_header,\n        \"x_train_trans_columns\"\
      : x_train_trans_header,\n        \"x_train_column_count\": len(x_train_header),\n\
      \        \"x_train_trans_column_count\": len(x_train_trans_header),\n      \
      \  \"target_counts_train\": value_counts_csv(y_train, \"y\"),\n        \"target_counts_test\"\
      : value_counts_csv(y_test, \"y\"),\n        \"target_counts_resampled\": value_counts_csv(y_train_resmp,\
      \ \"y\"),\n        \"age_in_x_train\": \"age\" in x_train_header,\n        \"\
      age_in_x_train_trans\": \"age\" in x_train_trans_header,\n        \"has_unnamed_index_column\"\
      : any(\n            col.startswith(\"Unnamed\") for col in x_train_header +\
      \ x_train_trans_header\n        ),\n        \"preprocessor_exists\": preprocessor.exists(),\n\
      \    }\n    return summary\n\n\ndef run_eda(input_dir: Path, output_dir: Path)\
      \ -> dict[str, Any]:\n    preprocess_summary = run_preprocess(input_dir, output_dir)\n\
      \    data_dir = output_dir / \"data\" / \"processed\"\n    figure_dir = output_dir\
      \ / \"results\" / \"figures\"\n    ensure_dirs(figure_dir)\n\n    run_python([\n\
      \        \"scripts/eda.py\",\n        \"--training_data\",\n        str(data_dir\
      \ / \"bank_train.csv\"),\n        \"--save_plot_to\",\n        str(figure_dir),\n\
      \    ])\n\n    plots = [\n        \"eda_categorical_variables.png\",\n     \
      \   \"eda_continuous_variables.png\",\n        \"eda_log_variables.png\",\n\
      \    ]\n    return {\n        \"script_id\": \"eda\",\n        \"preprocess\"\
      : preprocess_summary,\n        \"plots\": {\n            name: {\n         \
      \       \"exists\": (figure_dir / name).exists(),\n                \"size_bytes\"\
      : (figure_dir / name).stat().st_size if (figure_dir / name).exists() else 0,\n\
      \            }\n            for name in plots\n        },\n    }\n\n\ndef run_fit_classifier(input_dir:\
      \ Path, output_dir: Path) -> dict[str, Any]:\n    preprocess_summary = run_preprocess(input_dir,\
      \ output_dir)\n    data_dir = output_dir / \"data\" / \"processed\"\n    model_dir\
      \ = output_dir / \"results\" / \"models\"\n    figure_dir = output_dir / \"\
      results\" / \"figures\"\n    ensure_dirs(model_dir, figure_dir)\n\n    run_python([\n\
      \        \"scripts/fit_bank_classifier.py\",\n        \"--resampled_training_data\"\
      ,\n        str(data_dir / \"X_train_resmp.csv\"),\n        \"--resampled_training_response\"\
      ,\n        str(data_dir / \"y_train_resmp.csv\"),\n        \"--test_data\",\n\
      \        str(data_dir / \"X_test.csv\"),\n        \"--test_response\",\n   \
      \     str(data_dir / \"y_test.csv\"),\n        \"--preprocessor_pipe\",\n  \
      \      str(model_dir / \"bank_preprocessor.pickle\"),\n        \"--save_pipelines_to\"\
      ,\n        str(model_dir),\n        \"--save_plot_to\",\n        str(figure_dir),\n\
      \        \"--seed\",\n        \"522\",\n    ])\n\n    all_models = figure_dir\
      \ / \"all_models.csv\"\n    model_metrics = pd.read_csv(all_models).to_dict(orient=\"\
      records\")\n    return {\n        \"script_id\": \"fit_classifier\",\n     \
      \   \"preprocess\": preprocess_summary,\n        \"model_files\": sorted(path.name\
      \ for path in model_dir.glob(\"*.pickle\")),\n        \"figure_files\": sorted(path.name\
      \ for path in figure_dir.iterdir() if path.is_file()),\n        \"all_models_rows\"\
      : len(model_metrics),\n        \"all_models\": model_metrics,\n        \"best_model\"\
      : model_metrics[0][\"Model\"] if model_metrics else None,\n        \"best_auc\"\
      : float(model_metrics[0][\"Area_under_curve\"]) if model_metrics else None,\n\
      \    }\n\n\ndef run_feature_importance(input_dir: Path, output_dir: Path) ->\
      \ dict[str, Any]:\n    fit_summary = run_fit_classifier(input_dir, output_dir)\n\
      \    data_dir = output_dir / \"data\" / \"processed\"\n    model_dir = output_dir\
      \ / \"results\" / \"models\"\n    figure_dir = output_dir / \"results\" / \"\
      figures\"\n\n    run_python([\n        \"scripts/feat_imp.py\",\n        \"\
      --transformed_training_data\",\n        str(data_dir / \"X_train_trans.csv\"\
      ),\n        \"--pipeline_model\",\n        str(model_dir / \"logistic_pipeline.pickle\"\
      ),\n        \"--save_plot_to\",\n        str(figure_dir),\n        \"--seed\"\
      ,\n        \"522\",\n    ])\n\n    feature_columns = csv_header(data_dir / \"\
      X_train_trans.csv\")\n    feature_plot = figure_dir / \"feat_imp.png\"\n   \
      \ return {\n        \"script_id\": \"feature_importance\",\n        \"fit_classifier\"\
      : fit_summary,\n        \"feature_count\": len(feature_columns),\n        \"\
      age_in_features\": \"age\" in feature_columns,\n        \"feature_importance_plot_exists\"\
      : feature_plot.exists(),\n        \"feature_importance_plot_size_bytes\": feature_plot.stat().st_size\
      \ if feature_plot.exists() else 0,\n    }\n\n\ndef run_script(script_id: str,\
      \ input_dir: Path, output_dir: Path) -> None:\n    if script_id not in ALL_SCRIPTS:\n\
      \        raise ValueError(f\"unknown script_id: {script_id}\")\n\n    clean_output_dir(output_dir)\n\
      \n    if script_id == \"preprocess\":\n        summary = run_preprocess(input_dir,\
      \ output_dir)\n    elif script_id == \"eda\":\n        summary = run_eda(input_dir,\
      \ output_dir)\n    elif script_id == \"fit_classifier\":\n        summary =\
      \ run_fit_classifier(input_dir, output_dir)\n    elif script_id == \"feature_importance\"\
      :\n        summary = run_feature_importance(input_dir, output_dir)\n    else:\n\
      \        raise AssertionError(script_id)\n\n    write_summary(output_dir, summary)\n"
  - path: source_repo/scripts/split_and_process.py
    line_count: 119
    char_count: 4733
    content: "import click\nimport os\nimport pandas as pd\nimport numpy as np\nimport\
      \ pickle\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing\
      \ import OrdinalEncoder, StandardScaler, OneHotEncoder\nfrom sklearn.pipeline\
      \ import make_pipeline\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose\
      \ import ColumnTransformer\n\nimport sys\nsys.path.append(os.path.join(os.path.dirname(__file__),\
      \ '..'))\nfrom src.resample import re_sample\n\n@click.command()\n@click.option('--raw_data',\
      \ type=str, default='data/raw/bank_marketing.csv')\n@click.option('--save_to',\
      \ type=str, default='data/processed')\n@click.option('--preprocessor_to', type=str,\
      \ default='results/models')\n@click.option('--seed', type=int, default=522)\n\
      \n\n\n\ndef main(raw_data, save_to, preprocessor_to, seed):\n    \"\"\"\n  \
      \  This script performs data splitting, resampling, and preprocessing on a banking\
      \ dataset.\n    \n    Parameters:\n    - raw_data (str): Path to the raw data\
      \ CSV file.\n    - save_to (str): Directory to save the processed data.\n  \
      \  - preprocessor_to (str): Directory to save the preprocessor.\n    - seed\
      \ (int): Seed for random number generation.\n\n    Example:\n    To run the\
      \ script, use the following command in the terminal:\n    ```\n    python scripts/split_and_process.py\
      \ --raw_data='data/raw/bank_marketing.csv' --save_to='data/processed' --preprocessor_to='results/models'\
      \ --seed=522\n    ```\n    \"\"\"\n    np.random.seed(seed)\n    RANDOM_STATE\
      \ = seed\n    bank = pd.read_csv(raw_data, sep=',')\n\n\n    # create the split\n\
      \    bank_train, bank_test = train_test_split(bank\n                       \
      \                 , test_size=0.2\n                                        ,\
      \ random_state=RANDOM_STATE\n                                        , stratify=bank.y\n\
      \                                        )\n    \n    bank_train.to_csv(os.path.join(save_to,\
      \ \"bank_train.csv\"), index=False)\n    bank_test.to_csv(os.path.join(save_to,\
      \ \"bank_test.csv\"), index=False)\n    \n    X_train, y_train = bank_train.drop(columns=[\"\
      y\"]), bank_train[\"y\"]\n    X_test, y_test = bank_test.drop(columns=[\"y\"\
      ]), bank_test[\"y\"]\n    y_train = y_train.map({'yes':1, 'no':0})\n    y_test\
      \ = y_test.map({'yes':1, 'no':0})\n\n\n       # resample data\n    X_tr, y_tr=\
      \ re_sample(X_train, y_train, func='random_under_sample')\n\n    # export train\
      \ and test sets\n    X_train.to_csv(os.path.join(save_to, \"X_train.csv\"),\
      \ index=False)\n    y_train.to_csv(os.path.join(save_to, \"y_train.csv\"), index=False)\n\
      \    X_tr.to_csv(os.path.join(save_to, \"X_train_resmp.csv\"), index=False)\n\
      \    y_tr.to_csv(os.path.join(save_to, \"y_train_resmp.csv\"), index=False)\n\
      \    X_test.to_csv(os.path.join(save_to, \"X_test.csv\"), index=False)\n   \
      \ y_test.to_csv(os.path.join(save_to, \"y_test.csv\"), index=False)\n\n\n\n\
      \    # preprocessing\n    numeric_features = bank.select_dtypes('number').columns.tolist()\n\
      \    categorical_features = ['job', 'marital', 'contact', 'month', 'poutcome']\n\
      \    ordinal_features = ['education']\n    binary_features = ['default', 'housing',\
      \ 'loan']\n    drop_features = []\n    target = \"y\"\n\n    education_levels\
      \ = ['tertiary', 'secondary', 'primary']\n    ordinal_transformer = make_pipeline(SimpleImputer(strategy=\"\
      most_frequent\"),\n                                        OrdinalEncoder(categories=[education_levels],\
      \ dtype=int))\n\n    numeric_transformer = make_pipeline(SimpleImputer(strategy=\"\
      median\"), StandardScaler())\n\n    binary_transformer = make_pipeline(SimpleImputer(strategy=\"\
      most_frequent\"),\n                                        OneHotEncoder(dtype=int,\
      \ drop='if_binary'))\n\n    categorical_transformer = make_pipeline(SimpleImputer(strategy=\"\
      most_frequent\"),\n                                            OneHotEncoder(handle_unknown=\"\
      ignore\", sparse_output=False))\n    \n    preprocessor = ColumnTransformer(\n\
      \    transformers=[\n        ('numeric', numeric_transformer, numeric_features),\n\
      \        ('ordinal', ordinal_transformer, ordinal_features),\n        ('binary',\
      \ binary_transformer, binary_features),\n        ('categorical', categorical_transformer,\
      \ categorical_features),\n        ('drop', 'passthrough', drop_features)\n \
      \   ])\n\n    transformed_train = preprocessor.fit_transform(X_train)\n    column_names\
      \ = (\n    numeric_features +\n    ordinal_features +\n    preprocessor.named_transformers_['binary'].named_steps['onehotencoder'].get_feature_names_out().tolist()\
      \ +\n    preprocessor.named_transformers_['categorical'].named_steps['onehotencoder'].get_feature_names_out().tolist()\
      \ \n    )\n\n    X_train_trans = pd.DataFrame(transformed_train, columns=column_names)\n\
      \    X_train_trans.to_csv(os.path.join(save_to, \"X_train_trans.csv\"), index=False)\n\
      \n    pickle.dump(preprocessor, open(os.path.join(preprocessor_to, \"bank_preprocessor.pickle\"\
      ), \"wb\"))\n\n\nif __name__ == '__main__':\n    main()\n"
