    content: "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as\
      \ plt\nfrom sklearn import metrics\nfrom sklearn.metrics import confusion_matrix,\
      \ f1_score, roc_auc_score, classification_report, recall_score, precision_score\n\
      \ndef compute_metrics(model, testing_x, testing_y, customerized_threshold=False,\
      \ threshold=0.5):\n    \"\"\"\n    Compute various performance metrics for a\
      \ machine learning model.\n\n    Parameters:\n    - model: A trained machine\
      \ learning model.\n    - testing_x: Test dataset (features).\n    - testing_y:\
      \ True labels for the test dataset.\n    - customerized_threshold (bool): Flag\
      \ to apply a custom threshold for predictions (default is False).\n    - threshold\
      \ (float): The custom threshold for classification if customerized_threshold\
      \ is True (default is 0.5).\n\n    Returns:\n    - A dictionary containing recall,\
      \ precision, F1-score, ROC-AUC score, and predictions.\n    \"\"\"\n    # Input\
      \ validation\n    if model is None:\n        raise ValueError(\"No model provided.\
      \ Please provide a machine learning model.\")    \n    if not hasattr(model,\
      \ 'predict') or not hasattr(model, 'predict_proba'):\n        raise ValueError(\"\
      Provided model must have 'predict' and 'predict_proba' methods.\")\n    if testing_x\
      \ is None or testing_y is None:\n        raise ValueError(\"Test data and labels\
      \ must not be None.\")\n\n    # Make prediction\n    predictions = model.predict(testing_x)\n\
      \    predictions_prob = model.predict_proba(testing_x)\n\n    # Compute metrics\n\
      \    if customerized_threshold:\n        predictions = (predictions_prob[:,\
      \ 1] > threshold).astype(int)\n\n    metrics_dict = {\n        'recall': recall_score(testing_y,\
      \ predictions),\n        'precision': precision_score(testing_y, predictions),\n\
      \        'f1_score': f1_score(testing_y, predictions),\n        'roc_auc': roc_auc_score(testing_y,\
      \ predictions_prob[:, 1]),\n        'predictions': predictions\n    }\n\n  \
      \  return metrics_dict\n\ndef plot_confusion_matrix_func(predictions, testing_y,\
      \ export_path=None):\n    \"\"\"\n    Plot the confusion matrix for the model\
      \ predictions.\n\n    Parameters:\n    - predictions: Model predictions.\n \
      \   - testing_y: True labels for the test dataset.\n    - export_path: Path\
      \ to export the plot, if provided.\n    \"\"\"\n    confusion = confusion_matrix(testing_y,\
      \ predictions)\n    plt.figure(figsize=(5,5), dpi=100)\n    plt.imshow(confusion,\
      \ cmap=plt.cm.Blues)\n    indices = range(len(confusion))\n    plt.xticks(indices,\
      \ indices, fontsize=10)\n    plt.yticks(indices, indices, fontsize=10)\n   \
      \ plt.colorbar()\n    plt.xlabel('Predictions', fontsize=10)\n    plt.ylabel('Ground\
      \ Truth', fontsize=10)\n    for i in range(len(confusion)):\n        for j in\
      \ range(len(confusion[i])):\n            plt.text(i, j, confusion[i][j], va='center',\
      \ ha='center', c='darkorange', fontsize=10)\n    plt.grid(False)\n\n    if export_path:\n\
      \        plt.savefig(export_path, bbox_inches='tight', dpi=200)\n\ndef model_report(model,\
      \ testing_x, testing_y, name, export_path=None, customerized_threshold=False,\
      \ threshold=0.5, plot_confusion_matrix=True):\n    \"\"\"\n    Generate and\
      \ print a performance report of a machine learning model on test data.\n\n \
      \   This function evaluates a given model on test data and generates various\
      \ performance metrics\n    including recall, precision, F1-score, and ROC-AUC\
      \ score. It also prints a classification report\n    and optionally plots a\
      \ confusion matrix. The function allows for the application of a custom\n  \
      \  threshold for classification decisions.\n\n    Parameters:\n    - model:\
      \ A trained machine learning model.\n    - testing_x: Test dataset (features).\n\
      \    - testing_y: True labels for the test dataset.\n    - name (str): The name\
      \ of the model, used for labeling in the report.\n    - export_path: Path to\
      \ export the plot, if provided.\n    - customerized_threshold (bool): Flag to\
      \ apply a custom threshold for predictions (default is False).\n    - threshold\
      \ (float): The custom threshold for classification if customerized_threshold\
      \ is True (default is 0.5).\n    - plot_confusion_matrix (bool): Flag to plot\
      \ the confusion matrix (default is True).\n\n    Returns:\n    - DataFrame:\
      \ A pandas DataFrame containing the model name and calculated performance metrics.\n\
      \    - DataFrame: A pandas DataFrame containing the classification report.\n\
      \n    The function prints the classification report and, if requested, displays\
      \ the confusion matrix plot.\n    \"\"\"\n    # Input validation\n    if not\
      \ isinstance(name, str):\n        raise ValueError(\"Model name must be a string.\"\
      )\n    \n    # Compute metrics\n    metrics_dict = compute_metrics(model, testing_x,\
      \ testing_y, customerized_threshold, threshold)\n\n    # Generate classification\
      \ report\n    classification_rep = pd.DataFrame(classification_report(testing_y,\
      \ metrics_dict['predictions'], output_dict=True)).transpose()    \n\n    # Generate\
      \ confusion matrix\n    if plot_confusion_matrix:\n        plot_confusion_matrix_func(metrics_dict['predictions'],\
      \ testing_y, export_path)\n\n    df = pd.DataFrame({\"Model\"           : [name],\n\
      \                       \"Recall_score\"    : [metrics_dict['recall']],\n  \
      \                     \"Precision\"       : [metrics_dict['precision']],\n \
      \                      \"f1_score\"        : [metrics_dict['f1_score']],\n \
      \                      \"Area_under_curve\": [metrics_dict['roc_auc']]\n   \
      \                   })\n    \n    return df, classification_rep"
