      \ (str): Path to the preprocessed training data file.\n        pipeline_model\
      \ (str): Path to the saved logistic regression pipeline model.\n        save_plot_to\
      \ (str): Directory to save the feature importance plot.\n        seed (int):\
      \ Seed for reproducibility\n        \n    Example:\n    ```bash\n    python\
      \ scripts/feat_imp.py \\\n        --transformed_training_data='data/processed/X_train_trans.csv'\
