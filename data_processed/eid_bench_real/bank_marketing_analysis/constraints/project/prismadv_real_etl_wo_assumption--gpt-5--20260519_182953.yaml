prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: false
    downstream_task_description: 'Whole RealETLBench project for Bank Marketing Analysis.
      It reads tables bank_marketing. Project scripts: eda reads bank_marketing and
      writes eda_categorical_variables.png, eda_continuous_variables.png, eda_log_variables.png,
      summary.json; feature_importance reads bank_marketing and writes feat_imp.png,
      summary.json; fit_classifier reads bank_marketing and writes logistic_pipeline.pickle,
      all_models.csv, lr_model.csv, summary.json; preprocess reads bank_marketing
      and writes bank_train.csv, bank_test.csv, X_train.csv, X_test.csv, y_train.csv,
      y_test.csv, X_train_resmp.csv, y_train_resmp.csv, X_train_trans.csv, bank_preprocessor.pickle,
      summary.json.'
  llm:
    model_name: gpt-5
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
