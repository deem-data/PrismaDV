    - text: Null (missing) values are allowed in 'poutcome'; the pipeline imputes
        missing categorical values with the most frequent category.
      sources:
      - start_line: 92
        end_line: 94
        file: source_repo/scripts/split_and_process.py
      - start_line: 95
        end_line: 102
        file: source_repo/scripts/split_and_process.py
      uid: 823a3e8a-a40d-451c-b946-c869a89c6eac
    - text: The 'poutcome' column is categorical (not a free-form text field) and
        is one-hot encoded during preprocessing.
      sources:
      - start_line: 75
        end_line: 79
        file: source_repo/scripts/split_and_process.py
      - start_line: 92
        end_line: 94
        file: source_repo/scripts/split_and_process.py
      uid: d8aa260d-574f-403b-8dcf-c12d121e6b75
    - text: 'All non-null values in ''poutcome'' should be one of the known categories:
        {''failure'', ''other'', ''success''}.'
      sources:
