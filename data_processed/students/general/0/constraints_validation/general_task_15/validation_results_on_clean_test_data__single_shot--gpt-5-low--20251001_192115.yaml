results:
  Admission grade:
    code:
    - suggestion: '.hasMax(''Admission grade'', lambda v: v <= 200.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Admission grade'', lambda v: v >= 0.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Admission grade')
      status: true
      reason_if_failed: ''
      level: error
  Age at enrollment:
    code:
    - suggestion: '.hasMax(''Age at enrollment'', lambda v: v <= 80)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Age at enrollment'', lambda v: v >= 15)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Age at enrollment')
      status: true
      reason_if_failed: ''
      level: error
  Application order:
    code:
    - suggestion: .isComplete('Application order')
      status: true
      reason_if_failed: ''
      level: error
  "Daytime/evening attendance\t":
    code:
    - suggestion: .isComplete('Daytime/evening attendance\t')
      status: true
      reason_if_failed: ''
      level: error
  GDP:
    code:
    - suggestion: '.hasMax(''GDP'', lambda v: v <= 3.51)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''GDP'', lambda v: v >= -4.06)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('GDP')
      status: true
      reason_if_failed: ''
      level: error
  Inflation rate:
    code:
    - suggestion: '.hasMax(''Inflation rate'', lambda v: v <= 3.7)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Inflation rate'', lambda v: v >= -0.8)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Inflation rate')
      status: true
      reason_if_failed: ''
      level: error
  Previous qualification (grade):
    code:
    - suggestion: '.hasMax(''Previous qualification (grade)'', lambda v: v <= 200.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Previous qualification (grade)'', lambda v: v >= 0.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Previous qualification (grade)')
      status: true
      reason_if_failed: ''
      level: error
  Sem1 approved <= enrolled:
    code:
    - suggestion: '.satisfies(''`Curricular units 1st sem (approved)` <= `Curricular
        units 1st sem (enrolled)`'', ''sem1_approved_le_enrolled'', lambda v: v ==
        1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem1 evals >= approved:
    code:
    - suggestion: '.satisfies(''`Curricular units 1st sem (evaluations)` >= `Curricular
        units 1st sem (approved)`'', ''sem1_evals_ge_approved'', lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem1 evals >= noeval:
    code:
    - suggestion: '.satisfies(''`Curricular units 1st sem (evaluations)` >= `Curricular
        units 1st sem (without evaluations)`'', ''sem1_evals_ge_noeval'', lambda v:
        v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem1 noeval <= enrolled:
    code:
    - suggestion: '.satisfies(''`Curricular units 1st sem (without evaluations)` <=
        `Curricular units 1st sem (enrolled)`'', ''sem1_noeval_le_enrolled'', lambda
        v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem1 zero-enrolled implies zero counts:
    code:
    - suggestion: '.satisfies(''(`Curricular units 1st sem (enrolled)` > 0) OR ((`Curricular
        units 1st sem (approved)` = 0) AND (`Curricular units 1st sem (without evaluations)`
        = 0) AND (`Curricular units 1st sem (evaluations)` = 0))'', ''sem1_zero_enrolled_zero_counts'',
        lambda v: v >= 0.99)'
      status: true
      reason_if_failed: ''
      level: error
  Sem2 approved <= enrolled:
    code:
    - suggestion: '.satisfies(''`Curricular units 2nd sem (approved)` <= `Curricular
        units 2nd sem (enrolled)`'', ''sem2_approved_le_enrolled'', lambda v: v ==
        1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem2 evals >= approved:
    code:
    - suggestion: '.satisfies(''`Curricular units 2nd sem (evaluations)` >= `Curricular
        units 2nd sem (approved)`'', ''sem2_evals_ge_approved'', lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem2 evals >= noeval:
    code:
    - suggestion: '.satisfies(''`Curricular units 2nd sem (evaluations)` >= `Curricular
        units 2nd sem (without evaluations)`'', ''sem2_evals_ge_noeval'', lambda v:
        v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem2 noeval <= enrolled:
    code:
    - suggestion: '.satisfies(''`Curricular units 2nd sem (without evaluations)` <=
        `Curricular units 2nd sem (enrolled)`'', ''sem2_noeval_le_enrolled'', lambda
        v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sem2 zero-enrolled implies zero counts:
    code:
    - suggestion: '.satisfies(''(`Curricular units 2nd sem (enrolled)` > 0) OR ((`Curricular
        units 2nd sem (approved)` = 0) AND (`Curricular units 2nd sem (without evaluations)`
        = 0) AND (`Curricular units 2nd sem (evaluations)` = 0))'', ''sem2_zero_enrolled_zero_counts'',
        lambda v: v >= 0.99)'
      status: true
      reason_if_failed: ''
      level: error
  Target:
    code:
    - suggestion: .isComplete('Target')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('Target', ['Graduate', 'Dropout', 'Enrolled'])
      status: true
      reason_if_failed: ''
      level: error
  Unemployment rate:
    code:
    - suggestion: '.hasMax(''Unemployment rate'', lambda v: v <= 16.2)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Unemployment rate'', lambda v: v >= 7.6)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Unemployment rate')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isUnique('id')
      status: true
      reason_if_failed: ''
      level: error
