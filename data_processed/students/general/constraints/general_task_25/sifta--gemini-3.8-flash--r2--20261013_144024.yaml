      \ approved units (`enrolled >= approved` / `approved <= enrolled`) because a\
      \ student cannot pass courses they did not enroll in.\n   - CRITICAL DOMAIN\
      \ RULE: Do NOT assume `enrolled >= without evaluations`, `enrolled >= credited`,\
      \ or `evaluations <= enrolled`. In student academic records, evaluations can\
      \ exceed enrolled units (multiple exam sessions per course), credited units\
      \ transfer from prior institutions regardless of enrollment, and units without\
      \ evaluations may be recorded from past terms or special regimes even with 0\
      \ enrolled units. Formulating relational assumptions for these creates false\
      \ alarms on safe data.\n4. Categorical Domains & Indicator Flags: Allowable\
      \ value sets for discrete categories or binary indicators (e.g., 0 or 1 for\
