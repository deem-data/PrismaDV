prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_file = os.path.join(args.input, 'new_data.csv')\n\
  \    df = pd.read_csv(input_file)\n\n    enrolled_col = 'Curricular units 1st sem\
  \ (enrolled)'\n    evals_col = 'Curricular units 1st sem (evaluations)'\n    without_col\
  \ = 'Curricular units 1st sem (without evaluations)'\n    approved_col = 'Curricular\
  \ units 1st sem (approved)'\n    credited_col = 'Curricular units 1st sem (credited)'\n\
  \    grade_col = 'Curricular units 1st sem (grade)'\n    debtor_col = 'Debtor'\n\
  \    uptodate_col = 'Tuition fees up to date'\n    intl_col = 'International'\n\
  \    nat_col = 'Nacionality'\n\n    numeric_cols = [enrolled_col, evals_col, without_col,\
  \ approved_col, credited_col,\n                    grade_col, debtor_col, uptodate_col,\
  \ intl_col, nat_col]\n    for c in numeric_cols:\n        df[c] = pd.to_numeric(df[c],\
  \ errors='coerce')\n\n    enrolled = df[enrolled_col].astype(float)\n    evals =\
  \ df[evals_col].astype(float)\n    without_evals = df[without_col].astype(float)\n\
  \    approved = df[approved_col].astype(float)\n    credited = df[credited_col].astype(float)\n\
  \    grade = df[grade_col].astype(float)\n    debtor = df[debtor_col].astype(int)\n\
  \    uptodate = df[uptodate_col].astype(int)\n    international = df[intl_col].astype(int)\n\
  \    nationality = df[nat_col].astype(int)\n    attended = enrolled - without_evals\n\
  \    with np.errstate(divide='ignore', invalid='ignore'):\n        evaluation_rate\
  \ = np.where(enrolled > 0, attended / enrolled, 0.0)\n    with np.errstate(divide='ignore',\
  \ invalid='ignore'):\n        pass_rate = np.where(evals > 0, approved / evals,\
  \ 0.0)\n    with np.errstate(divide='ignore', invalid='ignore'):\n        credit_ratio\
  \ = np.where(enrolled > 0, credited / enrolled, 0.0)\n    grade_norm = grade / 20.0\n\
  \n    intl_rate = (international == 1).mean()\n    compliance_rate = (uptodate ==\
  \ 1).mean()\n    fees_flag = (uptodate == 0).astype(float)\n\n    base_risk = (\n\
  \            0.35 * (1.0 - pass_rate) +\n            0.20 * (1.0 - evaluation_rate)\
  \ +\n            0.20 * (1.0 - credit_ratio) +\n            0.20 * (1.0 - grade_norm)\
  \ +\n            0.05 * debtor.astype(float)\n    )\n    intl_uplift = 0.05 * (international\
  \ == 1).astype(float)\n    risk_score = np.clip(base_risk + intl_uplift, 0.0, 1.0)\n\
  \n    threshold = 0.60 - 0.10 * (compliance_rate - 0.90)\n    threshold = float(np.clip(threshold,\
  \ 0.40, 0.80))\n\n    advisory_flag = risk_score >= threshold\n\n    hold_required\
  \ = ((uptodate == 0) | (debtor == 1))\n    strict_hold = hold_required & advisory_flag\n\
  \n    hold_reason = np.where(strict_hold, 'FEE+ACADEMIC', np.where(hold_required,\
  \ 'FEE', 'NONE'))\n    hold_severity = np.where(strict_hold, 'STRICT', np.where(hold_required,\
  \ 'STANDARD', 'NONE'))\n\n    out = pd.DataFrame({\n        'student_index': df.index,\n\
  \        'dropout_risk_score': (risk_score * 100.0).round(2),\n        'risk_threshold':\
  \ np.full(len(df), round(threshold, 4)),\n        'risk_flag': np.where(advisory_flag,\
  \ 'HIGH', 'LOW'),\n        'tuition_hold': hold_required.astype(int),\n        'hold_severity':\
  \ hold_severity,\n        'hold_reason': hold_reason,\n        'evaluation_rate':\
  \ np.round(evaluation_rate, 4),\n        'pass_rate': np.round(pass_rate, 4),\n\
  \        'credit_ratio': np.round(credit_ratio, 4),\n        'fees_flag': fees_flag.astype(int),\n\
  \        'debtor': debtor,\n        'tuition_up_to_date': uptodate,\n        'international':\
  \ international,\n        'nationality': nationality\n    })\n\n    os.makedirs(args.output,\
  \ exist_ok=True)\n    out_path = os.path.join(args.output, 'early_warning_scores.csv')\n\
  \    out.to_csv(out_path, index=False)\n\n    summary = {\n        'records': int(len(df)),\n\
  \        'avg_dropout_risk_score': float(np.round(out['dropout_risk_score'].mean(),\
  \ 2)),\n        'hold_rate': float(np.round(out['tuition_hold'].mean(), 4)),\n \
  \       'compliance_rate': float(np.round(compliance_rate, 4)),\n        'international_rate':\
  \ float(np.round(intl_rate, 4)),\n        'risk_threshold': float(np.round(threshold,\
  \ 4))\n    }\n    with open(os.path.join(args.output, 'early_warning_summary.json'),\
  \ 'w') as f:\n        json.dump(summary, f)\n\n\nif __name__ == '__main__':\n  \
  \  main()\n\n```\n\nThe same program is on disk at `./code/general_task_25.py`,\
