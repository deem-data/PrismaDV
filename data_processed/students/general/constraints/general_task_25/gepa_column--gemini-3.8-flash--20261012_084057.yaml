      \ [allowed_values])`.\n   - Never rely solely on `.satisfies(\"Target = 'Dropout'\"\
      , ..., lambda x: x > 0)` when the valid domain is known; `.isContainedIn` catches\
      \ unexpected categories, typos, and corrupted labels.\n\n3. **Numeric Bounding\
