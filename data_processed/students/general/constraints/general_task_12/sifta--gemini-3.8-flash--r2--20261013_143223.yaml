      \ >= credited`, or `evaluations <= enrolled` at error level. These relationships\
      \ legitimately vary in valid cohorts and cause false alarms.\n- Categorical\
      \ Domains: Use `.isContainedIn(column, allowed_values)` when the column is expected\
