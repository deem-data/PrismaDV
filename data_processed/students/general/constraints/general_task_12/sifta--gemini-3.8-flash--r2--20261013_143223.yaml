      \ for range checks when domain bounds are required by downstream logic.\n- Relational\
      \ Checks:\n  - When an assumption specifies a strict relational invariant between\
      \ columns (specifically `enrolled >= approved` or `approved <= enrolled`), use\
      \ `.isGreaterThanOrEqualTo(columnA, columnB)` or `.isLessThanOrEqualTo(columnA,\
