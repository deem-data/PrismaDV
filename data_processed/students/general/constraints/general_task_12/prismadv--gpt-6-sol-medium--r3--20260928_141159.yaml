        end_line: 45
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      uid: 664ef9af-f604-4391-b4ed-cc337672ae50
    - text: If 'Curricular units 1st sem (enrolled)' is zero, then 'Curricular units
        1st sem (evaluations)', 'Curricular units 1st sem (approved)', and 'Curricular
        units 1st sem (without evaluations)' should all be zero. The code assigns
        a zero evaluation ratio when enrollment is zero, so nonzero activity in that
        case would be concealed by the fallback.
      sources:
      - start_line: 39
        end_line: 45
        file: ''
      uid: 1628bd70-98b7-4189-88ef-7bf94dcc10ec
