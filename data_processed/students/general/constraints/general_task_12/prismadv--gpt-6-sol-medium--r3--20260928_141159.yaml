      source_assumptions:
      - 1628bd70-98b7-4189-88ef-7bf94dcc10ec
    assumptions:
    - text: All four first-semester curricular-unit counts should be non-null and
        non-negative after numeric conversion. Nulls or negative counts would make
        the engagement ratios and risk score unreliable. This can be checked with
        a row-level constraint requiring each of the four columns to be IS NOT NULL
        and >= 0.
      sources:
      - start_line: 20
        end_line: 36
        file: ''
      - start_line: 39
        end_line: 45
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      uid: f7b59d82-ad7c-44f1-84c8-c1a543b868a6
    - text: For each student, 'Curricular units 1st sem (without evaluations)' should
        not exceed 'Curricular units 1st sem (enrolled)'. The former counts a subset
        of enrolled units. A Deequ constraint could use .satisfies('`Curricular units
        1st sem (without evaluations)` <= `Curricular units 1st sem (enrolled)`',
        'without_evaluations_within_enrolled').
      sources:
      - start_line: 39
        end_line: 44
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      uid: f199c4ca-036b-4403-94d7-c583622d2f98
    - text: For each student, 'Curricular units 1st sem (approved)' should not exceed
        either 'Curricular units 1st sem (enrolled)' or 'Curricular units 1st sem
        (evaluations)'. Approval should correspond to an enrolled unit that was evaluated.
        Check both inequalities row by row; do not assume evaluations are at most
        enrolled, because a unit may have multiple evaluations.
      sources:
