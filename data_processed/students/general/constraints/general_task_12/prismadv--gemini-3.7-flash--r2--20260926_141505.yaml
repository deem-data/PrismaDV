    code: []
    assumptions:
    - text: 'The number of approved curricular units in the first semester (''Curricular
        units 1st sem (approved)'') should be less than or equal to the number of
        enrolled curricular units in the first semester (''Curricular units 1st sem
        (enrolled)''), because a student cannot approve more courses than they enrolled
