        units 1st sem (approved)'') should be less than or equal to the number of
        evaluations (''Curricular units 1st sem (evaluations)'') for each record.
        This ensures that the computed ''approved_ratio'' (s1_approved / s1_eval)
        remains within a valid normalized range [0.0, 1.0]. We could represent this
        assumption as a Deequ constraint like: .satisfies("`Curricular units 1st sem
