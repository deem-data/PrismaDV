  '["Admission grade","Previous qualification (grade)"]':
    code: []
    assumptions:
    - text: 'Both ''Admission grade'' and ''Previous qualification (grade)'' must
        not be null for each record, as arithmetic operations (sum and absolute difference)
        are performed between them to compute ''prep_mean'' and ''prep_closeness''.
        If either is null/NaN, ''risk_prep'' and subsequently ''risk_score'' will
        be NaN. We could represent this constraint in Deequ as: .satisfies("`Admission
        grade` IS NOT NULL AND `Previous qualification (grade)` IS NOT NULL", "adm_and_pq_complete")'
      sources:
      - start_line: 56
        end_line: 61
        file: ''
      - start_line: 78
        end_line: 79
        file: ''
      - start_line: 87
        end_line: 88
        file: ''
      uid: 2d328f64-9687-4ce3-9739-49425552f54e
    - text: 'Both ''Admission grade'' and ''Previous qualification (grade)'' are assumed
        to be on the standard 0-200 grading scale, where their average is normalized
        by dividing by 200.0 and their difference is compared against a factor of
        50.0. We could represent this constraint in Deequ as: .satisfies("`Admission
        grade` >= 0 AND `Admission grade` <= 200 AND `Previous qualification (grade)`
        >= 0 AND `Previous qualification (grade)` <= 200", "grades_range_0_to_200")'
      sources:
      - start_line: 56
        end_line: 61
        file: ''
      uid: 6df8d28e-c55c-4106-a271-a61f18f8710d
