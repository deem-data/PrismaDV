prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    os.makedirs(args.output, exist_ok=True)\n\n    input_csv = os.path.join(args.input,\
  \ 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\n    # Ensure numeric types\
  \ for fields used downstream\n    numeric_cols = [\n        'Curricular units 1st\
  \ sem (enrolled)',\n        'Curricular units 1st sem (evaluations)',\n        'Curricular\
  \ units 1st sem (without evaluations)',\n        'Curricular units 1st sem (approved)',\n\
  \        'Curricular units 1st sem (grade)',\n        'Curricular units 2nd sem\
  \ (grade)',\n        'Admission grade',\n        'Previous qualification (grade)',\n\
  \        'Debtor',\n        'Tuition fees up to date',\n        'Scholarship holder',\n\
  \        'Application order'\n    ]\n    for c in numeric_cols:\n        if c in\
  \ df.columns:\n            df[c] = pd.to_numeric(df[c], errors='coerce')\n\n   \
  \ # 1st semester academic engagement features\n    s1_enrolled = df['Curricular\
  \ units 1st sem (enrolled)']\n    s1_eval = df['Curricular units 1st sem (evaluations)']\n\
  \    s1_without = df['Curricular units 1st sem (without evaluations)']\n    s1_approved\
  \ = df['Curricular units 1st sem (approved)']\n    s1_grade = df['Curricular units\
  \ 1st sem (grade)']\n    eval_ratio = np.where(s1_enrolled > 0, s1_eval / s1_enrolled,\
  \ 0.0)\n    approved_ratio = np.where(s1_eval > 0, s1_approved / s1_eval, 0.0)\n\
  \n    # Grade features and stability between semesters\n    g1 = s1_grade\n    g2\
  \ = df['Curricular units 2nd sem (grade)']\n    avg_grade = (g1 + g2) / 2.0\n  \
  \  grade_diff = (g1 - g2).abs()\n    consistency = 1.0 - (grade_diff / 6.0)\n  \
  \  consistency = np.clip(consistency, 0.0, 1.0)\n\n    # Preparedness features from\
  \ pre-entry grades\n    adm = df['Admission grade']\n    pq = df['Previous qualification\
  \ (grade)']\n    prep_mean = (adm + pq) / 2.0\n    prep_score = prep_mean / 200.0\n\
  \    prep_closeness = 1.0 - (np.abs(adm - pq) / 50.0)\n    prep_closeness = np.clip(prep_closeness,\
  \ 0.0, 1.0)\n\n    # Financial status features\n    debtor = df['Debtor'].astype('Int64')\n\
  \    fees_ok = df['Tuition fees up to date'].astype('Int64')\n    schol = df['Scholarship\
  \ holder'].astype('Int64')\n    # Application order features\n    app_order = df['Application\
  \ order']\n    # Risk components\n    lack_eval_flag = (s1_without > 0).astype(int)\n\
  \    risk_engagement = 0.7 * (1.0 - eval_ratio) + 0.3 * (1.0 - approved_ratio) +\
  \ 0.1 * lack_eval_flag\n    risk_engagement = np.clip(risk_engagement, 0.0, 1.0)\n\
  \n    risk_grades = 1.0 - (avg_grade / 20.0)\n    risk_grades = risk_grades * (1.0\
  \ + (1.0 - consistency) * 0.5)\n    risk_grades = np.clip(risk_grades, 0.0, 1.0)\n\
  \n    risk_prep = (1.0 - prep_score) * 0.75 + (1.0 - prep_closeness) * 0.25\n  \
  \  risk_prep = np.clip(risk_prep, 0.0, 1.0)\n\n    risk_financial = 0.6 * debtor.astype(float).values\
  \ + 0.4 * (1.0 - fees_ok.astype(float).values)\n    risk_financial = risk_financial\
  \ + np.where((schol == 1) & (fees_ok == 0), 0.2, 0.0)\n    risk_financial = np.clip(risk_financial,\
  \ 0.0, 1.0)\n\n    app_adj = np.where(app_order == 1, -0.05, 0.0) + np.where(app_order.isin([0,\
  \ 9]), 0.05, 0.0)\n\n    risk_score = 0.35 * risk_engagement + 0.25 * risk_grades\
  \ + 0.20 * risk_prep + 0.20 * risk_financial + app_adj\n    risk_score = np.clip(risk_score,\
  \ 0.0, 1.0)\n\n    # Outputs\n    out = pd.DataFrame({\n        'student_id': np.arange(len(df))\
  \ + 1,\n        'risk_score': risk_score,\n        'risk_engagement': risk_engagement,\n\
  \        'risk_grades': risk_grades,\n        'risk_prep': risk_prep,\n        'risk_financial':\
  \ risk_financial,\n        'Application order': app_order,\n        'Debtor': debtor,\n\
  \        'Tuition fees up to date': fees_ok,\n        'Scholarship holder': schol,\n\
  \        'Curricular units 1st sem (grade)': g1,\n        'Curricular units 2nd\
  \ sem (grade)': g2,\n        'eval_ratio_1st': eval_ratio,\n        'approved_ratio_1st':\
  \ approved_ratio,\n    })\n\n    bins = [0.0, 0.33, 0.66, 1.0]\n    labels = ['low',\
  \ 'medium', 'high']\n    out['risk_band'] = pd.cut(out['risk_score'], bins=bins,\
  \ labels=labels, include_lowest=True, right=True)\n\n    out['recommended_action']\
  \ = np.where((out['risk_financial'] >= 0.5) & (out['risk_score'] >= 0.4),\n    \
  \                                     'tuition_collection', 'retention_outreach')\n\
  \n    out['priority_score'] = out['risk_score'] * 0.7 + out['risk_financial'] *\
  \ 0.3 + np.where(\n        out['recommended_action'] == 'tuition_collection', 0.05,\
  \ 0.0)\n\n    out_sorted = out.sort_values(by=['priority_score', 'risk_score'],\
  \ ascending=[False, False])\n\n    out_file = os.path.join(args.output, 'student_risk_scores.csv')\n\
  \    out_sorted.to_csv(out_file, index=False)\n\n    retention_queue = out_sorted[out_sorted['recommended_action']\
  \ == 'retention_outreach'].head(200)\n    tuition_queue = out_sorted[out_sorted['recommended_action']\
  \ == 'tuition_collection'].head(200)\n\n    retention_queue.to_csv(os.path.join(args.output,\
  \ 'retention_queue.csv'), index=False)\n    tuition_queue.to_csv(os.path.join(args.output,\
  \ 'tuition_collection_queue.csv'), index=False)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_12.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
