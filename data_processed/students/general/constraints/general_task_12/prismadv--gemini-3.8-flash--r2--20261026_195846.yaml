  '["Admission grade","Previous qualification (grade)"]':
    code: []
    assumptions:
    - text: 'Both ''Admission grade'' and ''Previous qualification (grade)'' must
        be non-null concurrently across records. The code calculates their average
        ''(adm + pq) / 2.0'' and absolute difference ''np.abs(adm - pq)'' without
        handling missing values; if either column contains NaN, ''risk_prep'', ''risk_score'',
        and subsequent binned risk bands will evaluate to NaN. We could represent
        this assumption as a deequ constraint like this: .satisfies("`Admission grade`
        IS NOT NULL AND `Previous qualification (grade)` IS NOT NULL", "grades_complete_together")'
      sources:
