        end_line: 79
        file: ''
      uid: ccfe072e-a6ca-44ee-afa3-03913894db0e
    - text: 'Both ''Admission grade'' and ''Previous qualification (grade)'' are assumed
        to be non-negative numeric grades measured on the same standard scale (between
        0 and 200). The code computes their normalized average by dividing by 200.0
        and measures their difference relative to 50.0 (''1.0 - (np.abs(adm - pq)
        / 50.0)''). We could represent this assumption as a deequ constraint like
        this: .satisfies("`Admission grade` >= 0 AND `Admission grade` <= 200 AND
        `Previous qualification (grade)` >= 0 AND `Previous qualification (grade)`
        <= 200", "valid_grade_ranges")'
