prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_file = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\n    # Column aliases for\
  \ readability\n    c1_enrolled = 'Curricular units 1st sem (enrolled)'\n    c1_evals\
  \ = 'Curricular units 1st sem (evaluations)'\n    c1_approved = 'Curricular units\
  \ 1st sem (approved)'\n    c1_credited = 'Curricular units 1st sem (credited)'\n\
  \    c1_without = 'Curricular units 1st sem (without evaluations)'\n    c1_grade\
  \ = 'Curricular units 1st sem (grade)'\n\n    c2_enrolled = 'Curricular units 2nd\
  \ sem (enrolled)'\n    c2_evals = 'Curricular units 2nd sem (evaluations)'\n   \
  \ c2_approved = 'Curricular units 2nd sem (approved)'\n    c2_credited = 'Curricular\
  \ units 2nd sem (credited)'\n    c2_without = 'Curricular units 2nd sem (without\
  \ evaluations)'\n\n    debtor_col = 'Debtor'\n    tuition_col = 'Tuition fees up\
  \ to date'\n\n    numeric_cols = [\n        c1_enrolled, c1_evals, c1_approved,\
  \ c1_credited, c1_without, c1_grade,\n        c2_enrolled, c2_evals, c2_approved,\
  \ c2_credited, c2_without,\n        debtor_col, tuition_col\n    ]\n    for col\
  \ in numeric_cols:\n        df[col] = pd.to_numeric(df[col], errors='coerce')\n\
  \    evals1_safe = df[c1_evals].replace(0, np.nan)\n    pass_rate_1 = (df[c1_approved]\
  \ / evals1_safe).fillna(0.0)\n    missing_recorded_1 = df[c1_enrolled] - (df[c1_evals]\
  \ + df[c1_without])\n    coverage_gap_1 = np.where(df[c1_enrolled] > 0, missing_recorded_1\
  \ / df[c1_enrolled], 0.0)\n    grade_norm_1 = df[c1_grade] / 20.0\n    grade_risk\
  \ = 1.0 - grade_norm_1\n    evals2_safe = df[c2_evals].replace(0, np.nan)\n    pass_rate_2\
  \ = (df[c2_approved] / evals2_safe).fillna(0.0)\n    missing_recorded_2 = df[c2_enrolled]\
  \ - (df[c2_evals] + df[c2_without])\n    coverage_gap_2 = np.where(df[c2_enrolled]\
  \ > 0, missing_recorded_2 / df[c2_enrolled], 0.0)\n\n    zero_share_without2 = (df[c2_without]\
  \ == 0).mean()\n    non_zero_share_without2 = max(1.0 - zero_share_without2, 1e-6)\n\
  \    rarity_multiplier = np.log1p(1.0 / non_zero_share_without2)\n    rare_event_penalty\
  \ = (df[c2_without] > 0).astype(float) * (0.05 * rarity_multiplier)\n\n    # Financial\
  \ status -> fee risk\n    fee_risk = np.where(df[tuition_col] == 1, 0.0, np.where(df[debtor_col]\
  \ == 1, 1.0, 0.3))\n\n    # Build dropout risk score (higher = higher risk)\n  \
  \  risk_score = (\n            0.25 * (1.0 - pass_rate_1) +\n            0.25 *\
  \ (1.0 - pass_rate_2) +\n            0.10 * coverage_gap_1 +\n            0.15 *\
  \ coverage_gap_2 +\n            0.15 * grade_risk +\n            0.20 * fee_risk\
  \ +\n            rare_event_penalty\n    )\n    risk_score = np.maximum(risk_score,\
  \ 0.0)\n\n    out = pd.DataFrame({\n        'student_row_id': np.arange(len(df)),\n\
  \        'risk_score': risk_score.round(6),\n        'fee_risk': fee_risk.round(6),\n\
  \        'pass_rate_1': pass_rate_1.round(6),\n        'pass_rate_2': pass_rate_2.round(6),\n\
  \        'coverage_gap_1': np.round(coverage_gap_1, 6),\n        'coverage_gap_2':\
  \ np.round(coverage_gap_2, 6),\n        'grade_risk': np.round(grade_risk, 6),\n\
  \    })\n\n    # Priority banding to drive advisor queue\n    quantiles = out['risk_score'].quantile([0.7,\
  \ 0.9]).values\n    low_cut, high_cut = quantiles[0], quantiles[1]\n    conditions\
  \ = [\n        out['risk_score'] >= high_cut,\n        (out['risk_score'] >= low_cut)\
  \ & (out['risk_score'] < high_cut),\n        out['risk_score'] < low_cut\n    ]\n\
  \    choices = ['High', 'Medium', 'Low']\n    out['priority'] = np.select(conditions,\
  \ choices, default='Low')\n\n    out.sort_values(['priority', 'risk_score'], ascending=[True,\
  \ False], inplace=True)\n\n    # Persist outputs\n    out_file = os.path.join(args.output,\
  \ 'weekly_dropout_risk_scores.csv')\n    out.to_csv(out_file, index=False)\n\n \
  \   # Export top 200 for immediate advisor outreach\n    top_k = out[out['priority']\
  \ == 'High'].head(200)\n    top_file = os.path.join(args.output, 'advisor_intervention_queue.csv')\n\
  \    top_k.to_csv(top_file, index=False)\n\n\nif __name__ == '__main__':\n    main()\n\
  \n```\n\nThe same program is on disk at `./code/general_task_35.py`, so you can\
