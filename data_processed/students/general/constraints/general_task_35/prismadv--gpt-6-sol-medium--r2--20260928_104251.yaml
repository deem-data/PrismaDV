        disjoint portions of enrolled units, their sum should not exceed first-semester
        enrollment. This keeps the computed coverage gap nonnegative. Constraint:
        enrolled >= 0 AND evaluations >= 0 AND without_evaluations >= 0 AND evaluations
        + without_evaluations <= enrolled.'
      sources:
      - start_line: 45
        end_line: 46
        file: ''
