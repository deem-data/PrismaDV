    - text: 'For each student, first-semester curricular units credited should not
        exceed first-semester curricular units enrolled. Constraint: credited >= 0
        AND credited <= enrolled. The code does not establish that credited and approved
        units are disjoint, so it does not justify constraining their sum.'
      sources:
