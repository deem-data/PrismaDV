    assumptions:
    - text: 'For each student, the number of first-semester curricular units approved
        should not exceed the number enrolled. This keeps approvals consistent with
        the enrollment count used in the first-semester risk calculation. Constraint:
        approved >= 0 AND approved <= enrolled.'
      sources:
