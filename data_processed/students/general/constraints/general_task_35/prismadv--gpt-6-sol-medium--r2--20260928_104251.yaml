    - text: 'For each student, first-semester units approved should not exceed first-semester
        evaluations; if evaluations are zero, approvals should be zero. Otherwise,
        the computed pass rate can exceed 1 or a positive approval count can be hidden
        by the zero-denominator fallback. Constraint: approved >= 0 AND approved <=
        evaluations.'
