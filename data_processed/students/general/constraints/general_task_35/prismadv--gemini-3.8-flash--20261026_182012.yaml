        end_line: 46
        file: ''
      - start_line: 63
        end_line: 72
        file: ''
      uid: 402c6127-537c-4a99-a4fe-49e3ed601c02
    - text: 'If a student has 0 enrolled units in the first semester, they should
        not have any recorded evaluations or units without evaluations. That is, if
        ''Curricular units 1st sem (enrolled)'' == 0, then ''Curricular units 1st
        sem (evaluations)'' == 0 and ''Curricular units 1st sem (without evaluations)''
