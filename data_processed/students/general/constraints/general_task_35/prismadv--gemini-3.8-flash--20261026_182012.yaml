        end_line: 46
        file: ''
      uid: ee9d562a-153b-4206-a6cf-753f663fcb74
    - text: 'The code calculates ''missing_recorded_1'' as ''Curricular units 1st
        sem (enrolled) - (Curricular units 1st sem (evaluations) + Curricular units
        1st sem (without evaluations))'' and divides it by enrolled units to compute
        ''coverage_gap_1''. This assumes that ''Curricular units 1st sem (evaluations)''
        plus ''Curricular units 1st sem (without evaluations)'' does not exceed ''Curricular
        units 1st sem (enrolled)'' so that the coverage gap remains a valid non-negative
        ratio. We can represent this assumption as a Deequ constraint: .satisfies("`Curricular
        units 1st sem (evaluations)` + `Curricular units 1st sem (without evaluations)`
        <= `Curricular units 1st sem (enrolled)`", "Evaluations and without evaluations
        sum should not exceed enrolled units")'
      sources:
