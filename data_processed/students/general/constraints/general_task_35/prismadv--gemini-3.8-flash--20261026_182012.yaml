    assumptions:
    - text: 'The number of units without evaluations in the first semester should
        not exceed the number of enrolled units, i.e., ''Curricular units 1st sem
        (without evaluations)'' <= ''Curricular units 1st sem (enrolled)''. We can
        represent this assumption as a Deequ constraint: .satisfies("`Curricular units
        1st sem (without evaluations)` <= `Curricular units 1st sem (enrolled)`",
