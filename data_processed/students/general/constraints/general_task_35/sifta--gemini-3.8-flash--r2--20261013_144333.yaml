      \ 0-20 scale for semester curricular unit grades, 0-200 scale for previous qualification\
      \ and admission grades.\n3. Relational & Cross-Column Invariants: When the code\
      \ computes ratios or differences involving the target column and other columns,\
      \ formulate relational assumptions ONLY for true domain invariants where a violation\
      \ logically cannot happen in valid data and would silently corrupt calculations:\n\
