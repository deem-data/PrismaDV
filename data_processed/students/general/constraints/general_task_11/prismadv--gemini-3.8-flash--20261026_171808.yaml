        linear financial risk formula (0.6 * Debtor + 0.3 * (1 - Tuition fees up to
        date) - 0.2 * Scholarship holder) assumes these columns take only 0 or 1 so
        that the relative weights and risk contributions scale as intended. We could
        represent this assumption as a Deequ constraint like: .satisfies("`Debtor`
        IN (0, 1) AND `Tuition fees up to date` IN (0, 1) AND `Scholarship holder`
