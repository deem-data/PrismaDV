      source_assumptions:
      - d7aad5b4-d3c9-4762-b94f-65eebe2019a8
    assumptions:
    - text: The input must contain an 'Admission grade' column, allowing for leading
        or trailing whitespace in its header because the code strips column names
        before accessing it.
      sources:
      - start_line: 27
        end_line: 30
        file: ''
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 67
        end_line: 71
        file: ''
      uid: dca4bf62-f0e6-4309-8a6e-c9bd2a48d8aa
    - text: Every 'Admission grade' value should be present, numeric-convertible,
        and finite. The column is reported as complete, but numeric conversion coerces
        invalid values to null, and the subsequent calculation does not fill them.
      sources:
      - start_line: 67
        end_line: 71
        file: ''
      - start_line: 93
        end_line: 95
        file: ''
      uid: d3ea0693-c1f2-4902-935a-7b5dcc2e1ef8
    - text: Admission grades should be on the expected 0-to-200 scale. Values outside
        this range are clipped when normalized, losing their original magnitude. The
        resulting preparedness value is calculated but is not used in the final risk
        score.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 120
        end_line: 128
        file: ''
      uid: d7aad5b4-d3c9-4762-b94f-65eebe2019a8
