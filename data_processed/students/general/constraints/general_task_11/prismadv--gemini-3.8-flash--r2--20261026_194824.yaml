    assumptions:
    - text: 'The ''Tuition fees up to date'' column should not contain null or missing
        values. The script uses the column in arithmetic operations `(1 - df[c_fees])`
        without handling missing values or filling NaNs, which would result in NaN
        risk scores and missing values in downstream priority tiers. We could represent
        this assumption as a deequ constraint like this: .isComplete("Tuition fees
        up to date")'
      sources:
