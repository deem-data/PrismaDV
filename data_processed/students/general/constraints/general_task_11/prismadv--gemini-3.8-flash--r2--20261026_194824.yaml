    - text: 'The ''Unemployment rate'' column should contain numeric values or strings
        convertible to numeric data type, as mathematical operations (subtraction
        and division) are applied directly to normalize it. We could represent this
        assumption as a deequ constraint like this: .hasDataType(''Unemployment rate'',
        ConstrainableDataTypes.Fractional)'
