      uid: d29a47d6-2106-4c36-ad82-3734dee4bc52
    - text: 'The ''Unemployment rate'' column is assumed to represent percentage values
        (e.g., between 0 and 100, centered around 5% to 20% given the normalization
        `(Unemployment rate - 5) / 15.0`), rather than proportions between 0 and 1.
        Values should be non-negative. We could represent this assumption as a deequ
        constraint like this: .satisfies(''`Unemployment rate` >= 0 AND `Unemployment
        rate` <= 100'', ''Unemployment rate percentage range'', lambda x: x == 1.0)'
