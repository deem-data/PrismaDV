      uid: 5822213b-0166-463c-a223-2b953b9b3687
    - text: 'The ''Tuition fees up to date'' column should contain binary indicator
        values (0 or 1). The formula `0.3 * (1 - df[c_fees])` assumes that 1 indicates
        fees are paid/up to date (adding 0 to financial risk) and 0 indicates fees
        are overdue (adding 0.3 to financial risk). We could represent this assumption
        as a deequ constraint like this: .isContainedIn("Tuition fees up to date",
        ["0", "1"])'
      sources:
      - start_line: 70
