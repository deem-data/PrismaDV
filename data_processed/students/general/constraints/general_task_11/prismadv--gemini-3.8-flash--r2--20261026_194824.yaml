    - text: 'The columns ''Debtor'', ''Tuition fees up to date'', and ''Scholarship
        holder'' are assumed to be binary indicator variables taking values in {0,
        1}. The financial risk calculation uses ''1 - df[Tuition fees up to date]''
        as a complement operation and combines all three variables with fixed weights
        expecting them to be in the [0, 1] range. We could represent this assumption
