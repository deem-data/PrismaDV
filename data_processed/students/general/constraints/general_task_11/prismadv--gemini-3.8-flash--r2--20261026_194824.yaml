    assumptions:
    - text: 'The columns ''Debtor'', ''Tuition fees up to date'', and ''Scholarship
        holder'' must all be non-null across the dataset. The code calculates ''financial_risk''
        as a linear combination of these three columns (0.6 * df[''Debtor''] + 0.3
        * (1 - df[''Tuition fees up to date'']) - 0.2 * df[''Scholarship holder''])
        without handling or imputing missing values. If any of these columns contains
        null values, the resulting ''financial_risk'', ''risk_score'', and ''priority_tier''
        will evaluate to NaN. We could represent this assumption as a deequ constraint
        like this:

        .satisfies("`Debtor` IS NOT NULL AND `Tuition fees up to date` IS NOT NULL
        AND `Scholarship holder` IS NOT NULL", "Financial columns must not be null")'
