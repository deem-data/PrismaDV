    content: "<returncode>0</returncode>\n<output>\nimport json\nimport os\nimport\
      \ subprocess\nimport tempfile\nimport time\n\nimport oyaml as yaml\nfrom langchain_core.prompts\
      \ import ChatPromptTemplate\n\nfrom prismadv.data_models import Constraints\n\
      from prismadv.dq_manager import DeequDataQualityManager\nfrom prismadv.loader\
      \ import FileLoader\nfrom prismadv.project_manager.manager.base import ProjectManager\n\
      from prismadv.llm_backend.model_routes import litellm_route\nfrom prismadv.utils\
      \ import get_project_root\nfrom workflow_prismadv.utils.spark_cleanup import\
      \ close_spark_session\nfrom workflow_prismadv.utils.replicates import select_scripts,\
      \ artifact_filename, existing_artifacts, normalize_replicate\nfrom workflow_prismadv.eid_bench_real_baselines.pipelines.run_mini_swe_agent\
      \ import mini_environment\nfrom workflow_prismadv.utils.swe_agent_usage import\
      \ cost_summary_from_trajectory\n\nMETHOD = \"mini_swe_agent\"\n\nTASK_PROMPT\
      \ = \"\"\"Write a pydeequ data unit test for a dataset consumed by the following\
      \ program.\n\nHere are two examples of data samples and the corresponding constraints\
      \ that should be generated.\n---------------------------------------\n\n###\
      \ First Example:\n\nHere is sample of data that can be processed by the program:\n\
      \n name  age\nAlice   25\n  Bob   30\nCarol   22\n Dave   40\n  Eve   28\n\n\
      Here is the program:\n\nfor row['age'] in df.iterrows():\n    if row['age']\
      \ < 0:\n        raise ValueError(\"Age cannot be negative\")\n\nHere is the\
      \ desired output:\n\n{{\n    \"constraints\": [\n        {{\n            'column_name':\
      \ 'age',\n            'code_for_constraint': \".isComplete('age')\",\n     \
      \   }},\n        {{\n            'column_name': 'age',\n            'code_for_constraint':\
      \ \".isNonNegative('age')\",\n        }},   \n    ]\n}}\n\n# Second Example:\n\
      \nHere is sample of data that can be processed by the program:\n\n name  age\n\
      Alice   25\n NULL   30\nCarol   22\n NULL   40\n  Eve   28\n\nHere is the program:\n\
      \nunique_names = df['name'].dropna().unique().tolist()\nsend_notifications(unique_names)\n\
      \nHere is the desired output:\n\n{{\n    \"constraints\": [\n        {{\n  \
      \          'column_name': 'name',\n            'code_for_constraint': \".hasNumberOfDistinctValues('name',\
      \ lambda x: x > 0)\",\n        }},\n        \n    ]\n}}\n\n\n---------------------------------------\n\
      \nNOW I WILL GIVE YOU THE ACTUAL TASK DETAILS.\n\nHere is sample of data that\
      \ can be processed by the program:\n\n{data_sample}\n\nHere is the program:\n\
      \n{code}\n\nFocus on the python code for the Check object from pydeequ only.\
      \ Create a file called `constraints.json` as output.\n\nHere is an example output:\n\
      \n{{\n    \"constraints\": [\n        {{\n            'column_name': 'some_column',\n\
      \            'code_for_constraint': \".isComplete('some_column')\",\n      \
      \  }},\n        {{\n            'column_name': 'another_column',\n         \
      \   'code_for_constraint': \".isPositive('another_column')\",\n        }}\n\
      \    ]\n}}\n\nPlease make sure the constraints.json is the output file in the\
      \ current folder.\n\"\"\"\n\n\ndef run_mini_swe_agent(dataset_name, subtask_name,\
      \ processed_data_label, model_name, replicate=None,\n                      \
      \ script_stems=None):\n    max_retries = 3\n    replicate = normalize_replicate(replicate)\n\
      \    project_manager = ProjectManager(project_root=get_project_root(), dataset_name=dataset_name)\n\
      \    dq_manager = DeequDataQualityManager()\n    train_data = FileLoader.load_csv(\n\
      \        project_manager.get_observed_data_path(subtask_name, processed_data_label)\n\
      \    )\n    spark_train_data, spark_train = dq_manager.spark_df_from_pandas_df(train_data)\n\
      \    example_rows = train_data.sample(3).to_dict(orient=\"records\")\n\n   \
      \ script_path_list = project_manager.get_available_script_path_list_for_subtask(subtask_name=subtask_name)\n\
      \    for script_path in select_scripts(script_path_list, script_stems):\n  \
      \      constraints_path = project_manager.get_source_constraints_path(subtask_name,\
      \ script_path.stem)\n        constraints_path.mkdir(parents=True, exist_ok=True)\n\
      \        constraint_output_path = constraints_path / make_output_filename(model_name,\
      \ replicate)\n        existing = existing_artifacts(constraints_path, METHOD,\
      \ model_name, replicate)\n        if existing:\n            print(f\"Constraints\
      \ file {existing[-1]} already exists (replicate {replicate}). Skipping...\"\
      )\n            continue\n        source_code, assertions = FileLoader.load_py_file(script_path).extract_assertions()\n\
      \        assert \"# ASSERTION START\" not in str(source_code)\n\n        input_variables\
      \ = {\n            \"code\": source_code,\n            \"data_sample\": example_rows,\n\
      \        }\n        print(f\"Running SWE-agent for dataset: {dataset_name},\
      \ \")\n        print(f\"subtask: {subtask_name}, processed_data_label: {processed_data_label},\
      \ \"\n              f\"script: {script_path.stem}, model: {model_name}\")\n\
      \        prompt = ChatPromptTemplate.from_template(TASK_PROMPT)\n        prompt_content\
      \ = prompt.invoke(input_variables).to_messages()[0].content\n        output\
      \ = {}\n\n        with tempfile.TemporaryDirectory() as temp_dir:\n        \
      \    os.chdir(temp_dir)\n            task_file_path = os.path.join(temp_dir,\
      \ \"task.txt\")\n            with open(task_file_path, \"w\", encoding=\"utf-8\"\
      ) as f:\n                f.write(prompt_content)\n\n            print(f\"Running\
      \ Mini SWE Agent in {temp_dir}\")\n            # Wall-clock of the whole episode,\
      \ retries included; tokens, calls and\n            # cost are read back off\
      \ the trajectory the agent writes.\n            started = time.perf_counter()\n\
      \            failed_attempts = []\n            for attempt in range(max_retries):\n\
      \                try:\n                    command = f\"mini --model \\\"{litellm_route(model_name)}\\\
      \" --task \\\"Solve the task specified in task.txt.\\\" --output trajectory.json\
      \ --cost-limit 0.50 --yolo --exit-immediately\"\n                    result\
      \ = subprocess.run(command, shell=True, capture_output=True, text=True,\n  \
      \                                          env=mini_environment())\n       \
      \             print(result)\n                    with open(\"./constraints.json\"\
      , \"r\", encoding=\"utf-8\") as f:\n                        raw_constraints\
      \ = json.load(f)['constraints']\n                    with open(\"./trajectory.json\"\
      , \"r\", encoding=\"utf-8\") as f:\n                        trajectory_container\
      \ = json.load(f)\n\n                    code_list_for_constraints = [item[\"\
      code_for_constraint\"] for item in raw_constraints]\n                    break\n\
      \                except Exception as e:\n                    print(f\"mini-swe-agent\
      \ attempt {attempt + 1}/{max_retries} failed: {e}\")\n                    #\
      \ The attempt still cost tokens; keep its trajectory for the bill.\n       \
      \             if os.path.exists(\"./trajectory.json\"):\n                  \
      \      try:\n                            with open(\"./trajectory.json\", \"\
      r\", encoding=\"utf-8\") as f:\n                                failed_attempts.append(json.load(f))\n\
      \                        except json.JSONDecodeError:\n                    \
      \        pass\n                    if attempt < max_retries - 1:\n         \
      \               continue\n                    else:\n                      \
      \  raise e\n            elapsed_s = time.perf_counter() - started\n\n      \
      \      code_list_for_constraints_valid = dq_manager.filter_valid_constraints_on_spark(\n\
      \                code_list_for_constraints, spark_train, spark_train_data)\n\
      \            constraints = Constraints.from_deequ_output(raw_constraints, code_list_for_constraints_valid)\n\
      \n            output['replicate'] = replicate\n            output['raw_constraints']\
      \ = raw_constraints\n            output['trajectory'] = trajectory_container\n\
      \            output['failed_attempt_trajectories'] = failed_attempts\n     \
      \       output['constraints'] = constraints.to_dict()\n            output['cost_summary']\
      \ = cost_summary_from_trajectory(trajectory_container, elapsed_s, failed_attempts)\n\
      \            with open(constraint_output_path, \"w\", encoding=\"utf-8\") as\
      \ f:\n                yaml.dump(output, f, allow_unicode=True)\n    close_spark_session(spark_train)\n\
      \n\ndef make_output_filename(model_name, replicate=None) -> str:\n    return\
      \ artifact_filename(METHOD, model_name, replicate)\n</output>"
