    content: "<returncode>0</returncode>\n<output>\nimport argparse\nimport os\n\n\
      import numpy as np\nimport pandas as pd\n\n\ndef robust_divide(numer, denom,\
      \ default=0.0):\n    numer = np.asarray(numer)\n    denom = np.asarray(denom)\n\
      \    out = np.empty_like(numer, dtype=float)\n    mask = denom != 0\n    out[mask]\
      \ = numer[mask] / denom[mask]\n    out[~mask] = default\n    return out\n\n\n\
      parser = argparse.ArgumentParser()\nparser.add_argument('--input', type=str,\
      \ required=True)\nparser.add_argument('--output', type=str, required=True)\n\
      args = parser.parse_args()\n\nos.makedirs(args.output, exist_ok=True)\n\n# Load\
      \ data\ninput_csv = os.path.join(args.input, 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\
      \n# Normalize column names (trim whitespace)\ndf.columns = [c.strip() for c\
      \ in df.columns]\n\n# Column aliases\nc_target = 'Target'\nc_day = 'Daytime/evening\
      \ attendance'\nc_age = 'Age at enrollment'\nc_app_order = 'Application order'\n\
      \nc1_enr = 'Curricular units 1st sem (enrolled)'\nc1_app = 'Curricular units\
      \ 1st sem (approved)'\nc1_cred = 'Curricular units 1st sem (credited)'\nc1_woeval\
      \ = 'Curricular units 1st sem (without evaluations)'\nc1_grade = 'Curricular\
      \ units 1st sem (grade)'\n\nc2_enr = 'Curricular units 2nd sem (enrolled)'\n\
      c2_app = 'Curricular units 2nd sem (approved)'\nc2_cred = 'Curricular units\
      \ 2nd sem (credited)'\nc2_woeval = 'Curricular units 2nd sem (without evaluations)'\n\
      c2_grade = 'Curricular units 2nd sem (grade)'\n\nc_debtor = 'Debtor'\nc_fees\
      \ = 'Tuition fees up to date'\nc_scholar = 'Scholarship holder'\n\nc_prev_grade\
      \ = 'Previous qualification (grade)'\nc_admission = 'Admission grade'\n\nc_unemp\
      \ = 'Unemployment rate'\nc_gdp = 'GDP'\nc_infl = 'Inflation rate'\n\n# Ensure\
      \ numeric types for numeric columns used downstream\nnumeric_cols = [\n    c_day,\
      \ c_age, c_app_order,\n    c1_enr, c1_app, c1_cred, c1_woeval, c1_grade,\n \
      \   c2_enr, c2_app, c2_cred, c2_woeval, c2_grade,\n    c_debtor, c_fees, c_scholar,\n\
      \    c_prev_grade, c_admission,\n    c_unemp, c_gdp, c_infl\n]\nfor col in numeric_cols:\n\
      \    df[col] = pd.to_numeric(df[col], errors='coerce')\n\n# ASSERTION_START\n\
      # Guard Target assumptions before filtering\nallowed_targets = {'Graduate',\
      \ 'Dropout', 'Enrolled'}\nassert df[c_target].isin(allowed_targets).all()\n\n\
      # ASSERTION_END\n# Keep only currently enrolled for scoring; use all rows for\
      \ global calibrations where needed\nis_enrolled = df[c_target] == 'Enrolled'\n\
      \n# ASSERTION_START\n# Application order is used in risk scoring; guard before\
      \ use\nassert (df[c_app_order] >= 1).all()\n# ASSERTION_END\n# ASSERTION_START\n\
      # Daytime/evening and age are used to shape behavioral risk; guard before use\n\
      assert df[c_day].isin([0, 1]).all()\nassert (df[c_age] >= 16).all()\n# ASSERTION_END\n\
      # ASSERTION_START\n# Academic structure constraints for 1st semester; guard\
      \ before computing ratios\ne1 = df[c1_enr]\na1 = df[c1_app]\ncr1 = df[c1_cred]\n\
      w1 = df[c1_woeval]\ng1 = df[c1_grade]\nassert (e1 >= 0).all()\nassert (a1 >=\
      \ 0).all()\nassert (cr1 >= 0).all()\nassert (w1 >= 0).all()\nassert (a1 <= e1).all()\n\
      assert (cr1 <= e1).all()\nassert (w1 <= e1).all()\nassert (g1 >= 0).all()\n\
      # ASSERTION_END\n# ASSERTION_START\n# Academic structure constraints for 2nd\
      \ semester; guard before computing ratios\ne2 = df[c2_enr]\na2 = df[c2_app]\n\
      cr2 = df[c2_cred]\nw2 = df[c2_woeval]\ng2 = df[c2_grade]\nassert (e2 >= 0).all()\n\
      assert (a2 >= 0).all()\nassert (cr2 >= 0).all()\nassert (w2 >= 0).all()\nassert\
      \ (a2 <= e2).all()\nassert (cr2 <= e2).all()\nassert (w2 <= e2).all()\nassert\
      \ (g2 >= 0).all()\n# ASSERTION_END\n# ASSERTION_START\n# Financial constraints\
      \ are used in financial risk calculation; guard before use\nassert df[c_debtor].isin([0,\
      \ 1]).all()\nassert df[c_fees].isin([0, 1]).all()\nassert df[c_scholar].isin([0,\
      \ 1]).all()\n\n# ASSERTION_END\n# ASSERTION_START\n# Admissions and prior grades\
      \ inform preparedness; guard before using in normalization\nassert (df[c_admission]\
      \ >= 0).all()\nassert (df[c_prev_grade] >= 0).all()\n# ASSERTION_END\n# ASSERTION_START\n\
      # Macroeconomic indicators shape overall headwinds; guard before building macro\
      \ risk\nassert (df[c_unemp] >= 0).all()\nassert df[c_gdp].notna().all()\nassert\
      \ df[c_infl].notna().all()\n# ASSERTION_END\n# Build features needed for risk\
      \ scoring\napproval_rate_1 = robust_divide(df[c1_app], df[c1_enr], default=1.0)\n\
      woeval_rate_1 = robust_divide(df[c1_woeval], df[c1_enr], default=0.0)\ncredit_rate_1\
      \ = robust_divide(df[c1_cred], df[c1_enr], default=1.0)\n\ngrade1_norm = (df[c1_grade]\
      \ / 20.0).clip(0, 1)\n\napproval_rate_2 = robust_divide(df[c2_app], df[c2_enr],\
      \ default=1.0)\nwoeval_rate_2 = robust_divide(df[c2_woeval], df[c2_enr], default=0.0)\n\
      credit_rate_2 = robust_divide(df[c2_cred], df[c2_enr], default=1.0)\n\ngrade2_norm\
      \ = (df[c2_grade] / 20.0).clip(0, 1)\n\n# Academic performance and engagement\n\
      fail_rate_1 = robust_divide(df[c1_enr] - df[c1_app], df[c1_enr], default=0.0).clip(0,\
      \ 1)\nfail_rate_2 = robust_divide(df[c2_enr] - df[c2_app], df[c2_enr], default=0.0).clip(0,\
      \ 1)\nno_eval_rate = 0.5 * woeval_rate_1 + 0.5 * woeval_rate_2\n\n# Preparedness\n\
      adm_norm = (df[c_admission] / 200.0).clip(0, 1)\nprev_norm = (df[c_prev_grade]\
      \ / 200.0).clip(0, 1)\npreparedness = (0.6 * adm_norm + 0.4 * prev_norm)\n\n\
      # Financial risk\nfinancial_risk = (0.6 * df[c_debtor] + 0.3 * (1 - df[c_fees])\
      \ - 0.2 * df[c_scholar]).clip(0, 1)\n\n# Attendance and age effects\nis_day\
      \ = (df[c_day] == 1).astype(int)\nage_norm = ((df[c_age] - 16) / (70 - 16)).clip(0,\
      \ 1)\nattendance_risk = ((1 - is_day) * 0.25 + age_norm * 0.15).clip(0, 1)\n\
      \n# Application order effect (higher order => higher risk)\napp_risk = ((df[c_app_order]\
      \ - 1) / 8.0).clip(0, 1) * 0.2\n\n# Macro headwinds\nunemp_norm = ((df[c_unemp]\
      \ - 5) / 15.0).clip(0, 1)\ngdp_headwind = ((5 - df[c_gdp]) / 10.0).clip(0, 1)\n\
      infl_norm = ((df[c_infl] + 2) / 7.0).clip(0, 1)\nmacro_risk = (0.7 * unemp_norm\
      \ + 0.2 * gdp_headwind + 0.1 * infl_norm).clip(0, 1)\n\n# Aggregate academic\
      \ risk (poor grades, failures, lack of evaluations)\nacademic_perf = (0.25 *\
      \ approval_rate_1 + 0.25 * approval_rate_2 + 0.25 * grade1_norm + 0.25 * grade2_norm)\n\
      engagement_penalty = (0.6 * (fail_rate_1 * 0.5 + fail_rate_2 * 0.5) + 0.4 *\
      \ no_eval_rate).clip(0, 1)\nacademic_risk = (1 - academic_perf) * 0.6 + engagement_penalty\
      \ * 0.4\nacademic_risk = academic_risk.clip(0, 1)\n\n# Combine components into\
      \ final risk score\nraw_risk = (\n        0.45 * academic_risk +\n        0.25\
      \ * financial_risk +\n        0.15 * attendance_risk +\n        0.10 * macro_risk\
      \ +\n        0.05 * app_risk\n)\nrisk_score = raw_risk.clip(0, 1)\n\n# Create\
      \ output for enrolled students only\nenrolled_scores = df.loc[is_enrolled, [c_target]].copy()\n\
      enrolled_scores['row_id'] = enrolled_scores.index\nenrolled_scores['risk_score']\
      \ = risk_score[is_enrolled].values\n\n# Priority tiers\nbins = [0.0, 0.4, 0.7,\
      \ 1.0]\nlabels = ['Low', 'Medium', 'High']\nenrolled_scores['priority_tier']\
      \ = pd.cut(enrolled_scores['risk_score'], bins=bins, labels=labels, include_lowest=True,\n\
      \                                          right=True)\n\n# Sort by highest\
      \ risk first for advisor outreach queue\nenrolled_scores = enrolled_scores.sort_values('risk_score',\
      \ ascending=False)\n\n# Output files\nscores_path = os.path.join(args.output,\
      \ 'weekly_dropout_risk_scores.csv')\nqueue_path = os.path.join(args.output,\
      \ 'advisor_outreach_queue.csv')\n\n# Minimal output columns for downstream systems\n\
      enrolled_scores[['row_id', 'risk_score', 'priority_tier']].to_csv(scores_path,\
      \ index=False)\n\n# Top N queue (e.g., top 200 highest risk)\nTOP_N = min(200,\
      \ len(enrolled_scores))\nenrolled_scores.head(TOP_N)[['row_id', 'risk_score',\
      \ 'priority_tier']].to_csv(queue_path, index=False)\n\nprint(f\"Wrote {len(enrolled_scores)}\
      \ enrolled student risk scores to {scores_path}\")\nprint(f\"Wrote top {TOP_N}\
      \ advisor outreach queue to {queue_path}\")\n\n</output>"
