    - text: 'The ''Unemployment rate'' column should not contain null values, as missing
        values are not imputed and would propagate as NaN through the macro risk calculation,
        resulting in NaN risk scores and missing priority tiers in the final student
        ranking and outreach queue. We could represent this assumption as a deequ
        constraint like this: .isComplete(''Unemployment rate'')'
      sources:
      - start_line: 109
        end_line: 109
        file: ''
      - start_line: 112
        end_line: 112
        file: ''
      - start_line: 121
