        file: ''
      uid: df1e03ca-24c6-4775-a27a-da79e861e42f
    - text: 'The ''Unemployment rate'' column values represent percentage rates and
        are expected to be non-negative (>= 0). The script scales values using `(rate
        - 5) / 15.0` and clips them to [0, 1], indicating an expected baseline range
        around 5% to 20%. We could represent this assumption as a deequ constraint
        like this: .satisfies(''`Unemployment rate` >= 0'', ''Non-negative Unemployment
        Rate'', lambda x: x == 1.0)'
      sources:
