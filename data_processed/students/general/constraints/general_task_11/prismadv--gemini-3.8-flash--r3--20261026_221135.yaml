        values, as it is converted to numeric and directly used in arithmetic calculations
        (1 - df[''Tuition fees up to date'']) to compute financial risk without any
        null-imputation. Null values would propagate to risk scores and priority tiers.
        We could represent this assumption as a deequ constraint like this: .isComplete(''Tuition
        fees up to date'')'
      sources:
