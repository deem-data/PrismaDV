      uid: 924ac3d5-7347-4a42-b304-cb4505297ae3
    - text: 'The ''Tuition fees up to date'' column should be numeric and contain
        binary values (0 or 1), indicating whether tuition fees are up to date, as
        downstream logic uses ''1 - df[c_fees]'' in risk calculations. We could represent
        this assumption as a deequ constraint like this: .isContainedIn(''Tuition
        fees up to date'', [''0'', ''1'', 0, 1])'
