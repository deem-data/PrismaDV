    assumptions:
    - text: 'The ''Unemployment rate'' column should be of numeric type (or convertible
        to numeric) because the code converts it via `pd.to_numeric` and performs
        mathematical operations such as subtraction and division. We could represent
        this assumption as a deequ constraint like this: .isDataType(''Unemployment
