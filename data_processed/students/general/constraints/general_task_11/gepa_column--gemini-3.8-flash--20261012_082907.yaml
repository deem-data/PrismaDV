      ### Line Numbering Guidelines\n- **1-based indexing**: Line 1 corresponds to\
      \ the very first line of the provided `code_script`.\n- **Count every line**:\
      \ Blank lines, comments, and docstrings count towards line numbering. Do not\
      \ skip or shift lines.\n- **Multi-line statements**: If an expression or statement\
