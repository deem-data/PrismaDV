  ? '["Curricular units 1st sem (enrolled)","Curricular units 1st sem (grade)","Curricular
    units 2nd sem (enrolled)","Curricular units 2nd sem (grade)"]'
  : code: []
    assumptions:
    - text: 'The columns ''Curricular units 1st sem (enrolled)'', ''Curricular units
        2nd sem (enrolled)'', ''Curricular units 1st sem (grade)'', and ''Curricular
        units 2nd sem (grade)'' are used to compute a weighted average grade: when
        the total enrolled units (''Curricular units 1st sem (enrolled)'' + ''Curricular
        units 2nd sem (enrolled)'') is greater than 0, the weighted grade sum (''Curricular
        units 1st sem (grade)'' * ''Curricular units 1st sem (enrolled)'' + ''Curricular
        units 2nd sem (grade)'' * ''Curricular units 2nd sem (enrolled)'') divided
        by total enrolled units is assumed to yield a grade between 0.0 and 20.0.
        We could represent this assumption as a Deequ constraint like: .satisfies("(`Curricular
        units 1st sem (enrolled)` + `Curricular units 2nd sem (enrolled)` <= 0) OR
        ((`Curricular units 1st sem (grade)` * `Curricular units 1st sem (enrolled)`
        + `Curricular units 2nd sem (grade)` * `Curricular units 2nd sem (enrolled)`)
        / (`Curricular units 1st sem (enrolled)` + `Curricular units 2nd sem (enrolled)`)
        >= 0.0 AND (`Curricular units 1st sem (grade)` * `Curricular units 1st sem
        (enrolled)` + `Curricular units 2nd sem (grade)` * `Curricular units 2nd sem
        (enrolled)`) / (`Curricular units 1st sem (enrolled)` + `Curricular units
        2nd sem (enrolled)`) <= 20.0)")'
      sources:
      - start_line: 49
        end_line: 53
        file: ''
      uid: c8ba8123-b679-45e9-8411-bf99777bb2e2
