  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport json\nimport pandas as pd\nimport numpy as np\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\nos.makedirs(args.output,\
  \ exist_ok=True)\n\ninput_csv = os.path.join(args.input, 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\
  \nc1_en = 'Curricular units 1st sem (enrolled)'\nc1_ev = 'Curricular units 1st sem\
  \ (evaluations)'\nc1_ap = 'Curricular units 1st sem (approved)'\nc1_wo = 'Curricular\
  \ units 1st sem (without evaluations)'\nc1_gr = 'Curricular units 1st sem (grade)'\n\
  \nc2_en = 'Curricular units 2nd sem (enrolled)'\nc2_ev = 'Curricular units 2nd sem\
  \ (evaluations)'\nc2_ap = 'Curricular units 2nd sem (approved)'\nc2_wo = 'Curricular\
  \ units 2nd sem (without evaluations)'\nc2_gr = 'Curricular units 2nd sem (grade)'\n\
  \nadm_gr = 'Admission grade'\ndebtor_col = 'Debtor'\npaid_col = 'Tuition fees up\
  \ to date'\nintl_col = 'International'\n\nto_numeric_cols = [c1_en, c1_ev, c1_ap,\
  \ c1_wo, c1_gr,\n                   c2_en, c2_ev, c2_ap, c2_wo, c2_gr,\n       \
  \            adm_gr, debtor_col, paid_col, intl_col]\nfor col in to_numeric_cols:\n\
  \    df[col] = pd.to_numeric(df[col], errors='coerce')\n\neligible1 = df[c1_en]\
  \ - df[c1_wo]\npass_rate1 = np.where(eligible1 > 0, df[c1_ap] / eligible1, 0.0)\n\
  \neligible2 = df[c2_en] - df[c2_wo]\npass_rate2 = np.where(eligible2 > 0, df[c2_ap]\
  \ / eligible2, 0.0)\n\neligible_total = eligible1 + eligible2\napproved_total =\
  \ df[c1_ap] + df[c2_ap]\npass_rate = np.where(eligible_total > 0, approved_total\
  \ / eligible_total, 0.0)\nenrolled_total = df[c1_en] + df[c2_en]\nweighted_avg_grade\
  \ = np.where(enrolled_total > 0,\n                              (df[c1_gr] * df[c1_en]\
  \ + df[c2_gr] * df[c2_en]) / enrolled_total,\n                              0.0)\n\
  grade_shortfall = 1.0 - (weighted_avg_grade / 20.0)\nadmission_risk = 1.0 - (df[adm_gr]\
  \ / 200.0)\nintl_modifier = 0.03 * df[intl_col]\nfinancial_flag = np.where((df[paid_col]\
  \ == 0) | (df[debtor_col] == 1), 1.0, 0.0)\n\nscore_raw = (\n    0.45 * financial_flag\
  \ +\n    0.30 * (1.0 - pass_rate) +\n    0.15 * grade_shortfall +\n    0.07 * admission_risk\
  \ +\n    intl_modifier\n)\n\nrisk_score = np.clip(score_raw, 0.0, 1.0)\n\ndf_out\
  \ = pd.DataFrame({\n    'student_row': np.arange(len(df)),\n    'risk_score': risk_score,\n\
  \    'financial_flag': financial_flag.astype(int),\n    'pass_rate': pass_rate,\n\
  \    'weighted_avg_grade': weighted_avg_grade,\n    'admission_grade': df[adm_gr],\n\
  \    'International': df[intl_col].astype(int)\n})\n\npriority_labels = np.where(df_out['risk_score']\
  \ >= 0.65, 'high',\n                           np.where(df_out['risk_score'] >=\
  \ 0.40, 'medium', 'low'))\ndf_out['priority'] = priority_labels\ndf_out['priority_rank']\
  \ = df_out['risk_score'].rank(method='first', ascending=False).astype(int)\n\nn_queue\
  \ = int(max(1, min(int(len(df_out) * 0.1), 500)))\noutreach_queue = df_out.sort_values(by='risk_score',\
  \ ascending=False).head(n_queue)\n\nscores_path = os.path.join(args.output, 'risk_scores.csv')\n\
  queue_path = os.path.join(args.output, 'outreach_queue.csv')\nmetrics_path = os.path.join(args.output,\
  \ 'metrics.json')\n\ndf_out.to_csv(scores_path, index=False)\noutreach_queue.to_csv(queue_path,\
  \ index=False)\n\nmetrics = {\n    'num_records': int(len(df)),\n    'pct_paid_up':\
  \ float((df[paid_col] == 1).mean()),\n    'pct_debtor': float((df[debtor_col] ==\
  \ 1).mean()),\n    'pct_domestic': float((df[intl_col] == 0).mean()),\n    'avg_risk_score':\
  \ float(df_out['risk_score'].mean()),\n    'high_risk_count': int((df_out['priority']\
  \ == 'high').sum()),\n    'medium_risk_count': int((df_out['priority'] == 'medium').sum()),\n\
  \    'low_risk_count': int((df_out['priority'] == 'low').sum())\n}\n\nwith open(metrics_path,\
  \ 'w') as f:\n    json.dump(metrics, f, indent=2)\n\n```\n\nThe same program is\
