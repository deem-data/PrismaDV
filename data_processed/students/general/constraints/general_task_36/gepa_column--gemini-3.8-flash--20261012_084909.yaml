      \ Asserts fraction of non-null values.\n- **Categorical Allowed Values:**\n\
      \  - `.isContainedIn('column_name', ['val1', 'val2', ...])` — Asserts that all\
      \ values belong to the allowed set.\n- **Numeric Bounds (Min / Max):**\n  -\
      \ `.hasMin('column_name', lambda x: x >= min_val)`\n  - `.hasMax('column_name',\
      \ lambda x: x <= max_val)`\n  - `.isNonNegative('column_name')` — Asserts all\
      \ values are `>= 0`.\n  - `.isPositive('column_name')` — Asserts all values\
      \ are `> 0`.\n- **Uniqueness & Distinctness:**\n  - `.isUnique('column_name')`\
      \ — Asserts 100% uniqueness.\n  - `.hasUniqueness('column_name', lambda x: x\
      \ >= threshold)`\n- **Data Type:**\n  - `.hasDataType('column_name', ConstrainableDataTypes.Fractional)`\
      \ (or `Integral`, `String`, `Boolean`).\n- **SQL Condition Satisfaction:**\n\
      \  - `.satisfies(\"condition\", \"constraint_name\", assertion=None)` — Evaluates\
      \ a SQL expression across rows. If no lambda assertion is passed, Deequ defaults\
      \ to requiring 100% of rows to satisfy the condition (`Check.IsOne`).\n- **Dataset\
      \ Size:**\n  - `.hasSize(lambda x: x > 0)` — Asserts row count.\n\n### FORBIDDEN\
      \ / Non-Existent Methods\n- **DO NOT** use `.isBetween(...)` — PyDeequ **does\
      \ not** have an `.isBetween` method. Always use `.hasMin('column_name', lambda\
      \ x: x >= min_val)` and `.hasMax('column_name', lambda x: x <= max_val)` separately.\n\
      - **DO NOT** use `.isIn(...)` — Use `.isContainedIn(...)`.\n- **DO NOT** invent\
      \ custom method names not present in the PyDeequ `Check` class.\n\n---\n\n##\
      \ 4. Constraint Design Strategies\n\n1. **Completeness (`.isComplete`)**:\n\
      \   - If `completeness: 1.0` in `target_column_desc` and the script performs\
