      \ or positive quantities (e.g., units, counts, fees, credits, age). Use `.satisfies(...)`\
      \ for range checks when domain bounds are required by downstream logic.\n- Relational\
      \ Checks:\n  - When an assumption specifies a strict relational invariant between\
      \ columns (specifically `enrolled >= approved` or `approved <= enrolled`), use\
      \ `.isGreaterThanOrEqualTo(columnA, columnB)` or `.isLessThanOrEqualTo(columnA,\
      \ columnB)`.\n  - Do NOT assert `enrolled >= without evaluations`, `enrolled\
      \ >= credited`, or `evaluations <= enrolled` at error level. These relationships\
      \ legitimately vary in valid cohorts and cause false alarms.\n- Categorical\
      \ Domains: Use `.isContainedIn(column, allowed_values)` when the column is expected\
      \ to be within a specific set of valid discrete values.\n\nConstraint Level\
      \ Assignment:\n- Set level \"error\" when violating the check causes the code\
      \ to crash (e.g., unhandled NaNs in arithmetic or `.astype(int)`, unhandled\
