        2nd sem (enrolled)'', ''Curricular units 1st sem (grade)'', and ''Curricular
        units 2nd sem (grade)'' are combined to compute the weighted average grade:
        `(df[''Curricular units 1st sem (grade)''] * df[''Curricular units 1st sem
        (enrolled)''] + df[''Curricular units 2nd sem (grade)''] * df[''Curricular
        units 2nd sem (enrolled)'']) / (df[''Curricular units 1st sem (enrolled)'']
        + df[''Curricular units 2nd sem (enrolled)''])`. These columns are assumed
        to be non-negative numeric values, and when the sum of enrolled units is greater
        than 0, the resulting weighted average grade is expected to be between 0 and
        20 without missing values. We could represent this assumption as a Deequ constraint
        like: .satisfies(''( `Curricular units 1st sem (enrolled)` + `Curricular units
        2nd sem (enrolled)` = 0 ) OR ((`Curricular units 1st sem (grade)` * `Curricular
        units 1st sem (enrolled)` + `Curricular units 2nd sem (grade)` * `Curricular
        units 2nd sem (enrolled)`) / (`Curricular units 1st sem (enrolled)` + `Curricular
        units 2nd sem (enrolled)`) >= 0 AND (`Curricular units 1st sem (grade)` *
        `Curricular units 1st sem (enrolled)` + `Curricular units 2nd sem (grade)`
        * `Curricular units 2nd sem (enrolled)`) / (`Curricular units 1st sem (enrolled)`
        + `Curricular units 2nd sem (enrolled)`) <= 20)'', ''valid_weighted_avg_grade'')'
