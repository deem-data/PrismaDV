  : code:
    - suggestion: .satisfies('CASE WHEN `Curricular units 1st sem (enrolled)` IS NULL
        OR `Curricular units 2nd sem (enrolled)` IS NULL OR `Curricular units 1st
        sem (enrolled)` < 0 OR `Curricular units 2nd sem (enrolled)` < 0 THEN FALSE
