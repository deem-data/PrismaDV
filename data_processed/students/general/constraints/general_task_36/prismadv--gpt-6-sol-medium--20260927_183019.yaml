    assumptions:
    - text: Both semester enrollment counts should be non-null and non-negative. Both
        semester grades should be numeric and non-null whenever either semester has
        enrolled units; otherwise, the weighted-grade calculation can produce a missing
        value or silently treat a missing enrollment count as zero. This can be checked
        with a row-level constraint requiring both enrollments to be non-null and
        >= 0, and requiring both grades to be non-null when their enrollment sum is
        > 0.
      sources:
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 49
        end_line: 52
        file: ''
      uid: 3ed48fbc-fe17-4966-b8c3-6ccdec90cc16
    - text: The 1st- and 2nd-semester grades should use the same 0-to-20 scale whenever
        either semester has enrolled units. The code combines them into one enrollment-weighted
        average and divides that average by 20 to calculate grade shortfall. A row-level
        constraint can require both grades to be between 0 and 20 when the sum of
        the two enrollment counts is > 0.
      sources:
      - start_line: 49
        end_line: 53
        file: ''
      uid: 778e53f8-08c9-4eea-9c0d-1dc1a2407066
    - text: If a semester has zero enrolled curricular units, its grade should be
        zero; a nonzero grade for a semester with no enrollment would be ignored by
        the enrollment-weighted calculation. Check this implication separately for
        the 1st-semester enrollment and grade pair and the 2nd-semester enrollment
        and grade pair.
      sources:
      - start_line: 49
        end_line: 52
        file: ''
      uid: d7c87b7e-6bd6-4047-a466-36c93d9718dc
