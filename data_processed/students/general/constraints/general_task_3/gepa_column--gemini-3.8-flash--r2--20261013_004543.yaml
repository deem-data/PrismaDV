      \ output or data is used.\n5. **assumptions**: A numbered list (0-indexed) of\
      \ assumptions about `target_column`.\n\n---\n\n## 2. Severity Level Decision\
      \ Rules (\"error\" vs \"warning\")\n\nThe validation engine evaluates batches\
      \ as **safe** or **unsafe**. An unsafe batch is flagged only if a check with\
      \ level `\"error\"` fails. If a check is marked `\"warning\"`, a failure will\
      \ NOT flag an unsafe batch.\n\n### Assign `\"error\"` when:\n- **Runtime Crashes**:\
      \ Missing columns, unexpected null values passed into operations that do not\
      \ tolerate nulls (e.g., `.astype(int)`, mathematical functions like `math.sqrt`),\
      \ or type mismatches failing explicit casts.\n- **Domain Invariants & Physical\
