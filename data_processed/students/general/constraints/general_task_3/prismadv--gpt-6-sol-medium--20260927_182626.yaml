    - text: 'Within each semester, approved units and units without evaluations should
        be nonnegative, disjoint counts whose sum does not exceed enrolled units:
        `approved >= 0 AND without_evaluations >= 0 AND approved + without_evaluations
        <= enrolled`. The script divides both counts by enrolled units to form risk
