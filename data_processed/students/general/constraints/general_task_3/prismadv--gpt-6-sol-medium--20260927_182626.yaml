    assumptions:
    - text: All ten curricular-unit columns should contain valid numeric values in
        every record. Numeric coercion must not introduce nulls, because the script
        combines both semesters' rates and grades into each risk score. This can be
        checked with completeness constraints on all ten columns after coercion.
