      uid: a8a395d3-bfed-4198-8c68-0ba1e1c4e771
    - text: 'For each semester, credited units should be nonnegative and no greater
        than enrolled units: `0 <= credited <= enrolled`. This keeps each credited-to-enrolled
        ratio between 0 and 1, as assumed by the credit-gap risk calculation.'
