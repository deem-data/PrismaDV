    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. For example, arithmetic without imputation assumes non-null\
      \ numeric data, while relational comparisons assume specific domain bounds.\n\
      \nFrom the code using the target column, the column metadata, and the task description,\
      \ generate assumptions that represent properties necessary for valid execution\
      \ and correct results:\n1. Completeness & Type: Non-null and correct numeric/string\
      \ types when downstream math, slicing, conversions (e.g., `.astype(int)`, `.astype(float)`),\
      \ or aggregations do not handle NaNs or wrong types and would crash or propagate\
      \ NaNs into rankings, metrics, or risk scores.\n2. Domain Bounds & Non-Negativity:\n\
      \   - Non-negativity for counts, curricular units, credits, evaluations, age,\
      \ or financial amounts: count and unit metrics (e.g., `Curricular units ...\
      \ (enrolled/approved/credited/evaluations)`, `Age at enrollment`) are strictly\
      \ non-negative (>= 0). Note that downstream `.clip(...)` or fallback defaults\
      \ do not make negative counts valid—negative inputs silently corrupt differences,\
      \ pass/fail rates, and priority scoring.\n   - Valid scale bounds for grades:\
      \ 0-20 scale for semester curricular unit grades, 0-200 scale for previous qualification\
      \ and admission grades.\n3. Relational & Cross-Column Invariants: When the code\
      \ computes ratios or differences involving the target column and other columns,\
      \ formulate relational assumptions ONLY for true domain invariants where a violation\
      \ logically cannot happen in valid data and would silently corrupt calculations:\n\
      \   - For curricular units, enrolled units must be greater than or equal to\
      \ approved units (`enrolled >= approved` / `approved <= enrolled`) because a\
      \ student cannot pass courses they did not enroll in.\n   - CRITICAL DOMAIN\
      \ RULE: Do NOT assume `enrolled >= without evaluations`, `enrolled >= credited`,\
      \ or `evaluations <= enrolled`. In student academic records, evaluations can\
      \ exceed enrolled units (multiple exam sessions per course), credited units\
      \ transfer from prior institutions regardless of enrollment, and units without\
      \ evaluations may be recorded from past terms or special regimes even with 0\
      \ enrolled units. Formulating relational assumptions for these creates false\
      \ alarms on safe data.\n4. Categorical Domains & Indicator Flags: Allowable\
      \ value sets for discrete categories or binary indicators (e.g., 0 or 1 for\
      \ Debtor, Tuition fees up to date, Scholarship holder, Daytime/evening attendance).\
      \ Note whether unexpected values crash the code or merely flow into boolean\
      \ filters and weightings.\n\nGround every assumption in actual code operations\
      \ and column metadata. Clearly distinguish conditions whose violation causes\
      \ runtime crashes or silent calculation corruption from benign variations.\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
