    assumptions:
    - text: For each semester, the numbers of approved, credited, and without-evaluation
        curricular units should each be nonnegative and no greater than the number
        enrolled. These counts are used as numerators over enrolled units to form
        ratios; a count exceeding enrollment would produce an invalid ratio. This
        does not assume that the three categories are mutually exclusive.
      sources:
      - start_line: 25
        end_line: 33
        file: ''
      - start_line: 52
        end_line: 61
        file: ''
      uid: bc88dcb2-ef91-470e-a0be-2fde7a60322d
    - text: For each semester, if the number of enrolled curricular units is zero,
        the numbers approved, credited, and without evaluations should all be zero.
        Replacing a zero denominator and filling the resulting ratios with zero would
        otherwise conceal inconsistent counts.
      sources:
      - start_line: 52
        end_line: 61
        file: ''
      uid: 4c2dbac9-99f1-49ee-9a2b-be4d986f83c1
    - text: "The admission grade and previous-qualification grade should both be present\
        \ as numeric values on every record, and both should use the same 0\u2013\
        200 grading scale. The script subtracts them and uses their sum divided by\
        \ 400 to calculate preparedness risk."
      sources:
      - start_line: 40
        end_line: 48
        file: ''
      - start_line: 65
        end_line: 68
        file: ''
      uid: 020836f4-bb09-4ae2-afa7-c76eb3fbd603
    - text: "The first- and second-semester grades should both be present as numeric\
        \ values on every record and lie within 0\u201320. Their risks are computed\
        \ by dividing by 20, then averaged into the academic risk score; a missing\
        \ grade can propagate to a missing risk score."
      sources:
      - start_line: 62
        end_line: 63
        file: ''
      - start_line: 71
        end_line: 81
        file: ''
      uid: 31ad1a7e-4fc0-4e1f-a9e1-6d5594d9effd
    - text: All enrolled, approved, credited, and without-evaluation counts for both
        semesters should be present and numeric. Although a zero enrollment is handled
        explicitly, coercion failures or missing counts can otherwise be silently
        turned into zero ratios by fillna(0.0), changing the academic risk calculation.
      sources:
      - start_line: 40
        end_line: 48
        file: ''
      - start_line: 52
        end_line: 61
        file: ''
      - start_line: 71
        end_line: 81
        file: ''
      uid: 275efcff-997e-4ef0-85ae-8181b81a82af
    - text: '''Tuition fees up to date'' and ''Debtor'' should both be present and
        binary (0 or 1) on every record. The finance-risk rule interprets tuition
        value 0 and debtor value 1 as risk indicators; other values or missing values
        would be treated as if those indicators were absent. The rule does not require
        the two columns to be opposites.'
      sources:
      - start_line: 40
        end_line: 49
        file: ''
      uid: 799c7d5c-ebe3-45c0-8c97-4cc802aefd52
    - text: Every Target value should be one of 'Graduate', 'Dropout', or 'Enrolled',
        and the dataset should contain both graduates and non-graduates. The graduate
        proportion sets the risk-score quantile and alert budget, so an unexpected
        label or a single-class dataset would distort or degenerate that calibration.
      sources:
      - start_line: 91
        end_line: 99
        file: ''
      uid: 248f8213-402b-46ad-aa08-af5eed797321
