        end_line: 61
        file: ''
      - start_line: 71
        end_line: 80
        file: ''
      uid: 98123392-3c9c-4005-ac13-6adab44188a4
    - text: For each semester, approved units and units without evaluations should
        not together exceed enrolled units, because a unit cannot simultaneously be
        approved and unevaluated. Check `approved + without evaluations <= enrolled`
        separately for each semester.
      sources:
