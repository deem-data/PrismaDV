    assumptions:
    - text: 'For each student, the second-semester enrolled, approved, credited, and
        without-evaluations counts should be nonnegative integers, and each of the
        latter three counts should not exceed the enrolled count. This keeps the calculated
        ratios between 0 and 1 and ensures that a zero enrolled count cannot conceal
        a positive numerator when the code fills undefined ratios with zero. A row-level
        constraint is: `enrolled >= 0 AND approved BETWEEN 0 AND enrolled AND credited
        BETWEEN 0 AND enrolled AND without_evaluations BETWEEN 0 AND enrolled`, using
        the corresponding column names.'
