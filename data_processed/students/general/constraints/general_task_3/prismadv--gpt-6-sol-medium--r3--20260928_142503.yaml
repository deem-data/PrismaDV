        should not together exceed second-semester enrolled units: `approved + without_evaluations
        <= enrolled`. A unit without an evaluation cannot also be approved; otherwise
        the two ratios used in academic risk count more units than were enrolled.
        This does not assume that credited units are disjoint from approved units.'
