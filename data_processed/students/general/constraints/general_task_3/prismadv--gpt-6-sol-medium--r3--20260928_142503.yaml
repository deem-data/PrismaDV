    assumptions:
    - text: 'Every record should have numeric, non-null values in all columns used
        to calculate the risk score: tuition status, debtor status, admission grade,
        previous qualification grade, age, attendance, and the enrolled, approved,
        credited, without-evaluations, and grade columns for both semesters. Numeric
        coercion can otherwise introduce missing values, producing a missing or misleading
        risk score.'
      sources:
      - start_line: 40
        end_line: 48
        file: ''
      - start_line: 49
        end_line: 88
        file: ''
      uid: ed49c4ae-2875-4846-a661-f53539bfbc41
    - text: For each semester, the numbers of approved, credited, and without-evaluation
        curricular units should each be nonnegative and no greater than that semester's
        number of enrolled units. These conditions keep the three ratios calculated
        with enrolled units within [0, 1] when enrollment is positive. They can be
        checked as row-level inequalities separately for the 1st and 2nd semester.
      sources:
      - start_line: 52
        end_line: 61
        file: ''
      - start_line: 71
        end_line: 80
        file: ''
      uid: 665afe22-46aa-4f30-b350-e2a646491b3f
    - text: For each semester, if the number of enrolled curricular units is zero,
        the numbers of approved, credited, and without-evaluation units should also
        be zero. Otherwise, replacing a zero denominator and filling the resulting
        ratios with zero would conceal inconsistent counts.
      sources:
      - start_line: 52
        end_line: 61
        file: ''
      uid: f65ef0ee-4ac2-46b6-b2fe-5dc541846ed9
    - text: The 1st- and 2nd-semester grade columns should both use the same 0-to-20
        scale. The code divides each by 20 and averages their derived grade risks;
        an out-of-range or differently scaled value would distort that combined feature.
      sources:
      - start_line: 62
        end_line: 63
        file: ''
      - start_line: 73
        end_line: 79
        file: ''
      uid: 27c7c64e-9f6d-4ece-bcfa-409dfb995c7e
    - text: '''Admission grade'' and ''Previous qualification (grade)'' should both
        use a comparable 0-to-200 scale. Their difference and sum are combined into
        one preparedness feature, so differing scales would make that feature misleading.'
      sources:
      - start_line: 66
        end_line: 68
        file: ''
      uid: 27db8e59-ca79-4960-bf31-9a38f18a3fab
    - text: '''Tuition fees up to date'' and ''Debtor'' should both be non-null binary
        indicators with values in {0, 1}. The combined finance-risk condition treats
        0 in the former and 1 in the latter as risk flags.'
      sources:
      - start_line: 49
        end_line: 49
        file: ''
      uid: ac938ff1-a75a-401b-9108-818e7d1164d1
    - text: The dataset should contain at least one 'Graduate' Target record and at
        least one non-'Graduate' Target record, alongside calculable risk scores.
        The graduate share sets the risk-score quantile used as the alert threshold;
        a single-class Target would put the cutoff at an extreme and undermine the
        intended calibration.
      sources:
      - start_line: 91
        end_line: 99
        file: ''
      uid: 19aceed2-4d1f-4a1e-b5b1-306bfe98ce90
