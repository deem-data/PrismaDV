    - text: For each semester, enrolled, approved, credited, and without-evaluations
        counts should be nonnegative, and each of approved, credited, and without-evaluations
        should be no greater than enrolled. This keeps all three computed ratios within
        [0, 1]. Apply the constraint separately to the 1st- and 2nd-semester columns.
