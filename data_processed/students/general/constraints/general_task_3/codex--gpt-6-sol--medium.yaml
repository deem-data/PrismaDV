prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input, 'new_data.csv')\n\
  \    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_csv)\n\
  \n    # Column references\n    g_tuition = 'Tuition fees up to date'\n    g_debtor\
  \ = 'Debtor'\n    g_admission = 'Admission grade'\n    g_prev = 'Previous qualification\
  \ (grade)'\n    c1_enr = 'Curricular units 1st sem (enrolled)'\n    c1_app = 'Curricular\
  \ units 1st sem (approved)'\n    c1_cred = 'Curricular units 1st sem (credited)'\n\
  \    c1_woe = 'Curricular units 1st sem (without evaluations)'\n    c1_grade = 'Curricular\
  \ units 1st sem (grade)'\n    c2_enr = 'Curricular units 2nd sem (enrolled)'\n \
  \   c2_app = 'Curricular units 2nd sem (approved)'\n    c2_cred = 'Curricular units\
  \ 2nd sem (credited)'\n    c2_woe = 'Curricular units 2nd sem (without evaluations)'\n\
  \    c2_grade = 'Curricular units 2nd sem (grade)'\n    g_age = 'Age at enrollment'\n\
  \    g_day = 'Daytime/evening attendance\\t'\n    g_target = 'Target'\n\n    # Type\
  \ coercion for numeric ops\n    num_cols = [\n        g_tuition, g_debtor, g_admission,\
  \ g_prev,\n        c1_enr, c1_app, c1_cred, c1_woe, c1_grade,\n        c2_enr, c2_app,\
  \ c2_cred, c2_woe, c2_grade,\n        g_age, g_day\n    ]\n    for col in num_cols:\n\
  \        if col in df.columns:\n            df[col] = pd.to_numeric(df[col], errors='coerce')\n\
  \    finance_risk = ((df[g_tuition] == 0) | (df[g_debtor] == 1)).astype(float)\n\
  \    risk_age = np.where((df[g_age] < 17) | (df[g_age] > 45), 0.10, 0.00)\n    attendance_risk\
  \ = np.where(df[g_day] == 0, 0.05, 0.00)\n    den1 = df[c1_enr].replace(0, np.nan)\n\
  \    pass_rate1 = (df[c1_app] / den1).fillna(0.0)\n    fail_rate1 = 1.0 - pass_rate1\n\
  \    no_eval_ratio1 = (df[c1_woe] / den1).fillna(0.0)\n    credit_ratio1 = (df[c1_cred]\
  \ / den1).fillna(0.0)\n    den2 = df[c2_enr].replace(0, np.nan)\n    pass_rate2\
  \ = (df[c2_app] / den2).fillna(0.0)\n    fail_rate2 = 1.0 - pass_rate2\n    no_eval_ratio2\
  \ = (df[c2_woe] / den2).fillna(0.0)\n    credit_ratio2 = (df[c2_cred] / den2).fillna(0.0)\n\
  \    grade_risk_1 = 1.0 - (df[c1_grade] / 20.0)\n    grade_risk_2 = 1.0 - (df[c2_grade]\
  \ / 20.0)\n\n    # Admission vs previous qualification checks and preparedness feature\n\
  \    diff_ap = (df[g_admission] - df[g_prev]).abs()\n    prep_risk = 0.5 * np.clip(diff_ap\
  \ / 50.0, 0.0, 1.0) + 0.5 * np.clip(1.0 - ((df[g_admission] + df[g_prev]) / 400.0),\n\
  \                                                                        0.0, 1.0)\n\
  \n    # Aggregate academic risk\n    fail_rate_avg = (fail_rate1 + fail_rate2) /\
  \ 2.0\n    no_eval_avg = (no_eval_ratio1 + no_eval_ratio2) / 2.0\n    grade_risk_avg\
  \ = (grade_risk_1 + grade_risk_2) / 2.0\n    credit_gap_avg = 1.0 - (credit_ratio1\
  \ + credit_ratio2) / 2.0\n\n    academic_risk = (\n            0.40 * fail_rate_avg\
  \ +\n            0.30 * no_eval_avg +\n            0.20 * grade_risk_avg +\n   \
  \         0.10 * credit_gap_avg\n    )\n\n    risk_score = (\n            0.50 *\
  \ academic_risk +\n            0.30 * finance_risk +\n            0.10 * prep_risk\
  \ +\n            0.05 * attendance_risk +\n            0.05 * risk_age\n    )\n\n\
  \    risk_score = np.clip(risk_score, 0.0, 1.0)\n    df['risk_score'] = risk_score\n\
  \    grad_ratio = (df[g_target] == 'Graduate').mean()\n    alert_budget_share =\
  \ float(1.0 - grad_ratio)\n    quantile_cut = 1.0 - alert_budget_share\n    quantile_cut\
  \ = max(0.0, min(1.0, quantile_cut))\n    threshold = df['risk_score'].quantile(quantile_cut)\n\
  \n    df['high_risk'] = df['risk_score'] >= threshold\n    df['risk_tier'] = np.where(df['high_risk'],\
  \ 'HIGH', np.where(df['risk_score'] >= threshold * 0.7, 'MEDIUM', 'LOW'))\n\n  \
  \  # Persist outputs\n    scores_path = os.path.join(args.output, 'student_risk_scores.csv')\n\
  \    alerts_path = os.path.join(args.output, 'advisor_alerts.csv')\n    summary_path\
  \ = os.path.join(args.output, 'calibration_summary.json')\n\n    cols_out = ['risk_score',\
  \ 'high_risk', 'risk_tier', g_tuition, g_debtor, g_day, g_age, g_target]\n    existing_cols_out\
  \ = [c for c in cols_out if c in df.columns]\n    df_out = df.reset_index().rename(columns={'index':\
  \ 'student_row_id'})\n\n    df_out[['student_row_id'] + existing_cols_out].to_csv(scores_path,\
  \ index=False)\n    df_out.loc[df_out['high_risk'], ['student_row_id'] + existing_cols_out].to_csv(alerts_path,\
  \ index=False)\n\n    summary = {\n        'threshold': float(threshold),\n    \
  \    'alert_budget_share': alert_budget_share,\n        'total_records': int(len(df_out)),\n\
  \        'alerts_emitted': int(df_out['high_risk'].sum()),\n        'graduate_ratio':\
  \ float(grad_ratio),\n        'mean_risk_score': float(df['risk_score'].mean())\n\
  \    }\n    with open(summary_path, 'w') as f:\n        json.dump(summary, f)\n\n\
  \nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at\
