  Admission grade:
    code:
    - suggestion: .satisfies("CASE WHEN `Admission grade` IS NOT NULL AND CAST(`Admission
        grade` AS DOUBLE) IS NOT NULL AND NOT isnan(CAST(`Admission grade` AS DOUBLE))
        AND ABS(CAST(`Admission grade` AS DOUBLE)) <= 1.7976931348623157E308 THEN
        1 ELSE 0 END = 1", "finite_admission_grade")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 4ba527ae-456c-4a11-9053-90bad11ea289
      source_assumptions:
      - 1d00cf71-8f80-4895-bba2-ab8a3d3369ac
      - 784b054e-da88-4a85-8ede-e0240f8ddef7
    - suggestion: .satisfies("CAST(`Admission grade` AS DOUBLE) BETWEEN 0 AND 200",
        "admission_grade_0_to_200")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e6666a62-aa8f-422b-b58d-0e77d1f5693e
      source_assumptions:
      - a1bea553-b91e-4964-a2e1-409e944af750
    assumptions:
    - text: The input must contain a column named 'Admission grade', because the code
        accesses it by that exact name.
      sources:
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 67
        end_line: 67
        file: ''
      uid: 1d00cf71-8f80-4895-bba2-ab8a3d3369ac
    - text: Every 'Admission grade' value should be present and convertible to a finite
        number. Conversion errors become NaN, and there is no missing-value handling;
        even though the preparedness component has a weight of zero, multiplying it
        by NaN can propagate NaN into the output risk score.
      sources:
      - start_line: 67
        end_line: 69
        file: ''
      - start_line: 121
        end_line: 124
        file: ''
      - start_line: 128
        end_line: 133
        file: ''
      uid: 784b054e-da88-4a85-8ede-e0240f8ddef7
    - text: '''Admission grade'' should be between 0 and 200 inclusive. The code divides
        it by 200 to form a normalized preparedness measure that is subsequently clipped
        to the range 0 to 1.'
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 121
        end_line: 121
        file: ''
      uid: a1bea553-b91e-4964-a2e1-409e944af750
