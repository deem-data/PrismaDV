      - - .isComplete('Tuition fees up to date')
        - Valid
      - - .satisfies('try_cast(`Tuition fees up to date` AS DOUBLE) IN (0, 1)', 'binary
          tuition status')
        - Valid
      assumptions: []
      column_name: Tuition fees up to date
    Unemployment rate:
      code:
      - - '.hasStandardDeviation(''Unemployment rate'', lambda value: value > 0)'
        - Valid
      - - .isComplete('Unemployment rate')
        - Valid
      - - .satisfies('try_cast(`Unemployment rate` AS DOUBLE) IS NOT NULL', 'numeric
          unemployment rate')
        - Valid
      assumptions: []
      column_name: Unemployment rate
