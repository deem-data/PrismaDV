      \ output or data is used.\n5. **assumptions**: A numbered list (0-indexed) of\
      \ assumptions about `target_column`.\n\n---\n\n## 2. Severity Level Decision\
      \ Rules (\"error\" vs \"warning\")\n\nThe validation engine evaluates batches\
      \ as **safe** or **unsafe**. An unsafe batch is flagged only if a check with\
      \ level `\"error\"` fails. If a check is marked `\"warning\"`, a failure will\
      \ NOT flag an unsafe batch.\n\n### Assign `\"error\"` when:\n- **Runtime Crashes**:\
      \ Missing columns, unexpected null values passed into operations that do not\
      \ tolerate nulls (e.g., `.astype(int)`, mathematical functions like `math.sqrt`),\
      \ or type mismatches failing explicit casts.\n- **Domain Invariants & Physical\
      \ Impossibilities**: Assumptions asserting non-negativity (e.g., count of enrolled\
      \ units, credits, age, positive scores), valid categorical sets, or logical\
      \ ranges. Violating these represents corrupted data that invalidates downstream\
      \ calculations (even if Pandas operations do not crash syntactically, e.g.,\
      \ clipping negative values or `pd.to_numeric(..., errors='coerce')` producing\
      \ silent NaNs).\n- **Core Stated Assumptions**: If an assumption states a column\
      \ must be complete, non-negative, numeric, or within a specific set of allowed\
      \ values, enforce it with `\"error\"`.\n\n### Assign `\"warning\"` ONLY when:\n\
      - **Soft/Heuristic Checks**: Non-fatal data quality drift (e.g., checking completeness\
      \ >= 0.95 when missingness is handled smoothly by defaults/imputations).\n-\
      \ **Statistical Distribution Bounds**: Mean, standard deviation, or quantile\
      \ checks that indicate distributional shifts rather than broken or corrupted\
      \ records.\n\n*Crucial Rule*: Do NOT set core domain validity checks (e.g.,\
      \ `.isNonNegative(...)`, `.isComplete(...)`, `.hasDataType(...)`) to `\"warning\"\
