prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport pandas as pd\nimport numpy as np\n\n\ndef sigmoid(x):\n    return\
  \ 1 / (1 + np.exp(-x))\n\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--input',\
  \ type=str, required=True)\nparser.add_argument('--output', type=str, required=True)\n\
  args = parser.parse_args()\n\nos.makedirs(args.output, exist_ok=True)\n\n# Load\
  \ data\ninput_csv = os.path.join(args.input, 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\
  \n# Select columns used downstream\ncol_gdp = 'GDP'\ncol_unemp = 'Unemployment rate'\n\
  col_infl = 'Inflation rate'\ncol_app_order = 'Application order'\ncol_debtor = 'Debtor'\n\
  col_tuition = 'Tuition fees up to date'\ncol_adm = 'Admission grade'\ncol_prev =\
  \ 'Previous qualification (grade)'\n\ncol_en1 = 'Curricular units 1st sem (enrolled)'\n\
  col_ap1 = 'Curricular units 1st sem (approved)'\ncol_cr1 = 'Curricular units 1st\
  \ sem (credited)'\ncol_wo1 = 'Curricular units 1st sem (without evaluations)'\n\
  col_gr1 = 'Curricular units 1st sem (grade)'\n\ncol_en2 = 'Curricular units 2nd\
  \ sem (enrolled)'\ncol_ap2 = 'Curricular units 2nd sem (approved)'\ncol_cr2 = 'Curricular\
  \ units 2nd sem (credited)'\ncol_wo2 = 'Curricular units 2nd sem (without evaluations)'\n\
  col_gr2 = 'Curricular units 2nd sem (grade)'\n\n# Macro constraints before computing\
  \ macro stress\nmac_gdp = pd.to_numeric(df[col_gdp], errors='coerce')\nmac_unemp\
  \ = pd.to_numeric(df[col_unemp], errors='coerce')\nmac_infl = pd.to_numeric(df[col_infl],\
  \ errors='coerce')\n# Macro stress feature (higher = worse environment)\nzg = (mac_gdp\
  \ - mac_gdp.mean()) / mac_gdp.std(ddof=0)\nzu = (mac_unemp - mac_unemp.mean()) /\
  \ mac_unemp.std(ddof=0)\nzi = (mac_infl - mac_infl.mean()) / mac_infl.std(ddof=0)\n\
  macro_stress = sigmoid(zu - zg + 0.3 * zi)\n\n# Application order checks before\
  \ mapping to weights\napp_order = pd.to_numeric(df[col_app_order], errors='coerce').astype('Int64')\n\
  # Map application order to commitment weights (1 -> strongest commitment)\n# Index\
  \ 0 is unused to align indexes with order values 1..9\ncommit_weights = np.array([0.0,\
  \ 1.0, 0.85, 0.78, 0.70, 0.65, 0.60, 0.55, 0.50, 0.45])\ncommitment = commit_weights[app_order.to_numpy()]\
  \  # relies on 1..9 constraint\n\n# Payment status consistency and prevalence before\
  \ deriving arrears factor\nis_debtor = pd.to_numeric(df[col_debtor], errors='coerce').astype(int)\n\
  fees_up_to_date = pd.to_numeric(df[col_tuition], errors='coerce').astype(int)\n\
  arrears = ((is_debtor == 1) | (fees_up_to_date == 0)).astype(int)\n\n# Academic\
  \ preparedness consistency before using grades\nadm_grade = pd.to_numeric(df[col_adm],\
  \ errors='coerce')\nprev_grade = pd.to_numeric(df[col_prev], errors='coerce')\n\
  preparedness = 0.6 * (adm_grade / 200.0) + 0.4 * (prev_grade / 200.0)\n\n# Semester\
  \ 1 academic constraints before pass-rate and ratios\nen1 = pd.to_numeric(df[col_en1],\
  \ errors='coerce').astype(int)\nap1 = pd.to_numeric(df[col_ap1], errors='coerce').astype(int)\n\
  cr1 = pd.to_numeric(df[col_cr1], errors='coerce').astype(int)\nwo1 = pd.to_numeric(df[col_wo1],\
  \ errors='coerce').astype(int)\ngr1 = pd.to_numeric(df[col_gr1], errors='coerce')\n\
  pass_rate1 = np.where(en1 > 0, ap1 / en1.replace(0, np.nan), 1.0)\ngrade_norm1 =\
  \ gr1 / 20.0\nnoeval_ratio1 = np.where(en1 > 0, wo1 / en1.replace(0, np.nan), 0.0)\n\
  \n# Estimate expected approvals from enrollment using simple linear relation (slope,\
  \ intercept)\n# Precondition: strong positive correlation ensured above\nslope1\
  \ = ap1.std(ddof=0) / en1.std(ddof=0) * ap1.corr(en1)\nintercept1 = ap1.mean() -\
  \ slope1 * en1.mean()\nexpected_ap1 = slope1 * en1 + intercept1\nsuccess_gap1 =\
  \ np.maximum(expected_ap1 - ap1, 0)\nsuccess_gap_ratio1 = np.where(en1 > 0, success_gap1\
  \ / en1.replace(0, np.nan), 0.0)\n\n# Semester 2 academic constraints before pass-rate\
  \ and ratios\nen2 = pd.to_numeric(df[col_en2], errors='coerce').astype(int)\nap2\
  \ = pd.to_numeric(df[col_ap2], errors='coerce').astype(int)\ncr2 = pd.to_numeric(df[col_cr2],\
  \ errors='coerce').astype(int)\nwo2 = pd.to_numeric(df[col_wo2], errors='coerce').astype(int)\n\
  gr2 = pd.to_numeric(df[col_gr2], errors='coerce')\npass_rate2 = np.where(en2 > 0,\
  \ ap2 / en2.replace(0, np.nan), 1.0)\ngrade_norm2 = gr2 / 20.0\nnoeval_ratio2 =\
  \ np.where(en2 > 0, wo2 / en2.replace(0, np.nan), 0.0)\n\nslope2 = ap2.std(ddof=0)\
  \ / en2.std(ddof=0) * ap2.corr(en2)\nintercept2 = ap2.mean() - slope2 * en2.mean()\n\
  expected_ap2 = slope2 * en2 + intercept2\nsuccess_gap2 = np.maximum(expected_ap2\
  \ - ap2, 0)\nsuccess_gap_ratio2 = np.where(en2 > 0, success_gap2 / en2.replace(0,\
  \ np.nan), 0.0)\n\n# Aggregate academic features\ntotal_enrolled = en1 + en2\ntotal_approved\
  \ = ap1 + ap2\nprogress = np.where(total_enrolled > 0, total_approved / total_enrolled.replace(0,\
  \ np.nan), 1.0)\nmean_grade_norm = (grade_norm1 + grade_norm2) / 2.0\nmean_noeval_ratio\
  \ = (noeval_ratio1 + noeval_ratio2) / 2.0\nmean_success_gap_ratio = (success_gap_ratio1\
  \ + success_gap_ratio2) / 2.0\n\n# Risk composition\npayment_component = 0.40 *\
  \ arrears\nprogress_component = 0.25 * (1.0 - np.clip(progress, 0.0, 1.0))\ngrade_component\
  \ = 0.10 * (1.0 - np.clip(mean_grade_norm, 0.0, 1.0))\ngap_component = 0.10 * np.clip(mean_success_gap_ratio,\
  \ 0.0, 1.0)\nnoeval_component = 0.05 * np.clip(mean_noeval_ratio, 0.0, 1.0)\ncommitment_component\
  \ = 0.05 * (1.0 - np.clip(commitment, 0.0, 1.0))\nmacro_component = 0.05 * np.clip(macro_stress,\
  \ 0.0, 1.0)\nprep_component = 0.0 * (1.0 - np.clip(preparedness, 0.0, 1.0))  # reserved\
  \ weight if needed\n\nrisk_raw = payment_component + progress_component + grade_component\
  \ + gap_component + noeval_component + commitment_component + macro_component +\
  \ prep_component\nrisk_score = np.clip(risk_raw, 0.0, 1.0)\n\n# Produce advisor\
  \ queue (top risks)\noutput = df.copy()\noutput['dropout_risk_score'] = risk_score\n\
  output['priority_tier'] = pd.cut(\n    output['dropout_risk_score'],\n    bins=[-0.01,\
  \ 0.3, 0.5, 0.7, 1.0],\n    labels=['Low', 'Moderate', 'High', 'Critical']\n).astype(str)\n\
  output['row_id'] = np.arange(len(output))\n\n# Persist outputs\nscores_path = os.path.join(args.output,\
  \ 'dropout_risk_scores.csv')\nqueue_path = os.path.join(args.output, 'advisor_intervention_queue.csv')\n\
  \noutput[['row_id', 'dropout_risk_score', 'priority_tier']].to_csv(scores_path,\
  \ index=False)\n\nqueue_cols = ['row_id', 'dropout_risk_score', 'priority_tier',\
  \ col_app_order, col_debtor, col_tuition]\nqueue = output.sort_values('dropout_risk_score',\
  \ ascending=False).head(200)\nqueue[queue_cols].to_csv(queue_path, index=False)\n\
  \n```\n\nThe same program is on disk at `./code/general_task_17.py`, so you can\
  \ run it against the\nstaged table, step through it, or search it, rather than working\
