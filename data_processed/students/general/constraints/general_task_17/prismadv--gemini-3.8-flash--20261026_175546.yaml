        end_line: 96
        file: ''
      - start_line: 107
        end_line: 116
        file: ''
      uid: ec4efd51-5f94-4f7b-b8d7-fa4d01465547
    - text: 'The columns ''Curricular units 2nd sem (approved)'' and ''Curricular
        units 2nd sem (grade)'' should be logically consistent: if a student has 0
        approved curricular units in the 2nd semester, their recorded grade should
        be 0, and conversely, having a non-zero grade requires at least one approved
        unit. We could represent this assumption as a deequ constraint like this:
        .satisfies("(`Curricular units 2nd sem (approved)` == 0 AND `Curricular units
        2nd sem (grade)` == 0) OR (`Curricular units 2nd sem (approved)` > 0 AND `Curricular
        units 2nd sem (grade)` > 0)", "grade_approval_consistency")'
      sources:
