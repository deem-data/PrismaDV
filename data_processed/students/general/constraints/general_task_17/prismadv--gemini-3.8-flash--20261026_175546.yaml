        0 to 200 (between 0 and 200), as the code normalizes admission grades by dividing
        by 200.0 to compute a preparedness ratio clipped between 0.0 and 1.0. We could
        represent this assumption as a deequ constraint like this: .satisfies(''`Admission
        grade` >= 0 AND `Admission grade` <= 200'', ''Admission grade range between
