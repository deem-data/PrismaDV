  '["Curricular units 2nd sem (approved)","Curricular units 2nd sem (enrolled)"]':
    code: []
    assumptions:
    - text: 'The number of approved curricular units in the 2nd semester should be
        less than or equal to the number of enrolled curricular units in the 2nd semester
        (''Curricular units 2nd sem (approved)'' <= ''Curricular units 2nd sem (enrolled)'').
        A student cannot approve more curricular units than the number of units they
        enrolled in for the semester, which is also assumed when calculating ''pass_rate2''.
        We can represent this assumption as a Deequ constraint like: .satisfies("`Curricular
        units 2nd sem (approved)` <= `Curricular units 2nd sem (enrolled)`", "approved_le_enrolled_sem2")'
      sources:
      - start_line: 90
        end_line: 95
        file: ''
      uid: f312f4e9-1462-4e78-9200-d6cc3101afa8
    - text: 'There should be a positive Pearson correlation between ''Curricular units
        2nd sem (enrolled)'' and ''Curricular units 2nd sem (approved)''. The downstream
        linear regression calculates the slope as ap2.std() / en2.std() * ap2.corr(en2)
        to estimate expected approvals, assuming that higher enrollment corresponds
        to higher expected approvals. We can represent this assumption as a Deequ
        constraint like: .hasCorrelation("Curricular units 2nd sem (enrolled)", "Curricular
        units 2nd sem (approved)", _ > 0.0)'
      sources:
      - start_line: 90
        end_line: 91
        file: ''
      - start_line: 99
        end_line: 101
        file: ''
      uid: 5b9e23ab-54ca-4c1b-b97d-e334593d5339
  '["Curricular units 2nd sem (approved)","Curricular units 2nd sem (grade)"]':
    code: []
    assumptions:
    - text: 'There should be a strong positive correlation between ''Curricular units
        2nd sem (approved)'' and ''Curricular units 2nd sem (grade)'', as students
        passing more curricular units generally achieve higher overall grade marks,
        both of which jointly drive the student progress and risk components. We could
        represent this assumption as a deequ constraint like this: .hasCorrelation("Curricular
        units 2nd sem (approved)", "Curricular units 2nd sem (grade)", _ >= 0.5)'
      sources:
