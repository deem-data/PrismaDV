      \ expressions, conditions, aggregations, or statistical assertions (e.g., `(val\
      \ == 0).mean()`, `np.where(val == 1, ...)`, `1 - val`).\n   - *Note*: Tracking\
      \ these operations is critical because downstream data quality frameworks (e.g.,\
      \ Great Expectations, PyDeequ) rely on them to detect implicit data contracts\
      \ (e.g., non-null constraints, categorical sets, sparsity bounds to prevent\
      \ math domain errors).\n5. **Loops and Control Flow**: Loops or comprehension\
