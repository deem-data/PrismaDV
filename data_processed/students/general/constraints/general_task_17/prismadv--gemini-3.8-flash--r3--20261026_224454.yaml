    - text: '''GDP'' and ''Unemployment rate'' are expected to exhibit a negative
        correlation, as ''macro_stress'' models worsening economic conditions by subtracting
        the standardized GDP z-score from the unemployment rate z-score (zu - zg).
        We could represent this assumption as a Deequ constraint like: .hasCorrelation("GDP",
        "Unemployment rate", _ < 0.0)'
      sources:
