    assumptions:
    - text: 'The columns ''GDP'', ''Unemployment rate'', and ''Inflation rate'' must
        all be non-null and valid numeric values concurrently across all rows, because
        they are standardized and combined in the calculation of ''macro_stress''
        (zu - zg + 0.3 * zi). Missing values in any of these columns would propagate
        NaNs into the downstream risk score computation. We could represent this assumption
        as a Deequ constraint like: .satisfies("GDP IS NOT NULL AND `Unemployment
        rate` IS NOT NULL AND `Inflation rate` IS NOT NULL", "macro_indicators_complete")'
