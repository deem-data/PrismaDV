    assumptions:
    - text: 'Both ''Debtor'' and ''Tuition fees up to date'' must be non-null and
        take binary values (0 or 1), because the code coerces both columns and directly
        casts them to integer with ''.astype(int)'' before performing boolean logic
        ''((is_debtor == 1) | (fees_up_to_date == 0))''. If either column contains
        null values or non-convertible entries, ''.astype(int)'' will raise a ValueError.
        We could represent this assumption as a Deequ constraint like this:

        .satisfies("(`Debtor` IN (0, 1)) AND (`Tuition fees up to date` IN (0, 1))",
        "debtor_and_tuition_binary_non_null", _ == 1.0)'
