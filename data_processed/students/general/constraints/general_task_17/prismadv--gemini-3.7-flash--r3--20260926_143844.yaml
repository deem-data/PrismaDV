        file: ''
      - start_line: 121
        end_line: 124
        file: ''
      uid: 644afdb2-08f4-44a3-9f95-24ccd603dcd7
    - text: 'The ''Admission grade'' column represents an admission score expected
        to be non-negative and within the range of 0 to 200, as indicated by the normalization
        factor `adm_grade / 200.0` in the preparedness score calculation.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Admission grade` >= 0 AND `Admission grade` <= 200
        THEN 1 ELSE 0 END", "Admission grade range", lambda x: x == 1)'
      sources:
