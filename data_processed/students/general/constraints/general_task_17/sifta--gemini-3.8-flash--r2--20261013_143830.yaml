      \ transformed, filtered, included in column lists (e.g., `numeric_cols`), or\
      \ directly used in calculations and condition checks (e.g., `fee_risk = 0.6\
      \ * debtor...`, `urgent_fee_flag = ... (debtor == 1)`).\n   - Strict direct\
      \ reference rule: Only include lines where the target column name string, its\
      \ alias, or its direct intermediate variable is explicitly present in the line's\
      \ code text. Do NOT trace secondary variables derived from intermediate variables\
      \ (e.g., if `e1` is intermediate and `e1_safe = e1.replace(...)`, do not trace\
      \ downstream lines that only reference `e1_safe`, ratios like `pass_rate1`,\
      \ or composite scores).\n3. Strict line number verification: Count line numbers\
