        \ 2nd sem (enrolled)'\ncol_ap2 = 'Curricular units 2nd sem (approved)'\ncol_cr2\
        \ = 'Curricular units 2nd sem (credited)'\ncol_wo2 = 'Curricular units 2nd\
        \ sem (without evaluations)'\ncol_gr2 = 'Curricular units 2nd sem (grade)'\n\
        \n# Macro constraints before computing macro stress\nmac_gdp = pd.to_numeric(df[col_gdp],\
        \ errors='coerce')\nmac_unemp = pd.to_numeric(df[col_unemp], errors='coerce')\n\
        mac_infl = pd.to_numeric(df[col_infl], errors='coerce')\n# Macro stress feature\
        \ (higher = worse environment)\nzg = (mac_gdp - mac_gdp.mean()) / mac_gdp.std(ddof=0)\n\
        zu = (mac_unemp - mac_unemp.mean()) / mac_unemp.std(ddof=0)\nzi = (mac_infl\
        \ - mac_infl.mean()) / mac_infl.std(ddof=0)\nmacro_stress = sigmoid(zu - zg\
        \ + 0.3 * zi)\n\n# Application order checks before mapping to weights\napp_order\
        \ = pd.to_numeric(df[col_app_order], errors='coerce').astype('Int64')\n# Map\
        \ application order to commitment weights (1 -> strongest commitment)\n# Index\
        \ 0 is unused to align indexes with order values 1..9\ncommit_weights = np.array([0.0,\
        \ 1.0, 0.85, 0.78, 0.70, 0.65, 0.60, 0.55, 0.50, 0.45])\ncommitment = commit_weights[app_order.to_numpy()]\
        \  # relies on 1..9 constraint\n\n# Payment status consistency and prevalence\
        \ before deriving arrears factor\nis_debtor = pd.to_numeric(df[col_debtor],\
        \ errors='coerce').astype(int)\nfees_up_to_date = pd.to_numeric(df[col_tuition],\
        \ errors='coerce').astype(int)\narrears = ((is_debtor == 1) | (fees_up_to_date\
        \ == 0)).astype(int)\n\n# Academic preparedness consistency before using grades\n\
        adm_grade = pd.to_numeric(df[col_adm], errors='coerce')\nprev_grade = pd.to_numeric(df[col_prev],\
        \ errors='coerce')\npreparedness = 0.6 * (adm_grade / 200.0) + 0.4 * (prev_grade\
        \ / 200.0)\n\n# Semester 1 academic constraints before pass-rate and ratios\n\
        en1 = pd.to_numeric(df[col_en1], errors='coerce').astype(int)\nap1 = pd.to_numeric(df[col_ap1],\
        \ errors='coerce').astype(int)\ncr1 = pd.to_numeric(df[col_cr1], errors='coerce').astype(int)\n\
        wo1 = pd.to_numeric(df[col_wo1], errors='coerce').astype(int)\ngr1 = pd.to_numeric(df[col_gr1],\
        \ errors='coerce')\npass_rate1 = np.where(en1 > 0, ap1 / en1.replace(0, np.nan),\
        \ 1.0)\ngrade_norm1 = gr1 / 20.0\nnoeval_ratio1 = np.where(en1 > 0, wo1 /\
        \ en1.replace(0, np.nan), 0.0)\n\n# Estimate expected approvals from enrollment\
        \ using simple linear relation (slope, intercept)\n# Precondition: strong\
        \ positive correlation ensured above\nslope1 = ap1.std(ddof=0) / en1.std(ddof=0)\
        \ * ap1.corr(en1)\nintercept1 = ap1.mean() - slope1 * en1.mean()\nexpected_ap1\
        \ = slope1 * en1 + intercept1\nsuccess_gap1 = np.maximum(expected_ap1 - ap1,\
        \ 0)\nsuccess_gap_ratio1 = np.where(en1 > 0, success_gap1 / en1.replace(0,\
        \ np.nan), 0.0)\n\n# Semester 2 academic constraints before pass-rate and\
        \ ratios\nen2 = pd.to_numeric(df[col_en2], errors='coerce').astype(int)\n\
        ap2 = pd.to_numeric(df[col_ap2], errors='coerce').astype(int)\ncr2 = pd.to_numeric(df[col_cr2],\
        \ errors='coerce').astype(int)\nwo2 = pd.to_numeric(df[col_wo2], errors='coerce').astype(int)\n\
        gr2 = pd.to_numeric(df[col_gr2], errors='coerce')\npass_rate2 = np.where(en2\
        \ > 0, ap2 / en2.replace(0, np.nan), 1.0)\ngrade_norm2 = gr2 / 20.0\nnoeval_ratio2\
        \ = np.where(en2 > 0, wo2 / en2.replace(0, np.nan), 0.0)\n\nslope2 = ap2.std(ddof=0)\
        \ / en2.std(ddof=0) * ap2.corr(en2)\nintercept2 = ap2.mean() - slope2 * en2.mean()\n\
        expected_ap2 = slope2 * en2 + intercept2\nsuccess_gap2 = np.maximum(expected_ap2\
        \ - ap2, 0)\nsuccess_gap_ratio2 = np.where(en2 > 0, success_gap2 / en2.replace(0,\
        \ np.nan), 0.0)\n\n# Aggregate academic features\ntotal_enrolled = en1 + en2\n\
        total_approved = ap1 + ap2\nprogress = np.where(total_enrolled > 0, total_approved\
        \ / total_enrolled.replace(0, np.nan), 1.0)\nmean_grade_norm = (grade_norm1\
        \ + grade_norm2) / 2.0\nmean_noeval_ratio = (noeval_ratio1 + noeval_ratio2)\
        \ / 2.0\nmean_success_gap_ratio = (success_gap_ratio1 + success_gap_ratio2)\
        \ / 2.0\n\n# Risk composition\npayment_component = 0.40 * arrears\nprogress_component\
