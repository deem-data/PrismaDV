        \ = ap2.mean() - slope2 * en2.mean()\nexpected_ap2 = slope2 * en2 + intercept2\n\
        success_gap2 = np.maximum(expected_ap2 - ap2, 0)\nsuccess_gap_ratio2 = np.where(en2\
        \ > 0, success_gap2 / en2.replace(0, np.nan), 0.0)\n\n# Aggregate academic\
        \ features\ntotal_enrolled = en1 + en2\ntotal_approved = ap1 + ap2\nprogress\
        \ = np.where(total_enrolled > 0, total_approved / total_enrolled.replace(0,\
        \ np.nan), 1.0)\nmean_grade_norm = (grade_norm1 + grade_norm2) / 2.0\nmean_noeval_ratio\
        \ = (noeval_ratio1 + noeval_ratio2) / 2.0\nmean_success_gap_ratio = (success_gap_ratio1\
        \ + success_gap_ratio2) / 2.0\n\n# Risk composition\npayment_component = 0.40\
        \ * arrears\nprogress_component = 0.25 * (1.0 - np.clip(progress, 0.0, 1.0))\n\
        grade_component = 0.10 * (1.0 - np.clip(mean_grade_norm, 0.0, 1.0))\ngap_component\
        \ = 0.10 * np.clip(mean_success_gap_ratio, 0.0, 1.0)\nnoeval_component = 0.05\
        \ * np.clip(mean_noeval_ratio, 0.0, 1.0)\ncommitment_component = 0.05 * (1.0\
        \ - np.clip(commitment, 0.0, 1.0))\nmacro_component = 0.05 * np.clip(macro_stress,\
        \ 0.0, 1.0)\nprep_component = 0.0 * (1.0 - np.clip(preparedness, 0.0, 1.0))\
        \  # reserved weight if needed\n\nrisk_raw = payment_component + progress_component\
        \ + grade_component + gap_component + noeval_component + commitment_component\
        \ + macro_component + prep_component\nrisk_score = np.clip(risk_raw, 0.0,\
        \ 1.0)\n\n# Produce advisor queue (top risks)\noutput = df.copy()\noutput['dropout_risk_score']\
        \ = risk_score\noutput['priority_tier'] = pd.cut(\n    output['dropout_risk_score'],\n\
        \    bins=[-0.01, 0.3, 0.5, 0.7, 1.0],\n    labels=['Low', 'Moderate', 'High',\
        \ 'Critical']\n).astype(str)\noutput['row_id'] = np.arange(len(output))\n\n\
        # Persist outputs\nscores_path = os.path.join(args.output, 'dropout_risk_scores.csv')\n\
