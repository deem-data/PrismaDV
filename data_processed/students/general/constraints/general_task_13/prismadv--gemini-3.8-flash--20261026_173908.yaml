  '["Debtor","Tuition fees up to date"]':
    code: []
    assumptions:
    - text: 'Both ''Debtor'' and ''Tuition fees up to date'' columns are assumed to
        be non-null binary indicators with values in {0, 1}. This ensures that casting
        via .astype(int) executes without NaN conversion errors and that the fee risk
        calculation ''0.6 * Debtor + 0.4 * (1 - Tuition fees up to date)'' yields
        a valid normalized risk score between 0.0 and 1.0. We could represent this
        assumption as a Deequ constraint like: .satisfies(''`Debtor` IN (0, 1) AND
        `Tuition fees up to date` IN (0, 1)'', ''fee_columns_binary'')'
      sources:
      - start_line: 69
        end_line: 73
        file: ''
      uid: 80acb497-6d2b-4243-a95b-63df4483224b
    - text: '''Debtor'' and ''Tuition fees up to date'' are jointly evaluated in a
        boolean condition ((debtor == 1) & (tuition_up == 0)) to identify urgent fee
        management cases. The code assumes that both columns are non-null and comparable
        as integers so the bitwise AND operation produces a valid binary flag. We
        could represent this assumption as a Deequ constraint like: .satisfies(''(`Debtor`
        IS NOT NULL) AND (`Tuition fees up to date` IS NOT NULL)'', ''fee_columns_complete'')'
      sources:
      - start_line: 69
        end_line: 70
        file: ''
      - start_line: 161
        end_line: 161
        file: ''
      uid: 874d41fa-6059-48b3-a475-109f623abd85
  '["GDP","Inflation rate","Unemployment rate"]':
    code: []
    assumptions:
    - text: The columns 'GDP', 'Unemployment rate', and 'Inflation rate' must all
        be non-null for every record. In the downstream code, each column is mapped
        to a discrete rank and cast directly to integer using `.astype(int)` before
        computing the composite 'macro_stress' index. Any missing or null value in
        any of these columns will result in NaN and raise a ValueError during integer
        casting. This can be expressed as a joint completeness constraint across ['GDP',
        'Unemployment rate', 'Inflation rate'].
      sources:
      - start_line: 85
        end_line: 92
        file: ''
      uid: 87494db4-af5b-468b-b162-924f00e176af
    - text: 'The values in ''GDP'', ''Unemployment rate'', and ''Inflation rate''
        must strictly belong to their respective predefined sets of macroeconomic
        values: allowed_gdp = [-4.06, -3.12, -1.7, -0.92, 0.32, 0.79, 1.74, 1.79,
        2.02, 3.51], allowed_unemp = [7.6, 8.9, 9.4, 10.8, 11.1, 12.4, 12.7, 13.9,
        15.5, 16.2], and allowed_infl = [-0.8, -0.3, 0.3, 0.5, 0.6, 1.4, 2.6, 2.8,
        3.7]. Any observation containing an unexpected value outside these sets will
        fail the dictionary mapping, produce NaN, and crash `.astype(int)` when computing
        ''macro_stress''.'
      sources:
      - start_line: 77
        end_line: 92
        file: ''
      uid: 7e128ce1-6a11-426f-a2be-32cd6ad7460e
