        of rows with Application order equal to 1 is less than 0.60, `math.sqrt` will
        throw a `ValueError: math domain error`.'
      sources:
      - start_line: 61
        end_line: 61
        file: ''
      - start_line: 64
        end_line: 64
        file: ''
      uid: e10cccc7-e98b-4bee-8e23-377d88dee154
    - text: 'At least 95% of the values in the ''Application order'' column must be
        among the allowed values [1, 2, 3, 4, 5, 6]. This is because the code calculates
        `allowed_order_cohesion = math.sqrt(share_in_allowed - 0.95)` where `share_in_allowed
        = app.isin([1, 2, 3, 4, 5, 6]).mean()`. If the proportion of values in [1,
        2, 3, 4, 5, 6] drops below 0.95, `math.sqrt` will throw a `ValueError: math
        domain error`.'
      sources:
      - start_line: 62
        end_line: 62
        file: ''
      - start_line: 65
        end_line: 65
        file: ''
      uid: 6bea2a38-dcf0-4359-adb8-b730ade2fe06
    - text: The 'Application order' column must be numeric and not null, as it undergoes
        numerical comparisons and mathematical operations such as `app.clip(lower=1)
