        \ the Deequ classpath cannot be pinned\")\n    # `spark.jars` takes URIs;\
        \ the driver classpath takes plain filesystem paths.\n    local = [jar[len(\"\
        file://\"):] if jar.startswith(\"file://\") else jar for jar in jars]\n  \
        \  return (\n        SparkSession.builder.appName(\"deequ-local\")\n     \
        \   .master(\"local[2]\")\n        .config(\"spark.driver.memory\", \"4g\"\
        )\n        .config(\"spark.jars\", \",\".join(jars))\n        .config(\"spark.driver.extraClassPath\"\
        , \":\".join(local))\n        .config(\"spark.executor.extraClassPath\", \"\
        :\".join(local))\n        .config(\"spark.driver.host\", \"localhost\")\n\
        \        .config(\"spark.ui.enabled\", \"false\")\n        .config(\"spark.sql.execution.arrow.pyspark.enabled\"\
        , \"true\")\n        .getOrCreate()\n    )\n\n\ndef load_codes(path: Path)\
        \ -> list[str]:\n    \"\"\"Accept JSON, or one constraint per line so quoting\
        \ never blocks a check.\"\"\"\n    text = path.read_text(encoding=\"utf-8\"\
        ).strip()\n    if not text:\n        return []\n    if text.lstrip()[0] in\
        \ \"[{\":\n        try:\n            payload = json.loads(text)\n        except\
        \ json.JSONDecodeError as exc:\n            print(f\"warning: {path.name}\
        \ is not valid JSON ({exc}); \"\n                  f\"falling back to one-constraint-per-line\
        \ parsing.\")\n            payload = None\n        if payload is not None:\n\
        \            if isinstance(payload, dict):\n                payload = payload.get(\"\
        constraints\", [])\n            codes = []\n            for item in payload:\n\
        \                if isinstance(item, str):\n                    codes.append(item)\n\
        \                else:\n                    codes.append(item.get(\"code_for_constraint\"\
        ) or item.get(\"suggestion\"))\n            return [code for code in codes\
        \ if code]\n    codes = []\n    for line in text.splitlines():\n        line\
        \ = line.strip()\n        if not line or line.startswith(\"#\"):\n       \
        \     continue\n        codes.append(line)\n    return codes\n\n\ndef main()\
        \ -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n   \
        \ parser.add_argument(\"--table\", required=True, help=\"Table name (file\
        \ stem under data/tables).\")\n    parser.add_argument(\"--constraints\",\
        \ required=True,\n                        help='JSON: [\"<code>\", ...] or\
        \ {\"constraints\": [{\"code_for_constraint\": ...}]}')\n    args = parser.parse_args()\n\
        \n    csv_path = TABLES_DIR / f\"{args.table}.csv\"\n    if not csv_path.exists():\n\
        \        available = sorted(p.stem for p in TABLES_DIR.glob(\"*.csv\"))\n\
        \        print(f\"no such table: {args.table}. available: {available}\")\n\
        \        return 2\n\n    codes = load_codes(Path(args.constraints))\n    if\
        \ not codes:\n        print(\"no constraint code found in the given file\"\
        )\n        return 2\n\n    dataframe = pd.read_csv(csv_path)\n    manager\
        \ = DeequDataQualityManager()\n    spark_df, spark = manager.spark_df_from_pandas_df(dataframe,\
        \ spark_session=build_spark())\n    results = manager.validate_constraints_with_reasons(spark,\
        \ spark_df, codes, isolated_check=True)\n\n    held = 0\n    for code, (is_valid,\
        \ reason) in zip(codes, results):\n        held += int(bool(is_valid))\n \
        \       print(f\"[{'HOLDS' if is_valid else 'FAILS'}] {code}\")\n        if\
        \ not is_valid:\n            print(f\"          reason: {reason}\")\n    print(f\"\
        \\n{held}/{len(codes)} constraint(s) hold on table '{args.table}' \"\n   \
        \       f\"({len(dataframe)} rows).\")\n\n    try:\n        spark.sparkContext._gateway.shutdown_callback_server()\n\
        \    except Exception:\n        pass\n    try:\n        spark.stop()\n   \
        \ except Exception:\n        pass\n    return 0\n\n\nif __name__ == \"__main__\"\
        :\n    code = main()\n    sys.stdout.flush()\n    os._exit(code)\nimport argparse\n\
        import json\nimport math\nimport os\n\nimport numpy as np\nimport pandas as\
        \ pd\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
        \ type=str, required=True)\n    parser.add_argument('--output', type=str,\
        \ required=True)\n    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input,\
        \ 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\n    # Columns\n    target_col\
        \ = 'Target'\n    day_col = 'Daytime/evening attendance\\t'\n    app_order_col\
        \ = 'Application order'\n\n    c1_enr = 'Curricular units 1st sem (enrolled)'\n\
        \    c1_apr = 'Curricular units 1st sem (approved)'\n    c1_crd = 'Curricular\
        \ units 1st sem (credited)'\n    c1_noe = 'Curricular units 1st sem (without\
        \ evaluations)'\n    c1_grd = 'Curricular units 1st sem (grade)'\n\n    c2_enr\
        \ = 'Curricular units 2nd sem (enrolled)'\n    c2_apr = 'Curricular units\
        \ 2nd sem (approved)'\n    c2_crd = 'Curricular units 2nd sem (credited)'\n\
        \    c2_noe = 'Curricular units 2nd sem (without evaluations)'\n    c2_grd\
        \ = 'Curricular units 2nd sem (grade)'\n\n    debtor_col = 'Debtor'\n    tuition_col\
        \ = 'Tuition fees up to date'\n    scholar_col = 'Scholarship holder'\n\n\
        \    gdp_col = 'GDP'\n    unemp_col = 'Unemployment rate'\n    infl_col =\
        \ 'Inflation rate'\n\n    # --- Target distribution assumptions and usage\
        \ ---\n    target_counts = df[target_col].value_counts(normalize=True)\n \
        \   p_grad = float(target_counts.get('Graduate', 0.0))\n    p_dropout = float(target_counts.get('Dropout',\
        \ 0.0))\n    p_enrolled = float(target_counts.get('Enrolled', 0.0))\n    #\
        \ Use priors to calibrate an intercept term for risk normalization\n    #\
        \ The transform relies on proportions being bounded away from {0,1}\n    prior_dropout_logit\
        \ = math.log(p_dropout / max(1e-12, (1.0 - p_dropout)))\n\n    # --- Attendance\
        \ assumptions and usage ---\n    day_series = df[day_col]\n    day_share =\
        \ day_series.mean()\n    # Attendance factor: nighttime students (0) add more\
        \ risk\n    attendance_penalty = (1 - day_series).astype(float)\n\n    # ---\
        \ Application order assumptions and usage ---\n    app = df[app_order_col]\n\
        \    share_first_choice = (app == 1).mean()\n    share_in_allowed = app.isin([1,\
        \ 2, 3, 4, 5, 6]).mean()\n    # Use the shares to scale the application-order\
        \ risk component\n    first_choice_lift = math.sqrt(share_first_choice - 0.60)\n\
        \    allowed_order_cohesion = math.sqrt(share_in_allowed - 0.95)\n    app_penalty\
        \ = np.where(app == 1, 0.0, (app.clip(lower=1) - 1) / 5.0) * (1.0 + 0.5 *\
        \ (1.0 - first_choice_lift))\n\n    # --- Fee status and scholarship assumptions\
        \ and usage ---\n    debtor = df[debtor_col].astype(int)\n    tuition_up =\
        \ df[tuition_col].astype(int)\n    scholar = df[scholar_col].astype(int)\n\
        \    # Fee risk: being a debtor and not up-to-date increases risk; scholarship\
        \ moderates if compliant\n    fee_risk = 0.6 * debtor + 0.4 * (1 - tuition_up)\n\
        \    scholar_bonus = np.where((scholar == 1) & (tuition_up == 1), -0.15, 0.0)\n\
        \n    # --- Macro environment assumptions and usage ---\n    allowed_gdp =\
        \ [-4.06, -3.12, -1.7, -0.92, 0.32, 0.79, 1.74, 1.79, 2.02, 3.51]\n    allowed_unemp\
        \ = [7.6, 8.9, 9.4, 10.8, 11.1, 12.4, 12.7, 13.9, 15.5, 16.2]\n    allowed_infl\
        \ = [-0.8, -0.3, 0.3, 0.5, 0.6, 1.4, 2.6, 2.8, 3.7]\n    # Map macro values\
        \ to ordinal indices for a stable adjustment\n    gdp_rank = {v: i for i,\
        \ v in enumerate(sorted(allowed_gdp))}\n    unemp_rank = {v: i for i, v in\
        \ enumerate(sorted(allowed_unemp))}\n    infl_rank = {v: i for i, v in enumerate(sorted(allowed_infl))}\n\
        \n    gdp_idx = df[gdp_col].map(gdp_rank).astype(int)\n    unemp_idx = df[unemp_col].map(unemp_rank).astype(int)\n\
        \    infl_idx = df[infl_col].map(infl_rank).astype(int)\n\n    # Macro stress\
        \ increases with unemployment rank and mild with inflation; growth offsets\
        \ slightly\n    macro_stress = (unemp_idx / (len(unemp_rank) - 1)) * 0.8 +\
        \ (infl_idx / (len(infl_rank) - 1)) * 0.3 - (\n                gdp_idx / (len(gdp_rank)\
        \ - 1)) * 0.2\n    macro_stress = np.clip(macro_stress, 0.0, 1.0)\n\n    #\
        \ --- Academic performance assumptions and usage (1st semester) ---\n    g1\
        \ = df[c1_grd].astype(float)\n    e1 = df[c1_enr].astype(float)\n    a1 =\
        \ df[c1_apr].astype(float)\n    cr1 = df[c1_crd].astype(float)\n    ne1 =\
        \ df[c1_noe].astype(float)\n    e1_safe = e1.replace(0, np.nan)\n    pass_rate1\
        \ = (a1 / e1_safe).clip(0.0, 1.0).fillna(0.0)\n    no_eval_ratio1 = (ne1 /\
        \ e1_safe).clip(0.0, 1.0).fillna(0.0)\n    grade_gap1 = (20.0 - g1) / 20.0\n\
        \n    # --- Academic performance assumptions and usage (2nd semester) ---\n\
        \    g2 = df[c2_grd].astype(float)\n    e2 = df[c2_enr].astype(float)\n  \
        \  a2 = df[c2_apr].astype(float)\n    cr2 = df[c2_crd].astype(float)\n   \
        \ ne2 = df[c2_noe].astype(float)\n    e2_safe = e2.replace(0, np.nan)\n  \
        \  pass_rate2 = (a2 / e2_safe).clip(0.0, 1.0).fillna(0.0)\n    no_eval_ratio2\
        \ = (ne2 / e2_safe).clip(0.0, 1.0).fillna(0.0)\n    grade_gap2 = (20.0 - g2)\
        \ / 20.0\n\n    # Use the 2nd-sem no-evaluation sparsity assumption to create\
        \ a scale that is only defined under that sparsity\n    share_non_zero_noeval2\
        \ = 1.0 - (ne2 == 0).mean()\n    noeval_sparsity_scale = math.sqrt(0.10 -\
        \ share_non_zero_noeval2)\n\n    # --- Compose risk components ---\n    academic_gap\
        \ = 0.45 * grade_gap2 + 0.25 * grade_gap1 + 0.15 * (1 - pass_rate2) + 0.10\
        \ * (1 - pass_rate1) + 0.05 * (\n                0.6 * no_eval_ratio2 + 0.4\
        \ * no_eval_ratio1)\n    academic_gap = np.clip(academic_gap, 0.0, 1.0)\n\n\
        \    # Application risk moderated by cohort cohesion\n    application_risk\
        \ = np.clip(app_penalty * (1.0 + (1.0 - allowed_order_cohesion)), 0.0, 1.0)\n\
        \n    # Attendance risk is higher for evening students\n    attendance_risk\
        \ = np.clip(attendance_penalty * (1.1 - first_choice_lift), 0.0, 1.0)\n\n\
        \    # Fee risk adjusted by scholarship bonus\n    fee_risk_adj = np.clip(fee_risk\
        \ + scholar_bonus, 0.0, 1.0)\n\n    # Macro risk adjusted by sparsity-derived\
        \ scaling to avoid over-amplification when no-eval is mostly zero\n    macro_risk\
        \ = np.clip(macro_stress * (1.0 + 0.5 * noeval_sparsity_scale), 0.0, 1.0)\n\
        \n    # Age factor (older entrants slightly higher risk)\n    age = df['Age\
        \ at enrollment'].astype(float)\n    age_risk = np.clip((age - 25.0) / 20.0,\
