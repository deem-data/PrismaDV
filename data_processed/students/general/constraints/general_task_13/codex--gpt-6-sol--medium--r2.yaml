        \ share_non_zero_noeval2)\n\n    # --- Compose risk components ---\n    academic_gap\
        \ = 0.45 * grade_gap2 + 0.25 * grade_gap1 + 0.15 * (1 - pass_rate2) + 0.10\
        \ * (1 - pass_rate1) + 0.05 * (\n                0.6 * no_eval_ratio2 + 0.4\
        \ * no_eval_ratio1)\n    academic_gap = np.clip(academic_gap, 0.0, 1.0)\n\n\
        \    # Application risk moderated by cohort cohesion\n    application_risk\
        \ = np.clip(app_penalty * (1.0 + (1.0 - allowed_order_cohesion)), 0.0, 1.0)\n\
        \n    # Attendance risk is higher for evening students\n    attendance_risk\
        \ = np.clip(attendance_penalty * (1.1 - first_choice_lift), 0.0, 1.0)\n\n\
        \    # Fee risk adjusted by scholarship bonus\n    fee_risk_adj = np.clip(fee_risk\
        \ + scholar_bonus, 0.0, 1.0)\n\n    # Macro risk adjusted by sparsity-derived\
        \ scaling to avoid over-amplification when no-eval is mostly zero\n    macro_risk\
        \ = np.clip(macro_stress * (1.0 + 0.5 * noeval_sparsity_scale), 0.0, 1.0)\n\
        \n    # Age factor (older entrants slightly higher risk)\n    age = df['Age\
        \ at enrollment'].astype(float)\n    age_risk = np.clip((age - 25.0) / 20.0,\
        \ 0.0, 1.0)\n\n    # Combine into a 0-100 score; calibrate with prior logit\
        \ so that baseline aligns with historical dropout prevalence\n    raw_score\
        \ = (\n            0.35 * academic_gap +\n            0.20 * fee_risk_adj\
        \ +\n            0.15 * attendance_risk +\n            0.10 * application_risk\
        \ +\n            0.10 * macro_risk +\n            0.10 * age_risk\n    )\n\
        \n    # Normalize to 0-100 and shift by prior\n    prior_shift = 5.0 * np.tanh(prior_dropout_logit\
        \ / 4.0)\n    risk_score = np.clip(raw_score * 100.0 + prior_shift, 0.0, 100.0)\n\
        \n    # Priority tiers\n    bins = [-0.01, 40, 70, 100]\n    labels = ['Low',\
        \ 'Medium', 'High']\n    priority = pd.cut(risk_score, bins=bins, labels=labels)\n\
        \n    # Fee management flag (immediate outreach): high risk or debtor not\
        \ up-to-date\n    urgent_fee_flag = ((risk_score >= 70) | ((debtor == 1) &\
        \ (tuition_up == 0))).astype(int)\n\n    out = df[[app_order_col, day_col,\
        \ debtor_col, tuition_col, scholar_col, c1_enr, c2_enr]].copy()\n    out['risk_score']\
        \ = risk_score.round(2)\n    out['priority'] = priority.astype(str)\n    out['urgent_fee_flag']\
        \ = urgent_fee_flag\n\n    os.makedirs(args.output, exist_ok=True)\n    out_path\
        \ = os.path.join(args.output, 'student_weekly_risk_scores.csv')\n    out.to_csv(out_path,\
        \ index=False)\n\n    # Export lightweight diagnostics for monitoring (no\
        \ PII)\n    diag = {\n        'n_rows': int(len(df)),\n        'share_first_choice':\
