      uid: b02d6658-28ed-49f3-835c-f3f643a0a2f1
    - text: 'The proportion of values in ''Application order'' belonging to the set
        {1, 2, 3, 4, 5, 6} must be at least 95% (0.95), because `allowed_order_cohesion
        = math.sqrt(share_in_allowed - 0.95)` requires `share_in_allowed >= 0.95`
        to avoid a math domain ValueError. We could represent this assumption as a
        deequ constraint like this: .satisfies("CASE WHEN `Application order` IN (1,
        2, 3, 4, 5, 6) THEN 1 ELSE 0 END", "Allowed application orders share", lambda
        x: x >= 0.95)'
      sources:
      - start_line: 62
        end_line: 62
        file: ''
      - start_line: 65
        end_line: 65
        file: ''
      uid: 97155263-879f-4aef-98f7-bbcb4c71688f
    - text: 'The ''Application order'' column should be numeric/integral and have
