  \ qualification (grade)': 127.0, 'Nacionality': 1, \"Mother's qualification\": 19,\
  \ \"Father's qualification\": 38, \"Mother's occupation\": 4, \"Father's occupation\"\
  : 5, 'Admission grade': 120.7, 'Displaced': 1, 'Educational special needs': 0, 'Debtor':\
