        file: ''
      uid: 023093dd-eeba-483b-bf42-dd3ae0e33d07
    - text: The columns 'Debtor', 'Tuition fees up to date', and 'Scholarship holder'
        are jointly combined into a composite financial distress indicator 'financial_risk'
        = (Debtor == 1) + 0.5 * (Tuition fees up to date == 0) - 0.5 * (Scholarship
        holder == 1), which assumes values span between 0.0 and 1.5 when clipped.
        The code assumes each of these columns has numeric/integral types that support
        equality comparison with 0 and 1 and can be cast to float.
      sources:
