  '["Debtor","Scholarship holder","Tuition fees up to date"]':
    code: []
    assumptions:
    - text: 'The columns ''Tuition fees up to date'', ''Debtor'', and ''Scholarship
        holder'' must all be non-null and contain binary values (0 or 1). In the feature
        engineering step, these columns are evaluated for binary indicators (`== 1`
        and `== 0`) to compute `financial_risk`, and their raw values are converted
        to float and fed into `StandardScaler` and `LogisticRegression`. Any missing
        values across these three columns will cause scikit-learn''s `StandardScaler.fit_transform`
        to fail with a ValueError. In Deequ, this can be represented as: .isComplete(''Tuition
        fees up to date'').isComplete(''Debtor'').isComplete(''Scholarship holder'').isContainedIn(''Tuition
        fees up to date'', [''0'', ''1'']).isContainedIn(''Debtor'', [''0'', ''1'']).isContainedIn(''Scholarship
        holder'', [''0'', ''1''])'
