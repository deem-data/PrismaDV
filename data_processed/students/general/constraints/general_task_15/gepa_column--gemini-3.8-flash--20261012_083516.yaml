      \ col_name]`).\n3. **Type Coercion & Transformations**: Lines where the column\
      \ or its direct alias is transformed, cast, imputed, clipped, or normalized\
      \ (e.g., `.astype(...)`, `pd.to_numeric()`, `.fillna()`).\n4. **Intermediate\
      \ Aliases & Downstream Expressions**: Any assignment where a variable stores\
      \ the column's Series/array (e.g., `val = df[col].astype(int)`) AND all subsequent\
      \ lines where that variable is read, compared, filtered, or used in mathematical\
      \ expressions, conditions, aggregations, or statistical assertions (e.g., `(val\
      \ == 0).mean()`, `np.where(val == 1, ...)`, `1 - val`).\n   - *Note*: Tracking\
      \ these operations is critical because downstream data quality frameworks (e.g.,\
      \ Great Expectations, PyDeequ) rely on them to detect implicit data contracts\
      \ (e.g., non-null constraints, categorical sets, sparsity bounds to prevent\
      \ math domain errors).\n5. **Loops and Control Flow**: Loops or comprehension\
      \ headers that iterate over collections containing the column name (e.g., `for\
      \ col in num_cols:` where `num_cols` contains the target column), as well as\
      \ the loop body lines executing on it.\n6. **Persistence & Export**: Lines where\
      \ the column or DataFrames/Series retaining the column are exported, passed\
      \ along, copied, or written to disk (e.g., `df[[..., col]].to_csv(...)`).\n\n\
      ### Line Numbering Guidelines\n- **1-based indexing**: Line 1 corresponds to\
      \ the very first line of the provided `code_script`.\n- **Count every line**:\
      \ Blank lines, comments, and docstrings count towards line numbering. Do not\
      \ skip or shift lines.\n- **Multi-line statements**: If an expression or statement\
      \ spans multiple lines, output the complete span (`start_line` to `end_line`).\n\
      - **Merge continuous/adjacent ranges**: If consecutive lines touch the target\
