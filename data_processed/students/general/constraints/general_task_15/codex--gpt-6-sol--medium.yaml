  code_for_constraint: .isComplete('Target')
- column_name: Target
  code_for_constraint: .isContainedIn('Target', ['Graduate', 'Enrolled', 'Dropout'])
- column_name: Target
  code_for_constraint: '.satisfies("Target = ''Graduate''", ''graduate class present'',
    lambda fraction: fraction >= 0.01)'
- column_name: Target
  code_for_constraint: '.satisfies("Target = ''Enrolled''", ''enrolled class present'',
    lambda fraction: fraction >= 0.01)'
- column_name: Target
  code_for_constraint: '.satisfies("Target = ''Dropout''", ''dropout class present'',
    lambda fraction: fraction >= 0.01)'
- column_name: Admission grade
  code_for_constraint: .satisfies('`Admission grade` IS NOT NULL AND `Admission grade`
    BETWEEN 0 AND 200', 'admission grade on 200 point scale')
- column_name: Previous qualification (grade)
  code_for_constraint: .satisfies('`Previous qualification (grade)` IS NOT NULL AND
    `Previous qualification (grade)` BETWEEN 0 AND 200', 'prior grade on 200 point
    scale')
- column_name: Application order
  code_for_constraint: .satisfies('`Application order` IS NOT NULL AND `Application
    order` >= 1 AND `Application order` = FLOOR(`Application order`)', 'valid application
    preference rank')
- column_name: "Daytime/evening attendance\t"
  code_for_constraint: .satisfies('`Daytime/evening attendance\t` IS NOT NULL AND
    `Daytime/evening attendance\t` IN (0, 1)', 'binary attendance')
- column_name: Age at enrollment
  code_for_constraint: .satisfies('`Age at enrollment` IS NOT NULL AND `Age at enrollment`
    BETWEEN 0 AND 120', 'valid age at enrollment')
- column_name: Displaced
  code_for_constraint: .satisfies('`Displaced` IS NOT NULL AND `Displaced` IN (0,
    1)', 'binary displacement')
- column_name: Debtor
  code_for_constraint: .satisfies('`Debtor` IS NOT NULL AND `Debtor` IN (0, 1)', 'binary
    debtor status')
- column_name: Tuition fees up to date
  code_for_constraint: .satisfies('`Tuition fees up to date` IS NOT NULL AND `Tuition
    fees up to date` IN (0, 1)', 'binary tuition status')
- column_name: Scholarship holder
  code_for_constraint: .satisfies('`Scholarship holder` IS NOT NULL AND `Scholarship
    holder` IN (0, 1)', 'binary scholarship status')
- column_name: Gender
  code_for_constraint: .satisfies('`Gender` IS NOT NULL AND `Gender` IN (0, 1)', 'binary
    gender code')
- column_name: International
  code_for_constraint: .satisfies('`International` IS NOT NULL AND `International`
    IN (0, 1)', 'binary international status')
- column_name: Unemployment rate
  code_for_constraint: .satisfies('`Unemployment rate` IS NOT NULL AND `Unemployment
    rate` BETWEEN 0 AND 100', 'valid unemployment percentage')
- column_name: Inflation rate
  code_for_constraint: .isComplete('Inflation rate')
- column_name: GDP
  code_for_constraint: .isComplete('GDP')
- column_name: Curricular units 1st sem (enrolled)
  code_for_constraint: .satisfies('`Curricular units 1st sem (enrolled)` IS NOT NULL
    AND `Curricular units 1st sem (enrolled)` >= 0 AND `Curricular units 1st sem (enrolled)`
    = FLOOR(`Curricular units 1st sem (enrolled)`)', 'first semester enrollment count')
- column_name: Curricular units 1st sem (approved)
  code_for_constraint: .satisfies('`Curricular units 1st sem (approved)` IS NOT NULL
    AND `Curricular units 1st sem (approved)` >= 0 AND `Curricular units 1st sem (approved)`
    <= `Curricular units 1st sem (enrolled)` AND `Curricular units 1st sem (approved)`
    = FLOOR(`Curricular units 1st sem (approved)`)', 'first semester valid pass count')
- column_name: Curricular units 1st sem (without evaluations)
  code_for_constraint: .satisfies('`Curricular units 1st sem (without evaluations)`
    IS NOT NULL AND `Curricular units 1st sem (without evaluations)` >= 0 AND `Curricular
    units 1st sem (without evaluations)` <= `Curricular units 1st sem (enrolled)`
    AND `Curricular units 1st sem (without evaluations)` = FLOOR(`Curricular units
    1st sem (without evaluations)`)', 'first semester valid unevaluated count')
- column_name: Curricular units 1st sem (evaluations)
  code_for_constraint: .satisfies('`Curricular units 1st sem (evaluations)` IS NOT
    NULL AND `Curricular units 1st sem (evaluations)` >= 0 AND `Curricular units 1st
    sem (evaluations)` = FLOOR(`Curricular units 1st sem (evaluations)`)', 'first
    semester valid evaluation count')
- column_name: Curricular units 2nd sem (enrolled)
  code_for_constraint: .satisfies('`Curricular units 2nd sem (enrolled)` IS NOT NULL
    AND `Curricular units 2nd sem (enrolled)` >= 0 AND `Curricular units 2nd sem (enrolled)`
    = FLOOR(`Curricular units 2nd sem (enrolled)`)', 'second semester enrollment count')
- column_name: Curricular units 2nd sem (approved)
  code_for_constraint: .satisfies('`Curricular units 2nd sem (approved)` IS NOT NULL
    AND `Curricular units 2nd sem (approved)` >= 0 AND `Curricular units 2nd sem (approved)`
    <= `Curricular units 2nd sem (enrolled)` AND `Curricular units 2nd sem (approved)`
    = FLOOR(`Curricular units 2nd sem (approved)`)', 'second semester valid pass count')
- column_name: Curricular units 2nd sem (without evaluations)
  code_for_constraint: .satisfies('`Curricular units 2nd sem (without evaluations)`
    IS NOT NULL AND `Curricular units 2nd sem (without evaluations)` >= 0 AND `Curricular
    units 2nd sem (without evaluations)` <= `Curricular units 2nd sem (enrolled)`
    AND `Curricular units 2nd sem (without evaluations)` = FLOOR(`Curricular units
    2nd sem (without evaluations)`)', 'second semester valid unevaluated count')
- column_name: Curricular units 2nd sem (without evaluations)
  code_for_constraint: '.satisfies(''`Curricular units 2nd sem (without evaluations)`
    = 0'', ''second semester unevaluated mostly zero'', lambda fraction: fraction
    >= 0.9)'
- column_name: Curricular units 2nd sem (evaluations)
  code_for_constraint: .satisfies('`Curricular units 2nd sem (evaluations)` IS NOT
    NULL AND `Curricular units 2nd sem (evaluations)` >= 0 AND `Curricular units 2nd
    sem (evaluations)` = FLOOR(`Curricular units 2nd sem (evaluations)`)', 'second
    semester valid evaluation count')
