        # Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
        \ describing what\nthe program below assumes about its input data. If new\
        \ data arrived that violated\none of your constraints, the program should\
        \ be expected to misbehave -- crash,\nsilently produce a wrong number, or\
        \ drop records it should have kept.\n\nYour output is a single file, `constraints.json`,\
        \ in the current folder.\n\n# The program\n\nThis program consumes the dataset.\n\
        \n```python\nimport argparse\nimport json\nimport os\n\nimport joblib\nimport\
        \ numpy as np\nimport pandas as pd\nfrom sklearn.linear_model import LogisticRegression\n\
        from sklearn.metrics import classification_report, accuracy_score, f1_score\n\
        from sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing\
        \ import StandardScaler\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
        \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
        \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_csv\
        \ = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
        \ exist_ok=True)\n\n    df = pd.read_csv(input_csv)\n\n    # Identify attendance\
        \ column robustly (may contain a trailing tab)\n    attendance_candidates\
        \ = [c for c in df.columns if c.replace('\\t', '').strip() == 'Daytime/evening\
        \ attendance']\n    attendance_col = attendance_candidates[0] if attendance_candidates\
        \ else 'Daytime/evening attendance\\t'\n\n    # Column aliases\n    col_target\
        \ = 'Target'\n    col_app_order = 'Application order'\n    col_debtor = 'Debtor'\n\
        \    col_tuition = 'Tuition fees up to date'\n    col_scholar = 'Scholarship\
        \ holder'\n\n    col_adm_grade = 'Admission grade'\n    col_prevq_grade =\
        \ 'Previous qualification (grade)'\n\n    s1_enrolled = 'Curricular units\
        \ 1st sem (enrolled)'\n    s1_approved = 'Curricular units 1st sem (approved)'\n\
        \    s1_noeval = 'Curricular units 1st sem (without evaluations)'\n    s1_evals\
        \ = 'Curricular units 1st sem (evaluations)'\n    s1_credited = 'Curricular\
        \ units 1st sem (credited)'\n    s1_grade = 'Curricular units 1st sem (grade)'\n\
        \n    s2_enrolled = 'Curricular units 2nd sem (enrolled)'\n    s2_approved\
        \ = 'Curricular units 2nd sem (approved)'\n    s2_noeval = 'Curricular units\
        \ 2nd sem (without evaluations)'\n    s2_evals = 'Curricular units 2nd sem\
        \ (evaluations)'\n    s2_credited = 'Curricular units 2nd sem (credited)'\n\
        \    # Correlation between admissions and previous qualification grades\n\
        \    # First semester curricular consistency\n    # Second semester \"without\
        \ evaluations\" mostly zero and non-negative integer\n    # Feature engineering\
        \ that relies on the verified constraints\n    def safe_divide(num, den):\n\
        \        den_safe = np.where(den > 0, den, 1)\n        return np.where(den\
        \ > 0, num / den_safe, 0.0)\n\n    grade_scaled = df[col_adm_grade] / 200.0\n\
        \    prevq_scaled = df[col_prevq_grade] / 200.0\n    grade_consensus = 0.6\
        \ * grade_scaled + 0.4 * prevq_scaled\n\n    first_sem_pass_rate = safe_divide(df[s1_approved].to_numpy(),\
        \ df[s1_enrolled].to_numpy())\n    first_sem_engagement = 1.0 - safe_divide(df[s1_noeval].to_numpy(),\
        \ df[s1_enrolled].to_numpy())\n    first_sem_eval_load = safe_divide(df[s1_evals].to_numpy(),\
        \ df[s1_enrolled].to_numpy())\n\n    second_sem_pass_rate = safe_divide(df[s2_approved].to_numpy(),\
        \ df[s2_enrolled].to_numpy())\n    second_sem_engagement = 1.0 - safe_divide(df[s2_noeval].to_numpy(),\
        \ df[s2_enrolled].to_numpy())\n    second_sem_eval_load = safe_divide(df[s2_evals].to_numpy(),\
        \ df[s2_enrolled].to_numpy())\n\n    financial_risk = (\n            (df[col_debtor]\
        \ == 1).astype(float)\n            + (df[col_tuition] == 0).astype(float)\
        \ * 0.5\n            - (df[col_scholar] == 1).astype(float) * 0.5\n    )\n\
        \    financial_risk = np.clip(financial_risk, 0.0, 1.5)\n\n    first_choice\
        \ = (df[col_app_order] == 1).astype(int)\n\n    # Base dropout rate used to\
        \ set an alert threshold\n    base_rates = df[col_target].value_counts(normalize=True)\n\
        \    dropout_base = float(base_rates.get('Dropout', 0.0))\n    risk_threshold\
        \ = min(0.9, dropout_base + 0.08)\n\n    # Assemble model features\n    feature_frame\
        \ = pd.DataFrame({\n        'grade_scaled': grade_scaled,\n        'prevq_scaled':\
        \ prevq_scaled,\n        'grade_consensus': grade_consensus,\n        'first_sem_pass_rate':\
        \ first_sem_pass_rate,\n        'first_sem_engagement': first_sem_engagement,\n\
        \        'first_sem_eval_load': first_sem_eval_load,\n        'second_sem_pass_rate':\
        \ second_sem_pass_rate,\n        'second_sem_engagement': second_sem_engagement,\n\
        \        'second_sem_eval_load': second_sem_eval_load,\n        'financial_risk':\
        \ financial_risk,\n        'first_choice': first_choice,\n        'daytime_attendance':\
        \ df[attendance_col].astype(float),\n        'age_at_enrollment': df['Age\
        \ at enrollment'].astype(float),\n        'unemployment_rate': df['Unemployment\
        \ rate'].astype(float),\n        'inflation_rate': df['Inflation rate'].astype(float),\n\
        \        'gdp': df['GDP'].astype(float),\n        'international': df['International'].astype(float),\n\
        \        'displaced': df['Displaced'].astype(float),\n        'gender': df['Gender'].astype(float),\n\
        \        'debtor': df[col_debtor].astype(float),\n        'tuition_up_to_date':\
        \ df[col_tuition].astype(float),\n        'scholarship': df[col_scholar].astype(float),\n\
        \    })\n\n    # Target encoding\n    class_order = ['Graduate', 'Enrolled',\
        \ 'Dropout']\n    label_to_int = {cls: i for i, cls in enumerate(class_order)}\n\
        \    y = df[col_target].map(label_to_int).astype(int)\n\n    X_train, X_test,\
        \ y_train, y_test = train_test_split(\n        feature_frame.values, y.values,\
        \ test_size=0.2, random_state=42, stratify=y.values\n    )\n\n    scaler =\
        \ StandardScaler()\n    X_train_scaled = scaler.fit_transform(X_train)\n \
        \   X_test_scaled = scaler.transform(X_test)\n\n    clf = LogisticRegression(max_iter=200,\
        \ multi_class='multinomial', solver='lbfgs')\n    clf.fit(X_train_scaled,\
        \ y_train)\n\n    y_pred = clf.predict(X_test_scaled)\n    y_proba = clf.predict_proba(X_test_scaled)\n\
        \n    acc = accuracy_score(y_test, y_pred)\n    f1_macro = f1_score(y_test,\
        \ y_pred, average='macro')\n    report = classification_report(y_test, y_pred,\
        \ target_names=class_order, output_dict=True)\n\n    # Persist model artifacts\n\
        \    joblib.dump({'scaler': scaler, 'model': clf, 'features': list(feature_frame.columns),\
        \ 'class_order': class_order},\n                os.path.join(args.output,\
        \ 'early_warning_model.joblib'))\n\n    metrics_path = os.path.join(args.output,\
        \ 'metrics.json')\n    with open(metrics_path, 'w') as f:\n        json.dump({'accuracy':\
        \ acc, 'f1_macro': f1_macro, 'classification_report': report}, f, indent=2)\n\
        \n    # Full-dataset scoring for deployment\n    X_all_scaled = scaler.transform(feature_frame.values)\n\
        \    proba_all = clf.predict_proba(X_all_scaled)\n    pred_all = clf.predict(X_all_scaled)\n\
        \n    # Intervention queue focuses on Dropout risk\n    dropout_idx = class_order.index('Dropout')\n\
        \    dropout_prob = proba_all[:, dropout_idx]\n    predicted_label = [class_order[i]\
        \ for i in pred_all]\n\n    preds_df = pd.DataFrame({\n        'row_id': np.arange(len(df)),\n\
        \        'predicted_label': predicted_label,\n        'prob_Graduate': proba_all[:,\
        \ class_order.index('Graduate')],\n        'prob_Enrolled': proba_all[:, class_order.index('Enrolled')],\n\
        \        'prob_Dropout': dropout_prob,\n    })\n\n    preds_df.to_csv(os.path.join(args.output,\
        \ 'predictions.csv'), index=False)\n\n    intervention_df = preds_df.loc[preds_df['prob_Dropout']\
        \ >= risk_threshold].sort_values('prob_Dropout',\n                       \
