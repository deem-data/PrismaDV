constraints:
  Age at enrollment:
    code:
    - - .isComplete('Age at enrollment')
      - Valid
    assumptions: []
    column_name: Age at enrollment
  Application order:
    code:
    - - '.hasCompliance(''Allowed application orders coverage >= 0.96'', ''`Application
        order` IN (1,2,3,4,5,6)'', lambda v: v >= 0.96)'
      - Invalid
    - - '.hasCompliance(''First choice share > 0.60'', ''`Application order` = 1'',
        lambda v: v >= 0.60)'
      - Invalid
    - - .isComplete('Application order')
      - Valid
    assumptions: []
    column_name: Application order
  Curricular units 1st sem (approved):
    code:
    - - '.hasCompliance(''1st sem approved <= enrolled'', ''`Curricular units 1st
        sem (approved)` <= `Curricular units 1st sem (enrolled)`'', lambda v: v ==
        1.0)'
      - Invalid
    - - .isNonNegative('Curricular units 1st sem (approved)')
      - Invalid
    assumptions: []
    column_name: Curricular units 1st sem (approved)
  Curricular units 1st sem (credited):
    code:
    - - .isNonNegative('Curricular units 1st sem (credited)')
      - Invalid
    assumptions: []
    column_name: Curricular units 1st sem (credited)
  Curricular units 1st sem (enrolled):
    code:
    - - .isNonNegative('Curricular units 1st sem (enrolled)')
      - Invalid
    assumptions: []
    column_name: Curricular units 1st sem (enrolled)
  Curricular units 1st sem (grade):
    code:
    - - '.hasMax(''Curricular units 1st sem (grade)'', lambda v: v <= 20.0)'
      - Valid
    - - '.hasMin(''Curricular units 1st sem (grade)'', lambda v: v >= 0.0)'
      - Valid
    - - .isComplete('Curricular units 1st sem (grade)')
      - Valid
    assumptions: []
    column_name: Curricular units 1st sem (grade)
  Curricular units 1st sem (without evaluations):
    code:
    - - '.hasCompliance(''1st sem without evaluations <= enrolled'', ''`Curricular
        units 1st sem (without evaluations)` <= `Curricular units 1st sem (enrolled)`'',
        lambda v: v == 1.0)'
      - Invalid
    - - .isNonNegative('Curricular units 1st sem (without evaluations)')
      - Invalid
    assumptions: []
    column_name: Curricular units 1st sem (without evaluations)
  Curricular units 2nd sem (approved):
    code:
    - - '.hasCompliance(''2nd sem approved <= enrolled'', ''`Curricular units 2nd
        sem (approved)` <= `Curricular units 2nd sem (enrolled)`'', lambda v: v ==
        1.0)'
      - Invalid
    - - .isNonNegative('Curricular units 2nd sem (approved)')
      - Invalid
    assumptions: []
    column_name: Curricular units 2nd sem (approved)
  Curricular units 2nd sem (credited):
    code:
    - - .isNonNegative('Curricular units 2nd sem (credited)')
      - Invalid
    assumptions: []
    column_name: Curricular units 2nd sem (credited)
  Curricular units 2nd sem (enrolled):
    code:
    - - .isNonNegative('Curricular units 2nd sem (enrolled)')
      - Invalid
    assumptions: []
    column_name: Curricular units 2nd sem (enrolled)
  Curricular units 2nd sem (grade):
    code:
    - - '.hasMax(''Curricular units 2nd sem (grade)'', lambda v: v <= 20.0)'
      - Valid
    - - '.hasMin(''Curricular units 2nd sem (grade)'', lambda v: v >= 0.0)'
      - Valid
    - - .isComplete('Curricular units 2nd sem (grade)')
      - Valid
    assumptions: []
    column_name: Curricular units 2nd sem (grade)
  Curricular units 2nd sem (without evaluations):
    code:
    - - '.hasCompliance(''2nd sem without evaluations <= enrolled'', ''`Curricular
        units 2nd sem (without evaluations)` <= `Curricular units 2nd sem (enrolled)`'',
        lambda v: v == 1.0)'
      - Invalid
    - - .isNonNegative('Curricular units 2nd sem (without evaluations)')
      - Invalid
    assumptions: []
    column_name: Curricular units 2nd sem (without evaluations)
  "Daytime/evening attendance\t":
    code:
    - - ".isComplete('Daytime/evening attendance\t')"
      - Valid
    - - ".isContainedIn('Daytime/evening attendance\t', [0, 1])"
      - Invalid
    assumptions: []
    column_name: "Daytime/evening attendance\t"
  Debtor:
    code:
    - - .isComplete('Debtor')
      - Valid
    - - .isContainedIn('Debtor', [0, 1])
      - Invalid
    assumptions: []
    column_name: Debtor
  GDP:
    code:
    - - '.hasCompliance(''GDP allowed values'', ''`GDP` IN (-4.06, -3.12, -1.7, -0.92,
        0.32, 0.79, 1.74, 1.79, 2.02, 3.51)'', lambda v: v == 1.0)'
      - Invalid
    - - .isComplete('GDP')
      - Valid
    assumptions: []
    column_name: GDP
  Inflation rate:
    code:
    - - '.hasCompliance(''Inflation rate allowed values'', ''`Inflation rate` IN (-0.8,
        -0.3, 0.3, 0.5, 0.6, 1.4, 2.6, 2.8, 3.7)'', lambda v: v == 1.0)'
      - Invalid
    - - .isComplete('Inflation rate')
      - Valid
    assumptions: []
    column_name: Inflation rate
  Scholarship holder:
    code:
    - - .isComplete('Scholarship holder')
      - Valid
    - - .isContainedIn('Scholarship holder', [0, 1])
      - Invalid
    assumptions: []
    column_name: Scholarship holder
  Target:
    code:
    - - '.hasCompliance(''Target allowed values'', ''`Target` IN (''Graduate'',''Dropout'',''Enrolled'')'',
        lambda v: v == 1.0)'
      - Invalid
    - - .isComplete('Target')
      - Valid
    assumptions: []
    column_name: Target
  Tuition fees up to date:
    code:
    - - .isComplete('Tuition fees up to date')
      - Valid
    - - .isContainedIn('Tuition fees up to date', [0, 1])
      - Invalid
    assumptions: []
    column_name: Tuition fees up to date
  Unemployment rate:
    code:
    - - '.hasCompliance(''Unemployment rate allowed values'', ''`Unemployment rate`
        IN (7.6, 8.9, 9.4, 10.8, 11.1, 12.4, 12.7, 13.9, 15.5, 16.2)'', lambda v:
        v == 1.0)'
      - Invalid
    - - .isComplete('Unemployment rate')
      - Valid
    assumptions: []
    column_name: Unemployment rate
