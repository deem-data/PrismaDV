constraints:
  Admission grade:
    code:
    - - .isContainedInRange('Admission grade', 0, 200)
      - Invalid
    assumptions: []
    column_name: Admission grade
  Age at enrollment:
    code:
    - - .isComplete('Age at enrollment')
      - Valid
    - - .isContainedInRange('Age at enrollment', 16, 80)
      - Invalid
    assumptions: []
    column_name: Age at enrollment
  Application order:
    code:
    - - .isComplete('Application order')
      - Valid
    - - .isContainedInRange('Application order', 1, 9)
      - Invalid
    assumptions: []
    column_name: Application order
  Curricular units 1st sem (approved):
    code:
    - - '.satisfies(''`Curricular units 1st sem (approved)` <= `Curricular units 1st
        sem (enrolled)`'', ''sem1_approved_le_enrolled'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: Curricular units 1st sem (approved)
