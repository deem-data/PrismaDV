constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda x: x >= 0.85)'
      - Valid
    - - .hasPattern('Certificate', r'^[A-Za-z0-9 +\-]+$')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda x: x >= 0.80)'
      - Valid
    - - .hasPattern('Gross', r'^\d{1,3}(,\d{3})*$')
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.hasMax(''IMDB_Rating'', lambda x: x <= 10.0)'
      - Valid
    - - '.hasMin(''IMDB_Rating'', lambda x: x >= 0.0)'
      - Valid
    - - .isComplete('IMDB_Rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - '.containsURL(''Poster_Link'', lambda x: x >= 0.99)'
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - '.hasMax(''Released_Year'', lambda x: x <= 2026)'
      - Valid
    - - '.hasMin(''Released_Year'', lambda x: x >= 1900)'
      - Valid
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .hasPattern('Runtime', r'^\s*\d+\s*min\s*$')
      - Valid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title,Released_Year:
    code:
    - - .isUnique(['Series_Title','Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title,Released_Year
  Star1:
    code:
    - - .isComplete('Star1')
      - Valid
    assumptions: []
    column_name: Star1
  Star1,Star2,Star3,Star4:
    code:
    - - .satisfies('Star1 != Star2 and Star1 != Star3 and Star1 != Star4 and Star2
        != Star3 and Star2 != Star4 and Star3 != Star4', 'unique_cast_per_row', ['Star1','Star2','Star3','Star4'])
      - Invalid
    assumptions: []
    column_name: Star1,Star2,Star3,Star4
  Star2:
    code:
    - - .isComplete('Star2')
      - Valid
    assumptions: []
    column_name: Star2
  Star3:
    code:
    - - .isComplete('Star3')
      - Valid
    assumptions: []
    column_name: Star3
  Star4:
    code:
    - - .isComplete('Star4')
      - Valid
    assumptions: []
    column_name: Star4
