constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda v: v >= 0.85).hasPattern(''Certificate'',
        r''^(U|G|PG|TV-PG|UA|PG-13|TV-14|R|TV-MA|NC-17|A|Not Rated|Unrated|Approved|Passed|U/A|GP)$'',
        where=''Certificate IS NOT NULL'')'
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - '.isComplete(''Genre'').hasPattern(''Genre'', r''^[A-Za-z]+(?:, [A-Za-z]+)*$'',
        lambda v: v >= 0.95)'
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .hasPattern('Gross', r'^\d{1,3}(,\d{3})*$', where='Gross IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.isComplete(''IMDB_Rating'').hasMin(''IMDB_Rating'', lambda v: v >= 0.0).hasMax(''IMDB_Rating'',
        lambda v: v <= 10.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompliance(''meta_score_range'', "Meta_score IS NULL OR (Meta_score >=
        0 AND Meta_score <= 100)", lambda v: v == 1.0)'
      - Invalid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes').isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - '.isComplete(''Poster_Link'').hasPattern(''Poster_Link'', r''^https?://'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - '.isComplete(''Released_Year'').hasMin(''Released_Year'', lambda v: v >= 1900).hasMax(''Released_Year'',
        lambda v: v <= 2025)'
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.isComplete(''Runtime'').hasPattern(''Runtime'', r''^\s*\d{2,3}\s*min\s*$'',
        lambda v: v >= 0.95)'
      - Valid
    assumptions: []
    column_name: Runtime
