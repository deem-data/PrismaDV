constraints:
  Gross:
    code:
    - - '.hasPattern(''Gross'', r''^\d{1,3}(,\d{3})*$'', lambda v: v >= 0.95)'
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.hasMax(''IMDB_Rating'', lambda v: v <= 10.0)'
      - Valid
    - - '.hasMin(''IMDB_Rating'', lambda v: v >= 0.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompleteness(''Meta_score'', lambda v: v >= 0.80)'
      - Valid
    assumptions: []
    column_name: Meta_score
  Poster_Link:
    code:
    - - '.hasPattern(''Poster_Link'', r''^https?://'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: Poster_Link
  Runtime:
    code:
    - - '.hasPattern(''Runtime'', r''^\s*(4[5-9]|[5-9]\d|1\d\d|2[0-3]\d|240)\s*min\s*$'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: Runtime
  '[''Series_Title'', ''Released_Year'']':
    code:
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: '[''Series_Title'', ''Released_Year'']'
