constraints:
  Certificate:
    code:
    - - .hasCompleteness('Certificate', 0.85)
      - Invalid
    - - .satisfies("(Certificate IS NULL) OR Certificate IN ('G','PG','PG-13','R','NC-17','U','UA','A','12','12A','15','18')",
        'certificate_domain')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .hasPattern('Genre', '^[A-Za-z-]+(,\s*[A-Za-z-]+)*$')
      - Valid
    - - .isComplete('Genre')
      - Valid
    - - .satisfies("size(array_except(transform(split(Genre, ','), x -> trim(x)),
        array('Action','Adventure','Animation','Biography','Comedy','Crime','Drama','Family','Fantasy','Film-Noir','History','Horror','Music','Musical','Mystery','Romance','Sci-Fi','Sport','Thriller','War','Western')))
        = 0", 'genre_allowed_tokens')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .hasCompleteness('Gross', 0.80)
      - Invalid
    - - .satisfies('(Gross IS NULL) OR (Gross RLIKE ^[0-9]{1,3}(,[0-9]{3})*$)', 'gross_format')
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .hasMax('IMDB_Rating', 10.0)
      - Invalid
    - - .hasMin('IMDB_Rating', 0.0)
      - Invalid
    - - .isComplete('IMDB_Rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .hasCompleteness('Meta_score', 0.85)
      - Invalid
    - - .satisfies('(Meta_score IS NULL) OR (Meta_score >= 0 AND Meta_score <= 100)',
        'meta_score_range')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .hasMin('No_of_Votes', 1.0)
      - Invalid
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .hasPattern('Poster_Link', '^https?://.+')
      - Valid
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .hasMax('Released_Year', 2026)
      - Invalid
    - - .hasMin('Released_Year', 1900)
      - Invalid
    - - .hasPattern('Released_Year', '^[0-9]{4}$')
      - Invalid
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .hasPattern('Runtime', '^\d{2,3} min$')
      - Valid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
