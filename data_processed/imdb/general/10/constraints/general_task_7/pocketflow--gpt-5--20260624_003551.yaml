constraints:
  Certificate:
    code:
    - - .hasPattern('Certificate', r'^(U|UA|A|PG|PG-13|G|R|NC-17|Not Rated|Unrated|Passed|GP|12|12A|15|18|TV-G|TV-PG|TV-14|TV-MA)$',
        where='Certificate IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: Certificate
  Director:
    code:
    - - .isComplete('Director')
      - Valid
    assumptions: []
    column_name: Director
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .hasPattern('Gross', r'^\d{1,3}(,\d{3})*$', where='Gross IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      - Valid
    - - '.hasMax(''IMDB_Rating'', lambda v: v <= 10.0)'
      - Valid
    - - '.hasMin(''IMDB_Rating'', lambda v: v >= 0.0)'
      - Valid
    - - .isComplete('IMDB_Rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .hasDataType('Meta_score', ConstrainableDataTypes.Fractional)
      - Valid
    - - '.hasMax(''Meta_score'', lambda v: v <= 100.0, where=''Meta_score IS NOT NULL'')'
      - Invalid
    - - '.hasMin(''Meta_score'', lambda v: v >= 0.0, where=''Meta_score IS NOT NULL'')'
      - Invalid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Overview:
    code:
    - - .isComplete('Overview')
      - Valid
    assumptions: []
    column_name: Overview
  Poster_Link:
    code:
    - - .hasPattern('Poster_Link', r'^https?://')
      - Valid
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .hasPattern('Released_Year', r'^\d{4}$')
      - Invalid
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .hasPattern('Runtime', r'^\s*\d+\s*min\s*$')
      - Valid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title,Released_Year:
    code:
    - - .isUnique(['Series_Title','Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title,Released_Year
  Star1:
    code:
    - - .isComplete('Star1')
      - Valid
    assumptions: []
    column_name: Star1
  Star2:
    code:
    - - .isComplete('Star2')
      - Valid
    assumptions: []
    column_name: Star2
  Star3:
    code:
    - - .isComplete('Star3')
      - Valid
    assumptions: []
    column_name: Star3
  Star4:
    code:
    - - .isComplete('Star4')
      - Valid
    assumptions: []
    column_name: Star4
  id:
    code:
    - - .hasDataType('id', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('id')
      - Valid
    - - .isNonNegative('id')
      - Valid
    assumptions: []
    column_name: id
