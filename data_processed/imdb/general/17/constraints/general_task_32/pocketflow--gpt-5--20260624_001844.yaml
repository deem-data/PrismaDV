constraints:
  Certificate:
    code:
    - - .isContainedIn('Certificate', ['U','UA','PG','PG-13','R','G','NC-17','A','S','U/A','TV-14','TV-MA','TV-PG','Not
        Rated','NR','Passed','GP'])
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .hasPattern('Gross', '^\d{1,3}(,\d{3})*$')
      - Invalid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      - Valid
    - - .hasMax('IMDB_Rating', 10.0)
      - Invalid
    - - .hasMin('IMDB_Rating', 0.0)
      - Invalid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .hasCompleteness('Meta_score')
      - Invalid
    - - .hasDataType('Meta_score', ConstrainableDataTypes.Fractional)
      - Valid
    - - .hasMax('Meta_score', 100.0)
      - Invalid
    - - .hasMin('Meta_score', 0.0)
      - Invalid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
      - Valid
    - - .hasMin('No_of_Votes', 0)
      - Invalid
    assumptions: []
    column_name: No_of_Votes
  Overview:
    code:
    - - .isComplete('Overview')
      - Valid
    assumptions: []
    column_name: Overview
  Poster_Link:
    code:
    - - .hasPattern('Poster_Link', '^https?://')
      - Valid
    - - .hasUniqueness('Poster_Link')
      - Invalid
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
      - Valid
    - - .hasMax('Released_Year', 2026)
      - Invalid
    - - .hasMin('Released_Year', 1900)
      - Invalid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .hasPattern('Runtime', '^\d+\s*min$')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .hasUniqueness('Series_Title')
      - Invalid
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  id:
    code:
    - - .hasUniqueness('id')
      - Invalid
    assumptions: []
    column_name: id
