constraints:
  Certificate:
    code:
    - - '.satisfies("Certificate IS NULL OR Certificate IN (''U'',''UA'',''U/A'',''A'',''G'',''PG'',''PG-13'',''R'',''NC-17'',''Not
        Rated'',''TV-14'',''TV-MA'')", ''Certificate_allowed'', lambda v: v >= 1.0)'
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  IMDB_Rating:
    code:
    - - '.hasMax(''IMDB_Rating'', lambda v: v <= 10.0)'
      - Valid
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .isNonNegative('IMDB_Rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompleteness(''Meta_score'', lambda v: v >= 0.80)'
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Overview:
    code:
    - - .isComplete('Overview')
      - Valid
    assumptions: []
    column_name: Overview
  Poster_Link:
    code:
    - - .containsPattern('Poster_Link', '^https?://m\.media-amazon\.com/images/.+\.jpg$')
      - Invalid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - '.hasMax(''Released_Year'', lambda v: v <= 2035)'
      - Valid
    - - '.hasMin(''Released_Year'', lambda v: v >= 1900)'
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .containsPattern('Runtime', '^[0-9]+\s*min$')
      - Invalid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
