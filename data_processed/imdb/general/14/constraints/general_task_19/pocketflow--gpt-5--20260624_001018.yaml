constraints:
  Certificate:
    code:
    - - .isContainedIn('Certificate', ['U', 'UA', 'A', 'G', 'PG', 'PG-13', 'R', 'NC-17',
        'Not Rated', 'Unrated', 'Passed', 'Approved'])
      - Invalid
    assumptions: []
    column_name: Certificate
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .isContainedInRange('IMDB_Rating', 0.0, 10.0)
      - Invalid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .containsPattern('Poster_Link', '^https?://')
      - Invalid
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .isContainedInRange('Released_Year', 1900, 2026)
      - Invalid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .containsPattern('Runtime', '^\\d+\\s*min$')
      - Invalid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title,Released_Year:
    code:
    - - .hasUniqueness([ 'Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title,Released_Year
