constraints:
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda v: v >= 0.80)'
      - Valid
    - - '.hasPattern(''Gross'', ''^[0-9]{1,3}(,[0-9]{3})*$'', lambda v: v >= 0.80)'
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.hasMax(''IMDB_Rating'', lambda v: v <= 10.0)'
      - Valid
    - - '.hasMin(''IMDB_Rating'', lambda v: v >= 0.0)'
      - Valid
    - - .isComplete('IMDB_Rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - '.hasMin(''Released_Year'', lambda v: v >= 1900)'
      - Valid
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .containsPattern('Runtime', '^[1-9][0-9]{1,2} min$')
      - Invalid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title,Released_Year:
    code:
    - - .isUnique(['Series_Title','Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title,Released_Year
