  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code: []
    assumptions:
    - text: The 'IMDB_Rating' and 'Meta_score' columns are expected to have a positive
        correlation across valid pairs, as the code evaluates their correlation (expecting
        corr > 0.4) to dynamically assign the weighting factor for calculating 'HybridRating'.
        Furthermore, 'IMDB_Rating' must be populated whenever 'Meta_score' is missing
        to ensure 'MetaNormFilled' and subsequent 'HybridRating' do not produce null
        values. This can be validated using a correlation constraint such as Deequ's
        `.hasCorrelation("IMDB_Rating", "Meta_score", _ > 0.0)` or ensuring completeness
        of IMDB_Rating when Meta_score is null.
      sources:
      - start_line: 57
        end_line: 62
        file: ''
      uid: 2be2d1b2-0b80-4e10-a216-891d799a76e8
    - text: The calculation of 'WeightedRank' combines 'No_of_Votes' with the hybrid
        rating derived from 'IMDB_Rating' and 'Meta_score'. The 70th percentile threshold
        'm' and individual vote counts 'v' are combined with 'HybridRating' (R) and
        mean rating (C) using the formula (v / (v + m)) * R + (m / (v + m)) * C, assuming
        non-negative vote counts and valid numeric ratings across all records.
      sources:
      - start_line: 64
        end_line: 68
        file: ''
      uid: 1eec267e-304f-48dd-85c3-d5c02228c2f7
