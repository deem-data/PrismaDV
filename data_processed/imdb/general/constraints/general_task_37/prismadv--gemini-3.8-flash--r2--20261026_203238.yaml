    assumptions:
    - text: 'The ''No_of_Votes'' column can contain null or non-numeric values because
        the downstream code coerces invalid values to NaN using `pd.to_numeric(...,
        errors=''coerce'')` and fills missing values with 0 using `.fillna(0)`. We
