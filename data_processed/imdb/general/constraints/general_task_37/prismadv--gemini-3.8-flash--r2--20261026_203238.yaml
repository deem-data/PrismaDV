        ''R'', ''NC-17'', ''Not Rated'', ''TV-14'', ''TV-MA''}, with ''U/A'' being
        mapped to ''UA''. We can represent this assumption as a Deequ constraint like:
        .satisfies("`Certificate` IS NULL OR `Certificate` IN (''U'', ''UA'', ''U/A'',
        ''A'', ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''Not Rated'', ''TV-14'',
