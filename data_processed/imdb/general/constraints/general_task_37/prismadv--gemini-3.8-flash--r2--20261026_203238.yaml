        WHEN `No_of_Votes` IS NOT NULL THEN 1 ELSE 0 END", "Nullable No_of_Votes",
        lambda x: x >= 0)'
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: 2b74db25-af01-4945-a850-4567682924cd
    - text: 'The ''No_of_Votes'' column should contain non-negative values (i.e.,
        No_of_Votes >= 0), as it represents a count of votes and negative values could
        lead to unexpected behavior or division by zero in the weighted rank calculation
        `(v / (v + m)) * R + (m / (v + m)) * C`. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `No_of_Votes` IS NULL
        OR `No_of_Votes` >= 0 THEN 1 ELSE 0 END", "Non-negative No_of_Votes", lambda
        x: x == 1.0)'
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 64
        end_line: 68
        file: ''
      uid: aee69ab6-1b8b-4d70-9a17-7658f6849e71
    - text: 'The ''No_of_Votes'' column should have sufficiently positive values such
        that its 70th percentile `m` is strictly greater than 0, ensuring that the
        denominator `(v + m)` in the weighted rank formula is strictly positive and
        prevents division by zero when `v = 0`. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `No_of_Votes` > 0 THEN
        1 ELSE 0 END", "Sufficient Positive Votes", lambda x: x > 0.30)'
      sources:
      - start_line: 64
        end_line: 68
        file: ''
      uid: 6ef1fc9c-cfbd-4dcb-9745-0a9f2fd0cab9
