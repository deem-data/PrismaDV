    assumptions:
    - text: The columns 'IMDB_Rating' and 'Meta_score' should have sufficient overlapping
        non-null records to compute a valid Pearson correlation, and they are expected
        to have a positive correlation where higher IMDB ratings generally correspond
        to higher Metascores.
      sources:
      - start_line: 57
        end_line: 59
        file: ''
      uid: 5ecd52a8-9b8a-4443-8599-3ee3dac7c22a
    - text: '''IMDB_Rating'' is used as a fallback imputation for missing values in
        ''Meta_score'' (scaled down by 10.0) when calculating ''HybridRating''. Therefore,
        records where ''Meta_score'' is null must have a non-null ''IMDB_Rating''
        to ensure ''HybridRating'' can be computed.'
      sources:
      - start_line: 60
        end_line: 62
        file: ''
      uid: 6864b65a-59c1-4a5f-a2c2-c79d9debd311
    - text: The columns 'No_of_Votes', 'IMDB_Rating', and 'Meta_score' are combined
        to compute the composite metric 'WeightedRank' and subsequently used together
        to sort and rank movies in descending order.
      sources:
      - start_line: 60
        end_line: 68
        file: ''
      - start_line: 86
        end_line: 90
        file: ''
      uid: d36ff3ec-a7b5-4786-987a-49113f3a4739
