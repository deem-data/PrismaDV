      \ \"warning\" ONLY if the code explicitly and safely handles the condition with\
      \ robust fallbacks/defaults such that downstream execution and output remain\
      \ correct, but data quality is suboptimal.\n- Do not set all checks to \"warning\"\
      \ (a warning never catches an error) and do not set all to \"error\".\n- Calibrate\
      \ constraint strictness to prevent false alarms:\n  - For data types, use `.hasDataType(column,\
