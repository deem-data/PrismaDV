      \ lists like feed_cols), not solely the highlighted lines.\n2. Identify critical\
      \ properties whose violation would cause the code to crash OR silently produce\
      \ incorrect results (e.g., required data types for computations, necessary string\
      \ patterns, non-nullness when unhandled, or valid ranges).\n3. For columns that\
      \ are selected or passed through to downstream feeds/catalogs/exports:\n   -\
      \ Downstream consumers rely on correct data types (e.g., String for names, IDs,\
      \ text descriptions; Numeric for metrics). Never return an empty list of assumptions\
      \ if the target column exists in the dataset or output schema.\n   - Ground\
      \ assumptions in the column's role: distinguish strict requirements (e.g., valid\
      \ data type) from soft variations. Do not assume 100% completeness or uniqueness\
      \ for descriptive metadata unless the code strictly crashes or requires it.\
      \ If missing values do not crash execution, assume reasonable completeness (e.g.,\
      \ high completeness fraction) rather than zero-tolerance.\n4. Distinguish critical\
      \ requirements from conditions where the code gracefully handles missing or\
      \ abnormal values (e.g., explicit defaults, fillna, or coerce fallbacks).\n\n\
      Output only valid JSON (numbers without leading zeros): { \"assumptions\": [{\
      \ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }] },\
      \ ...] }"
