      \ x: x >= 0.95`) or include default values (e.g., 'Not Rated', 'NR') to avoid\
      \ false alarms.\n\n#### 3. Syntax and Function Rules\n- Constraints must start\
      \ with `.` (e.g., `.isComplete('column')`).\n- In `satisfies(condition, name)`,\
      \ write the condition as a SQL WHERE clause using backticks for column names\
      \ (e.g., ``'`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10'``).\n- In `hasPattern`,\
      \ always use Python raw string notation (e.g., `r\"^\\d+$\"`).\n- In `hasDataType`,\
      \ use `ConstrainableDataTypes.<Type>` from `pydeequ.checks.ConstrainableDataTypes`\
      \ (`Null`, `Fractional`, `Integral`, `Boolean`, `String`, `Numeric`).\n\n---\n\
      \n### Available PyDeequ Functions\n\n#### Row-Level Functions:\n- `.isComplete(column:\
      \ str)`\n- `.hasCompleteness(column: str, assertion: Callable[[float], bool])`\n\
      - `.areComplete(columns: List[str])`\n- `.haveCompleteness(columns: List[str],\
      \ assertion: Callable[[float], bool])`\n- `.areAnyComplete(columns: List[str])`\n\
      - `.satisfies(columnCondition: str, constraintName: str, assertion: Optional[Callable[[float],\
      \ bool]] = None)`\n- `.hasPattern(column: str, pattern: str, assertion: Optional[Callable[[float],\
      \ bool]] = None, name: Optional[str] = None)`\n- `.containsCreditCardNumber(column:\
      \ str, assertion: Optional[Callable[[float], bool]] = None)`\n- `.containsEmail(column:\
      \ str, assertion: Optional[Callable[[float], bool]] = None)`\n- `.containsURL(column:\
      \ str, assertion: Optional[Callable[[float], bool]] = None)`\n- `.containsSocialSecurityNumber(column:\
      \ str, assertion: Optional[Callable[[float], bool]] = None)`\n- `.hasDataType(column:\
      \ str, datatype: ConstrainableDataTypes, assertion: Optional[Callable[[float],\
      \ bool]] = None)`\n- `.isNonNegative(column: str, assertion: Optional[Callable[[float],\
      \ bool]] = None)`\n- `.isPositive(column: str, assertion: Optional[Callable[[float],\
