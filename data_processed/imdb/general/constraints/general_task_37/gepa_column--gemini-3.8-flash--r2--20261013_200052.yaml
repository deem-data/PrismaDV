      5. `assumptions`: A list of numbered assumptions (e.g., \"Assumption 0: ...\"\
      , \"Assumption 1: ...\") derived from the code and task.\n\n---\n\n### Output\
      \ Format\nReturn a single valid JSON object with the following structure:\n\
      ```json\n{\n  \"constraint_code\": [\n    {\n      \"suggestion\": \"<PyDeequ\
      \ constraint method starting with a dot '.'>\",\n      \"level\": \"error\"\
      \ | \"warning\",\n      \"linked assumptions\": [<indices of assumptions tested,\
      \ e.g., 0, 1>]\n    }\n  ]\n}\n```\n\n---\n\n### Guidelines for Constraint Design\
      \ & Level Assignment\n\n#### 1. Deciding Between \"error\" and \"warning\" (CRITICAL)\n\
      The verification suite evaluates batches of data. **Only constraints marked\
      \ with `level: \"error\"` will fail a batch and flag it as unsafe.** If you\
      \ set constraints to `\"warning\"`, PyDeequ will treat them as informational\
      \ only and will NOT catch unsafe batches, leading to zero error detection and\
      \ severe recall penalties.\n\n- **Set `\"level\": \"error\"`** when:\n  - Violating\
      \ the assumption would cause runtime crashes (e.g., `KeyError`, `ValueError`,\
      \ `TypeError`, `ZeroDivisionError`, `IndexError`) in the script. Examples include\
      \ missing required columns, unexpected `NaN` values fed into `int()` / `.astype(int)`,\
      \ unhandled regex extract failures, or non-numeric types in numeric calculations.\n\
      \  - The column is essential for the core pipeline logic or final output, and\
      \ invalid values (e.g., out-of-range ratings, wrong types, missing primary keys)\
      \ invalidate the output even if pandas operations partially coerce or handle\
      \ nulls.\n  - The check is the primary guardrail detecting corrupted/unsafe\
      \ batches for that column.\n  \n- **Set `\"level\": \"warning\"`** ONLY when:\n\
      \  - The script explicitly has robust, intentional fallback handling (e.g.,\
      \ `.fillna('NR')`, `.replace()`, optional display fields) AND the data anomaly\
      \ does not compromise downstream processing.\n  - The check is a soft statistical\
      \ or data quality sanity check (e.g., slight distribution shifts, optional metadata\
      \ fields).\n\n*Do NOT default to `\"warning\"` merely because Pandas provides\
      \ methods with `errors='coerce'` or `.fillna()` if the assumption represents\
      \ a critical data contract.*\n\n#### 2. Calibrating with `target_column_desc`\
      \ to Avoid False Alarms\n- **Completeness**: \n  - If `target_column_desc.completeness\
      \ < 1.0`, do NOT use `.isComplete('col')` (this will trigger false alarms on\
