    assumption_generation: "Analyze the code that touches the target column, the target\
      \ column description, and the downstream task to infer the necessary data assumptions\
      \ that PyDeequ checks can validate.\n\nFocus on assumptions that prevent code\
      \ crashes or silent erroneous results:\n1. Ground assumptions in actual operations\
      \ and column statistics:\n   - Type requirements: If the column undergoes arithmetic,\
      \ numeric comparison, or numeric conversion, assume it must be numeric. In CSV/tabular\
      \ pipelines, integer fields (e.g., Released_Year, vote counts) often have floating-point\
      \ representations (e.g., 1999.0); assume numeric compatibility rather than strictly\
      \ non-fractional integral types. For text and categorical fields (e.g., titles,\
      \ director names, cast members), assume String type.\n   - Completeness / Nullability:\
      \ If the column is required for downstream calculations (e.g., cast diversity\
      \ scoring, ID generation) or appears in critical feed deliverables with 1.0\
      \ completeness in clean data, assume non-null completeness is required. Missing\
      \ or 'nan' string values that silently corrupt scores or deliver incomplete\
      \ catalog records are critical failures. Only assume nulls are tolerated if\
      \ the code explicitly handles them safely with deliberate fallback defaults\
      \ (e.g., using `fillna`, `pd.notna`, `errors='coerce'`, or `dropna`).\n   -\
      \ Value validity and bounds: Infer domain ranges (e.g., years > 1800, non-negative\
      \ counts/ratings, valid score intervals) and distinctness rules (e.g., distinct\
      \ billed cast members within a record) where invalid values silently corrupt\
      \ calculations or rankings.\n2. Prioritize precision over over-constraining:\n\
      \   - Avoid trivial, non-testable statements such as \"the column is optional\"\
      \ or \"the column may contain nulls\". Every assumption must state a concrete\
      \ requirement for safe execution.\n   - Do not assume strict exclusivity or\
      \ narrow categories if the code uses fallback mechanisms (e.g., defaulting unmatched\
      \ categories to 'Not Rated' or 'NR').\n\nOutput only valid JSON (numbers without\
      \ leading zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
