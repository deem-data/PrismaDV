      - start_line: 50
        end_line: 50
        file: ''
      uid: 57e80b96-8502-4488-96a5-d2a2b8228fb9
    - text: The 'Certificate' column may contain null values; they are converted to
        'Not Rated', so input completeness is not required.
      sources:
      - start_line: 50
        end_line: 54
        file: ''
      uid: 9d768857-9495-4cf3-a8c7-6ac244474dc4
    - text: 'Non-null ''Certificate'' values intended to retain their classification
        in the output should exactly match one of: U, UA, U/A, A, G, PG, PG-13, R,
        NC-17, Not Rated, TV-14, or TV-MA. ''U/A'' is normalized to ''UA''; all other
        unrecognized values, including values with different casing or extra whitespace,
        become ''Not Rated''. Unrecognized values are tolerated by the code but should
        be monitored to avoid silently losing classifications.'
