  instructions:
    dataflow_inspector: 'Identify and list every line of the code that touches the
      target column: where it is read, written, filtered, transformed, merged, passed
      along, or used in calculations (including variables storing the extracted or
      converted column data). Do not include comments or lines unrelated to the target
      column. Use 1-based line numbers; put adjacent lines in one range.


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: "Code makes assumptions about its input data to function\
      \ correctly. Analyze how the target column is used in the focused code, the\
      \ column profile, and the task description, and write these assumptions as statements\
      \ about the input data that a Deequ check can test.\n\nDistinguish between:\n\
      1. Critical requirements: Properties whose violation would cause the code to\
      \ crash (e.g., missing column causing KeyError, unparseable types causing TypeError,\
      \ division by zero) OR silently corrupt calculations, scores, rankings, or exported\
      \ dataset outputs (e.g., negative numbers in counts/ratings, NaNs propagating\
      \ into rankings, or invalid data types in feeds).\n   - Foundational requirements:\
      \ If the target column is read, transformed, or included in final outputs, its\
      \ existence and conformance to its expected data type (e.g., String, Numeric,\
      \ Integral) is a critical requirement.\n   - Do NOT treat passive coercions\
      \ (such as `.astype(str)` turning NaNs into the string \"nan\" or generic CSV\
      \ serialization) as safe handling when downstream outputs depend on valid data\
      \ in that column.\n2. Handled / Non-critical properties: Variations that the\
      \ downstream code intentionally and gracefully accommodates with valid domain\
      \ fallbacks (e.g., `.fillna('Not Rated')` where the default is a legitimate\
      \ domain category, or explicit value clipping via `.clip()`).\n\nState each\
      \ assumption clearly, indicating whether its violation causes failure/silent\
      \ output corruption (critical) or is safely accommodated by business logic.\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
      \ }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks. Link each check\
      \ to the indices (from 0) of the assumptions it tests.\n\nConstraint Level Rules:\n\
      - Set level \"error\" if data violating the check causes the code to crash OR\
      \ silently produce wrong or corrupted results (e.g., invalid mathematical calculations,\
      \ NaN propagation into scores/ranks, distorted weights, or corrupted fields\
      \ in downstream outputs).\n  * Column existence and baseline data type: To test\
      \ that a required column exists and conforms to its expected schema, use `.hasDataType(column,\
      \ ConstrainableDataTypes.<Type>)` with level \"error\". This is essential because\
      \ missing columns or type mismatches break execution or corrupt downstream outputs.\n\
      \  * Essential integrity: Ensure that critical assumptions protecting computation\
      \ integrity and output schemas are set to \"error\". If a column has only \"\
      warning\" constraints, it can never flag an erroneous partition.\n- Set level\
      \ \"warning\" ONLY if the downstream code explicitly and safely handles the\
      \ condition with a valid domain fallback (e.g., explicit `.fillna(...)` with\
      \ an accepted category, or `.clip(...)`) and continues running with correct,\
      \ untainted results despite imperfect data quality.\n- Precision guideline:\
      \ Do NOT make error-level constraints overly strict (e.g., avoid `isUnique`\
      \ unless uniqueness is an explicit functional requirement such as `verify_integrity=True`,\
      \ and avoid `isComplete` if the code safely defaults null values) to prevent\
      \ false alarms on safe data partitions.\n\nOutput: {\"constraint_code\": [{\"\
      suggestion\": PyDeequ code (starting with \".\" or a function), \"level\": \"\
      warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted',\
      \ lambda x: x >= 0.95)\nName: hasPattern, Description: Validates that column\
      \ values match a regular expression pattern. The pattern is a regex string.\
      \ The optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold. The optional name parameter\
      \ provides a descriptive name for the constraint.\nIMPORTANT: Use raw strings\
      \ (r\"...\") for regex patterns to avoid escape sequence issues. For example,\
      \ use r\"^\\d+$\" instead of \"^\\\\d+$\".\n RequiredArgs: ['column', 'pattern']\n\
      \ OptionalArgs: ['assertion', 'name']\n Examples:\n  - .hasPattern('student_id',\
      \ r'^id_\\d+$')\n  - .hasPattern('student_id', r'^id_\\d+$', lambda x: x >=\
      \ 0.95)\nName: containsCreditCardNumber, Description: Validates that values\
      \ in a string column are valid credit card numbers. The optional assertion lambda\
      \ receives the fraction of valid credit card numbers and returns a boolean indicating\
      \ if it meets the threshold.\n RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .containsCreditCardNumber('credit_card')\n  - .containsCreditCardNumber('credit_card',\
      \ lambda x: x >= 0)\nName: containsEmail, Description: Validates that values\
      \ in a string column are valid email addresses. The optional assertion lambda\
      \ receives the fraction of valid emails and returns a boolean indicating if\
      \ it meets the threshold.\n RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .containsEmail('email')\n  - .containsEmail('email', lambda\
      \ x: x >= 0)\nName: containsURL, Description: Validates that values in a string\
      \ column are valid URLs. The optional assertion lambda receives the fraction\
      \ of valid URLs and returns a boolean indicating if it meets the threshold.\n\
      \ RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .containsURL('url')\n\
      \  - .containsURL('url', lambda x: x >= 0)\nName: containsSocialSecurityNumber,\
      \ Description: Validates that values in a string column are valid US social\
      \ security numbers. The optional assertion lambda receives the fraction of valid\
      \ SSNs and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .containsSocialSecurityNumber('ssn')\n\
      \  - .containsSocialSecurityNumber('ssn', lambda x: x >= 0)\nName: hasDataType,\
      \ Description: Validates that values in a column conform to the specified data\
      \ type. The datatype parameter must be a ConstrainableDataTypes enum value from\
      \ pydeequ.checks.ConstrainableDataTypes. Valid enum values are: ConstrainableDataTypes.Null,\
      \ ConstrainableDataTypes.Fractional, ConstrainableDataTypes.Integral, ConstrainableDataTypes.Boolean,\
      \ ConstrainableDataTypes.String, and ConstrainableDataTypes.Numeric (union of\
      \ Integral and Fractional). The optional assertion lambda receives the fraction\
      \ of conforming rows and returns a boolean indicating if it meets the threshold.\n\
      \ RequiredArgs: ['column', 'datatype']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .hasDataType('student_id', ConstrainableDataTypes.String)\n  - .hasDataType('student_id',\
      \ ConstrainableDataTypes.String, lambda x: x >= 0.95)\nName: isNonNegative,\
      \ Description: Validates that a numeric column contains no negative values (values\
      \ >= 0). The optional assertion lambda receives the fraction of non-negative\
      \ rows and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .isNonNegative('credits_attempted')\n\
      \  - .isNonNegative('credits_attempted', lambda x: x >= 0.95)\nName: isPositive,\
      \ Description: Validates that a numeric column contains only positive values\
      \ (values > 0). The optional assertion lambda receives the fraction of positive\
      \ rows and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .isPositive('credits_attempted')\n\
      \  - .isPositive('credits_attempted', lambda x: x >= 0.95)\nName: isLessThan,\
      \ Description: Validates that values in columnA are less than corresponding\
      \ values in columnB for each row. The optional assertion lambda receives the\
      \ fraction of rows where columnA < columnB and returns a boolean indicating\
      \ if it meets the threshold.\n RequiredArgs: ['columnA', 'columnB']\n OptionalArgs:\
      \ ['assertion']\n Examples:\n  - .isLessThan('credits_completed', 'credits_attempted')\n\
      \  - .isLessThan('credits_completed', 'credits_attempted', lambda x: x >= 0.95)\n\
      Name: isLessThanOrEqualTo, Description: Validates that values in columnA are\
      \ less than or equal to corresponding values in columnB for each row. The optional\
      \ assertion lambda receives the fraction of rows where columnA <= columnB and\
      \ returns a boolean indicating if it meets the threshold.\n RequiredArgs: ['columnA',\
      \ 'columnB']\n OptionalArgs: ['assertion']\n Examples:\n  - .isLessThanOrEqualTo('credits_completed',\
      \ 'credits_attempted')\n  - .isLessThanOrEqualTo('credits_completed', 'credits_attempted',\
      \ lambda x: x >= 0.95)\nName: isGreaterThan, Description: Validates that values\
      \ in columnA are greater than corresponding values in columnB for each row.\
      \ The optional assertion lambda receives the fraction of rows where columnA\
      \ > columnB and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnA', 'columnB']\n OptionalArgs: ['assertion']\n Examples:\n  - .isGreaterThan('credits_attempted',\
      \ 'credits_completed')\n  - .isGreaterThan('credits_attempted', 'credits_completed',\
      \ lambda x: x >= 0.95)\nName: isGreaterThanOrEqualTo, Description: Validates\
      \ that values in columnA are greater than or equal to corresponding values in\
      \ columnB for each row. The optional assertion lambda receives the fraction\
      \ of rows where columnA >= columnB and returns a boolean indicating if it meets\
      \ the threshold.\n RequiredArgs: ['columnA', 'columnB']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed')\n\
      \  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed', lambda\
      \ x: x >= 0.95)\nName: isContainedIn, Description: Validates that each non-NULL\
      \ value in a column is contained in the specified set of allowed values. The\
      \ optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold.\n RequiredArgs: ['column',\
      \ 'allowed_values']\n OptionalArgs: ['assertion']\n Examples:\n  - .isContainedIn('target',\
      \ ['Graduate', 'Dropout', 'Enrolled'])\n  - .isContainedIn('target', ['Graduate',\
      \ 'Dropout', 'Enrolled'], lambda x: x >= 0.95)\n\nAvailable Aggregate-Level\
      \ Functions:\nName: hasSize, Description: Validates the total number of rows\
      \ in the dataframe. The assertion is a lambda function that receives the row\
      \ count as input and returns a boolean indicating whether the size meets the\
