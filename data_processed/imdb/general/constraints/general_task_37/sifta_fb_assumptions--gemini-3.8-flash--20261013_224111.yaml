      \ Examples:\n  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed')\n\
      \  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed', lambda\
      \ x: x >= 0.95)\nName: isContainedIn, Description: Validates that each non-NULL\
