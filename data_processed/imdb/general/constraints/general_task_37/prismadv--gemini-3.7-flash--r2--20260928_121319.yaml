  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'The correlation between ''IMDB_Rating'' and ''Meta_score'' is expected
        to be positive (and evaluated against a threshold > 0.4) when calculating
        ''HybridRating''. We could represent this assumption as a deequ constraint
        like: .hasCorrelation(''IMDB_Rating'', ''Meta_score'', _ > 0.0)'
      sources:
      - start_line: 57
        end_line: 62
        file: ''
      uid: 91855c0a-7381-413e-920b-94122e5e271c
    - text: '''IMDB_Rating'' serves as a fallback value for missing ''Meta_score''
        normalized ratings (''MetaNormFilled''). Therefore, whenever ''Meta_score''
        is null, ''IMDB_Rating'' must not be null so that ''HybridRating'' remains
        well-defined. We could represent this as a constraint ensuring that ''IMDB_Rating''
        is not null when ''Meta_score'' is null.'
      sources:
      - start_line: 60
        end_line: 62
        file: ''
      uid: a7be766e-a0af-419b-a90a-fb9660c71099
    - text: '''No_of_Votes'' and the rating components (''IMDB_Rating'', ''Meta_score'')
        are jointly used to compute ''WeightedRank''. Non-negative votes (''No_of_Votes''
        >= 0) and non-negative ratings are assumed so that the Bayesian weighted ranking
        denominator (v + m) is strictly positive.'
      sources:
      - start_line: 64
        end_line: 68
        file: ''
      uid: ea06967f-86e3-4574-be0b-6a3988a71c5a
  '["IMDB_Rating","Meta_score"]':
