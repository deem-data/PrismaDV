        end_line: 39
        file: ''
      - start_line: 57
        end_line: 62
        file: ''
      uid: b32c1a60-62d5-4b5d-a624-eec8ced4489a
    - text: 'The ''IMDB_Rating'' column should have values on the standard 0 to 10
        scale (or at least non-negative values up to 10), because `Meta_score` (out
        of 100) is scaled by dividing by 10 to be on the same scale as `IMDB_Rating`
        for computing `HybridRating`. We could represent this assumption as a deequ
        constraint like this: .satisfies("CASE WHEN `IMDB_Rating` IS NOT NULL THEN
        (`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0) ELSE TRUE END", "Valid IMDB
        Rating Range", lambda x: x == 1.0)'
      sources:
      - start_line: 60
        end_line: 62
        file: ''
      uid: 10b60795-a337-49d2-b6d9-8b10f36a79b7
    - text: 'The ''IMDB_Rating'' column should contain at least some rows with ratings
        greater than or equal to 7.0, because the script filters the catalog using
        `df[''IMDB_Rating''] >= 7.0` to generate the top movie feed. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `IMDB_Rating`
        >= 7.0 THEN 1 ELSE 0 END", "Has movies rated 7.0 or above", lambda x: x >
        0)'
      sources:
      - start_line: 70
        end_line: 70
        file: ''
      - start_line: 87
        end_line: 90
        file: ''
      uid: b1437f24-3a45-454f-9783-1b793508db94
