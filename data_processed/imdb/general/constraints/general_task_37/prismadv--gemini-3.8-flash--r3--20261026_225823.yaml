      reason_if_invalid: ''
      level: warning
      uid: 624e4dbb-0a25-44be-adaa-100b7a03d49f
      source_assumptions:
      - 360874f0-d500-4d3a-b53c-2019a44205e7
    - suggestion: '.isContainedIn(''Certificate'', [''U'', ''UA'', ''U/A'', ''A'',
        ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''Not Rated'', ''TV-14'', ''TV-MA''],
        lambda x: x >= 0.9)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b493b4a8-90c5-47a7-870a-9d853c418ecd
      source_assumptions:
      - ff35f940-5a06-4d95-a8ed-59c431081e0a
      - 7148fe68-1268-46a3-bb84-8463d7c55d14
    assumptions:
    - text: The 'Certificate' column is expected to exist and contain categorical
        string values representing film certification ratings.
      sources:
      - start_line: 46
        end_line: 54
        file: ''
      uid: ff35f940-5a06-4d95-a8ed-59c431081e0a
    - text: 'The ''Certificate'' column can contain missing or null values, as downstream
        processing handles missing or unmapped values by filling them with ''Not Rated''.
        We could represent this assumption as a deequ constraint checking completeness
        or allowing nulls: .isComplete(''Certificate'') is not strictly required.'
      sources:
      - start_line: 50
        end_line: 54
        file: ''
      uid: 360874f0-d500-4d3a-b53c-2019a44205e7
    - text: 'The ''Certificate'' column is expected to primarily contain valid rating
        values from the set: ''U'', ''UA'', ''U/A'', ''A'', ''G'', ''PG'', ''PG-13'',
        ''R'', ''NC-17'', ''Not Rated'', ''TV-14'', ''TV-MA''. We could represent
        this assumption as a deequ constraint like: .satisfies("CASE WHEN `Certificate`
        IS NULL OR `Certificate` IN (''U'', ''UA'', ''U/A'', ''A'', ''G'', ''PG'',
        ''PG-13'', ''R'', ''NC-17'', ''Not Rated'', ''TV-14'', ''TV-MA'') THEN 1 ELSE
        0 END", "Allowed Certificates", lambda x: x >= 0.9)'
      sources:
      - start_line: 46
        end_line: 53
        file: ''
      uid: 7148fe68-1268-46a3-bb84-8463d7c55d14
