      \ corrupting ranking formulas, corrupted calculations, or wrong data types in\
      \ output feeds).\n- Every validated column that is used in the script MUST have\
      \ at least one robust \"error\"-level constraint representing its core integrity\
      \ (such as .hasDataType(...) or .isComplete() / .hasCompleteness(...)). If all\
      \ constraints are set to \"warning\", the column will reject 0 batches and catch\
      \ no errors (scoring 0.00).\n- Coercion Rule: If the code uses `errors='coerce'`\
      \ or `.fillna()` on a column that is subsequently used in mathematical formulas,\
      \ weighted scores, or sorting, mark the data type constraint (`.hasDataType(...)`)\
      \ as \"error\", because non-numeric inputs silently corrupt the downstream calculations.\n\
