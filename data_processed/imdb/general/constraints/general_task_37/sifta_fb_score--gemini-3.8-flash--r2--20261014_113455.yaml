    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. Analyze the focused code and task description to determine the\
      \ assumptions the code requires about the target column:\n\n1. Code-Grounded\
      \ Failure Modes:\n   - Identify properties whose violation causes the code to\
      \ CRASH (e.g., calling .astype(int) on missing/non-numeric strings, unhandled\
      \ missing keys, regex extraction failing to match before type casting, division\
      \ by zero).\n   - Identify properties whose violation leads to SILENT CORRUPTION\
      \ (e.g., non-numeric data coerced to NaN via pd.to_numeric(..., errors='coerce')\
      \ that propagates NaNs into formulas, weighted ranks, aggregations, or rankings).\n\
      \   - Foundational Data Types: Every column used in operations, math, or exported\
      \ feeds fundamentally assumes its conforming data type (Numeric, Integral, Fractional,\
      \ or String).\n\n2. Safe Tolerance vs. False Alarm Traps:\n   - DO NOT assert\
      \ filter match conditions: If code filters rows (e.g., df[df['IMDB_Rating']\
      \ >= 7.0] or df[df['col'] == 'val']), DO NOT assume a partition must contain\
      \ values meeting that threshold (e.g., do NOT assume hasMax >= 7.0). An empty\
      \ or small filtered subset is standard data slicing, not data corruption. Asserting\
      \ filter thresholds causes severe false alarms on safe partitions.\n   - Do\
      \ NOT assume arbitrary statistical bounds (mean, min, max, quantiles) based\
      \ on sample statistics unless the column has an absolute logical boundary (e.g.,\
      \ probabilities in [0, 1], non-negative counts).\n   - Coercion with Downstream\
      \ Math: Graceful coercion like pd.to_numeric(..., errors='coerce') prevents\
      \ immediate crashes, but if the coerced column is used in calculations or ranking,\
      \ non-numeric values corrupt the results. Treat basic data type conformity as\
      \ an essential assumption.\n   - Completeness: Use target_column_desc. If the\
      \ column is required for catalog IDs, formulas, or output schemas, state completeness\
      \ (or high completeness >= 0.95 if minor missingness is tolerated).\n\n3. Specificity:\n\
      \   - State concrete, verifiable properties (expected data type, non-negativity,\
      \ completeness threshold, or allowed categorical values).\n\nOutput only valid\
      \ JSON (numbers without leading zeros): { \"assumptions\": [{ \"text\": str,\
      \ \"sources\": [{ \"start_line\": int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks. Link each check\
      \ to the indices (from 0) of the assumptions it tests.\n\nAssign the constraint\
      \ level carefully:\n- Set level \"error\" if violating the constraint causes\
      \ the code to CRASH (e.g., unhandled exception, type error, int cast failure\
