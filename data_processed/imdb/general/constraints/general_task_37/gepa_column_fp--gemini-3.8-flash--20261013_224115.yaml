      \ assertion)`: Maximum numeric value.\n- `.hasMean(column, assertion)`: Mean\
      \ numeric value.\n- `.hasStandardDeviation(column, assertion)`: Standard deviation.\n\
      - `.hasCorrelation(columnA, columnB, assertion)`: Pearson correlation between\
      \ two columns."
