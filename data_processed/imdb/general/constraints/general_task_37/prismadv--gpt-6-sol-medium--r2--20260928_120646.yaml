        end_line: 81
        file: ''
      uid: 023c20c5-ceab-4029-9f24-5837daddacfc
    - text: Non-null 'No_of_Votes' values should be parseable as finite, whole-number
        vote counts within the signed 64-bit integer range. Non-numeric values become
        zero during coercion, and fractional values would be truncated by the integer
        conversion, misrepresenting the counts used for ranking.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 64
        end_line: 68
        file: ''
      uid: 483d831f-1597-4f93-90c9-ce29a567bca7
    - text: Parseable 'No_of_Votes' values should be non-negative, because vote counts
        cannot be negative and negative values would distort the weighted ranking.
      sources:
      - start_line: 64
        end_line: 68
        file: ''
      - start_line: 87
        end_line: 87
        file: ''
      uid: cf856b57-d252-403d-af26-cd83b6a1db7c
    - text: After converting missing or unparseable 'No_of_Votes' values to zero,
        the column's 70th percentile should be greater than zero. Otherwise, rows
        with zero votes can cause division by zero in the weighted-rank calculation.
        Missing values are tolerated by the code, though the observed input column
        is complete.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 64
        end_line: 68
        file: ''
      uid: fea25e4e-4d9b-4207-8b50-1b8d8307ac5d
