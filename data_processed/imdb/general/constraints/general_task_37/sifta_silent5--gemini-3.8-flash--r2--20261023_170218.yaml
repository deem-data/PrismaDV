    assumption_generation: "Code makes assumptions about its input data to function\
      \ properly. From the code that uses the target column, the target_column_desc\
      \ profile, and the downstream task description, formulate assumptions about\
      \ the input data that a Deequ check can validate.\n\nGuidelines:\n1. Ground\
      \ assumptions strictly in code logic and execution consequences:\n   - Identify\
      \ properties whose violation would cause the script to CRASH (e.g., unhandled\
      \ TypeError, ValueError, int() cast failure on NaN) OR SILENTLY PRODUCE WRONG\
      \ RESULTS (e.g., NaN scores propagating through formulas, corrupted rankings,\
      \ inverted sorting, invalid rendered output, ID collisions).\n   - Distinguish\
      \ critical vs. non-critical columns: If a column is actively used in mathematical\
      \ scoring, ranking, or filtering, invalid values or coercion to NaN will silently\
      \ corrupt results even if `errors='coerce'` prevents an immediate crash. Formulate\
      \ strong assumptions for such columns. If a column is purely pass-through and\
      \ not used in calculations or gating, avoid overly strict assumptions that could\
      \ cause false alarms.\n   - Inspect `target_column_desc`: Check baseline completeness\
      \ and dataType. If observed completeness is < 1.0 (e.g., Certificate ~0.90),\
      \ missing values are part of clean data—do NOT assume strict completeness.\n\
      2. Incorporate dataset and domain knowledge (e.g., movie/catalog data):\n  \
      \ - Ratings (e.g., IMDB_Rating): Numeric and bounded between 0.0 and 10.0. Corrupted\
      \ or missing ratings corrupt ranking scores and eligibility filters.\n   - Vote\
      \ counts (e.g., No_of_Votes) and gross revenues (e.g., Gross): Non-negative\
      \ numeric values. When used in scoring formulas (e.g. Bayesian ranking), non-null\
      \ and numeric validity is required.\n   - Release years (e.g., Released_Year):\
      \ 4-digit positive integers representing valid cinema release years (e.g., between\
      \ 1888 and 2030).\n   - Runtimes (e.g., Runtime): Strings containing positive\
      \ integer minutes (e.g., '<digits> min') without negative or zero values.\n\
      \   - Certificate: Categorical string representing content ratings; clean data\
      \ typically contains nulls/unrated entries, so completeness should not be assumed.\n\
      3. Keep assumptions testable by Deequ (completeness, data types, value bounds,\
      \ patterns, and uniqueness).\n\nOutput only valid JSON (numbers without leading\
      \ zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks. \n\nConstraint\
