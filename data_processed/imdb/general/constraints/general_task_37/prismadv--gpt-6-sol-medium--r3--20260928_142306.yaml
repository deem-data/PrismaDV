        file: ''
      uid: 1673f9cd-11bf-45ab-b4b9-86faed05be6e
    - text: After numeric coercion and replacement of missing values with zero, the
        70th percentile of `No_of_Votes` should be greater than zero. This keeps the
        `v + m` denominator positive for nonnegative vote counts and prevents undefined
