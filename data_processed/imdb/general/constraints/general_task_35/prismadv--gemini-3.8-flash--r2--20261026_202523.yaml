    assumptions:
    - text: 'The ''Gross'' column can contain missing or null values (such as null,
        empty string, ''nan'', ''None'', ''NaN'') because the code explicitly cleans
        and normalizes these strings to NaN, and handles missing revenue with median
        imputation. We could represent this assumption as a deequ constraint like
        this: .isComplete("Gross", lambda x: x >= 0)'
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 55
        end_line: 58
        file: ''
      uid: ffa208ee-ed05-4ca9-b5ae-2dcbe7ed3277
    - text: 'When present and non-empty, values in the ''Gross'' column are expected
        to represent numeric revenue figures, potentially containing commas as thousands
        separators (e.g., matching a numeric pattern once commas are removed) that
        parse to non-negative numbers, used in log-transformation for revenue score
        calculation. We could represent this assumption as a deequ constraint like
        this: .satisfies("CASE WHEN `Gross` IS NOT NULL AND TRIM(`Gross`) NOT IN ('''',
        ''nan'', ''None'', ''NaN'') THEN (REPLACE(`Gross`, '','', '''') RLIKE ''^[0-9]+(\\.[0-9]+)?$''
        AND CAST(REPLACE(`Gross`, '','', '''') AS DOUBLE) >= 0) ELSE 1 END", "Valid
        Non-Negative Gross Values", lambda x: x == 1.0)'
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: 80cc07ad-f2ab-4bf1-b375-42b6e7e553e7
  IMDB_Rating:
