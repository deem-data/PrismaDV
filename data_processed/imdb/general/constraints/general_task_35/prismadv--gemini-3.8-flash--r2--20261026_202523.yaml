    assumptions:
    - text: 'The ''IMDB_Rating'' column is expected to be numeric or convertible to
        numeric values representing ratings, as the code uses `pd.to_numeric(df[''IMDB_Rating''],
        errors=''coerce'')` before performing mathematical operations. We could represent
        this assumption as a deequ constraint like this:

        .satisfies("CAST(`IMDB_Rating` AS DOUBLE) IS NOT NULL", "Numeric IMDB_Rating",
