      - start_line: 21
        end_line: 21
        file: ''
      uid: 98107236-59cc-4282-a573-c6e1a04848fd
    - text: "The 'IMDB_Rating' column is assumed to be on a 10-point scale between\
        \ 0.0 and 10.0, as it is divided by 10.0 to normalize the rating component\
        \ into a 0\u20131 score range and filtered with a quality threshold of 7.0.\
        \ We could represent this assumption as a deequ constraint like this:\n.satisfies(\"\
        CASE WHEN `IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0 THEN 1 ELSE 0 END\"\
        , \"Valid Rating Range\", lambda x: x == 1.0)"
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 0aa3324b-6beb-4e98-856c-b81fcd2d18df
    - text: 'The dataset is assumed to contain at least some titles with an ''IMDB_Rating''
        greater than or equal to 7.0 in order to pass the quality filter (`df[''IMDB_Rating'']
        >= 7.0`) and generate a non-empty licensing shortlist. We could represent
        this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `IMDB_Rating` >= 7.0 THEN 1 ELSE 0 END", "Has High Quality
        Ratings", lambda x: x > 0)'
      sources:
      - start_line: 79
        end_line: 80
        file: ''
      uid: 93dabbf9-17cd-42d4-9c2d-e1424d7e33f6
    - text: 'The ''IMDB_Rating'' column is assumed to be complete without missing
        values, as it is directly used in arithmetic operations to compute `rating_score`
        and `composite_score` without any imputation logic (unlike `Gross`, which
        explicitly imputes missing values). We could represent this assumption as
        a deequ constraint like this:

        .isComplete("IMDB_Rating")'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      uid: 57dce600-0cd6-443e-870e-1c6af42862f1
