    Genre:
      code:
      - - .satisfies("Genre IS NOT NULL AND TRIM(Genre) <> ''", 'present_genre')
        - Valid
      assumptions: []
      column_name: Genre
    Gross:
      code:
      - - '.hasCompleteness(''Gross'', lambda fraction: fraction > 0)'
        - Valid
      - - .satisfies("Gross IS NULL OR TRIM(Gross) = '' OR TRIM(Gross) RLIKE '^(0|[1-9][0-9]*|[1-9][0-9]{0,2}(,[0-9]{3})+)$'",
          'parseable_optional_gross')
        - Valid
      assumptions: []
      column_name: Gross
    IMDB_Rating:
      code:
      - - .isComplete('IMDB_Rating')
        - Valid
      - - .satisfies("IMDB_Rating BETWEEN 0 AND 10", 'rating_out_of_ten')
        - Valid
      assumptions: []
      column_name: IMDB_Rating
    No_of_Votes:
      code:
      - - .isComplete('No_of_Votes')
        - Valid
      - - .satisfies("No_of_Votes >= 0", 'nonnegative_votes')
        - Valid
      assumptions: []
      column_name: No_of_Votes
    Released_Year:
      code:
      - - .isComplete('Released_Year')
        - Valid
      - - .satisfies("Released_Year = FLOOR(Released_Year)", 'whole_release_year')
        - Valid
      - - .satisfies("Released_Year BETWEEN 1900 AND year(current_date())", 'valid_release_year')
        - Valid
      assumptions: []
      column_name: Released_Year
    Runtime:
      code:
      - - .isComplete('Runtime')
        - Valid
      - - .satisfies("TRIM(Runtime) RLIKE '^[1-9][0-9]{1,2} min$'", 'parseable_runtime_minutes')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda fraction:
          fraction == 1.0)'
        - Valid
      - - .isComplete('Series_Title')
        - Valid
      - - .satisfies("TRIM(Series_Title) <> ''", 'nonblank_title')
        - Valid
      assumptions: []
      column_name: Series_Title
