prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\
  \n    # Basic normalization of relevant fields\n    df['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'],\
  \ errors='coerce')\n    df['Released_Year'] = pd.to_numeric(df['Released_Year'],\
  \ errors='coerce')\n    df['Runtime'] = df['Runtime'].astype(str).str.strip()\n\
  \    # Normalize Gross to have NaN for missing/blank\n    if 'Gross' in df.columns:\n\
  \        gross_raw = df['Gross'].astype(str)\n        gross_raw = gross_raw.replace({\n\
  \            '': np.nan,\n            'nan': np.nan,\n            'None': np.nan,\n\
  \            'NaN': np.nan\n        })\n        df['Gross'] = gross_raw\n    else:\n\
  \        df['Gross'] = np.nan\n\n    # Score components configuration\n    current_year\
  \ = int(pd.Timestamp.today().year)\n    min_year = 1900\n    min_runtime = 60\n\
  \    max_runtime = 240\n    ideal_runtime = 110\n    target_runtime_low = 80\n \
  \   target_runtime_high = 140\n    rating_score = df['IMDB_Rating'] / 10.0\n   \
  \ year_span = float(current_year - min_year) if current_year > min_year else 1.0\n\
  \    recency_score = (df['Released_Year'] - min_year) / year_span\n    runtime_min\
  \ = df['Runtime'].str.extract(r'^([1-9][0-9]{1,2}) min$')[0].astype(int)\n    runtime_deviation\
  \ = (runtime_min - ideal_runtime).abs()\n    # Linearly decay from ideal with tolerance\
  \ window; negative clipped at 0\n    tolerance = 50.0\n    runtime_suitability =\
  \ 1.0 - (runtime_deviation / tolerance)\n    runtime_suitability = runtime_suitability.clip(lower=0.0,\
  \ upper=1.0)\n\n    present_mask = df['Gross'].notna() & (df['Gross'].astype(str).str.strip()\
  \ != '')\n    gross_num = pd.to_numeric(df['Gross'].astype(str).str.replace(',',\
  \ '', regex=False), errors='coerce')\n    # Impute missing revenue proxy with median\
  \ to avoid biasing scores where Gross is absent\n    gross_filled = gross_num.fillna(gross_num.median())\n\
  \    if np.isfinite(gross_filled.max()) and gross_filled.max() > 0:\n        revenue_score\
  \ = np.log1p(gross_filled) / np.log1p(gross_filled.max())\n    else:\n        revenue_score\
  \ = pd.Series(0.0, index=df.index)\n\n    # Composite score assembly\n    # Weights\
  \ tuned to favor quality and recency for licensing\n    w_rating = 0.4\n    w_recency\
  \ = 0.3\n    w_runtime = 0.15\n    w_revenue = 0.15\n    composite_score = (\n \
  \           w_rating * rating_score +\n            w_recency * recency_score +\n\
  \            w_runtime * runtime_suitability +\n            w_revenue * revenue_score\n\
  \    )\n\n    # Suitability filters for shortlist (keep code behavior dependent\
  \ on valid assumptions)\n    runtime_in_target = runtime_min.between(target_runtime_low,\
  \ target_runtime_high, inclusive='both')\n    quality_filter = df['IMDB_Rating']\
  \ >= 7.0\n    filtered = df[quality_filter & runtime_in_target].copy()\n\n    #\
  \ Attach computed fields for ranking and auditing\n    filtered['runtime_min'] =\
  \ runtime_min.loc[filtered.index]\n    filtered['rating_score'] = rating_score.loc[filtered.index]\n\
  \    filtered['recency_score'] = recency_score.loc[filtered.index]\n    filtered['revenue_score']\
  \ = revenue_score.loc[filtered.index]\n    filtered['composite_score'] = composite_score.loc[filtered.index]\n\
  \    # Rank and produce a mapping keyed by (title, year)\n    filtered['shortlist_rank']\
  \ = filtered['composite_score'].rank(method='dense', ascending=False).astype(int)\n\
  \    filtered.sort_values(['composite_score', 'No_of_Votes'], ascending=[False,\
  \ False], inplace=True)\n\n    # Build a dict for downstream contracts that rely\
  \ on unique keys\n    key_tuples = list(zip(filtered['Series_Title'].astype(str),\
  \ filtered['Released_Year'].astype(int)))\n    score_map = dict(zip(key_tuples,\
  \ filtered['composite_score'].round(6)))\n\n    # Outputs\n    shortlist_cols =\
  \ [\n        'Series_Title', 'Released_Year', 'IMDB_Rating', 'Runtime', 'runtime_min',\n\
  \        'Gross', 'composite_score', 'shortlist_rank', 'No_of_Votes', 'Genre', 'Director'\n\
  \    ]\n    shortlist_path = os.path.join(args.output, 'licensing_shortlist.csv')\n\
  \    filtered[shortlist_cols].to_csv(shortlist_path, index=False)\n\n    scores_path\
  \ = os.path.join(args.output, 'title_scores.csv')\n    scored_df = df.copy()\n \
  \   scored_df['runtime_min'] = runtime_min\n    scored_df['rating_score'] = rating_score\n\
  \    scored_df['recency_score'] = recency_score\n    scored_df['revenue_score']\
  \ = revenue_score\n    scored_df['composite_score'] = composite_score\n    scored_df.to_csv(scores_path,\
  \ index=False)\n\n    mapping_path = os.path.join(args.output, 'score_map.json')\n\
  \    with open(mapping_path, 'w', encoding='utf-8') as f:\n        json.dump({f\"\
  {k[0]} ({k[1]})\": float(v) for k, v in score_map.items()}, f, ensure_ascii=False,\
  \ indent=2)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_35.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 200, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BZjZlZDlkYTktMmU1My00ZDBiLWFlNjEtYTBhNjVhOTM4ZjJjXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Donnie Darko', 'Released_Year': 2001, 'Certificate': 'R', 'Runtime':\
  \ '113 min', 'Genre': 'Drama, Mystery, Sci-Fi', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'After narrowly escaping a bizarre accident, a troubled teenager is plagued by\
  \ visions of a man in a large rabbit suit who manipulates him to commit a series\
  \ of crimes.', 'Meta_score': 88.0, 'Director': 'Richard Kelly', 'Star1': 'Jake Gyllenhaal',\
  \ 'Star2': 'Jena Malone', 'Star3': 'Mary McDonnell', 'Star4': 'Holmes Osborne',\
  \ 'No_of_Votes': 740086, 'Gross': '1,480,006'}, {'id': 56, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BOWVmZGQ0MGYtMDI1Yy00MDkxLWJiYjQtMmZjZmQ0NDFmMDRhXkEyXkFqcGdeQXVyNjg3MDMxNzU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'The Peanut Butter Falcon', 'Released_Year': 2019, 'Certificate':\
  \ 'PG-13', 'Runtime': '97 min', 'Genre': 'Adventure, Comedy, Drama', 'IMDB_Rating':\
  \ 7.6, 'Overview': 'Zak runs away from his care home to make his dream of becoming\
  \ a wrestler come true.', 'Meta_score': 70.0, 'Director': 'Tyler Nilson', 'Star1':\
  \ 'Michael Schwartz', 'Star2': 'Zack Gottsagen', 'Star3': 'Ann Owens', 'Star4':\
  \ 'Dakota Johnson', 'No_of_Votes': 66346, 'Gross': '13,122,642'}, {'id': 43, 'Poster_Link':\
  \ 'https://m.media-amazon.com/images/M/MV5BMDU2ZWJlMjktMTRhMy00ZTA5LWEzNDgtYmNmZTEwZTViZWJkXkEyXkFqcGdeQXVyNDQ2OTk4MzI@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Toy Story', 'Released_Year': 1995, 'Certificate': 'U', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Adventure, Comedy', 'IMDB_Rating': 8.3, 'Overview':\
  \ \"A cowboy doll is profoundly threatened and jealous when a new spaceman figure\
  \ supplants him as top toy in a boy's room.\", 'Meta_score': 95.0, 'Director': 'John\
  \ Lasseter', 'Star1': 'Tom Hanks', 'Star2': 'Tim Allen', 'Star3': 'Don Rickles',\
  \ 'Star4': 'Jim Varney', 'No_of_Votes': 887429, 'Gross': '191,796,233'}]\n\nThe\
  \ full table is on disk at `./data/tables/observed_data.csv`. You have complete\
  \ access to it:\nload it with pandas, profile it, plot it, run whatever analysis\
  \ helps. It is a\nthrowaway copy -- nothing you do to it has any effect outside\
  \ this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ constraint\
  \ code against the staged table and read back\nthe result of every check:\n\n```\n\
  python deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
