constraints:
  Director:
    code:
    - - .isComplete('Director')
      - Valid
    assumptions: []
    column_name: Director
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR trim(Gross) = '' OR trim(Gross) IN ('nan', 'None',
        'NaN') OR trim(Gross) RLIKE '^(?:[0-9]+|[1-9][0-9]{0,2}(?:,[0-9]{3})+)$'",
        'parseable_gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating >= 0 AND IMDB_Rating <= 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year >= 1900 AND Released_Year <= year(current_date())',
        'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("trim(Runtime) RLIKE '^[1-9][0-9]{1,2} min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .satisfies('length(trim(cast(Series_Title as string))) > 0', 'nonblank_title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda value: value
        == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
