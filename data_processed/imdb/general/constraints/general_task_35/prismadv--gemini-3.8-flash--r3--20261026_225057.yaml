      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9b36f761-5257-41c2-be93-28ee45f791e1
      source_assumptions:
      - 02a70bc3-4dce-417e-a063-266dbb2db67f
    - suggestion: '.satisfies("`IMDB_Rating` >= 7.0 AND CAST(REGEXP_EXTRACT(`Runtime`,
        ''^([1-9][0-9]{1,2}) min$'', 1) AS INT) BETWEEN 80 AND 140", "Shortlist criteria
        must be satisfied", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2d7f2bce-e45a-4f92-b2c0-4703f2f39145
      source_assumptions:
      - 755c54b0-693a-4176-8be3-3a5db2e024e2
    assumptions:
    - text: 'Both ''IMDB_Rating'' and ''Runtime'' must be non-null for all records
        so that ''rating_score'' and ''runtime_suitability'' can be computed simultaneously
        to calculate ''composite_score''. We could represent this assumption as a
        Deequ constraint like: .satisfies("IMDB_Rating IS NOT NULL AND Runtime IS
        NOT NULL", "Rating and Runtime must be present")'
      sources:
      - start_line: 45
        end_line: 53
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      uid: 02a70bc3-4dce-417e-a063-266dbb2db67f
    - text: 'There should be records meeting both the quality filter (''IMDB_Rating''
        >= 7.0) and the runtime target filter (parsed ''Runtime'' between 80 and 140
        minutes) so that the resulting shortlist is non-empty. We could represent
        this assumption as a Deequ constraint checking the presence of qualifying
        records: .satisfies("IMDB_Rating >= 7.0 AND CAST(REGEXP_EXTRACT(Runtime, ''^([1-9][0-9]{1,2})
        min$'', 1) AS INT) BETWEEN 80 AND 140", "Shortlist criteria must be satisfied")'
      sources:
      - start_line: 48
        end_line: 48
        file: ''
      - start_line: 78
        end_line: 80
        file: ''
      uid: 755c54b0-693a-4176-8be3-3a5db2e024e2
  '["Released_Year","Series_Title"]':
