prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Director:
    code:
    - suggestion: '.hasCompleteness(''Director'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a021cc26-b44e-46b5-a17a-cc5bc0978777
      source_assumptions:
      - 44cc1fc3-50c5-4078-8100-62031426da4b
    assumptions:
    - text: 'The ''Director'' column must exist in the input dataset. The code selects
        ''Director'' directly in ''shortlist_cols'' without checking for its presence
        (unlike ''Gross''), and accesses it when saving the shortlist via ''filtered[shortlist_cols].to_csv(...)''.
        If the column is missing, this operation will raise a KeyError.

        We could represent this assumption as a Great Expectations expectation like
        this:

        expect_column_to_exist(''Director'')'
      sources:
      - start_line: 18
        end_line: 18
        file: ''
      - start_line: 97
        end_line: 100
        file: ''
      - start_line: 102
        end_line: 102
        file: ''
      uid: 44cc1fc3-50c5-4078-8100-62031426da4b
  Genre:
    code:
    - suggestion: '.hasCompleteness(''Genre'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 87ab7864-26cb-4d6b-8bcd-bacb7457a54b
      source_assumptions:
      - 43fb4323-745b-40f6-887c-169912fd393b
    assumptions:
    - text: The 'Genre' column must be present in the dataset because the script selects
        it as part of 'shortlist_cols' to output to 'licensing_shortlist.csv' without
        checking for its existence (unlike the 'Gross' column). If the 'Genre' column
        is missing, indexing `filtered[shortlist_cols]` will raise a KeyError.
      sources:
      - start_line: 97
        end_line: 102
        file: ''
      uid: 43fb4323-745b-40f6-887c-169912fd393b
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR trim(`Gross`) IN ('', 'nan', 'None',
        'NaN') OR CAST(regexp_replace(`Gross`, ',', '') AS DOUBLE) >= 0", "Gross_non_negative_or_missing")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2aa92ab7-2d14-454d-a826-2ff6f6ec110b
      source_assumptions:
      - dee33886-cbcf-4d9b-8388-a423128b98c3
      - 813f595d-3a52-4327-9782-9d97e36a8e6a
    assumptions:
    - text: The 'Gross' column can contain null, empty, or missing string representations
        (such as '', 'nan', 'None', 'NaN'), as the code explicitly normalizes these
        values to NaN and imputes missing numeric values with the column median.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 55
        end_line: 58
        file: ''
      uid: dee33886-cbcf-4d9b-8388-a423128b98c3
    - text: The non-null values in the 'Gross' column are expected to be string-formatted
        numbers, optionally formatted with thousand-separator commas (e.g., '10,000,000'),
        representing non-negative revenue values, since commas are removed before
        numeric conversion and logarithmic transformation with np.log1p.
      sources:
      - start_line: 56
        end_line: 60
        file: ''
      uid: 813f595d-3a52-4327-9782-9d97e36a8e6a
  IMDB_Rating:
    code:
    - suggestion: '.satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0'',
        ''IMDB_Rating Range'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7bd10b69-299e-438e-94e8-5867cc0d67f9
      source_assumptions:
      - 105bb385-b2e6-462e-a436-e6ce7d5bc934
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ed41e169-8318-4d56-91c6-8eefbd0bb0f3
      source_assumptions:
      - 8df1ce33-0fdd-49c5-8250-726415248728
    assumptions:
    - text: 'The ''IMDB_Rating'' column is expected to contain numeric values representing
        movie ratings on a 0 to 10 scale, so values should fall within the range [0.0,
        10.0]. This is assumed because the code normalizes the rating by dividing
        by 10.0 (to produce a score between 0 and 1) and filters for quality where
        rating is >= 7.0. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN `IMDB_Rating` >= 0.0 AND `IMDB_Rating` <=
        10.0 THEN 1 ELSE 0 END", "IMDB_Rating Range", lambda x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 105bb385-b2e6-462e-a436-e6ce7d5bc934
    - text: 'The ''IMDB_Rating'' column should not contain null values, as missing
        values will propagate NaNs into the composite score calculation. In the dataset,
        completeness is 1.0. We could represent this assumption as a deequ constraint
        like this: .isComplete("IMDB_Rating")'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      uid: 8df1ce33-0fdd-49c5-8250-726415248728
  No_of_Votes:
    code:
    - suggestion: .isComplete('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ef5a3354-24bd-4256-8442-3fecc80cf22a
      source_assumptions:
      - 750b62aa-f759-47b0-b52f-91e133cc4a51
      - 92ad32c1-056a-48e7-9655-cf28c68a65ce
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a422198f-65d7-4e54-baf5-76ac3f20c3f5
      source_assumptions:
      - 0b7011dc-f74a-4789-b616-e9b6df86a8eb
    - suggestion: '.satisfies(''`No_of_Votes` >= 0'', ''Non-negative Votes'', lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a70c9216-9d35-40b9-89aa-6572f6522c02
      source_assumptions:
      - 1120effe-7abf-4171-a4da-21668832af63
    assumptions:
    - text: The 'No_of_Votes' column must exist in the input dataset, as it is used
        directly in sorting the filtered dataset and selected in the output shortlist
        columns.
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      - start_line: 97
        end_line: 102
        file: ''
      uid: 750b62aa-f759-47b0-b52f-91e133cc4a51
    - text: The 'No_of_Votes' column should have a numeric (integral) data type so
        that sorting values descending in `sort_values` behaves numerically rather
        than lexicographically.
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      uid: 0b7011dc-f74a-4789-b616-e9b6df86a8eb
    - text: 'The ''No_of_Votes'' column should not contain null values, ensuring all
        rows can be reliably sorted and output in the final shortlist without missing
        vote counts. We could represent this assumption as a deequ constraint: .isComplete(''No_of_Votes'')'
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      - start_line: 97
        end_line: 102
        file: ''
      uid: 92ad32c1-056a-48e7-9655-cf28c68a65ce
    - text: 'The ''No_of_Votes'' column values should be non-negative (>= 0), representing
        a valid vote count. We could represent this assumption as a deequ constraint
        like this: .satisfies(''`No_of_Votes` >= 0'', ''Non-negative Votes'', lambda
        x: x == 1.0)'
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      uid: 1120effe-7abf-4171-a4da-21668832af63
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7c8ecb43-2992-4a58-a35a-8a2c8a63395c
      source_assumptions:
      - 76a5a58a-3076-436a-86b2-4f350c72b53a
    - suggestion: .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c4ee0763-4dfd-4a26-89ab-f584b1df9452
      source_assumptions:
      - f36d5ff4-6fa2-4342-867d-5ce114cf8244
    - suggestion: .satisfies('`Released_Year` >= 1900', 'Released_Year >= 1900')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d7f517ad-1918-4141-84d0-be5d85952a07
      source_assumptions:
      - 409824af-9531-4ae3-a1ff-608865f94ee1
    assumptions:
    - text: 'The ''Released_Year'' column must not contain null values, because in
        line 93 it is cast to an integer using `.astype(int)` without any missing
        value imputation. In pandas, calling `.astype(int)` on a series containing
        NaN or null values raises a ValueError. We could represent this assumption
        as a deequ constraint like this: .isComplete(''Released_Year'')'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 93
        end_line: 93
        file: ''
      uid: 76a5a58a-3076-436a-86b2-4f350c72b53a
    - text: 'The ''Released_Year'' column should have an integral data type or be
        numeric values representing years that can be coerced to integers, as the
        code parses it with pd.to_numeric and subsequently casts it to int. We could
        represent this assumption as a deequ constraint like this: .hasDataType(''Released_Year'',
        ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 93
        end_line: 93
        file: ''
      uid: f36d5ff4-6fa2-4342-867d-5ce114cf8244
    - text: 'The ''Released_Year'' column is expected to have values greater than
        or equal to 1900, as the recency score is calculated as `(df[''Released_Year'']
        - min_year) / year_span` with `min_year = 1900`. We could represent this assumption
        as a deequ constraint like this: .satisfies(''`Released_Year` >= 1900'', ''Released_Year
        >= 1900'', lambda x: x == 1.0)'
      sources:
      - start_line: 38
        end_line: 39
        file: ''
      - start_line: 46
        end_line: 47
        file: ''
      uid: 409824af-9531-4ae3-a1ff-608865f94ee1
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 10c49c89-35ed-485d-bb04-cfcc6a8dcf39
      source_assumptions:
      - 51b63a12-7aa2-47d0-963b-05139791acb9
    - suggestion: '.satisfies("TRIM(`Runtime`) RLIKE ''^[1-9][0-9]{1,2} min$''", "Valid
        Runtime Format", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 134499b7-b282-444a-95ba-3f3d6aa4ef35
      source_assumptions:
      - 6e0460aa-302e-4a93-a9be-880518f65f49
    assumptions:
    - text: 'The ''Runtime'' column must not contain null values, because missing
        values would fail to match the extraction pattern and result in NaN values,
        which will trigger a ValueError when converted to integer using `.astype(int)`.
        We could represent this assumption as a deequ constraint like this: .isComplete("Runtime")'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: 51b63a12-7aa2-47d0-963b-05139791acb9
    - text: 'Each value in the ''Runtime'' column (ignoring leading and trailing whitespace)
        must follow the format of 2 to 3 digits (from 10 to 999) followed by '' min''
        (matching regex pattern ''^[1-9][0-9]{1,2} min$''). If any value does not
        match this pattern, `str.extract` returns NaN, causing `.astype(int)` to raise
        a ValueError. We could represent this assumption as a deequ constraint like
        this: .satisfies("TRIM(`Runtime`) RLIKE ''^[1-9][0-9]{1,2} min$''", "Valid
        Runtime Format", lambda x: x == 1.0)'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: 6e0460aa-302e-4a93-a9be-880518f65f49
