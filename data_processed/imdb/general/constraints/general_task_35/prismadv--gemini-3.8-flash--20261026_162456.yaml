        We could represent this assumption as a deequ constraint like this:

        .hasDataType("No_of_Votes", ConstrainableDataTypes.Integral)

        '
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      uid: a443ad91-7a26-40ed-bef6-7da4053d9c68
    - text: 'The ''No_of_Votes'' column should not contain null values, as it is used
        directly to sort shortlisted titles and is included in the final output CSV
        without any missing value imputation or handling.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("No_of_Votes")

        '
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      - start_line: 97
        end_line: 102
        file: ''
      uid: 0195e12a-1b01-4fb8-acdb-e3e19f5cf6cc
    - text: 'The ''No_of_Votes'' column values should be non-negative (>= 0), as vote
        counts represent non-negative quantities when determining ranking priority.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`No_of_Votes` >= 0", "Non-negative No_of_Votes", lambda x: x ==
        1.0)

        '
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      uid: 30184d2d-3fc8-4948-b383-c24e807082e8
