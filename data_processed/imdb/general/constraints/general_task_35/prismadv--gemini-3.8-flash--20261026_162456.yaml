      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2f8b6198-f466-4b5e-9619-39feb0a32038
      source_assumptions:
      - bd020336-4593-456a-8fcb-2cc0312d846a
    assumptions:
    - text: 'The ''Runtime'' column should not contain null values. If any values
        are missing, string conversion and regex extraction will produce NaN, which
        causes the downstream `.astype(int)` operation to fail with a ValueError.
        We could represent this assumption as a deequ constraint like this: .isComplete("Runtime")'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: e62da526-e338-4d61-959e-346cfe6e5ea8
    - text: 'Each value in the ''Runtime'' column (allowing for surrounding whitespace)
        must match the regular expression format ''^[1-9][0-9]{1,2} min$'' (a 2 to
        3 digit integer between 10 and 999 followed by '' min''). If any value does
        not match this pattern, `.str.extract(...)` returns NaN, causing `.astype(int)`
        to fail. We could represent this assumption as a deequ constraint like this:
        .hasPattern("Runtime", r"^\s*[1-9][0-9]{1,2} min\s*$", lambda x: x == 1.0)'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
