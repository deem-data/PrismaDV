      source_assumptions:
      - 582d1db8-73fc-4fcd-957a-f81e82d5ba9d
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values or values that
        can be parsed as numbers, as it is converted with pd.to_numeric and used in
        arithmetic operations. We could represent this assumption as a deequ constraint
        like this: .isDataType(''IMDB_Rating'', ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 45
        end_line: 45
        file: ''
      uid: f6ce1d94-f18d-4801-aa99-ccd7bb00c2a3
    - text: 'The ''IMDB_Rating'' column should have values within the range [0.0,
        10.0], as it is normalized by dividing by 10.0 to form a component score and
        filtered for values >= 7.0. We could represent this assumption as a deequ
        constraint like this: .satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating`
        <= 10.0'', ''IMDB_Rating valid range'', lambda x: x == 1.0)'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 781d6af3-2abd-43c9-82c8-1683f155521c
    - text: 'The ''IMDB_Rating'' column is assumed to be largely non-null (completeness
        1.0), because unlike ''Gross'', missing values in ''IMDB_Rating'' are not
        imputed with a median or default value, which would propagate NaNs into ''composite_score''.
        We could represent this assumption as a deequ constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      uid: 582d1db8-73fc-4fcd-957a-f81e82d5ba9d
