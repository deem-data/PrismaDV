      validity: true
      reason_if_invalid: ''
      level: warning
      uid: eebc2dda-7100-4ce5-91f6-aec637cbc8e9
      source_assumptions:
      - 781d6af3-2abd-43c9-82c8-1683f155521c
    - suggestion: .isComplete('IMDB_Rating')
