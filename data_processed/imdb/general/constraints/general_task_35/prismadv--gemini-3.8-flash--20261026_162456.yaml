        file: ''
      - start_line: 97
        end_line: 102
        file: ''
      uid: 937c376d-7987-482d-8455-8f61eb0ba0c6
  Genre:
    code:
    - suggestion: '.hasCompleteness(''Genre'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 0da59e4a-91dd-49b7-a9c4-91dbb17579c2
      source_assumptions:
      - ba0b4e0c-acd9-4849-abe6-2104a98e3c74
    assumptions:
    - text: The 'Genre' column must exist in the input dataset, as it is explicitly
        selected in 'shortlist_cols' and written to the output file via 'filtered[shortlist_cols]'.
        If the column is missing, pandas will raise a KeyError.
      sources:
      - start_line: 97
        end_line: 102
        file: ''
      uid: ba0b4e0c-acd9-4849-abe6-2104a98e3c74
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR TRIM(`Gross`) IN ('', 'nan', 'None',
        'NaN') OR REPLACE(TRIM(`Gross`), ',', '') RLIKE '^[0-9]+(\\.[0-9]+)?$'", "Gross_is_numeric_string_and_non_negative")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 18d78645-d4a5-44af-9a02-1c167965aa07
      source_assumptions:
      - c64b80a1-80af-4d3e-ba34-9cb569810c3e
      - 3ffc7078-d256-4280-a979-d4c081dcb745
    assumptions:
    - text: The 'Gross' column can contain missing, null, or empty string representations
        (such as '', 'nan', 'None', 'NaN') as the code explicitly normalizes these
        to NaN and handles imputation using the median of numeric values.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 55
        end_line: 58
        file: ''
      uid: c64b80a1-80af-4d3e-ba34-9cb569810c3e
    - text: The 'Gross' column is expected to contain numeric values represented as
        strings, commonly formatted with commas as thousands separators (e.g., '123,456,789').
        These values should represent non-negative revenue figures as log1p is applied
        to them.
      sources:
      - start_line: 56
        end_line: 60
        file: ''
      uid: 3ffc7078-d256-4280-a979-d4c081dcb745
  IMDB_Rating:
