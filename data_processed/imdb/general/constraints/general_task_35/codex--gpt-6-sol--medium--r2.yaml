      - - .satisfies("Gross IS NULL OR trim(Gross) RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
          'parseable nonnegative gross when present')
        - Valid
      assumptions: []
      column_name: Gross
    IMDB_Rating:
      code:
      - - .isComplete('IMDB_Rating')
        - Valid
      - - .satisfies("IMDB_Rating >= 0 AND IMDB_Rating <= 10", 'rating on ten-point
          scale')
        - Valid
      assumptions: []
      column_name: IMDB_Rating
    No_of_Votes:
      code:
      - - .isComplete('No_of_Votes')
        - Valid
      - - .isNonNegative('No_of_Votes')
        - Valid
      assumptions: []
      column_name: No_of_Votes
    Released_Year:
      code:
      - - .isComplete('Released_Year')
        - Valid
      - - .satisfies("Released_Year >= 1900 AND Released_Year <= year(current_date())",
          'valid release year')
        - Valid
      assumptions: []
      column_name: Released_Year
    Runtime:
      code:
      - - .isComplete('Runtime')
        - Valid
      - - .satisfies("trim(Runtime) RLIKE '^[1-9][0-9]{1,2} min$'", 'runtime parseable
          in minutes')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda fraction:
          fraction == 1.0)'
        - Valid
      - - .isComplete('Series_Title')
        - Valid
      - - .satisfies("length(trim(Series_Title)) > 0", 'nonblank title')
        - Valid
      assumptions: []
      column_name: Series_Title
