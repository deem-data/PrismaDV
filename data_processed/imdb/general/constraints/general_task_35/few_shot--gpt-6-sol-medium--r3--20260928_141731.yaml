constraints:
  Director:
    code:
    - - .isComplete('Director')
      - Valid
    assumptions: []
    column_name: Director
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("`Gross` IS NULL OR trim(`Gross`) = '' OR trim(`Gross`) RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'valid_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .isContainedInRange('IMDB_Rating', 0.0, 10.0)
      - Invalid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('`Released_Year` >= 1900 AND `Released_Year` <= year(current_date())',
        'valid_released_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .containsPattern('Runtime', '^[1-9][0-9]{1,2} min$')
      - Invalid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title, Released_Year
