  '["Gross","IMDB_Rating","No_of_Votes","Released_Year","Runtime"]':
    code: []
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' is assumed
        to be unique across records in the dataset or shortlist, as they are paired
        into dictionary keys in score_map where duplicate keys would cause entries
        to be overwritten. In Deequ, this can be expressed as: .isUnique(["Series_Title",
        "Released_Year"])'
      sources:
      - start_line: 93
        end_line: 94
        file: ''
      - start_line: 115
        end_line: 115
        file: ''
      uid: b2923e3a-ffe9-4bee-9e7d-e33298eebfab
    - text: The columns 'IMDB_Rating', 'Released_Year', and 'Runtime' are assumed
        to be jointly complete and valid numeric/extractable values, because composite_score
        is computed as a weighted sum of rating_score (from IMDB_Rating), recency_score
        (from Released_Year), runtime_suitability (from Runtime), and revenue_score
        (from Gross). Missing or unparseable values in any of these will lead to NaN
        composite scores.
      sources:
      - start_line: 45
        end_line: 53
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      uid: 3856dda4-33db-47cd-90d2-4cae3d5eab02
    - text: For records satisfying the shortlist filters ('IMDB_Rating' >= 7.0 and
        'Runtime' between 80 and 140 minutes), 'Released_Year' and 'No_of_Votes' must
        be non-null and valid integers because 'Released_Year' is cast to integer
        via .astype(int) for key generation and 'No_of_Votes' is used alongside composite_score
        to sort the shortlist.
      sources:
      - start_line: 78
        end_line: 80
        file: ''
      - start_line: 89
        end_line: 90
        file: ''
      - start_line: 93
        end_line: 94
        file: ''
      uid: 27d072f3-6bec-4306-b3db-385a29c979fe
  '["Gross","IMDB_Rating","Released_Year","Runtime"]':
    code: []
    assumptions:
    - text: The columns 'IMDB_Rating', 'Released_Year', 'Runtime', and 'Gross' are
        jointly used to compute individual component scores (rating_score, recency_score,
        runtime_suitability, and revenue_score) that are linearly combined into 'composite_score'.
        'IMDB_Rating' and 'Released_Year' must contain valid numeric representations,
        and 'Runtime' must follow the pattern '<number> min' so that they can be cast
        to numeric types and combined without producing NaN values.
      sources:
      - start_line: 45
        end_line: 75
        file: ''
      uid: 62ab1b24-4124-4a80-a046-90539999971b
    - text: The columns 'IMDB_Rating' and 'Runtime' are jointly evaluated to filter
        records for the licensing shortlist, requiring 'IMDB_Rating' to be numeric
        and at least 7.0 while the parsed runtime in minutes from 'Runtime' falls
        between 80 and 140 inclusive.
      sources:
      - start_line: 78
        end_line: 80
        file: ''
      uid: 821b7b54-dcb6-4f8a-b522-51e46bec45de
  '["IMDB_Rating","Runtime"]':
    code: []
    assumptions:
    - text: The columns 'IMDB_Rating' and 'Runtime' are used jointly to compute composite
        licensing scores and filter candidate movies. 'IMDB_Rating' must be a numeric
        value (convertible to float, typically on a scale up to 10) and 'Runtime'
        must follow the '<minutes> min' string format so that valid numeric scores
        ('rating_score' and 'runtime_suitability') can be calculated and combined
        without producing nulls.
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 48
        end_line: 53
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      - start_line: 78
        end_line: 80
        file: ''
      uid: 687f2380-f31b-4296-a5fb-80e8c0719f5a
  '["Released_Year","Series_Title"]':
    code: []
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across all records in the dataset, as the downstream code creates a dictionary
        mapping `(Series_Title, Released_Year)` pairs to scores where non-unique keys
        would overwrite each other. We could represent this assumption as a Deequ
        constraint: .isUnique(["Series_Title", "Released_Year"])'
      sources:
      - start_line: 93
        end_line: 94
        file: ''
      - start_line: 115
        end_line: 115
        file: ''
