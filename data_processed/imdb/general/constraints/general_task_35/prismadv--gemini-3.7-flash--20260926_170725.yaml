prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Director:
    code:
    - suggestion: '.hasCompleteness(''Director'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 588d3cff-b687-495c-8022-cf98e47a4f3e
      source_assumptions:
      - 5485d07f-be93-4b43-9d69-309314709057
    assumptions:
    - text: 'The ''Director'' column must exist in the input dataset because it is
        explicitly selected in ''shortlist_cols'' and written to the output file ''licensing_shortlist.csv''.
        If the column is missing, indexing ''filtered[shortlist_cols]'' will raise
        a KeyError. We could represent this assumption as a Great Expectations or
        Deequ constraint checking for column existence: .haveCompleteness(''Director'',
        lambda x: x >= 0.0) or expect_column_to_exist(''Director'').'
      sources:
      - start_line: 97
        end_line: 102
        file: ''
      uid: 5485d07f-be93-4b43-9d69-309314709057
  Genre:
    code:
    - suggestion: '.hasCompleteness(''Genre'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: f952a479-938f-4e4e-b00e-6da2504c68b6
      source_assumptions:
      - e68ec9de-ce7c-4130-b63b-99be5640bf85
    assumptions:
    - text: The 'Genre' column must exist in the dataset because it is selected directly
        in 'shortlist_cols' and exported to the output CSV file.
      sources:
      - start_line: 97
        end_line: 102
        file: ''
      uid: e68ec9de-ce7c-4130-b63b-99be5640bf85
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR `Gross` IN ('', 'nan', 'None', 'NaN')
        OR regexp_replace(`Gross`, ',', '') RLIKE '^[0-9]+(\\.[0-9]+)?$'", "Gross_format_numeric_or_missing")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7d3f75ec-b8f5-44a3-956a-b04bd56071a0
      source_assumptions:
      - a25552a8-151a-46dd-a59e-d6c149cb6b49
      - e4c65aa3-159c-4ad2-bcb9-9d6412e3a816
    assumptions:
    - text: The 'Gross' column can contain null, empty string, or missing values ('nan',
        'None', 'NaN'), as the code explicitly normalizes these representations to
        NaN and imputes missing values with the median.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 55
        end_line: 58
        file: ''
      uid: a25552a8-151a-46dd-a59e-d6c149cb6b49
    - text: The 'Gross' column, when non-null, contains numeric or comma-separated
        string representations of numbers representing gross revenue.
      sources:
      - start_line: 56
        end_line: 60
        file: ''
      uid: e4c65aa3-159c-4ad2-bcb9-9d6412e3a816
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e2ae760b-61ef-4e73-924f-18a9dfb85e23
      source_assumptions:
      - 6b83417e-575f-4b98-a143-34aa91bb1936
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 57298acc-1bfd-47ec-8845-5ed3510ef38a
      source_assumptions:
      - e1f502b2-0c8c-4525-82e5-9ed87efff483
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'valid_imdb_rating_range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 59eb4bab-7eae-4c1c-980b-ac1bba3fd6c0
      source_assumptions:
      - 739c151b-0226-45d2-8878-7b12b25aa66a
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values (or string representations
        of numbers) that can be cast to float, as it is converted using pd.to_numeric
        and used in arithmetic operations like division by 10.0. We could represent
        this assumption as a deequ constraint like: .isDataType(''IMDB_Rating'', org.apache.spark.sql.types.DoubleType)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 45
        end_line: 45
        file: ''
      uid: 6b83417e-575f-4b98-a143-34aa91bb1936
    - text: 'The ''IMDB_Rating'' column is expected to have non-null values for downstream
        scoring calculations and filtering (e.g. df[''IMDB_Rating''] >= 7.0 and df[''IMDB_Rating'']
        / 10.0). We could represent this assumption as a deequ constraint like: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 70
        end_line: 75
        file: ''
      - start_line: 79
        end_line: 80
        file: ''
      uid: e1f502b2-0c8c-4525-82e5-9ed87efff483
    - text: 'The ''IMDB_Rating'' column values should fall within the standard rating
        scale from 0.0 to 10.0, as it is normalized by dividing by 10.0 to compute
        a rating score. We could represent this assumption as a deequ constraint like:
        .satisfies(''IMDB_Rating >= 0.0 AND IMDB_Rating <= 10.0'', ''Valid IMDB Rating
        Range'', lambda x: x == 1.0)'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 739c151b-0226-45d2-8878-7b12b25aa66a
