      reason_if_invalid: ''
      level: warning
      uid: 2584e162-4ec7-48ca-a744-d3dda7075724
      source_assumptions:
      - 7c7fa05b-dfe4-48a1-a9dc-18fca7228cd3
    assumptions:
    - text: 'The ''No_of_Votes'' column must exist in the input dataset and should
        be of numeric/integral data type, as it is directly used to sort the shortlisted
        movies in descending order as a tie-breaker. We could represent this assumption
        as a deequ constraint like this: .isDataType(''No_of_Votes'', ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 18
        end_line: 18
        file: ''
      - start_line: 90
        end_line: 90
        file: ''
      uid: 4bde69d9-705c-458c-82e5-9367241c3ef4
    - text: 'The ''No_of_Votes'' column should be complete (contain no null values),
        as it is used for sorting and ranking rows in the shortlist without explicit
        null imputation or handling. We could represent this assumption as a deequ
        constraint like this: .isComplete(''No_of_Votes'')'
      sources:
      - start_line: 90
        end_line: 90
        file: ''
      - start_line: 97
        end_line: 102
        file: ''
      uid: 7c7fa05b-dfe4-48a1-a9dc-18fca7228cd3
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 810adcd9-351e-4823-8513-f4dbb6b428d0
      source_assumptions:
      - 69a137f1-528a-4baa-b134-68a718f3e183
    - suggestion: .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c83bbadc-d395-4127-ac09-619032376a91
      source_assumptions:
      - c956cef2-6a1d-4f54-acae-76ca96c30fd2
    assumptions:
    - text: 'The ''Released_Year'' column must not contain null or missing values,
        because it is converted to integer using `.astype(int)` which raises a ValueError
        if any NaN or non-finite values are present. We could represent this assumption
        as a deequ constraint like this: .isComplete("Released_Year")'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 93
        end_line: 93
        file: ''
      uid: 69a137f1-528a-4baa-b134-68a718f3e183
    - text: 'The ''Released_Year'' column should be numeric or convertible to numeric
        values, as it is converted using `pd.to_numeric` and used in mathematical
        calculations for the recency score. We could represent this assumption as
        a deequ constraint like this: .hasDataType("Released_Year", ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 47
        end_line: 47
        file: ''
      uid: c956cef2-6a1d-4f54-acae-76ca96c30fd2
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 65083ada-45ac-4f8c-8207-be60a0b0f93d
      source_assumptions:
      - 16b1596e-2b41-48c7-a35e-044c94485705
    - suggestion: '.hasPattern(''Runtime'', r''^\s*[1-9][0-9]{1,2} min\s*$'', lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a7be048a-427e-482d-aee8-d305b00bf578
      source_assumptions:
      - 6a58febc-1e2e-4fe2-819d-ed2fa6181280
    assumptions:
    - text: 'The ''Runtime'' column must not contain null values, because the code
        performs string extraction and directly casts the extracted runtime values
        to integers (`.astype(int)`), which raises an error if there are null or non-matching
        values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: 16b1596e-2b41-48c7-a35e-044c94485705
    - text: 'Each value in the ''Runtime'' column (after trimming whitespace) must
        match the regular expression format `^[1-9][0-9]{1,2} min$`, representing
        a duration in minutes between 10 and 999 followed by '' min''. If any value
        does not match, `str.extract` produces NaN and the subsequent `.astype(int)`
        will throw an exception.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", "^[1-9][0-9]{1,2} min$", lambda x: x == 1.0)'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: 6a58febc-1e2e-4fe2-819d-ed2fa6181280
