      uid: b652a6ae-7df8-4af0-9d4a-7f0d6188ea3c
    - text: Every non-null, non-blank Gross value should represent a non-negative
        integer dollar amount using digits and, optionally, thousands-separator commas
        and surrounding whitespace. Values containing currency symbols, decimal points,
        minus signs, or other characters become null after parsing, even though the
