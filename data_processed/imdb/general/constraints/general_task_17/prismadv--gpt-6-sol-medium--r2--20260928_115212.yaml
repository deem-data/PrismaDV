      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 125
        end_line: 133
        file: ''
      uid: 5adc3398-3fa7-4d62-83c2-f14f7a5d9df1
    - text: Non-null 'Certificate' values should be categorical labels. Restrictive
        certificates should be recorded, ignoring letter case, exactly as R, NC-17,
        A, 18+, or TV-MA, with no surrounding whitespace. Other labels are permitted,
        but whitespace or alternate spellings of a restrictive label would incorrectly
        receive the unrestricted factor of 1.0.
      sources:
      - start_line: 87
        end_line: 89
        file: ''
      - start_line: 92
        end_line: 99
        file: ''
      uid: 22c99953-fcc4-49ff-8fd5-33dae79977ad
    - text: Null 'Certificate' values are tolerated by the code but receive the unrestricted
        factor of 1.0. If eligible titles must have an accurately classified certificate
        risk, their input 'Certificate' values should be non-null and not blank. This
        can be validated conditionally for rows meeting the eligibility criteria.
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 101
        end_line: 109
        file: ''
      uid: f10a44a9-7574-4f6b-bc57-72e905337229
