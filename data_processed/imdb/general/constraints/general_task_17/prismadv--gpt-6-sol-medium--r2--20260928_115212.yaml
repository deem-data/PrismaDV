      sources:
      - start_line: 16
        end_line: 25
        file: ''
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 136
        end_line: 139
        file: ''
      uid: fc443c90-d2ef-4048-9816-bb3d7cb05b0c
    - text: Parseable Gross amounts should be within a practical numeric range for
