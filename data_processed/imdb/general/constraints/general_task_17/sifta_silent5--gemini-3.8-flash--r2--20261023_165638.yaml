      \ Do NOT demote to \"warning\" merely because pandas functions like `errors='coerce'`,\
      \ `.fillna()`, or `if pd.notna()` prevent a crash. If converting bad data to\
      \ NaN would cause formulas to evaluate to NaN, distort ranking/sorting, or corrupt\
