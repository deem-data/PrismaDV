prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.89)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 27f27445-8977-4b34-ac7a-647e448b9898
      source_assumptions:
      - e9ca04a5-156a-4370-8e68-b6279ecaacc8
    - suggestion: .satisfies("`Certificate` IS NULL OR CAST(`Certificate` AS STRING)
        = TRIM(CAST(`Certificate` AS STRING))", "certificate_has_no_surrounding_whitespace")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4317ec0d-e2f4-4ed4-ad3f-6d2982521ef9
      source_assumptions:
      - c017bca3-4639-437e-a8fa-e450d6523740
    - suggestion: .satisfies("`Certificate` IS NULL OR (TRIM(CAST(`Certificate` AS
        STRING)) <> '' AND LOWER(TRIM(CAST(`Certificate` AS STRING))) <> 'nan')",
        "certificate_missing_values_are_null")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e3607390-cb38-425a-a540-84effdcabb5e
      source_assumptions:
      - 5e16f162-6109-4238-a770-ee8e9131a7b4
    assumptions:
    - text: 'The input must contain a ''Certificate'' column. Missing values are permitted:
        the code converts them to strings and assigns them the default certificate
        factor of 1.0. Given the observed completeness of about 89.8%, a validation
        rule could require at least 89% of input rows to have a non-null ''Certificate'',
        rather than requiring every row to have one.'
      sources:
      - start_line: 42
        end_line: 42
        file: ''
      - start_line: 87
        end_line: 89
        file: ''
      - start_line: 125
        end_line: 133
        file: ''
      uid: e9ca04a5-156a-4370-8e68-b6279ecaacc8
    - text: Non-null 'Certificate' values should be certificate labels without leading
        or trailing whitespace. The code ignores case but does not strip whitespace
        before checking for 'R', 'NC-17', 'A', '18+', or 'TV-MA'; a padded restrictive
        label would incorrectly receive the default factor of 1.0. This can be validated
        by requiring each non-null value to equal its trimmed form.
      sources:
      - start_line: 87
        end_line: 89
        file: ''
      - start_line: 91
        end_line: 99
        file: ''
      uid: c017bca3-4639-437e-a8fa-e450d6523740
    - text: The 'Certificate' column should not use empty strings or literal 'nan'
        strings as substitutes for missing values. These are treated as ordinary,
        non-restrictive labels in scoring and are carried into the output feed; genuinely
        missing certificates should be represented as nulls.
      sources:
      - start_line: 87
        end_line: 89
        file: ''
      - start_line: 125
        end_line: 133
        file: ''
      uid: 5e16f162-6109-4238-a770-ee8e9131a7b4
