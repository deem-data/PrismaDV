    assumptions:
    - text: The input must contain a 'Genre' column. The script reads it to derive
        'primary_genre', which is included in the output feed.
      sources:
      - start_line: 42
        end_line: 42
        file: ''
      - start_line: 71
        end_line: 72
        file: ''
      - start_line: 125
        end_line: 133
        file: ''
      uid: de18d2c5-fc69-49e8-bf8e-d522d8ddc17b
    - text: Every 'Genre' value should be a non-null string containing at least one
        nonempty comma-separated genre. Otherwise, converting a null to a string can
        produce the literal genre 'nan', while an empty or comma-only value produces
        no primary genre. A validation rule can check that the value is non-null and
        has at least one comma-separated segment whose trimmed length is greater than
        zero.
      sources:
      - start_line: 71
        end_line: 72
        file: ''
      - start_line: 125
        end_line: 127
        file: ''
      uid: ed66ded9-c8f8-47f3-b2d6-44a5073e66a9
    - text: The first nonempty comma-separated genre should use a consistent, canonical
        label. In particular, titles intended to be excluded as shorts must have 'Short'
        as their first nonempty genre, with that exact capitalization after trimming
        whitespace. The eligibility check does not normalize case or inspect later
        genres.
      sources:
      - start_line: 71
        end_line: 72
        file: ''
      - start_line: 101
        end_line: 109
        file: ''
      uid: fc407dfa-f8e2-48cf-816a-c416b214dbb2
