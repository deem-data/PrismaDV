        \n    def to_tier(x):\n        if x >= q_high:\n            return 'A'\n \
        \       if x >= q_mid:\n            return 'B'\n        return 'C'\n\n   \
        \ candidates['tier'] = candidates['licensing_score'].apply(to_tier)\n\n  \
        \  # Output normalized feed\n    out_cols = [\n        'title_id', 'title',\
        \ 'year', 'imdb_rating', 'votes', 'runtime_min', 'Certificate',\n        'primary_genre',\
        \ 'gross_usd', 'licensing_score', 'tier', 'rank'\n    ]\n    candidates =\
        \ candidates.sort_values(['tier', 'rank'], ascending=[True, True])\n\n   \
        \ os.makedirs(args.output, exist_ok=True)\n    out_csv = os.path.join(args.output,\
        \ 'title_feed.csv')\n    candidates[out_cols].to_csv(out_csv, index=False)\n\
        \n    # Also write a minimal metadata file for downstream audits\n    meta\
        \ = {\n        'total_input_rows': int(df.shape[0]),\n        'eligible_rows':\
