        \ before filtering/scoring by runtime\n    df['runtime_min'] = df['Runtime'].map(to_minutes)\n\
        \    # Gross parsing for monetization-based ranking\n    df['gross_usd'] =\
        \ df['Gross'].map(to_int_usd)\n    present_mask = df['Gross'].notna()\n  \
        \  # Certificate/Genre/Year interlocks before eligibility gating\n    # Key\
        \ uniqueness before assigning deterministic IDs\n    # Cast integrity before\
        \ computing cast-derived features\n    def _check_cast_row(row):\n       \
        \ names = [str(row['Star1']).strip(), str(row['Star2']).strip(), str(row['Star3']).strip(),\n\
        \                 str(row['Star4']).strip()]\n        if any(n == '' or n.lower()\
        \ == 'nan' for n in names):\n            return False\n        return len(set(names))\
        \ == 4\n\n    # Deterministic ID from title + year (assumes uniqueness checked\
        \ above)\n    df['title_id'] = df.apply(\n        lambda r: f\"{slugify(r['title'])}-{int(r['year'])}\"\
        \ if pd.notna(r['year']) else slugify(r['title']), axis=1)\n\n    # Canonical\
        \ primary genre and genre list\n    df['genres'] = df['Genre'].astype(str).str.split(',').apply(lambda\
        \ xs: [x.strip() for x in xs if x.strip() != ''])\n    df['primary_genre']\
        \ = df['genres'].apply(lambda xs: xs[0] if len(xs) > 0 else None)\n\n    #\
        \ Compute licensing-relevant features\n    gross_fill = df['gross_usd'].fillna(df['gross_usd'].median())\n\
        \    log_gross = np.log1p(gross_fill)\n    rating_component = (df['imdb_rating']\
        \ - 5.0).clip(lower=0) / 5.0  # 0..1 for ratings >=5\n    # Prefer runtimes\
        \ near 100 minutes; scale to 0.6..1.0\n    runtime_deviation = (np.abs(df['runtime_min']\
        \ - 100) / 100.0).clip(0, 1)\n    runtime_component = 1.0 - 0.4 * runtime_deviation\n\
        \n    # Cast diversity bonus (guaranteed to be 1.0 by assertion if data is\
        \ valid)\n    cast_diversity = df.apply(lambda r: len(\n        {str(r['Star1']).strip(),\
        \ str(r['Star2']).strip(), str(r['Star3']).strip(), str(r['Star4']).strip()})\
        \ / 4.0,\n                              axis=1)\n\n    # Certificate risk\
        \ factor: mildly downweight restrictive/adult-only content\n    cert = df['Certificate'].astype(str).str.upper()\n\
        \    cert_factor = np.where(cert.isin(['R', 'NC-17', 'A', '18+', 'TV-MA']),\
        \ 0.9, 1.0)\n\n    # Final licensing score combines rating, monetization proxy,\
        \ runtime suitability, cast diversity, and certificate factor\n    score =\
        \ (\n                    0.45 * rating_component +\n                    0.40\
        \ * (log_gross / (1 + log_gross.max())) +\n                    0.10 * runtime_component\
        \ +\n                    0.05 * cast_diversity\n            ) * cert_factor\n\
        \n    df['licensing_score'] = score\n\n    # Eligibility filter: ensure baseline\
        \ quality and catalog fit\n    eligible = (\n            (df['imdb_rating']\
        \ >= 7.0) &\n            (df['runtime_min'].between(60, 210)) &\n        \
