constraints:
  Genre:
    code:
    - - .isComplete('Genre').satisfies("trim(Genre) <> '' AND Genre NOT RLIKE '(^|,)[[:space:]]*(,|$)'",
        'nonempty_genre_list')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda value: value > 0.0).satisfies("Gross IS
        NULL OR Gross RLIKE ''^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$''", ''parseable_gross_when_present'')'
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating').satisfies('IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes').isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year').isPositive('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime').satisfies("Runtime RLIKE '^[0-9]+ min$' AND CAST(regexp_extract(Runtime,
        '^([0-9]+) min$', 1) AS INT) > 0", 'parseable_positive_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title').satisfies("trim(Series_Title) <> '' AND Series_Title
        RLIKE '[A-Za-z0-9]'", 'usable_title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda value: value
        == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
  Star1, Star2, Star3, Star4:
    code:
    - - .satisfies("Star1 IS NOT NULL AND Star2 IS NOT NULL AND Star3 IS NOT NULL
        AND Star4 IS NOT NULL AND trim(Star1) <> '' AND trim(Star2) <> '' AND trim(Star3)
        <> '' AND trim(Star4) <> '' AND lower(trim(Star1)) <> 'nan' AND lower(trim(Star2))
        <> 'nan' AND lower(trim(Star3)) <> 'nan' AND lower(trim(Star4)) <> 'nan' AND
        size(array_distinct(array(trim(Star1), trim(Star2), trim(Star3), trim(Star4))))
        = 4", 'four_distinct_cast_members')
      - Invalid
    assumptions: []
    column_name: Star1, Star2, Star3, Star4
