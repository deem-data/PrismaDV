constraints:
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    - - .satisfies("trim(Genre) RLIKE '^[^,[:space:]][^,]*(,[^,]+)*$'", 'nonempty_primary_genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda x: x >= 0.75)'
      - Valid
    - - .satisfies("Gross IS NULL OR trim(Gross) RLIKE '^[0-9]+(,[0-9]{3})*$'", 'parseable_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND 2100', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("CAST(regexp_extract(Runtime, '[0-9]+', 0) AS INT) > 0", 'positive_runtime_minutes')
      - Valid
    - - .satisfies("trim(Runtime) RLIKE '^[0-9]+ min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .satisfies("trim(Series_Title) RLIKE '.*[A-Za-z0-9].*'", 'title_produces_nonempty_slug')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title, Released_Year
  Star1, Star2, Star3, Star4:
    code:
    - - .satisfies("Star1 IS NOT NULL AND Star2 IS NOT NULL AND Star3 IS NOT NULL
        AND Star4 IS NOT NULL AND trim(Star1) <> '' AND trim(Star2) <> '' AND trim(Star3)
        <> '' AND trim(Star4) <> ''", 'complete_nonempty_cast')
      - Valid
    - - .satisfies('size(array_distinct(array(trim(Star1), trim(Star2), trim(Star3),
        trim(Star4)))) = 4', 'distinct_cast_members')
      - Invalid
    assumptions: []
    column_name: Star1, Star2, Star3, Star4
