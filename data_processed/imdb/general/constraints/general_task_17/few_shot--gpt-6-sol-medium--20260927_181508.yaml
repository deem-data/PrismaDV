constraints:
  Genre:
    code:
    - - .satisfies("Genre IS NOT NULL AND trim(split(Genre, ',')[0]) <> ''", 'valid_primary_genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda x: x > 0)'
      - Valid
    - - .satisfies("Gross IS NULL OR trim(Gross) RLIKE '^[0-9][0-9,]*$'", 'parseable_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating >= 0 AND IMDB_Rating <= 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("Runtime RLIKE '[0-9]+'", 'runtime_contains_minutes')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .satisfies("trim(Series_Title) <> ''", 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - .isUnique('Series_Title', 'Released_Year')
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
  Star1, Star2, Star3, Star4:
    code:
    - - .satisfies("Star1 IS NOT NULL AND Star2 IS NOT NULL AND Star3 IS NOT NULL
        AND Star4 IS NOT NULL AND trim(Star1) <> '' AND trim(Star2) <> '' AND trim(Star3)
        <> '' AND trim(Star4) <> '' AND lower(trim(Star1)) <> 'nan' AND lower(trim(Star2))
        <> 'nan' AND lower(trim(Star3)) <> 'nan' AND lower(trim(Star4)) <> 'nan' AND
        size(array_distinct(array(trim(Star1), trim(Star2), trim(Star3), trim(Star4))))
        = 4", 'complete_distinct_cast')
      - Invalid
    assumptions: []
    column_name: Star1, Star2, Star3, Star4
