prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport re\n\nimport numpy as np\nimport pandas as pd\n\n\ndef to_minutes(runtime_str):\n\
  \    if pd.isna(runtime_str):\n        return np.nan\n    m = re.search(r'(\\d+)',\
  \ str(runtime_str))\n    return int(m.group(1)) if m else np.nan\n\n\ndef to_int_usd(gross_str):\n\
  \    if pd.isna(gross_str):\n        return np.nan\n    s = str(gross_str).strip()\n\
  \    if s == '' or s.lower() == 'nan':\n        return np.nan\n    s = s.replace(',',\
  \ '')\n    if not re.fullmatch(r'\\d+', s):\n        return np.nan\n    return int(s)\n\
  \n\ndef slugify(s):\n    s = str(s).lower().strip()\n    s = re.sub(r'[^a-z0-9]+',\
  \ '-', s)\n    s = re.sub(r'(^-+|-+$)', '', s)\n    return s\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input, 'new_data.csv')\n\
  \    df = pd.read_csv(input_csv)\n\n    # Normalize core fields\n    df['title']\
  \ = df['Series_Title'].astype(str).str.strip()\n    df['year'] = pd.to_numeric(df['Released_Year'],\
  \ errors='coerce')\n    df['imdb_rating'] = pd.to_numeric(df['IMDB_Rating'], errors='coerce')\n\
  \    df['votes'] = pd.to_numeric(df['No_of_Votes'], errors='coerce')\n\n    # Guard\
  \ before using rating in scoring\n    # Runtime parsing and guard before filtering/scoring\
  \ by runtime\n    df['runtime_min'] = df['Runtime'].map(to_minutes)\n    # Gross\
  \ parsing for monetization-based ranking\n    df['gross_usd'] = df['Gross'].map(to_int_usd)\n\
  \    present_mask = df['Gross'].notna()\n    # Certificate/Genre/Year interlocks\
  \ before eligibility gating\n    # Key uniqueness before assigning deterministic\
  \ IDs\n    # Cast integrity before computing cast-derived features\n    def _check_cast_row(row):\n\
  \        names = [str(row['Star1']).strip(), str(row['Star2']).strip(), str(row['Star3']).strip(),\n\
  \                 str(row['Star4']).strip()]\n        if any(n == '' or n.lower()\
  \ == 'nan' for n in names):\n            return False\n        return len(set(names))\
  \ == 4\n\n    # Deterministic ID from title + year (assumes uniqueness checked above)\n\
  \    df['title_id'] = df.apply(\n        lambda r: f\"{slugify(r['title'])}-{int(r['year'])}\"\
  \ if pd.notna(r['year']) else slugify(r['title']), axis=1)\n\n    # Canonical primary\
  \ genre and genre list\n    df['genres'] = df['Genre'].astype(str).str.split(',').apply(lambda\
  \ xs: [x.strip() for x in xs if x.strip() != ''])\n    df['primary_genre'] = df['genres'].apply(lambda\
  \ xs: xs[0] if len(xs) > 0 else None)\n\n    # Compute licensing-relevant features\n\
  \    gross_fill = df['gross_usd'].fillna(df['gross_usd'].median())\n    log_gross\
  \ = np.log1p(gross_fill)\n    rating_component = (df['imdb_rating'] - 5.0).clip(lower=0)\
  \ / 5.0  # 0..1 for ratings >=5\n    # Prefer runtimes near 100 minutes; scale to\
  \ 0.6..1.0\n    runtime_deviation = (np.abs(df['runtime_min'] - 100) / 100.0).clip(0,\
  \ 1)\n    runtime_component = 1.0 - 0.4 * runtime_deviation\n\n    # Cast diversity\
  \ bonus (guaranteed to be 1.0 by assertion if data is valid)\n    cast_diversity\
  \ = df.apply(lambda r: len(\n        {str(r['Star1']).strip(), str(r['Star2']).strip(),\
  \ str(r['Star3']).strip(), str(r['Star4']).strip()}) / 4.0,\n                  \
  \            axis=1)\n\n    # Certificate risk factor: mildly downweight restrictive/adult-only\
  \ content\n    cert = df['Certificate'].astype(str).str.upper()\n    cert_factor\
  \ = np.where(cert.isin(['R', 'NC-17', 'A', '18+', 'TV-MA']), 0.9, 1.0)\n\n    #\
  \ Final licensing score combines rating, monetization proxy, runtime suitability,\
  \ cast diversity, and certificate factor\n    score = (\n                    0.45\
  \ * rating_component +\n                    0.40 * (log_gross / (1 + log_gross.max()))\
  \ +\n                    0.10 * runtime_component +\n                    0.05 *\
  \ cast_diversity\n            ) * cert_factor\n\n    df['licensing_score'] = score\n\
  \n    # Eligibility filter: ensure baseline quality and catalog fit\n    eligible\
  \ = (\n            (df['imdb_rating'] >= 7.0) &\n            (df['runtime_min'].between(60,\
  \ 210)) &\n            (~df['primary_genre'].isin(['Short']))\n    )\n\n    # Horror\
  \ gating inherently ensured by assertions; no extra rule needed here\n    candidates\
  \ = df.loc[eligible].copy()\n\n    # Rank and tiering\n    candidates['rank'] =\
  \ candidates['licensing_score'].rank(method='first', ascending=False).astype(int)\n\
  \    q_high, q_mid = candidates['licensing_score'].quantile([0.85, 0.60])\n\n  \
  \  def to_tier(x):\n        if x >= q_high:\n            return 'A'\n        if\
  \ x >= q_mid:\n            return 'B'\n        return 'C'\n\n    candidates['tier']\
  \ = candidates['licensing_score'].apply(to_tier)\n\n    # Output normalized feed\n\
  \    out_cols = [\n        'title_id', 'title', 'year', 'imdb_rating', 'votes',\
  \ 'runtime_min', 'Certificate',\n        'primary_genre', 'gross_usd', 'licensing_score',\
  \ 'tier', 'rank'\n    ]\n    candidates = candidates.sort_values(['tier', 'rank'],\
  \ ascending=[True, True])\n\n    os.makedirs(args.output, exist_ok=True)\n    out_csv\
  \ = os.path.join(args.output, 'title_feed.csv')\n    candidates[out_cols].to_csv(out_csv,\
  \ index=False)\n\n    # Also write a minimal metadata file for downstream audits\n\
  \    meta = {\n        'total_input_rows': int(df.shape[0]),\n        'eligible_rows':\
  \ int(candidates.shape[0]),\n        'gross_non_null_ratio': float(present_mask.mean()),\n\
  \        'score_min': float(candidates['licensing_score'].min()) if not candidates.empty\
  \ else None,\n        'score_max': float(candidates['licensing_score'].max()) if\
  \ not candidates.empty else None,\n    }\n    with open(os.path.join(args.output,\
  \ 'feed_metadata.json'), 'w') as f:\n        import json\n        json.dump(meta,\
  \ f)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on\
  \ disk at `./code/general_task_17.py`, so you can run it against the\nstaged table,\
  \ step through it, or search it, rather than working from the\nlisting alone.\n\n\
  # The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 200, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BZjZlZDlkYTktMmU1My00ZDBiLWFlNjEtYTBhNjVhOTM4ZjJjXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Donnie Darko', 'Released_Year': 2001, 'Certificate': 'R', 'Runtime':\
  \ '113 min', 'Genre': 'Drama, Mystery, Sci-Fi', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'After narrowly escaping a bizarre accident, a troubled teenager is plagued by\
  \ visions of a man in a large rabbit suit who manipulates him to commit a series\
  \ of crimes.', 'Meta_score': 88.0, 'Director': 'Richard Kelly', 'Star1': 'Jake Gyllenhaal',\
  \ 'Star2': 'Jena Malone', 'Star3': 'Mary McDonnell', 'Star4': 'Holmes Osborne',\
  \ 'No_of_Votes': 740086, 'Gross': '1,480,006'}, {'id': 56, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BOWVmZGQ0MGYtMDI1Yy00MDkxLWJiYjQtMmZjZmQ0NDFmMDRhXkEyXkFqcGdeQXVyNjg3MDMxNzU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'The Peanut Butter Falcon', 'Released_Year': 2019, 'Certificate':\
  \ 'PG-13', 'Runtime': '97 min', 'Genre': 'Adventure, Comedy, Drama', 'IMDB_Rating':\
  \ 7.6, 'Overview': 'Zak runs away from his care home to make his dream of becoming\
  \ a wrestler come true.', 'Meta_score': 70.0, 'Director': 'Tyler Nilson', 'Star1':\
  \ 'Michael Schwartz', 'Star2': 'Zack Gottsagen', 'Star3': 'Ann Owens', 'Star4':\
  \ 'Dakota Johnson', 'No_of_Votes': 66346, 'Gross': '13,122,642'}, {'id': 43, 'Poster_Link':\
  \ 'https://m.media-amazon.com/images/M/MV5BMDU2ZWJlMjktMTRhMy00ZTA5LWEzNDgtYmNmZTEwZTViZWJkXkEyXkFqcGdeQXVyNDQ2OTk4MzI@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Toy Story', 'Released_Year': 1995, 'Certificate': 'U', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Adventure, Comedy', 'IMDB_Rating': 8.3, 'Overview':\
