  - type: turn.completed
    usage: *id001
  stderr_tail: 'Reading additional input from stdin...

    '
constraints:
  constraints:
    Certificate:
      code:
      - - .satisfies("Certificate IS NULL OR trim(Certificate) IN ('U', 'UA', 'A',
          'R', 'PG-13', 'Passed', 'PG', 'G', 'Approved', 'TV-PG', 'GP', 'TV-14', '16',
          'NC-17', '18+', 'TV-MA')", 'known_certificate_risk')
        - Valid
      assumptions: []
      column_name: Certificate
    Genre:
      code:
      - - .isComplete('Genre')
        - Valid
      - - .satisfies("Genre RLIKE '^[^,[:space:]][^,]*(,[[:space:]]*[^,[:space:]][^,]*)*$'",
          'nonempty_genre_tokens')
        - Valid
      assumptions: []
      column_name: Genre
    Gross:
      code:
      - - '.hasCompleteness(''Gross'', lambda fraction: fraction > 0)'
        - Valid
      - - .satisfies("Gross IS NULL OR Gross RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
          'parseable_gross_usd')
        - Valid
      assumptions: []
      column_name: Gross
    IMDB_Rating:
      code:
      - - .isComplete('IMDB_Rating')
        - Valid
      - - .satisfies("IMDB_Rating >= 0 AND IMDB_Rating <= 10", 'rating_in_ten_point_scale')
        - Valid
      assumptions: []
      column_name: IMDB_Rating
    No_of_Votes:
      code:
      - - .isComplete('No_of_Votes')
        - Valid
      - - .isNonNegative('No_of_Votes')
        - Valid
      assumptions: []
      column_name: No_of_Votes
    Released_Year:
      code:
      - - .isComplete('Released_Year')
        - Valid
      - - .satisfies("Released_Year > 0 AND Released_Year = floor(Released_Year)",
          'integral_release_year')
        - Valid
      assumptions: []
      column_name: Released_Year
    Runtime:
      code:
      - - .isComplete('Runtime')
        - Valid
      - - .satisfies("Runtime RLIKE '^[0-9]+ min$' AND CAST(regexp_extract(Runtime,
          '[0-9]+', 0) AS INT) > 0", 'positive_runtime_minutes')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda fraction:
          fraction == 1)'
        - Valid
      - - .isComplete('Series_Title')
        - Valid
      - - .satisfies("length(trim(Series_Title)) > 0 AND Series_Title RLIKE '[A-Za-z0-9]'",
          'usable_title')
        - Valid
      assumptions: []
      column_name: Series_Title
    Star1:
      code:
      - - .isComplete('Star1')
        - Valid
      - - .satisfies("size(array_distinct(array(trim(Star1), trim(Star2), trim(Star3),
          trim(Star4)))) >= 3", 'cast_diversity')
        - Valid
      - - .satisfies("trim(Star1) <> '' AND lower(trim(Star1)) <> 'nan' AND trim(Star2)
          <> '' AND lower(trim(Star2)) <> 'nan' AND trim(Star3) <> '' AND lower(trim(Star3))
          <> 'nan' AND trim(Star4) <> '' AND lower(trim(Star4)) <> 'nan'", 'nonblank_cast')
        - Valid
      assumptions: []
      column_name: Star1
    Star2:
      code:
      - - .isComplete('Star2')
        - Valid
      assumptions: []
      column_name: Star2
    Star3:
      code:
      - - .isComplete('Star3')
        - Valid
      assumptions: []
      column_name: Star3
    Star4:
      code:
      - - .isComplete('Star4')
        - Valid
      assumptions: []
      column_name: Star4
