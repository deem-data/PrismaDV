    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7cd12ca7-32ef-495d-b915-ba0312440e98
      source_assumptions:
      - 3e71125c-9ed7-4389-ba0f-c41df925314b
      - 1808f83c-d299-4a23-9809-9e14893f9077
    - suggestion: .satisfies("`Certificate` IS NULL OR UPPER(TRIM(`Certificate`))
        NOT IN ('R', 'NC-17', 'A', '18+', 'TV-MA') OR UPPER(`Certificate`) IN ('R',
        'NC-17', 'A', '18+', 'TV-MA')", 'restrictive_certificate_has_no_surrounding_whitespace')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7fec9858-69df-4ddc-88af-94f4cbee6e95
      source_assumptions:
      - 49f38ad7-50c6-4bc1-9dad-b6ca599bbf37
    assumptions:
    - text: The input data must contain a 'Certificate' column, because the script
        reads it to calculate licensing scores and includes it in the output feed.
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 125
        end_line: 133
        file: ''
      uid: 3e71125c-9ed7-4389-ba0f-c41df925314b
    - text: The 'Certificate' column may contain nulls; the script converts them to
        strings and continues scoring. Null certificates receive the default factor
        of 1.0 rather than the restrictive-content factor of 0.9. The observed completeness
        is approximately 89.8%, so a non-null constraint would not match the current
        data.
      sources:
      - start_line: 87
        end_line: 99
        file: ''
      uid: 1808f83c-d299-4a23-9809-9e14893f9077
    - text: 'Non-null certificates denoting restrictive or adult-only content should
        match ''R'', ''NC-17'', ''A'', ''18+'', or ''TV-MA'' after uppercasing. These
        values must not have leading or trailing whitespace: the script does not strip
        it, and a mismatched value would incorrectly receive the default factor of
        1.0. Other certificate values are permitted.'
      sources:
      - start_line: 87
        end_line: 97
        file: ''
      uid: 49f38ad7-50c6-4bc1-9dad-b6ca599bbf37
