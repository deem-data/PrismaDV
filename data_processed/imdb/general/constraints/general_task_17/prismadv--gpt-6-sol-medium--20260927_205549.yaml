        end_line: 55
        file: ''
      uid: e9712aa7-5924-4135-8a34-2e940c44469f
    - text: The 'Gross' column may contain null values; the parser converts them to
        missing values and the scoring code imputes them. However, at least one input
        value must be parseable as a gross amount so that the median used for imputation
        is defined. A parseable value is non-null and, after trimming whitespace and
        removing commas, consists of one or more digits.
      sources:
      - start_line: 16
        end_line: 25
        file: ''
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 75
        end_line: 76
        file: ''
      uid: 19139fbb-b2f7-401c-9c8a-48d0409993b0
    - text: Non-null 'Gross' values intended to contribute monetary information should
        predominantly be non-negative whole-dollar amounts represented as digits,
        optionally with commas and surrounding whitespace. The parser treats values
        with currency symbols, decimal points, signs, or other characters as missing;
        widespread use of those formats would therefore distort the monetization-based
        score. Validate the proportion of non-null values that match the parser's
        accepted format.
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 54
        end_line: 54
        file: ''
      - start_line: 75
        end_line: 76
        file: ''
      - start_line: 92
        end_line: 99
        file: ''
      uid: 9c537a34-6c3b-4eb5-a86f-15f3706cdc71
