  instructions:
    dataflow_inspector: 'Identify every line in `code_script` that directly touches
      `target_column`: reads it, writes/assigns it, filters on it, transforms it,
      merges it, indexes with it, or references it (e.g., df[''col''], row[''col''],
      getattr(row, ''col''), col in list/sort keys).


      To ensure accurate line numbers:

      1. Count lines sequentially starting from 1 (1-based index) from the very first
      line of `code_script`. Include all blank lines, comments, and docstrings in
      your count.

      2. Verify that the line at each reported line number literally contains the
      target column name or a direct alias of it. Do not guess or approximate line
      numbers.

      3. Group adjacent or continuous line numbers into a single range {"start_line":
      int, "end_line": int}.


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: "Code relies on implicit and explicit assumptions about\
      \ input data. Analyze the focused code and task description to determine what\
      \ data quality properties the values in `target_column` must satisfy.\n\nFocus\
      \ on:\n1. Column content, not schema existence:\n   - Do NOT generate trivial\
      \ schema-existence assumptions (e.g., \"the column must exist in the DataFrame\"\
      ). PyDeequ validates column values, not table schema presence.\n   - Focus strictly\
      \ on properties of the data values within `target_column`: data types, completeness/nullability\
      \ expectations, value bounds, string patterns, or uniqueness.\n\n2. Crash prevention\
      \ (fatal errors):\n   - Identify conditions that cause unhandled exceptions:\
      \ non-numeric strings passed to `int()`, missing digits in strings parsed with\
      \ regex (e.g. `.str.extract(r'(\\d+)')[0].astype(int)` crashes if any row has\
      \ no digits or is NaN), `.str` access on non-string dtypes, or division by zero.\n\
      \   - When a property is required to prevent a crash on every row, state that\
      \ 100% conformance is required.\n\n3. Silent corruption prevention:\n   - Identify\
      \ conditions where code runs without throwing an exception but silently produces\
      \ invalid or misleading outputs (e.g., negative vote counts, ratings outside\
      \ [0, 10], invalid years, or duplicate IDs in deterministic key generation).\n\
      \   - If values can be missing without crashing, specify that domain bounds\
      \ apply to non-null values (e.g., \"non-null values must be between 0 and 10\"\
      ).\n\n4. Code tolerance & avoiding false alarms:\n   - Distinguish between strictly\
      \ required properties vs. variations the code safely handles.\n   - If the code\
      \ uses `errors='coerce'`, `fillna()`, `dropna()`, `.clip()`, or fallback defaults\
      \ (e.g., `'NR'` for missing certificates), the code tolerates occasional missingness.\
      \ Do NOT assume 100% completeness across the entire column; assume a high completeness\
      \ threshold (e.g., >= 90% or 95%) or note that missing values are tolerated.\n\
      \   - If a column is purely optional and downstream logic falls back gracefully\
      \ without data loss, do not invent overly restrictive constraints.\n\n5. Dataset\
      \ & domain conventions (IMDb / tabular data):\n   - Ratings (e.g., `IMDB_Rating`):\
      \ numeric or numeric-parseable; non-null values bounded between 0.0 and 10.0.\n\
      \   - Counts (e.g., `No_of_Votes`): non-negative numeric values (>= 0).\n  \
      \ - Release Years (e.g., `Released_Year`): numeric or 4-digit years (e.g., 1888\
      \ to 2100).\n   - Durations (e.g., `Runtime`): string containing positive integer\
      \ digits (e.g., '142 min'); cannot lack digits if parsed to int.\n   - Categorical/Entities\
      \ (e.g., `Certificate`, `Genre`, `Star1`-`Star4`): string data type; distinct\
      \ across cast columns when checked for cast diversity.\n\nOutput only valid\
      \ JSON (numbers without leading zeros): { \"assumptions\": [{ \"text\": str,\
      \ \"sources\": [{ \"start_line\": int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Guidelines:\n- Set level to \"error\" if violating the check\
      \ causes the code to CRASH (e.g., unhandled exception, type error, int parse\
      \ error on NaN/missing digits) OR silently produces a WRONG result (e.g., corrupted\
      \ rankings, invalid score calculations, negative counts, violating required\
      \ uniqueness/diversity invariants).\n- Crucial: Even if the code uses `errors='coerce'`\
      \ or fallback defaults, do NOT mark all constraints as \"warning\". Silent corruption\
      \ or severe data loss is still an error. A column actively used in downstream\
      \ computation must have at least one error-level constraint (e.g., valid data\
      \ type, non-null value bounds, or a realistic completeness threshold like >=\
      \ 0.90 or 0.95) so that corrupted partitions are caught.\n- Set level to \"\
      warning\" ONLY if the downstream code safely handles the violation (e.g., an\
      \ optional metadata column having extra nulls that are benignly replaced with\
      \ 'NR') without corrupting core output metrics, so that safe data partitions\
      \ are not flagged as false alarms.\n- Do NOT set every constraint to \"warning\"\
      \ (warning-level constraints never flag batches, missing critical errors) and\
      \ do NOT set every constraint to \"error\" (overly strict error checks on safe\
      \ variations create false alarms).\n\nPyDeequ Syntax & Reliability Rules (Avoiding\
      \ False Alarms):\n- Null-Safe SQL in `.satisfies()`: In SQL, comparing NULL\
      \ with any value evaluates to NULL (falsy in boolean evaluation). PyDeequ's\
      \ default assertion requires 100% of rows to satisfy the condition (`lambda\
      \ x: x == 1.0`). If a safe partition has even a single null, `.satisfies('`col`\
      \ >= 0 AND `col` <= 10', 'name')` will FAIL and trigger a false alarm!\n  ALWAYS\
      \ make SQL conditions null-safe unless 100% completeness is strictly required\
      \ by the code:\n  Use `.satisfies('`col` IS NULL OR (`col` >= 0.0 AND `col`\
      \ <= 10.0)', 'col_range')` or supply a threshold assertion like `lambda x: x\
      \ >= 0.95`.\n- Completeness: Use `.isComplete(col)` at \"error\" level ONLY\
      \ when missing values strictly break code execution (e.g., direct `int()` conversion).\
      \ If the code tolerates occasional missingness (via `errors='coerce'`, `fillna`,\
      \ etc.), use `.hasCompleteness(col, lambda x: x >= 0.90)` or `lambda x: x >=\
      \ 0.95` at \"error\" level, or set completeness to \"warning\".\n- Non-empty\
      \ strings: When string values must not be empty or 'nan' for parsing, prefer\
      \ `.satisfies(\"`col` IS NOT NULL AND TRIM(`col`) != '' AND LOWER(TRIM(`col`))\
      \ != 'nan'\", 'name')`.\n- Regex/Pattern: When using `.hasPattern(column, pattern)`,\
      \ remember it checks row conformance. Use raw strings (e.g., r\".*\\d+.*\" or\
      \ r\"^\\d+.*\" for runtime strings with digits). When occasional missing values\
      \ are tolerated, provide a threshold: `.hasPattern(col, r\".*\\d+.*\", lambda\
      \ x: x >= 0.95)`.\n- Types & Bounds: Prefer native PyDeequ functions: `.hasDataType(col,\
      \ ConstrainableDataTypes.Numeric)` or `.ConstrainableDataTypes.String`. For\
      \ non-negative numeric columns, use `.isNonNegative(col)` (optionally with `lambda\
      \ x: x >= 0.95`).\n- Empty Constraint Fallback: If assumptions cannot be translated\
      \ into valid PyDeequ checks or the column requires no constraints, ALWAYS return\
      \ a valid JSON object with an empty list: `{\"constraint_code\": []}`. NEVER\
      \ return `None` or invalid JSON.\n- Link each check to the 0-based indices of\
      \ the source assumptions it validates.\n\nOutput: {\"constraint_code\": [{\"\
      suggestion\": PyDeequ code (starting with \".\" or a function), \"level\": \"\
      warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted',\
      \ lambda x: x >= 0.95)\nName: hasPattern, Description: Validates that column\
