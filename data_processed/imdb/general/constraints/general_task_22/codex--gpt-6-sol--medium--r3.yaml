          = FLOOR(CAST(No_of_Votes AS DOUBLE))", 'positive_integer_votes')
        - Valid
      assumptions: []
      column_name: No_of_Votes
    Poster_Link:
      code:
      - - .satisfies("Poster_Link RLIKE '^https?://[^ ]+'", 'valid_poster_link')
        - Valid
      assumptions: []
      column_name: Poster_Link
    Released_Year:
      code:
      - - .isComplete('Released_Year')
        - Valid
      - - .satisfies("CAST(Released_Year AS DOUBLE) BETWEEN 1888 AND 2026 AND CAST(Released_Year
          AS DOUBLE) = FLOOR(CAST(Released_Year AS DOUBLE))", 'valid_release_year')
        - Valid
      assumptions: []
      column_name: Released_Year
    Runtime:
      code:
      - - .satisfies("CAST(regexp_extract(Runtime, '^([0-9]{2,3}) min$', 1) AS INT)
          > 0", 'positive_runtime')
        - Valid
      - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$'", 'runtime_minute_format')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - .isComplete('Series_Title')
        - Valid
      - - .satisfies("length(trim(Series_Title)) > 0", 'nonblank_title')
        - Valid
      assumptions: []
      column_name: Series_Title
