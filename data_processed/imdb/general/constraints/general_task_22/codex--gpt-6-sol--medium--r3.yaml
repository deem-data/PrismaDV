prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef minmax_norm(s:\
  \ pd.Series) -> pd.Series:\n    s = pd.to_numeric(s, errors='coerce')\n    s = s.replace([np.inf,\
  \ -np.inf], np.nan)\n    if s.notna().sum() == 0:\n        return pd.Series(0.0,\
  \ index=s.index)\n    s = s.fillna(s.dropna().min())\n    min_v = s.min()\n    max_v\
  \ = s.max()\n    if max_v == min_v:\n        return pd.Series(1.0, index=s.index)\n\
  \    return (s - min_v) / (max_v - min_v)\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    input_csv = os.path.join(args.input, 'new_data.csv')\n \
  \   df = pd.read_csv(input_csv)\n\n    # Basic type coercions used downstream\n\
  \    df['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'], errors='coerce')\n   \
  \ df['Meta_score'] = pd.to_numeric(df['Meta_score'], errors='coerce')\n    df['No_of_Votes']\
  \ = pd.to_numeric(df['No_of_Votes'], errors='coerce')\n    df['Released_Year'] =\
  \ pd.to_numeric(df['Released_Year'], errors='coerce')\n    df['Runtime'] = df['Runtime'].astype(str)\n\
  \    df['Certificate'] = df['Certificate'].astype(object)\n    df['Genre'] = df['Genre'].astype(str)\n\
  \n    # Guard assumptions around IMDB_Rating before deriving rating buckets and\
  \ quality blend\n    # Buckets by 0.1 rating granularity (relies on quantization)\n\
  \    df['rating_tenth'] = (df['IMDB_Rating'] * 10).astype(int)\n\n    # Guard assumptions\
  \ for No_of_Votes before Bayesian averaging and log-scaling\n    # Weighted (Bayesian)\
  \ rating using vote counts\n    C = df['IMDB_Rating'].mean()\n    M = float(df['No_of_Votes'].quantile(0.60))\n\
  \    v = df['No_of_Votes']\n    R = df['IMDB_Rating']\n    df['bayes_rating'] =\
  \ (v / (v + M)) * R + (M / (v + M)) * C\n    # Quality blend of IMDB and Meta when\
  \ available\n    meta10 = df['Meta_score'] / 10.0\n    meta10_filled = meta10.where(meta10.notna(),\
  \ df['IMDB_Rating'])\n    df['quality_component'] = 0.6 * df['bayes_rating'] + 0.4\
  \ * meta10_filled\n    df['Runtime_minutes'] = df['Runtime'].str.extract(r'([0-9]{2,3})',\
  \ expand=False).astype(int)\n    deviation = (df['Runtime_minutes'] - 120).abs()\n\
  \    runtime_factor = 1.0 - (deviation / 120.0) * 0.20\n    df['runtime_factor']\
  \ = runtime_factor.clip(lower=0.80, upper=1.05)\n\n    # Popularity component\n\
  \    df['pop_component'] = np.log1p(df['No_of_Votes'])\n\n    # Final quality-adjusted\
  \ popularity score powering ranking\n    df['qa_pop_score'] = 0.65 * minmax_norm(df['quality_component'])\
  \ + 0.35 * minmax_norm(df['pop_component'])\n    df['qa_pop_score'] = df['qa_pop_score']\
  \ * df['runtime_factor']\n    # Guard temporal constraints tied to Certificate before\
  \ using both for policy checks\n    # Guard assumptions on Genre structure and values\
  \ before using it for kids-safety\n    # Precompute genre flags\n    df['genre_tokens']\
  \ = df['Genre'].str.split(', ')\n    df['has_animation'] = df['genre_tokens'].apply(lambda\
  \ xs: 'Animation' in xs)\n    df['has_family'] = df['genre_tokens'].apply(lambda\
  \ xs: 'Family' in xs)\n\n    # Cross-field policy constraints used for parental\
  \ filters\n    # Kids-safe gating and maturity mapping\n    maturity_map = {\n \
  \       'U': 0, 'G': 0, 'PG': 1, 'TV-PG': 1, 'UA': 2, 'PG-13': 2, 'TV-14': 2,\n\
  \        'R': 3, 'TV-MA': 3, 'NC-17': 3, 'A': 3, 'Not Rated': 2, 'Unrated': 2, 'Approved':\
  \ 1, 'Passed': 1,\n        'U/A': 2, 'GP': 2\n    }\n    df['maturity_level'] =\
  \ df['Certificate'].map(maturity_map)\n    df['is_kids_safe'] = (\n            \
  \                     df['maturity_level'].fillna(3) <= 1\n                    \
  \     ) & (~df['genre_tokens'].apply(lambda xs: any(g in xs for g in ['Horror',\
  \ 'Thriller'])))\n\n    # Guard gross format before creating box-office carousel\n\
  \    # Parse Gross for downstream usage\n    df['Gross_int'] = pd.NA\n    if df['Gross'].notna().any():\n\
  \        gi = df['Gross'].dropna().astype(str).str.replace(',', '', regex=False)\n\
  \        with np.errstate(all='ignore'):\n            gi_num = pd.to_numeric(gi,\
  \ errors='coerce')\n        df.loc[gi_num.index, 'Gross_int'] = gi_num.astype('Int64')\n\
  \n    # Build outputs for search ranking and editorial carousels\n    df['rank']\
  \ = df['qa_pop_score'].rank(ascending=False, method='first').astype(int)\n\n   \
  \ ranked_cols = [\n        'Series_Title', 'qa_pop_score', 'rank', 'Certificate',\
  \ 'Released_Year', 'Genre',\n        'is_kids_safe', 'Poster_Link', 'IMDB_Rating',\
  \ 'Meta_score', 'No_of_Votes', 'Gross_int'\n    ]\n    ranked_out = df.sort_values('qa_pop_score',\
  \ ascending=False)[ranked_cols]\n    ranked_out.to_csv(os.path.join(args.output,\
  \ 'ranked_titles.csv'), index=False)\n\n    # Carousels\n    def to_items(sub: pd.DataFrame,\
  \ n: int = 30):\n        cols = ['Series_Title', 'qa_pop_score', 'Certificate',\
  \ 'Released_Year', 'Genre', 'Poster_Link']\n        items = sub.sort_values('qa_pop_score',\
  \ ascending=False).head(n)[cols]\n        return [\n            {\n            \
  \    'title': r.Series_Title,\n                'score': float(r.qa_pop_score),\n\
  \                'certificate': None if pd.isna(r.Certificate) else str(r.Certificate),\n\
  \                'year': None if pd.isna(r.Released_Year) else int(r.Released_Year),\n\
  \                'genre': r.Genre,\n                'poster': r.Poster_Link\n  \
  \          }\n            for r in items.itertuples(index=False)\n        ]\n\n\
  \    top_overall = to_items(df, n=50)\n    family_picks = to_items(df[df['is_kids_safe']],\
  \ n=40)\n\n    if df['Gross_int'].notna().any():\n        box_office = df[df['Gross_int'].notna()].copy()\n\
  \        box_office['gross_norm'] = minmax_norm(pd.to_numeric(box_office['Gross_int'],\
  \ errors='coerce'))\n        box_office['box_office_score'] = 0.5 * box_office['gross_norm']\
  \ + 0.5 * minmax_norm(box_office['qa_pop_score'])\n        box_office_items = box_office.sort_values(['box_office_score',\
  \ 'qa_pop_score'], ascending=False)\n        box_office_items = box_office_items.head(40)\n\
  \        box_office_out = [\n            {\n                'title': r.Series_Title,\n\
  \                'gross': int(r.Gross_int) if not pd.isna(r.Gross_int) else None,\n\
  \                'score': float(r.qa_pop_score),\n                'certificate':\
  \ None if pd.isna(r.Certificate) else str(r.Certificate),\n                'year':\
  \ None if pd.isna(r.Released_Year) else int(r.Released_Year),\n                'poster':\
  \ r.Poster_Link\n            }\n            for r in box_office_items.itertuples(index=False)\n\
  \        ]\n    else:\n        box_office_out = []\n\n    carousels = {\n      \
  \  'top_overall': top_overall,\n        'family': family_picks,\n        'box_office':\
  \ box_office_out\n    }\n\n    with open(os.path.join(args.output, 'carousels.json'),\
  \ 'w', encoding='utf-8') as f:\n        json.dump(carousels, f, ensure_ascii=False,\
  \ indent=2)\n\n    # Search index for ranking integration\n    search_index = df[['Series_Title',\
  \ 'qa_pop_score', 'is_kids_safe', 'Certificate', 'Released_Year', 'Genre']].copy()\n\
  \    search_index.rename(\n        columns={'Series_Title': 'title', 'qa_pop_score':\
  \ 'rank_score', 'Certificate': 'cert', 'Released_Year': 'year',\n              \
  \   'Genre': 'genres'}, inplace=True)\n    search_index.sort_values('rank_score',\
  \ ascending=False).to_csv(os.path.join(args.output, 'search_index.csv'),\n     \
  \                                                              index=False)\n\n\n\
  if __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at\
  \ `./code/general_task_22.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 195,\
  \ 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BNzdmZTk4MTktZmExNi00OWEwLTgxZDctNTE4NWMwNjc1Nzg2XkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Doctor Zhivago', 'Released_Year': 1965, 'Certificate': 'A', 'Runtime':\
  \ '197 min', 'Genre': 'Drama, Romance, War', 'IMDB_Rating': 8.0, 'Overview': \"\
  The life of a Russian physician and poet who, although married to another, falls\
  \ in love with a political activist's wife and experiences hardship during World\
  \ War I and then the October Revolution.\", 'Meta_score': 69.0, 'Director': 'David\
  \ Lean', 'Star1': 'Omar Sharif', 'Star2': 'Julie Christie', 'Star3': 'Geraldine\
  \ Chaplin', 'Star4': 'Rod Steiger', 'No_of_Votes': 69903, 'Gross': '111,722,000'},\
  \ {'id': 356, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMmMzOWNhNTYtYmY0My00OGJiLWIzNDUtZWRhNGY0NWFjNzFmXkEyXkFqcGdeQXVyNjUxMDQ0MTg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Pâfekuto burû', 'Released_Year': 1997, 'Certificate': 'A', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Crime, Mystery', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'A pop singer gives up her career to become an actress, but she slowly goes insane\
  \ when she starts being stalked by an obsessed fan and what seems to be a ghost\
  \ of her past.', 'Meta_score': nan, 'Director': 'Satoshi Kon', 'Star1': 'Junko Iwao',\
  \ 'Star2': 'Rica Matsumoto', 'Star3': 'Shinpachi Tsuji', 'Star4': 'Masaaki Ôkura',\
  \ 'No_of_Votes': 58192, 'Gross': '776,665'}, {'id': 526, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMWU4N2FjNzYtNTVkNC00NzQ0LTg0MjAtYTJlMjFhNGUxZDFmXkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
