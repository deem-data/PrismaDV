        end_line: 73
        file: ''
      - start_line: 83
        end_line: 85
        file: ''
      uid: b708c69c-6878-4d8d-8c84-aa720c8bf61f
    - text: Whenever the genres Animation, Family, Horror, or Thriller apply, they
