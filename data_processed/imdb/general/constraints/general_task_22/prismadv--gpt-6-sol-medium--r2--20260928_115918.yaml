      reason_if_invalid: ''
      level: warning
      uid: ee1d9b40-638b-4711-accc-50c4ffc93623
      source_assumptions:
      - 24e18083-706c-4a37-90fd-d90090a49c1c
    assumptions:
    - text: The input must contain an 'IMDB_Rating' column, and every value must be
        non-null, parseable as a number, and finite. Numeric coercion would turn invalid
        values into nulls, causing the subsequent integer conversion for rating buckets
        to fail.
      sources:
      - start_line: 31
        end_line: 34
        file: ''
      - start_line: 42
        end_line: 44
        file: ''
      uid: 97487242-2cbb-4dbc-a6f9-bd241065100c
    - text: Every 'IMDB_Rating' value should be on the IMDb rating scale, from 1 through
        10 inclusive. Values outside that scale would make the rating buckets and
        quality-based rankings misleading.
      sources:
      - start_line: 44
        end_line: 56
        file: ''
      - start_line: 66
        end_line: 67
        file: ''
      uid: 9419d63d-d4cf-42cf-970f-1be25f819ad9
    - text: 'Every ''IMDB_Rating'' value should be quantized to one decimal place:
        its value multiplied by 10 should be within a small floating-point tolerance
        of an integer. The code truncates that product to create a rating bucket rather
        than rounding it.'
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      uid: 24e18083-706c-4a37-90fd-d90090a49c1c
  Meta_score:
