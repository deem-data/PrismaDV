        is calculated, and the original values are included in the ranked output.
      sources:
      - start_line: 31
        end_line: 36
        file: ''
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: 0206299e-85e3-4aa8-ad85-e28a0714a2ac
    - text: Every 'No_of_Votes' value should be a finite, numeric whole number representing
        a vote count. Values that cannot be parsed as numbers become null, while non-finite
        values would make the calculations unreliable.
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: 3dd71fb6-e09d-4981-b30d-f96ac11b34a8
    - text: Every 'No_of_Votes' value should be greater than zero. Positive counts
        keep log1p within its domain and ensure that the 60th-percentile vote count
        and the denominators used in the Bayesian rating are positive.
      sources:
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: 3c081de8-a30d-47b2-bbfb-a267c4975d5f
