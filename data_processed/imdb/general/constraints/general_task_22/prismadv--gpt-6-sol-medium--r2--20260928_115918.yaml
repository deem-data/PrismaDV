      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c81d68e6-1752-4d96-85e2-cea18f9fcdd4
      source_assumptions:
      - 9419d63d-d4cf-42cf-970f-1be25f819ad9
    - suggestion: .satisfies("abs(try_cast(`IMDB_Rating` AS DOUBLE) * 10 - round(try_cast(`IMDB_Rating`
