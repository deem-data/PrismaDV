    - suggestion: .satisfies("`Gross` IS NULL OR length(regexp_replace(regexp_replace(`Gross`,
        ',', ''), '^0+', '')) < 19 OR (length(regexp_replace(regexp_replace(`Gross`,
        ',', ''), '^0+', '')) = 19 AND regexp_replace(regexp_replace(`Gross`, ',',
        ''), '^0+', '') <= '9223372036854775807')", "gross_within_int64_range")
