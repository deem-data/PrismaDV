      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: 932c9e84-1564-4874-b57e-1ccbb4e087bd
    - text: Non-null 'Meta_score' values should be finite numbers or numeric strings.
        Values that cannot be converted to numbers become missing, so they will not
        contribute a Metascore to the quality blend.
      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 54
        end_line: 56
        file: ''
      uid: 04302409-fe71-4bf3-8874-dfea55de1750
    - text: Non-null 'Meta_score' values should be between 0 and 100, inclusive. Dividing
        by 10 assumes a 100-point Metascore scale before blending it with the IMDb-based
        rating.
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      uid: 03ab0dbb-b00e-45dd-ba5b-8abbae98ac80
    - text: 'Missing ''Meta_score'' values are allowed: the code substitutes ''IMDB_Rating''
        for them. Given the observed completeness of about 85.6%, a validation rule
        could require at least 80% of rows to have a valid, non-null ''Meta_score''
        to preserve its contribution to ranking; this is a data-quality threshold,
        not a requirement for the script to run.'
      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 54
        end_line: 56
        file: ''
      uid: e6ef5b84-57c6-40c6-ae27-4ba6b0f01ec0
  No_of_Votes:
