      reason_if_invalid: ''
      level: warning
      uid: 54dc88c2-3a11-4322-aa39-ee85730ba71e
      source_assumptions:
      - 12149ba5-e8a8-48ca-9360-34a7fa5840c4
    assumptions:
    - text: The 'Gross' column may contain null values. The code leaves those rows
        without a parsed gross and excludes them from the box-office carousel; completeness
        is therefore not required.
      sources:
      - start_line: 89
        end_line: 94
        file: ''
      - start_line: 125
        end_line: 126
        file: ''
      uid: df2c029f-a889-408d-8e80-885ced34461d
    - text: Every non-null 'Gross' value intended for box-office use should be a whole-number
        amount written as digits, optionally with thousands-separator commas (for
        example, '1234567' or '1,234,567'). After removing commas, it should parse
        as a number without a currency symbol, decimal point, or other text; otherwise
        the code silently turns it into a missing gross.
      sources:
      - start_line: 90
        end_line: 94
        file: ''
      uid: 9da9df36-7997-4e24-9e03-5d0e801a2d47
    - text: Parsed, non-null 'Gross' amounts should be nonnegative and fit within
        the signed 64-bit integer range (at most 9223372036854775807). The code casts
        parsed amounts to nullable Int64 and later uses them as box-office figures.
      sources:
      - start_line: 93
        end_line: 94
        file: ''
      - start_line: 127
        end_line: 134
        file: ''
      uid: e8169dcf-e931-4cd3-814c-e2353e9df790
    - text: If a nonempty box-office carousel is expected, at least one input row
        should have a non-null 'Gross' value that satisfies the parsing and integer
        requirements. Otherwise the code produces an empty box-office carousel.
      sources:
      - start_line: 90
        end_line: 94
        file: ''
      - start_line: 125
        end_line: 143
        file: ''
      uid: 12149ba5-e8a8-48ca-9360-34a7fa5840c4
  IMDB_Rating:
    code:
    - suggestion: .satisfies("try_cast(`IMDB_Rating` AS DOUBLE) IS NOT NULL AND NOT
        isnan(try_cast(`IMDB_Rating` AS DOUBLE)) AND abs(try_cast(`IMDB_Rating` AS
        DOUBLE)) <= 1.7976931348623157E308", "IMDB rating is present, numeric, and
