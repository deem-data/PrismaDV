        end_line: 85
        file: ''
      - start_line: 114
        end_line: 114
        file: ''
      - start_line: 136
        end_line: 136
        file: ''
      uid: d2526021-c93d-4871-8aa4-88de8b6e0070
    - text: 'The non-null values in the ''Certificate'' column should predominantly
