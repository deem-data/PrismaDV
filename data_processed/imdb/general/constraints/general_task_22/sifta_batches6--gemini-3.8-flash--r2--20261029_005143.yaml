      completeness, distinct values) together with code semantics. State positive,
      verifiable requirements: data type conformance, valid domain ranges (e.g., ratings
      between 0 and 10, non-negative counts/votes), and realistic completeness thresholds.

      3. Distinguish True Tolerances from Unconstrained Data: Notice when code explicitly
      handles missing values (e.g., fillna, errors=''coerce''). Do not assume 100%
