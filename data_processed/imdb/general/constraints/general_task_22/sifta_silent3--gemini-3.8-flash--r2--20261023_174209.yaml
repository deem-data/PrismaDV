      \ data types, value bounds, quantiles, patterns, and uniqueness). Avoid assuming\
      \ strict 1.0 completeness unless unhandled code crashes on a single null.\n\n\
      Output only valid JSON (numbers without leading zeros): { \"assumptions\": [{\
