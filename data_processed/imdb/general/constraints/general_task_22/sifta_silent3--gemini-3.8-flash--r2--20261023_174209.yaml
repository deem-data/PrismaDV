      \ invalid rendered output).\n   - If the code explicitly handles missingness\
      \ or anomalies (e.g., pd.to_numeric(..., errors='coerce'), .fillna(), explicit\
      \ isna() conditionals with fallback defaults), do not assume strict completeness.\
      \ However, check against degenerate distributions (e.g., all values becoming\
      \ 0 or null) that break downstream calculations.\n   - Denominators and statistical\
      \ quantiles: when code divides by an expression involving a column statistic\
      \ (e.g., m = df[col].quantile(0.70) and computes v / (v + m)), assume that the\
      \ column distribution must produce a strictly positive quantile (m > 0) to prevent\
      \ division by zero (0 / 0 = NaN).\n2. Incorporate dataset and domain knowledge\
      \ (e.g., movie/catalog data):\n   - Output/feed passthrough columns (e.g., Star1..Star4,\
      \ Director, Series_Title): when included in exported catalogs without fallback\
