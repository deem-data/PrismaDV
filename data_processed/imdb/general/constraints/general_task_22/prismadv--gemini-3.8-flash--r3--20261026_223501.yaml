        certificates such as ''Approved'' and ''Passed'' belong to the Hays Code era
        and should correspond to ''Released_Year'' <= 1968; and television ratings
        (''TV-PG'', ''TV-14'', ''TV-MA'') introduced in 1997 should generally satisfy
