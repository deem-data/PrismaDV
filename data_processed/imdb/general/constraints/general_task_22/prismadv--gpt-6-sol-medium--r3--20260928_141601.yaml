      source_assumptions:
      - 37846931-9b7d-4734-8f14-b139a6087d1c
      - fafb00fa-954d-4314-8967-deca45aaa3a5
    - suggestion: .satisfies("`Genre` IS NOT NULL AND length(trim(`Genre`)) > 0",
