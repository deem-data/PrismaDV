        file: ''
      uid: 8db9bc03-8a8e-4e64-9941-f6ae470b8b24
    - text: 'IMDB_Rating and non-null Meta_score values should use compatible rating
        scales: IMDB_Rating should be between 0 and 10, and Meta_score between 0 and
        100. Dividing Meta_score by 10 must put it on the same scale as IMDB_Rating
        before the two contribute to quality_component. Meta_score may be null because
        the code substitutes IMDB_Rating in that case. A row-level constraint can
        check `IMDB_Rating BETWEEN 0 AND 10 AND (Meta_score IS NULL OR Meta_score
        BETWEEN 0 AND 100)`.'
      sources:
      - start_line: 34
        end_line: 35
        file: ''
      - start_line: 53
        end_line: 56
        file: ''
      uid: b2cd885d-d123-4a60-bc4f-f53bd7291242
    - text: For every row scored using IMDB_Rating and No_of_Votes, Runtime should
        also contain a two- or three-digit minute value extractable by `([0-9]{2,3})`.
        Otherwise the integer conversion fails and the combined quality, popularity,
        and runtime score cannot be produced. A row-level constraint can check that
        the regex extraction from Runtime is nonempty alongside non-null parsed IMDB_Rating
        and No_of_Votes.
