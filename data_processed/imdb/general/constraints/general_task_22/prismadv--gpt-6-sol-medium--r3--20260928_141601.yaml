      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b6ddc516-1bc5-4e84-b951-b3001f766f8a
      source_assumptions:
      - f100d350-5adf-43e5-b03e-b7e105879b4b
    assumptions:
    - text: Every input 'IMDB_Rating' value should be present, numeric, and finite.
        Non-numeric or missing values become null during coercion, and infinite values
        cannot be converted to integer rating buckets.
      sources:
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 42
        end_line: 44
        file: ''
      uid: 6361a271-87a7-47b6-80d7-ae1da77e994c
    - text: Every 'IMDB_Rating' should be on the IMDb rating scale, from 1.0 to 10.0
        inclusive, so that Bayesian ratings and quality scores remain meaningful.
      sources:
      - start_line: 48
        end_line: 56
        file: ''
      uid: 594ffb01-5e49-4927-bb77-aa03246be918
    - text: 'Each ''IMDB_Rating'' should be recorded to one decimal place: its value
        multiplied by 10 should be approximately an integer. The code uses that granularity
        to create integer rating buckets.'
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      uid: f100d350-5adf-43e5-b03e-b7e105879b4b
  Meta_score:
