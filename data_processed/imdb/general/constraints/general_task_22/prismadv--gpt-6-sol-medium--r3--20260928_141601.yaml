    - suggestion: '.satisfies("`Gross` IS NULL OR length(regexp_replace(regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), '','', ''''), ''^-'', ''''), ''^0+'', '''')) < 19 OR (length(regexp_replace(regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), '','', ''''), ''^-'', ''''), ''^0+'', '''')) = 19 AND regexp_replace(regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), '','', ''''), ''^-'', ''''), ''^0+'', '''') <= CASE WHEN CAST(`Gross`
        AS STRING) LIKE ''-%'' THEN ''9223372036854775808'' ELSE ''9223372036854775807''
        END)", "Gross fits signed 64-bit integer", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 59a2c835-aa84-4443-879d-6118d11bdbdd
      source_assumptions:
      - f0076010-8811-467c-b294-8f421953d723
    - suggestion: '.satisfies("`Gross` IS NULL OR CAST(`Gross` AS STRING) NOT LIKE
        ''-%''", "Non-negative Gross", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d4c69c94-596e-4af9-8a72-618cf91f007e
      source_assumptions:
      - 99d1a0db-614c-44d3-b613-781e829e14c7
    assumptions:
    - text: The input must contain a 'Gross' column. Its values may be null; null
        values are retained as missing in 'Gross_int' and excluded from the box-office
        carousel. No minimum non-null proportion is required because the code also
        handles an entirely null column.
      sources:
      - start_line: 89
        end_line: 94
        file: ''
      - start_line: 125
        end_line: 143
        file: ''
      uid: 03dc02e2-4e13-4d43-8fcc-9cefee2dc8d7
    - text: Every non-null 'Gross' value should represent a finite, whole-number amount,
        written as digits with optional comma thousands separators (for example, '1,234,567').
        After commas are removed, it must be convertible to a signed 64-bit integer.
        Currency symbols, decimal amounts, and other text are not supported by the
        conversion to nullable Int64.
      sources:
      - start_line: 90
        end_line: 94
        file: ''
      uid: f0076010-8811-467c-b294-8f421953d723
    - text: Non-null 'Gross' amounts should be non-negative. The box-office carousel
        treats larger parsed amounts as higher gross when calculating its score.
      sources:
      - start_line: 125
        end_line: 134
        file: ''
      uid: 99d1a0db-614c-44d3-b613-781e829e14c7
  IMDB_Rating:
    code:
    - suggestion: '.satisfies("CASE WHEN CAST(`IMDB_Rating` AS DOUBLE) IS NOT NULL
        AND NOT isnan(CAST(`IMDB_Rating` AS DOUBLE)) AND abs(CAST(`IMDB_Rating` AS
        DOUBLE)) <= 1.7976931348623157E308 THEN 1 ELSE 0 END", "finite_numeric_imdb_rating",
