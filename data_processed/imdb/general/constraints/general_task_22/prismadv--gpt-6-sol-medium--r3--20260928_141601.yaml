      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: 329243c8-a57c-4bd9-94da-b2be301684e6
    - text: Missing 'Meta_score' values are allowed. The scoring calculation uses
        'IMDB_Rating' when a Meta_score is missing, so the column does not need to
        be complete.
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      uid: ca541d68-2561-4325-bdd4-07616cf04525
    - text: Every non-null 'Meta_score' value should be convertible to a finite number.
        Non-numeric values are coerced to missing, while infinite values would pass
        through the fallback and could distort the quality score.
      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 54
        end_line: 56
        file: ''
      uid: e76fd5fa-573a-4da9-ad9a-628bbafdee90
    - text: Non-null 'Meta_score' values should be between 0 and 100, inclusive. Dividing
        the score by 10 indicates that the input is expected to use a 100-point scale
        before it is blended with the IMDb-based rating.
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      uid: 7167c7b2-e01f-4e65-bb79-442d6a63f952
