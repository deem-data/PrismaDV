    assumptions:
    - text: Every row should have a finite, numeric IMDB_Rating and a strictly positive,
        numeric No_of_Votes. These fields are combined in the Bayesian rating; positive
        vote counts also keep its denominator nonzero and make log1p(No_of_Votes)
        valid. A row-level constraint can check `IMDB_Rating IS NOT NULL AND No_of_Votes
        > 0` after numeric parsing.
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      - start_line: 48
        end_line: 52
        file: ''
      - start_line: 63
