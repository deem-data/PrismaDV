    - text: The first two- or three-digit sequence in each 'Runtime' value should
        be the film's duration in minutes, not another number such as a year. Values
        should not express the duration solely in hours or as a four-or-more-digit
        number, because the extracted number is used directly as minutes to calculate
        the ranking factor.
