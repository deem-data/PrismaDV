        end_line: 38
        file: ''
      - start_line: 57
        end_line: 57
        file: ''
      uid: a00944ad-7ff4-4382-8343-4728dfcb1862
    - text: Every 'Runtime' value should contain a sequence of two or three ASCII
        digits. The code extracts the first such sequence and converts it to an integer;
        a value without one will cause the conversion to fail.
