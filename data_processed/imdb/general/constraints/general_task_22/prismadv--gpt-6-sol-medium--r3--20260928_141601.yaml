      reason_if_invalid: ''
      level: warning
      uid: 45d9a919-d3ce-444f-b04f-a949471e04d1
      source_assumptions:
      - 2352cec8-7377-48df-b043-29e95197d61c
    - suggestion: .satisfies("size(filter(split(`Genre`, ', '), x -> lower(x) IN ('animation',
        'family', 'horror', 'thriller') AND x NOT IN ('Animation', 'Family', 'Horror',
        'Thriller'))) = 0", "policy_genres_exact_case")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1ba046cf-c10d-4e8f-a2ba-cd2f8cd3311d
      source_assumptions:
      - 2352cec8-7377-48df-b043-29e95197d61c
    assumptions:
    - text: The input must contain a 'Genre' column, because the code accesses it
        directly.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: 37846931-9b7d-4734-8f14-b139a6087d1c
    - text: Every 'Genre' value should be a non-null, non-blank string. The code converts
        values to strings rather than handling missing genres, so a missing value
        could become the literal string 'nan' and silently produce incorrect genre
        flags and output.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: fafb00fa-954d-4314-8967-deca45aaa3a5
    - text: "Each 'Genre' value should contain genre names separated by exactly a\
        \ comma followed by one space (', '). Genre names used by the policy checks\u2014\
        'Animation', 'Family', 'Horror', and 'Thriller'\u2014must have that exact\
        \ spelling and capitalization, without surrounding whitespace. Otherwise,\
        \ the split and exact token comparisons can silently misclassify titles, including\
        \ kids-safety results."
      sources:
      - start_line: 69
        end_line: 73
        file: ''
      - start_line: 83
        end_line: 85
        file: ''
      uid: 2352cec8-7377-48df-b043-29e95197d61c
  Gross:
    code:
    - suggestion: '.satisfies("`Gross` IS NULL OR CAST(`Gross` AS STRING) RLIKE ''^(-?[0-9]+|-?[0-9]{1,3}(,[0-9]{3})+)$''",
        "Gross integer format", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e5dd372e-1e94-4f25-b1d4-f81a69774b7f
