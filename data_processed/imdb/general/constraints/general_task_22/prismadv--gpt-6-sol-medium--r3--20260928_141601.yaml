      reason_if_invalid: ''
      level: warning
      uid: e0cabbdb-d897-4a6f-be1f-e03f8d3e2920
      source_assumptions:
      - 594ffb01-5e49-4927-bb77-aa03246be918
    - suggestion: '.satisfies("CASE WHEN abs(CAST(`IMDB_Rating` AS DOUBLE) * 10 -
        round(CAST(`IMDB_Rating` AS DOUBLE) * 10)) < 1e-6 THEN 1 ELSE 0 END", "imdb_rating_one_decimal_place",
