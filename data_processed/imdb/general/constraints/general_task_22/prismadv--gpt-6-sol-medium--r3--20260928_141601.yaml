        file: ''
      uid: cb1f61a0-854b-4f78-96e3-b5566954520b
    - text: 'IMDB_Rating and Meta_score should represent compatible rating scales:
        IMDB_Rating should be between 0 and 10, and, when Meta_score is present, it
        should be between 0 and 100. The code divides Meta_score by 10 before blending
        it with an IMDB-based rating; a missing Meta_score is permitted because IMDB_Rating
        is used instead.'
      sources:
