      source_assumptions:
      - b4b5cf44-a5d7-4435-9222-f621e6265e06
    assumptions:
    - text: The input must contain a 'No_of_Votes' column, and every value should
        be present and convertible to a finite number. Invalid or missing values become
        NaN during coercion and can propagate into the Bayesian rating and final score;
        casting the resulting rank to an integer can then fail.
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 97
        end_line: 97
        file: ''
      uid: 17697f8a-3aeb-4099-8336-f982bf1f581b
    - text: '''No_of_Votes'' should contain nonnegative integer counts. Negative counts
        are not meaningful as votes and can produce invalid results in the log-scaled
        popularity component.'
      sources:
      - start_line: 50
        end_line: 52
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: 2e382b06-e996-455e-9ae7-b26a9b2f02ac
    - text: The 60th percentile of 'No_of_Votes' should be greater than zero. This
        makes the Bayesian weight M positive and, together with nonnegative vote counts,
        ensures that v + M is never zero.
      sources:
      - start_line: 49
        end_line: 52
        file: ''
      uid: b4b5cf44-a5d7-4435-9222-f621e6265e06
