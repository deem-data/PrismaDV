        64-bit integer after commas are removed, and that row should also satisfy
        the IMDB_Rating, No_of_Votes, and Runtime requirements for a valid qa_pop_score.
        The box-office ranking combines parsed Gross with that score; null Gross is
        allowed and excludes the row from the box-office carousel.
