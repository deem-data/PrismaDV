        BETWEEN 0 AND 9223372036854775807 AND `IMDB_Rating` IS NOT NULL AND NOT isnan(`IMDB_Rating`)
        AND `No_of_Votes` IS NOT NULL AND `No_of_Votes` >= 0 AND `Runtime` RLIKE \'[0-9]{2,3}\')',
        'box_office_inputs_valid')
