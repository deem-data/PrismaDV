prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: .isContainedIn('Certificate', ['U', 'G', 'PG', 'TV-PG', 'UA', 'PG-13',
        'TV-14', 'R', 'TV-MA', 'NC-17', 'A', 'Not Rated', 'Unrated', 'Approved', 'Passed',
        'U/A', 'GP'])
      validity: false
      reason_if_invalid: 'Constraint ''.isContainedIn(''Certificate'', [''U'', ''G'',
        ''PG'', ''TV-PG'', ''UA'', ''PG-13'', ''TV-14'', ''R'', ''TV-MA'', ''NC-17'',
        ''A'', ''Not Rated'', ''Unrated'', ''Approved'', ''Passed'', ''U/A'', ''GP''])''
        failed on data sample: Value: 0.998330550918197 does not meet the constraint
        requirement!'
      level: warning
      uid: 267d8fe9-ead4-49d7-8148-2ebb96b0c610
      source_assumptions:
      - 903dc8f6-e8b0-4f87-9ef1-4295429e02e3
      - 0782c03f-a38f-418c-8c00-ffe3a1cf5e6a
    assumptions:
    - text: The input data must contain a 'Certificate' column. The script accesses
        it directly, maps it to maturity levels, and includes it in its outputs.
      sources:
      - start_line: 39
        end_line: 39
        file: ''
      - start_line: 82
        end_line: 82
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: 07ca423e-c7cc-4c07-b4a0-b6c6cfe34fbc
    - text: Null 'Certificate' values are permitted. They produce no mapped maturity
        level, are treated as not kids-safe, and are serialized as null in carousel
        items; the input column therefore need not be fully complete.
      sources:
      - start_line: 82
        end_line: 85
        file: ''
      - start_line: 107
        end_line: 120
        file: ''
      uid: 903dc8f6-e8b0-4f87-9ef1-4295429e02e3
    - text: 'Non-null ''Certificate'' values should be exact matches for the supported
        categories: U, G, PG, TV-PG, UA, PG-13, TV-14, R, TV-MA, NC-17, A, Not Rated,
        Unrated, Approved, Passed, U/A, or GP. The mapping does not normalize case
        or whitespace. An unrecognized value will not crash the script, but it will
        be assigned no maturity level and excluded from kids-safe results.'
      sources:
      - start_line: 77
        end_line: 85
        file: ''
      - start_line: 122
        end_line: 123
        file: ''
      uid: 0782c03f-a38f-418c-8c00-ffe3a1cf5e6a
  Genre:
    code:
    - suggestion: .isComplete('Genre')
      validity: true
      reason_if_invalid: ''
      level: warning
