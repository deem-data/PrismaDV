    assumptions:
    - text: Every row used for ranking should have a non-null numeric IMDB_Rating,
        a non-null, non-negative No_of_Votes, and a Runtime containing a two- or three-digit
        minute value. These fields jointly produce the quality, popularity, and runtime
        factors of the final score; an unparseable Runtime also causes the integer
        conversion to fail. A row-level constraint can check all three conditions
        together.
      sources:
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 48
        end_line: 67
        file: ''
      - start_line: 97
