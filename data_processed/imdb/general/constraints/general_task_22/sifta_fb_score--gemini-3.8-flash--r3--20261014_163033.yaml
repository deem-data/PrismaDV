      : [{ \"start_line\": int, \"end_line\": int }, ...] }"
    assumption_generation: "Analyze how the target column is used in the focused code,\
      \ its column description, and the downstream task to infer data validation assumptions.\n\
      \nGuidelines for generating assumptions:\n1. Grounding and Impact: State properties\
      \ where violation would cause the code to crash (e.g., regex extract producing\
      \ NaNs before .astype(int), unhandled nulls, duplicate keys in set_index(...,\
      \ verify_integrity=True)) OR silently produce wrong results (e.g., corrupted\
      \ vote counts distorting log-scaled popularity formulas, bad types breaking\
      \ sort_values, invalid ratings skewing composite rankings).\n2. Distinguish\
      \ Defensive Parsing from Safe Defaults:\n   - Pipeline operations like pd.to_numeric(...,\
      \ errors='coerce'), .fillna(0), or .clip(...) are often defensive guards to\
      \ prevent immediate crashes. If invalid, missing, or out-of-range values passing\
      \ through these fallbacks would silently alter calculations, ranking logic,\
      \ or downstream recommendations, assume the column must contain valid, conformant\
      \ data.\n   - Only consider an issue truly handled if the downstream business\
      \ logic intentionally treats nulls or fallback values as normal, valid business\
      \ states without distorting results.\n3. Passthrough and Schema Assumptions:\n\
      \   - If a column is passed through or included in final output exports (e.g.,\
      \ 'Poster_Link', 'Director', 'Star1'-'Star4', 'Certificate') without heavy computation,\
      \ it forms part of the published dataset contract. Assume it must exist, maintain\
      \ completeness (if indicated by metadata), and conform to its expected foundational\
      \ domain data type (e.g., String).\n4. Dataset Domain Context (Movie/Entertainment\
      \ Data):\n   - Categorical/Text fields ('Series_Title', 'Certificate', 'Genre',\
      \ 'Director', 'Star1'-'Star4'): Expected to be strings; Certificate and Genre\
      \ match standard industry categories. Key identifiers (e.g., ('Series_Title',\
      \ 'Released_Year')) must maintain unique integrity when used as composite keys\
      \ or index definitions.\n   - Numeric fields ('IMDB_Rating', 'No_of_Votes',\
      \ 'Released_Year', 'Meta_score'): Expected to be numeric; ratings bounded within\
      \ [0, 10]; vote counts non-negative integers; release years valid calendar years.\n\
      \   - Formatted fields ('Runtime', 'Gross'): Runtime typically formatted with\
      \ digits (e.g., '110 min'); Gross contains numeric or currency representations.\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
      \ }, ...] }"
    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Assignment:\n- Set level \"error\" for all checks where failure\
      \ indicates an unsafe partition—meaning the code would crash OR silently produce\
      \ an incorrect, invalid, or corrupted result. This includes:\n  * Foundational\
      \ data type checks (.hasDataType) for all active columns (computational inputs,\
      \ keys, and export schema fields).\n  * Completeness (.isComplete) on required\
      \ identifiers, scoring inputs, or non-nullable fields where missing data skews\
      \ metrics, ranking, or schema validity.\n  * Essential domain validity constraints\
      \ (e.g., .isNonNegative for counts/votes, non-empty regex patterns, composite\
      \ uniqueness).\n  * CRITICAL: Do NOT downgrade a constraint to \"warning\" merely\
      \ because defensive code (such as errors='coerce', fillna, or clip) allows the\
      \ script to finish running without an exception. If coerced values corrupt downstream\
      \ calculations or output integrity, the constraint MUST be \"error\". Every\
      \ target column must have its core data type and integrity checks set to \"\
      error\" so erroneous partitions can be rejected.\n- Set level \"warning\" ONLY\
      \ if the deviation is purely a benign, advisory observation that does not invalidate\
      \ downstream logic, calculations, or the output dataset schema (e.g., secondary\
      \ non-fatal properties where nulls are an intended business scenario).\n\nRules\
      \ for PyDeequ Constraints:\n- Use exact PyDeequ syntax and ConstrainableDataTypes\
      \ enum (e.g., ConstrainableDataTypes.String, ConstrainableDataTypes.Numeric,\
      \ ConstrainableDataTypes.Integral).\n- For column existence and completeness\
      \ where nulls break downstream logic or output integrity, use .isComplete('column').\n\
      - For type checks, use .hasDataType('column', ConstrainableDataTypes....).\n\
      - For non-negative numeric expectations, use .isNonNegative('column').\n- For\
      \ composite key uniqueness (e.g., Series_Title + Released_Year), use .hasUniqueness(['col1',\
