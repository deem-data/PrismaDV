constraints:
  Certificate:
    code:
    - - '.satisfies("Certificate IS NULL OR Certificate IN (''U'', ''G'', ''PG'',
        ''TV-PG'', ''UA'', ''PG-13'', ''TV-14'', ''R'', ''TV-MA'', ''NC-17'', ''A'',
        ''Not Rated'', ''Unrated'', ''Approved'', ''Passed'', ''U/A'', ''GP'')", ''known_certificate'',
        lambda x: x == 1)'
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - '.hasPattern(''Genre'', ''^[^,]+(, [^,]+)*$'', lambda x: x == 1)'
      - Valid
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.satisfies("Gross IS NULL OR Gross RLIKE ''^(?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)$''",
        ''gross_format'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - '.satisfies(''ABS(IMDB_Rating * 10 - ROUND(IMDB_Rating * 10)) < 0.000001'',
        ''imdb_rating_tenths'', lambda x: x == 1)'
      - Valid
    - - '.satisfies(''IMDB_Rating >= 0 AND IMDB_Rating <= 10'', ''imdb_rating_range'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.satisfies(''Meta_score IS NULL OR (Meta_score >= 0 AND Meta_score <= 100)'',
        ''meta_score_range'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - '.satisfies(''Released_Year IS NULL OR (Released_Year >= 1888 AND Released_Year
        <= 2100)'', ''released_year_range'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.hasPattern(''Runtime'', ''^[0-9]{2,3} min$'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
