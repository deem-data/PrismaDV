        \ np.nan)\n    if s.notna().sum() == 0:\n        return pd.Series(0.0, index=s.index)\n\
        \    s = s.fillna(s.dropna().min())\n    min_v = s.min()\n    max_v = s.max()\n\
        \    if max_v == min_v:\n        return pd.Series(1.0, index=s.index)\n  \
        \  return (s - min_v) / (max_v - min_v)\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
        \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
        \ type=str, required=True)\n    args = parser.parse_args()\n\n    os.makedirs(args.output,\
        \ exist_ok=True)\n\n    input_csv = os.path.join(args.input, 'new_data.csv')\n\
        \    df = pd.read_csv(input_csv)\n\n    # Basic type coercions used downstream\n\
        \    df['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'], errors='coerce')\n\
        \    df['Meta_score'] = pd.to_numeric(df['Meta_score'], errors='coerce')\n\
        \    df['No_of_Votes'] = pd.to_numeric(df['No_of_Votes'], errors='coerce')\n\
        \    df['Released_Year'] = pd.to_numeric(df['Released_Year'], errors='coerce')\n\
        \    df['Runtime'] = df['Runtime'].astype(str)\n    df['Certificate'] = df['Certificate'].astype(object)\n\
        \    df['Genre'] = df['Genre'].astype(str)\n\n    # Guard assumptions around\
        \ IMDB_Rating before deriving rating buckets and quality blend\n    # Buckets\
        \ by 0.1 rating granularity (relies on quantization)\n    df['rating_tenth']\
        \ = (df['IMDB_Rating'] * 10).astype(int)\n\n    # Guard assumptions for No_of_Votes\
        \ before Bayesian averaging and log-scaling\n    # Weighted (Bayesian) rating\
        \ using vote counts\n    C = df['IMDB_Rating'].mean()\n    M = float(df['No_of_Votes'].quantile(0.60))\n\
        \    v = df['No_of_Votes']\n    R = df['IMDB_Rating']\n    df['bayes_rating']\
        \ = (v / (v + M)) * R + (M / (v + M)) * C\n    # Quality blend of IMDB and\
        \ Meta when available\n    meta10 = df['Meta_score'] / 10.0\n    meta10_filled\
        \ = meta10.where(meta10.notna(), df['IMDB_Rating'])\n    df['quality_component']\
        \ = 0.6 * df['bayes_rating'] + 0.4 * meta10_filled\n    df['Runtime_minutes']\
        \ = df['Runtime'].str.extract(r'([0-9]{2,3})', expand=False).astype(int)\n\
        \    deviation = (df['Runtime_minutes'] - 120).abs()\n    runtime_factor =\
        \ 1.0 - (deviation / 120.0) * 0.20\n    df['runtime_factor'] = runtime_factor.clip(lower=0.80,\
        \ upper=1.05)\n\n    # Popularity component\n    df['pop_component'] = np.log1p(df['No_of_Votes'])\n\
        \n    # Final quality-adjusted popularity score powering ranking\n    df['qa_pop_score']\
        \ = 0.65 * minmax_norm(df['quality_component']) + 0.35 * minmax_norm(df['pop_component'])\n\
        \    df['qa_pop_score'] = df['qa_pop_score'] * df['runtime_factor']\n    #\
