      - - .satisfies("CAST(regexp_extract(Runtime, '^([0-9]{2,3}) min$', 1) AS INT)
          BETWEEN 30 AND 300", 'plausible_runtime_minutes')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
