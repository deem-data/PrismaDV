      \ and Precision Rules:\n- A partition is predicted as erroneous if ANY single\
      \ \"error\"-level constraint fails.\n- Set level \"error\" ONLY when violation\
      \ of the constraint causes the downstream code to crash OR silently produce\
      \ a wrong result (such as silent key overwrites or corrupted unclipped math):\n\
      \  1. Direct Crashes:\n     * Unhandled regex casting to int without fillna\
      \ or errors='coerce': use .isComplete(col) at level \"error\" and .hasPattern(col,\
      \ pattern) at level \"error\".\n     * Key uniqueness in set_index(..., verify_integrity=True)\
      \ or dict(zip(...)): use .isUnique(col) or .hasUniqueness([cols...], lambda\
