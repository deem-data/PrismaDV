    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. Analyze how the target column is used in the focused code (e.g.,\
      \ indexing, type casting, arithmetic, filtering, sorting, string operations,\
      \ or pass-through in output schemas) alongside its column profile in target_column_desc\
      \ (dataType, completeness, distinct values).\n\nGenerate concrete assumptions\
      \ grounded in what the code actually depends on to avoid crashes and silent\
      \ calculation failures:\n\n1. High-Severity Contracts (Crashes and Silent Corruption):\n\
      \   - Key and Index Integrity: If a column (individually or in a composite tuple)\
      \ is used in strict indexing (e.g., set_index with verify_integrity=True) or\
      \ as dictionary keys (e.g., dict(zip(...))), assume STRICT uniqueness (100%\
      \ unique key pairs). Duplicate keys cause immediate ValueError crashes in verify_integrity\
      \ or silent key overwrites that corrupt output dictionaries (e.g., score_map).\
      \ Note: A column used as a dictionary key or strict index is a KEY column, NOT\
      \ a pass-through column, even if it is also exported to CSV.\n   - Unhandled\
      \ String Extraction and Type Casting: If string methods or regex extraction\
      \ are immediately followed by raw type casting without fillna or errors='coerce'\
      \ (e.g., df['Runtime'].str.extract(r'(\\d+)')[0].astype(int)), nulls or unparseable\
      \ strings produce NaNs that cause immediate, unhandled IntCastingNaNError crashes.\
      \ Assume 100% completeness and strict regex pattern match.\n   - Unhandled Domain\
      \ Bounds & Math Operations:\n     * Rating columns (e.g., IMDB_Rating): Must\
      \ be numeric and bounded within [0, 10] when normalized without clipping (e.g.,\
      \ df['IMDB_Rating'] / 10.0) to prevent corrupted composite scores. If explicitly\
      \ clipped via .clip(0, 1), minor out-of-bounds values are safely tolerated.\n\
      \     * Vote/count columns: Assume non-negativity (>= 0) or positive (> 0) ONLY\
      \ IF directly fed into log transforms (np.log, np.log10) WITHOUT lower-bound\
      \ clipping. If explicitly handled via .clip(lower=1) or fillna(0), negative\
      \ values do not break the calculation.\n\n2. Tolerant Operations & Defensive\
      \ Fallbacks (Low Severity / Warnings):\n   - Distinguish true silent corruption\
      \ from intentional defensive tolerance. When code explicitly includes defensive\
      \ handling (e.g., pd.to_numeric(..., errors='coerce').fillna(0), .clip(lower=1),\
      \ or dict.get(token, default)), it was designed to absorb missing values or\
      \ parse noise without crashing or breaking downstream logic.\n   - Do NOT assume\
      \ strict 100% perfection, strict completeness (>= 0.8), or strict data types\
      \ as hard contracts for defensively parsed columns. Mark these as tolerant/informational\
      \ assumptions.\n\n3. Exported and Pass-Through Columns:\n   - For columns included\
      \ only in export schemas, shortlist_cols, or out_cols without computational\
      \ logic (e.g., Poster_Link, Star1-Star4, Director, Gross):\n     * If subset\
      \ via df[shortlist_cols] without column existence checks, assume the column\
      \ must exist in the input schema to prevent KeyError crashes.\n     * If selected\
      \ conditionally (e.g., [c for c in out_cols if c in df.columns]), the column\
      \ is entirely optional.\n     * Missing values or data type nuances in pass-through\
      \ metadata do not crash or corrupt scoring logic. Treat data quality on these\
      \ columns as informational/warning-level only.\n\nOutput only valid JSON (numbers\
      \ without leading zeros): { \"assumptions\": [{ \"text\": str, \"sources\":\
      \ [{ \"start_line\": int, \"end_line\": int }] }, ...] }"
