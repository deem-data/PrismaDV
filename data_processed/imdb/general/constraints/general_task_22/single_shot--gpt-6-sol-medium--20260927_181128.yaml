constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR Certificate IN ('U', 'G', 'PG', 'TV-PG',
        'UA', 'PG-13', 'TV-14', 'R', 'TV-MA', 'NC-17', 'A', 'Not Rated', 'Unrated',
        'Approved', 'Passed', 'U/A', 'GP')", 'recognized_certificate')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .satisfies("Genre IS NOT NULL AND Genre RLIKE '^[A-Za-z-]+(, [A-Za-z-]+)*$'",
        'parseable_genre_tokens')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR (Gross RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'
        AND length(regexp_replace(Gross, ',', '')) <= 18)", 'parseable_optional_gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .satisfies('IMDB_Rating IS NOT NULL AND NOT isnan(IMDB_Rating) AND IMDB_Rating
        BETWEEN 1 AND 10 AND abs(IMDB_Rating * 10 - round(IMDB_Rating * 10)) < 0.000001',
        'valid_rating_in_tenths')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .satisfies('Meta_score IS NULL OR (NOT isnan(Meta_score) AND Meta_score BETWEEN
        0 AND 100)', 'valid_optional_meta_score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .satisfies('No_of_Votes IS NOT NULL AND No_of_Votes > 0', 'positive_vote_count')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .satisfies("Poster_Link IS NOT NULL AND Poster_Link RLIKE '^https?://[^ ]+$'",
        'valid_poster_link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .satisfies('Released_Year IS NOT NULL AND Released_Year BETWEEN 1888 AND year(current_date())',
        'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("Runtime IS NOT NULL AND Runtime RLIKE '^[0-9]{2,3} min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .satisfies('Series_Title IS NOT NULL AND length(trim(CAST(Series_Title AS
        STRING))) > 0', 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
