      \ Validates US SSN format.\n- `.hasDataType(column, datatype, assertion=None)`:\
      \ Checks `ConstrainableDataTypes.<Type>`.\n- `.isNonNegative(column, assertion=None)`:\
      \ Numeric values >= 0.\n- `.isPositive(column, assertion=None)`: Numeric values\
      \ > 0.\n- `.isLessThan(columnA, columnB, assertion=None)`: columnA < columnB.\n\
      - `.isLessThanOrEqualTo(columnA, columnB, assertion=None)`: columnA <= columnB.\n\
      - `.isGreaterThan(columnA, columnB, assertion=None)`: columnA > columnB.\n-\
