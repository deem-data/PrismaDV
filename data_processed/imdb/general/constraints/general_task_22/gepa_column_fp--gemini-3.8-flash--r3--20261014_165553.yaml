      \ 10.0', 'col_range_check')\",\n      \"level\": \"warning\",\n      \"linked\
      \ assumptions\": [1]\n    }\n  ]\n}\n```\n\n---\n\n### Available PyDeequ Functions\n\
      \n#### Row-Level Functions:\n- `.isComplete(column)`: Validates column contains\
      \ no nulls.\n- `.hasCompleteness(column, assertion)`: Completeness fraction\
      \ (0.0 to 1.0) meets lambda threshold.\n- `.areComplete(columns)`: All columns\
      \ in the list contain no null values.\n- `.haveCompleteness(columns, assertion)`:\
      \ Completeness fraction across a set of columns meets assertion.\n- `.areAnyComplete(columns)`:\
      \ At least one column in set is complete.\n- `.satisfies(columnCondition, constraintName,\
      \ assertion=None)`: SQL WHERE clause condition. Example: `.satisfies('`val`\
      \ >= 0', 'val_non_negative')`.\n- `.hasPattern(column, pattern, assertion=None,\
      \ name=None)`: Regex pattern check using raw strings `r\"...\"`.\n- `.containsCreditCardNumber(column,\
      \ assertion=None)`: Validates credit card format.\n- `.containsEmail(column,\
      \ assertion=None)`: Validates email format.\n- `.containsURL(column, assertion=None)`:\
