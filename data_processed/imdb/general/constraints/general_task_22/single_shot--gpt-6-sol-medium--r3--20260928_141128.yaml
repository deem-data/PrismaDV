constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR TRIM(CAST(Certificate AS STRING)) <> ''",
        'nonempty_certificate_when_present')
      - Valid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .satisfies("Genre RLIKE '^[^,]+(, [^,]+)*$'", 'comma_space_separated_genres')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR CAST(Gross AS STRING) RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parseable_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10 AND ABS(IMDB_Rating * 10 - ROUND(IMDB_Rating
        * 10)) < 0.000001', 'valid_rating_tenths')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .satisfies('Meta_score IS NULL OR Meta_score BETWEEN 0 AND 100', 'valid_meta_score_when_present')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .satisfies('No_of_Votes > 0', 'positive_vote_counts')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .satisfies('Released_Year BETWEEN 1888 AND 2026', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .satisfies("Series_Title IS NOT NULL AND TRIM(CAST(Series_Title AS STRING))
        <> ''", 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
