constraints:
  Genre:
    code:
    - - .satisfies("`Genre` RLIKE '^[A-Za-z-]+(, [A-Za-z-]+)*$'", 'comma-space-separated
        genres')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("`Gross` IS NULL OR `Gross` RLIKE '^[0-9]+(,[0-9]{3})*$'", 'parseable
        optional gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'valid IMDb rating')
      - Valid
    - - .satisfies('abs(`IMDB_Rating` * 10 - round(`IMDB_Rating` * 10)) < 0.000001',
        'rating in tenths')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .satisfies('`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score` <=
        100)', 'valid optional meta score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .satisfies('`Released_Year` IS NULL OR (`Released_Year` >= 1888 AND `Released_Year`
        <= 2100)', 'plausible release year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("`Runtime` RLIKE '^[0-9]{2,3} min$'", 'runtime format')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
