  '["Certificate","Genre"]':
    code: []
    assumptions:
    - text: The 'Certificate' and 'Genre' columns are used together to filter content
        for parental safety ('is_kids_safe'). The 'Certificate' is mapped to numerical
        maturity levels (where values like 'U', 'G', 'PG', 'TV-PG', 'Approved', 'Passed'
        correspond to maturity <= 1), while 'Genre' is parsed into genre tokens where
        titles must not contain mature genres such as 'Horror' or 'Thriller' to be
        deemed kids-safe.
      sources:
      - start_line: 71
        end_line: 85
        file: ''
      uid: da7c32b0-b37c-4008-ae8f-8995cc48be91
  '["Certificate","Released_Year"]':
    code:
    - suggestion: .satisfies("CASE WHEN `Certificate` = 'PG-13' THEN `Released_Year`
        >= 1984 WHEN `Certificate` IN ('Approved', 'Passed') THEN `Released_Year`
        <= 1970 ELSE TRUE END", "Certificate_Year_Temporal_Consistency")
      validity: false
      reason_if_invalid: 'Constraint ''.satisfies("CASE WHEN `Certificate` = ''PG-13''
        THEN `Released_Year` >= 1984 WHEN `Certificate` IN (''Approved'', ''Passed'')
        THEN `Released_Year` <= 1970 ELSE TRUE END", "Certificate_Year_Temporal_Consistency")''
        failed on data sample: Value: 0.998330550918197 does not meet the constraint
        requirement!'
      level: warning
      uid: 421afac1-fa86-4ca5-a82c-14f1403e0b0a
      source_assumptions:
      - eafe1550-470b-4657-837b-c38fcf6e023f
    assumptions:
    - text: 'There is a temporal dependency between ''Certificate'' and ''Released_Year''.
        Certain movie certification standards and rating systems were introduced in
        specific time periods (for example, ''PG-13'' was introduced in 1984, TV rating
        systems such as ''TV-MA'' and ''TV-14'' in 1997, whereas ratings like ''Approved''
        and ''Passed'' correspond to the pre-1968 Hays Code era). Movies with modern
        ratings such as ''PG-13'' should generally have a ''Released_Year'' >= 1984,
        and vintage ratings like ''Approved'' or ''Passed'' should correspond to earlier
        release years. We could represent this assumption as a Deequ constraint: .satisfies("CASE
        WHEN Certificate = ''PG-13'' THEN Released_Year >= 1984 WHEN Certificate IN
        (''Approved'', ''Passed'') THEN Released_Year <= 1970 ELSE TRUE END", ''Certificate_Year_Temporal_Consistency'')'
      sources:
      - start_line: 37
        end_line: 39
        file: ''
      - start_line: 68
        end_line: 68
        file: ''
      - start_line: 108
        end_line: 120
        file: ''
      - start_line: 155
        end_line: 160
        file: ''
      uid: eafe1550-470b-4657-837b-c38fcf6e023f
  '["IMDB_Rating","Meta_score"]':
    code: []
    assumptions:
    - text: When 'Meta_score' is missing, 'IMDB_Rating' is used as a fallback to compute
        the movie quality score. Therefore, 'IMDB_Rating' and 'Meta_score' / 10 are
        assumed to be on the same scale (0 to 10), and 'IMDB_Rating' should be non-null
        whenever 'Meta_score' is null.
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      uid: f34f217f-7c19-4eaa-8c6a-30da3960a451
