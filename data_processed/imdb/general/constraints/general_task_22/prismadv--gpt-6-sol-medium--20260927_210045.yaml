      - start_line: 99
        end_line: 104
        file: ''
      - start_line: 107
        end_line: 109
        file: ''
      uid: b6190304-134a-4d11-95ab-dd839c25b4be
    - text: Every 'Poster_Link' value should be non-null and non-blank. The column
        is currently complete, and the code passes its values directly to output without
        filling missing links.
      sources:
      - start_line: 108
        end_line: 117
        file: ''
      - start_line: 131
        end_line: 139
        file: ''
      uid: 9bb60e51-8237-4aa3-862c-cdf39c00f17d
    - text: Each 'Poster_Link' should be a string containing an absolute HTTP or HTTPS
