prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: f608690d-d61a-4d6d-a279-85b3062bbc0b
      source_assumptions:
      - e9e2e4aa-1e57-48c7-ad87-b1a350bdf4eb
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.85)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 44a27778-ee6a-4f36-a262-acb71e6b49c3
      source_assumptions:
      - 30a83e64-af5e-4afa-a688-2aef84d1d474
    - suggestion: '.isContainedIn(''Certificate'', [''U'', ''G'', ''PG'', ''TV-PG'',
        ''UA'', ''PG-13'', ''TV-14'', ''R'', ''TV-MA'', ''NC-17'', ''A'', ''Not Rated'',
        ''Unrated'', ''Approved'', ''Passed'', ''U/A'', ''GP''], lambda x: x >= 0.95)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: fd9f9f63-284a-408b-8ee1-7182cc7cbd2a
      source_assumptions:
      - 766fe712-4908-406d-abeb-72734d7eacb0
    assumptions:
    - text: The input must contain a 'Certificate' column. The script accesses it
        directly to assign maturity levels and includes it in its outputs.
      sources:
      - start_line: 39
        end_line: 39
        file: ''
      - start_line: 82
        end_line: 82
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: e9e2e4aa-1e57-48c7-ad87-b1a350bdf4eb
    - text: The 'Certificate' column may contain null values. Null certificates are
        treated as not kids-safe and are serialized as null in carousel JSON, so input
        validation should not require this column to be complete. Its non-null rate
        should remain approximately consistent with the observed 89.8% if certificate
        coverage is important to the outputs.
      sources:
      - start_line: 82
        end_line: 85
        file: ''
      - start_line: 107
        end_line: 119
        file: ''
      uid: 30a83e64-af5e-4afa-a688-2aef84d1d474
    - text: 'Non-null ''Certificate'' values should use the exact labels recognized
        by the maturity mapping: U, G, PG, TV-PG, UA, PG-13, TV-14, R, TV-MA, NC-17,
        A, Not Rated, Unrated, Approved, Passed, U/A, or GP. Validation can check
        the proportion of non-null input values in this set. Other spellings or values
        do not receive a maturity level and are conservatively excluded from kids-safe
        results.'
      sources:
      - start_line: 77
        end_line: 85
        file: ''
      - start_line: 122
        end_line: 123
        file: ''
      uid: 766fe712-4908-406d-abeb-72734d7eacb0
  Genre:
    code:
    - suggestion: '.satisfies("`Genre` IS NOT NULL AND length(trim(`Genre`)) > 0",
        "genre_present_and_nonblank", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bd742817-1971-48d1-8b3e-0b3ba8f0e39a
      source_assumptions:
      - b7950021-fb4b-4b02-b474-56e00f569359
    - suggestion: '.hasPattern(''Genre'', r''^[^,\s]+(?: [^,\s]+)*(?:, [^,\s]+(?:
        [^,\s]+)*)*$'', lambda x: x == 1, name=''genre_comma_space_format'')'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: cf2c0a58-4600-4c1e-ac69-8e61458b7bad
      source_assumptions:
      - 4e8a70c1-297e-4db0-bdd9-6c37bd655aa6
    - suggestion: '.satisfies("NOT exists(split(`Genre`, '', ''), x -> lower(x) IN
        (''animation'', ''family'', ''horror'', ''thriller'') AND x NOT IN (''Animation'',
        ''Family'', ''Horror'', ''Thriller''))", "genre_flag_tokens_canonical", lambda
        x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f81bfa71-6332-463a-9aa9-38cf39539465
      source_assumptions:
      - 94f2e87b-bead-4f1e-aa3e-bb4268b5abb5
    assumptions:
    - text: 'The input must contain a ''Genre'' column with a non-null, non-blank
        string for every row. Missing values are not handled: converting them to strings
        would produce text such as ''nan'', which would then be exported as a genre.'
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      - start_line: 107
        end_line: 119
        file: ''
      uid: b7950021-fb4b-4b02-b474-56e00f569359
    - text: Each 'Genre' value should be a list of nonempty genre names separated
        by exactly a comma and one space (', '), with no extra whitespace around names.
        The code uses that exact delimiter to create tokens; other formats can prevent
        genre flags and safety checks from matching.
      sources:
      - start_line: 71
        end_line: 73
        file: ''
      - start_line: 83
        end_line: 85
        file: ''
      uid: 4e8a70c1-297e-4db0-bdd9-6c37bd655aa6
    - text: Whenever a title has an Animation, Family, Horror, or Thriller genre,
        that token should use exactly the indicated spelling and capitalization. The
        code compares tokens case-sensitively; in particular, an unrecognized Horror
        or Thriller token could cause a title to be incorrectly marked kids-safe.
      sources:
      - start_line: 72
        end_line: 73
        file: ''
      - start_line: 83
        end_line: 85
        file: ''
      - start_line: 122
        end_line: 123
        file: ''
      uid: 94f2e87b-bead-4f1e-aa3e-bb4268b5abb5
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(`Gross` AS STRING) RLIKE '^(?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)$'",
        "gross_whole_number_format")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 45276b51-1cb1-4b3a-8fad-bb31bc4bbced
      source_assumptions:
      - 75f0ce60-a8ec-42cf-9f56-3c1e67a7b88a
      - 8bc5111f-8603-4584-b6d3-8329690d0491
    - suggestion: .satisfies("`Gross` IS NULL OR length(regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), ',', ''), '^0+', '')) < 19 OR (length(regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), ',', ''), '^0+', '')) = 19 AND regexp_replace(regexp_replace(CAST(`Gross`
        AS STRING), ',', ''), '^0+', '') <= '9223372036854775807')", "gross_within_signed_int64_range")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 08586e38-5b5e-4bbe-8cbd-7710c5109383
      source_assumptions:
      - 75f0ce60-a8ec-42cf-9f56-3c1e67a7b88a
      - f1398a7c-1693-4814-91c8-aaa6a07b940e
    assumptions:
    - text: The 'Gross' column may contain null values. The code preserves those rows
        in the ranked output but excludes them from the box-office carousel; input
        validation should not require this column to be complete.
      sources:
      - start_line: 89
        end_line: 94
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      - start_line: 125
        end_line: 126
        file: ''
      uid: 75f0ce60-a8ec-42cf-9f56-3c1e67a7b88a
    - text: 'Every non-null ''Gross'' value should represent a non-negative whole
        number, written as digits with either no commas or commas separating groups
        of three digits (for example, ''1234567'' or ''1,234,567''). Currency symbols,
        decimal points, and other text should be rejected: the code removes only commas,
        then coerces unparseable values to null before converting to an integer.'
      sources:
      - start_line: 87
        end_line: 94
        file: ''
      - start_line: 125
        end_line: 134
        file: ''
      uid: 8bc5111f-8603-4584-b6d3-8329690d0491
    - text: After removing commas, each non-null 'Gross' value should be no greater
        than 9223372036854775807, so it can be converted to pandas' signed nullable
        Int64 type without overflow.
      sources:
      - start_line: 91
        end_line: 94
        file: ''
      uid: f1398a7c-1693-4814-91c8-aaa6a07b940e
  IMDB_Rating:
    code:
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c4c707fb-eba7-48ff-8b81-5d1a76d85131
      source_assumptions:
      - ed3add33-19e3-4428-95a7-1a1b1487e220
    - suggestion: .satisfies('CAST(`IMDB_Rating` AS DOUBLE) IS NOT NULL AND NOT isnan(CAST(`IMDB_Rating`
        AS DOUBLE)) AND ABS(CAST(`IMDB_Rating` AS DOUBLE)) <= 1.0E308', 'finite_numeric_imdb_rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 5863c5e5-c3a3-4d62-b73d-53583ebfbaca
      source_assumptions:
      - 97df709a-66c7-48e8-9371-b48b6516ccfe
    - suggestion: .satisfies('`IMDB_Rating` >= 1 AND `IMDB_Rating` <= 10', 'imdb_rating_standard_scale')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c659c96b-b312-4d03-bc41-1d60481cc62f
      source_assumptions:
      - 7e237592-fa4a-4ec2-92b3-0ef381e66bd2
    - suggestion: .satisfies('ABS(`IMDB_Rating` * 10 - ROUND(`IMDB_Rating` * 10, 0))
        <= 1.0E-6', 'imdb_rating_one_decimal_place')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1b652c5b-6807-4df6-8532-03ef8b968171
      source_assumptions:
      - 0b9e3e43-c59f-418d-9190-7e4350c73aef
    assumptions:
    - text: The input 'IMDB_Rating' column should exist and have no missing values.
        The code does not fill missing ratings, and converting the derived rating
        bucket to an integer would fail for a missing rating.
      sources:
      - start_line: 31
        end_line: 34
        file: ''
      - start_line: 42
        end_line: 44
        file: ''
      uid: ed3add33-19e3-4428-95a7-1a1b1487e220
    - text: Every 'IMDB_Rating' value should be convertible to a finite number. Non-numeric
        values are coerced to null, while infinite values cannot be converted into
        the integer rating bucket.
      sources:
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 44
        end_line: 44
        file: ''
      uid: 97df709a-66c7-48e8-9371-b48b6516ccfe
    - text: Each 'IMDB_Rating' value should be on the standard IMDb rating scale of
        1 through 10, inclusive. The rating is blended with 'Meta_score' divided by
        10, so out-of-scale values would distort the quality score and ranking.
      sources:
      - start_line: 48
        end_line: 56
        file: ''
      uid: 7e237592-fa4a-4ec2-92b3-0ef381e66bd2
    - text: 'Each ''IMDB_Rating'' value should be quantized to one decimal place:
        its value multiplied by 10 should be an integer, allowing a small tolerance
        for floating-point representation. The code derives tenth-point buckets by
        multiplying by 10 and casting to an integer; finer-grained values would be
        truncated into misleading buckets.'
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      uid: 0b9e3e43-c59f-418d-9190-7e4350c73aef
  Meta_score:
    code:
    - suggestion: '.satisfies(''`Meta_score` IS NULL OR try_cast(`Meta_score` AS DOUBLE)
        BETWEEN 0 AND 100'', ''nullable_finite_meta_score_0_to_100'', lambda x: x
        == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f9af0c34-effb-48dc-8fdd-a0f024c7700c
      source_assumptions:
      - b4437c3f-c7fe-43f0-95c1-4ac543f73223
      - 7165644b-213e-4d8b-9d16-f10c2c222ee5
      - 9870a010-a899-4545-ae25-208067bb71da
      - f45eb7ad-3280-40b7-9115-c1aea905dcd3
    assumptions:
    - text: The input must contain a 'Meta_score' column, because the script accesses
        it directly.
      sources:
      - start_line: 31
        end_line: 35
        file: ''
      uid: b4437c3f-c7fe-43f0-95c1-4ac543f73223
    - text: Non-null 'Meta_score' values should be finite numbers or strings convertible
        to finite numbers. Values that cannot be converted, as well as infinity, are
        treated as missing, so they would not contribute a Metascore to the quality
        blend.
      sources:
      - start_line: 35
        end_line: 35
        file: ''
      - start_line: 54
        end_line: 56
        file: ''
      - start_line: 9
        end_line: 14
        file: ''
      uid: 7165644b-213e-4d8b-9d16-f10c2c222ee5
    - text: Finite 'Meta_score' values should be on a 0-to-100 scale. The script divides
        them by 10 before blending them with ratings on a 0-to-10 scale; values outside
        0 to 100 would distort that blend and the resulting ranking.
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      - start_line: 66
        end_line: 66
        file: ''
      uid: 9870a010-a899-4545-ae25-208067bb71da
    - text: '''Meta_score'' may be null. About 14% of the profiled values are missing,
        and the script substitutes ''IMDB_Rating'' when a Metascore is unavailable.
        Full completeness should therefore not be required.'
      sources:
      - start_line: 54
        end_line: 56
        file: ''
      uid: f45eb7ad-3280-40b7-9115-c1aea905dcd3
  No_of_Votes:
    code:
    - suggestion: .isComplete('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: cf4a2d42-98ef-46ef-8389-81d0e45c471c
      source_assumptions:
      - df3489d3-54e2-41fe-89e9-1ae027ae786f
      - 86d94901-d3c9-4a6a-9c75-5669fc029be0
    - suggestion: .satisfies('CASE WHEN CAST(`No_of_Votes` AS DOUBLE) BETWEEN -1.7976931348623157E308
        AND 1.7976931348623157E308 THEN 1 ELSE 0 END', 'votes_are_finite_numbers')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 82b363af-cab3-48c7-8cf9-e139dc12ce42
      source_assumptions:
      - 86d94901-d3c9-4a6a-9c75-5669fc029be0
    - suggestion: .satisfies('CASE WHEN CAST(`No_of_Votes` AS DOUBLE) >= 0 AND CAST(`No_of_Votes`
        AS DOUBLE) = FLOOR(CAST(`No_of_Votes` AS DOUBLE)) THEN 1 ELSE 0 END', 'votes_are_nonnegative_integers')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 379e2a85-01df-46db-9f8a-2b38f507464c
      source_assumptions:
      - 64161ac8-6f19-454c-8eea-603ab12754cf
    - suggestion: '.hasApproxQuantile(''No_of_Votes'', 0.60, lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: eab59bac-7627-472c-94a2-08418d3d3d30
      source_assumptions:
      - 5082c3ab-b411-409e-8e58-d1fa0e232833
    assumptions:
    - text: The input must contain a 'No_of_Votes' column, because the script accesses
        it directly for scoring and includes it in the ranked output.
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      - start_line: 99
        end_line: 104
        file: ''
      uid: df3489d3-54e2-41fe-89e9-1ae027ae786f
    - text: Every 'No_of_Votes' value should be present and parseable as a finite
        number. Numeric coercion can turn invalid values into nulls, but the script
        does not fill missing vote counts before calculating Bayesian ratings and
        ranks.
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 97
        end_line: 97
        file: ''
      uid: 86d94901-d3c9-4a6a-9c75-5669fc029be0
    - text: Every 'No_of_Votes' value should be a nonnegative integer, consistent
        with a vote count. Negative values can make log1p invalid or distort the Bayesian
        rating.
      sources:
      - start_line: 49
        end_line: 52
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: 64161ac8-6f19-454c-8eea-603ab12754cf
    - text: The 60th percentile of 'No_of_Votes' should be greater than zero. This
        keeps the Bayesian weighting parameter M positive and prevents a zero vote
        count from producing a zero denominator in the rating formula.
      sources:
      - start_line: 49
        end_line: 52
        file: ''
      uid: 5082c3ab-b411-409e-8e58-d1fa0e232833
  Poster_Link:
