      \ or used in calculations, include the schema definition list and the downstream\
      \ export lines (`df[cols]`, `.to_csv`). Do NOT trace upstream dataframe filtering\
      \ or unrelated scoring logic for passthrough columns.\n\nLine Number Accuracy:\n\
      - Count lines precisely: Line 1 is the very first line of `code_script` (including\
      \ empty lines, comments, and imports). Count every newline character from line\
      \ 1 downward.\n- Multi-line statements (e.g. dictionary definitions, lists,\
