      \ max_val)', 'col_range', lambda x: x >= 0.95)` or `.isNonNegative('col', lambda\
      \ x: x >= 0.95)`.\n- Categorical membership (`isContainedIn`):\n  * `.isContainedIn`\
      \ checks only non-null values. Provide the allowed list and an assertion threshold:\n\
      \    e.g., `.isContainedIn('Certificate', allowed_list, lambda x: x >= 0.90)`.\n\
      \nLink each check to the indices (from 0) of the assumptions it tests.\n\nOutput:\
