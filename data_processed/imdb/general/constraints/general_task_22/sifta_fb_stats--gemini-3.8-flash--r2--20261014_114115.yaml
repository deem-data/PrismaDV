    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. For example, fillna on a column means the column may contain\
      \ nulls, and an assert sets a bound the data must meet. From the code that uses\
      \ the target column, the column profile, and the task description, write these\
      \ assumptions as statements about the input data that a Deequ check can test.\n\
      \nFocus on data properties that directly affect downstream execution:\n1. Critical\
      \ assumptions: properties where violation causes the code to crash (e.g., calling\
      \ string accessors .str on numeric types, casting unparseable strings with .astype(int),\
      \ missing required columns) OR silently produce incorrect/broken results (e.g.,\
      \ swapped columns, corrupted ratings, broken URLs in output cards or feeds).\n\
      2. Data completeness and defensive code:\n   - Inspect target_column_desc: when\
      \ the observed/clean data has completeness near 1.0 (>= 0.95), the pipeline\
      \ relies on the column being complete. Even if code defensively uses errors='coerce',\
      \ fillna, or fallback values, mass nulls or unparseable values degrade downstream\
      \ feeds, metrics, and cards. Assume high completeness (e.g., >= 0.95) unless\
      \ the clean data profile itself indicates significant missingness.\n   - Only\
      \ assume relaxed or baseline completeness (e.g., >= 0.30 to 0.50) when the clean\
      \ data profile itself shows substantial missingness (e.g., Gross or Certificate\
      \ where completeness < 0.90).\n3. Data type integrity and column swap defense:\n\
      \   - When target_column_desc shows Integral, Fractional, Numeric, or String,\
      \ assume the column strictly conforms to that type. Swapped columns (e.g., text\
      \ into vote counts, floats into years, or numbers into genres) silently corrupt\
      \ ranking, arithmetic, or layout.\n4. Domain semantics and boundary validity\
      \ (IMDB and tabular conventions):\n   - Genre: must be a string containing recognizable\
      \ film genres (e.g., Action, Adventure, Animation, Biography, Comedy, Crime,\
      \ Drama, Family, Fantasy, Film-Noir, History, Horror, Music, Musical, Mystery,\
      \ Romance, Sci-Fi, Sport, Thriller, War, Western) to catch swaps with titles,\
      \ certificates, or numeric columns.\n   - No_of_Votes: integral non-negative\
      \ values with realistic minimum vote counts (>= 10) to clearly distinguish vote\
      \ counts from ratings (which are <= 10.0).\n   - Released_Year: valid 4-digit\
      \ positive integers representing film release years ([1880, 2050]).\n   - Runtime:\
      \ duration strings containing numbers and duration units (e.g., 'min'), with\
      \ extracted durations falling within realistic boundaries ([10, 600] minutes).\n\
      \   - IMDB_Rating: numeric floats within standard rating boundaries ([0.0, 10.0]).\n\
      \   - Display links / URLs (e.g., Poster_Link): valid http/https URLs.\n\nOutput\
      \ only valid JSON (numbers without leading zeros): { \"assumptions\": [{ \"\
      text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }] }, ...]\
      \ }"
    ir_generation: "Translate the assumptions into PyDeequ checks. Link each check\
      \ to the indices (from 0) of the assumptions it tests.\n\nAssign severity levels\
      \ based on code impact:\n- Every target column being validated MUST have at\
      \ least one \"error\"-level constraint in its generated suite so that erroneous\
      \ partitions can be detected. Never generate a suite composed exclusively of\
      \ \"warning\" constraints.\n- Set level \"error\" for all checks validating\
      \ core data properties: data type conformance (.hasDataType), completeness (.hasCompleteness\
      \ when clean data completeness >= 0.95), and domain boundaries / patterns that\
      \ guard against crashes or silent corruption (such as swapped columns or invalid\
      \ numeric ranges).\n- Set level \"warning\" ONLY for advisory checks on optional\
      \ columns where the clean data profile already exhibits missingness (e.g., Gross\
      \ completeness < 0.90) and where fallback code fully handles the missing values\
      \ without corrupting outputs.\n\nPrecision and Robustness Guidelines:\n- Guarding\
      \ against False Negatives (safe partitions flagging):\n  - In PyDeequ, .hasPattern(col,\
      \ pattern), .satisfies(condition, name), and .hasDataType(col, type) without\
      \ an assertion lambda default to 1.0 (requiring 100% match). Provide a threshold\
      \ lambda (e.g., lambda x: x >= 0.95 or lambda x: x >= 0.90) to accommodate rare\
      \ minor anomalies.\n  - In SQL conditions in .satisfies(), only include \"`col`\
      \ IS NULL OR ...\" if the clean data profile indicates the column is naturally\
      \ nullable (completeness < 0.95). If completeness is >= 0.95 in the clean data,\
      \ do NOT add \"`col` IS NULL OR ...\", as doing so permits null-corrupted partitions\
      \ to pass undetected; the threshold lambda (e.g., lambda x: x >= 0.95) already\
      \ provides safe row-level tolerance.\n- Catching Column Swaps and Semantic Violations\
      \ (prevent False Positives / missed errors):\n  - Always enforce data type with\
      \ level \"error\": .hasDataType('col', ConstrainableDataTypes.<Type>, lambda\
      \ x: x >= 0.95). This is critical to catch swaps between numeric and string\
      \ columns.\n  - Domain-specific checks (set to level \"error\"):\n    - For\
      \ Genre: validate string type and verify it contains standard genre vocabulary:\
      \ .hasPattern('Genre', r'.*(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western).*',\
      \ lambda x: x >= 0.90)\n    - For No_of_Votes: validate non-negative integer\
      \ type and enforce a baseline lower bound to distinguish from ratings: .isNonNegative('No_of_Votes',\
