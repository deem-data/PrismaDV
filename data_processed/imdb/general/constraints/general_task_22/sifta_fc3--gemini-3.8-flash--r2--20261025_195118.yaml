      \ that PyDeequ checks can validate.\n\nFocus on assumptions that prevent code\
      \ crashes or silent erroneous results:\n1. Ground assumptions in actual operations\
      \ and column statistics:\n   - Type requirements: If the column undergoes arithmetic,\
      \ numeric comparison, or numeric conversion, assume it must be numeric. In CSV/tabular\
      \ pipelines, integer fields (e.g., Released_Year, vote counts) often have floating-point\
