constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR Certificate IN ('U', 'G', 'PG', 'TV-PG',
        'UA', 'PG-13', 'TV-14', 'R', 'TV-MA', 'NC-17', 'A', 'Not Rated', 'Unrated',
        'Approved', 'Passed', 'U/A', 'GP')", 'recognized_optional_certificate')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    - - .satisfies("Genre RLIKE '^[^,]+(, [^,]+)*$'", 'comma_space_separated_genres')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR Gross RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parseable_optional_gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating >= 0 AND IMDB_Rating <= 10 AND abs(IMDB_Rating * 10
        - round(IMDB_Rating * 10, 0)) < 0.000001', 'valid_tenth_increment_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - .satisfies('Meta_score IS NULL OR (Meta_score >= 0 AND Meta_score <= 100)',
        'valid_optional_meta_score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .satisfies('Released_Year IS NULL OR (Released_Year >= 1888 AND Released_Year
        <= 2100)', 'plausible_optional_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
