    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. From the code that uses the target column, the target column\
      \ description, and the downstream task description, generate precise assumptions\
      \ about the input data required for correct execution.\n\nPrioritize precision\
      \ over coverage: an assumption must state a property whose violation would either\
      \ CRASH the pipeline (e.g., unhandled exception) or SILENTLY CORRUPT downstream\
      \ results (e.g., distorted rankings, incorrect mathematical operations). Do\
      \ not invent speculative or generic data quality rules that the code does not\
      \ strictly require.\n\nKey Guidelines:\n1. Grounding in Actual Code Logic:\n\
      \   - Carefully inspect how the code consumes the column. If a column is merely\
      \ loaded, coerced, and written to output without participating in business logic,\
      \ avoid strict assumptions.\n   - Look for defensive programming: If the code\
      \ uses `errors='coerce'`, `.fillna()`, `pd.notna()`, or string wrapping `str(...)`,\
      \ it explicitly anticipates and handles missing, dirty, or non-conforming values.\
      \ Do NOT assume strict completeness or rigid type purity for these columns.\n\
      2. Data Type Requirements:\n   - Identify data types required by unhandled operations:\
      \ String methods (`.str.split`, `.str.strip`) require String type; direct unhandled\
      \ arithmetic, quantiles, or math functions require Numeric types.\n   - Do not\
      \ assume a column is strictly Integral if the code parses it with `pd.to_numeric(...,\
      \ errors='coerce')` or if missing values naturally turn integer columns into\
      \ floats.\n3. Value Range & Validity:\n   - Only assume domain bounds if violations\
      \ break mathematical logic (e.g., division by zero, non-positive inputs to `np.log`)\
      \ or corrupt downstream filtering/scoring.\n   - Do NOT invent artificial domain\
      \ bounds (e.g., do not assume movie release years are `>= 1900` when historical\
      \ films date back to the 1880s/1890s; do not assume vote counts or identifiers\
      \ cannot be missing unless the code strictly crashes without them).\n4. Nullability\
      \ & Completeness:\n   - Only assume completeness (non-null) if null values cause\
      \ an unhandled runtime exception (e.g., `.astype(int)` directly on a series\
      \ with NaNs, or unhandled `int(val)` conversions).\n   - If missing values are\
      \ tolerated, dropped, or coerced, note that partial missingness is acceptable.\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
      \ }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks. Link each check\
