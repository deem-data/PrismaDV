      \ must maintain high completeness (e.g., at least 90-95%) because widespread\
      \ or injected nulls distort aggregations, rankings, and downstream exports.\n\
      2. Distinguish tolerance vs. silent logical corruption:\n   - Explicit allowed\
      \ sets and domain dictionaries: When the code defines an explicit domain set\
      \ or mapping dictionary (e.g., allowed_certificates, allowed_genres, cert_weights),\
