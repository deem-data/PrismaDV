  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'Both ''IMDB_Rating'' and ''No_of_Votes'' must be non-null and parsable
        as numeric values across all records, as both columns are simultaneously used
        to compute the Bayesian average ranking score `score = (v / (v + m)) * r +
        (m / (v + m)) * C`. Any missing or coerced NaN values in either column propagate
        into NaN ranking scores, disrupting sorting and subsequent card generation.
        We could represent this assumption as a Deequ constraint like: .satisfies("IMDB_Rating
        IS NOT NULL AND No_of_Votes IS NOT NULL", "rating_and_votes_completeness")'
      sources:
      - start_line: 19
        end_line: 30
        file: ''
      - start_line: 34
        end_line: 34
        file: ''
      uid: 6e07443d-e7fe-45fe-b304-07f0081c4327
    - text: 'Both ''No_of_Votes'' and ''IMDB_Rating'' are assumed to be non-negative
        values (''No_of_Votes >= 0'' and ''IMDB_Rating >= 0''). The Bayesian ranking
        score formula requires positive or non-negative vote counts `v` and ratings
        `r` to compute valid weighted scores and avoid division-by-zero or negative
        weights when combined with quantile threshold `m`. We could represent this
        assumption as a Deequ constraint like: .satisfies("No_of_Votes >= 0 AND IMDB_Rating
        >= 0", "non_negative_votes_and_rating")'
      sources:
      - start_line: 22
        end_line: 30
        file: ''
      uid: 54d53ff1-9744-49da-aaf4-fa452537ec50
  '["Poster_Link","Series_Title"]':
    code: []
    assumptions:
    - text: 'Both ''Series_Title'' and ''Poster_Link'' must be non-null and present
        together for every record so that each generated HTML card has a valid poster
        image link and corresponding title text without rendering broken images or
        invalid alt attributes. We could represent this assumption as a Deequ constraint
