        end_line: 19
        file: ''
      - start_line: 23
        end_line: 24
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      uid: 94121dba-883b-4aa0-8607-da6e9888257b
    - text: "The values in the 'IMDB_Rating' column are expected to fall within the\
        \ range of 0.0 to 10.0, as indicated by `star_fill_pct = max(0.0, min(100.0,\
        \ rating_val * 10.0))`, which assumes ratings are on a 10-point scale and\
        \ converts them into a 0\u2013100% fill percentage."
      sources:
