      uid: 7a8f367d-4c13-4e01-954b-bd203fbd1ae6
    - text: The 'IMDB_Rating' column should not be entirely null or empty, because
        `C = r.mean()` computes the average rating across the dataset to compute ranking
        scores. If all values are null or coerced to NaN, the calculation of `C` results
        in NaN, breaking the ranking computation.
