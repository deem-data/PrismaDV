prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport re\nimport json\nimport pandas as pd\nimport numpy as np\n\nparser\
  \ = argparse.ArgumentParser()\nparser.add_argument('--input', type=str, required=True)\n\
  parser.add_argument('--output', type=str, required=True)\nargs = parser.parse_args()\n\
  \ninput_csv = os.path.join(args.input, 'new_data.csv')\nos.makedirs(args.output,\
  \ exist_ok=True)\n\ndf = pd.read_csv(input_csv)\n\n# Basic dtype normalization used\
  \ by ranking and rendering\ndf['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'],\
  \ errors='coerce')\ndf['No_of_Votes'] = pd.to_numeric(df['No_of_Votes'], errors='coerce')\n\
  # Compute a weighted ranking using a Bayesian-style formula\nv = df['No_of_Votes']\n\
  r = df['IMDB_Rating']\nC = r.mean()\nm = float(v.quantile(0.60))\nif not np.isfinite(m)\
  \ or m <= 0:\n    m = 1000.0\n\nscore = (v / (v + m)) * r + (m / (v + m)) * C\n\
  df['ranking_score'] = score\n\n# Pick weekly featured titles\nTOP_N = 12\nfeatured\
  \ = df.sort_values(['ranking_score', 'IMDB_Rating', 'No_of_Votes'], ascending=[False,\
  \ False, False]).head(TOP_N).copy()\n# Parse runtime minutes for display and layout\n\
  featured['runtime_minutes'] = featured['Runtime'].str.extract(r'(\\d+)')[0].astype(int)\n\
  \n# Prepare rendering data\ndef slugify(text: str) -> str:\n    base = re.sub(r'[^a-zA-Z0-9]+',\
  \ '-', text.strip()).strip('-')\n    return base.lower()\n\ncards = []\nfor row\
  \ in featured.itertuples(index=False):\n    title = str(getattr(row, 'Series_Title'))\n\
  \    year = int(getattr(row, 'Released_Year')) if pd.notna(getattr(row, 'Released_Year'))\
  \ else None\n    poster = str(getattr(row, 'Poster_Link'))\n    runtime_min = int(getattr(row,\
  \ 'runtime_minutes'))\n    certificate = getattr(row, 'Certificate')\n    certificate_display\
  \ = 'NR' if pd.isna(certificate) or str(certificate).strip() == '' else str(certificate)\n\
  \    rating_val = float(getattr(row, 'IMDB_Rating'))\n    votes_val = int(getattr(row,\
  \ 'No_of_Votes'))\n    score_val = float(getattr(row, 'ranking_score'))\n    slug\
  \ = slugify(f\"{title}-{year}\")\n    star_fill_pct = max(0.0, min(100.0, rating_val\
  \ * 10.0))\n\n    cards.append({\n        'id': slug,\n        'title': title,\n\
  \        'year': year,\n        'poster': poster,\n        'runtime_minutes': runtime_min,\n\
  \        'certificate': certificate_display,\n        'imdb_rating': rating_val,\n\
  \        'votes': votes_val,\n        'score': score_val,\n        'genre': str(getattr(row,\
  \ 'Genre')),\n        'star_fill_pct': star_fill_pct\n    })\n\n# Render a simple\
  \ HTML page with cards\nstyle = \"\"\"\n  <style>\n    body { font-family: Arial,\
  \ sans-serif; margin: 0; padding: 20px; background: #0f1115; color: #e6e8eb; }\n\
  \    h1 { margin: 0 0 16px 0; font-size: 24px; }\n    .grid { display: grid; grid-template-columns:\
  \ repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }\n    .card { background: #171a21;\
  \ border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }\n\
  \    .poster { width: 100%; height: 360px; object-fit: cover; background: #0b0d12;\
  \ }\n    .content { padding: 12px; }\n    .title { font-weight: 600; font-size:\
  \ 15px; line-height: 1.25; margin: 0 0 4px 0; }\n    .meta { font-size: 12px; color:\
  \ #aab2bd; margin-bottom: 6px; }\n    .badge { display: inline-block; padding: 2px\
  \ 6px; border-radius: 4px; font-size: 11px; margin-right: 6px; background: #2a2f3a;\
  \ color: #c8d1dc; }\n    .rating { position: relative; display: inline-block; width:\
  \ 100px; height: 16px; background: #2a2f3a; border-radius: 8px; overflow: hidden;\
  \ vertical-align: middle; }\n    .rating-fill { position: absolute; left: 0; top:\
  \ 0; bottom: 0; background: linear-gradient(90deg, #ffd54f, #ffb300); }\n    .rating-text\
  \ { font-size: 12px; margin-left: 8px; color: #c8d1dc; }\n  </style>\n\"\"\"\n\n\
  cards_html_parts = []\nfor c in cards:\n    card_html = f\"\"\"\n      <div class=\\\
  \"card\\\" id=\\\"{c['id']}\\\">\n        <img class=\\\"poster\\\" src=\\\"{c['poster']}\\\
  \" alt=\\\"{c['title']} poster\\\"/>\n        <div class=\\\"content\\\">\n    \
  \      <div class=\\\"title\\\">{c['title']} ({c['year']})</div>\n          <div\
  \ class=\\\"meta\\\">{c['genre']}</div>\n          <span class=\\\"badge\\\">{c['runtime_minutes']}\
  \ min</span>\n          <span class=\\\"badge\\\">{c['certificate']}</span>\n  \
  \        <div style=\\\"margin-top:8px;\\\">\n            <div class=\\\"rating\\\
  \"><div class=\\\"rating-fill\\\" style=\\\"width:{c['star_fill_pct']}%;\\\"></div></div>\n\
  \            <span class=\\\"rating-text\\\">{c['imdb_rating']:.1f} • {c['votes']:,}\
  \ votes</span>\n          </div>\n        </div>\n      </div>\n    \"\"\"\n   \
  \ cards_html_parts.append(card_html)\n\nhtml = f\"\"\"\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <meta charset=\\\"utf-8\\\"/>\n    <meta name=\\\"viewport\\\" content=\\\
  \"width=device-width, initial-scale=1\\\"/>\n    <title>Weekly Featured Films</title>\n\
  \    {style}\n  </head>\n  <body>\n    <h1>Weekly Featured Films</h1>\n    <div\
  \ class=\\\"grid\\\">\n      {''.join(cards_html_parts)}\n    </div>\n  </body>\n\
  </html>\n\"\"\"\n\nwith open(os.path.join(args.output, 'featured_cards.html'), 'w',\
  \ encoding='utf-8') as f:\n    f.write(html)\n\nwith open(os.path.join(args.output,\
  \ 'featured_cards.json'), 'w', encoding='utf-8') as f:\n    json.dump({'generated_by':\
  \ 'curation_pipeline', 'count': len(cards), 'items': cards}, f, ensure_ascii=False,\
  \ indent=2)\n\n```\n\nThe same program is on disk at `./code/general_task_32.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 195, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BNzdmZTk4MTktZmExNi00OWEwLTgxZDctNTE4NWMwNjc1Nzg2XkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Doctor Zhivago', 'Released_Year': 1965, 'Certificate': 'A', 'Runtime':\
  \ '197 min', 'Genre': 'Drama, Romance, War', 'IMDB_Rating': 8.0, 'Overview': \"\
  The life of a Russian physician and poet who, although married to another, falls\
  \ in love with a political activist's wife and experiences hardship during World\
  \ War I and then the October Revolution.\", 'Meta_score': 69.0, 'Director': 'David\
  \ Lean', 'Star1': 'Omar Sharif', 'Star2': 'Julie Christie', 'Star3': 'Geraldine\
  \ Chaplin', 'Star4': 'Rod Steiger', 'No_of_Votes': 69903, 'Gross': '111,722,000'},\
  \ {'id': 356, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMmMzOWNhNTYtYmY0My00OGJiLWIzNDUtZWRhNGY0NWFjNzFmXkEyXkFqcGdeQXVyNjUxMDQ0MTg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Pâfekuto burû', 'Released_Year': 1997, 'Certificate': 'A', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Crime, Mystery', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'A pop singer gives up her career to become an actress, but she slowly goes insane\
  \ when she starts being stalked by an obsessed fan and what seems to be a ghost\
  \ of her past.', 'Meta_score': nan, 'Director': 'Satoshi Kon', 'Star1': 'Junko Iwao',\
  \ 'Star2': 'Rica Matsumoto', 'Star3': 'Shinpachi Tsuji', 'Star4': 'Masaaki Ôkura',\
  \ 'No_of_Votes': 58192, 'Gross': '776,665'}, {'id': 526, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMWU4N2FjNzYtNTVkNC00NzQ0LTg0MjAtYTJlMjFhNGUxZDFmXkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
