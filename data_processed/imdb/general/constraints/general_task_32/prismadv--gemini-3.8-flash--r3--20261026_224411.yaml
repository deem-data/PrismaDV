  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'Both ''IMDB_Rating'' and ''No_of_Votes'' should be non-null and valid
        numeric values across records, as both columns are jointly required to compute
        the Bayesian ranking score, used for tie-breaking in sorting, and directly
        cast to float and int without null handling. We could represent this assumption
        as a Deequ constraint like this: .satisfies("IMDB_Rating IS NOT NULL AND No_of_Votes
        IS NOT NULL", "imdb_rating_and_votes_not_null")'
      sources:
      - start_line: 19
        end_line: 30
        file: ''
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 51
        end_line: 52
        file: ''
      uid: c6d866de-a503-42bf-88b4-86cabe427de6
    - text: 'Both ''No_of_Votes'' and ''IMDB_Rating'' should be non-negative values
        (No_of_Votes >= 0 and IMDB_Rating >= 0) because negative vote counts or ratings
        would invalidate the Bayesian formula (v / (v + m)) * r + (m / (v + m)) *
        C and the calculation of star fill percentages. We could represent this assumption
        as a Deequ constraint like this: .satisfies("No_of_Votes >= 0 AND IMDB_Rating
        >= 0", "votes_and_rating_non_negative")'
      sources:
      - start_line: 22
        end_line: 30
        file: ''
      - start_line: 51
        end_line: 55
        file: ''
      uid: 891e7c85-c0b9-4fb9-b79a-be391484ebe6
  '["Poster_Link","Series_Title"]':
    code:
    - suggestion: .satisfies('Series_Title IS NOT NULL AND Poster_Link IS NOT NULL
        AND LENGTH(TRIM(Series_Title)) > 0 AND LENGTH(TRIM(Poster_Link)) > 0', 'Series_Title_and_Poster_Link_non_empty')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 71a4b0f5-def9-4d83-929a-18b8083229e7
      source_assumptions:
      - 2758a923-5fc5-42b0-b252-b2e5ff9a8425
    assumptions:
    - text: 'Both ''Series_Title'' and ''Poster_Link'' must be non-null and non-empty
        strings across all records. In the card rendering pipeline, ''Poster_Link''
        is injected directly into the ''src'' attribute and ''Series_Title'' is injected
        into the ''alt'' attribute of the image tag (<img class="poster" src="{c[''poster'']}"
        alt="{c[''title'']} poster"/>), so missing or empty values in either column
        result in broken card assets. We could represent this assumption as a Deequ
        constraint like this: .satisfies("Series_Title IS NOT NULL AND Poster_Link
        IS NOT NULL AND LENGTH(TRIM(Series_Title)) > 0 AND LENGTH(TRIM(Poster_Link))
        > 0", "Series_Title_and_Poster_Link_non_empty")'
      sources:
      - start_line: 44
        end_line: 61
        file: ''
      - start_line: 90
        end_line: 93
        file: ''
      uid: 2758a923-5fc5-42b0-b252-b2e5ff9a8425
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
