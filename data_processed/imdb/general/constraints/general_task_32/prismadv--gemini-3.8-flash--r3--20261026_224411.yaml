    - text: 'The ''No_of_Votes'' column values should be non-negative (>= 0), as vote
        counts cannot be negative and are used in computing a weighted ranking score
        formula and displayed to users. We could represent this assumption as a deequ
        constraint like this: .satisfies("`No_of_Votes` >= 0", "Non-negative vote
