  IMDB_Rating:
    code:
    - suggestion: '.hasCompleteness(''IMDB_Rating'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7280feb2-fa9c-47a3-b3aa-3d3b2982f533
      source_assumptions:
      - ebd6a866-f056-4ffd-885b-feb9599d907e
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'IMDB_Rating
        Range [0, 10]')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a3aa5f69-c350-4f1f-ae9c-6376d58766f6
      source_assumptions:
      - 03898373-df68-48ba-913c-5b40e42d2d9e
    assumptions:
    - text: 'The ''IMDB_Rating'' column is expected to contain numeric values and
        should not be entirely null, as the code calculates its mean `C = r.mean()`
        to use as a baseline prior in the Bayesian ranking calculation. If all values
        are null or non-numeric, the mean would be NaN, invalidating the ranking score.

        We could represent this assumption as a deequ constraint like this:

        .hasCompleteness(''IMDB_Rating'', lambda x: x > 0)

        '
      sources:
      - start_line: 19
        end_line: 19
        file: ''
      - start_line: 23
        end_line: 24
        file: ''
      - start_line: 29
        end_line: 29
        file: ''
      uid: ebd6a866-f056-4ffd-885b-feb9599d907e
    - text: 'The ''IMDB_Rating'' column values are expected to be on a 0 to 10 rating
        scale, as line 55 computes `star_fill_pct = max(0.0, min(100.0, rating_val
        * 10.0))` by multiplying the rating value by 10 to yield a percentage fill
        out of 100%.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10 THEN 1 ELSE
        0 END", "IMDB_Rating Range [0, 10]", lambda x: x == 1.0)

        '
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      - start_line: 55
        end_line: 55
        file: ''
      uid: 03898373-df68-48ba-913c-5b40e42d2d9e
