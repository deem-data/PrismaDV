    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across records in the dataset to ensure unique slug identifiers (''id'') for
        the cards and valid unique HTML element IDs. We could represent this assumption
        as a Deequ constraint like this: .isUnique(["Series_Title", "Released_Year"])'
      sources:
      - start_line: 44
        end_line: 58
        file: ''
      - start_line: 91
