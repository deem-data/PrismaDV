    - text: 'The ''Runtime'' column should not contain null values because the code
        extracts digits from ''Runtime'' and immediately casts the result to integer
        using `.astype(int)`. If null values are present in the selected rows, `.str.extract`
        produces NaN, causing `.astype(int)` to raise a ValueError: Cannot convert
        non-finite values (NA or inf) to integer.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      uid: ee70006b-791f-4693-aeef-5233a6163641
    - text: 'The ''Runtime'' column values must contain numeric digits matching the
        regex pattern ''\d+'' because the code executes `.str.extract(r''(\d+)'')[0].astype(int)`.
        If any value fails to match and extract digits, it will yield NaN, leading
        to a conversion failure during `.astype(int)`.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", ".*\\d+.*")'
      sources:
      - start_line: 36
        end_line: 36
        file: ''
      uid: 04089a3d-2405-41a2-a840-cef35e51d65b
