        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      uid: c2a0e846-9287-43a7-b1a4-5ca6ee57b2d6
    - text: 'The ''No_of_Votes'' column should be of numeric or integral data type,
        as it represents a count of votes, undergoes numeric computations such as
        quantile calculation and Bayesian weighted ranking, and is explicitly cast
        to an integer using int(). We could represent this assumption as a deequ constraint
        like this: .hasDataType("No_of_Votes", ConstrainableDataTypes.Integral)'
