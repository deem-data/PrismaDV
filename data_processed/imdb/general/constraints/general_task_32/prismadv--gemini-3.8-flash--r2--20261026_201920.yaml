    assumptions:
    - text: 'Both ''IMDB_Rating'' and ''No_of_Votes'' must be non-null and valid numeric
        values. They are jointly used to compute the Bayesian ranking score `ranking_score
        = (v / (v + m)) * r + (m / (v + m)) * C`, sorted together with ranking score
        to extract top featured rows, and subsequently cast to float and int respectively
        (e.g., `int(getattr(row, ''No_of_Votes''))`), which would raise a ValueError
        if either is NaN. We could represent this assumption as a Deequ constraint
        like: .satisfies("IMDB_Rating IS NOT NULL AND No_of_Votes IS NOT NULL", "IMDB_Rating
        and No_of_Votes must be non-null")'
      sources:
      - start_line: 19
        end_line: 30
        file: ''
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 51
        end_line: 52
        file: ''
      uid: 211b0e39-9971-4345-ac80-61ef31a658eb
    - text: 'Both ''No_of_Votes'' and ''IMDB_Rating'' are expected to be non-negative
        values (i.e., ''No_of_Votes >= 0'' and ''IMDB_Rating >= 0''), ensuring valid
        weights and ratings when computing the Bayesian ranking score `(v / (v + m))
        * r + (m / (v + m)) * C`. We could represent this assumption as a Deequ constraint
        like: .satisfies("No_of_Votes >= 0 AND IMDB_Rating >= 0", "Votes and rating
        must be non-negative")'
      sources:
      - start_line: 22
        end_line: 30
        file: ''
      uid: e74db2a6-c20c-4940-aa21-dbcfae06a630
