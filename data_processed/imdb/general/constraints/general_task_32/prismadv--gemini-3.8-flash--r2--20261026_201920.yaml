    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values or strings convertible
        to numbers (float/fractional), as it is coerced to numeric using pd.to_numeric
        and used in mathematical calculations like mean and weighted ranking score.
        We could represent this assumption as a deequ constraint like this: .isDataType(''IMDB_Rating'',
        ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 19
        end_line: 24
        file: ''
      - start_line: 51
        end_line: 51
        file: ''
      uid: 72a354d6-eed5-490c-a2b3-ede19d758b63
    - text: 'The ''IMDB_Rating'' column should not be completely null, as calculating
        the overall mean rating (C = r.mean()) requires at least one non-null numeric
        value to avoid producing NaN ranking scores. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `IMDB_Rating` IS NOT
        NULL THEN 1 ELSE 0 END", "Non-empty IMDB_Rating", lambda x: x > 0)'
      sources:
      - start_line: 19
        end_line: 24
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      uid: 4fc60de2-200e-4a73-8410-ffeefab58e68
    - text: 'The ''IMDB_Rating'' column values should fall within a standard rating
        range between 0.0 and 10.0, as indicated by calculating star fill percentage
        via rating_val * 10.0 bounded by 0.0 and 100.0. We could represent this assumption
        as a deequ constraint like this: .satisfies("CASE WHEN `IMDB_Rating` >= 0.0
        AND `IMDB_Rating` <= 10.0 THEN 1 ELSE 0 END", "Valid Rating Range", lambda
        x: x == 1)'
      sources:
      - start_line: 51
        end_line: 55
        file: ''
      uid: 29a802bc-a713-4481-9db4-1adcd5f65ef0
