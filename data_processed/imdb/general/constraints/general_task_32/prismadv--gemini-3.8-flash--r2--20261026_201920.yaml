    - suggestion: .satisfies('`No_of_Votes` >= 0 AND `IMDB_Rating` >= 0', 'Votes and
        rating must be non-negative')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d564e500-8fe3-4ae0-8b45-f679deb54342
      source_assumptions:
