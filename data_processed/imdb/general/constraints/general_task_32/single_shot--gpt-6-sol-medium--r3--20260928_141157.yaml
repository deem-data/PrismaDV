constraints:
  Genre:
    code:
    - - .isComplete('Genre').satisfies('LENGTH(TRIM(Genre)) > 0', 'nonblank_genre')
      - Valid
    assumptions: []
    column_name: Genre
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating').satisfies('IMDB_Rating >= 0 AND IMDB_Rating <=
        10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes').isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link').satisfies("Poster_Link RLIKE '^https?://[^[:space:]]+$'",
        'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year').satisfies('Released_Year >= 1888 AND Released_Year
        <= 2100', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime').satisfies("Runtime RLIKE '^[0-9]+ min$'", 'parseable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title').satisfies("LENGTH(TRIM(Series_Title)) > 0", 'nonblank_title')
      - Valid
    assumptions: []
    column_name: Series_Title
  __dataset__:
    code:
    - - '.hasSize(lambda size: size >= 12)'
      - Valid
    assumptions: []
    column_name: __dataset__
