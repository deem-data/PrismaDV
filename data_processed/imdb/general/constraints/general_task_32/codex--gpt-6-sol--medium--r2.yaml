  \ 'The story of how George Jung, along with the Medellín Cartel headed by Pablo\
  \ Escobar, established the American cocaine market in the 1970s in the United States.',\
  \ 'Meta_score': 52.0, 'Director': 'Ted Demme', 'Star1': 'Johnny Depp', 'Star2':\
