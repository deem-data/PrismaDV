      uid: 10d3a4af-9ec9-4375-adb8-19af921f54d2
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7b642252-57ee-44db-9c13-9e34cdbc057d
      source_assumptions:
      - 2a54bd2e-460b-46ec-92fe-c636c2a77b37
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across records to ensure that generated identifiers and HTML element IDs (slugs)
        are distinct and unambiguous. This can be expressed as a Deequ uniqueness
        constraint: .isUnique([''Series_Title'', ''Released_Year'']).'
      sources:
      - start_line: 45
        end_line: 58
        file: ''
      - start_line: 91
        end_line: 95
        file: ''
      uid: 2a54bd2e-460b-46ec-92fe-c636c2a77b37
