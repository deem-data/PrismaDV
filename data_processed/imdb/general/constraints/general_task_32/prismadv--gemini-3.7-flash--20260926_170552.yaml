constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b1a26b89-3cbc-4d46-9c6e-529f6d9a4060
      source_assumptions:
      - 757ffaca-0a50-4973-a2ed-99f1b714bf0d
    assumptions:
    - text: 'The ''Certificate'' column can contain null or empty string values because
        the code explicitly handles them by defaulting missing values or whitespace-only
        strings to ''NR''. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN `Certificate` IS NOT NULL THEN 1 ELSE 0 END",
        "Certificate completeness", lambda x: x >= 0.0)'
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: 757ffaca-0a50-4973-a2ed-99f1b714bf0d
  Genre:
    code:
    - suggestion: .isComplete('Genre')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: af962da0-6d9e-49fb-aec3-a99b748cb432
      source_assumptions:
      - 974eaaef-4cd3-4224-8c6a-fc61a11e3ceb
    - suggestion: .hasDataType('Genre', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4f7b25ce-08b5-4303-a807-e7d0daca3a6e
      source_assumptions:
      - 974eaaef-4cd3-4224-8c6a-fc61a11e3ceb
    assumptions:
    - text: 'The ''Genre'' column should not contain null values and should be of
        string type, as the code directly extracts and casts the column to string
        using `str(getattr(row, ''Genre''))` and renders it into the HTML metadata
        display without fallback handling for missing values (unlike other fields
        such as ''Certificate'').

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Genre")'
      sources:
      - start_line: 67
        end_line: 67
        file: ''
      - start_line: 96
        end_line: 96
        file: ''
      uid: 974eaaef-4cd3-4224-8c6a-fc61a11e3ceb
  IMDB_Rating:
    code:
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e079a053-1d25-45df-acc7-c13974457de0
      source_assumptions:
      - 48b59fa1-62bc-4538-8977-232f9c81fbe8
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'IMDB_Rating
        Range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5b86c897-fd85-4364-aadb-e15dabb5a4da
      source_assumptions:
      - cced1ee2-07cf-43cc-a9e5-b4ca06d92f00
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric or coercible-to-numeric
        values, and must have non-null values so that the mean rating can be computed
        for the Bayesian ranking calculation. We could represent this assumption as
        a deequ constraint like this: .isComplete(''IMDB_Rating'') or .satisfies(''CASE
        WHEN TRY_CAST(`IMDB_Rating` AS DOUBLE) IS NOT NULL THEN 1 ELSE 0 END'', ''Valid
        Numeric IMDB_Rating'', lambda x: x > 0)'
      sources:
      - start_line: 19
        end_line: 24
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      uid: 48b59fa1-62bc-4538-8977-232f9c81fbe8
    - text: 'The ''IMDB_Rating'' column is expected to have values within the standard
        movie rating range (typically between 0 and 10), as star fill percentages
        are calculated using `rating_val * 10.0`. We could represent this assumption
        as a deequ constraint like this: .satisfies(''CASE WHEN `IMDB_Rating` >= 0
        AND `IMDB_Rating` <= 10 THEN 1 ELSE 0 END'', ''IMDB_Rating Range'', lambda
        x: x == 1)'
      sources:
      - start_line: 51
        end_line: 56
        file: ''
      uid: cced1ee2-07cf-43cc-a9e5-b4ca06d92f00
  No_of_Votes:
    code:
    - suggestion: .isComplete('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d928b72c-e1f0-4ec9-ac7d-2af2cc8d43f3
      source_assumptions:
      - ec2ee3f9-9ac5-4492-ac3b-4eee6ef3a04e
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a0a253fa-9425-4aff-ab90-e6a7748e2053
      source_assumptions:
      - c12f1576-61b4-4fde-a40f-1d6ec241a949
    assumptions:
    - text: 'The ''No_of_Votes'' column should not contain null or unparseable values
        because `int(getattr(row, ''No_of_Votes''))` is directly called on top rows
        without null handling, which raises a ValueError if any value is NaN. We could
        represent this assumption as a deequ constraint like this: .isComplete(''No_of_Votes'')'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      uid: ec2ee3f9-9ac5-4492-ac3b-4eee6ef3a04e
    - text: 'The ''No_of_Votes'' column should contain non-negative numeric/integral
        values as it represents vote counts used in quantile calculation, Bayesian
        weighted rating score computation, and integer formatting. We could represent
        this assumption as a deequ constraint like this: .satisfies(''`No_of_Votes`
        >= 0'', ''Non-negative No_of_Votes'', lambda x: x == 1.0)'
      sources:
      - start_line: 20
        end_line: 30
        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      - start_line: 101
        end_line: 101
        file: ''
      uid: c12f1576-61b4-4fde-a40f-1d6ec241a949
  Poster_Link:
    code:
    - suggestion: .isComplete('Poster_Link')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4a9be42b-ba2a-47bb-913b-bc0c3573feb3
      source_assumptions:
      - 1a8f98d6-2701-4cd5-b509-52d5bf66b221
    assumptions:
    - text: 'The ''Poster_Link'' column should be present in the dataset and contain
        non-null string values representing image URLs to be rendered directly into
        HTML card image tags and serialized to JSON.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Poster_Link")'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      - start_line: 57
        end_line: 61
        file: ''
      - start_line: 90
        end_line: 93
        file: ''
      uid: 1a8f98d6-2701-4cd5-b509-52d5bf66b221
  Released_Year:
    code:
    - suggestion: .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b82cbfbd-e497-412b-a94e-2b8e66b8d499
      source_assumptions:
      - ed4d72d4-9ae2-46fa-84ad-7b877cb738d7
    assumptions:
    - text: The 'Released_Year' column can contain null values because the code explicitly
        checks `pd.notna(getattr(row, 'Released_Year'))` before processing. When not
        null, the values must be convertible to integers (integral type), as `int(getattr(row,
        'Released_Year'))` is called.
      sources:
      - start_line: 46
        end_line: 46
        file: ''
      uid: ed4d72d4-9ae2-46fa-84ad-7b877cb738d7
  Runtime:
    code:
    - suggestion: '.satisfies("CASE WHEN `Runtime` IS NOT NULL AND `Runtime` RLIKE
        ''.*[0-9]+.*'' THEN 1 ELSE 0 END", "Runtime contains digits", lambda x: x
        == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 495e4ca1-91b1-4a55-8314-cf6faddb137c
      source_assumptions:
      - 3f6fae36-9160-49d0-b15c-d5867e10f5ed
    assumptions:
    - text: 'The ''Runtime'' column should not be null and must contain at least one
        sequence of digits (e.g. matching regex ''\d+''), because the code extracts
        digits using `featured[''Runtime''].str.extract(r''(\d+)'')[0].astype(int)`
        and converts them directly to integer without handling nulls or non-matching
        values. If any extracted value is null or missing digits, `.astype(int)` will
        raise a ValueError. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN `Runtime` IS NOT NULL AND `Runtime` RLIKE
        ''.*[0-9]+.*'' THEN 1 ELSE 0 END", "Runtime contains digits", lambda x: x
        == 1.0)'
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      - start_line: 48
        end_line: 48
        file: ''
      uid: 3f6fae36-9160-49d0-b15c-d5867e10f5ed
  Series_Title:
    code:
    - suggestion: .isComplete('Series_Title')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 80018522-519b-4174-9bef-f103737b9d3e
      source_assumptions:
      - 0a4c1036-b199-4a24-bb54-6584a1360b1c
    assumptions:
    - text: 'The ''Series_Title'' column should not contain null values, as movie
        and series titles are expected to be present to generate valid card identifiers/slugs
        and to display the title on the rendered HTML cards.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Series_Title")'
      sources:
      - start_line: 44
        end_line: 45
        file: ''
      - start_line: 54
        end_line: 59
        file: ''
      - start_line: 93
        end_line: 95
        file: ''
      uid: 0a4c1036-b199-4a24-bb54-6584a1360b1c
  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: Both 'IMDB_Rating' and 'No_of_Votes' should be non-null numeric values
        where 'No_of_Votes' is non-negative and 'IMDB_Rating' is between 0.0 and 10.0,
        because they are used together to compute a Bayesian-style ranking score and
        subsequently cast to float and int when building the featured cards.
      sources:
      - start_line: 19
        end_line: 30
        file: ''
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 51
        end_line: 53
