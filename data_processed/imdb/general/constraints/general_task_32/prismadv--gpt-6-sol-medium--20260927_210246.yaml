        end_line: 50
        file: ''
      - start_line: 57
        end_line: 63
        file: ''
      uid: c7d11781-c5dc-49bf-bdf5-297b360711fc
    - text: "Non-null, non-blank 'Certificate' values should be safe to insert directly\
        \ into HTML text\u2014for example, they should not contain HTML tags or markup.\
