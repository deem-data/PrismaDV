      \ values. Do NOT assume 100% completeness or strict unyielding types. State\
      \ that the column should have high completeness (e.g., >= 85-90%) rather than\
      \ perfect completeness.\n   - Semantic requirement: If a column serves as a\
      \ key (e.g., 'Series_Title' combined with 'Released_Year' for indexing or dict\
      \ mapping), assume uniqueness or high distinctness is required to avoid losing\
      \ title records. If a column represents URLs (e.g., 'Poster_Link'), assume values\
      \ must conform to valid URL structure for downstream licensing/display.\n3.\
      \ Dataset-specific domain patterns (IMDB / Media datasets):\n   - 'Poster_Link':\
