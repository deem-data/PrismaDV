    assumptions:
    - text: 'The ''Genre'' column should exist in the dataset and have a string data
        type, as it is accessed directly as an attribute from the rows and rendered
        in HTML cards and JSON output. We could represent this assumption as a deequ
        constraint like this: .isDataType(''Genre'', ConstrainableDataTypes.String)'
      sources:
      - start_line: 44
        end_line: 70
        file: ''
      uid: d05334af-7d79-4309-a14b-f84cd43b5863
    - text: 'The ''Genre'' column should not contain null values, as it is directly
        converted to a string without null-handling (unlike other columns such as
        Certificate or Released_Year) to display on the featured film cards. We could
        represent this assumption as a deequ constraint like this: .isComplete(''Genre'')'
      sources:
