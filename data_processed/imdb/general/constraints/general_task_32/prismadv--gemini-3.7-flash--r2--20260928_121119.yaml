  IMDB_Rating:
    code:
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7c4d0f27-1410-4db4-ba88-e805e4799891
      source_assumptions:
      - d1bc9342-693c-41f4-896f-3e0312dee2fa
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'IMDB_Rating
        within [0, 10]')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ce3f7b9f-6841-4a69-bb0c-bac9bc2601ad
      source_assumptions:
      - ba7d0e16-b9be-4484-b688-5851fd0d48eb
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values (or values convertible
        to float) and should not be completely null, as the code converts the column
        to numeric and computes its mean (`C = r.mean()`). We could represent this
        assumption as a deequ constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 19
        end_line: 24
        file: ''
      uid: d1bc9342-693c-41f4-896f-3e0312dee2fa
    - text: 'The ''IMDB_Rating'' column values are expected to be valid ratings within
        the range of 0.0 to 10.0, as the code computes a star fill percentage by multiplying
        the rating value by 10 (`rating_val * 10.0`) bounded between 0.0 and 100.0.
        We could represent this assumption as a deequ constraint like this: .satisfies(''`IMDB_Rating`
        >= 0.0 AND `IMDB_Rating` <= 10.0'', ''IMDB_Rating within [0, 10]'', lambda
        x: x == 1.0)'
      sources:
      - start_line: 51
        end_line: 55
        file: ''
      uid: ba7d0e16-b9be-4484-b688-5851fd0d48eb
  No_of_Votes:
