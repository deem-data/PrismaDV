    assumptions:
    - text: 'The ''Runtime'' column must not contain null values, because the code
        performs .str.extract(r''(\d+)'')[0].astype(int) without handling NaNs, which
        will raise an error if any values are null or missing. We could represent
        this assumption as a deequ constraint like this: .isComplete(''Runtime'')'
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      uid: 38c3131f-1c00-4912-b0ab-7f121abf45bf
    - text: 'The ''Runtime'' column values must contain one or more numeric digits
        (e.g., matching the regex pattern ''.*\d+.*''), because the code extracts
        digits using .str.extract(r''(\d+)'') and casts them directly to integer using
        .astype(int). If a value does not contain any digits, the extraction will
        yield NaN and fail during integer casting. We could represent this assumption
        as a deequ constraint like this: .hasPattern(''Runtime'', ''.*\\d+.*'', lambda
        x: x == 1.0)'
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      uid: 08eee0d4-f9c3-43b7-b4b1-6f44b223f2a2
