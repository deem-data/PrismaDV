  Released_Year:
    code:
    - suggestion: '.satisfies("CASE WHEN `Released_Year` IS NULL OR `Released_Year`
        RLIKE ''^-?[0-9]+$'' THEN 1 ELSE 0 END", "Released_Year Integer Conversion",
