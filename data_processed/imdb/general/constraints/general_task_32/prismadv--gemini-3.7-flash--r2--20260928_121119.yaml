        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Released_Year` IS NULL THEN 1 ELSE 0 END", "Released_Year
        Can Be Null", lambda x: x >= 0)'
      sources:
      - start_line: 46
        end_line: 46
        file: ''
      uid: 1e01bfc7-4160-414a-959c-fcf424c39dbc
    - text: 'When ''Released_Year'' is present (not null), it should be convertible
        to an integer, as the code directly calls `int(...)` on non-null values without
