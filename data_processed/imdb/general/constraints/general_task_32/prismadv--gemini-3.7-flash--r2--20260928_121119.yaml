  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: Both 'IMDB_Rating' and 'No_of_Votes' columns must be non-null and contain
        valid numeric values, as they are used together to calculate the weighted
        Bayesian ranking score and are subsequently cast using float() and int() during
        record iteration. Missing or unparseable values would result in NaN scores
        and cause type conversion errors (e.g., int(np.nan)).
      sources:
      - start_line: 19
        end_line: 30
        file: ''
      - start_line: 51
        end_line: 53
        file: ''
      uid: 8cf23d5d-37da-4dc4-9f80-a743db10d8d3
    - text: Both 'IMDB_Rating' and 'No_of_Votes' should be non-negative numeric values
        (with 'IMDB_Rating' typically between 0 and 10, and 'No_of_Votes' >= 0), so
        that the Bayesian score formula '(v / (v + m)) * r + (m / (v + m)) * C' computes
        a valid, meaningful rating.
      sources:
      - start_line: 22
        end_line: 30
        file: ''
      uid: 042f4964-79a3-4cac-acf0-d0d708c3892c
