  instructions:
    dataflow_inspector: "Analyze the code script and list every line that touches\
      \ the target column:\n1. Exact string and identifier matches: Look for the target\
      \ column name as a string literal (e.g., 'col', \"col\") or attribute (.col)\
      \ across all occurrences:\n   - Data loading and column lists (e.g., read_csv(...,\
      \ usecols=[...]), out_cols = [...], shortlist_cols = [...], to_csv(..., columns=[...])).\n\
      \   - Index definitions (set_index), subset selections, and column presence\
