      \ constraints never reject a partition; if all checks are \"warning\", the suite\
      \ cannot catch any erroneous partition.\n  - Set level to \"error\" if violation\
      \ would cause an unhandled crash OR silently produce corrupt downstream output\
      \ (e.g., invalid data types, missing required columns in output exports, or\
      \ violating mathematical domains).\n  - Set level to \"warning\" ONLY when deviations\
      \ are safely absorbed by the code (e.g., via `errors='coerce'`, `fillna`, clipping,\
      \ or tolerant sorting) without corrupting downstream results.\n- Completeness\
