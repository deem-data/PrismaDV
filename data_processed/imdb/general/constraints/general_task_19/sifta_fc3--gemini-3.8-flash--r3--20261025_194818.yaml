      \ `.astype(float)`, `.astype(int)` without coercion), arithmetic operations,\
      \ mathematical functions (e.g., log, division), string methods without null\
      \ checks, or `verify_integrity=True` require strict types, valid numeric domains,\
      \ or uniqueness.\n   - Tolerant operations: Operations like `pd.to_numeric(...,\
      \ errors='coerce')`, `.fillna()`, `dropna()`, or `.sort_values()` explicitly\
      \ tolerate missing, unparseable, or out-of-order values. Do NOT assume strict\
      \ completeness or narrow formatting if the code safely absorbs deviations.\n\
      2. Robust code inspection:\n   - Examine the entire provided code context. If\
      \ a line marker (`-**->`) points to a line that does not mention the target\
      \ column directly due to line offset, locate where the target column is actually\
      \ referenced (e.g., in column lists, feature definitions, pass-through exports).\
      \ Never output an empty assumption list if the target column is referenced in\
      \ the script or belongs to the input dataset.\n3. Respect column profile statistics:\n\
      \   - Check `completeness`: If the observed completeness in `target_column_desc`\
      \ is < 1.0, or if missing values are filled/coerced, NEVER assume the column\
      \ is 100% complete.\n   - Distinguish column presence from column completeness.\
      \ Requiring a column to exist in the DataFrame does NOT mean every row must\
      \ be non-null.\n   - Check `dataType`: Do not assume integer types if the column\
      \ has nulls or fractional values; assume general numeric compatibility unless\
      \ strictly required.\n4. Focus on failure modes that matter:\n   - Formulate\
      \ assumptions for conditions whose violation would crash the code (unhandled\
      \ exceptions) OR silently produce corrupt outputs (e.g., invalid data types\
      \ written to output files, inverted scores, negative values in log transforms).\n\
      \   - For pass-through or exported columns, capture their core contract: basic\
