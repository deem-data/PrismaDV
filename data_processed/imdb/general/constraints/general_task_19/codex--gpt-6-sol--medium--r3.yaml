prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nfrom datetime import datetime\nimport numpy as np\nimport pandas as pd\n\
  \n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_file = os.path.join(args.input, 'new_data.csv')\n\
  \    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\
  \n    # Basic type normalization for downstream logic\n    df['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'],\
  \ errors='coerce')\n    df['Released_Year'] = pd.to_numeric(df['Released_Year'],\
  \ errors='coerce').astype('Int64')\n    df['No_of_Votes'] = pd.to_numeric(df['No_of_Votes'],\
  \ errors='coerce').fillna(0).astype(int)\n\n    current_year = datetime.now().year\n\
  \n    allowed_genres = {\n        'Action', 'Adventure', 'Animation', 'Biography',\
  \ 'Comedy', 'Crime', 'Documentary', 'Drama', 'Family',\n        'Fantasy', 'Film-Noir',\
  \ 'History', 'Horror', 'Music', 'Musical', 'Mystery', 'Romance', 'Sci-Fi', 'Sport',\n\
  \        'Thriller', 'War', 'Western'\n    }\n    allowed_certificates = {\n   \
  \     'U', 'UA', 'A', 'G', 'PG', 'PG-13', 'R', 'NC-17', 'Not Rated', 'Unrated',\
  \ 'Passed', 'Approved'\n    }\n    # Use the unique key as index for deterministic\
  \ scoring and dedupe safety\n    df = df.set_index(['Series_Title', 'Released_Year'],\
  \ verify_integrity=True)\n    # Quality component derived from rating; relies on\
  \ bounded rating to keep scores in [0,1]\n    rating_score = (df['IMDB_Rating']\
  \ / 10.0).clip(0, 1)\n\n    # Popularity component (log-scaled votes); calibrated\
  \ assuming high-rated entries have strong vote counts\n    votes_log = np.log10(df['No_of_Votes'].clip(lower=1))\n\
  \    pop_score = ((votes_log - 3.0) / (6.0 - 3.0)).clip(0, 1)  # 1k->0, 1M->1\n\
  \    # Freshness factor decaying after ~30 years\n    age_years = (current_year\
  \ - df.reset_index()['Released_Year']).astype(float)\n    freshness = (1.0 - (age_years\
  \ / 30.0)).clip(0, 1).values\n    # Parse runtime minutes for engagement modeling\n\
  \    runtime_min = df['Runtime'].str.extract(r'(\\d+)', expand=False).astype(int)\n\
  \n    runtime_diff = (runtime_min - 110).astype(float)\n    engagement = np.exp(-((runtime_diff\
  \ / 50.0) ** 2))\n\n    genre_weights = {\n        'Action': 1.1, 'Adventure': 1.05,\
  \ 'Animation': 1.05, 'Biography': 1.0, 'Comedy': 1.0, 'Crime': 1.05,\n        'Documentary':\
  \ 0.85, 'Drama': 1.1, 'Family': 1.05, 'Fantasy': 1.0, 'Film-Noir': 1.0, 'History':\
  \ 0.95,\n        'Horror': 0.85, 'Music': 0.95, 'Musical': 0.90, 'Mystery': 1.0,\
  \ 'Romance': 0.95, 'Sci-Fi': 1.0,\n        'Sport': 0.95, 'Thriller': 1.05, 'War':\
  \ 0.90, 'Western': 0.85\n    }\n\n    def avg_genre_weight(genre_str: str) -> float:\n\
  \        parts = [p.strip() for p in str(genre_str).split(',') if p.strip()]\n \
  \       weights = [genre_weights.get(p, 1.0) for p in parts]\n        if not weights:\n\
  \            return 1.0\n        return float(np.mean(weights))\n\n    genre_pref\
  \ = df['Genre'].map(avg_genre_weight)\n\n    cert_weights = {\n        'U': 1.10,\
  \ 'G': 1.10, 'PG': 1.05, 'PG-13': 1.00, 'UA': 1.00, 'Passed': 0.95, 'Approved':\
  \ 0.95,\n        'Not Rated': 0.95, 'Unrated': 0.90, 'R': 0.80, 'A': 0.75, 'NC-17':\
  \ 0.00\n    }\n    cert_series = df['Certificate'].fillna('Not Rated').astype(str)\n\
  \    suitability = cert_series.map(cert_weights).fillna(0.90)\n\n    # Content suitability\
  \ gating (e.g., avoid NC-17 for licensing)\n    eligible_mask = suitability > 0.0\n\
  \n    # Combine signals into recommendation score\n    # The weighting structure\
  \ assumes all upstream fields adhere to the asserted contracts\n    combined_score\
  \ = (\n        (0.55 * rating_score + 0.45 * pop_score)\n        * (0.6 + 0.4 *\
  \ freshness)\n        * (0.6 + 0.4 * engagement)\n        * (0.85 + 0.15 * genre_pref)\n\
  \        * suitability\n    )\n\n    rec = df.copy()\n    rec['rating_score'] =\
  \ rating_score\n    rec['pop_score'] = pop_score\n    rec['freshness'] = freshness\n\
  \    rec['engagement'] = engagement\n    rec['genre_pref'] = genre_pref\n    rec['suitability']\
  \ = suitability\n    rec['priority_score'] = combined_score\n\n    # Apply eligibility\
  \ filter and minimum quality threshold for licensing\n    quality_gate = rec['IMDB_Rating']\
  \ >= 6.5\n    final = rec[eligible_mask & quality_gate].sort_values('priority_score',\
  \ ascending=False)\n\n    # Persist results\n    out_cols = [\n        'Poster_Link',\
  \ 'Certificate', 'Runtime', 'Genre', 'IMDB_Rating', 'No_of_Votes',\n        'Meta_score',\
  \ 'Director', 'Star1', 'Star2', 'Star3', 'Star4', 'Gross',\n        'rating_score',\
  \ 'pop_score', 'freshness', 'engagement', 'genre_pref', 'suitability', 'priority_score'\n\
  \    ]\n    # Keep only columns that exist in the input plus derived metrics\n \
  \   out_cols = [c for c in out_cols if c in final.columns]\n\n    output_file =\
  \ os.path.join(args.output, 'licensing_recommendations.csv')\n    final.reset_index().to_csv(output_file,\
  \ index=False, columns=['Series_Title', 'Released_Year'] + out_cols)\n\n\nif __name__\
  \ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at `./code/general_task_19.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 195, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BNzdmZTk4MTktZmExNi00OWEwLTgxZDctNTE4NWMwNjc1Nzg2XkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Doctor Zhivago', 'Released_Year': 1965, 'Certificate': 'A', 'Runtime':\
  \ '197 min', 'Genre': 'Drama, Romance, War', 'IMDB_Rating': 8.0, 'Overview': \"\
  The life of a Russian physician and poet who, although married to another, falls\
  \ in love with a political activist's wife and experiences hardship during World\
  \ War I and then the October Revolution.\", 'Meta_score': 69.0, 'Director': 'David\
  \ Lean', 'Star1': 'Omar Sharif', 'Star2': 'Julie Christie', 'Star3': 'Geraldine\
  \ Chaplin', 'Star4': 'Rod Steiger', 'No_of_Votes': 69903, 'Gross': '111,722,000'},\
  \ {'id': 356, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMmMzOWNhNTYtYmY0My00OGJiLWIzNDUtZWRhNGY0NWFjNzFmXkEyXkFqcGdeQXVyNjUxMDQ0MTg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Pâfekuto burû', 'Released_Year': 1997, 'Certificate': 'A', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Crime, Mystery', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'A pop singer gives up her career to become an actress, but she slowly goes insane\
  \ when she starts being stalked by an obsessed fan and what seems to be a ghost\
  \ of her past.', 'Meta_score': nan, 'Director': 'Satoshi Kon', 'Star1': 'Junko Iwao',\
  \ 'Star2': 'Rica Matsumoto', 'Star3': 'Shinpachi Tsuji', 'Star4': 'Masaaki Ôkura',\
  \ 'No_of_Votes': 58192, 'Gross': '776,665'}, {'id': 526, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BMWU4N2FjNzYtNTVkNC00NzQ0LTg0MjAtYTJlMjFhNGUxZDFmXkEyXkFqcGdeQXVyNjc1NTYyMjg@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': '12 Angry Men', 'Released_Year': 1957, 'Certificate': 'U', 'Runtime':\
  \ '96 min', 'Genre': 'Crime, Drama', 'IMDB_Rating': 9.0, 'Overview': 'A jury holdout\
  \ attempts to prevent a miscarriage of justice by forcing his colleagues to reconsider\
  \ the evidence.', 'Meta_score': 96.0, 'Director': 'Sidney Lumet', 'Star1': 'Henry\
