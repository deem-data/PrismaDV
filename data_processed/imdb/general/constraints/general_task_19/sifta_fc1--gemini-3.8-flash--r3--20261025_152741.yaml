    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Rules:\n- MANDATORY ERROR LEVEL FOR FUNCTIONAL CHECKS:\n  -\
      \ Set level \"error\" for any constraint verifying a primary semantic requirement\
      \ (e.g., URL format via .containsURL, key uniqueness via .hasUniqueness/.isUnique,\
