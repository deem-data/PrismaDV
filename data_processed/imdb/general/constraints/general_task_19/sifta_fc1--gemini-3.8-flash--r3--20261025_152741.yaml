      \ `errors='coerce'`.\n    2. OR `target_column_desc` indicates observed completeness\
      \ < 1.0.\n  - In such cases, use `.hasCompleteness('col', lambda x: x >= 0.90)`\
      \ (or 0.85) to tolerate benign missingness while catching catastrophic data\
