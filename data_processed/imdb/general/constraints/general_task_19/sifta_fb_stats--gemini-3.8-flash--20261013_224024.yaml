      \ RequiredArgs: ['column', 'datatype']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .hasDataType('student_id', ConstrainableDataTypes.String)\n  - .hasDataType('student_id',\
      \ ConstrainableDataTypes.String, lambda x: x >= 0.95)\nName: isNonNegative,\
      \ Description: Validates that a numeric column contains no negative values (values\
