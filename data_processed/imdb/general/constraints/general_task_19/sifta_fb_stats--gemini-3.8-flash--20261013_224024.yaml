      \ that values in columnA are greater than or equal to corresponding values in\
      \ columnB for each row. The optional assertion lambda receives the fraction\
      \ of rows where columnA >= columnB and returns a boolean indicating if it meets\
      \ the threshold.\n RequiredArgs: ['columnA', 'columnB']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed')\n\
      \  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed', lambda\
      \ x: x >= 0.95)\nName: isContainedIn, Description: Validates that each non-NULL\
      \ value in a column is contained in the specified set of allowed values. The\
      \ optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold.\n RequiredArgs: ['column',\
      \ 'allowed_values']\n OptionalArgs: ['assertion']\n Examples:\n  - .isContainedIn('target',\
