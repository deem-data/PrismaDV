constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR Certificate IN ('U', 'UA', 'A', 'G', 'PG',
        'PG-13', 'R', 'NC-17', 'Not Rated', 'Unrated', 'Passed', 'Approved')", 'allowed_certificate_when_present')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre').satisfies("Genre RLIKE '^(Action|Adventure|Animation|Biography|Comedy|Crime|Documentary|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)(,
        (Action|Adventure|Animation|Biography|Comedy|Crime|Documentary|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western))*$'",
        'allowed_genres')
      - Valid
    assumptions: []
    column_name: Genre
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating').satisfies('IMDB_Rating >= 0 AND IMDB_Rating <=
        10', 'rating_within_scale')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes').isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year').satisfies('Released_Year >= 1888 AND Released_Year
        <= year(current_date())', 'plausible_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.isComplete(''Runtime'').hasPattern(''Runtime'', ''^[1-9][0-9]* min$'', lambda
        value: value == 1.0)'
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda value: value
        == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
