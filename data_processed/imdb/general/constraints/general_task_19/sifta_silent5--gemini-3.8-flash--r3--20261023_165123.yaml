      \ be numeric and bounded within [0, 10] when normalized without clipping (e.g.,\
      \ df['IMDB_Rating'] / 10.0) to prevent corrupted composite scores. If explicitly\
      \ clipped via .clip(0, 1), minor out-of-bounds values are safely tolerated.\n\
      \     * Vote/count columns: Assume non-negativity (>= 0) or positive (> 0) ONLY\
