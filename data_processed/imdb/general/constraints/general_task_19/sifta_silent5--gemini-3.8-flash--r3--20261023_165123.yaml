      \ clipping. If explicitly handled via .clip(lower=1) or fillna(0), negative\
      \ values do not break the calculation.\n\n2. Tolerant Operations & Defensive\
      \ Fallbacks (Low Severity / Warnings):\n   - Distinguish true silent corruption\
      \ from intentional defensive tolerance. When code explicitly includes defensive\
      \ handling (e.g., pd.to_numeric(..., errors='coerce').fillna(0), .clip(lower=1),\
      \ or dict.get(token, default)), it was designed to absorb missing values or\
