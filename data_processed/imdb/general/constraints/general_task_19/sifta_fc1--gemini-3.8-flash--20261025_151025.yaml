      }'
    assumption_generation: "Analyze how the target column is used in the provided\
      \ code and downstream task to derive concrete data assumptions:\n1. Ground every\
      \ assumption in actual code mechanics. Identify what properties the column must\
      \ satisfy for the code to run properly and produce correct downstream results.\n\
      2. Examine:\n   - Data types and castability: What types does the code assume\
      \ (e.g., numeric, string, integer)? If values are parsed or coerced, what valid\
      \ formats are expected?\n   - Value bounds and validity: Are there domain-specific\
      \ bounds required for mathematical validity or downstream logic (e.g., non-negative\
      \ values for log/ratios, ratings within [0, 10], non-empty strings, valid categorical\
      \ values)?\n   - Nullability and Completeness: Does the code tolerate nulls?\
      \ If null values cause crashes or silent calculation distortions (e.g., NaN\
      \ propagation in scoring, weights, rankings, or correlation), state the completeness\
      \ requirement. If the code safely imputes or handles nulls (e.g., fillna, default\
      \ fallbacks), do not assume 100% completeness.\n   - Schema and Passthrough:\
      \ If the column is selected for output, indexing, or deduplication, it must\
      \ exist and contain non-corrupted data.\n3. Prioritize precision: Do not invent\
      \ arbitrary statistical distributions or unnecessarily narrow bounds unless\
      \ the code explicitly depends on them (e.g., verify_integrity=True, non-zero\
      \ variance for correlation, division operations). Avoid assumptions that flag\
      \ safe variations.\n\nOutput only valid JSON (numbers without leading zeros):\
      \ { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\": int,\
      \ \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ Rule:\n- Set level \"error\" if data that fails the check would cause the\
      \ downstream code to crash OR silently produce wrong/corrupted results (e.g.,\
      \ NaN propagation through weights/scores, distorted rankings, invalid math operations,\
      \ or broken data contracts). Every check whose failure makes a partition unsafe\
      \ must be \"error\".\n- Set level \"warning\" ONLY if the code safely handles\
      \ the violation through intentional design/fallbacks without corrupting the\
      \ final output.\nNote: A validation suite requires error-level constraints to\
      \ catch erroneous data; marking all constraints as \"warning\" prevents the\
      \ suite from ever catching errors.\n\nConstraint Design Guidelines:\n- Link\
      \ each check to the indices (from 0) of the assumptions it tests.\n- Avoid false\
      \ alarms on safe data: if a column allows or tolerates missing values, use `.hasCompleteness('col',\
      \ lambda x: x >= threshold)` or `.satisfies('`col` IS NULL OR ...', 'name')`\
      \ rather than strict `.isComplete`.\n- Use raw strings (r\"...\") for regex\
      \ patterns in `.hasPattern`.\n- For SQL expressions in `.satisfies`, wrap column\
      \ names in backticks (e.g., '`col` >= 0').\n\nOutput: {\"constraint_code\":\
      \ [{\"suggestion\": PyDeequ code (starting with \".\" or a function), \"level\"\
      : \"warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
