constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR Certificate IN ('U', 'UA', 'A', 'G', 'PG',
        'PG-13', 'R', 'NC-17', 'Not Rated', 'Unrated', 'Passed', 'Approved')", 'allowed_certificate')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10', 'bounded_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isNonNegative('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND year(current_date())', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("Runtime RLIKE '[0-9]+'", 'runtime_contains_minutes')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title
