      - start_line: 71
        end_line: 72
        file: ''
      - start_line: 101
        end_line: 107
        file: ''
      uid: 70eb280c-5936-4e64-b1af-833b1b328cd3
    - text: The 'Certificate' column may contain nulls; the script treats them as
        'Not Rated'. Its observed completeness is about 90%, so a substantial increase
        in missing values would change suitability scores without causing an error.
        A validation rule could require at least 85% of input values to be non-null.
      sources:
      - start_line: 67
        end_line: 72
        file: ''
      - start_line: 79
        end_line: 85
        file: ''
      uid: fc24da40-5236-4919-b82e-6b7f7c2d06ce
    - text: 'At least 95% of non-null ''Certificate'' values should exactly match
        one of: U, UA, A, G, PG, PG-13, R, NC-17, Not Rated, Unrated, Passed, or Approved.
        The script does not trim or normalize values; other values silently receive
        the fallback weight of 0.90. In particular, a noncanonical spelling of ''NC-17''
        would not be excluded by the eligibility filter.'
