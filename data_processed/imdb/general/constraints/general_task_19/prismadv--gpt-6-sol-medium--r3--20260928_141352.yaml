      - start_line: 101
        end_line: 110
        file: ''
      uid: 3de5eac6-80a2-4dda-a2a5-2846721c7d1c
    - text: The 'Certificate' column may contain null values. Nulls are treated as
        'Not Rated' when calculating suitability, so the input column does not need
        to be complete.
