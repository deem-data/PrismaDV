      - start_line: 68
        end_line: 72
        file: ''
      uid: e15dfb5b-c39c-4a2d-976c-ded58dfda3b8
    - text: 'Non-null ''Certificate'' values should predominantly use these exact,
        case-sensitive labels: U, UA, A, G, PG, PG-13, R, NC-17, Not Rated, Unrated,
