      - start_line: 31
        end_line: 33
        file: ''
      - start_line: 67
        end_line: 72
        file: ''
      uid: efc0534f-06d2-4fdb-b185-628746eb0f01
    - text: Any certificate intended to make a title ineligible must be recorded exactly
        as 'NC-17'. That label maps to zero suitability and is filtered out; an alternative
