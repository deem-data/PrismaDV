      - text: Validate constraints and write JSON
        completed: true
  - type: turn.completed
    usage: *id001
  stderr_tail: 'Reading additional input from stdin...

    '
constraints:
  constraints:
    Certificate:
      code:
      - - .satisfies("Certificate IS NULL OR Certificate IN ('U', 'UA', 'A', 'G',
          'PG', 'PG-13', 'R', 'NC-17', 'Not Rated', 'Unrated', 'Passed', 'Approved',
          'TV-PG', 'GP', 'TV-14', '16')", 'supported or observed certificate')
        - Valid
      assumptions: []
      column_name: Certificate
    Genre:
      code:
      - - '.hasPattern(''Genre'', r''^\s*(Action|Adventure|Animation|Biography|Comedy|Crime|Documentary|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)(\s*,\s*(Action|Adventure|Animation|Biography|Comedy|Crime|Documentary|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western))*\s*$'',
          lambda fraction: fraction == 1.0)'
        - Valid
      - - .isComplete('Genre')
        - Valid
      assumptions: []
      column_name: Genre
    IMDB_Rating:
      code:
      - - .isComplete('IMDB_Rating')
        - Valid
      - - .satisfies('CAST(IMDB_Rating AS DOUBLE) IS NOT NULL AND IMDB_Rating BETWEEN
          0 AND 10', 'numeric IMDb rating between zero and ten')
        - Valid
      assumptions: []
      column_name: IMDB_Rating
    No_of_Votes:
      code:
      - - .isComplete('No_of_Votes')
        - Valid
      - - .satisfies('CAST(No_of_Votes AS DOUBLE) IS NOT NULL AND CAST(No_of_Votes
          AS DOUBLE) = CAST(No_of_Votes AS BIGINT) AND No_of_Votes >= 1000', 'integer
          vote count at least 1000')
        - Valid
      assumptions: []
      column_name: No_of_Votes
    Released_Year:
      code:
      - - .isComplete('Released_Year')
        - Valid
      - - .satisfies('CAST(Released_Year AS DOUBLE) IS NOT NULL AND CAST(Released_Year
          AS DOUBLE) = CAST(Released_Year AS BIGINT) AND Released_Year BETWEEN 1888
          AND YEAR(CURRENT_DATE())', 'valid release year')
        - Valid
      assumptions: []
      column_name: Released_Year
    Runtime:
      code:
      - - '.hasPattern(''Runtime'', r''(?i)^\s*[1-9][0-9]*\s*(m|min|mins|minutes)\.?\s*$'',
          lambda fraction: fraction == 1.0)'
        - Valid
      - - .isComplete('Runtime')
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - '.hasPattern(''Series_Title'', r''^.*\S.*$'', lambda fraction: fraction
          == 1.0)'
        - Valid
      - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda fraction:
          fraction == 1.0)'
        - Valid
      - - .isComplete('Series_Title')
        - Valid
      assumptions: []
      column_name: Series_Title
