        alongside quality under the assumption that high-rated entries have strong
        vote counts. We could represent this assumption as a Deequ constraint like:
        .hasCorrelation(''IMDB_Rating'', ''No_of_Votes'', lambda c: c >= 0.0)'
      sources:
      - start_line: 37
        end_line: 41
        file: ''
      - start_line: 79
        end_line: 85
        file: ''
      uid: cb394b5a-26dc-4b8d-ba1e-dbcbc5d93e40
    - text: '''IMDB_Rating'' and ''No_of_Votes'' should both be non-null and non-negative
