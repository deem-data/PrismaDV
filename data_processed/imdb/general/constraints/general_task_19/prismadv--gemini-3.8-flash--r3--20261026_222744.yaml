replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.85)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7e4183ee-fac9-4403-8b95-c7ab80d1ca8f
      source_assumptions:
      - 67fa581d-e4f5-49cd-8c56-222f842bf0f5
    - suggestion: '.isContainedIn(''Certificate'', [''U'', ''UA'', ''A'', ''G'', ''PG'',
        ''PG-13'', ''R'', ''NC-17'', ''Not Rated'', ''Unrated'', ''Passed'', ''Approved''],
        lambda x: x >= 0.95)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 65e4c59e-f3de-418c-81c3-66a371d7b199
      source_assumptions:
      - 423ade3a-7c0e-4d07-83e3-f437fb36dc64
    assumptions:
    - text: 'The ''Certificate'' column can contain missing or null values, as the
        code explicitly handles missing entries using `.fillna(''Not Rated'')` before
        processing. We could represent this assumption as a deequ constraint like
        this: .isComplete(''Certificate'') is not strictly required, or completeness
        can be around 0.89.'
      sources:
      - start_line: 71
        end_line: 71
        file: ''
      uid: 67fa581d-e4f5-49cd-8c56-222f842bf0f5
    - text: 'The ''Certificate'' column is expected to contain categorical film rating
        values, primarily from the set of allowed certificates: ''U'', ''UA'', ''A'',
        ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''Not Rated'', ''Unrated'', ''Passed'',
        ''Approved''. We could represent this assumption as a deequ constraint like
        this: .satisfies("CASE WHEN `Certificate` IS NULL OR `Certificate` IN (''U'',
        ''UA'', ''A'', ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''Not Rated'',
        ''Unrated'', ''Passed'', ''Approved'') THEN 1 ELSE 0 END", "Allowed Certificate
        Values", lambda x: x >= 0.95)'
      sources:
      - start_line: 31
        end_line: 33
        file: ''
      - start_line: 67
        end_line: 72
        file: ''
      uid: 423ade3a-7c0e-4d07-83e3-f437fb36dc64
  Genre:
