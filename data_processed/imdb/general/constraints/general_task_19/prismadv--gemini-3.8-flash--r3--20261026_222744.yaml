  IMDB_Rating:
    code:
    - suggestion: '.satisfies("CASE WHEN `IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10
        THEN 1 ELSE 0 END", "IMDB_Rating between 0 and 10", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6967eb00-dddb-496c-b31c-6265ed2df0b8
      source_assumptions:
      - b5d2e4e0-7484-4a1f-86a4-c1f877597f82
    - suggestion: '.satisfies("CASE WHEN `IMDB_Rating` >= 6.5 THEN 1 ELSE 0 END",
        "IMDB_Rating Quality Gate", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 78231d16-68e4-4a0d-a958-84683289faa2
      source_assumptions:
      - aa82beaf-007e-4916-988d-625b2be26a78
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 831b891e-ba67-4be4-8701-9199a9310c73
      source_assumptions:
      - 17eba006-8fdb-4129-8007-9444aa83a103
    assumptions:
    - text: 'The ''IMDB_Rating'' column is expected to contain numeric rating values
        bounded between 0 and 10, as the code scales the rating to a [0, 1] range
        by dividing by 10.0. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN `IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10
        THEN 1 ELSE 0 END", "IMDB_Rating between 0 and 10", lambda x: x == 1.0)'
      sources:
      - start_line: 37
        end_line: 37
        file: ''
      uid: b5d2e4e0-7484-4a1f-86a4-c1f877597f82
    - text: 'The ''IMDB_Rating'' column should contain valid values where at least
        some entries satisfy the quality gate of being greater than or equal to 6.5,
        ensuring downstream licensing recommendations are produced. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `IMDB_Rating`
        >= 6.5 THEN 1 ELSE 0 END", "IMDB_Rating Quality Gate", lambda x: x > 0)'
      sources:
      - start_line: 97
        end_line: 98
        file: ''
      uid: aa82beaf-007e-4916-988d-625b2be26a78
    - text: 'The ''IMDB_Rating'' column should not be completely null and is expected
        to be convertible to numeric values for scoring and threshold filtering. We
        could represent this assumption as a deequ constraint like this: .isComplete("IMDB_Rating")'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 37
        end_line: 37
        file: ''
      uid: 17eba006-8fdb-4129-8007-9444aa83a103
  No_of_Votes:
    code:
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 295dd7c3-f5c5-4e53-8875-75d6c21a8f12
      source_assumptions:
      - ff33ba05-3a56-4bee-bf5c-597fb7fe9d29
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: fefe037f-4706-4abd-939f-4d5d0608872b
      source_assumptions:
      - 9964e184-290e-488c-9357-d6ffc441af93
    assumptions:
    - text: 'The ''No_of_Votes'' column may contain null or unparseable values because
        the code explicitly uses `fillna(0)` to impute missing values after coercing
        to numeric. We could represent this assumption as a deequ constraint like
        this: .isComplete(''No_of_Votes'', lambda x: x >= 0.0)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: 745dec67-266e-4100-829c-5e92cfb7d8fe
    - text: 'The ''No_of_Votes'' column should be numeric or castable to integers,
        as the downstream code applies `pd.to_numeric(df[''No_of_Votes''], errors=''coerce'')`
        and casts the values to integer `.astype(int)`. We could represent this assumption
        as a deequ constraint like this: .hasDataType(''No_of_Votes'', org.apache.spark.sql.types.IntegerType)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: ff33ba05-3a56-4bee-bf5c-597fb7fe9d29
    - text: 'The ''No_of_Votes'' column values are expected to be non-negative (greater
        than or equal to 0), representing the count of user votes, which are clipped
        to a lower bound of 1 before computing the logarithm `np.log10`. We could
        represent this assumption as a deequ constraint like this: .satisfies(''CASE
        WHEN `No_of_Votes` >= 0 THEN 1 ELSE 0 END'', ''NonNegativeVotes'', lambda
        x: x == 1.0)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 40
        end_line: 40
        file: ''
      uid: 9964e184-290e-488c-9357-d6ffc441af93
  Released_Year:
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e2288b75-5351-4c8c-9294-9e24501239e7
      source_assumptions:
      - 88c8514b-898e-45f2-b3cd-9676304f33f0
    - suggestion: '.satisfies("CASE WHEN `Released_Year` IS NOT NULL AND TRY_CAST(`Released_Year`
        AS INT) IS NOT NULL THEN 1 ELSE 0 END", "Released_Year is integer", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1cc21e54-d8a2-4c29-8617-508fd05f0a7d
      source_assumptions:
      - b5c7e3fa-55c0-4070-86d4-8cdc0bd9ffc3
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 98cf5fea-9276-4d7f-a0cc-f8fd4a5bb2ea
      source_assumptions:
      - 0d8d10fd-e3bd-476d-b348-5568186269ff
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across all rows, as the code sets them as the index with ''verify_integrity=True'',
        which will raise a ValueError if there are duplicate (Series_Title, Released_Year)
        pairs. We could represent this assumption as a Deequ constraint: .hasUniqueness([''Series_Title'',
        ''Released_Year''], lambda x: x == 1.0)'
      sources:
      - start_line: 34
        end_line: 35
        file: ''
      uid: 88c8514b-898e-45f2-b3cd-9676304f33f0
    - text: 'The ''Released_Year'' column should be numeric or convertible to integers,
        as it is parsed with pd.to_numeric(...).astype(''Int64'') and used in arithmetic
        subtraction against current_year to compute the movie''s age. We could represent
        this assumption as a Deequ constraint: .satisfies("CASE WHEN `Released_Year`
        IS NOT NULL AND TRY_CAST(`Released_Year` AS INT) IS NOT NULL THEN 1 ELSE 0
        END", "Released_Year is integer", lambda x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 43
        end_line: 44
        file: ''
      uid: b5c7e3fa-55c0-4070-86d4-8cdc0bd9ffc3
    - text: 'The ''Released_Year'' column is expected to be non-null, as it is used
        directly in arithmetic operations to calculate ''age_years'' and ''freshness''
        without missing value imputation (unlike ''No_of_Votes'' which uses .fillna(0)).
        Missing values would result in NaN scores in downstream scoring calculations.
        We could represent this assumption as a Deequ constraint: .isComplete(''Released_Year'')'
      sources:
      - start_line: 21
        end_line: 22
        file: ''
      - start_line: 43
        end_line: 44
        file: ''
      uid: 0d8d10fd-e3bd-476d-b348-5568186269ff
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 66013a91-50ee-43ab-8dfb-59abc51b8f77
      source_assumptions:
      - 836a9510-180f-4d9a-9337-d17774e4bdb0
    - suggestion: '.satisfies("`Runtime` RLIKE ''.*[0-9]+.*''", "Runtime contains
        digits", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8e0e33cf-8a52-451e-8e5e-9349a7ab76c5
      source_assumptions:
      - 54591d5c-3c26-4f75-811f-92e5fdabf935
    assumptions:
    - text: 'The ''Runtime'' column should not contain any null values because the
        code extracts digits and immediately casts the result to integer using `.astype(int)`.
        If any null values are present, the extracted result will be NaN, causing
        `.astype(int)` to fail with a ValueError.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")

        '
      sources:
      - start_line: 46
        end_line: 46
        file: ''
      uid: 836a9510-180f-4d9a-9337-d17774e4bdb0
    - text: 'Each value in the ''Runtime'' column must contain at least one sequence
        of digits (e.g., ''142 min'' or ''142'') because the code uses `.str.extract(r''(\d+)'',
        expand=False).astype(int)`. If any string lacks digits, `str.extract` produces
        NaN, which causes the conversion to integer `.astype(int)` to fail.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Runtime` RLIKE ''.*[0-9]+.*''", "Runtime contains digits", lambda
        x: x == 1.0)

        '
      sources:
      - start_line: 46
        end_line: 46
        file: ''
      uid: 54591d5c-3c26-4f75-811f-92e5fdabf935
