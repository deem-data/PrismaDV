      `col` IS NULL OR ...\", \"constraint_name\")` at level \"error\" so non-null\
      \ values are strictly validated while tolerated nulls do not cause false alarms.\n\
      - Uniqueness Checks:\n  - If an assumption asserts single-column uniqueness:\
