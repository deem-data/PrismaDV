      \ coerced to NaN/0 distorting scores/ranks, negative values distorting log/decay\
      \ transforms, duplicate keys silently overwriting dictionary mappings in `dict(zip(...))`,\
      \ or missing output columns).\n  - Never demote core data type checks (`hasDataType`),\
      \ domain validity checks (`isNonNegative`, `satisfies`), key uniqueness (`isUnique`,\
      \ `hasUniqueness`), or required completeness checks to \"warning\" just because\
      \ the code has fallback defaults like `errors='coerce'` or `.fillna()`. Silent\
      \ failure is an ERROR.\n- Level \"warning\" Assignment: Set level \"warning\"\
      \ ONLY for genuinely benign, secondary advisory checks that do not degrade code\
      \ execution, calculations, or downstream outputs.\n- Substantive Error Constraints\
