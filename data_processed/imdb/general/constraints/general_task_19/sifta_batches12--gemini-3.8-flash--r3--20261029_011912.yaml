      \ retained in output column lists (e.g., `out_cols`), it must exist in the input\
      \ dataset. For output export columns, downstream consumers rely on receiving\
      \ valid, non-corrupted data conforming to the expected schema.\n2. Distinguish\
      \ tolerance vs. requirement (Avoid the defensive code trap):\n   - Defensive\
      \ constructs such as `errors='coerce'`, `.fillna()`, `.get(..., default)`, or\
      \ `.clip()` are implementation fallbacks to prevent hard crashes—they do NOT\
      \ mean that corrupted, missing, or malformed data is acceptable.\n   - If invalid\
      \ values (e.g., non-numeric strings in numeric columns, negative counts/votes/revenue,\
      \ corrupted categories, missing keys) cause silent logical corruption (e.g.,\
      \ erroneous sorting, corrupted score calculations, misclassified records, bypassed\
      \ eligibility gates, or lost records in dictionary/key lookups), state type\
      \ conformity, domain validity, and key integrity clearly as essential requirements.\n\
      3. Align with column statistics:\n   - Check `target_column_desc`:\n     - If\
      \ completeness is 1.0 in clean data and the column is used as an index, key,\
      \ or critical feature, assume completeness is required. If completeness < 1.0\
      \ or nulls are present in clean data, do NOT assume strict 100% completeness,\
      \ but assume that non-null values must satisfy type and domain constraints.\n\
      \     - For numeric columns (counts, votes, year, ratings), capture domain constraints\
      \ supported by the code (e.g., non-negative votes, ratings in [0, 10], realistic\
      \ release years).\n     - For columns used in indexing (`set_index(..., verify_integrity=True)`)\
      \ or key-value lookups (`dict(zip(...))`), explicitly state the uniqueness requirement\
      \ of the key (or composite key) to prevent collision crashes and silent overwrite\
      \ data loss.\n4. Output completeness:\n   - Always generate assumptions covering\
      \ baseline existence, data type conformity, domain/value validity, and structural\
      \ integrity (uniqueness/completeness where applicable). Do not output an empty\
