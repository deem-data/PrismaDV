  instructions:
    dataflow_inspector: "List every line of the code that touches the target column:\
      \ reads it, writes it, filters on it, transforms it, merges it, or passes it\
      \ along.\n\nTo ensure line number accuracy:\n1. Count line numbers sequentially\
      \ starting at 1 from the very first line of code_script. Count every single\
      \ line: import statements, function definitions, comments, blank lines, and\
      \ multiline expressions (each individual line of a multiline dictionary, set,\
      \ list, or function call increments the line count by 1; never collapse multiline\
      \ blocks into a single line).\n2. Scan the code text specifically for exact\
      \ occurrences of the target column name (e.g., as `'column_name'`, attribute\
      \ `.col`, or variable directly representing it).\n3. Pay close attention to\
      \ pass-through and export lines:\n   - When a column appears inside a multiline\
      \ list or collection (e.g., `out_cols = [..., 'column_name', ...]`), include\
      \ ONLY the exact, specific line(s) where the target column name itself is written.\n\
      \   - Do NOT include the entire definition block, preceding comments, subsequent\
      \ unrelated list elements, or general path setup lines (such as `output_file\
      \ = ...`) that do not contain the target column name.\n   - Only include export\
      \ calls (e.g., `to_csv`, `to_parquet`) if the target column name is explicitly\
      \ written in that call (e.g., `columns=['col_a', 'column_name']`).\n4. Include:\n\
      \   - DataFrame loading, column access, indexing, and slicing (e.g., df['col'],\
      \ df[['col', ...]], df.col).\n   - Column operations, type conversions, string\
      \ transformations, arithmetic, and filtering conditions.\n   - Associated definitions\
      \ and constants: sets, dictionaries, mapping tables, lists of allowed values,\
      \ or threshold constants directly applied to the column.\n   - Downstream derivations:\
      \ formulas, masks, or composite metrics using variables assigned from the target\
      \ column.\n5. Merge adjacent or contiguous lines into a single range [start_line,\
      \ end_line].\n\nOutput only JSON: { \"sources\": [{ \"start_line\": int, \"\
      end_line\": int }, ...] }"
    assumption_generation: "Analyze how the target column is used in the code script\
      \ and the downstream task to identify data assumptions.\n\n1. Ground assumptions\
      \ strictly in code requirements (Prioritize Precision over Coverage):\n   -\
      \ Focus on properties critical to code correctness:\n     - Properties whose\
      \ violation causes crashes (e.g., missing column when accessed without fallbacks,\
      \ unconvertible data types, broken unique index integrity like set_index(...,\
      \ verify_integrity=True)).\n     - Properties whose violation silently produces\
      \ wrong results (e.g., negative values in log or weighting formulas, values\
      \ outside expected domains like ratings outside [0, 10], or scale mismatches\
      \ that cause filtering to discard all rows).\n\n2. Unused and Optional Passthrough\
      \ Columns:\n   - If a target column is not used in calculations, transformations,\
      \ indexing, or filtering, and is only optionally retained or passthrough (e.g.,\
      \ guarded by `[c for c in out_cols if c in final.columns]`), the code does not\
      \ rely on its schema or values to execute correctly.\n   - In such cases, do\
      \ NOT invent domain constraints or completeness rules. Return an empty assumptions\
      \ list `[]`. Generating assumptions for columns the code does not depend on\
      \ creates false alarms.\n\n3. Distinguish strict completeness from tolerant\
      \ completeness:\n   - Only assume 100% completeness (no missing values) if the\
      \ code strictly requires it to avoid crashes or broken indexing (e.g., set_index\
      \ with verify_integrity=True, non-nullable integer casting without fallbacks).\n\
      \   - If the code uses fallback mechanisms (e.g., errors='coerce', .fillna(),\
      \ .dropna()) or passes columns through to output, the pipeline tolerates occasional\
      \ missing values. In these cases, do NOT assume 100% completeness even if target_column_desc\
      \ shows completeness 1.0. Instead, assume a realistic minimum completeness threshold\
      \ (e.g., 0.80 to 0.90 for observed ~1.0, or 0.60 to 0.75 for observed ~0.83-0.86)\
      \ to detect catastrophic missingness without flagging safe partitions.\n\n4.\
      \ Scale and distribution assumptions for filtered columns:\n   - When code filters\
      \ on a numeric cutoff (e.g., df[df['IMDB_Rating'] >= 7.0]), assume that the\
      \ column is on the expected domain scale and contains values satisfying this\
      \ threshold (e.g., max rating >= 7.0) to detect scaling mismatches.\n\n5. Ground\
      \ assumptions in observed column metadata when used in code:\n   - Ratings (e.g.,\
      \ IMDB_Rating): numeric, bounded between 0.0 and 10.0, with values sufficiently\
      \ high to meet downstream filter thresholds.\n   - Released Year: valid positive\
      \ integers (e.g., 1880 to current year) when used in date/age math or indexing.\n\
      \   - Key columns: unique and non-null when used for index integrity (`verify_integrity=True`)\
      \ or joins.\n   - Categorical / Certification fields: valid string types conforming\
      \ to recognized domain categories used in mapping dictionaries.\n\nWrite these\
      \ assumptions as clear, testable statements about the input data that a Deequ\
      \ check can validate.\n\nOutput only valid JSON (numbers without leading zeros):\
      \ { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\": int,\
      \ \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ Assignment:\n- In the validation engine, ONLY \"error\" level constraints\
      \ reject unsafe data batches. A \"warning\" constraint NEVER rejects a batch.\n\
      - Set level \"error\" ONLY for checks whose failure means a code crash OR a\
      \ silent wrong calculation result / output corruption:\n  1. Data type validity\
      \ (`.hasDataType`) for columns used in downstream logic.\n  2. Catastrophic\
      \ missingness (`.hasCompleteness` with a safe threshold) for required columns.\n\
      \  3. Domain bounds and format validity (e.g., non-negative scores, valid numeric\
      \ strings, bounded ratings [0, 10]) that feed mathematical formulas or filters.\n\
      \  4. Critical scale cutoffs (`.hasMax`) and key integrity (`.isUnique` / `.isComplete`\
      \ with verify_integrity=True).\n- Set level \"warning\" for loose informational\
      \ checks, non-critical bounds, or columns where an out-of-bound value is handled\
      \ gracefully by the code without corrupting calculations.\n- If the `assumptions`\
      \ list is empty `[]`, output `{\"constraint_code\": []}`. Do not invent ungrounded\
      \ constraints.\n\nConstraint Precision and False Alarm Prevention:\n- Completeness\
      \ checks:\n  - Do NOT use .isComplete() simply because observed completeness\
      \ in target_column_desc is 1.0. Use .isComplete(column) with level \"error\"\
      \ ONLY when the assumption explicitly requires 100% completeness (e.g., primary/index\
      \ keys with verify_integrity=True).\n  - Whenever code tolerates occasional\
      \ missing values (via errors='coerce', .fillna(), or passthrough export), use\
      \ .hasCompleteness(column, lambda x: x >= threshold) with level \"error\", setting\
      \ a safe threshold (e.g., 0.80 to 0.90 for observed ~1.0, or 0.60 to 0.70 for\
      \ observed ~0.83-0.86) to catch catastrophic missingness while tolerating minor\
      \ variations on safe partitions.\n- SQL conditions and Null safety in .satisfies:\n\
      \  - Whenever validating numeric ranges, string patterns, or domain conditions\
      \ on columns that might contain missing values, ALWAYS guard with NULL in SQL:\n\
      \    e.g., .satisfies('`col` IS NULL OR (`col` >= min_val AND `col` <= max_val)',\
      \ 'constraint_name', lambda x: x >= 0.95)\n  - To prevent single-row outliers\
      \ on safe partitions from failing the entire batch, provide a tolerant assertion\
      \ lambda (e.g., `lambda x: x >= 0.95` or `lambda x: x >= 0.98`) in `.satisfies`\
