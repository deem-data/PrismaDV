      \ ['assertion']\n Examples:\n  - .isLessThan('credits_completed', 'credits_attempted')\n\
      \  - .isLessThan('credits_completed', 'credits_attempted', lambda x: x >= 0.95)\n\
      Name: isLessThanOrEqualTo, Description: Validates that values in columnA are\
      \ less than or equal to corresponding values in columnB for each row. The optional\
      \ assertion lambda receives the fraction of rows where columnA <= columnB and\
      \ returns a boolean indicating if it meets the threshold.\n RequiredArgs: ['columnA',\
      \ 'columnB']\n OptionalArgs: ['assertion']\n Examples:\n  - .isLessThanOrEqualTo('credits_completed',\
      \ 'credits_attempted')\n  - .isLessThanOrEqualTo('credits_completed', 'credits_attempted',\
      \ lambda x: x >= 0.95)\nName: isGreaterThan, Description: Validates that values\
      \ in columnA are greater than corresponding values in columnB for each row.\
      \ The optional assertion lambda receives the fraction of rows where columnA\
      \ > columnB and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnA', 'columnB']\n OptionalArgs: ['assertion']\n Examples:\n  - .isGreaterThan('credits_attempted',\
      \ 'credits_completed')\n  - .isGreaterThan('credits_attempted', 'credits_completed',\
      \ lambda x: x >= 0.95)\nName: isGreaterThanOrEqualTo, Description: Validates\
      \ that values in columnA are greater than or equal to corresponding values in\
      \ columnB for each row. The optional assertion lambda receives the fraction\
      \ of rows where columnA >= columnB and returns a boolean indicating if it meets\
      \ the threshold.\n RequiredArgs: ['columnA', 'columnB']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed')\n\
      \  - .isGreaterThanOrEqualTo('credits_attempted', 'credits_completed', lambda\
      \ x: x >= 0.95)\nName: isContainedIn, Description: Validates that each non-NULL\
      \ value in a column is contained in the specified set of allowed values. The\
      \ optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold.\n RequiredArgs: ['column',\
      \ 'allowed_values']\n OptionalArgs: ['assertion']\n Examples:\n  - .isContainedIn('target',\
      \ ['Graduate', 'Dropout', 'Enrolled'])\n  - .isContainedIn('target', ['Graduate',\
      \ 'Dropout', 'Enrolled'], lambda x: x >= 0.95)\n\nAvailable Aggregate-Level\
      \ Functions:\nName: hasSize, Description: Validates the total number of rows\
      \ in the dataframe. The assertion is a lambda function that receives the row\
      \ count as input and returns a boolean indicating whether the size meets the\
      \ expectation.\n RequiredArgs: ['assertion']\n OptionalArgs: []\n Example: .hasSize(lambda\
      \ x: x >= 1000)\nName: haveAnyCompleteness, Description: Validates that at least\
      \ one column in a set meets the specified completeness threshold. The assertion\
      \ lambda receives the completeness fraction and returns a boolean indicating\
      \ if at least one column meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveAnyCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: isUnique, Description: Validates that a column\
      \ contains only unique values with no duplicates. Every value in the column\
      \ must appear exactly once.\n RequiredArgs: ['column']\n OptionalArgs: []\n\
      \ Example: .isUnique('student_id')\nName: hasUniqueness, Description: Validates\
      \ the uniqueness fraction of a single column or combined set of columns. Uniqueness\
      \ is the ratio of values that occur exactly once. The assertion lambda receives\
      \ the uniqueness fraction (0.0 to 1.0) and returns a boolean indicating if it\
