  instructions:
    dataflow_inspector: "List every line of the code that touches the target column:\
      \ reads it, writes it, filters on it, transforms it, merges it, or passes it\
      \ along. \n\nBe thorough and check:\n- Subscript and attribute accesses (e.g.,\
      \ df['col'], df.col, df[['col']])\n- Inclusion in column lists or tuples (e.g.,\
      \ in out_cols, subset=['col'], set_index, drop_duplicates, to_csv(columns=...))\n\
      - Keyword arguments and dictionary mappings referencing the column name\n\n\
      Verify the exact 1-based line numbers in the provided code; do not select blank\
      \ lines or unrelated statements. Put adjacent lines in one range.\n\nOutput\
      \ only JSON: { \"sources\": [{ \"start_line\": int, \"end_line\": int }, ...]\
      \ }"
    assumption_generation: 'Code makes assumptions about its input data, often without
      stating them. Analyze how the target column is used in the focused code and
      task context to infer these assumptions:

      1. Operational Requirements: What properties must hold for the code to run correctly?
      Look at operations like arithmetic, log transforms, string parsing, regex extraction,
      datetime comparisons, indexing (e.g., verify_integrity), and correlations.

      2. Silent Failure vs Tolerated Behavior: Distinguish between data properties
      the code strictly depends on to avoid crashes or silent wrong results (e.g.,
      valid rating ranges [0, 10], non-null keys in uniqueness checks, sufficient
      variance for correlation) versus properties the code gracefully handles via
      explicit fallbacks (e.g., fillna(0) for optional fields, errors=''coerce'').

      3. Schema & Passthrough Columns: If the column is passed through or exported
      (e.g., in out_cols), the code assumes the column exists, conforms to expected
      data types (e.g., String, Numeric), and preserves reasonable completeness. Never
      return an empty assumption list if the column is present in the pipeline.


      Write these assumptions as concrete statements about the input data that PyDeequ
      checks can test.


      Output only valid JSON (numbers without leading zeros): { "assumptions": [{
      "text": str, "sources": [{ "start_line": int, "end_line": int }] }, ...] }'
    ir_generation: "Translate the assumptions into PyDeequ checks. \n\nConstraint\
      \ Level Assignment:\n- Set level \"error\" if data that fails the check would\
      \ crash the code OR silently produce incorrect results (e.g., corrupted composite\
      \ scores, invalid rankings, broken index integrity, or invalid output filters).\
      \ Note: code using errors='coerce' or clipping may not crash on invalid data,\
      \ but corrupting critical calculations constitutes a silent failure and must\
      \ be marked \"error\".\n- Set level \"warning\" ONLY if the code intentionally\
      \ tolerates and handles the condition (e.g., expected missing values handled\
      \ via business-logic fillna, or purely informational quality indicators).\n\
      - Avoid marking every constraint as \"warning\": an error-level constraint is\
      \ required to protect the pipeline against corrupt partitions.\n\nPrecision\
      \ & Robustness Guidelines:\n- Calibrate thresholds to avoid false alarms on\
      \ safe data: do not enforce strict completeness (.isComplete) on columns known\
      \ to contain legitimate nulls (e.g., Gross with ~83% completeness).\n- For bounded\
      \ metrics like IMDB_Rating, enforce the valid domain [0.0, 10.0] with .satisfies()\
      \ at \"error\" level if scores depend on this scaling.\n- Link each check to\
      \ the indices (from 0) of the assumptions it tests.\n\nOutput: {\"constraint_code\"\
      : [{\"suggestion\": PyDeequ code (starting with \".\" or a function), \"level\"\
      : \"warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted',\
      \ lambda x: x >= 0.95)\nName: hasPattern, Description: Validates that column\
