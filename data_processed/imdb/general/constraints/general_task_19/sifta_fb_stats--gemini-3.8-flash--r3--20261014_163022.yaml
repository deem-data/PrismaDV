      \ non-zero if dividing).\n   - If the column is used for indexing (e.g., set_index\
      \ with verify_integrity=True) or unique mapping, assume uniqueness and completeness.\n\
      \   - If the column is parsed (e.g., regex, datetime, string split), assume\
      \ compatible string formatting.\n   - If the code uses explicit fallback logic\
      \ (e.g., fillna, errors='coerce', default values), do NOT assume completeness\
      \ or strict parsing unless missing values lead to silent logic failure.\n2.\
      \ Prioritize precision over broad checks: do not assume arbitrary distributions\
      \ or unnecessary constraints that clean alternative partitions might violate.\
      \ Focus on requirements where a violation would crash the pipeline or produce\
      \ silently corrupted results.\n\nOutput only valid JSON (numbers without leading\
      \ zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
