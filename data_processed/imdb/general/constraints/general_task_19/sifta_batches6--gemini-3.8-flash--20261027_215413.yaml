    assumption_generation: "Analyze how the target column is used in the code script,\
      \ its downstream task, and its metadata (target_column_desc) to formulate data\
      \ validation assumptions.\n\n1. Correctness-critical assumptions vs Code Tolerance:\n\
      \   - Distinguish strict crashes and silent corruption from safe pandas handling:\n\
      \     * Strict crashes: Unhandled `.astype(int)`, `int(r['col'])` in row iterations,\
      \ duplicate keys in `set_index(..., verify_integrity=True)`, or missing columns\
      \ referenced in explicit column selections (e.g., `df[out_cols]`, `df[ranked_cols]`).\
      \ Assume column presence, basic non-nullness, and uniqueness ONLY when violations\
      \ directly crash the script.\n     * Silent corruption (Critical): A partition\
      \ is unsafe when code runs without crashing but silently produces wrong results.\n\
      \       - Categorical mapping: For categorical columns (e.g., `Certificate`,\
      \ `Genre`) mapped to weights or filtered sets, unmapped categories coerced to\
      \ fallback defaults silently corrupt calculations. Non-null values must belong\
      \ to the recognized category domain.\n       - Numeric calculations: Values\
      \ outside domain bounds (e.g., negative votes, ratings outside [0, 10], metascores\
      \ outside [0, 100]) distort downstream ranking models, means, and correlations.\
      \ Assume the overwhelming majority of non-null values adhere to valid domain\
      \ bounds.\n       - Completeness collapse: Even when code uses defensive constructs\
      \ (`pd.to_numeric(..., errors='coerce')`, `.dropna()`, `.fillna()`), severe\
      \ completeness drops (e.g., falling below 50%-70% when metadata shows ~85%+)\
      \ lead to degenerate models or unrepresentative outputs. Assume a minimum viable\
      \ completeness threshold grounded in `target_column_desc`.\n     * Passthrough\
      \ / Exported columns: If the column is selected in export lists or written to\
      \ output CSVs, assume schema presence and expected data type (e.g. String).\
      \ Missing the column crashes with a KeyError, and completely null data corrupts\
      \ the export.\n\n2. Domain and dataset conventions:\n   - Categorical columns\
      \ (`Certificate`, `Genre`): Allowed categories must match the recognized domain\
      \ sets present in the code.\n   - Ratings (`IMDB_Rating`): Non-null values lie\
      \ within [0.0, 10.0].\n   - Metascores (`Meta_score`): Non-null values lie within\
      \ [0.0, 100.0].\n   - Counts and Runtimes (`No_of_Votes`, `Runtime` minutes):\
      \ Non-negative (>= 0).\n   - Release years (`Released_Year`): Plausible cinema\
      \ era years (>= 1880 up to current year + 2).\n\n3. Grounding in metadata:\n\
      \   - Check target_column_desc for observed completeness, data type, and distinct\
      \ values.\n   - If observed completeness is < 1.0, do not assume 100% completeness;\
      \ assume a safe lower bound (e.g. 10-20% below observed completeness).\n   -\
      \ Specify that numeric range bounds apply to non-null / non-NaN values.\n\n\
      Output only valid JSON (numbers without leading zeros): { \"assumptions\": [{\
      \ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }] },\
      \ ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ Assignment:\n- A partition is unsafe when the downstream code crashes on it\
      \ OR runs without an error but silently produces a wrong result.\n- MANDATORY\
      \ RULE: Every target column MUST have at least one \"error\"-level constraint.\
      \ A validation suite with only \"warning\"-level checks never rejects an erroneous\
      \ batch and catches zero errors.\n\nSet level \"error\" for checks whose failure\
      \ causes a crash OR a silent wrong result:\n1. Minimum completeness (.hasCompleteness\
      \ / .isComplete):\n   - CRITICAL RULE: Minimum completeness checks (`.hasCompleteness`\
      \ with a safe threshold below observed, e.g. 0.50 to 0.80, or 10-20% below observed\
      \ completeness from target_column_desc) MUST ALWAYS BE SET TO \"error\" LEVEL,\
      \ NEVER \"warning\".\n   - This applies to BOTH active columns (where missing\
      \ values silently corrupt means, correlations, and model rankings) AND passthrough/exported\
      \ columns (where missing values silently produce corrupted, blank catalog feeds\
      \ or export tables).\n   - In Spark SQL and PyDeequ, `.hasDataType('col', ConstrainableDataTypes.String)`\
      \ returns true even on 100% NULL columns. Therefore, `.hasDataType` alone CANNOT\
      \ catch missing/blank column corruptions. Minimum completeness at \"error\"\
      \ level is essential to catch these unsafe partitions.\n   - Use `.isComplete(column)`\
      \ at \"error\" level only when nulls cause an immediate crash (e.g. unhandled\
      \ `.astype(int)` without coerce or fillna).\n2. Numeric domain bounds and categorical\
      \ validity (`satisfies`, `isContainedIn`, `isNonNegative`):\n   - Set to \"\
      error\" level because out-of-domain numeric data (e.g. ratings outside [0, 10],\
      \ metascores outside [0, 100], negative votes/runtimes) or invalid categories\
      \ silently corrupt downstream business logic, models, and filtered sets.\n3.\
      \ Strict uniqueness:\n   - Set `.isUnique(column)` to \"error\" level when strict\
      \ uniqueness is required by `set_index(..., verify_integrity=True)`.\n\nSet\
      \ level \"warning\" ONLY for non-critical secondary checks where failure neither\
      \ crashes nor degrades task output:\n- Relaxed uniqueness ratio (`hasUniqueness`,\
      \ `hasDistinctness`, `hasUniqueValueRatio`) when uniqueness is not strictly\
      \ required by `verify_integrity=True`.\n- Statistical distribution moments and\
      \ quantiles (`hasApproxQuantile`, `hasMean`, `hasStandardDeviation`, `hasCorrelation`).\n\
      - String length checks (`hasMinLength`, `hasMaxLength`) unless string length\
      \ is strictly constrained by a fixed-width schema or crash-prone parsing.\n\
      - Secondary data type checks (`hasDataType`) when minimum completeness is already\
      \ checked at \"error\" level.\n\nConstraint Precision and Avoiding False Alarms:\n\
      - Tolerating Safe Partitions:\n  * When using `.satisfies()`, `.isContainedIn()`,\
      \ or `.isNonNegative()`, ALWAYS provide an assertion threshold (e.g., `lambda\
      \ x: x >= 0.95` or `lambda x: x >= 0.90`).\n  * Omitting the assertion lambda\
      \ enforces 100% strictness (x == 1.0). In real data partitions, a single benign\
      \ outlier or formatting artifact in an otherwise safe partition causes a false\
      \ alarm (false negative) that destroys fail precision. A 90%-95% threshold tolerates\
      \ minor noise while reliably flagging corrupt partitions.\n- Numeric Ranges\
      \ and Bounds:\n  * Spark SQL NaN Pitfall on Fractional Columns:\n    In Spark\
      \ SQL, `MAX(column)` on a `Fractional` (Float/Double) column containing `NaN`\
      \ returns `NaN`, causing `.hasMax()` to fail unconditionally on valid clean\
      \ data containing NaNs.\n    - For `Fractional` columns, use `.satisfies`:\n\
      \      `.satisfies('`col` IS NULL OR isnan(`col`) OR (`col` >= min_val AND `col`\
      \ <= max_val)', 'col_in_range', lambda x: x >= 0.95)`\n      or for upper bound:\
      \ `.satisfies('`col` IS NULL OR isnan(`col`) OR `col` <= max_val', 'col_upper_bound',\
      \ lambda x: x >= 0.95)`\n    - For non-negativity: `.satisfies('`col` IS NULL\
      \ OR isnan(`col`) OR `col` >= 0', 'col_non_negative', lambda x: x >= 0.95)`\
      \ or `.isNonNegative('col', lambda x: x >= 0.95)`.\n  * Integral Columns:\n\
      \    `isnan()` in Spark SQL is valid ONLY for floating-point types; calling\
      \ `isnan()` on an `Integral` column raises an AnalysisException. For Integral\
