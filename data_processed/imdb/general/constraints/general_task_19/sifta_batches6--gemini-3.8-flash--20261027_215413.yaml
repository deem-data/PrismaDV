      \ used in formulas or scoring logic if it is never referenced in those calculations\
      \ in this specific script.\n2. Operations and transformations: type casting,\
      \ missing value handling, string parsing, regex extraction, filtering, and mathematical\
      \ operations directly applied to the target column. Ensure the initial reading\
      \ or coercion line (e.g. `df['col'] = pd.to_numeric(...)`) is strictly captured.\n\
      3. Downstream dataflow: lines where variables directly derived from the target\
      \ column are transformed, used in formulas, or passed to downstream functions.\n\
      \   - Strict variable lineage: Include downstream lines ONLY if a variable computed\
      \ from the target column is directly consumed on that line. Do NOT include lines\
      \ operating on unrelated columns or generic DataFrame modifications (e.g., do\
      \ not include unrelated identifiers, ranking, or filtering on other columns\
      \ when tracking `Meta_score`, `Star3`, or `Star4`).\n4. Output schema and persistence:\
      \ lines where the target column or its derived products are included in export\
      \ column lists (e.g., `out_cols = [..., 'col', ...]`), selected for final tables,\
      \ or written to output sinks (`.to_csv`, `.to_parquet`).\n   - Passthrough columns:\
