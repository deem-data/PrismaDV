    assumption_generation: "Analyze how the target column is used in the focused code\
      \ and downstream task to determine the input data assumptions required for the\
      \ code to run correctly and produce valid results.\n\nGuidelines:\n1. Ground\
      \ assumptions strictly in the code and downstream semantics:\n   - Identify\
      \ critical requirements where corrupt data would cause runtime crashes (e.g.,\
      \ astype, set_index(verify_integrity=True), unhandled regex parsing) OR silent\
      \ logical corruption (e.g., overwriting records in dictionaries, invalid URLs\
      \ in exported media recommendations, broken index integrity, distorted rankings/scores).\n\
      2. Distinguish tolerance vs. critical requirement:\n   - Code-level tolerance:\
      \ If the script uses `.fillna(...)`, `errors='coerce'`, or `.clip(...)`, the\
      \ code explicitly tolerates a reasonable proportion of missing or unparseable\
      \ values. Do NOT assume 100% completeness or strict unyielding types. State\
      \ that the column should have high completeness (e.g., >= 85-90%) rather than\
      \ perfect completeness.\n   - Semantic requirement: If a column serves as a\
      \ key (e.g., 'Series_Title' combined with 'Released_Year' for indexing or dict\
      \ mapping), assume uniqueness or high distinctness is required to avoid losing\
      \ title records. If a column represents URLs (e.g., 'Poster_Link'), assume values\
      \ must conform to valid URL structure for downstream licensing/display.\n3.\
      \ Dataset-specific domain patterns (IMDB / Media datasets):\n   - 'Poster_Link':\
      \ Expected to be valid HTTP/HTTPS URLs; passing through non-URL strings corrupts\
      \ downstream catalog display.\n   - 'Series_Title': Primary text identifier;\
      \ must be non-empty string and maintain key uniqueness when paired with 'Released_Year'.\n\
      \   - 'No_of_Votes': Numeric vote count; code typically tolerates missing values\
      \ via fillna(0) or coercion, but requires valid non-negative numbers for logarithmic\
      \ popularity calculations.\n   - 'IMDB_Rating': Quality rating bounded in [0.0,\
      \ 10.0].\n   - 'Runtime': Duration string matching patterns like r'(\\d+) min'\
      \ or r'(\\d+)'.\n   - 'Certificate': Categorical rating (e.g., 'U', 'UA', 'A',\
      \ 'PG', 'R'); code often maps known categories to weights and defaults unmapped\
      \ values.\n4. Pass-through and export columns:\n   - If a column is retained\
      \ in output lists (e.g., out_cols) or passed through to persistent results,\
      \ it must exist and maintain valid semantic format.\n\nOutput only valid JSON\
      \ (numbers without leading zeros): { \"assumptions\": [{ \"text\": str, \"sources\"\
