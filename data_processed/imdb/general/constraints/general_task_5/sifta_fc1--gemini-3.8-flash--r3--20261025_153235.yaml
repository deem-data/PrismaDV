    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Rules:\n- MANDATORY ERROR LEVEL FOR FUNCTIONAL CHECKS:\n  -\
      \ Set level \"error\" for any constraint verifying a primary semantic requirement\
      \ (e.g., URL format via .containsURL, key uniqueness via .hasUniqueness/.isUnique,\
      \ valid numeric bounds, or category membership) if violating it would cause\
      \ crashes or silent downstream corruption (e.g., broken index integrity, lost\
      \ records in dict mappings, unusable URLs in licensing outputs).\n  - CRITICAL:\
      \ Do NOT downgrade core format or uniqueness checks to \"warning\". Warning-level\
      \ checks NEVER reject unsafe partitions. A suite with only warnings or overly\
      \ generic completeness checks misses all corrupted data.\n  - Set level \"warning\"\
      \ ONLY for purely informational checks where downstream code completely and\
      \ harmlessly neutralizes violations without corrupting output results.\n\nConstraint\
      \ Construction & Precision Rules:\n- Avoid False Alarms from Overly Strict Completeness:\n\
      \  - NEVER use `.isComplete('col')` as an \"error\" check if:\n    1. The code\
      \ explicitly handles nulls via `.fillna()`, `dropna()`, default dict gets, or\
      \ `errors='coerce'`.\n    2. OR `target_column_desc` indicates observed completeness\
      \ < 1.0.\n  - In such cases, use `.hasCompleteness('col', lambda x: x >= 0.90)`\
      \ (or 0.85) to tolerate benign missingness while catching catastrophic data\
      \ loss, or omit completeness if nulls are safely imputed.\n- Use Assertion Thresholds\
      \ to Prevent False Alarms:\n  - For constraints like `hasDataType`, `isNonNegative`,\
      \ `isPositive`, `hasPattern`, `containsURL`, and `hasUniqueness`, ALWAYS include\
      \ an assertion threshold lambda (e.g., `lambda x: x >= 0.90` or `lambda x: x\
