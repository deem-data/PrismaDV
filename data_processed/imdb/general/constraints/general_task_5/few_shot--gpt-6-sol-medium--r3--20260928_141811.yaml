constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda x: x >= 0.85)'
      - Valid
    - - .satisfies("Certificate IS NULL OR TRIM(Certificate) = '' OR TRIM(Certificate)
        IN ('G', 'PG', 'PG-13', 'R', 'NC-17', 'U', 'UA', 'A', '12', '12A', '15', '18')",
        'valid_certificate_when_present')
      - Invalid
    - - .satisfies("NOT (Genre RLIKE '(^|,) *(Family|Animation) *(,|$)' AND TRIM(Certificate)
        IN ('R', 'NC-17'))", 'family_animation_certificate_policy')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    - - .satisfies("TRIM(Genre) RLIKE '^(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)
        *(, *(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)
        *)*$'", 'valid_genre_tokens')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda x: x >= 0.8)'
      - Valid
    - - .satisfies("Gross IS NULL OR TRIM(Gross) RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parseable_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating >= 0 AND IMDB_Rating <= 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompleteness(''Meta_score'', lambda x: x >= 0.8)'
      - Valid
    - - .satisfies('Meta_score IS NULL OR (Meta_score >= 0 AND Meta_score <= 100)',
        'valid_meta_score_when_present')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .satisfies('No_of_Votes >= 1', 'positive_vote_count')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    - - .satisfies("TRIM(Poster_Link) RLIKE '^https?://[^ ]+$'", 'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies("CAST(Released_Year AS STRING) RLIKE '^[0-9]{4}$' AND CAST(Released_Year
        AS INT) BETWEEN 1888 AND YEAR(CURRENT_DATE())", 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("TRIM(Runtime) RLIKE '^[0-9]{2,3} min$' AND CAST(REGEXP_EXTRACT(TRIM(Runtime),
        '^[0-9]{2,3}', 0) AS INT) > 0", 'valid_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .satisfies("LENGTH(TRIM(Series_Title)) > 0", 'non_empty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
