        end_line: 121
        file: ''
      - start_line: 150
        end_line: 156
        file: ''
      uid: eaf49974-1c52-42d4-bc0b-f9bd5179b9db
    - text: Among rows with a four-digit 'Released_Year', non-null 'Gross' values
        should represent numeric amounts that become parseable after commas are removed,
        such as '1234567' or '1,234,567'. Values containing currency symbols or other
        nonnumeric text would be silently excluded from the Gross tie-breaker.
      sources:
      - start_line: 99
        end_line: 102
        file: ''
      - start_line: 119
        end_line: 121
        file: ''
      - start_line: 150
        end_line: 154
        file: ''
      uid: 09b6fba1-aa37-46fe-a249-fdb181a72bb4
    - text: Parseable 'Gross' amounts should be finite and nonnegative. Gross represents
        an amount, and the tie-breaker applies log1p to parsed values; negative amounts
        can make that calculation invalid or distort the ordering.
      sources:
      - start_line: 120
        end_line: 121
        file: ''
      - start_line: 150
        end_line: 154
        file: ''
