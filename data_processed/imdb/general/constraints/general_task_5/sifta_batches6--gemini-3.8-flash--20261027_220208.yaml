  instructions:
    dataflow_inspector: "Identify every line of the code script relevant to the target\
      \ column. Be thorough and check for:\n1. Exact column references: lines where\
      \ the target column name appears as an exact string literal or identifier (e.g.,\
      \ `df['col']`, `df[['col', ...]]`, `.drop_duplicates(subset=['col'])`, `df.set_index(...,\
