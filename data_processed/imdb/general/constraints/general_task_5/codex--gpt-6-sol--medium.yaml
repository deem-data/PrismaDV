prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\nimport re\nfrom datetime import datetime\n\nimport numpy\
  \ as np\nimport pandas as pd\n\n\ndef safe_slug(s: str) -> str:\n    s = s.lower()\n\
  \    s = re.sub(r\"[^a-z0-9]+\", \"-\", s)\n    return s.strip(\"-\")\n\n\ndef build_card(row):\n\
  \    title = str(row[\"Series_Title\"]).strip()\n    year = int(row[\"Year\"])\n\
  \    cert = row.get(\"Certificate\", None)\n    cert_text = f\"<span class=\\\"\
  cert\\\">{cert}</span>\" if pd.notna(cert) and cert != \"\" else \"\"\n    rating\
  \ = row.get(\"IMDB_Rating\", np.nan)\n    ms = row.get(\"Meta_score\", np.nan)\n\
  \    votes = row.get(\"No_of_Votes\", np.nan)\n    poster = str(row[\"Poster_Link\"\
  ]).strip()\n    score = row.get(\"Score\", np.nan)\n    score_text = f\"<span class=\\\
  \"score\\\">{score:.3f}</span>\" if pd.notna(score) else \"\"\n    rating_text =\
  \ f\"<span class=\\\"rating\\\">IMDb {rating:.1f}</span>\" if pd.notna(rating) else\
  \ \"\"\n    meta_text = f\"<span class=\\\"meta\\\">Meta {int(ms)}</span>\" if pd.notna(ms)\
  \ else \"\"\n    votes_text = f\"<span class=\\\"votes\\\">{int(votes):,} votes</span>\"\
  \ if pd.notna(votes) else \"\"\n    slug = safe_slug(f\"{title}-{year}\")\n    card\
  \ = f\"\"\"\n    <a class=\\\"card\\\" id=\\\"{slug}\\\" href=\\\"{poster}\\\" target=\\\
  \"_blank\\\" rel=\\\"noopener noreferrer\\\">\n        <img src=\\\"{poster}\\\"\
  \ alt=\\\"{title} ({year})\\\" loading=\\\"lazy\\\"/>\n        <div class=\\\"meta\\\
  \">\n            <div class=\\\"title\\\">{title} ({year}) {cert_text}</div>\n \
  \           <div class=\\\"stats\\\">{rating_text} {meta_text} {votes_text} {score_text}</div>\n\
  \        </div>\n    </a>\n    \"\"\"\n    return card\n\n\ndef build_html(top_df:\
  \ pd.DataFrame, output_html_path: str):\n    css = \"\"\"\n    <style>\n    body\
  \ { font-family: Arial, sans-serif; margin: 0; padding: 0 12px 48px; background:\
  \ #0b0e14; color: #e6e6e6; }\n    h1 { margin: 16px 0; }\n    h2 { margin-top: 32px;\
  \ border-bottom: 1px solid #2a2e38; padding-bottom: 4px; }\n    h3 { margin-top:\
  \ 20px; color: #a6accd; }\n    .grid { display: grid; grid-template-columns: repeat(auto-fill,\
  \ minmax(180px, 1fr)); gap: 12px; }\n    .card { display: block; background: #111522;\
  \ border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; border:\
  \ 1px solid #1b2233; }\n    .card img { width: 100%; height: 270px; object-fit:\
  \ cover; display: block; background: #222; }\n    .card .meta { padding: 8px; }\n\
  \    .card .title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }\n \
  \   .card .stats { font-size: 12px; color: #c6c9d0; display: flex; flex-wrap: wrap;\
  \ gap: 6px; }\n    .card .cert { background: #25324a; color: #c3e88d; padding: 1px\
  \ 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; }\n    .card .rating\
  \ { color: #ffd166; }\n    .card .meta { color: #7bdff2; }\n    .card .votes { color:\
  \ #c0c0c0; }\n    .card .score { color: #80cbc4; margin-left: auto; }\n    </style>\n\
  \    \"\"\"\n\n    sections = [\"<html><head><meta charset=\\\"utf-8\\\"/>\" + css\
  \ + \"</head><body>\"]\n    sections.append(\"<h1>Genre-by-Decade Leaderboards</h1>\"\
  )\n\n    for decade, df_dec in top_df.groupby(\"Decade_Label\", sort=True):\n  \
  \      sections.append(f\"<h2>{decade}</h2>\")\n        for genre, df_gen in df_dec.groupby(\"\
  GenreToken\", sort=True):\n            sections.append(f\"<h3>{genre}</h3>\")\n\
  \            sections.append(\"<div class=\\\"grid\\\">\")\n            for _, row\
  \ in df_gen.sort_values([\"Rank\", \"Score\"], ascending=[True, False]).iterrows():\n\
  \                sections.append(build_card(row))\n            sections.append(\"\
  </div>\")\n\n    sections.append(\"</body></html>\")\n    html = \"\\n\".join(sections)\n\
  \    with open(output_html_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(html)\n\
  \n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input, 'new_data.csv')\n\
  \    df = pd.read_csv(input_csv)\n\n    # Basic trimming for fields we use\n   \
  \ for col in [\"Series_Title\", \"Released_Year\", \"Runtime\", \"Genre\", \"Poster_Link\"\
  , \"Certificate\"]:\n        if col in df.columns:\n            df[col] = df[col].astype(str).str.strip()\n\
  \    # Validate Released_Year format and range before deriving decade\n    year_str\
  \ = df[\"Released_Year\"].astype(str).str.strip()\n    current_year = datetime.now().year\n\
  \    year_fullmatch_mask = year_str.str.fullmatch(r\"\\d{4}\")\n    year_int_try\
  \ = pd.to_numeric(year_str.where(year_fullmatch_mask), errors=\"coerce\")\n    #\
  \ Keep rows with plain 4-digit years for downstream use\n    df = df.loc[year_fullmatch_mask].copy()\n\
  \    df[\"Year\"] = year_str.loc[year_fullmatch_mask].astype(int)\n    df[\"Decade\"\
  ] = (df[\"Year\"] // 10) * 10\n    df[\"Decade_Label\"] = df[\"Decade\"].astype(str)\
  \ + \"s\"\n\n    # Validate and parse runtime\n    runtime_s = df[\"Runtime\"].astype(str).str.strip()\n\
  \    runtime_match = runtime_s.str.fullmatch(r\"\\d{2,3} min\")\n    df[\"Runtime_Min\"\
  ] = pd.to_numeric(runtime_s.str.extract(r\"(\\d{2,3})\", expand=False), errors=\"\
  coerce\").astype(int)\n\n    # Validate IMDB_Rating before scoring\n    imdb = pd.to_numeric(df[\"\
  IMDB_Rating\"], errors=\"coerce\")\n    # Validate No_of_Votes before log transform\n\
  \    votes = pd.to_numeric(df[\"No_of_Votes\"], errors=\"coerce\")\n    # Validate\
  \ Meta_score completeness and bounds before scoring\n    meta = pd.to_numeric(df[\"\
  Meta_score\"], errors=\"coerce\")\n    # Validate Gross parseability and coverage\
  \ before using as tie breaker\n    gross_str = df[\"Gross\"].astype(str)\n    gross_num_try\
  \ = pd.to_numeric(gross_str.str.replace(\",\", \"\", regex=False), errors=\"coerce\"\
  )\n    df[\"Gross_Num\"] = pd.to_numeric(df[\"Gross\"].astype(str).str.replace(\"\
  ,\", \"\", regex=False), errors=\"coerce\")\n\n    # Validate Genre structure before\
  \ exploding\n    allowed_genres = {\n        \"Action\", \"Adventure\", \"Animation\"\
  , \"Biography\", \"Comedy\", \"Crime\", \"Drama\", \"Family\", \"Fantasy\", \"Film-Noir\"\
  ,\n        \"History\", \"Horror\", \"Music\", \"Musical\", \"Mystery\", \"Romance\"\
  , \"Sci-Fi\", \"Sport\", \"Thriller\", \"War\", \"Western\"\n    }\n    genre_lists\
  \ = df[\"Genre\"].astype(str).str.split(\",\").map(lambda x: [t.strip() for t in\
  \ x if t.strip() != \"\"])\n    df[\"GenreTokens\"] = genre_lists\n\n    # Validate\
  \ Certificate domain and coverage before content-policy filtering\n    allowed_cert\
  \ = {\"G\", \"PG\", \"PG-13\", \"R\", \"NC-17\", \"U\", \"UA\", \"A\", \"12\", \"\
  12A\", \"15\", \"18\"}\n    cert = df[\"Certificate\"].replace({\"nan\": np.nan})\n\
  \    # If Family or Animation appears, Certificate must not be R/NC-17\n    # Validate\
  \ Poster_Link before card rendering\n    posters = df[\"Poster_Link\"].astype(str).str.strip()\n\
  \    # Validate correlation and conditional voting behavior\n    # Scoring\n   \
  \ rating_norm = pd.to_numeric(df[\"IMDB_Rating\"], errors=\"coerce\") / 10.0\n \
  \   meta_norm = pd.to_numeric(df[\"Meta_score\"], errors=\"coerce\") / 100.0\n \
  \   meta_norm = meta_norm.fillna(meta_norm.median())\n    vote_norm = np.log10(pd.to_numeric(df[\"\
  No_of_Votes\"], errors=\"coerce\").clip(lower=1)) / 6.0\n    # Mild runtime pacing\
  \ factor around 120 minutes\n    pacing = 1.0 - (np.abs(df[\"Runtime_Min\"] - 120)\
  \ / 300.0)\n    pacing = pacing.clip(lower=0.8, upper=1.05)\n\n    base_score =\
  \ 0.6 * rating_norm + 0.25 * meta_norm + 0.15 * vote_norm\n    df[\"Score\"] = (base_score\
  \ * pacing).astype(float)\n\n    # Tie-breaker using Gross (normalized)\n    if\
  \ df[\"Gross_Num\"].notna().any():\n        gross_norm = np.log1p(df[\"Gross_Num\"\
  ].fillna(df[\"Gross_Num\"].median()))\n        denom = float(gross_norm.max()) if\
  \ float(gross_norm.max()) > 0 else 1.0\n        df[\"Gross_Tie\"] = gross_norm /\
  \ denom\n    else:\n        df[\"Gross_Tie\"] = 0.0\n\n    # Explode by genre token\
  \ for genre-specific leaderboards\n    exploded = df.explode(\"GenreTokens\").rename(columns={\"\
  GenreTokens\": \"GenreToken\"})\n\n    # Rank within each (Decade, Genre)\n    exploded\
  \ = exploded.sort_values([\"Decade_Label\", \"GenreToken\", \"Score\", \"Gross_Tie\"\
  ],\n                                    ascending=[True, True, False, False])\n\
  \    exploded[\"Rank\"] = exploded.groupby([\"Decade_Label\", \"GenreToken\"])['Score'].rank(method=\"\
  first\", ascending=False)\n\n    TOP_K = 10\n    top_k = exploded.loc[exploded[\"\
  Rank\"] <= TOP_K].copy()\n\n    # Persist outputs\n    os.makedirs(args.output,\
  \ exist_ok=True)\n    out_csv = os.path.join(args.output, \"genre_by_decade_leaderboards.csv\"\
  )\n    cols = [\n        \"Decade_Label\", \"GenreToken\", \"Rank\", \"Series_Title\"\
  , \"Year\", \"Certificate\", \"IMDB_Rating\", \"Meta_score\",\n        \"No_of_Votes\"\
  , \"Runtime\", \"Score\", \"Poster_Link\"\n    ]\n    top_k[cols].to_csv(out_csv,\
  \ index=False)\n\n    out_html = os.path.join(args.output, \"leaderboards.html\"\
  )\n    build_html(top_k, out_html)\n\n    # Also emit a compact JSON index if needed\
  \ by downstream services\n    out_json = os.path.join(args.output, \"leaderboards_index.json\"\
  )\n    grouped = []\n    for (decade, genre), grp in top_k.groupby([\"Decade_Label\"\
  , \"GenreToken\"]):\n        items = [\n            {\n                \"series_title\"\
  : str(r[\"Series_Title\"]).strip(),\n                \"year\": int(r[\"Year\"]),\n\
  \                \"certificate\": None if pd.isna(r[\"Certificate\"]) else str(r[\"\
  Certificate\"]),\n                \"imdb_rating\": None if pd.isna(r[\"IMDB_Rating\"\
  ]) else float(r[\"IMDB_Rating\"]),\n                \"meta_score\": None if pd.isna(r[\"\
  Meta_score\"]) else float(r[\"Meta_score\"]),\n                \"votes\": None if\
  \ pd.isna(r[\"No_of_Votes\"]) else int(r[\"No_of_Votes\"]),\n                \"\
  runtime\": str(r[\"Runtime\"]),\n                \"score\": float(r[\"Score\"]),\n\
  \                \"poster_link\": str(r[\"Poster_Link\"]).strip(),\n           \
  \     \"rank\": int(r[\"Rank\"]) if not pd.isna(r[\"Rank\"]) else None\n       \
  \     }\n            for _, r in grp.sort_values([\"Rank\", \"Score\"], ascending=[True,\
  \ False]).iterrows()\n        ]\n        grouped.append({\"decade\": decade, \"\
  genre\": genre, \"items\": items})\n\n    with open(out_json, \"w\", encoding=\"\
  utf-8\") as f:\n        json.dump({\"groups\": grouped}, f, ensure_ascii=False)\n\
  \n\nif __name__ == \"__main__\":\n    main()\n\n```\n\nThe same program is on disk\
