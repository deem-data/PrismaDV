      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c27c7427-5889-4e64-b716-b833b12593b8
      source_assumptions:
      - f6535bf2-d156-4ba1-88ad-ebcf50b06821
    - suggestion: .satisfies("`Meta_score` IS NULL OR try_cast(`Meta_score` AS DOUBLE)
        = FLOOR(try_cast(`Meta_score` AS DOUBLE))", "meta_score_whole_number")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 23a56d5e-cd87-48d3-9957-1e5c17d44e43
      source_assumptions:
      - be8a80e6-85a1-4c36-8f30-f5550a1ddce1
    assumptions:
    - text: The 'Meta_score' column may contain null values; the scoring code fills
        missing numeric scores with the median. However, at least one row retained
        after the four-digit Released_Year filter should have a non-null, numeric
        Meta_score so that the median is defined.
      sources:
      - start_line: 99
        end_line: 103
        file: ''
      - start_line: 140
        end_line: 141
        file: ''
      uid: 0f3f5df9-b4a3-4b5b-86ff-e606719eaa59
    - text: Every non-null 'Meta_score' should be parseable as a finite number. Unparseable
        values are coerced to missing for scoring but are not replaced in the original
        column, which is later converted with int() for HTML and float() for JSON.
      sources:
      - start_line: 117
        end_line: 117
        file: ''
      - start_line: 140
        end_line: 141
        file: ''
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 191
        end_line: 191
        file: ''
      uid: 96b6bf5e-987a-4ba3-ae57-148703b351b6
    - text: Non-null 'Meta_score' values should be within 0 to 100, inclusive, because
        the scoring formula divides them by 100 to form a normalized score.
      sources:
      - start_line: 116
        end_line: 117
        file: ''
      - start_line: 140
        end_line: 147
        file: ''
      uid: f6535bf2-d156-4ba1-88ad-ebcf50b06821
    - text: Non-null 'Meta_score' values should be whole-number scores (values such
        as 78.0 are acceptable). The HTML card displays int(ms), which would otherwise
        silently truncate a fractional score.
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      uid: be8a80e6-85a1-4c36-8f30-f5550a1ddce1
