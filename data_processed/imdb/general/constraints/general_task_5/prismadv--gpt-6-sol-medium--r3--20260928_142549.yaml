      source_assumptions:
      - 0f3f5df9-b4a3-4b5b-86ff-e606719eaa59
    - suggestion: .satisfies("`Meta_score` IS NULL OR try_cast(`Meta_score` AS DOUBLE)
        BETWEEN -1.7976931348623157E308 AND 1.7976931348623157E308", "meta_score_parseable_and_finite")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: bcb5b971-bd9c-42a0-864a-4ea49f209d13
      source_assumptions:
      - 96b6bf5e-987a-4ba3-ae57-148703b351b6
    - suggestion: .satisfies("`Meta_score` IS NULL OR try_cast(`Meta_score` AS DOUBLE)
