      source_assumptions:
      - 341d8d2e-b2fd-4b51-82fc-911a27e88b81
    - suggestion: '.satisfies("CASE WHEN `Gross` IS NULL THEN TRUE WHEN regexp_replace(trim(CAST(`Gross`
        AS STRING)), '','', '''') RLIKE ''^[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?$''
        THEN CAST(regexp_replace(trim(CAST(`Gross` AS STRING)), '','', '''') AS DOUBLE)
        >= 0 ELSE TRUE END", ''Parseable Gross values are non-negative'', lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: db9c12da-30b4-4c64-896d-a85614c37fe2
      source_assumptions:
      - 181d12f7-bd3b-4a3f-b38f-adfb3e9e7451
    assumptions:
    - text: The input data should contain a 'Gross' column. The code accesses it directly,
        although individual values may be null because numeric conversion coerces
        them to missing values and the tie-breaker handles missing values.
      sources:
      - start_line: 119
        end_line: 121
        file: ''
      - start_line: 151
        end_line: 156
        file: ''
      uid: 3195fb8e-84a4-4820-b985-5f777217fb1d
    - text: Non-null 'Gross' values should be numeric strings after commas are removed,
        such as '1234567' or '1,234,567'. Other non-null formats are coerced to missing
        values and cannot contribute to the gross tie-breaker.
      sources:
      - start_line: 119
        end_line: 121
        file: ''
      - start_line: 150
        end_line: 154
        file: ''
      uid: 341d8d2e-b2fd-4b51-82fc-911a27e88b81
    - text: Parseable 'Gross' values should be non-negative. The code applies log1p
        to the parsed values, and gross revenue used as a tie-breaker is expected
        to be at least zero.
      sources:
      - start_line: 121
        end_line: 121
        file: ''
      - start_line: 151
        end_line: 154
        file: ''
      uid: 181d12f7-bd3b-4a3f-b38f-adfb3e9e7451
  IMDB_Rating:
    code:
    - suggestion: '.satisfies("CASE WHEN TRIM(CAST(`Released_Year` AS STRING)) RLIKE
        ''^[0-9]{4}$'' THEN `IMDB_Rating` IS NOT NULL AND TRIM(CAST(`IMDB_Rating`
