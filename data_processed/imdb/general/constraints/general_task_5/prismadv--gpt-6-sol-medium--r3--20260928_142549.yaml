      source_assumptions:
      - 73ef4e70-b878-4f21-bf50-ff42f1a46177
      - 94a4f1d7-7405-40f2-8696-b7c86a350673
    - suggestion: '.satisfies("CASE WHEN `IMDB_Rating` IS NULL THEN TRUE WHEN TRIM(CAST(`IMDB_Rating`
        AS STRING)) RLIKE ''^[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?$''
        THEN CAST(`IMDB_Rating` AS DOUBLE) BETWEEN 1 AND 10 ELSE FALSE END", "imdb_rating_on_1_to_10_scale",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a653eb1b-0659-4fbb-aeba-ffd0217c9491
      source_assumptions:
      - 0d12a7aa-61df-41f0-b8d1-57cfd86de0cc
    assumptions:
    - text: The input must contain an 'IMDB_Rating' column. The code accesses it directly
        when calculating scores.
      sources:
      - start_line: 139
        end_line: 139
        file: ''
      uid: 73ef4e70-b878-4f21-bf50-ff42f1a46177
    - text: For rows with a four-digit Released_Year, every IMDB_Rating should be
        non-null and parseable as a finite number. Missing or unparseable ratings
        become null scores, and the code does not fill them before ranking films.
      sources:
      - start_line: 102
        end_line: 102
        file: ''
      - start_line: 139
        end_line: 148
        file: ''
      - start_line: 162
        end_line: 167
        file: ''
      uid: 94a4f1d7-7405-40f2-8696-b7c86a350673
    - text: IMDB_Rating should be on IMDb's 1-to-10 rating scale, inclusive. The code
        divides it by 10 for scoring and displays it as an IMDb rating; values outside
        that scale would produce misleading scores and cards.
      sources:
      - start_line: 28
        end_line: 28
        file: ''
      - start_line: 139
        end_line: 139
        file: ''
      - start_line: 147
        end_line: 148
        file: ''
      uid: 0d12a7aa-61df-41f0-b8d1-57cfd86de0cc
  Meta_score:
    code:
    - suggestion: '.satisfies("TRIM(CAST(`Released_Year` AS STRING)) RLIKE ''^[0-9]{4}$''
        AND try_cast(`Meta_score` AS DOUBLE) BETWEEN -1.7976931348623157E308 AND 1.7976931348623157E308",
        "numeric_meta_after_year_filter", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
