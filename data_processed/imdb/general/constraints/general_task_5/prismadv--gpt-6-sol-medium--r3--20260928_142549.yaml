    - suggestion: '.satisfies("`Gross` IS NULL OR regexp_replace(trim(CAST(`Gross`
        AS STRING)), '','', '''') RLIKE ''^[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?$''",
