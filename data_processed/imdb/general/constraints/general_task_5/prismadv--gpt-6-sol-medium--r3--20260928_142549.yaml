prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 0c49df61-6c17-4794-844e-b613564f3961
      source_assumptions:
      - fb3adb73-e8a7-4d01-9e19-3641f3e3d6fb
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.85)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 318bb789-e343-4975-aac2-c0def66c0487
      source_assumptions:
      - df83c14a-3b18-4f89-b7c8-0bba0300925b
    - suggestion: .satisfies("`Certificate` IS NULL OR trim(CAST(`Certificate` AS
        STRING)) = '' OR trim(CAST(`Certificate` AS STRING)) IN ('G', 'PG', 'PG-13',
        'R', 'NC-17', 'U', 'UA', 'A', '12', '12A', '15', '18')", 'Valid Certificate
        values')
      validity: false
      reason_if_invalid: 'Constraint ''.satisfies("`Certificate` IS NULL OR trim(CAST(`Certificate`
        AS STRING)) = '''' OR trim(CAST(`Certificate` AS STRING)) IN (''G'', ''PG'',
        ''PG-13'', ''R'', ''NC-17'', ''U'', ''UA'', ''A'', ''12'', ''12A'', ''15'',
        ''18'')", ''Valid Certificate values'')'' failed on data sample: Value: 0.9499165275459098
        does not meet the constraint requirement!'
      level: warning
      uid: d4cf8eb9-e093-4403-b004-d4755a6c8bef
      source_assumptions:
      - 9c420574-653f-4039-a7e3-5cc6c6ff5c75
    - suggestion: .satisfies("`Genre` IS NULL OR NOT (`Genre` RLIKE '(^|,)[[:space:]]*(Family|Animation)[[:space:]]*(,|$)')
        OR `Certificate` IS NULL OR trim(CAST(`Certificate` AS STRING)) NOT IN ('R',
        'NC-17')", 'Family and Animation certificate policy')
      validity: false
      reason_if_invalid: 'Constraint ''.satisfies("`Genre` IS NULL OR NOT (`Genre`
        RLIKE ''(^|,)[[:space:]]*(Family|Animation)[[:space:]]*(,|$)'') OR `Certificate`
        IS NULL OR trim(CAST(`Certificate` AS STRING)) NOT IN (''R'', ''NC-17'')",
        ''Family and Animation certificate policy'')'' failed on data sample: Value:
        0.998330550918197 does not meet the constraint requirement!'
      level: warning
      uid: 1bca0319-c691-45a9-9e78-3debd05f22b1
      source_assumptions:
      - aee40892-f036-4545-a888-763f6f7f1334
    assumptions:
    - text: The input data should contain a 'Certificate' column. Although card rendering
        uses row.get, the script later accesses the column directly and includes it
        in the output CSV.
      sources:
      - start_line: 131
        end_line: 133
        file: ''
      - start_line: 172
        end_line: 176
        file: ''
      uid: fb3adb73-e8a7-4d01-9e19-3641f3e3d6fb
    - text: The 'Certificate' column may contain nulls, but it should have substantial
        coverage (for example, at least 85% non-null values, consistent with the observed
        approximately 90% completeness). Nulls are converted to the string 'nan' during
        trimming and would otherwise appear as a certificate in the rendered HTML
        and JSON.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 189
        end_line: 189
        file: ''
      uid: df83c14a-3b18-4f89-b7c8-0bba0300925b
    - text: After trimming whitespace, each non-null, nonempty 'Certificate' value
        should be one of G, PG, PG-13, R, NC-17, U, UA, A, 12, 12A, 15, or 18. Values
        such as '12' are valid even if read as numeric. Unrecognized values would
        be displayed and exported without correction.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 131
        end_line: 133
        file: ''
      - start_line: 20
        end_line: 21
        file: ''
      uid: 9c420574-653f-4039-a7e3-5cc6c6ff5c75
    - text: For any input row whose comma-separated 'Genre' contains Family or Animation
        after trimming its tokens, 'Certificate' should not be R or NC-17. This is
        the content-policy condition stated in the code; the script does not itself
        enforce it.
      sources:
      - start_line: 123
        end_line: 134
        file: ''
      uid: aee40892-f036-4545-a888-763f6f7f1334
  Genre:
    code:
    - suggestion: '.satisfies("`Genre` IS NOT NULL AND TRIM(`Genre`) <> '''' AND LOWER(TRIM(`Genre`))
        NOT IN (''nan'', ''none'', ''null'', ''<na>'')", "Genre is present and nonblank",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 436f7d2d-3d1a-469f-9e99-b7748388c9b5
      source_assumptions:
      - 513d8218-6991-435b-a800-28b5be9804f9
    - suggestion: '.satisfies("SIZE(FILTER(TRANSFORM(SPLIT(`Genre`, '',''), x -> TRIM(x)),
        x -> x <> '''')) > 0", "Genre has at least one token", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2eface77-8de0-4d9e-bd24-9043027ce538
      source_assumptions:
      - 016d858f-cb22-44c4-87f9-2f02d8e7028d
    - suggestion: '.satisfies("FORALL(FILTER(TRANSFORM(SPLIT(`Genre`, '',''), x ->
        TRIM(x)), x -> x <> ''''), x -> x IN (''Action'', ''Adventure'', ''Animation'',
        ''Biography'', ''Comedy'', ''Crime'', ''Drama'', ''Family'', ''Fantasy'',
        ''Film-Noir'', ''History'', ''Horror'', ''Music'', ''Musical'', ''Mystery'',
        ''Romance'', ''Sci-Fi'', ''Sport'', ''Thriller'', ''War'', ''Western''))",
        "Genre tokens use allowed labels", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7b794cf5-ff9c-4a76-a69d-58ffad9c181a
      source_assumptions:
      - ea00e079-4644-4777-91e8-2e4d4ddffa84
    - suggestion: '.satisfies("SIZE(ARRAY_DISTINCT(FILTER(TRANSFORM(SPLIT(`Genre`,
        '',''), x -> TRIM(x)), x -> x <> ''''))) = SIZE(FILTER(TRANSFORM(SPLIT(`Genre`,
        '',''), x -> TRIM(x)), x -> x <> ''''))", "Genre tokens are not repeated",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 04fc2a2a-1122-49e5-b542-b3a0ee6d9d5b
      source_assumptions:
      - d67b1d79-eba3-41ce-a647-5b32187ed440
    - suggestion: '.satisfies("CASE WHEN ARRAY_CONTAINS(TRANSFORM(SPLIT(`Genre`, '',''),
        x -> TRIM(x)), ''Family'') OR ARRAY_CONTAINS(TRANSFORM(SPLIT(`Genre`, '',''),
        x -> TRIM(x)), ''Animation'') THEN COALESCE(TRIM(`Certificate`), '''') NOT
        IN (''R'', ''NC-17'') ELSE TRUE END", "Family and Animation certificate policy",
        lambda x: x == 1)'
      validity: false
      reason_if_invalid: 'Constraint ''.satisfies("CASE WHEN ARRAY_CONTAINS(TRANSFORM(SPLIT(`Genre`,
        '',''), x -> TRIM(x)), ''Family'') OR ARRAY_CONTAINS(TRANSFORM(SPLIT(`Genre`,
        '',''), x -> TRIM(x)), ''Animation'') THEN COALESCE(TRIM(`Certificate`), '''')
        NOT IN (''R'', ''NC-17'') ELSE TRUE END", "Family and Animation certificate
        policy", lambda x: x == 1)'' failed on data sample: Value: 0.996661101836394
        does not meet the constraint requirement!'
      level: warning
      uid: 5bfd62d4-7015-4e27-a1e8-d79db0aa159e
      source_assumptions:
      - 127e2fbb-ab27-4335-97c1-909593dcffca
    assumptions:
    - text: The input must contain a 'Genre' column. Its values should be non-null,
        non-blank strings, including after trimming whitespace. Missing values converted
        to strings (such as 'nan') or blank values would otherwise become invalid
        genre tokens or cause a film to be omitted from the leaderboards.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 128
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 159
        file: ''
      uid: 513d8218-6991-435b-a800-28b5be9804f9
    - text: Each 'Genre' value should contain at least one non-empty genre token.
        Tokens are separated by commas and may have surrounding whitespace; an empty
        string or a value made up only of commas and whitespace yields no leaderboard
        entry.
      sources:
      - start_line: 128
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 159
        file: ''
      uid: 016d858f-cb22-44c4-87f9-2f02d8e7028d
    - text: 'After splitting each ''Genre'' value on commas and trimming each token,
        every non-empty token should exactly match one of: Action, Adventure, Animation,
        Biography, Comedy, Crime, Drama, Family, Fantasy, Film-Noir, History, Horror,
        Music, Musical, Mystery, Romance, Sci-Fi, Sport, Thriller, War, or Western.
        The code uses tokens directly as grouping labels and does not normalize their
        case or spelling.'
      sources:
      - start_line: 123
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 164
        file: ''
      uid: ea00e079-4644-4777-91e8-2e4d4ddffa84
    - text: A 'Genre' value should not repeat the same token after whitespace trimming.
        Repeated tokens would create duplicate entries for one film in the same genre-and-decade
        leaderboard.
      sources:
      - start_line: 128
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 167
        file: ''
      uid: d67b1d79-eba3-41ce-a647-5b32187ed440
    - text: If 'Genre' contains a Family or Animation token, the corresponding 'Certificate'
        value should not be R or NC-17, as specified by the script's content-policy
        comment.
      sources:
      - start_line: 128
        end_line: 134
        file: ''
      uid: 127e2fbb-ab27-4335-97c1-909593dcffca
  Gross:
    code:
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0.0)'
