      - start_line: 24
        end_line: 30
        file: ''
      - start_line: 192
        end_line: 192
        file: ''
      uid: 3f9f58a5-cc76-44e1-a0c7-878ee3fd928a
    - text: Every 'No_of_Votes' value should be non-negative, as the column represents
