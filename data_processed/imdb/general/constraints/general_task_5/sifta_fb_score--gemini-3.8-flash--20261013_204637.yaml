      \ rows and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .isPositive('credits_attempted')\n\
      \  - .isPositive('credits_attempted', lambda x: x >= 0.95)\nName: isLessThan,\
      \ Description: Validates that values in columnA are less than corresponding\
