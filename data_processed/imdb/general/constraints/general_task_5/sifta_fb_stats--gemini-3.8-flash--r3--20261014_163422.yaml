      \ code explicitly tolerates or safely handles the violation (e.g., via fillna,\
      \ errors='coerce', clipping, or fallback defaults) without compromising the\
      \ correctness of downstream tasks.\n\nLink each check to the indices (from 0)\
      \ of the assumptions it tests. Ensure constraints match PyDeequ syntax accurately\
      \ and do not impose overly tight thresholds that cause false alarms on safe\
      \ data partitions.\n\nOutput: {\"constraint_code\": [{\"suggestion\": PyDeequ\
      \ code (starting with \".\" or a function), \"level\": \"warning\"|\"error\"\
      , \"linked assumptions\": [indices]}, ...]}\n\nAvailable Row-Level Functions:\n\
