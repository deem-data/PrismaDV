      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 133
        end_line: 133
        file: ''
      - start_line: 189
        end_line: 189
        file: ''
      uid: b0553e6a-bc90-4292-90fb-27a5c172384a
    - text: 'When present, values in the ''Certificate'' column are expected to belong
