      source_assumptions:
      - 42e53d6c-d5bb-45cc-8dc7-30cea522a677
    - suggestion: '.satisfies("`Genre` IS NOT NULL AND size(filter(transform(split(`Genre`,
        '',''), x -> trim(x)), x -> x NOT IN (''Action'', ''Adventure'', ''Animation'',
        ''Biography'', ''Comedy'', ''Crime'', ''Drama'', ''Family'', ''Fantasy'',
        ''Film-Noir'', ''History'', ''Horror'', ''Music'', ''Musical'', ''Mystery'',
        ''Romance'', ''Sci-Fi'', ''Sport'', ''Thriller'', ''War'', ''Western'')))
