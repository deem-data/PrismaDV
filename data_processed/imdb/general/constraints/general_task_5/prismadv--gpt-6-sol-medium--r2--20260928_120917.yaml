      source_assumptions:
      - 482a3a89-90fa-4013-9d1b-4a5f4ed906e8
    assumptions:
    - text: The input data should contain a 'Meta_score' column. The code accesses
        it directly when calculating scores and writing the leaderboard CSV.
      sources:
      - start_line: 140
        end_line: 141
        file: ''
      - start_line: 172
        end_line: 176
        file: ''
      uid: 12fe2d48-6d28-4d97-a266-38cefb6e6919
    - text: Every non-null 'Meta_score' value should be numeric and convertible to
        a finite number. The code coerces unparseable values to missing for scoring,
        but later attempts to convert non-null original values with int() for HTML
        and float() for JSON.
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 117
        end_line: 117
        file: ''
      - start_line: 140
        end_line: 141
        file: ''
      - start_line: 191
        end_line: 191
        file: ''
      uid: ddce81d4-22d2-40da-9f56-ca86058a229f
    - text: Null 'Meta_score' values are permitted, but at least one row retained
        after the four-digit 'Released_Year' filter should have a valid, non-null
        'Meta_score'. Otherwise, the median used to fill missing scores is undefined.
      sources:
      - start_line: 96
        end_line: 103
        file: ''
      - start_line: 140
        end_line: 148
        file: ''
      uid: f498d317-4e54-4e0a-97eb-2b343bf31a2b
    - text: Non-null 'Meta_score' values should be between 0 and 100, inclusive, because
        the code divides them by 100 to use them as a normalized score. They should
        also be whole-number-valued, since the HTML card displays each value using
        int().
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 140
        end_line: 147
        file: ''
      uid: 482a3a89-90fa-4013-9d1b-4a5f4ed906e8
