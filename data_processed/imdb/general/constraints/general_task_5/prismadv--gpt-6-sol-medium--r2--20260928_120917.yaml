      source_assumptions:
      - ec747da3-67f8-478c-9b99-15bd9d4e3416
    assumptions:
    - text: The input must contain a 'Certificate' column. The script accesses it
        directly and includes it in the output CSV.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 133
        end_line: 133
        file: ''
      - start_line: 172
        end_line: 176
        file: ''
      uid: 5b220eec-83dd-493b-a3f6-20411ebd37ee
    - text: 'After trimming whitespace, non-null ''Certificate'' values should be
        one of: G, PG, PG-13, R, NC-17, U, UA, A, 12, 12A, 15, or 18. Null values
        are possible, but non-null values outside this declared domain should be rejected.'
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 131
        end_line: 133
        file: ''
      uid: 100643b7-7b9a-486e-a890-44652ff2c4e8
    - text: Rows whose comma-separated 'Genre' tokens include 'Family' or 'Animation'
        should not have a 'Certificate' of R or NC-17, as specified by the script's
        content-policy comment.
      sources:
      - start_line: 123
        end_line: 129
        file: ''
      - start_line: 131
        end_line: 134
        file: ''
      uid: 1ee64c21-bf69-45a9-9b1a-27b64e458523
    - text: Rows that may appear in the leaderboards should have a non-null 'Certificate'
        if their HTML and JSON outputs must represent missing certificates correctly.
        Although the rendering code handles nulls, the earlier conversion of the input
        column to strings turns nulls into the literal value 'nan', which is subsequently
        rendered and exported as a certificate.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 167
        end_line: 179
        file: ''
      - start_line: 184
        end_line: 189
        file: ''
      uid: ec747da3-67f8-478c-9b99-15bd9d4e3416
  Genre:
    code:
    - suggestion: '.satisfies("`Genre` IS NOT NULL AND size(filter(split(`Genre`,
        '',''), x -> length(trim(x)) > 0)) > 0", "genre_has_token", lambda x: x ==
