    - suggestion: '.satisfies("CASE WHEN `Meta_score` IS NULL THEN TRUE ELSE try_cast(`Meta_score`
        AS DOUBLE) BETWEEN 0 AND 100 AND try_cast(`Meta_score` AS DOUBLE) = floor(try_cast(`Meta_score`
