    - suggestion: '.satisfies("NOT (exists(split(coalesce(`Genre`, ''''), '',''),
        x -> trim(x) IN (''Family'', ''Animation'')) AND coalesce(trim(`Certificate`),
        '''') IN (''R'', ''NC-17''))", "family_animation_certificate_policy", lambda
