      sources:
      - start_line: 113
        end_line: 113
        file: ''
      - start_line: 139
        end_line: 139
        file: ''
      - start_line: 173
        end_line: 176
        file: ''
      uid: e3f663f5-abe9-4c84-99bc-23ae00d5d730
    - text: For rows with a valid four-digit Released_Year, 'IMDB_Rating' should be
        non-null and a finite numeric value. Missing or unparseable ratings produce
        missing scores, which cannot receive a leaderboard rank; ratings displayed
        on HTML cards must also support numeric formatting. The dataset profile reports
        complete, fractional ratings.
      sources:
      - start_line: 98
        end_line: 103
        file: ''
      - start_line: 139
        end_line: 148
        file: ''
      - start_line: 162
        end_line: 167
        file: ''
      - start_line: 22
        end_line: 28
        file: ''
      uid: bd1b8a68-a9aa-4e7c-a433-c65d9146da4f
    - text: IMDB_Rating should be within the IMDb rating scale of 0 to 10, inclusive.
        The scoring formula divides it by 10 to normalize its contribution; out-of-range
        values would distort leaderboard scores.
      sources:
      - start_line: 139
        end_line: 139
        file: ''
      - start_line: 147
        end_line: 148
        file: ''
      uid: e99b76d6-f6f2-4b2c-8f74-5893d446e4eb
  Meta_score:
