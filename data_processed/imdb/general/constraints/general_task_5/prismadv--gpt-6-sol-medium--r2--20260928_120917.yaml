      - start_line: 115
        end_line: 115
        file: ''
      - start_line: 142
        end_line: 148
        file: ''
      - start_line: 172
        end_line: 176
        file: ''
      uid: 8162be66-a44d-4e07-b034-b1aa9920367a
    - text: '''No_of_Votes'' should be non-null and parseable as a finite integer
        for every row. Unparseable or missing values become NaN during scoring, while
        non-integer values would be truncated when votes are rendered or written to
        JSON. The dataset profile reports complete, integral values.'
      sources:
      - start_line: 115
        end_line: 115
        file: ''
      - start_line: 142
        end_line: 148
        file: ''
      - start_line: 24
        end_line: 30
        file: ''
      - start_line: 192
        end_line: 192
        file: ''
      uid: 62a9efa4-b0f5-46ee-97bc-1cfed6236545
    - text: '''No_of_Votes'' should be non-negative, since it represents a count of
        votes. The scoring code clips values below 1 before taking the logarithm,
        so zero is permitted, but negative counts would be invalid input rather than
        meaningful votes.'
      sources:
      - start_line: 142
        end_line: 147
        file: ''
      - start_line: 30
        end_line: 30
        file: ''
      uid: e057db5c-a63b-484c-a716-28c93e4b1a62
  Poster_Link:
    code:
    - suggestion: .hasDataType('Poster_Link', ConstrainableDataTypes.String)
