      source_assumptions:
      - bd6a431f-8666-4c8c-9b72-0c24c19a7d5f
    assumptions:
    - text: The input data must contain a 'Poster_Link' column with string values.
        The column is read directly and included in the CSV, HTML, and JSON outputs.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 173
        end_line: 176
        file: ''
      - start_line: 195
        end_line: 195
        file: ''
      uid: cc2838de-daa4-4978-bce9-2e379cf5ca8a
    - text: For rows eligible to appear in the leaderboards, 'Poster_Link' should
        be non-null and nonempty after trimming, and should not be a textual missing-value
        marker such as 'nan'. The code converts missing values to strings rather than
        filling or excluding them, which would produce unusable links.
      sources:
      - start_line: 25
        end_line: 34
        file: ''
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 136
        end_line: 136
        file: ''
      uid: a8b05364-ecb5-4520-b6b5-fd479bf24de3
    - text: For rows eligible to appear in the leaderboards, each trimmed 'Poster_Link'
        should be an absolute HTTP or HTTPS URL pointing to a poster image. The same
        value is used as both the card's link destination and its image source.
      sources:
      - start_line: 25
        end_line: 34
        file: ''
      uid: d9287600-4796-4806-a867-26ed92747fca
    - text: For rows eligible to appear in the leaderboards, 'Poster_Link' should
