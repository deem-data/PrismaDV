      source_assumptions:
      - 1ee64c21-bf69-45a9-9b1a-27b64e458523
    - suggestion: '.satisfies("NOT (trim(`Released_Year`) RLIKE ''^[0-9]{4}$'') OR
        `Certificate` IS NOT NULL", "certificate_present_for_potential_leaderboard_rows",
        lambda x: x == 1)'
      validity: false
      reason_if_invalid: 'Constraint ''.satisfies("NOT (trim(`Released_Year`) RLIKE
        ''^[0-9]{4}$'') OR `Certificate` IS NOT NULL", "certificate_present_for_potential_leaderboard_rows",
