      reason_if_invalid: ''
      level: error
      uid: 83ee5c12-6420-42e6-a68d-55713afac184
      source_assumptions:
      - bda92e37-a85a-41be-89e4-3d29f85f0403
    - suggestion: '.satisfies("`Gross` IS NULL OR regexp_replace(trim(`Gross`), '','',
        '''') RLIKE ''^[+-]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][+-]?[0-9]+)?$''",
        ''Gross numeric after removing commas'', lambda x: x >= 0.95)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: cfe6f7f1-befb-4d88-af2b-68a4118916d5
      source_assumptions:
      - 235a6461-bcb6-4a2a-add6-7464d886926e
    - suggestion: .satisfies("CASE WHEN `Gross` IS NULL THEN TRUE WHEN regexp_replace(trim(`Gross`),
        ',', '') RLIKE '^[+-]?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][+-]?[0-9]+)?$' THEN
        CAST(regexp_replace(trim(`Gross`), ',', '') AS DOUBLE) >= 0 ELSE TRUE END",
        'Parseable Gross is nonnegative')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6e6a117f-87e2-46da-b14a-640eee5cfcd1
      source_assumptions:
      - 2849b4f4-f4ce-4630-bb13-55d6a54e0fc9
    assumptions:
    - text: 'The input must contain a ''Gross'' column. Gross values may be null:
        the code converts unparseable values to null and imputes missing numeric values
        when at least one parseable value remains. The column is not required to be
        complete.'
      sources:
      - start_line: 119
        end_line: 121
        file: ''
      - start_line: 151
        end_line: 156
        file: ''
      uid: bda92e37-a85a-41be-89e4-3d29f85f0403
    - text: Among non-null 'Gross' values, nearly all should be numeric after removing
        commas (for example, '1234567' or '1,234,567'), with no currency symbols or
        other text. A validation rule could require at least 95% of non-null values
        to parse this way; otherwise, those values silently become missing and cannot
        contribute to the tie-breaker.
      sources:
      - start_line: 119
        end_line: 121
        file: ''
      - start_line: 150
        end_line: 154
        file: ''
      uid: 235a6461-bcb6-4a2a-add6-7464d886926e
    - text: Parseable 'Gross' values should be greater than or equal to zero. Negative
        gross amounts are not meaningful for the log1p normalization and may produce
        invalid tie-breaker values.
      sources:
      - start_line: 120
        end_line: 121
        file: ''
      - start_line: 151
        end_line: 154
        file: ''
      uid: 2849b4f4-f4ce-4630-bb13-55d6a54e0fc9
