      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 43d5a0f9-5094-4211-9f9c-b20489f8df88
      source_assumptions:
      - d5c11217-a721-4b0f-b47c-906ebe3ef2ea
    assumptions:
    - text: The input 'Genre' column should be present, non-null, and contain at least
        one non-whitespace genre token per row. Missing values are converted to the
        literal string 'nan', while blank values produce no genre group, so those
        rows would not appear in the leaderboards.
      sources:
      - start_line: 93
        end_line: 95
        file: ''
      - start_line: 128
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 164
        file: ''
      uid: 42e53d6c-d5bb-45cc-8dc7-30cea522a677
    - text: 'Each ''Genre'' value should be a comma-separated list whose tokens, after
        trimming whitespace, are members of the case-sensitive set: Action, Adventure,
        Animation, Biography, Comedy, Crime, Drama, Family, Fantasy, Film-Noir, History,
        Horror, Music, Musical, Mystery, Romance, Sci-Fi, Sport, Thriller, War, Western.
        Other spellings or separators would create unintended leaderboard groups.'
      sources:
      - start_line: 123
        end_line: 129
        file: ''
      - start_line: 159
        end_line: 164
        file: ''
      - start_line: 68
        end_line: 71
        file: ''
      uid: c38eb4e5-9f33-47aa-945f-b93964e5ce8c
    - text: A 'Genre' value should not repeat the same genre token within a row. Exploding
        repeated tokens would place the same title more than once in a decade-and-genre
        leaderboard and affect its ranks.
      sources:
      - start_line: 128
        end_line: 129
        file: ''
      - start_line: 158
        end_line: 167
        file: ''
      uid: d5c11217-a721-4b0f-b47c-906ebe3ef2ea
  Gross:
    code:
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0)'
