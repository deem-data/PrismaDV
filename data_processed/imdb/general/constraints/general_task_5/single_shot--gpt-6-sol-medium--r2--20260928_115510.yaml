constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda value: value >= 0.85).satisfies("Certificate
        IS NULL OR trim(cast(Certificate AS STRING)) IN (''G'', ''PG'', ''PG-13'',
        ''R'', ''NC-17'', ''U'', ''UA'', ''A'', ''12'', ''12A'', ''15'', ''18'')",
        ''valid_certificate'').satisfies("NOT (trim(Genre) RLIKE ''(^|, *)(Family|Animation)(,|$)''
        AND coalesce(trim(cast(Certificate AS STRING)), '''') IN (''R'', ''NC-17''))",
        ''family_animation_certificate_policy'')'
      - Valid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre').satisfies("trim(Genre) RLIKE '^(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)(
        *, *(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western))*$'",
        'valid_genre_tokens')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda value: value >= 0.75).satisfies("Gross
        IS NULL OR trim(Gross) RLIKE ''^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$''", ''parseable_gross'')'
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating').satisfies("IMDB_Rating > 0 AND IMDB_Rating <= 10",
        'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompleteness(''Meta_score'', lambda value: value >= 0.80).satisfies("Meta_score
        IS NULL OR Meta_score BETWEEN 0 AND 100", ''valid_meta_score'')'
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes').satisfies("No_of_Votes > 0", 'positive_vote_count')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link').satisfies("trim(Poster_Link) RLIKE '^https?://[^[:space:]]+$'",
        'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year').satisfies("trim(cast(Released_Year AS STRING))
        RLIKE '^[0-9]{4}$' AND cast(Released_Year AS INT) BETWEEN 1888 AND year(current_date())",
        'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime').satisfies("trim(Runtime) RLIKE '^[0-9]{2,3} min$'",
        'valid_runtime_format')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title').satisfies("length(trim(cast(Series_Title AS STRING)))
        > 0", 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
