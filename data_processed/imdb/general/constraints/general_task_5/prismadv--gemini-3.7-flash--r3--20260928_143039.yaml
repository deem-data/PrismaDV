        end_line: 148
        file: ''
      uid: 6f0fe447-13db-43f8-a864-f306bb479e53
    - text: 'The ''IMDB_Rating'' column values should fall within a valid rating range
        between 0.0 and 10.0, as the rating is normalized by dividing by 10.0 to compute
        the base score. We could represent this assumption as a deequ constraint like
        this: .satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0'', ''Valid
        IMDb Rating Range'', lambda x: x == 1.0)'
      sources:
