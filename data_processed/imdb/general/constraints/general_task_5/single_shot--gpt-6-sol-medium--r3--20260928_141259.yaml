constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda value: value >= 0.85)'
      - Valid
    - - .satisfies("Certificate IS NULL OR trim(cast(Certificate AS string)) IN ('G',
        'PG', 'PG-13', 'R', 'NC-17', 'U', 'UA', 'A', '12', '12A', '15', '18')", 'valid_certificate')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .satisfies("Genre RLIKE '^ *(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western)(
        *, *(Action|Adventure|Animation|Biography|Comedy|Crime|Drama|Family|Fantasy|Film-Noir|History|Horror|Music|Musical|Mystery|Romance|Sci-Fi|Sport|Thriller|War|Western))*
        *$'", 'valid_genre_tokens')
      - Valid
    - - .satisfies("NOT (Genre RLIKE '(^|,) *(Family|Animation) *(,|$)') OR Certificate
        IS NULL OR trim(cast(Certificate AS string)) NOT IN ('R', 'NC-17')", 'family_animation_certificate_policy')
      - Invalid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda value: value >= 0.75)'
      - Valid
    - - .satisfies("Gross IS NULL OR trim(Gross) RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parseable_gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .satisfies('IMDB_Rating IS NOT NULL AND IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasCompleteness(''Meta_score'', lambda value: value >= 0.80)'
      - Valid
    - - .satisfies('Meta_score IS NULL OR Meta_score BETWEEN 0 AND 100', 'valid_meta_score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .satisfies('No_of_Votes IS NOT NULL AND No_of_Votes > 0', 'positive_vote_count')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .satisfies("Poster_Link IS NOT NULL AND trim(Poster_Link) RLIKE '^https?://[^
        ]+$'", 'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .satisfies("cast(Released_Year AS string) RLIKE '^[0-9]{4}$' AND cast(Released_Year
        AS int) BETWEEN 1888 AND year(current_date())", 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$' AND cast(regexp_extract(Runtime,
        '^[0-9]{2,3}', 0) AS int) > 0", 'valid_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .satisfies("Series_Title IS NOT NULL AND trim(cast(Series_Title AS string))
        <> ''", 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
