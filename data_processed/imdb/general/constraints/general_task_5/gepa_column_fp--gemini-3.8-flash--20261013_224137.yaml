    assumption_generation: 'Code makes assumptions about its input data, often without
      stating them. For example, fillna on a column means the column may contain nulls,
      and an assert sets a bound the data must meet. From the code that uses the target
      column and the task description, write these assumptions as statements about
      the input data that a Deequ check can test.


      Output only valid JSON (numbers without leading zeros): { "assumptions": [{
      "text": str, "sources": [{ "start_line": int, "end_line": int }] }, ...] }'
    ir_generation: "markdown\nYou are an expert data quality and data engineering\
      \ assistant. Your task is to translate data quality assumptions about a specific\
      \ target column (`target_column`) into PyDeequ verification checks, taking into\
      \ account the target column profile metadata, the downstream code snippet, and\
      \ the downstream task description.\n\n### Input Format\nYou will be provided\
      \ with:\n1. `target_column`: The name of the column being analyzed.\n2. `target_column_desc`:\
      \ Profiling statistics and metadata for the target column (e.g., completeness,\
      \ inferred/declared data types, distinct value counts).\n3. `code_snippet`:\
      \ Python/Pandas script showing how the target column is ingested, manipulated,\
      \ and exported.\n4. `downstream_task_description`: Context on how the output\
      \ of the script is used downstream.\n5. `assumptions`: A numbered list of assumptions\
      \ (0-indexed) about the `target_column`.\n\n---\n\n### Output Format\nOutput\
      \ ONLY valid JSON adhering to the following structure:\n```json\n{\n  \"constraint_code\"\
      : [\n    {\n      \"suggestion\": \"<PyDeequ constraint method starting with\
      \ '.'>\",\n      \"level\": \"error\" | \"warning\",\n      \"linked assumptions\"\
      : [<indices of assumptions tested>]\n    }\n  ]\n}\n```\n\n---\n\n### Constraint\
      \ Level Guidelines (`error` vs. `warning`)\n- **Mandatory Requirement**: Do\
      \ NOT emit an output containing only `\"warning\"` constraints. If all constraints\
      \ are warnings, a bad or corrupt batch will never be rejected. **At least one\
      \ constraint must be set to `level: \"error\"`** to ensure pipeline integrity\
      \ and prevent corrupted data from propagating.\n- **Assign `\"error\"`** to:\n\
      \  - Critical foundational constraints (e.g., column completeness/presence when\
      \ expected, fundamental format/type validation, or essential value constraints).\n\
      \  - Checks where failing the condition breaks pipeline execution, causes unhandled\
      \ exceptions in downstream processing, or fundamentally corrupts downstream\
      \ consumers.\n- **Assign `\"warning\"`** to:\n  - Soft data quality thresholds\
      \ (e.g., non-fatal distribution drift, minor completeness drop where imputation/fallbacks\
      \ are present, pattern mismatches that are gracefully handled).\n\n---\n\n###\
      \ Syntax and Implementation Rules\n1. **Method Call Syntax**:\n   - Every suggestion\
      \ must start with a dot `.` followed by the method call (e.g., `.isComplete('col')`,\
      \ `.hasCompleteness('col', lambda x: ...)`).\n   - Use only the functions from\
      \ the Available PyDeequ Functions reference below.\n2. **Regex Patterns**:\n\
      \   - Always use raw strings for regex patterns (e.g., `r\"^\\d+$\"`) to prevent\
      \ backslash escaping bugs.\n3. **SQL Conditions (`satisfies`)**:\n   - Enclose\
      \ column names in backticks (e.g., `.satisfies('`col` IS NULL OR `col` > 0',\
      \ 'col_positive')`).\n4. **Lambda Expressions**:\n   - Ensure thresholds in\
      \ lambdas align realistically with `target_column_desc` and the logic in `code_snippet`.\n\
      5. **Assumption Linking**:\n   - Every constraint must reference the integer\
      \ indices (from 0) of the corresponding assumption(s) it tests in `\"linked\
      \ assumptions\"`.\n\n---\n\n### Available PyDeequ Functions\n\n#### Row-Level\
      \ Functions:\n- `.isComplete(column)`: Validates column contains no null values.\n\
      - `.hasCompleteness(column, assertion)`: Validates completeness ratio with a\
      \ lambda `lambda x: ...` (0.0 to 1.0).\n- `.areComplete(columns)`: Validates\
      \ all specified columns have no null values.\n- `.haveCompleteness(columns,\
      \ assertion)`: Validates completeness across a set of columns.\n- `.areAnyComplete(columns)`:\
      \ Validates at least one column in a set has no nulls.\n- `.satisfies(columnCondition,\
      \ constraintName, assertion=None)`: SQL WHERE clause condition on row level.\n\
      - `.hasPattern(column, pattern, assertion=None, name=None)`: Regex match on\
      \ string values.\n- `.containsCreditCardNumber(column, assertion=None)`\n- `.containsEmail(column,\
      \ assertion=None)`\n- `.containsURL(column, assertion=None)`\n- `.containsSocialSecurityNumber(column,\
      \ assertion=None)`\n- `.hasDataType(column, datatype, assertion=None)`: `ConstrainableDataTypes.{Null,\
      \ Fractional, Integral, Boolean, String, Numeric}`.\n- `.isNonNegative(column,\
      \ assertion=None)`: Validates column >= 0.\n- `.isPositive(column, assertion=None)`:\
      \ Validates column > 0.\n- `.isLessThan(columnA, columnB, assertion=None)`:\
      \ Validates columnA < columnB.\n- `.isLessThanOrEqualTo(columnA, columnB, assertion=None)`:\
      \ Validates columnA <= columnB.\n- `.isGreaterThan(columnA, columnB, assertion=None)`:\
      \ Validates columnA > columnB.\n- `.isGreaterThanOrEqualTo(columnA, columnB,\
      \ assertion=None)`: Validates columnA >= columnB.\n- `.isContainedIn(column,\
      \ allowed_values, assertion=None)`: Validates values are in a list/set.\n\n\
      #### Aggregate-Level Functions:\n- `.hasSize(assertion)`: Validates total row\
      \ count (`lambda x: x >= ...`).\n- `.haveAnyCompleteness(columns, assertion)`:\
      \ Validates at least one column meets completeness threshold.\n- `.isUnique(column)`:\
      \ Validates no duplicates exist in the column.\n- `.hasUniqueness(columns, assertion)`:\
      \ Validates uniqueness ratio (values occurring exactly once / total rows).\n\
      - `.hasDistinctness(columns, assertion)`: Validates distinct values / total\
      \ rows.\n- `.hasUniqueValueRatio(columns, assertion)`: Validates unique values\
      \ / distinct values.\n- `.hasNumberOfDistinctValues(column, assertion, binningUdf=None,\
      \ maxBins=1000)`: Validates distinct count.\n- `.hasMutualInformation(columnA,\
      \ columnB, assertion)`\n- `.hasApproxQuantile(column, quantile, assertion)`:\
      \ Quantile check (e.g., 0.5 for median).\n- `.hasMinLength(column, assertion)`:\
      \ Minimum string length.\n- `.hasMaxLength(column, assertion)`: Maximum string\
      \ length.\n- `.hasMin(column, assertion)`: Minimum numeric value.\n- `.hasMax(column,\
      \ assertion)`: Maximum numeric value.\n- `.hasMean(column, assertion)`: Mean\
      \ numeric value.\n- `.hasStandardDeviation(column, assertion)`: Standard deviation.\n\
      - `.hasCorrelation(columnA, columnB, assertion)`: Pearson correlation between\
      \ two columns."
