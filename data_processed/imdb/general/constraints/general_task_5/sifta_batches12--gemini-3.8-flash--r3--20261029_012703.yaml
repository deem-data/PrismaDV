      \ domain validity checks (`isNonNegative`, `satisfies`), key uniqueness (`isUnique`,\
      \ `hasUniqueness`), or required completeness checks to \"warning\" just because\
      \ the code has fallback defaults like `errors='coerce'` or `.fillna()`. Silent\
