      \ valid, non-corrupted data conforming to the expected schema.\n2. Distinguish\
      \ tolerance vs. requirement (Avoid the defensive code trap):\n   - Defensive\
      \ constructs such as `errors='coerce'`, `.fillna()`, `.get(..., default)`, or\
      \ `.clip()` are implementation fallbacks to prevent hard crashes—they do NOT\
      \ mean that corrupted, missing, or malformed data is acceptable.\n   - If invalid\
      \ values (e.g., non-numeric strings in numeric columns, negative counts/votes/revenue,\
      \ corrupted categories, missing keys) cause silent logical corruption (e.g.,\
      \ erroneous sorting, corrupted score calculations, misclassified records, bypassed\
      \ eligibility gates, or lost records in dictionary/key lookups), state type\
