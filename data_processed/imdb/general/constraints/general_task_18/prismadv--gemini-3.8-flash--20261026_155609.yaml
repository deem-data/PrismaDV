  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(regexp_replace(`Gross`, ',',
        '') AS DOUBLE) >= 0", "Gross_non_negative")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c6c0ca37-c4f7-443e-bbad-70f9644df620
      source_assumptions:
      - f44e1811-6d30-4b3d-9ab7-85771534ba90
    assumptions:
    - text: The 'Gross' column can contain missing or null values, as the code uses
        'errors="coerce"' when converting it to numeric and explicitly handles missing
        values by filling them with the median or zeros.
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: 141a587d-0099-4d1d-a549-e62352ea0dac
    - text: When present, values in the 'Gross' column should generally represent
        non-negative numeric figures (optionally containing commas as thousand separators),
        so that after removing commas they can be parsed as numbers and safely transformed
        using np.log1p without causing domain errors. We could represent this assumption
        as a constraint that parsed gross values are greater than or equal to 0.
      sources:
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 64
        end_line: 64
        file: ''
      uid: f44e1811-6d30-4b3d-9ab7-85771534ba90
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: db17941d-1ef6-4f92-9bd6-067c4030f02f
      source_assumptions:
      - 7ce870e7-e697-402a-92a0-9beee076d901
    - suggestion: '.satisfies(''`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10'', ''IMDB_Rating
        Range'', lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 09e9937a-60d6-4830-b983-bb3831c311cd
      source_assumptions:
      - fc5db164-47f7-4411-9dc9-eb508c7d0d8f
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3711c3d6-0ab2-41e0-a5b3-b3795714bc3b
      source_assumptions:
      - 2d22e853-4049-496e-812b-b3f7ce6f5809
    assumptions:
    - text: 'The ''IMDB_Rating'' column must be numeric or convertible to a floating-point
        number, as the code casts it using `.astype(float)` for normalization and
        calculations. We could represent this assumption as a deequ constraint like
        this: .isDataType(''IMDB_Rating'', ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 67
        end_line: 77
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 7ce870e7-e697-402a-92a0-9beee076d901
    - text: 'The ''IMDB_Rating'' column values should be within the range [0, 10],
        as it is divided by 10.0 to create a normalized quality score between 0 and
        1. We could represent this assumption as a deequ constraint like this: .satisfies(''`IMDB_Rating`
        >= 0 AND `IMDB_Rating` <= 10'', ''IMDB_Rating Range'', lambda x: x == 1)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 92
        file: ''
      uid: fc5db164-47f7-4411-9dc9-eb508c7d0d8f
    - text: 'The ''IMDB_Rating'' column should not contain missing/null values because
        it is directly normalized and factored into ''PopularityIndex'' without imputation
        or fillna handling. We could represent this assumption as a deequ constraint
        like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 98
        file: ''
      uid: 2d22e853-4049-496e-812b-b3f7ce6f5809
  Meta_score:
    code:
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2618809b-f101-4cd9-9b62-5fb4b4f81cfa
      source_assumptions:
      - 2f2de833-38cc-4206-b80a-405013d69b87
    - suggestion: '.hasCompleteness(''Meta_score'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ca5434bf-eb2f-486c-8c3b-9bdb2c41085f
      source_assumptions:
      - f3fa0a90-2eaf-4107-8194-f9698e8440eb
    - suggestion: .satisfies("`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score`
        <= 100)", "meta_score_range_0_to_100")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 106ecc8f-d1b5-45d9-a907-8625f446d6a8
      source_assumptions:
      - 32ad2028-bbae-480c-92e0-a29e776d5779
    assumptions:
    - text: 'The ''Meta_score'' column should be numeric or convertible to a floating-point
        data type, as the code converts it to float using `.astype(float)` for correlation,
        linear regression fitting, and normalization. We could represent this assumption
        as a deequ constraint like this: .isDataType(''Meta_score'', ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 2f2de833-38cc-4206-b80a-405013d69b87
    - text: 'The ''Meta_score'' column can contain missing/null values, as the code
        checks for missing values and imputes them using a linear regression model.
        However, it must contain at least 2 valid non-null values (jointly with ''IMDB_Rating'')
        so that `np.polyfit` can fit a degree-1 linear model. We could represent this
        assumption as a deequ constraint like this: .satisfies("CASE WHEN `Meta_score`
        IS NOT NULL THEN 1 ELSE 0 END", "Non-empty Meta_score", lambda x: x > 0)'
      sources:
      - start_line: 67
        end_line: 67
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      uid: f3fa0a90-2eaf-4107-8194-f9698e8440eb
    - text: 'Non-null values in the ''Meta_score'' column should generally be between
        0 and 100, as the code clips imputed values to [0, 100] and normalizes the
        score by dividing by 100.0 to blend it on a 0 to 1 scale. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `Meta_score`
        IS NULL OR (`Meta_score` >= 0 AND `Meta_score` <= 100) THEN 1 ELSE 0 END",
        "Meta_score Range [0, 100]", lambda x: x == 1)'
      sources:
      - start_line: 81
        end_line: 85
        file: ''
      uid: 32ad2028-bbae-480c-92e0-a29e776d5779
  No_of_Votes:
    code:
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 4934265f-48c1-494d-a5d7-3c6e346b4043
      source_assumptions:
      - a3bac2ac-6f70-4890-8b16-d6b3f4297291
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b0ac2ea5-2b64-4256-ae53-4db3ffd0b96f
      source_assumptions:
      - 53d1196e-9d14-4d88-af3b-ad08f464b6d7
    assumptions:
    - text: 'The ''No_of_Votes'' column should be numeric and castable to float, as
        the code directly applies `.astype(float)` on it without error handling. We
        could represent this assumption as a deequ constraint like this: .hasDataType(''No_of_Votes'',
        ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: a3bac2ac-6f70-4890-8b16-d6b3f4297291
    - text: 'The ''No_of_Votes'' column should contain non-negative values (>= 0),
        because vote counts represent counts and the code computes `np.log1p(df[''No_of_Votes''].astype(float))`,
        which is mathematically undefined (yielding NaN) for values strictly less
        than -1. We could represent this assumption as a deequ constraint like this:
        .satisfies(''CASE WHEN `No_of_Votes` >= 0 THEN 1 ELSE 0 END'', ''Non-negative
        Votes'', lambda x: x == 1.0)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: 53d1196e-9d14-4d88-af3b-ad08f464b6d7
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e8d35940-e86b-4042-b0d5-33f8d003f4a4
      source_assumptions:
      - 7a8120fe-6a4a-44b3-b93c-64aa7a30e5a9
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9507e96f-4cbf-46f4-8b61-155a83680e11
      source_assumptions:
      - 8400287f-a2cb-4aa1-b7bd-01d637103f43
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values, as it is
        used alongside ''Series_Title'' to set the index and is exported directly
        as a publishing key in the output rankings without any missing value imputation
        or filtering. We could represent this assumption as a deequ constraint like
        this: .isComplete("Released_Year")'
      sources:
      - start_line: 94
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: 7a8120fe-6a4a-44b3-b93c-64aa7a30e5a9
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' is assumed
        to uniquely identify each movie row for indexing, ranking, and downstream
        publishing. We could represent this assumption as a deequ constraint like
        this: .isUnique(Seq("Series_Title", "Released_Year"))'
      sources:
      - start_line: 94
        end_line: 101
        file: ''
      uid: 8400287f-a2cb-4aa1-b7bd-01d637103f43
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b0f6e0fb-dc2f-436b-b712-d8a0fb342690
      source_assumptions:
      - 7128a66f-ef9f-48b9-b822-4e8ba67eb062
    - suggestion: '.satisfies("`Runtime` RLIKE ''.*[0-9]{2,3}.*''", "Runtime contains
        2 to 3 digits", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 454707f5-85de-4b2a-a0e2-87fec7e6cb6f
      source_assumptions:
      - 42b17cd1-4740-4474-b6da-15ca5858587b
    assumptions:
    - text: 'The ''Runtime'' column should not contain null or missing values because
        missing values cast to string would fail regex extraction and cause the subsequent
        `.astype(int)` conversion to raise a ValueError on NaN values. We could represent
        this assumption as a deequ constraint like this: .isComplete("Runtime")'
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      uid: 7128a66f-ef9f-48b9-b822-4e8ba67eb062
    - text: 'Each value in the ''Runtime'' column must contain a 2- to 3-digit number
        (matching the pattern ''[0-9]{2,3}''), such that ''str.extract(r''([0-9]{2,3})'')''
        produces a valid non-empty match for every record before casting to integer
        with ''.astype(int)''. We could represent this assumption as a deequ constraint
        like this: .satisfies("`Runtime` RLIKE ''.*[0-9]{2,3}.*''", "Runtime contains
        2 to 3 digits", lambda x: x == 1.0)'
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      uid: 42b17cd1-4740-4474-b6da-15ca5858587b
  Series_Title:
    code:
    - suggestion: .isComplete('Series_Title')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e743ab8b-e991-4646-8f4b-b0c8d7fd5496
      source_assumptions:
      - c8be41ef-6a4a-4d8e-8d3a-74bc56351f88
    - suggestion: .hasDataType('Series_Title', ConstrainableDataTypes.String)
      validity: false
      reason_if_invalid: 'Constraint ''.hasDataType(''Series_Title'', ConstrainableDataTypes.String)''
