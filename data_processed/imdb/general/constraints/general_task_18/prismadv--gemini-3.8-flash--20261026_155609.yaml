      level: warning
      uid: b7bc9ff8-2d29-4edc-8d93-782528d19a1f
      source_assumptions:
      - 4126e67b-decd-4ba6-a92f-5aeed716ab14
    assumptions:
    - text: 'The ''Series_Title'' column should not contain null values, as it is
        used as an index and primary identifier alongside ''Released_Year'' to key
        and output movie popularity rankings.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Series_Title")'
      sources:
      - start_line: 94
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: c8be41ef-6a4a-4d8e-8d3a-74bc56351f88
    - text: 'The ''Series_Title'' column should be of string/text type representing
        movie or series titles used for index creation and publishing.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("Series_Title", ConstrainableDataTypes.String)'
      sources:
      - start_line: 101
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: 4126e67b-decd-4ba6-a92f-5aeed716ab14
  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: x >
        0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 69d73194-9315-4514-8d95-3e24a8294454
      source_assumptions:
      - 43963af1-486c-4a4f-94f2-e125f8e1cb07
    - suggestion: .satisfies('`Meta_score` IS NOT NULL OR `IMDB_Rating` IS NOT NULL',
        'Meta_score_imputable_by_IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4039d660-4af9-41b5-a03c-1781e951c2e5
      source_assumptions:
      - 7d8b4b31-93cb-49a1-a191-e32951e34907
    assumptions:
    - text: 'There should be a positive correlation between ''IMDB_Rating'' and ''Meta_score''
        across records where both are present. The pipeline computes the Pearson correlation
        coefficient between them to adjust their blending weights and fits a linear
        regression model to predict ''Meta_score'' from ''IMDB_Rating''. This assumption
        can be represented as a Deequ constraint: .hasCorrelation("IMDB_Rating", "Meta_score",
        _ > 0.0)'
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      - start_line: 88
        end_line: 92
        file: ''
      uid: 43963af1-486c-4a4f-94f2-e125f8e1cb07
    - text: 'For every record where ''Meta_score'' is missing (null), ''IMDB_Rating''
        must be present (not null) so that the regression model can successfully impute
        missing ''Meta_score'' values without leaving NaNs. This assumption can be
        represented as a Deequ constraint: .satisfies("Meta_score IS NOT NULL OR IMDB_Rating
        IS NOT NULL", "Meta_score_imputable_by_IMDB_Rating")'
      sources:
      - start_line: 67
        end_line: 67
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      uid: 7d8b4b31-93cb-49a1-a191-e32951e34907
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
