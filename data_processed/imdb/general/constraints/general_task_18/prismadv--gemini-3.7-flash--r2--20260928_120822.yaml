  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 24c92555-51b0-451d-bbcb-b3ae84ecd93a
      source_assumptions:
      - 53706f22-c85f-49aa-9276-f1a5cb285d05
    - suggestion: .hasPattern('Runtime', r'.*[0-9]{2,3}.*')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e9e8d16a-7aaa-4eaa-acb1-7d9b501df623
      source_assumptions:
      - 41c79af3-4bc9-43cc-b68f-4f287d36fdda
    assumptions:
    - text: 'The ''Runtime'' column should not contain null values, because the code
        extracts numeric digits and directly casts the result to integer using `.astype(int)`
        without handling NaN values, which would raise a ValueError if any values
        are missing. We could represent this assumption as a deequ constraint like
        this: .isComplete("Runtime")'
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      uid: 53706f22-c85f-49aa-9276-f1a5cb285d05
    - text: 'The ''Runtime'' column values must contain a 2- to 3-digit integer (matching
        the regex pattern `[0-9]{2,3}`), because the code uses `df[''Runtime''].astype(str).str.extract(r''([0-9]{2,3})'')[0].astype(int)`
        to extract runtime minutes. If a row does not contain 2 to 3 consecutive digits,
        the extraction yields NaN, causing `.astype(int)` to fail with a casting error.
        We could represent this assumption as a deequ constraint like this: .hasPattern("Runtime",
        ".*[0-9]{2,3}.*")'
      sources:
      - start_line: 51
        end_line: 52
        file: ''
      uid: 41c79af3-4bc9-43cc-b68f-4f287d36fdda
