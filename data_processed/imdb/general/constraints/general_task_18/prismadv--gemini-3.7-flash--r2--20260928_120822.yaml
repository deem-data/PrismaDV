prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Gross:
    code:
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0.5)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 78d505f0-4dce-4129-b2d9-001c2634565b
      source_assumptions:
      - 61ac6dc6-4e26-446e-8b87-f9dde8e2da6c
    - suggestion: '.satisfies("`Gross` IS NULL OR CAST(REPLACE(`Gross`, '','', '''')
        AS DOUBLE) >= 0", "Gross_non_negative_numeric", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8a60efb7-4878-43e2-be47-c1711aa32dbf
      source_assumptions:
      - fc54a52f-eaac-4276-af47-b17f771aa20d
    assumptions:
    - text: 'The ''Gross'' column may contain missing or null values because the downstream
        code explicitly coerces conversion errors with pd.to_numeric(..., errors=''coerce'')
        and imputes missing values using the median when available. Therefore, completeness
        is not required to be 100%.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Gross") // relaxed or completeness > 0.0

        '
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: 61ac6dc6-4e26-446e-8b87-f9dde8e2da6c
    - text: 'The non-null values in the ''Gross'' column are expected to represent
        monetary amounts formatted as numeric strings (optionally containing commas
        as thousand separators). When commas are removed, values should be convertible
        to non-negative numbers (>= 0) so that the log1p transform (np.log1p) executes
        without producing invalid numbers/NaNs.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Gross` IS NULL OR CAST(REPLACE(`Gross`, '','', '''')
        AS DOUBLE) >= 0 THEN 1 ELSE 0 END", "Non-negative Parsable Gross Values",
        lambda x: x == 1.0)

        '
      sources:
      - start_line: 55
        end_line: 64
        file: ''
      uid: fc54a52f-eaac-4276-af47-b17f771aa20d
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b9846efe-8135-4101-91ce-41df016dd27d
      source_assumptions:
      - 8565e371-37e6-4128-b251-1a5e104e0ecd
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 29da6628-be5c-4924-a4ac-f7c9623dbf99
      source_assumptions:
      - 14cf0701-9f58-44f2-adb6-5c33a8d37d31
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'IMDB_Rating_between_0_and_10')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c20d620e-48d5-466e-ba7e-9bf28505a554
      source_assumptions:
      - 9cf7bb38-ddf6-48aa-8e9f-00c32237aa56
    assumptions:
    - text: 'The ''IMDB_Rating'' column must be convertible to a numeric (float) data
        type as it is cast to float for normalization and linear regression modeling.
        We could represent this assumption as a deequ constraint like this: .hasDataType(''IMDB_Rating'',
        ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 74
        end_line: 74
        file: ''
      - start_line: 82
        end_line: 82
        file: ''
      uid: 8565e371-37e6-4128-b251-1a5e104e0ecd
    - text: 'The ''IMDB_Rating'' column should not contain null values, because it
        is directly normalized without filling missing values to compute ''PopularityIndex''
        and is used to impute missing ''Meta_score'' values. We could represent this
        assumption as a deequ constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      - start_line: 92
        end_line: 96
        file: ''
      uid: 14cf0701-9f58-44f2-adb6-5c33a8d37d31
    - text: 'The ''IMDB_Rating'' column values are expected to fall within the standard
        rating range of 0 to 10, as the values are divided by 10.0 to produce normalized
        rating scores between 0 and 1. We could represent this assumption as a deequ
        constraint like this: .satisfies(''CASE WHEN `IMDB_Rating` >= 0 AND `IMDB_Rating`
        <= 10 THEN 1 ELSE 0 END'', ''Rating Range Check'', lambda x: x == 1)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 92
        file: ''
      uid: 9cf7bb38-ddf6-48aa-8e9f-00c32237aa56
  Meta_score:
    code:
    - suggestion: '.hasCompleteness(''Meta_score'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 430493f9-359a-4a9f-8b39-292eac4d6bd5
      source_assumptions:
      - 922f444b-2d11-4221-a119-09a60057dea4
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: fb8cd5c2-bdd6-432f-a152-efab63a3b905
      source_assumptions:
      - a42769fe-9991-45d3-af30-6f3ad188f5cf
    - suggestion: .satisfies('`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score`
        <= 100)', 'meta_score_in_range_0_100')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 675e3c98-9ca6-44f6-8cd0-b13c86f9267b
      source_assumptions:
      - d22d2853-3454-4f9a-b991-2a3e712b5e06
    assumptions:
    - text: The 'Meta_score' column can contain missing (null) values because the
        downstream code handles missing entries by fitting a linear regression model
        on available data and imputing missing scores. However, it must contain at
        least 2 non-null numeric values where 'IMDB_Rating' is also not null to allow
        np.polyfit to compute the slope and intercept.
      sources:
      - start_line: 67
        end_line: 83
        file: ''
      uid: 922f444b-2d11-4221-a119-09a60057dea4
    - text: The 'Meta_score' column should be numeric or castable to float (excluding
        missing values), as it undergoes .astype(float) and is used in numerical calculations
        such as correlation and linear regression fitting.
      sources:
      - start_line: 67
        end_line: 79
        file: ''
      uid: a42769fe-9991-45d3-af30-6f3ad188f5cf
    - text: The 'Meta_score' column values should fall within the range of [0, 100],
        as the code normalizes the scores by dividing by 100.0 and clips imputed scores
        to the [0, 100] interval.
      sources:
      - start_line: 81
        end_line: 85
        file: ''
      uid: d22d2853-3454-4f9a-b991-2a3e712b5e06
  No_of_Votes:
    code:
    - suggestion: .isComplete('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b620f8c4-7e67-4f36-81c2-6df85c3de65d
      source_assumptions:
      - 28e77fd3-d188-4718-bb9f-3a52b9827ee2
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 6e92ce43-64cf-4e7d-97d9-8e91dfaa085d
      source_assumptions:
      - bb2e5bd6-e637-4956-8e5c-b046f72b555e
    assumptions:
    - text: 'The ''No_of_Votes'' column should not contain null values, as it is directly
        cast to float and used in logarithmic transformations without missing value
        handling. We could represent this assumption as a deequ constraint like this:
        .isComplete(''No_of_Votes'')'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: 28e77fd3-d188-4718-bb9f-3a52b9827ee2
    - text: 'The ''No_of_Votes'' column values should be non-negative (>= 0) to ensure
        mathematical validity for the log1p transform (np.log1p) and to represent
        valid vote counts. We could represent this assumption as a deequ constraint
        like this: .satisfies(''`No_of_Votes` >= 0'', ''Non-negative No_of_Votes'',
        lambda x: x == 1.0)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: bb2e5bd6-e637-4956-8e5c-b046f72b555e
