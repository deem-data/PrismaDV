  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: x >=
        -1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8ff040e2-2107-4f6d-891a-3073a7fadad6
      source_assumptions:
      - db5e366f-f8ec-4618-b8ab-6b7416986c89
    - suggestion: .satisfies('`Meta_score` IS NOT NULL OR `IMDB_Rating` IS NOT NULL',
        'meta_missing_requires_imdb_rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 64aaac5f-ce26-40ce-8ac8-79582cec9fc0
      source_assumptions:
      - 369671d5-6906-4a68-a837-af1366179b89
    assumptions:
    - text: There must be at least two records where both 'IMDB_Rating' and 'Meta_score'
        are non-null and have sufficient variance so that Pearson correlation and
        linear regression (np.polyfit) can be successfully computed.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      uid: db5e366f-f8ec-4618-b8ab-6b7416986c89
    - text: For any record where 'Meta_score' is missing/null, 'IMDB_Rating' must
        be non-null so that the linear imputation model can compute a valid replacement
        value.
      sources:
      - start_line: 79
        end_line: 83
        file: ''
      uid: 369671d5-6906-4a68-a837-af1366179b89
