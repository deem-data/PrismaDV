prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(REPLACE(`Gross`, ',', '') AS
        DOUBLE) >= 0", "Gross_non_negative_numeric")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 54c1f76f-ef9e-4005-9d72-3059e2fc674b
      source_assumptions:
      - 86c1cda5-747b-4311-b1ea-42b04421039e
    assumptions:
    - text: The 'Gross' column can contain null or missing values, as the code uses
        `errors='coerce'` when converting to numeric and handles missing values by
        filling them with the median or zero before normalization.
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: ca794fe7-b7a9-4f33-8f89-eee976c6cd22
    - text: When not null, values in the 'Gross' column are expected to be numeric
        strings (optionally containing commas as thousand separators) that parse to
        non-negative numbers, because `np.log1p` is applied during feature engineering.
      sources:
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 64
        end_line: 64
        file: ''
      uid: 86c1cda5-747b-4311-b1ea-42b04421039e
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 77ef7c3d-9cb5-430f-812b-3cba57e4ad74
      source_assumptions:
      - 14ad2e7f-b5d0-4f78-8eb8-ebe18c0a731e
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'Valid
        IMDB Rating Range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bf25d72b-524f-4ed9-b56a-b21319975c7c
      source_assumptions:
      - c99fea5e-318f-479d-9939-8a31a0839bea
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 841cc7eb-393a-4e91-b22e-786b11abf9b6
      source_assumptions:
      - b1878cbe-631b-40d4-93e8-52853bf4f703
    assumptions:
    - text: 'The ''IMDB_Rating'' column must contain numeric values that can be cast
        to float, as it is converted using `.astype(float)` for normalization, correlation,
        and regression calculations. We could represent this assumption as a deequ
        constraint like this: .isDataType(''IMDB_Rating'', ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 14ad2e7f-b5d0-4f78-8eb8-ebe18c0a731e
    - text: 'The ''IMDB_Rating'' column values should fall within the range [0.0,
        10.0], as it represents standard movie ratings and is normalized by dividing
        by 10.0 to produce a 0-1 scale rating score. We could represent this assumption
        as a deequ constraint like this: .satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating`
        <= 10.0'', ''Valid IMDB Rating Range'', lambda x: x == 1.0)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      uid: c99fea5e-318f-479d-9939-8a31a0839bea
    - text: 'The ''IMDB_Rating'' column should not contain null values, because it
        is directly normalized without missing value imputation and is additionally
        used to impute missing values in ''Meta_score''. We could represent this assumption
        as a deequ constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: b1878cbe-631b-40d4-93e8-52853bf4f703
  Meta_score:
    code:
    - suggestion: '.hasCompleteness(''Meta_score'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 87fcbd6b-c990-4aa1-8b40-ec9ad2789b61
      source_assumptions:
      - d1c65406-8369-45c0-ba81-7595d4592596
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 5568d1a9-4e2e-44fb-8eb9-61add2637060
      source_assumptions:
      - 97a6876b-811b-4ba9-96b0-b2ca8cfdd92f
    - suggestion: .satisfies('`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score`
        <= 100)', 'meta_score_between_0_and_100')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9ccd3bf2-c761-4eae-baef-6e7cd5bd250e
      source_assumptions:
      - c5ea31a5-c377-4686-b641-95ab7d1c432f
    assumptions:
    - text: The 'Meta_score' column can contain missing or null values, as missing
        values are explicitly checked and imputed using a linear fit with 'IMDB_Rating'.
        However, it should not be entirely null; it requires at least two non-null
        values to avoid errors during correlation and linear regression fitting with
        np.polyfit.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      uid: d1c65406-8369-45c0-ba81-7595d4592596
    - text: The non-null values in the 'Meta_score' column must be numeric or convertible
        to float, as they are cast via `.astype(float)` for correlation, polyfit regression,
        and score normalization.
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 75
        end_line: 75
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: 97a6876b-811b-4ba9-96b0-b2ca8cfdd92f
    - text: The 'Meta_score' column is expected to be on a scale of 0 to 100, as missing
        values are clipped to [0, 100] and the score is normalized by dividing by
        100.0.
      sources:
      - start_line: 82
        end_line: 85
        file: ''
      uid: c5ea31a5-c377-4686-b641-95ab7d1c432f
  No_of_Votes:
    code:
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 4fb0f438-9deb-43dc-bd7a-4ada4db2d7ca
      source_assumptions:
      - ea839caa-ade8-429a-b960-65cf93fe1e35
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a1e0999c-300f-4c86-b4dd-7dea0cb577bc
      source_assumptions:
      - 474755a8-64fd-499c-b676-7461567fd593
    assumptions:
    - text: 'The ''No_of_Votes'' column must exist and be convertible to numeric/float
        data type, as the code directly applies `.astype(float)` without error coercion.
        We could represent this assumption as a deequ constraint like this: .isDataType(''No_of_Votes'',
        org.apache.spark.sql.types.DoubleType)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: ea839caa-ade8-429a-b960-65cf93fe1e35
    - text: 'The ''No_of_Votes'' column should contain non-negative values (>= 0),
        as `np.log1p` is applied to compute the log-transformed popularity score and
        vote counts cannot be negative. We could represent this assumption as a deequ
        constraint like this: .satisfies("CASE WHEN `No_of_Votes` >= 0 THEN 1 ELSE
        0 END", "Non-negative No_of_Votes", lambda x: x == 1.0)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: 474755a8-64fd-499c-b676-7461567fd593
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 051c8def-0cae-4f29-ac97-39edb2e8210b
      source_assumptions:
      - cf22070a-f986-4239-ad4c-747cd7b5e479
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a6f3cfc0-5ed6-41c4-8a43-4a1aee952078
      source_assumptions:
      - 25982d1c-c07a-409e-86a4-388f9d09dbb4
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values, as it is
        used as part of the MultiIndex key with ''Series_Title'' and included directly
        in the final output files without any missing value handling.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Released_Year")'
      sources:
      - start_line: 100
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: cf22070a-f986-4239-ad4c-747cd7b5e479
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should uniquely
        identify each movie title row in the dataset, as the code sets a MultiIndex
        on them for downstream publishing and ranking output.

        We could represent this assumption as a deequ constraint like this:

        .isUnique(["Series_Title", "Released_Year"])'
      sources:
      - start_line: 94
        end_line: 101
        file: ''
      uid: 25982d1c-c07a-409e-86a4-388f9d09dbb4
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d7dd3027-c984-4823-b07c-cfb738e27578
      source_assumptions:
      - f9c91e46-6874-4808-83fc-97f6f4c8a446
    - suggestion: '.satisfies("`Runtime` RLIKE ''[0-9]{2,3}''", "Runtime contains
        2 to 3 digit number", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7c091c4b-4cb2-4689-a84f-40dd5d18a66a
      source_assumptions:
      - bb6ea3a6-d31b-4774-a1f6-efe4e5547094
    assumptions:
    - text: 'The ''Runtime'' column should not contain null values, because missing
        values would become ''nan'' strings which fail to match the digit extraction
        pattern, producing NaN values that cause ''.astype(int)'' to raise a ValueError
        or IntCastingNaNError. We could represent this assumption as a deequ constraint
        like this: .isComplete("Runtime")'
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      uid: f9c91e46-6874-4808-83fc-97f6f4c8a446
    - text: 'Every value in the ''Runtime'' column must contain a 2- to 3-digit integer
        (matching the regex pattern ''[0-9]{2,3}''), because ''df["Runtime"].astype(str).str.extract(r''([0-9]{2,3})'')[0].astype(int)''
        expects a valid 2-3 digit number in every row to successfully convert to integer
        without missing values. We could represent this assumption as a deequ constraint
        like this: .satisfies("`Runtime` RLIKE ''[0-9]{2,3}''", "Runtime contains
        2 to 3 digit number", lambda x: x == 1.0)'
      sources:
      - start_line: 51
        end_line: 51
        file: ''
      uid: bb6ea3a6-d31b-4774-a1f6-efe4e5547094
  Series_Title:
    code:
    - suggestion: .isComplete("Series_Title")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6a562f4d-d35c-4769-8145-a7fbd9ed7a90
      source_assumptions:
      - 959161d2-0bef-4599-aec1-f5705fdf2c86
    - suggestion: .hasDataType("Series_Title", ConstrainableDataTypes.String)
      validity: false
      reason_if_invalid: 'Constraint ''.hasDataType("Series_Title", ConstrainableDataTypes.String)''
        failed on data sample: Value: 0.996661101836394 does not meet the constraint
        requirement!'
      level: warning
      uid: 8d91e8b0-68fc-47ab-b05f-1967b44a621c
      source_assumptions:
      - 47c907eb-d980-4f75-afb4-990879eee13b
    assumptions:
    - text: 'The ''Series_Title'' column should not contain null values because it
        is used to set the DataFrame index alongside ''Released_Year'' and is selected
        into the final output tables without any missing-value imputation. We could
        represent this assumption as a deequ constraint like this: .isComplete("Series_Title")'
      sources:
      - start_line: 101
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: 959161d2-0bef-4599-aec1-f5705fdf2c86
    - text: 'The ''Series_Title'' column should be of string data type as it represents
        the titles of movies/series. We could represent this assumption as a deequ
        constraint like this: .hasDataType("Series_Title", ConstrainableDataTypes.String)'
      sources:
      - start_line: 101
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: 47c907eb-d980-4f75-afb4-990879eee13b
  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: x >
        0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 42dbaa80-29c0-4632-833e-64a098562c5d
      source_assumptions:
      - 9052cc03-aca7-4728-83c3-099c4b7530b4
    - suggestion: .satisfies('`Meta_score` IS NOT NULL OR `IMDB_Rating` IS NOT NULL',
        'Imputation requires IMDB_Rating when Meta_score is missing')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7f59af25-ef82-413d-bf04-f5088a69c479
      source_assumptions:
      - 6940c3cd-089e-4bd8-b44d-a7ccae7c007e
    assumptions:
    - text: 'There should be a positive correlation between ''IMDB_Rating'' and ''Meta_score''.
        The code computes the Pearson correlation between these two columns to calibrate
        weights for blending quality scores and fit a linear model. A non-degenerate
        positive correlation is expected to avoid NaN values in weight calculation.
        We could represent this assumption as a deequ constraint like this:

        .hasCorrelation("IMDB_Rating", "Meta_score", _ > 0.0)

        '
      sources:
      - start_line: 67
        end_line: 71
        file: ''
      - start_line: 88
        end_line: 90
        file: ''
      uid: 9052cc03-aca7-4728-83c3-099c4b7530b4
    - text: 'For any record where ''Meta_score'' is missing, ''IMDB_Rating'' must
        be present (not null). The code imputes missing ''Meta_score'' values using
        a linear regression model based on ''IMDB_Rating''. If both columns are null
        for a record, ''Meta_score'' will remain null, propagating NaN into ''PopularityIndex''.
        We could represent this assumption as a deequ constraint like this:

        .satisfies("Meta_score IS NOT NULL OR IMDB_Rating IS NOT NULL", "Imputation
        requires IMDB_Rating when Meta_score is missing")

        '
      sources:
      - start_line: 79
        end_line: 83
        file: ''
      uid: 6940c3cd-089e-4bd8-b44d-a7ccae7c007e
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d4844649-af10-4568-afbb-ad4bcd96fe3f
      source_assumptions:
      - 2e3ea56b-5164-48f6-89f4-993848fa0361
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across all records in the dataset to uniquely identify each movie title row.
        We could represent this assumption as a deequ constraint like this: .isUnique(["Series_Title",
        "Released_Year"])'
      sources:
      - start_line: 94
        end_line: 101
        file: ''
      uid: 2e3ea56b-5164-48f6-89f4-993848fa0361
