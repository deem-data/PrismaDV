      source_assumptions:
      - e64ff3ca-0b45-41fe-97b0-d705a74623a8
    assumptions:
    - text: The 'IMDB_Rating' column should be present, and every value should be
        non-null, numeric, and finite. The code converts ratings to float and uses
        them directly in scoring; a missing or invalid rating could produce a missing
