      source_assumptions:
      - a6c21d99-416a-4635-9029-2243e1eba4d4
    assumptions:
    - text: The 'Meta_score' column may contain null values; the code imputes them
        for scoring. However, at least two rows must have non-null values in both
        'Meta_score' and 'IMDB_Rating' to fit the imputation model.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      uid: d06c3aa9-02d4-43fc-b00b-b3b3a09366e0
    - text: Every non-null 'Meta_score' value must be convertible to a finite number.
        The code casts these values to float for correlation, regression, and scoring
        without handling invalid strings or infinite values.
      sources:
      - start_line: 69
        end_line: 75
        file: ''
      - start_line: 79
        end_line: 85
        file: ''
      uid: b7d7097a-6d3d-4073-b32f-33e4cd6cbb4c
    - text: Non-null 'Meta_score' values should be between 0 and 100 inclusive, consistent
        with the bounds applied to imputed scores and the division by 100 used to
        normalize scores.
      sources:
      - start_line: 82
        end_line: 85
        file: ''
      uid: 20175bfb-ac93-4c4c-bd22-09c1b572f950
    - text: Among rows where both 'Meta_score' and 'IMDB_Rating' are present, 'Meta_score'
        must have at least two distinct values. Otherwise, their correlation is undefined
        and the resulting popularity scores can become null.
      sources:
      - start_line: 67
        end_line: 69
        file: ''
      - start_line: 88
        end_line: 95
        file: ''
      uid: 2387488c-9a67-4d47-a232-3bed5d066a70
    - text: For every row with a null 'Meta_score', 'IMDB_Rating' must be present
