        end_line: 44
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      - start_line: 92
        end_line: 98
        file: ''
      uid: d8df51b3-6747-486b-af6e-888fbeb70a4e
    - text: Every 'IMDB_Rating' value should be between 0 and 10, inclusive. Dividing
        by 10 assumes a ten-point rating scale for the blended quality score.
      sources:
      - start_line: 43
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 92
        file: ''
      uid: a02f2b95-7c3b-4ca5-944d-08ea667948b3
    - text: Among rows with a non-null 'Meta_score', there should be at least two
        rows with distinct 'IMDB_Rating' values. The unguarded linear fit needs paired
        observations and variation in its rating input.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      uid: e64ff3ca-0b45-41fe-97b0-d705a74623a8
