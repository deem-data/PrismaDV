    assumptions:
    - text: The input must contain a 'Gross' column, because the script reads it to
        calculate the popularity score and includes it in the output.
      sources:
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: ed1b52f4-b28a-49d0-ab67-1d20e3a9327f
    - text: Every non-null 'Gross' value should be convertible to a numeric amount
        after commas are removed. Values with currency symbols or other nonnumeric
        text would be coerced to missing and lose their gross contribution.
      sources:
      - start_line: 54
        end_line: 60
        file: ''
      uid: 4de77ff2-3caf-48f5-8c98-8b9628f168e2
    - text: Parsed, non-null 'Gross' amounts should be finite and nonnegative, so
        that the log1p transformation produces a usable value for normalization.
      sources:
      - start_line: 55
        end_line: 64
        file: ''
      uid: ab9f5fe5-62ac-4467-878f-3efb4513c6fc
    - text: The 'Gross' column may contain null values. The code replaces missing
        parsed amounts with the median when one is available, and explicitly handles
        the case where all parsed amounts are missing; therefore, complete coverage
        is not required.
      sources:
      - start_line: 55
        end_line: 64
        file: ''
      uid: 0c057500-3b8d-48f6-930a-985735a1ffbb
