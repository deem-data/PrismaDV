constraints:
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(replace(`Gross`, ',', '') AS
        DOUBLE) >= 0", "Gross_is_non_negative")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b4ca0a44-9686-40ff-b1bf-fdb53cc7e24c
      source_assumptions:
      - 88a1fb1b-1531-47b1-afd5-07d97b218553
    assumptions:
    - text: The 'Gross' column can contain missing or null values, as the code handles
        missing values using pd.to_numeric with errors='coerce' and imputes missing
        numeric values with the median (or 0 if all values are missing).
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: ed09dc40-62ea-4ef9-b5d3-fcc5aeccd9b4
    - text: The 'Gross' column, when present and parsed as numeric (after removing
        commas), should contain non-negative values (Gross >= 0) to ensure that np.log1p
        computes valid real numbers without producing NaNs.
      sources:
      - start_line: 55
        end_line: 64
        file: ''
      uid: 88a1fb1b-1531-47b1-afd5-07d97b218553
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c213b393-d5a8-46ca-8764-845c1696711c
      source_assumptions:
      - 1bbefed4-3da6-4cb9-a023-1e1ba52d9faf
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2449c243-48d1-48db-9d49-1cf9c69c741a
      source_assumptions:
      - f98afd80-b06e-484a-8eb8-ddc9843afaea
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'IMDB_Rating_range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: db374ae3-3703-4170-ba76-77b9481f272c
      source_assumptions:
      - 07fe8ad9-5dd1-4f1a-b53d-db3ec1231f40
    assumptions:
    - text: 'The ''IMDB_Rating'' column must contain numeric values that can be cast
        to float. We could represent this assumption as a deequ constraint like this:
        .isDataType(''IMDB_Rating'', ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 1bbefed4-3da6-4cb9-a023-1e1ba52d9faf
    - text: 'The ''IMDB_Rating'' column should not contain null or missing values,
        as it is directly used to calculate ''rating_norm'' and downstream ''content_quality''
        without filling missing values. We could represent this assumption as a deequ
        constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 92
        file: ''
      uid: f98afd80-b06e-484a-8eb8-ddc9843afaea
    - text: 'The ''IMDB_Rating'' column values should fall within the range [0.0,
        10.0], as dividing by 10.0 assumes a 10-point scale for normalization into
        [0.0, 1.0]. We could represent this assumption as a deequ constraint like
        this: .satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0'', ''IMDB_Rating
        Range'', lambda x: x == 1.0)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      uid: 07fe8ad9-5dd1-4f1a-b53d-db3ec1231f40
  Meta_score:
    code:
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a356099d-383f-4eab-a14e-1ca15e884818
      source_assumptions:
      - a091d287-ab5c-4ec3-b9c0-8799f1d61e52
    assumptions:
    - text: The 'Meta_score' column can contain missing (null) values because the
        code explicitly identifies non-null entries and imputes missing values using
        linear regression based on 'IMDB_Rating'.
      sources:
      - start_line: 67
        end_line: 83
        file: ''
      uid: a3ec81e1-c9c3-44c8-8a6e-318b5b55186e
    - text: The 'Meta_score' column must contain values that can be parsed as floating-point
        numbers, as it is converted to float using `.astype(float)`. We could represent
        this assumption as a data type constraint ensuring 'Meta_score' is numeric/fractional.
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 75
        end_line: 75
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: a091d287-ab5c-4ec3-b9c0-8799f1d61e52
    - text: The 'Meta_score' column must have at least 2 non-null values (co-occurring
        with non-null 'IMDB_Rating') to allow linear model fitting via `np.polyfit`
        of degree 1.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      uid: 5db6afb3-9b4d-4b49-8ae0-b2c96aeee4b3
  No_of_Votes:
    code:
    - suggestion: .isComplete('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8d3e99b5-e3b9-4b38-a8ab-b7c8c0dcf77f
      source_assumptions:
      - 1a382521-0215-489d-b089-68da25827639
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 14a5763a-7b0e-4a99-ba72-ba0e5d09eac2
      source_assumptions:
      - 1a382521-0215-489d-b089-68da25827639
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9f0cf93b-3a87-414b-aa07-afb1e5f945c3
      source_assumptions:
      - 7b03ebfa-9eb8-458e-aba9-46899ce904e4
    assumptions:
    - text: 'The ''No_of_Votes'' column must contain numeric values that can be cast
        to float and should not contain null values, as it is converted to float directly
        without imputation before computing logarithmic transforms.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("No_of_Votes")

        .isDataType("No_of_Votes", org.apache.spark.sql.types.DoubleType)'
      sources:
      - start_line: 47
        end_line: 48
        file: ''
      uid: 1a382521-0215-489d-b089-68da25827639
    - text: 'The ''No_of_Votes'' column should contain non-negative values (greater
        than or equal to 0) to ensure the logarithm operation `np.log1p` computes
        valid real numbers.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `No_of_Votes` >= 0 THEN 1 ELSE 0 END", "Non-negative
        No_of_Votes", lambda x: x == 1.0)'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: 7b03ebfa-9eb8-458e-aba9-46899ce904e4
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ef9bbf8b-464a-4ba7-a53a-eef4cd8563b1
      source_assumptions:
      - 9aa3edcf-14d6-4d3c-9555-1fc601c8a63e
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values (completeness
        of 1.0), as it is used directly as part of a MultiIndex and selected for the
        final output ranking files without any missing value handling or imputation.
        We could represent this assumption as a deequ constraint like this: .isComplete("Released_Year")'
      sources:
      - start_line: 101
        end_line: 101
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      - start_line: 114
        end_line: 115
        file: ''
      uid: 9aa3edcf-14d6-4d3c-9555-1fc601c8a63e
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 80edff5c-51c9-4009-b091-69e996a4df9a
      source_assumptions:
      - cabca36a-2d85-40ca-bb22-e7d5aba9d2a3
    - suggestion: '.hasPattern(''Runtime'', r''.*[0-9]{2,3}.*'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 42685e1e-830f-48c7-bc5c-671ba496f8ce
      source_assumptions:
      - cabca36a-2d85-40ca-bb22-e7d5aba9d2a3
    assumptions:
    - text: 'The ''Runtime'' column must not be null and each value must contain a
        2 to 3-digit numeric sequence (matching regex pattern ''.*[0-9]{2,3}.*''),
        because the code extracts ''([0-9]{2,3})'' and immediately casts the result
        to integer using `.astype(int)`. If any value fails to match or results in
        NaN, the type conversion to int will raise a ValueError.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", ".*[0-9]{2,3}.*", lambda x: x == 1.0)'
      sources:
      - start_line: 51
        end_line: 52
