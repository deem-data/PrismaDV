      reason_if_invalid: ''
      level: warning
      uid: edac6143-f321-4652-9de4-629a7b09fb5a
      source_assumptions:
      - c344a2bb-2106-4f19-a679-2118adec040e
    assumptions:
    - text: There must be at least two rows where both 'IMDB_Rating' and 'Meta_score'
        are non-null with variance in 'IMDB_Rating' to calculate their correlation
        and fit a linear model via np.polyfit.
      sources:
      - start_line: 67
        end_line: 77
        file: ''
      uid: f0f47e42-4cd4-4a27-bcd2-3c1c735a016c
    - text: For any record where 'Meta_score' is missing, 'IMDB_Rating' must be present
        (not null) so that the missing 'Meta_score' can be imputed using the linear
        regression model based on 'IMDB_Rating'.
      sources:
      - start_line: 79
        end_line: 83
        file: ''
      uid: c344a2bb-2106-4f19-a679-2118adec040e
