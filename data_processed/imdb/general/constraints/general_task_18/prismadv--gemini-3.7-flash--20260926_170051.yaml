  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: -1.0
        <= x <= 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7c20aaae-da7d-4afb-8858-aea4e98fb58c
