        end_line: 48
        file: ''
      uid: a3dd00cf-e0b7-4cb5-a2b0-ed3d70105cb5
    - text: 'The ''No_of_Votes'' column must contain non-negative numeric values (>=
        0) so that the np.log1p logarithmic transformation is mathematically valid.
        We could represent this assumption as a deequ constraint like this: .isNonNegative(''No_of_Votes'')'
      sources:
      - start_line: 47
        end_line: 47
        file: ''
      uid: c4bcb15a-6fa4-43d2-8576-3bab377a39be
