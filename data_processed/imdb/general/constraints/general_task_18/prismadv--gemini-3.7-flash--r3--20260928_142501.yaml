constraints:
  Gross:
    code:
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0.8)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 887577fd-114a-4502-89b2-3826e0fac362
      source_assumptions:
      - f6cd5691-b29d-4e21-941a-847e4f2f2bcb
    - suggestion: '.satisfies("CASE WHEN `Gross` IS NULL OR CAST(REPLACE(`Gross`,
        '','', '''') AS DOUBLE) >= 0 THEN 1 ELSE 0 END", "Non-negative Gross values",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6e4cb4a6-897d-41eb-90ee-320f0611882c
      source_assumptions:
      - b3b786ea-472d-44d7-b8e0-ed950bce0116
    assumptions:
    - text: 'The ''Gross'' column may contain missing or null values. The code uses
        pd.to_numeric with errors=''coerce'' and imputes missing Gross values with
        the median of existing values (or zeros if all are missing). We could represent
        this assumption as a deequ constraint like this: .isComplete(''Gross'')'
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: f6cd5691-b29d-4e21-941a-847e4f2f2bcb
    - text: 'When present and cleaned (removing commas), the ''Gross'' column is expected
        to be convertible to numeric values representing monetary gross earnings and
        should be non-negative (>= 0), as np.log1p is applied to the values. We could
        represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `Gross` IS NULL OR CAST(REPLACE(`Gross`, '','', '''') AS DOUBLE) >= 0
        THEN 1 ELSE 0 END", "Non-negative Gross values", lambda x: x == 1)'
      sources:
      - start_line: 55
        end_line: 64
        file: ''
      uid: b3b786ea-472d-44d7-b8e0-ed950bce0116
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 1edce60c-4572-45dd-8436-bbd6212df65a
      source_assumptions:
      - ac6f9b34-990a-4275-a365-81abbe5bc7c8
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 75dbeced-6e97-415e-a6a4-745cb6df5e69
      source_assumptions:
      - 4ba0a978-8bf3-488e-a48f-0b8d1cf3c494
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'IMDB_Rating_range_0_to_10')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f60f7168-66c6-4d5d-be54-4ca2671ccdff
      source_assumptions:
      - d9126893-9cc5-40ed-885f-8e726b5ef0c9
    assumptions:
    - text: 'The ''IMDB_Rating'' column should be numeric or castable to float, as
        the code directly casts it using `.astype(float)` in multiple operations.
        We could represent this assumption as a deequ constraint like this: .isDataType(''IMDB_Rating'',
        org.apache.spark.sql.types.DoubleType)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: ac6f9b34-990a-4275-a365-81abbe5bc7c8
    - text: 'The ''IMDB_Rating'' column should not contain null values, as it is directly
        used without missing-value imputation to compute ''rating_norm'', ''content_quality'',
        and the final ''PopularityIndex'' for all rows, as well as to impute missing
        ''Meta_score'' values. We could represent this assumption as a deequ constraint
        like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      - start_line: 92
        end_line: 96
        file: ''
      uid: 4ba0a978-8bf3-488e-a48f-0b8d1cf3c494
    - text: 'The ''IMDB_Rating'' column is expected to be on a 0 to 10 rating scale,
        as it is divided by 10.0 to produce a normalized score between 0.0 and 1.0.
        We could represent this assumption as a deequ constraint like this: .satisfies(''`IMDB_Rating`
        >= 0 AND `IMDB_Rating` <= 10'', ''IMDB_Rating range [0, 10]'', lambda x: x
        == 1.0)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      uid: d9126893-9cc5-40ed-885f-8e726b5ef0c9
  Meta_score:
    code:
    - suggestion: '.hasCompleteness(''Meta_score'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 86eddbcf-6e4d-4fb7-865c-b31b462d9920
      source_assumptions:
      - 27ebbf15-228a-4f16-9882-8713352d9b65
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a3f79931-51bb-4cd6-9294-4c85d41cec15
      source_assumptions:
      - 69308024-2e5c-4ecd-8029-675d583e6387
    - suggestion: .satisfies('`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score`
        <= 100)', 'meta_score_range_0_to_100')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0cde11a1-5a4f-4892-ba78-78bacb7e8543
      source_assumptions:
      - 06f5792a-4dc1-4621-9f20-e5f250d00eb2
    assumptions:
    - text: 'The ''Meta_score'' column can contain missing (null) values because the
        code explicitly identifies missing values and imputes them using a linear
        fit with ''IMDB_Rating''. However, there must be at least some non-null values
        (at least 2 valid rows) to fit the linear model via np.polyfit. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `Meta_score`
        IS NOT NULL THEN 1 ELSE 0 END", "Non-empty Meta_score", lambda x: x > 0)'
      sources:
      - start_line: 67
        end_line: 85
        file: ''
      uid: 27ebbf15-228a-4f16-9882-8713352d9b65
    - text: 'The ''Meta_score'' column should contain numeric values that can be cast
        to float, as the code applies `.astype(float)` directly on ''Meta_score''
        for correlation, polynomial fitting, and normalization. We could represent
        this assumption as a deequ constraint like this: .isDataType(''Meta_score'',
        ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 67
        end_line: 79
        file: ''
      uid: 69308024-2e5c-4ecd-8029-675d583e6387
    - text: 'The ''Meta_score'' column is expected to have values in the range [0,
        100], as the code normalizes it by dividing by 100.0 and clips imputed values
        to the range [0, 100]. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN `Meta_score` IS NULL OR (`Meta_score` >=
        0 AND `Meta_score` <= 100) THEN 1 ELSE 0 END", "Meta_score Range [0, 100]",
        lambda x: x == 1.0)'
      sources:
      - start_line: 81
        end_line: 85
        file: ''
      uid: 06f5792a-4dc1-4621-9f20-e5f250d00eb2
  No_of_Votes:
