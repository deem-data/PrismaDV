      - - .isComplete('Runtime')
        - Valid
      - - '.satisfies("CAST(regexp_extract(Runtime, ''^([0-9]{2,3}) min$'', 1) AS
          INT) BETWEEN 45 AND 240", ''runtime minutes range'', lambda x: x == 1.0)'
        - Valid
      assumptions: []
      column_name: Runtime
    Series_Title:
      code:
      - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x: x == 1.0)'
        - Valid
      - - .isComplete('Series_Title')
        - Valid
      - - '.satisfies("TRIM(Series_Title) <> ''''", ''nonempty title'', lambda x:
          x == 1.0)'
        - Valid
      assumptions: []
      column_name: Series_Title
