prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef robust_minmax(s: pd.Series,\
  \ low_q: float = 0.05, high_q: float = 0.95) -> pd.Series:\n    s = s.astype(float)\n\
  \    lo, hi = s.quantile(low_q), s.quantile(high_q)\n    denom = (hi - lo)\n   \
  \ if pd.notna(denom) and denom != 0:\n        return ((s.clip(lo, hi) - lo) / denom).fillna(0.5)\n\
  \    else:\n        return pd.Series(0.5, index=s.index)\n\n\ndef runtime_factor(minutes:\
  \ pd.Series) -> pd.Series:\n    min_minutes = 45\n    low_opt = 90\n    high_opt\
  \ = 150\n    max_minutes = 240\n    min_factor = 0.8\n    factor = np.ones(len(minutes),\
  \ dtype=float)\n    left = minutes < low_opt\n    right = minutes > high_opt\n \
  \   factor[left] = min_factor + (minutes[left] - min_minutes) / (low_opt - min_minutes)\
  \ * (1 - min_factor)\n    factor[right] = min_factor + (max_minutes - minutes[right])\
  \ / (max_minutes - high_opt) * (1 - min_factor)\n    factor = np.clip(factor, min_factor,\
  \ 1.0)\n    return pd.Series(factor, index=minutes.index)\n\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\nos.makedirs(args.output,\
  \ exist_ok=True)\n\ninput_file = os.path.join(args.input, 'new_data.csv')\ndf =\
  \ pd.read_csv(input_file)\n\n# Rating is used to normalize and to fit a calibration\
  \ with Meta_score\nrating_norm = df['IMDB_Rating'].astype(float) / 10.0\n\n# Votes\
  \ power part of the popularity model through a log transform\nvotes_log = np.log1p(df['No_of_Votes'].astype(float))\n\
  votes_norm = robust_minmax(votes_log)\n\n# Runtime shapes the final score via a\
  \ factor so its format and bounds must be consistent\nruntime_minutes = df['Runtime'].astype(str).str.extract(r'([0-9]{2,3})')[0].astype(int)\n\
  runtime_adj = runtime_factor(runtime_minutes)\n\n# Gross contributes a smaller boost;\
  \ ensure parsable for all present values\ndf['Gross_USD'] = pd.to_numeric(df['Gross'].astype(str).str.replace(',',\
  \ '', regex=False), errors='coerce')\n# Use a robust normalization on log gross;\
  \ fill missing with median to avoid penalizing titles without data\n_gross_for_norm\
  \ = df['Gross_USD'].copy()\nif _gross_for_norm.notna().any():\n    median_g = _gross_for_norm.median(skipna=True)\n\
  \    _gross_for_norm = _gross_for_norm.fillna(median_g)\nelse:\n    _gross_for_norm\
  \ = pd.Series(np.zeros(len(df)), index=df.index)\n\ngross_norm = robust_minmax(np.log1p(_gross_for_norm))\n\
  \n# Correlation between IMDB_Rating and Meta_score is used to calibrate blending\
  \ weight and for regression-based imputation\nmeta_valid_mask = df['Meta_score'].notna()\
  \ & df['IMDB_Rating'].notna()\nif meta_valid_mask.sum() > 1:\n    r = df.loc[meta_valid_mask,\
  \ 'IMDB_Rating'].astype(float).corr(df.loc[meta_valid_mask, 'Meta_score'].astype(float))\n\
  else:\n    r = np.nan\n# Fit a simple linear model Meta_score ~ a * IMDB_Rating\
  \ + b to impute missing Meta_score\nslope, intercept = np.polyfit(\n    df.loc[meta_valid_mask,\
  \ 'IMDB_Rating'].astype(float).values,\n    df.loc[meta_valid_mask, 'Meta_score'].astype(float).values,\n\
  \    1\n)\n\nmeta_filled = df['Meta_score'].astype(float).copy()\nmissing_meta =\
  \ meta_filled.isna()\nif missing_meta.any():\n    meta_filled.loc[missing_meta]\
  \ = np.clip(slope * df.loc[missing_meta, 'IMDB_Rating'].astype(float) + intercept,\
  \ 0,\n                                            100)\n\nmeta_norm = meta_filled\
  \ / 100.0\n\n# Blend rating and metascore with correlation-aware weights\nr_norm\
  \ = float(np.clip((r - 0.2) / 0.8, 0.0, 1.0))\nw_rating = 0.5 + 0.2 * r_norm\nw_meta\
  \ = 1.0 - w_rating\n\ncontent_quality = w_rating * rating_norm + w_meta * meta_norm\n\
  \n# Ensure Series_Title + Released_Year uniquely identifies a title row used for\
  \ ranking and output publishing keys\npopularity_index_base = 0.6 * content_quality\
  \ + 0.3 * votes_norm + 0.1 * gross_norm\npopularity_index = popularity_index_base\
  \ * runtime_adj\n\ndf['PopularityIndex'] = popularity_index\n\n# Set a MultiIndex\
  \ for downstream publishing keyed by title-year\n_ = df.set_index(['Series_Title',\
  \ 'Released_Year'], inplace=False)\n\ndf_sorted = df.sort_values('PopularityIndex',\
  \ ascending=False).copy()\ndf_sorted['Rank'] = np.arange(1, len(df_sorted) + 1)\n\
  \nall_out = df_sorted[[\n    'Series_Title', 'Released_Year', 'IMDB_Rating', 'Meta_score',\
  \ 'No_of_Votes', 'Runtime', 'Gross',\n    'PopularityIndex', 'Rank'\n]]\n\ntop_n\
  \ = min(100, len(all_out))\ntop_out = all_out.head(top_n)\n\nall_out.to_csv(os.path.join(args.output,\
  \ 'movie_popularity_ranking.csv'), index=False)\ntop_out.to_csv(os.path.join(args.output,\
  \ 'movie_popularity_top100.csv'), index=False)\n\n```\n\nThe same program is on\
  \ disk at `./code/general_task_18.py`, so you can run it against the\nstaged table,\
  \ step through it, or search it, rather than working from the\nlisting alone.\n\n\
