constraints:
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR trim(Gross) = '' OR Gross RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parsable_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.hasNumberOfDistinctValues(''IMDB_Rating'', lambda n: n >= 2)'
      - Invalid
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating > 0 AND IMDB_Rating <= 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.hasNumberOfDistinctValues(''Meta_score'', lambda n: n >= 2)'
      - Invalid
    - - .satisfies('Meta_score IS NULL OR (Meta_score >= 0 AND Meta_score <= 100)',
        'valid_meta_score_when_present')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .satisfies('No_of_Votes >= 0', 'nonnegative_votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year >= 1888', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$'", 'parsable_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - .satisfies('length(trim(Series_Title)) > 0', 'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title, Released_Year
