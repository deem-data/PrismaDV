      \ multiline expressions (each individual line of a multiline dictionary, set,\
      \ list, or function call increments the line count by 1; never collapse multiline\
      \ blocks into a single line).\n2. Scan the code text specifically for exact\
      \ occurrences of the target column name (e.g., as `'column_name'`, attribute\
      \ `.col`, or variable directly representing it).\n3. Pay close attention to\
      \ pass-through and export lines:\n   - When a column appears inside a multiline\
      \ list or collection (e.g., `out_cols = [..., 'column_name', ...]`), include\
      \ ONLY the exact, specific line(s) where the target column name itself is written.\n\
      \   - Do NOT include the entire definition block, preceding comments, subsequent\
      \ unrelated list elements, or general path setup lines (such as `output_file\
      \ = ...`) that do not contain the target column name.\n   - Only include export\
      \ calls (e.g., `to_csv`, `to_parquet`) if the target column name is explicitly\
      \ written in that call (e.g., `columns=['col_a', 'column_name']`).\n4. Include:\n\
      \   - DataFrame loading, column access, indexing, and slicing (e.g., df['col'],\
      \ df[['col', ...]], df.col).\n   - Column operations, type conversions, string\
      \ transformations, arithmetic, and filtering conditions.\n   - Associated definitions\
      \ and constants: sets, dictionaries, mapping tables, lists of allowed values,\
      \ or threshold constants directly applied to the column.\n   - Downstream derivations:\
      \ formulas, masks, or composite metrics using variables assigned from the target\
