      \ missingness (`.hasCompleteness` with a safe threshold) for required columns.\n\
      \  3. Domain bounds and format validity (e.g., non-negative scores, valid numeric\
      \ strings, bounded ratings [0, 10]) that feed mathematical formulas or filters.\n\
      \  4. Critical scale cutoffs (`.hasMax`) and key integrity (`.isUnique` / `.isComplete`\
      \ with verify_integrity=True).\n- Set level \"warning\" for loose informational\
      \ checks, non-critical bounds, or columns where an out-of-bound value is handled\
      \ gracefully by the code without corrupting calculations.\n- If the `assumptions`\
      \ list is empty `[]`, output `{\"constraint_code\": []}`. Do not invent ungrounded\
