constraints:
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR Gross RLIKE '^([0-9]+|[0-9]{1,3}(,[0-9]{3})+)$'",
        'parsable_gross')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  IMDB_Rating, Meta_score:
    code:
    - - '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda value: -1.0 <= value
        <= 1.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating, Meta_score
  Meta_score:
    code:
    - - .satisfies('Meta_score IS NULL OR Meta_score BETWEEN 0 AND 100', 'valid_meta_score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .satisfies('No_of_Votes >= 0', 'nonnegative_vote_count')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND 2100', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("Runtime RLIKE '^[0-9]{2,3} min$' AND CAST(regexp_extract(Runtime,
        '^([0-9]{2,3}) min$', 1) AS INT) BETWEEN 45 AND 240", 'valid_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - .isUnique(['Series_Title', 'Released_Year'])
      - Invalid
    assumptions: []
    column_name: Series_Title, Released_Year
