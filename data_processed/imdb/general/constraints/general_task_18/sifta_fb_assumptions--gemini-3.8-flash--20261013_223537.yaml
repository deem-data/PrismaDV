      \ in out_cols, subset=['col'], set_index, drop_duplicates, to_csv(columns=...))\n\
      - Keyword arguments and dictionary mappings referencing the column name\n\n\
      Verify the exact 1-based line numbers in the provided code; do not select blank\
      \ lines or unrelated statements. Put adjacent lines in one range.\n\nOutput\
      \ only JSON: { \"sources\": [{ \"start_line\": int, \"end_line\": int }, ...]\
      \ }"
    assumption_generation: 'Code makes assumptions about its input data, often without
      stating them. Analyze how the target column is used in the focused code and
      task context to infer these assumptions:

      1. Operational Requirements: What properties must hold for the code to run correctly?
      Look at operations like arithmetic, log transforms, string parsing, regex extraction,
      datetime comparisons, indexing (e.g., verify_integrity), and correlations.

      2. Silent Failure vs Tolerated Behavior: Distinguish between data properties
      the code strictly depends on to avoid crashes or silent wrong results (e.g.,
      valid rating ranges [0, 10], non-null keys in uniqueness checks, sufficient
      variance for correlation) versus properties the code gracefully handles via
      explicit fallbacks (e.g., fillna(0) for optional fields, errors=''coerce'').

      3. Schema & Passthrough Columns: If the column is passed through or exported
      (e.g., in out_cols), the code assumes the column exists, conforms to expected
      data types (e.g., String, Numeric), and preserves reasonable completeness. Never
      return an empty assumption list if the column is present in the pipeline.


      Write these assumptions as concrete statements about the input data that PyDeequ
      checks can test.


      Output only valid JSON (numbers without leading zeros): { "assumptions": [{
      "text": str, "sources": [{ "start_line": int, "end_line": int }] }, ...] }'
    ir_generation: "Translate the assumptions into PyDeequ checks. \n\nConstraint\
