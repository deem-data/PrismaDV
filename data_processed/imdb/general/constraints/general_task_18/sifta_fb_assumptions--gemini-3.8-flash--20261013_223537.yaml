      \ scores, invalid rankings, broken index integrity, or invalid output filters).\
      \ Note: code using errors='coerce' or clipping may not crash on invalid data,\
      \ but corrupting critical calculations constitutes a silent failure and must\
      \ be marked \"error\".\n- Set level \"warning\" ONLY if the code intentionally\
      \ tolerates and handles the condition (e.g., expected missing values handled\
      \ via business-logic fillna, or purely informational quality indicators).\n\
      - Avoid marking every constraint as \"warning\": an error-level constraint is\
      \ required to protect the pipeline against corrupt partitions.\n\nPrecision\
      \ & Robustness Guidelines:\n- Calibrate thresholds to avoid false alarms on\
      \ safe data: do not enforce strict completeness (.isComplete) on columns known\
      \ to contain legitimate nulls (e.g., Gross with ~83% completeness).\n- For bounded\
      \ metrics like IMDB_Rating, enforce the valid domain [0.0, 10.0] with .satisfies()\
      \ at \"error\" level if scores depend on this scaling.\n- Link each check to\
      \ the indices (from 0) of the assumptions it tests.\n\nOutput: {\"constraint_code\"\
      : [{\"suggestion\": PyDeequ code (starting with \".\" or a function), \"level\"\
      : \"warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
