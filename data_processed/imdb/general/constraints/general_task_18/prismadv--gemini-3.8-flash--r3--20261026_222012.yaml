constraints:
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(REPLACE(`Gross`, ',', '') AS
        DOUBLE) >= 0", "gross_non_negative_numeric")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d7ff15f1-70c9-4943-b1d2-6461cf96a38b
      source_assumptions:
      - 9511458b-23f0-49f7-ad35-f5f96963d17a
      - 293ae9db-7aff-482f-ae88-db74c7c1ceb4
    assumptions:
    - text: The 'Gross' column can contain missing or null values, as the code safely
        converts strings using `errors='coerce'` and explicitly checks `if _gross_for_norm.notna().any():`
        to impute missing values with the median or default to zeros.
      sources:
      - start_line: 55
        end_line: 62
        file: ''
      uid: 9511458b-23f0-49f7-ad35-f5f96963d17a
    - text: When present, values in the 'Gross' column should represent non-negative
        numbers formatted as numeric strings (optionally containing commas as thousand
        separators), because the code removes commas, parses them as numeric values,
        and applies `np.log1p` which requires values >= -1 (and semantically gross
        revenue is >= 0).
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 64
        end_line: 64
        file: ''
      uid: 293ae9db-7aff-482f-ae88-db74c7c1ceb4
  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7db322bf-d682-4c67-9e05-cc77f38b81c3
      source_assumptions:
      - 15bcb786-94d0-4890-9964-d6b17e117156
    - suggestion: '.satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0'',
        ''Valid IMDB Rating Range'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6fa6f030-7cd7-4de6-ba81-0a8a55740a36
      source_assumptions:
      - 9c109e53-66c8-47f2-a9b3-bd95b92e29f1
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5148a55f-e558-49ce-aca0-bfca62251f1e
      source_assumptions:
      - a43e4316-c1fb-45ef-b4a9-95cb7d488d3d
    assumptions:
    - text: 'The ''IMDB_Rating'' column should be numeric (fractional/float) and castable
        to float, as it is converted to float using `.astype(float)` for mathematical
        calculations including normalization, correlation, and linear regression.
        We could represent this assumption as a deequ constraint like this: .hasDataType(''IMDB_Rating'',
        ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 15bcb786-94d0-4890-9964-d6b17e117156
    - text: 'The ''IMDB_Rating'' column should have values within the valid rating
        range of 0.0 to 10.0, as the values are divided by 10.0 to calculate a normalized
        rating between 0 and 1. We could represent this assumption as a deequ constraint
        like this: .satisfies(''`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0'',
        ''Valid IMDB Rating Range'', lambda x: x == 1.0)'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      uid: 9c109e53-66c8-47f2-a9b3-bd95b92e29f1
    - text: 'The ''IMDB_Rating'' column should not contain null values (completeness
        of 1.0), because the code directly calculates `rating_norm = df[''IMDB_Rating''].astype(float)
        / 10.0` without any imputation or missing value handling, which is subsequently
        used to compute the ''PopularityIndex'' and rank all movies. We could represent
        this assumption as a deequ constraint like this: .isComplete(''IMDB_Rating'')'
      sources:
      - start_line: 44
        end_line: 44
        file: ''
      - start_line: 92
        end_line: 98
        file: ''
      - start_line: 103
        end_line: 104
        file: ''
      uid: a43e4316-c1fb-45ef-b4a9-95cb7d488d3d
  Meta_score:
    code:
    - suggestion: '.satisfies("CASE WHEN `Meta_score` IS NOT NULL THEN 1 ELSE 0 END",
        "Non-empty Meta_score", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c4645b07-1b01-4cc3-b422-630b7426d68f
      source_assumptions:
      - 0d17cbc2-0c41-4043-98ed-3cf865471526
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Fractional)
