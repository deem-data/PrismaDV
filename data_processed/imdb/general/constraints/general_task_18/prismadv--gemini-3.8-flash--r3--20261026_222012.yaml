      source_assumptions:
      - fb9228d8-80c0-43ba-8c30-c22d514c8958
    - suggestion: '.satisfies("CASE WHEN `Meta_score` IS NULL OR (`Meta_score` >=
        0 AND `Meta_score` <= 100) THEN 1 ELSE 0 END", "Meta_score Range [0, 100]",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a04cfe7e-52c3-4717-b9c9-eee913cd3dc4
      source_assumptions:
      - d0eff82a-dbd6-4c3c-9829-e2864cef6f91
    assumptions:
    - text: 'The ''Meta_score'' column can contain missing/null values, as the code
        explicitly detects null values using `df[''Meta_score''].notna()` and `isna()`,
        and imputes them using a linear regression fit. However, the column must contain
        at least 2 non-null values (concurrently valid with ''IMDB_Rating'') so that
        `np.polyfit` of degree 1 can execute successfully without raising an error.
        We could represent this assumption as a deequ constraint like this: .satisfies("CASE
        WHEN `Meta_score` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty Meta_score",
        lambda x: x > 0)'
      sources:
      - start_line: 67
        end_line: 67
        file: ''
      - start_line: 73
        end_line: 77
        file: ''
      - start_line: 79
        end_line: 83
        file: ''
      uid: 0d17cbc2-0c41-4043-98ed-3cf865471526
    - text: 'The non-null values in the ''Meta_score'' column must be convertible
        to float, as the code repeatedly calls `astype(float)` on ''Meta_score''.
        We could represent this assumption as a deequ constraint like this: .isDataType(''Meta_score'',
        ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 69
        end_line: 69
        file: ''
      - start_line: 75
        end_line: 75
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: fb9228d8-80c0-43ba-8c30-c22d514c8958
    - text: 'The values in the ''Meta_score'' column are expected to fall within the
        range of [0, 100], as indicated by the normalization by 100 (`meta_norm =
        meta_filled / 100.0`) and the clipping bounds [0, 100] applied to imputed
        values. We could represent this assumption as a deequ constraint like this:
        .satisfies("CASE WHEN `Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score`
        <= 100) THEN 1 ELSE 0 END", "Meta_score Range [0, 100]", lambda x: x == 1)'
      sources:
      - start_line: 82
        end_line: 85
        file: ''
      uid: d0eff82a-dbd6-4c3c-9829-e2864cef6f91
