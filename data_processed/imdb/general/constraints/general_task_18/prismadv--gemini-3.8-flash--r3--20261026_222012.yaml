    assumptions:
    - text: 'The ''Runtime'' column should not contain null values. If any values
        are missing, regex extraction will result in NaN, causing `.astype(int)` to
        raise a ValueError.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 50
        end_line: 51
        file: ''
      uid: d7405efc-1ca6-48e4-a94b-a226fe130c45
    - text: 'Each value in the ''Runtime'' column must contain a 2- to 3-digit integer
        matching the pattern `[0-9]{2,3}` (such as movie runtimes like ''142 min'').
        If a value does not match, `str.extract(r''([0-9]{2,3})'')` produces NaN,
        which causes the downstream `.astype(int)` conversion to fail.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Runtime` REGEXP ''[0-9]{2,3}''", "Runtime Contains 2 or 3 Digits",
        lambda x: x == 1.0)'
      sources:
      - start_line: 50
        end_line: 51
        file: ''
