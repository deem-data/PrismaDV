      in downstream computations)

      - Filtering, indexing, or conditions (e.g., `df.set_index`, quality gates, boolean
      masks)

      - Computations, scoring formulas, mappings, or extractions (e.g., weights, bonuses,
      log transformations)

      - Output column lists, feed schemas, or persistence selections (e.g., `out_cols`,
      `ranked_cols`, `feed_cols`, and lines where these are exported)


      Line Verification:

      - Scan the code script sequentially from line 1 (counting every single line,
      including blank lines, imports, and comments).

      - Verify that the target column name (or variable holding/derived from it) literally
      appears on the reported line numbers. Do not estimate or extrapolate line numbers.

      - Group adjacent continuous lines into a single range `{"start_line": int, "end_line":
      int}`.


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them explicitly. From the code that uses the target column, the column\
      \ metadata (target_column_desc), and the task description, generate statements\
      \ about the input data that a Deequ check can test:\n\n1. Operational & Crash-Prevention\
      \ Assumptions:\n   - Identify requirements necessary to prevent crashes or silent\
      \ corruption.\n   - Operations like `.astype(int)`, string methods (`.str.split`,\
      \ `.str.extract`), and unique indexing (`verify_integrity=True`) fail immediately\
      \ on nulls or non-conforming types.\n   - Note constructs like `pd.to_numeric(...,\
      \ errors='coerce')` or fallback `.get(..., default)`: coercing invalid data\
      \ to NaN or falling back to default values often silently distorts composite\
      \ scores, rankings, aggregations, or filters. State the assumption that input\
      \ values conform to valid parsable formats and required domains.\n\n2. Value\
      \ Bounds, Domains & Formats:\n   - Ground assumptions in code logic and dataset\
      \ conventions:\n     * Runtimes (e.g., `'Runtime'`): strings containing positive\
      \ integer minutes (e.g., pattern `^\\d+` or `^\\d+\\s*min$`) strictly greater\
      \ than 0.\n     * Categorical fields (e.g., `'Genre'`, `'Certificate'`): non-empty\
      \ strings matching expected domain sets (e.g., standard genres or certificates\
      \ used in weights or filters).\n     * Output & metadata fields (e.g., `'Director'`,\
      \ `'Series_Title'`): non-null, non-empty text strings.\n     * Numeric metrics\
      \ (e.g., ratings, votes): non-negative and bounded within valid ranges (e.g.,\
      \ [0.0, 10.0] for ratings).\n\n3. Output & Passthrough Integrity:\n   - If the\
      \ target column is included in output schemas, export lists, or catalog feeds\
      \ (e.g., `out_cols`, `ranked_cols`), downstream consumers depend on its integrity.\
      \ Assert that the column conforms to its expected data type, is non-empty, and\
      \ maintains baseline completeness consistent with `target_column_desc`.\n\n\
      4. Completeness & Strictness Calibration:\n   - When `target_column_desc['completeness']\
      \ == 1.0` and the downstream code crashes on nulls OR propagates NaNs into formulas\
      \ without filling, assume 100% completeness (`isComplete`). Relaxing to 90%\
      \ or 95% allows corruptions (such as 1-5% corrupted rows) to slip through undetected.\n\
      \   - If the column has documented missingness in clean data (`completeness\
      \ < 1.0`) OR downstream code safely tolerates missingness without corrupting\
      \ final business logic (e.g., explicit `.fillna('Not Rated')`), assume a calibrated\
      \ threshold aligned with observed completeness (e.g., `>= 0.95 * observed_completeness`).\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
      \ }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ (\"error\" vs \"warning\"):\n- Set level to \"error\" for every check whose\
      \ violation causes the code to crash OR run without error while silently producing\
      \ a wrong result. This includes:\n  * Operations failing or crashing downstream\
      \ (e.g., unparseable strings converted with `.astype(int)`, duplicate keys in\
      \ `verify_integrity=True`).\n  * Values coerced to NaNs or defaults that distort\
      \ downstream calculations, composite scores, rankings, or filtering logic (e.g.,\
      \ non-positive runtimes, unparseable runtime formats, invalid genre strings).\n\
      \  * Missing, null, or blank/empty data in critical feed/output columns (e.g.,\
      \ `out_cols`, `ranked_cols`) that silently degrade export quality.\n- CRITICAL:\
      \ Do NOT demote semantic validation checks (patterns, positive bounds, allowed\
      \ value sets, string non-emptiness) to \"warning\". Semantic checks are what\
      \ catch corrupted data partitions; marking them as \"warning\" prevents the\
      \ suite from rejecting bad batches.\n- Set level to \"warning\" ONLY for purely\
      \ optional checks where downstream code explicitly tolerates anomalies with\
      \ safe defaults AND whose violation has zero impact on output rankings, decisions,\
      \ or catalog integrity.\n\nPrecision, Robustness & Implementation Rules:\n1.\
      \ Completeness & Null Checks:\n   - If `target_column_desc['completeness'] ==\
      \ 1.0` and the column is used in operations that crash on nulls or propagate\
      \ NaNs into scoring/rankings, use `.isComplete('<column>')` at \"error\" level.\n\
      \   - If `target_column_desc['completeness'] < 1.0`, use `.hasCompleteness('<column>',\
      \ lambda x: x >= threshold)` scaled to the observed completeness (e.g., `lambda\
      \ x: x >= round(obs * 0.95, 2)`).\n2. String Non-Emptiness:\n   - PyDeequ `hasCompleteness`\
      \ and `hasDataType` treat empty strings (`\"\"`) as non-null strings. For text\
      \ and categorical columns that must not be blank, add `.satisfies(\"trim(`<column>`)\
