      source_assumptions:
      - 386edc3a-0bcd-486f-ae85-3b0f93370d94
      - 11e5d268-d855-4c89-a5dd-93479e307522
      - b365d0fb-0d48-476e-b68c-859cb28f0048
    assumptions:
    - text: The input must contain a 'Gross' column because the script reads it to
        calculate the popularity score and includes it in the ranking output.
      sources:
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 106
        end_line: 109
        file: ''
      uid: a83ccd6d-9b64-405c-9206-02b885436ecc
    - text: Null 'Gross' values are allowed. The script replaces missing gross amounts
        with the median of available amounts, or uses zeros if none are available.
        No minimum completeness is required.
      sources:
      - start_line: 57
        end_line: 64
        file: ''
      uid: 386edc3a-0bcd-486f-ae85-3b0f93370d94
    - text: Every non-null 'Gross' value should be convertible to a finite numeric
        amount after commas are removed. Other nonnumeric text, such as currency symbols,
        would be silently treated as missing rather than used as a gross amount.
      sources:
      - start_line: 55
        end_line: 60
        file: ''
      uid: 11e5d268-d855-4c89-a5dd-93479e307522
    - text: Every non-null 'Gross' amount should be zero or greater after parsing,
        so that the log1p transformation produces a valid value for normalization.
      sources:
      - start_line: 55
        end_line: 55
        file: ''
      - start_line: 64
        end_line: 64
        file: ''
      uid: b365d0fb-0d48-476e-b68c-859cb28f0048
