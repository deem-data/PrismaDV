constraints:
  Certificate:
    code:
    - - '.hasCompleteness(''Certificate'', lambda value: value >= 0.85)'
      - Valid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - '.hasCompleteness(''Gross'', lambda value: value >= 0.75)'
      - Valid
    - - .satisfies("Gross IS NULL OR Gross RLIKE '^([0-9]+|[1-9][0-9]{0,2}(,[0-9]{3})+)$'",
        'parseable_gross_or_missing')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating > 0 AND IMDB_Rating <= 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  IMDB_Rating, No_of_Votes:
    code:
    - - '.hasCorrelation(''IMDB_Rating'', ''No_of_Votes'', lambda value: -1.0 <= value
        <= 1.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating, No_of_Votes
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .hasPattern('Poster_Link', '^https?://[^ ]+$')
      - Valid
    - - .isComplete('Poster_Link')
      - Valid
    - - .isUnique('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND year(current_date())', 'plausible_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .isComplete('Runtime')
      - Valid
    - - .satisfies("TRIM(Runtime) RLIKE '^[0-9]+ *min$' AND CAST(regexp_extract(TRIM(Runtime),
        '^([0-9]+)', 1) AS INT) BETWEEN 1 AND 600", 'parseable_runtime_minutes')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
