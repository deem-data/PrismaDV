constraints:
  Certificate:
    code:
    - - '.satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'', ''PG-13'',
        ''UA'')", ''has_family_friendly_movies'', lambda x: x > 0)'
      - Valid
    assumptions: []
    column_name: Certificate
  Gross:
    code:
    - - .satisfies("`Gross` IS NULL OR (`Gross` RLIKE '^[0-9][0-9,]*$' AND CAST(REPLACE(`Gross`,
        ',', '') AS BIGINT) > 0)", 'valid_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - '.hasNumberOfDistinctValues(''IMDB_Rating'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('`IMDB_Rating` BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - '.hasNumberOfDistinctValues(''No_of_Votes'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    - - .satisfies("`Poster_Link` RLIKE '^https?://.+'", 'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('`Released_Year` BETWEEN 1888 AND YEAR(CURRENT_DATE())', 'valid_released_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("`Runtime` RLIKE '^[0-9]+ min$'", 'valid_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
