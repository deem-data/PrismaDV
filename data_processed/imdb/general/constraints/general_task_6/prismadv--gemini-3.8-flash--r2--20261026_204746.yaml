      reason_if_invalid: ''
      level: warning
      uid: 53de78b3-7792-4562-96ec-f4fe20b762e9
      source_assumptions:
      - 30872928-d580-45c0-b671-fea720010ca5
    - suggestion: '.satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'')", "Family Friendly Certificates Present", lambda x: x >
        0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 462f7db0-126f-47f6-b9ae-04d9b2e62ee0
      source_assumptions:
      - 740d01d2-e223-4179-9fe0-5b456b695144
    assumptions:
    - text: 'The ''Certificate'' column can contain missing (null) values, as the
        code explicitly handles missing values using `.fillna('''')` before performing
        string transformations. We could represent this assumption as a deequ constraint
        allowing completeness to be less than 1.0 (e.g., `.isComplete(''Certificate'',
        lambda x: x >= 0.0)` or checking that null values are permitted).'
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      uid: 2ff473d7-edb2-4557-bc72-3c312cae72e3
    - text: 'The ''Certificate'' column is expected to contain standard film certification
        ratings, typically matching the defined allowed set: ''U'', ''UA'', ''A'',
        ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''NOT RATED'', or ''UNRATED''
        (case-insensitive and trimmed). We could represent this assumption as a deequ
        constraint like: .satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''UA'',
        ''A'', ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''NOT RATED'', ''UNRATED'')
        OR `Certificate` IS NULL", "Allowed Certificate Values", lambda x: x >= 0.90)'
      sources:
      - start_line: 46
        end_line: 50
        file: ''
      uid: 30872928-d580-45c0-b671-fea720010ca5
    - text: 'The ''Certificate'' column is expected to contain at least some movies
        with family-friendly ratings (''U'', ''G'', ''PG'', ''PG-13'', ''UA'' when
        normalized) so that family-friendly eligibility filtering produces non-empty
        homepage outputs. We could represent this assumption as a deequ constraint
        like: .satisfies("CASE WHEN UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'') THEN 1 ELSE 0 END", "Family Friendly Certificates Present",
        lambda x: x > 0)'
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      - start_line: 84
        end_line: 85
        file: ''
      - start_line: 97
        end_line: 98
        file: ''
      - start_line: 108
        end_line: 108
        file: ''
      uid: 740d01d2-e223-4179-9fe0-5b456b695144
