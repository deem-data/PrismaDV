    - suggestion: '.satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''UA'', ''A'',
        ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''NOT RATED'', ''UNRATED'') OR
