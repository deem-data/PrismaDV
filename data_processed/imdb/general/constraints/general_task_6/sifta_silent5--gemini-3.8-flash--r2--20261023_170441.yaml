      \ inverted sorting, invalid rendered output, ID collisions).\n   - Distinguish\
      \ critical vs. non-critical columns: If a column is actively used in mathematical\
      \ scoring, ranking, or filtering, invalid values or coercion to NaN will silently\
      \ corrupt results even if `errors='coerce'` prevents an immediate crash. Formulate\
      \ strong assumptions for such columns. If a column is purely pass-through and\
      \ not used in calculations or gating, avoid overly strict assumptions that could\
      \ cause false alarms.\n   - Inspect `target_column_desc`: Check baseline completeness\
