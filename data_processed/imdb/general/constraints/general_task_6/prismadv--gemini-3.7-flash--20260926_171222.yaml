prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Certificate:
    code:
    - suggestion: '.satisfies("`Certificate` IS NULL OR TRIM(UPPER(CAST(`Certificate`
        AS STRING))) IN (''U'', ''UA'', ''A'', ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'',
        ''NOT RATED'', ''UNRATED'')", "valid_certificate_values", lambda x: x >= 0.8)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0de6e41d-d582-4ea8-a9db-d070d65c209a
      source_assumptions:
      - d2f8d207-cc71-4beb-9a6e-05691f82544f
      - 9ddbd201-ede3-4ef5-9072-342cd82d81fe
    - suggestion: '.satisfies("TRIM(UPPER(CAST(`Certificate` AS STRING))) IN (''U'',
        ''G'', ''PG'', ''PG-13'', ''UA'')", "has_family_friendly_certificates", lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: acbcb218-f236-42ea-812a-8d0f46d7a58e
      source_assumptions:
      - 9ddbd201-ede3-4ef5-9072-342cd82d81fe
    assumptions:
    - text: The 'Certificate' column may contain missing or null values, as the downstream
        code handles nulls using `.fillna('')` before string transformations.
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      uid: d2f8d207-cc71-4beb-9a6e-05691f82544f
    - text: The 'Certificate' column contains movie rating/certificate categories
        (e.g., 'U', 'UA', 'A', 'G', 'PG', 'PG-13', 'R', 'NC-17', 'NOT RATED', 'UNRATED'),
        and the dataset should contain at least some rows with family-friendly certificates
        ('U', 'G', 'PG', 'PG-13', 'UA') so that family-friendly filtering does not
        produce an empty output.
      sources:
      - start_line: 46
        end_line: 50
        file: ''
      - start_line: 84
        end_line: 85
        file: ''
      - start_line: 97
        end_line: 98
        file: ''
      uid: 9ddbd201-ede3-4ef5-9072-342cd82d81fe
  Genre:
    code:
    - suggestion: .hasDataType('Genre', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ea9d0f43-4e17-45ed-8950-b5cbf0e8ea02
      source_assumptions:
      - 8cb6cd0a-d4c3-4ac9-b06d-e24faf04a9c2
    assumptions:
    - text: 'The ''Genre'' column must exist in the dataset and contain string data,
        as it is read, converted to string using `.astype(str)`, and selected for
        the final output CSV files (''homepage_ranked_family_friendly.csv'' and ''homepage_top50.csv'').

        We could represent this assumption as a deequ constraint like this:

        .hasDataType(''Genre'', ConstrainableDataTypes.String)

        '
      sources:
      - start_line: 17
        end_line: 17
        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      - start_line: 101
        end_line: 108
        file: ''
      uid: 8cb6cd0a-d4c3-4ac9-b06d-e24faf04a9c2
  Gross:
    code:
    - suggestion: '.satisfies("`Gross` IS NULL OR `Gross` RLIKE ''^[0-9,]+$''", "Gross_format_valid",
        lambda x: x >= 0.95)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c2f9fe6c-2280-45ec-8582-0fd893fe63e9
      source_assumptions:
      - a1a7ee77-7257-4ee7-b02f-0963dc009d37
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0.7)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dbf1243f-6095-4c3c-950a-3bedab46591e
      source_assumptions:
      - 152d2008-0096-482d-abb7-eb017ff396b9
    assumptions:
    - text: The 'Gross' column is expected to exist in the dataset and contain string
        or numeric representations of gross earnings (possibly formatted with commas,
        e.g., '100,000,000'). The code converts the column to string, removes commas,
        and parses it into numeric values, coercing invalid values.
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      uid: a1a7ee77-7257-4ee7-b02f-0963dc009d37
    - text: The 'Gross' column can contain null/missing values or non-positive values,
        as the code safely coerces invalid numbers, fills missing values with 0, and
        handles the case where no positive gross values exist.
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      - start_line: 58
        end_line: 63
        file: ''
      uid: 152d2008-0096-482d-abb7-eb017ff396b9
  IMDB_Rating:
    code:
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a40d6f50-cb48-4c6e-8165-b32c4f7a0a29
      source_assumptions:
      - 7bb6f165-da7d-45a6-990e-ca8d88844287
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Fractional)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 51f07154-a4f4-4632-8937-0dbba8db71c6
      source_assumptions:
      - 7bb6f165-da7d-45a6-990e-ca8d88844287
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'Rating
        In 0-10 Range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2f82fdb4-f816-4450-8806-2dcb29e9973c
      source_assumptions:
      - 76d9707f-2888-4e12-9037-c25bc420e924
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values or numeric string
        representations that can be parsed to float, with at least some non-null valid
        values present so that correlation with ''No_of_Votes'' and normalization
        can be computed.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("IMDB_Rating")

        .isDataType("IMDB_Rating", ConstrainableDataTypes.Fractional)'
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 33
        end_line: 33
        file: ''
      uid: 7bb6f165-da7d-45a6-990e-ca8d88844287
    - text: 'The ''IMDB_Rating'' column values are expected to be within the standard
        IMDb rating range (typically between 0.0 and 10.0), as the code divides the
        rating by 10.0 to normalize it for composite score calculation.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CAST(`IMDB_Rating` AS DOUBLE) >= 0.0 AND CAST(`IMDB_Rating` AS
        DOUBLE) <= 10.0", "Rating In 0-10 Range", lambda x: x == 1.0)'
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: 76d9707f-2888-4e12-9037-c25bc420e924
