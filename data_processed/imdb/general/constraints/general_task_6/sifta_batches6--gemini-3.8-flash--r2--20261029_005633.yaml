      - Meaningful Assertions: Never generate vacuous assertions like `lambda x: x\
      \ >= 0` for completeness or ratios. Use realistic thresholds that catch major\
      \ drops or missing data while tolerating minor variations (e.g., `lambda x:\
      \ x >= 0.8` or `lambda x: x >= 0.9` for expected complete columns).\n- Constraint\
      \ Level Guidelines:\n  - Set level \"error\" if violating the check causes code\
