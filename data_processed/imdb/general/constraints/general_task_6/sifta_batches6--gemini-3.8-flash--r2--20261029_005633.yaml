      outputs make about the input data:

      1. Identify Critical Schema and Downstream Requirements: Determine what properties
      must hold for the code to execute safely without crashing (e.g., type compatibility,
      unhandled nulls, regex patterns) OR silently producing wrong or corrupted results
      (e.g., corrupted rankings, invalid score calculations, or broken downstream
      catalog/feed output files). Even if a column is passed through without complex
      transformations or guarded by defensive column checks (like `[c for c in cols
      if c in df.columns]`), downstream feeds still require the column to conform
      to its expected data type (e.g., String for text/names, Numeric for metrics)
      and maintain data integrity.

      2. Ground Assumptions in Observed Characteristics: Use target_column_desc (dataType,
      completeness, distinct values) together with code semantics. State positive,
      verifiable requirements: data type conformance, valid domain ranges (e.g., ratings
      between 0 and 10, non-negative counts/votes), and realistic completeness thresholds.

      3. Distinguish True Tolerances from Unconstrained Data: Notice when code explicitly
      handles missing values (e.g., fillna, errors=''coerce''). Do not assume 100%
      strict completeness or uniqueness if code safely handles nulls or duplicates,
      but do not conclude that the column has zero requirements or can take arbitrary
      types. Always formulate at least one actionable assumption reflecting the column''s
      required data type and valid format.


