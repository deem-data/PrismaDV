constraints:
  Certificate:
    code:
    - - '.hasCompliance(''family-friendly titles available'', "upper(trim(`Certificate`))
        IN (''U'', ''G'', ''PG'', ''PG-13'', ''UA'')", lambda proportion: proportion
        > 0)'
      - Invalid
    assumptions: []
    column_name: Certificate
  Gross:
    code:
    - - .satisfies("`Gross` IS NULL OR regexp_replace(`Gross`, ',', '') RLIKE '^[0-9]+$'",
        'gross parseable when present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('`IMDB_Rating` > 0 AND `IMDB_Rating` <= 10', 'rating on IMDb scale')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  IMDB_Rating, No_of_Votes:
    code:
    - - '.hasCorrelation(''IMDB_Rating'', ''No_of_Votes'', lambda value: value is
        not None and value == value)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating, No_of_Votes
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    - - .isUnique('Poster_Link')
      - Valid
    - - .satisfies("`Poster_Link` RLIKE '^https?://[^ ]+$'", 'valid poster URL')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('`Released_Year` BETWEEN 1888 AND year(current_date())', 'plausible
        release year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("trim(`Runtime`) RLIKE '^[0-9]+ min$' AND CAST(regexp_extract(trim(`Runtime`),
        '^([0-9]+)', 1) AS INT) > 0", 'parseable positive runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
