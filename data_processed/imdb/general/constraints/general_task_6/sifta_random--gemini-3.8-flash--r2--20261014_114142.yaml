  instructions:
    dataflow_inspector: 'Carefully inspect the code script to identify every line
      that directly references or operates on the target column (reads it, writes
      it, filters on it, transforms it, merges it, or accesses it via indexing, attributes,
      or iterators like itertuples).


      Line Counting Instructions:

      - Line 1 is the very first line of `code_script`.

      - Count every line sequentially, including import statements, blank/empty lines,
      comments, and function headers. Do NOT skip or collapse empty lines.

      - Locate the literal target column name (e.g., `''Star3''`, `''Genre''`) in
      the code script text. Verify that the target column name actually appears or
      is explicitly referenced on each identified line.

      - Do not include lines that operate on unrelated columns or intermediate variables
      before the target column is accessed.

      - Use 1-based line numbers matching the script exactly; merge contiguous lines
      into a single range [start_line, end_line].


      Output only JSON: { "sources": [{ "start_line": int, "end_line": int }, ...]
      }'
    assumption_generation: "Analyze how the target column is used in the code and\
      \ downstream task to determine the input data assumptions necessary for the\
      \ pipeline to run reliably and correctly.\n\nFocus on:\n1. Operational Failure\
      \ & Silent Corruption: Identify data conditions that cause downstream exceptions\
      \ (e.g., unhandled nulls passed to int() or math operations, regex extraction\
      \ yielding NaN before integer casting, unparseable strings) or silent calculation\
      \ corruption (e.g., negative vote counts, zero or negative runtimes, division\
      \ by zero, invalid rating ranges). Even when helper functions handle parsing\
      \ safely (e.g., returning NaN on unparseable input), corrupted domain values\
      \ (such as zero/negative runtimes or out-of-range ratings) silently corrupt\
      \ downstream scoring, filtering, and output catalogs.\n2. Code Tolerance vs\
      \ Hard Semantic Requirements: Distinguish between format variations the code\
      \ can absorb and semantic violations that corrupt results:\n   - When code uses\
      \ fallback defaults (`fillna(0)`, `fillna('default')`, `errors='coerce'`), occasional\
      \ nulls or unparseable entries are tolerated. State that occasional nulls are\
      \ acceptable, requiring only that non-null values satisfy semantic validity\
      \ (e.g., non-negative votes).\n   - If clean training metadata (`target_column_desc`)\
      \ shows `completeness: 1.0` and the code does NOT use fallback defaults or fillna\
      \ for this column, assume the column must remain fully complete (zero nulls)\
      \ and non-blank.\n   - Do NOT assume specific quantile or distribution values\
      \ (e.g., \"70th percentile of No_of_Votes must be > 0\"). Downstream code calculates\
      \ quantiles dynamically to adapt to partition distributions; asserting fixed\
      \ quantiles across partitions creates brittle assumptions.\n3. Pass-Through\
      \ & Output Catalog Columns:\n   - When columns (e.g., 'Star1'-'Star4', 'Director',\
      \ 'Overview', 'Series_Title', 'Genre') are selected for inclusion in the final\
      \ exported feed/catalog without mathematical operations, missing entries, empty/blank\
      \ strings, or invalid data types corrupt the catalog feed records. If `completeness:\
      \ 1.0` in the clean data descriptor, assume these columns must be fully complete\
      \ (no nulls) and contain non-blank text.\n4. Domain Semantics & Dataset Conventions\
      \ (IMDb / Media Catalog):\n   - 'Runtime': film duration in minutes (e.g., '142\
      \ min'). Runtimes must contain digits and represent strictly positive integers\
      \ (> 0 minutes). Empty or non-digit entries cause `str.extract(r'(\\d+)')[0].astype(int)`\
      \ to fail with ValueError.\n   - 'IMDB_Rating': ratings must be valid numeric\
      \ scores bounded between 0.0 and 10.0.\n   - 'No_of_Votes': vote counts must\
      \ be non-negative integers (>= 0). Occasional missing values are filled with\
      \ 0.\n   - 'Gross': box office earnings must be non-negative monetary figures\
      \ formatted as digit strings with optional commas.\n   - 'Released_Year': release\
      \ years must be positive 4-digit years (e.g., 1880 to 2100). When converted\
      \ via `int(r['Released_Year'])` on filtered rows, values must be strictly complete\
      \ without unhandled nulls.\n\nState each assumption clearly, highlighting whether\
      \ violating it causes crashes, silent calculation/output corruption, or if it\
      \ is purely advisory/tolerated.\n\nOutput only valid JSON (numbers without leading\
      \ zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ Assignment:\n- Set level \"error\" for any check whose violation causes downstream\
      \ code to crash OR silently produce incorrect results (e.g., zero or negative\
      \ runtimes in positive-only duration metrics, ratings outside [0, 10], negative\
      \ vote counts, division by zero, unhandled nulls or blank entries in catalog\
      \ records).\n- CRITICAL: Do NOT mark all constraints for a column as \"warning\"\
      . If a column has only warning-level constraints, the validation suite can never\
      \ reject an erroneous batch for that column. Every column actively used, transformed,\
      \ or exported to the final catalog MUST have at least one \"error\" check (such\
      \ as completeness, non-blank checks, or semantic bounds).\n- Set level \"warning\"\
      \ ONLY for non-critical, purely advisory checks where anomalous values are safely\
      \ handled by the code without degrading or corrupting the final output.\n\n\
      Precision and False Alarm Prevention:\n- Avoid Brittle Aggregate Checks: NEVER\
      \ set aggregate distribution checks (`.hasApproxQuantile()`, `.hasMean()`, `.hasStandardDeviation()`)\
      \ to level \"error\". Partition-level sample size variance and natural shifts\
      \ cause statistical quantiles to fail on safe partitions, creating false alarms.\n\
      - Completeness and Null Checks:\n  - When `target_column_desc` shows `completeness:\
      \ 1.0` and the downstream code relies on the column (for casting like `int()`,\
      \ filtering, or catalog export) without a `fillna()` default, assert `.isComplete(column)`\
      \ at level \"error\". Do NOT artificially soften complete columns to `lambda\
      \ x: x >= 0.90` or `0.95`, which fails to detect corruptions where a small percentage\
      \ of nulls are injected.\n  - Only relax completeness thresholds (e.g., `.hasCompleteness(column,\
      \ lambda x: x >= threshold)`) when `target_column_desc` shows `completeness\
      \ < 1.0` in clean data or when code explicitly uses `fillna()` to handle missing\
      \ values.\n- Non-Blank Text Validation for String Columns:\n  - For text and\
      \ catalog metadata columns (e.g., 'Series_Title', 'Genre', 'Director', 'Star1'-'Star4',\
      \ 'Overview'), avoid redundant `.hasDataType(..., ConstrainableDataTypes.String)`\
      \ (all CSV string columns pass trivially, catching no errors). Instead, check\
      \ that strings are non-blank using SQL `.satisfies()`:\n    Example: `.satisfies(\"\
      `Director` IS NOT NULL AND TRIM(`Director`) != ''\", \"director_not_blank\"\
      )` at level \"error\".\n- Validating Non-Negative and Bounded Columns: Do NOT\
      \ use rigid built-in `.isNonNegative()` or `.isPositive()` with default parameters\
      \ if a column can contain occasional nulls tolerated by `fillna(0)` (built-in\
      \ checks fail if any row is null). Instead, validate using null-tolerant SQL\
      \ `.satisfies()`:\n  Example: `.satisfies('`No_of_Votes` IS NULL OR CAST(`No_of_Votes`\
      \ AS DOUBLE) >= 0', 'votes_non_negative')` at level \"error\".\n- Validating\
      \ Bounded Numeric Columns: For ratings and bounded metrics, use explicit range\
      \ checks:\n  Example: `.satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <=\
      \ 10.0', 'imdb_rating_between_0_and_10')` at level \"error\".\n- Validating\
      \ String-Encoded Numbers: For columns like 'Runtime' (\"142 min\"), validate\
      \ strictly positive numeric values via `.satisfies()`:\n  Example: `.satisfies(\"\
      `Runtime` IS NULL OR CAST(REGEXP_EXTRACT(`Runtime`, '(-?[0-9]+)', 1) AS INT)\
      \ > 0\", \"runtime_positive\")` at level \"error\".\n- Link each check to the\
      \ indices (from 0) of the assumptions it tests.\n\nOutput: {\"constraint_code\"\
      : [{\"suggestion\": PyDeequ code (starting with \".\" or a function), \"level\"\
      : \"warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
