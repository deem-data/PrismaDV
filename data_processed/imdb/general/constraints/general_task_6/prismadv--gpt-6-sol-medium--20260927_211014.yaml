        normalize, after trimming whitespace and converting to uppercase, to one of
        'U', 'G', 'PG', 'PG-13', or 'UA'. At least one input row should have such
        a label if the family-friendly exports are expected to contain rows. Other
        certificate labels are permitted but are excluded from those exports.
