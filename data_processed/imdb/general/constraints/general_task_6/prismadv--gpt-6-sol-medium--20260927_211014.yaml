        end_line: 43
        file: ''
      - start_line: 57
        end_line: 63
        file: ''
      uid: ea01a75b-bc21-4dc7-a3bb-761ba02b48af
    - text: For gross revenue to contribute meaningfully to ranking, the input should
        contain at least two distinct, positive, parseable 'Gross' amounts. With only
        one distinct positive amount, the log-normalization range is zero; with no
        positive amounts, every row receives a zero gross score.
