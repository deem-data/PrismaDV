prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nfrom datetime import datetime\n\nimport numpy as np\nimport pandas as\
  \ pd\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--input', type=str,\
  \ required=True)\nparser.add_argument('--output', type=str, required=True)\nargs\
  \ = parser.parse_args()\n\ninput_csv = os.path.join(args.input, 'new_data.csv')\n\
  output_dir = args.output\nos.makedirs(output_dir, exist_ok=True)\n\ndf = pd.read_csv(input_csv)\n\
  # Poster link quality checks before using for dedup and URL passthrough\nposter_series\
  \ = df['Poster_Link'].astype(str)\n# Released year checks and parsing before recency\
  \ computation\nyear_str = df['Released_Year'].astype(str).str.strip()\nyear_int\
  \ = pd.to_numeric(year_str, errors='coerce')\ncurrent_year = datetime.now().year\n\
  # IMDB rating checks before normalization and scoring\nratings = pd.to_numeric(df['IMDB_Rating'],\
  \ errors='coerce')\nrating_norm = ratings / 10.0\n\n# Votes checks before log computation\
  \ and correlation-based weighting\nvotes = pd.to_numeric(df['No_of_Votes'], errors='coerce')\n\
  votes_log = np.log10(votes.clip(lower=1))\n\n# Correlation assumptions used to weight\
  \ the composite score components\ncorr = pd.concat([ratings, votes], axis=1).dropna().corr().iloc[0,\
  \ 1]\n# Runtime checks and parsing; used for a small tie-breaker bonus\nruntime_str\
  \ = df['Runtime'].astype(str).str.strip()\nruntime_min = pd.to_numeric(runtime_str.str.extract(r'^(\\\
  d+)', expand=False), errors='coerce')\n# Smooth bonus centered around ~100 minutes\n\
  runtime_bonus = np.exp(-((runtime_min - 100.0) ** 2) / (2 * (35.0 ** 2)))\n\n# Gross\
  \ parsing and checks; used for scoring\ngross_str = df['Gross'].astype('string')\n\
  present_mask = gross_str.notna()\ngross_num = pd.to_numeric(gross_str.str.replace(',',\
  \ '', regex=False), errors='coerce').fillna(0)\n\n# Certificate checks; used to\
  \ enforce family-friendly eligibility\ncert_series = df['Certificate']\ncert_upper\
  \ = cert_series.fillna('').astype(str).str.strip().str.upper()\nallowed_cert_set\
  \ = {\n    'U', 'UA', 'A', 'G', 'PG', 'PG-13', 'R', 'NC-17', 'NOT RATED', 'UNRATED'\n\
  }\n# Cross-field logic between certificate and genre\ngenre_str = df['Genre'].astype(str)\n\
  # Recency transformation\nage = (current_year - year_int).clip(lower=0)\nrecency_score\
  \ = 1.0 / (1.0 + (age / 5.0))\n\n# Gross normalization (log scale)\nif (gross_num\
  \ > 0).any():\n    gross_log = np.log10(gross_num.where(gross_num > 0, np.nan))\n\
  \    gross_log = (gross_log - np.nanmin(gross_log)) / (np.nanmax(gross_log) - np.nanmin(gross_log))\n\
  \    gross_norm = gross_log.fillna(0.0)\nelse:\n    gross_norm = pd.Series(0.0,\
  \ index=df.index)\n\n# Votes normalization (log scale)\nvotes_log_min = votes_log.min()\n\
  votes_log_ptp = votes_log.max() - votes_log.min()\nvotes_norm = (votes_log - votes_log_min)\
  \ / (votes_log_ptp if votes_log_ptp != 0 else 1.0)\n\n# Dynamic weighting based\
  \ on observed correlation (guarded earlier)\nvote_weight = min(0.35, max(0.20, float(corr)))\n\
  fixed_weights_sum = 0.15 + 0.15 + 0.05  # recency + gross + runtime\nrating_weight\
  \ = 1.0 - (vote_weight + fixed_weights_sum)\n\ncomposite_score = (\n        rating_weight\
  \ * rating_norm +\n        vote_weight * votes_norm +\n        0.15 * recency_score\
  \ +\n        0.15 * gross_norm +\n        0.05 * runtime_bonus\n)\n\n# Family-friendly\
  \ eligibility\nfamily_allowed = {'U', 'G', 'PG', 'PG-13', 'UA'}\neligible_mask =\
  \ cert_upper.isin(family_allowed)\n\n# Prepare output: dedupe by poster and rank\n\
  work = df.copy()\nwork['CompositeScore'] = composite_score\nwork['EligibleFamilyFriendly']\
  \ = eligible_mask\nwork['Year'] = year_int\n\n# Use poster link uniqueness assumption\
  \ to deduplicate display items\nwork = work.sort_values(['EligibleFamilyFriendly',\
  \ 'CompositeScore'], ascending=[False, False])\nwork = work.drop_duplicates(subset=['Poster_Link'],\
  \ keep='first')\n\nranked = work[work['EligibleFamilyFriendly']].copy()\nranked\
  \ = ranked.sort_values('CompositeScore', ascending=False)\n\n# Persist outputs\n\
  ranked_cols = [\n    'Series_Title', 'Released_Year', 'IMDB_Rating', 'No_of_Votes',\
  \ 'Gross',\n    'Certificate', 'Genre', 'Poster_Link', 'CompositeScore'\n]\nranked[ranked_cols].to_csv(os.path.join(output_dir,\
  \ 'homepage_ranked_family_friendly.csv'), index=False)\n\n# Also export top 50 for\
  \ immediate homepage usage\nranked.head(50)[ranked_cols].to_csv(os.path.join(output_dir,\
  \ 'homepage_top50.csv'), index=False)\n\n```\n\nThe same program is on disk at `./code/general_task_6.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 200, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BZjZlZDlkYTktMmU1My00ZDBiLWFlNjEtYTBhNjVhOTM4ZjJjXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Donnie Darko', 'Released_Year': 2001, 'Certificate': 'R', 'Runtime':\
  \ '113 min', 'Genre': 'Drama, Mystery, Sci-Fi', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'After narrowly escaping a bizarre accident, a troubled teenager is plagued by\
  \ visions of a man in a large rabbit suit who manipulates him to commit a series\
  \ of crimes.', 'Meta_score': 88.0, 'Director': 'Richard Kelly', 'Star1': 'Jake Gyllenhaal',\
  \ 'Star2': 'Jena Malone', 'Star3': 'Mary McDonnell', 'Star4': 'Holmes Osborne',\
  \ 'No_of_Votes': 740086, 'Gross': '1,480,006'}, {'id': 56, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BOWVmZGQ0MGYtMDI1Yy00MDkxLWJiYjQtMmZjZmQ0NDFmMDRhXkEyXkFqcGdeQXVyNjg3MDMxNzU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'The Peanut Butter Falcon', 'Released_Year': 2019, 'Certificate':\
  \ 'PG-13', 'Runtime': '97 min', 'Genre': 'Adventure, Comedy, Drama', 'IMDB_Rating':\
  \ 7.6, 'Overview': 'Zak runs away from his care home to make his dream of becoming\
  \ a wrestler come true.', 'Meta_score': 70.0, 'Director': 'Tyler Nilson', 'Star1':\
  \ 'Michael Schwartz', 'Star2': 'Zack Gottsagen', 'Star3': 'Ann Owens', 'Star4':\
  \ 'Dakota Johnson', 'No_of_Votes': 66346, 'Gross': '13,122,642'}, {'id': 43, 'Poster_Link':\
  \ 'https://m.media-amazon.com/images/M/MV5BMDU2ZWJlMjktMTRhMy00ZTA5LWEzNDgtYmNmZTEwZTViZWJkXkEyXkFqcGdeQXVyNDQ2OTk4MzI@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Toy Story', 'Released_Year': 1995, 'Certificate': 'U', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Adventure, Comedy', 'IMDB_Rating': 8.3, 'Overview':\
  \ \"A cowboy doll is profoundly threatened and jealous when a new spaceman figure\
  \ supplants him as top toy in a boy's room.\", 'Meta_score': 95.0, 'Director': 'John\
  \ Lasseter', 'Star1': 'Tom Hanks', 'Star2': 'Tim Allen', 'Star3': 'Don Rickles',\
  \ 'Star4': 'Jim Varney', 'No_of_Votes': 887429, 'Gross': '191,796,233'}]\n\nThe\
  \ full table is on disk at `./data/tables/observed_data.csv`. You have complete\
  \ access to it:\nload it with pandas, profile it, plot it, run whatever analysis\
  \ helps. It is a\nthrowaway copy -- nothing you do to it has any effect outside\
  \ this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ constraint\
  \ code against the staged table and read back\nthe result of every check:\n\n```\n\
  python deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
