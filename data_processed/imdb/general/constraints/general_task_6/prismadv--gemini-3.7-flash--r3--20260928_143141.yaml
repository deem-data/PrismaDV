prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: .isContainedIn('Certificate', ['U', 'UA', 'A', 'G', 'PG', 'PG-13',
        'R', 'NC-17', 'NOT RATED', 'UNRATED'])
      validity: false
      reason_if_invalid: 'Constraint ''.isContainedIn(''Certificate'', [''U'', ''UA'',
        ''A'', ''G'', ''PG'', ''PG-13'', ''R'', ''NC-17'', ''NOT RATED'', ''UNRATED''])''
        failed on data sample: Value: 0.9499165275459098 does not meet the constraint
        requirement!'
      level: warning
      uid: 5a8fe922-092a-4270-b0fd-f58096490a62
      source_assumptions:
      - 4be2c443-9752-4127-a498-f02ed7e8965a
    assumptions:
    - text: The 'Certificate' column can contain null or missing values, as the code
        safely handles missing certificates using .fillna('') before processing.
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      uid: f4883f89-1474-40aa-806b-865a40c40502
    - text: The 'Certificate' column is expected to contain categorical certificate
        ratings such as 'U', 'UA', 'A', 'G', 'PG', 'PG-13', 'R', 'NC-17', 'NOT RATED',
        or 'UNRATED', and should include family-friendly ratings ('U', 'G', 'PG',
        'PG-13', 'UA') so that movies can be filtered for the family-friendly homepage
        list.
      sources:
      - start_line: 46
        end_line: 50
        file: ''
      - start_line: 84
        end_line: 85
        file: ''
      - start_line: 97
        end_line: 98
        file: ''
      uid: 4be2c443-9752-4127-a498-f02ed7e8965a
  Genre:
    code:
    - suggestion: .hasDataType('Genre', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1dc7bf63-8571-405a-b37a-d53062f873d4
      source_assumptions:
      - 6e43d207-19d0-4d06-8f60-d76839ef1ab4
    assumptions:
    - text: The 'Genre' column must exist in the input dataset because it is directly
        accessed and selected for the exported ranked outputs.
