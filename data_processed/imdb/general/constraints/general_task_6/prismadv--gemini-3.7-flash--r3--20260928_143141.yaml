      source_assumptions:
      - 091c1695-790b-4658-83bc-ab0bdad9702d
    assumptions:
    - text: 'The ''Runtime'' column should contain string values starting with numeric
        digits (matching the pattern ''^\d+''), representing the duration in minutes.
        If values do not start with digits, parsing will yield NaN, causing the downstream
        ''CompositeScore'' calculation and ranking to result in NaN values.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", "^\\d+.*", lambda x: x == 1.0)'
      sources:
      - start_line: 35
        end_line: 38
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: ce7891fb-e9d4-48fc-8644-84ec431ea19b
    - text: 'The ''Runtime'' column should not contain null or missing values to ensure
        every record gets a valid runtime bonus and composite score.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 35
        end_line: 38
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: 091c1695-790b-4658-83bc-ab0bdad9702d
