    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''No_of_Votes'' must have sufficient
        non-null numeric co-occurrences with non-zero variance to calculate a valid
        Pearson correlation coefficient between them. We could represent this assumption
        as a Deequ constraint like: .hasCorrelation(''IMDB_Rating'', ''No_of_Votes'',
        lambda corr: corr is not None)'
      sources:
      - start_line: 25
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      uid: 3d2a4277-aaa5-4f63-a76d-069ec038fd56
    - text: The columns 'IMDB_Rating', 'No_of_Votes', 'Released_Year', 'Gross', and
        'Runtime' are combined into a weighted composite ranking score ('CompositeScore').
        Valid numeric parsing across these columns is expected so that individual
        component scores (rating, votes log scale, recency, gross log scale, and runtime
        bonus) can be computed and combined without resulting in missing or undefined
        composite scores.
      sources:
      - start_line: 21
        end_line: 81
        file: ''
      - start_line: 88
        end_line: 91
        file: ''
      uid: efb533ff-db50-41c4-be64-47585fc426d8
  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''No_of_Votes'' are expected to have
        a valid correlation computed between them, requiring both columns to have
        sufficient non-null numeric values and non-zero variance across the dataset.
        In Deequ, this can be expressed as: .hasCorrelation("IMDB_Rating", "No_of_Votes",
        lambda corr: corr >= 0.0)'
      sources:
      - start_line: 25
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 77
