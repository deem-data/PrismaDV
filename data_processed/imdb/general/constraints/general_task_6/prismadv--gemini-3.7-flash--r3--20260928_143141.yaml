  '["Certificate","Genre"]':
    code: []
    assumptions:
    - text: 'For movies filtered as family-friendly based on the ''Certificate'' column
        (e.g., ''U'', ''G'', ''PG'', ''PG-13'', ''UA''), the ''Genre'' column is expected
        to be present and non-null as both columns are included in the exported ranked
        recommendations. We could represent this condition as a Deequ constraint like:
        .satisfies("Certificate NOT IN (''U'', ''G'', ''PG'', ''PG-13'', ''UA'') OR
        Genre IS NOT NULL", "Family-friendly rated records must have valid Genre")'
      sources:
      - start_line: 46
        end_line: 52
