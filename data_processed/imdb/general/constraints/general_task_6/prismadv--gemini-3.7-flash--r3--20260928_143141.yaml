      uid: 46c14a5d-298e-4cc0-aae3-27f784235a39
    - text: The 'Genre' column is expected to be of string data type (or convertible
        to string) as it is converted using `.astype(str)` for downstream processing.
      sources:
      - start_line: 52
        end_line: 52
        file: ''
      uid: 6e43d207-19d0-4d06-8f60-d76839ef1ab4
  Gross:
    code:
    - suggestion: '.hasCompleteness(''Gross'', lambda x: x >= 0.7)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 08d1fcc5-6ca2-4b0c-a121-b886a1e3a7bf
      source_assumptions:
      - c2aaa788-0825-4a8d-8276-788a940fbb9a
    - suggestion: '.satisfies("`Gross` IS NULL OR `Gross` RLIKE ''^[0-9,]+$''", "gross_string_numbers",
        lambda x: x >= 0.99)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 691c5222-e7ae-452b-8515-d6ab77815fb0
      source_assumptions:
      - f8850bae-034f-4ad6-b636-1ec7d0e53754
    assumptions:
    - text: The 'Gross' column can contain missing or null values, as the code handles
        missing entries by converting them to string, coercing errors during numeric
        parsing, and using fillna(0).
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      uid: c2aaa788-0825-4a8d-8276-788a940fbb9a
    - text: The 'Gross' column contains string-formatted numbers, potentially with
        comma thousand separators (e.g., '100,000,000'), that can be parsed into numeric
        values representing gross revenue.
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      - start_line: 58
        end_line: 61
        file: ''
      uid: f8850bae-034f-4ad6-b636-1ec7d0e53754
  IMDB_Rating:
    code:
    - suggestion: '.satisfies("CAST(`IMDB_Rating` AS DOUBLE) >= 0.0 AND CAST(`IMDB_Rating`
        AS DOUBLE) <= 10.0", "Valid IMDB Rating Range", lambda x: x >= 0.99)'
      validity: true
      reason_if_invalid: ''
      level: warning
