      source_assumptions:
      - 6ab1eeab-df08-4015-81e5-44cdd950fbb7
    assumptions:
    - text: 'The ''IMDB_Rating'' column should contain numeric values (or strings
        convertible to numbers) on a scale typically between 0.0 and 10.0, as it is
        converted to numeric using pd.to_numeric and normalized by dividing by 10.0
        for composite score calculation. We could represent this assumption as a deequ
        constraint like this: .satisfies("CAST(`IMDB_Rating` AS DOUBLE) >= 0.0 AND
        CAST(`IMDB_Rating` AS DOUBLE) <= 10.0", "Valid IMDB Rating Range", lambda
        x: x >= 0.99)'
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      uid: 9f281942-1c54-4410-aa88-38e1623b0de5
    - text: 'The ''IMDB_Rating'' column should have sufficient non-null numeric values
        to compute the correlation with ''No_of_Votes'' and to avoid producing NaN
        values in the composite score calculation. We could represent this assumption
        as a deequ constraint like this: .isComplete("IMDB_Rating")'
      sources:
      - start_line: 25
        end_line: 33
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: 6ab1eeab-df08-4015-81e5-44cdd950fbb7
