  Runtime:
    code:
    - suggestion: .hasPattern('Runtime', r'^\d+')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f16058e5-df81-4a6d-8562-d77ac5c8f74d
      source_assumptions:
      - ce7891fb-e9d4-48fc-8644-84ec431ea19b
    - suggestion: .isComplete('Runtime')
