    code: []
    assumptions:
    - text: The columns 'IMDB_Rating' and 'No_of_Votes' must have sufficient non-null
        numeric overlapping records with non-zero variance to compute a valid Pearson
        correlation coefficient, which determines 'vote_weight' and 'rating_weight'.
