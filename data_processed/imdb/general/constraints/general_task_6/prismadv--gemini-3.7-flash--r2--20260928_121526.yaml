    code: []
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''No_of_Votes'' are expected to have
        a valid numeric correlation between them to determine the weighting factors
        for composite scoring. We could represent this assumption as a Deequ constraint
        like: .hasCorrelation("IMDB_Rating", "No_of_Votes", lambda corr: corr >= 0.0)'
      sources:
      - start_line: 25
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 81
        file: ''
      uid: abd6de46-3022-496e-bb09-cc475eaad78e
  '["Poster_Link","Series_Title"]':
    code: []
    assumptions:
    - text: 'Each ''Poster_Link'' is assumed to uniquely identify a movie (''Series_Title''),
        meaning there is a consistent one-to-one or unique relationship between ''Poster_Link''
        and ''Series_Title'' such that deduplicating by ''Poster_Link'' does not conflate
        distinct titles. We could represent this assumption as a Deequ constraint
