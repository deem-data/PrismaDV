prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Certificate:
    code:
    - suggestion: '.satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'')", "Has Family Friendly Certificates", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 09d3f9b7-7f66-4cc8-8541-b57162241153
      source_assumptions:
      - 8bf64d8d-4712-4a59-b18a-5acf5a074676
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0.8)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 20f85ab3-e215-47d7-a14b-b39e24cbffbc
      source_assumptions:
      - 09837436-7963-4a45-874f-a31cca9d99ba
    assumptions:
    - text: 'The ''Certificate'' column can contain missing or null values, as the
        downstream code explicitly handles null values using `.fillna('''')` before
        string operations.

        We could represent this assumption as a deequ constraint like this:

        .isComplete(''Certificate'') -- (evaluated with a tolerance threshold or check
        that completeness is not strictly 1.0)

        '
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      uid: 09837436-7963-4a45-874f-a31cca9d99ba
    - text: 'The ''Certificate'' column should contain at least some values matching
        family-friendly certificate ratings (''U'', ''G'', ''PG'', ''PG-13'', ''UA'')
        after case-insensitive trimming, so that the downstream filtered family-friendly
        dataset is not empty when generating output CSV files.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'') THEN 1 ELSE 0 END", "Has Family Friendly Certificates",
        lambda x: x > 0)

        '
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      - start_line: 84
        end_line: 85
        file: ''
      - start_line: 97
        end_line: 97
        file: ''
      - start_line: 105
        end_line: 108
        file: ''
      uid: 8bf64d8d-4712-4a59-b18a-5acf5a074676
  Genre:
    code:
    - suggestion: .isComplete('Genre')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f8005196-7249-4833-b3e5-fba1e9dc1587
      source_assumptions:
      - 34057892-ce83-4577-acc6-265b6db2acce
    assumptions:
    - text: 'The ''Genre'' column must exist in the dataset and have a string data
        type (or be convertible to string) as it is accessed with `df[''Genre''].astype(str)`
        and included in the output CSV files.

        We could represent this assumption as a deequ constraint like this:

        .isComplete(''Genre'')

        '
      sources:
      - start_line: 52
        end_line: 52
        file: ''
      - start_line: 101
        end_line: 105
        file: ''
      - start_line: 108
        end_line: 108
        file: ''
      uid: 34057892-ce83-4577-acc6-265b6db2acce
  Gross:
    code:
    - suggestion: .satisfies("`Gross` IS NULL OR REPLACE(`Gross`, ',', '') RLIKE '^[0-9]+(\\.[0-9]+)?$'",
        "Gross_valid_numeric_string")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 67647f06-3b9f-438b-baf9-757272f9f89a
      source_assumptions:
      - 1a660007-69bb-4f29-8c6d-d21a8b2697d2
    - suggestion: .satisfies("`Gross` IS NULL OR CAST(REPLACE(`Gross`, ',', '') AS
        DOUBLE) >= 0", "Gross_non_negative")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5a0bd9d7-357b-4309-b1cf-d02567a74139
      source_assumptions:
      - dab9917d-1503-48a2-aec1-cd19b918f0bf
    assumptions:
    - text: The 'Gross' column can contain missing or null values, as the code safely
        handles nulls using `fillna(0)` after numeric conversion and `fillna(0.0)`
        during normalization.
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      - start_line: 58
        end_line: 63
        file: ''
      uid: 818f0ab5-6f5e-4543-b9c5-ec90c17bcb59
    - text: The 'Gross' column is expected to contain numeric string values (potentially
        formatted with comma thousand separators such as '123,456,789') that can be
        parsed into numeric values after removing commas.
      sources:
      - start_line: 41
        end_line: 43
        file: ''
      uid: 1a660007-69bb-4f29-8c6d-d21a8b2697d2
    - text: The 'Gross' column values, when present and valid, are expected to be
        non-negative or positive numbers representing box office gross revenue for
        log transformation.
      sources:
      - start_line: 43
        end_line: 43
        file: ''
      - start_line: 58
        end_line: 61
        file: ''
      uid: dab9917d-1503-48a2-aec1-cd19b918f0bf
  IMDB_Rating:
    code:
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10', 'imdb_rating_between_0_and_10')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 29e89a9d-0a99-4fe9-803a-0bff793328c1
      source_assumptions:
      - 7514b125-bbd4-45c9-8c47-d30009f2a54f
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ef20674b-ba7e-437d-b6ac-b5e754d7ab23
      source_assumptions:
      - 7fc177bb-56e3-4955-8f0b-55e0254df952
    assumptions:
    - text: The 'IMDB_Rating' column should contain numeric values on a scale from
        0 to 10, as the script converts the column to numeric and normalizes it by
        dividing by 10.0 to construct a composite score.
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: 7514b125-bbd4-45c9-8c47-d30009f2a54f
    - text: The 'IMDB_Rating' column should not be entirely null or unparseable, and
        must have valid numeric values to compute the correlation with 'No_of_Votes'
        and derive the weighting for composite ranking.
      sources:
      - start_line: 25
        end_line: 25
        file: ''
      - start_line: 33
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      uid: 7fc177bb-56e3-4955-8f0b-55e0254df952
  No_of_Votes:
    code:
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
