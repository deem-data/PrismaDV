      reason_if_invalid: ''
      level: error
      uid: 9fa48cb2-9486-424c-85b5-ae71080c47fa
      source_assumptions:
      - 2fd2952c-779e-4209-8431-d47daabfd767
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: df181f93-bec8-4e49-8df1-3ecdc2db17c8
      source_assumptions:
      - 50dfc1ee-78db-4cd9-874a-a5380e304b98
    assumptions:
    - text: 'The ''No_of_Votes'' column should be numeric or convertible to numeric
        values without resulting entirely in nulls, as it is converted via pd.to_numeric
        and used to compute correlation and min/max log values. We could represent
        this assumption as a deequ constraint like this: .isDataType(''No_of_Votes'',
        org.apache.spark.sql.types.IntegerType)'
      sources:
      - start_line: 29
        end_line: 30
        file: ''
      - start_line: 33
        end_line: 33
        file: ''
      - start_line: 66
        end_line: 68
        file: ''
      uid: 2fd2952c-779e-4209-8431-d47daabfd767
    - text: 'The ''No_of_Votes'' column should contain non-negative values (greater
        than or equal to 0), representing the count of votes. We could represent this
        assumption as a deequ constraint like this: .satisfies("`No_of_Votes` >= 0",
        "Non-negative No_of_Votes", lambda x: x == 1.0)'
      sources:
      - start_line: 29
        end_line: 30
        file: ''
      uid: 50dfc1ee-78db-4cd9-874a-a5380e304b98
  Poster_Link:
    code:
    - suggestion: .isComplete('Poster_Link')
