      \ or 'nan' string values that silently corrupt scores or deliver incomplete\
      \ catalog records are critical failures. Only assume nulls are tolerated if\
      \ the code explicitly handles them safely with deliberate fallback defaults\
      \ (e.g., using `fillna`, `pd.notna`, `errors='coerce'`, or `dropna`).\n   -\
      \ Value validity and bounds: Infer domain ranges (e.g., years > 1800, non-negative\
