constraints:
  Certificate:
    code:
    - - .satisfies("Certificate IS NULL OR UPPER(TRIM(Certificate)) IN ('U', 'UA',
        'A', 'G', 'PG', 'PG-13', 'R', 'NC-17', 'NOT RATED', 'UNRATED')", 'valid_certificate_if_present')
      - Invalid
    assumptions: []
    column_name: Certificate
  Genre:
    code:
    - - .satisfies('Genre IS NOT NULL AND LENGTH(TRIM(Genre)) > 0', 'nonempty_genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR Gross RLIKE '^[0-9]{1,3}(,[0-9]{3})*$' OR Gross
        RLIKE '^[0-9]+$'", 'valid_gross_if_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  IMDB_Rating, No_of_Votes:
    code:
    - - '.hasCorrelation(''IMDB_Rating'', ''No_of_Votes'', lambda correlation: -1
        <= correlation <= 1)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating, No_of_Votes
  No_of_Votes:
    code:
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    - - .isUnique('Poster_Link')
      - Valid
    - - .satisfies("Poster_Link RLIKE '^https://[^ ]+$'", 'valid_poster_url')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND YEAR(CURRENT_DATE())', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - .satisfies("Runtime RLIKE '^[0-9]+ min$' AND CAST(REGEXP_EXTRACT(Runtime,
        '^([0-9]+)', 1) AS INT) > 0", 'valid_runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .satisfies("Series_Title IS NOT NULL AND LENGTH(TRIM(Series_Title)) > 0",
        'nonempty_title')
      - Valid
    assumptions: []
    column_name: Series_Title
