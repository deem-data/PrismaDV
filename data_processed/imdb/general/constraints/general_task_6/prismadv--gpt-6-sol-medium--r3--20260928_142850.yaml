    - text: Among rows with valid values for both columns, 'IMDB_Rating' and 'No_of_Votes'
        must each have at least two distinct values. Otherwise their Pearson correlation
        is undefined, and converting that correlation to a float for the score weight
        will not produce a usable weight. This can be checked by requiring countDistinct('IMDB_Rating')
