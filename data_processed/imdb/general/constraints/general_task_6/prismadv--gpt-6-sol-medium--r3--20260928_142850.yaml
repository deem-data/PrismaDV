    assumptions:
    - text: 'For every family-friendly eligible record, ''IMDB_Rating'', ''No_of_Votes'',
        ''Released_Year'', and ''Runtime'' must jointly yield valid scoring inputs:
        a numeric rating, numeric vote count, numeric release year, and a runtime
        beginning with an integer number of minutes. Otherwise, the record''s composite
        score can be null and its ranking unreliable. ''Gross'' may be null because
        the code explicitly scores missing gross as zero. This can be checked with
