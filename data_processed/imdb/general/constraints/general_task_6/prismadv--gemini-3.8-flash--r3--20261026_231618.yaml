prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code:
    - suggestion: '.satisfies("UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'')", "Has Family Friendly Certificates", lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f1119322-387c-464f-bdf1-648dda8541a6
      source_assumptions:
      - efe278fb-a10d-4437-bc40-85515f71ec00
    assumptions:
    - text: The 'Certificate' column may contain missing or null values, as the code
        explicitly handles missing values using `.fillna('')` before string manipulation.
        Therefore, the column is not strictly required to be 100% complete.
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      uid: df6a2b14-83d2-4fa0-b03d-eb17c2353973
    - text: 'The ''Certificate'' column is expected to contain family-friendly rating
        values (specifically ''U'', ''G'', ''PG'', ''PG-13'', or ''UA'', case-insensitive
        and trimmed of whitespace) so that the downstream filtering for family-friendly
        movies yields records to rank and export. We could represent this assumption
        as a constraint checking that at least some rows have certificates in this
        set: .satisfies("CASE WHEN UPPER(TRIM(`Certificate`)) IN (''U'', ''G'', ''PG'',
        ''PG-13'', ''UA'') THEN 1 ELSE 0 END", "Has Family Friendly Certificates",
        lambda x: x > 0)'
      sources:
      - start_line: 46
        end_line: 47
        file: ''
      - start_line: 84
        end_line: 85
        file: ''
      - start_line: 97
        end_line: 97
        file: ''
      - start_line: 105
        end_line: 105
        file: ''
      - start_line: 108
        end_line: 108
        file: ''
      uid: efe278fb-a10d-4437-bc40-85515f71ec00
  Genre:
    code:
    - suggestion: .hasDataType('Genre', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c473c4d3-10db-497e-a977-7a382c1563c2
      source_assumptions:
      - afca97bc-1a0d-4aed-8ec2-f324f46c3666
    - suggestion: .isComplete('Genre')
