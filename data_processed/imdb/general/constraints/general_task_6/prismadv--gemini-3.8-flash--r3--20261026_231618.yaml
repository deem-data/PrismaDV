      reason_if_invalid: ''
      level: warning
      uid: 4d50da15-4df9-4032-9fd2-fab1107f0533
      source_assumptions:
      - 25531929-2e6a-40fe-a74f-6d36d261a02a
    - suggestion: .isComplete("IMDB_Rating")
