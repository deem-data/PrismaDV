      uid: 94d73de8-1eac-4484-b17b-c4abe4de99e2
    - text: 'The ''Runtime'' column values should begin with one or more digits (e.g.,
        ''142 min'' or ''120''), as the downstream logic extracts leading numeric
        digits to compute the runtime bonus. If a value does not start with digits,
        extraction produces NaN, leading to a NaN composite score. We could represent
        this assumption as a deequ constraint like this: .satisfies("TRIM(`Runtime`)
