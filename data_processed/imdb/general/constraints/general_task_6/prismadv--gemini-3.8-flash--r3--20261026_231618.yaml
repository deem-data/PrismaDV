      source_assumptions:
      - 036082a9-63c9-48d1-8bc9-5739150cd6a8
    assumptions:
    - text: 'The ''IMDB_Rating'' column values should fall within the range of 0.0
        to 10.0, as the code normalizes it by dividing by 10.0 (`ratings / 10.0`)
        to form a [0, 1] scale component of the composite score. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `IMDB_Rating`
        >= 0.0 AND `IMDB_Rating` <= 10.0 THEN 1 ELSE 0 END", "IMDB_Rating Range Check",
        lambda x: x == 1.0)'
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 75
        end_line: 81
        file: ''
      uid: 25531929-2e6a-40fe-a74f-6d36d261a02a
    - text: 'The ''IMDB_Rating'' column should contain valid numeric values and cannot
        be entirely null, as the code computes Pearson correlation between `ratings`
        and `votes` via `pd.concat([ratings, votes], axis=1).dropna().corr().iloc[0,
        1]` to determine scoring weights. We could represent this assumption as a
        deequ constraint like this: .isComplete("IMDB_Rating")'
      sources:
      - start_line: 25
        end_line: 25
        file: ''
      - start_line: 33
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      uid: 036082a9-63c9-48d1-8bc9-5739150cd6a8
