constraints:
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  Gross:
    code:
    - - .satisfies("Gross IS NULL OR regexp_replace(Gross, ',', '') RLIKE '^[0-9]+$'",
        'valid_gross_when_present')
      - Valid
    assumptions: []
    column_name: Gross
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - .satisfies('IMDB_Rating BETWEEN 0 AND 10', 'valid_imdb_rating')
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - '.hasPattern(''Poster_Link'', r''^https?://\S+$'', lambda x: x == 1.0)'
      - Valid
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - .satisfies('Released_Year BETWEEN 1888 AND year(current_date())', 'valid_release_year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.hasPattern(''Runtime'', r''^\s*[1-9][0-9]*\s*min\s*$'', lambda x: x == 1.0)'
      - Valid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    assumptions: []
    column_name: Series_Title
