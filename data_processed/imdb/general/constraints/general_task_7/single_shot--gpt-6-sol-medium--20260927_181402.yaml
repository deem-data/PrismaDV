constraints:
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - '.satisfies(''IMDB_Rating >= 0 AND IMDB_Rating <= 10'', ''valid_imdb_rating'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  No_of_Votes:
    code:
    - - .isComplete('No_of_Votes')
      - Valid
    - - .isPositive('No_of_Votes')
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.hasPattern(''Runtime'', r''^\s*\d+\s*min\s*$'', lambda x: x == 1.0)'
      - Valid
    - - .isComplete('Runtime')
      - Valid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - '.satisfies(''Series_Title = trim(Series_Title) AND length(Series_Title) >
        0'', ''normalized_nonempty_title'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
