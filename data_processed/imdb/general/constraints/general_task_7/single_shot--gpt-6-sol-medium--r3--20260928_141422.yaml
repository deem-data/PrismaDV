  Meta_score:
    code:
    - - .satisfies('Meta_score IS NULL OR Meta_score BETWEEN 0 AND 100', 'valid_optional_meta_score')
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
