    assumption_generation: "Analyze how the target column is used in the code and\
      \ downstream task to determine true data preconditions required for the script\
      \ to execute correctly and avoid producing corrupted outputs.\n\nKey Guidelines:\n\
      1. Distinguish Strict Dependencies from Defensive Handling:\n   - Strict Dependencies:\
      \ Preconditions whose violation causes unhandled runtime crashes OR silently\
      \ produces wrong/corrupted outputs. These include:\n     * Explicit conversions\
      \ without fallback (e.g., direct `.astype(int)` on regex extracts or strings).\n\
      \     * Indexing and integrity constraints (e.g., `set_index(..., verify_integrity=True)`\
      \ requiring uniqueness).\n     * Mathematical operations with strict domains\
      \ (e.g., `np.log1p()` requiring values > -1, rating metrics bounded in [0, 10]).\n\
      \     * Ordering, ranking, and tie-breakers (e.g., columns used in `df.sort_values()`\
      \ or `.rank()` require valid, comparable types and non-negative values where\
      \ applicable).\n     * Core schema contracts: columns exported in final datasets\
      \ or used in downstream pipelines must preserve their expected fundamental data\
      \ type and presence.\n   - Defensive Handling: Operations where the code explicitly\
      \ accommodates anomalies via `errors='coerce'`, `.fillna()`, clipping `.clip(lo,\
      \ hi)`, or `.get(..., default)`. For these, do not assume strict completeness\
      \ or rigid domain restrictions; reflect that missing, unparseable, or unseen\
      \ values are tolerated by design.\n\n2. Incorporate Column Metadata (`target_column_desc`):\n\
      \   - Never assume completeness (non-null) if `target_column_desc` shows `completeness\
      \ < 1.0`, unless the code explicitly crashes on null values. Conversely, if\
      \ `completeness == 1.0` and the code does not handle nulls, assume completeness\
      \ is required.\n   - For metadata or passthrough columns included in final exports\
      \ (e.g., `Director`, `Star1`, `Gross`, `Series_Title`), assume they must exist\
      \ and conform to their established `dataType` from `target_column_desc` so that\
      \ downstream consumer schemas are not corrupted.\n\n3. Dataset Conventions &\
      \ Patterns (Movie / Tabular Data):\n   - `Gross`: Typically numeric string formatted\
      \ with commas (e.g., \"1,000,000\") or null, normalized with median imputation.\
      \ Values when present should represent non-negative monetary figures. When passthrough,\
      \ preserve String data type.\n   - `Runtime`: Often formatted as string with\
      \ digits (e.g., \"140 min\"); code extracting digits via `.astype(int)` requires\
      \ non-empty digit strings to prevent ValueError.\n   - `No_of_Votes`, `IMDB_Rating`:\
      \ Numeric metrics; ratings bounded in [0, 10], vote counts non-negative integers.\
      \ When used in sorting, scoring, or exports, valid non-negative numeric types\
      \ are strictly required.\n   - `Certificate`, `Genre`: Categorical strings,\
      \ frequently containing multiple values or mapped via dictionaries with fallback\
      \ defaults.\n\nOutput only valid JSON (numbers without leading zeros): { \"\
      assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\"\
      : int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nConstraint Level\
      \ Guideline:\n- Set level \"error\" if violating the check causes the script\
      \ to crash OR silently produces wrong/corrupted outputs (e.g., unhandled ValueError\
      \ in `.astype(int)`, duplicate keys in `verify_integrity=True`, tie-breaking/ranking\
      \ corrupted by null or malformed values in `sort_values`, negative values propagating\
      \ into `np.log1p`, out-of-bound ratings skewing metrics).\n- Set level \"error\"\
      \ for fundamental schema integrity checks: if a column is used in downstream\
      \ logic or included in the final export, its core data type (`.hasDataType`)\
      \ and expected completeness (`.isComplete` when clean data has `completeness\
      \ == 1.0` and nulls are not defensively handled) should be set to \"error\"\
      \ to catch corrupted partitions.\n- At least one check for a target column should\
      \ be set to level \"error\" whenever the column is required for execution, ranking,\
      \ or output integrity. A warning-level constraint never rejects a batch, so\
      \ if all constraints for a column are set to \"warning\", the column will catch\
      \ no errors.\n- Set level \"warning\" ONLY when the data quality deviation is\
      \ safely tolerated by the code (e.g., missing values filled via `.fillna(median)`,\
      \ `errors='coerce'`, dictionary fallbacks) AND the constraint is a relaxed or\
      \ distributional guard (e.g., `.hasCompleteness` with a lower threshold, broad\
      \ quantile or mean ranges) where minor shifts should not reject the partition.\n\
      \nPyDeequ Implementation Guidelines:\n- Null-Safe Pattern Matching: PyDeequ's\
