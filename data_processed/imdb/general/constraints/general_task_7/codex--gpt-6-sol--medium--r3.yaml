  \ the evidence.', 'Meta_score': 96.0, 'Director': 'Sidney Lumet', 'Star1': 'Henry\
  \ Fonda', 'Star2': 'Lee J. Cobb', 'Star3': 'Martin Balsam', 'Star4': 'John Fiedler',\
  \ 'No_of_Votes': 689845, 'Gross': '4,360,000'}]\n\nThe full table is on disk at\
  \ `./data/tables/observed_data.csv`. You have complete access to it:\nload it with\
  \ pandas, profile it, plot it, run whatever analysis helps. It is a\nthrowaway copy\
  \ -- nothing you do to it has any effect outside this workspace.\n\n# Verifying\
  \ your constraints\n\nYou can execute PyDeequ constraint code against the staged\
  \ table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
