  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 3bd5dc30-da3a-4640-a4a2-922a276deef8
      source_assumptions:
      - 99b766c8-8d94-4582-9495-65d49cb63c5b
    - suggestion: '.hasCompleteness(''IMDB_Rating'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a6744b15-3ecc-43ea-be1d-7c5d623872f8
      source_assumptions:
      - fa24362f-1c2c-41d0-96d7-56837345b1de
    - suggestion: '.satisfies(''`IMDB_Rating` >= 7.0'', ''has_high_ratings'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6c423dd9-d086-43e5-b7e7-9df207cb01e6
      source_assumptions:
      - 79e79298-6de1-4100-96c6-0f41550c78f4
    assumptions:
    - text: 'The ''IMDB_Rating'' column contains numeric or fractional values (or
        values convertible to numeric) representing ratings, typically within the
        range [0.0, 10.0]. The script uses pd.to_numeric to parse it and computes
        mathematical operations like the mean.

        We could represent this assumption as a deequ constraint like this:

        .isDataType(''IMDB_Rating'', org.apache.spark.sql.types.DoubleType)

        '
      sources:
      - start_line: 39
        end_line: 40
        file: ''
      - start_line: 43
        end_line: 48
        file: ''
      uid: 99b766c8-8d94-4582-9495-65d49cb63c5b
    - text: 'The ''IMDB_Rating'' column should not be entirely null/empty because
        the code calculates the mean rating C = float(R.mean()) which is used as a
        baseline parameter in calculating quality scores.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `IMDB_Rating` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty
        IMDB_Rating", lambda x: x > 0)

        '
      sources:
      - start_line: 39
        end_line: 39
        file: ''
      - start_line: 43
        end_line: 47
        file: ''
      uid: fa24362f-1c2c-41d0-96d7-56837345b1de
    - text: 'The dataset is expected to contain movies with ''IMDB_Rating'' >= 7.0
        to populate the top picks recommendation list.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN CAST(`IMDB_Rating` AS DOUBLE) >= 7.0 THEN 1 ELSE 0 END",
        "Has High Ratings", lambda x: x > 0)

        '
      sources:
      - start_line: 53
        end_line: 61
        file: ''
      uid: 79e79298-6de1-4100-96c6-0f41550c78f4
  Meta_score:
    code:
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3cf73e35-e800-40c5-ae18-2a99d48c6d5b
      source_assumptions:
      - 45ed878b-29f1-4ada-9320-6074d753be35
    assumptions:
    - text: The 'Meta_score' column can contain missing or null values because the
        code explicitly uses `pd.to_numeric(..., errors='coerce')` and handles missing
        values using `.fillna(C)` after scaling. Therefore, the column is not required
        to be 100% complete.
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: 3d0846fb-d61e-467f-94e7-d638eab85576
    - text: The 'Meta_score' column is assumed to be of numeric type (or convertible
        to numeric) so that arithmetic operations such as division by 10.0 can be
        performed to compute the quality score.
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      uid: 45ed878b-29f1-4ada-9320-6074d753be35
  No_of_Votes:
    code:
    - suggestion: '.satisfies("`No_of_Votes` IS NULL OR CAST(`No_of_Votes` AS DOUBLE)
        >= 0", "No_of_Votes_non_negative", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e5781974-dec9-40e8-a0a0-d8fedbae0ffb
      source_assumptions:
      - ca58da10-f434-485f-8697-4c6a4c46562c
    assumptions:
    - text: The 'No_of_Votes' column can contain missing or unparseable numeric values
        because the script uses 'pd.to_numeric(..., errors='coerce').fillna(0)' to
        safely parse and replace missing/invalid values with 0.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: 10b63c9d-25b9-4341-b653-e66bd272ce7e
    - text: 'The ''No_of_Votes'' column is expected to contain non-negative numeric
        values representing vote counts used in quantile calculation and weighted
        rating formulas (votes / (votes + m)). We could represent this assumption
        as a deequ constraint: .satisfies("CASE WHEN CAST(`No_of_Votes` AS DOUBLE)
        >= 0 OR `No_of_Votes` IS NULL THEN 1 ELSE 0 END", "Non-negative Votes", lambda
        x: x == 1.0)'
      sources:
      - start_line: 40
        end_line: 47
        file: ''
      uid: ca58da10-f434-485f-8697-4c6a4c46562c
  Poster_Link:
    code:
    - suggestion: .hasDataType('Poster_Link', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 59ded5c8-387d-4993-a45d-42f9b69f88c6
      source_assumptions:
      - b181394b-acb4-430b-ad34-48523b159925
    - suggestion: .isComplete('Poster_Link')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dbffe8c3-501b-4881-8ef9-01e1c55a3763
      source_assumptions:
      - d33ed37e-1d4d-46fa-a04d-2a4739204d2a
    assumptions:
    - text: The 'Poster_Link' column should exist in the dataset and have a string
        data type, as it represents poster image URLs used for generating unique asset
        identifiers and is included in the output manifests and top picks exports.
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 74
        end_line: 74
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: b181394b-acb4-430b-ad34-48523b159925
    - text: 'The ''Poster_Link'' column is expected to have high completeness (non-null
        values) so that asset IDs can be meaningfully assigned and mapped for all
        records in the catalog and assets manifest. We could represent this assumption
        as a deequ constraint like: .isComplete(''Poster_Link'')'
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      - start_line: 88
        end_line: 89
        file: ''
      uid: d33ed37e-1d4d-46fa-a04d-2a4739204d2a
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 410072f1-dbec-47ea-88f8-80eb6e5a5e7e
      source_assumptions:
      - 5583328b-700b-44ae-abdd-e5cbb90f9b09
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values (completeness
        of 1.0) because it is used to create composite unique keys (''title_year_key'')
        for ordering and catalog mapping without explicit null-handling.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Released_Year")'
      sources:
      - start_line: 22
        end_line: 25
        file: ''
      uid: 5583328b-700b-44ae-abdd-e5cbb90f9b09
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 18243563-9fde-4b2e-84b6-6ed90431d38a
      source_assumptions:
      - ad5a193f-a524-4e4c-a8ca-f76534bd012f
    - suggestion: .hasPattern('Runtime', r'^\s*\d+\s*min\s*$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 4afce070-0fa0-4556-bdde-84f58f6b295c
      source_assumptions:
      - 88532180-fde0-4cfc-ba37-21731cdddb36
    assumptions:
    - text: 'The ''Runtime'' column should not contain null values, because any missing
        or non-matching value extracted via regex will produce NaN, which causes the
        subsequent ''.astype(int)'' call to raise an exception. We could represent
        this assumption as a deequ constraint like this: .isComplete(''Runtime'')'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: ad5a193f-a524-4e4c-a8ca-f76534bd012f
    - text: 'All values in the ''Runtime'' column must follow the format of digits
        followed by ''min'' (matching the pattern ''^\s*(\d+)\s*min\s*$''). If any
        value does not conform to this pattern, regex extraction produces NaN, which
        leads to a runtime failure during integer casting. We could represent this
        assumption as a deequ constraint like this: .satisfies("`Runtime` RLIKE ''^\\s*\\d+\\s*min\\s*$''",
        "Runtime Format Pattern", lambda x: x == 1.0)'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: 88532180-fde0-4cfc-ba37-21731cdddb36
