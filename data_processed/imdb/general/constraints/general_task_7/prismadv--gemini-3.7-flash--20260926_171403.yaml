      uid: 24142bf4-6a51-46c4-afe4-9ad809b6d05a
  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code: []
    assumptions:
    - text: The columns 'IMDB_Rating' and 'No_of_Votes' are combined to compute the
        Bayesian weighted rating ('wr'). 'No_of_Votes' is expected to be non-negative,
        and 'IMDB_Rating' should contain valid non-null numerical values so that weighted
        rating calculations and subsequent rankings do not produce invalid or NaN
        values.
      sources:
      - start_line: 39
        end_line: 47
        file: ''
      uid: 3eb77c7d-f19b-4926-9550-bd9b90122012
    - text: '''IMDB_Rating'', ''No_of_Votes'', and ''Meta_score'' are jointly used
        to compute the composite ''quality_score'', where ''Meta_score'' (scaled by
        10) and the weighted rating derived from ''IMDB_Rating'' and ''No_of_Votes''
        are blended in an 80/20 ratio. If ''Meta_score'' is missing, it is imputed
        with the mean of ''IMDB_Rating'', assuming both ratings operate on comparable
        quality scales (0-10 vs 0-100).'
      sources:
      - start_line: 43
        end_line: 51
        file: ''
      uid: 71c3c658-6eb2-4ee1-8431-fdcee4d0e74d
  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: x >
        0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a9dae553-a049-42f8-b1e8-65c22c0212cb
      source_assumptions:
      - 252b2d72-9dca-419f-b4ed-bf067daedfba
    assumptions:
    - text: '''IMDB_Rating'' and ''Meta_score'' are both quality metrics combined
        to compute the composite ''quality_score'' (where ''Meta_score'' is scaled
        by 10 to match ''IMDB_Rating''). They are expected to be positively correlated
        across movies in the dataset.'
      sources:
      - start_line: 43
        end_line: 51
        file: ''
      uid: a9132c50-e599-4f2b-a3d8-da2c3fd7cf78
    - text: The mean of 'IMDB_Rating' is used as the default baseline fallback to
        impute missing values in 'Meta_score' (scaled by 10). This assumes 'IMDB_Rating'
        has valid numeric values so that the mean 'C' is well-defined and on a compatible
        scale (0 to 10) with 'Meta_score / 10.0'.
      sources:
      - start_line: 46
        end_line: 51
        file: ''
      uid: 252b2d72-9dca-419f-b4ed-bf067daedfba
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 862d9df5-f7c2-4099-9432-9abd51d96ec5
      source_assumptions:
      - e8c75a1e-ef78-461b-91cb-45869f827987
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' is used as
        a composite identifier (''title_year_key'') to generate stable catalog IDs
        (''catalog_id'') and deduplicate movie records. The pair (''Series_Title'',
        ''Released_Year'') should be unique across records. We could represent this
        assumption as a Deequ constraint like this: .isUnique(["Series_Title", "Released_Year"])'
      sources:
      - start_line: 21
        end_line: 27
        file: ''
      - start_line: 56
        end_line: 56
        file: ''
      uid: e8c75a1e-ef78-461b-91cb-45869f827987
