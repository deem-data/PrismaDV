  IMDB_Rating:
    code:
    - suggestion: .hasDataType('IMDB_Rating', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8a50457f-707e-41c4-81cc-195546460c39
      source_assumptions:
      - 70699724-9df6-46ee-ac9e-5b1797700e22
    - suggestion: '.hasCompleteness(''IMDB_Rating'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: fc636cc9-4829-460c-91b2-acf3f127fa63
      source_assumptions:
      - 0d868e8e-affd-42ad-bd95-c40b425c4db4
    assumptions:
    - text: The 'IMDB_Rating' column should contain numeric values that can be parsed
        as floats, because the code converts it to numeric using pd.to_numeric and
        computes its mean (R.mean()) to calculate the Bayesian quality score.
      sources:
      - start_line: 39
        end_line: 46
        file: ''
      uid: 70699724-9df6-46ee-ac9e-5b1797700e22
    - text: The 'IMDB_Rating' column should not be entirely null/missing, as calculating
        its mean (R.mean()) and filtering for high-rated movies (df['IMDB_Rating']
        >= 7.0) requires valid ratings to populate top picks and compute summary statistics.
      sources:
      - start_line: 43
        end_line: 46
        file: ''
      - start_line: 53
        end_line: 55
        file: ''
      uid: 0d868e8e-affd-42ad-bd95-c40b425c4db4
  Meta_score:
    code:
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 124354cc-eab1-438b-b3ce-742086722206
      source_assumptions:
      - 37d28c30-43f5-4ed5-9742-42979392275a
    assumptions:
    - text: The 'Meta_score' column can contain missing (null) values because the
        downstream code handles missing values by filling NaNs with the mean IMDB
        rating 'C' using .fillna(C).
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: c5c2f004-b0c6-415a-9387-e19bff2c7faf
    - text: The 'Meta_score' column values should be numeric or convertible to numeric
        (fractional/integer) values, as the code uses pd.to_numeric and performs arithmetic
        division by 10.0 to scale the score.
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      uid: 37d28c30-43f5-4ed5-9742-42979392275a
  No_of_Votes:
    code:
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9ff6d6fb-c785-48de-ad8d-c1e9586bcb9d
      source_assumptions:
      - 5e52fe19-c032-4f22-8b24-8a3fbbb56e93
    assumptions:
    - text: The 'No_of_Votes' column can contain missing, null, or non-numeric values
        because the code uses pd.to_numeric with errors='coerce' and fills NaN values
        with 0.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: 445fea70-77f5-44be-91e1-1e4e08a90d0b
    - text: The 'No_of_Votes' column is expected to contain numeric values representing
        vote counts, which should be non-negative (greater than or equal to 0) to
        compute quantiles and weighted Bayesian scores without negative vote counts.
      sources:
      - start_line: 40
        end_line: 47
        file: ''
      uid: 5e52fe19-c032-4f22-8b24-8a3fbbb56e93
  Poster_Link:
    code:
    - suggestion: .hasDataType('Poster_Link', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 49211e57-67c3-42e7-b43e-bc794ff43ec1
      source_assumptions:
      - 086718e4-35ce-4f5a-8f86-ffef54fccd6a
    - suggestion: .isComplete('Poster_Link')
