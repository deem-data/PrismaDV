    assumptions:
    - text: 'The ''Series_Title'' column should exist and not contain null values,
        as it is used to construct a unique composite key ''title_year_key'' with
        ''Released_Year'' and used to sort the dataset. We could represent this assumption
        as a deequ constraint: .isComplete(''Series_Title'')'
      sources:
      - start_line: 21
        end_line: 25
        file: ''
      uid: 0e34c693-f8d9-4eb8-9e94-a24922cfa103
    - text: 'The ''Series_Title'' column should contain string or textual values representing
        the title of a movie or TV series. We could represent this assumption as a
        deequ constraint: .hasDataType(''Series_Title'', ConstrainableDataTypes.String)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      uid: bde592a9-3998-4fab-85c3-16c6b0bbcbad
  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''Meta_score'' represent movie ratings
        on 10-point and 100-point scales respectively, and are combined with ''No_of_Votes''
        into a weighted quality score. ''IMDB_Rating'' and ''Meta_score'' are expected
        to show a positive correlation across movies. We could represent this assumption
        as a Deequ constraint like this: .hasCorrelation("IMDB_Rating", "Meta_score",
        _ > 0.0)'
      sources:
      - start_line: 39
        end_line: 51
        file: ''
      uid: 00928972-2a65-4e3e-886f-60ae83f995ca
    - text: 'The columns ''IMDB_Rating'' and ''No_of_Votes'' are used together to
        compute a Bayesian weighted rating ''wr''. Both columns should contain non-negative
        numerical values, where ''IMDB_Rating'' falls in the range [0.0, 10.0] and
        ''No_of_Votes'' is greater than or equal to 0. We could represent this assumption
        as Deequ constraints like this: .satisfies("IMDB_Rating >= 0.0 AND IMDB_Rating
        <= 10.0 AND No_of_Votes >= 0", "Valid Ratings and Votes")'
      sources:
      - start_line: 39
        end_line: 47
        file: ''
      uid: a9be3684-a772-4027-bda9-5bf226c91490
  '["Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: eb1e8ca6-918e-46dc-bf20-0b5148c760bc
      source_assumptions:
      - a6b1aeaa-43e2-4804-9de4-af72028f525e
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should uniquely
        identify each movie record to ensure accurate mapping of catalog IDs and deduplication.
        We could represent this assumption as a deequ constraint like this: .isUnique(["Series_Title",
        "Released_Year"])'
      sources:
      - start_line: 21
        end_line: 27
        file: ''
      - start_line: 56
        end_line: 56
        file: ''
      uid: a6b1aeaa-43e2-4804-9de4-af72028f525e
