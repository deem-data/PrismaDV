      source_assumptions:
      - 395e8145-45e7-490a-8575-80d106e0b981
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values, as it is
        used to construct a unique key ''title_year_key'' and sort the dataset for
        stable catalog ID generation. We could represent this assumption as a deequ
        constraint: .isComplete(''Released_Year'')'
      sources:
      - start_line: 22
        end_line: 25
        file: ''
      uid: 9a40b3b9-52dc-41bc-a9f9-fb3e7a1fa938
    - text: 'The ''Released_Year'' column should have an integral data type representing
        release years. We could represent this assumption as a deequ constraint: .hasDataType(''Released_Year'',
        ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 22
        end_line: 25
        file: ''
      uid: 395e8145-45e7-490a-8575-80d106e0b981
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ff239286-eee1-4bc4-abc2-66f6a2d77819
      source_assumptions:
      - ff753b71-ce3d-46fa-beb4-092faf7d6548
    - suggestion: '.hasPattern(''Runtime'', r''^\s*\d+\s*min\s*$'', lambda x: x ==
        1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 3efea8d9-ad00-4751-87db-f366d762bac4
      source_assumptions:
      - 9f0c1a0a-960e-4fa2-83ff-a94bf3683beb
    assumptions:
    - text: 'The ''Runtime'' column should not contain any null values because the
        code extracts runtime minutes and immediately casts them to integer with `.astype(int)`,
        which fails if there are null or unparseable values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: ff753b71-ce3d-46fa-beb4-092faf7d6548
    - text: 'The ''Runtime'' column should strictly follow the pattern of digits followed
        by ''min'' (matching regular expression ''^\s*\d+\s*min\s*$'') for all rows,
        because the code extracts digits using `^\s*(\d+)\s*min\s*$` and converts
        the extracted string to integer using `.astype(int)`. Any mismatch will produce
        NaN and raise a ValueError during integer casting.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", r"^\s*\d+\s*min\s*$", lambda x: x == 1.0)'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: 9f0c1a0a-960e-4fa2-83ff-a94bf3683beb
  Series_Title:
