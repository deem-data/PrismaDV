      reason_if_invalid: ''
      level: warning
      uid: 63474cf1-f44c-4626-be54-e8a7c0d0dcfb
      source_assumptions:
      - f985fbc8-24e5-4eb1-ae96-0a1706da9938
    assumptions:
    - text: 'The ''Poster_Link'' column should exist and be of string data type, as
        it contains poster URLs used to generate unique asset IDs and exported into
        the top picks and asset manifest output files.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType(''Poster_Link'', ConstrainableDataTypes.String)'
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 74
        end_line: 83
        file: ''
      uid: 086718e4-35ce-4f5a-8f86-ffef54fccd6a
    - text: 'The ''Poster_Link'' column is expected to be non-null and complete so
        that each record can be mapped to a valid poster asset identifier and included
        in the output catalog manifest.

        We could represent this assumption as a deequ constraint like this:

        .isComplete(''Poster_Link'')'
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: f985fbc8-24e5-4eb1-ae96-0a1706da9938
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d0531141-42df-49aa-81f3-7b2312f66ccd
      source_assumptions:
      - 9a40b3b9-52dc-41bc-a9f9-fb3e7a1fa938
    - suggestion: .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
