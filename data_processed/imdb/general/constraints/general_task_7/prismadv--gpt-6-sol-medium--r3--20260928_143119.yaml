        end_line: 57
        file: ''
      uid: b0f4c72e-a028-43f1-a984-057485f96b1a
    - text: Non-null 'Meta_score' values should be between 0 and 100, inclusive. The
        code divides them by 10 to put them on a rating-like scale before calculating
        'quality_score'.
      sources:
      - start_line: 50
        end_line: 51
        file: ''
      uid: 34961d7c-5c79-480d-a98d-9b4425987904
    - text: Null 'Meta_score' values are allowed because the code substitutes the
        mean IMDb rating for them. Given the observed completeness of about 85.6%,
        a validation rule could require at least 80% of input rows to have a non-null,
        valid 'Meta_score' so that the ranking does not rely excessively on the substitute.
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      - start_line: 57
        end_line: 61
        file: ''
      uid: cd412bcc-2c9e-45fb-88b2-c5086ecedc44
