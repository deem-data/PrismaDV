      - start_line: 40
        end_line: 47
        file: ''
      - start_line: 55
        end_line: 57
        file: ''
      uid: afe286c3-7c52-4a55-9696-d1f041ac0e9f
    - text: Null values are permitted in 'No_of_Votes' because the code replaces values
        that cannot be parsed as numbers, including nulls, with zero. Such values
        should be limited to genuinely missing vote counts, since they will otherwise
        be treated as zero in scoring and ranking.
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      - start_line: 44
        end_line: 47
        file: ''
      - start_line: 55
        end_line: 57
        file: ''
      uid: bbcbb859-9a07-46c2-be46-f3c07bd7d24f
    - text: After null or unparseable values are treated as zero, the 60th percentile
        of 'No_of_Votes' must be greater than zero. Otherwise, a row with zero votes
        can cause division by zero in the Bayesian quality-score calculation.
      sources:
      - start_line: 40
        end_line: 47
        file: ''
      uid: 8818b832-5ef0-48fa-9f45-02ecbbc9df3c
