      \ checks NEVER reject unsafe partitions. A suite with only warnings or overly\
      \ generic completeness checks misses all corrupted data.\n  - Set level \"warning\"\
      \ ONLY for purely informational checks where downstream code completely and\
      \ harmlessly neutralizes violations without corrupting output results.\n\nConstraint\
      \ Construction & Precision Rules:\n- Avoid False Alarms from Overly Strict Completeness:\n\
