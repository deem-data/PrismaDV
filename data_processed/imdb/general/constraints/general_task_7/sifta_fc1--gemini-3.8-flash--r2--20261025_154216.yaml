      \ Evaluation Context:\n- A data partition is flagged as erroneous if ANY single\
      \ \"error\"-level constraint fails.\n- Failing on safe partitions creates false\
      \ alarms (False Negatives), destroying fail precision.\n- Therefore, be conservative\
      \ with \"error\"-level constraints: add an \"error\" constraint ONLY when violating\
      \ it guarantees a pipeline crash or silent corruption of results.\n\nLevel Assignment\
      \ Rules:\n- Set level \"error\" ONLY if data violating the check causes the\
      \ downstream code to CRASH (e.g., unhandled TypeError, ValueError from `.astype(int)`\
      \ on NaNs) OR silently produce corrupted results (e.g., invalid calculations,\
      \ distorted ranking formulas).\n- Set level \"warning\" if the downstream code\
      \ handles anomalous data gracefully (e.g., uses `errors='coerce'`, `.fillna()`,\
      \ `if pd.notna(...)`, string fallbacks, or drops invalid rows). If the code\
      \ does not crash or corrupt results upon encountering missing or out-of-spec\
      \ values, the check MUST be \"warning\".\n\nConstraint Design Guidelines:\n\
      - Data Type Validation:\n  - Do NOT blindly apply `.hasDataType(..., ConstrainableDataTypes.Integral)`\
