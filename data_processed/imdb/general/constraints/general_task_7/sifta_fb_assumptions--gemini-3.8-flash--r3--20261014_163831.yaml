  instructions:
    dataflow_inspector: "Carefully inspect the entire code script to identify every\
      \ line that references the target column. \n\nFollow these guidelines to locate\
      \ occurrences accurately:\n1. Scan the script line-by-line from line 1 (1-based\
      \ index, counting every line including imports, blank lines, and comments).\n\
      2. Look for exact string matches of the target column name (e.g., 'col' or \"\
      col\"):\n   - In indexing or filtering: df['col'], df[['col', ...]], df.loc[:,\
      \ 'col'], query, etc.\n   - In column definitions or lists: out_cols, usecols,\
      \ select, drop, columns=[...], etc.\n   - In operations: groupby, sort_values,\
      \ set_index (e.g., verify_integrity=True), merge/join keys.\n   - In transformations:\
      \ pd.to_numeric, .astype(), .str.*, .map(), .apply(), or arithmetic expressions.\n\
      \   - In output persistence calls: to_csv, to_parquet (especially in columns=[...]\
      \ specifications).\n3. Verification: Verify each matched line by confirming\
      \ that the exact line content contains the column name string. Count lines precisely\
      \ without estimating or skipping blank lines.\n4. Group contiguous lines into\
      \ a single range { \"start_line\": int, \"end_line\": int }. Ensure export lists,\
      \ filtering conditions, and passthrough references in output definitions are\
      \ never missed.\n\nOutput only JSON: { \"sources\": [{ \"start_line\": int,\
      \ \"end_line\": int }, ...] }"
    assumption_generation: "Analyze how the target column is used in the focused code\
      \ and downstream task, cross-referencing with the target_column_desc statistics:\n\
      \n1. Column Existence and Guarded Fallbacks:\n   - Check whether the column\
      \ is unconditionally required or optional: if the code guards references with\
      \ existence checks (e.g., `if 'col' in df.columns:`, `[c for c in out_cols if\
      \ c in df.columns]`), the column is optional; do NOT assume mandatory existence.\n\
      \   - Assume mandatory existence only if the column is unconditionally indexed\
      \ (e.g., `df['col']`) such that missing the column causes a fatal KeyError.\n\
      \n2. Data Types:\n   - For numeric columns (indicated as Integral, Fractional,\
      \ or Numeric in target_column_desc), assume a general numeric data type (integral\
      \ or fractional). In pandas/Spark, numeric columns often shift between integer\
      \ and float representations when nulls or decimals are present; do NOT assume\
      \ strictly Integral or strictly Fractional.\n   - For string or boolean columns,\
      \ assume string or boolean conformance only if non-null values are parsed or\
      \ transformed by type-specific methods.\n\n3. Code Invariants & Nullability:\n\
      \   - Completeness / Nullability: Pandas operations like `.sort_values()`, `.groupby()`,\
      \ and CSV export natively handle nulls and DO NOT crash on them. Assume completeness\
      \ ONLY if the column is used in operations that crash on nulls without handling\
      \ (e.g., standard `.astype(int)`/`.astype('int64')`, chained `.str.extract(...).astype(int)`,\
      \ or unhandled division/indexing).\n   - If the column has completeness < 1.0\
      \ in target_column_desc, or if the code uses `.fillna()`, `errors='coerce'`,\
      \ or handles NaNs safely, do NOT assume completeness.\n   - Pattern / Format:\
      \ If values are parsed with regular expressions before converting to numbers\
      \ (e.g., `.str.extract(r'(\\d+)').astype(int)`), non-null strings must conform\
      \ to the expected pattern so extraction does not yield NaNs that break integer\
      \ casting.\n   - Domain & Valid Values: If mapped via dictionaries without a\
      \ default, values must belong to the allowed keys. If used in log or division\
      \ without clipping/safeguards, values must be strictly positive or non-zero.\
      \ If used as ratings or counts, respect domain non-negativity or rating ranges.\n\
      \   - Uniqueness / Keys: If explicitly used in index verification with `verify_integrity=True`,\
      \ combinations must be unique.\n\n4. Precision over Coverage:\n   - Avoid generating\
      \ assumptions that the code does not strictly require. A property that safe\
      \ partitions might vary on (e.g., a few missing values in sorted columns, integer\
      \ vs float representation) will trigger false alarms if assumed.\n\nFormulate\
      \ assumptions as clear, testable statements about the input data.\n\nOutput\
      \ only valid JSON (numbers without leading zeros): { \"assumptions\": [{ \"\
      text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }] }, ...]\
      \ }"
    ir_generation: "Translate the assumptions into executable PyDeequ checks using\
      \ the available row-level and aggregate functions.\n\nDetermine the severity\
      \ level for each check:\n- \"error\": Use for checks whose violation would cause\
      \ the script to crash, raise an unhandled exception, or produce fatal silent\
      \ corruption in downstream calculations:\n  - Data type checks on columns actively\
      \ computed in formulas or required for execution.\n  - Completeness (.isComplete)\
      \ ONLY when nulls cause fatal unhandled crashes (e.g., unhandled `.astype(int)`).\n\
      \  - Regex pattern checks (.hasPattern) where non-matching strings cause downstream\
      \ `.astype(int)` crashes.\n  - Value bounds (e.g., `.isNonNegative`, `.satisfies`)\
      \ where negative values or zeros violate mathematical invariants (e.g., log,\
      \ division, rating formulas).\n  - Unique keys enforced via `verify_integrity=True`.\n\
      - \"warning\": Use for checks where violation does not crash the code and is\
      \ safely handled or tolerated:\n  - Columns that are optional or guarded (e.g.,\
      \ `if c in final.columns`).\n  - Columns that are merely passed through to output\
      \ without computation.\n  - Completeness or formatting on columns where pandas\
      \ naturally tolerates missing or variable values (e.g., sorting, export).\n\n\
      Rules for Constraint Generation:\n- Ensure syntactically valid PyDeequ expressions\
      \ starting with \".\" (e.g., .isComplete('col'), .hasDataType('col', ConstrainableDataTypes.Numeric)).\n\
      - Data Type Validation: For all numeric columns (Integral, Fractional, or Numeric),\
      \ ALWAYS use `ConstrainableDataTypes.Numeric` instead of `Integral` or `Fractional`.\
      \ This prevents false alarms on safe partitions where integers are stored with\
      \ float representation or nullable types.\n- Completeness (.isComplete): Do\
      \ NOT generate `.isComplete` for columns that are merely sorted, exported, or\
      \ handled by pandas without crashing. If target_column_desc has completeness\
      \ < 1.0, NEVER generate `.isComplete`.\n- Pattern Matching: When an assumption\
      \ requires matching an extraction pattern (e.g. for runtime strings with digits),\
      \ use `.hasPattern('col', r'^\\d+')` or appropriate regex.\n- Non-negativity\
      \ & Ranges: Use `.isNonNegative('col')` or `.satisfies('`col` >= 0 AND `col`\
      \ <= 10', 'col_range')` for counts, ratings, and metrics requiring valid non-negative\
      \ ranges.\n- Avoid over-constraining aggregate distributions (mean, std dev,\
      \ quantiles) unless strictly demanded by code logic.\n- Link each check to the\
      \ 0-based indices of the assumptions it validates.\n\nOutput: {\"constraint_code\"\
      : [{\"suggestion\": PyDeequ code (starting with \".\" or a function), \"level\"\
      : \"warning\"|\"error\", \"linked assumptions\": [indices]}, ...]}\n\nAvailable\
      \ Row-Level Functions:\nName: isComplete, Description: Validates that a column\
      \ contains no null values. A column is considered complete if all rows have\
      \ non-null values.\n RequiredArgs: ['column']\n OptionalArgs: []\n Example:\
      \ .isComplete('student_id')\nName: hasCompleteness, Description: Validates the\
      \ completeness fraction of a column. Completeness is the ratio of non-null values\
      \ to total rows. The assertion lambda receives the completeness fraction (0.0\
      \ to 1.0) and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted',\
      \ lambda x: x >= 0.95)\nName: hasPattern, Description: Validates that column\
      \ values match a regular expression pattern. The pattern is a regex string.\
      \ The optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold. The optional name parameter\
      \ provides a descriptive name for the constraint.\nIMPORTANT: Use raw strings\
      \ (r\"...\") for regex patterns to avoid escape sequence issues. For example,\
      \ use r\"^\\d+$\" instead of \"^\\\\d+$\".\n RequiredArgs: ['column', 'pattern']\n\
      \ OptionalArgs: ['assertion', 'name']\n Examples:\n  - .hasPattern('student_id',\
      \ r'^id_\\d+$')\n  - .hasPattern('student_id', r'^id_\\d+$', lambda x: x >=\
      \ 0.95)\nName: containsCreditCardNumber, Description: Validates that values\
