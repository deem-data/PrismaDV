prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Certificate:
    code:
    - suggestion: '.hasCompleteness(''Certificate'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 0106b8f0-f5ac-4fdc-ae77-0cc2bcd673e0
      source_assumptions:
      - 66bd2398-a95b-40d7-a7c4-957e5068b2de
    assumptions:
    - text: 'The ''Certificate'' column must exist in the input dataset so that it
        can be selected and included in the exported ''top_picks.csv'' file without
        throwing a KeyError.

        We could represent this assumption as a Great Expectations constraint like
        this:

        expect_column_to_exist(''Certificate'')

        '
      sources:
      - start_line: 18
        end_line: 18
        file: ''
      - start_line: 63
        end_line: 79
        file: ''
      uid: 66bd2398-a95b-40d7-a7c4-957e5068b2de
  Genre:
    code:
    - suggestion: '.hasCompleteness(''Genre'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 252ea28b-3cb3-47f2-a486-34a38da8708d
      source_assumptions:
      - cbd0cc79-ab81-4251-9d6b-cfe24a0925ab
    assumptions:
    - text: 'The ''Genre'' column must exist in the input dataset because it is directly
        referenced in `top_cols` and written to the output file `top_picks.csv` without
        prior creation or renaming in the script.

        We could represent this assumption as a deequ constraint or validation check
        for column existence.'
      sources:
      - start_line: 18
        end_line: 18
        file: ''
      - start_line: 63
        end_line: 76
        file: ''
      - start_line: 79
        end_line: 79
        file: ''
      uid: cbd0cc79-ab81-4251-9d6b-cfe24a0925ab
  IMDB_Rating:
    code:
    - suggestion: .satisfies('`IMDB_Rating` >= 0.0 AND `IMDB_Rating` <= 10.0', 'imdb_rating_in_valid_range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 423aa251-1af9-436f-b2d1-9fc88961519e
      source_assumptions:
      - 05eb482c-9853-4506-bec1-394b3c714409
    - suggestion: '.hasCompleteness(''IMDB_Rating'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8b323278-a081-46db-b0ee-3bcff1a0ae12
      source_assumptions:
      - 6126a39c-95b6-496b-aaba-d73b7fb3eb73
    - suggestion: '.hasMax(''IMDB_Rating'', lambda x: x >= 7.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 41e89a9c-845f-44ca-a03b-d88dba5159b5
      source_assumptions:
      - 780e86bc-fdc3-418d-bfb8-08d7205fe394
    assumptions:
    - text: The 'IMDB_Rating' column should contain numeric or convertible-to-numeric
        values representing movie ratings, typically on a scale from 0.0 to 10.0.
        The column is parsed to numeric format using `pd.to_numeric`.
      sources:
      - start_line: 39
        end_line: 39
        file: ''
      uid: 05eb482c-9853-4506-bec1-394b3c714409
    - text: The 'IMDB_Rating' column should not be completely null or empty, because
        `R.mean()` is computed to determine the prior mean rating C for Bayesian quality
        score calculation.
      sources:
      - start_line: 43
        end_line: 47
        file: ''
      uid: 6126a39c-95b6-496b-aaba-d73b7fb3eb73
    - text: The 'IMDB_Rating' column should have at least some rows with a rating
        greater than or equal to 7.0, as the pipeline filters for `df['IMDB_Rating']
        >= 7.0` to curate and rank the Top Picks dataset.
      sources:
      - start_line: 53
        end_line: 55
        file: ''
      uid: 780e86bc-fdc3-418d-bfb8-08d7205fe394
  Meta_score:
    code:
    - suggestion: .hasDataType('Meta_score', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e40221f8-3582-40a4-8a91-7cb1012da850
      source_assumptions:
      - a8b5037d-173c-412b-8e46-9e09ae94f039
    - suggestion: '.hasCompleteness(''Meta_score'', lambda x: x >= 0.5)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8f42aca6-7c3c-4add-8e7d-1b375299b024
      source_assumptions:
      - 11f2ed6a-c017-47d6-b657-7a59b2b5b608
    assumptions:
    - text: The 'Meta_score' column can contain missing or null values because the
        code converts it to numeric with errors coerced to NaN and fills null values
        using `.fillna(C)`.
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: 11f2ed6a-c017-47d6-b657-7a59b2b5b608
    - text: The 'Meta_score' column is expected to contain numeric or numeric-convertible
        values representing scores that are scaled by dividing by 10.0.
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      uid: a8b5037d-173c-412b-8e46-9e09ae94f039
  No_of_Votes:
    code:
    - suggestion: .hasDataType('No_of_Votes', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 124ac86e-89c9-4259-9bf4-4d6c5c492286
      source_assumptions:
      - d7ade9bb-8078-4970-a07a-576aa50e7b02
    - suggestion: .isNonNegative('No_of_Votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a9769e6a-7061-4156-8eb7-f345b16e71a5
      source_assumptions:
      - 2816bda7-5aaa-4c9a-9150-f087306f6bc8
    assumptions:
    - text: The 'No_of_Votes' column may contain missing or non-numeric values because
        the script uses pd.to_numeric with errors='coerce' and fills missing values
        with 0. However, the column should generally contain numeric representations
        of vote counts (or integral values).
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: d7ade9bb-8078-4970-a07a-576aa50e7b02
    - text: The 'No_of_Votes' column is used for calculating quantiles and a weighted
        Bayesian rating score where votes and (votes + m) are used in division and
        multiplication, assuming non-negative vote counts in the dataset.
      sources:
      - start_line: 44
        end_line: 47
        file: ''
      uid: 2816bda7-5aaa-4c9a-9150-f087306f6bc8
  Poster_Link:
    code:
    - suggestion: .hasDataType('Poster_Link', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d9ac6c65-d8df-4eb0-b172-4dc3ddc3e5e5
      source_assumptions:
      - 9dd9c907-2576-4541-b19b-618fca01127b
    - suggestion: .isComplete('Poster_Link')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b20a79d1-dd98-49ad-a315-ee84a46ce30d
      source_assumptions:
      - 81dfbf06-b42b-4ed9-ab1a-f7c9690aab11
    assumptions:
    - text: 'The ''Poster_Link'' column should exist in the dataset and contain string
        values representing poster URLs or links. We could represent this assumption
        as a deequ constraint like this: .hasDataType(''Poster_Link'', ConstrainableDataTypes.String)'
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 9dd9c907-2576-4541-b19b-618fca01127b
    - text: 'The ''Poster_Link'' column should not contain null values (completeness
        of 1.0) to ensure every movie entry can be mapped to a valid asset ID and
        properly exported to the top picks and asset manifest files. We could represent
        this assumption as a deequ constraint like this: .isComplete(''Poster_Link'')'
      sources:
      - start_line: 31
        end_line: 33
        file: ''
      - start_line: 74
        end_line: 79
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 81dfbf06-b42b-4ed9-ab1a-f7c9690aab11
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 483f88b9-3b1f-475a-8c6b-03d710ac219f
      source_assumptions:
      - 8ddc4e7f-a1f6-438c-95f1-5cb0e6d87dfb
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values because it
        is directly converted to string, combined with ''Series_Title'' to generate
        a unique composite key (''title_year_key''), and used for sorting and deduplication.
        We could represent this assumption as a deequ constraint like this: .isComplete("Released_Year")'
      sources:
      - start_line: 22
        end_line: 25
        file: ''
      uid: 8ddc4e7f-a1f6-438c-95f1-5cb0e6d87dfb
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c00d5ab6-a3f0-4704-9991-9c00e7d5c301
      source_assumptions:
      - df53a2ae-d8ec-493f-a291-6f5126aa52c1
    - suggestion: .hasPattern('Runtime', r'^\s*\d+\s*min\s*$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b9f2a33a-0190-4a01-9db6-8744b7f11780
      source_assumptions:
      - 83564aba-872b-4ebe-81b8-dc19d12d15cf
    assumptions:
    - text: 'The ''Runtime'' column should not contain null values because the code
        extracts numeric minutes using regex and converts the result to integer with
        `.astype(int)`. Any null values or missing matches will result in NaN, which
        causes `.astype(int)` to throw a ValueError. We could represent this assumption
        as a deequ constraint like this: .isComplete(''Runtime'')'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: df53a2ae-d8ec-493f-a291-6f5126aa52c1
    - text: 'Each value in the ''Runtime'' column must follow the format of digits
        followed by ''min'' (e.g., matching the regex pattern ''^\\s*\\d+\\s*min\\s*$''),
        because the code extracts the integer runtime with regex pattern r''^\s*(\d+)\s*min\s*$''
        and immediately casts to integer via `.astype(int)`. Any string not matching
        this pattern produces NaN and causes `.astype(int)` to fail. We could represent
        this assumption as a deequ constraint like this: .hasPattern(''Runtime'',
        ''^\\s*\\d+\\s*min\\s*$'')'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: 83564aba-872b-4ebe-81b8-dc19d12d15cf
  Series_Title:
    code:
    - suggestion: .isComplete('Series_Title')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8ad2941d-e7fd-4b97-aab4-6155a24fde90
      source_assumptions:
      - 06f50dea-e958-4bd6-990b-980044197662
    assumptions:
    - text: 'The ''Series_Title'' column should not contain null or missing values
        as it serves as a primary identifier for creating the composite key ''title_year_key''
        and is used in sorting and final catalog output. We can represent this assumption
        as a deequ constraint: .hasCompleteness(''Series_Title'', lambda x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 25
        file: ''
      - start_line: 63
        end_line: 79
        file: ''
      uid: 06f50dea-e958-4bd6-990b-980044197662
  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code:
    - suggestion: .satisfies('`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10 AND `No_of_Votes`
        >= 0 AND (`Meta_score` IS NULL OR (`Meta_score` >= 0 AND `Meta_score` <= 100))',
        'valid_imdb_votes_metascore')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ba600435-487b-4314-8eaf-f057d46738ba
      source_assumptions:
      - 60d0595f-7e89-4e4d-983c-d98355230d4d
    assumptions:
    - text: "The columns 'IMDB_Rating', 'No_of_Votes', and 'Meta_score' are used together\
        \ to compute a Bayesian composite 'quality_score'. 'IMDB_Rating' and 'No_of_Votes'\
        \ must be valid non-negative numeric values with 'IMDB_Rating' having a valid\
        \ non-null mean (C), while 'Meta_score' is expected to be on a 0\u2013100\
        \ scale matching 'IMDB_Rating' on a 0\u201310 scale after division by 10.0."
      sources:
      - start_line: 39
        end_line: 51
        file: ''
      uid: 60d0595f-7e89-4e4d-983c-d98355230d4d
  '["IMDB_Rating","No_of_Votes"]':
    code: []
    assumptions:
    - text: Both 'IMDB_Rating' and 'No_of_Votes' must be valid non-negative numeric
        values and non-null together to compute the Bayesian weighted rating score
        wr = (votes / (votes + m) * R) + (m / (votes + m) * C) without resulting in
        undefined or missing values.
      sources:
      - start_line: 43
        end_line: 47
        file: ''
      uid: c5c393f6-0804-41f8-8d4a-629ffd7a0742
  '["Released_Year","Series_Title"]':
    code: []
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' should be unique
        across all records in the dataset to reliably construct unique catalog identifiers
        (''title_year_key'' and ''catalog_id''). We could represent this assumption
        as a deequ constraint like this: .isUnique(["Series_Title", "Released_Year"])'
      sources:
      - start_line: 21
        end_line: 27
        file: ''
      uid: c268aa2d-2e19-4326-b6ab-4c5a1cbacc89
