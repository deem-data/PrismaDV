prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \n    input_fp = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_fp)\n\
  \n    # Normalize keys\n    df['Series_Title'] = df['Series_Title'].astype(str).str.strip()\n\
  \    df['Released_Year'] = df['Released_Year'].astype(str).str.strip()\n    df['title_year_key']\
  \ = df['Series_Title'] + '|' + df['Released_Year']\n    # Stable catalog ids (order-dependent,\
  \ relies on unique title-year)\n    df = df.sort_values(['Series_Title', 'Released_Year']).reset_index(drop=True)\n\
  \    id_map = {k: i + 1 for i, k in enumerate(df['title_year_key'])}\n    df['catalog_id']\
  \ = df['title_year_key'].map(id_map)\n\n    # Poster checks before building asset\
  \ ids\n    poster_unique_ratio = df['Poster_Link'].nunique(dropna=True) / float(len(df))\n\
  \    unique_posters = pd.Index(df['Poster_Link']).unique()\n    poster_asset_id_map\
  \ = {url: i + 1 for i, url in enumerate(unique_posters)}\n    df['poster_asset_id']\
  \ = df['Poster_Link'].map(poster_asset_id_map)\n\n    # Runtime parsing\n    runtime_pattern\
  \ = r'^\\s*(\\d+)\\s*min\\s*$'\n    df['Runtime_Minutes'] = df['Runtime'].astype(str).str.extract(runtime_pattern)[0].astype(int)\n\
  \    # Ratings and votes\n    df['IMDB_Rating'] = pd.to_numeric(df['IMDB_Rating'],\
  \ errors='coerce')\n    df['No_of_Votes'] = pd.to_numeric(df['No_of_Votes'], errors='coerce').fillna(0).astype(int)\n\
  \n    # Bayesian quality score used for ranking\n    R = df['IMDB_Rating']\n   \
  \ votes = df['No_of_Votes']\n    m = float(np.quantile(votes, 0.60))\n    C = float(R.mean())\n\
  \    wr = (votes / (votes + m) * R) + (m / (votes + m) * C)\n\n    df['Meta_score']\
  \ = pd.to_numeric(df['Meta_score'], errors='coerce')\n    meta_scaled = (df['Meta_score']\
  \ / 10.0).fillna(C)\n    df['quality_score'] = 0.8 * wr + 0.2 * meta_scaled\n\n\
  \    frac_high = (df['IMDB_Rating'] >= 7.0).mean()\n    # Curate and rank Top Picks\n\
  \    base = df[df['IMDB_Rating'] >= 7.0].copy()\n    base = base.drop_duplicates(subset=['title_year_key'],\
  \ keep='first')\n    base = base.sort_values(['quality_score', 'No_of_Votes'], ascending=[False,\
  \ False])\n    base['display_rank'] = np.arange(1, len(base) + 1)\n\n    top_k =\
  \ 100\n    top_picks = base.head(top_k)\n\n    top_cols = [\n        'display_rank',\n\
  \        'catalog_id',\n        'Series_Title',\n        'Released_Year',\n    \
  \    'IMDB_Rating',\n        'No_of_Votes',\n        'Runtime_Minutes',\n      \
  \  'Genre',\n        'Certificate',\n        'poster_asset_id',\n        'Poster_Link',\n\
  \        'quality_score'\n    ]\n\n    top_picks_out = os.path.join(args.output,\
  \ 'top_picks.csv')\n    top_picks[top_cols].to_csv(top_picks_out, index=False)\n\
  \n    manifest_out = os.path.join(args.output, 'assets_manifest.csv')\n    df[['poster_asset_id',\
  \ 'Poster_Link']].drop_duplicates().sort_values('poster_asset_id').to_csv(manifest_out,\n\
  \                                                                              \
  \                     index=False)\n\n    stats = {\n        'total_input': int(len(df)),\n\
  \        'unique_title_year': int(df['title_year_key'].nunique()),\n        'unique_posters':\
  \ int(df['Poster_Link'].nunique()),\n        'poster_unique_ratio': float(poster_unique_ratio),\n\
  \        'fraction_rating_ge_7': float(frac_high),\n        'm_votes_threshold':\
  \ float(m),\n        'top_picks_count': int(len(top_picks))\n    }\n    stats_out\
  \ = os.path.join(args.output, 'top_picks_stats.json')\n    with open(stats_out,\
  \ 'w') as f:\n        json.dump(stats, f, indent=2)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_7.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 200, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BZjZlZDlkYTktMmU1My00ZDBiLWFlNjEtYTBhNjVhOTM4ZjJjXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Donnie Darko', 'Released_Year': 2001, 'Certificate': 'R', 'Runtime':\
  \ '113 min', 'Genre': 'Drama, Mystery, Sci-Fi', 'IMDB_Rating': 8.0, 'Overview':\
  \ 'After narrowly escaping a bizarre accident, a troubled teenager is plagued by\
  \ visions of a man in a large rabbit suit who manipulates him to commit a series\
  \ of crimes.', 'Meta_score': 88.0, 'Director': 'Richard Kelly', 'Star1': 'Jake Gyllenhaal',\
  \ 'Star2': 'Jena Malone', 'Star3': 'Mary McDonnell', 'Star4': 'Holmes Osborne',\
  \ 'No_of_Votes': 740086, 'Gross': '1,480,006'}, {'id': 56, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BOWVmZGQ0MGYtMDI1Yy00MDkxLWJiYjQtMmZjZmQ0NDFmMDRhXkEyXkFqcGdeQXVyNjg3MDMxNzU@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'The Peanut Butter Falcon', 'Released_Year': 2019, 'Certificate':\
  \ 'PG-13', 'Runtime': '97 min', 'Genre': 'Adventure, Comedy, Drama', 'IMDB_Rating':\
  \ 7.6, 'Overview': 'Zak runs away from his care home to make his dream of becoming\
  \ a wrestler come true.', 'Meta_score': 70.0, 'Director': 'Tyler Nilson', 'Star1':\
  \ 'Michael Schwartz', 'Star2': 'Zack Gottsagen', 'Star3': 'Ann Owens', 'Star4':\
  \ 'Dakota Johnson', 'No_of_Votes': 66346, 'Gross': '13,122,642'}, {'id': 43, 'Poster_Link':\
  \ 'https://m.media-amazon.com/images/M/MV5BMDU2ZWJlMjktMTRhMy00ZTA5LWEzNDgtYmNmZTEwZTViZWJkXkEyXkFqcGdeQXVyNDQ2OTk4MzI@._V1_UX67_CR0,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'Toy Story', 'Released_Year': 1995, 'Certificate': 'U', 'Runtime':\
  \ '81 min', 'Genre': 'Animation, Adventure, Comedy', 'IMDB_Rating': 8.3, 'Overview':\
  \ \"A cowboy doll is profoundly threatened and jealous when a new spaceman figure\
  \ supplants him as top toy in a boy's room.\", 'Meta_score': 95.0, 'Director': 'John\
  \ Lasseter', 'Star1': 'Tom Hanks', 'Star2': 'Tim Allen', 'Star3': 'Don Rickles',\
  \ 'Star4': 'Jim Varney', 'No_of_Votes': 887429, 'Gross': '191,796,233'}]\n\nThe\
  \ full table is on disk at `./data/tables/observed_data.csv`. You have complete\
  \ access to it:\nload it with pandas, profile it, plot it, run whatever analysis\
  \ helps. It is a\nthrowaway copy -- nothing you do to it has any effect outside\
  \ this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ constraint\
  \ code against the staged table and read back\nthe result of every check:\n\n```\n\
  python deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
