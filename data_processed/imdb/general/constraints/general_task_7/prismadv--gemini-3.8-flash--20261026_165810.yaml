  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code: []
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''Meta_score'' represent movie ratings
        on a 0-10 and 0-100 scale respectively. Missing ''Meta_score'' values are
        imputed using the mean of ''IMDB_Rating'' (divided by 10), and both ratings
        are combined into ''quality_score''. Therefore, both columns are expected
        to have a positive correlation and satisfy their expected scale ranges (IMDB_Rating
        between 0 and 10, Meta_score between 0 and 100). We could represent this assumption
        as a deequ constraint like this: .hasCorrelation("IMDB_Rating", "Meta_score",
        _ > 0.0)'
      sources:
      - start_line: 43
        end_line: 51
        file: ''
      uid: f0dfc1a6-a671-44e7-8515-c556d95df278
    - text: 'In the Bayesian weighted rating computation, ''No_of_Votes'' serves as
        the weighting factor for ''IMDB_Rating''. For the formula (votes / (votes
        + m) * R) + (m / (votes + m) * C) to produce valid ratings without negative
        weights or undefined values, ''No_of_Votes'' must be non-negative whenever
        ''IMDB_Rating'' is present. We could represent this assumption as a deequ
        constraint like this: .satisfies("IMDB_Rating IS NULL OR No_of_Votes >= 0",
        "NonNegativeVotesForRating")'
      sources:
      - start_line: 43
        end_line: 47
        file: ''
      uid: 454630ad-cf96-4198-b22d-d0afa61bd97b
  '["IMDB_Rating","Meta_score"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda x: x >
        0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e28cde0d-c305-4cdf-ac85-bf6eeee38f58
      source_assumptions:
      - 5f8338bd-50e7-405d-9192-90699fcef7d7
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''Meta_score'' are both quantitative
        measures of movie quality combined into a unified ''quality_score''. ''Meta_score''
        is scaled by 10 to match the 0-10 scale of ''IMDB_Rating'', and missing ''Meta_score''
        values are imputed with the mean of ''IMDB_Rating''. Therefore, ''IMDB_Rating''
        and ''Meta_score'' are assumed to have a positive correlation across the dataset.
        We could represent this assumption as a Deequ constraint like: .hasCorrelation("IMDB_Rating",
