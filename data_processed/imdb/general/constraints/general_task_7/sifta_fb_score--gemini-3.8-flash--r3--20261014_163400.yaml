  instructions:
    dataflow_inspector: "Analyze the code script and list every line that touches\
      \ the target column:\n1. Exact string and identifier matches: Look for the target\
      \ column name as a string literal (e.g., 'col', \"col\") or attribute (.col)\
      \ across all occurrences:\n   - Data loading and column lists (e.g., read_csv(...,\
      \ usecols=[...]), out_cols = [...], shortlist_cols = [...], to_csv(..., columns=[...])).\n\
      \   - Index definitions (set_index), subset selections, and column presence\
      \ checks ('col' in df).\n   - Filtering conditions (df[df['col'] > ...]), sorting\
      \ keys (sort_values(['col', ...])), and groupbys.\n   - Transformations, type-casts\
      \ (pd.to_numeric, .astype), string operations (.str), and dictionary/tuple creations\
      \ (e.g., zip(df['col'], ...)).\n2. Accurate line numbers: Read the code line\
      \ by line using the exact 1-based line numbers directly from the script. Never\
      \ guess, estimate, or hallucinate line numbers—verify that the target column\
      \ literally appears on each reported line. Merge consecutive adjacent line numbers\
      \ into a single range [start_line, end_line].\n\nOutput only JSON: { \"sources\"\
      : [{ \"start_line\": int, \"end_line\": int }, ...] }"
    assumption_generation: "Analyze how the target column is used in the focused code,\
      \ its column description, and the downstream task to infer data validation assumptions.\n\
      \nGuidelines for generating assumptions:\n1. Grounding and Impact: State properties\
      \ where violation would cause the code to crash (e.g., regex extract producing\
      \ NaNs before .astype(int), unhandled nulls, duplicate keys in set_index(...,\
      \ verify_integrity=True)) OR silently produce wrong results (e.g., corrupted\
      \ vote counts distorting log-scaled popularity formulas, bad types breaking\
      \ sort_values, invalid ratings skewing composite rankings).\n2. Distinguish\
      \ Defensive Parsing from Safe Defaults:\n   - Pipeline operations like pd.to_numeric(...,\
      \ errors='coerce'), .fillna(0), or .clip(...) are often defensive guards to\
      \ prevent immediate crashes. If invalid, missing, or out-of-range values passing\
      \ through these fallbacks would silently alter calculations, ranking logic,\
      \ or downstream recommendations, assume the column must contain valid, conformant\
      \ data.\n   - Only consider an issue truly handled if the downstream business\
      \ logic intentionally treats nulls or fallback values as normal, valid business\
      \ states without distorting results.\n3. Passthrough and Schema Assumptions:\n\
      \   - If a column is passed through or included in final output exports (e.g.,\
      \ 'Poster_Link', 'Director', 'Star1'-'Star4', 'Certificate') without heavy computation,\
      \ it forms part of the published dataset contract. Assume it must exist, maintain\
      \ completeness (if indicated by metadata), and conform to its expected foundational\
      \ domain data type (e.g., String).\n4. Dataset Domain Context (Movie/Entertainment\
      \ Data):\n   - Categorical/Text fields ('Series_Title', 'Certificate', 'Genre',\
      \ 'Director', 'Star1'-'Star4'): Expected to be strings; Certificate and Genre\
      \ match standard industry categories. Key identifiers (e.g., ('Series_Title',\
      \ 'Released_Year')) must maintain unique integrity when used as composite keys\
      \ or index definitions.\n   - Numeric fields ('IMDB_Rating', 'No_of_Votes',\
      \ 'Released_Year', 'Meta_score'): Expected to be numeric; ratings bounded within\
      \ [0, 10]; vote counts non-negative integers; release years valid calendar years.\n\
      \   - Formatted fields ('Runtime', 'Gross'): Runtime typically formatted with\
      \ digits (e.g., '110 min'); Gross contains numeric or currency representations.\n\
      \nOutput only valid JSON (numbers without leading zeros): { \"assumptions\"\
      : [{ \"text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }]\
      \ }, ...] }"
    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Assignment:\n- Set level \"error\" for all checks where failure\
      \ indicates an unsafe partition—meaning the code would crash OR silently produce\
      \ an incorrect, invalid, or corrupted result. This includes:\n  * Foundational\
      \ data type checks (.hasDataType) for all active columns (computational inputs,\
      \ keys, and export schema fields).\n  * Completeness (.isComplete) on required\
      \ identifiers, scoring inputs, or non-nullable fields where missing data skews\
      \ metrics, ranking, or schema validity.\n  * Essential domain validity constraints\
      \ (e.g., .isNonNegative for counts/votes, non-empty regex patterns, composite\
      \ uniqueness).\n  * CRITICAL: Do NOT downgrade a constraint to \"warning\" merely\
      \ because defensive code (such as errors='coerce', fillna, or clip) allows the\
      \ script to finish running without an exception. If coerced values corrupt downstream\
      \ calculations or output integrity, the constraint MUST be \"error\". Every\
      \ target column must have its core data type and integrity checks set to \"\
      error\" so erroneous partitions can be rejected.\n- Set level \"warning\" ONLY\
      \ if the deviation is purely a benign, advisory observation that does not invalidate\
      \ downstream logic, calculations, or the output dataset schema (e.g., secondary\
      \ non-fatal properties where nulls are an intended business scenario).\n\nRules\
      \ for PyDeequ Constraints:\n- Use exact PyDeequ syntax and ConstrainableDataTypes\
      \ enum (e.g., ConstrainableDataTypes.String, ConstrainableDataTypes.Numeric,\
      \ ConstrainableDataTypes.Integral).\n- For column existence and completeness\
      \ where nulls break downstream logic or output integrity, use .isComplete('column').\n\
      - For type checks, use .hasDataType('column', ConstrainableDataTypes....).\n\
      - For non-negative numeric expectations, use .isNonNegative('column').\n- For\
      \ composite key uniqueness (e.g., Series_Title + Released_Year), use .hasUniqueness(['col1',\
      \ 'col2'], lambda x: x == 1.0). Do not enforce .isUnique on a single column\
      \ unless it is uniquely indexed alone.\n- For pattern and format checks, use\
      \ raw regex strings: .hasPattern('column', r'...').\n- Link each check to the\
      \ corresponding indices (0-based) of the assumptions it tests.\n\nOutput: {\"\
      constraint_code\": [{\"suggestion\": PyDeequ code (starting with \".\" or a\
      \ function), \"level\": \"warning\"|\"error\", \"linked assumptions\": [indices]},\
      \ ...]}\n\nAvailable Row-Level Functions:\nName: isComplete, Description: Validates\
      \ that a column contains no null values. A column is considered complete if\
      \ all rows have non-null values.\n RequiredArgs: ['column']\n OptionalArgs:\
      \ []\n Example: .isComplete('student_id')\nName: hasCompleteness, Description:\
      \ Validates the completeness fraction of a column. Completeness is the ratio\
      \ of non-null values to total rows. The assertion lambda receives the completeness\
      \ fraction (0.0 to 1.0) and returns a boolean indicating if it meets the threshold.\n\
      \ RequiredArgs: ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
      \ lambda x: x >= 0.95)\nName: areComplete, Description: Validates that all columns\
      \ in a set are complete (contain no null values). All specified columns must\
      \ have non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted',\
      \ lambda x: x >= 0.95)\nName: hasPattern, Description: Validates that column\
      \ values match a regular expression pattern. The pattern is a regex string.\
      \ The optional assertion lambda receives the fraction of matching rows and returns\
      \ a boolean indicating if it meets the threshold. The optional name parameter\
      \ provides a descriptive name for the constraint.\nIMPORTANT: Use raw strings\
      \ (r\"...\") for regex patterns to avoid escape sequence issues. For example,\
      \ use r\"^\\d+$\" instead of \"^\\\\d+$\".\n RequiredArgs: ['column', 'pattern']\n\
      \ OptionalArgs: ['assertion', 'name']\n Examples:\n  - .hasPattern('student_id',\
      \ r'^id_\\d+$')\n  - .hasPattern('student_id', r'^id_\\d+$', lambda x: x >=\
      \ 0.95)\nName: containsCreditCardNumber, Description: Validates that values\
      \ in a string column are valid credit card numbers. The optional assertion lambda\
      \ receives the fraction of valid credit card numbers and returns a boolean indicating\
      \ if it meets the threshold.\n RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .containsCreditCardNumber('credit_card')\n  - .containsCreditCardNumber('credit_card',\
      \ lambda x: x >= 0)\nName: containsEmail, Description: Validates that values\
      \ in a string column are valid email addresses. The optional assertion lambda\
      \ receives the fraction of valid emails and returns a boolean indicating if\
      \ it meets the threshold.\n RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n\
      \ Examples:\n  - .containsEmail('email')\n  - .containsEmail('email', lambda\
      \ x: x >= 0)\nName: containsURL, Description: Validates that values in a string\
      \ column are valid URLs. The optional assertion lambda receives the fraction\
      \ of valid URLs and returns a boolean indicating if it meets the threshold.\n\
      \ RequiredArgs: ['column']\n OptionalArgs: ['assertion']\n Examples:\n  - .containsURL('url')\n\
      \  - .containsURL('url', lambda x: x >= 0)\nName: containsSocialSecurityNumber,\
      \ Description: Validates that values in a string column are valid US social\
      \ security numbers. The optional assertion lambda receives the fraction of valid\
