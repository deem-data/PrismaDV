    assumption_generation: "Code makes implicit and explicit assumptions about its\
      \ input data. Based on the focused code that uses the target column and the\
      \ column description, formulate assumptions about the data properties required\
      \ for the code to run correctly and produce valid downstream results.\n\nGuidelines:\n\
      1. Ground assumptions strictly in the code's operations:\n   - If the column\
      \ is used in arithmetic, mathematical functions (e.g., log, division), or numeric\
      \ comparisons, assume appropriate numeric types and valid ranges (e.g., non-negative,\
      \ non-zero if dividing).\n   - If the column is used for indexing (e.g., set_index\
      \ with verify_integrity=True) or unique mapping, assume uniqueness and completeness.\n\
      \   - If the column is parsed (e.g., regex, datetime, string split), assume\
      \ compatible string formatting.\n   - If the code uses explicit fallback logic\
      \ (e.g., fillna, errors='coerce', default values), do NOT assume completeness\
      \ or strict parsing unless missing values lead to silent logic failure.\n2.\
      \ Prioritize precision over broad checks: do not assume arbitrary distributions\
      \ or unnecessary constraints that clean alternative partitions might violate.\
      \ Focus on requirements where a violation would crash the pipeline or produce\
      \ silently corrupted results.\n\nOutput only valid JSON (numbers without leading\
      \ zeros): { \"assumptions\": [{ \"text\": str, \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into executable PyDeequ checks.\n\n\
      Constraint Level Assignment:\n- Set level to \"error\" if data violating the\
      \ check would cause the code to CRASH or silently produce INCORRECT/CORRUPTED\
      \ results (e.g., sorting skew, invalid downstream calculations, broken indexing/keys,\
      \ unhandled type mismatches).\n- Set level to \"warning\" ONLY if the downstream\
      \ code explicitly tolerates or safely handles the violation (e.g., via fillna,\
      \ errors='coerce', clipping, or fallback defaults) without compromising the\
      \ correctness of downstream tasks.\n\nLink each check to the indices (from 0)\
      \ of the assumptions it tests. Ensure constraints match PyDeequ syntax accurately\
      \ and do not impose overly tight thresholds that cause false alarms on safe\
      \ data partitions.\n\nOutput: {\"constraint_code\": [{\"suggestion\": PyDeequ\
      \ code (starting with \".\" or a function), \"level\": \"warning\"|\"error\"\
      , \"linked assumptions\": [indices]}, ...]}\n\nAvailable Row-Level Functions:\n\
      Name: isComplete, Description: Validates that a column contains no null values.\
      \ A column is considered complete if all rows have non-null values.\n RequiredArgs:\
      \ ['column']\n OptionalArgs: []\n Example: .isComplete('student_id')\nName:\
      \ hasCompleteness, Description: Validates the completeness fraction of a column.\
      \ Completeness is the ratio of non-null values to total rows. The assertion\
      \ lambda receives the completeness fraction (0.0 to 1.0) and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['column', 'assertion']\n\
      \ OptionalArgs: []\n Example: .hasCompleteness('credits_attempted', lambda x:\
      \ x >= 0.95)\nName: areComplete, Description: Validates that all columns in\
      \ a set are complete (contain no null values). All specified columns must have\
      \ non-null values in every row.\n RequiredArgs: ['columns']\n OptionalArgs:\
      \ []\n Example: .areComplete(['student_id', 'target'])\nName: haveCompleteness,\
      \ Description: Validates the completeness fraction across a set of columns.\
      \ The assertion lambda receives the completeness fraction and returns a boolean\
      \ indicating if it meets the threshold.\n RequiredArgs: ['columns', 'assertion']\n\
      \ OptionalArgs: []\n Example: .haveCompleteness(['credits_attempted', 'credits_completed'],\
      \ lambda x: x >= 0.95)\nName: areAnyComplete, Description: Validates that at\
      \ least one column in a set is complete (contains no null values). At least\
      \ one of the specified columns must have non-null values in every row.\n RequiredArgs:\
      \ ['columns']\n OptionalArgs: []\n Example: .areAnyComplete(['student_id', 'target'])\n\
      Name: satisfies, Description: Validates a custom SQL-like condition on the dataframe.\
      \ The columnCondition should be written as a SQL WHERE clause condition (e.g.,\
      \ '`col1` <= `col2`'). The constraintName is a descriptive name for the constraint.\
      \ The optional assertion lambda receives the fraction of rows that satisfy the\
      \ condition and returns a boolean indicating if it meets the threshold.\n RequiredArgs:\
      \ ['columnCondition', 'constraintName']\n OptionalArgs: ['assertion']\n Examples:\n\
      \  - .satisfies('`credits_completed` <= `credits_attempted`', 'completed_le_attempted')\n\
