constraints:
  Genre:
    code:
    - - .isComplete('Genre')
      - Valid
    assumptions: []
    column_name: Genre
  IMDB_Rating:
    code:
    - - .isComplete('IMDB_Rating')
      - Valid
    - - '.satisfies(''IMDB_Rating >= 0 AND IMDB_Rating <= 10'', ''valid_imdb_rating'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: IMDB_Rating
  Meta_score:
    code:
    - - '.satisfies(''Meta_score IS NULL OR (Meta_score >= 0 AND Meta_score <= 100)'',
        ''valid_optional_meta_score'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Meta_score
  No_of_Votes:
    code:
    - - '.satisfies(''No_of_Votes > 0'', ''positive_vote_count'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: No_of_Votes
  Poster_Link:
    code:
    - - .isComplete('Poster_Link')
      - Valid
    assumptions: []
    column_name: Poster_Link
  Released_Year:
    code:
    - - .isComplete('Released_Year')
      - Valid
    - - '.satisfies("CAST(Released_Year AS STRING) RLIKE ''^[0-9]{4}$''", ''four_digit_release_year'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Released_Year
  Runtime:
    code:
    - - '.satisfies("Runtime RLIKE ''^[[:space:]]*[0-9]+[[:space:]]*min[[:space:]]*$''",
        ''parseable_runtime'', lambda x: x == 1.0)'
      - Invalid
    assumptions: []
    column_name: Runtime
  Series_Title:
    code:
    - - .isComplete('Series_Title')
      - Valid
    - - '.satisfies("LENGTH(TRIM(CAST(Series_Title AS STRING))) > 0 AND CAST(Series_Title
        AS STRING) = TRIM(CAST(Series_Title AS STRING))", ''nonblank_normalized_title'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title
  Series_Title, Released_Year:
    code:
    - - '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Series_Title, Released_Year
