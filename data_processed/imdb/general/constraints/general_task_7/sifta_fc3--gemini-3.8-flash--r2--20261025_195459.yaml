      \ code OR silently produce an incorrect, corrupted, or degraded downstream result\
      \ (e.g., corrupted rankings/scores, invalid IDs, corrupted catalog feeds, or\
      \ missing required metadata). Silent downstream corruption IS an error—do NOT\
      \ demote a check to \"warning\" just because Python code executes without an\
      \ uncaught exception.\n- Every target column must have at least one \"error\"\
      -level constraint for its core integrity requirement (such as data type, non-null\
      \ completeness when required, or essential domain bounds). A column with only\
      \ warning-level constraints can never reject an erroneous batch.\n- Set level\
      \ \"warning\" ONLY when the pipeline intentionally and safely handles the data\
      \ variation with an explicit fallback or default without breaking or corrupting\
      \ downstream business logic.\n\nAvoiding False Alarms:\n- Use `ConstrainableDataTypes.Numeric`\
