prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Certificate:
    code: []
    assumptions:
    - text: The 'Certificate' column must be present in the dataset, as it is included
        in 'top_cols' and selected for export to 'top_picks.csv'. If the column is
        missing, subsetting the DataFrame with `top_picks[top_cols]` will raise a
        KeyError.
      sources:
      - start_line: 63
        end_line: 79
        file: ''
      uid: 6218a65b-e2ce-4946-acca-06291ad5a0d4
    - text: The 'Certificate' column is allowed to contain missing/null values, as
        the code selects the column and writes it directly to a CSV file without performing
        any non-null validation, imputation, or null-sensitive operations.
      sources:
      - start_line: 63
        end_line: 79
        file: ''
      uid: 011566c0-ea16-4546-ba7d-566d20215d3d
  Genre:
    code:
    - suggestion: '.hasCompleteness(''Genre'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 1dbb0802-40a6-481b-90bd-ba9cd1964b35
      source_assumptions:
      - 5e1ff031-784a-4da4-9a7f-2aa614c7b80c
    assumptions:
    - text: 'The ''Genre'' column must be present in the input dataset because it
        is explicitly included in ''top_cols'' and selected from the DataFrame when
        generating ''top_picks.csv''. If ''Genre'' is missing, selecting it will raise
        a KeyError. We could represent this assumption as a deequ constraint like
        this: .hasColumn(''Genre'')'
      sources:
      - start_line: 63
        end_line: 79
        file: ''
      uid: 5e1ff031-784a-4da4-9a7f-2aa614c7b80c
  IMDB_Rating:
    code:
    - suggestion: .isComplete('IMDB_Rating')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5805cb92-a009-4fc3-af3e-dea78385ad1f
      source_assumptions:
      - d888dfba-36c3-4eeb-b6ee-14ee817bdc34
    - suggestion: '.satisfies(''`IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10'', ''Valid
        IMDB Rating Range'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 086c87fb-6b2a-412c-a77f-6dc86c860801
      source_assumptions:
      - 9260fc91-c411-42db-82ed-4eb1d49524b9
    - suggestion: '.satisfies(''`IMDB_Rating` >= 7.0'', ''Contains ratings >= 7.0'',
        lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 55ac11b5-7024-4ebc-8ba3-8006c79a507a
      source_assumptions:
      - 9260fc91-c411-42db-82ed-4eb1d49524b9
    assumptions:
    - text: 'The ''IMDB_Rating'' column should be convertible to numeric values and
        should not be entirely null, as the code computes the mean rating (`C = float(R.mean())`)
        to use in calculating Bayesian quality scores.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("IMDB_Rating")

        '
      sources:
      - start_line: 39
        end_line: 46
        file: ''
      uid: d888dfba-36c3-4eeb-b6ee-14ee817bdc34
    - text: 'The ''IMDB_Rating'' column should contain valid movie rating values typically
        ranging between 0 and 10, with at least some values greater than or equal
        to 7.0 so that candidate movies can be selected for top picks (`df[df[''IMDB_Rating'']
        >= 7.0]`).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `IMDB_Rating` >= 0 AND `IMDB_Rating` <= 10 THEN 1 ELSE
        0 END", "Valid IMDB Rating Range", lambda x: x == 1.0)

        '
      sources:
      - start_line: 53
        end_line: 55
        file: ''
      uid: 9260fc91-c411-42db-82ed-4eb1d49524b9
  Meta_score:
    code:
    - suggestion: .satisfies('`Meta_score` IS NULL OR CAST(`Meta_score` AS DOUBLE)
        IS NOT NULL', 'Meta_score_is_numeric')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 410e5897-e875-4ae5-b536-d776a6a42b41
      source_assumptions:
      - bf04637d-5017-4e73-afb5-9cac83b01a19
      - 8cf1fe8c-a222-43c0-aeb7-8d71ee0cf978
    assumptions:
    - text: The 'Meta_score' column can contain missing or null values, as the code
        explicitly handles missing values by imputing them with the average rating
        using `.fillna(C)` after scaling.
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: bf04637d-5017-4e73-afb5-9cac83b01a19
    - text: The 'Meta_score' column values should be numeric or convertible to numeric
        format, as the downstream code parses it using `pd.to_numeric` and performs
        arithmetic division by 10.0.
      sources:
      - start_line: 49
        end_line: 50
        file: ''
      uid: 8cf1fe8c-a222-43c0-aeb7-8d71ee0cf978
  No_of_Votes:
    code:
    - suggestion: '.satisfies("CASE WHEN `No_of_Votes` IS NOT NULL THEN 1 ELSE 0 END",
        "Allowed Nulls", lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e1de20ba-c85e-4eff-9618-fe368749bb4a
      source_assumptions:
      - 2ebaf901-d2d6-4e18-acbe-2e9040fb6415
    - suggestion: '.satisfies("CASE WHEN `No_of_Votes` >= 0 OR `No_of_Votes` IS NULL
        THEN 1 ELSE 0 END", "Non-negative No_of_Votes", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c4a9e611-ab1a-4725-959e-51731813423f
      source_assumptions:
      - 91b184cb-822c-4094-862e-dff98cfcc003
    assumptions:
    - text: 'The ''No_of_Votes'' column can contain missing or non-numeric values,
        as the code safely converts the values using pd.to_numeric with errors=''coerce''
        and fills missing values with 0. We could represent this assumption as a deequ
        constraint like this: .satisfies("CASE WHEN `No_of_Votes` IS NOT NULL THEN
        1 ELSE 0 END", "Allowed Nulls", lambda x: x >= 0.0)'
      sources:
      - start_line: 40
        end_line: 40
        file: ''
      uid: 2ebaf901-d2d6-4e18-acbe-2e9040fb6415
    - text: 'The ''No_of_Votes'' column is expected to contain non-negative values
        (>= 0), as it represents a count of votes and is used in calculating the Bayesian
        weighted rating where division by (votes + m) occurs. We could represent this
        assumption as a deequ constraint like this: .satisfies("CASE WHEN `No_of_Votes`
        >= 0 OR `No_of_Votes` IS NULL THEN 1 ELSE 0 END", "Non-negative No_of_Votes",
        lambda x: x == 1.0)'
      sources:
      - start_line: 40
        end_line: 47
        file: ''
      uid: 91b184cb-822c-4094-862e-dff98cfcc003
  Poster_Link:
    code:
    - suggestion: .isComplete('Poster_Link')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 98cf228f-3a58-4779-9f6a-d2b97fa1725c
      source_assumptions:
      - 146b2721-6a50-41a5-a3cb-0cd48d194f8f
    - suggestion: .hasDataType('Poster_Link', ConstrainableDataTypes.String)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b9c58baa-3f60-4b8f-a423-44964e42bdd8
      source_assumptions:
      - ecf5118f-9fd4-4d47-9e59-34c2b46316ca
    assumptions:
    - text: 'The ''Poster_Link'' column should not contain null values (completeness
        of 1.0) because it is used to construct the asset dictionary `poster_asset_id_map`
        and mapped to generate `poster_asset_id`. Having null values would cause unmapped
        or missing asset identifiers in the output top picks and assets manifest.
        We could represent this assumption as a deequ constraint like this: .isComplete(''Poster_Link'')'
      sources:
      - start_line: 31
        end_line: 33
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: 146b2721-6a50-41a5-a3cb-0cd48d194f8f
    - text: 'The ''Poster_Link'' column should have a string data type, as it represents
        poster image URLs used for asset cataloging and exported in the asset manifest.
        We could represent this assumption as a deequ constraint like this: .hasDataType(''Poster_Link'',
        ConstrainableDataTypes.String)'
      sources:
      - start_line: 30
        end_line: 33
        file: ''
      - start_line: 82
        end_line: 83
        file: ''
      uid: ecf5118f-9fd4-4d47-9e59-34c2b46316ca
  Released_Year:
    code:
    - suggestion: .isComplete('Released_Year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 26ca34ab-327c-448c-9ec4-7ec6e87d14ee
      source_assumptions:
      - 5e15821c-258e-4a5b-8187-37980a858ff2
    - suggestion: .hasDataType('Released_Year', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a4f5faf7-d612-4871-afd8-173599ebb11f
      source_assumptions:
      - 5f5827f1-54bc-4c34-8dff-d7d389d8292f
    assumptions:
    - text: 'The ''Released_Year'' column should not contain null values, as it is
        used directly alongside ''Series_Title'' to construct the composite identifier
        ''title_year_key'' for catalog IDs and deduplication. We could represent this
        assumption as a deequ constraint like this: .isComplete(''Released_Year'')'
      sources:
      - start_line: 22
        end_line: 27
        file: ''
      - start_line: 56
        end_line: 56
        file: ''
      uid: 5e15821c-258e-4a5b-8187-37980a858ff2
    - text: 'The ''Released_Year'' column should have an integral data type, representing
        valid calendar years for movie releases. We could represent this assumption
        as a deequ constraint like this: .hasDataType(''Released_Year'', ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 25
        end_line: 25
        file: ''
      uid: 5f5827f1-54bc-4c34-8dff-d7d389d8292f
  Runtime:
    code:
    - suggestion: .isComplete('Runtime')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 3c07fda1-8499-45bb-a4df-8e51a68e4681
      source_assumptions:
      - 3ca9ab40-b968-4572-8656-a8c40346c0f3
    - suggestion: '.hasPattern(''Runtime'', r''^\s*\d+\s*min\s*$'', lambda x: x ==
        1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: f99cdff0-36b4-407f-b0e6-5d592168aa3e
      source_assumptions:
      - ecedf359-db4a-4d5a-88ff-c9d059991e49
    assumptions:
    - text: 'The ''Runtime'' column must not contain null values, because any missing
        value would be converted to ''nan'', fail to match the regex pattern, and
        result in NaN, which causes `.astype(int)` to raise a ValueError.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Runtime")'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: 3ca9ab40-b968-4572-8656-a8c40346c0f3
    - text: 'Each value in the ''Runtime'' column must match the pattern r''^\s*\d+\s*min\s*$'',
        consisting of digits followed by ''min'' (optionally surrounded by whitespace).
        If any value fails to match, `.str.extract()` returns NaN, which will cause
        `.astype(int)` to fail.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Runtime", "^\\s*\\d+\\s*min\\s*$", lambda x: x == 1.0)'
      sources:
      - start_line: 36
        end_line: 37
        file: ''
      uid: ecedf359-db4a-4d5a-88ff-c9d059991e49
  Series_Title:
    code:
    - suggestion: .isComplete('Series_Title')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2cbab644-aa74-4b6d-bedf-04c23cde2a92
      source_assumptions:
      - bf81bb98-5a16-401b-a5a9-35cba1a009b2
    - suggestion: '.satisfies("TRIM(`Series_Title`) != ''''", "Non-empty Series_Title",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a8199b3c-5aa4-43db-ac63-7ea2acff40af
      source_assumptions:
      - add5925f-b97e-4aa1-94b6-20f9b6a4b046
    assumptions:
    - text: 'The ''Series_Title'' column should not contain null or missing values,
        as it serves as a primary movie identifier used to construct ''title_year_key'',
        assign catalog IDs, sort the catalog, and generate the final ''top_picks''
        catalog. If missing values were present, converting them via astype(str) would
        turn them into the literal string ''nan''. We could represent this assumption
        as a deequ constraint like this: .isComplete("Series_Title")'
      sources:
      - start_line: 21
        end_line: 27
        file: ''
      - start_line: 63
        end_line: 79
        file: ''
      uid: bf81bb98-5a16-401b-a5a9-35cba1a009b2
    - text: 'The ''Series_Title'' column values should not be empty strings or purely
        whitespace after stripping, as non-empty titles are expected when creating
        ''title_year_key'' and sorting records. We could represent this assumption
        as a deequ constraint like this: .satisfies("TRIM(`Series_Title`) != ''''",
        "Non-empty Series_Title", lambda x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 25
        file: ''
      uid: add5925f-b97e-4aa1-94b6-20f9b6a4b046
  '["IMDB_Rating","Meta_score","No_of_Votes"]':
    code:
    - suggestion: '.hasCorrelation(''IMDB_Rating'', ''Meta_score'', lambda c: c >
        0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b9b7b6a2-4564-4f77-800a-04a6585bbb88
      source_assumptions:
      - a4fb321d-faf1-4c2d-b192-f3f1f0fb57ff
    - suggestion: .satisfies('`IMDB_Rating` IS NOT NULL OR `No_of_Votes` IS NULL',
        'IMDB_Rating_not_null_when_votes_present')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 611e9b75-1014-4b1f-b472-2468e48281f7
      source_assumptions:
      - 2ee2a263-61f5-420f-bfbf-34893c7a0fd6
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''Meta_score'' are expected to have a
        positive correlation because both quantify film quality and reception and
        are combined linearly (with Meta_score scaled to match IMDB_Rating''s 0-10
        scale and imputed using IMDB_Rating''s mean) into ''quality_score''. We could
        represent this assumption as a Deequ constraint like: .hasCorrelation(''IMDB_Rating'',
        ''Meta_score'', lambda c: c > 0.0)'
      sources:
      - start_line: 43
        end_line: 43
        file: ''
      - start_line: 46
        end_line: 46
        file: ''
      - start_line: 49
        end_line: 51
        file: ''
      uid: a4fb321d-faf1-4c2d-b192-f3f1f0fb57ff
    - text: '''IMDB_Rating'' and ''No_of_Votes'' are jointly used to compute the Bayesian
        weighted rating ''wr''. While ''No_of_Votes'' has missing values imputed with
        0, ''IMDB_Rating'' does not impute missing values prior to computing ''wr''.
        Therefore, ''IMDB_Rating'' must not be null when ''No_of_Votes'' is present
        to ensure ''wr'' and the resulting ''quality_score'' are not null. We could
        represent this assumption as a Deequ constraint like: .satisfies(''IMDB_Rating
        IS NOT NULL OR No_of_Votes IS NULL'', ''IMDB_Rating_not_null_when_votes_present'')'
      sources:
      - start_line: 39
        end_line: 40
        file: ''
      - start_line: 43
        end_line: 47
        file: ''
      - start_line: 51
        end_line: 51
        file: ''
      uid: 2ee2a263-61f5-420f-bfbf-34893c7a0fd6
  '["IMDB_Rating","No_of_Votes"]':
    code:
    - suggestion: .satisfies('`IMDB_Rating` IS NOT NULL AND `IMDB_Rating` >= 0 AND
        `No_of_Votes` >= 0', 'valid_rating_and_votes')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b39e9cfc-39a8-48ff-a7e3-634c6065eb92
      source_assumptions:
      - 71766daa-d8a9-4357-99e6-6474c3a2f817
    assumptions:
    - text: 'The columns ''IMDB_Rating'' and ''No_of_Votes'' are used together to
        compute the Bayesian weighted score `wr = (votes / (votes + m) * R) + (m /
        (votes + m) * C)` and to rank candidate movies. The code assumes that when
        ''IMDB_Rating'' is present, ''No_of_Votes'' is non-negative and valid numeric
        data exists for both columns so that the weighted score does not evaluate
        to NaN or produce invalid rankings. We could represent this assumption as
        a Deequ constraint like this: .satisfies("IMDB_Rating IS NOT NULL AND IMDB_Rating
        >= 0 AND No_of_Votes >= 0", "valid_rating_and_votes")'
      sources:
      - start_line: 43
        end_line: 47
        file: ''
      - start_line: 55
        end_line: 57
        file: ''
      uid: 71766daa-d8a9-4357-99e6-6474c3a2f817
  '["Poster_Link","Released_Year","Series_Title"]':
    code:
    - suggestion: '.hasUniqueness([''Series_Title'', ''Released_Year''], lambda x:
