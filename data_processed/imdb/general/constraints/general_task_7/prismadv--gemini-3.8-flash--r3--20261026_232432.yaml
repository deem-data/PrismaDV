      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 69d98458-ff49-4088-b651-6ba3d4bcb984
      source_assumptions:
      - fe577b8c-01e5-409b-a176-e61a9245acc8
    assumptions:
    - text: 'The combination of ''Series_Title'' and ''Released_Year'' columns is
        expected to be unique across all records in the dataset to serve as a composite
        identifier for generating stable catalog IDs. We could represent this assumption
        as a deequ constraint like this: .isUnique(["Series_Title", "Released_Year"])'
      sources:
