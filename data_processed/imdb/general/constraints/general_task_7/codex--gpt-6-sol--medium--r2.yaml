  \ 240714, 'Gross': '52,990,775'}, {'id': 201, 'Poster_Link': 'https://m.media-amazon.com/images/M/MV5BODhkZDIzNjgtOTA5ZS00MmMzLWFkNjYtM2Y2MzFjN2FkNjAzL2ltYWdlXkEyXkFqcGdeQXVyNTAyODkwOQ@@._V1_UY98_CR1,0,67,98_AL_.jpg',\
  \ 'Series_Title': 'True Grit', 'Released_Year': 2010, 'Certificate': 'PG-13', 'Runtime':\
  \ '110 min', 'Genre': 'Drama, Western', 'IMDB_Rating': 7.6, 'Overview': \"A stubborn\
