constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date, 'yyyy-MM-dd')
        IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Eliminator', 'Qualifier 1', 'Qualifier
        2', 'Final', 'Semi Final', 'Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .satisfies("method IS NULL OR method = 'D/L'", 'recognized_method_when_present')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'valid_wicket_margin')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0)", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('CAST(season AS INT) BETWEEN 2008 AND 2100', 'valid_season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('target_overs IS NULL OR (target_overs > 0 AND target_overs <=
        20)', 'valid_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('target_runs IS NULL OR target_runs > 0', 'positive_target_runs_when_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'different_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR winner IN (team1, team2)", 'played_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
