          = 'Final')", 'canonical_alert_match_types')
        - Valid
      assumptions: []
      column_name: match_type
    result:
      code:
      - - .isComplete('result')
        - Valid
      - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
          'recognized_result_type')
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("lower(trim(result)) <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
        - Valid
      - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
          IS NOT NULL AND result_margin > 0)", 'played_margin_is_positive')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      - - .satisfies("CAST(season AS STRING) RLIKE '^[0-9]{4}$'", 'four_digit_numeric_season')
        - Valid
      assumptions: []
      column_name: season
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies("team1 <> team2", 'distinct_opponents')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isComplete('toss_decision')
        - Valid
      - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'recognized_toss_decision')
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .isComplete('toss_winner')
        - Valid
      - - .satisfies("toss_winner IN (team1, team2)", 'toss_winner_is_participant')
        - Valid
      assumptions: []
      column_name: toss_winner
    winner:
      code:
      - - .satisfies("lower(trim(result)) = 'no result' OR winner IN (team1, team2)",
          'played_winner_is_participant')
        - Valid
      - - .satisfies("match_type <> 'Final' OR winner IS NOT NULL", 'final_has_champion')
        - Valid
      assumptions: []
      column_name: winner
