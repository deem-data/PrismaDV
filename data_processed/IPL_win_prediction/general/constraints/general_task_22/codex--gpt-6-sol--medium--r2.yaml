prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef compute_group_kpis(g:\
  \ pd.DataFrame) -> pd.Series:\n    total = len(g)\n    played_cnt = int(g['played'].sum())\n\
  \n    toss_win_rate = float(g.loc[g['played'], 'toss_won_match'].mean()) if played_cnt\
  \ > 0 else np.nan\n    chasing_win_rate = float(g.loc[g['played'], 'chasing_win'].mean())\
  \ if played_cnt > 0 else np.nan\n\n    avg_margin_runs = float(g.loc[g['is_runs'],\
  \ 'margin_runs'].mean()) if g['is_runs'].any() else np.nan\n    avg_margin_wickets\
  \ = float(g.loc[g['is_wickets'], 'margin_wkts'].mean()) if g['is_wickets'].any()\
  \ else np.nan\n\n    return pd.Series({\n        'matches': total,\n        'matches_played':\
  \ played_cnt,\n        'toss_win_rate': toss_win_rate,\n        'chasing_win_rate':\
  \ chasing_win_rate,\n        'avg_margin_runs': avg_margin_runs,\n        'avg_margin_wickets':\
  \ avg_margin_wickets,\n    })\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    os.makedirs(args.output,\
  \ exist_ok=True)\n    input_file = os.path.join(args.input, 'new_data.csv')\n\n\
  \    df = pd.read_csv(input_file)\n\n    # Basic normalization\n    df['season']\
  \ = df['season'].astype(str).str.strip()\n    df['date'] = pd.to_datetime(df['date'],\
  \ errors='coerce')\n    df['result_lc'] = df['result'].astype(str).str.strip().str.lower()\n\
  \    df['toss_decision_lc'] = df['toss_decision'].astype(str).str.strip().str.lower()\n\
  \    df['super_over_u'] = df['super_over'].astype(str).str.strip().str.upper()\n\
  \n    # Coerce margins to numeric for downstream math\n    df['result_margin'] =\
  \ pd.to_numeric(df['result_margin'], errors='coerce')\n    # Derive chasing team\
  \ using toss decision\n    df['chasing_team'] = np.where(\n        df['toss_decision_lc']\
  \ == 'field',\n        df['toss_winner'],\n        np.where(df['toss_winner'] ==\
  \ df['team1'], df['team2'], df['team1'])\n    )\n\n    # Played indicator (exclude\
  \ no result)\n    df['played'] = df['result_lc'] != 'no result'\n    # Toss impact\
  \ features\n    df['toss_won_match'] = df['played'] & (df['toss_winner'] == df['winner'])\n\
  \n    # Result-type flags\n    df['is_runs'] = df['result_lc'] == 'runs'\n    df['is_wickets']\
  \ = df['result_lc'] == 'wickets'\n    # Chasing outcome\n    df['chasing_win'] =\
  \ df['played'] & (df['winner'] == df['chasing_team'])\n\n    # Victory margins (typed\
  \ by mode)\n    df['margin_runs'] = np.where(df['is_runs'], df['result_margin'],\
  \ np.nan)\n    df['margin_wkts'] = np.where(df['is_wickets'], df['result_margin'],\
  \ np.nan)\n\n    # KPI by (season, match_type)\n    kpi_sm = df.groupby(['season',\
  \ 'match_type']).apply(compute_group_kpis).reset_index()\n\n    # Champions (winner\
  \ of the Final per season)\n    finals = df[df['match_type'].astype(str).str.strip().str.casefold()\
  \ == 'final']\n    champions = finals[['season', 'winner']].rename(columns={'winner':\
  \ 'champion'}).drop_duplicates('season')\n\n    # KPI by season (all match types\
  \ combined)\n    kpi_s = df.groupby('season').apply(compute_group_kpis).reset_index()\n\
  \    season_summary = kpi_s.merge(champions, on='season', how='left')\n\n    # Persist\
  \ KPIs\n    kpi_sm_out = os.path.join(args.output, 'season_matchtype_kpis.csv')\n\
  \    kpi_sm.to_csv(kpi_sm_out, index=False)\n\n    season_summary_out = os.path.join(args.output,\
  \ 'season_summary.csv')\n    season_summary.to_csv(season_summary_out, index=False)\n\
  \n    # Alerts for latest season\n    season_ints = pd.to_numeric(df['season'],\
  \ errors='coerce')\n    latest_season = str(int(np.nanmax(season_ints))) if not\
  \ np.isnan(np.nanmax(season_ints)) else None\n\n    alerts = []\n    if latest_season\
  \ is not None:\n        row_league = kpi_sm[(kpi_sm['season'] == latest_season)\
  \ & (kpi_sm['match_type'] == 'League')]\n        if not row_league.empty:\n    \
  \        r = row_league.iloc[0]\n            if pd.notna(r['toss_win_rate']) and\
  \ r['toss_win_rate'] >= 0.6:\n                alerts.append({\n                \
  \    'type': 'toss_impact_high',\n                    'season': latest_season,\n\
  \                    'match_type': 'League',\n                    'value': round(float(r['toss_win_rate']),\
  \ 4)\n                })\n            if pd.notna(r['chasing_win_rate']) and r['chasing_win_rate']\
  \ >= 0.55:\n                alerts.append({\n                    'type': 'chasing_dominant',\n\
  \                    'season': latest_season,\n                    'match_type':\
  \ 'League',\n                    'value': round(float(r['chasing_win_rate']), 4)\n\
  \                })\n        row_final = kpi_sm[\n            (kpi_sm['season']\
  \ == latest_season) & (kpi_sm['match_type'].astype(str).str.strip() == 'Final')]\n\
  \        if not row_final.empty:\n            rf = row_final.iloc[0]\n         \
  \   champ = champions.loc[champions['season'] == latest_season, 'champion']\n  \
  \          champ_val = champ.iloc[0] if not champ.empty else None\n            alerts.append({\n\
  \                'type': 'season_champion',\n                'season': latest_season,\n\
  \                'champion': champ_val,\n                'avg_margin_runs_final':\
  \ (\n                    None if pd.isna(rf['avg_margin_runs']) else round(float(rf['avg_margin_runs']),\
  \ 2)),\n                'avg_margin_wickets_final': (\n                    None\
  \ if pd.isna(rf['avg_margin_wickets']) else round(float(rf['avg_margin_wickets']),\
  \ 2))\n            })\n\n    alerts_out = os.path.join(args.output, 'alerts.json')\n\
  \    with open(alerts_out, 'w', encoding='utf-8') as f:\n        json.dump({'alerts':\
  \ alerts}, f, ensure_ascii=False, indent=2)\n\n\nif __name__ == '__main__':\n  \
  \  main()\n\n```\n\nThe same program is on disk at `./code/general_task_22.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur',\
  \ 'date': '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner',\
  \ 'venue': 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings\
  \ XI Punjab', 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs':\
  \ 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem\
  \ Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune',\
  \ 'date': '2022-03-29', 'match_type': 'League', 'player_of_match': 'SV Samson',\
  \ 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1': 'Rajasthan\
  \ Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers Hyderabad',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin':\
  \ 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id': 249, 'season':\
  \ 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League', 'player_of_match':\
  \ 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata Knight Riders',\
  \ 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field',\
  \ 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
