    assumptions:
    - text: For each match, the calendar year parsed from 'date' should equal the
        numeric year in 'season'. Otherwise, season-level KPIs could group matches
        under the wrong year. This can be checked with a row-level constraint comparing
        year(to_date(date)) to season.
      sources:
      - start_line: 41
        end_line: 42
        file: ''
      - start_line: 72
        end_line: 72
        file: ''
      - start_line: 90
        end_line: 91
        file: ''
      uid: 43a89799-face-47e4-bad8-072b17e9a60e
    - text: Within each 'season', at most one record should have a 'match_type' that
        equals 'Final' after trimming and case-folding. The code selects the champion
        by dropping additional Final records for the same season, so multiple Finals
        could silently produce an arbitrary champion.
