      - start_line: 75
        end_line: 76
        file: ''
      - start_line: 112
        end_line: 117
        file: ''
      uid: 39a753ed-cb76-4a13-9866-310716b977fc
    - text: For any season with a Final, its 'date' should be on or after the dates
