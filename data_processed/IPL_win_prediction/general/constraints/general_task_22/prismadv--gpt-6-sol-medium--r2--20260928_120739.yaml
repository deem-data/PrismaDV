      - start_line: 42
        end_line: 42
        file: ''
      - start_line: 75
        end_line: 76
        file: ''
      uid: 931b284d-87e0-4687-bb72-9a4e122fe1c2
    - text: Within a 'season', equivalent 'match_type' values should use one canonical
