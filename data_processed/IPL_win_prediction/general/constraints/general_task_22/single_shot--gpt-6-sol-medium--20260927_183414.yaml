constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin, result:
    code:
    - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR result_margin > 0", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin, result
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opposing_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner, team1, team2:
    code:
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner, team1, team2
  winner, result, team1, team2:
    code:
    - - .satisfies("result = 'no result' OR winner = team1 OR winner = team2", 'played_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner, result, team1, team2
