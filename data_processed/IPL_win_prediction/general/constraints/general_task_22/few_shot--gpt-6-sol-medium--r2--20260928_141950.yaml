constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid match date')
      - Valid
    assumptions: []
    column_name: date
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'recognized result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin >= 0)", 'nonnegative margin for runs or wickets
        result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'recognized super over
        indicator')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    - - .satisfies('team1 <> team2', 'distinct competing teams')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'recognized toss
        decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss winner is a
        competing team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR winner IN (team1, team2)",
        'played match winner is a competing team')
      - Valid
    assumptions: []
    column_name: winner
