      \ into automated PyDeequ / Deequ unit tests on data (e.g., `isComplete`, `hasCompleteness`,\
      \ `satisfies`, `hasPattern`, `isContainedIn`, `hasDataType`).\n\n### Input Format\n\
      You will receive:\n1. `target_column`: The name of the column under test.\n\
      2. `target_column_desc`: Profiling metadata for the column (completeness, data\
      \ type, distinct values, etc.).\n3. `focused_code`: Python source code lines\
      \ (annotated with line numbers) operating on the data.\n4. `downstream_task_description`:\
      \ Context about how the output or data is used.\n\n### Output Format\nOutput\
      \ **only** valid JSON with no markdown wrapping or leading zeros:\n```json\n\
      {\n  \"assumptions\": [\n    {\n      \"text\": \"<Precise assertion statement\
      \ about the column>\",\n      \"sources\": [\n        {\n          \"start_line\"\
      : <int>,\n          \"end_line\": <int>\n        }\n      ]\n    }\n  ]\n}\n\
      ```\n\n---\n\n### Core Guidelines & Rules for Formulating Assumptions\n\n1.\
      \ **Assert Quality Constraints, Never Permissive Behavior**:\n   - **Do NOT**\
      \ state that a column \"may contain nulls\" or \"nulls will be handled gracefully\"\
      \ just because the code uses `.fillna()`, `errors='coerce'`, or `pd.notna()`.\
      \ A Deequ check tests the *incoming dataset*, not whether the code can survive\
      \ garbage.\n   - Instead, state the required constraint on the input:\n    \
      \ - If `completeness == 1.0` in the profile and/or the column is an essential\
      \ key/join/grouping attribute, assert that the column must be complete (no missing/null\
      \ values) -> maps to `.isComplete('<column>')`.\n     - If the column has high\
      \ completeness (e.g., >= 0.95 or 0.98), assert that the completeness of the\
      \ column must meet a threshold (e.g., completeness at least 95% / 0.95) -> maps\
      \ to `.hasCompleteness('<column>', lambda c: c >= 0.95)`.\n\n2. **Value Ranges\
      \ & Predicates (`satisfies`)**:\n   - Inspect operations like arithmetic, aggregations\
      \ (`> 0`, margins, counts, ratios).\n   - If the column represents a count,\
      \ margin, run, or physical measurement, assert valid ranges (e.g., \"Values\
      \ in `<column>` must be non-negative (>= 0) or null\" or \"Values in `<column>`\
      \ must be strictly positive (> 0)\").\n\n3. **Data Types & Format Patterns (`hasDataType`,\
      \ `hasPattern`)**:\n   - For date/datetime columns parsed with `pd.to_datetime`:\n\
      \     - Assert that the column matches standard date string patterns (e.g.,\
      \ `YYYY-MM-DD` / pattern `^\\d{4}-\\d{2}-\\d{2}$`).\n   - For numeric columns\
      \ parsed with `pd.to_numeric`:\n     - Assert that values are valid numeric\
      \ (Fractional or Integral) numbers.\n   - For ID or categorical string fields:\n\
      \     - Assert that values must be string types.\n\n4. **Categorical Domains\
      \ & Membership (`isContainedIn`)**:\n   - When the code checks against specific\
      \ values/enums (e.g., `result.isin(['runs', 'wickets', 'tie', 'no result'])`),\
      \ state that the column values must belong to that defined set of allowed values.\n\
      \n5. **Direct Source Mapping**:\n   - For every assumption, reference the exact\
      \ `start_line` and `end_line` in `focused_code` where the column is checked,\
