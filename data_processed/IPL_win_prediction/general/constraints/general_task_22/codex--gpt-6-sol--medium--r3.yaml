        I’m considering how non-canonical types create separate categories. The `isContainedIn`
        domain catches a new type, but could be overconstraining since it might limit
        new playoff formats. Currently, the condition captures only League Final and
        blanks. I think adding `trim(match_type) = match_type` should prevent unnecessary
        group splitting.


        I also need to check if `result_margin` is a finite numeric value since `NaN`
        could appear via Spark. If the margin is infinite, that leads to invalid outputs.
        Lastly, the `.isUnique` ID check ensures no duplicate match rows, but reused
        fake IDs need monitoring.

        **Considering result consistency**


        I’m questioning whether inconsistencies arise when there’s no result and a
        winner isn''t used for toss or chase features. In cases where it''s false,
        like champions in a final, the no result check should catch it, but it ends
        up outputting none even if the winner is incorrectly filled. This seems acceptable
        since best data semantics suggest no result means no winner.


        I also need to address champion duplicates for the season, but PyDeequ limitations
        complicate implementing `.hasUniqueness([''season'', ''match_type''])`. Unfortunately,
        using `.isUnique` with a where parameter seems unsupported.'
