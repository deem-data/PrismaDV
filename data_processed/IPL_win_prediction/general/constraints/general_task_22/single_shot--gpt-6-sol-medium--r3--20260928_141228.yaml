constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", 'date_has_expected_format')
      - Valid
    assumptions: []
    column_name: date
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0)", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies("CAST(season AS STRING) RLIKE '^[0-9]{4}$'", 'season_is_four_digit_year')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'valid_super_over_indicator')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1,team2:
    code:
    - - .satisfies('team1 <> team2', 'teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IS NOT NULL AND toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR (winner IS NOT NULL AND winner
        IN (team1, team2))", 'played_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
