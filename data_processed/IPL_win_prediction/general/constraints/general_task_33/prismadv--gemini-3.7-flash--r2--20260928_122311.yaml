    - text: 'When ''result'' is equal to ''runs'', ''result_margin'' and ''target_overs''
        must not be null, and ''target_overs'' must be greater than 0 to allow division
        when calculating ''nrr_runs''. We could represent this assumption as a Deequ
        constraint like: .satisfies("result != ''runs'' OR (result_margin IS NOT NULL
        AND target_overs IS NOT NULL AND target_overs > 0)", "Valid result_margin
        and target_overs when result is runs")'
      sources:
      - start_line: 52
        end_line: 52
        file: ''
      uid: e98a8d29-474a-4e2f-bfeb-df5e65a68595
    - text: 'When ''result'' is equal to ''wickets'', ''result_margin'' must not be
        null to allow proper computation of ''nrr_wkts''. We could represent this
        assumption as a Deequ constraint like: .satisfies("result != ''wickets'' OR
        result_margin IS NOT NULL", "Valid result_margin when result is wickets")'
      sources:
      - start_line: 53
        end_line: 53
        file: ''
      uid: 44c42e11-4e43-4da7-943e-26bebd6a852c
  '["result","result_margin"]':
