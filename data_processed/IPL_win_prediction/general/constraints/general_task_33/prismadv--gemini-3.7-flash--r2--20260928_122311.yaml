    - text: 'When the ''result'' column is equal to ''runs'' or ''wickets'', the ''result_margin''
        column must not be null and should contain a valid numeric value, as it is
        used directly in calculating ''nrr_runs'' and ''nrr_wkts''. This can be expressed
        as a conditional constraint: when result in (''runs'', ''wickets''), result_margin
        is not null and result_margin > 0.'
