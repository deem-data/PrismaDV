        \ type=str, required=True)\n    parser.add_argument('--output', type=str,\
        \ required=True)\n    args = parser.parse_args()\n\n    in_path = os.path.join(args.input,\
        \ 'new_data.csv')\n    out_dir = args.output\n    os.makedirs(out_dir, exist_ok=True)\n\
        \n    df = pd.read_csv(in_path)\n\n    # Normalize dtypes used downstream\n\
        \    for col in ['result_margin', 'target_runs', 'target_overs']:\n      \
        \  if col in df.columns:\n            df[col] = pd.to_numeric(df[col], errors='coerce')\n\
        \    # Only league matches contribute to league table and seeding\n    league\
        \ = df[df['match_type'] == 'League'].copy()\n    # Expand matches to team-centric\
        \ rows\n    a = league.copy()\n    a['team'] = a['team1']\n    a['opponent']\
        \ = a['team2']\n\n    b = league.copy()\n    b['team'] = b['team2']\n    b['opponent']\
        \ = b['team1']\n\n    long = pd.concat([a, b], ignore_index=True, sort=False)\n\
        \n    # Points: 2 for winner (including super-over tie winner), 1 each for\
        \ no result\n    conds = [\n        long['result'].eq('no result'),\n    \
        \    long['team'].eq(long['winner'])\n    ]\n    choices = [1, 2]\n    long['points']\
        \ = np.select(conds, choices, default=0).astype(int)\n\n    long['win'] =\
        \ (long['team'] == long['winner']).astype(int)\n    long['loss'] = ((long['team']\
        \ != long['winner']) & long['result'].isin(['runs', 'wickets', 'tie'])).astype(int)\n\
        \    long['nr'] = long['result'].eq('no result').astype(int)\n\n    # Net\
        \ performance proxy used for seeding tie-break (uses D/L-adjusted overs when\
        \ present)\n    # Positive for winner, negative for loser; scaled for comparability\
        \ across contexts\n    sign = np.where(long['team'] == long['winner'], 1.0,\
        \ -1.0)\n    nrr_runs = np.where(long['result'].eq('runs'), sign * (long['result_margin']\
        \ / long['target_overs']), 0.0)\n    nrr_wkts = np.where(long['result'].eq('wickets'),\
        \ sign * (long['result_margin'] / 10.0), 0.0)\n    nrr_tie = np.where(long['result'].eq('tie'),\
        \ np.where(long['team'] == long['winner'], 0.02, -0.02), 0.0)\n    long['nrr_proxy_delta']\
        \ = nrr_runs + nrr_wkts + nrr_tie\n\n    # Track super-over wins/losses explicitly\
        \ for transparency and potential tie-breaks\n    long['so_win'] = ((long['result']\
        \ == 'tie') & (long['team'] == long['winner'])).astype(int)\n\n    # Aggregate\
        \ season/team\n    agg = long.groupby(['season', 'team'], as_index=False).agg(\n\
        \        points=('points', 'sum'),\n        won=('win', 'sum'),\n        lost=('loss',\
        \ 'sum'),\n        nr=('nr', 'sum'),\n        nrr_proxy=('nrr_proxy_delta',\
        \ 'sum'),\n        so_wins=('so_win', 'sum')\n    )\n    agg['played'] = agg['won']\
        \ + agg['lost'] + agg['nr']\n\n    # Order points table\n    points_table\
        \ = (\n        agg.sort_values(['season', 'points', 'nrr_proxy', 'won', 'so_wins',\
        \ 'team'],\n                        ascending=[True, False, False, False,\
        \ False, True])\n    )\n\n    # Seeding per season (top 4)\n    points_table['seed']\
        \ = points_table.groupby('season').cumcount() + 1\n    playoff_seeding = points_table[points_table['seed']\
        \ <= 4][['season', 'seed', 'team']]\n\n    points_out = os.path.join(out_dir,\
        \ 'league_points_table.csv')\n    seeding_out = os.path.join(out_dir, 'playoff_seeding.csv')\n\
        \n    points_cols = ['season', 'team', 'played', 'won', 'lost', 'nr', 'points',\
        \ 'nrr_proxy', 'so_wins']\n    points_table.to_csv(points_out, index=False,\
        \ columns=points_cols)\n    playoff_seeding.to_csv(seeding_out, index=False)\n\
        \n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on\
