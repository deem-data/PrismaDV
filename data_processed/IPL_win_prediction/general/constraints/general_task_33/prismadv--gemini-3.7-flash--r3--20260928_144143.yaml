prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["result","result_margin","target_overs"]':
    code: []
    assumptions:
    - text: 'When ''result'' equals ''runs'', both ''result_margin'' and ''target_overs''
        must not be null, and ''target_overs'' must be strictly greater than 0 to
        avoid division by zero or NaN values during NRR proxy calculation. We could
        represent this assumption as a deequ constraint like this: .satisfies("result
        != ''runs'' OR (result_margin IS NOT NULL AND target_overs IS NOT NULL AND
        target_overs > 0)", "result_runs_margin_and_target_overs_valid")'
      sources:
      - start_line: 52
        end_line: 55
        file: ''
      uid: 72408f62-744d-4c53-98da-0fbab18f070b
    - text: 'When ''result'' equals ''wickets'', ''result_margin'' must not be null
        and should be positive (and at most 10) to compute the wickets NRR contribution
        without NaN. We could represent this assumption as a deequ constraint like
        this: .satisfies("result != ''wickets'' OR (result_margin IS NOT NULL AND
        result_margin > 0 AND result_margin <= 10)", "result_wickets_margin_valid")'
      sources:
      - start_line: 53
        end_line: 55
        file: ''
      uid: 6c6d2ff2-fa9e-4640-bf45-b740b4d38ace
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column has a value of ''runs'' or ''wickets'', ''result_margin''
        should not be null and should be greater than 0, as it is used in calculations
        for run rate proxies. We could represent this assumption as a Deequ constraint:
        .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin IS NOT
        NULL AND result_margin > 0)", "Result margin must be present and positive
        when match result is runs or wickets")'
      sources:
      - start_line: 52
        end_line: 55
        file: ''
      uid: f28f0ad3-c53f-4f67-9779-6ac3f3b8ac5d
  '["result","winner"]':
    code:
    - suggestion: .satisfies("(`result` != 'no result' AND `winner` IS NOT NULL) OR
        (`result` = 'no result' AND `winner` IS NULL)", "Winner should be present
        if and only if result is not no result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bac1d6ea-0d87-4c83-aa06-504816b6fa41
      source_assumptions:
      - a02c9218-2a28-4687-9385-536a0884c20e
    assumptions:
    - text: 'When ''result'' is not ''no result'' (i.e., when ''result'' is ''runs'',
        ''wickets'', or ''tie''), ''winner'' must not be null. Conversely, when ''result''
        is ''no result'', ''winner'' should be null. We could represent this constraint
        in Deequ as: .satisfies(''(result != "no result" AND winner IS NOT NULL) OR
        (result = "no result" AND winner IS NULL)'', ''Winner should be present if
        and only if result is not no result'')'
      sources:
      - start_line: 38
        end_line: 48
        file: ''
      - start_line: 51
        end_line: 59
        file: ''
      uid: a02c9218-2a28-4687-9385-536a0884c20e
  '["target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'The columns ''target_runs'' and ''target_overs'' represent target match
        conditions and should have matching completeness (both null or both non-null),
        with ''target_overs'' being strictly greater than 0 whenever defined so that
        division operations (such as rate or proxy calculations) are valid. We could
        represent this as a constraint: .satisfies(''(target_runs IS NULL AND target_overs
        IS NULL) OR (target_runs IS NOT NULL AND target_overs > 0)'', ''target_runs_overs_consistency'')'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 52
        end_line: 55
        file: ''
      uid: 3644c2d3-4a4a-4955-a154-eb45ae05941d
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When ''winner'' is present / not null, ''winner'' must be equal to either
        ''team1'' or ''team2''. We could represent this constraint in Deequ as: .satisfies("winner
        IS NULL OR winner = team1 OR winner = team2", "Winner must be team1 or team2")'
      sources:
      - start_line: 27
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 55
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: d7c8c292-47f4-402f-8caf-1262782ddc43
    - text: '''team1'' and ''team2'' should not be equal in any record, as a team
        cannot play against itself. We could represent this constraint in Deequ as:
        .satisfies("team1 != team2", "team1 and team2 must be distinct")'
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      uid: b122813b-092b-4388-a741-d8917643a236
  '["team1","team2"]':
    code: []
    assumptions:
    - text: 'The columns ''team1'' and ''team2'' must not be identical for any record,
        as a team cannot play against itself. This can be expressed as a Deequ constraint:
        .satisfies(''team1 != team2'', ''team1_different_from_team2'')'
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      uid: 854da030-a7a3-4d30-92bf-64967f157873
  match_type:
    code:
    - suggestion: '.satisfies("`match_type` = ''League''", "Contains League matches",
        lambda x: x > 0)'
