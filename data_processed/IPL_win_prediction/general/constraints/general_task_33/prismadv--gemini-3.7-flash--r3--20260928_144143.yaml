    - text: 'The ''match_type'' column should contain the category ''League'', as
        the pipeline filters rows where ''match_type'' == ''League'' to construct
        team-level statistics, league points table, and playoff seedings. We could
        represent this assumption as a deequ constraint like this: .satisfies("CASE
