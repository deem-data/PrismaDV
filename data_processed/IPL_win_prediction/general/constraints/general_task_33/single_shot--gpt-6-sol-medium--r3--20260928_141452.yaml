constraints:
  match_type:
    code:
    - - .isComplete('match_type').isContainedIn('match_type', ['League', 'Elimination
        Final', 'Eliminator', 'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0)", 'decisive_margin_is_positive')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("result <> 'runs' OR (target_overs IS NOT NULL AND target_overs
        > 0)", 'run_result_has_positive_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2').satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner = team1 OR toss_winner =
        team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
        OR winner = team2))", 'decisive_result_has_participating_winner')
      - Valid
    assumptions: []
    column_name: winner
