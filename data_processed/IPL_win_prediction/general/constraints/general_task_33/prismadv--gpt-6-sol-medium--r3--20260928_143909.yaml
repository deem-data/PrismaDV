        THEN `target_overs` IS NOT NULL AND try_cast(`target_overs` AS DOUBLE) > 0
        AND try_cast(`target_overs` AS DOUBLE) <= 1.7976931348623157E308 ELSE TRUE
        END", "positive_finite_target_overs_for_league_run_results")
      validity: true
