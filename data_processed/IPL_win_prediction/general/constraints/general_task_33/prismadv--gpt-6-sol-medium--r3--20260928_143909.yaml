      source_assumptions:
      - 67e9dd13-a5a9-4b45-8319-d18e94a241d8
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND `result` IN
        (''runs'', ''wickets'', ''tie'') THEN `winner` IS NOT NULL AND (`winner` =
        `team1` OR `winner` = `team2`) ELSE TRUE END", "league_winner_is_participant",
        lambda x: x == 1)'
