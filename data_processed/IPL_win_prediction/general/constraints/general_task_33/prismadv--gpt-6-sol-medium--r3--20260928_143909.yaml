        end_line: 25
        file: ''
      - start_line: 38
        end_line: 58
        file: ''
      uid: f585223a-adac-420f-af42-779d7d12982f
    - text: For every input row where 'match_type' is 'League' and 'result' is 'no
        result', 'winner' should be null or unequal to both 'team1' and 'team2'. The
        code awards each team one point for a no-result match, but would also count
