      source_assumptions:
      - 17f8c24e-49b5-49f6-9bbf-554c5a6e61ee
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND `result` =
        ''no result'' THEN NOT (`winner` <=> `team1`) AND NOT (`winner` <=> `team2`)
        ELSE TRUE END", "no_result_has_no_participant_winner", lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3098935b-12b7-4b7f-b316-046d20759574
      source_assumptions:
      - c75a657e-ea38-4802-bf91-30c691ac2514
    assumptions:
    - text: The input must contain a 'team1' column. For rows where match_type is
        'League', team1 should be a non-null, non-empty team name. The code does not
        fill missing team names, and pandas groupby would omit rows with a missing
        team.
      sources:
      - start_line: 25
        end_line: 28
        file: ''
      - start_line: 60
        end_line: 68
        file: ''
      uid: 40cc918f-151e-4966-bdaf-a62a48a20632
    - text: For League matches, team1 and team2 should identify different teams. Each
        match is expanded into one row per team; identical names would count the same
        match twice for one team.
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      - start_line: 60
        end_line: 68
        file: ''
      uid: 67e9dd13-a5a9-4b45-8319-d18e94a241d8
    - text: For League matches with a result of 'runs', 'wickets', or 'tie', winner
        should equal either team1 or team2, using exactly the same spelling and formatting.
        Otherwise, comparisons against team1 can incorrectly assign wins, losses,
        points, and tie-break values.
      sources:
      - start_line: 28
        end_line: 46
        file: ''
      - start_line: 49
        end_line: 58
        file: ''
      uid: 17f8c24e-49b5-49f6-9bbf-554c5a6e61ee
    - text: For League matches with a result of 'no result', winner should not equal
        team1 or team2 (typically it should be null). Although points are awarded
        for no result, a matching winner would also be counted as a win.
      sources:
      - start_line: 37
        end_line: 47
        file: ''
      uid: c75a657e-ea38-4802-bf91-30c691ac2514
  team2:
    code:
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team2` IS
        NOT NULL AND typeof(`team2`) = ''string'' AND length(trim(`team2`)) > 0 ELSE
        TRUE END", "league_team2_present", lambda x: x == 1)'
      validity: true
