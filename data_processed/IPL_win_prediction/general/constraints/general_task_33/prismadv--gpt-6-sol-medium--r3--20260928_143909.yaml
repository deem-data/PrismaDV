  team1:
    code:
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team1` IS
        NOT NULL AND trim(`team1`) <> '''' ELSE TRUE END", "league_team1_present",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 102bc0b1-6ac1-4b12-bc74-fbc0b1abe623
      source_assumptions:
      - 40cc918f-151e-4966-bdaf-a62a48a20632
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team1` IS
        NOT NULL AND `team2` IS NOT NULL AND `team1` <> `team2` ELSE TRUE END", "league_teams_distinct",
