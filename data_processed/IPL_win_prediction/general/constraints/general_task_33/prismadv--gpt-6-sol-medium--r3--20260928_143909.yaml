    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND `result` IN
        (''runs'', ''wickets'', ''tie'') THEN CASE WHEN `winner` = `team1` OR `winner`
        = `team2` THEN TRUE ELSE FALSE END ELSE TRUE END", "league_winner_is_participant",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 54a235d7-7672-418f-ad68-0e1f656e703c
      source_assumptions:
      - 57baaad5-d9e1-478d-b9e2-acb13f0e0e93
    assumptions:
    - text: For rows where `match_type` is `League`, `team2` should be a non-null,
        non-empty string. The code uses it as a team identifier without filling missing
        values, then groups by team to build the points table.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 60
        end_line: 68
        file: ''
      uid: 0787ac24-7d1a-45b3-9468-a76bc6576b2e
    - text: For each League match, `team2` should differ from `team1`; otherwise,
        expanding the match into two team-centric rows would count the same team twice.
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      uid: a1fd078e-82f9-482f-ae0c-f28659b6a955
    - text: For League matches with a result of `runs`, `wickets`, or `tie`, `winner`
        should exactly match either `team1` or `team2`. In particular, a win by `team2`
        must use the same spelling in `winner`, because the code compares these values
        directly when assigning points, wins, losses, and tie-break metrics.
      sources:
      - start_line: 29
        end_line: 33
        file: ''
      - start_line: 38
        end_line: 58
        file: ''
      uid: 57baaad5-d9e1-478d-b9e2-acb13f0e0e93
  winner:
