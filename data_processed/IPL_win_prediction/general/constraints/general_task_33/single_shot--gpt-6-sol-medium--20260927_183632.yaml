constraints:
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (result_margin IS
        NOT NULL AND NOT isnan(result_margin) AND result_margin > 0)", 'league_run_margin_valid')
      - Valid
    - - .satisfies("match_type <> 'League' OR result <> 'wickets' OR (result_margin
        IS NOT NULL AND NOT isnan(result_margin) AND result_margin BETWEEN 1 AND 10)",
        'league_wicket_margin_valid')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'tie' OR super_over = 'Y'",
        'league_tie_has_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (target_overs IS
        NOT NULL AND NOT isnan(target_overs) AND target_overs > 0)", 'league_run_target_overs_valid')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR (winner IS NOT
        NULL AND (winner = team1 OR winner = team2))", 'league_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
