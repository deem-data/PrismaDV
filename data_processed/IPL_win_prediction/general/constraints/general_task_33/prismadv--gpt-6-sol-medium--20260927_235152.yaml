        end_line: 23
        file: ''
      - start_line: 52
        end_line: 53
        file: ''
      uid: c20459a7-049f-4e63-a57a-aef189cccf88
    - text: For rows where match_type is 'League' and result is 'runs' or 'wickets',
        result_margin should be present and convertible to a finite number. Missing
        or unparseable values would produce an invalid net-performance proxy used
        to rank teams. Values for other match types or results may be null because
        they do not contribute a margin-based proxy.
      sources:
