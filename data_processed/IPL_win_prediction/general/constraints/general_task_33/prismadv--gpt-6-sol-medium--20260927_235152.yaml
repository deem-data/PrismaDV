        file: ''
      uid: c1525603-529d-425d-9ff7-2dd8d583d041
    - text: For League matches decided by runs or wickets, result_margin should be
        a positive whole number. A wickets margin should be no greater than 10. These
        values represent counts of runs or wickets by which a team won and are used
        as unsigned magnitudes; the code supplies the winner/loser sign separately.
      sources:
