    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND `result` IN ('runs',
        'wickets', 'tie') THEN `winner` IS NOT NULL AND (`winner` = `team1` OR `winner`
        = `team2`) ELSE true END", 'league_winner_is_participant')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dfba955a-b6a6-40f1-9f34-099e4dd572e9
      source_assumptions:
      - 86b26790-76e4-4324-befa-53172b0f927f
    assumptions:
    - text: The input must contain a 'team2' column. The script reads it directly
        to create team and opponent rows for league matches.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      uid: defb1505-446c-4cf9-9d5c-e0487fbe5018
    - text: For rows where match_type is 'League', team2 should be a non-null, non-empty
        string. Missing or blank values would create invalid team identifiers in the
        season-level points table. The observed input has no null team2 values.
      sources:
      - start_line: 25
        end_line: 32
        file: ''
      - start_line: 61
        end_line: 79
        file: ''
      uid: d6598c35-340e-4cb8-9879-25fe0e1f33c8
    - text: For each league match, team2 should differ from team1; otherwise, the
        same team would be represented as both participants when the match is expanded
        into team-centric rows.
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      uid: 4d1d9586-7aee-445c-a14c-77eb3b8a86d3
    - text: For each league match whose result is 'runs', 'wickets', or 'tie', winner
        should equal either team1 or team2. In particular, when team2 is the winner,
        its value must match winner exactly so that its points, win count, and tie-break
        measures are assigned correctly.
      sources:
      - start_line: 32
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: 86b26790-76e4-4324-befa-53172b0f927f
  winner:
    code:
    - suggestion: '.hasCompleteness(''winner'', lambda x: x >= 0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: bb79d239-1175-499e-9011-32ccc17c7042
      source_assumptions:
