        AND NOT COALESCE(`winner` = `team2`, FALSE)) ELSE TRUE END", ''league_no_result_has_no_winning_team'',
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c9b24531-02e7-4276-b99a-558712af357e
      source_assumptions:
      - 28fbfabf-c9ad-42cd-8aee-86b073ecf10b
    assumptions:
    - text: The input data must contain a 'winner' column. The code compares it with
        team names without creating or renaming it first.
      sources:
      - start_line: 35
        end_line: 46
        file: ''
      uid: f52e66c6-d0fb-48e7-b30d-74aa4925227c
    - text: For every League match whose result is 'runs', 'wickets', or 'tie', 'winner'
        must be non-null and exactly equal to either 'team1' or 'team2'. This is required
        to award the win, loss, points, and performance adjustment to the correct
        teams. A tie resolved by a super over must likewise name its winning team.
      sources:
      - start_line: 25
        end_line: 25
        file: ''
      - start_line: 37
        end_line: 58
        file: ''
      uid: cd558496-4033-4910-a6f3-8d5c80968166
    - text: For a League match whose result is 'no result', 'winner' must not equal
        either 'team1' or 'team2'; it may be null. Otherwise, the code would record
        a win for one team even though it awards both teams no-result points.
      sources:
      - start_line: 37
        end_line: 47
        file: ''
      uid: 28fbfabf-c9ad-42cd-8aee-86b073ecf10b
