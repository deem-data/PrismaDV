        'wickets') THEN try_cast(`result_margin` AS DOUBLE) IS NOT NULL AND NOT isnan(try_cast(`result_margin`
        AS DOUBLE)) AND abs(try_cast(`result_margin` AS DOUBLE)) <= 1.7976931348623157E308
        ELSE TRUE END", "finite_margin_for_league_decisions")
