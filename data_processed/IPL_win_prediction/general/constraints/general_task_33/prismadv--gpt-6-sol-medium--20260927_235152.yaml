    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND `result` IN ('runs',
        'wickets') THEN try_cast(`result_margin` AS DOUBLE) > 0 AND try_cast(`result_margin`
        AS DOUBLE) = floor(try_cast(`result_margin` AS DOUBLE)) AND (`result` <> 'wickets'
        OR try_cast(`result_margin` AS DOUBLE) <= 10) ELSE TRUE END", "valid_league_result_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
