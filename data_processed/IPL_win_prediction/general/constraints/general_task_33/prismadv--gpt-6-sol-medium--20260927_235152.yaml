      reason_if_invalid: ''
      level: error
      uid: be5748c4-500b-467e-b5e6-b64506000b6e
      source_assumptions:
      - 4afbb031-e7d5-49e7-8459-8e6fd8187b27
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND `result` IN ('runs',
        'wickets', 'tie') THEN `winner` IS NOT NULL AND `team1` IS NOT NULL AND `team2`
        IS NOT NULL AND ((`winner` = `team1` AND `winner` <> `team2`) OR (`winner`
        = `team2` AND `winner` <> `team1`)) ELSE TRUE END", "league_winner_is_exactly_one_participant")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 78cfdee0-73b6-4822-b3b7-5e03ce622594
      source_assumptions:
      - 504a12b5-2977-4877-9052-1890fbdb6a33
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND `result` = 'no
        result' THEN `winner` IS NULL ELSE TRUE END", "league_no_result_has_no_winner")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b8fc8e2f-8f75-4110-b5fb-a2f3e3177287
      source_assumptions:
      - 8ca61bde-7c2f-417f-8080-e52b237b6046
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' THEN `result` IS NOT
        NULL AND `result` IN ('runs', 'wickets', 'tie', 'no result') ELSE TRUE END",
        "league_result_is_supported")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7b8ea660-5405-42de-9544-5c085e87524a
      source_assumptions:
      - 7e718db5-aec9-4aac-94b9-0857a706a703
    assumptions:
    - text: For every League match, team1 and team2 must be different teams. Otherwise,
        expanding the match into two team-centric rows would count one team twice.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      uid: 4afbb031-e7d5-49e7-8459-8e6fd8187b27
    - text: For every League match whose result is runs, wickets, or tie, winner must
        equal exactly one of team1 or team2. This ensures that one participant receives
        the win and the other receives the loss; it also identifies the super-over
        winner for ties.
      sources:
      - start_line: 38
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: 504a12b5-2977-4877-9052-1890fbdb6a33
    - text: For every League match whose result is no result, winner should be null.
        Otherwise, the code could record a win while awarding both participants one
        point for a no-result match.
      sources:
      - start_line: 38
        end_line: 47
        file: ''
      uid: 8ca61bde-7c2f-417f-8080-e52b237b6046
    - text: For every League match, result must be one of runs, wickets, tie, or no
        result. Any other result would be included in the season/team aggregation
        but would not be counted as a win, loss, or no result.
      sources:
      - start_line: 25
        end_line: 25
        file: ''
      - start_line: 38
        end_line: 47
        file: ''
      - start_line: 61
        end_line: 69
        file: ''
      uid: 7e718db5-aec9-4aac-94b9-0857a706a703
    - text: Each season represented by League matches should have at least four distinct
        participating teams across team1 and team2, so the top-four seeding step can
        produce four seeds for that season.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      - start_line: 61
        end_line: 61
        file: ''
      - start_line: 78
        end_line: 79
        file: ''
      uid: e34bd0b1-1f81-45dd-bd35-2709649248c0
  '["result","result_margin","target_overs"]':
    code:
