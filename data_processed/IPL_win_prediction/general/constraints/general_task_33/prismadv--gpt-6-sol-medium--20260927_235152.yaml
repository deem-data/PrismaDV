  team1:
    code:
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team1` IS
        NOT NULL AND length(trim(`team1`)) > 0 ELSE TRUE END", "league_team1_present_and_nonempty",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5fd528ee-5dc4-4b66-881e-3cd0f52de3e5
      source_assumptions:
      - dff4a2a6-1998-4f94-84c6-822b62a4d4cf
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team1` IS
        NOT NULL AND `team2` IS NOT NULL AND `team1` <> `team2` ELSE TRUE END", "league_teams_are_different",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7f30b826-27c7-4231-8b49-75c52fef9a6f
      source_assumptions:
      - 4be44d46-5351-4731-a7eb-3a081bb84470
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND `result` IN
        (''runs'', ''wickets'', ''tie'') THEN `winner` IS NOT NULL AND (`winner` =
        `team1` OR `winner` = `team2`) ELSE TRUE END", "decisive_league_winner_is_participant",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f02be2cf-bfc9-4208-8672-e7f9da3a7e77
      source_assumptions:
      - 34cf4432-efc1-4ad3-aafe-3b6e8e8662eb
    assumptions:
    - text: The input must contain a `team1` column. Every row with `match_type` equal
        to `League` should have a non-null, non-empty string in `team1`; otherwise
        that team may be omitted from the season/team aggregation or appear under
        an invalid name.
      sources:
      - start_line: 25
        end_line: 28
        file: ''
      - start_line: 60
        end_line: 61
        file: ''
      uid: dff4a2a6-1998-4f94-84c6-822b62a4d4cf
    - text: In each League row, `team1` and `team2` should identify different teams.
        The code treats them as the two participants in a match, so equal values would
        attribute the match to the same team twice.
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      - start_line: 60
        end_line: 68
        file: ''
      uid: 4be44d46-5351-4731-a7eb-3a081bb84470
    - text: 'For League rows with a decisive `result` (`runs`, `wickets`, or `tie`),
        team names must use consistent, exact-match spelling: `winner` should equal
        either `team1` or `team2`. A winning `team1` that differs from `winner` in
        spelling, case, or whitespace would be scored as a loss.'
      sources:
      - start_line: 40
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: 34cf4432-efc1-4ad3-aafe-3b6e8e8662eb
    - text: Within a season, the same team should always have the same exact name
        in `team1` (and when it appears in `team2`). Otherwise, grouping by season
        and team will split its points and seeding across multiple names.
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      - start_line: 60
        end_line: 61
        file: ''
      - start_line: 72
        end_line: 79
        file: ''
      uid: 381da8b2-543f-4a91-ad7e-aa04add120d9
