constraints:
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - '.satisfies("match_type = ''League''", ''has_league_matches'', lambda x: x
        > 0)'
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - '.satisfies("match_type <> ''League'' OR result IN (''runs'', ''wickets'',
        ''tie'', ''no result'')", ''valid_league_result'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("match_type <> ''League'' OR result NOT IN (''runs'', ''wickets'')
        OR (result_margin IS NOT NULL AND result_margin > 0)", ''decisive_league_match_has_positive_margin'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - '.satisfies("match_type <> ''League'' OR result <> ''runs'' OR (target_overs
        IS NOT NULL AND target_overs > 0)", ''runs_result_has_positive_target_overs'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - '.satisfies("match_type <> ''League'' OR team1 <> team2", ''league_matches_have_distinct_teams'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - '.satisfies("match_type <> ''League'' OR result = ''no result'' OR (winner
        IS NOT NULL AND winner IN (team1, team2))", ''decisive_league_match_has_participating_winner'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: winner
