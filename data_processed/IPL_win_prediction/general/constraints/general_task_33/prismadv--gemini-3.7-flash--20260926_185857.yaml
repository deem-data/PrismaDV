constraints:
  '["result","result_margin","target_overs"]':
    code: []
    assumptions:
    - text: 'When ''result'' is equal to ''runs'', both ''result_margin'' and ''target_overs''
        must be non-null, and ''target_overs'' must be greater than 0 to calculate
        the net run rate proxy (result_margin / target_overs) without division by
        zero or generating NaN values. We could represent this assumption as a deequ
        constraint like this:

        .satisfies("result != ''runs'' OR (result_margin IS NOT NULL AND target_overs
        IS NOT NULL AND target_overs > 0)", "RunsResultMarginAndTargetOversCheck")'
      sources:
      - start_line: 52
        end_line: 55
        file: ''
      uid: b9f038c9-4553-4d37-bc11-4e0b67ed8fcb
    - text: 'When ''result'' is equal to ''wickets'', ''result_margin'' should be
        non-null and non-negative to compute the net performance proxy (result_margin
        / 10.0). We could represent this assumption as a deequ constraint like this:

        .satisfies("result != ''wickets'' OR (result_margin IS NOT NULL AND result_margin
        >= 0)", "WicketsResultMarginCheck")'
      sources:
      - start_line: 53
        end_line: 55
        file: ''
      uid: d9adac32-0029-40c8-abc5-1e0dc22f7ea1
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        not be null, as it is directly used in arithmetic calculations to compute
        the net run rate proxy (''nrr_proxy_delta''). We could represent this assumption
        as a Deequ constraint like: .satisfies("CASE WHEN result IN (''runs'', ''wickets'')
        THEN result_margin IS NOT NULL ELSE TRUE END", "result_margin_not_null_when_runs_or_wickets")'
      sources:
      - start_line: 51
        end_line: 55
        file: ''
      uid: b2ceb926-5c64-40b4-bd1f-48d84af080b0
  '["result","team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When a match has a winner (i.e. ''winner'' is not null or ''result''
        is not ''no result''), the ''winner'' column must match either ''team1'' or
        ''team2''. This ensures the winning team is one of the participating teams
        in the match. In Deequ, this can be expressed as: .satisfies("winner IS NULL
        OR winner = team1 OR winner = team2", "Winner must be team1 or team2")'
      sources:
      - start_line: 27
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: a96e8007-6291-44f1-a8a1-79a78be8eb9f
    - text: 'The ''team1'' and ''team2'' columns should not be equal for any match
        record (a team cannot play against itself). In Deequ, this can be expressed
        as: .satisfies("team1 != team2", "team1 and team2 should be distinct")'
      sources:
      - start_line: 27
        end_line: 35
        file: ''
      uid: 05453145-221f-4dc3-b2e5-634d6cf6f416
    - text: 'If ''result'' is ''no result'', ''winner'' should be null, whereas if
        ''result'' is in (''runs'', ''wickets'', ''tie''), ''winner'' should be non-null.
        In Deequ, this can be expressed as: .satisfies("(result = ''no result'' AND
        winner IS NULL) OR (result IN (''runs'', ''wickets'', ''tie'') AND winner
        IS NOT NULL)", "Result and winner consistency")'
      sources:
      - start_line: 38
        end_line: 48
        file: ''
      uid: e131fc45-6482-4458-a46e-28b954fd4864
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' indicates a completed match (i.e., ''result'' is ''runs'',
        ''wickets'', or ''tie''), the ''winner'' column must not be null. Conversely,
        when ''result'' is ''no result'', ''winner'' is expected to be null. We could
        represent this assumption as a Deequ constraint like this: .satisfies("(result
        IN (''runs'', ''wickets'', ''tie'') AND winner IS NOT NULL) OR (result = ''no
        result'' AND winner IS NULL)", "Winner completeness depends on result")'
      sources:
      - start_line: 38
        end_line: 48
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: e5aa7162-12d9-454f-90b2-0bdc589cfb55
