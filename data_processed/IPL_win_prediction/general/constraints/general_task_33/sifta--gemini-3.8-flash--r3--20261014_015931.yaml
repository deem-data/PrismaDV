    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. For example, unhandled groupby keys, join keys, and critical\
      \ identifiers assume completeness and expected data types. Note that defensive\
      \ coding patterns like `pd.to_numeric(..., errors='coerce')`, `pd.to_datetime(...,\
