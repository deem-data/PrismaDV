      \ aggregations, invalid groupings, wrong labels/predictions, dropped records,\
      \ or corrupt NaNs/NaTs in exported columns).\n- Set level \"warning\" if the\
      \ code truly tolerates the variation without downstream harm, or for columns\
      \ parsed but not used in final task outputs.\n- Remember: a single failing \"\
