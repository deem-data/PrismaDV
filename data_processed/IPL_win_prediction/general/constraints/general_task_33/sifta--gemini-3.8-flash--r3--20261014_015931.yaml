      \ an overly strict error-level check causes false alarms on safe partitions.\n\
      \nValidity & Precision Rules:\n1. Completeness Checks:\n   - Use `.isComplete(column)`\
      \ at level \"error\" ONLY if the column is an essential non-nullable key (e.g.\
