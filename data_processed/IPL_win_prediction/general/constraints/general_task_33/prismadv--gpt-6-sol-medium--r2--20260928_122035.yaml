    assumptions:
    - text: For every League match, 'team1' and 'team2' should identify different
        teams. Otherwise, expanding the match into two team-centric rows would count
        one team twice. This can be checked with a conditional constraint requiring
        team1 != team2 when match_type = 'League'.
      sources:
      - start_line: 25
        end_line: 35
        file: ''
      uid: ce223e64-1c1f-496f-9a5b-2c6288af3bcf
    - text: For every League match whose 'result' is 'runs', 'wickets', or 'tie',
        'winner' should be non-null and equal to exactly one of 'team1' or 'team2'.
        The code awards points and records a win and loss by comparing each participant
        with 'winner', including for super-over ties.
      sources:
      - start_line: 28
        end_line: 46
        file: ''
      - start_line: 51
        end_line: 58
        file: ''
      uid: a7bc03af-5014-4ed7-8e84-557efcdea5d7
    - text: For every League match whose 'result' is 'no result', 'winner' should
        be null. This prevents the code from recording a win for either team while
        awarding both teams one point for the no-result match.
      sources:
      - start_line: 38
        end_line: 47
        file: ''
      uid: 53a08795-9783-46c5-b6aa-c4bbc91817bc
