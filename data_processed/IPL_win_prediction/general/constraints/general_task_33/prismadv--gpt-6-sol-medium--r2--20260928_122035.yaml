        This can be checked with a conditional constraint such as `.satisfies("match_type
        <> 'League' OR result <> 'runs' OR (target_overs IS NOT NULL AND target_overs
        > 0)", "valid_target_overs_for_run_results")` after numeric conversion.
      sources:
      - start_line: 21
        end_line: 25
        file: ''
      - start_line: 49
        end_line: 55
        file: ''
      - start_line: 72
        end_line: 74
        file: ''
      uid: d0969b51-2de1-4594-aa7d-6a4cc32e5794
