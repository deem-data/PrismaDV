    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`match_type` IS NULL OR `match_type` <> 'League' OR
        ((`result` IN ('runs', 'wickets') AND `result_margin` IS NOT NULL) OR (`result`
        IN ('tie', 'no result') AND `result_margin` IS NULL))", "league_result_margin_presence")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3a6d11c5-c72f-4df4-8795-6d60966af851
      source_assumptions:
      - 6f6c50e0-9cb7-48cf-ae85-ffe0b70b386e
    - suggestion: .satisfies("`match_type` IS NULL OR `match_type` <> 'League' OR
        `result` NOT IN ('runs', 'wickets') OR (`result_margin` > 0 AND `result_margin`
        = FLOOR(`result_margin`) AND (`result` <> 'wickets' OR `result_margin` <=
        10))", "league_result_margin_valid_count")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: db82a531-c936-48ba-b707-5e2a2363c392
      source_assumptions:
      - 1fc22aff-269e-4cd0-9053-333411d3b798
    assumptions:
    - text: 'For league matches, ''result_margin'' should be present when ''result''
        is ''runs'' or ''wickets'', and null when ''result'' is ''tie'' or ''no result''.
        The observed six null margins correspond to the five ties and one no-result
        match. A row-level constraint could require: (result IN (''runs'', ''wickets'')
        AND result_margin IS NOT NULL) OR (result IN (''tie'', ''no result'') AND
        result_margin IS NULL).'
      sources:
      - start_line: 25
        end_line: 25
        file: ''
      - start_line: 52
        end_line: 54
        file: ''
      uid: 6f6c50e0-9cb7-48cf-ae85-ffe0b70b386e
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be a positive, whole-number count; for a wickets result, it should also be
        at most 10. These values are used directly to calculate the seeding tie-break
        proxy. A row-level constraint could require: result NOT IN (''runs'', ''wickets'')
        OR (result_margin > 0 AND result_margin = FLOOR(result_margin) AND (result
        != ''wickets'' OR result_margin <= 10)).'
      sources:
      - start_line: 52
        end_line: 55
        file: ''
      - start_line: 72
        end_line: 79
        file: ''
      uid: 1fc22aff-269e-4cd0-9053-333411d3b798
  '["result","target_overs"]':
