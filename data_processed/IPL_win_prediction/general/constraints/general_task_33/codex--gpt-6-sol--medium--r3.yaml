      column_name: match_type
    result:
      code:
      - - .satisfies("match_type != 'League' OR result IN ('runs', 'wickets', 'tie',
          'no result')", 'league_result_type')
        - Valid
      - - .satisfies("match_type != 'League' OR result IS NOT NULL", 'league_result_present')
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("match_type != 'League' OR result != 'wickets' OR result_margin
          <= 10", 'wicket_margin_at_most_ten')
        - Valid
      - - .satisfies("match_type != 'League' OR result NOT IN ('runs', 'wickets')
          OR (result_margin IS NOT NULL AND result_margin > 0)", 'decisive_margin')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .satisfies("match_type != 'League' OR season IS NOT NULL", 'league_season_present')
        - Valid
      assumptions: []
      column_name: season
    target_overs:
      code:
      - - .satisfies("match_type != 'League' OR result != 'runs' OR (target_overs
          IS NOT NULL AND target_overs > 0 AND target_overs <= 20)", 'run_result_overs')
        - Valid
      assumptions: []
      column_name: target_overs
    team1:
      code:
      - - .satisfies("match_type != 'League' OR team1 IS NOT NULL", 'league_team1_present')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .satisfies("match_type != 'League' OR team1 != team2", 'different_league_teams')
        - Valid
      - - .satisfies("match_type != 'League' OR team2 IS NOT NULL", 'league_team2_present')
        - Valid
      assumptions: []
      column_name: team2
    winner:
      code:
      - - .satisfies("match_type != 'League' OR result != 'no result' OR winner IS
          NULL", 'no_winner_for_no_result')
        - Valid
      - - .satisfies("match_type != 'League' OR result = 'no result' OR (winner IS
          NOT NULL AND (winner = team1 OR winner = team2))", 'valid_decisive_winner')
        - Valid
      assumptions: []
      column_name: winner
