        'no result')", 'league_result_valid')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets') OR
        result_margin >= 0", 'decided_match_margin_nonnegative')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR target_overs > 0",
        'runs_result_target_overs_positive')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'league_teams_distinct')
      - Valid
    - - .satisfies("match_type <> 'League' OR team1 IS NOT NULL", 'league_team1_present')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .satisfies("match_type <> 'League' OR team2 IS NOT NULL", 'league_team2_present')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets', 'tie')
        OR winner IN (team1, team2)", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
