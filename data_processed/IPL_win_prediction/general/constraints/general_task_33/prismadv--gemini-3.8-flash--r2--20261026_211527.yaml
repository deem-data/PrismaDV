      reason_if_invalid: ''
      level: warning
      uid: bec819e7-9a25-4bb2-bca0-13f08135e7d4
      source_assumptions:
      - 9af86a20-cea4-4b02-a408-f20027fa6aa7
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' must not
        be null and must be greater than 0, because it is directly divided to compute
        ''nrr_proxy_delta''. Any null values when matches are decided by runs or wickets
        would result in NaN values propagating into team aggregations, affecting sorting
        and playoff seeding. We could represent this assumption as a Deequ constraint
        like this: .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin
        IS NOT NULL AND result_margin > 0)", "ResultMarginValidWhenWonByRunsOrWickets")'
      sources:
      - start_line: 52
        end_line: 55
        file: ''
      uid: fdab36e3-58f4-47fc-aa0f-e5902d2ea3f8
    - text: 'When ''result'' is ''wickets'', ''result_margin'' represents the remaining
        wickets of the winning team and must fall within the range [1, 10], as it
        is scaled by dividing by 10.0 to compute net run rate. We could represent
        this assumption as a Deequ constraint like this: .satisfies("result != ''wickets''
        OR (result_margin >= 1 AND result_margin <= 10)", "WicketsMarginInRange")'
      sources:
      - start_line: 53
        end_line: 55
        file: ''
      uid: 9af86a20-cea4-4b02-a408-f20027fa6aa7
  '["result","winner"]':
