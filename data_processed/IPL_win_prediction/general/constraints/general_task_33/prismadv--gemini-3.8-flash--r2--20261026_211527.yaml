constraints:
  '["result","result_margin","target_overs"]':
    code:
    - suggestion: .satisfies("result != 'runs' OR (result_margin IS NOT NULL AND target_overs
        IS NOT NULL AND target_overs > 0)", "Result runs requires non-null margin
        and positive target overs")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4f3c6863-958a-4670-9605-050d122daea0
      source_assumptions:
      - 5a38c772-3aad-4395-87f3-477468825f7f
    - suggestion: .satisfies("result != 'wickets' OR result_margin IS NOT NULL", "Result
        wickets requires non-null result_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f4f380a5-8b9c-4f0a-8562-ee3e5bf8b739
      source_assumptions:
      - 8bdba074-c4dc-474a-97b9-29f132a98c7b
    assumptions:
    - text: 'When ''result'' is ''runs'', both ''result_margin'' and ''target_overs''
        must be non-null, and ''target_overs'' must be strictly greater than 0 to
        allow the calculation of (result_margin / target_overs) without producing
        nulls or division by zero. This can be expressed as a Deequ constraint: .satisfies("result
        != ''runs'' OR (result_margin IS NOT NULL AND target_overs IS NOT NULL AND
        target_overs > 0)", "Result runs requires non-null margin and positive target
        overs")'
      sources:
      - start_line: 52
        end_line: 52
        file: ''
      uid: 5a38c772-3aad-4395-87f3-477468825f7f
    - text: 'When ''result'' is ''wickets'', ''result_margin'' must be non-null to
        compute the net run rate proxy delta (result_margin / 10.0). This can be expressed
        as a Deequ constraint: .satisfies("result != ''wickets'' OR result_margin
        IS NOT NULL", "Result wickets requires non-null result_margin")'
      sources:
      - start_line: 53
        end_line: 53
        file: ''
      uid: 8bdba074-c4dc-474a-97b9-29f132a98c7b
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0)", "ResultMarginValidWhenWonByRunsOrWickets")
