prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    in_path = os.path.join(args.input, 'new_data.csv')\n    out_dir = args.output\n\
  \    os.makedirs(out_dir, exist_ok=True)\n\n    df = pd.read_csv(in_path)\n\n  \
  \  # Normalize dtypes used downstream\n    for col in ['result_margin', 'target_runs',\
  \ 'target_overs']:\n        if col in df.columns:\n            df[col] = pd.to_numeric(df[col],\
  \ errors='coerce')\n    # Only league matches contribute to league table and seeding\n\
  \    league = df[df['match_type'] == 'League'].copy()\n    # Expand matches to team-centric\
  \ rows\n    a = league.copy()\n    a['team'] = a['team1']\n    a['opponent'] = a['team2']\n\
  \n    b = league.copy()\n    b['team'] = b['team2']\n    b['opponent'] = b['team1']\n\
  \n    long = pd.concat([a, b], ignore_index=True, sort=False)\n\n    # Points: 2\
  \ for winner (including super-over tie winner), 1 each for no result\n    conds\
  \ = [\n        long['result'].eq('no result'),\n        long['team'].eq(long['winner'])\n\
  \    ]\n    choices = [1, 2]\n    long['points'] = np.select(conds, choices, default=0).astype(int)\n\
  \n    long['win'] = (long['team'] == long['winner']).astype(int)\n    long['loss']\
  \ = ((long['team'] != long['winner']) & long['result'].isin(['runs', 'wickets',\
  \ 'tie'])).astype(int)\n    long['nr'] = long['result'].eq('no result').astype(int)\n\
  \n    # Net performance proxy used for seeding tie-break (uses D/L-adjusted overs\
  \ when present)\n    # Positive for winner, negative for loser; scaled for comparability\
  \ across contexts\n    sign = np.where(long['team'] == long['winner'], 1.0, -1.0)\n\
  \    nrr_runs = np.where(long['result'].eq('runs'), sign * (long['result_margin']\
  \ / long['target_overs']), 0.0)\n    nrr_wkts = np.where(long['result'].eq('wickets'),\
  \ sign * (long['result_margin'] / 10.0), 0.0)\n    nrr_tie = np.where(long['result'].eq('tie'),\
  \ np.where(long['team'] == long['winner'], 0.02, -0.02), 0.0)\n    long['nrr_proxy_delta']\
  \ = nrr_runs + nrr_wkts + nrr_tie\n\n    # Track super-over wins/losses explicitly\
  \ for transparency and potential tie-breaks\n    long['so_win'] = ((long['result']\
  \ == 'tie') & (long['team'] == long['winner'])).astype(int)\n\n    # Aggregate season/team\n\
  \    agg = long.groupby(['season', 'team'], as_index=False).agg(\n        points=('points',\
  \ 'sum'),\n        won=('win', 'sum'),\n        lost=('loss', 'sum'),\n        nr=('nr',\
  \ 'sum'),\n        nrr_proxy=('nrr_proxy_delta', 'sum'),\n        so_wins=('so_win',\
  \ 'sum')\n    )\n    agg['played'] = agg['won'] + agg['lost'] + agg['nr']\n\n  \
  \  # Order points table\n    points_table = (\n        agg.sort_values(['season',\
  \ 'points', 'nrr_proxy', 'won', 'so_wins', 'team'],\n                        ascending=[True,\
  \ False, False, False, False, True])\n    )\n\n    # Seeding per season (top 4)\n\
  \    points_table['seed'] = points_table.groupby('season').cumcount() + 1\n    playoff_seeding\
  \ = points_table[points_table['seed'] <= 4][['season', 'seed', 'team']]\n\n    points_out\
  \ = os.path.join(out_dir, 'league_points_table.csv')\n    seeding_out = os.path.join(out_dir,\
  \ 'playoff_seeding.csv')\n\n    points_cols = ['season', 'team', 'played', 'won',\
  \ 'lost', 'nr', 'points', 'nrr_proxy', 'so_wins']\n    points_table.to_csv(points_out,\
  \ index=False, columns=points_cols)\n    playoff_seeding.to_csv(seeding_out, index=False)\n\
  \n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on disk\
  \ at `./code/general_task_33.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 260,\
  \ 'season': 2017, 'city': 'Bengaluru', 'date': '2017-04-08', 'match_type': 'League',\
  \ 'player_of_match': 'KM Jadhav', 'venue': 'M.Chinnaswamy Stadium', 'team1': 'Royal\
  \ Challengers Bangalore', 'team2': 'Delhi Daredevils', 'toss_winner': 'Royal Challengers\
  \ Bangalore', 'toss_decision': 'bat', 'winner': 'Royal Challengers Bangalore', 'result':\
  \ 'runs', 'result_margin': 15.0, 'target_runs': 158.0, 'target_overs': 20.0, 'super_over':\
  \ 'N', 'method': nan, 'umpire1': 'S Ravi', 'umpire2': 'VK Sharma'}, {'id': 341,\
  \ 'season': 2012, 'city': 'Bangalore', 'date': '2012-04-15', 'match_type': 'League',\
  \ 'player_of_match': 'AM Rahane', 'venue': 'M Chinnaswamy Stadium', 'team1': 'Royal\
  \ Challengers Bangalore', 'team2': 'Rajasthan Royals', 'toss_winner': 'Rajasthan\
  \ Royals', 'toss_decision': 'bat', 'winner': 'Rajasthan Royals', 'result': 'runs',\
  \ 'result_margin': 59.0, 'target_runs': 196.0, 'target_overs': 20.0, 'super_over':\
  \ 'N', 'method': nan, 'umpire1': 'JD Cloete', 'umpire2': 'RJ Tucker'}, {'id': 47,\
  \ 'season': 2024, 'city': 'Ahmedabad', 'date': '2024-03-24', 'match_type': 'League',\
  \ 'player_of_match': 'B Sai Sudharsan', 'venue': 'Narendra Modi Stadium, Ahmedabad',\
  \ 'team1': 'Gujarat Titans', 'team2': 'Mumbai Indians', 'toss_winner': 'Mumbai Indians',\
  \ 'toss_decision': 'field', 'winner': 'Gujarat Titans', 'result': 'runs', 'result_margin':\
  \ 6.0, 'target_runs': 169.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'VA Kulkarni', 'umpire2': 'VK Sharma'}]\n\nThe full table is on\
  \ disk at `./data/tables/observed_data.csv`. You have complete access to it:\nload\
  \ it with pandas, profile it, plot it, run whatever analysis helps. It is a\nthrowaway\
  \ copy -- nothing you do to it has any effect outside this workspace.\n\n# Verifying\
  \ your constraints\n\nYou can execute PyDeequ constraint code against the staged\
  \ table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ containing the union of what you\nsettled on for every column:\n\n{\n    \"constraints\"\
  : [\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
