constraints:
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - '.satisfies("match_type = ''League''", ''has_league_matches'', lambda x: x
        > 0)'
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets') OR
        (result_margin IS NOT NULL AND result_margin > 0)", 'decisive_league_match_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (target_overs IS
        NOT NULL AND target_overs > 0)", 'runs_result_has_positive_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'distinct_league_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR (winner IS NOT
        NULL AND (winner = team1 OR winner = team2))", 'league_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
