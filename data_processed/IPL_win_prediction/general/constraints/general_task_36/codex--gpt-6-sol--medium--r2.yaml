        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isComplete('super_over')
        - Valid
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      - - .satisfies("`super_over` <> 'Y' OR `result` = 'tie'", 'super_over_only_for_ties')
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("`method` <> 'D/L' OR `method` IS NULL OR (try_cast(`target_overs`
          AS DOUBLE) IS NOT NULL AND try_cast(`target_overs` AS DOUBLE) > 0 AND try_cast(`target_overs`
          AS DOUBLE) <= 20)", 'dl_has_valid_target_overs')
        - Valid
      assumptions: []
      column_name: target_overs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies("`team1` <> `team2`", 'distinct_opponents')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isComplete('toss_decision')
        - Valid
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .isComplete('toss_winner')
        - Valid
      - - .satisfies("`toss_winner` = `team1` OR `toss_winner` = `team2`", 'toss_winner_is_opponent')
        - Valid
      assumptions: []
      column_name: toss_winner
    venue:
      code:
      - - .isComplete('venue')
        - Valid
      assumptions: []
      column_name: venue
    winner:
      code:
      - - .satisfies("`result` NOT IN ('no result', 'tie') OR (`result` = 'tie' AND
          `super_over` = 'Y') OR `winner` IS NULL OR `winner` IN ('NullValue', 'null',
          'NULL', 'None', '')", 'unresolved_match_has_no_winner')
        - Valid
      - - .satisfies("`result` NOT IN ('runs', 'wickets') AND NOT (`result` = 'tie'
          AND `super_over` = 'Y') OR (`winner` IS NOT NULL AND `winner` NOT IN ('NullValue',
          'null', 'NULL', 'None', ''))", 'decided_match_has_winner')
        - Valid
      - - .satisfies("`winner` IS NULL OR `winner` IN ('NullValue', 'null', 'NULL',
          'None', '') OR `winner` = `team1` OR `winner` = `team2`", 'winner_is_opponent')
        - Valid
      assumptions: []
      column_name: winner
