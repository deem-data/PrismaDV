prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef ensure_dir(path: str):\n\
  \    os.makedirs(path, exist_ok=True)\n\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\nensure_dir(args.output)\n\ndf = pd.read_csv(input_csv)\n\n# Normalize\
  \ common null-like values\nfor col in ['method', 'winner']:\n    if col in df.columns:\n\
  \        df[col] = df[col].replace({'NullValue': np.nan, 'null': np.nan, 'NULL':\
  \ np.nan, 'None': np.nan, '': np.nan})\n\n# Types for numeric columns used downstream\n\
  if 'result_margin' in df.columns:\n    df['result_margin'] = pd.to_numeric(df['result_margin'],\
  \ errors='coerce')\nif 'target_overs' in df.columns:\n    df['target_overs'] = pd.to_numeric(df['target_overs'],\
  \ errors='coerce')\n\n# Precompute frequently used columns\nresults = df['result'].astype(str)\n\
  super_over = df['super_over'].astype(str)\n# Derive batting first and chasing team\
  \ from toss decision\nopp_of_toss = np.where(df['toss_winner'] == df['team1'], df['team2'],\
  \ df['team1'])\nbatting_first = np.where(df['toss_decision'] == 'bat', df['toss_winner'],\
  \ opp_of_toss)\nchasing_team = np.where(df['toss_winner'] == batting_first, opp_of_toss,\
  \ df['toss_winner'])\n\ndf['batting_first'] = batting_first\ndf['chasing_team']\
  \ = chasing_team\n# Guard: D/L method impacts effective overs used in downstream\
  \ artifacts\n# Effective overs for display/analytics\ndf['effective_overs'] = np.where(df['method']\
  \ == 'D/L', df['target_overs'], 20.0)\n# Compose human-readable win-by description\n\
  win_by_text = []\nfor idx, row in df.iterrows():\n    r = row['result']\n    if\
  \ r == 'runs':\n        margin = int(row['result_margin'])\n        win_by_text.append(f\"\
  {margin} runs\")\n    elif r == 'wickets':\n        margin = int(row['result_margin'])\n\
  \        win_by_text.append(f\"{margin} wickets\")\n    elif r == 'tie':\n     \
  \   if row['super_over'] == 'Y':\n            win_by_text.append('Super Over')\n\
  \        else:\n            win_by_text.append('Tie')\n    elif r == 'no result':\n\
  \        win_by_text.append('No Result')\n    else:\n        win_by_text.append('Unknown')\n\
  \ndf['win_by'] = win_by_text\n\n# Prepare accumulator for points table\nteams =\
  \ pd.unique(pd.concat([df['team1'], df['team2']])).tolist()\n\npoints = {t: {\n\
  \    'team': t,\n    'matches': 0,\n    'wins': 0,\n    'losses': 0,\n    'ties':\
  \ 0,\n    'no_results': 0,\n    'super_over_wins': 0,\n    'points': 0,\n    'net_run_margin':\
  \ 0,  # + for winner by runs, - for loser by runs\n    'net_wicket_margin': 0  #\
  \ + for winner by wickets, - for loser by wickets\n} for t in teams}\n\n\n# Helper\
  \ to ensure presence\ndef ensure_team(tn: str):\n    if tn not in points:\n    \
  \    points[tn] = {\n            'team': tn,\n            'matches': 0,\n      \
  \      'wins': 0,\n            'losses': 0,\n            'ties': 0,\n          \
  \  'no_results': 0,\n            'super_over_wins': 0,\n            'points': 0,\n\
  \            'net_run_margin': 0,\n            'net_wicket_margin': 0\n        }\n\
  \n\n# Iterate matches to compute points\nfor idx, row in df.iterrows():\n    t1\
  \ = row['team1']\n    t2 = row['team2']\n    r = row['result']\n    ensure_team(t1)\n\
  \    ensure_team(t2)\n\n    # All completed or NR matches count as played\n    points[t1]['matches']\
  \ += 1\n    points[t2]['matches'] += 1\n\n    if r == 'no result':\n        # Guard:\
  \ winner must be null for NR before using None-safe logic downstream\n        points[t1]['no_results']\
  \ += 1\n        points[t2]['no_results'] += 1\n        points[t1]['points'] += 1\n\
  \        points[t2]['points'] += 1\n        continue\nif r == 'runs':\n    w = row['winner']\n\
  \    l = t2 if w == t1 else t1\n    margin = int(row['result_margin'])\n    points[w]['wins']\
  \ += 1\n    points[w]['points'] += 2\n    points[l]['losses'] += 1\n    points[w]['net_run_margin']\
  \ += margin\n    points[l]['net_run_margin'] -= margin\nelif r == 'wickets':\n \
  \   w = row['winner']\n    l = t2 if w == t1 else t1\n    margin = int(row['result_margin'])\n\
  \    points[w]['wins'] += 1\n    points[w]['points'] += 2\n    points[l]['losses']\
  \ += 1\n    points[w]['net_wicket_margin'] += margin\n    points[l]['net_wicket_margin']\
  \ -= margin\nelif r == 'tie':\n    if row['super_over'] == 'Y':\n        w = row['winner']\n\
  \        l = t2 if w == t1 else t1\n        points[w]['wins'] += 1\n        points[w]['super_over_wins']\
  \ += 1\n        points[w]['points'] += 2\n        points[l]['losses'] += 1\n   \
  \ else:\n        points[t1]['ties'] += 1\n        points[t2]['ties'] += 1\n    \
  \    points[t1]['points'] += 1\n        points[t2]['points'] += 1\nelse:\n    #\
  \ Unknown result type; treat as no-result for safety\n    points[t1]['no_results']\
  \ += 1\n    points[t2]['no_results'] += 1\n    points[t1]['points'] += 1\n    points[t2]['points']\
  \ += 1\n\n# Assemble points table\npt_df = pd.DataFrame.from_records(list(points.values()))\n\
  # Consistency: matches should equal sum of outcomes\nsum_outcomes = pt_df[['wins',\
  \ 'losses', 'ties', 'no_results']].sum(axis=1)\npt_df['matches'] = sum_outcomes\n\
  \npt_df = pt_df.sort_values(by=['points', 'wins', 'net_run_margin', 'net_wicket_margin'],\n\
  \                          ascending=[False, False, False, False]).reset_index(drop=True)\n\
  \n# Produce match outcomes view used by dashboards\nmatch_outcomes = df[\n    ['id',\
  \ 'season', 'date', 'team1', 'team2', 'toss_winner', 'toss_decision', 'batting_first',\
  \ 'chasing_team',\n     'winner', 'result', 'result_margin', 'super_over', 'method',\
  \ 'effective_overs', 'win_by', 'venue', 'city']].copy()\n\n# Write outputs\npt_path\
  \ = os.path.join(args.output, 'points_table.csv')\nmo_path = os.path.join(args.output,\
  \ 'match_outcomes.csv')\npt_df.to_csv(pt_path, index=False)\nmatch_outcomes.to_csv(mo_path,\
  \ index=False)\n\nprint(f\"Wrote points table to: {pt_path}\")\nprint(f\"Wrote match\
  \ outcomes to: {mo_path}\")\n\n```\n\nThe same program is on disk at `./code/general_task_36.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur',\
  \ 'date': '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner',\
  \ 'venue': 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings\
  \ XI Punjab', 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs':\
  \ 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem\
  \ Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune',\
  \ 'date': '2022-03-29', 'match_type': 'League', 'player_of_match': 'SV Samson',\
  \ 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1': 'Rajasthan\
  \ Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers Hyderabad',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin':\
  \ 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id': 249, 'season':\
  \ 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League', 'player_of_match':\
  \ 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata Knight Riders',\
  \ 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field',\
  \ 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
