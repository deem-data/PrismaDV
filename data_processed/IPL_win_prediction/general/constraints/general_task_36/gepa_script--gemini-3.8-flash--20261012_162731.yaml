      \ data omission | `\"error\"` |\n| Categorical fallbacks (`else: base = r`,\
      \ `.isin()`) | Unseen category | Harmless fallthrough | `\"warning\"` |\n| Safe\
      \ parsers (`errors='coerce'`) | Unparseable value | Coerced to `NaN`/`NaT` safely\
      \ | `\"warning\"` |\n| Descriptive metadata (`city`, `venue`, `umpire1`, `player_of_match`)\
      \ | Null / Missing | Non-critical informational fields | `\"warning\"` |\n\n\
      ---\n\n### Detailed Check Formulation Guidelines\n\n#### 1. Divisors & Mathematical\
      \ Calculations (Never Ignore Division by Zero)\n- In Python and NumPy, dividing\
      \ by zero produces unhandled errors or invalid `inf`/`NaN` propagating downstream.\n\
      - If the script computes `result_margin / target_overs` when `result == 'runs'`,\
      \ `target_overs` MUST be non-null and strictly positive:\n  ```python\n  .satisfies(\"\
      (`result` IS NULL OR `result` != 'runs') OR (`target_overs` IS NOT NULL AND\
      \ `target_overs` > 0)\", \"target_overs_positive_when_runs\")\n  ```\n  Set\
      \ `\"level\": \"error\"`.\n\n#### 2. Cross-Column & Relational Invariants\n\
      - **Entity Consistency**: When a record references competing entities (`team1`,\
      \ `team2`) and a victor (`winner` or `toss_winner`):\n  - If a match concludes\
      \ decisively (e.g., `result IN ('runs', 'wickets')`), `winner` MUST NOT be NULL\
      \ and MUST be either `team1` or `team2`:\n    ```python\n    .satisfies(\"(`result`\
      \ IS NULL OR `result` NOT IN ('runs', 'wickets')) OR (`winner` IS NOT NULL AND\
      \ (`winner` = `team1` OR `winner` = `team2`))\", \"winner_in_participating_teams_for_decisive\"\
      )\n    ```\n    Set `\"level\": \"error\"`.\n  - `toss_winner` should always\
      \ be one of the participating teams:\n    ```python\n    .satisfies(\"`toss_winner`\
      \ IS NOT NULL AND (`toss_winner` = `team1` OR `toss_winner` = `team2`)\", \"\
