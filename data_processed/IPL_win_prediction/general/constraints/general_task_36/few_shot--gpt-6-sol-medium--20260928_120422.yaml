constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method, target_overs:
    code:
    - - '.satisfies("method IS NULL OR method <> ''D/L'' OR (target_overs IS NOT NULL
        AND target_overs > 0)", ''dl_has_positive_target_overs'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: method, target_overs
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result, result_margin:
    code:
    - - '.satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin IS NOT
        NULL AND result_margin > 0)", ''winning_result_has_positive_margin'', lambda
        x: x == 1)'
      - Valid
    assumptions: []
    column_name: result, result_margin
  result, super_over, winner, team1, team2:
    code:
    - - '.satisfies("CASE WHEN result IN (''runs'', ''wickets'') OR (result = ''tie''
        AND super_over = ''Y'') THEN winner IS NOT NULL AND winner IN (team1, team2)
        ELSE TRUE END", ''decisive_result_has_participant_winner'', lambda x: x ==
        1)'
      - Valid
    assumptions: []
    column_name: result, super_over, winner, team1, team2
  result, winner:
    code:
    - - '.satisfies("result <> ''no result'' OR winner IS NULL", ''no_result_has_no_winner'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result, winner
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - '.satisfies(''team1 <> team2'', ''different_teams'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner, team1, team2:
    code:
    - - '.satisfies(''toss_winner IN (team1, team2)'', ''toss_winner_is_participant'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: toss_winner, team1, team2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
