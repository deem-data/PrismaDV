        int() and use it to describe and aggregate the win.
      sources:
      - start_line: 49
        end_line: 55
        file: ''
      - start_line: 121
        end_line: 137
        file: ''
      uid: fa8ca1b1-f03b-4242-92bd-b20d3d550f4a
    - text: If 'result' is 'tie' or 'no result', 'result_margin' should be null. The
        code does not use a margin for these outcomes, and the dataset has exactly
        as many missing margins as ties and no-results combined.
      sources:
      - start_line: 49
        end_line: 62
        file: ''
      - start_line: 169
        end_line: 171
        file: ''
      uid: 96b004a4-a53a-4a42-92d4-456a87ae9a4a
    - text: For a 'runs' result, 'result_margin' should be a positive integer; for
        a 'wickets' result, it should be an integer from 1 through 10. These values
