    assumptions:
    - text: 'Each match must have two different teams: `team1` must not equal `team2`.
        Otherwise, the script credits the same team twice for one match. This can
        be checked with `.satisfies("team1 <> team2", "distinct_match_teams")`.'
      sources:
      - start_line: 103
        end_line: 112
        file: ''
      uid: 0d91e162-e640-4580-9eff-f80c43e06dae
    - text: For results of `runs` or `wickets`, and for a `tie` with `super_over =
