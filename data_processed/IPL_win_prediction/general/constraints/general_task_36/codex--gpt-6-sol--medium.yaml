- column_name: team1
  code_for_constraint: .isComplete('team1')
- column_name: team2
  code_for_constraint: .isComplete('team2')
- column_name: team2
  code_for_constraint: .satisfies('team1 <> team2', 'distinct opponents')
- column_name: toss_winner
  code_for_constraint: .isComplete('toss_winner')
- column_name: toss_winner
  code_for_constraint: .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss
    winner is a participant')
- column_name: toss_decision
  code_for_constraint: .isContainedIn('toss_decision', ['bat', 'field'])
- column_name: result
  code_for_constraint: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
- column_name: super_over
  code_for_constraint: .isContainedIn('super_over', ['Y', 'N'])
- column_name: super_over
  code_for_constraint: .satisfies("CASE WHEN super_over = 'Y' THEN result = 'tie'
    ELSE TRUE END", 'super over only for ties')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN result = 'no result' OR (result = 'tie'
    AND super_over = 'N') THEN winner IS NULL OR winner IN ('NullValue', 'null', 'NULL',
    'None', '') ELSE winner = team1 OR winner = team2 END", 'winner matches outcome
    and participants')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN result = 'wickets' THEN winner = CASE
    WHEN toss_decision = 'field' THEN toss_winner WHEN toss_winner = team1 THEN team2
    ELSE team1 END ELSE TRUE END", 'wicket winner is chasing team')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN result = 'runs' AND (method IS NULL OR
    method <> 'D/L') THEN winner = CASE WHEN toss_decision = 'bat' THEN toss_winner
    WHEN toss_winner = team1 THEN team2 ELSE team1 END ELSE TRUE END", 'ordinary run
    winner bats first')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN result IN ('runs', 'wickets') THEN result_margin
    IS NOT NULL AND CAST(result_margin AS DOUBLE) > 0 AND CAST(result_margin AS DOUBLE)
    = FLOOR(CAST(result_margin AS DOUBLE)) ELSE TRUE END", 'winning margin is a positive
    whole number')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN result = 'wickets' THEN CAST(result_margin
    AS DOUBLE) <= 10 ELSE TRUE END", 'wicket margin does not exceed ten')
- column_name: method
  code_for_constraint: .satisfies("method IS NULL OR method IN ('D/L', 'NullValue',
    'null', 'NULL', 'None', '')", 'known method or null equivalent')
- column_name: target_overs
  code_for_constraint: .satisfies("CASE WHEN method = 'D/L' THEN target_overs IS NOT
    NULL AND CAST(target_overs AS DOUBLE) > 0 AND CAST(target_overs AS DOUBLE) <=
    20 ELSE TRUE END", 'D/L requires valid effective overs')
