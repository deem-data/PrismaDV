constraints:
  constraints:
    date:
      code:
      - - .isComplete('date')
        - Valid
      assumptions: []
      column_name: date
    id:
      code:
      - - .isComplete('id')
        - Valid
      - - .isUnique('id')
        - Valid
      assumptions: []
      column_name: id
    method:
      code:
      - - .satisfies("method IS NULL OR method IN ('D/L', 'NullValue', 'null', 'NULL',
          'None', '')", 'known method or null equivalent')
        - Valid
      assumptions: []
      column_name: method
    result:
      code:
      - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("CASE WHEN result = 'wickets' THEN CAST(result_margin AS DOUBLE)
          <= 10 ELSE TRUE END", 'wicket margin does not exceed ten')
        - Valid
      - - .satisfies("CASE WHEN result IN ('runs', 'wickets') THEN result_margin IS
          NOT NULL AND CAST(result_margin AS DOUBLE) > 0 AND CAST(result_margin AS
          DOUBLE) = FLOOR(CAST(result_margin AS DOUBLE)) ELSE TRUE END", 'winning
          margin is a positive whole number')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      - - .satisfies("CASE WHEN super_over = 'Y' THEN result = 'tie' ELSE TRUE END",
          'super over only for ties')
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("CASE WHEN method = 'D/L' THEN target_overs IS NOT NULL AND CAST(target_overs
          AS DOUBLE) > 0 AND CAST(target_overs AS DOUBLE) <= 20 ELSE TRUE END", 'D/L
          requires valid effective overs')
        - Valid
      assumptions: []
      column_name: target_overs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies('team1 <> team2', 'distinct opponents')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .isComplete('toss_winner')
        - Valid
      - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss winner is
          a participant')
        - Valid
      assumptions: []
      column_name: toss_winner
    venue:
      code:
      - - .isComplete('venue')
        - Valid
      assumptions: []
      column_name: venue
    winner:
      code:
      - - .satisfies("CASE WHEN result = 'no result' OR (result = 'tie' AND super_over
          = 'N') THEN winner IS NULL OR winner IN ('NullValue', 'null', 'NULL', 'None',
          '') ELSE winner = team1 OR winner = team2 END", 'winner matches outcome
          and participants')
        - Valid
      - - .satisfies("CASE WHEN result = 'runs' AND (method IS NULL OR method <> 'D/L')
          THEN winner = CASE WHEN toss_decision = 'bat' THEN toss_winner WHEN toss_winner
          = team1 THEN team2 ELSE team1 END ELSE TRUE END", 'ordinary run winner bats
          first')
        - Valid
      - - .satisfies("CASE WHEN result = 'wickets' THEN winner = CASE WHEN toss_decision
          = 'field' THEN toss_winner WHEN toss_winner = team1 THEN team2 ELSE team1
          END ELSE TRUE END", 'wicket winner is chasing team')
        - Valid
      assumptions: []
      column_name: winner
