constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("method IS NULL OR trim(method) IN ('D/L', 'NullValue', 'null',
        'NULL', 'None', '')", 'method_is_dl_or_null_like')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin >= 1 AND result_margin = floor(result_margin) AND (result
        <> 'wickets' OR result_margin <= 10))", 'decided_match_has_valid_integer_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("super_over <> 'Y' OR result = 'tie'", 'super_over_requires_tie')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR (target_overs IS NOT NULL
        AND target_overs > 0 AND target_overs <= 20)", 'dl_match_has_valid_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'opposing_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result <> 'no result' OR winner IS NULL OR trim(winner) IN ('NullValue',
        'null', 'NULL', 'None', '')", 'no_result_has_no_winner')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') AND NOT (result = 'tie' AND
        super_over = 'Y') OR winner = team1 OR winner = team2", 'decided_match_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: winner
