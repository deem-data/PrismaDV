constraints:
  '["city","venue"]':
    code: []
    assumptions:
    - text: 'Each cricket ''venue'' is physically located in a specific ''city''.
        When ''city'' is populated, the mapping from ''venue'' to ''city'' should
        be consistent across records, representing a many-to-one relationship (functional
        dependency: venue -> city).'
      sources:
      - start_line: 169
        end_line: 172
        file: ''
      - start_line: 177
        end_line: 177
        file: ''
      uid: b8c1bbeb-75f8-43c6-b0a5-3a4e29de7dae
