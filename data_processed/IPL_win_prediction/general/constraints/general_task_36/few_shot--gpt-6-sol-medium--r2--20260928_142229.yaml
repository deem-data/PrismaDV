constraints:
  method, target_overs:
    code:
    - - .satisfies("`method` NOT IN ('D/L') OR (`target_overs` IS NOT NULL AND `target_overs`
        > 0)", 'dl_matches_have_positive_target_overs')
      - Invalid
    assumptions: []
    column_name: method, target_overs
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result, result_margin:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin` IS NOT
        NULL AND `result_margin` > 0)", 'decisive_results_have_positive_margin')
      - Valid
    assumptions: []
    column_name: result, result_margin
  result, winner, team1, team2, super_over:
    code:
    - - .satisfies("(`result` NOT IN ('runs', 'wickets') AND NOT (`result` = 'tie'
        AND `super_over` = 'Y')) OR (`winner` IS NOT NULL AND `winner` IN (`team1`,
        `team2`))", 'decided_matches_have_participating_winner')
      - Valid
    assumptions: []
    column_name: result, winner, team1, team2, super_over
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('`team1` <> `team2`', 'opposing_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner, team1, team2:
    code:
    - - .satisfies('`toss_winner` = `team1` OR `toss_winner` = `team2`', 'toss_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner, team1, team2
