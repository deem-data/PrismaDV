prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["city","venue"]':
    code: []
    assumptions:
    - text: For records with a non-null city, each venue should be associated with
        at most one distinct city. Multiple venues may share a city, and city may
        be null. This can be checked by grouping rows with non-null city by venue
        and requiring COUNT(DISTINCT city) <= 1 for every group.
      sources:
      - start_line: 169
        end_line: 171
        file: ''
      - start_line: 173
        end_line: 177
        file: ''
      uid: 262b670c-ff66-4221-99a8-ed673e15a4ae
  '["date","season"]':
    code:
    - suggestion: .satisfies('`date` IS NOT NULL AND `season` IS NOT NULL AND to_date(`date`)
        IS NOT NULL AND year(to_date(`date`)) = `season`', 'date_year_matches_season')
