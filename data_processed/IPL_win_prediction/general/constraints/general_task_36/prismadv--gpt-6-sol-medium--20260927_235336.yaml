      source_assumptions:
      - 4bdb450a-11b2-431f-a6c8-5e510be5156a
    assumptions:
    - text: Each match's 'date' should be parseable as a calendar date, and its calendar
        year should equal the integer 'season' value. The script exports both fields
        together for match-level reporting, so a mismatch would make the reported
        season inconsistent with the match date. This can be checked with a row-level
        constraint comparing year(parsed date) to season.
      sources:
      - start_line: 169
        end_line: 171
        file: ''
      - start_line: 173
        end_line: 177
        file: ''
      uid: 4bdb450a-11b2-431f-a6c8-5e510be5156a
