      source_assumptions:
      - 7b529d2a-c020-4e9f-93de-6e2a50206fc7
    assumptions:
    - text: Each cricket venue is located in a specific city, meaning that 'venue'
        functionally determines 'city'. For all records where 'city' is not null,
        each unique 'venue' should consistently map to at most one unique 'city'.
        This can be verified via a functional dependency constraint or grouped consistency
        check ensuring that distinct cities per venue is 1.
      sources:
      - start_line: 169
        end_line: 172
        file: ''
      uid: fe1306d6-6775-4e7c-8500-e88c9bbb59be
    - text: 'For match outcomes and reporting, the match location must not be completely
        missing; ''venue'' and ''city'' should not both be null for any record. We
        could represent this assumption as a Deequ constraint like this:

        .satisfies("venue IS NOT NULL OR city IS NOT NULL", "venue_or_city_present")'
      sources:
      - start_line: 169
        end_line: 172
        file: ''
      uid: 7b529d2a-c020-4e9f-93de-6e2a50206fc7
