      code:
      - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'wicket margin
          within ten')
        - Valid
      - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
          AND result_margin > 0 AND result_margin = FLOOR(result_margin))", 'decided
          match has positive integer margin')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isComplete('super_over')
        - Valid
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      - - .satisfies("super_over <> 'Y' OR result = 'tie'", 'super over requires tie')
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("method <> 'D/L' OR method IS NULL OR (target_overs IS NOT NULL
          AND target_overs > 0 AND target_overs <= 20)", 'D/L requires valid target
          overs')
        - Valid
      assumptions: []
      column_name: target_overs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies('team1 <> team2', 'different participating teams')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isComplete('toss_decision')
        - Valid
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .isComplete('toss_winner')
        - Valid
      - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss winner participates')
        - Valid
      assumptions: []
      column_name: toss_winner
    winner:
      code:
      - - .satisfies("result NOT IN ('no result', 'tie') OR (result = 'tie' AND super_over
          = 'Y') OR winner IS NULL OR winner IN ('NullValue', 'null', 'NULL', 'None',
          '')", 'undecided match has no winner')
        - Valid
      - - .satisfies("result NOT IN ('runs', 'wickets') AND NOT (result = 'tie' AND
          super_over = 'Y') OR winner = team1 OR winner = team2", 'decided match winner
          participates')
        - Valid
      assumptions: []
      column_name: winner
