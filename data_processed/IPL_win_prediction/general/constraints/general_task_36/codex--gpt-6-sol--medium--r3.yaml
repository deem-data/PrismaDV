- column_name: result
  code_for_constraint: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
- column_name: super_over
  code_for_constraint: .isComplete('super_over')
- column_name: super_over
  code_for_constraint: .isContainedIn('super_over', ['Y', 'N'])
- column_name: super_over
  code_for_constraint: .satisfies("super_over <> 'Y' OR result = 'tie'", 'super over
    requires tie')
- column_name: winner
  code_for_constraint: .satisfies("result NOT IN ('runs', 'wickets') AND NOT (result
    = 'tie' AND super_over = 'Y') OR winner = team1 OR winner = team2", 'decided match
    winner participates')
- column_name: winner
  code_for_constraint: .satisfies("result NOT IN ('no result', 'tie') OR (result =
    'tie' AND super_over = 'Y') OR winner IS NULL OR winner IN ('NullValue', 'null',
    'NULL', 'None', '')", 'undecided match has no winner')
- column_name: result_margin
  code_for_constraint: .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin
    IS NOT NULL AND result_margin > 0 AND result_margin = FLOOR(result_margin))",
    'decided match has positive integer margin')
- column_name: result_margin
  code_for_constraint: .satisfies("result <> 'wickets' OR result_margin <= 10", 'wicket
    margin within ten')
- column_name: method
  code_for_constraint: .satisfies("method IS NULL OR method IN ('D/L', 'NullValue',
    'null', 'NULL', 'None', '')", 'recognized overs method')
- column_name: target_overs
  code_for_constraint: .satisfies("method <> 'D/L' OR method IS NULL OR (target_overs
    IS NOT NULL AND target_overs > 0 AND target_overs <= 20)", 'D/L requires valid
    target overs')
