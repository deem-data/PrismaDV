      source_assumptions:
      - a8d8a60d-5547-4142-ad13-9fb62c5abfaa
    assumptions:
    - text: 'Each ''venue'' is expected to have a consistent association with a single
        ''city'' (functional dependency: venue -> city), meaning that a given venue
        should not be assigned to multiple different cities across the dataset. In
        Deequ, this consistency can be verified by checking that the number of distinct
        cities per venue is at most 1.'
      sources:
      - start_line: 169
        end_line: 171
        file: ''
      - start_line: 177
        end_line: 177
        file: ''
      uid: 6072213b-7ef1-48c1-96c1-69559cd46bf0
    - text: 'For records in ''match_outcomes'', whenever ''venue'' is present, ''city''
        should also be non-null so that match locations are fully specified for downstream
        dashboards. This assumption can be expressed as a Deequ constraint: .satisfies("venue
        IS NULL OR city IS NOT NULL", "city_present_with_venue").'
      sources:
      - start_line: 169
        end_line: 171
        file: ''
      - start_line: 177
        end_line: 177
        file: ''
      uid: a8d8a60d-5547-4142-ad13-9fb62c5abfaa
