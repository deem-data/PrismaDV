constraints:
  '["city","venue"]':
    code: []
    assumptions:
    - text: For rows with a non-null city, each venue should be associated with one
        consistent city across matches. The dashboard exports venue and city together
        as location information; conflicting city values for the same venue would
        make that information inconsistent. This can be checked by grouping rows with
        non-null city by venue and requiring the count of distinct cities in each
        group to be at most one. Rows with a null city should be excluded from this
        check.
      sources:
      - start_line: 169
        end_line: 171
        file: ''
      - start_line: 173
        end_line: 177
        file: ''
      uid: dfed34e0-ed0b-4a8e-8a84-a42e37a62d73
  '["date","season"]':
    code:
    - suggestion: '.satisfies("to_date(`date`) IS NOT NULL AND `season` IS NOT NULL
