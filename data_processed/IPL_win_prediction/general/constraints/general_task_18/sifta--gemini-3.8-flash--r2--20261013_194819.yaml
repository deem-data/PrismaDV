      \  - For non-negative metrics, overs, runs, counts, or margins (>= 0), use `.isNonNegative(column)`\
      \ or `.satisfies(\"`col` >= 0\", \"col_non_negative\")`. Avoid `.isPositive`\
      \ unless values are strictly required to be > 0 and 0 is invalid.\n- Completeness:\n\
      \  - Use `.isComplete(column)` ONLY when missing values directly crash downstream\
      \ code (e.g., unhandled nulls in casts or key lookups). If the code handles\
      \ missing values gracefully (e.g., fallback defaults), use `.hasCompleteness(column,\
      \ lambda x: x >= 0.95)` to avoid false alarms.\n- Relational / Conditional logic:\n\
      \  - Use `.satisfies(condition, constraintName)`. When an assumption is conditional\
