    - text: 'The ''super_over'' column should be ''Y'' if and only if ''result'' is
        ''tie'' (i.e., every tied match is decided in a super over, and super overs
        only occur for tied matches). We could represent this assumption as a Deequ
        constraint like: .satisfies(''(result = \''tie\'' AND super_over = \''Y\'')
