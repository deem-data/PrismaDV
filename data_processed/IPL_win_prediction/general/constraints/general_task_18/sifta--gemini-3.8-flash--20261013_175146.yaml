      \ check would cause downstream code to crash OR silently produce incorrect results\
      \ (e.g., dividing by zero/null, missing keys in aggregations, non-positive margins\
      \ on decided matches, broken relational invariants). Ensure that critical assumptions\
      \ have corresponding \"error\" level checks so corrupted data partitions can\
      \ be detected.\n- Set level \"warning\" ONLY if the code safely and intentionally\
      \ accommodates the condition without distorting final output metrics (e.g.,\
      \ benign missing values in non-critical columns).\nLink each check to the 0-based\
      \ indices of the assumptions it validates.\n\nCRITICAL SQL Guidelines for `.satisfies`:\n\
      - SQL 3-Valued Logic & NULL Handling: In SQL WHERE clauses, `NULL != 'val'`\
      \ evaluates to UNKNOWN (falsy). When writing conditional implications of the\
      \ form \"IF colA = 'X' THEN colB condition\" (logic: `NOT A OR B`), you MUST\
      \ explicitly include `colA IS NULL`:\n  Correct: `.satisfies(\"`colA` IS NULL\
      \ OR `colA` != 'X' OR (`colB` IS NOT NULL AND `colB` > 0)\", \"relational_check\"\
