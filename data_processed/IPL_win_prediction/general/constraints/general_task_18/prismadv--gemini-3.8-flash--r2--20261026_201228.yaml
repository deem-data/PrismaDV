prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["city","venue"]':
    code: []
    assumptions:
    - text: Each 'venue' should have a consistent, one-to-one or many-to-one relationship
        with 'city', meaning that 'venue' functionally determines 'city' (a venue
        should not belong to more than one distinct city). Furthermore, because 'venue'
        has complete coverage (completeness 1.0) and both columns are published as
        key location metadata in 'publish_df', 'city' should not be null when 'venue'
        is populated.
      sources:
      - start_line: 80
        end_line: 95
        file: ''
      uid: ff1d7c27-008b-42b4-8ff7-2aeb95df29cd
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year extracted from the ''date'' column should match the ''season''
        column for each record, ensuring consistency between the match date and the
        recorded season. We could represent this assumption as a deequ constraint
        like this: .satisfies("YEAR(CAST(date AS DATE)) == season", "date_year_matches_season")'
      sources:
      - start_line: 41
        end_line: 48
        file: ''
      uid: 2049ccb7-dc18-4de1-b4a3-2dbf3ff6c420
  '["method","target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'When the ''method'' column is ''D/L'' (Duckworth-Lewis), both ''target_runs''
        and ''target_overs'' are expected to be non-null and valid numeric values
        so that the target run and over details can be formatted into the match summary.
        This can be expressed as a Deequ constraint: .satisfies("method != ''D/L''
        OR (target_runs IS NOT NULL AND target_overs IS NOT NULL)", "DL_targets_not_null")'
      sources:
      - start_line: 52
        end_line: 65
        file: ''
      uid: a4af5b7e-7656-489b-bbcf-2196243674d2
    - text: 'The columns ''target_runs'' and ''target_overs'' should have consistent
        presence and positive values when specified; whenever a target run count is
        defined, the corresponding target overs must also be defined (target_runs
        > 0 and target_overs > 0). This can be expressed as a Deequ constraint: .satisfies("(target_runs
        IS NULL AND target_overs IS NULL) OR (target_runs > 0 AND target_overs > 0)",
        "target_runs_and_overs_consistency")'
      sources:
      - start_line: 54
        end_line: 63
        file: ''
      uid: de3f2ec0-5dff-46d6-8b27-a412965e7a77
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column has the value ''runs'' or ''wickets'', ''result_margin''
        must not be null and must be convertible to an integer, because the code performs
        `int(float(row[''result_margin'']))` without null checks. If ''result_margin''
        is null/NaN for these results, `int(float(nan))` will raise a ValueError.
        This can be expressed as a Deequ constraint: .satisfies("(result NOT IN (''runs'',
