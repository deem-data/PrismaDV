constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - '.satisfies("`date` RLIKE ''^\\d{4}-\\d{2}-\\d{2}$'' AND to_date(`date`, ''yyyy-MM-dd'')
        IS NOT NULL", ''valid_match_date'', lambda x: x == 1.0)'
      - Invalid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isPositive('id')
      - Invalid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin, result:
    code:
    - - '.satisfies("`result` <> ''wickets'' OR `result_margin` <= 10", ''wicket_margin_at_most_ten'',
        lambda x: x == 1.0)'
      - Valid
    - - '.satisfies("`result` NOT IN (''runs'', ''wickets'') OR (`result_margin` IS
        NOT NULL AND `result_margin` > 0 AND `result_margin` = FLOOR(`result_margin`))",
        ''decided_match_has_whole_positive_margin'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: result_margin, result
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  super_over, result:
    code:
    - - '.satisfies("(`result` = ''tie'' AND `super_over` = ''Y'') OR (`result` <>
        ''tie'' AND `super_over` = ''N'')", ''super_over_matches_tie'', lambda x:
        x == 1.0)'
      - Valid
    assumptions: []
    column_name: super_over, result
  target_overs, method:
    code:
    - - '.satisfies("`method` IS NULL OR `method` <> ''D/L'' OR (`target_overs` IS
        NOT NULL AND `target_overs` > 0)", ''dl_has_positive_target_overs'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: target_overs, method
  target_runs, method:
    code:
    - - '.satisfies("`method` IS NULL OR `method` <> ''D/L'' OR (`target_runs` IS
        NOT NULL AND `target_runs` > 0)", ''dl_has_positive_target_runs'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: target_runs, method
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - '.satisfies("`team1` <> `team2`", ''different_teams'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner, team1, team2:
    code:
    - - '.satisfies("`toss_winner` = `team1` OR `toss_winner` = `team2`", ''toss_winner_is_participant'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: toss_winner, team1, team2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner, result, team1, team2:
    code:
    - - '.satisfies("(`result` = ''no result'' AND `winner` IS NULL) OR (`result`
        <> ''no result'' AND (`winner` = `team1` OR `winner` = `team2`))", ''winner_matches_result_and_participants'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: winner, result, team1, team2
