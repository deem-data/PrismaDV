prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport json\nimport pandas as pd\nimport numpy as np\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\
  \n    # Parse date for downstream use\n    df['date_dt'] = pd.to_datetime(df['date'],\
  \ errors='coerce')\n    # Derive toss-related fields used in summaries\n    df['toss_winner_side']\
  \ = np.where(df['toss_winner'] == df['team1'], 'team1', 'team2')\n    df['batting_first']\
  \ = np.where(\n        (df['toss_winner'] == df['team1']) & (df['toss_decision']\
  \ == 'bat'), df['team1'],\n        np.where(\n            (df['toss_winner'] ==\
  \ df['team2']) & (df['toss_decision'] == 'bat'), df['team2'],\n            np.where(\n\
  \                (df['toss_winner'] == df['team1']) & (df['toss_decision'] == 'field'),\
  \ df['team2'],\n                df['team1']\n            )\n        )\n    )\n \
  \   df['batting_second'] = np.where(df['batting_first'] == df['team1'], df['team2'],\
  \ df['team1'])\n    # Compute loser used in summaries\n    df['loser'] = np.where(\n\
  \        df['result'].ne('no result'),\n        np.where(df['winner'] == df['team1'],\
  \ df['team2'], df['team1']),\n        pd.NA\n    )\n    def build_summary(row):\n\
  \        date_str = pd.to_datetime(row['date']).strftime('%Y-%m-%d')\n        venue\
  \ = row['venue']\n        season_val = row['season']\n        match_id = row['id']\n\
  \        tw = row['toss_winner']\n        td = row['toss_decision']\n        bf\
  \ = row['batting_first']\n        base = f'Season {season_val} - Match {match_id}'\n\
  \        toss_part = f'Toss: {tw} elected to {td}.'\n        innings_part = f' First\
  \ innings: {bf}.'\n        method_part = ''\n        method_val = row['method']\n\
  \        if pd.notna(method_val) and str(method_val).strip() != '' and str(method_val).strip().upper()\
  \ != 'NAN':\n            if str(method_val).strip() == 'D/L' and pd.notna(row['target_runs'])\
  \ and pd.notna(row['target_overs']):\n                try:\n                   \
  \ tr = int(float(row['target_runs']))\n                except Exception:\n     \
  \               tr = row['target_runs']\n                try:\n                \
  \    tovers = int(float(row['target_overs']))\n                except Exception:\n\
  \                    tovers = row['target_overs']\n                method_part =\
  \ f' Target {tr} in {tovers} overs (D/L).'\n            else:\n                method_part\
  \ = f' ({method_val}).'\n        if row['result'] == 'no result':\n            return\
  \ f'{base}: No result at {venue} on {date_str}. {toss_part}'\n        if row['result']\
  \ == 'runs':\n            margin = int(float(row['result_margin']))\n          \
  \  return f'{base}: {row['winner']} beat {row['loser']} by {margin} runs at {venue}\
  \ on {date_str}. {toss_part}{innings_part}{method_part}'\n        if row['result']\
  \ == 'wickets':\n            margin = int(float(row['result_margin']))\n       \
  \     return f'{base}: {row['winner']} beat {row['loser']} by {margin} wickets at\
  \ {venue} on {date_str}. {toss_part}{innings_part}{method_part}'\n        if row['result']\
  \ == 'tie':\n            return f'{base}: {row['winner']} won in Super Over after\
  \ a tie at {venue} on {date_str}. {toss_part}{innings_part}{method_part}'\n    \
  \    return f'{base}: Result {row['result']} at {venue} on {date_str}. {toss_part}{innings_part}{method_part}'\n\
  \n    summaries = df.apply(build_summary, axis=1)\n\n    publish_df = pd.DataFrame({\n\
  \        'id': df['id'],\n        'season': df['season'],\n        'date': df['date'],\n\
  \        'city': df['city'],\n        'venue': df['venue'],\n        'team1': df['team1'],\n\
  \        'team2': df['team2'],\n        'winner': df['winner'],\n        'loser':\
  \ df['loser'],\n        'result': df['result'],\n        'result_margin': df['result_margin'],\n\
  \        'super_over': df['super_over'],\n        'method': df['method'],\n    \
  \    'summary': summaries\n    })\n\n    csv_out = os.path.join(args.output, 'post_match_summaries.csv')\n\
  \    publish_df.to_csv(csv_out, index=False)\n\n    feed_path = os.path.join(args.output,\
  \ 'syndication_feed.jsonl')\n    with open(feed_path, 'w', encoding='utf-8') as\
  \ f:\n        for _, row in publish_df.iterrows():\n            rec = {\n      \
  \          'id': int(row['id']),\n                'season': str(row['season']),\n\
  \                'winner': None if pd.isna(row['winner']) else str(row['winner']),\n\
  \                'loser': None if pd.isna(row['loser']) else str(row['loser']),\n\
  \                'result': str(row['result']),\n                'result_margin':\
  \ None if pd.isna(row['result_margin']) else float(row['result_margin']),\n    \
  \            'super_over': str(row['super_over']),\n                'method': None\
  \ if pd.isna(row['method']) else str(row['method']),\n                'summary':\
  \ row['summary']\n            }\n            f.write(json.dumps(rec, ensure_ascii=False)\
  \ + '\\n')\n\n    stats = {\n        'published_count': int(len(publish_df)),\n\
  \        'ties': int((df['result'] == 'tie').sum()),\n        'no_results': int((df['result']\
  \ == 'no result').sum()),\n        'runs_decisions': int((df['result'] == 'runs').sum()),\n\
  \        'wickets_decisions': int((df['result'] == 'wickets').sum())\n    }\n  \
  \  with open(os.path.join(args.output, 'publish_stats.json'), 'w', encoding='utf-8')\
  \ as f:\n        json.dump(stats, f, ensure_ascii=False)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_18.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur',\
  \ 'date': '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner',\
  \ 'venue': 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings\
  \ XI Punjab', 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs':\
  \ 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem\
  \ Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune',\
  \ 'date': '2022-03-29', 'match_type': 'League', 'player_of_match': 'SV Samson',\
  \ 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1': 'Rajasthan\
  \ Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers Hyderabad',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin':\
  \ 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id': 249, 'season':\
  \ 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League', 'player_of_match':\
  \ 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata Knight Riders',\
  \ 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field',\
  \ 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
