constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("to_date(`date`, 'yyyy-MM-dd') IS NOT NULL", 'valid_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isPositive('id')
      - Invalid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') OR `result_margin` > 0", 'decided_match_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('`team1` <> `team2`', 'distinct_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('`toss_winner` IN (`team1`, `team2`)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("`result` = 'no result' OR `winner` IN (`team1`, `team2`)", 'decided_match_has_participant_winner')
      - Valid
    assumptions: []
    column_name: winner
