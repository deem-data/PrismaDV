      \ `team1` != `team2`.\n     - Metrics: margin and points metrics must be non-negative.\n\
      5. Avoid rigid format assumptions:\n   - Do not assume rigid string or date\
      \ formats (such as requiring a specific date regex like `YYYY-MM-DD`) unless\
      \ the downstream code explicitly relies on exact string positions or regex matching.\
      \ Standard parsing (`pd.to_datetime`) accepts multiple valid date/timestamp\
      \ formats; assuming a single rigid format causes false alarms.\n6. Distinguish\
      \ critical assumptions whose violation causes crashes or silent logical corruption\
