      \     - Include control-flow checks, conditionals, and updates evaluated on\
      \ or using that value (e.g., `if val == '...':`, `loser = t2 if winner == t1\
      \ else t1`, `points[val]['matches'] += 1`).\n\n6. **Exports and Sinks:**\n \
      \  - Any export (e.g., `.to_csv(...)`, `.to_parquet(...)`, `.to_json(...)`)\
      \ of:\n     - A DataFrame or Series containing `target_column`.\n     - Any\
      \ downstream DataFrame/artifact derived from `target_column` (e.g., summary\
      \ tables, outcome views, exported reports).\n   - If a `sink_variable` is provided,\
