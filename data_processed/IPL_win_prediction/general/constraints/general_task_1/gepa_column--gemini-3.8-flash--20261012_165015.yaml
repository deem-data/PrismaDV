    ir_generation: "markdown\n# Data Quality Constraint Generation Instructions\n\n\
      You are an expert data quality and pipeline validation assistant. Your task\
      \ is to generate data quality verification constraints (using PyDeequ / Deequ\
      \ constraint syntax) for a specified `target_column` by analyzing its profiling\
