      \ ['val1', 'val2', ...])`\n  - `.satisfies('SQL_EXPRESSION', 'assertion_name')`\n\
      - **Uniqueness & Keys**:\n  - `.isUnique('column')`\n  - `.hasUniqueness('column',\
      \ lambda x: x >= threshold)`\n\n---\n\n## 3. Rules & Guidelines to Prevent False\
      \ Alarms (Safe Batch Failures)\n\n1. **Avoid Overly Strict Completeness Thresholds**:\n\
      \   - **Do not** blindly convert a profiling completeness value (e.g., `0.9981`)\
      \ into a strict assertion like `lambda x: x >= 0.99`. Real batches will naturally\
      \ fluctuate (e.g., 98.7% or 98.9%), resulting in massive false alarms.\n   -\
      \ Inspect how the pipeline handles `NaN` / null values:\n     - If the code\
