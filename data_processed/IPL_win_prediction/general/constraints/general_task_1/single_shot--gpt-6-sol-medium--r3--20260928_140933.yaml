constraints:
  date:
    code:
    - - .isComplete('date').satisfies("to_date(`date`, 'yyyy-MM-dd') IS NOT NULL AND
        year(to_date(`date`, 'yyyy-MM-dd')) = `season`", 'valid_date_and_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("(`result` IN ('runs', 'wickets') AND `result_margin` > 0) OR (`result`
        IN ('tie', 'no result') AND `result_margin` IS NULL)", 'margin_matches_result')
      - Valid
    - - .satisfies("`result` <> 'wickets' OR `result_margin` <= 10", 'wicket_margin_at_most_ten')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('`target_overs` IS NULL OR (`target_overs` > 0 AND `target_overs`
        <= 20)', 'valid_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('`target_runs` IS NULL OR `target_runs` > 0', 'positive_target_runs_when_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2').satisfies('`team1` <> `team2`', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('`toss_winner` IN (`team1`, `team2`)',
        'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("`result` = 'no result' OR `winner` IN (`team1`, `team2`)", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
