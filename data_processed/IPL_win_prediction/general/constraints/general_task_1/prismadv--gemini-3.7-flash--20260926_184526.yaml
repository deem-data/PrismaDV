    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'For every record with a valid ''season'', the ''date'' column must be
        non-null and parseable as a valid datetime, ensuring that matches can be properly
        ordered chronologically within each season. This can be expressed as a conditional
        constraint: when ''season'' is not null, ''date'' must satisfy a valid datetime/non-null
        check.'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 84
        end_line: 92
        file: ''
      uid: 5578e8e9-e0a1-4e53-bcec-4dcefa8d863a
  '["result","result_margin","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''winner'' should not be
        null, as the code evaluates match outcomes and attributes winning margins
        to the winning team. We could represent this assumption as a Deequ constraint
        like this: .satisfies("result NOT IN (''runs'', ''wickets'') OR winner IS
        NOT NULL", "WinnerNotNullWhenResultIsRunsOrWickets")'
      sources:
      - start_line: 35
        end_line: 36
        file: ''
      - start_line: 41
        end_line: 48
        file: ''
      - start_line: 53
        end_line: 56
        file: ''
      uid: 7370b351-cce9-4f7c-84a7-0e90d7a50672
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be non-null and strictly greater than 0, because the script uses ''result_margin''
        to compute ''win_by_runs'', ''win_by_wkts'', and aggregates average win margins
        for margin values greater than 0. We could represent this assumption as a
        Deequ constraint like this: .satisfies("result NOT IN (''runs'', ''wickets'')
        OR (result_margin IS NOT NULL AND result_margin > 0)", "ResultMarginPositiveWhenWonByRunsOrWickets")'
      sources:
      - start_line: 44
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
      uid: 556ff1b8-817e-4061-899b-29f9298f23b3
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: When 'result' is 'runs' or 'wickets', 'result_margin' should not be null
