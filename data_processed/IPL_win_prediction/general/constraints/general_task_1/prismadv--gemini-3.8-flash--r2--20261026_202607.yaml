    assumptions:
    - text: 'The year extracted from the ''date'' column should match the ''season''
        column for each record, ensuring that matches grouped and sorted by season
        in the dashboard accurately reflect that season''s timeline. We could represent
        this assumption as a Deequ constraint like: .satisfies(''year(date) == season'',
        ''date_year_matches_season'')'
