        occurred, which happens if and only if the match result is a tie. Therefore,
        when ''result'' is ''tie'', ''super_over'' should be ''Y'', and when ''result''
        is not ''tie'', ''super_over'' should be ''N''. This can be expressed as a
        Deequ constraint: .satisfies("(result = ''tie'' AND super_over = ''Y'') OR
        (result != ''tie'' AND super_over = ''N'')", "super_over_iff_tie_result")'
