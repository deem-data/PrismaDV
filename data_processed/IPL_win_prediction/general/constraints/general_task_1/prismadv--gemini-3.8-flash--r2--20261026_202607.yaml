      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 91
        end_line: 92
        file: ''
      uid: 92d6c5da-f53b-4687-bb4e-5a00c516d2fa
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column has the value ''runs'' or ''wickets'', ''result_margin''
        must not be null and should be greater than 0, ensuring that margin calculations
        and average margin statistics (''avg_run_margin'' and ''avg_wickets_remaining'')
        compute correctly. In Deequ, this can be expressed as: .satisfies("result
        NOT IN (''runs'', ''wickets'') OR (result_margin IS NOT NULL AND result_margin
        > 0)", "Valid result_margin for runs and wickets")'
      sources:
      - start_line: 44
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
      uid: 1fe958d3-bbfc-4172-b7c6-720b82e0a742
    - text: 'When the ''result'' column has the value ''tie'' or ''no result'', ''result_margin''
        is expected to be null as there is no winning margin for tied or abandoned
        matches. In Deequ, this can be expressed as: .satisfies("result NOT IN (''tie'',
        ''no result'') OR result_margin IS NULL", "Null result_margin for tie or no
        result")'
      sources:
      - start_line: 41
        end_line: 48
        file: ''
      - start_line: 53
        end_line: 56
        file: ''
      uid: 01baa54a-9524-45d6-86c8-4a7d369f6305
