    - text: 'When ''result'' is not ''no result'', a match has concluded with an outcome
        and ''winner'' should not be null; conversely, when ''result'' is ''no result'',
        ''winner'' is expected to be null. We could represent this assumption as a
        deequ constraint like this:

        .satisfies("(result != ''no result'' AND winner IS NOT NULL) OR (result =
