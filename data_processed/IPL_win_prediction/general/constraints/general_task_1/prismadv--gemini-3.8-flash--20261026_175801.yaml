prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year extracted from ''date'' should correspond to ''season'' for
        each record, ensuring temporal consistency between the match date and the
        recorded season. We could represent this assumption as a Deequ constraint
        like: .satisfies(''YEAR(CAST(date AS DATE)) == season'', ''Date year matches
        season'')'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 91
        end_line: 92
        file: ''
      uid: d6285bb5-73e7-4e6f-aa43-ed8c550e420a
    - text: 'Each record with a valid ''season'' must have a non-null and validly
        formatted ''date'' so that matches can be grouped by season and sorted chronologically
        without NaT or missing values. We could represent this assumption as a Deequ
        constraint like: .satisfies(''season IS NOT NULL AND date IS NOT NULL'', ''Season
        and date must both be non-null'')'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 91
        end_line: 92
        file: ''
      uid: 95a14ab5-43c3-4df6-8e63-e8e0dd462034
  '["result","result_margin","winner"]':
    code: []
    assumptions:
    - text: 'When the match ''result'' is either ''runs'' or ''wickets'', ''result_margin''
        must not be null and should be greater than 0, as it is used to calculate
        run and wicket win margins and their averages. We could represent this assumption
        as a deequ constraint like this:

        .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin IS NOT
        NULL AND result_margin > 0)", "Margin_Must_Be_Positive_For_Runs_And_Wickets")

        '
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 44
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
