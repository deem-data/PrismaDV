      - start_line: 28
        end_line: 33
        file: ''
      - start_line: 50
        end_line: 60
        file: ''
      uid: d4b4145e-025f-469b-b112-ea7826127a35
    - text: The combination of `season` and `id` should identify at most one match.
        Duplicate `(season, id)` records would be counted more than once in both the
        standings and the season's total-games figure. This can be checked with `.isUnique(["season",
        "id"])`.
      sources:
      - start_line: 24
        end_line: 26
        file: ''
      - start_line: 50
        end_line: 60
        file: ''
      - start_line: 91
        end_line: 93
        file: ''
      uid: 3b8a13b9-bcde-42af-ba29-b7a11aea257a
    - text: 'If `season` represents a calendar year, each match''s parsed `date` should
        fall in that year: `year(date) = season`. Otherwise, a match can be included
        in one season''s standings while appearing chronologically in another season.'
