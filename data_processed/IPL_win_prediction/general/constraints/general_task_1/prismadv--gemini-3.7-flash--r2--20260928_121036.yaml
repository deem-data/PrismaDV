    - text: 'The ''toss_winner'' column should always be either ''team1'' or ''team2''
        for every match record. We could represent this assumption as a Deequ constraint
        like: .satisfies("toss_winner == team1 OR toss_winner == team2", "toss_winner_is_one_of_the_teams")'
