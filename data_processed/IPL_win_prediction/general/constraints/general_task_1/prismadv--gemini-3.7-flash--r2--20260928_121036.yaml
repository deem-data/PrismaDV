prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'Each record with a valid ''season'' must have a valid, non-null ''date''
        that correctly converts to a datetime object, ensuring that matches within
        any given ''season'' can be accurately sorted chronologically without NaT
        values. Furthermore, the year extracted from ''date'' is expected to correspond
        to the ''season''. We could represent this assumption as a Deequ constraint
        like: .satisfies("season IS NOT NULL AND date IS NOT NULL", "season_date_not_null")'
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 84
        end_line: 92
        file: ''
      uid: fccf3afa-79b3-402e-9301-105a9df12e18
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0)", "Result margin should be positive when
        result is runs or wickets")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: cc3acc87-0c44-4c56-972c-5dbcbfbdfe17
      source_assumptions:
      - 8e49091c-9906-418e-b8b4-762316eef383
    assumptions:
    - text: 'When the ''result'' column is either ''runs'' or ''wickets'', the ''result_margin''
        column is expected to be non-null and strictly positive (> 0) to correctly
        calculate win margins and aggregated statistics. We can express this constraint
        in Deequ as: .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin
        IS NOT NULL AND result_margin > 0)", "Result margin should be positive when
        result is runs or wickets")'
      sources:
      - start_line: 44
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
      uid: 8e49091c-9906-418e-b8b4-762316eef383
  '["result","super_over"]':
    code:
    - suggestion: '.satisfies("(`super_over` = ''Y'' AND `result` = ''tie'') OR (`super_over`
        = ''N'' AND `result` != ''tie'')", "super_over_result_consistency", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f22546b2-e9f5-46dd-979e-74c07386c756
      source_assumptions:
      - bad2c768-1ac0-4b44-ba32-978b43efb9a3
    assumptions:
    - text: 'The ''super_over'' and ''result'' columns have a direct correspondence:
        when a match goes to a super over (''super_over'' == ''Y''), the match result
        is ''tie'', and when ''super_over'' == ''N'', the result is not ''tie''. We
        could represent this assumption as a Deequ constraint like: .satisfies("(super_over
        = ''Y'' AND result = ''tie'') OR (super_over = ''N'' AND result != ''tie'')",
        "SuperOverResultConsistency")'
      sources:
      - start_line: 24
        end_line: 26
        file: ''
      - start_line: 55
        end_line: 55
        file: ''
      uid: bad2c768-1ac0-4b44-ba32-978b43efb9a3
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' is not ''no result'' (i.e. ''runs'', ''wickets'', or
        ''tie''), ''winner'' must not be null, because downstream logic calculates
        wins, losses, and point allocations based on the winner matching the team
        for completed matches. Conversely, ''winner'' is null when ''result'' is ''no
        result''. This can be expressed as a conditional constraint: ''result != "no
        result" => winner IS NOT NULL''.'
      sources:
      - start_line: 35
        end_line: 36
        file: ''
      - start_line: 41
        end_line: 48
        file: ''
      - start_line: 53
        end_line: 56
        file: ''
      uid: fa1e7f9b-566c-478f-9ae1-06dedcd82a97
