    assumptions:
    - text: 'The columns ''target_runs'' and ''target_overs'' should be mutually complete;
        that is, whenever a target is set in terms of runs, the corresponding target
        overs must also be specified, meaning both columns should be non-null together
        or null together. We can express this constraint in Deequ as: .satisfies(''(target_runs
