prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \n    matches_path = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(matches_path)\n\
  \n    df['date'] = pd.to_datetime(df['date'], errors='coerce')\n    df['result_margin']\
  \ = pd.to_numeric(df['result_margin'], errors='coerce')\n    df['target_runs'] =\
  \ pd.to_numeric(df['target_runs'], errors='coerce')\n    df['target_overs'] = pd.to_numeric(df['target_overs'],\
  \ errors='coerce')\n    base_cols = ['id', 'season', 'date', 'winner', 'result',\
  \ 'result_margin', 'super_over', 'toss_winner', 'team1',\n                 'team2']\n\
  \    df_base = df[base_cols].copy()\n\n    t1 = df_base.copy()\n    t1['team'] =\
  \ t1['team1']\n    t1['opponent'] = t1['team2']\n    t2 = df_base.copy()\n    t2['team']\
  \ = t2['team2']\n    t2['opponent'] = t2['team1']\n\n    t1['is_winner'] = t1['winner']\
  \ == t1['team']\n    t2['is_winner'] = t2['winner'] == t2['team']\n\n    t1['toss_won']\
  \ = t1['toss_winner'] == t1['team']\n    t2['toss_won'] = t2['toss_winner'] == t2['team']\n\
  \n    t1['points'] = np.where(t1['result'] == 'no result', 1, np.where(t1['is_winner'],\
  \ 2, 0))\n    t2['points'] = np.where(t2['result'] == 'no result', 1, np.where(t2['is_winner'],\
  \ 2, 0))\n\n    t1['win_by_runs'] = np.where((t1['is_winner']) & (t1['result'] ==\
  \ 'runs'), t1['result_margin'], 0)\n    t2['win_by_runs'] = np.where((t2['is_winner'])\
  \ & (t2['result'] == 'runs'), t2['result_margin'], 0)\n\n    t1['win_by_wkts'] =\
  \ np.where((t1['is_winner']) & (t1['result'] == 'wickets'), t1['result_margin'],\
  \ 0)\n    t2['win_by_wkts'] = np.where((t2['is_winner']) & (t2['result'] == 'wickets'),\
  \ t2['result_margin'], 0)\n\n    long_df = pd.concat([t1, t2], ignore_index=True)\n\
  \n    long_df['played'] = 1\n    long_df['win'] = ((long_df['result'] != 'no result')\
  \ & long_df['is_winner']).astype(int)\n    long_df['loss'] = ((long_df['result']\
  \ != 'no result') & (~long_df['is_winner'])).astype(int)\n    long_df['tie'] = (long_df['result']\
  \ == 'tie').astype(int)\n    long_df['no_result'] = (long_df['result'] == 'no result').astype(int)\n\
  \    long_df['win_after_toss_win'] = ((long_df['toss_won']) & (long_df['win'] ==\
  \ 1)).astype(int)\n    long_df['toss_wins'] = long_df['toss_won'].astype(int)\n\n\
  \    agg = long_df.groupby(['season', 'team'], as_index=False).agg(\n        matches=('played',\
  \ 'sum'),\n        wins=('win', 'sum'),\n        losses=('loss', 'sum'),\n     \
  \   ties=('tie', 'sum'),\n        no_result=('no_result', 'sum'),\n        points=('points',\
  \ 'sum'),\n        toss_wins=('toss_wins', 'sum'),\n        wins_after_winning_toss=('win_after_toss_win',\
  \ 'sum'),\n        run_wins=('win_by_runs', lambda s: (s > 0).sum()),\n        wicket_wins=('win_by_wkts',\
  \ lambda s: (s > 0).sum()),\n        avg_run_margin=('win_by_runs', lambda s: s[s\
  \ > 0].mean() if (s > 0).any() else 0.0),\n        avg_wickets_remaining=('win_by_wkts',\
  \ lambda s: s[s > 0].mean() if (s > 0).any() else 0.0)\n    )\n\n    agg['points_per_match']\
  \ = agg['points'] / agg['matches'].replace(0, np.nan)\n    agg['points_per_match']\
  \ = agg['points_per_match'].fillna(0.0)\n\n    agg = agg.sort_values(['season',\
  \ 'points', 'wins', 'avg_run_margin', 'avg_wickets_remaining'],\n              \
  \            ascending=[True, False, False, False, False])\n\n    standings_path\
  \ = os.path.join(args.output, 'standings.csv')\n    agg.to_csv(standings_path, index=False)\n\
  \n    seasons = sorted(agg['season'].dropna().unique())\n    for s in seasons:\n\
  \        s_table = agg[agg['season'] == s].copy()\n        s_table = s_table.sort_values(['points',\
  \ 'wins', 'avg_run_margin', 'avg_wickets_remaining'],\n                        \
  \              ascending=[False, False, False, False])\n        top_teams = s_table.head(4)[['team',\
  \ 'points', 'wins', 'losses', 'no_result']].to_dict(orient='records')\n\n      \
  \  s_matches = df[df['season'] == s].copy()\n        s_matches = s_matches.sort_values('date')\n\
  \        total_games = len(s_matches)\n        tie_games = int((s_matches['result']\
  \ == 'tie').sum())\n        no_result_games = int((s_matches['result'] == 'no result').sum())\n\
  \n        dashboard = {\n            'season': str(s),\n            'total_games':\
  \ total_games,\n            'tie_games': tie_games,\n            'no_result_games':\
  \ no_result_games,\n            'top_teams': top_teams\n        }\n        s = s.replace(\"\
  /\", \"_\") if isinstance(s, str) else s\n        dash_path = os.path.join(args.output,\
  \ f'season_{s}_dashboard.json')\n        with open(dash_path, 'w') as f:\n     \
  \       json.dump(dashboard, f, indent=2)\n\n\nif __name__ == '__main__':\n    main()\n\
  \n```\n\nThe same program is on disk at `./code/general_task_1.py`, so you can run\
  \ it against the\nstaged table, step through it, or search it, rather than working\
  \ from the\nlisting alone.\n\n# The data\n\nThree rows sampled from the dataset\
  \ the program consumes:\n\n[{'id': 260, 'season': 2017, 'city': 'Bengaluru', 'date':\
  \ '2017-04-08', 'match_type': 'League', 'player_of_match': 'KM Jadhav', 'venue':\
  \ 'M.Chinnaswamy Stadium', 'team1': 'Royal Challengers Bangalore', 'team2': 'Delhi\
  \ Daredevils', 'toss_winner': 'Royal Challengers Bangalore', 'toss_decision': 'bat',\
  \ 'winner': 'Royal Challengers Bangalore', 'result': 'runs', 'result_margin': 15.0,\
  \ 'target_runs': 158.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan,\
  \ 'umpire1': 'S Ravi', 'umpire2': 'VK Sharma'}, {'id': 341, 'season': 2012, 'city':\
  \ 'Bangalore', 'date': '2012-04-15', 'match_type': 'League', 'player_of_match':\
  \ 'AM Rahane', 'venue': 'M Chinnaswamy Stadium', 'team1': 'Royal Challengers Bangalore',\
  \ 'team2': 'Rajasthan Royals', 'toss_winner': 'Rajasthan Royals', 'toss_decision':\
  \ 'bat', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin': 59.0,\
  \ 'target_runs': 196.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan,\
  \ 'umpire1': 'JD Cloete', 'umpire2': 'RJ Tucker'}, {'id': 47, 'season': 2024, 'city':\
  \ 'Ahmedabad', 'date': '2024-03-24', 'match_type': 'League', 'player_of_match':\
  \ 'B Sai Sudharsan', 'venue': 'Narendra Modi Stadium, Ahmedabad', 'team1': 'Gujarat\
  \ Titans', 'team2': 'Mumbai Indians', 'toss_winner': 'Mumbai Indians', 'toss_decision':\
  \ 'field', 'winner': 'Gujarat Titans', 'result': 'runs', 'result_margin': 6.0, 'target_runs':\
  \ 169.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'VA\
  \ Kulkarni', 'umpire2': 'VK Sharma'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
