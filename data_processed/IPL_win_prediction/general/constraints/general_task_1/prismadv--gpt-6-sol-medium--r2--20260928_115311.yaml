      source_assumptions:
      - 39ffc85e-27f6-4eda-884b-5fec0f86f0fa
    assumptions:
    - text: 'The presence of ''result_margin'' should match ''result'': matches decided
        by ''runs'' or ''wickets'' should have a non-null margin, while ''tie'' and
        ''no result'' matches should have a null margin. This is consistent with the
        six missing margins and six tie/no-result records in the dataset. A conditional
        constraint can check both cases.'
      sources:
      - start_line: 41
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
      uid: 66af2c76-11f8-43dd-bd52-24cf5368144e
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be a positive whole number. The code counts margins greater than zero as wins
        and uses those margins to calculate averages; zero or negative margins would
        silently be excluded. A constraint can check: result NOT IN (''runs'', ''wickets'')
        OR (result_margin > 0 AND result_margin = FLOOR(result_margin)).'
      sources:
      - start_line: 44
        end_line: 48
        file: ''
      - start_line: 69
        end_line: 72
        file: ''
      uid: 64412236-e630-4750-ac95-0fe685b97587
    - text: 'When ''result'' is ''wickets'', ''result_margin'' should be no greater
        than 10, because it represents wickets remaining. A conditional constraint
        can check: result != ''wickets'' OR result_margin <= 10.'
      sources:
      - start_line: 47
        end_line: 48
        file: ''
      - start_line: 70
        end_line: 72
        file: ''
      uid: 39ffc85e-27f6-4eda-884b-5fec0f86f0fa
