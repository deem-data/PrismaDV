      source_assumptions:
      - 8f6cfe7d-c1f0-4afd-9071-dd5712368852
    - suggestion: '.hasUniqueness([''season'', ''id''], lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 264dfc57-e54b-40ae-9562-2cd7276d63cd
      source_assumptions:
      - 78cab48e-6282-48e7-878d-2a02e855a619
    - suggestion: '.haveCompleteness([''season'', ''id''], lambda x: x == 1.0)'
