      source_assumptions:
      - 78cab48e-6282-48e7-878d-2a02e855a619
      - a5d331ea-30c8-433b-ad75-20c6750eec43
    - suggestion: '.satisfies(''to_date(`date`) IS NOT NULL AND year(to_date(`date`))
        = `season`'', ''date_matches_calendar_season'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9e5958f1-5611-4d88-b254-105eb562e3c8
      source_assumptions:
      - a5d331ea-30c8-433b-ad75-20c6750eec43
    assumptions:
    - text: 'Each match should identify two different teams: ''team1'' and ''team2''
        must both be present and must not be equal. The script creates one record
        for each side and would otherwise count a team twice for the same match.'
      sources:
      - start_line: 28
        end_line: 33
        file: ''
      - start_line: 50
        end_line: 60
        file: ''
      uid: 8f6cfe7d-c1f0-4afd-9071-dd5712368852
    - text: The combination of 'season' and 'id' should be unique across match records.
        A repeated match would be counted again in the season standings and dashboard,
        while this constraint permits IDs to be reused in different seasons. A suitable
        constraint is .isUnique(['season', 'id']).
      sources:
      - start_line: 24
        end_line: 26
        file: ''
      - start_line: 50
        end_line: 60
        file: ''
      - start_line: 91
        end_line: 95
        file: ''
      uid: 78cab48e-6282-48e7-878d-2a02e855a619
    - text: '''team1'' and ''team2'' should use the same canonical team-name domain:
        the same team must have the same spelling whichever column it appears in.
        Otherwise, the season-by-team aggregation can split one team''s results into
        separate entries.'
      sources:
      - start_line: 28
        end_line: 33
        file: ''
      - start_line: 60
        end_line: 73
        file: ''
      uid: 0ef3290a-6e11-4b01-8c1c-2dbd78f23084
    - text: For each match, 'date' should parse to a valid date associated with its
        'season'. If 'season' denotes a calendar year, year(date) should equal season;
        otherwise, date should fall within that season's defined date range. Invalid
        or mismatched dates undermine the chronological ordering of each season's
        matches.
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 91
        end_line: 93
        file: ''
      uid: a5d331ea-30c8-433b-ad75-20c6750eec43
  '["date","season"]':
    code:
    - suggestion: .satisfies('`season` IS NULL OR try_cast(`date` AS TIMESTAMP) IS
        NOT NULL', 'valid_date_for_season_matches')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dbe35bd9-36e8-44cb-9db0-afea221cbb76
      source_assumptions:
      - 75739fe2-35de-47df-a57f-86bdba76a794
    assumptions:
    - text: "Every match assigned to a non-null 'season' should have a 'date' that\
        \ parses to a valid timestamp. Otherwise, the match contributes to that season\u2019\
        s standings but cannot be placed reliably in the date-sorted season matches.\
        \ This can be checked with a conditional constraint: season IS NULL OR date\
        \ parses as a timestamp."
      sources:
      - start_line: 20
        end_line: 26
        file: ''
      - start_line: 91
        end_line: 93
        file: ''
      uid: 75739fe2-35de-47df-a57f-86bdba76a794
    - text: 'The numeric ordering of ''season'' should agree with match dates: matches
        in an earlier season should not occur after matches in a later season. This
        can be checked by verifying that, for every pair of seasons A < B, max(date
        where season = A) <= min(date where season = B).'
      sources:
      - start_line: 78
        end_line: 85
        file: ''
      - start_line: 91
        end_line: 93
        file: ''
      uid: e1d5309b-ea2d-4d41-b014-e84c3557d7ec
