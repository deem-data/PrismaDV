      \ have corresponding \"error\" level checks so corrupted data partitions can\
      \ be detected.\n- Set level \"warning\" ONLY if the code safely and intentionally\
      \ accommodates the condition without distorting final output metrics (e.g.,\
      \ benign missing values in non-critical columns).\nLink each check to the 0-based\
      \ indices of the assumptions it validates.\n\nCRITICAL SQL Guidelines for `.satisfies`:\n\
      - SQL 3-Valued Logic & NULL Handling: In SQL WHERE clauses, `NULL != 'val'`\
