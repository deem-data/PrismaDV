constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date, 'yyyy-MM-dd')
        IS NOT NULL", 'date_is_parseable')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  method, target_runs, target_overs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR (target_runs IS NOT NULL
        AND target_runs >= 0 AND target_overs IS NOT NULL AND target_overs > 0)",
        'dls_has_valid_target')
      - Valid
    assumptions: []
    column_name: method, target_runs, target_overs
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0)", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('season = CAST(season AS INT)', 'season_is_an_integer')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  super_over, result:
    code:
    - - .satisfies("super_over <> 'Y' OR result = 'tie'", 'super_over_requires_tie')
      - Valid
    assumptions: []
    column_name: super_over, result
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'fixture_has_distinct_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR winner IS NOT
        NULL", 'league_result_has_winner')
      - Valid
    assumptions: []
    column_name: winner
  winner, team1, team2:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR winner IN (team1,
        team2)", 'league_winner_is_fixture_team')
      - Valid
    assumptions: []
    column_name: winner, team1, team2
