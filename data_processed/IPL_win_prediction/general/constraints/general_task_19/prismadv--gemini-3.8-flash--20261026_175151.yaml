    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be non-null and greater than 0, indicating the margin of victory. Conversely,
        when ''result'' is ''tie'' or ''no result'', ''result_margin'' should be null.
        This can be expressed as a constraint: .satisfies("(result IN (''runs'', ''wickets'')
        AND result_margin IS NOT NULL AND result_margin > 0) OR (result IN (''tie'',
        ''no result'') AND result_margin IS NULL)", "result_margin_validity_by_result")'
      sources:
      - start_line: 39
        end_line: 51
        file: ''
      uid: d62a080e-156c-4a0d-8638-c33b5b487f81
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'If a match has a super over (''super_over'' == ''Y''), its ''result''
        must be ''tie''. We could represent this assumption as a Deequ constraint
        like: .satisfies("super_over != ''Y'' OR result = ''tie''", "Super over matches
