      source_assumptions:
      - 3285a173-e2fa-41fe-bce1-f82618f072e4
    assumptions:
    - text: 'When ''winner'' is specified, it must be either ''team1'' or ''team2''.
        The downstream logic identifies the loser or opponent by assuming that if
        the winner is ''team1'', then ''team2'' is the loser/opponent, and vice versa.
        This can be expressed as a Deequ constraint: .satisfies("winner IS NULL OR
        winner = team1 OR winner = team2", "Winner must be one of the two competing
        teams")'
      sources:
      - start_line: 30
        end_line: 30
        file: ''
      - start_line: 48
        end_line: 53
        file: ''
      - start_line: 73
        end_line: 74
        file: ''
      uid: 872dc5a3-714f-476c-986e-857616a6e56b
    - text: 'For each match, ''team1'' and ''team2'' must be distinct teams (''team1''
        != ''team2''). The logic for determining the loser assumes that a match is
        played between two different teams so that taking the other team yields the
        true opposing team. This can be expressed as a Deequ constraint: .satisfies("team1
        != team2", "Teams in a match must be distinct")'
      sources:
      - start_line: 49
        end_line: 53
        file: ''
      - start_line: 74
        end_line: 74
        file: ''
      uid: 3285a173-e2fa-41fe-bce1-f82618f072e4
