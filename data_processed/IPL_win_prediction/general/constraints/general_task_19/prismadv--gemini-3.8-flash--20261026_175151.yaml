prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies("year(to_date(`date`)) == cast(`season` as int)", "SeasonMatchesDateYear")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2cf255a5-8b8d-4ba6-86df-59ffe44897a8
      source_assumptions:
      - 919906d5-71fb-41c4-b8fe-b05c5d8ed6e8
    assumptions:
    - text: 'The year extracted from the ''date'' column should match the ''season''
        column, as matches played in a given season take place in the corresponding
        year. We could represent this assumption as a Deequ constraint like: .satisfies("year(to_date(date))
        == cast(season as int)", "SeasonMatchesDateYear")'
      sources:
      - start_line: 20
        end_line: 23
        file: ''
      uid: 919906d5-71fb-41c4-b8fe-b05c5d8ed6e8
  '["method","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies("CASE WHEN `method` = 'D/L' THEN `target_runs` IS NOT
        NULL AND `target_overs` IS NOT NULL AND `target_overs` > 0 ELSE TRUE END",
        "DL_targets_valid")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 92d9e1a0-0fe9-4539-8e7b-ce9ca1af74b7
      source_assumptions:
      - c2c19e44-5abb-4949-bf31-54bd674c7a33
    assumptions:
    - text: 'When ''method'' is ''D/L'', both ''target_runs'' and ''target_overs''
        must not be null, and ''target_overs'' must be greater than 0 to allow computing
        the required run rate (rrr = target_runs / target_overs) without division
        by zero. This can be expressed in Deequ as: .satisfies("CASE WHEN method =
        ''D/L'' THEN target_runs IS NOT NULL AND target_overs IS NOT NULL AND target_overs
        > 0 ELSE TRUE END", ''DL_targets_valid'')'
      sources:
      - start_line: 33
        end_line: 34
        file: ''
      - start_line: 44
        end_line: 47
        file: ''
      uid: c2c19e44-5abb-4949-bf31-54bd674c7a33
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("(`result` IN ('runs', 'wickets') AND `result_margin`
        IS NOT NULL AND `result_margin` > 0) OR (`result` IN ('tie', 'no result')
        AND `result_margin` IS NULL)", "result_margin_validity_by_result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2a62359b-f783-47ce-9a3e-eca206a959f9
      source_assumptions:
