  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League', 'Final', 'Qualifier 1', 'Qualifier
        2', 'Eliminator', 'Elimination Final', 'Semi Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isNonNegative('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("super_over = 'N' OR result = 'tie'", 'super_over_requires_tied_result')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("method != 'D/L' OR (target_overs IS NOT NULL AND target_overs
        > 0)", 'dl_target_overs_valid')
      - Invalid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['field', 'bat'])
      - Valid
    assumptions: []
    column_name: toss_decision
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("result = 'no result' OR winner IS NOT NULL", 'winner_present_when_result_exists')
      - Valid
    - - .satisfies("winner IS NULL OR winner = team1 OR winner = team2", 'winner_must_be_competing_team')
      - Valid
    assumptions: []
    column_name: winner
