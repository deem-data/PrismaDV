    ir_generation: "markdown\n# Data Quality Constraint Generation Instructions\n\n\
      You are an expert data quality and pipeline validation assistant. Your task\
      \ is to generate data quality verification constraints (using PyDeequ / Deequ\
      \ constraint syntax) for a specified `target_column` by analyzing its profiling\
      \ statistics (`target_column_desc`), usage in the pipeline (`code_snippet`),\
      \ and the provided `assumptions`.\n\n---\n\n## 1. Output Format\nReturn valid\
      \ JSON adhering to the following structure:\n```json\n{\n  \"constraint_code\"\
      : [\n    {\n      \"suggestion\": \".isComplete('column_name')\",\n      \"\
      level\": \"error\",\n      \"linked assumptions\": [0]\n    },\n    {\n    \
      \  \"suggestion\": \".hasDataType('column_name', ConstrainableDataTypes.String)\"\
      ,\n      \"level\": \"error\",\n      \"linked assumptions\": [1]\n    },\n\
      \    {\n      \"suggestion\": \".satisfies('column_name IS NULL OR column_name\
      \ > 0', 'column_name_positive')\",\n      \"level\": \"warning\",\n      \"\
      linked assumptions\": [2]\n    }\n  ]\n}\n```\n\n---\n\n## 2. PyDeequ / Deequ\
      \ Constraint API Reference\n\nUse standard PyDeequ methods for `suggestion`:\n\
      - **Completeness**:\n  - `.isComplete('column')` — Column must contain 0% nulls.\n\
      \  - `.hasCompleteness('column', lambda x: x >= threshold)` — Column completeness\
      \ must meet a threshold.\n- **Data Types**:\n  - `.hasDataType('column', ConstrainableDataTypes.String)`\
      \ (Note: use `String`, **not** `StringType`)\n  - `.hasDataType('column', ConstrainableDataTypes.Integral)`\n\
      \  - `.hasDataType('column', ConstrainableDataTypes.Fractional)`\n  - `.hasDataType('column',\
