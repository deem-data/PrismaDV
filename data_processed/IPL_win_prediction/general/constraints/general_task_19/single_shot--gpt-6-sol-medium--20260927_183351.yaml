constraints:
  date:
    code:
    - - .satisfies("`date` IS NOT NULL AND to_date(`date`, 'yyyy-MM-dd') IS NOT NULL",
        'valid_date')
      - Valid
    assumptions: []
    column_name: date
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .satisfies("`method` IS NULL OR `method` = 'D/L'", 'valid_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin` IS NOT
        NULL AND `result_margin` > 0)", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .satisfies("`season` IS NOT NULL AND CAST(`season` AS STRING) RLIKE '^[0-9]{4}$'",
        'valid_season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("`super_over` <> 'Y' OR `result` = 'tie'", 'super_over_requires_tie')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("`method` IS NULL OR `method` <> 'D/L' OR (`target_overs` IS NOT
        NULL AND `target_overs` > 0)", 'dls_has_positive_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("`method` IS NULL OR `method` <> 'D/L' OR (`target_runs` IS NOT
        NULL AND `target_runs` > 0)", 'dls_has_positive_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('`team1` <> `team2`', 'distinct_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("`match_type` <> 'League' OR `result` = 'no result' OR `winner`
        IN (`team1`, `team2`)", 'league_winner_is_participant')
      - Valid
    - - .satisfies("`match_type` <> 'League' OR `result` = 'no result' OR `winner`
        IS NOT NULL", 'league_result_has_winner')
      - Valid
    assumptions: []
    column_name: winner
