      - 03ff4ed8-ad87-41be-a153-ad25f535b894
    assumptions:
    - text: 'The ''season'' column should match the calendar year extracted from the
        ''date'' column for each record. We could represent this assumption as a Deequ
        constraint like this: .satisfies(''year(cast(date as timestamp)) == cast(season
        as int)'', ''Season matches date year'')'
      sources:
      - start_line: 20
        end_line: 23
        file: ''
      uid: 03ff4ed8-ad87-41be-a153-ad25f535b894
  '["method","target_overs","target_runs"]':
    code: []
    assumptions:
    - text: When 'method' is 'D/L', 'target_overs' must be greater than 0 so that
        computing the required run rate ('target_runs' / 'target_overs') does not
        result in a division by zero error, and both 'target_runs' and 'target_overs'
        should be non-null positive numbers.
      sources:
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 44
        end_line: 47
        file: ''
      uid: 60caac5b-75c6-4482-a68c-dcabbd41d615
