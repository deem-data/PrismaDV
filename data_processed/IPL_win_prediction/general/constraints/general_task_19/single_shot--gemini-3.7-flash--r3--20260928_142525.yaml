    column_name: toss_decision
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("winner IS NULL OR winner = team1 OR winner = team2", "WinnerMustBeOneOfTeams")
      - Valid
    assumptions: []
    column_name: winner
