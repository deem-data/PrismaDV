prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_file = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    df = pd.read_csv(input_file)\n\n    # Basic typing and derived\
  \ fields\n    df['date'] = pd.to_datetime(df['date'], errors='coerce')\n    season_numeric\
  \ = pd.to_numeric(df['season'], errors='coerce')\n    year_from_date = df['date'].dt.year\n\
  \    df['season'] = season_numeric.astype(int)\n\n    # Only League matches contribute\
  \ to standings; summaries will be produced for all matches\n    league_df = df[df['match_type']\
  \ == 'League'].copy()\n    # Winner presence depending on result\n    non_nr = league_df[league_df['result']\
  \ != 'no result']\n    # ASSERT winner present where a result exists\n    # ASSERT\
  \ winner must be one of the two teams in the fixture\n    tie_nr = league_df[league_df['result'].isin(['tie',\
  \ 'no result'])]\n    # ASSERT super_over implies a tied result prior to super over\
  \ resolution\n    # For D/L method, ensure target_overs are valid before computing\
  \ derived metrics\n    dls = df[df['method'] == 'D/L']\n    # Build post-match summaries\
  \ (all matches)\n    def summarize_row(row: pd.Series) -> str:\n        t1 = row['team1']\n\
  \        t2 = row['team2']\n        res = row['result']\n        w = row['winner']\
  \ if pd.notna(row['winner']) else None\n        date_str = row['date'].date().isoformat()\
  \ if not pd.isna(row['date']) else str(row['date'])\n        venue = row['venue']\n\
  \        add = ''\n        if row.get('method') == 'D/L' and pd.notna(row.get('target_runs'))\
  \ and pd.notna(row.get('target_overs')):\n            # Safe because of D/L assertions\
  \ above\n            rrr = row['target_runs'] / row['target_overs']\n          \
  \  add = f\" (DLS target {int(row['target_runs'])} in {int(row['target_overs'])}\
  \ overs, req RR {rrr:.2f})\"\n        if res in ('runs', 'wickets') and pd.notna(row['result_margin'])\
  \ and w is not None:\n            loser = t2 if w == t1 else t1\n            margin\
  \ = int(row['result_margin'])\n            return f\"{date_str}: {w} beat {loser}\
  \ by {margin} {res} at {venue}{add}\"\n        elif res == 'tie' and w is not None:\n\
  \            opponent = t2 if w == t1 else t1\n            if row.get('super_over')\
  \ == 'Y':\n                return f\"{date_str}: {w} won via Super Over after tie\
  \ vs {opponent} at {venue}{add}\"\n            else:\n                return f\"\
  {date_str}: {t1} tied with {t2} at {venue}; winner adjudicated as {w}{add}\"\n \
  \       elif res == 'no result':\n            return f\"{date_str}: {t1} vs {t2}\
  \ was abandoned at {venue}{add}\"\n        else:\n            # Fallback if unexpected\
  \ combination slips through (should be gated by assertions)\n            return\
  \ f\"{date_str}: {t1} vs {t2} concluded; outcome recorded as '{res}' at {venue}{add}\"\
  \n\n    summaries = df.copy()\n    summaries['summary'] = summaries.apply(summarize_row,\
  \ axis=1)\n    summaries[['id', 'season', 'date', 'team1', 'team2', 'winner', 'result',\
  \ 'result_margin', 'super_over', 'method',\n               'summary']].to_csv(\n\
  \        os.path.join(args.output, 'post_match_summaries.csv'), index=False\n  \
  \  )\n\n    # Compute league points and standings (League matches only)\n    # Prepare\
  \ winner and loser mapping (safe because of winner assertions above)\n    non_nr\
  \ = league_df[league_df['result'] != 'no result'].copy()\n    non_nr['loser'] =\
  \ np.where(non_nr['winner'] == non_nr['team1'], non_nr['team2'], non_nr['team1'])\n\
  \n    win_tx = non_nr[['season', 'winner']].copy()\n    win_tx['team'] = win_tx['winner']\n\
  \    win_tx = win_tx.drop(columns=['winner'])\n    win_tx['win'] = 1\n    win_tx['loss']\
  \ = 0\n    win_tx['nr'] = 0\n    win_tx['points'] = 2\n\n    lose_tx = non_nr[['season',\
  \ 'loser']].copy()\n    lose_tx['team'] = lose_tx['loser']\n    lose_tx = lose_tx.drop(columns=['loser'])\n\
  \    lose_tx['win'] = 0\n    lose_tx['loss'] = 1\n    lose_tx['nr'] = 0\n    lose_tx['points']\
  \ = 0\n\n    nr_tx_t1 = league_df[league_df['result'] == 'no result'][['season',\
  \ 'team1']].copy()\n    nr_tx_t1['team'] = nr_tx_t1['team1']\n    nr_tx_t1 = nr_tx_t1.drop(columns=['team1'])\n\
  \    nr_tx_t1['win'] = 0\n    nr_tx_t1['loss'] = 0\n    nr_tx_t1['nr'] = 1\n   \
  \ nr_tx_t1['points'] = 1\n\n    nr_tx_t2 = league_df[league_df['result'] == 'no\
  \ result'][['season', 'team2']].copy()\n    nr_tx_t2['team'] = nr_tx_t2['team2']\n\
  \    nr_tx_t2 = nr_tx_t2.drop(columns=['team2'])\n    nr_tx_t2['win'] = 0\n    nr_tx_t2['loss']\
  \ = 0\n    nr_tx_t2['nr'] = 1\n    nr_tx_t2['points'] = 1\n\n    tx = pd.concat([win_tx,\
  \ lose_tx, nr_tx_t1, nr_tx_t2], ignore_index=True)\n\n    standings = tx.groupby(['season',\
  \ 'team'], as_index=False).agg(\n        wins=('win', 'sum'),\n        losses=('loss',\
  \ 'sum'),\n        no_results=('nr', 'sum'),\n        points=('points', 'sum')\n\
  \    )\n    standings['matches'] = standings['wins'] + standings['losses'] + standings['no_results']\n\
  \n    # Sort standings by season, then points desc, then wins desc\n    standings\
  \ = standings.sort_values(by=['season', 'points', 'wins'], ascending=[True, False,\
  \ False])\n\n    standings.to_csv(os.path.join(args.output, 'league_standings.csv'),\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_19.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 260, 'season': 2017, 'city': 'Bengaluru', 'date': '2017-04-08', 'match_type':\
  \ 'League', 'player_of_match': 'KM Jadhav', 'venue': 'M.Chinnaswamy Stadium', 'team1':\
  \ 'Royal Challengers Bangalore', 'team2': 'Delhi Daredevils', 'toss_winner': 'Royal\
  \ Challengers Bangalore', 'toss_decision': 'bat', 'winner': 'Royal Challengers Bangalore',\
  \ 'result': 'runs', 'result_margin': 15.0, 'target_runs': 158.0, 'target_overs':\
  \ 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'S Ravi', 'umpire2': 'VK Sharma'},\
  \ {'id': 341, 'season': 2012, 'city': 'Bangalore', 'date': '2012-04-15', 'match_type':\
  \ 'League', 'player_of_match': 'AM Rahane', 'venue': 'M Chinnaswamy Stadium', 'team1':\
  \ 'Royal Challengers Bangalore', 'team2': 'Rajasthan Royals', 'toss_winner': 'Rajasthan\
  \ Royals', 'toss_decision': 'bat', 'winner': 'Rajasthan Royals', 'result': 'runs',\
  \ 'result_margin': 59.0, 'target_runs': 196.0, 'target_overs': 20.0, 'super_over':\
  \ 'N', 'method': nan, 'umpire1': 'JD Cloete', 'umpire2': 'RJ Tucker'}, {'id': 47,\
  \ 'season': 2024, 'city': 'Ahmedabad', 'date': '2024-03-24', 'match_type': 'League',\
  \ 'player_of_match': 'B Sai Sudharsan', 'venue': 'Narendra Modi Stadium, Ahmedabad',\
  \ 'team1': 'Gujarat Titans', 'team2': 'Mumbai Indians', 'toss_winner': 'Mumbai Indians',\
  \ 'toss_decision': 'field', 'winner': 'Gujarat Titans', 'result': 'runs', 'result_margin':\
  \ 6.0, 'target_runs': 169.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'VA Kulkarni', 'umpire2': 'VK Sharma'}]\n\nThe full table is on\
  \ disk at `./data/tables/observed_data.csv`. You have complete access to it:\nload\
  \ it with pandas, profile it, plot it, run whatever analysis helps. It is a\nthrowaway\
  \ copy -- nothing you do to it has any effect outside this workspace.\n\n# Verifying\
  \ your constraints\n\nYou can execute PyDeequ constraint code against the staged\
  \ table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
