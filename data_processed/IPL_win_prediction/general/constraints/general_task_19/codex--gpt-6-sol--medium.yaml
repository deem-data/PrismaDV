    'season_matches_match_year')
- column_name: match_type
  code_for_constraint: .isComplete('match_type')
- column_name: match_type
  code_for_constraint: .isContainedIn('match_type', ['League', 'Final', 'Qualifier
    1', 'Qualifier 2', 'Eliminator', 'Elimination Final', 'Semi Final'])
- column_name: team1
  code_for_constraint: .isComplete('team1')
- column_name: team2
  code_for_constraint: .isComplete('team2')
- column_name: team2
  code_for_constraint: .satisfies('team1 <> team2', 'fixture_has_distinct_teams')
- column_name: venue
  code_for_constraint: .isComplete('venue')
- column_name: result
  code_for_constraint: .isComplete('result')
- column_name: result
  code_for_constraint: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN match_type = 'League' AND result <> 'no
    result' THEN winner IS NOT NULL ELSE true END", 'decided_league_match_has_winner')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN result <> 'no result' THEN winner = team1
    OR winner = team2 ELSE true END", 'decided_match_winner_is_participant')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN result IN ('runs', 'wickets', 'tie')
    THEN winner IS NOT NULL ELSE true END", 'decided_match_summary_has_winner')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN result IN ('runs', 'wickets') THEN result_margin
    IS NOT NULL AND result_margin > 0 AND result_margin = CAST(result_margin AS INT)
    ELSE true END", 'decided_match_has_integral_positive_margin')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN result = 'wickets' THEN result_margin
    <= 10 ELSE true END", 'wicket_margin_at_most_ten')
- column_name: super_over
  code_for_constraint: .isComplete('super_over')
- column_name: super_over
  code_for_constraint: .isContainedIn('super_over', ['Y', 'N'])
- column_name: super_over
  code_for_constraint: .satisfies("CASE WHEN super_over = 'Y' THEN result = 'tie'
    ELSE true END", 'super_over_requires_tie')
- column_name: target_runs
  code_for_constraint: .satisfies("CASE WHEN method = 'D/L' THEN target_runs IS NOT
    NULL AND target_runs > 0 ELSE true END", 'dls_target_runs_positive')
- column_name: target_runs
  code_for_constraint: .satisfies("CASE WHEN method = 'D/L' THEN target_runs = CAST(target_runs
    AS INT) ELSE true END", 'dls_target_runs_is_integral')
- column_name: target_overs
  code_for_constraint: .satisfies("CASE WHEN method = 'D/L' THEN target_overs IS NOT
    NULL AND target_overs > 0 ELSE true END", 'dls_target_overs_positive')
