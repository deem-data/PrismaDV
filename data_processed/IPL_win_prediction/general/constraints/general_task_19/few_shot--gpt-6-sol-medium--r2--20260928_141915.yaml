constraints:
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0)", 'decisive_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('season = CAST(season AS INT)', 'season_is_an_integer')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("super_over <> 'Y' OR result = 'tie'", 'super_over_requires_tie')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR (target_runs IS NOT NULL
        AND target_overs IS NOT NULL AND target_overs > 0)", 'dls_has_valid_target')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("result = 'no result' OR winner IS NOT NULL", 'winner_present_when_result_exists')
      - Valid
    - - .satisfies('winner IS NULL OR winner = team1 OR winner = team2', 'winner_is_fixture_team')
      - Valid
    assumptions: []
    column_name: winner
