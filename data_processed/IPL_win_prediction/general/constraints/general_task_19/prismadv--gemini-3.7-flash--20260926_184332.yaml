prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The ''season'' column corresponds to the year in which the match took
        place, so the year component of ''date'' should match ''season'' (or both
        should be non-null and temporally consistent). We could represent this assumption
        as a Deequ constraint like: .satisfies("CAST(season AS INT) == EXTRACT(YEAR
        FROM CAST(date AS DATE))", "season_equals_match_year")'
      sources:
      - start_line: 20
        end_line: 23
        file: ''
      uid: 359b3dcf-b59b-4b34-8516-4f15486b1f70
  '["method","target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'When ''method'' is ''D/L'', ''target_overs'' must be greater than 0 to
        ensure valid calculation of required run rate without division by zero. We
        could represent this assumption as a deequ constraint like this: .satisfies("method
        != ''D/L'' OR (target_overs IS NOT NULL AND target_overs > 0)", "target_overs_positive_for_dl")'
      sources:
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 44
        end_line: 47
        file: ''
      uid: 45ddf3c5-8877-4c92-8c3c-09ad7b8e1e65
    - text: 'When ''method'' is ''D/L'', both ''target_runs'' and ''target_overs''
        should be non-null so that the DLS target summary and required run rate can
        be computed. We could represent this assumption as a deequ constraint like
        this: .satisfies("method != ''D/L'' OR (target_runs IS NOT NULL AND target_overs
        IS NOT NULL)", "targets_present_when_dl")'
      sources:
      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 44
        end_line: 47
        file: ''
      uid: e0ffa32a-9136-40f6-a88d-2962c3f1ba43
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        not be null and should have a non-negative numeric value representing the
        victory margin. We could represent this assumption as a deequ constraint like
        this: .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin
        IS NOT NULL AND result_margin >= 0)", "result_margin_not_null_for_runs_or_wickets")'
      sources:
      - start_line: 39
        end_line: 39
        file: ''
      - start_line: 48
        end_line: 51
        file: ''
      uid: 64a8e47c-8e37-4342-8810-5db162cc11f3
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("`super_over` != 'Y' OR `result` = 'tie'", "super_over_implies_tie")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: acde43ad-7fd0-4a15-b6a6-ff318696cfb7
      source_assumptions:
      - 83ba4153-ed43-44e5-b8e3-61ed42cdce91
    assumptions:
    - text: 'If a match has a super over (''super_over'' is ''Y''), then the ''result''
        column must be ''tie''. This conditional dependency can be expressed as a
        Deequ constraint: .satisfies("super_over != ''Y'' OR result == ''tie''", "super_over_implies_tie").'
      sources:
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 52
        end_line: 56
        file: ''
      uid: 83ba4153-ed43-44e5-b8e3-61ed42cdce91
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' is not ''no result'' (such as ''runs'', ''wickets'',
        or ''tie''), the ''winner'' column must not be null. We could represent this
        assumption as a Deequ constraint like: .satisfies("result == ''no result''
        OR winner IS NOT NULL", "winner_present_when_result_exists")'
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 73
        end_line: 78
        file: ''
      uid: 2a2064cd-2d41-4c3f-94bd-74084fc04b78
  '["target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'When computing the required run rate (''target_runs / target_overs''),
        ''target_overs'' must be strictly greater than 0 whenever both ''target_runs''
        and ''target_overs'' are non-null to prevent division by zero. We could represent
        this assumption as a Deequ constraint like: .satisfies("target_overs IS NULL
        OR target_runs IS NULL OR target_overs > 0", "target_overs_positive_for_run_rate")'
      sources:
      - start_line: 44
        end_line: 47
        file: ''
      uid: e0cbcb90-0a9a-4e5c-b5bc-4c005130faa9
    - text: '''target_runs'' and ''target_overs'' are expected to co-occur; whenever
        ''target_runs'' is populated, ''target_overs'' should also be populated and
        vice versa. We could represent this assumption as a Deequ constraint like:
        .satisfies("(target_runs IS NULL AND target_overs IS NULL) OR (target_runs
        IS NOT NULL AND target_overs IS NOT NULL)", "target_runs_target_overs_co_occurrence")'
      sources:
      - start_line: 44
        end_line: 47
        file: ''
      uid: bb469d9c-8a6d-4d9b-8fda-82a2c6665af4
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When ''winner'' is not null, its value must be equal to either ''team1''
        or ''team2''. We could represent this assumption as a Deequ constraint or
        custom verification: .satisfies(''winner IS NULL OR winner = team1 OR winner
