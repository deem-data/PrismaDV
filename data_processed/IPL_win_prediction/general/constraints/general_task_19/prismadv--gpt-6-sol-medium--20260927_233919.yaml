      - start_line: 26
        end_line: 30
        file: ''
      - start_line: 73
        end_line: 82
        file: ''
      uid: 8da7584c-80cb-4cc2-b31d-94ee302a55c0
    - text: 'Whenever winner is present, it must equal team1 or team2. The summaries
        and league standings treat the other fixture team as the loser. Deequ: .satisfies("`winner`
        IS NULL OR `winner` = `team1` OR `winner` = `team2`", "winner_is_fixture_team")'
      sources:
      - start_line: 37
        end_line: 57
        file: ''
      - start_line: 72
        end_line: 74
        file: ''
      uid: f2a9e7af-be40-4bb5-979e-c0702bc79fa6
    - text: 'A match with result ''no result'' should have a null winner. Such matches
        are summarized as abandoned and give both League teams a no-result point rather
        than a win. Deequ: .satisfies("`result` != ''no result'' OR `winner` IS NULL",
