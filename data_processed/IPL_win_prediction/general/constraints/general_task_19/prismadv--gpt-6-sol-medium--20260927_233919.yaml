      source_assumptions:
      - 258e7360-5fb6-44b2-98dd-2df2ca56683f
    assumptions:
    - text: 'For every League match whose result is not ''no result'', winner must
        be non-null. Otherwise the standings assign a win to a missing team. Deequ:
        .satisfies("`match_type` != ''League'' OR `result` = ''no result'' OR `winner`
        IS NOT NULL", "league_decided_match_has_winner")'
