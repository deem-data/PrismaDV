      sources:
      - start_line: 58
        end_line: 59
        file: ''
      - start_line: 92
        end_line: 106
        file: ''
      uid: 6c97313a-e377-456d-a143-a2598886ace0
    - text: 'For League matches, result must be one of ''runs'', ''wickets'', ''tie'',
        or ''no result''. The standings treat every result other than ''no result''
        as a win and a loss, so an unrecognized result would be scored incorrectly.
