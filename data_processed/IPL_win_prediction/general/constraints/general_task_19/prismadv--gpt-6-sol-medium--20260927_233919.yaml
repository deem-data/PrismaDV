        ''tie'', ''no result'')", "recognized_league_result")'
      sources:
      - start_line: 26
        end_line: 31
        file: ''
      - start_line: 73
        end_line: 90
        file: ''
      - start_line: 92
        end_line: 106
        file: ''
      uid: 258e7360-5fb6-44b2-98dd-2df2ca56683f
