    assumptions:
    - text: For every match, 'season' should equal the calendar year of its parsed
        'date'. Otherwise, a match could be assigned to the wrong season in the summaries
        and league standings. This can be checked with a row-level constraint such
        as `.satisfies("year(to_date(date)) = season", "date_matches_season")`, using
        a date parser compatible with the input format.
