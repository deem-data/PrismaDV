      source_assumptions:
      - 68aec799-8de8-4f2b-b71b-b5865d4343d4
    assumptions:
    - text: For every match, 'team1' and 'team2' should be different non-null teams.
        Otherwise, the summaries could describe a team playing itself, and a League
        match could generate standings transactions for the same team on both sides.
        This can be checked with a row-level constraint that team1 IS NOT NULL AND
        team2 IS NOT NULL AND team1 <> team2.
      sources:
      - start_line: 37
        end_line: 59
        file: ''
      - start_line: 73
        end_line: 105
        file: ''
      uid: 8c1971e6-1dea-484f-a763-a94fb7f04964
    - text: 'For every match whose ''result'' is ''runs'', ''wickets'', or ''tie'',
        ''winner'' should be non-null and equal to either ''team1'' or ''team2''.
        The summaries use the winner to identify the opponent, and League standings
        award the winner a win and the other team a loss. This can be checked with
        a conditional row-level constraint: result NOT IN (''runs'', ''wickets'',
        ''tie'') OR (winner IS NOT NULL AND winner IN (team1, team2)).'
      sources:
      - start_line: 26
        end_line: 31
        file: ''
      - start_line: 37
        end_line: 57
        file: ''
      - start_line: 73
        end_line: 90
        file: ''
      uid: db0fb859-2622-4a48-8af4-3dba50c23322
    - text: 'For a League match with ''result'' equal to ''no result'', ''winner''
        should be null. Such matches give each participating team one no-result point
        rather than recording a win or loss. This can be checked with a conditional
        row-level constraint: match_type <> ''League'' OR result <> ''no result''
        OR winner IS NULL.'
      sources:
      - start_line: 26
        end_line: 31
        file: ''
      - start_line: 92
        end_line: 106
        file: ''
      uid: 68aec799-8de8-4f2b-b71b-b5865d4343d4
