      reason_if_invalid: ''
      level: warning
      uid: 2b10ab5a-6ec9-4593-88a4-2f18987d1f3c
      source_assumptions:
      - b47258f2-f06d-451c-aff5-a97325099992
    assumptions:
    - text: For every match, 'date' should parse to a valid calendar date, and its
        year should equal the integer 'season'. The code derives the year from 'date'
        but groups standings by 'season', so a mismatch would assign a match to the
        wrong season. This can be checked with a row-level constraint such as `date
        IS NOT NULL AND to_date(date) IS NOT NULL AND CAST(season AS INT) = year(to_date(date))`,
        using the input date format when parsing.
      sources:
      - start_line: 20
        end_line: 23
        file: ''
      - start_line: 108
        end_line: 115
        file: ''
      uid: b47258f2-f06d-451c-aff5-a97325099992
  '["match_type","result","season","team1","team2","winner"]':
