constraints:
  constraints:
    date:
      code:
      - - .satisfies('`date` IS NOT NULL AND TRY_CAST(`date` AS DATE) IS NOT NULL',
          'date must be parseable')
        - Valid
      assumptions: []
      column_name: date
    id:
      code:
      - - .isComplete('id')
        - Valid
      - - .isUnique('id')
        - Valid
      assumptions: []
      column_name: id
    match_type:
      code:
      - - .satisfies('`match_type` IS NOT NULL AND LENGTH(TRIM(`match_type`)) > 0',
          'match type present')
        - Valid
      assumptions: []
      column_name: match_type
    method:
      code:
      - - .satisfies("`method` IS NULL OR `method` = 'D/L'", 'method must be recognized')
        - Valid
      assumptions: []
      column_name: method
    result:
      code:
      - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("`result` NOT IN ('runs', 'wickets') OR (TRY_CAST(`result_margin`
          AS DOUBLE) > 0 AND TRY_CAST(`result_margin` AS DOUBLE) = TRY_CAST(`result_margin`
          AS BIGINT))", 'decided margin is positive integer')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .satisfies('YEAR(TRY_CAST(`date` AS DATE)) = TRY_CAST(`season` AS INT)',
          'season agrees with match date')
        - Valid
      - - .satisfies('`season` IS NOT NULL AND TRY_CAST(`season` AS DOUBLE) IS NOT
          NULL AND TRY_CAST(`season` AS DOUBLE) = TRY_CAST(`season` AS BIGINT)', 'season
          must be an integer')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      - - .satisfies("`super_over` <> 'Y' OR `result` = 'tie'", 'super over follows
          tie')
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies('`method` IS NULL OR TRY_CAST(`target_overs` AS DOUBLE) > 0',
          'D/L target overs positive')
        - Valid
      assumptions: []
      column_name: target_overs
    target_runs:
      code:
      - - .satisfies('`method` IS NULL OR (TRY_CAST(`target_runs` AS DOUBLE) > 0 AND
          TRY_CAST(`target_runs` AS DOUBLE) = TRY_CAST(`target_runs` AS BIGINT))',
          'D/L target runs valid')
        - Valid
      assumptions: []
      column_name: target_runs
    team1:
      code:
      - - .satisfies('`team1` IS NOT NULL AND LENGTH(TRIM(`team1`)) > 0', 'first team
          present')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .satisfies('`team2` IS NOT NULL AND LENGTH(TRIM(`team2`)) > 0 AND `team2`
          <> `team1`', 'second team distinct and present')
        - Valid
      assumptions: []
      column_name: team2
    venue:
      code:
      - - .satisfies('`venue` IS NOT NULL AND LENGTH(TRIM(`venue`)) > 0', 'summary
          venue present')
        - Valid
      assumptions: []
      column_name: venue
    winner:
      code:
      - - .satisfies("`result` = 'no result' OR (`winner` IS NOT NULL AND LENGTH(TRIM(`winner`))
          > 0)", 'decided match has winner')
        - Valid
      - - .satisfies('`winner` IS NULL OR `winner` = `team1` OR `winner` = `team2`',
          'winner plays in fixture')
        - Valid
      assumptions: []
      column_name: winner
