    assumptions:
    - text: For every input row where match_type is 'League' and result is not 'no
        result', winner must be non-null. The standings assign a win and two points
        to winner without filling missing values.
      sources:
      - start_line: 26
        end_line: 30
        file: ''
      - start_line: 73
        end_line: 82
        file: ''
      uid: 97e20e5e-29c8-4ee9-a94b-0ca3e94d1e4c
    - text: For every input row where match_type is 'League' and result is not 'no
        result', winner must equal either team1 or team2. Otherwise, the loser mapping
        and standings will credit the wrong teams.
