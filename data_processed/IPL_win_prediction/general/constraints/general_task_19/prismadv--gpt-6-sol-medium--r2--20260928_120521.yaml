    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND (`result` IS NULL
        OR `result` <> 'no result') THEN CASE WHEN `winner` = `team1` OR `winner`
        = `team2` THEN TRUE ELSE FALSE END ELSE TRUE END", "league_winner_is_fixture_team")
      validity: true
