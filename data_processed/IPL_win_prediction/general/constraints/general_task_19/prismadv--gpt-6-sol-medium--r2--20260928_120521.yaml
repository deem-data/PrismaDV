      - start_line: 64
        end_line: 65
        file: ''
      uid: ce36a1dc-9695-47b6-a5ec-62e2f83d2a6e
    - text: Every 'venue' value should be a non-empty string after trimming whitespace,
        so the generated summary names a meaningful venue rather than leaving the
        location blank. No particular set of venue names is required by the code.
      sources:
      - start_line: 42
