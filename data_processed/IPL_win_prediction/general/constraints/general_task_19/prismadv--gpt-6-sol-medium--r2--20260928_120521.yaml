        them as opposing teams when identifying the loser and awarding standings points.
      sources:
      - start_line: 49
        end_line: 59
        file: ''
      - start_line: 73
        end_line: 74
        file: ''
      - start_line: 92
        end_line: 108
        file: ''
      uid: 2c0ca096-5487-4b6f-be15-96db69e42669
    - text: For every League match whose 'result' is not 'no result', 'winner' should
        equal either 'team1' or 'team2'. Otherwise, the code treats 'team1' as the
        loser even when the recorded winner is not a participant. The same relationship
        should hold for any match summarized as a win by runs or wickets, or as a
        tie with a recorded winner.
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 49
        end_line: 55
        file: ''
      - start_line: 73
        end_line: 74
        file: ''
      uid: 5ba879b0-3618-414d-88e6-f9bcf13fa997
