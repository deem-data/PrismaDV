constraints:
  date:
    code:
    - - .satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'date_is_parseable')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result <> 'wickets' OR CAST(result_margin AS DOUBLE) <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND CAST(result_margin AS DOUBLE) > 0)", 'win_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('CAST(season AS DOUBLE) IS NOT NULL AND CAST(season AS DOUBLE)
        = FLOOR(CAST(season AS DOUBLE)) AND CAST(season AS DOUBLE) BETWEEN 2008 AND
        2100', 'season_is_valid_year')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR (target_overs IS NOT
        NULL AND CAST(target_overs AS DOUBLE) > 0 AND CAST(target_overs AS DOUBLE)
        <= 20)", 'training_match_has_valid_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR (target_runs IS NOT
        NULL AND CAST(target_runs AS DOUBLE) > 0)", 'training_match_has_positive_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR winner = team1 OR
        winner = team2", 'decisive_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
