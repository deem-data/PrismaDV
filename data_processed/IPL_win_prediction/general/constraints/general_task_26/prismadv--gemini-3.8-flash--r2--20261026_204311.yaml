prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies("year(to_date(`date`)) == `season`", "Date year matches
        season")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 05285277-fcec-47d5-9fa2-93c6dd7acf65
      source_assumptions:
      - 406ec854-327d-4e44-b28e-3e708b4f1228
    assumptions:
    - text: 'The year component of the ''date'' column should match the ''season''
        column for each record, as ''season'' represents the year in which the match
        took place. We could represent this assumption as a deequ constraint like
        this: .satisfies("year(to_date(date)) == season", "Date year matches season")'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: 406ec854-327d-4e44-b28e-3e708b4f1228
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0)", "result_margin_present_when_runs_or_wickets")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 036871ee-93d1-494a-9007-ff173c44111a
      source_assumptions:
      - 5ae18309-c757-4561-8366-2fda9cd0b9d1
    - suggestion: .satisfies("`result` != 'wickets' OR (`result_margin` >= 1 AND `result_margin`
        <= 10)", "wickets_margin_in_valid_range")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0d609f6a-7501-4ac4-a84f-fef6d0a1b355
      source_assumptions:
      - 399ebc95-4622-4f44-949a-31d77f55c3fa
    assumptions:
    - text: 'When ''result'' is either ''runs'' or ''wickets'', ''result_margin''
        should not be null and should be strictly positive (> 0). In Deequ, this can
        be expressed as: .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin
        IS NOT NULL AND result_margin > 0)", "result_margin_present_when_runs_or_wickets")'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 48
        end_line: 49
        file: ''
      uid: 5ae18309-c757-4561-8366-2fda9cd0b9d1
    - text: 'When ''result'' is ''wickets'', ''result_margin'' is converted to integer
        wicket margin and should be between 1 and 10. In Deequ, this can be expressed
        as: .satisfies("result != ''wickets'' OR (result_margin >= 1 AND result_margin
        <= 10)", "wickets_margin_in_valid_range")'
      sources:
      - start_line: 49
        end_line: 49
        file: ''
      uid: 399ebc95-4622-4f44-949a-31d77f55c3fa
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("(`super_over` = 'Y' AND `result` = 'tie') OR (`super_over`
        = 'N' AND `result` != 'tie')", "super_over_tie_consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 44cac7b7-ae1a-4a98-a448-df7d0e7656cf
      source_assumptions:
      - 5b6746f3-a34f-4b8a-8a17-fe0b9eb2c23a
    assumptions:
    - text: 'There is a direct correspondence between ''super_over'' and ''result'':
        a super over is only played when the match result is a tie. Therefore, whenever
        ''super_over'' is ''Y'', ''result'' should be ''tie'', and when ''super_over''
        is ''N'', ''result'' should not be ''tie''. We could represent this assumption
        as a Deequ constraint like: .satisfies("(super_over = ''Y'' AND result = ''tie'')
        OR (super_over = ''N'' AND result != ''tie'')", "super_over_tie_consistency")'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 42
        end_line: 42
        file: ''
      uid: 5b6746f3-a34f-4b8a-8a17-fe0b9eb2c23a
