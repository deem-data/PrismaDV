      validity: true
      reason_if_invalid: ''
      level: error
      uid: 6ef0a513-e738-4e01-8a2d-aa8c116f9be8
      source_assumptions:
      - 7bea8968-0c37-4a6c-bcc1-76356f93d740
    assumptions:
    - text: 'The two teams in a match should be different: ''team1'' must not equal
        ''team2''. Otherwise, the team1-win label cannot distinguish which team won.
        This can be checked with .satisfies("team1 <> team2", "distinct_opponents").'
      sources:
      - start_line: 31
        end_line: 31
        file: ''
      - start_line: 38
        end_line: 39
        file: ''
      uid: 312ada21-4d9b-4aee-92c8-8832321a752e
    - text: For every match included in training (where 'result' is 'runs', 'wickets',
        or 'tie'), 'winner' should be non-null and equal to either 'team1' or 'team2'.
        Otherwise, the comparison with 'team1' silently assigns a team1-loss label
