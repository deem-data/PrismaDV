prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code:
    - suggestion: '.satisfies(''year(to_date(`date`)) = CAST(`season` AS INT)'', ''date_year_matches_season'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9233f710-8019-4853-9798-770e421babda
      source_assumptions:
      - 8bf1abb4-a89a-4c29-b407-c9d4628741e1
    assumptions:
    - text: For every match, the calendar year parsed from 'date' should equal the
        integer value of 'season'. Otherwise, the training feature assigns the match
        to a season inconsistent with its date. This can be checked with a row-level
        constraint such as `year(to_date(date)) = season`.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 34
        end_line: 36
        file: ''
      uid: 8bf1abb4-a89a-4c29-b407-c9d4628741e1
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0)", "decisive_result_has_positive_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 185b40b1-4212-4b31-8f28-d261b67408bd
      source_assumptions:
      - eaf8cbab-8cb9-41fb-8e84-48bdf70c5fa0
    - suggestion: .satisfies("`result` <> 'wickets' OR (`result_margin` BETWEEN 1
        AND 10 AND `result_margin` = FLOOR(`result_margin`))", "valid_wicket_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5812dce6-cb80-4250-b6ba-20abdb5b31dd
      source_assumptions:
      - 367b8274-150a-405e-8a61-2cd1be44ff1d
    - suggestion: .satisfies("`result` NOT IN ('tie', 'no result') OR `result_margin`
        IS NULL", "no_margin_without_winner")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8c4c9a91-84ed-4028-8191-41fbc3fe32dc
      source_assumptions:
      - 7d993cf3-687b-445b-b0c8-219b721ebeb1
    assumptions:
    - text: When 'result' is 'runs' or 'wickets', 'result_margin' should be a non-null,
        positive number. The code uses this value as the winning margin and otherwise
        replaces missing values with zero. This can be checked with .satisfies("result
        NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL AND result_margin
        > 0)", "decisive_result_has_positive_margin").
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 47
        end_line: 49
        file: ''
      uid: eaf8cbab-8cb9-41fb-8e84-48bdf70c5fa0
    - text: When 'result' is 'wickets', 'result_margin' should be a whole number between
        1 and 10, because it is converted to an integer-valued wicket-margin feature.
        This can be checked with .satisfies("result <> 'wickets' OR (result_margin
        BETWEEN 1 AND 10 AND result_margin = FLOOR(result_margin))", "valid_wicket_margin").
      sources:
      - start_line: 47
        end_line: 49
        file: ''
      uid: 367b8274-150a-405e-8a61-2cd1be44ff1d
    - text: 'When ''result'' is ''tie'' or ''no result'', ''result_margin'' should
        be null: neither outcome has a winning margin. This is also consistent with
        the six missing margins and six such outcomes in the supplied data profile.
        This can be checked with .satisfies("result NOT IN (''tie'', ''no result'')
        OR result_margin IS NULL", "no_margin_without_winner").'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 48
        end_line: 49
        file: ''
      uid: 7d993cf3-687b-445b-b0c8-219b721ebeb1
  '["result","super_over"]':
    code:
    - suggestion: '.satisfies("(`result` = ''tie'' AND `super_over` = ''Y'') OR (`result`
        <> ''tie'' AND `super_over` = ''N'')", "result_super_over_consistency", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ada64143-4d2f-42ec-8654-1437806ddee9
      source_assumptions:
      - caf87659-b29d-44d6-88b8-1cc8ce37d4d3
    assumptions:
    - text: A match should have super_over = 'Y' if and only if result = 'tie'. Matches
        with result = 'runs', 'wickets', or 'no result' should have super_over = 'N'.
        This can be checked with a constraint such as .satisfies("(result = 'tie'
        AND super_over = 'Y') OR (result <> 'tie' AND super_over = 'N')", "result_super_over_consistency").
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 42
        end_line: 42
        file: ''
      - start_line: 47
        end_line: 49
        file: ''
      uid: caf87659-b29d-44d6-88b8-1cc8ce37d4d3
  '["result","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (TRY_CAST(`target_runs`
        AS DOUBLE) IS NOT NULL AND TRY_CAST(`target_overs` AS DOUBLE) IS NOT NULL)",
        "training_targets_present_and_numeric")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9e5d6b23-a122-4298-abdb-09be0ad2a029
      source_assumptions:
      - 728f93da-3e69-46a8-9b3d-276564b9d8e8
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (TRY_CAST(`target_overs`
        AS DOUBLE) > 0 AND TRY_CAST(`target_overs` AS DOUBLE) <= 20 AND TRY_CAST(`target_runs`
        AS DOUBLE) >= 0)", "training_targets_valid_range")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d75148ff-9d55-4519-b6fe-1ce851f6ba75
      source_assumptions:
      - c1313951-2d6a-4917-9ed1-271b27fd29ca
    assumptions:
    - text: 'For every match whose result is ''runs'', ''wickets'', or ''tie'', both
        target_runs and target_overs should be present and numeric. These rows enter
        the training set, where both values are used as features and divided to calculate
        target_run_rate. A row-level constraint could require: result NOT IN (''runs'',
        ''wickets'', ''tie'') OR (target_runs IS NOT NULL AND target_overs IS NOT
        NULL).'
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 45
        file: ''
      uid: 728f93da-3e69-46a8-9b3d-276564b9d8e8
    - text: 'For every match whose result is ''runs'', ''wickets'', or ''tie'', target_overs
        should be greater than 0 and no more than 20, and target_runs should be nonnegative.
        This keeps target_run_rate finite and revised_overs_shortfall nonnegative.
        A row-level constraint could require: result NOT IN (''runs'', ''wickets'',
        ''tie'') OR (target_overs > 0 AND target_overs <= 20 AND target_runs >= 0).'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 46
        file: ''
      uid: c1313951-2d6a-4917-9ed1-271b27fd29ca
  '["result","team1","team2","winner"]':
    code:
    - suggestion: .satisfies('`team1` IS NOT NULL AND `team2` IS NOT NULL AND `team1`
        <> `team2`', 'distinct_opponents')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 62af883a-013d-4642-8653-f49f70e88c88
      source_assumptions:
      - 312ada21-4d9b-4aee-92c8-8832321a752e
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (`winner`
