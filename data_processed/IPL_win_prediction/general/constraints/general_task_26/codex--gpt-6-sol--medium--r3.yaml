  constraints:
    id:
      code:
      - - .isComplete('id')
        - Valid
      - - .isUnique('id')
        - Valid
      assumptions: []
      column_name: id
    match_type:
      code:
      - - .isComplete('match_type')
        - Valid
      - - .isContainedIn('match_type', ['League', 'Final', 'Qualifier 1', 'Qualifier
          2', 'Eliminator', 'Elimination Final', 'Semi Final'])
        - Valid
      assumptions: []
      column_name: match_type
    result:
      code:
      - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("result <> 'wickets' OR (CAST(result_margin AS DOUBLE) <= 10
          AND CAST(result_margin AS DOUBLE) = CAST(result_margin AS BIGINT))", 'wicket_margin_valid_integer')
        - Valid
      - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
          AND CAST(result_margin AS DOUBLE) > 0)", 'decisive_margin_positive')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      - - .satisfies('season > 0 AND season = CAST(season AS BIGINT)', 'season_is_positive_integer')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("result = 'no result' OR (target_overs IS NOT NULL AND CAST(target_overs
          AS DOUBLE) > 0 AND CAST(target_overs AS DOUBLE) <= 20)", 'training_target_overs_in_range')
        - Valid
      assumptions: []
      column_name: target_overs
    target_runs:
      code:
      - - .satisfies("result = 'no result' OR (target_runs IS NOT NULL AND CAST(target_runs
          AS DOUBLE) > 0)", 'training_target_runs_positive')
        - Valid
      assumptions: []
      column_name: target_runs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies('team1 <> team2', 'distinct_opponents')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_is_participant')
        - Valid
      assumptions: []
      column_name: toss_winner
    winner:
      code:
      - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
          OR winner = team2))", 'decisive_winner_is_participant')
        - Valid
      assumptions: []
      column_name: winner
