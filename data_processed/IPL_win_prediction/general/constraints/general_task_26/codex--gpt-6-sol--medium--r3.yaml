  \ 'Mumbai Indians', 'toss_decision': 'field', 'winner': 'Mumbai Indians', 'result':\
  \ 'wickets', 'result_margin': 6.0, 'target_runs': 215.0, 'target_overs': 20.0, 'super_over':\
  \ 'N', 'method': nan, 'umpire1': 'J Madanagopal', 'umpire2': 'RJ Tucker'}]\n\nThe\
