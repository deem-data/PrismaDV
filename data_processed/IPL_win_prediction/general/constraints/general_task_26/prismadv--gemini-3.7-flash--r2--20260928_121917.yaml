    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be non-null and positive (representing the winning margin in runs or wickets,
        respectively). When ''result'' is ''wickets'', ''result_margin'' should be
        an integer value between 1 and 10. This can be expressed as a conditional
        constraint: when result == ''runs'' or result == ''wickets'', result_margin
        is not null and result_margin > 0.'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 48
        end_line: 49
        file: ''
      uid: c1f780a4-d966-43b0-99ac-c21a5be09afd
