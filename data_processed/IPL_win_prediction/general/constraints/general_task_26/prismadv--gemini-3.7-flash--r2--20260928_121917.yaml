    code: []
    assumptions:
    - text: 'The ''season'' column is expected to match the year component of the
        ''date'' column across records, ensuring temporal consistency between the
        match date and the recorded season. We could represent this assumption as
        a deequ constraint like this:

        .satisfies("CAST(season AS INT) == YEAR(TO_DATE(date, ''yyyy-MM-dd''))", "SeasonMatchesDateYear")'
