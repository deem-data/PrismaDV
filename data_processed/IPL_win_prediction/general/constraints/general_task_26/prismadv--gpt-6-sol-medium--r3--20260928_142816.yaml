      reason_if_invalid: ''
      level: warning
      uid: d0465846-2d78-47a7-b337-69f3b93f465b
      source_assumptions:
      - 35d14c32-93b5-4622-9459-93c613228e94
    assumptions:
    - text: 'The two participating teams must be different in every match: `team1`
        != `team2`. Otherwise, the team1-win label cannot distinguish the winner from
        the opponent. This can be checked with `.satisfies("team1 <> team2", "distinct_participants")`.'
      sources:
      - start_line: 31
        end_line: 31
        file: ''
      - start_line: 38
        end_line: 39
        file: ''
      uid: 0cb04c79-bb2b-40dd-9b1f-813361177acb
    - text: For every row used for training (`result` is `runs`, `wickets`, or `tie`),
        `winner` must be non-null and equal to either `team1` or `team2`. Otherwise,
        the label expression silently assigns a team1 loss to a missing or unrecognized
