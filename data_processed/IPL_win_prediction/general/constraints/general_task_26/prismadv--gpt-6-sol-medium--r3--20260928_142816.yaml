      sources:
      - start_line: 28
        end_line: 31
        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      uid: 944662d1-ccd0-4b0e-b4db-e54454b4eff1
    - text: For a `no result` match, `winner` should be null, consistent with there
        being no winning team. This can be checked with `.satisfies("result <> 'no
