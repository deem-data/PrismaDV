prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["date","season"]':
    code:
    - suggestion: '.satisfies(''year(to_date(`date`)) = `season`'', ''date_year_matches_season'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: fca5dbee-9584-4f8a-9800-cf72eaca9879
      source_assumptions:
      - ea0ac9a7-7f13-4337-98ac-22bf8d2a907a
    assumptions:
    - text: Each match's 'date' should parse to a calendar date whose year equals
        the value in 'season'. This keeps the season used as a training feature consistent
        with when the match was played. An actionable constraint is that every row
        satisfies `year(to_date(date)) = season`.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 34
        end_line: 36
        file: ''
      uid: ea0ac9a7-7f13-4337-98ac-22bf8d2a907a
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0)", "decisive_result_has_positive_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: be19cade-4490-44ef-8415-1c30bae5af92
      source_assumptions:
      - 820fac68-1ba1-4deb-af3c-c3ced174d500
    - suggestion: .satisfies("`result` <> 'wickets' OR (`result_margin` BETWEEN 1
        AND 10 AND `result_margin` = FLOOR(`result_margin`))", "valid_wicket_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 26f9d3d5-d6d0-449e-a32d-61995cb87323
      source_assumptions:
      - 6d5395f6-c808-4ea5-b095-ca1bf6014e50
    - suggestion: .satisfies("`result` NOT IN ('tie', 'no result') OR `result_margin`
        IS NULL", "nondecisive_result_has_no_margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0c2729e0-dea3-4fd8-b2d4-7c615849779a
      source_assumptions:
      - 09c15433-7b55-443c-ae45-93b4d20ab1f5
    assumptions:
    - text: 'For matches where ''result'' is ''runs'' or ''wickets'', ''result_margin''
        should be non-null and greater than zero. Otherwise, the feature code replaces
        a missing margin with zero, misrepresenting a decisive win. This can be checked
        with: .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin
        IS NOT NULL AND result_margin > 0)", "decisive_result_has_positive_margin")'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 47
        end_line: 49
        file: ''
      uid: 820fac68-1ba1-4deb-af3c-c3ced174d500
    - text: 'When ''result'' is ''wickets'', ''result_margin'' should be a whole number
        from 1 through 10. The code converts this margin to an integer feature, which
        would truncate a fractional value. This can be checked with: .satisfies("result
        <> ''wickets'' OR (result_margin BETWEEN 1 AND 10 AND result_margin = FLOOR(result_margin))",
        "valid_wicket_margin")'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 49
        end_line: 49
        file: ''
      uid: 6d5395f6-c808-4ea5-b095-ca1bf6014e50
    - text: 'When ''result'' is ''tie'' or ''no result'', ''result_margin'' should
        be null: neither outcome has a winning margin. A non-null value for a tie
        would be silently discarded when the code creates its margin features. This
        can be checked with: .satisfies("result NOT IN (''tie'', ''no result'') OR
        result_margin IS NULL", "nondecisive_result_has_no_margin")'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 48
        end_line: 49
        file: ''
      uid: 09c15433-7b55-443c-ae45-93b4d20ab1f5
  '["result","super_over"]':
    code:
    - suggestion: '.satisfies("(`super_over` = ''Y'' AND `result` = ''tie'') OR (`super_over`
        = ''N'' AND `result` IN (''runs'', ''wickets'', ''no result''))", "super_over_result_consistency",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d4693c79-0ca3-4f31-81bc-2426be75e782
      source_assumptions:
      - 2a9de9cf-737f-42a5-8010-bf5349a438ef
    assumptions:
    - text: 'The ''super_over'' and ''result'' columns should agree: ''super_over''
        is ''Y'' if and only if ''result'' is ''tie''. Matches with a ''runs'', ''wickets'',
        or ''no result'' outcome should have ''super_over'' equal to ''N''. This can
        be checked with a Deequ compliance constraint: .satisfies("(super_over = ''Y''
        AND result = ''tie'') OR (super_over = ''N'' AND result IN (''runs'', ''wickets'',
        ''no result''))", "super_over_result_consistency")'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 42
        end_line: 49
        file: ''
      uid: 2a9de9cf-737f-42a5-8010-bf5349a438ef
  '["result","target_overs","target_runs"]':
    code:
    - suggestion: '.satisfies("CASE WHEN `result` IN (''runs'', ''wickets'', ''tie'')
        THEN `target_runs` IS NOT NULL AND `target_overs` IS NOT NULL ELSE TRUE END",
        "decisive_match_targets_present", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: f1629744-2d39-44bc-a2dc-352908a1298a
      source_assumptions:
      - 3ab07f2a-d7b7-4958-a5f2-6bb9c37a885c
    - suggestion: '.satisfies("CASE WHEN `result` IN (''runs'', ''wickets'', ''tie'')
        THEN `target_overs` > 0 AND `target_overs` <= 20 AND `target_runs` > 0 ELSE
        TRUE END", "valid_decisive_match_targets", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 914b8207-96ae-420c-a676-0cdbc8fb153f
      source_assumptions:
      - 6079188d-09fd-431d-8559-17818a83d2bf
    assumptions:
    - text: For every match with result 'runs', 'wickets', or 'tie', both target_runs
        and target_overs should be present and numeric. These rows are retained for
        training, and both columns are used to calculate target_run_rate. A Deequ
        constraint could be .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR
        (target_runs IS NOT NULL AND target_overs IS NOT NULL)", "decisive_match_targets_present").
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 45
        file: ''
      uid: 3ab07f2a-d7b7-4958-a5f2-6bb9c37a885c
    - text: For every match retained for training, target_overs should be greater
        than 0 and no greater than 20, and target_runs should be greater than 0. This
        keeps target_runs / target_overs defined and makes the calculated revised_overs_shortfall
        nonnegative. A Deequ constraint could be .satisfies("result NOT IN ('runs',
        'wickets', 'tie') OR (target_overs > 0 AND target_overs <= 20 AND target_runs
        > 0)", "valid_decisive_match_targets").
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 46
        file: ''
      uid: 6079188d-09fd-431d-8559-17818a83d2bf
  '["result","team1","team2","winner"]':
    code:
    - suggestion: .satisfies('`team1` <> `team2`', 'distinct_participants')
