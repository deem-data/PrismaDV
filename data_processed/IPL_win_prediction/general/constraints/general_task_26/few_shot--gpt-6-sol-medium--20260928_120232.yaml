      - Valid
    assumptions: []
    column_name: toss_decision
  winner:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR winner IN (team1,
        team2)", 'valid_training_winner')
      - Valid
    assumptions: []
    column_name: winner
