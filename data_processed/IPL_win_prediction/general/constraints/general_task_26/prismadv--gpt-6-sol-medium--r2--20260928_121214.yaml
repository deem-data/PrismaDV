prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('`season` = year(to_date(`date`))', 'season_matches_date_year')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 563d30fc-2e79-4de4-b663-a956b611f61e
      source_assumptions:
      - 087cbe67-6977-4318-88c5-68ef048f8c6e
    assumptions:
    - text: For each match, 'season' should equal the calendar year of the parsed
        'date'. Otherwise, a match could be assigned to the wrong season in the training
        features. This can be checked with a constraint such as .satisfies("season
        = year(to_date(date))", "season_matches_date_year"), using the date format
        present in the data.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 34
        end_line: 36
        file: ''
      uid: 087cbe67-6977-4318-88c5-68ef048f8c6e
  '["result","result_margin"]':
    code:
    - suggestion: '.satisfies("CASE WHEN `result` IN (''runs'', ''wickets'') THEN
        `result_margin` IS NOT NULL AND `result_margin` > 0 AND `result_margin` =
        FLOOR(`result_margin`) ELSE TRUE END", "positive_whole_decisive_margin", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: fd6e1903-d005-43a1-82ca-2a93842956e5
      source_assumptions:
      - 829808ca-b28f-4740-aacb-2f3c6957a4d4
    - suggestion: '.satisfies("CASE WHEN `result` = ''wickets'' THEN `result_margin`
        <= 10 ELSE TRUE END", "wickets_margin_at_most_10", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6721be90-3616-4665-abd9-651803453dcb
      source_assumptions:
      - 5680e47f-db0d-4aa9-b1d8-d831975b12c1
    - suggestion: '.satisfies("CASE WHEN `result` IN (''tie'', ''no result'') THEN
        `result_margin` IS NULL ELSE TRUE END", "no_margin_for_tie_or_no_result",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d83d7e2b-2259-4d0e-8aca-c956ff0abd89
      source_assumptions:
      - 4ae770e8-a0b7-42b2-9486-96dd92d4b7e0
    assumptions:
    - text: For every match with result 'runs' or 'wickets', result_margin should
        be present and a positive whole number. The code uses that value as the corresponding
        margin feature; filling a missing value with zero would hide an invalid margin.
        This can be checked with a conditional constraint requiring result_margin
        IS NOT NULL, result_margin > 0, and result_margin = FLOOR(result_margin) when
        result IN ('runs', 'wickets').
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 47
        end_line: 49
        file: ''
      uid: 829808ca-b28f-4740-aacb-2f3c6957a4d4
    - text: When result is 'wickets', result_margin should be at most 10, since it
        represents the number of wickets remaining. This can be checked with a conditional
        constraint requiring result_margin <= 10 when result = 'wickets'.
      sources:
      - start_line: 47
        end_line: 49
        file: ''
      uid: 5680e47f-db0d-4aa9-b1d8-d831975b12c1
    - text: 'When result is ''tie'' or ''no result'', result_margin should be null:
        neither outcome has a winning margin, and the code assigns tie matches zero
        in both margin features. This can be checked with a conditional constraint
        requiring result_margin IS NULL when result IN (''tie'', ''no result'').'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 48
        end_line: 49
        file: ''
      uid: 4ae770e8-a0b7-42b2-9486-96dd92d4b7e0
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("(`super_over` = 'Y' AND `result` = 'tie') OR (`super_over`
        = 'N' AND `result` IN ('runs', 'wickets', 'no result'))", "super_over_result_consistency")
