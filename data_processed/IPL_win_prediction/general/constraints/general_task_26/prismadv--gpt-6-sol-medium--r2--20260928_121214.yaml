      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7281f98c-6c78-48ec-b83c-048dfad0d07c
      source_assumptions:
      - 49069bc0-0bca-4513-b703-f5213b5a8375
    assumptions:
    - text: 'For every match used for training (where ''result'' is ''runs'', ''wickets'',
        or ''tie''), ''winner'' must be non-null and equal to either ''team1'' or
