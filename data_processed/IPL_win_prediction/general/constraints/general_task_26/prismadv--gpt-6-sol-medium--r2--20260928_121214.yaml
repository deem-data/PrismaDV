        (winner = team1 OR winner = team2)).'
      sources:
      - start_line: 28
        end_line: 31
        file: ''
      - start_line: 38
        end_line: 39
        file: ''
      - start_line: 52
        end_line: 52
        file: ''
      uid: 534fdf66-39b9-4704-8522-8c9ab0a90f0a
    - text: '''team1'' and ''team2'' should identify different teams in each training
        match. The code treats them as opposing participants and labels a win by comparing
        ''winner'' with ''team1''. This can be checked with a row-level constraint:
        result NOT IN (''runs'', ''wickets'', ''tie'') OR team1 <> team2.'
      sources:
      - start_line: 28
        end_line: 31
        file: ''
      - start_line: 38
        end_line: 39
        file: ''
      uid: 49069bc0-0bca-4513-b703-f5213b5a8375
