    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (`target_overs`
        <= 20 AND `target_runs` > 0)", "training_targets_plausible")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d63b9280-5a6b-44fd-a379-475cba702c2d
      source_assumptions:
      - 215cd0a1-2c1f-4c28-8bdf-408e7a6ff9a8
    assumptions:
    - text: 'For every row with result ''runs'', ''wickets'', or ''tie'', both target_runs
        and target_overs should be non-null. These rows enter the training set, where
        both columns are used as features and to calculate target_run_rate. This can
        be checked with: result NOT IN (''runs'', ''wickets'', ''tie'') OR (target_runs
        IS NOT NULL AND target_overs IS NOT NULL).'
      sources:
      - start_line: 23
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 45
        file: ''
      uid: abf29570-0b60-4656-a203-ff398e97ec4c
    - text: 'For every row with result ''runs'', ''wickets'', or ''tie'', target_overs
        should be greater than 0 and no greater than 20, and target_runs should be
        positive. This keeps target_runs / target_overs defined and the computed 20-over
        shortfall nonnegative. This can be checked with: result NOT IN (''runs'',
        ''wickets'', ''tie'') OR (target_overs > 0 AND target_overs <= 20 AND target_runs
        > 0).'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 43
        end_line: 46
        file: ''
      uid: 215cd0a1-2c1f-4c28-8bdf-408e7a6ff9a8
  '["result","team1","team2","winner"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (`winner`
        IS NOT NULL AND (`winner` = `team1` OR `winner` = `team2`))", "training_winner_is_participant")
