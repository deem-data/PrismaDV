    assumptions:
    - text: 'The ''super_over'' flag should agree with ''result'': a match has super_over
        = ''Y'' if and only if result = ''tie''. Matches with result = ''runs'', ''wickets'',
        or ''no result'' should have super_over = ''N''. This can be checked with
        a row-level constraint such as .satisfies("(`super_over` = ''Y'' AND `result`
        = ''tie'') OR (`super_over` = ''N'' AND `result` IN (''runs'', ''wickets'',
        ''no result''))", "super_over_result_consistency").'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 42
        end_line: 47
        file: ''
      uid: 5695cdb4-ac29-40d4-a6d0-2b7c312cb0d6
  '["result","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (`target_runs`
