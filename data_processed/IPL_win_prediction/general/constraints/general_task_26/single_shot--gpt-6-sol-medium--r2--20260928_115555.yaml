constraints:
  date:
    code:
    - - .isComplete('date').satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'",
        'date format YYYY-MM-DD')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type').isContainedIn('match_type', ['League', 'Elimination
        Final', 'Eliminator', 'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR result_margin IS NOT NULL",
        'margin present for runs and wickets results').satisfies("result NOT IN ('runs',
        'wickets') OR result_margin > 0", 'positive decisive result margin').satisfies("result
        <> 'wickets' OR result_margin <= 10", 'wicket margin does not exceed ten')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').satisfies('season >= 2008 AND season <= 2100', 'plausible
        season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("result = 'no result' OR target_overs IS NOT NULL", 'target overs
        present for training matches').satisfies('target_overs IS NULL OR (target_overs
        > 0 AND target_overs <= 20)', 'valid target overs for run-rate calculation')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("result = 'no result' OR target_runs IS NOT NULL", 'target runs
        present for training matches').satisfies('target_runs IS NULL OR target_runs
        > 0', 'positive target runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1').satisfies('team1 <> team2', 'distinct opposing teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner = team1 OR toss_winner =
        team2', 'toss winner is a participating team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
        OR winner = team2))", 'decisive match winner is a participating team')
      - Valid
    assumptions: []
    column_name: winner
