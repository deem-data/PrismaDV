  \ nan, 'umpire1': 'Aleem Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season':\
  \ 2022, 'city': 'Pune', 'date': '2022-03-29', 'match_type': 'League', 'player_of_match':\
  \ 'SV Samson', 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1':\
  \ 'Rajasthan Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers\
  \ Hyderabad', 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result':\
  \ 'runs', 'result_margin': 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over':\
