prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_file = os.path.join(args.input,\
  \ 'new_data.csv')\noutput_dir = args.output\nos.makedirs(output_dir, exist_ok=True)\n\
  \n# Load data\ndf = pd.read_csv(input_file)\n\n# Basic type coercions used downstream\n\
  df['date_dt'] = pd.to_datetime(df['date'], errors='coerce')\ndf['season_int'] =\
  \ pd.to_numeric(df['season'], errors='coerce').astype(int)\ndf['result_margin']\
  \ = pd.to_numeric(df['result_margin'], errors='coerce')\ndf['target_runs'] = pd.to_numeric(df['target_runs'],\
  \ errors='coerce')\ndf['target_overs'] = pd.to_numeric(df['target_overs'], errors='coerce')\n\
  # Features that depend on season correctness\nis_final = (df['match_type'] == 'Final').astype(int)\n\
  # Train set excludes matches without a decisive outcome\ntrain_mask = df['result'].isin(['runs',\
  \ 'wickets', 'tie'])\ndf_train = df.loc[train_mask].copy()\n# Label: 1 if team1\
  \ won, else 0\nlabel = (df_train['winner'] == df_train['team1']).astype(int)\n\n\
  # Feature engineering\nfeatures = pd.DataFrame({\n    'match_id': df_train['id'],\n\
  \    'season': df_train['season_int'],\n    'is_final': (df_train['match_type']\
  \ == 'Final').astype(int),\n    'team1': df_train['team1'],\n    'team2': df_train['team2'],\n\
  \    'toss_winner_is_team1': (df_train['toss_winner'] == df_train['team1']).astype(int),\n\
  \    'toss_decision_bat': (df_train['toss_decision'] == 'bat').astype(int),\n  \
  \  'super_over_flag': (df_train['super_over'] == 'Y').astype(int),\n    'target_runs':\
  \ df_train['target_runs'].astype(float),\n    'target_overs': df_train['target_overs'].astype(float),\n\
  \    'target_run_rate': (df_train['target_runs'] / df_train['target_overs']).astype(float),\n\
  \    'revised_overs_shortfall': (20.0 - df_train['target_overs']).astype(float),\n\
  \    'result_type_wickets': (df_train['result'] == 'wickets').astype(int),\n   \
  \ 'margin_runs': np.where(df_train['result'].eq('runs'), df_train['result_margin'].fillna(0),\
  \ 0).astype(float),\n    'margin_wickets': np.where(df_train['result'].eq('wickets'),\
  \ df_train['result_margin'].fillna(0), 0).astype(int)\n})\n\nfeatures['label_team1_win']\
  \ = label\n\noutput_file = os.path.join(output_dir, 'winprob_training_dataset.csv')\n\
  features.to_csv(output_file, index=False)\n\n```\n\nThe same program is on disk\
  \ at `./code/general_task_26.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 388,\
  \ 'season': 2013, 'city': 'Jaipur', 'date': '2013-04-14', 'match_type': 'League',\
  \ 'player_of_match': 'JP Faulkner', 'venue': 'Sawai Mansingh Stadium', 'team1':\
  \ 'Rajasthan Royals', 'team2': 'Kings XI Punjab', 'toss_winner': 'Rajasthan Royals',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'wickets', 'result_margin':\
