    id:
      code:
      - - .isComplete('id')
        - Valid
      - - .isUnique('id')
        - Valid
      assumptions: []
      column_name: id
    match_type:
      code:
      - - .isComplete('match_type')
        - Valid
      - - .isContainedIn('match_type', ['League', 'Final', 'Qualifier 1', 'Qualifier
          2', 'Eliminator', 'Elimination Final', 'Semi Final'])
        - Valid
      assumptions: []
      column_name: match_type
    result:
      code:
      - - .isComplete('result')
        - Valid
      - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("result <> 'wickets' OR try_cast(result_margin AS DOUBLE) <=
          10", 'wicket_margin_at_most_ten')
        - Valid
      - - .satisfies("result NOT IN ('runs', 'wickets') OR (try_cast(result_margin
          AS DOUBLE) IS NOT NULL AND try_cast(result_margin AS DOUBLE) > 0 AND try_cast(result_margin
          AS DOUBLE) = try_cast(result_margin AS INT))", 'decisive_margin_positive_integer')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      - - .satisfies("try_cast(season AS DOUBLE) IS NOT NULL AND try_cast(season AS
          DOUBLE) = try_cast(season AS INT) AND try_cast(season AS INT) > 0", 'valid_integer_season')
        - Valid
      - - .satisfies("year(to_date(date)) = season", 'season_matches_match_date')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isComplete('super_over')
        - Valid
      - - .isContainedIn('super_over', ['Y', 'N'])
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("result = 'no result' OR (try_cast(target_overs AS DOUBLE) IS
          NOT NULL AND try_cast(target_overs AS DOUBLE) > 0 AND try_cast(target_overs
          AS DOUBLE) <= 20)", 'training_target_overs_valid')
        - Valid
      assumptions: []
      column_name: target_overs
    target_runs:
      code:
      - - .satisfies("result = 'no result' OR (try_cast(target_runs AS DOUBLE) IS
          NOT NULL AND try_cast(target_runs AS DOUBLE) > 0 AND try_cast(target_runs
          AS DOUBLE) = try_cast(target_runs AS INT))", 'training_target_runs_positive_integer')
        - Valid
      assumptions: []
      column_name: target_runs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies("team1 <> team2", 'opposing_teams_are_distinct')
        - Valid
      assumptions: []
      column_name: team2
    toss_decision:
      code:
      - - .isComplete('toss_decision')
        - Valid
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .isComplete('toss_winner')
        - Valid
      - - .satisfies("toss_winner = team1 OR toss_winner = team2", 'toss_winner_is_participant')
        - Valid
      assumptions: []
      column_name: toss_winner
    winner:
      code:
      - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
          OR winner = team2))", 'decisive_winner_is_participant')
        - Valid
      assumptions: []
      column_name: winner
