      column_name: team2
    toss_decision:
      code:
      - - .isComplete('toss_decision')
        - Valid
      - - .isContainedIn('toss_decision', ['bat', 'field'])
        - Valid
      assumptions: []
      column_name: toss_decision
    toss_winner:
      code:
      - - .satisfies('toss_winner IS NOT NULL AND (toss_winner = team1 OR toss_winner
          = team2)', 'toss_winner_is_participant')
        - Valid
      assumptions: []
      column_name: toss_winner
    winner:
      code:
      - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
          OR winner = team2))", 'winner_is_participant_for_training')
        - Valid
      assumptions: []
      column_name: winner
