    assumptions:
    - text: 'If the ''result'' is not ''no result'' (e.g., ''runs'', ''wickets'',
        or ''tie''), ''winner'' should not be null, as downstream settlement text
        generation and win-rate KPI computations require a valid winner for completed
        matches. We could represent this assumption as a constraint: .satisfies("result
        == ''no result'' OR winner IS NOT NULL", "Winner must be present when match
        has a result")'
      sources:
      - start_line: 44
        end_line: 49
        file: ''
      - start_line: 52
        end_line: 61
        file: ''
      - start_line: 72
        end_line: 73
        file: ''
      uid: 01137175-fc0e-4b3a-93a7-20cf644dc7c1
  '["target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'When ''target_runs'' is present and not null, ''target_overs'' must be
        greater than 0 to ensure valid computation of the required run rate (''req_run_rate
        = target_runs / target_overs'') without encountering division-by-zero or infinite
        values during downstream mean aggregation. We could represent this assumption
        as a Deequ constraint like this: .satisfies("CASE WHEN target_runs IS NOT
        NULL THEN target_overs > 0 ELSE TRUE END", "target_overs_positive_when_target_runs_present")'
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 70
        file: ''
      - start_line: 76
        end_line: 82
        file: ''
      uid: 84763faa-f6b2-40ee-88e9-e1dfb1b8d6e6
    - text: '''target_runs'' and ''target_overs'' should be mutually present or null
        together, as defining a target requires both a run target and the allotted
        overs. We could represent this assumption as a Deequ constraint like this:
        .satisfies("(target_runs IS NULL AND target_overs IS NULL) OR (target_runs
        IS NOT NULL AND target_overs IS NOT NULL)", "target_runs_and_target_overs_co-occurrence")'
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 70
        file: ''
      uid: f02bc838-d1d1-4746-981c-5074d386ad0a
