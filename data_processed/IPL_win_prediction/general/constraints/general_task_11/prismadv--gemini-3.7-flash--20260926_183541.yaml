prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year component extracted from the ''date'' column should match the
        numeric value of the ''season'' column for each match record. We could represent
        this assumption as a Deequ constraint like this: .satisfies("year(to_date(date))
        = cast(season as int)", "Date year matches season")'
      sources:
      - start_line: 33
        end_line: 34
        file: ''
      uid: 8eee9831-8464-4b71-90bb-b345d9d62c69
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' must not
        be null and must contain a valid non-null value, as the code converts ''result_margin''
        into an integer to format the settlement description text (e.g., int(row[''margin_int''])).
        We could represent this assumption as a deequ constraint like this: .satisfies("result
        NOT IN (''runs'', ''wickets'') OR result_margin IS NOT NULL", "Result margin
        must be present for runs or wickets results")'
      sources:
      - start_line: 38
        end_line: 41
        file: ''
      - start_line: 57
        end_line: 60
        file: ''
      uid: 176595b9-6570-4ba9-bd28-5712160ae86a
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'The ''super_over'' and ''result'' columns should be consistent: when
        ''super_over'' is ''Y'', ''result'' must be ''tie'', and when ''super_over''
        is ''N'', ''result'' should not be ''tie''. We could represent this assumption
        as a Deequ constraint like: .satisfies("(super_over = ''Y'' AND result = ''tie'')
        OR (super_over = ''N'' AND result != ''tie'')", "super_over_result_match")'
      sources:
      - start_line: 19
        end_line: 23
        file: ''
      - start_line: 55
        end_line: 56
        file: ''
      - start_line: 67
        end_line: 67
        file: ''
      uid: 1ff89583-149a-4564-ac2a-931d79c1c000
  '["result","winner"]':
    code:
    - suggestion: .satisfies("`result` = 'no result' OR `winner` IS NOT NULL", "winner_not_null_when_result_not_no_result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b03fbf55-b923-47a3-93fa-22f82941bb1f
      source_assumptions:
