prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport pandas\
  \ as pd\nimport numpy as np\nimport argparse\nimport os\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    os.makedirs(args.output, exist_ok=True)\n\n    input_csv = os.path.join(args.input,\
  \ 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\n    # Normalize values used\
  \ downstream\n    for col in ['result', 'toss_decision']:\n        if col in df.columns:\n\
  \            df[col] = df[col].astype(str).str.strip().str.lower()\n    if 'super_over'\
  \ in df.columns:\n        df['super_over'] = df['super_over'].astype(str).str.strip().str.upper()\n\
  \    if 'method' in df.columns:\n        df['method'] = df['method'].replace(['',\
  \ 'NA', 'NaN', 'nan', 'NULL', 'Null', 'null', 'None', 'NullValue'], np.nan)\n\n\
  \    # Coerce numerics\n    for num_col in ['target_runs', 'target_overs', 'result_margin']:\n\
  \        if num_col in df.columns:\n            df[num_col] = pd.to_numeric(df[num_col],\
  \ errors='coerce')\n\n    # Parse date and season\n    df['parsed_date'] = pd.to_datetime(df['date'],\
  \ errors='coerce')\n    df['season_int'] = pd.to_numeric(df['season'], errors='coerce')\n\
  \    # Settlement needs result domain to be tight\n    allowed_results = {'runs',\
  \ 'wickets', 'tie', 'no result'}\n    # Result margin consistency before converting\
  \ to ints for settlement text\n    runs_mask = df['result'] == 'runs'\n    wkts_mask\
  \ = df['result'] == 'wickets'\n    # Prepare integers for margins used in settlement\
  \ text\n    df['margin_int'] = np.where(runs_mask | wkts_mask, df['result_margin'].astype('Int64'),\
  \ pd.NA)\n\n    # Build loser for resulted matches\n    def other_team(row):\n \
  \       if pd.isna(row['winner']):\n            return pd.NA\n        return row['team2']\
  \ if row['winner'] == row['team1'] else row['team1']\n\n    df['loser'] = df.apply(other_team,\
  \ axis=1)\n\n    # Build settlement strings for outcome and margin markets\n   \
  \ def settlement_text(row):\n        if row['result'] == 'no result':\n        \
  \    return 'VOID: no result'\n        if row['result'] == 'tie':\n            return\
  \ f\"{row['winner']} won after Super Over\"\n        if row['result'] == 'runs':\n\
  \            return f\"{row['winner']} beat {row['loser']} by {int(row['margin_int'])}\
  \ runs\"\n        if row['result'] == 'wickets':\n            return f\"{row['winner']}\
  \ beat {row['loser']} by {int(row['margin_int'])} wickets\"\n        return 'UNSETTLED'\n\
  \n    settlement = df.copy()\n    settlement['settlement'] = settlement.apply(settlement_text,\
  \ axis=1)\n\n    # Save settled markets view\n    settlement_out = settlement[['id',\
  \ 'season', 'date', 'team1', 'team2', 'winner', 'result', 'result_margin', 'super_over',\
  \ 'settlement']].copy()\n    settlement_out.to_csv(os.path.join(args.output, 'settled_markets.csv'),\
  \ index=False)\n    # Required run rate per match\n    df['req_run_rate'] = df['target_runs']\
  \ / df['target_overs']\n    # Build season-level toss advantage KPIs\n    kpi_df\
  \ = df[df['result'] != 'no result'].copy()\n    kpi_df['toss_winner_won'] = (kpi_df['toss_winner']\
  \ == kpi_df['winner']).astype(int)\n\n    # Overall per-season rates\n    season_rates\
  \ = (\n        kpi_df.groupby('season_int')\n              .agg(matches=('id', 'size'),\n\
  \                   toss_winner_match_win_rate=('toss_winner_won', 'mean'),\n  \
  \                 avg_req_run_rate=('req_run_rate', 'mean'))\n              .reset_index()\n\
  \    )\n\n    # Decision-conditional success of toss winner\n    decision_rates\
  \ = (\n        kpi_df.groupby(['season_int', 'toss_decision'])\n              .agg(decision_toss_winner_win_rate=('toss_winner_won',\
  \ 'mean'),\n                   decision_matches=('id', 'size'))\n              .reset_index()\n\
  \              .pivot(index='season_int', columns='toss_decision', values='decision_toss_winner_win_rate')\n\
  \              .rename(columns={'field': 'field_toss_winner_win_rate', 'bat': 'bat_toss_winner_win_rate'})\n\
  \    )\n\n    kpis = season_rates.merge(decision_rates, on='season_int', how='left')\n\
  \    kpis['toss_decision_advantage'] = kpis['field_toss_winner_win_rate'] - kpis['bat_toss_winner_win_rate']\n\
  \n    kpis = kpis.rename(columns={'season_int': 'season'})\n    kpis.to_csv(os.path.join(args.output,\
  \ 'season_toss_kpis.csv'), index=False)\n\n\nif __name__ == '__main__':\n    main()\n\
  \n```\n\nThe same program is on disk at `./code/general_task_11.py`, so you can\
  \ run it against the\nstaged table, step through it, or search it, rather than working\
  \ from the\nlisting alone.\n\n# The data\n\nThree rows sampled from the dataset\
  \ the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur', 'date':\
  \ '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner', 'venue':\
  \ 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings XI Punjab',\
  \ 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner': 'Rajasthan\
  \ Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs': 125.0, 'target_overs':\
  \ 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem Dar', 'umpire2': 'C\
  \ Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune', 'date': '2022-03-29',\
  \ 'match_type': 'League', 'player_of_match': 'SV Samson', 'venue': 'Maharashtra\
  \ Cricket Association Stadium, Pune', 'team1': 'Rajasthan Royals', 'team2': 'Sunrisers\
  \ Hyderabad', 'toss_winner': 'Sunrisers Hyderabad', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'runs', 'result_margin': 61.0, 'target_runs': 211.0,\
  \ 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'BNJ Oxenford',\
  \ 'umpire2': 'UV Gandhe'}, {'id': 249, 'season': 2019, 'city': 'Delhi', 'date':\
  \ '2019-03-30', 'match_type': 'League', 'player_of_match': 'PP Shaw', 'venue': 'Arun\
  \ Jaitley Stadium', 'team1': 'Kolkata Knight Riders', 'team2': 'Delhi Capitals',\
  \ 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field', 'winner': 'Delhi Capitals',\
  \ 'result': 'tie', 'result_margin': nan, 'target_runs': 186.0, 'target_overs': 20.0,\
  \ 'super_over': 'Y', 'method': nan, 'umpire1': 'AY Dandekar', 'umpire2': 'Nitin\
  \ Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`. You\
  \ have complete access to it:\nload it with pandas, profile it, plot it, run whatever\
  \ analysis helps. It is a\nthrowaway copy -- nothing you do to it has any effect\
  \ outside this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ\
  \ constraint code against the staged table and read back\nthe result of every check:\n\
  \n```\npython deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
