constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date, 'yyyy-MM-dd')
        IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (CAST(result_margin
        AS DOUBLE) IS NOT NULL AND CAST(result_margin AS DOUBLE) > 0 AND CAST(result_margin
        AS DOUBLE) = FLOOR(CAST(result_margin AS DOUBLE)))", 'positive_whole_margin_for_decisive_result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('CAST(season AS INT) IS NOT NULL', 'season_is_numeric')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('target_overs IS NULL OR CAST(target_overs AS DOUBLE) > 0', 'positive_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('target_runs IS NULL OR CAST(target_runs AS DOUBLE) > 0', 'positive_target_runs_when_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'distinct_opposing_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR winner IN (team1, team2)",
        'resulted_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
