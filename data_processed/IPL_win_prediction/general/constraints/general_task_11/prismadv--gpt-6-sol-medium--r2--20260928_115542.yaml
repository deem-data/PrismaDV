      reason_if_invalid: ''
      level: warning
      uid: 7b1c3dfb-2ea0-42f8-b4ab-94ec0a72a721
      source_assumptions:
      - 59c231db-d4a0-4c30-a8ae-36b2bd30d51b
    assumptions:
    - text: Each match's 'season' should equal the calendar year of its 'date'. Otherwise,
        the match would appear under one season in the season-level KPIs but retain
        a date from another year in the settled-markets output. This can be checked
        with a row-level constraint requiring both values to parse and `CAST(season
        AS INT) = YEAR(parsed_date)`, using date-parsing rules consistent with the
        script.
      sources:
      - start_line: 33
        end_line: 34
        file: ''
      - start_line: 67
        end_line: 68
        file: ''
      - start_line: 76
        end_line: 81
        file: ''
      uid: 59c231db-d4a0-4c30-a8ae-36b2bd30d51b
  '["method","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies('(`target_runs` IS NULL AND `target_overs` IS NULL) OR
