prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('CAST(`season` AS INT) IS NOT NULL AND TO_DATE(`date`)
        IS NOT NULL AND CAST(`season` AS INT) = YEAR(TO_DATE(`date`))', 'season_matches_date_year')
