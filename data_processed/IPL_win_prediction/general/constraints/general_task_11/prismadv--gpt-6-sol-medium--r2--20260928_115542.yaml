      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 80
        file: ''
      uid: 8fcfb018-8360-4fb4-ba0b-adcd4f9836ef
    - text: 'For any row with a non-null ''method'' after placeholder values are replaced,
        ''target_runs'' and ''target_overs'' should both be numeric, and ''target_overs''
        should be greater than zero so the required run rate can be calculated. A
        row-level constraint is: isNull(method) OR (isNotNull(target_runs) AND isNotNull(target_overs)
