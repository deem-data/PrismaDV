      source_assumptions:
      - a4dbd1f5-536f-4cc7-8c02-f31e05a8c14a
    assumptions:
    - text: 'The ''target_runs'' and ''target_overs'' columns should be populated
        together: a row should not have a value for only one of them. This prevents
        a partially specified target from silently producing a missing required run
        rate. A row-level constraint is: isNull(target_runs) = isNull(target_overs).'
