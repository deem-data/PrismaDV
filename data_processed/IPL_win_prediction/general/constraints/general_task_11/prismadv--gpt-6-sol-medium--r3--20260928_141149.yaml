prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('`date` IS NOT NULL AND `season` IS NOT NULL AND to_date(`date`)
        IS NOT NULL AND year(to_date(`date`)) = CAST(`season` AS INT)', 'date_year_matches_season')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b036f050-eadf-4d10-bfe2-698606e227df
      source_assumptions:
      - 1d2e0ec1-be2d-4869-bf64-1c3b399dc52e
      - 6221dce6-4ff5-4528-80cb-334bf6285d40
    assumptions:
    - text: Each 'date' should parse to a valid calendar date, and its calendar year
        should equal the numeric 'season' value. Otherwise, a match may be reported
        under a season inconsistent with its date in the settlement export and season-level
        KPIs. This can be checked row by row after parsing both columns.
      sources:
      - start_line: 32
        end_line: 34
        file: ''
      - start_line: 67
        end_line: 68
        file: ''
      - start_line: 76
        end_line: 82
        file: ''
      uid: 1d2e0ec1-be2d-4869-bf64-1c3b399dc52e
    - text: Records with the same 'date' should have the same 'season'. Multiple matches
        may occur on one date, but a date should not map to conflicting season labels.
        This can be checked by grouping by 'date' and requiring at most one distinct
        'season' per group.
      sources:
      - start_line: 33
        end_line: 34
        file: ''
      - start_line: 67
        end_line: 68
        file: ''
      - start_line: 76
        end_line: 82
        file: ''
      uid: 6221dce6-4ff5-4528-80cb-334bf6285d40
  '["method","target_overs","target_runs"]':
    code:
    - suggestion: '.satisfies("LOWER(TRIM(`result`)) = ''no result'' OR (`target_runs`
        IS NOT NULL AND `target_overs` IS NOT NULL AND CAST(`target_runs` AS DOUBLE)
        >= 0 AND CAST(`target_overs` AS DOUBLE) > 0)", "valid_kpi_match_targets",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: fbe0f717-abe2-4e2b-9818-360294a601c7
      source_assumptions:
      - 3e00e9e7-d07f-499c-acbb-6b9c438c5f97
    - suggestion: '.satisfies("`method` IS NULL OR `method` <> ''D/L'' OR (`target_runs`
        IS NOT NULL AND `target_overs` IS NOT NULL AND CAST(`target_overs` AS DOUBLE)
        > 0)", "valid_dl_match_targets", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 729df0a1-a39c-4792-beda-dd1fd8591be4
      source_assumptions:
      - 41c179f5-a7a7-4e8f-bb4c-6f7626ca4ca4
    assumptions:
    - text: 'For every match included in the season KPI calculation (`result` is not
        `no result`), `target_runs` and `target_overs` should both be numeric and
        non-null, with `target_runs` >= 0 and `target_overs` > 0. Otherwise its required
        run rate is missing or undefined, potentially excluding it from the season
        average. This can be checked with a row-level constraint: `result = ''no result''
        OR (target_runs IS NOT NULL AND target_overs IS NOT NULL AND target_runs >=
        0 AND target_overs > 0)`.'
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 80
        file: ''
      uid: 3e00e9e7-d07f-499c-acbb-6b9c438c5f97
    - text: 'When `method` is `D/L`, both `target_runs` and `target_overs` should
        still be present and `target_overs` should be positive. The required run rate
        is calculated for these rows without a separate D/L-specific path. This can
        be checked with: `method <> ''D/L'' OR method IS NULL OR (target_runs IS NOT
        NULL AND target_overs IS NOT NULL AND target_overs > 0)`. A null `method`
        must not be treated as a missing target, since `method` is usually null while
        the target columns are usually populated.'
      sources:
      - start_line: 24
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 70
        file: ''
      uid: 41c179f5-a7a7-4e8f-bb4c-6f7626ca4ca4
  '["result","result_margin"]':
    code:
    - suggestion: '.satisfies("LOWER(TRIM(`result`)) NOT IN (''runs'', ''wickets'')
        OR (`result_margin` IS NOT NULL AND `result_margin` > 0 AND `result_margin`
        = FLOOR(`result_margin`))", "positive_whole_margin_for_runs_or_wickets", lambda
