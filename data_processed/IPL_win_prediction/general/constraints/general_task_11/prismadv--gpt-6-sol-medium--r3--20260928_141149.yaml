      source_assumptions:
      - d79ce1b1-bb23-4e52-baf9-3be133541489
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' must be
        non-null, numeric, and a positive whole number. These rows convert the margin
        to an integer for settlement text. This can be checked with a conditional
        constraint: result NOT IN (''runs'', ''wickets'') OR (result_margin IS NOT
        NULL AND result_margin > 0 AND result_margin = FLOOR(result_margin)).'
      sources:
      - start_line: 38
        end_line: 41
        file: ''
      - start_line: 57
        end_line: 60
        file: ''
      uid: 406bf635-9863-4c11-8b0e-387cf4854b0c
    - text: 'When ''result'' is ''tie'' or ''no result'', ''result_margin'' should
        be null: neither settlement branch uses a run or wicket margin, and the dataset''s
        six missing margins correspond to the five ties and one no-result match. This
        can be checked with: result NOT IN (''tie'', ''no result'') OR result_margin
