constraints:
  date:
    code:
    - - .satisfies("TO_DATE(`date`, 'yyyy-MM-dd') IS NOT NULL", 'valid match date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin` IS NOT
        NULL AND `result_margin` >= 0 AND `result_margin` = FLOOR(`result_margin`))",
        'runs and wickets results have an integer margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('`target_overs` IS NULL OR `target_overs` > 0', 'nonzero target
        overs when present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('`target_runs` IS NULL OR `target_runs` >= 0', 'nonnegative target
        runs when present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('`team1` <> `team2`', 'distinct competing teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('`toss_winner` IS NOT NULL AND (`toss_winner` = `team1` OR `toss_winner`
        = `team2`)', 'toss winner is a competing team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("`result` = 'no result' OR (`winner` IS NOT NULL AND (`winner`
        = `team1` OR `winner` = `team2`))", 'resulted match has a valid winner')
      - Valid
    assumptions: []
    column_name: winner
