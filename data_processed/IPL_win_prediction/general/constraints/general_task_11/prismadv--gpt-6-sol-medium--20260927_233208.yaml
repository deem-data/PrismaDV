      source_assumptions:
      - 12d785a9-ed20-4767-9b26-c1078b0a216f
    assumptions:
    - text: 'The target_runs and target_overs columns should be present or missing
        together for each match. Otherwise, the required run rate cannot be calculated
        from a complete target pair. This can be checked with: (target_runs IS NULL
        AND target_overs IS NULL) OR (target_runs IS NOT NULL AND target_overs IS
        NOT NULL).'
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 70
        file: ''
      uid: c1592791-7724-4f43-bd3c-90043cd56429
    - text: Whenever target_runs and target_overs are present, target_overs should
        be greater than zero and target_runs should be nonnegative, so their quotient
        is a meaningful, finite required run rate.
      sources:
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 80
        file: ''
      uid: 26cef192-dba2-496b-b80b-464c692a7c44
    - text: For a match with a non-null method of 'D/L', both target_runs and target_overs
        should be present. A revised target without either value cannot contribute
        a required run rate to the season KPI.
      sources:
      - start_line: 24
        end_line: 30
        file: ''
      - start_line: 70
        end_line: 80
        file: ''
      uid: 12d785a9-ed20-4767-9b26-c1078b0a216f
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("(lower(trim(`result`)) IN ('runs', 'wickets') AND `result_margin`
