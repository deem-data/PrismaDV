      - start_line: 34
        end_line: 34
        file: ''
      - start_line: 71
        end_line: 90
        file: ''
      uid: edfe9971-075e-4b17-bb91-7ca9f2d1d680
    - text: Among matches whose result is not 'no result', both 'bat' and 'field'
