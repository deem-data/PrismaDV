      reason_if_invalid: ''
      level: warning
      uid: 03692e1c-6a86-458b-ad96-06bedd3a928d
      source_assumptions:
      - 69241d0d-63c5-4d7b-86d3-26fa766ac01d
    - suggestion: '.hasUniqueness([''season'', ''id''], lambda x: x == 1.0)'
