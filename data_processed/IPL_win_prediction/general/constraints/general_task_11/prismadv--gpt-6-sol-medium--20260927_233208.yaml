        end_line: 49
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      uid: 057c2747-ed21-40a8-aa9c-ab2df3270fe6
    - text: 'For every match included in the season toss KPIs (result != ''no result''),
        season must convert to a non-null number and toss_decision must be either
        ''bat'' or ''field'' after normalization. Otherwise the match may be omitted
        from season grouping or placed in an unexpected decision category. A row-level
