      source_assumptions:
      - edfe9971-075e-4b17-bb91-7ca9f2d1d680
    assumptions:
    - text: 'For every match whose normalized result is not ''no result'', winner
        must be non-null. This includes ties, because the settlement text names a
        winner after a Super Over, and the toss-win KPI compares toss_winner with
        winner. A row-level constraint is: result = ''no result'' OR winner IS NOT
        NULL.'
      sources:
      - start_line: 53
        end_line: 60
        file: ''
      - start_line: 71
        end_line: 73
        file: ''
      uid: 67ccdc0f-8e5d-4ff0-90b8-a7b4c1cbbc1c
    - text: 'For every match whose normalized result is not ''no result'', winner
        and toss_winner must each identify one of that match''s two teams. Otherwise
        the derived loser or toss-winner win indicator can be incorrect. A row-level
