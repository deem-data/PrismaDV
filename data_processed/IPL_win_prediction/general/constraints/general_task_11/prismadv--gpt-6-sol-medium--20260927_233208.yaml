      reason_if_invalid: ''
      level: warning
      uid: 902e6cb2-7e93-42ec-bfcb-d9080a76b633
      source_assumptions:
      - 95dfb7b3-2eb4-4b19-9312-2547f2fcc500
    - suggestion: '.satisfies(''to_date(`date`) IS NOT NULL AND CAST(`season` AS INT)
        IS NOT NULL AND year(to_date(`date`)) = CAST(`season` AS INT)'', ''season_matches_date_year'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 20ffbd2f-0167-4980-8ebf-ef1fb55528ff
      source_assumptions:
      - 9116f32d-cf84-43aa-ad70-ee7b08a1d916
    assumptions:
    - text: 'Each match should involve two different teams: ''team1'' must not equal
        ''team2''. Otherwise, the code cannot identify the losing team reliably. This
        can be checked with a row-level constraint requiring team1 <> team2.'
      sources:
      - start_line: 44
        end_line: 49
        file: ''
      uid: 2ca7e504-8e42-47cd-8278-0bdd1d736948
    - text: 'Whenever ''winner'' is present, it should equal either ''team1'' or ''team2''.
        The loser calculation otherwise incorrectly treats ''team1'' as the loser.
        This can be checked with: winner IS NULL OR winner = team1 OR winner = team2.'
      sources:
      - start_line: 44
        end_line: 49
        file: ''
      - start_line: 52
        end_line: 64
        file: ''
      uid: 69241d0d-63c5-4d7b-86d3-26fa766ac01d
    - text: The combination of 'season' and 'id' should be unique across match rows,
        so the per-season count of rows represents a count of distinct matches. This
        can be checked with .isUnique(['season', 'id']).
      sources:
      - start_line: 76
        end_line: 82
        file: ''
      uid: 95dfb7b3-2eb4-4b19-9312-2547f2fcc500
    - text: Each 'date' should parse to a valid date, and each 'season' should parse
        to an integer equal to that date's calendar year. Otherwise, matches may be
        excluded from season-level KPIs or assigned to the wrong season. This can
        be checked with a row-level constraint requiring parsed_date IS NOT NULL,
        season_int IS NOT NULL, and year(parsed_date) = season_int.
      sources:
      - start_line: 32
        end_line: 34
        file: ''
      - start_line: 76
        end_line: 82
        file: ''
      uid: 9116f32d-cf84-43aa-ad70-ee7b08a1d916
  '["date","season"]':
    code:
    - suggestion: '.satisfies(''`date` IS NOT NULL AND to_date(`date`) IS NOT NULL
        AND `season` IS NOT NULL AND year(to_date(`date`)) = `season`'', ''date_matches_season'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e8febc5e-2f66-46ef-a09c-3979651eac68
      source_assumptions:
      - 1cdd4be5-a182-4dc1-9240-31612cec136a
    assumptions:
    - text: 'For every match, ''date'' should parse as a calendar date, ''season''
        should parse as an integer year, and the year of ''date'' should equal ''season''.
        This keeps the date exported with each match consistent with the season used
        to group KPI results. A row-level constraint could check: parsed_date IS NOT
        NULL AND season_int IS NOT NULL AND year(parsed_date) = season_int.'
      sources:
      - start_line: 33
        end_line: 34
        file: ''
      - start_line: 67
        end_line: 68
        file: ''
      - start_line: 76
        end_line: 82
        file: ''
      uid: 1cdd4be5-a182-4dc1-9240-31612cec136a
  '["id","result","winner"]':
    code:
    - suggestion: '.satisfies("CASE WHEN lower(trim(`result`)) = ''no result'' THEN
        `winner` IS NULL WHEN lower(trim(`result`)) IN (''runs'', ''wickets'', ''tie'')
        THEN `winner` IS NOT NULL ELSE TRUE END", ''winner_consistent_with_result'',
