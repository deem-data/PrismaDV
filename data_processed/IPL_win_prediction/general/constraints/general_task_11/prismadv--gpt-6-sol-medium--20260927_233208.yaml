      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9bdcedd2-f52a-4d73-abfe-9f3c29aa2e8f
      source_assumptions:
      - f88444f4-a170-4f8f-bde3-f8f17a36ef00
    assumptions:
    - text: After normalization, rows with result = 'no result' should have a null
        winner. Rows with result in ('runs', 'wickets', 'tie') should have a non-null
        winner, because their settlement text names that winner. This can be checked
        with a conditional constraint on result and winner.
      sources:
      - start_line: 52
        end_line: 60
        file: ''
      uid: f88444f4-a170-4f8f-bde3-f8f17a36ef00
    - text: 'Each id should identify a consistent match outcome: all rows sharing
        an id should have the same result and the same winner (treating null winners
        as equal). Otherwise, the settlement export could contain conflicting outcomes
        for one match and the KPI match counts could count that match more than once.
        This can be checked by grouping on id and requiring at most one distinct (result,
        winner) pair per group.'
      sources:
      - start_line: 63
        end_line: 68
        file: ''
      - start_line: 72
        end_line: 79
        file: ''
      uid: c3439335-110c-4a27-ac7e-cde47b8a5df5
  '["method","target_overs","target_runs"]':
