      sources:
      - start_line: 19
        end_line: 21
        file: ''
      - start_line: 28
        end_line: 30
        file: ''
      - start_line: 38
        end_line: 41
        file: ''
      - start_line: 52
        end_line: 60
        file: ''
      uid: 2026b0d5-5f05-4062-ad45-20975bc1fa3f
    - text: For results of 'runs' or 'wickets', 'result_margin' should be a positive
        whole number; for 'wickets', it should be at most 10. Settlement converts
        the margin to an integer and labels it as runs or wickets. A Deequ constraint
