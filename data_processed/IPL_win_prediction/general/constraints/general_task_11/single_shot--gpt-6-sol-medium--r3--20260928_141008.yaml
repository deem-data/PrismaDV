constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", 'valid_date_format')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .satisfies("LOWER(TRIM(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin, result:
    code:
    - - .satisfies("CASE WHEN LOWER(TRIM(result)) = 'wickets' THEN result_margin <=
        10 ELSE TRUE END", 'valid_wicket_margin')
      - Valid
    - - .satisfies("CASE WHEN LOWER(TRIM(result)) IN ('runs', 'wickets') THEN result_margin
        IS NOT NULL AND result_margin > 0 AND result_margin = FLOOR(result_margin)
        ELSE TRUE END", 'valid_settlement_margin')
      - Valid
    assumptions: []
    column_name: result_margin, result
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .satisfies("UPPER(TRIM(super_over)) IN ('Y', 'N')", 'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs, result:
    code:
    - - .satisfies("CASE WHEN LOWER(TRIM(result)) <> 'no result' THEN target_overs
        IS NOT NULL AND target_overs > 0 ELSE TRUE END", 'target_overs_for_resulted_match')
      - Valid
    assumptions: []
    column_name: target_overs, result
  target_runs, result:
    code:
    - - .satisfies("CASE WHEN LOWER(TRIM(result)) <> 'no result' THEN target_runs
        IS NOT NULL AND target_runs > 0 ELSE TRUE END", 'target_runs_for_resulted_match')
      - Valid
    assumptions: []
    column_name: target_runs, result
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .satisfies("LOWER(TRIM(toss_decision)) IN ('bat', 'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner, team1, team2:
    code:
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner, team1, team2
  winner, result:
    code:
    - - .satisfies("CASE WHEN LOWER(TRIM(result)) <> 'no result' THEN winner IS NOT
        NULL ELSE TRUE END", 'winner_present_for_resulted_match')
      - Valid
    assumptions: []
    column_name: winner, result
  winner, team1, team2:
    code:
    - - .satisfies('winner IS NULL OR winner = team1 OR winner = team2', 'winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner, team1, team2
