constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin >= 0 AND result_margin = floor(result_margin))",
        'integer margin for runs and wickets results')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'valid super over indicator')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('target_overs IS NULL OR target_overs > 0', 'positive target overs
        when present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('target_runs IS NULL OR target_runs >= 0', 'nonnegative target
        runs when present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'distinct opposing teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .satisfies("lower(trim(toss_decision)) IN ('field', 'bat')", 'valid toss decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss winner is a
        participating team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR winner = team1 OR winner
        = team2", 'winner is a participating team for resulted matches')
      - Valid
    assumptions: []
    column_name: winner
