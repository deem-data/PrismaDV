constraints:
  date:
    code:
    - - .isComplete('date').satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND
        to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isPositive('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("method IS NULL OR method IN ('D/L', '', 'NA', 'NaN', 'nan', 'NULL',
        'Null', 'null', 'None', 'NullValue')", 'valid_optional_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result').satisfies("lower(trim(result)) IN ('runs', 'wickets',
        'tie', 'no result')", 'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0 AND result_margin = floor(result_margin))",
        'settlement_margin_is_positive_integer')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').satisfies('season >= 2008', 'valid_season')
      - Valid
    - - .satisfies("season = year(to_date(date, 'yyyy-MM-dd'))", 'season_matches_date')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').satisfies("upper(trim(super_over)) IN ('Y', 'N')",
        'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR (target_overs IS NOT NULL
        AND target_overs > 0)", 'resulted_match_has_positive_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("lower(trim(result)) = 'no result' OR (target_runs IS NOT NULL
        AND target_runs > 0)", 'resulted_match_has_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1').satisfies('team1 <> team2', 'different_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').satisfies("lower(trim(toss_decision)) IN ('bat',
        'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner = team1 OR toss_winner =
        team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("(lower(trim(result)) = 'no result' AND winner IS NULL) OR (lower(trim(result))
        <> 'no result' AND (winner = team1 OR winner = team2))", 'winner_matches_result_and_teams')
      - Valid
    assumptions: []
    column_name: winner
