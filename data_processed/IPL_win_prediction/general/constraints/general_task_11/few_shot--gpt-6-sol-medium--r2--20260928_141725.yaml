constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .satisfies("LOWER(TRIM(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("LOWER(TRIM(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0)", 'winning_margin_present_and_positive')
      - Valid
    - - .satisfies("result_margin IS NULL OR result_margin = CAST(result_margin AS
        BIGINT)", 'margin_can_be_converted_to_integer')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies("CAST(season AS DOUBLE) IS NOT NULL", 'season_is_numeric')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .satisfies("UPPER(TRIM(super_over)) IN ('Y', 'N')", 'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("target_overs IS NULL OR target_overs > 0", 'positive_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - '.hasNumberOfDistinctValues(''toss_decision'', lambda x: x == 2)'
      - Invalid
    - - .isComplete('toss_decision')
      - Valid
    - - .satisfies("LOWER(TRIM(toss_decision)) IN ('field', 'bat')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies("toss_winner IS NOT NULL AND toss_winner IN (team1, team2)", 'toss_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("LOWER(TRIM(result)) = 'no result' OR (winner IS NOT NULL AND winner
        IN (team1, team2))", 'resulted_match_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: winner
