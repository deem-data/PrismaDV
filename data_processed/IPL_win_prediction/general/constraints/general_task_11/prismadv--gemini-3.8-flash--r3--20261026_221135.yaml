    assumptions:
    - text: 'The year extracted from the ''date'' column should match the ''season''
        column for each record (i.e., EXTRACT(YEAR FROM TO_DATE(date)) = season).
        We could represent this assumption as a Deequ constraint like: .satisfies("YEAR(TO_DATE(date))
        == CAST(season AS INT)", "DateYearMatchesSeason")'
