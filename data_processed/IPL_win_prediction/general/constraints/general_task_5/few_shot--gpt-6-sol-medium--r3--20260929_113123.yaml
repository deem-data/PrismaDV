constraints:
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("match_type <> 'League' OR (result = 'tie' AND super_over = 'Y')
        OR (result <> 'tie' AND super_over = 'N')", 'league_tie_super_over_consistency')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'distinct_league_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR (result = 'no result' AND winner IS
        NULL) OR (result <> 'no result' AND winner IS NOT NULL AND (winner = team1
        OR winner = team2))", 'league_winner_consistency')
      - Valid
    assumptions: []
    column_name: winner
