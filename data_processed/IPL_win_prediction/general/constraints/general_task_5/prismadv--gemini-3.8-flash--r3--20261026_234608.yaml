prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('year(date) == season', 'Date year matches season')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 60b9bc3b-8e4e-4c68-8293-11e5109a29b4
      source_assumptions:
      - e324b515-6963-4e8d-825e-13cf1775fb15
    assumptions:
    - text: 'The year extracted from the ''date'' column should match the ''season''
        column, as season represents the calendar year of the match. This can be expressed
        as a Deequ constraint: .satisfies(''year(date) == season'', ''Date year matches
        season'')'
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: e324b515-6963-4e8d-825e-13cf1775fb15
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("(result = 'tie' AND super_over = 'Y') OR (result !=
        'tie' AND super_over = 'N')", "super_over_tie_consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 22a83c89-29ba-46aa-8490-be4dc2feaae4
      source_assumptions:
      - d527d079-15a8-487d-91e2-0551e38933aa
    assumptions:
    - text: 'A super over is played if and only if the match result is a tie (''super_over''
        == ''Y'' <=> ''result'' == ''tie''). When ''result'' is ''tie'', ''super_over''
        should be ''Y'', and when ''result'' is not ''tie'' (e.g., ''runs'', ''wickets'',
        ''no result''), ''super_over'' should be ''N''. We could represent this assumption
        as a deequ constraint like this: .satisfies("(result = ''tie'' AND super_over
        = ''Y'') OR (result != ''tie'' AND super_over = ''N'')", "super_over_tie_consistency")'
      sources:
      - start_line: 19
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 30
        file: ''
      uid: d527d079-15a8-487d-91e2-0551e38933aa
  '["result","winner"]':
    code:
    - suggestion: .satisfies("(`result` = 'no result' AND `winner` IS NULL) OR (`result`
        != 'no result' AND `winner` IS NOT NULL)", "Winner Nullness Consistency with
        Result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 2b0902b6-ee2d-49b1-8685-40d379b8c285
      source_assumptions:
      - 915bdd1e-2f26-4bb8-9c36-8e85f60bed18
    assumptions:
    - text: 'If ''result'' is not ''no result'', ''winner'' must not be null, and
        conversely if ''result'' is ''no result'', ''winner'' should be null. The
        downstream logic marks matches where ''result == no result'' as no-results
        (awarding 1 point each) and otherwise requires a non-null ''winner'' to identify
        the winning team and losing team. If ''winner'' is null when ''result'' is
        not ''no result'', both teams would improperly be marked as losers and awarded
        0 points. We could represent this assumption as a Deequ constraint like: .satisfies("(result
        = ''no result'' AND winner IS NULL) OR (result != ''no result'' AND winner
        IS NOT NULL)", "Winner Nullness Consistency with Result")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 33
        file: ''
      uid: 915bdd1e-2f26-4bb8-9c36-8e85f60bed18
  '["team1","team2","winner"]':
    code:
    - suggestion: .satisfies("`winner` IS NULL OR `winner` = `team1` OR `winner` =
        `team2`", "Winner must be team1 or team2")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4ba36fd6-4667-46a3-b905-e330f803924f
      source_assumptions:
      - 7ba92c91-e74c-413a-8970-81efc7b9d367
    - suggestion: .satisfies("`team1` != `team2`", "Teams must be distinct")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ef96217b-a482-48af-a32a-389998412878
      source_assumptions:
      - 0424335e-61d6-4bfc-b4a3-151c885cb452
    assumptions:
    - text: 'When ''winner'' is not null, its value must be equal to either ''team1''
        or ''team2''. Otherwise, neither participating team will be identified as
        the winner in downstream calculations, leading to invalid win/loss/point metrics.
        In Deequ, this can be expressed as: .satisfies("winner IS NULL OR winner =
        team1 OR winner = team2", "Winner must be team1 or team2")'
      sources:
      - start_line: 21
        end_line: 30
        file: ''
      uid: 7ba92c91-e74c-413a-8970-81efc7b9d367
    - text: '''team1'' and ''team2'' must not be identical for any match record, ensuring
        that matches are played between two distinct teams. If team1 equals team2,
        a single match would produce duplicate entries for the same team within the
        same match ID. In Deequ, this can be expressed as: .satisfies("team1 != team2",
        "Teams must be distinct")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 0424335e-61d6-4bfc-b4a3-151c885cb452
  '["team1","team2"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'team1_ne_team2')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 378adb3b-fbb8-4bf0-8302-774b742b440f
      source_assumptions:
      - f9cf498c-06e0-458a-8741-52deb2948ad5
    assumptions:
    - text: 'For each match record, ''team1'' and ''team2'' must be distinct teams
        (i.e., ''team1'' != ''team2''). The downstream logic splits matches into separate
        participation records for ''team1'' and ''team2'' and aggregates performance
        metrics by team; if ''team1'' and ''team2'' were the same team, matches, wins/losses,
        and points would be double-counted for that team. We could represent this
        assumption as a deequ constraint like this: .satisfies(''team1 != team2'',
        ''DistinctTeamsConstraint'')'
      sources:
      - start_line: 18
        end_line: 23
        file: ''
      uid: f9cf498c-06e0-458a-8741-52deb2948ad5
