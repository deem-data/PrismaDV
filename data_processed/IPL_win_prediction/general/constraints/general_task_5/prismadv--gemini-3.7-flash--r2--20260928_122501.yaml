prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year extracted from the ''date'' column should match or be consistent
        with the ''season'' column for each match record, as the season represents
        the calendar year in which the matches take place. We could represent this
        assumption as a Deequ constraint like: .satisfies("YEAR(TO_DATE(date)) ==
        CAST(season AS INT)", "season_matches_date_year")'
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: c7809f38-7526-4424-ad50-5bcad22117c5
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'The ''super_over'' and ''result'' columns should have a mutually consistent
        relationship: a match has ''super_over'' equal to ''Y'' if and only if ''result''
        is ''tie''. If ''super_over'' is ''N'', ''result'' cannot be ''tie''. This
        can be represented as a Deequ constraint: .satisfies("(super_over = ''Y''
        AND result = ''tie'') OR (super_over = ''N'' AND result != ''tie'')", "super_over_tie_consistency")'
      sources:
      - start_line: 19
        end_line: 28
        file: ''
      uid: 28ffb766-ab1b-4fa3-a165-2a0fdd798dd9
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' is not ''no result'', the ''winner'' column should not
        be null, and when ''result'' is ''no result'', ''winner'' should be null.
        We could represent this assumption as a deequ constraint like this:

        .satisfies("(result = ''no result'' AND winner IS NULL) OR (result != ''no
        result'' AND winner IS NOT NULL)", "WinnerNullCheckBasedOnResult")

        '
      sources:
      - start_line: 21
        end_line: 33
        file: ''
      uid: d4416670-c438-489e-974b-2eda8501a813
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: For every match, 'team1' and 'team2' should be distinct teams (team1 !=
        team2) so that a match is played between two different teams.
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      uid: 5fd1ea21-f011-4779-b717-1257a48762ce
    - text: When a 'winner' is specified (not null), the value of 'winner' must be
        equal to either 'team1' or 'team2' so that the win and corresponding points
        are correctly attributed to one of the participating teams.
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      uid: 51d55a85-ce10-4fa4-b6ba-bd83fcee78fb
  '["team1","team2"]':
    code: []
    assumptions:
    - text: '''team1'' and ''team2'' must be distinct for every match record so that
        a team does not play against itself, which would cause duplicate participant
        records and incorrect point calculations. We could represent this assumption
        as a Deequ constraint: .satisfies("team1 != team2", "team1 and team2 must
        be distinct")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      uid: 32c537f7-e6d4-47d4-ba0d-e06689b3ee4e
  date:
    code:
    - suggestion: '.satisfies("CASE WHEN `date` IS NOT NULL THEN 1 ELSE 0 END", "Date
        parsed to datetime", lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6f1e12cb-7c70-4f3d-ac54-3cf6089ffcb3
      source_assumptions:
      - de33f968-fd43-4b9a-bb49-0fe829966aa5
    assumptions:
    - text: 'The ''date'' column is converted to datetime format using `errors=''coerce''`,
        which implies that values in the column are expected to be parseable date/datetime
        strings, though invalid or unparseable formats are allowed and will be coerced
        to null.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `date` IS NOT NULL THEN 1 ELSE 0 END", "Date parsed
        to datetime", lambda x: x >= 0.0)'
      sources:
      - start_line: 15
        end_line: 15
        file: ''
      uid: de33f968-fd43-4b9a-bb49-0fe829966aa5
  id:
    code:
