      sources:
      - start_line: 12
        end_line: 12
        file: ''
      uid: 3a96d85c-2d82-48e8-b663-9dfe2dc8b83e
  result:
    code:
    - suggestion: .isComplete('result')
      validity: true
      reason_if_invalid: ''
      level: warning
