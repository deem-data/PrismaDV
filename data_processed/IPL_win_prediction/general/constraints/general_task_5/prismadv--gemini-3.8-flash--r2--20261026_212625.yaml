      reason_if_invalid: ''
      level: warning
      uid: 7dbab803-a2c5-4382-948d-1ec2d4397838
      source_assumptions:
      - 3c3f3985-79b8-4f2e-8a63-f8e4af868fa9
    assumptions:
    - text: 'The calendar year extracted from the ''date'' column should match the
        ''season'' column, as the downstream code relies on the season representing
        the calendar year of the matches for grouping and standings calculation. We
        could represent this assumption as a Deequ constraint like this: .satisfies("year(to_date(date))
        == cast(season as int)", "DateYearMatchesSeason")'
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: 3c3f3985-79b8-4f2e-8a63-f8e4af868fa9
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("(`result` = 'tie' AND `super_over` = 'Y') OR (`result`
        != 'tie' AND `super_over` = 'N')", "Tie and super_over consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 5854fb0a-fd16-4f2c-a584-e2523cb39a3f
      source_assumptions:
      - 3d7dd118-cad3-485f-8c0e-8ab0b8026a99
    assumptions:
    - text: 'A match result of ''tie'' implies that a super over was played (''super_over''
        == ''Y''), and vice versa: whenever ''super_over'' is ''Y'', ''result'' must
        be ''tie''. We could represent this assumption as a Deequ constraint like:
        .satisfies("(result = ''tie'' AND super_over = ''Y'') OR (result != ''tie''
        AND super_over = ''N'')", "Tie and super_over consistency")'
      sources:
      - start_line: 19
        end_line: 28
        file: ''
      uid: 3d7dd118-cad3-485f-8c0e-8ab0b8026a99
  '["result","winner"]':
    code:
    - suggestion: .satisfies("CASE WHEN `result` = 'no result' THEN `winner` IS NULL
        ELSE `winner` IS NOT NULL END", "winner_result_consistency")
