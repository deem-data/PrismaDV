      reason_if_invalid: ''
      level: warning
      uid: cb14498c-9107-49fe-a05c-4bfd0f9bbe8b
      source_assumptions:
      - 70e65671-a043-4a55-847d-fb404b51ae8f
    - suggestion: .satisfies("`winner` IS NULL OR `winner` = `team1` OR `winner` =
        `team2`", "WinnerIsParticipant")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e79a9ac8-33a5-4643-8e30-ff670cbe8828
      source_assumptions:
      - ec290898-b789-4371-8ea4-30d55e46f566
    assumptions:
    - text: 'For every match, ''team1'' and ''team2'' must be distinct teams. If ''team1''
        equals ''team2'', unpivoting the participants causes duplicated match and
        standings entries for the same team. We could represent this assumption as
        a Deequ constraint like: .satisfies("team1 != team2", "DistinctTeams")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 70e65671-a043-4a55-847d-fb404b51ae8f
    - text: 'When a match produces a winner (''winner'' is not null), the ''winner''
        column must equal either ''team1'' or ''team2''. If the winner is neither
        team, the winner logic in participants[''winner''] == participants[''team'']
        will award losses to both teams and no win to either. We could represent this
        assumption as a Deequ constraint like: .satisfies("winner IS NULL OR winner
        = team1 OR winner = team2", "WinnerIsParticipant")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      uid: ec290898-b789-4371-8ea4-30d55e46f566
