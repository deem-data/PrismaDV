    - text: 'For every match where ''result'' is not ''no result'' (such as ''runs'',
        ''wickets'', or ''tie''), ''winner'' must not be null. Conversely, when ''result''
        is ''no result'', ''winner'' should be null. We could represent this assumption
        as a Deequ constraint: .satisfies("CASE WHEN result = ''no result'' THEN winner
        IS NULL ELSE winner IS NOT NULL END", "winner_result_consistency")'
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      uid: 1c6cbcb0-e01d-4834-9efd-5dde276a2c2f
