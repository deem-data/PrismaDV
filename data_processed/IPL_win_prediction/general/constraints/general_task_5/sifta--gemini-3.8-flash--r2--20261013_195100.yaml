      \ `row['col']`, `df[['col', ...]]`\n   - Column lists or membership checks:\
      \ `for col in ['col', ...]`, `'col' in df.columns`\n   - DataFrame/Series operations:\
      \ `.sort_values(by=...)`, `.groupby(...)`, `.drop(...)`, `.fillna(...)`, `.astype(...)`\n\
      \   - Dictionary constructions or output mappings: `{'col': ...}`, `{...: row['col']}`\n\
      3. Trace variable aliases:\n   - When a column value is unpacked or assigned\
      \ to a local variable (e.g., `target_overs = row['target_overs']...`), include\
      \ the assignment line AND all subsequent lines where that variable is read,\
      \ converted (e.g., `float(target_overs)`), checked in conditions, or outputted.\n\
      4. Verify line contents:\n   - Cross-check that the line at `start_line` actually\
      \ contains the target column name or its direct variable alias before emitting\
      \ it. Do not return lines belonging to preceding or subsequent unrelated statements.\
      \ Group contiguous matching lines into a single range.\n\nOutput only JSON:\
      \ { \"sources\": [{ \"start_line\": int, \"end_line\": int }, ...] }"
    assumption_generation: "Code makes assumptions about its input data, often without\
      \ stating them. Analyze the code that uses the target column, the target column\
      \ description (data type, completeness, distinct counts), and the downstream\
      \ task description to identify assumptions that are essential for correct execution.\n\
      \nFocus specifically on properties whose violation would either:\n1. Crash the\
      \ code (e.g., unhandled type errors, missing values passed to strict casts like\
      \ float(), int(), or .astype(), unhandled keys in lookups).\n2. Silently produce\
      \ incorrect results (e.g., negative values in counts/metrics, corrupted data\
      \ types propagating to output files/aggregations, categorical values failing\
      \ cross-column invariants like a winner not matching either participating team).\n\
      \nGuidelines for robust assumptions:\n- Data type invariants: Check whether\
      \ the column must conform to an expected data type (e.g., Numeric/Fractional/Integral\
      \ for metrics, String for identifiers/text). Type mismatches crash strict casts\
      \ like `float()` or corrupt downstream datasets.\n- Numeric domain & lower bounds:\n\
      \  - For counts, scores, overs, runs, and margins, assume values are non-negative\
      \ (>= 0), NOT strictly positive (> 0), unless the code explicitly performs division\
      \ or requires strictly positive values. In domain data (such as sports/IPL data),\
      \ 0 is often a legitimate valid value (e.g., 0 overs in abandoned matches, 0\
      \ margin, 0 runs). Strict positivity (> 0) triggers false alarms on safe data.\n\
      - Branch-scoped / Conditional usage:\n  - If a column is only read or transformed\
      \ inside a specific conditional branch (e.g., only when `method == 'D/L'`, or\
      \ only when `result in ('runs', 'wickets')`), state the assumption conditionally\
      \ on that branch. Unconditional assumptions on columns that safe code ignores\
      \ outside specific branches cause false alarms on clean data.\n- Completeness\
      \ vs Tolerance:\n  - Only assume 100% completeness if missing values directly\
      \ crash execution (e.g. unhandled nulls passed to `float()`, `int()`, or dictionary\
      \ lookups). If the code handles nulls gracefully (e.g., via `fillna`, `.get()`,\
      \ or `pd.notna(x) else ''`), safe partitions may contain benign missing values;\
      \ assume high completeness (>= 95%) rather than zero tolerance.\n\nState each\
      \ assumption as a clear property about the input data that a Deequ check can\
      \ test. Avoid overly rigid assumptions (e.g., strict positivity when 0 is allowed)\
      \ that safe partitions could benignly violate.\n\nOutput only valid JSON (numbers\
      \ without leading zeros): { \"assumptions\": [{ \"text\": str, \"sources\":\
      \ [{ \"start_line\": int, \"end_line\": int }] }, ...] }"
    ir_generation: "Translate the assumptions into PyDeequ checks.\n\nGuidelines for\
