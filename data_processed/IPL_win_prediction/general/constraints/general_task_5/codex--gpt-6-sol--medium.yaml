prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport pandas as pd\nimport numpy as np\n\n\ndef generate_points_table(df:\
  \ pd.DataFrame) -> pd.DataFrame:\n    # Work on a copy\n    df = df.copy()\n\n \
  \   # Focus on league-stage matches only for standings\n    df = df[df['match_type']\
  \ == 'League'].copy()\n\n    # Normalize types used downstream\n    df['date'] =\
  \ pd.to_datetime(df['date'], errors='coerce')\n    df['season_int'] = pd.to_numeric(df['season'],\
  \ errors='coerce')\n    # We rely on season as a calendar year for grouping and\
  \ reporting\n    # Matches must be between two distinct teams to award points correctly\n\
  \    # Tie after 20 overs must imply a super over was played, and vice versa\n \
  \   # Construct per-team participation rows\n    left = df[['id', 'season_int',\
  \ 'team1', 'winner', 'result', 'super_over']].rename(columns={'team1': 'team'})\n\
  \    right = df[['id', 'season_int', 'team2', 'winner', 'result', 'super_over']].rename(columns={'team2':\
  \ 'team'})\n    participants = pd.concat([left, right], ignore_index=True)\n\n \
  \   # Before awarding points, ensure winner logic and NR logic are consistent\n\
  \    # Compute per-team metrics\n    participants['is_nr'] = participants['result']\
  \ == 'no result'\n    participants['is_tie_in_overs'] = participants['super_over']\
  \ == 'Y'\n    participants['is_winner'] = (participants['winner'] == participants['team'])\
  \ & (~participants['is_nr'])\n    participants['is_loser'] = (~participants['is_winner'])\
  \ & (~participants['is_nr'])\n\n    # Points: 2 for winner, 0 for loser, 1 each\
  \ for no result\n    participants['points'] = np.where(participants['is_nr'], 1,\
  \ np.where(participants['is_winner'], 2, 0))\n\n    agg = participants.groupby(['season_int',\
  \ 'team'], as_index=False).agg(\n        matches=('id', 'count'),\n        wins=('is_winner',\
  \ 'sum'),\n        losses=('is_loser', 'sum'),\n        no_results=('is_nr', 'sum'),\n\
  \        super_over_played=('is_tie_in_overs', 'sum'),\n        points=('points',\
  \ 'sum')\n    )\n\n    # Derive win percentage\n    denom = (agg['matches'] - agg['no_results']).replace({0:\
  \ np.nan})\n    agg['win_pct'] = (agg['wins'] / denom * 100).round(2)\n\n    # Sort\
  \ and rank within season by points, then wins\n    agg.sort_values(['season_int',\
  \ 'points', 'wins', 'team'], ascending=[True, False, False, True], inplace=True)\n\
  \    agg['rank'] = agg.groupby('season_int')['points'].rank(method='dense', ascending=False).astype(int)\n\
  \n    # Final column order\n    agg.rename(columns={'season_int': 'season'}, inplace=True)\n\
  \    agg = agg[['season', 'rank', 'team', 'matches', 'wins', 'losses', 'no_results',\
  \ 'super_over_played', 'points', 'win_pct']]\n\n    return agg\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_path = args.input\n    output_path\
  \ = args.output\n    os.makedirs(output_path, exist_ok=True)\n\n    input_file =\
  \ os.path.join(input_path, 'new_data.csv')\n    df = pd.read_csv(input_file)\n\n\
  \    standings = generate_points_table(df)\n\n    out_file = os.path.join(output_path,\
  \ 'season_standings.csv')\n    standings.to_csv(out_file, index=False)\n\n\nif __name__\
  \ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at `./code/general_task_5.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 260, 'season': 2017, 'city': 'Bengaluru',\
  \ 'date': '2017-04-08', 'match_type': 'League', 'player_of_match': 'KM Jadhav',\
  \ 'venue': 'M.Chinnaswamy Stadium', 'team1': 'Royal Challengers Bangalore', 'team2':\
  \ 'Delhi Daredevils', 'toss_winner': 'Royal Challengers Bangalore', 'toss_decision':\
  \ 'bat', 'winner': 'Royal Challengers Bangalore', 'result': 'runs', 'result_margin':\
  \ 15.0, 'target_runs': 158.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'S Ravi', 'umpire2': 'VK Sharma'}, {'id': 341, 'season': 2012,\
  \ 'city': 'Bangalore', 'date': '2012-04-15', 'match_type': 'League', 'player_of_match':\
  \ 'AM Rahane', 'venue': 'M Chinnaswamy Stadium', 'team1': 'Royal Challengers Bangalore',\
  \ 'team2': 'Rajasthan Royals', 'toss_winner': 'Rajasthan Royals', 'toss_decision':\
  \ 'bat', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin': 59.0,\
  \ 'target_runs': 196.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan,\
  \ 'umpire1': 'JD Cloete', 'umpire2': 'RJ Tucker'}, {'id': 47, 'season': 2024, 'city':\
  \ 'Ahmedabad', 'date': '2024-03-24', 'match_type': 'League', 'player_of_match':\
  \ 'B Sai Sudharsan', 'venue': 'Narendra Modi Stadium, Ahmedabad', 'team1': 'Gujarat\
  \ Titans', 'team2': 'Mumbai Indians', 'toss_winner': 'Mumbai Indians', 'toss_decision':\
  \ 'field', 'winner': 'Gujarat Titans', 'result': 'runs', 'result_margin': 6.0, 'target_runs':\
  \ 169.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'VA\
  \ Kulkarni', 'umpire2': 'VK Sharma'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
