constraints:
  id:
    code:
    - - .satisfies("match_type <> 'League' OR id IS NOT NULL", 'league_match_id_present')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .satisfies("match_type <> 'League' OR result IN ('runs', 'wickets', 'tie',
        'no result')", 'league_result_valid')
      - Valid
    assumptions: []
    column_name: result
  season:
    code:
    - - .satisfies("match_type <> 'League' OR season IS NOT NULL", 'league_season_present')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("match_type <> 'League' OR (result = 'tie' AND super_over = 'Y')
        OR (result <> 'tie' AND super_over = 'N')", 'tie_matches_super_over')
      - Valid
    - - .satisfies("match_type <> 'League' OR super_over IN ('Y', 'N')", 'league_super_over_valid')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .satisfies("match_type <> 'League' OR (team1 IS NOT NULL AND team2 IS NOT
        NULL AND team1 <> team2)", 'league_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'no result' OR winner IS NULL",
        'no_result_has_no_winner')
      - Valid
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR winner IN (team1,
        team2)", 'league_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
