prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies("YEAR(TO_DATE(`date`)) = `season`", "date_year_equals_season")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a5454d87-7028-47ba-9da7-e1823ccb51e5
      source_assumptions:
      - 0b879933-f254-4c28-825b-779a452f5494
    assumptions:
    - text: The year extracted from the 'date' column should match the 'season' column
        for each record, as the season represents the calendar year in which the match
        took place. We could represent this assumption as a Deequ constraint or custom
        verification checking that `year(to_date(date)) == season`.
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: 0b879933-f254-4c28-825b-779a452f5494
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'The columns ''super_over'' and ''result'' must have a consistent relationship:
        a super over is played (''super_over'' == ''Y'') if and only if the match
        result was a tie (''result'' == ''tie''). When ''super_over'' is ''N'', ''result''
        should not be ''tie''. We can express this constraint in Deequ as: .satisfies("(super_over
        = ''Y'' AND result = ''tie'') OR (super_over = ''N'' AND result != ''tie'')",
        "super_over_matches_tie_result")'
      sources:
      - start_line: 19
        end_line: 19
        file: ''
      - start_line: 27
        end_line: 28
        file: ''
      uid: 9b0bb3ea-18e0-4d5b-b0c9-0806b0617321
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When the ''result'' is not ''no result'', ''winner'' should not be null;
        conversely, if ''result'' is ''no result'', ''winner'' is typically null.
        We can represent this assumption as a Deequ constraint: .satisfies("(result
        = ''no result'' AND winner IS NULL) OR (result != ''no result'' AND winner
        IS NOT NULL)", "WinnerConsistencyWithResult")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 33
        file: ''
      uid: 92ba05fe-ac81-4ac1-a531-2b4a472a24c4
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'For each match, ''team1'' and ''team2'' must be distinct teams (i.e.,
        ''team1'' != ''team2''). We can represent this assumption as a Deequ constraint:
        .satisfies(''team1 != team2'', ''DistinctTeams'')'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 2a264243-c7c6-4544-8087-2fd0cd059ec9
    - text: 'When ''winner'' is not null, ''winner'' must be either ''team1'' or ''team2''
        (i.e., ''winner == team1 OR winner == team2''). We can represent this assumption
        as a Deequ constraint: .satisfies(''winner IS NULL OR winner == team1 OR winner
        == team2'', ''ValidWinner'')'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 29
        end_line: 33
        file: ''
      uid: ca187de1-1a60-4c65-9fe0-a51808a18e19
  '["team1","team2"]':
    code: []
    assumptions:
    - text: 'For each match, ''team1'' and ''team2'' must be distinct teams (i.e.,
        ''team1 != team2''), because matches are played between two different teams
        and each match row is split into two participant records for aggregation.
        We could represent this assumption as a deequ constraint like this: .satisfies(''team1
        != team2'', ''DistinctTeamsConstraint'')'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: e9aefd81-1ebb-4d54-8fc7-403b1e65967c
