  super_over:
    code:
    - suggestion: '.hasCompleteness(''super_over'', lambda x: x >= 0.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: fe2b063c-17bf-4e4c-b763-24df31853a8b
      source_assumptions:
