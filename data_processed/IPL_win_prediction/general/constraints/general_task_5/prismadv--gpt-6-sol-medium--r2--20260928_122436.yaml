        receives a win or the associated two points. This requirement need not apply
        to no-result matches, for which the code awards both teams one point regardless
        of 'winner'.
      sources:
      - start_line: 12
        end_line: 12
        file: ''
      - start_line: 27
        end_line: 33
        file: ''
      uid: fd82a822-2eeb-44dd-9ffe-6050e3f32505
