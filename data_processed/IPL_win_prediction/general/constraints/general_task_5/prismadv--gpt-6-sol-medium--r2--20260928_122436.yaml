    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN CASE WHEN
        (`super_over` = ''Y'') = COALESCE(`result` = ''tie'', FALSE) THEN 1 ELSE 0
        END ELSE 1 END = 1", ''league_tie_super_over_consistency'', lambda x: x ==
        1)'
      validity: true
