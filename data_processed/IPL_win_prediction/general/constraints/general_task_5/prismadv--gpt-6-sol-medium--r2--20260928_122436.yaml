    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN CASE WHEN
        `super_over` IN (''Y'', ''N'') THEN 1 ELSE 0 END ELSE 1 END = 1", ''valid_league_super_over'',
        lambda x: x == 1)'
      validity: true
