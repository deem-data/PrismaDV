      - start_line: 35
        end_line: 40
        file: ''
      uid: d91d8db9-e76b-4292-af58-e0cc75cf59f2
    - text: For league-stage matches, 'super_over' should be non-null and contain
        only the exact string values 'Y' or 'N'. The code counts only 'Y' as a super
        over; nulls, other values, or different capitalization would silently count
        as no super over.
      sources:
      - start_line: 12
