    assumptions:
    - text: The input data should contain a 'winner' column whose non-null values
        are team-name strings that can be compared exactly with 'team1' and 'team2'.
        Inconsistent spelling, casing, or whitespace would cause a winning team to
        be counted as a loser.
      sources:
      - start_line: 21
