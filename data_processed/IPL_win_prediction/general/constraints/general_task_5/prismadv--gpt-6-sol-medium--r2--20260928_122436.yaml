        those matches from the standings.
      sources:
      - start_line: 12
        end_line: 16
        file: ''
      - start_line: 21
        end_line: 35
        file: ''
      uid: c59be038-e190-424b-801d-20b81cdf0029
    - text: For every row where match_type is 'League', season should be convertible
        to a finite, whole-number calendar year. A nonnumeric value would become null
        during conversion and be omitted from the standings; a fractional value would
        create an invalid season group.
      sources:
      - start_line: 16
