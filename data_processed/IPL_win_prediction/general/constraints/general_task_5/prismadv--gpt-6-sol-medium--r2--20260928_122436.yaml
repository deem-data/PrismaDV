  team1:
    code:
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' THEN `team1` IS NOT
        NULL AND length(trim(`team1`)) > 0 ELSE TRUE END", "league_team1_present_and_nonblank")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1961ad62-a11c-4934-b7b2-8d1adbc83b7d
      source_assumptions:
      - 46123501-b95a-4cdc-bcd0-647a6834a9ce
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' THEN `team1` IS NOT
        NULL AND `team2` IS NOT NULL AND `team1` <> `team2` ELSE TRUE END", "league_teams_distinct")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 70f8608f-a73f-4574-a657-de925a16279b
      source_assumptions:
      - ca16909f-def3-4880-81a7-135d295fbc1f
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' AND (`result` IS NULL
        OR `result` <> 'no result') THEN `winner` IS NOT NULL AND ((`winner` = `team1`
        AND `winner` <> `team2`) OR (`winner` = `team2` AND `winner` <> `team1`))
        ELSE TRUE END", "league_winner_matches_exactly_one_team")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b288107c-1e2c-4b60-bc55-7563570d6660
      source_assumptions:
      - 3ac40294-8991-437d-8402-7ffde662f3a3
    - suggestion: .satisfies("CASE WHEN `match_type` = 'League' THEN `team1` IS NOT
        NULL AND `team1` = trim(`team1`) ELSE TRUE END", "league_team1_has_no_surrounding_whitespace")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 06976abc-4a2d-4901-a22c-79b08d35575d
      source_assumptions:
      - 33c229a9-cf45-41f2-827e-e962b522d605
    assumptions:
    - text: 'The input must contain a ''team1'' column. For rows where match_type
        is ''League'', team1 should be a non-null, non-blank string: missing team
        names would be excluded from the team-level groupby and standings.'
      sources:
      - start_line: 12
        end_line: 12
        file: ''
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 46123501-b95a-4cdc-bcd0-647a6834a9ce
    - text: For every League match, team1 should differ from team2. Otherwise, the
        same team would receive two participation rows for one match and its standings
        would be counted incorrectly.
      sources:
      - start_line: 18
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: ca16909f-def3-4880-81a7-135d295fbc1f
    - text: For League matches whose result is not 'no result', the winner should
        match exactly one of team1 or team2. In particular, a team1 victory must use
        the same string in winner and team1; otherwise, the code will award team1
        a loss instead of a win.
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 33
        file: ''
      uid: 3ac40294-8991-437d-8402-7ffde662f3a3
    - text: Team names in team1 should use consistent spelling, capitalization, and
        whitespace across League matches and with the corresponding names in team2
        and winner. The code performs exact string comparisons and groups by the unnormalized
        name, so variants would split one team's standings or misclassify a win.
      sources:
      - start_line: 21
        end_line: 29
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 33c229a9-cf45-41f2-827e-e962b522d605
  team2:
    code:
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN `team2` IS
        NOT NULL AND length(trim(`team2`)) > 0 ELSE true END", "league_team2_present",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a23fb3b3-d801-427a-8442-0f15110d8498
      source_assumptions:
      - b1126121-3d89-4246-bc88-4e49909217f9
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN coalesce(`team2`
        <> `team1`, false) ELSE true END", "league_teams_distinct", lambda x: x ==
        1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9baf0906-6173-4f99-9820-f0eedad579e8
      source_assumptions:
      - c1157fe9-3aea-4c7f-8db8-71ca76519097
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND `result` IS
        NOT NULL AND `result` <> ''no result'' THEN coalesce(`winner` = `team1` OR
        `winner` = `team2`, false) ELSE true END", "league_winner_is_participant",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e24ebbd9-f530-4096-bb0e-c1d395f978cf
      source_assumptions:
      - cac40acb-a35d-486a-97d3-8080d157927d
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' THEN coalesce(`team2`
        = trim(`team2`), false) ELSE true END", "league_team2_no_outer_whitespace",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bb9d956a-ab37-4ed1-8d1a-01435b506198
      source_assumptions:
      - de01532a-c3e1-4a55-8b2a-51b71dc2cc8c
    assumptions:
    - text: For rows where `match_type` is `League`, `team2` should be a non-null,
        non-empty string. Otherwise, that team's participation may be omitted from
        the standings or grouped under an invalid name.
      sources:
      - start_line: 12
        end_line: 12
        file: ''
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 35
        file: ''
      uid: b1126121-3d89-4246-bc88-4e49909217f9
    - text: For each League match, `team2` should differ from `team1`. A match between
        a team and itself would produce two participation rows for the same team and
        award points incorrectly.
      sources:
      - start_line: 18
        end_line: 18
        file: ''
      - start_line: 21
        end_line: 23
        file: ''
      uid: c1157fe9-3aea-4c7f-8db8-71ca76519097
    - text: For League matches whose `result` is not `no result`, `winner` should
        equal either `team1` or `team2`. In particular, when `team2` won, its value
        must exactly match `winner`; otherwise the code counts it as a loss.
      sources:
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 33
        file: ''
      uid: cac40acb-a35d-486a-97d3-8080d157927d
    - text: League-match `team2` values should use consistent team names, without
        leading or trailing whitespace. The code compares names exactly to `winner`
        and groups standings by the unnormalized name.
      sources:
      - start_line: 22
        end_line: 29
        file: ''
      - start_line: 35
        end_line: 35
        file: ''
      uid: de01532a-c3e1-4a55-8b2a-51b71dc2cc8c
  winner:
    code:
    - suggestion: '.satisfies("CASE WHEN `match_type` = ''League'' AND (`result` IS
        NULL OR `result` <> ''no result'') THEN `winner` IS NOT NULL AND (`winner`
        = `team1` OR `winner` = `team2`) ELSE TRUE END", "league_match_winner_is_participant",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
