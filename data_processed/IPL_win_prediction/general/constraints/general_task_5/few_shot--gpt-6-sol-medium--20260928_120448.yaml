constraints:
  date:
    code:
    - - .satisfies("`match_type` <> 'League' OR to_date(`date`, 'yyyy-MM-dd') IS NOT
        NULL", 'league_date_is_parseable')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .satisfies("`match_type` <> 'League' OR `id` IS NOT NULL", 'league_match_id_present')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("`match_type` <> 'League' OR `result` IN ('runs', 'wickets', 'tie',
        'no result')", 'league_result_is_recognized')
      - Valid
    assumptions: []
    column_name: result
  season:
    code:
    - - .satisfies("`match_type` <> 'League' OR (`season` IS NOT NULL AND `season`
        > 0)", 'league_season_is_valid_year')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("`match_type` <> 'League' OR (`result` = 'tie' AND `super_over`
        = 'Y') OR (`result` <> 'tie' AND `super_over` = 'N')", 'league_tie_matches_super_over')
      - Valid
    - - .satisfies("`match_type` <> 'League' OR `super_over` IN ('Y', 'N')", 'league_super_over_is_valid')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .satisfies("`match_type` <> 'League' OR (`team1` IS NOT NULL AND `team2` IS
        NOT NULL AND `team1` <> `team2`)", 'league_has_two_distinct_teams')
      - Valid
    assumptions: []
    column_name: team1
  winner:
    code:
    - - .satisfies("`match_type` <> 'League' OR (`result` = 'no result' AND `winner`
        IS NULL) OR (`result` <> 'no result' AND (`winner` = `team1` OR `winner` =
        `team2`))", 'league_winner_matches_result_and_teams')
      - Valid
    assumptions: []
    column_name: winner
