      \ engineer. Your task is to translate data assumptions into PyDeequ validation\
      \ checks for a specific `target_column` in a data pipeline.\n\n---\n\n### Input\
      \ Format\nYou will be provided with:\n1. `target_column`: Name of the column\
      \ under evaluation.\n2. `target_column_desc`: Profiling metadata for `target_column`\
      \ (e.g., `completeness`, `dataType`, `approximateNumDistinctValues`, `typeCounts`).\n\
      3. `code_snippet`: The Python/pandas script that ingests and processes the data.\n\
      4. `downstream_task_description`: Context on downstream usage.\n5. `assumptions`:\
      \ A numbered list of assumptions (starting at index 0) describing expected data\
      \ properties.\n\n---\n\n### Output Format\nReturn a valid JSON object with the\
      \ key `\"constraint_code\"`, containing a list of check objects:\n```json\n\
      {\n  \"constraint_code\": [\n    {\n      \"suggestion\": \".isComplete('column_name')\"\
      ,\n      \"level\": \"error\",\n      \"linked assumptions\": [0]\n    }\n \
      \ ]\n}\n```\nEach check object must have:\n- `suggestion`: PyDeequ check code\
      \ starting with a dot (`.`).\n- `level`: Exactly `\"error\"` or `\"warning\"\
      `.\n- `linked assumptions`: List of integer assumption indices (0-based) tested\
      \ by this check.\n\n---\n\n### Key Operational Rules & Best Practices\n\n####\
      \ 1. Deciding Severity Level (`error` vs `warning`)\n- **`level: \"error\"`**:\n\
      \  - Use when violating the check will crash downstream code (e.g., `KeyError`,\
      \ `ZeroDivisionError`, `ValueError: invalid literal for int()`, missing required\
      \ column, unhandled null in arithmetic/joins) or cause fatal corruption of pipeline\
      \ results.\n  - **Crucial**: The test framework only flags unsafe batches if\
      \ a check with `level: \"error\"` fails! Setting everything to `\"warning\"\
      ` will catch **zero** errors and result in a 0 recall score. At least one critical\
      \ check must be set to `\"error\"` if the assumption protects against pipeline-breaking\
      \ data.\n- **`level: \"warning\"`**:\n  - Use when violating the check degrades\
      \ data quality or causes slight semantic drift, but the script executes successfully\
      \ (e.g., optional metadata, non-critical categorical values, graceful fallbacks\
      \ like `row['city'] if pd.notna(...) else ''`).\n  - Use `\"warning\"` for strict\
      \ relational or categorical checks where safe data is known to contain noise\
      \ or outliers, preventing false alarms.\n\n#### 2. NEVER Use Tautological /\
      \ Vacuous Lambdas\n- **Never write** `.hasCompleteness('col', lambda x: x >=\
      \ 0)`! Completeness fractions are mathematically bounded in `[0.0, 1.0]`. A\
      \ condition `x >= 0` is **always true**, will never fail, and will catch **0\
      \ of 10** unsafe batches.\n- When an assumption states \"Column X must be present\
      \ / exist\":\n  - Check `target_column_desc['completeness']`.\n  - If baseline\
      \ completeness is `1.0` (or the column is non-nullable downstream), check `.isComplete('col')`.\n\
      \  - If baseline completeness allows missing values (e.g., `0.98`), use `.hasCompleteness('col',\
      \ lambda x: x >= threshold)` with a reasonable lower bound (e.g., `x >= 0.90`\
      \ or `x > 0`), **never** `x >= 0`.\n\n#### 3. Calibrate Thresholds Against Profiling\
      \ Metadata (`target_column_desc`)\n- **Completeness**:\n  - If `completeness\
      \ == 1.0` and downstream code does not handle nulls: use `.isComplete(target_column)`.\n\
      \  - If `completeness < 1.0`: use `.hasCompleteness(target_column, lambda x:\
      \ x >= threshold)` where `threshold` is slightly below baseline (e.g., baseline\
      \ 0.98 -> threshold 0.90 or 0.95) to allow minor drift while catching catastrophic\
      \ null injections.\n- **Custom Conditions (`satisfies`)**:\n  - Calling `.satisfies('condition',\
      \ 'name')` without an assertion requires **100% (1.0)** conformance. If safe/real-world\
      \ batches have slight noise (e.g., 90% conformance), a 100% check will trigger\
      \ **false alarms**.\n  - If the condition is an exact logical guarantee (e.g.,\
      \ `col_a <= col_b`), use an assertion threshold if noise is expected (e.g.,\
      \ `lambda x: x >= 0.95`), or mark as `\"warning\"` unless a strict 100% is required\
