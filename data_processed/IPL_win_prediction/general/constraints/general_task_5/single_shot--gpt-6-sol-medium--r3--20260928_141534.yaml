constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("match_type <> 'League' OR (date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        AND try_cast(date AS DATE) IS NOT NULL AND year(try_cast(date AS DATE)) =
        season)", 'league_date_matches_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result,super_over:
    code:
    - - .satisfies("match_type <> 'League' OR ((result = 'tie' AND super_over = 'Y')
        OR (result <> 'tie' AND super_over = 'N'))", 'league_tie_matches_super_over')
      - Valid
    assumptions: []
    column_name: result,super_over
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1,team2:
    code:
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'league_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'no result' OR winner IS NULL",
        'league_no_result_has_no_winner')
      - Valid
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR coalesce(winner
        IN (team1, team2), false)", 'league_decided_match_has_participating_winner')
      - Valid
    assumptions: []
    column_name: winner
