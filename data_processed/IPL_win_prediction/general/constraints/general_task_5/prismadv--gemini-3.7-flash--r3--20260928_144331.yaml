constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('year(to_date(`date`)) = cast(`season` as int)', 'SeasonMatchesDateYear')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e1d43783-bff7-4c55-acc6-41604b5fe2e3
      source_assumptions:
      - 1ccc0c86-f7ff-4951-88a0-17ee074df108
    assumptions:
    - text: 'The ''season'' is assumed to represent the calendar year of the match
        date, meaning the year extracted from the ''date'' column should match the
        value in the ''season'' column. We can represent this assumption as a Deequ
        constraint: .satisfies("year(to_date(date)) = cast(season as int)", "SeasonMatchesDateYear")'
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: 1ccc0c86-f7ff-4951-88a0-17ee074df108
  '["result","super_over"]':
    code:
    - suggestion: '.satisfies("(`super_over` = ''Y'' AND `result` = ''tie'') OR (`super_over`
        = ''N'' AND `result` != ''tie'')", "super_over_tie_consistency", lambda x:
        x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: eb1b5b08-91dd-4233-bb39-1c0b85aba2dc
      source_assumptions:
      - b9bad18a-e119-4add-8411-d5b56750cecb
    assumptions:
    - text: 'The columns ''super_over'' and ''result'' must be mutually consistent:
        a super over is played (''super_over'' == ''Y'') if and only if the match
        result is a tie (''result'' == ''tie''). Whenever ''super_over'' is ''N'',
        ''result'' should not be ''tie'', and whenever ''result'' is ''tie'', ''super_over''
        must be ''Y''. We could represent this assumption as a Deequ constraint or
        predicate like: .satisfies(''(super_over = "Y" AND result = "tie") OR (super_over
        = "N" AND result != "tie")'', ''super_over_tie_consistency'')'
      sources:
      - start_line: 19
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 28
        file: ''
      - start_line: 40
        end_line: 40
        file: ''
      uid: b9bad18a-e119-4add-8411-d5b56750cecb
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When ''result'' is not ''no result'', the ''winner'' column must not
        be null (a winning team must be specified). Conversely, if ''result'' is ''no
        result'', ''winner'' should be null or ignored. We can represent this multi-column
        constraint in Deequ as: .satisfies("CASE WHEN result = ''no result'' THEN
        winner IS NULL ELSE winner IS NOT NULL END", "winner_present_when_not_no_result")'
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 30
        file: ''
      uid: b0b7c23c-3c60-44ec-812e-1bd37cb90783
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'The ''winner'' column, when not null, must be equal to either ''team1''
        or ''team2'', because points and win/loss statistics are awarded based on
        matching the winner to one of the participating teams. We could represent
        this assumption as a deequ constraint like this:

        .satisfies("winner IS NULL OR winner = team1 OR winner = team2", "WinnerMustBeParticipatingTeam")

        '
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 29
        end_line: 30
        file: ''
      - start_line: 33
        end_line: 33
        file: ''
      uid: 9b946998-34d3-4b09-9958-bd18bde99799
    - text: '''team1'' and ''team2'' must be distinct for every match record to ensure
        participation, points, and standings are correctly attributed without duplicate
        entries per team in a single match. We could represent this assumption as
        a deequ constraint like this:

        .satisfies("team1 != team2", "TeamsMustBeDistinct")

        '
      sources:
      - start_line: 21
        end_line: 23
        file: ''
      - start_line: 35
        end_line: 42
        file: ''
      uid: 01264a8e-ca4d-4a05-885e-def59b2bb668
  '["team1","team2"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'team1 and team2 must be distinct')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9d0a73fc-97cf-41e4-98ae-524f759630fc
      source_assumptions:
