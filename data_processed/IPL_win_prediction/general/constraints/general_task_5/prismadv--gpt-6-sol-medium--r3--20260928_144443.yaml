      uid: 3c715b03-ddc4-46ae-8d93-362831ff08a6
    - text: For league-stage matches, 'result' should be exactly one of 'runs', 'wickets',
        'tie', or 'no result'. The code recognizes 'no result' through an exact, case-sensitive
        string comparison; other values would be treated as completed matches.
      sources:
