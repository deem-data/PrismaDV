    - text: For league-stage matches where 'result' is not 'no result', 'winner' should
        identify one of the two participating teams. Otherwise, the code assigns zero
        points and a loss to both teams. For matches with 'result' equal to 'no result',
        the code awards one point to each team regardless of 'winner'.
