constraints:
  date:
    code:
    - - .satisfies("match_type <> 'League' OR (to_date(date, 'yyyy-MM-dd') IS NOT
        NULL AND year(to_date(date, 'yyyy-MM-dd')) = season)", 'league_date_matches_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result, super_over:
    code:
    - - .satisfies("match_type <> 'League' OR (result = 'tie' AND super_over = 'Y')
        OR (result <> 'tie' AND super_over = 'N')", 'league_tie_super_over_consistency')
      - Valid
    assumptions: []
    column_name: result, super_over
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'distinct_league_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR (result = 'no result' AND winner IS
        NULL) OR (result <> 'no result' AND winner IN (team1, team2))", 'league_winner_consistency')
      - Valid
    assumptions: []
    column_name: winner
