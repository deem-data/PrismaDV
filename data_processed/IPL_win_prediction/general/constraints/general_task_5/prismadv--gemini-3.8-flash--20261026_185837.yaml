prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies("year(to_date(`date`)) == cast(`season` as int)", "Date
        year matches season")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1d5ab1db-a2a7-4780-a497-567748c2ce62
      source_assumptions:
      - 637b35ee-08b7-40af-a80a-931d7fd324b7
    assumptions:
    - text: 'The ''season'' column corresponds to the calendar year in which the match
        was played, meaning the year component of ''date'' should match ''season''.
        We could represent this assumption as a deequ constraint like this: .satisfies("year(to_date(date))
        == cast(season as int)", "Date year matches season")'
      sources:
      - start_line: 15
        end_line: 17
        file: ''
      uid: 637b35ee-08b7-40af-a80a-931d7fd324b7
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("(super_over = 'Y' AND result = 'tie') OR (super_over
        = 'N' AND result != 'tie')", "SuperOverTieEquivalence")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 71bb59ef-eea9-4a44-9cb5-b432889989b4
      source_assumptions:
      - 044c8a09-eb0e-4ec8-99dc-7f6864c36a05
    assumptions:
    - text: 'A super over is played if and only if the match result is a tie. Therefore,
        whenever ''super_over'' is ''Y'', ''result'' must be ''tie'', and whenever
        ''super_over'' is ''N'', ''result'' must not be ''tie'' (i.e., ''runs'', ''wickets'',
        or ''no result''). This can be expressed as a Deequ constraint: .satisfies("(super_over
        = ''Y'' AND result = ''tie'') OR (super_over = ''N'' AND result != ''tie'')",
        "SuperOverTieEquivalence")'
      sources:
      - start_line: 19
        end_line: 23
        file: ''
      - start_line: 27
        end_line: 28
        file: ''
      uid: 044c8a09-eb0e-4ec8-99dc-7f6864c36a05
  '["result","winner"]':
    code:
    - suggestion: .satisfies("CASE WHEN `result` = 'no result' THEN `winner` IS NULL
        ELSE `winner` IS NOT NULL END", "WinnerResultConsistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 59a1512f-6a0e-40ab-ab8f-a8cb02c726c3
      source_assumptions:
      - 7328b5f0-7a8f-42f0-8ef8-507e3fe80e06
    assumptions:
    - text: 'The ''winner'' and ''result'' columns must be consistent with each other:
        when ''result'' is ''no result'', ''winner'' should be null, and when ''result''
        is not ''no result'', ''winner'' must not be null. If a match has a result
        but ''winner'' is missing, both teams would incorrectly be marked as losers
        and receive zero points. We can represent this assumption as a Deequ constraint:
        .satisfies("CASE WHEN result = ''no result'' THEN winner IS NULL ELSE winner
        IS NOT NULL END", ''WinnerResultConsistency'')'
      sources:
      - start_line: 21
        end_line: 33
        file: ''
      uid: 7328b5f0-7a8f-42f0-8ef8-507e3fe80e06
  '["team1","team2","winner"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'Team1AndTeam2MustBeDistinct')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 754bb88a-cb04-4e0d-aeb0-d6e3c9b81eab
      source_assumptions:
      - 6fccf244-f9e4-4d97-a85f-8efcbc5bfca9
    - suggestion: .satisfies('`winner` IS NULL OR `winner` = `team1` OR `winner` =
        `team2`', 'WinnerMustBeOneOfTeams')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b3f3a96f-1e33-47dc-84b5-953c454e25a3
      source_assumptions:
      - e331d0e4-1fbc-439e-b861-5f1fbbab65c9
    assumptions:
    - text: 'For every match, ''team1'' and ''team2'' must be distinct (i.e., ''team1''
        != ''team2'') so that matches are between two different teams and participant
        metrics are awarded correctly without duplicate team entries per match. We
        could represent this assumption as a deequ constraint like this: .satisfies("team1
        != team2", "Team1AndTeam2MustBeDistinct")'
      sources:
      - start_line: 18
        end_line: 23
        file: ''
      uid: 6fccf244-f9e4-4d97-a85f-8efcbc5bfca9
    - text: 'When ''winner'' is present, it must be equal to either ''team1'' or ''team2''.
        Downstream logic checks whether ''winner'' matches the participant ''team''
        to award wins and losses; if ''winner'' is not one of the two competing teams,
        neither team receives the win and both could be incorrectly marked as losers.
        We could represent this assumption as a deequ constraint like this: .satisfies("winner
        IS NULL OR winner = team1 OR winner = team2", "WinnerMustBeOneOfTeams")'
      sources:
      - start_line: 21
        end_line: 30
        file: ''
      uid: e331d0e4-1fbc-439e-b861-5f1fbbab65c9
  '["team1","team2"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'team1 and team2 must be distinct')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ab313c4d-f2a4-47f6-b52e-24139d0ac5db
      source_assumptions:
      - c143d808-d096-42c1-9021-d3213f3c1ae8
    assumptions:
    - text: 'In each match, ''team1'' and ''team2'' must be distinct teams (i.e.,
        ''team1 != team2''). If ''team1'' and ''team2'' were the same team, splitting
        and concatenating into participant rows would produce duplicate participation
        records for the same team in a single match, distorting match counts, win/loss
        records, and points in the points table. We could represent this assumption
