constraints:
  date:
    code:
    - - .satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL AND year(to_date(date,
        'yyyy-MM-dd')) = season", 'valid_date_matching_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Final', 'Semi Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("(result IN ('runs', 'wickets') AND result_margin > 0) OR (result
        IN ('tie', 'no result') AND result_margin IS NULL)", 'result_margin_consistency')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("(result = 'tie' AND super_over = 'Y') OR (result <> 'tie' AND
        super_over = 'N')", 'tie_super_over_consistency')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("result = 'no result' OR (target_overs > 0 AND target_overs <=
        20)", 'completed_match_has_valid_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("result = 'no result' OR target_runs > 0", 'completed_match_has_positive_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_participating_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("(result = 'no result' AND winner IS NULL) OR (result <> 'no result'
        AND winner IN (team1, team2))", 'winner_result_consistency')
      - Valid
    assumptions: []
    column_name: winner
