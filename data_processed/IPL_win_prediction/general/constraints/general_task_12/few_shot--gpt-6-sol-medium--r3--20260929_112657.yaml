constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("date RLIKE '^\\d{4}-\\d{2}-\\d{2}$' AND to_date(date, 'yyyy-MM-dd')
        IS NOT NULL", 'valid_date')
      - Invalid
    assumptions: []
    column_name: date
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND CAST(result_margin AS DOUBLE) > 0)", 'decided_match_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'different_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IS NOT NULL AND toss_winner IN (team1, team2)', 'toss_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND winner IN (team1,
        team2))", 'decided_match_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: winner
