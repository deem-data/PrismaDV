constraints:
  date:
    code:
    - - .satisfies("`date` RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", 'date_format')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("`method` IS NULL OR `method` = 'D/L'", 'recognized_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin` IS NOT
        NULL AND `result_margin` >= 0 AND `result_margin` = FLOOR(`result_margin`))",
        'decided_match_has_integer_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('`target_overs` IS NULL OR `target_overs` > 0', 'positive_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('`target_runs` IS NULL OR `target_runs` > 0', 'positive_target_runs_when_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('`team1` <> `team2`', 'distinct_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('`toss_winner` = `team1` OR `toss_winner` = `team2`', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("`result` NOT IN ('runs', 'wickets') AND NOT (`result` = 'tie'
        AND `super_over` = 'Y') OR `winner` = `team1` OR `winner` = `team2`", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
