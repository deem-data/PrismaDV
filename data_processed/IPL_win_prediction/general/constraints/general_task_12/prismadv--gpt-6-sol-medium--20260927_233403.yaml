      reason_if_invalid: ''
      level: warning
      uid: 391c366c-cbd0-45bd-a60d-447be4d16403
      source_assumptions:
      - 68f71c08-f1d7-4e28-9736-8e2778328bd7
    assumptions:
    - text: For every match, 'date' should be a valid date in YYYY-MM-DD format, and
        its calendar year should equal the integer 'season'. Otherwise, the match
        could appear in the season standings under a different year from its date
        in final_results.csv. This can be checked with a row-level constraint such
        as `date IS NOT NULL AND to_date(date, 'yyyy-MM-dd') IS NOT NULL AND year(to_date(date,
        'yyyy-MM-dd')) = season`.
      sources:
      - start_line: 24
        end_line: 24
        file: ''
      - start_line: 84
        end_line: 96
        file: ''
      uid: 68f71c08-f1d7-4e28-9736-8e2778328bd7
