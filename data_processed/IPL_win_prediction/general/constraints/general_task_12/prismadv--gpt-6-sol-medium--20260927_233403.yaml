    code:
    - suggestion: '.satisfies("`date` IS NOT NULL AND `season` IS NOT NULL AND `date`
        RLIKE ''^[0-9]{4}-[0-9]{2}-[0-9]{2}$'' AND to_date(`date`, ''yyyy-MM-dd'')
        IS NOT NULL AND year(to_date(`date`, ''yyyy-MM-dd'')) = `season`", "date_matches_season",
        lambda x: x == 1.0)'
