constraints:
  date:
    code:
    - - .hasPattern('date', '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0)", 'positive_margin_for_decided_matches')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IS NOT NULL AND (toss_winner = team1 OR toss_winner
        = team2)', 'toss_winner_is_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
        OR winner = team2))", 'winner_is_participating_team')
      - Valid
    assumptions: []
    column_name: winner
