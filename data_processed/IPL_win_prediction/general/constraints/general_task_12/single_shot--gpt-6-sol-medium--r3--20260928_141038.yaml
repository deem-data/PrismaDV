constraints:
  date:
    code:
    - - .isComplete('date').satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'",
        'date_has_expected_format')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isPositive('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("method IS NULL OR method = 'D/L'", 'recognized_match_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0 AND result_margin = FLOOR(result_margin))", 'decided_match_has_integer_margin').satisfies("result
        <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('target_overs IS NULL OR target_overs > 0', 'positive_target_overs_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('target_runs IS NULL OR target_runs > 0', 'positive_target_runs_when_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2').satisfies('team1 <> team2', 'teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner = team1 OR toss_winner =
        team2', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND (winner = team1
        OR winner = team2))", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
