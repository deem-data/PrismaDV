      \ Domain invariants: Match winners should correspond to competing teams, decided\
      \ margins should be non-negative, and divisor columns must be non-zero.\n3.\
      \ Distinguish Tolerated vs. Critical Properties:\n   - Do NOT assume categorical\
      \ columns must strictly match an exhaustive closed list if the code safely accommodates\
      \ unlisted categories via default branches (e.g., `np.select(..., default=0)`,\
      \ unlisted match outcomes like 'abandoned' safely yielding 0 points/losses).\
      \ Enforcing rigid category sets causes false alarms on safe variations.\n  \
      \ - If missing or unparseable values would distort calculations, break joins,\
      \ or cause division by zero, state the requirement as critical. If explicit\
      \ fallback logic (e.g., `errors='coerce'`, `fillna`, null guards) safely accommodates\
