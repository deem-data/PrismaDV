    assumptions:
    - text: The input must contain a 'target_overs' column. The script converts it
        and includes it in final_results.csv.
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 90
        end_line: 95
        file: ''
      uid: 3b5e983f-78ca-4ca5-b196-c3aa50cda2d8
    - text: Non-null 'target_overs' values should be parseable as numbers. Otherwise,
        pd.to_numeric(..., errors='coerce') silently turns them into missing values.
        Standard CSV nulls and 'NullValue' may be treated as missing.
      sources:
      - start_line: 19
        end_line: 23
        file: ''
      uid: a54806ae-4023-42cc-b47d-b78b27f97824
    - text: Missing 'target_overs' values are permitted, but should be rare, consistent
        with the observed approximately 99.8% completeness. The code explicitly handles
        a missing value when formatting a D/L result.
      sources:
      - start_line: 46
        end_line: 49
        file: ''
      uid: e5269f37-e973-44ed-b99e-34bccb2cb1fe
    - text: For rows where 'method' is 'D/L', 'target_overs' should normally be present
        and greater than zero so the generated DLS target describes a meaningful number
        of overs. A missing value will not crash the code, but will appear as 'None'
        in the result string.
      sources:
      - start_line: 46
        end_line: 49
        file: ''
      uid: de8f7446-e5dc-4824-9a84-bab5857f4597
  target_runs:
