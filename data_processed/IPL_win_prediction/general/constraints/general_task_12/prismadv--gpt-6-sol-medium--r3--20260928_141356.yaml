      reason_if_invalid: ''
      level: warning
      uid: c2828814-7c7e-4b4e-b1a9-7b02ae33dd5c
      source_assumptions:
      - 9a0b991b-87a2-4bf8-bc90-7b1cb828a04d
    assumptions:
    - text: For every match, the year of 'date' (parsed using YYYY-MM-DD) should equal
        the integer 'season'. This keeps the match date consistent with the season
        used to calculate standings. A row-level constraint could require YEAR(TO_DATE(date,
        'yyyy-MM-dd')) = season.
      sources:
      - start_line: 24
        end_line: 24
        file: ''
      - start_line: 84
        end_line: 95
        file: ''
      uid: 9a0b991b-87a2-4bf8-bc90-7b1cb828a04d
  '["method","target_overs","target_runs"]':
