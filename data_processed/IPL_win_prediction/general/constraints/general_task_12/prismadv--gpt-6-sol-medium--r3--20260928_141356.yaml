constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies("`date` IS NOT NULL AND `season` IS NOT NULL AND `date`
        RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND TO_DATE(`date`, 'yyyy-MM-dd') IS
        NOT NULL AND YEAR(TO_DATE(`date`, 'yyyy-MM-dd')) = `season`", "date_year_matches_season")
