        be missing when 'method' is null.
      sources:
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 46
        end_line: 49
        file: ''
      uid: 566c996d-2622-4dd2-8eaa-67f501286d51
    - text: For every row where 'method' is 'D/L', 'target_runs' should be an integer-valued
        positive number and 'target_overs' should be a positive finite number. These
        values are presented together as a runs-in-overs target, and converting 'target_runs'
