prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nVALID_RESULTS = {\"runs\"\
  , \"wickets\", \"tie\", \"no result\"}\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_fp = os.path.join(args.input,\
  \ 'new_data.csv')\n    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_fp,\
  \ keep_default_na=True, na_values=['NullValue'])\n\n    df['result_margin'] = pd.to_numeric(df['result_margin'],\
  \ errors='coerce')\n    df['target_runs'] = pd.to_numeric(df['target_runs'], errors='coerce')\n\
  \    df['target_overs'] = pd.to_numeric(df['target_overs'], errors='coerce')\n \
  \   df['date'] = pd.to_datetime(df['date'], format='%Y-%m-%d', errors='coerce')\n\
  \    df['bat_first_team'] = np.where(\n        df['toss_decision'] == 'bat',\n \
  \       df['toss_winner'],\n        np.where(df['toss_winner'] == df['team1'], df['team2'],\
  \ df['team1'])\n    )\n    def build_result_string(row: pd.Series) -> str:\n   \
  \     r = row['result']\n        if r == 'no result':\n            return f\"No\
  \ result - {row['team1']} vs {row['team2']}\"\n        w = row['winner']\n     \
  \   opp = row['team2'] if w == row['team1'] else row['team1']\n        if r == 'runs':\n\
  \            m = int(row['result_margin'])\n            base = f\"{w} beat {opp}\
  \ by {m} runs\"\n        elif r == 'wickets':\n            m = int(row['result_margin'])\n\
  \            base = f\"{w} beat {opp} by {m} wickets\"\n        elif r == 'tie':\n\
  \            base = f\"Tied - Super Over: {w}\"\n        else:\n            base\
  \ = r\n        if row['method'] == 'D/L':\n            tr = int(row['target_runs'])\
  \ if pd.notna(row['target_runs']) else None\n            to = float(row['target_overs'])\
  \ if pd.notna(row['target_overs']) else None\n            base = f\"{base} (DLS:\
  \ target {tr} in {to} overs)\"\n        if pd.notna(row['player_of_match']):\n \
  \           base = f\"{base} | Player of Match: {row['player_of_match']}\"\n   \
  \     return base\n\n    df['final_result'] = df.apply(build_result_string, axis=1)\n\
  \n    season_cols = ['season', 'team1', 'team2', 'result', 'super_over', 'winner']\n\
  \    base = df[season_cols].copy()\n\n    team_entries = pd.concat([\n        base.rename(columns={'team1':\
  \ 'team'})[['season', 'team', 'team2', 'result', 'super_over', 'winner']].rename(\n\
  \            columns={'team2': 'opponent'}),\n        base.rename(columns={'team2':\
  \ 'team'})[['season', 'team1', 'result', 'super_over', 'winner']].rename(\n    \
  \        columns={'team1': 'opponent'})\n    ], ignore_index=True)\n\n    team_entries['is_winner']\
  \ = team_entries['team'] == team_entries['winner']\n    team_entries['is_decided']\
  \ = team_entries['result'].isin(['runs', 'wickets']) | (\n                (team_entries['result']\
  \ == 'tie') & (team_entries['super_over'] == 'Y'))\n    team_entries['is_loser']\
  \ = (~team_entries['is_winner']) & team_entries['is_decided']\n    team_entries['is_noresult']\
  \ = team_entries['result'] == 'no result'\n\n    team_entries['wins'] = team_entries['is_winner'].astype(int)\n\
  \    team_entries['losses'] = team_entries['is_loser'].astype(int)\n    team_entries['no_results']\
  \ = team_entries['is_noresult'].astype(int)\n    team_entries['matches'] = 1\n\n\
  \    team_entries['points'] = np.where(\n        team_entries['is_winner'], 2,\n\
  \        np.where(\n            team_entries['is_noresult'] | ((team_entries['result']\
  \ == 'tie') & (team_entries['super_over'] != 'Y')), 1,\n            0)\n    )\n\n\
  \    standings = (\n        team_entries.groupby(['season', 'team'], as_index=False)[\n\
  \            ['matches', 'wins', 'losses', 'no_results', 'points']].sum()\n    \
  \    .sort_values(['season', 'points', 'wins', 'team'], ascending=[True, False,\
  \ False, True])\n    )\n\n    final_results_out = df[\n        ['id', 'season',\
  \ 'date', 'team1', 'team2', 'final_result', 'toss_winner', 'toss_decision', 'bat_first_team',\n\
  \         'winner', 'result', 'result_margin', 'super_over', 'method', 'target_runs',\
  \ 'target_overs',\n         'player_of_match']].copy()\n\n    final_results_out.to_csv(os.path.join(args.output,\
  \ 'final_results.csv'), index=False)\n    standings.to_csv(os.path.join(args.output,\
  \ 'season_standings.csv'), index=False)\n\n\nif __name__ == '__main__':\n    main()\n\
  \n```\n\nThe same program is on disk at `./code/general_task_12.py`, so you can\
  \ run it against the\nstaged table, step through it, or search it, rather than working\
  \ from the\nlisting alone.\n\n# The data\n\nThree rows sampled from the dataset\
  \ the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur', 'date':\
  \ '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner', 'venue':\
  \ 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings XI Punjab',\
  \ 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner': 'Rajasthan\
  \ Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs': 125.0, 'target_overs':\
  \ 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem Dar', 'umpire2': 'C\
  \ Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune', 'date': '2022-03-29',\
  \ 'match_type': 'League', 'player_of_match': 'SV Samson', 'venue': 'Maharashtra\
  \ Cricket Association Stadium, Pune', 'team1': 'Rajasthan Royals', 'team2': 'Sunrisers\
  \ Hyderabad', 'toss_winner': 'Sunrisers Hyderabad', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'runs', 'result_margin': 61.0, 'target_runs': 211.0,\
  \ 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'BNJ Oxenford',\
  \ 'umpire2': 'UV Gandhe'}, {'id': 249, 'season': 2019, 'city': 'Delhi', 'date':\
  \ '2019-03-30', 'match_type': 'League', 'player_of_match': 'PP Shaw', 'venue': 'Arun\
  \ Jaitley Stadium', 'team1': 'Kolkata Knight Riders', 'team2': 'Delhi Capitals',\
  \ 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field', 'winner': 'Delhi Capitals',\
  \ 'result': 'tie', 'result_margin': nan, 'target_runs': 186.0, 'target_overs': 20.0,\
  \ 'super_over': 'Y', 'method': nan, 'umpire1': 'AY Dandekar', 'umpire2': 'Nitin\
  \ Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`. You\
  \ have complete access to it:\nload it with pandas, profile it, plot it, run whatever\
  \ analysis helps. It is a\nthrowaway copy -- nothing you do to it has any effect\
  \ outside this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ\
  \ constraint code against the staged table and read back\nthe result of every check:\n\
  \n```\npython deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
