        - Valid
      assumptions: []
      column_name: date
    id:
      code:
      - - .isComplete('id')
        - Valid
      - - .isUnique('id')
        - Valid
      assumptions: []
      column_name: id
    method:
      code:
      - - .satisfies("method IS NULL OR method = 'D/L'", 'known_method')
        - Valid
      assumptions: []
      column_name: method
    result:
      code:
      - - .isComplete('result')
        - Valid
      - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'wickets_margin_at_most_ten')
        - Valid
      - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
          AND result_margin > 0 AND result_margin = FLOOR(result_margin))", 'decided_margin_is_positive_integer')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      - - .satisfies("season = year(try_to_timestamp(date, 'yyyy-MM-dd'))", 'season_matches_date')
        - Valid
      assumptions: []
      column_name: season
    super_over:
      code:
      - - .isComplete('super_over')
        - Valid
      - - .satisfies("(result = 'tie' AND super_over = 'Y') OR (result <> 'tie' AND
          super_over = 'N')", 'super_over_matches_tie')
        - Valid
      assumptions: []
      column_name: super_over
    target_overs:
      code:
      - - .satisfies("method IS NULL OR (target_overs IS NOT NULL AND target_overs
          > 0)", 'dls_target_overs_valid')
        - Valid
      assumptions: []
      column_name: target_overs
    target_runs:
      code:
      - - .satisfies("method IS NULL OR (target_runs IS NOT NULL AND target_runs >
          0 AND target_runs = FLOOR(target_runs))", 'dls_target_runs_valid')
        - Valid
      assumptions: []
      column_name: target_runs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies("team1 <> team2", 'distinct_opponents')
        - Valid
      assumptions: []
      column_name: team2
