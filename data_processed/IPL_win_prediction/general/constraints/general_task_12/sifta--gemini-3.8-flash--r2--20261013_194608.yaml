      warning\" ONLY if the code explicitly tolerates the condition without corrupting\
      \ downstream outputs (e.g., completeness threshold checks when the code provides\
      \ a clean fallback default). Do not set all checks to warning, as warning-level\
      \ constraints never reject unsafe partitions.\n\nLink each check to the indices\
      \ (from 0) of the assumptions it tests.\n\nOutput: {\"constraint_code\": [{\"\
