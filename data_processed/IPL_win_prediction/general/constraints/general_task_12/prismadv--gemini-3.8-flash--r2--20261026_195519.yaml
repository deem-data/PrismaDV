    - text: 'The year component of the ''date'' column should match the ''season''
        column for each match (i.e., the match year derived from ''date'' corresponds
        to ''season''). This can be represented as a Deequ constraint: .satisfies("YEAR(date)
        == season", "date_year_matches_season").'
