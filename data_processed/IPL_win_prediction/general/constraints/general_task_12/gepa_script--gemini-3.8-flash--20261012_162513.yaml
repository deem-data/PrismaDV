      \ decisively (e.g., `result IN ('runs', 'wickets')`), `winner` MUST NOT be NULL\
      \ and MUST be either `team1` or `team2`:\n    ```python\n    .satisfies(\"(`result`\
      \ IS NULL OR `result` NOT IN ('runs', 'wickets')) OR (`winner` IS NOT NULL AND\
