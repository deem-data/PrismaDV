    assumptions:
    - text: 'When ''result'' is not ''no result'' (i.e., ''runs'', ''wickets'', or
        ''tie''), ''winner'' must not be null. Conversely, if ''result'' is ''no result'',
        ''winner'' is expected to be null. This can be expressed as a Deequ constraint:
