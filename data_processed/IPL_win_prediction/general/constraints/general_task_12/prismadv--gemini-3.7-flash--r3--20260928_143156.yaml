    assumptions:
    - text: 'When ''method'' is ''D/L'' (Duckworth-Lewis), ''target_runs'' and ''target_overs''
        should both be non-null to properly format the DLS target information in ''final_result''.
        This can be expressed as a constraint: .satisfies("method != ''D/L'' OR (target_runs
        IS NOT NULL AND target_overs IS NOT NULL)", "DLS matches must have target
        runs and overs")'
      sources:
      - start_line: 46
        end_line: 49
        file: ''
      uid: 0a717062-63e2-4bd2-92cf-0b86c97d138d
  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column is ''runs'' or ''wickets'', the ''result_margin''
        column must not be null because it is cast to an integer using int(row[''result_margin'']).
        We can represent this assumption as a Deequ constraint: .satisfies("result
        NOT IN (''runs'', ''wickets'') OR result_margin IS NOT NULL", "result_margin_not_null_when_runs_or_wickets")'
      sources:
