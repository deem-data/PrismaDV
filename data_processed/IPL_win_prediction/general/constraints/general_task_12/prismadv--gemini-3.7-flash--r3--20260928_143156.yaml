prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year component extracted from the ''date'' column should correspond
        to the ''season'' column for each match record, ensuring chronological consistency
        across seasons. We could represent this assumption as a Deequ constraint like:
        .satisfies("substring(date, 1, 4) = CAST(season AS STRING)", "Date year matches
        season")'
      sources:
      - start_line: 24
        end_line: 24
        file: ''
      - start_line: 90
        end_line: 95
        file: ''
      uid: b8b8797b-ba3d-4705-b71f-f2d209499942
  '["method","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies("CASE WHEN `method` = 'D/L' THEN (`target_runs` IS NOT
        NULL AND `target_overs` IS NOT NULL) ELSE TRUE END", "DLS matches must have
        target runs and overs")
