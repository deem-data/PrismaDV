        (`target_runs` IS NOT NULL AND `target_overs` IS NOT NULL)", "target_runs_and_overs_completeness_consistency")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3bb46941-869a-4219-99d2-698bed5ed05b
      source_assumptions:
      - c18345e4-4486-4360-a643-a94fe8fecf58
    assumptions:
    - text: 'When the match outcome is determined by the Duckworth-Lewis method (''method''
        == ''D/L''), both ''target_runs'' and ''target_overs'' should be non-null
        to prevent formatting the match result string with None values. We could represent
        this assumption as a Deequ constraint: .satisfies("method != ''D/L'' OR (target_runs
        IS NOT NULL AND target_overs IS NOT NULL)", "dl_targets_non_null")'
      sources:
      - start_line: 46
        end_line: 49
        file: ''
      uid: 932622ae-c1aa-4a8c-8690-a76be55b4d9e
    - text: 'The columns ''target_runs'' and ''target_overs'' should be consistently
        populated together; if either ''target_runs'' or ''target_overs'' is present,
        the other should also be present. We could represent this assumption as a
        Deequ constraint: .satisfies("(target_runs IS NULL AND target_overs IS NULL)
        OR (target_runs IS NOT NULL AND target_overs IS NOT NULL)", "target_runs_and_overs_completeness_consistency")'
      sources:
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 46
        end_line: 49
        file: ''
      uid: c18345e4-4486-4360-a643-a94fe8fecf58
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("(result NOT IN ('runs', 'wickets')) OR (result_margin
        IS NOT NULL AND result_margin > 0)", "result_margin_required_for_runs_and_wickets")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: be715b97-ae5a-4966-ae90-85db0d9652aa
      source_assumptions:
      - 274baead-80f2-4605-ae5c-bbe8ee6fc4aa
