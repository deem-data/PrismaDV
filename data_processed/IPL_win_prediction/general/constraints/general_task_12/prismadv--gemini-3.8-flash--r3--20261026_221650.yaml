prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('YEAR(`date`) = `season`', 'Date year matches season')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7171a444-d8f3-4121-887f-cde9cd0a287e
      source_assumptions:
      - 119e6025-961f-4290-80b8-c916f872d064
    assumptions:
    - text: 'The year component extracted from the ''date'' column should match the
        ''season'' column, as each match date belongs to its corresponding tournament
        season. We could represent this assumption as a Deequ constraint like this:

        .satisfies(''YEAR(date) == season'', ''Date year matches season'')'
      sources:
      - start_line: 24
        end_line: 24
        file: ''
      - start_line: 90
        end_line: 93
        file: ''
      uid: 119e6025-961f-4290-80b8-c916f872d064
  '["method","target_overs","target_runs"]':
    code:
    - suggestion: .satisfies("CASE WHEN `method` = 'D/L' THEN `target_runs` IS NOT
        NULL AND `target_overs` IS NOT NULL ELSE TRUE END", "dl_targets_non_null")
