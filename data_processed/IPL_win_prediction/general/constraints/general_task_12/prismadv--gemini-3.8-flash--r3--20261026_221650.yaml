    - text: 'When ''result'' is equal to ''runs'' or ''wickets'', ''result_margin''
        must not be null and must be a valid non-negative integer, because the downstream
        code directly casts ''result_margin'' to an integer using int(row[''result_margin'']),
        which would raise a ValueError if null. We can represent this assumption as
        a Deequ constraint: .satisfies("(result NOT IN (''runs'', ''wickets'')) OR
        (result_margin IS NOT NULL AND result_margin > 0)", "result_margin_required_for_runs_and_wickets")'
      sources:
