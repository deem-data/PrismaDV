constraints:
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("result NOT IN (''runs'', ''wickets'') OR result_margin IS NOT
        NULL", ''decided_match_has_margin'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - '.satisfies(''team1 <> team2'', ''distinct_opponents'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - '.satisfies(''toss_winner IN (team1, team2)'', ''toss_winner_is_participant'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - '.satisfies("result = ''no result'' OR (result = ''tie'' AND super_over <>
        ''Y'') OR winner IN (team1, team2)", ''decided_match_winner_is_participant'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: winner
