      \ to generate a comprehensive, highly calibrated set of data quality assumptions\
      \ and PyDeequ validation checks.\n\nYour ultimate goal is to achieve an optimal\
      \ Macro F1 score:\n1. **Catch Unsafe Batches (`\"level\": \"error\"`)**: Detect\
      \ any data condition that causes runtime crashes, produces corrupted calculations\
      \ (e.g., division by zero), or violates fundamental relational integrity required\
      \ by the script.\n2. **Prevent False Alarms**: Safe batches must NEVER fail\
      \ an `\"error\"` check or a brittle `\"warning\"` check. Baseline distributions\
      \ in `columns_desc` dictate normal operational bounds.\n\n---\n\n### Critical\
      \ Analysis Framework\n\n#### 1. Baseline Profiling Analysis (`columns_desc`)\n\
      - **Baseline Completeness = 1.0**: Core structural columns (such as IDs, seasons/dates,\
      \ primary entity names) that have 100% completeness in the baseline are non-negotiable.\
      \ If they are used as identifiers, grouping keys, joining keys, or dictionary\
      \ keys, add `.isComplete(...)` at `\"level\": \"error\"`.\n- **Baseline Completeness\
      \ < 1.0**: If a column has nulls in the baseline (e.g., `0.989` or `0.025`),\
      \ it is naturally nullable under certain domain conditions.\n  - NEVER set an\
      \ unconditional `.isComplete(...)` at `\"level\": \"error\"` on naturally nullable\
      \ columns.\n  - Formulate a conditional `.satisfies(...)` check if the nullability\
      \ is restricted to specific branches (e.g., `result_margin` is only required\
      \ when `result` is decisive).\n\n#### 2. Code Trace & Severity Level Decision\
      \ Matrix\n\n| Code Operation Pattern | Data Defect | Downstream Impact | Severity\
      \ Level |\n|---|---|---|---|\n| `int(row['x'])`, `float(row['x'])` | Null /\
      \ Non-numeric | Unhandled `ValueError` / `TypeError` | `\"error\"` |\n| `int(float(row['x']))`\
      \ | Null / Non-numeric / NaN | Unhandled `ValueError` / `TypeError` | `\"error\"\
      ` |\n| `dict[row['key']]` or `dict[(season, team)]` | Missing / Unseen Key |\
      \ Unhandled `KeyError` | `\"error\"` |\n| `row['x'].strip()`, `.split()` | Null\
      \ / Non-string | Unhandled `AttributeError` | `\"error\"` |\n| `x / y` (even\
      \ inside `np.where(...)`) | `y == 0` or `y IS NULL` | Division by zero / `inf`\
      \ / corrupted metrics | `\"error\"` |\n| `winner` evaluated against `team1`/`team2`\
      \ | `winner NOT IN (team1, team2)` | Relational corruption / `KeyError` / wrong\
      \ standings | `\"error\"` |\n| Primary ID / Core Groupby Keys (`id`, `season`,\
      \ `team1`, `team2`) | Missing / Null | Broken aggregations / Dropped groups\
      \ / Index failure | `\"error\"` |\n| Explicit script constants / Enums (e.g.,\
