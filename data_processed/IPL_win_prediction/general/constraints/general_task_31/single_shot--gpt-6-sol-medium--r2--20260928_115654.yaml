constraints:
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) <> 'wickets' OR result_margin <= 10", 'wickets_margin_at_most_ten')
      - Valid
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0)", 'winning_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  super_over, result:
    code:
    - - .satisfies("upper(trim(super_over)) <> 'Y' OR lower(trim(result)) = 'tie'",
        'super_over_requires_tie')
      - Valid
    assumptions: []
    column_name: super_over, result
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR winner IN (team1,
        team2)", 'winning_team_is_participant')
      - Valid
    assumptions: []
    column_name: winner
