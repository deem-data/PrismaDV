        file: ''
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 67
        end_line: 69
        file: ''
      uid: 177dcc62-18a9-4cac-a170-1f92b5402d8e
    - text: 'When ''result'' = ''tie'' and ''super_over'' = ''Y'', ''winner'' should
