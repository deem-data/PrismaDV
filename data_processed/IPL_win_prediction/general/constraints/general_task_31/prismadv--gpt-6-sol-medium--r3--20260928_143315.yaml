        end_line: 40
        file: ''
      - start_line: 60
        end_line: 64
        file: ''
      uid: bc330dc3-f665-4ad6-aa08-ec44ca1f9cbb
    - text: 'A match with ''result'' equal to ''no result'' should have a null ''winner'';
