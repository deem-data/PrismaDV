    assumptions:
    - text: For every match, 'team1' and 'team2' should name two distinct teams. Otherwise,
        the two-row per-team view would count the same team twice for one match. A
        row-level constraint is team1 != team2.
      sources:
      - start_line: 29
        end_line: 38
        file: ''
      uid: b26e6d60-b4f5-4c24-bf15-c99d1ae1782b
    - text: The combination of 'id', 'team1', 'team2', and 'match_type' should be
        unique across rows. Duplicate fixture records would be counted repeatedly
        in the per-team aggregates. This can be checked with .isUnique(["id", "team1",
        "team2", "match_type"]).
      sources:
      - start_line: 30
        end_line: 38
        file: ''
      - start_line: 63
        end_line: 71
        file: ''
      uid: 636694b7-02d7-4f08-affb-e5b888486046
    - text: Each 'id' should consistently identify the same 'team1', 'team2', and
        'match_type'. If an id occurs more than once, its associated teams and match
        stage should not change; otherwise, a single match identifier could contribute
        to different team or stage groups. This can be checked as functional dependencies
        from id to each of team1, team2, and match_type.
      sources:
      - start_line: 30
        end_line: 38
        file: ''
      - start_line: 63
        end_line: 71
        file: ''
      uid: ac799a9c-427d-4562-9b98-ef4ae081cc6b
