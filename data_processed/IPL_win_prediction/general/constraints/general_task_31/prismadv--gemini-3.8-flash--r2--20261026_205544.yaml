        require a valid winning margin to accurately calculate ''avg_runs_margin''
        and ''avg_wickets_margin''. Conversely, when ''result'' is ''tie'' or ''no
        result'', ''result_margin'' is expected to be null. This can be expressed
        as a Deequ constraint: .satisfies("(result IN (''runs'', ''wickets'') AND
        result_margin IS NOT NULL AND result_margin > 0) OR (result IN (''tie'', ''no
        result'') AND result_margin IS NULL)", "ValidMarginForResult")'
