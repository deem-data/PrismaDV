    code: []
    assumptions:
    - text: 'When the ''method'' column is populated (e.g., ''D/L'' for Duckworth-Lewis
        method), the ''result'' column should represent a decided match outcome such
        as ''runs'' or ''wickets'' rather than ''no result''. We could represent this
        assumption as a deequ constraint like this: .satisfies("method != ''D/L''
        OR result IN (''runs'', ''wickets'')", "DL_matches_have_valid_result")'
      sources:
      - start_line: 30
        end_line: 36
        file: ''
      uid: 57db15a8-67ac-486c-88d0-1307ca272ec7
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("CASE WHEN LOWER(TRIM(`result`)) IN ('runs', 'wickets')
        THEN `result_margin` IS NOT NULL AND `result_margin` > 0 ELSE TRUE END", "result_margin_positive_when_runs_or_wickets")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 731362c6-ff99-4dd1-8085-f3393517c4e8
      source_assumptions:
      - f00d312b-be5a-4067-b489-a4547495983d
    assumptions:
    - text: When 'result' is 'runs' or 'wickets', 'result_margin' should not be null
        and should contain a valid positive numeric value representing the winning
        margin for runs or wickets.
      sources:
      - start_line: 20
        end_line: 27
        file: ''
      - start_line: 54
        end_line: 57
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      uid: f00d312b-be5a-4067-b489-a4547495983d
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'When ''super_over'' is ''Y'', the ''result'' column must be ''tie''.
        If the match result is ''runs'', ''wickets'', or ''no result'', ''super_over''
        should be ''N''. We can express this as a Deequ constraint: .satisfies("super_over
        != ''Y'' OR result = ''tie''", "Super over requires tie result")'
      sources:
      - start_line: 43
        end_line: 43
        file: ''
      - start_line: 67
        end_line: 69
        file: ''
      uid: b4a91c63-7aac-4453-b234-d54d2107ec6b
  '["result","winner"]':
