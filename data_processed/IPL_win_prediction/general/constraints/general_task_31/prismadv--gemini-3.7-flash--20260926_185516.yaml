    - text: 'When the ''result'' column indicates a decisive outcome such as ''runs''
        or ''wickets'', the ''winner'' column must not be null to properly assign
        win points and calculate winning margins. We could represent this assumption
        as a deequ constraint like this:

        .satisfies("result NOT IN (''runs'', ''wickets'') OR winner IS NOT NULL",
