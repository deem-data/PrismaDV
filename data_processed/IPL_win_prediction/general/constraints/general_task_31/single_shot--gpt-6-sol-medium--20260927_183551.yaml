constraints:
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Elimination Final', 'Eliminator',
        'Qualifier 1', 'Qualifier 2', 'Final', 'Semi Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'valid_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0)", 'decisive_match_has_positive_margin')
      - Valid
    - - .satisfies("result_margin IS NULL OR result_margin >= 0", 'nonnegative_margin_when_present')
      - Valid
    assumptions: []
    column_name: result_margin
  super_over:
    code:
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'valid_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies("team1 <> team2", 'distinct_teams')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .satisfies("lower(trim(toss_decision)) IN ('bat', 'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies("toss_winner IS NOT NULL AND toss_winner IN (team1, team2)", 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("winner IS NULL OR winner IN (team1, team2)", 'winner_is_participant_when_present')
      - Valid
    assumptions: []
    column_name: winner
  winner, result:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR winner IS NOT
        NULL", 'decisive_match_has_winner')
      - Valid
    assumptions: []
    column_name: winner, result
