      level: warning
      uid: 95883586-1db2-43c4-acc7-f9662ba871bc
      source_assumptions:
      - f05efb3d-5a64-44aa-a31b-c0b3da902dbd
    - suggestion: '.hasUniqueness([''id''], lambda x: x == 1.0)'
