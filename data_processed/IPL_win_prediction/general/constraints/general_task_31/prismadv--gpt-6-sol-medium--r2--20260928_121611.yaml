        `winner` IS NOT NULL", "decided matches have winners")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 6371b7b0-9028-4d78-85af-1cef08670d4d
      source_assumptions:
      - a9241ff6-bfa0-4317-bdb5-1d8f7d40e8e7
    - suggestion: .satisfies("NOT (lower(trim(`result`)) = 'tie' AND upper(trim(`super_over`))
