      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e2b14779-e5ce-43da-a59b-617db779bdd5
      source_assumptions:
      - a9241ff6-bfa0-4317-bdb5-1d8f7d40e8e7
    assumptions:
    - text: 'A match marked as having a super over (`super_over = ''Y''`) should have
        `result = ''tie''`. The aggregation subtracts super-over counts from tie counts,
        so a super over on a non-tie match would produce an incorrect count. Deequ:
        .satisfies("super_over <> ''Y'' OR result = ''tie''", "super overs only for
        ties")'
      sources:
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 67
        end_line: 69
        file: ''
      uid: 44f3c8ff-cd82-4720-a47e-b6d0320c3a3f
    - text: 'A match with `result = ''no result''` should have `super_over = ''N''`
        and a null `winner`. Such matches are excluded from the win-rate denominator,
        and the dataset''s sole no-result record accounts for its sole missing winner.
