      source_assumptions:
      - 294b1189-edda-4d39-9810-9f6f6195ed78
    - suggestion: '.satisfies(''`id` IS NOT NULL'', ''match_id_present'', lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 386e0882-f906-452a-8b88-7a4b5f954e22
      source_assumptions:
      - 294b1189-edda-4d39-9810-9f6f6195ed78
    assumptions:
    - text: 'A match must involve two different teams: ''team1'' != ''team2''. Otherwise,
        the two-row per-team view would count the same team twice for one match. This
        can be checked with a row-level constraint such as .satisfies("team1 <> team2",
        "distinct_match_teams").'
      sources:
      - start_line: 29
        end_line: 38
        file: ''
      uid: f05efb3d-5a64-44aa-a31b-c0b3da902dbd
    - text: Each 'id' should identify one match with a single 'team1', 'team2', and
        'match_type'. Duplicate rows or an ID reused for a different fixture or stage
        would cause the per-team aggregation to count a match incorrectly. Validate
        that 'id' is unique and that each ID has one associated team pair and match
        type.
      sources:
      - start_line: 29
        end_line: 38
        file: ''
      - start_line: 62
        end_line: 72
        file: ''
      uid: 294b1189-edda-4d39-9810-9f6f6195ed78
  '["method","result","toss_decision","toss_winner","winner"]':
    code:
    - suggestion: .satisfies('`team1` IS NOT NULL AND `team2` IS NOT NULL AND `team1`
        <> `team2` AND (`toss_winner` = `team1` OR `toss_winner` = `team2`)', 'toss_winner_is_one_of_two_distinct_teams')
