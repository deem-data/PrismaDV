      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ef2ec7a9-7bf8-4c33-bfc9-2724bcb7ac4e
      source_assumptions:
      - 61555f5e-6783-43d5-b543-28b1d7e7ec8d
    - suggestion: .satisfies("CASE WHEN `method` IS NOT NULL THEN lower(trim(`result`))
        IN ('runs', 'wickets') ELSE true END", 'method_requires_decided_result')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1bd86d45-3cc6-4405-90f1-f6eb7430b067
      source_assumptions:
      - cceb859f-2483-4b1e-95e0-1114c821ab9c
    assumptions:
    - text: "For every match, 'toss_winner' should equal exactly one of 'team1' or\
        \ 'team2'. Otherwise, the match will be attributed to the wrong team\u2014\
        or to neither team\u2014when calculating outcomes by toss decision. Row-level\
        \ constraint: toss_winner IN (team1, team2), with team1 != team2."
      sources:
      - start_line: 30
        end_line: 40
        file: ''
      - start_line: 59
        end_line: 64
        file: ''
      uid: dd6eabcd-ffb4-45ed-97ad-54848858a8c4
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''winner'' should equal either
        ''team1'' or ''team2''. This ensures the winning team receives a point and
        its winning margin is assigned to a team in the match. Row-level constraint:
        result NOT IN (''runs'', ''wickets'') OR winner IN (team1, team2).'
      sources:
      - start_line: 32
        end_line: 48
        file: ''
      - start_line: 53
        end_line: 57
        file: ''
      uid: 5c4e6f12-1b32-48b1-8cc6-16f7f8e8f91e
    - text: 'When ''result'' is ''no result'', ''winner'' should be null. Such matches
        are assigned zero denominator and zero points, so a recorded winning team
        would contradict the outcome used by the calculation. Row-level constraint:
        result != ''no result'' OR winner IS NULL.'
      sources:
      - start_line: 44
        end_line: 48
        file: ''
      uid: 6b5ddd4f-56b5-4bef-a94c-ecd2d5163e65
    - text: 'When ''super_over'' is ''Y'', ''result'' should be ''tie''. The aggregation
        subtracts every super-over match from the tie count in its group; a super
        over on a non-tie could therefore make ''ties_wo_super_over'' incorrect or
        negative. Row-level constraint: super_over != ''Y'' OR result = ''tie''.'
      sources:
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 63
        end_line: 69
        file: ''
      uid: 61555f5e-6783-43d5-b543-28b1d7e7ec8d
    - text: 'When ''method'' is non-null, ''result'' should be either ''runs'' or
        ''wickets''. The observed non-null method is ''D/L'', which describes a decided
        match rather than a tie or no-result outcome. Row-level constraint: method
        IS NULL OR result IN (''runs'', ''wickets'').'
      sources:
      - start_line: 30
        end_line: 38
        file: ''
      - start_line: 43
        end_line: 57
        file: ''
      uid: cceb859f-2483-4b1e-95e0-1114c821ab9c
  '["result","result_margin"]':
