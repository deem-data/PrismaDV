      - c2b494bf-800f-4f95-9b37-4cf872f59254
    assumptions:
    - text: 'After normalizing ''result'' and coercing ''result_margin'' to numeric,
        ''result_margin'' should be present if and only if ''result'' is ''runs''
        or ''wickets''. It should be null for ''tie'' and ''no result''. This matches
