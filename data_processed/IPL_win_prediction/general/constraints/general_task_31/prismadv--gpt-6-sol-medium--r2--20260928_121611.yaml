        result_margin IS NOT NULL) OR (result IN (''tie'', ''no result'') AND result_margin
        IS NULL).'
      sources:
      - start_line: 20
        end_line: 27
        file: ''
      - start_line: 53
        end_line: 57
        file: ''
      uid: fb2ebc30-f577-42b8-940c-6d86b980021b
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' should
        be a positive, whole-number value. The code rounds it to an integer before
        calculating average winning margins, so fractional or nonpositive values would
