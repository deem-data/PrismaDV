      source_assumptions:
      - cf3902d9-0124-40ac-bb60-ffb05bce43fa
    assumptions:
    - text: 'The two participants in a match must be different: ''team1'' must not
        equal ''team2''. Otherwise, the per-team view would create two rows for the
        same team in one match.'
      sources:
      - start_line: 29
        end_line: 38
        file: ''
      uid: e114b7cf-e828-437b-a004-1fbb8e3cdeca
    - text: When 'result' is 'runs' or 'wickets', or when 'result' is 'tie' and 'super_over'
