      uid: 35affd8c-e003-4cdc-862b-50beae24893f
      source_assumptions:
      - dd6eabcd-ffb4-45ed-97ad-54848858a8c4
    - suggestion: .satisfies("CASE WHEN lower(trim(`result`)) IN ('runs', 'wickets')
        THEN (`winner` = `team1` OR `winner` = `team2`) ELSE true END", 'decided_match_winner_is_participating_team')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 01601cb2-d406-4e77-aa03-77fb3644b0aa
      source_assumptions:
      - 5c4e6f12-1b32-48b1-8cc6-16f7f8e8f91e
    - suggestion: .satisfies("CASE WHEN lower(trim(`result`)) = 'no result' THEN `winner`
