        end_line: 48
        file: ''
      uid: a89a24b4-81ce-4ef2-8aed-ea4a756b7d67
    - text: 'For a tied match without a super over, ''winner'' should be null: the
        code awards both teams half a point rather than treating either as the winner.
        Deequ: .satisfies("result <> ''tie'' OR super_over = ''Y'' OR winner IS NULL",
