        average winning margins by result type. This can be checked with a conditional
        constraint on both columns.
      sources:
      - start_line: 25
        end_line: 27
        file: ''
      - start_line: 54
        end_line: 57
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      uid: 4d91b8a2-d57a-4ca3-a89b-e9a305c3eaa7
    - text: 'When ''result'' is ''tie'' or ''no result'', ''result_margin'' should
        be null: neither outcome has a runs- or wickets-winning margin. The observed
