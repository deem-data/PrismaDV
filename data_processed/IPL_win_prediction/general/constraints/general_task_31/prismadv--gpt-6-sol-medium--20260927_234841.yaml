    assumptions:
    - text: 'A super over should occur only for a tied match: if ''super_over'' is
        ''Y'', ''result'' must be ''tie''. Otherwise, the aggregation subtracts a
        super-over match from the count of ties without a super over. Deequ: .satisfies("super_over
        <> ''Y'' OR result = ''tie''", "super_over_only_for_ties")'
      sources:
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 67
        end_line: 69
        file: ''
      uid: d54f927f-5d91-4a69-8ea0-af260bcd4c98
    - text: 'For a match decided by runs or wickets, ''winner'' should be non-null
