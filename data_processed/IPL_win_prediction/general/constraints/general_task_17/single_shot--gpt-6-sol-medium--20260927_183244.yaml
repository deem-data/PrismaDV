constraints:
  date:
    code:
    - - .isComplete('date').satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("method IS NULL OR method = 'D/L'", 'recognized_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result').satisfies("lower(trim(result)) IN ('runs', 'wickets',
        'tie', 'no result')", 'recognized_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0 AND result_margin = floor(result_margin))",
        'decisive_match_has_positive_integer_margin').satisfies("lower(trim(result))
        <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR (target_overs IS NOT NULL
        AND target_overs > 0)", 'dl_match_has_target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1,team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').satisfies("lower(trim(toss_decision)) IN ('bat',
        'field')", 'valid_toss_decision')
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner = team1 OR toss_winner =
        team2', 'toss_winner_is_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies('winner IS NULL OR winner = team1 OR winner = team2', 'winner_is_participating_team').satisfies("lower(trim(result))
        NOT IN ('runs', 'wickets') OR winner IS NOT NULL", 'decisive_match_has_winner')
      - Valid
    assumptions: []
    column_name: winner
