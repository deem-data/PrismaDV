constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method,target_overs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR (target_overs IS NOT NULL
        AND target_overs > 0)", 'dl_has_usable_target_overs')
      - Valid
    assumptions: []
    column_name: method,target_overs
  method,target_runs:
    code:
    - - .satisfies("method IS NULL OR method <> 'D/L' OR target_runs IS NULL OR target_runs
        >= 0", 'dl_target_runs_convertible_to_nonnegative_integer')
      - Valid
    assumptions: []
    column_name: method,target_runs
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result,result_margin:
    code:
    - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0 AND result_margin = FLOOR(result_margin))", 'decisive_result_has_valid_margin')
      - Valid
    assumptions: []
    column_name: result,result_margin
  result,winner,team1,team2:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR winner IN (team1, team2)",
        'decisive_result_has_participant_winner')
      - Valid
    assumptions: []
    column_name: result,winner,team1,team2
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1,team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  toss_winner,team1,team2:
    code:
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner,team1,team2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
