      - - .satisfies("CASE WHEN lower(trim(result)) IN ('runs', 'wickets') THEN winner
          IS NOT NULL AND (winner = team1 OR winner = team2) WHEN lower(trim(result))
          = 'tie' THEN winner IS NULL OR winner = team1 OR winner = team2 ELSE winner
          IS NULL END", 'winner consistent with outcome and opponents')
        - Valid
      assumptions: []
      column_name: winner
