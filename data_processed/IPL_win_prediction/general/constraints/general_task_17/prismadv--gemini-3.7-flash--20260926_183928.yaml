    - text: 'When the ''result'' column indicates a decisive match (''runs'' or ''wickets''),
        the ''winner'' column must not be null and must be equal to either ''team1''
        or ''team2'', because the standings dictionary is only populated with ''team1''
        and ''team2'', and accessing `standings[(season, winner)]` would otherwise
        raise a KeyError. We could represent this assumption as a deequ constraint
        like this: .satisfies("CASE WHEN LOWER(TRIM(`result`)) IN (''runs'', ''wickets'')
        THEN (CASE WHEN `winner` = `team1` OR `winner` = `team2` THEN 1 ELSE 0 END)
        ELSE 1 END", "winner_matches_participating_teams", lambda x: x == 1.0)'
