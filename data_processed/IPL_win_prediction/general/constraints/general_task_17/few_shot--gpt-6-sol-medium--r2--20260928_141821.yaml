constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isPositive('id')
      - Invalid
    assumptions: []
    column_name: id
  method, target_overs:
    code:
    - - '.satisfies("CASE WHEN `method` = ''D/L'' THEN `target_overs` IS NOT NULL
        AND `target_overs` > 0 ELSE true END", ''dl_matches_have_positive_target_overs'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: method, target_overs
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("CASE WHEN `result` IN (''runs'', ''wickets'') THEN `result_margin`
        IS NOT NULL AND `result_margin` > 0 ELSE true END", ''decided_matches_have_positive_margin'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - '.satisfies(''`team1` <> `team2`'', ''opposing_teams_are_distinct'', lambda
        x: x == 1)'
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['field', 'bat'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - '.satisfies(''`toss_winner` IN (`team1`, `team2`)'', ''toss_winner_is_participant'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - '.satisfies("CASE WHEN `result` IN (''runs'', ''wickets'') THEN `winner` IS
        NOT NULL AND `winner` IN (`team1`, `team2`) ELSE true END", ''decided_matches_have_participating_winner'',
        lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: winner
