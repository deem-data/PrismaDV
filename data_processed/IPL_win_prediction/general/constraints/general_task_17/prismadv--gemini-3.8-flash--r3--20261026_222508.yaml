prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  '["city","venue"]':
    code:
    - suggestion: .satisfies('`city` IS NULL OR `venue` IS NOT NULL', 'venue_not_null_if_city_present')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3064b09d-7175-45c9-a311-a553af274736
      source_assumptions:
      - 42a3515c-b5e6-472f-aded-9be5723b6625
    assumptions:
    - text: 'Each ''venue'' should consistently correspond to a unique ''city'' (functional
        dependency: venue -> city). A single stadium or venue cannot be associated
        with multiple distinct cities across the dataset. We could represent this
        assumption as a Deequ constraint checking that the number of distinct cities
        per venue is at most 1.'
      sources:
      - start_line: 128
        end_line: 129
        file: ''
      uid: 2b02154b-8778-40a3-8569-b44fb947d684
    - text: '''venue'' is assumed to be non-null for all records where ''city'' is
        recorded, as ''venue'' is accessed directly without null handling while ''city''
        provides a fallback for missing values. We could represent this as a constraint
        like .satisfies(''city IS NULL OR venue IS NOT NULL'', ''Venue must be present
        if city is provided'').'
      sources:
      - start_line: 128
        end_line: 129
        file: ''
      uid: 42a3515c-b5e6-472f-aded-9be5723b6625
