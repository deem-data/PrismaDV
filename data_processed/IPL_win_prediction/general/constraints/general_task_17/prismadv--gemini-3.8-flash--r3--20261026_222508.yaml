      - start_line: 75
        end_line: 82
        file: ''
      - start_line: 86
        end_line: 93
        file: ''
      uid: 4f60bec4-a0db-438d-b3d2-e101cb635a3c
    - text: 'The values of ''team1'' and ''team2'' must be distinct for each match
        (''team1'' != ''team2''). If ''team1'' and ''team2'' are the same, the loser
        determination logic `loser = team2 if winner == team1 else team1` causes the
        same team to be recorded as both winner and loser, corrupting standings counts.
        We can represent this assumption as a Deequ constraint like: .satisfies("team1
        != team2", "Team1AndTeam2MustBeDistinct")'
      sources:
      - start_line: 51
        end_line: 54
        file: ''
      - start_line: 75
        end_line: 76
        file: ''
      - start_line: 85
        end_line: 87
