    - - .isComplete('result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("lower(trim(result)) NOT IN (''runs'', ''wickets'') OR result_margin
        IS NOT NULL", ''margin_present_for_decisive_results'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - '.satisfies("method IS NULL OR method <> ''D/L'' OR target_overs IS NOT NULL",
        ''dl_matches_have_target_overs'', lambda x: x == 1)'
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - '.satisfies("lower(trim(result)) NOT IN (''runs'', ''wickets'') OR winner
        = team1 OR winner = team2", ''decisive_winner_is_participating_team'', lambda
        x: x == 1)'
      - Valid
    assumptions: []
    column_name: winner
