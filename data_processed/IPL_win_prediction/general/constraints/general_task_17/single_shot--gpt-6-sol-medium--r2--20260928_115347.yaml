constraints:
  date:
    code:
    - - .isComplete('date').satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND
        to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isPositive('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("method IS NULL OR method = 'D/L'", 'valid_method')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR result_margin IS NOT NULL",
        'decisive_result_has_margin')
      - Valid
    - - .satisfies("result_margin IS NULL OR result_margin > 0", 'positive_result_margin_if_present')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    - - .satisfies("year(to_date(date, 'yyyy-MM-dd')) = season", 'date_matches_season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("method <> 'D/L' OR method IS NULL OR target_overs IS NOT NULL",
        'dl_has_target_overs')
      - Valid
    - - .satisfies("target_overs IS NULL OR target_overs > 0", 'positive_target_overs_if_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("target_runs IS NULL OR target_runs > 0", 'positive_target_runs_if_present')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1').satisfies("team1 <> team2", 'distinct_teams')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision').isContainedIn('toss_decision', ['field', 'bat'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies("toss_winner = team1 OR toss_winner =
        team2", 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("result <> 'tie' OR winner IS NULL OR winner = team1 OR winner
        = team2", 'tie_winner_is_participant_if_present')
      - Valid
    - - .satisfies("result NOT IN ('runs', 'wickets') OR winner = team1 OR winner
        = team2", 'decisive_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
