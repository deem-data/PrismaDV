      - start_line: 124
        end_line: 140
        file: ''
      uid: b86a09d9-3b46-4fe0-b608-9c9668741c72
    - text: For a given 'venue', populated 'city' values should be consistent after
        city-name normalization. Null cities are allowed because the code explicitly
        replaces them with an empty string. This can be checked by requiring at most
        one distinct normalized, non-null city per venue.
