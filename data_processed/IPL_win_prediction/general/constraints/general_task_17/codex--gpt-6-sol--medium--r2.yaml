prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport pandas as pd\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input,\
  \ 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\n    for col in ['result',\
  \ 'toss_decision', 'super_over', 'method']:\n        if col in df.columns:\n   \
  \         df[col] = df[col].astype(str)\n\n    toss_decision_lower = df['toss_decision'].str.strip().str.lower()\n\
  \    field_ratio = (toss_decision_lower == 'field').mean()\n    season_context_prefix\
  \ = \"Chasing trend continued as\"\n\n    standings = {}\n\n    def ensure_team(season,\
  \ team):\n        key = (season, team)\n        if key not in standings:\n     \
  \       standings[key] = {\n                'season': season,\n                'team':\
  \ team,\n                'matches_played': 0,\n                'wins': 0,\n    \
  \            'losses': 0,\n                'ties': 0,\n                'no_results':\
  \ 0,\n                'points': 0\n            }\n\n    summaries = []\n\n    if\
  \ 'date' in df.columns:\n        try:\n            df['_date'] = pd.to_datetime(df['date'],\
  \ errors='coerce')\n        except Exception:\n            df['_date'] = pd.NaT\n\
  \        df = df.sort_values(by=['_date', 'id'], ascending=[True, True]).drop(columns=['_date'],\
  \ errors='ignore')\n\n    for _, row in df.iterrows():\n        season = str(row['season'])\n\
  \        team1 = row['team1']\n        team2 = row['team2']\n        ensure_team(season,\
  \ team1)\n        ensure_team(season, team2)\n        result = str(row['result']).strip().lower()\n\
  \        winner = row['winner'] if pd.notna(row['winner']) else None\n        method\
  \ = row['method'] if pd.notna(row['method']) else None\n        method = str(method)\
  \ if method is not None else None\n        target_overs = row['target_overs'] if\
  \ 'target_overs' in row and pd.notna(row['target_overs']) else None\n        target_runs\
  \ = row['target_runs'] if 'target_runs' in row and pd.notna(row['target_runs'])\
  \ else None\n\n        dl_snippet = \"\"\n        if method == 'D/L':\n        \
  \    if target_runs is not None:\n                dl_snippet = f\" Target set to\
  \ {int(float(target_runs))} in {float(target_overs):g} overs (D/L).\"\n        \
  \    else:\n                dl_snippet = f\" Innings reduced to {float(target_overs):g}\
  \ overs (D/L).\"\n\n        summary = None\n\n        if result in ('runs', 'wickets'):\n\
  \            margin = row['result_margin']\n            if result == 'runs':\n \
  \               m_int = int(float(margin))\n                loser = team2 if winner\
  \ == team1 else team1\n                summary = f\"{season_context_prefix} {winner}\
  \ defended and beat {loser} by {m_int} runs.\" + dl_snippet\n\n                standings[(season,\
  \ winner)]['wins'] += 1\n                standings[(season, winner)]['matches_played']\
  \ += 1\n                standings[(season, winner)]['points'] += 2\n           \
  \     standings[(season, loser)]['losses'] += 1\n                standings[(season,\
  \ loser)]['matches_played'] += 1\n\n            else:\n                m_int = int(float(margin))\n\
  \                loser = team2 if winner == team1 else team1\n                summary\
  \ = f\"{season_context_prefix} {winner} chased successfully, winning against {loser}\
  \ by {m_int} wickets.\" + dl_snippet\n\n                standings[(season, winner)]['wins']\
  \ += 1\n                standings[(season, winner)]['matches_played'] += 1\n   \
  \             standings[(season, winner)]['points'] += 2\n                standings[(season,\
  \ loser)]['losses'] += 1\n                standings[(season, loser)]['matches_played']\
  \ += 1\n\n        elif result == 'tie':\n            if (winner in {team1, team2}):\n\
  \                loser = team2 if winner == team1 else team1\n                summary\
  \ = f\"{season_context_prefix} scores were level after regular play; {winner} prevailed\
  \ in the Super Over against {loser}.\" + dl_snippet\n                standings[(season,\
  \ winner)]['wins'] += 1\n                standings[(season, winner)]['matches_played']\
  \ += 1\n                standings[(season, winner)]['points'] += 2\n           \
  \     standings[(season, loser)]['losses'] += 1\n                standings[(season,\
  \ loser)]['matches_played'] += 1\n            else:\n                summary = f\"\
  {season_context_prefix} scores were level and the contest remained tied after the\
  \ Super Over.\" + dl_snippet\n                standings[(season, team1)]['ties']\
  \ += 1\n                standings[(season, team2)]['ties'] += 1\n              \
  \  standings[(season, team1)]['matches_played'] += 1\n                standings[(season,\
  \ team2)]['matches_played'] += 1\n                standings[(season, team1)]['points']\
  \ += 1\n                standings[(season, team2)]['points'] += 1\n\n        elif\
  \ result == 'no result':\n            summary = f\"{season_context_prefix} play\
  \ was inconclusive; no result was recorded.\" + dl_snippet\n            standings[(season,\
  \ team1)]['no_results'] += 1\n            standings[(season, team2)]['no_results']\
  \ += 1\n            standings[(season, team1)]['matches_played'] += 1\n        \
  \    standings[(season, team2)]['matches_played'] += 1\n            standings[(season,\
  \ team1)]['points'] += 1\n            standings[(season, team2)]['points'] += 1\n\
  \        else:\n            summary = f\"{season_context_prefix} outcome category\
  \ '{result}' unrecognized.\"\n\n        summaries.append({\n            'id': int(row['id']),\n\
  \            'season': season,\n            'date': row['date'],\n            'city':\
  \ row['city'] if pd.notna(row['city']) else '',\n            'venue': row['venue'],\n\
  \            'team1': team1,\n            'team2': team2,\n            'toss_winner':\
  \ row['toss_winner'],\n            'toss_decision': row['toss_decision'],\n    \
  \        'winner': winner if winner is not None else '',\n            'result':\
  \ row['result'],\n            'result_margin': row['result_margin'],\n         \
  \   'method': method if method is not None else '',\n            'super_over': row['super_over'],\n\
  \            'summary': summary.strip()\n        })\n\n    standings_df = pd.DataFrame(list(standings.values()))\n\
  \    standings_df = standings_df.sort_values(by=['season', 'points', 'wins'], ascending=[True,\
  \ False, False])\n\n    os.makedirs(args.output, exist_ok=True)\n    summaries_df\
  \ = pd.DataFrame(summaries)\n    summaries_df.to_csv(os.path.join(args.output, 'match_summaries.csv'),\
  \ index=False)\n    standings_df.to_csv(os.path.join(args.output, 'standings.csv'),\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_17.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 388, 'season': 2013, 'city': 'Jaipur', 'date': '2013-04-14', 'match_type': 'League',\
  \ 'player_of_match': 'JP Faulkner', 'venue': 'Sawai Mansingh Stadium', 'team1':\
  \ 'Rajasthan Royals', 'team2': 'Kings XI Punjab', 'toss_winner': 'Rajasthan Royals',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'wickets', 'result_margin':\
  \ 6.0, 'target_runs': 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'Aleem Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season':\
  \ 2022, 'city': 'Pune', 'date': '2022-03-29', 'match_type': 'League', 'player_of_match':\
  \ 'SV Samson', 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1':\
  \ 'Rajasthan Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers\
  \ Hyderabad', 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result':\
  \ 'runs', 'result_margin': 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over':\
  \ 'N', 'method': nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id':\
  \ 249, 'season': 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League',\
  \ 'player_of_match': 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata\
  \ Knight Riders', 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision':\
  \ 'field', 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
