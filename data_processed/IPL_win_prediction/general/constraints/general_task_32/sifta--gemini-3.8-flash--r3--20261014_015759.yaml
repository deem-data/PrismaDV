      \ or invalid data is harmlessly tolerated—such coercions often silently introduce\
      \ NaNs/NaTs, corrupt metrics, or bypass business logic. Conversely, if a column\
      \ is parsed but never used in any downstream filtering, grouping, metrics, or\
      \ output, variations in it do not compromise task results.\n\nFrom the code\
      \ that uses the target column, the target column profile (target_column_desc:\
      \ completeness, data type, distinct values, histogram), and the task description:\n\
      1. Identify concrete data properties required for the code to run correctly\
      \ and avoid silent logical corruption (e.g., valid relational consistency across\
      \ columns, expected categorical values, non-negative metrics, non-zero denominators,\
      \ and uniqueness/completeness of primary keys).\n2. Ground completeness assumptions\
      \ in downstream code requirements and observed profiles:\n   - Completeness\
      \ (1.0): Assume 100% completeness ONLY when the column is an essential key or\
      \ grouping column (e.g., match `id`, `season`, `team`) where NULLs cause dropped\
      \ records, wrong aggregations, or division errors, AND observed completeness\
      \ in `target_column_desc` is 1.0. Do NOT assume 1.0 completeness for non-key\
      \ columns (such as `result`, `date`, `toss_winner`) where missing values do\
      \ not crash or corrupt the code.\n   - Partial completeness: NEVER assume arbitrary\
      \ high completeness thresholds (e.g., \"completeness >= 99%\") when observed\
      \ completeness is less than 1.0. If the profile shows completeness < 1.0, the\
      \ column naturally admits missing values in normal operations (e.g., `winner`\
      \ is null for matches ending in \"no result\" or \"tie\"). New safe partitions\
      \ naturally vary in missingness; setting tight completeness thresholds causes\
      \ severe false alarms on safe data. Instead, focus on conditional validity when\
      \ present (e.g., \"when not null, winner must match either team1 or team2\"\
      ).\n3. Avoid rigid categorical domain assumptions:\n   - Do NOT assume that\
      \ a column is strictly restricted to the specific categories seen in the `target_column_desc`\
      \ histogram (e.g., do NOT assume `result` is restricted to ['runs', 'wickets',\
