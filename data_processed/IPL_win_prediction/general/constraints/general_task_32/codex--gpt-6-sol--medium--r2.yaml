prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    os.makedirs(args.output, exist_ok=True)\n    input_file = os.path.join(args.input,\
  \ 'new_data.csv')\n\n    df = pd.read_csv(input_file)\n\n    # Normalize and coerce\
  \ types used downstream\n    df['result'] = df['result'].astype(str).str.strip().str.lower()\n\
  \    df['super_over'] = df['super_over'].astype(str).str.strip().str.upper()\n \
  \   df['result_margin'] = pd.to_numeric(df.get('result_margin'), errors='coerce')\n\
  \    df['date'] = pd.to_datetime(df.get('date'), errors='coerce')\n\n    # Masks\
  \ used throughout\n    mask_runs = df['result'] == 'runs'\n    mask_wkts = df['result']\
  \ == 'wickets'\n    mask_tie = df['result'] == 'tie'\n    mask_nr = df['result']\
  \ == 'no result'\n    mask_decided = mask_runs | mask_wkts\n    # Compute scaled\
  \ factor for runs\n    df['run_factor'] = np.nan\n    df.loc[mask_runs, 'run_factor']\
  \ = (df.loc[mask_runs, 'result_margin'].astype(int).clip(upper=200) / 200.0).astype(\n\
  \        float)\n    # Compute scaled factor for wickets (1..10 -> 0.1..1.0)\n \
  \   df['wk_factor'] = np.nan\n    df.loc[mask_wkts, 'wk_factor'] = (df.loc[mask_wkts,\
  \ 'result_margin'].astype(int) / 10.0).astype(float)\n    # Derive losing team for\
  \ decided matches\n    loser_calc = np.where(\n        df['winner'].eq(df['team1']),\
  \ df['team2'],\n        np.where(df['winner'].eq(df['team2']), df['team1'], pd.NA)\n\
  \    )\n    df['loser'] = pd.Series(loser_calc, index=df.index)\n    df.loc[~mask_decided,\
  \ 'loser'] = pd.NA\n    # Outcome summaries per match\n    summary = pd.Series(index=df.index,\
  \ dtype=object)\n    # Decided by runs\n    if mask_runs.any():\n        summary.loc[mask_runs]\
  \ = (\n                df.loc[mask_runs, 'winner'].astype(str)\n               \
  \ + ' won by '\n                + df.loc[mask_runs, 'result_margin'].astype(int).astype(str)\n\
  \                + ' runs'\n        )\n    # Decided by wickets\n    if mask_wkts.any():\n\
  \        summary.loc[mask_wkts] = (\n                df.loc[mask_wkts, 'winner'].astype(str)\n\
  \                + ' won by '\n                + df.loc[mask_wkts, 'result_margin'].astype(int).astype(str)\n\
  \                + ' wickets'\n        )\n    # Tied (super over expected from assertion)\n\
  \    if mask_tie.any():\n        summary.loc[mask_tie] = (\n                df.loc[mask_tie,\
  \ 'team1'].astype(str)\n                + ' and '\n                + df.loc[mask_tie,\
  \ 'team2'].astype(str)\n                + ' tied; Super Over'\n        )\n    #\
  \ No result\n    if mask_nr.any():\n        summary.loc[mask_nr] = 'Match abandoned;\
  \ no result'\n\n    df['outcome_summary'] = summary\n\n    # Points allocation and\
  \ per-team match events\n    # Positive impact for winners in decided matches\n\
  \    df['pos_impact'] = 0.0\n    df.loc[mask_runs, 'pos_impact'] = df.loc[mask_runs,\
  \ 'run_factor']\n    df.loc[mask_wkts, 'pos_impact'] = df.loc[mask_wkts, 'wk_factor']\n\
  \n    # Build events for standings\n    events = []\n\n    # Winners (decided)\n\
  \    winners_ev = df.loc[mask_decided, ['id', 'season', 'date', 'winner', 'pos_impact']].copy()\n\
  \    winners_ev.rename(columns={'winner': 'team'}, inplace=True)\n    winners_ev['outcome']\
  \ = 'W'\n    winners_ev['points'] = 2\n    winners_ev['net_impact'] = winners_ev['pos_impact']\n\
  \    events.append(winners_ev[['id', 'season', 'date', 'team', 'outcome', 'points',\
  \ 'net_impact']])\n\n    # Losers (decided)\n    losers_ev = df.loc[mask_decided,\
  \ ['id', 'season', 'date', 'loser', 'pos_impact']].copy()\n    losers_ev.rename(columns={'loser':\
  \ 'team'}, inplace=True)\n    losers_ev['outcome'] = 'L'\n    losers_ev['points']\
  \ = 0\n    losers_ev['net_impact'] = -losers_ev['pos_impact']\n    events.append(losers_ev[['id',\
  \ 'season', 'date', 'team', 'outcome', 'points', 'net_impact']])\n\n    # Ties ->\
  \ one point each\n    if mask_tie.any():\n        tie_ev_t1 = df.loc[mask_tie, ['id',\
  \ 'season', 'date', 'team1']].copy()\n        tie_ev_t1.rename(columns={'team1':\
  \ 'team'}, inplace=True)\n        tie_ev_t1['outcome'] = 'T'\n        tie_ev_t1['points']\
  \ = 1\n        tie_ev_t1['net_impact'] = 0.0\n\n        tie_ev_t2 = df.loc[mask_tie,\
  \ ['id', 'season', 'date', 'team2']].copy()\n        tie_ev_t2.rename(columns={'team2':\
  \ 'team'}, inplace=True)\n        tie_ev_t2['outcome'] = 'T'\n        tie_ev_t2['points']\
  \ = 1\n        tie_ev_t2['net_impact'] = 0.0\n\n        events.extend([\n      \
  \      tie_ev_t1[['id', 'season', 'date', 'team', 'outcome', 'points', 'net_impact']],\n\
  \            tie_ev_t2[['id', 'season', 'date', 'team', 'outcome', 'points', 'net_impact']],\n\
  \        ])\n\n    # No result -> one point each\n    if mask_nr.any():\n      \
  \  nr_ev_t1 = df.loc[mask_nr, ['id', 'season', 'date', 'team1']].copy()\n      \
  \  nr_ev_t1.rename(columns={'team1': 'team'}, inplace=True)\n        nr_ev_t1['outcome']\
  \ = 'NR'\n        nr_ev_t1['points'] = 1\n        nr_ev_t1['net_impact'] = 0.0\n\
  \n        nr_ev_t2 = df.loc[mask_nr, ['id', 'season', 'date', 'team2']].copy()\n\
  \        nr_ev_t2.rename(columns={'team2': 'team'}, inplace=True)\n        nr_ev_t2['outcome']\
  \ = 'NR'\n        nr_ev_t2['points'] = 1\n        nr_ev_t2['net_impact'] = 0.0\n\
  \n        events.extend([\n            nr_ev_t1[['id', 'season', 'date', 'team',\
  \ 'outcome', 'points', 'net_impact']],\n            nr_ev_t2[['id', 'season', 'date',\
  \ 'team', 'outcome', 'points', 'net_impact']],\n        ])\n\n    events_df = pd.concat(events,\
  \ ignore_index=True) if events else pd.DataFrame(\n        columns=['id', 'season',\
  \ 'date', 'team', 'outcome', 'points', 'net_impact']\n    )\n\n    # Aggregate to\
  \ standings per season/team\n    if not events_df.empty:\n        agg = events_df.groupby(['season',\
  \ 'team']).agg(\n            played=('id', 'count'),\n            wins=('outcome',\
  \ lambda s: (s == 'W').sum()),\n            losses=('outcome', lambda s: (s == 'L').sum()),\n\
  \            ties=('outcome', lambda s: (s == 'T').sum()),\n            no_results=('outcome',\
  \ lambda s: (s == 'NR').sum()),\n            points=('points', 'sum'),\n       \
  \     net_impact=('net_impact', 'sum')\n        ).reset_index()\n        agg['win_pct']\
  \ = np.where(\n            agg['played'] > 0,\n            (agg['wins'] / agg['played']).round(4),\n\
  \            0.0\n        )\n    else:\n        agg = pd.DataFrame(\n          \
  \  columns=['season', 'team', 'played', 'wins', 'losses', 'ties', 'no_results',\
  \ 'points', 'net_impact',\n                     'win_pct'])\n\n    # Per-match summaries\
  \ output\n    match_summaries = df[\n        ['id', 'season', 'date', 'match_type',\
  \ 'team1', 'team2', 'winner', 'loser', 'result', 'result_margin',\n         'super_over',\
  \ 'outcome_summary']].copy()\n\n    # Also include per-match points awarded to each\
  \ team for transparency\n    # Decided matches\n    match_summaries['points_team1']\
  \ = 0\n    match_summaries['points_team2'] = 0\n    match_summaries.loc[mask_decided\
  \ & df['winner'].eq(df['team1']), 'points_team1'] = 2\n    match_summaries.loc[mask_decided\
  \ & df['winner'].eq(df['team2']), 'points_team2'] = 2\n    # Ties and NR\n    match_summaries.loc[mask_tie\
  \ | mask_nr, ['points_team1', 'points_team2']] = 1\n\n    match_summaries.sort_values(['season',\
  \ 'date', 'id'], inplace=True)\n    agg.sort_values(['season', 'points', 'net_impact',\
  \ 'win_pct'], ascending=[True, False, False, False], inplace=True)\n\n    match_summaries.to_csv(os.path.join(args.output,\
  \ 'match_summaries.csv'), index=False)\n    agg.to_csv(os.path.join(args.output,\
  \ 'standings_by_season.csv'), index=False)\n\n\nif __name__ == '__main__':\n   \
  \ main()\n\n```\n\nThe same program is on disk at `./code/general_task_32.py`, so\
  \ you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur',\
  \ 'date': '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner',\
  \ 'venue': 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings\
  \ XI Punjab', 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs':\
  \ 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem\
  \ Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune',\
  \ 'date': '2022-03-29', 'match_type': 'League', 'player_of_match': 'SV Samson',\
  \ 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1': 'Rajasthan\
  \ Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers Hyderabad',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin':\
  \ 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id': 249, 'season':\
  \ 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League', 'player_of_match':\
  \ 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata Knight Riders',\
  \ 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field',\
  \ 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
