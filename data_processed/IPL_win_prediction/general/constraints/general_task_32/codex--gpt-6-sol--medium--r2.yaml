raw_constraints_as_written:
- column_name: id
  code_for_constraint: .isComplete('id')
- column_name: id
  code_for_constraint: .isUnique('id')
- column_name: season
  code_for_constraint: .isComplete('season')
- column_name: date
  code_for_constraint: .isComplete('date')
- column_name: date
  code_for_constraint: .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date,
    'yyyy-MM-dd') IS NOT NULL", 'valid match date')
- column_name: season
  code_for_constraint: .satisfies("year(to_date(date, 'yyyy-MM-dd')) = season", 'match
    assigned to its calendar season')
- column_name: match_type
  code_for_constraint: .isComplete('match_type')
- column_name: team1
  code_for_constraint: .isComplete('team1')
- column_name: team2
  code_for_constraint: .isComplete('team2')
- column_name: team1
  code_for_constraint: .satisfies("trim(team1) <> '' AND trim(team2) <> '' AND trim(team1)
    <> trim(team2)", 'two distinct named teams')
- column_name: result
  code_for_constraint: .isComplete('result')
- column_name: result
  code_for_constraint: .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie',
    'no result')", 'recognized match result')
- column_name: winner
  code_for_constraint: .satisfies("CASE WHEN lower(trim(result)) IN ('runs', 'wickets')
    THEN winner IS NOT NULL AND (winner = team1 OR winner = team2) ELSE true END",
    'decided match winner is a participating team')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN lower(trim(result)) IN ('runs', 'wickets')
    THEN result_margin IS NOT NULL AND result_margin >= 1 AND result_margin = floor(result_margin)
    ELSE true END", 'decided match has positive whole margin')
- column_name: result_margin
  code_for_constraint: .satisfies("CASE WHEN lower(trim(result)) = 'wickets' THEN
    result_margin <= 10 ELSE true END", 'wicket margin at most ten')
- column_name: super_over
  code_for_constraint: .isComplete('super_over')
- column_name: super_over
  code_for_constraint: .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'recognized
    super over flag')
- column_name: super_over
  code_for_constraint: .satisfies("(lower(trim(result)) = 'tie' AND upper(trim(super_over))
    = 'Y') OR (lower(trim(result)) <> 'tie' AND upper(trim(super_over)) = 'N')", 'ties
    correspond to super overs')
