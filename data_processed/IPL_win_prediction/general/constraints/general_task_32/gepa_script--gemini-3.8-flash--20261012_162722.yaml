      \ data omission | `\"error\"` |\n| Categorical fallbacks (`else: base = r`,\
      \ `.isin()`) | Unseen category | Harmless fallthrough | `\"warning\"` |\n| Safe\
      \ parsers (`errors='coerce'`) | Unparseable value | Coerced to `NaN`/`NaT` safely\
      \ | `\"warning\"` |\n| Descriptive metadata (`city`, `venue`, `umpire1`, `player_of_match`)\
      \ | Null / Missing | Non-critical informational fields | `\"warning\"` |\n\n\
      ---\n\n### Detailed Check Formulation Guidelines\n\n#### 1. Divisors & Mathematical\
      \ Calculations (Never Ignore Division by Zero)\n- In Python and NumPy, dividing\
      \ by zero produces unhandled errors or invalid `inf`/`NaN` propagating downstream.\n\
      - If the script computes `result_margin / target_overs` when `result == 'runs'`,\
      \ `target_overs` MUST be non-null and strictly positive:\n  ```python\n  .satisfies(\"\
      (`result` IS NULL OR `result` != 'runs') OR (`target_overs` IS NOT NULL AND\
      \ `target_overs` > 0)\", \"target_overs_positive_when_runs\")\n  ```\n  Set\
      \ `\"level\": \"error\"`.\n\n#### 2. Cross-Column & Relational Invariants\n\
      - **Entity Consistency**: When a record references competing entities (`team1`,\
      \ `team2`) and a victor (`winner` or `toss_winner`):\n  - If a match concludes\
      \ decisively (e.g., `result IN ('runs', 'wickets')`), `winner` MUST NOT be NULL\
      \ and MUST be either `team1` or `team2`:\n    ```python\n    .satisfies(\"(`result`\
      \ IS NULL OR `result` NOT IN ('runs', 'wickets')) OR (`winner` IS NOT NULL AND\
      \ (`winner` = `team1` OR `winner` = `team2`))\", \"winner_in_participating_teams_for_decisive\"\
      )\n    ```\n    Set `\"level\": \"error\"`.\n  - `toss_winner` should always\
      \ be one of the participating teams:\n    ```python\n    .satisfies(\"`toss_winner`\
      \ IS NOT NULL AND (`toss_winner` = `team1` OR `toss_winner` = `team2`)\", \"\
      toss_winner_in_teams\")\n    ```\n    Set `\"level\": \"error\"`.\n- **Conditional\
      \ Numeric Fields**: If `result_margin` is evaluated or cast when `result IN\
      \ ('runs', 'wickets')`:\n  ```python\n  .satisfies(\"(`result` IS NULL OR `result`\
      \ NOT IN ('runs', 'wickets')) OR (`result_margin` IS NOT NULL AND `result_margin`\
      \ >= 0)\", \"result_margin_valid_for_decisive\")\n  ```\n  Set `\"level\": \"\
      error\"`.\n\n#### 3. Core Structural Keys vs. Auxiliary Metadata\n- **Primary\
      \ / Groupby Keys**: Columns like `id`, `season`, `team1`, `team2` that have\
      \ `completeness: 1.0` in the baseline profile and serve as groupings (`df.groupby(['season',\
      \ 'team'])`) or match identifiers MUST have `.isComplete(...)` at `\"level\"\
      : \"error\"`. A corrupt batch missing these values causes corrupted output tables\
      \ or dropped groups.\n- **Categorical Integrity for Control Flow**: If `result`\
      \ dictates control flow branches (e.g., `runs`, `wickets`, `tie`, `no result`),\
      \ validate its completeness at `\"level\": \"error\"` and its allowed values\
      \ with `.isContainedIn(...)`.\n- **Auxiliary Columns**: Columns like `city`,\
      \ `venue`, `umpire1`, `umpire2`, `player_of_match` that are merely preserved\
      \ in output CSVs or string summaries should be checked at `\"level\": \"warning\"\
      ` or with relaxed constraints.\n\n#### 4. Spark SQL Three-Valued Logic & Backtick\
      \ Escaping\nIn all `.satisfies(condition, name)` expressions:\n1. **Always escape\
      \ column names with backticks**: e.g., `` `result` ``, `` `date` ``, `` `method`\
      \ ``, `` `season` ``.\n2. **Guard against SQL three-valued logic**: In Spark\
      \ SQL, `NULL NOT IN ('runs', 'wickets')` evaluates to `NULL` (falsy). To ensure\
      \ the check does not fail when the gating column itself is null, write:\n  \
      \ ``(`col` IS NULL OR `col` NOT IN ('val1', 'val2')) OR ...``\n3. **String Case\
      \ & Trimming**: If the Python script performs `.str.strip().str.lower()`, normalize\
      \ in SQL using `lower(trim(`col`))` when comparing string values.\n\n---\n\n\
      ### Output JSON Format\n\nReturn ONLY a valid JSON array of objects conforming\
      \ to the schema below:\n\n```json\n[\n  {\n    \"column_group\": \"col_name\"\
      \ | [\"col_1\", \"col_2\"],\n    \"assumptions\": [\n      {\n        \"text\"\
      : \"Precise description of the assumption rooted in script operations and data\
      \ contracts.\",\n        \"sources\": [\n          {\n            \"start_line\"\
      : 25,\n            \"end_line\": 30\n          }\n        ]\n      }\n    ],\n\
      \    \"code\": [\n      {\n        \"suggestion\": \".satisfies(\\\"(`result`\
      \ IS NULL OR `result` != 'runs') OR (`target_overs` IS NOT NULL AND `target_overs`\
      \ > 0)\\\", \\\"target_overs_positive_when_runs\\\")\",\n        \"level\":\
      \ \"error\",\n        \"linked_assumptions\": [0]\n      }\n    ]\n  }\n]\n\
      ```\n\n### Self-Audit Verification Checklist\n1. **Did I flag all crash-prone\
      \ operations as `\"error\"`?** Check every `int(...)`, `float(...)`, dictionary\
      \ key access, division operation, and unhandled conditional conversion.\n2.\
      \ **Did I check divisor non-zero status?** Any column in the denominator of\
      \ a division (even within `np.where`) must be checked for `IS NOT NULL AND >\
      \ 0` at `\"level\": \"error\"`.\n3. **Did I protect primary grouping keys?**\
      \ Core entities with baseline completeness 1.0 (`id`, `season`, `team1`, `team2`)\
      \ must have `.isComplete(...)` at `\"level\": \"error\"`.\n4. **Did I handle\
      \ SQL three-valued logic?** Ensure all conditional `.satisfies()` checks explicitly\
      \ account for `IS NULL` on the gating column.\n5. **Did I prevent false alarms?**\
      \ Columns with baseline completeness < 1.0 must not have unconditional `.isComplete(...,\
      \ level=\"error\")`."
