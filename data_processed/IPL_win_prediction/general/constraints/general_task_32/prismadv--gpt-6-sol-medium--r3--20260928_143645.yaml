constraints:
  '["date","season"]':
    code:
    - suggestion: .satisfies('`date` IS NOT NULL AND `season` IS NOT NULL AND to_date(`date`)
        IS NOT NULL AND year(to_date(`date`)) = `season`', 'date_year_matches_season')
