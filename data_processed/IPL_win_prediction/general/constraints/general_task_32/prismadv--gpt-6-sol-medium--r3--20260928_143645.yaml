    assumptions:
    - text: 'After normalization, ''super_over'' should be ''Y'' if and only if ''result''
        is ''tie''; for every other result, ''super_over'' should be ''N''. The script
        describes tied matches as involving a Super Over, and the dataset has the
        same number of ''tie'' and ''Y'' records. This can be checked with: .satisfies("(result
        = ''tie'' AND super_over = ''Y'') OR (result <> ''tie'' AND super_over = ''N'')",
