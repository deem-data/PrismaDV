        end_line: 118
        file: ''
      - start_line: 123
        end_line: 137
        file: ''
      uid: 44d49bfe-8e70-4079-a3f8-87a760269a7f
    - text: 'For every decided match (''result'' is ''runs'' or ''wickets'' after
        normalization), ''winner'' must equal exactly one of ''team1'' or ''team2''.
        This is required to derive the loser and assign points to the correct participant.
        Deequ: .satisfies("result NOT IN (''runs'', ''wickets'') OR (winner IS NOT
        NULL AND (winner = team1 OR winner = team2))", "decided winner is a participant")'
      sources:
      - start_line: 26
        end_line: 30
        file: ''
      - start_line: 38
        end_line: 44
        file: ''
      - start_line: 87
        end_line: 100
        file: ''
      - start_line: 172
        end_line: 175
        file: ''
      uid: 8c19fb7e-44f7-4414-b4e3-dc2e56f23c14
    - text: 'For a match with ''result'' equal to ''no result'', ''winner'' should
        be null; no winner receives win points, and both participants receive one
        point. Deequ: .satisfies("result <> ''no result'' OR winner IS NULL", "no-result
        match has no winner")'
      sources:
      - start_line: 29
        end_line: 30
        file: ''
      - start_line: 121
        end_line: 137
        file: ''
      - start_line: 172
        end_line: 177
        file: ''
      uid: b30ddac4-9fd0-4dba-9d1b-2570c197415a
