      source_assumptions:
      - b30ddac4-9fd0-4dba-9d1b-2570c197415a
    assumptions:
    - text: 'Every match must have two distinct, non-null participants: ''team1''
        and ''team2'' must both be present and must differ. Otherwise, the script
        can create two standings events for the same team in one match. Deequ: .satisfies("team1
