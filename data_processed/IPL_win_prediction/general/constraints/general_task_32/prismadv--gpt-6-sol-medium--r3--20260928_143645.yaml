      source_assumptions:
      - 5753e945-9e93-4904-892c-59f88bb01ef4
    assumptions:
    - text: 'The integer ''season'' identifies the calendar year of the match: every
        ''date'' must parse as a valid date, and its year must equal ''season''. This
        keeps matches ordered and reported under the correct season. A row-level constraint
        could check `date IS NOT NULL AND year(to_date(date)) = season`.'
      sources:
      - start_line: 23
        end_line: 23
        file: ''
      - start_line: 87
        end_line: 95
        file: ''
      - start_line: 166
        end_line: 179
        file: ''
      uid: 5753e945-9e93-4904-892c-59f88bb01ef4
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("lower(trim(`result`)) <> 'runs' OR (`result_margin`
        IS NOT NULL AND `result_margin` > 0 AND `result_margin` = floor(`result_margin`))",
        "valid_runs_margin")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e7ab9898-d9d3-4487-b7c1-086bb370b550
      source_assumptions:
      - 74807b99-f29f-4ad2-bc46-35bff007c2df
    - suggestion: .satisfies("lower(trim(`result`)) <> 'wickets' OR (`result_margin`
        IS NOT NULL AND `result_margin` BETWEEN 1 AND 10 AND `result_margin` = floor(`result_margin`))",
        "valid_wickets_margin")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 56b4ab9d-ddd8-4ab3-826a-ee451f999a7d
      source_assumptions:
      - ad68b78b-6c08-41c7-b9d2-a0b38b01510d
    - suggestion: .satisfies("lower(trim(`result`)) NOT IN ('tie', 'no result') OR
        `result_margin` IS NULL", "no_margin_for_undecided_matches")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0f701c88-1ebf-48b7-9828-7722b0adb78c
      source_assumptions:
      - e5a19af1-795b-4e8c-a3d5-4e1d83356c57
    assumptions:
    - text: 'For every match whose normalized ''result'' is ''runs'', ''result_margin''
        must be non-null, numeric, and a positive whole number. The code converts
        it to an integer to calculate the run factor and write the outcome summary.
        A constraint can check: lower(trim(result)) <> ''runs'' OR (result_margin
        IS NOT NULL AND result_margin > 0 AND result_margin = floor(result_margin)).'
      sources:
      - start_line: 20
        end_line: 22
        file: ''
      - start_line: 26
        end_line: 34
        file: ''
      - start_line: 48
        end_line: 54
        file: ''
      uid: 74807b99-f29f-4ad2-bc46-35bff007c2df
    - text: 'For every match whose normalized ''result'' is ''wickets'', ''result_margin''
        must be a non-null, numeric whole number between 1 and 10 inclusive. The code
        converts it to an integer and scales it as a wickets margin. A constraint
        can check: lower(trim(result)) <> ''wickets'' OR (result_margin IS NOT NULL
        AND result_margin BETWEEN 1 AND 10 AND result_margin = floor(result_margin)).'
      sources:
      - start_line: 20
        end_line: 22
        file: ''
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 35
        end_line: 37
        file: ''
      - start_line: 56
        end_line: 62
        file: ''
      uid: ad68b78b-6c08-41c7-b9d2-a0b38b01510d
    - text: 'When the normalized ''result'' is ''tie'' or ''no result'', ''result_margin''
        should be null: neither outcome has a winning margin, and the code does not
        use a margin for its summary or points allocation. The dataset''s six missing
        margins are consistent with its five ties and one no-result match. A constraint
        can check: lower(trim(result)) NOT IN (''tie'', ''no result'') OR result_margin
        IS NULL.'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 63
        end_line: 73
        file: ''
      - start_line: 176
        end_line: 177
        file: ''
      uid: e5a19af1-795b-4e8c-a3d5-4e1d83356c57
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("`result` IS NOT NULL AND `super_over` IS NOT NULL AND
        ((lower(trim(`result`)) = 'tie' AND upper(trim(`super_over`)) = 'Y') OR (lower(trim(`result`))
