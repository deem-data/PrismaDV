      - start_line: 20
        end_line: 30
        file: ''
      - start_line: 33
        end_line: 37
        file: ''
      - start_line: 64
        end_line: 73
        file: ''
      uid: 3ea84423-0d76-4adb-84d8-aa743134c10c
    - text: For every row whose normalized 'result' is 'runs' or 'wickets', 'result_margin'
        should be a whole number. Integer conversion is used both to calculate impact
        and to describe the outcome; a fractional margin would otherwise be silently
        truncated.
