  '["result","result_margin"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column has the value ''runs'' or ''wickets'', ''result_margin''
        must not be null and must be convertible to an integer, because the downstream
        code calls .astype(int) on ''result_margin'' for rows where ''result'' is
        ''runs'' or ''wickets''. We could represent this assumption as a Deequ constraint
        like: .satisfies("result NOT IN (''runs'', ''wickets'') OR result_margin IS
        NOT NULL", "result_margin_non_null_when_runs_or_wickets")'
      sources:
      - start_line: 26
        end_line: 37
        file: ''
      - start_line: 49
        end_line: 62
        file: ''
      uid: 26191956-8d3f-403a-8c1b-84bc05002709
  '["result","super_over"]':
    code:
    - suggestion: .satisfies("CASE WHEN `result` = 'tie' THEN `super_over` = 'Y' ELSE
        `super_over` = 'N' END", "super_over_iff_tie")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a5d9913c-bd92-4ebd-b662-c592098ea603
      source_assumptions:
      - 4618a156-57a7-48a9-a3b6-03b84d23fd01
    assumptions:
    - text: 'The ''super_over'' column is ''Y'' if and only if ''result'' is ''tie''.
        For all non-tied matches (''runs'', ''wickets'', ''no result''), ''super_over''
        is ''N''. This conditional relationship can be validated with a constraint
        such as: .satisfies("CASE WHEN result = ''tie'' THEN super_over = ''Y'' ELSE
        super_over = ''N'' END", ''Super over should be Y if and only if result is
        tie'')'
