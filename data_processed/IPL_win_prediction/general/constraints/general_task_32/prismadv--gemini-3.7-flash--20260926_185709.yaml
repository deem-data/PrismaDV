  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When ''winner'' is present, it must be either ''team1'' or ''team2''.
        If ''winner'' does not match either team, the loser cannot be derived correctly
        and neither team will be awarded winner points for decided matches. We could
        represent this assumption as a Deequ constraint: .satisfies("winner IS NULL
        OR winner = team1 OR winner = team2", "WinnerMustBeTeam1OrTeam2")'
      sources:
      - start_line: 39
        end_line: 42
        file: ''
      - start_line: 174
        end_line: 175
        file: ''
      uid: 7028f593-58cb-4002-b30a-f25d7e870353
    - text: 'The columns ''team1'' and ''team2'' should represent distinct teams for
        every match record (i.e., ''team1'' != ''team2''). If ''team1'' equals ''team2'',
        the match-up logic, loser derivation, and tie/NR event handling will be corrupted.
        We could represent this assumption as a Deequ constraint: .satisfies("team1
        != team2", "TeamsMustBeDistinct")'
