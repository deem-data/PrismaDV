    assumptions:
    - text: The 'date' and 'season' columns must be non-null and temporally consistent,
        such that the year extracted from 'date' corresponds to the match 'season'
        (or falls within that season's timeframe). Additionally, 'date' must be parseable
        as a valid datetime to support correct chronological sorting with 'season'
        in 'match_summaries.sort_values(['season', 'date', 'id'])'.
      sources:
      - start_line: 23
        end_line: 23
        file: ''
