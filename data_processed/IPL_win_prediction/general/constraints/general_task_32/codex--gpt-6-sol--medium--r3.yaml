raw_constraints_as_written:
- column_name: id
  code_for_constraint: .isComplete('id')
- column_name: id
  code_for_constraint: .isUnique('id')
- column_name: season
  code_for_constraint: .isComplete('season')
- column_name: date
  code_for_constraint: .isComplete('date')
- column_name: date
  code_for_constraint: .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date,
    'yyyy-MM-dd') IS NOT NULL", 'parseable_iso_date')
- column_name: season
  code_for_constraint: .satisfies("year(to_date(date, 'yyyy-MM-dd')) = season", 'date_belongs_to_season')
- column_name: match_type
  code_for_constraint: .isComplete('match_type')
- column_name: team1
  code_for_constraint: .satisfies("team1 IS NOT NULL AND trim(team1) <> '' AND team1
    = trim(team1)", 'valid_team1')
- column_name: team2
  code_for_constraint: .satisfies("team2 IS NOT NULL AND trim(team2) <> '' AND team2
    = trim(team2)", 'valid_team2')
- column_name: team2
  code_for_constraint: .satisfies("team1 <> team2", 'distinct_participants')
- column_name: result
  code_for_constraint: .isComplete('result')
- column_name: result
  code_for_constraint: .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie',
    'no result')", 'supported_result')
- column_name: winner
  code_for_constraint: .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets')
    OR (winner IS NOT NULL AND winner IN (team1, team2) AND winner = trim(winner))",
    'decided_winner_is_participant')
- column_name: result_margin
  code_for_constraint: .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets')
    OR (result_margin IS NOT NULL AND result_margin >= 1 AND result_margin = floor(result_margin))",
    'decided_margin_is_positive_integer')
- column_name: result_margin
  code_for_constraint: .satisfies("lower(trim(result)) <> 'wickets' OR result_margin
    <= 10", 'wickets_margin_at_most_ten')
- column_name: super_over
  code_for_constraint: .isComplete('super_over')
- column_name: super_over
  code_for_constraint: .satisfies("(lower(trim(result)) = 'tie' AND upper(trim(super_over))
    = 'Y') OR (lower(trim(result)) <> 'tie' AND upper(trim(super_over)) = 'N')", 'super_over_matches_result')
