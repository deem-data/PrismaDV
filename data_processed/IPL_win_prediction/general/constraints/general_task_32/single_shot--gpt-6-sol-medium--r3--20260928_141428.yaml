constraints:
  date:
    code:
    - - .satisfies("to_date(`date`, 'yyyy-MM-dd') IS NOT NULL AND year(to_date(`date`,
        'yyyy-MM-dd')) = `season`", 'valid_date_matches_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("lower(trim(`result`)) IN ('runs', 'wickets', 'tie', 'no result')",
        'supported_result')
      - Valid
    assumptions: []
    column_name: result
  result,super_over:
    code:
    - - .satisfies("(lower(trim(`result`)) = 'tie' AND upper(trim(`super_over`)) =
        'Y') OR (lower(trim(`result`)) <> 'tie' AND upper(trim(`super_over`)) = 'N')",
        'super_over_matches_tie')
      - Valid
    assumptions: []
    column_name: result,super_over
  result_margin,result:
    code:
    - - .satisfies("lower(trim(`result`)) <> 'runs' OR `result_margin` >= 1", 'positive_run_margin')
      - Valid
    - - .satisfies("lower(trim(`result`)) <> 'wickets' OR `result_margin` BETWEEN
        1 AND 10", 'valid_wicket_margin')
      - Valid
    - - .satisfies("lower(trim(`result`)) NOT IN ('runs', 'wickets') OR (`result_margin`
        IS NOT NULL AND `result_margin` = floor(`result_margin`))", 'decided_margin_is_present_integer')
      - Valid
    assumptions: []
    column_name: result_margin,result
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("upper(trim(`super_over`)) IN ('Y', 'N')", 'valid_super_over_flag')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1,team2:
    code:
    - - .satisfies("`team1` <> `team2`", 'distinct_participants')
      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner,team1,team2,result:
    code:
    - - .satisfies("lower(trim(`result`)) NOT IN ('runs', 'wickets') OR (`winner`
        IS NOT NULL AND (`winner` = `team1` OR `winner` = `team2`))", 'decided_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner,team1,team2,result
