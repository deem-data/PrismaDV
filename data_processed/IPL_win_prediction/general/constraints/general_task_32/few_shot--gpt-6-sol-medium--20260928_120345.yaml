constraints:
  date:
    code:
    - - .satisfies("date IS NOT NULL AND to_date(date, 'yyyy-MM-dd') IS NOT NULL",
        'valid_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("lower(trim(result)) IN ('runs', 'wickets', 'tie', 'no result')",
        'recognized_result')
      - Valid
    assumptions: []
    column_name: result
  result, super_over:
    code:
    - - .satisfies("lower(trim(result)) <> 'tie' OR upper(trim(super_over)) = 'Y'",
        'ties_have_super_over')
      - Valid
    assumptions: []
    column_name: result, super_over
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin >= 1 AND result_margin = floor(result_margin))",
        'decided_match_has_positive_integer_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .satisfies("upper(trim(super_over)) IN ('Y', 'N')", 'recognized_super_over_flag')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (winner IS NOT
        NULL AND winner IN (team1, team2))", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
