constraints:
  date:
    code:
    - - .isComplete('date').satisfies("to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isPositive('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result').satisfies("lower(trim(result)) IN ('runs', 'wickets',
        'tie', 'no result')", 'recognized_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("lower(trim(result)) <> 'wickets' OR result_margin <= 10", 'wicket_margin_at_most_ten')
      - Valid
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (result_margin
        IS NOT NULL AND result_margin > 0 AND result_margin = floor(result_margin))",
        'decided_match_has_positive_integer_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').satisfies("upper(trim(super_over)) IN ('Y', 'N')",
        'valid_super_over_flag')
      - Valid
    - - .satisfies("lower(trim(result)) <> 'tie' OR upper(trim(super_over)) = 'Y'",
        'tie_has_super_over')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_winner:
    code:
    - - .satisfies('toss_winner IS NOT NULL AND toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("lower(trim(result)) NOT IN ('runs', 'wickets') OR (winner IS NOT
        NULL AND winner IN (team1, team2))", 'decided_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
