constraints:
  '["city","venue"]':
    code: []
    assumptions:
    - text: Each 'venue' corresponds to a specific 'city', meaning there should be
        a functional dependency where 'venue' uniquely determines 'city' (or 'city'
        should be consistently mapped for a given 'venue'). In Deequ, this consistency
        can be verified by checking that the number of distinct ('venue', 'city')
        pairs does not exceed the number of distinct 'venue' values, or via custom
        conditional rules.
      sources:
      - start_line: 138
        end_line: 141
        file: ''
      uid: 3b2cc401-6d02-4de6-95b3-cefc08b027de
  '["date","season"]':
    code: []
    assumptions:
    - text: 'The year component extracted from the ''date'' column should match the
        ''season'' column for each record. We can represent this assumption as a constraint:
        .satisfies(''YEAR(CAST(date AS DATE)) == season'', ''DateYearMatchesSeason'')'
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 138
        end_line: 141
        file: ''
      uid: 78e9de35-4e2c-4bd6-89f3-c9342a12d323
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("(`result` IN ('runs', 'wickets') AND `result_margin`
        IS NOT NULL) OR (`result` IN ('tie', 'no result') AND `result_margin` IS NULL)",
        "Result margin validity based on match result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1038c647-b17e-42e0-a06f-6bb251df7a73
      source_assumptions:
      - 4711564e-6000-4dd2-bcb8-da65b85da5b8
    assumptions:
    - text: 'When ''result'' is ''runs'' or ''wickets'', ''result_margin'' must not
        be null and should contain valid positive margin values. Conversely, when
        ''result'' is ''tie'' or ''no result'', ''result_margin'' is expected to be
        null. We could represent this assumption as a Deequ constraint like: .satisfies("(result
        IN (''runs'', ''wickets'') AND result_margin IS NOT NULL) OR (result IN (''tie'',
        ''no result'') AND result_margin IS NULL)", "Result margin validity based
        on match result")'
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      - start_line: 117
        end_line: 122
        file: ''
      uid: 4711564e-6000-4dd2-bcb8-da65b85da5b8
  '["result","super_over"]':
    code: []
    assumptions:
    - text: 'A match that has a super over (''super_over'' == ''Y'') must have its
        ''result'' recorded as ''tie'', and matches without a super over (''super_over''
        == ''N'') should have a result other than ''tie''. We could represent this
        assumption as a deequ constraint like this: .satisfies("(super_over = ''Y''
        AND result = ''tie'') OR (super_over = ''N'' AND result != ''tie'')", "Super
        over and tie consistency")'
