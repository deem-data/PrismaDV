constraints:
  date:
    code:
    - - .satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(date, 'yyyy-MM-dd')
        IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  player_of_match:
    code:
    - - .satisfies("result = 'no result' OR player_of_match IS NOT NULL", 'played_match_has_player_of_match')
      - Valid
    assumptions: []
    column_name: player_of_match
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("CASE WHEN result IN ('runs', 'wickets') THEN result_margin IS
        NOT NULL AND result_margin > 0 AND result_margin = FLOOR(result_margin) ELSE
        result_margin IS NULL END", 'margin_matches_result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies("result = 'no result' OR winner IN (team1, team2)", 'played_match_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
