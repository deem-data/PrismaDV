constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    - - .satisfies("to_date(`date`, 'yyyy-MM-dd') IS NOT NULL AND year(to_date(`date`,
        'yyyy-MM-dd')) = `season`", 'valid_date_and_season')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("(`result` IN ('tie', 'no result') AND `result_margin` IS NULL)
        OR (`result` IN ('runs', 'wickets') AND `result_margin` IS NOT NULL AND `result_margin`
        > 0 AND `result_margin` = floor(`result_margin`) AND (`result` <> 'wickets'
        OR `result_margin` <= 10))", 'margin_matches_result_and_is_integer')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("(`result` = 'tie' AND `super_over` = 'Y') OR (`result` <> 'tie'
        AND `super_over` = 'N')", 'super_over_matches_tie')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('`team1` <> `team2`', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_winner:
    code:
    - - .satisfies('`toss_winner` = `team1` OR `toss_winner` = `team2`', 'toss_winner_is_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("(`result` = 'no result' AND `winner` IS NULL) OR (`result` <>
        'no result' AND `winner` IS NOT NULL AND (`winner` = `team1` OR `winner` =
        `team2`))", 'winner_matches_result_and_teams')
      - Valid
    assumptions: []
    column_name: winner
