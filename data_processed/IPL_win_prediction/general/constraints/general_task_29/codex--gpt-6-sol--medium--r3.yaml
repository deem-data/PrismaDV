prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef compute_standings(df:\
  \ pd.DataFrame) -> pd.DataFrame:\n    played_mask = df[\"result\"] != \"no result\"\
  \n    df_played = df.loc[played_mask, [\"season_int\", \"team1\", \"team2\", \"\
  winner\", \"result\"]].copy()\n    df_played[\"loser\"] = np.where(df_played[\"\
  winner\"] == df_played[\"team1\"], df_played[\"team2\"],\n                     \
  \             df_played[\"team1\"])  # relies on winner being one of the teams\n\
  \n    wins = (\n        df_played.groupby([\"season_int\", \"winner\"]).size().rename(\"\
  wins\")\n    )\n    losses = (\n        df_played.groupby([\"season_int\", \"loser\"\
  ]).size().rename(\"losses\")\n    )\n\n    # Matches played counts both teams for\
  \ all rows\n    side_a = df[[\"season_int\", \"team1\"]].rename(columns={\"team1\"\
  : \"team\"})\n    side_b = df[[\"season_int\", \"team2\"]].rename(columns={\"team2\"\
  : \"team\"})\n    matches = (\n        pd.concat([side_a, side_b], ignore_index=True)\n\
  \        .groupby([\"season_int\", \"team\"]).size().rename(\"matches\")\n    )\n\
  \n    # No result counts both teams\n    nr = df.loc[df[\"result\"] == \"no result\"\
  , [\"season_int\", \"team1\", \"team2\"]]\n    if not nr.empty:\n        nr_flat\
  \ = pd.concat([\n            nr[[\"season_int\", \"team1\"]].rename(columns={\"\
  team1\": \"team\"}),\n            nr[[\"season_int\", \"team2\"]].rename(columns={\"\
  team2\": \"team\"}),\n        ], ignore_index=True)\n        no_result = nr_flat.groupby([\"\
  season_int\", \"team\"]).size().rename(\"no_result\")\n    else:\n        no_result\
  \ = pd.Series(dtype=\"int64\", name=\"no_result\")\n\n    # Ties (occur before super\
  \ over) count participation for both teams\n    ties = df.loc[df[\"result\"] ==\
  \ \"tie\", [\"season_int\", \"team1\", \"team2\"]]\n    if not ties.empty:\n   \
  \     ties_flat = pd.concat([\n            ties[[\"season_int\", \"team1\"]].rename(columns={\"\
  team1\": \"team\"}),\n            ties[[\"season_int\", \"team2\"]].rename(columns={\"\
  team2\": \"team\"}),\n        ], ignore_index=True)\n        ties_count = ties_flat.groupby([\"\
  season_int\", \"team\"]).size().rename(\"ties\")\n    else:\n        ties_count\
  \ = pd.Series(dtype=\"int64\", name=\"ties\")\n\n    # Assemble standings\n    standings\
  \ = (\n        pd.concat([matches, wins, losses, no_result, ties_count], axis=1)\n\
  \        .fillna(0)\n        .reset_index()\n        .rename(columns={\"winner\"\
  : \"team\"})\n    )\n    # wins and losses currently keyed by team value under their\
  \ respective Series index names\n    # After concat, columns names remain aligned\n\
  \n    # Ensure integer types for counts\n    for col in [\"matches\", \"wins\",\
  \ \"losses\", \"no_result\", \"ties\"]:\n        if col in standings.columns:\n\
  \            standings[col] = standings[col].astype(int)\n        else:\n      \
  \      standings[col] = 0\n\n    standings[\"points\"] = standings[\"wins\"] * 2\
  \ + standings[\"no_result\"] * 1\n\n    # Sort within season\n    standings = standings.sort_values([\"\
  season_int\", \"points\", \"wins\"], ascending=[True, False, False]).reset_index(\n\
  \        drop=True)\n    return standings\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input,\
  \ 'new_data.csv')\n    os.makedirs(args.output, exist_ok=True)\n\n    df = pd.read_csv(input_csv)\n\
  \n    # Normalize dtypes used downstream\n    df[\"date_dt\"] = pd.to_datetime(df[\"\
  date\"], errors=\"coerce\")\n    df[\"season_int\"] = pd.to_numeric(df[\"season\"\
  ], errors=\"coerce\").astype(\"Int64\")\n    # Guard winner semantics before computing\
  \ loser and points\n    mask_played = df[\"result\"] != \"no result\"\n    # Result\
  \ margin semantics used for KPI calculations\n    mask_runs = df[\"result\"] ==\
  \ \"runs\"\n    mask_wkts = df[\"result\"] == \"wickets\"\n    mask_tie_or_no =\
  \ df[\"result\"].isin([\"tie\", \"no result\"])  # used to ensure null margins\n\
  \    # Safe integer margins after checks\n    df[\"margin_int\"] = df[\"result_margin\"\
  ].where(mask_runs | mask_wkts).astype(\"Int64\")\n    # Standings per season\n \
  \   standings = compute_standings(df)\n    standings.to_csv(os.path.join(args.output,\
  \ 'standings.csv'), index=False)\n\n    # Player of the Match leaderboards (top\
  \ 10 per season)\n    pom = df[[\"season_int\", \"player_of_match\"]].dropna()\n\
  \    pom_counts = pom.groupby([\"season_int\", \"player_of_match\"]).size().rename(\"\
  awards\").reset_index()\n    pom_counts = pom_counts.sort_values([\"season_int\"\
  , \"awards\"], ascending=[True, False])\n    pom_counts[\"rank\"] = pom_counts.groupby(\"\
  season_int\")[\"awards\"].rank(method=\"first\", ascending=False).astype(int)\n\
  \    top_pom = pom_counts.loc[pom_counts[\"rank\"] <= 10]\n    top_pom.to_csv(os.path.join(args.output,\
  \ 'leaderboard_player_of_match.csv'), index=False)\n\n    # Broadcast KPIs per season\n\
  \    played = df[df[\"result\"] != \"no result\"].copy()\n    played[\"toss_win_and_match_win\"\
  ] = (played[\"toss_winner\"] == played[\"winner\"]).astype(int)\n    toss_win_rate\
  \ = (\n        played.groupby(\"season_int\")[\"toss_win_and_match_win\"].mean().rename(\"\
  toss_win_match_win_rate\")\n    )\n\n    avg_margin_runs = (\n        df.loc[mask_runs].groupby(\"\
  season_int\")[\"margin_int\"].mean().rename(\"avg_margin_runs\")\n    )\n    avg_margin_wkts\
  \ = (\n        df.loc[mask_wkts].groupby(\"season_int\")[\"margin_int\"].mean().rename(\"\
  avg_margin_wickets\")\n    )\n    super_over_counts = df.loc[df[\"super_over\"]\
  \ == \"Y\"].groupby(\"season_int\").size().rename(\"super_over_matches\")\n    tie_counts\
  \ = df.loc[df[\"result\"] == \"tie\"].groupby(\"season_int\").size().rename(\"ties\"\
  )\n\n    kpis = pd.concat([toss_win_rate, avg_margin_runs, avg_margin_wkts, super_over_counts,\
  \ tie_counts], axis=1).fillna(0)\n    # Ensure numeric types\n    for col in [\"\
  toss_win_match_win_rate\", \"avg_margin_runs\", \"avg_margin_wickets\"]:\n     \
  \   if col in kpis.columns:\n            kpis[col] = kpis[col].astype(float)\n \
  \   for col in [\"super_over_matches\", \"ties\"]:\n        if col in kpis.columns:\n\
  \            kpis[col] = kpis[col].astype(int)\n\n    kpis.reset_index().to_csv(os.path.join(args.output,\
  \ 'broadcast_kpis_by_season.csv'), index=False)\n\n    # Super over matches detail\
  \ for editorial\n    super_over_detail = df.loc[df[\"super_over\"] == \"Y\", [\n\
  \        \"id\", \"season_int\", \"date\", \"team1\", \"team2\", \"winner\", \"\
  player_of_match\", \"city\", \"venue\"\n    ]].sort_values([\"season_int\", \"date\"\
  ])\n    super_over_detail.to_csv(os.path.join(args.output, 'super_over_matches.csv'),\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_29.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 364, 'season': 2011, 'city': 'Mumbai', 'date': '2011-05-02', 'match_type': 'League',\
  \ 'player_of_match': 'KA Pollard', 'venue': 'Wankhede Stadium', 'team1': 'Mumbai\
  \ Indians', 'team2': 'Kings XI Punjab', 'toss_winner': 'Kings XI Punjab', 'toss_decision':\
  \ 'field', 'winner': 'Mumbai Indians', 'result': 'runs', 'result_margin': 23.0,\
  \ 'target_runs': 160.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan,\
  \ 'umpire1': 'HDPK Dharmasena', 'umpire2': 'PR Reiffel'}, {'id': 264, 'season':\
  \ 2009, 'city': 'Johannesburg', 'date': '2009-05-17', 'match_type': 'League', 'player_of_match':\
  \ 'Yuvraj Singh', 'venue': 'New Wanderers Stadium', 'team1': 'Deccan Chargers',\
  \ 'team2': 'Kings XI Punjab', 'toss_winner': 'Deccan Chargers', 'toss_decision':\
  \ 'field', 'winner': 'Kings XI Punjab', 'result': 'runs', 'result_margin': 1.0,\
  \ 'target_runs': 135.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan,\
  \ 'umpire1': 'S Ravi', 'umpire2': 'RB Tiffin'}, {'id': 394, 'season': 2023, 'city':\
  \ 'Chandigarh', 'date': '2023-05-03', 'match_type': 'League', 'player_of_match':\
  \ 'Ishan Kishan', 'venue': 'Punjab Cricket Association IS Bindra Stadium, Mohali,\
  \ Chandigarh', 'team1': 'Punjab Kings', 'team2': 'Mumbai Indians', 'toss_winner':\
  \ 'Mumbai Indians', 'toss_decision': 'field', 'winner': 'Mumbai Indians', 'result':\
