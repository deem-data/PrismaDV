prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["city","venue"]':
    code:
    - suggestion: .satisfies("CASE WHEN `super_over` = 'Y' THEN `city` IS NOT NULL
        AND `venue` IS NOT NULL ELSE TRUE END", "super_over_location_complete")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 86144180-9bc8-48c7-ade4-f7c56b112340
      source_assumptions:
      - bd876c84-b9a4-4035-89d0-b3c32f98a2e7
    assumptions:
    - text: For matches included in the super-over detail export, 'city' and 'venue'
        should both be non-null so each exported match has a complete location. Because
        'city' is not complete in the full dataset, this requirement applies only
        where 'super_over' = 'Y'.
      sources:
      - start_line: 138
        end_line: 141
        file: ''
      uid: bd876c84-b9a4-4035-89d0-b3c32f98a2e7
    - text: "A given non-null 'venue' should be associated with at most one non-null\
        \ 'city' across records. This keeps the city\u2013venue locations reported\
        \ in the super-over detail consistent; rows with a missing city should be\
        \ excluded from this consistency check."
      sources:
      - start_line: 138
        end_line: 141
        file: ''
      uid: e939ecb8-396d-4428-8108-70c94564b0af
  '["date","season"]':
    code:
    - suggestion: .satisfies('to_date(`date`) IS NOT NULL AND `season` IS NOT NULL
        AND year(to_date(`date`)) = `season`', 'date_year_matches_season')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 074330a4-a708-484c-aeb0-06f902890522
      source_assumptions:
      - 4dc46318-1a18-4ac9-8330-ef1360bf612e
    - suggestion: .satisfies("`date` RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND to_date(`date`)
        IS NOT NULL", 'date_uses_chronologically_sortable_iso_format')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9d626035-4872-4125-9332-f1e27fb728f0
      source_assumptions:
      - 7b839215-149d-4298-b803-e3b95b483475
    assumptions:
    - text: Each match's 'date' should be a valid date whose calendar year equals
        its numeric 'season'. Otherwise, the match could be grouped under the wrong
        season. This can be checked with a constraint equivalent to `to_date(date)
        IS NOT NULL AND year(to_date(date)) = season`.
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 99
        end_line: 99
        file: ''
      - start_line: 138
        end_line: 140
        file: ''
      uid: 4dc46318-1a18-4ac9-8330-ef1360bf612e
    - text: For matches in the same 'season', the string representation of 'date'
        should sort in chronological order, as the super-over detail is sorted by
        'season_int' and the original string 'date'. A consistent ISO format such
        as YYYY-MM-DD would satisfy this assumption.
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 138
        end_line: 140
        file: ''
      uid: 7b839215-149d-4298-b803-e3b95b483475
  '["player_of_match","result","winner"]':
    code:
    - suggestion: '.satisfies("`result` = ''no result'' OR (`winner` IS NOT NULL AND
        (`winner` = `team1` OR `winner` = `team2`))", "played_match_winner_is_participating_team",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7da4e75b-967a-4cf7-9247-e9fa6ac8e3eb
      source_assumptions:
      - f73b5b0e-224c-47b2-9057-ea23242ae9e1
    - suggestion: '.satisfies("`result` <> ''no result'' OR `winner` IS NULL", "no_result_has_no_winner",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ff6ca064-f908-413b-a4ad-84c41e4e5598
      source_assumptions:
      - e2536845-70fc-4406-a751-22d13c2f2d62
    - suggestion: '.satisfies("`result` = ''no result'' OR `player_of_match` IS NOT
        NULL", "played_match_has_player_of_match", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c1fd14c8-ce15-4cad-aeaa-f34475afe01f
      source_assumptions:
      - e61e0c38-021c-4d5c-a958-db63a87453b0
    assumptions:
    - text: For every match whose 'result' is not 'no result', 'winner' must be non-null
        and equal to either 'team1' or 'team2'. The standings code otherwise assigns
        a loss to the wrong team or omits a win. This includes matches recorded as
        'tie', which the code includes in played matches.
      sources:
      - start_line: 9
        end_line: 18
        file: ''
      - start_line: 90
        end_line: 91
        file: ''
      uid: 66b00f02-dff9-4343-895a-8476e1dd883f
    - text: 'When ''result'' is ''no result'', ''winner'' should be null: these matches
        are counted for both teams as no-results, not as wins or losses.'
      sources:
      - start_line: 9
        end_line: 18
        file: ''
      - start_line: 29
        end_line: 36
        file: ''
      uid: f73b5b0e-224c-47b2-9057-ea23242ae9e1
    - text: For matches with a result other than 'no result', 'player_of_match' should
        be non-null; otherwise that match is silently excluded from the player-of-the-match
        leaderboard. For a 'no result' match, a null 'player_of_match' is permitted.
      sources:
      - start_line: 102
        end_line: 108
        file: ''
      uid: e2536845-70fc-4406-a751-22d13c2f2d62
    - text: When 'result' is 'runs' or 'wickets', 'result_margin' should be present
        and convertible to an integer. When 'result' is 'tie' or 'no result', 'result_margin'
        should be null, since those rows have no applicable runs-or-wickets margin.
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      - start_line: 117
        end_line: 122
        file: ''
      uid: e61e0c38-021c-4d5c-a958-db63a87453b0
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR `result_margin`
        IS NOT NULL", "winning results have margins")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 63f5d106-64a2-42e8-b6ff-c72fb0ef903f
      source_assumptions:
      - 8e4b0a3a-a079-40ee-8300-76a07a1d6270
    - suggestion: .satisfies("`result` NOT IN ('tie', 'no result') OR `result_margin`
        IS NULL", "ties and no-results have no margin")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 27e76e3a-64ea-42f6-bd82-7cacd6caf95d
      source_assumptions:
      - 7632d5fa-2a8e-436e-bf4b-c3b01aef7894
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR `result_margin`
        IS NULL OR `result_margin` = FLOOR(`result_margin`)", "winning margins are
        whole numbers")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: ae259831-c2bb-41c0-895d-f70d40d8aa9f
      source_assumptions:
      - 7fcab053-993c-4c60-a0ee-0e32dd6c085d
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`result_margin`
        > 0 AND (`result` <> 'wickets' OR `result_margin` <= 10))", "winning margins
        are within valid range")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1126f0a0-12b9-434d-a96e-f5332aa09074
      source_assumptions:
      - 7fcab053-993c-4c60-a0ee-0e32dd6c085d
    assumptions:
    - text: 'Rows with result ''runs'' or ''wickets'' should have a non-null result_margin,
        so the seasonal average winning margins are calculated from recorded margins
        rather than silently omitting matches. Deequ: .satisfies("result NOT IN (''runs'',
        ''wickets'') OR result_margin IS NOT NULL", "winning results have margins")'
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      - start_line: 117
        end_line: 121
        file: ''
      uid: 8e4b0a3a-a079-40ee-8300-76a07a1d6270
    - text: 'Rows with result ''tie'' or ''no result'' should have a null result_margin;
        neither outcome has a winning margin. Deequ: .satisfies("result NOT IN (''tie'',
        ''no result'') OR result_margin IS NULL", "ties and no-results have no margin")'
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      uid: 7632d5fa-2a8e-436e-bf4b-c3b01aef7894
    - text: 'For results of ''runs'' or ''wickets'', result_margin should be a positive
        whole number so it can be converted to nullable integer margin_int and interpreted
        as a winning margin. For ''wickets'', it should also be at most 10. Deequ:
        .satisfies("result NOT IN (''runs'', ''wickets'') OR (result_margin > 0 AND
        result_margin = FLOOR(result_margin) AND (result <> ''wickets'' OR result_margin
        <= 10))", "valid winning margins")'
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      - start_line: 117
        end_line: 121
        file: ''
      uid: 7fcab053-993c-4c60-a0ee-0e32dd6c085d
  '["result","super_over"]':
    code:
    - suggestion: '.satisfies("(`result` = ''tie'' AND `super_over` = ''Y'') OR (`result`
