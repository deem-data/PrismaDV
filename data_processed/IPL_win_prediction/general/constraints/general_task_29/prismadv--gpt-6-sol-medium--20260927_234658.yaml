        (result IN ('runs', 'wickets', 'no result') AND super_over = 'N')", "result_super_over_consistency")`.
      sources:
      - start_line: 123
        end_line: 126
        file: ''
      - start_line: 138
        end_line: 140
        file: ''
      uid: 0fc6c256-9328-439c-9034-0706b10698f7
