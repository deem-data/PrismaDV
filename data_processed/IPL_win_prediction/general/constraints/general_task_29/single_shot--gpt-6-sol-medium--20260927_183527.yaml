constraints:
  date:
    code:
    - - .isComplete('date').satisfies("date RLIKE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' AND
        to_date(date, 'yyyy-MM-dd') IS NOT NULL", 'valid_match_date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id').isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (result_margin IS NOT NULL
        AND result_margin > 0 AND result_margin = FLOOR(result_margin) AND (result
        <> 'wickets' OR result_margin <= 10))", 'valid_numeric_win_margin').satisfies("result
        IN ('runs', 'wickets') OR result_margin IS NULL", 'no_margin_for_ties_or_no_result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over').isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2').satisfies("team1 <> team2 AND trim(team1) <> '' AND trim(team2)
        <> ''", 'distinct_nonempty_teams')
      - Valid
    assumptions: []
    column_name: team2
  toss_winner:
    code:
    - - .isComplete('toss_winner').satisfies('toss_winner IN (team1, team2)', 'toss_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("result = 'no result' OR (winner IS NOT NULL AND winner IN (team1,
        team2))", 'played_match_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: winner
