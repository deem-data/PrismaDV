constraints:
  date:
    code:
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("CASE WHEN `result` IN ('runs', 'wickets') THEN `result_margin`
        IS NOT NULL AND `result_margin` > 0 AND `result_margin` = FLOOR(`result_margin`)
        ELSE TRUE END", 'played_result_has_positive_integer_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('`team1` <> `team2`', 'distinct_opponents')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_winner:
    code:
    - - .satisfies('`toss_winner` IN (`team1`, `team2`)', 'toss_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("`result` = 'no result' OR `winner` IN (`team1`, `team2`)", 'played_match_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: winner
