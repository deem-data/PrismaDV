    - text: For super-over match details, a venue should be associated with no more
        than one non-null city. Missing city values are allowed, but conflicting city
        values for the same venue would make the exported location details inconsistent.
        Validate that grouping rows where super_over = 'Y' and city is not null by
        venue yields COUNT(DISTINCT city) <= 1 for every venue.
      sources:
      - start_line: 138
        end_line: 141
        file: ''
      uid: b04e16fc-f5a2-466e-8cb4-f2b694151785
  '["date","id","season","team1","team2"]':
