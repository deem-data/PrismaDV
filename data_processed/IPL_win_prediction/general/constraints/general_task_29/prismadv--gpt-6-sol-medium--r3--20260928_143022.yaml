      reason_if_invalid: ''
      level: warning
      uid: 60207233-6086-4488-bffc-b9bab21fd872
      source_assumptions:
      - 8467b30e-4992-4ece-8af8-21591696dcc6
    assumptions:
    - text: 'Each match must involve two different teams: ''team1'' != ''team2''.
        Otherwise, the standings code counts the same team twice for one match. This
        can be checked with a row-level constraint such as .satisfies(''team1 <> team2'',
        ''distinct_match_teams'').'
      sources:
      - start_line: 22
        end_line: 26
        file: ''
      - start_line: 30
        end_line: 47
        file: ''
      uid: 2620f3dd-0391-434d-8528-cef224397cd0
    - text: For every row where 'result' is not 'no result', 'winner' must equal either
        'team1' or 'team2'. Otherwise, the code assigns a loss to a team that may
        not have lost. This can be checked with .satisfies("result = 'no result' OR
        winner = team1 OR winner = team2", 'winner_is_participant').
      sources:
      - start_line: 9
        end_line: 18
        file: ''
      uid: 390bf0e0-e516-4467-b7fd-380c63e61a30
    - text: For matches included in the toss-win KPI, 'toss_winner' must equal either
        'team1' or 'team2'; otherwise the comparison with 'winner' can silently record
        an invalid toss winner as a non-match. This can be checked with .satisfies("result
        = 'no result' OR toss_winner = team1 OR toss_winner = team2", 'toss_winner_is_participant').
      sources:
      - start_line: 111
        end_line: 114
        file: ''
      uid: 91f98b7c-5400-4c4e-824f-a70da3d40b93
    - text: The calendar year parsed from 'date' should equal the integral 'season'
        for each match. The code reports and sorts matches by season while displaying
        the original date. A row-level constraint can check that the date parses and
        year(date) = season.
      sources:
      - start_line: 88
        end_line: 89
        file: ''
      - start_line: 138
        end_line: 140
        file: ''
      uid: 8467b30e-4992-4ece-8af8-21591696dcc6
    - text: Rows with the same 'id' should agree on 'season', 'date', 'team1', and
        'team2', because the super-over detail presents 'id' as the match identifier
        alongside those fields. This is a functional-dependency constraint from 'id'
