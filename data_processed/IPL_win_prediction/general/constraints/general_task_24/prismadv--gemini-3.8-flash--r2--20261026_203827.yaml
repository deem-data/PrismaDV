        end_line: 111
        file: ''
      uid: 72bc8ffa-51ac-4c31-9215-21bdff1091a0
    - text: 'For each match, ''team1'' and ''team2'' must be distinct (''team1 !=
        team2''). The logic for determining the loser (''loser = t2 if winner == t1
        else t1'') and calculating wins and losses assumes that the two opposing teams
