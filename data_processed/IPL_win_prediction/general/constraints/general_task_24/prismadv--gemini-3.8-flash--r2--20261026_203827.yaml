        end_line: 44
        file: ''
      uid: 0116cbb4-b2b0-47ca-9a2a-59f2b4c79ef1
  '["result","team1","team2","winner"]':
    code:
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets') OR (`winner` IS
        NOT NULL AND (`winner` = `team1` OR `winner` = `team2`))", "winner_is_team1_or_team2_for_decisive_matches")
