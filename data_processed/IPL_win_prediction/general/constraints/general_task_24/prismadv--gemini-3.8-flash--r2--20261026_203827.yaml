      source_assumptions:
      - 1f921006-fa4e-4ec3-b3cd-a56381424e39
    assumptions:
    - text: 'When ''result'' is either ''runs'' or ''wickets'', the ''winner'' must
        not be null and must be equal to either ''team1'' or ''team2''. The downstream
        code determines wins, losses, and points by checking whether ''winner == team1''
        or ''winner == team2''. If ''winner'' does not match either team, neither
        team is credited with a win or loss. We could represent this assumption as
        a Deequ constraint: .satisfies("result NOT IN (''runs'', ''wickets'') OR (winner
        IS NOT NULL AND (winner = team1 OR winner = team2))", "winner_is_team1_or_team2_for_decisive_matches")'
      sources:
