prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.8-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["result","result_margin","target_runs"]':
    code: []
    assumptions:
    - text: 'When the match ''result'' is ''runs'', ''result_margin'' must not be
        null because it is directly subtracted from the first innings runs to compute
        second innings runs. We could represent this assumption as a Deequ constraint
        like this: .satisfies("result != ''runs'' OR result_margin IS NOT NULL", "result_margin
        must not be null when result is runs")'
      sources:
      - start_line: 43
        end_line: 44
        file: ''
      uid: 2f0d72f6-47ee-44fa-ac8c-d45872d069e9
    - text: 'When ''result'' is ''runs'', ''target_runs'' must be strictly greater
        than ''result_margin'' (i.e., target_runs - 1 >= result_margin) so that the
        calculated runs scored by the chasing team (first_runs - result_margin) is
        non-negative. We could represent this assumption as a Deequ constraint like
        this: .satisfies("result != ''runs'' OR (target_runs IS NOT NULL AND result_margin
        IS NOT NULL AND target_runs > result_margin)", "target_runs must be greater
        than result_margin when result is runs")'
      sources:
      - start_line: 41
        end_line: 41
        file: ''
      - start_line: 43
        end_line: 44
        file: ''
      uid: 13ea6941-d131-4986-aac0-41a9a753a38c
    - text: 'When ''result'' is ''runs'', ''wickets'', or ''tie'', ''target_runs''
        must not be null so that first_runs and second_runs can be derived for calculating
        team runs and Net Run Rate (NRR). We could represent this assumption as a
        Deequ constraint like this: .satisfies("result NOT IN (''runs'', ''wickets'',
        ''tie'') OR target_runs IS NOT NULL", "target_runs must not be null for completed
        matches")'
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: 4af9f001-88c6-4de4-a148-2056cee6a423
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` != 'runs' OR (`result_margin` IS NOT NULL AND
        `result_margin` > 0)", "result_margin_positive_when_runs")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a77dc284-364f-4392-b888-5a5a89717546
      source_assumptions:
