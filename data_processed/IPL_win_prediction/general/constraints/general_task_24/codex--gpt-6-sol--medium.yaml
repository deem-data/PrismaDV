          'no result')", 'recognized league result')
        - Valid
      assumptions: []
      column_name: result
    result_margin:
      code:
      - - .satisfies("CASE WHEN match_type = 'League' AND result = 'runs' THEN result_margin
          IS NOT NULL AND CAST(result_margin AS DOUBLE) >= 1 AND CAST(result_margin
          AS DOUBLE) = FLOOR(CAST(result_margin AS DOUBLE)) AND CAST(result_margin
          AS DOUBLE) < CAST(target_runs AS DOUBLE) ELSE TRUE END", 'runs margin yields
          nonnegative second innings')
        - Valid
      assumptions: []
      column_name: result_margin
    season:
      code:
      - - .isComplete('season')
        - Valid
      - - .satisfies('CAST(season AS DOUBLE) = FLOOR(CAST(season AS DOUBLE))', 'season
          is an integer')
        - Valid
      assumptions: []
      column_name: season
    target_overs:
      code:
      - - .satisfies("CASE WHEN match_type = 'League' AND result IN ('runs', 'wickets',
          'tie') THEN target_overs IS NOT NULL AND CAST(target_overs AS DOUBLE) >
          0 AND CAST(target_overs AS DOUBLE) <= 20 ELSE TRUE END", 'scored match has
          valid overs for NRR')
        - Valid
      assumptions: []
      column_name: target_overs
    target_runs:
      code:
      - - .satisfies("CASE WHEN match_type = 'League' AND result IN ('runs', 'wickets',
          'tie') THEN target_runs IS NOT NULL AND CAST(target_runs AS DOUBLE) >= 1
          AND CAST(target_runs AS DOUBLE) = FLOOR(CAST(target_runs AS DOUBLE)) ELSE
          TRUE END", 'scored match has an integral positive target')
        - Valid
      assumptions: []
      column_name: target_runs
    team1:
      code:
      - - .isComplete('team1')
        - Valid
      assumptions: []
      column_name: team1
    team2:
      code:
      - - .isComplete('team2')
        - Valid
      - - .satisfies("match_type <> 'League' OR team1 <> team2", 'distinct league
          teams')
        - Valid
      assumptions: []
      column_name: team2
    winner:
      code:
      - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets')
          OR (winner IS NOT NULL AND winner IN (team1, team2))", 'decisive match winner
          is a participating team')
        - Valid
      assumptions: []
      column_name: winner
