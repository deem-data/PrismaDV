prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\ndf = pd.read_csv(\n    input_csv,\n    na_values=['', 'NA', 'NaN',\
  \ 'null', 'NULL', 'NullValue']\n)\n\nif not os.path.exists(args.output):\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n# Focus on league-stage standings\nif 'match_type' in df.columns:\n\
  \    df = df[df['match_type'] == 'League'].copy()\nelse:\n    df = df.copy()\n\n\
  # Normalize types\nif 'target_runs' in df.columns:\n    df['target_runs'] = pd.to_numeric(df['target_runs'],\
  \ errors='coerce')\nif 'result_margin' in df.columns:\n    df['result_margin'] =\
  \ pd.to_numeric(df['result_margin'], errors='coerce')\nif 'target_overs' in df.columns:\n\
  \    df['target_overs'] = pd.to_numeric(df['target_overs'], errors='coerce')\n#\
  \ Use season as integer for grouping\ndf['season'] = pd.to_numeric(df['season'],\
  \ errors='raise').astype(int)\n\n# Fill missing target_overs with 20.0 for stable\
  \ NRR calculation\ndf['target_overs'] = df['target_overs'].fillna(20.0)\n\n# Derive\
  \ first and second innings runs based on target and result semantics\nfirst_runs\
  \ = (df['target_runs'] - 1).astype(float)\nsecond_runs = pd.Series(index=df.index,\
  \ dtype='float64')\nsecond_runs.loc[df['result'] == 'runs'] = first_runs.loc[df['result']\
  \ == 'runs'] - df.loc[\n    df['result'] == 'runs', 'result_margin']\nsecond_runs.loc[df['result']\
  \ == 'wickets'] = first_runs.loc[df['result'] == 'wickets'] + 1.0\nsecond_runs.loc[df['result']\
  \ == 'tie'] = first_runs.loc[df['result'] == 'tie']\n# For no result, keep NaN to\
  \ avoid affecting NRR\n\novers = df['target_overs'].astype(float)\n\nrecords = []\n\
  for i, row in df.iterrows():\n    season = int(row['season'])\n    t1 = row['team1']\n\
  \    t2 = row['team2']\n    res = row['result']\n    ov = float(row['target_overs'])\
  \ if pd.notna(row['target_overs']) else 20.0\n    fr = float(first_runs.loc[i])\
  \ if pd.notna(first_runs.loc[i]) else np.nan\n    sr = float(second_runs.loc[i])\
  \ if pd.notna(second_runs.loc[i]) else np.nan\n\n    if res == 'no result':\n  \
  \      records.append({\n            'season': season, 'team': t1, 'matches': 1,\
  \ 'wins': 0, 'losses': 0, 'ties': 0, 'no_results': 1,\n            'points': 1,\
  \ 'runs_for': 0.0, 'overs_for': 0.0, 'runs_against': 0.0, 'overs_against': 0.0\n\
  \        })\n        records.append({\n            'season': season, 'team': t2,\
  \ 'matches': 1, 'wins': 0, 'losses': 0, 'ties': 0, 'no_results': 1,\n          \
  \  'points': 1, 'runs_for': 0.0, 'overs_for': 0.0, 'runs_against': 0.0, 'overs_against':\
  \ 0.0\n        })\n    elif res == 'tie':\n        records.append({\n          \
  \  'season': season, 'team': t1, 'matches': 1, 'wins': 0, 'losses': 0, 'ties': 1,\
  \ 'no_results': 0,\n            'points': 1, 'runs_for': fr, 'overs_for': ov, 'runs_against':\
  \ sr, 'overs_against': ov\n        })\n        records.append({\n            'season':\
  \ season, 'team': t2, 'matches': 1, 'wins': 0, 'losses': 0, 'ties': 1, 'no_results':\
  \ 0,\n            'points': 1, 'runs_for': sr, 'overs_for': ov, 'runs_against':\
  \ fr, 'overs_against': ov\n        })\n    elif res in ('runs', 'wickets'):\n  \
  \      winner = row['winner']\n        loser = t2 if winner == t1 else t1\n    \
  \    # Team1 perspective\n        records.append({\n            'season': season,\n\
  \            'team': t1,\n            'matches': 1,\n            'wins': 1 if winner\
  \ == t1 else 0,\n            'losses': 1 if winner == t2 else 0,\n            'ties':\
  \ 0,\n            'no_results': 0,\n            'points': 2 if winner == t1 else\
  \ 0,\n            'runs_for': fr,\n            'overs_for': ov,\n            'runs_against':\
  \ sr,\n            'overs_against': ov\n        })\n        # Team2 perspective\n\
  \        records.append({\n            'season': season,\n            'team': t2,\n\
  \            'matches': 1,\n            'wins': 1 if winner == t2 else 0,\n    \
  \        'losses': 1 if winner == t1 else 0,\n            'ties': 0,\n         \
  \   'no_results': 0,\n            'points': 2 if winner == t2 else 0,\n        \
  \    'runs_for': sr,\n            'overs_for': ov,\n            'runs_against':\
  \ fr,\n            'overs_against': ov\n        })\n    else:\n        continue\n\
  \nstandings_raw = pd.DataFrame.from_records(records)\nif standings_raw.empty:\n\
  \    # Write empty standings file if no league matches\n    out_path = os.path.join(args.output,\
  \ 'standings.csv')\n    pd.DataFrame(\n        columns=['season', 'team', 'matches',\
  \ 'wins', 'losses', 'ties', 'no_results', 'points', 'nrr', 'runs_for',\n       \
  \          'overs_for', 'runs_against', 'overs_against']).to_csv(out_path, index=False)\n\
  else:\n    agg = standings_raw.groupby(['season', 'team'], as_index=False).agg({\n\
  \        'matches': 'sum',\n        'wins': 'sum',\n        'losses': 'sum',\n \
  \       'ties': 'sum',\n        'no_results': 'sum',\n        'points': 'sum',\n\
  \        'runs_for': 'sum',\n        'overs_for': 'sum',\n        'runs_against':\
  \ 'sum',\n        'overs_against': 'sum'\n    })\n\n    # Compute NRR safely\n \
  \   scored_rate = np.where(agg['overs_for'] > 0, agg['runs_for'] / agg['overs_for'],\
  \ 0.0)\n    conceded_rate = np.where(agg['overs_against'] > 0, agg['runs_against']\
  \ / agg['overs_against'], 0.0)\n    nrr = scored_rate - conceded_rate\n    agg['nrr']\
  \ = np.round(nrr, 3)\n\n    agg = agg[\n        ['season', 'team', 'matches', 'wins',\
  \ 'losses', 'ties', 'no_results', 'points', 'nrr', 'runs_for', 'overs_for',\n  \
  \       'runs_against', 'overs_against']]\n\n    agg = agg.sort_values(by=['season',\
  \ 'points', 'nrr', 'wins', 'team'], ascending=[True, False, False, False, True])\n\
  \n    out_path = os.path.join(args.output, 'standings.csv')\n    agg.to_csv(out_path,\
  \ index=False)\n\n```\n\nThe same program is on disk at `./code/general_task_24.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 388, 'season': 2013, 'city': 'Jaipur',\
  \ 'date': '2013-04-14', 'match_type': 'League', 'player_of_match': 'JP Faulkner',\
  \ 'venue': 'Sawai Mansingh Stadium', 'team1': 'Rajasthan Royals', 'team2': 'Kings\
  \ XI Punjab', 'toss_winner': 'Rajasthan Royals', 'toss_decision': 'field', 'winner':\
  \ 'Rajasthan Royals', 'result': 'wickets', 'result_margin': 6.0, 'target_runs':\
  \ 125.0, 'target_overs': 20.0, 'super_over': 'N', 'method': nan, 'umpire1': 'Aleem\
  \ Dar', 'umpire2': 'C Shamshuddin'}, {'id': 390, 'season': 2022, 'city': 'Pune',\
  \ 'date': '2022-03-29', 'match_type': 'League', 'player_of_match': 'SV Samson',\
  \ 'venue': 'Maharashtra Cricket Association Stadium, Pune', 'team1': 'Rajasthan\
  \ Royals', 'team2': 'Sunrisers Hyderabad', 'toss_winner': 'Sunrisers Hyderabad',\
  \ 'toss_decision': 'field', 'winner': 'Rajasthan Royals', 'result': 'runs', 'result_margin':\
  \ 61.0, 'target_runs': 211.0, 'target_overs': 20.0, 'super_over': 'N', 'method':\
  \ nan, 'umpire1': 'BNJ Oxenford', 'umpire2': 'UV Gandhe'}, {'id': 249, 'season':\
  \ 2019, 'city': 'Delhi', 'date': '2019-03-30', 'match_type': 'League', 'player_of_match':\
  \ 'PP Shaw', 'venue': 'Arun Jaitley Stadium', 'team1': 'Kolkata Knight Riders',\
  \ 'team2': 'Delhi Capitals', 'toss_winner': 'Delhi Capitals', 'toss_decision': 'field',\
  \ 'winner': 'Delhi Capitals', 'result': 'tie', 'result_margin': nan, 'target_runs':\
  \ 186.0, 'target_overs': 20.0, 'super_over': 'Y', 'method': nan, 'umpire1': 'AY\
  \ Dandekar', 'umpire2': 'Nitin Menon'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
