    assumptions:
    - text: 'When ''result'' is ''runs'', ''result_margin'' should be less than ''target_runs''
        (specifically, ''result_margin'' <= ''target_runs'' - 1) so that the derived
        second innings runs (''second_runs = first_runs - result_margin'') is non-negative.
        This can be expressed as a Deequ constraint: .satisfies("result != ''runs''
        OR (target_runs IS NOT NULL AND result_margin IS NOT NULL AND target_runs
        > result_margin)", "target_runs_greater_than_result_margin_when_result_is_runs")'
      sources:
      - start_line: 41
        end_line: 44
        file: ''
      uid: a212e086-7937-4dfb-9827-f732f61b2723
    - text: 'When ''result'' is ''runs'', both ''result_margin'' and ''target_runs''
        should not be null, as both values are required to compute ''second_runs''.
        This can be expressed as a Deequ constraint: .satisfies("result != ''runs''
        OR (result_margin IS NOT NULL AND target_runs IS NOT NULL)", "result_margin_and_target_runs_not_null_when_result_is_runs")'
      sources:
      - start_line: 41
        end_line: 44
        file: ''
      uid: 723d7479-e5c6-4a6f-91c4-816e1415cbde
    - text: 'When ''result'' is one of (''runs'', ''wickets'', ''tie''), ''target_runs''
        should not be null because ''first_runs'' is derived as ''target_runs - 1''
        and subsequently used to calculate team runs and net run rate. This can be
        expressed as a Deequ constraint: .satisfies("result NOT IN (''runs'', ''wickets'',
        ''tie'') OR target_runs IS NOT NULL", "target_runs_not_null_for_decided_matches")'
      sources:
