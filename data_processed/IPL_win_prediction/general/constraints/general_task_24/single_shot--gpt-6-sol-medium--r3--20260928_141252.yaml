constraints:
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("match_type <> 'League' OR result IN ('runs', 'wickets', 'tie',
        'no result')", 'valid_league_result')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (result_margin IS
        NOT NULL AND result_margin > 0 AND result_margin <= target_runs - 1)", 'runs_result_has_valid_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .satisfies("match_type <> 'League' OR (season IS NOT NULL AND season > 0)",
        'valid_league_season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR target_overs IS NULL OR target_overs
        > 0", 'league_target_overs_positive_if_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR (target_runs
        IS NOT NULL AND target_runs >= 1)", 'played_match_has_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .satisfies("match_type <> 'League' OR (team1 IS NOT NULL AND team2 IS NOT
        NULL AND team1 <> team2)", 'valid_league_teams')
      - Valid
    assumptions: []
    column_name: team1
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets') OR
        (winner IS NOT NULL AND winner IN (team1, team2))", 'decisive_winner_is_participant')
      - Valid
    assumptions: []
    column_name: winner
