constraints:
  match_type:
    code:
    - - .isComplete('match_type').isContainedIn('match_type', ['League', 'Elimination
        Final', 'Eliminator', 'Qualifier 1', 'Qualifier 2', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result').isContainedIn('result', ['runs', 'wickets', 'tie', 'no
        result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (result_margin IS
        NOT NULL AND result_margin > 0 AND result_margin <= target_runs - 1)", 'league_run_win_has_valid_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season').isPositive('season')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR target_overs IS NULL OR (target_overs
        > 0 AND target_overs <= 20)", 'league_target_overs_valid_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("match_type <> 'League' OR result = 'no result' OR (target_runs
        IS NOT NULL AND target_runs >= 1)", 'league_matches_with_a_result_have_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'opposing_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets') OR
        (winner IS NOT NULL AND winner IN (team1, team2))", 'league_winner_is_a_participant')
      - Valid
    assumptions: []
    column_name: winner
