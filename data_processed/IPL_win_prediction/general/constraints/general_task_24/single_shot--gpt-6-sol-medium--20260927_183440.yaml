constraints:
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .satisfies("match_type <> 'League' OR (result IS NOT NULL AND result IN ('runs',
        'wickets', 'tie', 'no result'))", 'league_result_is_supported')
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("match_type <> 'League' OR result <> 'runs' OR (result_margin IS
        NOT NULL AND CAST(result_margin AS DOUBLE) > 0 AND CAST(result_margin AS DOUBLE)
        < CAST(target_runs AS DOUBLE))", 'runs_margin_produces_nonnegative_second_innings_score')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies("match_type <> 'League' OR (CAST(season AS DOUBLE) IS NOT NULL
        AND CAST(season AS DOUBLE) = FLOOR(CAST(season AS DOUBLE)))", 'league_season_is_numeric_and_integral')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies("match_type <> 'League' OR target_overs IS NULL OR (CAST(target_overs
        AS DOUBLE) > 0 AND CAST(target_overs AS DOUBLE) <= 20)", 'league_target_overs_valid_when_present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets', 'tie')
        OR (target_runs IS NOT NULL AND CAST(target_runs AS DOUBLE) >= 1)", 'scored_league_match_has_valid_target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .satisfies("match_type <> 'League' OR (team1 IS NOT NULL AND TRIM(team1) <>
        '')", 'league_team1_present')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies("match_type <> 'League' OR team1 <> team2", 'league_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .satisfies("match_type <> 'League' OR (team2 IS NOT NULL AND TRIM(team2) <>
        '')", 'league_team2_present')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type <> 'League' OR result NOT IN ('runs', 'wickets') OR
        (winner IS NOT NULL AND winner IN (team1, team2))", 'decisive_league_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: winner
