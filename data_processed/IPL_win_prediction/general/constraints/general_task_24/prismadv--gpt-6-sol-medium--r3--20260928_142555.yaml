    assumptions:
    - text: For every row with match_type = 'League', season, team1, and team2 must
        be non-null. Otherwise, a league match may be omitted from season/team standings
        or grouped under a missing team. This can be checked with a conditional constraint
        such as .satisfies("match_type <> 'League' OR (season IS NOT NULL AND team1
        IS NOT NULL AND team2 IS NOT NULL)", "league_match_fields_present").
      sources:
      - start_line: 22
        end_line: 23
        file: ''
      - start_line: 52
        end_line: 55
        file: ''
      - start_line: 123
        end_line: 123
        file: ''
      uid: 8f5c1228-f203-4f70-82f6-5194956fbcc4
    - text: For every row with match_type = 'League', team1 and team2 must be different
        teams. The code creates a standings record for each participant, so identical
        values would count one match twice for the same team. This can be checked
        with .satisfies("match_type <> 'League' OR team1 <> team2", "distinct_league_match_teams").
