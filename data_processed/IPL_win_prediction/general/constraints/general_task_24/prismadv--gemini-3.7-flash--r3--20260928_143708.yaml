    assumptions:
    - text: 'When ''result'' is equal to ''runs'', ''result_margin'' must not be null
        and should contain valid positive numeric values, because it is directly subtracted
        from ''first_runs'' to compute ''second_runs''. This can be expressed as a
        conditional constraint: when ''result'' == ''runs'', ''result_margin'' is
        not null and ''result_margin'' > 0.'
      sources:
      - start_line: 43
        end_line: 44
        file: ''
      uid: f05a1175-ca76-45f7-ab1f-3a2969cedfbd
