constraints:
  '["result","result_margin","target_runs"]':
    code:
    - suggestion: .satisfies("`result` != 'runs' OR (`result_margin` IS NOT NULL AND
        `target_runs` IS NOT NULL AND `result_margin` <= `target_runs` - 1)", "valid_margin_for_runs_result")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 418e2321-f418-4e23-9e0f-ba9a245c00c5
      source_assumptions:
      - 781c40d5-1642-4598-97c3-3f3c2dc59f64
    - suggestion: .satisfies("`result` NOT IN ('runs', 'wickets', 'tie') OR (`target_runs`
        IS NOT NULL AND `target_runs` >= 1)", "target_runs_present_for_completed_matches")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c965eae4-aa68-4f18-b985-bcc1f0debf78
      source_assumptions:
      - dbfa3073-99c6-48ac-90e4-05428322ce70
    assumptions:
    - text: 'When the ''result'' column equals ''runs'', both ''target_runs'' and
        ''result_margin'' must not be null, and ''result_margin'' should be less than
        ''target_runs'' (i.e., result_margin <= target_runs - 1) so that the derived
        second innings runs (first_runs - result_margin) are valid and non-negative.
        We could represent this assumption as a Deequ constraint like: .satisfies("result
        != ''runs'' OR (result_margin IS NOT NULL AND target_runs IS NOT NULL AND
        result_margin <= target_runs - 1)", "valid_margin_for_runs_result")'
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: 781c40d5-1642-4598-97c3-3f3c2dc59f64
    - text: 'When the ''result'' column is one of ''runs'', ''wickets'', or ''tie'',
        ''target_runs'' must not be null and should be greater than or equal to 1
        to ensure that first innings runs (''target_runs'' - 1) and second innings
        runs can be derived for net run rate calculation. We could represent this
        assumption as a Deequ constraint like: .satisfies("result NOT IN (''runs'',
        ''wickets'', ''tie'') OR (target_runs IS NOT NULL AND target_runs >= 1)",
        "target_runs_present_for_completed_matches")'
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      - start_line: 70
        end_line: 111
        file: ''
      uid: dbfa3073-99c6-48ac-90e4-05428322ce70
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("CASE WHEN `result` = 'runs' THEN `result_margin` IS
        NOT NULL AND `result_margin` > 0 ELSE TRUE END", "result_margin_positive_when_result_is_runs")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e45f5b55-fefc-4786-8259-2389f8c0bb6e
      source_assumptions:
