prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  '["result","result_margin","target_runs"]':
    code: []
    assumptions:
    - text: When 'result' is equal to 'runs', 'result_margin' and 'target_runs' should
        not be null so that second innings runs can be derived by subtracting 'result_margin'
        from 'target_runs' - 1.
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: fe31093d-da5d-4c24-a919-0b358fd9c871
    - text: When 'result' is in ('runs', 'wickets', 'tie'), 'target_runs' should not
        be null so that innings runs can be derived for points table / net run rate
        calculations.
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: a64fada0-f8ff-4b6b-9c71-a74bb4ba3e3a
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` != 'runs' OR `result_margin` IS NOT NULL",
        "result_margin_not_null_when_result_is_runs")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4f3ea84a-2742-4cda-977f-1b6381bebdbe
      source_assumptions:
      - 327190da-3eb7-4e18-9741-153b2ecd3e86
    assumptions:
    - text: 'When the ''result'' column has the value ''runs'', the ''result_margin''
        column should not be null, as ''result_margin'' is subtracted from ''first_runs''
        to compute ''second_runs''. We could represent this assumption as a Deequ
        constraint: .satisfies("result != ''runs'' OR result_margin IS NOT NULL",
        "result_margin_not_null_when_result_is_runs")'
      sources:
      - start_line: 30
        end_line: 31
        file: ''
      - start_line: 42
        end_line: 46
        file: ''
      uid: 327190da-3eb7-4e18-9741-153b2ecd3e86
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column indicates a decisive outcome (''runs'' or
        ''wickets''), the ''winner'' column should not be null. We could represent
        this assumption as a Deequ constraint like this: .satisfies("result NOT IN
        (''runs'', ''wickets'') OR winner IS NOT NULL", "Decisive matches must have
        a non-null winner")'
      sources:
      - start_line: 79
        end_line: 81
        file: ''
      uid: 4f0ee1b2-b55c-4f07-83a8-7ac4c767ce56
  '["result_margin","target_runs"]':
    code: []
    assumptions:
    - text: 'When the match result is ''runs'' (i.e., df[''result''] == ''runs''),
        ''result_margin'' should be less than ''target_runs'' (or result_margin <=
        target_runs - 1) so that the calculated second innings runs (first_runs -
        result_margin) is non-negative. We could represent this assumption as a Deequ
        constraint like: .satisfies("result != ''runs'' OR (target_runs IS NOT NULL
        AND result_margin IS NOT NULL AND result_margin < target_runs)", "result_margin_less_than_target_runs_when_won_by_runs")'
      sources:
      - start_line: 41
        end_line: 44
        file: ''
      uid: 663f2531-e57b-43b5-ba94-3182cd4c2a01
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When a winner is specified, the ''winner'' column must match either ''team1''
        or ''team2''. The downstream code determines wins, losses, and losers by checking
        whether ''winner'' equals ''team1'' or ''team2''. We could represent this
        assumption as a Deequ constraint like: .satisfies("winner IS NULL OR winner
        = team1 OR winner = team2", "Winner must be team1 or team2")'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 80
        end_line: 111
        file: ''
      uid: cf05f40c-7645-4832-b14e-3e16bba82c1f
    - text: 'The columns ''team1'' and ''team2'' must not be equal for any given match
        record (a team cannot play against itself). We could represent this assumption
        as a Deequ constraint like: .satisfies("team1 != team2", "team1 and team2
        must be distinct")'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 80
        end_line: 111
        file: ''
      uid: 6d7353c1-9053-467a-8d9d-6cc488fbf3e0
  '["team1","team2"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'team1 and team2 must be different')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8fa9059e-578b-47de-af42-d814a4e8d89d
      source_assumptions:
      - a71afd7e-696a-4226-94dd-fa4d846053ef
    assumptions:
    - text: 'For each match record, ''team1'' and ''team2'' must be distinct teams
        representing the two opposing sides in a match. If ''team1'' equals ''team2'',
        the match aggregation logic will produce duplicate entries for the same team
        within a single match, distorting match counts, points, and net run rate calculations.
        We can express this constraint in Deequ as: .satisfies("team1 != team2", "team1
        and team2 must be different")'
