    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  '["result","result_margin","target_runs"]':
    code: []
    assumptions:
    - text: 'When ''result'' is equal to ''runs'', ''result_margin'' should not be
        null, because the code computes second innings runs by subtracting ''result_margin''
        from first innings runs (derived from ''target_runs''). This can be represented
        as a Deequ constraint: .satisfies("result != ''runs'' OR result_margin IS
        NOT NULL", "ResultMarginNotNullWhenResultIsRuns").'
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: 9d59d50d-dff4-4379-a328-35422d14db32
    - text: 'When ''result'' is one of ''runs'', ''wickets'', or ''tie'', ''target_runs''
        should not be null, because first innings runs and second innings runs are
        derived directly from ''target_runs'' for matches with a decisive outcome
        or tie. This can be represented as a Deequ constraint: .satisfies("result
        = ''no result'' OR target_runs IS NOT NULL", "TargetRunsNotNullWhenMatchCompleted").'
      sources:
      - start_line: 41
        end_line: 46
        file: ''
      uid: ee8fc8ad-3b25-46eb-a405-e09b2c76a53d
    - text: 'When ''result'' is equal to ''runs'', ''result_margin'' should be strictly
        less than ''target_runs'' (and target_runs - 1 - result_margin >= 0), ensuring
        the derived second innings runs are non-negative. This can be represented
        as a Deequ constraint: .satisfies("result != ''runs'' OR (target_runs - 1
        - result_margin >= 0)", "ValidRunsMargin").'
      sources:
      - start_line: 41
        end_line: 44
        file: ''
      uid: 7b6dc070-99f6-4259-94ea-1482681f1437
  '["result","result_margin"]':
    code:
    - suggestion: .satisfies("`result` != 'runs' OR (`result_margin` IS NOT NULL AND
        `result_margin` > 0)", "result_margin_not_null_and_positive_when_result_is_runs")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 779916a8-c8fd-48d3-8c54-e11219a030ec
      source_assumptions:
      - eb793ac0-8a64-4c08-a2ed-3e08e4c71298
    assumptions:
    - text: 'When ''result'' is equal to ''runs'', ''result_margin'' should not be
        null and should be greater than 0 to correctly compute second innings runs.
        This can be expressed as a Deequ constraint: .satisfies("result != ''runs''
        OR (result_margin IS NOT NULL AND result_margin > 0)", "result_margin_not_null_when_runs")'
      sources:
      - start_line: 43
        end_line: 44
        file: ''
      uid: eb793ac0-8a64-4c08-a2ed-3e08e4c71298
  '["result","winner"]':
    code: []
    assumptions:
    - text: 'When the ''result'' column has the value ''runs'' or ''wickets'', the
        ''winner'' column should not be null. We could represent this assumption as
        a deequ constraint like this: .satisfies("result NOT IN (''runs'', ''wickets'')
        OR winner IS NOT NULL", "Decisive matches must have a non-null winner")'
      sources:
      - start_line: 56
        end_line: 56
        file: ''
      - start_line: 79
        end_line: 111
        file: ''
      uid: 9b4b4bf5-0981-4545-bba9-029814870d3e
  '["target_overs","target_runs"]':
    code: []
    assumptions:
    - text: 'When ''target_runs'' is present (non-null and >= 1), ''target_overs''
        should be positive (> 0) to ensure valid calculations of innings run rates
        without zero division. We could represent this assumption as a Deequ constraint
        like: .satisfies(''(target_runs IS NULL) OR (target_overs > 0)'', ''target_overs_positive_when_target_runs_present'')'
      sources:
      - start_line: 28
        end_line: 49
        file: ''
      - start_line: 57
        end_line: 60
        file: ''
      - start_line: 137
        end_line: 139
        file: ''
      uid: d802f1ff-e361-41dd-a524-dde7d271946f
  '["team1","team2","winner"]':
    code: []
    assumptions:
    - text: 'When a ''winner'' is specified, the ''winner'' must be equal to either
        ''team1'' or ''team2''. This ensures that win/loss records and points are
        accurately attributed to one of the competing teams. We can represent this
        assumption as a constraint: `winner.isNull() || winner == team1 || winner
        == team2`.'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 80
        end_line: 111
        file: ''
      uid: 14b19d18-ffc5-4971-8cf6-16aabc8a86c8
    - text: 'The ''team1'' and ''team2'' columns representing the competing teams
        in a match must be distinct for every record. We can represent this assumption
        as a constraint: `team1 != team2`.'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 80
        end_line: 111
        file: ''
      uid: db03e52f-d6a8-442c-a127-9a8de01cf810
  '["team1","team2"]':
    code:
    - suggestion: .satisfies('`team1` != `team2`', 'Team1AndTeam2Distinct')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c92246e2-dc0c-4bf7-8c2c-c15780bbcee7
      source_assumptions:
      - e6cf395b-da7a-4134-b30b-33d187d1c522
    assumptions:
    - text: 'In every match record, ''team1'' and ''team2'' must be distinct from
        each other because a team cannot play a match against itself. The downstream
        logic creates separate records for ''t1'' and ''t2'' and evaluates match outcomes
        (winner and loser) assuming they are two distinct competing teams. We can
        represent this assumption as a Deequ constraint like: .satisfies("team1 !=
        team2", "Team1AndTeam2Distinct")'
      sources:
