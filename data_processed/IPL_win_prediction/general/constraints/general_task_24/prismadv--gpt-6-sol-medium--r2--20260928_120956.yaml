        end_line: 55
        file: ''
      uid: bdc882cb-0bf0-48d0-99ef-553b25bb7ff1
    - text: For rows where 'match_type' is 'League' (or all rows if 'match_type' is
        absent) and 'result' is 'no result', 'tie', 'runs', or 'wickets', 'team2'
        should be a non-null, non-empty string. The code does not fill missing team
        names before grouping standings by team; configured missing-value tokens such
        as 'NA' are read as null.
      sources:
      - start_line: 13
        end_line: 15
        file: ''
      - start_line: 21
        end_line: 25
        file: ''
      - start_line: 52
