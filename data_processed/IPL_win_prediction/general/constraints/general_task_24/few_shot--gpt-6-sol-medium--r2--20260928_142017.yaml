constraints:
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("result <> 'runs' OR (result_margin IS NOT NULL AND result_margin
        > 0)", 'runs_result_has_positive_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('CAST(season AS DOUBLE) > 0 AND CAST(season AS DOUBLE) = FLOOR(CAST(season
        AS DOUBLE))', 'season_is_positive_integer')
      - Valid
    assumptions: []
    column_name: season
  target_overs:
    code:
    - - .satisfies('target_overs IS NULL OR target_overs > 0', 'provided_target_overs_are_positive')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets', 'tie') OR (target_runs IS NOT
        NULL AND target_runs >= 1)", 'played_match_has_positive_target')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1, team2:
    code:
    - - .satisfies('team1 <> team2', 'opposing_teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1, team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("result NOT IN ('runs', 'wickets') OR (winner IS NOT NULL AND winner
        IN (team1, team2))", 'played_match_winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: winner
