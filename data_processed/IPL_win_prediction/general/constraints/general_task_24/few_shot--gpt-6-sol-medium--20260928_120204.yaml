      - Valid
    assumptions: []
    column_name: team1,team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  winner:
    code:
    - - .satisfies("match_type IS NULL OR match_type <> 'League' OR result NOT IN
        ('runs', 'wickets') OR (winner IS NOT NULL AND winner IN (team1, team2))",
        'winner_is_a_participating_team')
      - Valid
    assumptions: []
    column_name: winner
