results:
  date:
    code:
    - suggestion: .containsPattern('date', '^\\d{4}-\\d{2}-\\d{2}$')
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.containsPattern(''date'',
        ''^\\d{4}-\\d{2}-\\d{2}$'')'': ''Check'' object has no attribute ''containsPattern'''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: '.satisfies("(result != ''runs'' AND result != ''wickets'') OR result_margin
        IS NOT NULL", ''resulted matches have margin'', lambda v: v >= 0.99)'
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: .hasDataType('season', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: .hasDataType('target_overs', ConstrainableDataTypes.Fractional)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isPositive('target_overs')
      status: true
      reason_if_failed: ''
      level: error
  target_runs:
    code:
    - suggestion: '.hasCompleteness(''target_runs'', lambda v: v >= 0.99)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .hasDataType('target_runs', ConstrainableDataTypes.Fractional)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isNonNegative('target_runs')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['field', 'bat'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .isComplete('toss_winner')
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: '.satisfies("(result = ''no result'') OR winner IS NOT NULL", ''winner
        present except no result'', lambda v: v >= 0.99)'
      status: true
      reason_if_failed: ''
      level: error
