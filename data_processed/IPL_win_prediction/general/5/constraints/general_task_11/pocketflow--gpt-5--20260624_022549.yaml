constraints:
  date:
    code:
    - - .containsPattern('date', '^\\d{4}-\\d{2}-\\d{2}$')
      - Invalid
    assumptions: []
    column_name: date
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("(result != ''runs'' AND result != ''wickets'') OR result_margin
        IS NOT NULL", ''resulted matches have margin'', lambda v: v >= 0.99)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .hasDataType('season', ConstrainableDataTypes.Integral)
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .hasDataType('target_overs', ConstrainableDataTypes.Fractional)
      - Valid
    - - '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      - Valid
    - - .isPositive('target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - '.hasCompleteness(''target_runs'', lambda v: v >= 0.99)'
      - Valid
    - - .hasDataType('target_runs', ConstrainableDataTypes.Fractional)
      - Valid
    - - .isNonNegative('target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['field', 'bat'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - '.satisfies("(result = ''no result'') OR winner IS NOT NULL", ''winner present
        except no result'', lambda v: v >= 0.99)'
      - Valid
    assumptions: []
    column_name: winner
