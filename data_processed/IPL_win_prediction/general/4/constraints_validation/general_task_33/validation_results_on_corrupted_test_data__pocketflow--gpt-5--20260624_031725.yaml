results:
  match_type:
    code:
    - suggestion: .isContainedIn('match_type', ['League', 'Qualifier 1', 'Qualifier
        2', 'Eliminator', 'Elimination Final', 'Semi Final', 'Final'])
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .satisfies("(method IS NULL) OR (method = 'D/L')", 'method_null_or_dl')
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .satisfies("(result <> 'runs') OR (result_margin > 0)", 'result_margin_positive_for_runs')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("(result <> 'wickets') OR (result_margin > 0 AND result_margin
        <= 10)", 'result_margin_bounds_for_wickets')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("((result = 'tie' AND super_over = 'Y') OR (result <>
        'tie' AND super_over = 'N'))", 'super_over_only_on_tie')
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: .satisfies("(result <> 'runs') OR (target_overs > 0)", 'target_overs_positive_for_runs')
      status: true
      reason_if_failed: ''
      level: error
  team1:
    code:
    - suggestion: .satisfies('team1 <> team2', 'team1_ne_team2_all_rows')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isContainedIn('toss_decision', ['bat', 'field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .satisfies('(toss_winner = team1 OR toss_winner = team2)', 'toss_winner_is_a_team')
      status: false
      reason_if_failed: 'Constraint ''.satisfies(''(toss_winner = team1 OR toss_winner
        = team2)'', ''toss_winner_is_a_team'')'' failed on data sample: Value: 0.9019073569482289
        does not meet the constraint requirement!'
      level: error
  winner:
    code:
    - suggestion: .isComplete('winner', where="result <> 'no result'")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isComplete(''winner'',
        where="result <> ''no result''")'': Check.isComplete() got an unexpected keyword
        argument ''where'''
      level: error
    - suggestion: .satisfies("(result = 'no result') OR (winner = team1 OR winner
        = team2)", 'winner_is_a_team_when_applicable')
      status: true
      reason_if_failed: ''
      level: error
