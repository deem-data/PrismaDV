constraints:
  date:
    code:
    - - .hasPattern('date', '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("CASE WHEN method = 'D/L' THEN (target_runs IS NOT NULL AND target_runs
        > 0 AND target_overs IS NOT NULL AND target_overs > 0 AND target_overs <=
        20) ELSE TRUE END", 'D/L requires valid targets')
      - Valid
    - - .satisfies("method IS NULL OR method = 'D/L'", 'method allowed values')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs','wickets','tie','no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("CASE WHEN result IN ('runs','wickets') THEN (result_margin IS
        NOT NULL AND result_margin > 0) ELSE result_margin IS NULL END", 'result_margin
        rules by result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies("year(to_date(date, 'yyyy-MM-dd')) = season", 'season matches date
        year')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y','N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    - - .satisfies('team1 <> team2', 'team1 and team2 must be different')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies("(toss_winner = team1) OR (toss_winner = team2)", 'toss_winner
        is one of the teams')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("CASE WHEN result IN ('runs','wickets') THEN (winner IS NOT NULL
        AND (winner = team1 OR winner = team2)) WHEN result = 'tie' AND super_over
        = 'Y' THEN (winner IS NOT NULL AND (winner = team1 OR winner = team2)) WHEN
        result = 'tie' AND super_over <> 'Y' THEN (winner IS NULL OR (winner = team1
        OR winner = team2)) WHEN result = 'no result' THEN (winner IS NULL OR (winner
        = team1 OR winner = team2)) ELSE TRUE END", 'winner rules by result and super_over')
      - Valid
    assumptions: []
    column_name: winner
