constraints:
  date:
    code:
    - - .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .hasDataType('id', ConstrainableDataTypes.Integral)
      - Valid
    - - .isNonNegative('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Eliminator', 'Qualifier 1', 'Qualifier
        2', 'Final', 'Semi Final', 'Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isNonNegative('result_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .hasDataType('season', ConstrainableDataTypes.Integral)
      - Valid
    - - .satisfies('season >= 2008 AND season <= 2026', 'season range 2008-2026')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies('(target_overs IS NULL) OR (target_overs > 0 AND target_overs <=
        20)', 'target_overs in (0,20] when present')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .satisfies('(target_runs IS NULL) OR (target_runs > 0)', 'target_runs positive
        when present')
      - Valid
    assumptions: []
    column_name: target_runs
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('(toss_winner = team1) OR (toss_winner = team2)', 'toss_winner
        in {team1,team2}')
      - Valid
    assumptions: []
    column_name: toss_winner
  umpire1:
    code:
    - - .isComplete('umpire1')
      - Valid
    assumptions: []
    column_name: umpire1
  umpire2:
    code:
    - - .isComplete('umpire2')
      - Valid
    assumptions: []
    column_name: umpire2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - .satisfies('(winner IS NULL) OR (winner = team1) OR (winner = team2)', 'winner
        in {team1,team2} or null')
      - Valid
    assumptions: []
    column_name: winner
