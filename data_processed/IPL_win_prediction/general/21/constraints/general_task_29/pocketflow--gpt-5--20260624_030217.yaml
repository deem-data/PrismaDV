constraints:
  date:
    code:
    - - .hasPattern('date', '^\d{4}-\d{2}-\d{2}$')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("(method IS NULL OR method = 'D/L')", 'method_null_or_dl')
      - Valid
    assumptions: []
    column_name: method
  player_of_match:
    code:
    - - .satisfies("CASE WHEN result <> 'no result' THEN player_of_match IS NOT NULL
        ELSE true END", 'pom_present_when_played')
      - Valid
    assumptions: []
    column_name: player_of_match
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("CASE WHEN result IN ('runs','wickets') THEN result_margin > 0
        ELSE true END", 'positive_margin_for_played')
      - Valid
    - - .satisfies("CASE WHEN result IN ('tie','no result') THEN result_margin IS
        NULL ELSE true END", 'null_margin_for_tie_or_no_result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .hasDataType('season', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("CASE WHEN super_over = 'Y' THEN result = 'tie' ELSE true END",
        'super_over_implies_tie')
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies("team1 <> team2", 'teams_are_distinct')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies("(toss_winner = team1 OR toss_winner = team2)", 'toss_winner_is_participating_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("CASE WHEN result = 'no result' THEN winner IS NULL ELSE true END",
        'winner_null_when_no_result')
      - Valid
    - - .satisfies("CASE WHEN result IN ('runs','wickets') THEN (winner = team1 OR
        winner = team2) ELSE true END", 'winner_in_teams_when_played')
      - Valid
    assumptions: []
    column_name: winner
