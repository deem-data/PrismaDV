constraints:
  date:
    code:
    - - .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - '.hasCompleteness(''method'', lambda v: v <= 0.1)'
      - Valid
    - - .isContainedIn('method', ['D/L'])
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs','wickets','tie','no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("NOT (result IN (\'runs\',\'wickets\')) OR result_margin IS NOT
        NULL", 'margin_present_for_decided')
      - Valid
    - - .satisfies("result <> 'runs' OR (result_margin >= 1)", 'positive_margin_for_runs')
      - Valid
    - - .satisfies("result <> 'wickets' OR (result_margin >= 1 AND result_margin <=
        10)", 'wickets_margin_between_1_and_10')
      - Valid
    assumptions: []
    column_name: result_margin
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y','N'])
      - Valid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team1_team2:
    code:
    - - .satisfies("team1 != team2", 'team1_team2_distinct')
      - Valid
    assumptions: []
    column_name: team1_team2
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  winner:
    code:
    - - .satisfies("NOT (result IN (\'runs\',\'wickets\')) OR (winner = team1 OR winner
        = team2)", 'winner_matches_decided_teams')
      - Valid
    assumptions: []
    column_name: winner
