constraints:
  date:
    code:
    - - .hasPattern('date', '^\d{4}-\d{2}-\d{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  date_season:
    code:
    - - '.satisfies("year(to_date(date, ''yyyy-MM-dd'')) = CAST(season AS INT)", ''season_matches_date_year'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: date_season
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isPositive('id')
      - Invalid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League','Eliminator','Qualifier 1','Qualifier
        2','Final','Semi Final','Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - '.satisfies("method IS NULL OR method = ''D/L''", ''dl_method_or_null'', lambda
        v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs','wickets','tie','no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.satisfies("((result IN (''runs'',''wickets'') AND result_margin > 0) OR
        (result IN (''tie'',''no result'') AND (result_margin IS NULL OR result_margin
        = 0)))", ''result_margin_consistency'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - '.hasMax(''season'', lambda v: v <= 2026)'
      - Valid
    - - '.hasMin(''season'', lambda v: v >= 2008)'
      - Valid
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y','N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - '.satisfies("(target_overs IS NULL) OR (target_overs > 0 AND target_overs
        <= 20)", ''target_overs_range'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - '.satisfies("(target_runs IS NULL) OR (target_runs > 0 AND target_runs <=
        300)", ''target_runs_reasonable'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  teams:
    code:
    - - '.satisfies("team1 <> team2", ''teams_distinct'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: teams
  tie_superover:
    code:
    - - '.satisfies("((result = ''tie'' AND super_over = ''Y'') OR (result <> ''tie''
        AND super_over = ''N''))", ''tie_superover_consistency'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: tie_superover
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - '.satisfies("(toss_winner = team1) OR (toss_winner = team2)", ''toss_winner_in_teams'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: toss_winner
  umpire1:
    code:
    - - .isComplete('umpire1')
      - Valid
    assumptions: []
    column_name: umpire1
  umpire2:
    code:
    - - .isComplete('umpire2')
      - Valid
    assumptions: []
    column_name: umpire2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - '.satisfies("(result = ''no result'' AND winner IS NULL) OR (result <> ''no
        result'' AND (winner = team1 OR winner = team2))", ''valid_winner_or_nr'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: winner
