results:
  date:
    code:
    - suggestion: .hasPattern('date', r'\d{4}-\d{2}-\d{2}')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('date')
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs','wickets','tie','no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: '.hasMax(''result_margin'', lambda v: v <= 0.0, where="result =
        ''tie''")'
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.hasMax(''result_margin'',
        lambda v: v <= 0.0, where="result = ''tie''")'': Check.hasMax() got an unexpected
        keyword argument ''where'''
      level: error
    - suggestion: '.hasMax(''result_margin'', lambda v: v <= 10.0, where="result =
        ''wickets''")'
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.hasMax(''result_margin'',
        lambda v: v <= 10.0, where="result = ''wickets''")'': Check.hasMax() got an
        unexpected keyword argument ''where'''
      level: error
    - suggestion: '.hasMin(''result_margin'', lambda v: v >= 0.0, where="result =
        ''tie''")'
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.hasMin(''result_margin'',
        lambda v: v >= 0.0, where="result = ''tie''")'': Check.hasMin() got an unexpected
        keyword argument ''where'''
      level: error
    - suggestion: '.hasMin(''result_margin'', lambda v: v >= 1.0, where="result =
        ''runs''")'
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.hasMin(''result_margin'',
        lambda v: v >= 1.0, where="result = ''runs''")'': Check.hasMin() got an unexpected
        keyword argument ''where'''
      level: error
    - suggestion: '.hasMin(''result_margin'', lambda v: v >= 1.0, where="result =
        ''wickets''")'
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.hasMin(''result_margin'',
        lambda v: v >= 1.0, where="result = ''wickets''")'': Check.hasMin() got an
        unexpected keyword argument ''where'''
      level: error
    - suggestion: .isNonNegative('result_margin')
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''target_overs'', lambda v: v > 0.0)'
      status: true
      reason_if_failed: ''
      level: error
  target_runs:
    code:
    - suggestion: '.hasMin(''target_runs'', lambda v: v >= 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.hasMin(''target_runs'', lambda v: v >= 1.0)''
        failed on data sample: Value: -107.0 does not meet the constraint requirement!'
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat','field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .isComplete('toss_winner')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies("toss_winner = team1 OR toss_winner = team2", ''toss_winner_in_teams'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: .isComplete('winner', where="result <> 'no result'")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isComplete(''winner'',
        where="result <> ''no result''")'': Check.isComplete() got an unexpected keyword
        argument ''where'''
      level: error
