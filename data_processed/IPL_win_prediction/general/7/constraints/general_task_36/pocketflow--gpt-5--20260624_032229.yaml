constraints:
  date:
    code:
    - - .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isNonNegative('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .isContainedIn('method', ['D/L'])
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isNonNegative('result_margin')
      - Valid
    - - '.satisfies("CASE WHEN result IN (''runs'',''wickets'') THEN result_margin
        IS NOT NULL ELSE true END", ''MarginPresentWhenDecided'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - '.satisfies(''season >= 2008 AND season <= 2100'', ''SeasonRange'', lambda
        v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - '.satisfies("CASE WHEN result <> ''tie'' THEN super_over = ''N'' ELSE true
        END", ''SuperOverOnlyOnTie'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - '.satisfies("CASE WHEN method = ''D/L'' THEN target_overs IS NOT NULL AND
        target_overs > 0 AND target_overs <= 20 ELSE true END", ''TargetOversValidIfDL'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - '.satisfies(''team1 <> team2'', ''TeamsDifferent'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - '.satisfies(''(toss_winner = team1) OR (toss_winner = team2)'', ''TossWinnerInTeams'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: toss_winner
  umpire1:
    code:
    - - .isComplete('umpire1')
      - Valid
    assumptions: []
    column_name: umpire1
  umpire2:
    code:
    - - .isComplete('umpire2')
      - Valid
    assumptions: []
    column_name: umpire2
  venue:
    code:
    - - .isComplete('venue')
      - Valid
    assumptions: []
    column_name: venue
  winner:
    code:
    - - '.satisfies("CASE WHEN result = ''tie'' AND super_over = ''Y'' THEN winner
        IS NOT NULL ELSE true END", ''TieWithSuperOverRequiresWinner'', lambda v:
        v == 1.0)'
      - Valid
    - - '.satisfies(''(winner IS NULL) OR (winner = team1) OR (winner = team2)'',
        ''WinnerInTeamsOrNull'', lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: winner
