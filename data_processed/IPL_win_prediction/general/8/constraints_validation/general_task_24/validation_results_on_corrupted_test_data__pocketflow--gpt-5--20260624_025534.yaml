results:
  date:
    code:
    - suggestion: .hasPattern('date', r'\d{4}-\d{2}-\d{2}')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('date')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isUnique('id')
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .satisfies("(method IS NULL) OR (method = 'D/L')", 'method_dl_or_null')
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .isNonNegative('result_margin')
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: '.hasMax(''season'', lambda v: v <= 2025)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''season'', lambda v: v >= 2008)'
      status: false
      reason_if_failed: 'Constraint ''.hasMin(''season'', lambda v: v >= 2008)'' failed
        on data sample: Value: 2006.0 does not meet the constraint requirement!'
      level: error
    - suggestion: .isComplete('season')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''target_overs'', lambda v: v > 0)'
      status: true
      reason_if_failed: ''
      level: error
  target_runs:
    code:
    - suggestion: .isNonNegative('target_runs')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isContainedIn('toss_decision', ['bat', 'field'])
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: .satisfies("(result NOT IN ('runs','wickets')) OR (winner IS NOT
        NULL)", 'winner_present_when_decided')
      status: true
      reason_if_failed: ''
      level: error
