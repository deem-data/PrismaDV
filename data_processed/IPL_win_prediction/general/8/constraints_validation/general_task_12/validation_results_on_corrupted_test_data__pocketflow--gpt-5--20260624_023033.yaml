results:
  date:
    code:
    - suggestion: .hasPattern('date', '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('date')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .satisfies("CASE WHEN method = 'D/L' THEN (target_runs IS NOT NULL
        AND target_runs > 0 AND target_overs IS NOT NULL AND target_overs > 0 AND
        target_overs <= 20) ELSE TRUE END", 'D/L requires valid targets')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("method IS NULL OR method = 'D/L'", 'method allowed values')
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs','wickets','tie','no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .satisfies("CASE WHEN result IN ('runs','wickets') THEN (result_margin
        IS NOT NULL AND result_margin > 0) ELSE result_margin IS NULL END", 'result_margin
        rules by result')
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: .isComplete('season')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("year(to_date(date, 'yyyy-MM-dd')) = season", 'season
        matches date year')
      status: false
      reason_if_failed: 'Constraint ''.satisfies("year(to_date(date, ''yyyy-MM-dd''))
        = season", ''season matches date year'')'' failed on data sample: Value: 0.9536784741144414
        does not meet the constraint requirement!'
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y','N'])
      status: true
      reason_if_failed: ''
      level: error
  team1:
    code:
    - suggestion: .isComplete('team1')
      status: true
      reason_if_failed: ''
      level: error
  team2:
    code:
    - suggestion: .isComplete('team2')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies('team1 <> team2', 'team1 and team2 must be different')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat','field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .isComplete('toss_winner')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("(toss_winner = team1) OR (toss_winner = team2)", 'toss_winner
        is one of the teams')
      status: false
      reason_if_failed: 'Constraint ''.satisfies("(toss_winner = team1) OR (toss_winner
        = team2)", ''toss_winner is one of the teams'')'' failed on data sample: Value:
        0.9019073569482289 does not meet the constraint requirement!'
      level: error
  winner:
    code:
    - suggestion: .satisfies("CASE WHEN result IN ('runs','wickets') THEN (winner
        IS NOT NULL AND (winner = team1 OR winner = team2)) WHEN result = 'tie' AND
        super_over = 'Y' THEN (winner IS NOT NULL AND (winner = team1 OR winner =
        team2)) WHEN result = 'tie' AND super_over <> 'Y' THEN (winner IS NULL OR
        (winner = team1 OR winner = team2)) WHEN result = 'no result' THEN (winner
        IS NULL OR (winner = team1 OR winner = team2)) ELSE TRUE END", 'winner rules
        by result and super_over')
      status: true
      reason_if_failed: ''
      level: error
