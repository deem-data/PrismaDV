results:
  date:
    code:
    - suggestion: .hasPattern('date', '^\d{4}-\d{2}-\d{2}$')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('date')
      status: true
      reason_if_failed: ''
      level: error
  date_season:
    code:
    - suggestion: '.satisfies("year(to_date(date, ''yyyy-MM-dd'')) = CAST(season AS
        INT)", ''season_matches_date_year'', lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isPositive('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isUnique('id')
      status: true
      reason_if_failed: ''
      level: error
  match_type:
    code:
    - suggestion: .isComplete('match_type')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('match_type', ['League','Eliminator','Qualifier 1','Qualifier
        2','Final','Semi Final','Elimination Final'])
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: '.satisfies("method IS NULL OR method = ''D/L''", ''dl_method_or_null'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs','wickets','tie','no result'])
      status: false
      reason_if_failed: 'Constraint ''.isContainedIn(''result'', [''runs'',''wickets'',''tie'',''no
        result''])'' failed on data sample: Value: 0.9509536784741145 does not meet
        the constraint requirement!'
      level: error
  result_margin:
    code:
    - suggestion: '.satisfies("((result IN (''runs'',''wickets'') AND result_margin
        > 0) OR (result IN (''tie'',''no result'') AND (result_margin IS NULL OR result_margin
        = 0)))", ''result_margin_consistency'', lambda v: v == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies("((result IN (''runs'',''wickets'')
        AND result_margin > 0) OR (result IN (''tie'',''no result'') AND (result_margin
        IS NULL OR result_margin = 0)))", ''result_margin_consistency'', lambda v:
        v == 1.0)'' failed on data sample: Value: 0.9509536784741145 does not meet
        the constraint requirement!'
      level: error
  season:
    code:
    - suggestion: '.hasMax(''season'', lambda v: v <= 2026)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''season'', lambda v: v >= 2008)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('season')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y','N'])
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: '.satisfies("(target_overs IS NULL) OR (target_overs > 0 AND target_overs
        <= 20)", ''target_overs_range'', lambda v: v == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies("(target_overs IS NULL) OR (target_overs
        > 0 AND target_overs <= 20)", ''target_overs_range'', lambda v: v == 1.0)''
        failed on data sample: Value: 0.9019073569482289 does not meet the constraint
        requirement!'
      level: error
  target_runs:
    code:
    - suggestion: '.satisfies("(target_runs IS NULL) OR (target_runs > 0 AND target_runs
        <= 300)", ''target_runs_reasonable'', lambda v: v == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies("(target_runs IS NULL) OR (target_runs
        > 0 AND target_runs <= 300)", ''target_runs_reasonable'', lambda v: v == 1.0)''
        failed on data sample: Value: 0.9019073569482289 does not meet the constraint
        requirement!'
      level: error
  team1:
    code:
    - suggestion: .isComplete('team1')
      status: true
      reason_if_failed: ''
      level: error
  team2:
    code:
    - suggestion: .isComplete('team2')
      status: true
      reason_if_failed: ''
      level: error
  teams:
    code:
    - suggestion: '.satisfies("team1 <> team2", ''teams_distinct'', lambda v: v ==
        1.0)'
      status: true
      reason_if_failed: ''
      level: error
  tie_superover:
    code:
    - suggestion: '.satisfies("((result = ''tie'' AND super_over = ''Y'') OR (result
        <> ''tie'' AND super_over = ''N''))", ''tie_superover_consistency'', lambda
        v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat','field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .isComplete('toss_winner')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies("(toss_winner = team1) OR (toss_winner = team2)", ''toss_winner_in_teams'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  umpire1:
    code:
    - suggestion: .isComplete('umpire1')
      status: true
      reason_if_failed: ''
      level: error
  umpire2:
    code:
    - suggestion: .isComplete('umpire2')
      status: true
      reason_if_failed: ''
      level: error
  venue:
    code:
    - suggestion: .isComplete('venue')
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: '.satisfies("(result = ''no result'' AND winner IS NULL) OR (result
        <> ''no result'' AND (winner = team1 OR winner = team2))", ''valid_winner_or_nr'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
