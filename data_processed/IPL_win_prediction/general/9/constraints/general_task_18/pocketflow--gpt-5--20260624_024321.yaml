constraints:
  date:
    code:
    - - .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .hasDataType('id', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('id')
      - Valid
    - - .isNonNegative('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Qualifier 1', 'Qualifier 2', 'Eliminator',
        'Final', 'Semi Final', 'Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .isContainedIn('method', ['D/L'], where='method IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isComplete('result_margin', where="result IN ('runs','wickets')")
      - Invalid
    - - .isPositive('result_margin', where="result IN ('runs','wickets')")
      - Invalid
    - - .satisfies("(result <> 'no result') OR (result_margin IS NULL)", 'margin_null_on_no_result')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .hasDataType('season', ConstrainableDataTypes.Integral)
      - Valid
    - - .isNonNegative('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .isPositive('target_overs', where="method = 'D/L'")
      - Invalid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .isPositive('target_runs', where="method = 'D/L'")
      - Invalid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'teams_distinct')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('(toss_winner = team1) OR (toss_winner = team2)', 'toss_winner_in_teams')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .isComplete('winner', where="result <> 'no result'")
      - Invalid
    - - .satisfies("(result = 'no result') OR (winner = team1) OR (winner = team2)",
        'winner_in_teams_or_no_result')
      - Valid
    assumptions: []
    column_name: winner
