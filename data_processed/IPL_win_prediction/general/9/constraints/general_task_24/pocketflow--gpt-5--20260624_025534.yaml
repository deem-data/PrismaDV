constraints:
  date:
    code:
    - - .hasPattern('date', r'\d{4}-\d{2}-\d{2}')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  method:
    code:
    - - .satisfies("(method IS NULL) OR (method = 'D/L')", 'method_dl_or_null')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isNonNegative('result_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - '.hasMax(''season'', lambda v: v <= 2025)'
      - Valid
    - - '.hasMin(''season'', lambda v: v >= 2008)'
      - Valid
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      - Valid
    - - '.hasMin(''target_overs'', lambda v: v > 0)'
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .isNonNegative('target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  winner:
    code:
    - - .satisfies("(result NOT IN ('runs','wickets')) OR (winner IS NOT NULL)", 'winner_present_when_decided')
      - Valid
    assumptions: []
    column_name: winner
