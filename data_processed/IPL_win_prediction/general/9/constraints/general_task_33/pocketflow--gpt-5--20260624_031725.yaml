constraints:
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Qualifier 1', 'Qualifier 2', 'Eliminator',
        'Elimination Final', 'Semi Final', 'Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .satisfies("(method IS NULL) OR (method = 'D/L')", 'method_null_or_dl')
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .satisfies("(result <> 'runs') OR (result_margin > 0)", 'result_margin_positive_for_runs')
      - Valid
    - - .satisfies("(result <> 'wickets') OR (result_margin > 0 AND result_margin
        <= 10)", 'result_margin_bounds_for_wickets')
      - Valid
    assumptions: []
    column_name: result_margin
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    - - .satisfies("((result = 'tie' AND super_over = 'Y') OR (result <> 'tie' AND
        super_over = 'N'))", 'super_over_only_on_tie')
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .satisfies("(result <> 'runs') OR (target_overs > 0)", 'target_overs_positive_for_runs')
      - Valid
    assumptions: []
    column_name: target_overs
  team1:
    code:
    - - .satisfies('team1 <> team2', 'team1_ne_team2_all_rows')
      - Valid
    assumptions: []
    column_name: team1
  toss_decision:
    code:
    - - .isContainedIn('toss_decision', ['bat', 'field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('(toss_winner = team1 OR toss_winner = team2)', 'toss_winner_is_a_team')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .isComplete('winner', where="result <> 'no result'")
      - Invalid
    - - .satisfies("(result = 'no result') OR (winner = team1 OR winner = team2)",
        'winner_is_a_team_when_applicable')
      - Valid
    assumptions: []
    column_name: winner
