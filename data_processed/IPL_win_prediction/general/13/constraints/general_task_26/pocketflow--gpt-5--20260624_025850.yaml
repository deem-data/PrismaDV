constraints:
  date:
    code:
    - - .hasPattern('date', r'\d{4}-\d{2}-\d{2}')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs','wickets','tie','no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - '.hasMax(''result_margin'', lambda v: v <= 0.0, where="result = ''tie''")'
      - Invalid
    - - '.hasMax(''result_margin'', lambda v: v <= 10.0, where="result = ''wickets''")'
      - Invalid
    - - '.hasMin(''result_margin'', lambda v: v >= 0.0, where="result = ''tie''")'
      - Invalid
    - - '.hasMin(''result_margin'', lambda v: v >= 1.0, where="result = ''runs''")'
      - Invalid
    - - '.hasMin(''result_margin'', lambda v: v >= 1.0, where="result = ''wickets''")'
      - Invalid
    - - .isNonNegative('result_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  target_overs:
    code:
    - - '.hasMax(''target_overs'', lambda v: v <= 20.0)'
      - Valid
    - - '.hasMin(''target_overs'', lambda v: v > 0.0)'
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - '.hasMin(''target_runs'', lambda v: v >= 1.0)'
      - Valid
    assumptions: []
    column_name: target_runs
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - '.satisfies("toss_winner = team1 OR toss_winner = team2", ''toss_winner_in_teams'',
        lambda v: v == 1.0)'
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .isComplete('winner', where="result <> 'no result'")
      - Invalid
    assumptions: []
    column_name: winner
