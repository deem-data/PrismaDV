results:
  date:
    code:
    - suggestion: .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isNonNegative('id')
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .isContainedIn('method', ['D/L'])
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .isNonNegative('result_margin')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies("CASE WHEN result IN (''runs'',''wickets'') THEN result_margin
        IS NOT NULL ELSE true END", ''MarginPresentWhenDecided'', lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: .isComplete('season')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies(''season >= 2008 AND season <= 2100'', ''SeasonRange'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies("CASE WHEN result <> ''tie'' THEN super_over = ''N''
        ELSE true END", ''SuperOverOnlyOnTie'', lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: '.satisfies("CASE WHEN method = ''D/L'' THEN target_overs IS NOT
        NULL AND target_overs > 0 AND target_overs <= 20 ELSE true END", ''TargetOversValidIfDL'',
        lambda v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  team1:
    code:
    - suggestion: .isComplete('team1')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies(''team1 <> team2'', ''TeamsDifferent'', lambda v: v
        == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies(''team1 <> team2'', ''TeamsDifferent'',
        lambda v: v == 1.0)'' failed on data sample: Value: 0.9700272479564033 does
        not meet the constraint requirement!'
      level: error
  team2:
    code:
    - suggestion: .isComplete('team2')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat', 'field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: '.satisfies(''(toss_winner = team1) OR (toss_winner = team2)'',
        ''TossWinnerInTeams'', lambda v: v == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies(''(toss_winner = team1) OR (toss_winner
        = team2)'', ''TossWinnerInTeams'', lambda v: v == 1.0)'' failed on data sample:
        Value: 0.9836512261580381 does not meet the constraint requirement!'
      level: error
  umpire1:
    code:
    - suggestion: .isComplete('umpire1')
      status: true
      reason_if_failed: ''
      level: error
  umpire2:
    code:
    - suggestion: .isComplete('umpire2')
      status: true
      reason_if_failed: ''
      level: error
  venue:
    code:
    - suggestion: .isComplete('venue')
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: '.satisfies("CASE WHEN result = ''tie'' AND super_over = ''Y'' THEN
        winner IS NOT NULL ELSE true END", ''TieWithSuperOverRequiresWinner'', lambda
        v: v == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies(''(winner IS NULL) OR (winner = team1) OR (winner =
        team2)'', ''WinnerInTeamsOrNull'', lambda v: v == 1.0)'
      status: false
      reason_if_failed: 'Constraint ''.satisfies(''(winner IS NULL) OR (winner = team1)
        OR (winner = team2)'', ''WinnerInTeamsOrNull'', lambda v: v == 1.0)'' failed
        on data sample: Value: 0.989100817438692 does not meet the constraint requirement!'
      level: error
