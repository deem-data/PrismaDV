constraints:
  date:
    code:
    - - .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isUnique('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League','Eliminator','Qualifier 1','Qualifier
        2','Final','Semi Final','Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .satisfies("(method != 'D/L') OR (target_runs > 0 AND target_overs > 0 AND
        target_overs <= 20)", 'dls_targets_valid', ['method','target_runs','target_overs'])
      - Invalid
    - - .satisfies("(method != 'D/L') OR (target_runs IS NOT NULL AND target_overs
        IS NOT NULL)", 'dls_targets_present', ['method','target_runs','target_overs'])
      - Invalid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isContainedIn('result', ['runs','wickets','tie','no result'])
      - Valid
    assumptions: []
    column_name: result
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .satisfies('(season >= 2008 AND season <= 2025)', 'season_range', ['season'])
      - Invalid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isContainedIn('super_over', ['Y','N'])
      - Valid
    - - .satisfies("(super_over != 'Y') OR (result = 'tie')", 'super_over_only_on_tie',
        ['super_over','result'])
      - Invalid
    assumptions: []
    column_name: super_over
  team1:
    code:
    - - .satisfies('team1 != team2', 'teams_distinct', ['team1','team2'])
      - Invalid
    assumptions: []
    column_name: team1
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'toss_winner_in_teams',
        ['toss_winner','team1','team2'])
      - Invalid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("(result = 'no result') OR (winner IS NOT NULL)", 'winner_present',
        ['result','winner'])
      - Invalid
    - - .satisfies("(winner IS NULL) OR (winner = team1 OR winner = team2)", 'winner_in_teams',
        ['winner','team1','team2'])
      - Invalid
    assumptions: []
    column_name: winner
