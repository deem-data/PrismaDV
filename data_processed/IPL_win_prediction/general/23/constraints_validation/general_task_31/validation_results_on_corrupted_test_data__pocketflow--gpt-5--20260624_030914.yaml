results:
  date:
    code:
    - suggestion: .containsPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.containsPattern(''date'',
        r''^\d{4}-\d{2}-\d{2}$'')'': ''Check'' object has no attribute ''containsPattern'''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isNonNegative('id')
      status: true
      reason_if_failed: ''
      level: error
  match_type:
    code:
    - suggestion: .isContainedIn('match_type', ['League', 'Eliminator', 'Qualifier
        1', 'Qualifier 2', 'Final', 'Semi Final', 'Elimination Final'])
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .isContainedIn('method', ['D/L'])
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .isNonNegative('result_margin')
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: .isComplete('season')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: .isNonNegative('target_overs')
      status: true
      reason_if_failed: ''
      level: error
  target_runs:
    code:
    - suggestion: .isNonNegative('target_runs')
      status: true
      reason_if_failed: ''
      level: error
  team1_vs_team2:
    code:
    - suggestion: .satisfies('team1 != team2', 'team1_not_equal_team2')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['field', 'bat'])
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: '.hasCompleteness(''winner'', lambda v: v >= 0.995)'
      status: false
      reason_if_failed: 'Constraint ''.hasCompleteness(''winner'', lambda v: v >=
        0.995)'' failed on data sample: Value: 0.989100817438692 does not meet the
        constraint requirement!'
      level: error
  winner_is_team_participant:
    code:
    - suggestion: .satisfies('(winner = team1) OR (winner = team2) OR (winner IS NULL)',
        'winner_is_team1_or_team2_or_null')
      status: false
      reason_if_failed: 'Constraint ''.satisfies(''(winner = team1) OR (winner = team2)
        OR (winner IS NULL)'', ''winner_is_team1_or_team2_or_null'')'' failed on data
        sample: Value: 0.9700272479564033 does not meet the constraint requirement!'
      level: error
