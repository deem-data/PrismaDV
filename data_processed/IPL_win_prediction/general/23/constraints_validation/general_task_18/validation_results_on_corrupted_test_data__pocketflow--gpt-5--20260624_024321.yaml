results:
  date:
    code:
    - suggestion: .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('date')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .hasDataType('id', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isNonNegative('id')
      status: true
      reason_if_failed: ''
      level: error
  match_type:
    code:
    - suggestion: .isContainedIn('match_type', ['League', 'Qualifier 1', 'Qualifier
        2', 'Eliminator', 'Final', 'Semi Final', 'Elimination Final'])
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: .isContainedIn('method', ['D/L'], where='method IS NOT NULL')
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isContainedIn(''method'',
        [''D/L''], where=''method IS NOT NULL'')'': Check.isContainedIn() got an unexpected
        keyword argument ''where'''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .isComplete('result_margin', where="result IN ('runs','wickets')")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isComplete(''result_margin'',
        where="result IN (''runs'',''wickets'')")'': Check.isComplete() got an unexpected
        keyword argument ''where'''
      level: error
    - suggestion: .isPositive('result_margin', where="result IN ('runs','wickets')")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isPositive(''result_margin'',
        where="result IN (''runs'',''wickets'')")'': Check.isPositive() got an unexpected
        keyword argument ''where'''
      level: error
    - suggestion: .satisfies("(result <> 'no result') OR (result_margin IS NULL)",
        'margin_null_on_no_result')
      status: true
      reason_if_failed: ''
      level: error
  season:
    code:
    - suggestion: .hasDataType('season', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isNonNegative('season')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y', 'N'])
      status: true
      reason_if_failed: ''
      level: error
  target_overs:
    code:
    - suggestion: .isPositive('target_overs', where="method = 'D/L'")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isPositive(''target_overs'',
        where="method = ''D/L''")'': Check.isPositive() got an unexpected keyword
        argument ''where'''
      level: error
  target_runs:
    code:
    - suggestion: .isPositive('target_runs', where="method = 'D/L'")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isPositive(''target_runs'',
        where="method = ''D/L''")'': Check.isPositive() got an unexpected keyword
        argument ''where'''
      level: error
  team1:
    code:
    - suggestion: .isComplete('team1')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies('team1 <> team2', 'teams_distinct')
      status: true
      reason_if_failed: ''
      level: error
  team2:
    code:
    - suggestion: .isComplete('team2')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat', 'field'])
      status: true
      reason_if_failed: ''
      level: error
  toss_winner:
    code:
    - suggestion: .isComplete('toss_winner')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies('(toss_winner = team1) OR (toss_winner = team2)', 'toss_winner_in_teams')
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: .isComplete('winner', where="result <> 'no result'")
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.isComplete(''winner'',
        where="result <> ''no result''")'': Check.isComplete() got an unexpected keyword
        argument ''where'''
      level: error
    - suggestion: .satisfies("(result = 'no result') OR (winner = team1) OR (winner
        = team2)", 'winner_in_teams_or_no_result')
      status: false
      reason_if_failed: 'Constraint ''.satisfies("(result = ''no result'') OR (winner
        = team1) OR (winner = team2)", ''winner_in_teams_or_no_result'')'' failed
        on data sample: Value: 0.9700272479564033 does not meet the constraint requirement!'
      level: error
