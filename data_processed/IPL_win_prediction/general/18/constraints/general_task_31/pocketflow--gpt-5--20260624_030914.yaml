constraints:
  date:
    code:
    - - .containsPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      - Invalid
    assumptions: []
    column_name: date
  id:
    code:
    - - .isComplete('id')
      - Valid
    - - .isNonNegative('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isContainedIn('match_type', ['League', 'Eliminator', 'Qualifier 1', 'Qualifier
        2', 'Final', 'Semi Final', 'Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  method:
    code:
    - - .isContainedIn('method', ['D/L'])
      - Valid
    assumptions: []
    column_name: method
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs', 'wickets', 'tie', 'no result'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isNonNegative('result_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y', 'N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .isNonNegative('target_overs')
      - Valid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .isNonNegative('target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1_vs_team2:
    code:
    - - .satisfies('team1 != team2', 'team1_not_equal_team2')
      - Valid
    assumptions: []
    column_name: team1_vs_team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['field', 'bat'])
      - Valid
    assumptions: []
    column_name: toss_decision
  winner:
    code:
    - - '.hasCompleteness(''winner'', lambda v: v >= 0.995)'
      - Valid
    assumptions: []
    column_name: winner
  winner_is_team_participant:
    code:
    - - .satisfies('(winner = team1) OR (winner = team2) OR (winner IS NULL)', 'winner_is_team1_or_team2_or_null')
      - Valid
    assumptions: []
    column_name: winner_is_team_participant
