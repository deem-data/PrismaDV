constraints:
  date:
    code:
    - - .hasPattern('date', '^\d{4}-\d{2}-\d{2}$')
      - Valid
    - - .isComplete('date')
      - Valid
    assumptions: []
    column_name: date
  id:
    code:
    - - .hasUniqueness(['id'])
      - Invalid
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
  match_type:
    code:
    - - .isComplete('match_type')
      - Valid
    - - .isContainedIn('match_type', ['League','Eliminator','Qualifier 1','Qualifier
        2','Final','Semi Final','Elimination Final'])
      - Valid
    assumptions: []
    column_name: match_type
  result:
    code:
    - - .isComplete('result')
      - Valid
    - - .isContainedIn('result', ['runs','wickets','no result','tie'])
      - Valid
    assumptions: []
    column_name: result
  result_margin:
    code:
    - - .isNonNegative('result_margin')
      - Valid
    - - .satisfies("(result IN ('runs','wickets') AND result_margin > 0) OR (result
        NOT IN ('runs','wickets'))", 'valid_result_margin')
      - Valid
    assumptions: []
    column_name: result_margin
  season:
    code:
    - - .isComplete('season')
      - Valid
    - - .isNonNegative('season')
      - Valid
    assumptions: []
    column_name: season
  super_over:
    code:
    - - .isComplete('super_over')
      - Valid
    - - .isContainedIn('super_over', ['Y','N'])
      - Valid
    assumptions: []
    column_name: super_over
  target_overs:
    code:
    - - .isNonNegative('target_overs')
      - Valid
    - - .satisfies('target_overs <= 20', 'overs_limit_20')
      - Invalid
    assumptions: []
    column_name: target_overs
  target_runs:
    code:
    - - .isNonNegative('target_runs')
      - Valid
    assumptions: []
    column_name: target_runs
  team1:
    code:
    - - .isComplete('team1')
      - Valid
    - - .satisfies('team1 <> team2', 'no_self_play')
      - Valid
    assumptions: []
    column_name: team1
  team2:
    code:
    - - .isComplete('team2')
      - Valid
    assumptions: []
    column_name: team2
  toss_decision:
    code:
    - - .isComplete('toss_decision')
      - Valid
    - - .isContainedIn('toss_decision', ['bat','field'])
      - Valid
    assumptions: []
    column_name: toss_decision
  toss_winner:
    code:
    - - .isComplete('toss_winner')
      - Valid
    - - .satisfies('toss_winner = team1 OR toss_winner = team2', 'valid_toss_winner')
      - Valid
    assumptions: []
    column_name: toss_winner
  winner:
    code:
    - - .satisfies("(result IN ('runs','wickets') AND (winner = team1 OR winner =
        team2)) OR (result NOT IN ('runs','wickets'))", 'winner_in_teams_or_null')
      - Valid
    assumptions: []
    column_name: winner
