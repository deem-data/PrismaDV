results:
  date:
    code:
    - suggestion: .hasPattern('date', r'^\d{4}-\d{2}-\d{2}$')
      status: true
      reason_if_failed: ''
      level: error
  id:
    code:
    - suggestion: .isComplete('id')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isUnique('id')
      status: true
      reason_if_failed: ''
      level: error
  method:
    code:
    - suggestion: '.hasCompleteness(''method'', lambda v: v <= 0.1)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('method', ['D/L'])
      status: true
      reason_if_failed: ''
      level: error
  result:
    code:
    - suggestion: .isComplete('result')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('result', ['runs','wickets','tie','no result'])
      status: true
      reason_if_failed: ''
      level: error
  result_margin:
    code:
    - suggestion: .satisfies("NOT (result IN (\'runs\',\'wickets\')) OR result_margin
        IS NOT NULL", 'margin_present_for_decided')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("result <> 'runs' OR (result_margin >= 1)", 'positive_margin_for_runs')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .satisfies("result <> 'wickets' OR (result_margin >= 1 AND result_margin
        <= 10)", 'wickets_margin_between_1_and_10')
      status: true
      reason_if_failed: ''
      level: error
  super_over:
    code:
    - suggestion: .isComplete('super_over')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('super_over', ['Y','N'])
      status: true
      reason_if_failed: ''
      level: error
  team1:
    code:
    - suggestion: .isComplete('team1')
      status: true
      reason_if_failed: ''
      level: error
  team1_team2:
    code:
    - suggestion: .satisfies("team1 != team2", 'team1_team2_distinct')
      status: false
      reason_if_failed: 'Constraint ''.satisfies("team1 != team2", ''team1_team2_distinct'')''
        failed on data sample: Value: 0.9073569482288828 does not meet the constraint
        requirement!'
      level: error
  team2:
    code:
    - suggestion: .isComplete('team2')
      status: true
      reason_if_failed: ''
      level: error
  toss_decision:
    code:
    - suggestion: .isComplete('toss_decision')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isContainedIn('toss_decision', ['bat','field'])
      status: true
      reason_if_failed: ''
      level: error
  winner:
    code:
    - suggestion: .satisfies("NOT (result IN (\'runs\',\'wickets\')) OR (winner =
        team1 OR winner = team2)", 'winner_matches_decided_teams')
      status: false
      reason_if_failed: 'Constraint ''.satisfies("NOT (result IN (\''runs\'',\''wickets\''))
        OR (winner = team1 OR winner = team2)", ''winner_matches_decided_teams'')''
        failed on data sample: Value: 0.553133514986376 does not meet the constraint
        requirement!'
      level: error
