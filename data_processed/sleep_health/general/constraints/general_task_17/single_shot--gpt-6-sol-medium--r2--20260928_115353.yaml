constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('CAST(`Age` AS DOUBLE) BETWEEN 0 AND 120', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', '^[0-9]{2,3}/[0-9]{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('CAST(`Daily Steps` AS DOUBLE) >= 0', 'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('CAST(`Heart Rate` AS DOUBLE) > 0', 'valid_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) >= 0', 'valid_physical_activity')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 0 AND 10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) > 0 AND CAST(`Sleep Duration`
        AS DOUBLE) <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
