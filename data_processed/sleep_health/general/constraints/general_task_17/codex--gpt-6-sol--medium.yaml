prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    os.makedirs(args.output,\
  \ exist_ok=True)\n\n    df = pd.read_csv(input_csv)\n\n    # Normalize dtypes\n\
  \    num_cols = ['Age', 'Sleep Duration', 'Quality of Sleep', 'Physical Activity\
  \ Level', 'Stress Level', 'Heart Rate',\n                'Daily Steps']\n    for\
  \ c in num_cols:\n        if c in df.columns:\n            df[c] = pd.to_numeric(df[c],\
  \ errors='coerce')\n    bp_parts = df['Blood Pressure'].astype(str).str.extract(r'^(\\\
  d{2,3})/(\\d{2,3})$')\n    df['bp_sys'] = bp_parts[0].astype(int)\n    df['bp_dia']\
  \ = bp_parts[1].astype(int)\n\n    # BP risk\n    conds_bp = [\n        (df['bp_sys']\
  \ >= 180) | (df['bp_dia'] >= 110),\n        (df['bp_sys'] >= 160) | (df['bp_dia']\
  \ >= 100),\n        (df['bp_sys'] >= 140) | (df['bp_dia'] >= 90),\n        (df['bp_sys']\
  \ >= 130) | (df['bp_dia'] >= 85)\n    ]\n    choices_bp = [35, 28, 18, 6]\n    df['bp_risk']\
  \ = np.select(conds_bp, choices_bp, default=0)\n    rank_steps = df['Daily Steps'].rank(method='average',\
  \ pct=True)\n    rank_pa = df['Physical Activity Level'].rank(method='average',\
  \ pct=True)\n    df['activity_index'] = 0.5 * (rank_steps + rank_pa)\n    df['activity_protect']\
  \ = 22.0 * df['activity_index']\n    df['vigorous_bonus'] = ((df['Daily Steps']\
  \ >= 10000) & (df['Physical Activity Level'] >= 60)).astype(int) * 5.0\n    df['sq_factor']\
  \ = df['Stress Level'] * (10 - df['Quality of Sleep']) / 10.0\n    df['sq_risk']\
  \ = 2.8 * df['sq_factor']\n\n    # Sleep duration risk\n    dur = df['Sleep Duration']\n\
  \    dur_conds = [\n        dur < 5,\n        (dur >= 5) & (dur < 6),\n        (dur\
  \ >= 6) & (dur < 7),\n        (dur > 9)\n    ]\n    dur_vals = [22, 12, 6, 6]\n\
  \    df['duration_risk'] = np.select(dur_conds, dur_vals, default=0)\n\n    # BMI\
  \ risk\n    bmi_map = {\n        'Obese': 12,\n        'Overweight': 6,\n      \
  \  'Normal': 0,\n        'Normal Weight': 0\n    }\n    df['bmi_risk'] = df['BMI\
  \ Category'].map(bmi_map).fillna(0)\n\n    # Heart rate risk (resting)\n    hr =\
  \ df['Heart Rate']\n    hr_conds = [hr >= 90, (hr >= 80) & (hr < 90), (hr >= 70)\
  \ & (hr < 80)]\n    hr_vals = [6, 4, 2]\n    df['hr_risk'] = np.select(hr_conds,\
  \ hr_vals, default=0)\n\n    # Age risk\n    age = df['Age']\n    age_conds = [age\
  \ >= 65, (age >= 50) & (age < 65)]\n    age_vals = [5, 3]\n    df['age_risk'] =\
  \ np.select(age_conds, age_vals, default=0)\n\n    # Sleep disorder risk\n    sd\
  \ = df['Sleep Disorder'].fillna('')\n    df['sd_risk'] = np.select([sd.str.contains('Sleep\
  \ Apnea', case=False), sd.str.contains('Insomnia', case=False)],\n             \
  \                 [16, 10], default=0)\n\n    # Aggregate risk, subtracting activity\
  \ protection and bonus\n    df['raw_risk'] = (\n            df['bp_risk'] + df['sq_risk']\
  \ + df['duration_risk'] + df['bmi_risk'] + df['hr_risk'] + df['age_risk'] + df[\n\
  \        'sd_risk']\n            - df['activity_protect'] - df['vigorous_bonus']\n\
  \    )\n\n    df['risk_score'] = df['raw_risk'].clip(lower=0, upper=100).round(2)\n\
  \n    # Prioritization\n    df['priority_bucket'] = pd.cut(df['risk_score'], bins=[-0.01,\
  \ 25, 50, 75, 100],\n                                   labels=['Low', 'Moderate',\
  \ 'High', 'Critical'])\n    df_sorted = df.sort_values('risk_score', ascending=False).reset_index(drop=True)\n\
  \n    out_cols = [\n        'Person ID', 'risk_score', 'priority_bucket',\n    \
  \    'bp_risk', 'sq_risk', 'duration_risk', 'bmi_risk', 'hr_risk', 'age_risk', 'sd_risk',\n\
  \        'activity_protect', 'vigorous_bonus'\n    ]\n    scores_path = os.path.join(args.output,\
  \ 'sleep_risk_scores.csv')\n    df_sorted[out_cols].to_csv(scores_path, index=False)\n\
  \n    top_path = os.path.join(args.output, 'priority_members.csv')\n    df_sorted[['Person\
  \ ID', 'risk_score', 'priority_bucket']].head(50).to_csv(top_path, index=False)\n\
  \n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program is on disk\
  \ at `./code/general_task_17.py`, so you can run it against the\nstaged table, step\
  \ through it, or search it, rather than working from the\nlisting alone.\n\n# The\
  \ data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id': 121,\
  \ 'Person ID': 294, 'Gender': 'Female', 'Age': 50, 'Occupation': 'Nurse', 'Sleep\
  \ Duration': 6.0, 'Quality of Sleep': 6, 'Physical Activity Level': 90, 'Stress\
  \ Level': 8, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate':\
  \ 75, 'Daily Steps': 10000, 'Sleep Disorder': 'Sleep Apnea'}, {'id': 5, 'Person\
  \ ID': 373, 'Gender': 'Female', 'Age': 59, 'Occupation': 'Nurse', 'Sleep Duration':\
  \ 8.1, 'Quality of Sleep': 9, 'Physical Activity Level': 75, 'Stress Level': 3,\
  \ 'BMI Category': 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate': 68, 'Daily\
  \ Steps': 7000, 'Sleep Disorder': 'Sleep Apnea'}, {'id': 82, 'Person ID': 94, 'Gender':\
  \ 'Male', 'Age': 35, 'Occupation': 'Lawyer', 'Sleep Duration': 7.4, 'Quality of\
  \ Sleep': 7, 'Physical Activity Level': 60, 'Stress Level': 5, 'BMI Category': 'Obese',\
  \ 'Blood Pressure': '135/88', 'Heart Rate': 84, 'Daily Steps': 3300, 'Sleep Disorder':\
  \ 'Sleep Apnea'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
