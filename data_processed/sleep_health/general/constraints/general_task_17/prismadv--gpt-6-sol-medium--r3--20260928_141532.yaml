    assumptions:
    - text: Every 'Blood Pressure' value should contain a two- or three-digit systolic
        reading and a two- or three-digit diastolic reading separated by '/', with
        systolic pressure greater than diastolic pressure. Both readings must be extractable
        as integers for the paired blood-pressure risk rules. This can be checked
        with a row-level predicate that validates the format and compares the two
        extracted numbers.
      sources:
      - start_line: 25
        end_line: 27
        file: ''
      - start_line: 30
        end_line: 37
        file: ''
      uid: 1b655fff-a1df-42d5-8a49-e16ec1bc64f5
    - text: For every record, both 'Daily Steps' and 'Physical Activity Level' should
        be present and parseable as numbers. The code combines their percentile ranks
        into one activity index; a missing or unparseable value in either column makes
        that record's activity protection, and consequently its risk score, null.
        A Deequ row-level constraint can check that numeric casts of both columns
        are non-null.
      sources:
      - start_line: 20
        end_line: 24
        file: ''
      - start_line: 38
        end_line: 42
        file: ''
      - start_line: 84
        end_line: 90
        file: ''
      uid: 0595d2e9-81e4-48d3-819c-8bc809f52674
    - text: For every record, 'Stress Level' and 'Quality of Sleep' should both be
        present and numeric, and 'Quality of Sleep' should not exceed 10. Their joint
        calculation, `Stress Level * (10 - Quality of Sleep) / 10`, otherwise produces
        a null risk contribution or, when quality exceeds 10, a negative one. A row-level
        constraint can require successful numeric casts for both columns and `Quality
        of Sleep <= 10`.
      sources:
      - start_line: 20
        end_line: 24
        file: ''
      - start_line: 43
        end_line: 44
        file: ''
      - start_line: 84
        end_line: 88
