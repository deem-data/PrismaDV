    - text: For each record, 'Daily Steps' and 'Physical Activity Level' should both
        be nonnegative. Negative values in either measure would be physically implausible
        inputs to the joint activity index and the vigorous-activity bonus. A row-level
        constraint can require `Daily Steps >= 0 AND Physical Activity Level >= 0`.
      sources:
