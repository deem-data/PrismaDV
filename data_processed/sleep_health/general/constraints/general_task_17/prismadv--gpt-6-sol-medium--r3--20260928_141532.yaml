    assumptions:
    - text: Both 'Daily Steps' and 'Physical Activity Level' should be present and
        convertible to numbers on every record. Otherwise, numeric coercion can produce
        nulls, making the combined activity index and activity protection null and
        potentially leaving the risk score unassigned. A joint constraint can require
        `Daily Steps IS NOT NULL AND Physical Activity Level IS NOT NULL` after numeric
        conversion for every record.
