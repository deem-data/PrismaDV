    - text: 'The two activity measures should be directionally consistent across the
        dataset: higher ''Daily Steps'' should generally correspond to higher ''Physical
        Activity Level''. Because the activity index gives their percentile ranks
        equal weight, this can be checked with a positive correlation between the
        two columns'' percentile ranks, without requiring every individual record
        to follow a strict ordering.'
      sources:
      - start_line: 38
        end_line: 41
        file: ''
