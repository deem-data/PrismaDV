constraints:
  Age:
    code:
    - - .satisfies("CAST(`Age` AS DOUBLE) IS NOT NULL", 'numeric_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'", 'valid_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .satisfies("CAST(`Daily Steps` AS DOUBLE) IS NOT NULL", 'numeric_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .satisfies("CAST(`Heart Rate` AS DOUBLE) IS NOT NULL", 'numeric_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .satisfies("CAST(`Physical Activity Level` AS DOUBLE) IS NOT NULL", 'numeric_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .satisfies("CAST(`Quality of Sleep` AS DOUBLE) IS NOT NULL", 'numeric_quality_of_sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .satisfies("CAST(`Sleep Duration` AS DOUBLE) IS NOT NULL", 'numeric_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .satisfies("CAST(`Stress Level` AS DOUBLE) IS NOT NULL", 'numeric_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
