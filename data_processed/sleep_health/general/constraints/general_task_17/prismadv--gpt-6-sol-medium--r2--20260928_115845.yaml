        CAST(`Age` AS DOUBLE) IS NOT NULL AND CAST(`Sleep Duration` AS DOUBLE) IS
        NOT NULL AND CAST(`Quality of Sleep` AS DOUBLE) IS NOT NULL AND CAST(`Physical
        Activity Level` AS DOUBLE) IS NOT NULL AND CAST(`Stress Level` AS DOUBLE)
