    - suggestion: .satisfies("`BMI Category` IN ('Obese', 'Overweight', 'Normal',
        'Normal Weight') AND (`Sleep Disorder` IS NULL OR LOWER(`Sleep Disorder`)
        LIKE '%sleep apnea%' OR LOWER(`Sleep Disorder`) LIKE '%insomnia%')", "recognized_bmi_and_sleep_disorder")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e038aadf-7b92-45e6-8956-c72051a8284b
      source_assumptions:
      - ddcc327e-61b6-46d4-a43c-c4efcdaa55fe
    assumptions:
    - text: For every record, 'Blood Pressure' should match the two-number systolic/diastolic
        format, and 'Age', 'Sleep Duration', 'Quality of Sleep', 'Physical Activity
        Level', 'Stress Level', 'Heart Rate', and 'Daily Steps' should all be present
        and convertible to numbers. Otherwise, blood-pressure parsing can fail, or
        a missing numeric value can silently suppress a risk component or make the
        combined score null. This can be checked with a row-level constraint requiring
        the blood-pressure pattern and non-null numeric casts for all seven columns.
      sources:
      - start_line: 20
        end_line: 27
        file: ''
      - start_line: 38
        end_line: 55
        file: ''
      - start_line: 67
        end_line: 76
        file: ''
      - start_line: 84
        end_line: 88
        file: ''
      uid: 32ee0d4c-14fd-416d-b002-07ecff064cf3
    - text: '''Daily Steps'' and ''Physical Activity Level'' should both be non-negative
        on each record. They are combined into an activity-protection index and jointly
        determine the vigorous-activity bonus; negative values would make those calculations
        misleading. A row-level constraint can require `Daily Steps >= 0 AND Physical
        Activity Level >= 0`.'
      sources:
      - start_line: 38
        end_line: 42
        file: ''
      uid: 8895f1c4-aee4-46f7-8ffb-43b90367c777
    - text: For each record, 'Stress Level' should be non-negative and 'Quality of
        Sleep' should be between 0 and 10, inclusive. Their joint formula assumes
        that `Stress Level * (10 - Quality of Sleep) / 10` is a non-negative risk
        contribution. A row-level constraint can require `Stress Level >= 0 AND Quality
        of Sleep BETWEEN 0 AND 10`.
      sources:
      - start_line: 43
        end_line: 44
        file: ''
      - start_line: 84
        end_line: 88
        file: ''
      uid: a5d5e3f0-1b72-44cd-9dff-bfe5941ea862
    - text: For each record, 'BMI Category' should be one of 'Obese', 'Overweight',
        'Normal', or 'Normal Weight', while 'Sleep Disorder' should be null or identify
        Sleep Apnea or Insomnia. These two categorical fields contribute to the same
        aggregate score; an unrecognized value in either field silently receives zero
        risk. A row-level constraint can check both permitted domains together.
      sources:
      - start_line: 58
        end_line: 64
        file: ''
      - start_line: 79
        end_line: 88
        file: ''
      uid: ddcc327e-61b6-46d4-a43c-c4efcdaa55fe
