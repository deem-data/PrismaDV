constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('`Age` BETWEEN 0 AND 120', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', r'^[0-9]{2,3}/[0-9]{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` BETWEEN 0 AND 100000', 'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('`Heart Rate` BETWEEN 30 AND 220', 'valid_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` BETWEEN 0 AND 100', 'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 1 AND 10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` BETWEEN 0 AND 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('`Stress Level` BETWEEN 1 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
