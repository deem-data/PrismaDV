      - start_line: 49
        end_line: 51
        file: ''
      - start_line: 67
        end_line: 73
        file: ''
      - start_line: 85
        end_line: 85
        file: ''
      uid: 1a6febed-126d-4dd8-9180-f7a3003906ea
    - text: 'The ''Daily Steps'' column should contain non-negative values (steps
        >= 0), as np.log1p requires inputs greater than -1 and line 29 checks the
        expected valid range as (steps >= 0) & (steps <= 50000). We could represent
        this assumption as a deequ constraint like this: .satisfies("`Daily Steps`
        >= 0", "Non-negative Daily Steps", lambda x: x == 1.0)'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 49
        end_line: 49
        file: ''
      uid: effdb912-9659-4eb6-84a3-4a3030b67188
    - text: 'The ''Daily Steps'' column values should ideally not exceed 50000 to
        keep the normalized steps index bounded between 0 and 1 via np.log1p(df[''Daily
        Steps'']) / np.log(50001). We could represent this assumption as a deequ constraint
