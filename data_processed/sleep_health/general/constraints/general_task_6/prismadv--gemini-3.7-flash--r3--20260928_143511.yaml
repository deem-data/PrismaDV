  '["Daily Steps","Physical Activity Level"]':
    code: []
    assumptions:
    - text: '''Physical Activity Level'' and ''Daily Steps'' are correlated indicators
        of physical activity that are evaluated via Spearman rank correlation and
        linearly combined into ''sedentary_index''. There is an assumption that ''Physical
        Activity Level'' and ''Daily Steps'' exhibit a positive correlation across
        records. We could represent this assumption as a Deequ constraint like this:
        .hasCorrelation("Physical Activity Level", "Daily Steps", _ >= 0.0)'
      sources:
      - start_line: 23
        end_line: 31
        file: ''
      - start_line: 49
        end_line: 51
        file: ''
      uid: e55cda96-1299-4df9-aac1-894535998ec6
    - text: Both 'Physical Activity Level' and 'Daily Steps' are combined directly
        to compute 'sedentary_index' and 'base_priority' without imputation. For each
        record, if one activity metric is present, both should be non-null to prevent
        missing values in 'sedentary_index' and downstream output scores.
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      - start_line: 67
        end_line: 73
        file: ''
      uid: 29795d0a-4aee-489e-a649-e6b43fe02329
  '["Quality of Sleep","Sleep Duration"]':
    code: []
    assumptions:
    - text: 'The columns ''Sleep Duration'' and ''Quality of Sleep'' must both be
        non-null and numeric for each record, as they are combined directly without
        null handling to compute ''sleep_need_index'' (which in turn determines eligibility
        and priority score). We could represent this assumption as a Deequ constraint
        like: .hasCompleteness(''Sleep Duration'', _ == 1.0).hasCompleteness(''Quality
        of Sleep'', _ == 1.0)'
      sources:
