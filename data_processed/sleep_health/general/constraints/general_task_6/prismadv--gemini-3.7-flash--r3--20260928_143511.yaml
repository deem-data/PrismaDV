      source_assumptions:
      - 70409a1f-944c-4f3c-8e75-fdd24870dc4f
    assumptions:
    - text: 'The ''Daily Steps'' column should not contain null values, as it is used
        directly in mathematical operations such as np.log1p to compute the ''sedentary_index''
        and downstream ''priority_score'' without any missing value imputation or
        filtering. We could represent this assumption as a deequ constraint like this:
        .isComplete("Daily Steps")'
