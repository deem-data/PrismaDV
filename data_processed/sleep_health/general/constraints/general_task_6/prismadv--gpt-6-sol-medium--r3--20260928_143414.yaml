      - b8ef1c70-f526-4ca1-96c9-08e9404e80aa
    - suggestion: .satisfies("CASE WHEN `Blood Pressure` RLIKE '^[0-9]+/[0-9]+$' THEN
        CAST(split(`Blood Pressure`, '/')[1] AS DOUBLE) > 0 AND CAST(split(`Blood
        Pressure`, '/')[0] AS DOUBLE) > CAST(split(`Blood Pressure`, '/')[1] AS DOUBLE)
