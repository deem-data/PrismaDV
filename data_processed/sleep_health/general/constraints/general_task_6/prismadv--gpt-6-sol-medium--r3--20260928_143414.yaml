      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b700a88a-1c52-40de-bcda-6eede13fa640
      source_assumptions:
      - 11b61f34-bf1d-4167-a34b-4e44f1b01b65
    assumptions:
    - text: The input must contain a 'Blood Pressure' column, and every row should
        have a non-null value. The code splits and converts both components to integers
        without handling missing values.
      sources:
      - start_line: 15
        end_line: 18
        file: ''
      uid: 391aa22d-16d0-4ced-abb9-2613bfda1129
    - text: Every 'Blood Pressure' value should contain exactly two base-10 integer
        components separated by a single '/', such as '120/80'. Neither component
        should be empty or contain nonnumeric characters. Extra components should
        be rejected even though the code would ignore them.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: b8ef1c70-f526-4ca1-96c9-08e9404e80aa
    - text: The first component should be a positive systolic pressure, and the second
        should be a positive diastolic pressure lower than the systolic pressure.
        Otherwise, the blood-pressure risk categories may be clinically meaningless.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 34
        end_line: 39
        file: ''
      uid: 11b61f34-bf1d-4167-a34b-4e44f1b01b65
