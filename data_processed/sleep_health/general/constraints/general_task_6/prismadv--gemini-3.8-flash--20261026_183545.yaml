        end_line: 31
        file: ''
      uid: 825b4c13-3c77-41aa-8528-e35fc05d2c2d
    - text: '''Physical Activity Level'' and ''Daily Steps'' must both be non-null
        for each record because they are combined directly without missing value handling
        to compute ''sedentary_index'', which directly impacts downstream priority
        scoring.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Physical Activity Level` IS NOT NULL AND `Daily Steps` IS NOT
        NULL", "activity_columns_not_null", _ == 1.0)'
