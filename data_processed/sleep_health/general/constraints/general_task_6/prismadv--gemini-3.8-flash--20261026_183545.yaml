        end_line: 54
        file: ''
      uid: 5182cac6-0f54-479c-92f6-f71e209bc862
    - text: 'The ''Stress Level'' column is expected to have values primarily between
        3 and 8 corresponding to the normalization formula ((Stress Level - 3.0) /
        5.0). We could represent this assumption as a deequ constraint like this:
        .satisfies("CASE WHEN `Stress Level` >= 3 AND `Stress Level` <= 8 THEN 1 ELSE
        0 END", "Stress Level Range", lambda x: x == 1.0)'
      sources:
