    - text: '''Sleep Duration'' and ''Quality of Sleep'' should have a positive correlation
        across the dataset, reflecting the expected clinical relationship where adequate
        sleep duration corresponds to higher subjective sleep quality. This can be
        expressed as a Deequ constraint: .hasCorrelation(''Sleep Duration'', ''Quality
        of Sleep'', _ > 0.0)'
      sources:
      - start_line: 42
        end_line: 46
        file: ''
