        file: ''
      - start_line: 57
        end_line: 58
        file: ''
      uid: 8a7bf72a-f79a-43e8-a492-aaeab089a686
  Sleep Duration:
    code:
    - suggestion: .isComplete('Sleep Duration')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f179db73-527e-400d-87ed-953d33fedaed
      source_assumptions:
      - 63a2954b-7930-4889-90e8-ca43f098c896
    - suggestion: '.satisfies("`Sleep Duration` > 2.99", "Sleep Duration > 2.99",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7a017bda-a5cc-43b7-afb7-0fceec4a19e2
      source_assumptions:
      - ab710c20-cc47-4003-9eef-3d8f27a4cd54
    - suggestion: '.satisfies("`Sleep Duration` <= 14.01", "Sleep Duration <= 14.01",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: dc8e4d20-ddbc-478e-ae17-f097cce421db
      source_assumptions:
      - ff88ac3f-582a-4e44-83f2-826506a02abf
    assumptions:
    - text: The 'Sleep Duration' column should not contain null values, as it is used
        directly in mathematical operations such as logarithm, square root, and threshold
        comparisons without handling missing values.
      sources:
      - start_line: 21
        end_line: 22
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      uid: 63a2954b-7930-4889-90e8-ca43f098c896
    - text: 'The ''Sleep Duration'' column values must be strictly greater than 2.99,
        because the code computes `np.log(df[''Sleep Duration''] - 2.99)`. Values
        less than or equal to 2.99 would result in undefined logarithm values (-inf
        or NaN). We could represent this assumption as a deequ constraint: .satisfies("`Sleep
        Duration` > 2.99", "Sleep Duration > 2.99", lambda x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      uid: ab710c20-cc47-4003-9eef-3d8f27a4cd54
    - text: 'The ''Sleep Duration'' column values must be less than or equal to 14.01,
        because the code computes `np.sqrt(14.01 - df[''Sleep Duration''])`. Values
        greater than 14.01 would result in negative inputs to the square root function,
        generating NaN. We could represent this assumption as a deequ constraint:
        .satisfies("`Sleep Duration` <= 14.01", "Sleep Duration <= 14.01", lambda
        x: x == 1.0)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: ff88ac3f-582a-4e44-83f2-826506a02abf
