constraints:
  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c4c41ee1-3b5e-4eb5-9f68-06e866c461cd
      source_assumptions:
      - 7b05c215-39c0-48f7-a256-78d5b8daab03
    - suggestion: .hasPattern('Blood Pressure', r'^\d+/\d+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b139bc19-ce3d-4a51-95a1-207e576e98fa
      source_assumptions:
      - f0ed8041-94f2-4544-a70a-1958dc09726f
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values, because
        the code splits the string and casts the resulting parts directly to integers
        using ''.astype(int)'', which would raise an error if any values are null
        or non-finite. We could represent this assumption as a deequ constraint like
        this: .isComplete(''Blood Pressure'')'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: 7b05c215-39c0-48f7-a256-78d5b8daab03
    - text: 'The ''Blood Pressure'' column should follow the format of two integers
        separated by a slash (e.g., ''120/80''), matching the regular expression ''^\\d+/\\d+$'',
        because the code splits the column by ''/'' into two parts and converts each
        part to an integer using ''.astype(int)''. We could represent this assumption
        as a deequ constraint like this: .hasPattern(''Blood Pressure'', ''^\\d+/\\d+$'')'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: f0ed8041-94f2-4544-a70a-1958dc09726f
  Daily Steps:
    code:
    - suggestion: .satisfies('`Daily Steps` >= 0 AND `Daily Steps` <= 50000', 'Daily
        Steps Range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 93baf7ab-673b-45b3-8596-43925c93232c
      source_assumptions:
      - 71f6dfde-f47b-4ede-bdf6-f301dfb69aaa
    - suggestion: '.hasCompleteness(''Daily Steps'', lambda x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3e5a2560-ff70-48dd-ba03-bf12ffca3cc4
      source_assumptions:
      - d241b63d-44f6-4610-bfdd-2986cd9ce7df
    - suggestion: .hasDataType('Daily Steps', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e735ad24-6ad1-4826-b7cd-9d321e682109
      source_assumptions:
      - 4ae41c98-4b2b-497a-bfe5-1e97210f9b88
    assumptions:
    - text: 'The ''Daily Steps'' column should contain values between 0 and 50,000
        (inclusive), as the code checks for this range and normalizes steps using
        np.log1p(df[''Daily Steps'']) / np.log(50001). Values below 0 would also cause
        mathematical issues with log1p. We could represent this assumption as a deequ
        constraint like this: .satisfies("`Daily Steps` >= 0 AND `Daily Steps` <=
        50000", "Daily Steps Range", lambda x: x == 1.0)'
      sources:
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 49
        end_line: 49
        file: ''
      uid: 71f6dfde-f47b-4ede-bdf6-f301dfb69aaa
    - text: 'The ''Daily Steps'' column could contain null values because the code
        explicitly filters for non-null values with steps.notna() before computing
        the Spearman correlation. However, the column cannot be entirely null as valid
        values are needed for correlation and feature calculation. We could represent
        this assumption as a deequ constraint like this: .satisfies("CASE WHEN `Daily
        Steps` IS NOT NULL THEN 1 ELSE 0 END", "Non-empty Daily Steps", lambda x:
        x > 0)'
      sources:
      - start_line: 28
        end_line: 31
        file: ''
      uid: d241b63d-44f6-4610-bfdd-2986cd9ce7df
    - text: 'The ''Daily Steps'' column should be numeric to support range comparisons
        and mathematical transformations such as np.log1p. We could represent this
        assumption as a deequ constraint like this: .hasDataType(''Daily Steps'',
        ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 49
        end_line: 49
        file: ''
      uid: 4ae41c98-4b2b-497a-bfe5-1e97210f9b88
  Person ID:
    code:
    - suggestion: .isComplete('Person ID')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 7dba0748-0021-4c56-b4ab-68155056886b
      source_assumptions:
      - 6047c17d-2d21-4494-abe9-1667253dba11
    assumptions:
    - text: 'The ''Person ID'' column must be present and should not contain null
        values (completeness of 1.0), as it serves as the primary identifier retained
        in the output dataset ''sleep_coaching_scores.csv''. We could represent this
        assumption as a deequ constraint like this: .isComplete("Person ID")'
      sources:
      - start_line: 79
        end_line: 85
        file: ''
      uid: 6047c17d-2d21-4494-abe9-1667253dba11
  Physical Activity Level:
    code:
    - suggestion: '.satisfies("CASE WHEN `Physical Activity Level` >= 0 AND `Physical
        Activity Level` <= 100 THEN 1 ELSE 0 END", "Physical Activity Level Range",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bde87041-6bfb-4cea-b73c-c302eb525095
      source_assumptions:
      - 562330fb-40cc-481e-9966-a3b00bedca06
    - suggestion: '.satisfies("CASE WHEN `Physical Activity Level` = FLOOR(`Physical
        Activity Level`) THEN 1 ELSE 0 END", "Physical Activity Level Integer Check",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c81136bd-ef80-4b39-911c-40c0d53c694a
      source_assumptions:
      - af18a617-81a5-44f8-b662-43f2afc16cc0
    - suggestion: .isComplete("Physical Activity Level")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d78d65ef-7ed0-476b-b86f-0e35dc33652b
      source_assumptions:
      - ff3b41a3-e88f-4860-89f0-fe0f51317725
    assumptions:
    - text: 'The ''Physical Activity Level'' column should contain values within the
        range of 0 to 100, as indicated by the range validation condition `(pal >=
        0) & (pal <= 100)` and its subsequent normalization where the column is divided
        by 100.0. We could represent this assumption as a deequ constraint like this:
        .satisfies("CASE WHEN `Physical Activity Level` >= 0 AND `Physical Activity
        Level` <= 100 THEN 1 ELSE 0 END", "Physical Activity Level Range", lambda
        x: x == 1.0)'
      sources:
      - start_line: 26
        end_line: 26
        file: ''
      - start_line: 50
        end_line: 50
        file: ''
      uid: 562330fb-40cc-481e-9966-a3b00bedca06
    - text: 'The ''Physical Activity Level'' column is expected to consist of integer
        values, as indicated by the check `(pal == np.floor(pal))` verifying that
        each value equals its floor. We could represent this assumption as a deequ
        constraint like this: .satisfies("CASE WHEN `Physical Activity Level` = FLOOR(`Physical
        Activity Level`) THEN 1 ELSE 0 END", "Physical Activity Level Integer Check",
