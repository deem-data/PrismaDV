      sources:
      - start_line: 25
        end_line: 25
        file: ''
      uid: af18a617-81a5-44f8-b662-43f2afc16cc0
    - text: 'The ''Physical Activity Level'' column should not contain all null values,
        and requires valid non-null records to compute the Spearman correlation with
        ''Daily Steps'' and to calculate the downstream ''sedentary_index''. We could
        represent this assumption as a deequ constraint like this: .isComplete("Physical
        Activity Level")'
