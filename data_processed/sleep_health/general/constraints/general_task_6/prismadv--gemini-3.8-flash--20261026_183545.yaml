        represent this assumption as a deequ constraint like this: .isComplete("Quality
        of Sleep")'
      sources:
      - start_line: 45
        end_line: 46
        file: ''
      uid: e26f4c47-8b33-4dcc-b8eb-4284879b185b
    - text: 'The ''Quality of Sleep'' column must have a numeric data type (such as
        Integer or Float) because numeric clipping and arithmetic operations (- 6,
        / 3.0) are performed directly on it. We could represent this assumption as
        a deequ constraint like this: .hasDataType("Quality of Sleep", ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 45
        end_line: 45
        file: ''
