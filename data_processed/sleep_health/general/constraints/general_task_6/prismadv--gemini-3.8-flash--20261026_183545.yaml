    assumptions:
    - text: 'There should be a positive correlation between ''Physical Activity Level''
        and ''Daily Steps'', as both represent metrics of physical activity and are
        expected to increase together.

        We could represent this assumption as a deequ constraint like this:

        .hasCorrelation("Physical Activity Level", "Daily Steps", _ > 0.0)'
      sources:
