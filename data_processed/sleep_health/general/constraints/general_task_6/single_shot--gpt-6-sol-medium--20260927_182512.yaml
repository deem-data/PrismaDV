constraints:
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{1,3}/[0-9]{1,3}$'", 'blood_pressure_parseable')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` BETWEEN 0 AND 50000', 'daily_steps_range')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` BETWEEN 0 AND 100 AND `Physical Activity
        Level` = FLOOR(`Physical Activity Level`)', 'physical_activity_valid')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 1 AND 10', 'quality_of_sleep_scale')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` > 2.99 AND `Sleep Duration` <= 14.01', 'sleep_duration_transform_bounds')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('`Stress Level` BETWEEN 3 AND 8', 'stress_level_expected_scale')
      - Valid
    assumptions: []
    column_name: Stress Level
