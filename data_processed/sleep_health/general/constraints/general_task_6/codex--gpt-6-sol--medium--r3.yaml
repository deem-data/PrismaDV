prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\
  \    bp_parts = df['Blood Pressure'].str.split('/', expand=True)\n    df['bp_systolic']\
  \ = bp_parts[0].astype(int)\n    df['bp_diastolic'] = bp_parts[1].astype(int)\n\
  \    # Sleep duration checks used by downstream transforms\n    # Transforms that\
  \ require the above bounds\n    df['sleep_log_edge'] = np.log(df['Sleep Duration']\
  \ - 2.99)\n    df['sleep_upper_headroom'] = np.sqrt(14.01 - df['Sleep Duration'])\n\
  \    pal = df['Physical Activity Level']\n    pal_mask = pal.notna()\n    pal_int\
  \ = (pal == np.floor(pal))\n    pal_range = (pal >= 0) & (pal <= 100)\n    steps\
  \ = df['Daily Steps']\n    steps_mask = steps.notna()\n    steps_range = (steps\
  \ >= 0) & (steps <= 50000)\n    pair_mask_as = pal_mask & steps_mask\n    corr_pal_steps\
  \ = pal[pair_mask_as].corr(steps[pair_mask_as], method='spearman')\n    # Derived\
  \ features for scoring\n    # Blood pressure risk (vectorized)\n    sys_v = df['bp_systolic']\n\
  \    dia_v = df['bp_diastolic']\n    stage2 = (sys_v >= 140) | (dia_v >= 90)\n \
  \   stage1 = ((sys_v >= 130) & (sys_v <= 139)) | ((dia_v >= 80) & (dia_v <= 89))\n\
  \    elevated = ((sys_v >= 120) & (sys_v <= 129)) & (dia_v < 80)\n    df['bp_risk']\
  \ = np.select([stage2, stage1, elevated], [1.0, 0.7, 0.3], default=0.0)\n\n    #\
  \ Sleep need index from duration vs recommended band (7-9) and quality\n    dur\
  \ = df['Sleep Duration']\n    sleep_deficit = np.where(dur < 7.0, 7.0 - dur, np.where(dur\
  \ > 9.0, dur - 9.0, 0.0))\n    sleep_deficit_scaled = np.minimum(sleep_deficit /\
  \ 4.0, 1.0)\n    qos_norm = ((df['Quality of Sleep'].clip(6, 9) - 6) / 3.0).clip(0,\
  \ 1)\n    df['sleep_need_index'] = (0.6 * sleep_deficit_scaled + 0.4 * (1.0 - qos_norm)).clip(0,\
  \ 1)\n\n    # Activity shortfall index\n    steps_norm = np.log1p(df['Daily Steps'])\
  \ / np.log(50001)\n    pal_norm = df['Physical Activity Level'] / 100.0\n    df['sedentary_index']\
  \ = (1.0 - (0.5 * steps_norm + 0.5 * pal_norm)).clip(0, 1)\n\n    # Stress normalization\
  \ (expected business scale 0-1)\n    df['stress_norm'] = ((df['Stress Level'] -\
  \ 3.0) / 5.0).clip(0, 1)\n\n    # Sleep disorder flag boosts priority\n    disorder_flag\
  \ = df['Sleep Disorder'].notna()\n    df['disorder_boost'] = np.where(disorder_flag,\
  \ 0.1, 0.0)\n\n    # Eligibility and prioritization\n    df['eligible'] = (\n  \
  \          (df['sleep_need_index'] > 0.25) |\n            (df['bp_risk'] >= 0.3)\
  \ |\n            (df['stress_norm'] > 0.5)\n    )\n\n    base_priority = (\n   \
  \         0.45 * df['sleep_need_index'] +\n            0.20 * df['bp_risk'] +\n\
  \            0.20 * df['stress_norm'] +\n            0.15 * df['sedentary_index']\n\
  \    )\n    df['priority_score'] = (base_priority + df['disorder_boost']).clip(0,\
  \ 1)\n\n    # For ineligible members, set priority to 0 (used by downstream orchestration)\n\
  \    df.loc[~df['eligible'], 'priority_score'] = 0.0\n\n    # Output\n    out_cols\
  \ = [\n        'Person ID', 'eligible', 'priority_score',\n        'sleep_need_index',\
  \ 'sedentary_index', 'bp_risk', 'stress_norm'\n    ]\n    output_path = os.path.join(args.output,\
  \ 'sleep_coaching_scores.csv')\n    os.makedirs(args.output, exist_ok=True)\n  \
  \  df[out_cols].to_csv(output_path, index=False)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_6.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 73, 'Person ID': 332, 'Gender': 'Female',\
  \ 'Age': 53, 'Occupation': 'Engineer', 'Sleep Duration': 8.4, 'Quality of Sleep':\
  \ 9, 'Physical Activity Level': 30, 'Stress Level': 3, 'BMI Category': 'Normal',\
  \ 'Blood Pressure': '125/80', 'Heart Rate': 65, 'Daily Steps': 5000, 'Sleep Disorder':\
  \ nan}, {'id': 223, 'Person ID': 206, 'Gender': 'Male', 'Age': 43, 'Occupation':\
  \ 'Engineer', 'Sleep Duration': 7.7, 'Quality of Sleep': 8, 'Physical Activity Level':\
  \ 90, 'Stress Level': 5, 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart\
  \ Rate': 70, 'Daily Steps': 8000, 'Sleep Disorder': nan}, {'id': 85, 'Person ID':\
  \ 215, 'Gender': 'Male', 'Age': 43, 'Occupation': 'Engineer', 'Sleep Duration':\
  \ 7.8, 'Quality of Sleep': 8, 'Physical Activity Level': 90, 'Stress Level': 5,\
  \ 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart Rate': 70, 'Daily\
  \ Steps': 8000, 'Sleep Disorder': nan}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
