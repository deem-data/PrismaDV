      - start_line: 15
        end_line: 18
        file: ''
      uid: f42a7d24-aa04-49e2-a170-d8466079cec3
    - text: Every 'Blood Pressure' value should contain exactly two integer components
        separated by a slash, such as '120/80'. Both components must be convertible
        to integers; missing components or nonnumeric text would cause the conversion
        to fail. This can be validated with a format rule such as `^[0-9]+/[0-9]+$`.
