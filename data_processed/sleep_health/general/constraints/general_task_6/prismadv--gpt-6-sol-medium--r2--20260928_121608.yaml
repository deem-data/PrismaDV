      - start_line: 16
        end_line: 18
        file: ''
      uid: 14d7e4f1-bd4e-4bde-be7a-b68dcf122b1d
    - text: The first component should represent systolic pressure and the second
        diastolic pressure, with both being positive and systolic greater than diastolic.
        Otherwise, the threshold comparisons could produce misleading blood-pressure
