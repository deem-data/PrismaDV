        \ > 9.0, dur - 9.0, 0.0))\n    sleep_deficit_scaled = np.minimum(sleep_deficit\
        \ / 4.0, 1.0)\n    qos_norm = ((df['Quality of Sleep'].clip(6, 9) - 6) / 3.0).clip(0,\
        \ 1)\n    df['sleep_need_index'] = (0.6 * sleep_deficit_scaled + 0.4 * (1.0\
        \ - qos_norm)).clip(0, 1)\n\n    # Activity shortfall index\n    steps_norm\
        \ = np.log1p(df['Daily Steps']) / np.log(50001)\n    pal_norm = df['Physical\
        \ Activity Level'] / 100.0\n    df['sedentary_index'] = (1.0 - (0.5 * steps_norm\
        \ + 0.5 * pal_norm)).clip(0, 1)\n\n    # Stress normalization (expected business\
