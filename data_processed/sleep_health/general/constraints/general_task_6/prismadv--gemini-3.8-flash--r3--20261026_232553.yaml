      source_assumptions:
      - 31b65d52-2c6e-4ba4-88f0-86f92b7d57ea
    assumptions:
    - text: 'The ''Sleep Duration'' column should not contain null values, as mathematical
        operations (np.log, np.sqrt, comparisons) are performed directly on it without
        any missing value imputation or filtering.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Sleep Duration")'
      sources:
      - start_line: 21
        end_line: 22
        file: ''
      - start_line: 42
        end_line: 46
        file: ''
      uid: e02f4891-308d-4bc0-b3a2-8f35b1d94c27
    - text: 'The ''Sleep Duration'' column should be strictly greater than 2.99 (or
        at least 3.0), because the code calculates `np.log(df[''Sleep Duration'']
        - 2.99)`. Any value less than or equal to 2.99 would result in invalid log
        inputs (producing -inf or NaN).

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Sleep Duration` > 2.99", "Sleep Duration lower bound", lambda
        x: x == 1.0)'
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      uid: 7cf830a7-012d-4415-b949-a81b43d0b9fe
    - text: 'The ''Sleep Duration'' column should be less than or equal to 14.01 (or
        at most 14.0), because the code computes `np.sqrt(14.01 - df[''Sleep Duration''])`.
        Any value exceeding 14.01 would cause the square root of a negative number,
        resulting in NaN values.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Sleep Duration` <= 14.01", "Sleep Duration upper bound", lambda
        x: x == 1.0)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: 7ca06dce-ebfc-4099-9290-cb09c855b085
    - text: 'The ''Sleep Duration'' column should be of numeric (fractional/float)
        data type to allow continuous arithmetic operations, log transformations,
        square roots, and numerical comparisons.

        We could represent this assumption as a deequ constraint like this:

        .isDataType("Sleep Duration", org.apache.spark.sql.types.DoubleType)'
      sources:
      - start_line: 21
        end_line: 22
        file: ''
      - start_line: 42
        end_line: 44
        file: ''
      uid: 31b65d52-2c6e-4ba4-88f0-86f92b7d57ea
