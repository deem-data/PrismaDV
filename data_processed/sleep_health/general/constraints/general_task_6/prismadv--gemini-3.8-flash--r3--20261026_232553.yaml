      source_assumptions:
      - 1d835370-5927-4a45-bd66-702dec4d1cfb
    assumptions:
    - text: 'The ''Physical Activity Level'' column should have values between 0 and
        100 inclusive, as the code explicitly defines an expected range check `(pal
        >= 0) & (pal <= 100)` and normalizes the values by dividing by 100.0. We could
        represent this assumption as a deequ constraint like this: .satisfies("`Physical
        Activity Level` >= 0 AND `Physical Activity Level` <= 100", "Physical Activity
        Level Range", lambda x: x == 1.0)'
