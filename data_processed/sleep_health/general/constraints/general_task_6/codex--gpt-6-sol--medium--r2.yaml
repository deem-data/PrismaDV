        \ 1)\n    df['sleep_need_index'] = (0.6 * sleep_deficit_scaled + 0.4 * (1.0\
        \ - qos_norm)).clip(0, 1)\n\n    # Activity shortfall index\n    steps_norm\
        \ = np.log1p(df['Daily Steps']) / np.log(50001)\n    pal_norm = df['Physical\
