constraints:
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', r'^\d+/\d+$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` >= 0 AND `Daily Steps` <= 50000', 'daily_steps_valid_range')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` >= 0 AND `Physical Activity Level` <=
        100', 'pal_valid_range')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies('`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (\'Sleep Apnea\',
        \'Insomnia\')', 'valid_sleep_disorder_values')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` > 2.99 AND `Sleep Duration` < 14.01', 'valid_sleep_duration_bounds')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    assumptions: []
    column_name: Stress Level
