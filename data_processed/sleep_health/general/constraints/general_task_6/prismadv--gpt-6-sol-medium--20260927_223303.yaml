  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9eb98bc2-4df4-4edd-b36d-e0f7825a5e26
      source_assumptions:
      - 739d27a1-117e-4de5-96d5-90c05ba0b434
    - suggestion: .hasPattern('Blood Pressure', r'^[+-]?[0-9]+/[+-]?[0-9]+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: df8d4483-ec93-4889-9386-4465e47eb7aa
      source_assumptions:
      - 317c05b6-2017-4393-a802-197d5c943f03
    - suggestion: .satisfies("CASE WHEN `Blood Pressure` RLIKE '^[+-]?[0-9]+/[+-]?[0-9]+$'
        THEN CAST(split(`Blood Pressure`, '/')[0] AS BIGINT) > CAST(split(`Blood Pressure`,
        '/')[1] AS BIGINT) AND CAST(split(`Blood Pressure`, '/')[1] AS BIGINT) > 0
        ELSE FALSE END", 'positive_systolic_greater_than_diastolic')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3ce5fbd9-8d74-4df2-afa1-49af8f71019c
      source_assumptions:
      - efd1d0c0-ee9d-4cc2-88cc-dcb64223353b
    assumptions:
    - text: The 'Blood Pressure' column should contain no null values. The code does
        not fill missing values before splitting and converting both components to
        integers.
      sources:
      - start_line: 15
        end_line: 18
        file: ''
      uid: 739d27a1-117e-4de5-96d5-90c05ba0b434
    - text: Every 'Blood Pressure' value should contain exactly two nonempty, base-10
        integer components separated by one '/' (for example, '120/80'). Both components
        must be convertible to integers so the systolic and diastolic values can be
        used in the risk comparisons.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 34
        end_line: 39
        file: ''
      uid: 317c05b6-2017-4393-a802-197d5c943f03
    - text: The first component should be a positive systolic reading and the second
        a positive diastolic reading, with the systolic reading greater than the diastolic
        reading. Otherwise, the resulting blood-pressure risk score may not represent
        a valid reading.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 34
        end_line: 39
        file: ''
      uid: efd1d0c0-ee9d-4cc2-88cc-dcb64223353b
