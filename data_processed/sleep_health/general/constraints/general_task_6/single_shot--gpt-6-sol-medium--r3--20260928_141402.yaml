constraints:
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{1,3}/[0-9]{1,3}$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .satisfies('`Daily Steps` IS NOT NULL AND `Daily Steps` BETWEEN 0 AND 50000',
        'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .satisfies('`Physical Activity Level` IS NOT NULL AND `Physical Activity Level`
        = FLOOR(`Physical Activity Level`) AND `Physical Activity Level` BETWEEN 0
        AND 100', 'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia', 'Sleep
        Apnea')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` > 2.99 AND `Sleep Duration` < 14.01', 'sleep_duration_transform_bounds')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .satisfies('`Stress Level` IS NOT NULL AND `Stress Level` BETWEEN 3 AND 8',
        'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
