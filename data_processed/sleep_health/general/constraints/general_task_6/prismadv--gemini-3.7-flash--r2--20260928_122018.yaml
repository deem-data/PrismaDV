prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: b4563069-c5d7-4ce3-98c1-5614c5b8e42d
      source_assumptions:
      - 58bd1e77-0368-43f2-8551-da0e78d90779
    - suggestion: .hasPattern('Blood Pressure', r'^\d+/\d+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 5992503f-a8cd-459f-a80b-81193d2b83e1
      source_assumptions:
      - 73f3bf61-5cc7-472f-8e49-fd426a6cb867
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values, as the
        code splits the string and casts both parts directly to integers using ''.astype(int)''
        without handling missing values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: 58bd1e77-0368-43f2-8551-da0e78d90779
    - text: 'Each value in the ''Blood Pressure'' column must follow the format of
        two integer values separated by a slash (e.g., ''systolic/diastolic'') so
        that ''str.split(''/'', expand=True)'' generates at least two parts and both
        can be successfully converted to integers.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''", "Blood Pressure Format",
        lambda x: x == 1.0)'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: 73f3bf61-5cc7-472f-8e49-fd426a6cb867
  Daily Steps:
    code:
    - suggestion: .isComplete('Daily Steps')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 66be0b43-7593-4812-a4c8-1298c6c610f8
      source_assumptions:
      - 878790fd-b01a-4d02-bed8-9434d4d36aa1
    - suggestion: .satisfies('`Daily Steps` >= 0 AND `Daily Steps` <= 50000', 'Daily
        Steps Range [0, 50000]')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 99f221d5-9ee6-47c8-931b-73534aa36ceb
      source_assumptions:
      - 9883ef5f-a724-4f00-b332-1c5bde57740f
    - suggestion: .hasDataType('Daily Steps', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e55506b2-8a19-45ba-9aba-5b6de8b83e6e
      source_assumptions:
      - 4c8223b3-52f9-4fb9-b80e-93eb887f7c9e
    assumptions:
    - text: 'The ''Daily Steps'' column should not contain null values, as it is directly
        used in mathematical operations and transformations (such as `np.log1p(df[''Daily
        Steps''])` to calculate `sedentary_index` and `priority_score`) without null
        handling or imputation. We could represent this assumption as a deequ constraint:
        .isComplete(''Daily Steps'')'
      sources:
      - start_line: 49
        end_line: 51
        file: ''
      - start_line: 67
        end_line: 73
        file: ''
      uid: 878790fd-b01a-4d02-bed8-9434d4d36aa1
    - text: 'The ''Daily Steps'' column should contain values in the range [0, 50000],
        as the code checks `(steps >= 0) & (steps <= 50000)` and normalizes steps
        using `np.log1p(df[''Daily Steps'']) / np.log(50001)`, assuming steps fall
        within this range to scale the normalized activity appropriately between 0
        and 1. We could represent this assumption as a deequ constraint: .satisfies("CASE
        WHEN `Daily Steps` >= 0 AND `Daily Steps` <= 50000 THEN 1 ELSE 0 END", "Daily
        Steps Range [0, 50000]", lambda x: x == 1.0)'
      sources:
      - start_line: 27
        end_line: 29
        file: ''
      - start_line: 49
        end_line: 51
        file: ''
      uid: 9883ef5f-a724-4f00-b332-1c5bde57740f
    - text: 'The ''Daily Steps'' column should have a numeric (integral) data type,
        as it is used in Spearman correlation calculation (`pal[pair_mask_as].corr(steps[pair_mask_as],
        method=''spearman'')`) and logarithmic transformations (`np.log1p`). We could
        represent this assumption as a deequ constraint: .hasDataType(''Daily Steps'',
        ConstrainableDataTypes.Integral)'
      sources:
      - start_line: 27
        end_line: 31
        file: ''
      - start_line: 49
        end_line: 49
        file: ''
      uid: 4c8223b3-52f9-4fb9-b80e-93eb887f7c9e
