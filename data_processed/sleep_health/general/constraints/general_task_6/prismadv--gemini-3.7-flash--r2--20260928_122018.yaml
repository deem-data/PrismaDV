      uid: 53e1d7ad-638c-4d6b-b114-7a0163aa8359
    - text: 'The ''Sleep Duration'' column values should be strictly greater than
        2.99 and less than or equal to 14.01, because the code computes np.log(df[''Sleep
        Duration''] - 2.99) (which requires arguments > 0) and np.sqrt(14.01 - df[''Sleep
        Duration'']) (which requires non-negative radicands). We could represent this
        assumption as a deequ constraint like this: .satisfies(''`Sleep Duration`
        > 2.99 AND `Sleep Duration` <= 14.01'', ''Sleep Duration within valid mathematical
        domain'', lambda x: x == 1.0)'
