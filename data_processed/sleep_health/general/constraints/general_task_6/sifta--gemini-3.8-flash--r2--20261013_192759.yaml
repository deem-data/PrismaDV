      \ Validates the completeness fraction of a column. Completeness is the ratio\
      \ of non-null values to total rows. The assertion lambda receives the completeness\
      \ fraction (0.0 to 1.0) and returns a boolean indicating if it meets the threshold.\n\
      \ RequiredArgs: ['column', 'assertion']\n OptionalArgs: []\n Example: .hasCompleteness('credits_attempted',\
