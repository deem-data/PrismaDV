      source_assumptions:
      - 2a308bbb-be49-4a27-b024-01538f4df32b
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values because
        the code splits the string and casts the resulting parts directly to integers
        using ''.astype(int)'', which will fail if any values are null or missing.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: c8a3a281-b4a8-4c03-a0c1-67190a6b65d9
    - text: 'The ''Blood Pressure'' column values should follow the pattern of two
        integers separated by a slash (''/''), representing systolic and diastolic
        pressure (e.g., ''120/80''), so that splitting by ''/'' produces two elements
        that can both be cast to integers.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''", "Blood Pressure Format",
        lambda x: x == 1.0)'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: 2a308bbb-be49-4a27-b024-01538f4df32b
