constraints:
  Age:
    code:
    - - .satisfies('CAST(`Age` AS DOUBLE) BETWEEN 0 AND 120', 'valid_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .satisfies("CAST(regexp_extract(`Blood Pressure`, '^([0-9]{2,3})/([0-9]{2,3})$',
        1) AS INT) BETWEEN 90 AND 200 AND CAST(regexp_extract(`Blood Pressure`, '^([0-9]{2,3})/([0-9]{2,3})$',
        2) AS INT) BETWEEN 50 AND 120 AND CAST(regexp_extract(`Blood Pressure`, '^([0-9]{2,3})/([0-9]{2,3})$',
        1) AS INT) > CAST(regexp_extract(`Blood Pressure`, '^([0-9]{2,3})/([0-9]{2,3})$',
        2) AS INT)", 'valid_blood_pressure_values')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .satisfies('CAST(`Daily Steps` AS DOUBLE) BETWEEN 0 AND 100000', 'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .satisfies('CAST(`Heart Rate` AS DOUBLE) BETWEEN 1 AND 300', 'valid_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) BETWEEN 0 AND 1440',
        'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 1 AND 10', 'valid_quality_of_sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda fraction: fraction > 0)'
      - Valid
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder_labels')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) BETWEEN 0 AND 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
