      - start_line: 20
        end_line: 26
        file: ''
      - start_line: 118
        end_line: 124
        file: ''
      - start_line: 139
        end_line: 142
        file: ''
      uid: b3f71d37-44f5-43b8-b584-531fff65dda5
    - text: Age values should be nonnegative whole numbers, consistent with the column's
        integral data type and its meaning as a person's age. The 40-to-70 calculation
