      - start_line: 118
        end_line: 124
        file: ''
      uid: fe2ad0b9-dae4-443d-b353-9aa6703027ed
    - text: Every 'Age' value should be non-null and convertible to a finite number.
        Numeric coercion turns invalid values into nulls, and the code does not fill
        them before calculating apnea-risk scores and a quantile-based triage threshold.
