constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', '^[0-9]{2,3}/[0-9]{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) BETWEEN 90 AND 200
        AND CAST(split(`Blood Pressure`, '/')[1] AS INT) BETWEEN 50 AND 120 AND CAST(split(`Blood
        Pressure`, '/')[0] AS INT) > CAST(split(`Blood Pressure`, '/')[1] AS INT)",
        'valid_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasNumberOfDistinctValues(''Daily Steps'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('Daily Steps')
      - Valid
    - - .isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasNumberOfDistinctValues(''Physical Activity Level'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .isNonNegative('Physical Activity Level')
      - Invalid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.hasNumberOfDistinctValues(''Quality of Sleep'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda x: x > 0)'
      - Valid
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasNumberOfDistinctValues(''Sleep Duration'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('Sleep Duration')
      - Valid
    - - .isPositive('Sleep Duration')
      - Invalid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - '.hasNumberOfDistinctValues(''Stress Level'', lambda x: x > 1)'
      - Invalid
    - - .isComplete('Stress Level')
      - Valid
    assumptions: []
    column_name: Stress Level
