        file: ''
      uid: 6fb4f3aa-24c8-40f4-b585-c6d236d51e58
    - text: 'The ''Stress Level'' column should not contain null or missing values.
        Although missing values are filtered out when calculating spearman correlation
        with Quality of Sleep, the column is subsequently converted to float and used
        directly in calculating ''stress_score'', ''sleep_health_score'', and ''insomnia_risk''
        without imputation. Any null values would propagate NaNs and cause np.quantile
        to return NaN when computing the insomnia triage threshold. We could represent
        this assumption as a deequ constraint like this: .isComplete(''Stress Level'')'
      sources:
      - start_line: 93
        end_line: 97
        file: ''
      - start_line: 112
        end_line: 113
        file: ''
      - start_line: 129
        end_line: 131
        file: ''
      - start_line: 140
        end_line: 140
        file: ''
      uid: 00a30f84-54ca-4f1f-8ff8-5290f39b6fe6
    - text: 'The ''Stress Level'' column is expected to be on a standard stress rating
        scale between 0 and 10 (observed values are integers ranging from 3 to 8),
        consistent with the formula np.clip((stress - 6.0) / 4.0, 0.0, 1.0) which
        normalizes stress levels up to a maximum of 10. We could represent this assumption
        as a deequ constraint like this: .satisfies(''`Stress Level` >= 0 AND `Stress
        Level` <= 10'', ''Stress Level Range'', lambda x: x == 1.0)'
