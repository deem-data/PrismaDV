        Steps'' are simultaneously combined into the composite insomnia risk index
        via a weighted linear combination without missing-value imputation. All four
        columns must be present and numeric across records. This can be expressed
        in Deequ as: .satisfies("`Sleep Duration` IS NOT NULL AND `Quality of Sleep`
        IS NOT NULL AND `Stress Level` IS NOT NULL AND `Daily Steps` IS NOT NULL",
