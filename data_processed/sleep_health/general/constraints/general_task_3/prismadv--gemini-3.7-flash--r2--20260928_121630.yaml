        rank correlation and are expected to be jointly available and numeric. This
        can be expressed as a joint completeness or correlation check: .satisfies("`Stress
        Level` IS NOT NULL AND `Quality of Sleep` IS NOT NULL", "stress_and_quality_complete")'
