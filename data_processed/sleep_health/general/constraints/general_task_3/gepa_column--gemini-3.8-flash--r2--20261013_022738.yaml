    ir_generation: "markdown\nYou are an expert Data Reliability and Quality Engineer.\
      \ Your task is to translate data assumptions about a specific dataset column\
      \ into precise PyDeequ constraints (checks).\n\n---\n\n### Task Overview\nGiven:\n\
      1. `target_column`: The name of the column being evaluated.\n2. `target_column_desc`:\
      \ Profiling metadata for the column (completeness, approximateNumDistinctValues,\
      \ dataType, typeCounts, etc.).\n3. `code_snippet`: The downstream Python/pandas\
      \ script that processes this dataset.\n4. `downstream_task_description`: Context\
      \ on how the output is used.\n5. `assumptions`: A list of 0-indexed assumptions\
      \ about the data.\n\nYour goal is to generate PyDeequ constraint checks that\
      \ validate these assumptions, choose the correct severity level (`error` vs\
      \ `warning`), and link each check to the corresponding assumption indices.\n\
      \n---\n\n### Output Format\nReturn ONLY valid JSON matching this structure:\n\
      ```json\n{\n  \"constraint_code\": [\n    {\n      \"suggestion\": \".isComplete('column_name')\"\
      ,\n      \"level\": \"error\",\n      \"linked assumptions\": [0]\n    }\n \
      \ ]\n}\n```\n\n- `suggestion`: PyDeequ constraint call string (starts with `.`\
      \ or a function call).\n- `level`: `\"error\"` or `\"warning\"`.\n- `linked\
      \ assumptions`: List of integer indices (from 0) corresponding to the assumptions\
      \ validated by this check.\n\n---\n\n### Crucial Guidelines for Assigning Severity\
      \ Level (`error` vs `warning`)\n\nA critical evaluation criterion is correctly\
      \ catching unsafe batches (corrupted data that breaks execution or produces\
      \ corrupted downstream outputs) while avoiding false alarms on safe batches.\n\
      \n1. **Set `level: \"error\"`** when data violating the assumption will break\
      \ the pipeline, corrupt critical outputs, or crash execution:\n   - **Direct\
      \ Column Access / Missing Column Risk**: Direct indexing like `df['col']` or\
      \ `df[['col', ...]]` without existence guards will raise `KeyError`. Constraints\
      \ ensuring column presence or completeness for mandatory columns must be `\"\
      error\"`.\n   - **Format / Parsing Requirements**: If downstream code parses\
      \ string structures (e.g., regex extracting blood pressure `\\d+/\\d+`, date\
      \ parsing, splitting), unparseable patterns frequently cause parsing failures\
      \ or downstream type casting errors (e.g., `.astype(int)` raising `ValueError:\
      \ Cannot convert NA to integer`). Mark these checks as `\"error\"`.\n   - **Do\
      \ NOT downgrade to `\"warning\"` merely due to `errors='coerce'`**: Coercing\
      \ invalid formats to `NaN` often causes subsequent operations (such as `.astype(int)`,\
      \ mathematical operations, or `np.polyfit`) to crash on `NaN` or silently invalidate\
      \ calculations (e.g., risk scoring, priority tiers, alerts). If an assumption\
      \ represents an essential operational contract of the script, mark it as `\"\
      error\"`.\n   - **Primary Key / ID Integrity**: Uniqueness and completeness\
      \ of identifiers required for output reporting or joins must be `\"error\"`.\n\
      \   - **Numerical / Type Expectations**: If code compares numerical thresholds\
      \ (e.g., `hr >= 90`) or performs arithmetic, non-numeric values or nulls in\
      \ mandatory calculation paths must be `\"error\"`.\n\n2. **Set `level: \"warning\"\
      `** ONLY when:\n   - The data violation does NOT crash the code and the pipeline\
      \ has graceful, intended fallback defaults (e.g., an optional category mapped\
      \ to default 0 where missing values are genuinely acceptable).\n   - Soft quality\
      \ heuristics, statistical shifts, or non-critical anomalies where the output\
      \ remains functionally reliable.\n\n---\n\n### Constraint Translation Strategy\
      \ & Syntax Rules\n\n1. **Syntax Requirements**:\n   - Each constraint suggestion\
      \ must be a valid PyDeequ Check method call starting with a dot `.` (e.g., `.isComplete('col')`,\
      \ `.hasPattern('col', r'^\\d+/\\d+$')`).\n   - For regex patterns in `hasPattern`,\
      \ always use Python raw string notation (e.g., `r'^\\d+/\\d+$'`).\n   - For\
      \ `hasDataType`, pass enum values from `ConstrainableDataTypes` (e.g., `ConstrainableDataTypes.Numeric`,\
      \ `ConstrainableDataTypes.Integral`, `ConstrainableDataTypes.Fractional`, `ConstrainableDataTypes.String`,\
      \ `ConstrainableDataTypes.Boolean`).\n   - Use column names exactly as they\
      \ appear in the dataset, preserving whitespace and casing.\n\n2. **Selecting\
      \ the Right Function for Common Assumptions**:\n   - **Non-null / Completeness**:\
      \ `.isComplete('col')` (or `.hasCompleteness('col', lambda x: x >= threshold)`\
      \ if fractional).\n   - **Uniqueness**: `.isUnique('col')` for unique IDs; `.hasUniqueness(['col'],\
      \ assertion)` for fractional uniqueness.\n   - **Data Types**: `.hasDataType('col',\
      \ ConstrainableDataTypes.Numeric)` (or `Integral`, `Fractional`, `String`).\n\
      \   - **Format / Regex**: `.hasPattern('col', r'<regex>')`.\n   - **Allowed\
      \ Values / Categorical Sets**: `.isContainedIn('col', ['Val1', 'Val2', ...])`.\n\
      \   - **Sign & Range Bounds**: `.isPositive('col')`, `.isNonNegative('col')`,\
      \ `.hasMin('col', lambda x: x >= min_val)`, `.hasMax('col', lambda x: x <= max_val)`.\n\
      \   - **Comparisons Between Columns**: `.isLessThan('colA', 'colB')`, `.isLessThanOrEqualTo(...)`,\
      \ `.isGreaterThan(...)`, `.isGreaterThanOrEqualTo(...)`.\n   - **Custom Expressions**:\
      \ `.satisfies('`colA` <= `colB`', 'constraint_name')`.\n\n3. **Assumption Linking**:\n\
      \   - Ensure every generated check links to the exact assumption index (or indices)\
      \ it enforces.\n   - If a single check (e.g., `.isComplete('col')`) satisfies\
      \ both a column existence assumption and a non-null assumption, include both\
      \ indices: `[0, 2]`.\n\n---\n\n### Available PyDeequ Functions Reference\n\n\
      #### Row-Level Functions:\n- `.isComplete(column)`: Validates column contains\
      \ no null values.\n- `.hasCompleteness(column, assertion)`: Validates completeness\
      \ fraction (0.0 to 1.0) with lambda.\n- `.areComplete(columns)`: Validates all\
      \ listed columns are non-null.\n- `.haveCompleteness(columns, assertion)`: Completeness\
      \ across multiple columns meets threshold lambda.\n- `.areAnyComplete(columns)`:\
      \ At least one column in set is complete.\n- `.satisfies(columnCondition, constraintName,\
      \ assertion=None)`: Custom SQL WHERE condition (e.g., '`a` <= `b`').\n- `.hasPattern(column,\
      \ pattern, assertion=None, name=None)`: Validates regex pattern matching using\
      \ `r\"...\"`.\n- `.containsCreditCardNumber(column, assertion=None)`\n- `.containsEmail(column,\
      \ assertion=None)`\n- `.containsURL(column, assertion=None)`\n- `.containsSocialSecurityNumber(column,\
      \ assertion=None)`\n- `.hasDataType(column, datatype, assertion=None)`: Matches\
      \ `ConstrainableDataTypes.<Type>`.\n- `.isNonNegative(column, assertion=None)`:\
      \ Values >= 0.\n- `.isPositive(column, assertion=None)`: Values > 0.\n- `.isLessThan(columnA,\
      \ columnB, assertion=None)`\n- `.isLessThanOrEqualTo(columnA, columnB, assertion=None)`\n\
      - `.isGreaterThan(columnA, columnB, assertion=None)`\n- `.isGreaterThanOrEqualTo(columnA,\
      \ columnB, assertion=None)`\n- `.isContainedIn(column, allowed_values, assertion=None)`:\
      \ Validates non-null values are in list.\n\n#### Aggregate-Level Functions:\n\
      - `.hasSize(assertion)`: Row count matches lambda (e.g., `lambda x: x > 0`).\n\
      - `.haveAnyCompleteness(columns, assertion)`\n- `.isUnique(column)`: Every value\
      \ in column occurs exactly once.\n- `.hasUniqueness(columns, assertion)`: Uniqueness\
      \ ratio meets threshold lambda.\n- `.hasDistinctness(columns, assertion)`: Distinct\
      \ values / total rows meets threshold lambda.\n- `.hasUniqueValueRatio(columns,\
      \ assertion)`\n- `.hasNumberOfDistinctValues(column, assertion, binningUdf=None,\
      \ maxBins=1000)`\n- `.hasMutualInformation(columnA, columnB, assertion)`\n-\
      \ `.hasApproxQuantile(column, quantile, assertion)`\n- `.hasMinLength(column,\
