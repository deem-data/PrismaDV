  \ 53, 'Occupation': 'Engineer', 'Sleep Duration': 8.4, 'Quality of Sleep': 9, 'Physical\
  \ Activity Level': 30, 'Stress Level': 3, 'BMI Category': 'Normal', 'Blood Pressure':\
  \ '125/80', 'Heart Rate': 65, 'Daily Steps': 5000, 'Sleep Disorder': nan}, {'id':\
