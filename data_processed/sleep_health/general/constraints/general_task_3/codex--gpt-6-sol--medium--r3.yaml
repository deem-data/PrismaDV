prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\nimport re\n\nimport numpy as np\nimport pandas as pd\n\n\
  parser = argparse.ArgumentParser()\nparser.add_argument('--input', type=str, required=True)\n\
  parser.add_argument('--output', type=str, required=True)\nargs = parser.parse_args()\n\
  \nos.makedirs(args.output, exist_ok=True)\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\n# Basic type coercion for numeric\
  \ columns\nnum_cols = [\n    'Age', 'Heart Rate', 'Daily Steps', 'Sleep Duration',\n\
  \    'Quality of Sleep', 'Physical Activity Level', 'Stress Level'\n]\nfor c in\
  \ num_cols:\n    if c in df.columns:\n        df[c] = pd.to_numeric(df[c], errors='coerce')\n\
  \nmask_pal_steps = df['Daily Steps'].notna() & df['Physical Activity Level'].notna()\n\
  x_steps = df.loc[mask_pal_steps, 'Daily Steps'].astype(float)\ny_pal = df.loc[mask_pal_steps,\
  \ 'Physical Activity Level'].astype(float)\npearson_pal_steps = x_steps.corr(y_pal)\n\
  spearman_pal_steps = x_steps.rank(method='average').corr(y_pal.rank(method='average'))\n\
  # Build a simple linear mapper from Physical Activity Level to Steps for blending\n\
  x = y_pal\ny = x_steps\nvar_x = np.var(x, ddof=0)\ncov_xy = np.cov(x, y, ddof=0)[0,\
  \ 1]\nbeta_steps_from_pal = cov_xy / (var_x + 1e-12)\nalpha_steps_from_pal = y.mean()\
  \ - beta_steps_from_pal * x.mean()\n\n# Compute blended activity signal to stabilize\
  \ activity-derived component\npal_pred_steps = alpha_steps_from_pal + beta_steps_from_pal\
  \ * df['Physical Activity Level'].astype(float)\nblended_steps = 0.6 * df['Daily\
  \ Steps'].astype(float) + 0.4 * pal_pred_steps\n\nmask_dur_q = df['Sleep Duration'].notna()\
  \ & df['Quality of Sleep'].notna()\ndur = df.loc[mask_dur_q, 'Sleep Duration'].astype(float)\n\
  qos = df.loc[mask_dur_q, 'Quality of Sleep'].astype(float)\npearson_dur_q = dur.corr(qos)\n\
  spearman_dur_q = dur.rank(method='average').corr(qos.rank(method='average'))\n#\
  \ Linear model: predict Quality of Sleep from Sleep Duration to compute residuals\n\
  var_dur = np.var(dur, ddof=0)\ncov_dur_q = np.cov(dur, qos, ddof=0)[0, 1]\nbeta_q_from_dur\
  \ = cov_dur_q / (var_dur + 1e-12)\nalpha_q_from_dur = qos.mean() - beta_q_from_dur\
  \ * dur.mean()\npred_qos = alpha_q_from_dur + beta_q_from_dur * df['Sleep Duration'].astype(float)\n\
  resid_q = df['Quality of Sleep'].astype(float) - pred_qos\n\nmask_stress_q = df['Stress\
  \ Level'].notna() & df['Quality of Sleep'].notna()\ns = df.loc[mask_stress_q, 'Stress\
  \ Level'].astype(float)\nq = df.loc[mask_stress_q, 'Quality of Sleep'].astype(float)\n\
  spearman_stress_q = s.rank(method='average').corr(q.rank(method='average'))\n# Parse\
  \ Blood Pressure\nbp_parts = df['Blood Pressure'].str.extract(r'(?P<Systolic>\\\
  d{2,3})/(?P<Diastolic>\\d{2,3})')\ndf['Systolic'] = pd.to_numeric(bp_parts['Systolic'],\
  \ errors='coerce')\ndf['Diastolic'] = pd.to_numeric(bp_parts['Diastolic'], errors='coerce')\n\
  \nsyst = df['Systolic']\ndias = df['Diastolic']\norder_ok = (syst > dias)\nrange_ok\
  \ = syst.between(90, 200) & dias.between(50, 120)\nsd = df['Sleep Disorder']\nlab_mask\
  \ = sd.notna()\nallowed = {'Sleep Apnea', 'Insomnia'}\nvalid_values = df.loc[lab_mask,\
  \ 'Sleep Disorder'].isin(allowed)\nshare_labeled = lab_mask.mean()\napnea_share\
  \ = (df.loc[lab_mask, 'Sleep Disorder'] == 'Sleep Apnea').mean() if lab_mask.any()\
  \ else 0.0\n# Activity score (0-20): z-normalize blended steps, squash to [0,1]\n\
  bs = blended_steps.astype(float)\nbs_mean = float(bs.mean())\nbs_std = float(bs.std(ddof=0))\
  \ or 1.0\nbs_z = (bs - bs_mean) / bs_std\nactivity_score = (np.tanh(bs_z) + 1.0)\
  \ / 2.0 * 20.0\n\n# Duration score (0-30): best near 8h\nsdur = df['Sleep Duration'].astype(float)\n\
  duration_score = (1.0 - np.minimum(np.abs(sdur - 8.0) / 3.0, 1.0)) * 30.0\n\n# Quality\
  \ score (0-30): map 3..9 to 0..1 (clip)\nqos_raw = df['Quality of Sleep'].astype(float)\n\
  quality_score = np.clip((qos_raw - 3.0) / 6.0, 0.0, 1.0) * 30.0\n\n# Stress score\
  \ (0-10): higher stress lowers score\nstress = df['Stress Level'].astype(float)\n\
  stress_mean = float(stress.mean())\nstress_std = float(stress.std(ddof=0)) or 1.0\n\
  stress_z = (stress - stress_mean) / stress_std\nstress_score = (np.tanh(-stress_z)\
  \ + 1.0) / 2.0 * 10.0\n\n# BP score (0-10): penalize elevation from ~120/80\nsyst\
  \ = df['Systolic'].astype(float)\ndias = df['Diastolic'].astype(float)\nspen = np.clip((syst\
  \ - 120.0) / 80.0, 0.0, 1.0)\ndpen = np.clip((dias - 80.0) / 40.0, 0.0, 1.0)\nbp_score\
  \ = (1.0 - (0.5 * spen + 0.5 * dpen)) * 10.0\n\n# Consistency score (0-10): how\
  \ close QoS is to duration-predicted QoS\nresid_abs = np.abs(resid_q.astype(float))\n\
  q_std = float(qos_raw.std(ddof=0)) or 1.0\nconsistency_score = (1.0 - np.clip(resid_abs\
  \ / (2.0 * q_std), 0.0, 1.0)) * 10.0\n\n# Aggregate Sleep Health Score (0-100)\n\
  sleep_health_score = duration_score + quality_score + activity_score + stress_score\
  \ + bp_score + consistency_score\nsleep_health_score = np.clip(sleep_health_score,\
  \ 0.0, 100.0)\n\n# Triage risk: Apnea\nbmi_map = {'Obese': 1.0, 'Overweight': 0.6,\
  \ 'Normal': 0.0, 'Normal Weight': 0.0}\nbmi_factor = df['BMI Category'].map(bmi_map).fillna(0.0).astype(float)\n\
  age = df['Age'].astype(float)\nage_factor = np.clip((age - 40.0) / 30.0, 0.0, 1.0)\n\
  hr = df['Heart Rate'].astype(float)\nhr_factor = np.clip((hr - 70.0) / 50.0, 0.0,\
  \ 1.0)\n\na_bp = 0.5 * np.clip((syst - 130.0) / 60.0, 0.0, 1.0) + 0.5 * np.clip((dias\
  \ - 85.0) / 35.0, 0.0, 1.0)\napnea_risk = np.clip(0.35 * bmi_factor + 0.25 * a_bp\
  \ + 0.20 * age_factor + 0.20 * hr_factor, 0.0, 1.0)\n\n# Triage risk: Insomnia\n\
  dur_short = np.clip((7.0 - sdur) / 3.0, 0.0, 1.0)\nq_low = np.clip((6.0 - qos_raw)\
  \ / 3.0, 0.0, 1.0)\nstress_high = np.clip((stress - 6.0) / 4.0, 0.0, 1.0)\nsteps_low\
  \ = np.clip((10000.0 - df['Daily Steps'].astype(float)) / 10000.0, 0.0, 1.0)\ninsomnia_risk\
  \ = np.clip(0.40 * dur_short + 0.30 * q_low + 0.20 * stress_high + 0.10 * steps_low,\
  \ 0.0, 1.0)\n\n# Calibrate triage thresholds using label prevalence\nshare_labeled\
  \ = lab_mask.mean()\napnea_share = (df.loc[lab_mask, 'Sleep Disorder'] == 'Sleep\
  \ Apnea').mean()\nprior_apnea = share_labeled * apnea_share\nprior_insomnia = share_labeled\
  \ * (1.0 - apnea_share)\n\napnea_threshold = float(np.quantile(apnea_risk, max(0.0,\
  \ min(1.0, 1.0 - prior_apnea + 1e-9))))\ninsomnia_threshold = float(np.quantile(insomnia_risk,\
  \ max(0.0, min(1.0, 1.0 - prior_insomnia + 1e-9))))\n\ntriage_apnea = apnea_risk\
  \ >= apnea_threshold\ntriage_insomnia = insomnia_risk >= insomnia_threshold\n\n\
  # Prepare outputs\nout_df = pd.DataFrame({\n    'Person ID': df['Person ID'],\n\
  \    'Sleep Health Score': sleep_health_score.round(2),\n    'Apnea Risk Score':\
  \ apnea_risk.round(3),\n    'Insomnia Risk Score': insomnia_risk.round(3),\n   \
  \ 'Triage Apnea': triage_apnea.astype(bool),\n    'Triage Insomnia': triage_insomnia.astype(bool),\n\
  \    'Systolic': syst.round(0).astype(int),\n    'Diastolic': dias.round(0).astype(int)\n\
  })\n\nout_csv = os.path.join(args.output, 'sleep_health_scores.csv')\nout_df.to_csv(out_csv,\
  \ index=False)\n\n# Also write a brief calibration/diagnostics JSON\ncalib = {\n\
  \    'correlations': {\n        'pearson_steps_pal': float(pearson_pal_steps),\n\
  \        'spearman_steps_pal': float(spearman_pal_steps),\n        'pearson_duration_quality':\
  \ float(pearson_dur_q),\n        'spearman_duration_quality': float(spearman_dur_q),\n\
  \        'spearman_stress_quality': float(spearman_stress_q)\n    },\n    'label_prevalence':\
  \ {\n        'share_labeled': float(share_labeled),\n        'apnea_share_among_labeled':\
  \ float(apnea_share),\n        'prior_apnea': float(prior_apnea),\n        'prior_insomnia':\
  \ float(prior_insomnia)\n    },\n    'triage_thresholds': {\n        'apnea': float(apnea_threshold),\n\
  \        'insomnia': float(insomnia_threshold)\n    }\n}\nwith open(os.path.join(args.output,\
  \ 'triage_diagnostics.json'), 'w') as f:\n    json.dump(calib, f, indent=2)\n\n\
  ```\n\nThe same program is on disk at `./code/general_task_3.py`, so you can run\
  \ it against the\nstaged table, step through it, or search it, rather than working\
  \ from the\nlisting alone.\n\n# The data\n\nThree rows sampled from the dataset\
