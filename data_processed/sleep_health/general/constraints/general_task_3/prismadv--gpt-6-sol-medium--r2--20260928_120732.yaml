prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Age:
    code:
    - suggestion: .satisfies("`Age` IS NOT NULL AND CAST(`Age` AS DOUBLE) IS NOT NULL
        AND NOT isnan(CAST(`Age` AS DOUBLE)) AND ABS(CAST(`Age` AS DOUBLE)) <= 1.7976931348623157E308",
        "age_present_and_finite_numeric")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: c1c4f1d5-b31c-424a-898f-b14360690cee
      source_assumptions:
      - 77a18648-62ba-49b6-b4fe-017aac6e36e2
      - 80821a10-8e17-4324-a048-470b66a9588e
    - suggestion: .satisfies("CAST(`Age` AS DOUBLE) >= 0 AND CAST(`Age` AS DOUBLE)
