    assumptions:
    - text: Each record used to calculate the insomnia risk score should have non-null,
        numeric values for 'Sleep Duration', 'Quality of Sleep', 'Stress Level', and
        'Daily Steps'. Otherwise, the combined risk score can be null and distort
        threshold calibration. This can be checked with a row-level constraint requiring
        all four values to be present and numeric.
