        end_line: 26
        file: ''
      - start_line: 127
        end_line: 140
        file: ''
      uid: 576a54f5-40ca-4c21-a456-9c3d28315246
    - text: Records used to estimate the relationship between 'Sleep Duration' and
        'Quality of Sleep' should have both values present. The jointly observed records
        should include at least two rows and variation in both columns so the correlations
        and duration-based quality prediction are meaningful.
      sources:
