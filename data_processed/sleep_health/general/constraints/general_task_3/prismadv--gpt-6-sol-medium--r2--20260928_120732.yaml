      reason_if_invalid: ''
      level: warning
      uid: bb4f38d5-07ed-4d59-8c26-dfdb9eb4a20a
      source_assumptions:
      - 4c540f87-5cbd-4237-9ae2-e8ed5ad590eb
    assumptions:
    - text: The input must contain an 'Age' column. The script accesses it directly
        when calculating apnea risk.
      sources:
      - start_line: 118
        end_line: 119
        file: ''
      uid: 77a18648-62ba-49b6-b4fe-017aac6e36e2
    - text: Every 'Age' value should be non-null and convertible to a finite number.
        Invalid values are coerced to null, and missing or non-finite ages can propagate
        into apnea risk scores and the quantile-based triage threshold.
      sources:
      - start_line: 20
        end_line: 26
        file: ''
      - start_line: 118
        end_line: 124
        file: ''
      - start_line: 139
        end_line: 142
        file: ''
      uid: 80821a10-8e17-4324-a048-470b66a9588e
    - text: '''Age'' should be a non-negative whole number of years, consistent with
        its integral data type and its use as a person''s age in the risk calculation.
        Values below 40 or above 70 are permitted: the age factor is deliberately
        clipped rather than rejected.'
      sources:
      - start_line: 118
        end_line: 124
        file: ''
      uid: 4c540f87-5cbd-4237-9ae2-e8ed5ad590eb
