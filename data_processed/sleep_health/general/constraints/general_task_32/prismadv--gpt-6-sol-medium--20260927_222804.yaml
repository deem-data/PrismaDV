        end_line: 34
        file: ''
      - start_line: 87
        end_line: 88
        file: ''
      uid: 1b8ae861-fc40-4d08-8243-9ca4fe21c0b2
    - text: The two components of each 'Blood Pressure' value should represent positive
        pressures, with systolic pressure greater than diastolic pressure. Otherwise,
        the parsed numbers may produce a risk score and trigger that are not clinically
        meaningful.
      sources:
      - start_line: 37
        end_line: 48
        file: ''
      - start_line: 117
        end_line: 121
        file: ''
      uid: fe25e09f-87db-4d12-9de4-13c329fdc930
