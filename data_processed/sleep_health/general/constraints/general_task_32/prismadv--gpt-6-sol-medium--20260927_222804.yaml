        end_line: 27
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      - start_line: 128
        end_line: 129
        file: ''
      uid: da7e679d-e36f-4cb6-88d4-005fff9718b8
    - text: 'Every ''Daily Steps'' value should be at least 0, because a step count
        cannot be negative. Although the risk calculation clips negative values to
        zero, a negative input would still be treated as low activity rather than
        identified as invalid data. Values above 15000 need not be rejected: the calculation
        explicitly caps them at 15000.'
      sources:
      - start_line: 23
        end_line: 27
        file: ''
      - start_line: 128
        end_line: 129
        file: ''
      uid: 0fdecc85-dab3-4e67-85b2-1301c3cc1cd2
