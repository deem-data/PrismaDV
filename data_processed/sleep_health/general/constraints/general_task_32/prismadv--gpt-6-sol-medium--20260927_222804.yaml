prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 1
constraints:
  Age:
    code:
    - suggestion: .isComplete('Age')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2ee12ea0-b9c8-4d56-9b9c-b52a3161a9d5
      source_assumptions:
      - 43349f8e-a253-4355-9601-01c157d2a4ba
    - suggestion: .satisfies("CAST(`Age` AS DOUBLE) IS NOT NULL AND NOT isnan(CAST(`Age`
        AS DOUBLE)) AND ABS(CAST(`Age` AS DOUBLE)) <= 1.7976931348623157E308", "Age
        is finite and numeric")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 474483c9-c959-490b-a402-361a45903e78
      source_assumptions:
      - 257ca6f6-55c8-4e17-b22d-6b4474aac8c6
    - suggestion: .satisfies("CAST(`Age` AS DOUBLE) >= 0 AND CAST(`Age` AS DOUBLE)
        = FLOOR(CAST(`Age` AS DOUBLE))", "Age is a non-negative integer")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f960ec34-aacf-4aca-a251-a5df303038b4
      source_assumptions:
      - 660733f5-d137-4aef-89d2-8ea83aae3514
    assumptions:
    - text: The input must contain an 'Age' column, and every row should have a non-null
        Age. Missing ages are not filled; they would produce missing risk scores and
        invalid risk tiers.
      sources:
      - start_line: 83
        end_line: 83
        file: ''
      - start_line: 94
        end_line: 95
        file: ''
      - start_line: 99
        end_line: 115
        file: ''
      uid: 43349f8e-a253-4355-9601-01c157d2a4ba
    - text: Every Age value should be convertible to a finite number. The code casts
        Age to float before assigning an age-risk category, and the dataset describes
        Age as integral.
      sources:
      - start_line: 94
        end_line: 95
        file: ''
      uid: 257ca6f6-55c8-4e17-b22d-6b4474aac8c6
    - text: Age values should be non-negative integers, consistent with the column's
        integral type and its meaning as a person's age. The age-risk bins include
        negative numbers, so the code would not reject an invalid negative age on
        its own.
      sources:
      - start_line: 94
        end_line: 95
        file: ''
      uid: 660733f5-d137-4aef-89d2-8ea83aae3514
