        end_line: 87
        file: ''
      - start_line: 30
        end_line: 34
        file: ''
      uid: d1648ac6-7eb9-4b45-a030-8b9c3c630b55
    - text: Every 'Blood Pressure' value should contain exactly two integer components
        separated by a single slash, such as '120/80'. Both components must be present
