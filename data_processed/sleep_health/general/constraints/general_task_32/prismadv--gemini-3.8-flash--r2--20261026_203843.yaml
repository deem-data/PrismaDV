  '["Daily Steps","Physical Activity Level"]':
    code: []
    assumptions:
    - text: 'Both ''Daily Steps'' and ''Physical Activity Level'' must be non-null
        for all records. The function ''compute_activity_risk'' takes both columns,
        normalizes them, and computes a linear combination without imputing missing
        values. If either column contains null values, ''activity_risk'' and the composite
        ''risk_score'' will become NaN, affecting risk tier categorization and coaching
        alert generation. We can represent this assumption as a Deequ constraint:
        .satisfies("`Daily Steps` IS NOT NULL AND `Physical Activity Level` IS NOT
        NULL", "Daily Steps and Physical Activity Level must be non-null")'
      sources:
      - start_line: 23
        end_line: 27
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      - start_line: 99
        end_line: 109
        file: ''
      uid: 6a7a36b5-96de-4749-9f67-f85e9d082286
    - text: '''Daily Steps'' and ''Physical Activity Level'' both quantify physical
        activity and are combined linearly (0.7 * steps_norm + 0.3 * pal_norm) to
        represent activity risk. They are expected to be positively correlated across
        individuals in the dataset. We can represent this assumption as a Deequ constraint:
        .hasCorrelation("Daily Steps", "Physical Activity Level", lambda corr: corr
        > 0)'
      sources:
      - start_line: 23
        end_line: 27
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      uid: 4a639030-cc5a-4e00-91e5-6e7d739414d9
