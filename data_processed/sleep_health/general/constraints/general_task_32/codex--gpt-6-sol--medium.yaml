        \ = pal.clip(lower=0, upper=120) / 120.0\n    combined = 0.7 * steps_norm\
        \ + 0.3 * pal_norm\n    return (0.6 - combined).clip(lower=0) * 10.0\n\n\n\
        def compute_bp_components(bp_series: pd.Series) -> pd.DataFrame:\n    parts\
        \ = bp_series.str.split('/', expand=True)\n    sys = parts[0].astype(int)\n\
        \    dia = parts[1].astype(int)\n    return pd.DataFrame({'systolic': sys,\
        \ 'diastolic': dia})\n\n\ndef compute_bp_risk(sys: pd.Series, dia: pd.Series)\
        \ -> pd.Series:\n    normal = (sys < 120) & (dia < 80)\n    elevated = (sys.between(120,\
        \ 129)) & (dia < 80)\n    stage1 = (sys.between(130, 139)) | (dia.between(80,\
        \ 89))\n    stage2 = (sys >= 140) | (dia >= 90)\n    crisis = (sys >= 180)\
        \ | (dia >= 120)\n    risk = pd.Series(0.0, index=sys.index)\n    risk = risk.mask(elevated,\
        \ 2.0)\n    risk = risk.mask(stage1, 5.0)\n    risk = risk.mask(stage2, 8.0)\n\
        \    risk = risk.mask(crisis, 12.0)\n    return risk\n\n\ndef compute_hr_risk(hr:\
        \ pd.Series) -> pd.Series:\n    risk = pd.Series(0.0, index=hr.index)\n  \
        \  risk = risk.mask((hr < 50) | (hr > 110), 4.0)\n    risk = risk.mask(((hr\
        \ >= 50) & (hr <= 59)) | ((hr >= 101) & (hr <= 110)), 2.0)\n    return risk\n\
        \n\ndef bmi_risk_map(series: pd.Series) -> pd.Series:\n    mapping = {\n \
        \       'Normal': 0.0,\n        'Normal Weight': 0.0,\n        'Overweight':\
        \ 3.0,\n        'Obese': 6.0,\n    }\n    return series.map(mapping)\n\n\n\
        def sleep_disorder_penalty(series: pd.Series) -> pd.Series:\n    mapping =\
        \ {\n        'Insomnia': 4.0,\n        'Sleep Apnea': 6.0,\n    }\n    return\
        \ series.map(mapping).fillna(0.0)\n\n\nparser = argparse.ArgumentParser()\n\
        parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
        \ type=str, required=True)\nargs = parser.parse_args()\n\nos.makedirs(args.output,\
        \ exist_ok=True)\ninput_file = os.path.join(args.input, 'new_data.csv')\n\
        df = pd.read_csv(input_file, na_values=['NullValue', 'null', 'NULL', 'NaN',\
        \ 'nan'])\nsleep_dur_risk = compute_sleep_duration_risk(df['Sleep Duration'].astype(float))\n\
        recovery_risk = compute_recovery_risk(df['Quality of Sleep'], df['Stress Level'],\
        \ df['Sleep Duration'])\nactivity_risk = compute_activity_risk(df['Daily Steps'].astype(float),\
        \ df['Physical Activity Level'].astype(float))\nbp_parts = compute_bp_components(df['Blood\
        \ Pressure'].astype(str))\nbp_risk = compute_bp_risk(bp_parts['systolic'],\
        \ bp_parts['diastolic'])\n\nhr_risk = compute_hr_risk(df['Heart Rate'].astype(float))\n\
        bmi_risk = bmi_risk_map(df['BMI Category'])\nsd_penalty = sleep_disorder_penalty(df['Sleep\
        \ Disorder'])\n\nage_risk = pd.cut(df['Age'].astype(float), bins=[-np.inf,\
        \ 55, 60, 65, np.inf], labels=[0.0, 1.0, 2.0, 3.0]).astype(\n    float)\n\n\
        stress_direct_risk = (df['Stress Level'].astype(float) - 6.0).clip(lower=0)\
        \ * 0.8\n\nrisk_score = (\n        sleep_dur_risk\n        + recovery_risk\n\
        \        + activity_risk\n        + bp_risk\n        + hr_risk\n        +\
        \ bmi_risk\n        + sd_penalty\n        + age_risk\n        + stress_direct_risk\n\
        )\n\nrisk_tier = pd.cut(\n    risk_score,\n    bins=[-np.inf, 9, 17, 25, np.inf],\n\
