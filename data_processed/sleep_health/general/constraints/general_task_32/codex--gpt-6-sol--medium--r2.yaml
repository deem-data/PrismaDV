prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef compute_sleep_duration_risk(sleep_duration:\
  \ pd.Series) -> pd.Series:\n    under = (7.0 - sleep_duration).clip(lower=0)\n \
  \   over = (sleep_duration - 9.0).clip(lower=0)\n    return 1.2 * under + 1.0 *\
  \ over\n\n\ndef compute_recovery_risk(qos: pd.Series, stress: pd.Series, sleep_duration:\
  \ pd.Series) -> pd.Series:\n    qos_norm = (qos.astype(float) - 5.0) / 5.0\n   \
  \ stress_norm = (stress.astype(float) - 5.0) / 5.0\n    sd_norm = ((sleep_duration.clip(lower=3.0,\
  \ upper=12.0) - 7.0) / 2.0)\n    recovery = 0.5 * qos_norm + 0.3 * sd_norm - 0.4\
  \ * stress_norm\n    return (-recovery).clip(lower=0) * 8.0\n\n\ndef compute_activity_risk(steps:\
  \ pd.Series, pal: pd.Series) -> pd.Series:\n    steps_norm = steps.clip(lower=0,\
  \ upper=15000) / 15000.0\n    pal_norm = pal.clip(lower=0, upper=120) / 120.0\n\
  \    combined = 0.7 * steps_norm + 0.3 * pal_norm\n    return (0.6 - combined).clip(lower=0)\
  \ * 10.0\n\n\ndef compute_bp_components(bp_series: pd.Series) -> pd.DataFrame:\n\
  \    parts = bp_series.str.split('/', expand=True)\n    sys = parts[0].astype(int)\n\
  \    dia = parts[1].astype(int)\n    return pd.DataFrame({'systolic': sys, 'diastolic':\
  \ dia})\n\n\ndef compute_bp_risk(sys: pd.Series, dia: pd.Series) -> pd.Series:\n\
  \    normal = (sys < 120) & (dia < 80)\n    elevated = (sys.between(120, 129)) &\
  \ (dia < 80)\n    stage1 = (sys.between(130, 139)) | (dia.between(80, 89))\n   \
  \ stage2 = (sys >= 140) | (dia >= 90)\n    crisis = (sys >= 180) | (dia >= 120)\n\
  \    risk = pd.Series(0.0, index=sys.index)\n    risk = risk.mask(elevated, 2.0)\n\
  \    risk = risk.mask(stage1, 5.0)\n    risk = risk.mask(stage2, 8.0)\n    risk\
  \ = risk.mask(crisis, 12.0)\n    return risk\n\n\ndef compute_hr_risk(hr: pd.Series)\
  \ -> pd.Series:\n    risk = pd.Series(0.0, index=hr.index)\n    risk = risk.mask((hr\
  \ < 50) | (hr > 110), 4.0)\n    risk = risk.mask(((hr >= 50) & (hr <= 59)) | ((hr\
  \ >= 101) & (hr <= 110)), 2.0)\n    return risk\n\n\ndef bmi_risk_map(series: pd.Series)\
  \ -> pd.Series:\n    mapping = {\n        'Normal': 0.0,\n        'Normal Weight':\
  \ 0.0,\n        'Overweight': 3.0,\n        'Obese': 6.0,\n    }\n    return series.map(mapping)\n\
  \n\ndef sleep_disorder_penalty(series: pd.Series) -> pd.Series:\n    mapping = {\n\
  \        'Insomnia': 4.0,\n        'Sleep Apnea': 6.0,\n    }\n    return series.map(mapping).fillna(0.0)\n\
  \n\nparser = argparse.ArgumentParser()\nparser.add_argument('--input', type=str,\
  \ required=True)\nparser.add_argument('--output', type=str, required=True)\nargs\
  \ = parser.parse_args()\n\nos.makedirs(args.output, exist_ok=True)\ninput_file =\
  \ os.path.join(args.input, 'new_data.csv')\ndf = pd.read_csv(input_file, na_values=['NullValue',\
  \ 'null', 'NULL', 'NaN', 'nan'])\nsleep_dur_risk = compute_sleep_duration_risk(df['Sleep\
  \ Duration'].astype(float))\nrecovery_risk = compute_recovery_risk(df['Quality of\
  \ Sleep'], df['Stress Level'], df['Sleep Duration'])\nactivity_risk = compute_activity_risk(df['Daily\
  \ Steps'].astype(float), df['Physical Activity Level'].astype(float))\nbp_parts\
  \ = compute_bp_components(df['Blood Pressure'].astype(str))\nbp_risk = compute_bp_risk(bp_parts['systolic'],\
  \ bp_parts['diastolic'])\n\nhr_risk = compute_hr_risk(df['Heart Rate'].astype(float))\n\
  bmi_risk = bmi_risk_map(df['BMI Category'])\nsd_penalty = sleep_disorder_penalty(df['Sleep\
  \ Disorder'])\n\nage_risk = pd.cut(df['Age'].astype(float), bins=[-np.inf, 55, 60,\
  \ 65, np.inf], labels=[0.0, 1.0, 2.0, 3.0]).astype(\n    float)\n\nstress_direct_risk\
  \ = (df['Stress Level'].astype(float) - 6.0).clip(lower=0) * 0.8\n\nrisk_score =\
  \ (\n        sleep_dur_risk\n        + recovery_risk\n        + activity_risk\n\
  \        + bp_risk\n        + hr_risk\n        + bmi_risk\n        + sd_penalty\n\
  \        + age_risk\n        + stress_direct_risk\n)\n\nrisk_tier = pd.cut(\n  \
  \  risk_score,\n    bins=[-np.inf, 9, 17, 25, np.inf],\n    labels=['Low', 'Moderate',\
  \ 'High', 'Critical']\n)\n\ntriggers = []\nfor i, row in df.iterrows():\n    t =\
  \ []\n    if bp_parts.loc[i, 'systolic'] >= 140 or bp_parts.loc[i, 'diastolic']\
  \ >= 90:\n        t.append('high_bp')\n    if row['Sleep Duration'] < 6.0:\n   \
  \     t.append('short_sleep')\n    if row['Sleep Duration'] > 9.0:\n        t.append('long_sleep')\n\
  \    if row['Quality of Sleep'] <= 6:\n        t.append('low_sleep_quality')\n \
  \   if row['Daily Steps'] < 5000:\n        t.append('low_activity')\n    if row['Stress\
  \ Level'] >= 7:\n        t.append('high_stress')\n    if row['BMI Category'] ==\
  \ 'Obese':\n        t.append('obesity')\n    if pd.notna(row.get('Sleep Disorder'))\
  \ and row.get('Sleep Disorder') in {'Insomnia', 'Sleep Apnea'}:\n        t.append('sleep_disorder')\n\
  \    triggers.append(';'.join(t))\n\noutput = pd.DataFrame({\n    'Person ID': df['Person\
  \ ID'],\n    'Risk Score': risk_score.round(2),\n    'Risk Tier': risk_tier.astype(str),\n\
  \    'Triggers': triggers\n})\n\noutput_file = os.path.join(args.output, 'sleep_risk_scores.csv')\n\
  output.to_csv(output_file, index=False)\n\nalerts = output[output['Risk Tier'].isin(['High',\
  \ 'Critical'])]\nalerts_file = os.path.join(args.output, 'coaching_alerts.csv')\n\
  alerts.to_csv(alerts_file, index=False)\n\nsummary = {\n    'total_employees': int(len(df)),\n\
  \    'alerts_generated': int(len(alerts)),\n    'avg_risk_score': float(risk_score.mean()),\n\
  }\nwith open(os.path.join(args.output, 'run_summary.json'), 'w') as f:\n    json.dump(summary,\
  \ f)\n\n```\n\nThe same program is on disk at `./code/general_task_32.py`, so you\
  \ can run it against the\nstaged table, step through it, or search it, rather than\
  \ working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from the\
  \ dataset the program consumes:\n\n[{'id': 99, 'Person ID': 249, 'Gender': 'Male',\
  \ 'Age': 44, 'Occupation': 'Salesperson', 'Sleep Duration': 6.4, 'Quality of Sleep':\
  \ 6, 'Physical Activity Level': 45, 'Stress Level': 7, 'BMI Category': 'Overweight',\
  \ 'Blood Pressure': '130/85', 'Heart Rate': 72, 'Daily Steps': 6000, 'Sleep Disorder':\
  \ nan}, {'id': 72, 'Person ID': 269, 'Gender': 'Female', 'Age': 49, 'Occupation':\
  \ 'Nurse', 'Sleep Duration': 6.0, 'Quality of Sleep': 6, 'Physical Activity Level':\
  \ 90, 'Stress Level': 8, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95',\
  \ 'Heart Rate': 75, 'Daily Steps': 10000, 'Sleep Disorder': 'Sleep Apnea'}, {'id':\
  \ 138, 'Person ID': 71, 'Gender': 'Male', 'Age': 33, 'Occupation': 'Doctor', 'Sleep\
  \ Duration': 6.1, 'Quality of Sleep': 6, 'Physical Activity Level': 30, 'Stress\
  \ Level': 8, 'BMI Category': 'Normal', 'Blood Pressure': '125/80', 'Heart Rate':\
  \ 72, 'Daily Steps': 5000, 'Sleep Disorder': nan}]\n\nThe full table is on disk\
  \ at `./data/tables/observed_data.csv`. You have complete access to it:\nload it\
  \ with pandas, profile it, plot it, run whatever analysis helps. It is a\nthrowaway\
  \ copy -- nothing you do to it has any effect outside this workspace.\n\n# Verifying\
  \ your constraints\n\nYou can execute PyDeequ constraint code against the staged\
  \ table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ containing the union of what you\nsettled on for every column:\n\n{\n    \"constraints\"\
  : [\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
