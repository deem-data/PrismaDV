        end_line: 83
        file: ''
      - start_line: 87
        end_line: 87
        file: ''
      - start_line: 30
        end_line: 34
        file: ''
      uid: 8e7f46c3-ac84-4369-bcb4-cdbff0fac5c5
    - text: "Every 'Blood Pressure' value should consist of exactly two base-10 integers\
