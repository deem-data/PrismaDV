prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  Age:
    code:
    - suggestion: '.satisfies("`Age` IS NOT NULL AND lower(trim(CAST(`Age` AS STRING)))
        NOT IN (''nullvalue'', ''null'', ''nan'')", "age_present_and_not_missing_marker",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ec4c25fe-c4eb-4b7b-9fea-95aa5bffb562
      source_assumptions:
      - 8ede865f-f1f4-42e2-8e60-66332c0a7a57
    - suggestion: '.satisfies("CAST(`Age` AS STRING) RLIKE ''^[+-]?[0-9]+$''", "age_is_whole_number",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: aa25d2a3-da6f-46fe-acb7-9e7c82dc3243
      source_assumptions:
      - 399e796b-7ee5-4940-9b6a-a679519db0cc
    - suggestion: '.satisfies("CAST(`Age` AS DOUBLE) >= 0", "age_is_non_negative",
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 00376fc2-d9ec-40f3-9ab5-c66be04a7b95
      source_assumptions:
      - 7ca1c3c7-2487-41e9-9d69-919b1451c941
    assumptions:
    - text: The 'Age' column should be present and contain no null values, including
        strings that read_csv treats as missing. The code does not fill missing ages;
        a missing value would produce a missing age risk and risk score, making the
        resulting risk tier unreliable.
      sources:
      - start_line: 83
        end_line: 83
        file: ''
      - start_line: 94
        end_line: 95
        file: ''
      - start_line: 99
        end_line: 115
        file: ''
      uid: 8ede865f-f1f4-42e2-8e60-66332c0a7a57
    - text: Every 'Age' value should be a finite numeric value that can be converted
        to float. The input column is characterized as integral, so values should
        also represent whole-number ages. Non-numeric values would fail the conversion
        used to calculate age risk.
      sources:
      - start_line: 94
        end_line: 95
        file: ''
      uid: 399e796b-7ee5-4940-9b6a-a679519db0cc
    - text: Every 'Age' value should be non-negative. The age-risk bins accept any
        numeric value below 55, including negative ages, so invalid negative ages
        would otherwise receive a risk contribution of 0 without being flagged.
      sources:
      - start_line: 94
        end_line: 95
        file: ''
      uid: 7ca1c3c7-2487-41e9-9d69-919b1451c941
