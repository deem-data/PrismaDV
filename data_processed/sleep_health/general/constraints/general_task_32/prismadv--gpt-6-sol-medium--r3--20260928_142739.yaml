      - start_line: 30
        end_line: 47
        file: ''
      - start_line: 87
        end_line: 88
        file: ''
      uid: f0182a08-bd50-4c56-ab1f-baa42692f7fd
    - text: Both numbers in each 'Blood Pressure' value should be positive, and the
        systolic number should be greater than the diastolic number. This keeps the
