    assumptions:
    - text: For every record, 'Quality of Sleep', 'Sleep Duration', and 'Stress Level'
        should all be non-null. They are used together to calculate recovery risk
        without filling missing values; a null could propagate into the risk score
        and affect tier assignment. This can be checked with a row-level constraint
