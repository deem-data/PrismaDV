      uid: 7d1d3a50-3278-40f1-8721-559140512efd
    - text: 'Each value in the ''Blood Pressure'' column must follow the pattern of
        systolic and diastolic readings separated by a slash (e.g., matching the regex
        ''^[0-9]+/[0-9]+$''), because the code splits the string by ''/'' into two
        parts and converts each part to an integer using `.astype(int)`. We could
        represent this assumption as a deequ constraint like this: .satisfies("`Blood
        Pressure` REGEXP ''^[0-9]+/[0-9]+$''", "Blood Pressure Format", lambda x:
        x == 1.0)'
