    assumptions:
    - text: 'Records with a diagnosed ''Sleep Disorder'' (''Insomnia'' or ''Sleep
        Apnea'') are expected to have impaired sleep quality, meaning that individuals
        with a sleep disorder should have a lower ''Quality of Sleep'' (e.g., ''Quality
        of Sleep'' <= 8), and conversely, individuals with the highest sleep quality
