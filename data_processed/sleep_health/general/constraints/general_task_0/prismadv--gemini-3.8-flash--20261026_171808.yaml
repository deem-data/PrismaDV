  '["Daily Steps","Physical Activity Level"]':
    code:
    - suggestion: '.hasCorrelation(''Daily Steps'', ''Physical Activity Level'', lambda
        x: x > 0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 49bb3b87-b157-4991-bf3d-5ffddd7e6631
      source_assumptions:
