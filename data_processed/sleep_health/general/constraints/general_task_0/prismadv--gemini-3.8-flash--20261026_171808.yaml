    assumptions:
    - text: 'The ''Blood Pressure'' column should be complete and not contain null
        values, because missing values would result in conversion issues when splitting
        and casting the split components to integers. We could represent this assumption
        as a deequ constraint like this: .isComplete(''Blood Pressure'')'
