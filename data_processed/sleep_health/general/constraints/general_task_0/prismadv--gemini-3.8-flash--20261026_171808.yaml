        IS NOT NULL', 'activity_columns_not_null')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b65ba22c-6632-4413-b938-1fc8d53a3c9b
      source_assumptions:
      - 914665fd-a8c7-4f11-a9a7-80f3c7e1fa88
    assumptions:
    - text: 'The columns ''Daily Steps'' and ''Physical Activity Level'' are expected
        to have a positive correlation, as both metrics quantify the physical exertion
        and mobility of an individual and are combined with equal weights (0.5 each)
        to calculate the composite activity score. We could represent this assumption
        as a Deequ constraint like this: .hasCorrelation("Daily Steps", "Physical
        Activity Level", _ > 0.0)'
      sources:
      - start_line: 38
        end_line: 44
        file: ''
      uid: ccb7c00e-c935-49b2-b4ba-a269365dd6cb
    - text: '''Daily Steps'' and ''Physical Activity Level'' must both be non-null
        and numeric for each record, because they are directly normalized and combined
        via arithmetic operations (''base_activity = 0.5 * steps_norm + 0.5 * pal_norm'').
        A null or non-numeric value in either column would propagate NaN into ''base_activity'',
        ''activity_score'', and ''sleep_health_index''. We could represent this assumption
        as a Deequ constraint like this: .satisfies("`Daily Steps` IS NOT NULL AND
        `Physical Activity Level` IS NOT NULL", "activity_columns_not_null")'
      sources:
      - start_line: 40
        end_line: 44
        file: ''
      uid: 914665fd-a8c7-4f11-a9a7-80f3c7e1fa88
  '["Quality of Sleep","Sleep Disorder"]':
