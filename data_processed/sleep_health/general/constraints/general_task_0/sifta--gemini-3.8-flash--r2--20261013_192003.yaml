      \ Do NOT generate `.isNonNegative()` or `.isPositive()` at level \"error\" for\
      \ columns that only participate in ranking (`.rank()`) or threshold comparisons.\n\
      \  - For columns evaluated on defined rating scales (e.g., dividing by 10.0),\
