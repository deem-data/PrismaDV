constraints:
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure').satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'",
        'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps').isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID').isPositive('Person ID')
      - Invalid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level').satisfies('`Physical Activity Level`
        >= 0 AND `Physical Activity Level` <= 100', 'valid_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep').satisfies('`Quality of Sleep` >= 0 AND `Quality
        of Sleep` <= 10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia', 'Sleep
        Apnea')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration').satisfies('`Sleep Duration` > 0 AND `Sleep Duration`
        <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level').satisfies('`Stress Level` >= 1 AND `Stress Level`
        <= 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
