        \    sleep_dur_score = triangular_score(df['Sleep Duration'], low=3.0, opt_low=7.0,\
        \ opt_high=9.0, high=12.0)\n    quality_score = df['Quality of Sleep'].astype(float)\
        \ / 10.0\n    s_min = float(np.percentile(df['Daily Steps'], 5))\n    s_max\
        \ = float(np.percentile(df['Daily Steps'], 95))\n    steps_norm = normalize(df['Daily\
        \ Steps'], s_min, s_max)\n    pal_norm = normalize(df['Physical Activity Level'],\
        \ 0.0, 100.0)\n    base_activity = 0.5 * steps_norm + 0.5 * pal_norm\n   \
        \ very_active = (df['Physical Activity Level'] >= 90).astype(float)\n    activity_score\
