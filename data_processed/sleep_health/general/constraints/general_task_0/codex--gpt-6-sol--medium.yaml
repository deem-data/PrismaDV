        \n\ndef triangular_score(x, low, opt_low, opt_high, high):\n    arr = np.asarray(x,\
        \ dtype=float)\n    score = np.zeros_like(arr, dtype=float)\n    left = (arr\
        \ >= low) & (arr < opt_low)\n    mid = (arr >= opt_low) & (arr <= opt_high)\n\
        \    right = (arr > opt_high) & (arr <= high)\n    score[left] = (arr[left]\
        \ - low) / (opt_low - low)\n    score[mid] = 1.0\n    score[right] = (high\
        \ - arr[right]) / (high - opt_high)\n    score[(arr < low) | (arr > high)]\
        \ = 0.0\n    return score\n\n\ndef normalize(x, lower, upper):\n    arr =\
        \ np.asarray(x, dtype=float)\n    denom = (upper - lower) if (upper - lower)\
        \ != 0 else 1.0\n    z = (arr - lower) / denom\n    return np.clip(z, 0.0,\
        \ 1.0)\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
        \ type=str, required=True)\n    parser.add_argument('--output', type=str,\
