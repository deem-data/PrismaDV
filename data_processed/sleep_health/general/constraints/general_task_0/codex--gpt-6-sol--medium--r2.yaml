prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport pandas\
  \ as pd\nimport numpy as np\nimport argparse\nimport os\nimport re\n\n\ndef triangular_score(x,\
  \ low, opt_low, opt_high, high):\n    arr = np.asarray(x, dtype=float)\n    score\
  \ = np.zeros_like(arr, dtype=float)\n    left = (arr >= low) & (arr < opt_low)\n\
  \    mid = (arr >= opt_low) & (arr <= opt_high)\n    right = (arr > opt_high) &\
  \ (arr <= high)\n    score[left] = (arr[left] - low) / (opt_low - low)\n    score[mid]\
  \ = 1.0\n    score[right] = (high - arr[right]) / (high - opt_high)\n    score[(arr\
  \ < low) | (arr > high)] = 0.0\n    return score\n\n\ndef normalize(x, lower, upper):\n\
  \    arr = np.asarray(x, dtype=float)\n    denom = (upper - lower) if (upper - lower)\
  \ != 0 else 1.0\n    z = (arr - lower) / denom\n    return np.clip(z, 0.0, 1.0)\n\
  \n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input',\
  \ type=str, required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \    df = pd.read_csv(os.path.join(args.input, 'new_data.csv'))\n    sleep_dur_score\
  \ = triangular_score(df['Sleep Duration'], low=3.0, opt_low=7.0, opt_high=9.0, high=12.0)\n\
  \    quality_score = df['Quality of Sleep'].astype(float) / 10.0\n    s_min = float(np.percentile(df['Daily\
  \ Steps'], 5))\n    s_max = float(np.percentile(df['Daily Steps'], 95))\n    steps_norm\
  \ = normalize(df['Daily Steps'], s_min, s_max)\n    pal_norm = normalize(df['Physical\
  \ Activity Level'], 0.0, 100.0)\n    base_activity = 0.5 * steps_norm + 0.5 * pal_norm\n\
  \    very_active = (df['Physical Activity Level'] >= 90).astype(float)\n    activity_score\
  \ = np.clip(base_activity + 0.05 * very_active, 0.0, 1.0)\n\n    bp_str = df['Blood\
  \ Pressure'].astype(str)\n    bp_parts = bp_str.str.split('/', expand=True)\n  \
  \  systolic = bp_parts[0].astype(int)\n    diastolic = bp_parts[1].astype(int)\n\
  \    map_pressure = diastolic + (systolic - diastolic) / 3.0\n    bp_score = 1.0\
  \ - normalize(map_pressure, 95.0, 120.0)\n    stress_norm = normalize(df['Stress\
  \ Level'], 1.0, 10.0)\n    stress_component = 1.0 - stress_norm\n    expected_quality\
  \ = 1.0 - stress_norm\n    gap = quality_score - expected_quality\n    stress_quality_penalty\
  \ = np.clip(-gap, 0.0, 1.0) * 0.10\n\n    index_base = 0.35 * sleep_dur_score +\
  \ 0.25 * quality_score + 0.20 * activity_score + 0.10 * stress_component + 0.10\
  \ * bp_score\n    sleep_health_index = np.clip(index_base - stress_quality_penalty,\
  \ 0.0, 1.0)\n\n    alerts = []\n    priorities = []\n    reasons_col = []\n    sdur\
  \ = df['Sleep Duration'].astype(float)\n    stress_n = stress_norm\n    has_disorder\
  \ = df.get('Sleep Disorder', pd.Series([np.nan] * len(df))).fillna('').isin(['Insomnia',\
  \ 'Sleep Apnea'])\n\n    for i in range(len(df)):\n        reasons = []\n      \
  \  shi = float(sleep_health_index[i])\n        if shi < 0.60:\n            reasons.append('LOW_INDEX')\n\
  \        if (stress_n[i] >= 0.70) and (quality_score[i] < 0.60):\n            reasons.append('HIGH_STRESS_LOW_QUALITY')\n\
  \        if (systolic[i] >= 140) or (diastolic[i] >= 90) or (map_pressure[i] >=\
  \ 120):\n            reasons.append('HYPERTENSION_PATTERN')\n        if (sdur[i]\
  \ < 6.0) or (sdur[i] > 9.0):\n            reasons.append('INSUFFICIENT_SLEEP')\n\
  \        if has_disorder[i] and shi < 0.75:\n            reasons.append('DISORDER_FLAG')\n\
  \        alerts.append('Yes' if len(reasons) > 0 else 'No')\n        if 'HYPERTENSION_PATTERN'\
  \ in reasons or 'LOW_INDEX' in reasons:\n            priorities.append('High')\n\
  \        elif len(reasons) > 0:\n            priorities.append('Medium')\n     \
  \   else:\n            priorities.append('None')\n        reasons_col.append(';'.join(reasons))\n\
  \n    out = pd.DataFrame({\n        'Person ID': df['Person ID'],\n        'SleepHealthIndex':\
  \ np.round(sleep_health_index, 3),\n        'Alert': alerts,\n        'Priority':\
  \ priorities,\n        'Reasons': reasons_col\n    })\n    out_path = os.path.join(args.output,\
  \ 'sleep_health_index.csv')\n    out.to_csv(out_path, index=False)\n\n\nif __name__\
  \ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at `./code/general_task_0.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 99, 'Person ID': 249, 'Gender': 'Male',\
  \ 'Age': 44, 'Occupation': 'Salesperson', 'Sleep Duration': 6.4, 'Quality of Sleep':\
  \ 6, 'Physical Activity Level': 45, 'Stress Level': 7, 'BMI Category': 'Overweight',\
  \ 'Blood Pressure': '130/85', 'Heart Rate': 72, 'Daily Steps': 6000, 'Sleep Disorder':\
  \ nan}, {'id': 72, 'Person ID': 269, 'Gender': 'Female', 'Age': 49, 'Occupation':\
  \ 'Nurse', 'Sleep Duration': 6.0, 'Quality of Sleep': 6, 'Physical Activity Level':\
  \ 90, 'Stress Level': 8, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95',\
  \ 'Heart Rate': 75, 'Daily Steps': 10000, 'Sleep Disorder': 'Sleep Apnea'}, {'id':\
  \ 138, 'Person ID': 71, 'Gender': 'Male', 'Age': 33, 'Occupation': 'Doctor', 'Sleep\
  \ Duration': 6.1, 'Quality of Sleep': 6, 'Physical Activity Level': 30, 'Stress\
  \ Level': 8, 'BMI Category': 'Normal', 'Blood Pressure': '125/80', 'Heart Rate':\
  \ 72, 'Daily Steps': 5000, 'Sleep Disorder': nan}]\n\nThe full table is on disk\
  \ at `./data/tables/observed_data.csv`. You have complete access to it:\nload it\
  \ with pandas, profile it, plot it, run whatever analysis helps. It is a\nthrowaway\
  \ copy -- nothing you do to it has any effect outside this workspace.\n\n# Verifying\
  \ your constraints\n\nYou can execute PyDeequ constraint code against the staged\
  \ table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ containing the union of what you\nsettled on for every column:\n\n{\n    \"constraints\"\
  : [\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
