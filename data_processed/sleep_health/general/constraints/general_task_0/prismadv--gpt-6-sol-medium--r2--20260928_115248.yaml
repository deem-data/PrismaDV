        must be parseable, so the combined index and row-level alerts can be computed.
      sources:
      - start_line: 36
        end_line: 58
        file: ''
      - start_line: 64
        end_line: 80
        file: ''
      uid: 5830c411-2ebc-431e-a479-af622bc9ca39
    - text: '''Blood Pressure'' should contain exactly two positive integer values
        in systolic/diastolic format, with systolic pressure greater than diastolic
        pressure. Both values are used together to calculate mean arterial pressure
        and detect hypertension.'
      sources:
      - start_line: 46
        end_line: 51
        file: ''
      - start_line: 75
        end_line: 76
        file: ''
      uid: 2c8c7ba9-0d2f-406c-b289-2e9d5af3472e
    - text: "'Daily Steps' should be nonnegative and 'Physical Activity Level' should\
        \ be on the expected 0\u2013100 scale. Both columns contribute to the same\
        \ activity score; values outside these domains would distort their combined\
        \ interpretation."
      sources:
      - start_line: 38
        end_line: 44
        file: ''
      uid: 467ab558-d999-430b-b763-0ff4765c2bdf
    - text: "'Stress Level' should be on a 1\u201310 scale and 'Quality of Sleep'\
        \ on a 0\u201310 scale. The code normalizes both to comparable values before\
        \ calculating the stress\u2013quality gap and checking the high-stress, low-quality\
        \ condition."
      sources:
      - start_line: 37
        end_line: 37
        file: ''
      - start_line: 52
        end_line: 56
        file: ''
      - start_line: 73
        end_line: 74
        file: ''
      uid: 59e641aa-10c8-46e8-a932-cce2bf8c0424
    - text: "'Sleep Duration' should be a numeric duration in hours, while 'Quality\
        \ of Sleep' should be a numeric rating rather than another duration measure.\
        \ They are scored separately and then combined in the sleep health index;\
        \ the duration score's defined interval is 3\u201312 hours."
      sources:
      - start_line: 8
        end_line: 17
        file: ''
      - start_line: 36
        end_line: 37
        file: ''
      - start_line: 58
        end_line: 59
        file: ''
      uid: ec95c6ed-408e-4b8a-b72c-eaed8bdf1630
    - text: '''Sleep Disorder'' may be null, but every non-null value intended to
        affect alerts should be exactly ''Insomnia'' or ''Sleep Apnea''. A disorder
        flag is considered together with the computed sleep health index; no particular
        sleep duration or quality value is required for a disorder record.'
      sources:
      - start_line: 66
        end_line: 66
        file: ''
      - start_line: 79
