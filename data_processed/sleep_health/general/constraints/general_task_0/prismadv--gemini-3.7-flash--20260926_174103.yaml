        integer values separated by a slash (e.g., ''systolic/diastolic'' matching
        regex ''^\d+/\d+$''), because the code splits the string by ''/'' and casts
        both the first and second components directly to integers.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Blood Pressure` REGEXP ''^[0-9]+/[0-9]+$''", "Valid Blood Pressure
        Format", lambda x: x == 1.0)'
