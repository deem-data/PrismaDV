prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  from pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n\
  \    parser = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str,\
  \ required=True)\n    parser.add_argument('--output', type=str, required=True)\n\
  \    args = parser.parse_args()\n\n    input_path = Path(args.input)\n    output_path\
  \ = Path(args.output)\n    output_path.mkdir(parents=True, exist_ok=True)\n\n  \
  \  df = pd.read_csv(input_path / 'new_data.csv')\n    # Safe parsing after validation\n\
  \    df['Systolic'] = df['Blood Pressure'].str.split('/').str[0].astype(int)\n \
  \   df['Diastolic'] = df['Blood Pressure'].str.split('/').str[1].astype(int)\n \
  \   qos = pd.to_numeric(df['Quality of Sleep'], errors='raise').astype(int)\n  \
  \  sleep_duration = pd.to_numeric(df['Sleep Duration'], errors='coerce')\n\n   \
  \ # Guard: Sleep Duration and Quality of Sleep relationship before computing restful\
  \ hours\n    restful_hours = sleep_duration * (qos / 10.0)\n    restful_target =\
  \ 7.5\n    restful_deficit = np.maximum(restful_target - restful_hours, 0)\n   \
  \ restful_deficit_norm = np.clip(restful_deficit / restful_target, 0, 1)\n\n   \
  \ pal = pd.to_numeric(df['Physical Activity Level'], errors='coerce')\n    steps\
  \ = pd.to_numeric(df['Daily Steps'], errors='coerce')\n    pal_mean = pal.mean()\n\
  \    pal_std = pal.std(ddof=0)\n    steps_mean = steps.mean()\n    steps_std = steps.std(ddof=0)\n\
  \    r2 = np.corrcoef(pal, steps)[0, 1]\n    expected_steps_from_pal = steps_mean\
  \ + r2 * (steps_std / pal_std) * (pal - pal_mean)\n    steps_gap = steps - expected_steps_from_pal\n\
  \    activity_shortfall = np.maximum(-steps_gap, 0)\n    activity_shortfall_norm\
  \ = np.clip(activity_shortfall / 4000.0, 0, 1)\n    labeled = df[df['Sleep Disorder'].isin(['Insomnia',\
  \ 'Sleep Apnea'])].copy()\n    ins_mask_lbl = labeled['Sleep Disorder'] == 'Insomnia'\n\
  \    ap_mask_lbl = labeled['Sleep Disorder'] == 'Sleep Apnea'\n\n    ins_mean_stress\
  \ = labeled.loc[ins_mask_lbl, 'Stress Level'].mean() if ins_mask_lbl.any() else\
  \ np.nan\n    ap_mean_stress = labeled.loc[ap_mask_lbl, 'Stress Level'].mean() if\
  \ ap_mask_lbl.any() else np.nan\n\n    if np.isnan(ins_mean_stress) or np.isnan(ap_mean_stress):\n\
  \        stress_threshold = 5.0\n    else:\n        stress_threshold = float((ins_mean_stress\
  \ + ap_mean_stress) / 2.0)\n\n    apnea_over_prop = labeled.loc[ap_mask_lbl, 'BMI\
  \ Category'].isin(\n        ['Overweight', 'Obese']).mean() if ap_mask_lbl.any()\
  \ else 0.7\n\n    stress = pd.to_numeric(df['Stress Level'], errors='coerce')\n\
  \    stress_score = (stress - stress_threshold) / max(1e-6, (10 - stress_threshold))\n\
  \    stress_score = np.clip(stress_score, 0, 1)\n\n    sedentary_flag = ((steps\
  \ <= 3000) | (pal <= 40)).astype(int)\n\n    insomnia_risk_score = 0.5 * restful_deficit_norm\
  \ + 0.3 * stress_score + 0.2 * sedentary_flag\n\n    is_over_obese = df['BMI Category'].isin(['Overweight',\
  \ 'Obese']).astype(int)\n    bp_high = ((df['Systolic'] >= 130) | (df['Diastolic']\
  \ >= 85)).astype(int)\n    low_qos_long_sleep = ((qos <= 6) & (sleep_duration >=\
  \ 7)).astype(int)\n\n    apnea_risk_score = 0.6 * is_over_obese + 0.2 * bp_high\
  \ + 0.2 * low_qos_long_sleep\n\n    insomnia_threshold = float(np.clip(0.55 - 0.05\
  \ * max(0.0, (ins_mean_stress - ap_mean_stress)) if not (\n                np.isnan(ins_mean_stress)\
  \ or np.isnan(ap_mean_stress)) else 0.0, 0.40, 0.60))\n    apnea_threshold = float(np.clip(0.55\
  \ - 0.10 * (apnea_over_prop - 0.70), 0.45, 0.65))\n\n    risk_insomnia = insomnia_risk_score\
  \ >= insomnia_threshold\n    risk_apnea = apnea_risk_score >= apnea_threshold\n\n\
  \    reasons = []\n    for i in range(len(df)):\n        r = []\n        if risk_insomnia.iloc[i]:\n\
  \            r.append('insomnia')\n        if risk_apnea.iloc[i]:\n            r.append('sleep_apnea')\n\
  \        reasons.append(','.join(r) if r else '')\n\n    # Personalized coaching\
  \ recommendations\n    coaching = []\n    for i in range(len(df)):\n        modules\
  \ = []\n        if risk_insomnia.iloc[i]:\n            modules.append('CBT-I')\n\
  \            modules.append('stress_management')\n            modules.append('sleep_hygiene')\n\
  \            if steps.iloc[i] < 8000:\n                modules.append('progressive_activity_plan')\n\
  \        if risk_apnea.iloc[i]:\n            modules.append('sleep_apnea_screening')\n\
  \            modules.append('weight_management')\n            modules.append('cpap_education')\n\
  \        coaching.append('|'.join(modules))\n\n    out_df = pd.DataFrame({\n   \
  \     'Person ID': df['Person ID'],\n        'risk_insomnia': risk_insomnia.astype(int),\n\
  \        'risk_sleep_apnea': risk_apnea.astype(int),\n        'insomnia_risk_score':\
  \ insomnia_risk_score.round(3),\n        'apnea_risk_score': apnea_risk_score.round(3),\n\
  \        'reason': reasons,\n        'restful_hours': restful_hours.round(2),\n\
  \        'Stress Level': stress,\n        'Physical Activity Level': pal,\n    \
  \    'Daily Steps': steps,\n        'Quality of Sleep': qos,\n        'Systolic':\
  \ df['Systolic'],\n        'Diastolic': df['Diastolic']\n    })\n\n    plans_df\
  \ = pd.DataFrame({\n        'Person ID': df['Person ID'],\n        'coaching_modules':\
  \ coaching\n    })\n\n    out_df.to_csv(output_path / 'risk_flags.csv', index=False)\n\
  \    plans_df.to_csv(output_path / 'coaching_plan.csv', index=False)\n\n\nif __name__\
  \ == '__main__':\n    main()\n\n```\n\nThe same program is on disk at `./code/general_task_21.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 121, 'Person ID': 294, 'Gender':\
  \ 'Female', 'Age': 50, 'Occupation': 'Nurse', 'Sleep Duration': 6.0, 'Quality of\
  \ Sleep': 6, 'Physical Activity Level': 90, 'Stress Level': 8, 'BMI Category': 'Overweight',\
  \ 'Blood Pressure': '140/95', 'Heart Rate': 75, 'Daily Steps': 10000, 'Sleep Disorder':\
  \ 'Sleep Apnea'}, {'id': 5, 'Person ID': 373, 'Gender': 'Female', 'Age': 59, 'Occupation':\
  \ 'Nurse', 'Sleep Duration': 8.1, 'Quality of Sleep': 9, 'Physical Activity Level':\
  \ 75, 'Stress Level': 3, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95',\
  \ 'Heart Rate': 68, 'Daily Steps': 7000, 'Sleep Disorder': 'Sleep Apnea'}, {'id':\
  \ 82, 'Person ID': 94, 'Gender': 'Male', 'Age': 35, 'Occupation': 'Lawyer', 'Sleep\
  \ Duration': 7.4, 'Quality of Sleep': 7, 'Physical Activity Level': 60, 'Stress\
  \ Level': 5, 'BMI Category': 'Obese', 'Blood Pressure': '135/88', 'Heart Rate':\
  \ 84, 'Daily Steps': 3300, 'Sleep Disorder': 'Sleep Apnea'}]\n\nThe full table is\
  \ on disk at `./data/tables/observed_data.csv`. You have complete access to it:\n\
  load it with pandas, profile it, plot it, run whatever analysis helps. It is a\n\
  throwaway copy -- nothing you do to it has any effect outside this workspace.\n\n\
  # Verifying your constraints\n\nYou can execute PyDeequ constraint code against\
  \ the staged table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ containing the union of what you\nsettled on for every column:\n\n{\n    \"constraints\"\
  : [\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
