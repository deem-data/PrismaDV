    code:
    - suggestion: '.satisfies(''CAST(`Physical Activity Level` AS DOUBLE) IS NOT NULL
        AND NOT isnan(CAST(`Physical Activity Level` AS DOUBLE)) AND CAST(`Daily Steps`
        AS DOUBLE) IS NOT NULL AND NOT isnan(CAST(`Daily Steps` AS DOUBLE))'', ''activity_columns_numeric_and_non_null'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2e2dd620-032c-44df-8849-8d250498aae3
      source_assumptions:
      - bc538bdf-5e51-49e9-b41f-328d6056cdb5
    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d5c99c91-12d4-47c0-9d51-b221ca31c176
      source_assumptions:
      - 3336fd24-78c1-4d49-bcc3-82d626dcaa30
      - e4e69c75-04a6-4043-896d-202d32784ade
    assumptions:
    - text: Every record should have numeric, non-null values in both 'Physical Activity
        Level' and 'Daily Steps'. Conversion failures in either column produce NaN,
        which can make the correlation, expected step counts, and activity shortfall
        unusable. This can be checked with a row-level constraint requiring both columns
        to be non-null and numeric.
      sources:
      - start_line: 31
        end_line: 39
        file: ''
      uid: bc538bdf-5e51-49e9-b41f-328d6056cdb5
    - text: Across the dataset, both 'Physical Activity Level' and 'Daily Steps' should
        vary (each should have a standard deviation greater than zero). In particular,
        a zero standard deviation for 'Physical Activity Level' makes the expected-steps
        calculation divide by zero; zero variance in either column makes the correlation
        undefined.
      sources:
      - start_line: 33
        end_line: 39
        file: ''
      uid: 3336fd24-78c1-4d49-bcc3-82d626dcaa30
    - text: The correlation between 'Physical Activity Level' and 'Daily Steps' should
        be positive. The interpretation of steps below the PAL-based prediction as
        an activity shortfall assumes that higher physical activity levels generally
        correspond to more daily steps. This can be checked with a correlation constraint
        greater than zero.
      sources:
      - start_line: 37
        end_line: 41
        file: ''
      uid: e4e69c75-04a6-4043-896d-202d32784ade
