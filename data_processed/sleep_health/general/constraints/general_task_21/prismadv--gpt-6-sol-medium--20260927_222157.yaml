    - text: "For every row, 'Sleep Duration' should be nonnegative and 'Quality of\
        \ Sleep' should be between 0 and 10 inclusive. Together, these bounds ensure\
        \ that the calculated restful hours, 'Sleep Duration' \xD7 ('Quality of Sleep'\
        \ / 10), lies between zero and the recorded sleep duration. Do not require\
        \ restful hours to be at most 7.5: the code explicitly clips the resulting\
        \ deficit at zero."
