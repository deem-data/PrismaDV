    assumptions:
    - text: For every row, 'Sleep Duration' and 'Quality of Sleep' should both be
        non-null and parseable as finite numbers; 'Quality of Sleep' should also be
        integer-valued. Otherwise, the paired values cannot reliably produce restful
        hours or the sleep-related risk indicators. This can be checked with a row-level
        constraint requiring both fields to be valid together.
      sources:
