        end_line: 38
        file: ''
      uid: ef56b247-f68c-4451-a8f3-411f0004d9d8
    - text: 'The ''Physical Activity Level'' column should have a non-zero standard
        deviation (variance > 0) to prevent division by zero in `steps_std / pal_std`
        when computing expected steps. We could represent this assumption as a deequ
        constraint like this: .hasStandardDeviation(''Physical Activity Level'', lambda
        x: x > 0)'
      sources:
      - start_line: 34
        end_line: 38
        file: ''
      uid: 355fb474-c894-4a69-bfce-b38afc872a20
    - text: 'The ''Physical Activity Level'' column should contain numeric data so
