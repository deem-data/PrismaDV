        We could represent this assumption as a deequ constraint like this: .isContainedIn(''Sleep
        Disorder'', [''Insomnia'', ''Sleep Apnea'']) or .satisfies("CASE WHEN `Sleep
        Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'', ''Sleep Apnea'') THEN
        1 ELSE 0 END", "Valid Sleep Disorder values", lambda x: x == 1.0)'
