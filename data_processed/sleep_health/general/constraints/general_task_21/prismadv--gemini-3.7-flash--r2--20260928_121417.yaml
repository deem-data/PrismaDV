  '["BMI Category","Sleep Disorder"]':
    code: []
    assumptions:
    - text: Records where 'Sleep Disorder' equals 'Sleep Apnea' are evaluated against
        'BMI Category' values of 'Overweight' or 'Obese' to compute the proportion
        of overweight/obese apnea patients (apnea_over_prop) for adjusting the apnea
        risk threshold. Thus, 'BMI Category' should be populated with valid category
        strings (e.g., 'Overweight', 'Obese', 'Normal', 'Normal Weight') whenever
        'Sleep Disorder' is 'Sleep Apnea'.
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      - start_line: 54
        end_line: 55
        file: ''
