  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7c5317db-fbd7-48d6-9b5e-9bb761f1b53b
      source_assumptions:
      - b201fd8d-e0a6-4069-9b15-ee44ef5d6cee
    - suggestion: '.hasPattern(''Blood Pressure'', r''^[0-9]+/[0-9]+$'', lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2550cf8b-f3e4-45a1-8d10-0eb8e8391f22
      source_assumptions:
      - f338aa31-5e67-4f15-9832-4ced43f4f2ec
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values, as it is
        split and directly cast to integers (Systolic and Diastolic) using `.astype(int)`
        without handling missing values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: b201fd8d-e0a6-4069-9b15-ee44ef5d6cee
    - text: 'The ''Blood Pressure'' column should follow the format of two numeric
        values separated by a slash (e.g., ''120/80'') matching regex pattern ''^[0-9]+/[0-9]+$'',
        so that splitting by ''/'' yields integer-convertible systolic and diastolic
        readings.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Blood Pressure", "^[0-9]+/[0-9]+$", lambda x: x == 1.0)'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: f338aa31-5e67-4f15-9832-4ced43f4f2ec
