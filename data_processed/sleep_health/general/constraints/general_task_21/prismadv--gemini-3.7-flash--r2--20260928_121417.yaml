    assumptions:
    - text: 'The ''Quality of Sleep'' column should not contain null or missing values,
        as pd.to_numeric is called with errors=''raise'' and followed by .astype(int),
        which would raise an exception if missing or non-convertible values are present.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Quality of Sleep")'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: 403f97a4-693f-4348-a333-40c5ad878bd3
    - text: 'The ''Quality of Sleep'' column values must be integers or convertible
        to integers, as the code casts the parsed numeric values to int using .astype(int).

        We could represent this assumption as a deequ constraint like this:

        .hasDataType("Quality of Sleep", org.apache.spark.sql.types.IntegerType)'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: 411e854e-05d3-4547-89c6-8f5651711f64
    - text: 'The ''Quality of Sleep'' column values are expected to be on a scale
        from 0 to 10 (typically 1 to 10), as the value is divided by 10.0 to compute
        restful hours.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Quality of Sleep` >= 0 AND `Quality of Sleep` <= 10", "Quality
        of Sleep Range 0-10", lambda x: x == 1.0)'
      sources:
      - start_line: 22
        end_line: 26
        file: ''
      uid: 9fe1ffde-a6f5-44d2-a5ad-ba6a3ac9716c
