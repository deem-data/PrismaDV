        as `pal <= 40`. We could represent this assumption as a deequ constraint like
        this: .hasDataType(''Physical Activity Level'', ConstrainableDataTypes.Numeric)'
      sources:
      - start_line: 31
        end_line: 31
        file: ''
      - start_line: 61
        end_line: 61
        file: ''
      uid: 3aebbd81-b99d-4d18-85e6-2ea8b2189b5c
