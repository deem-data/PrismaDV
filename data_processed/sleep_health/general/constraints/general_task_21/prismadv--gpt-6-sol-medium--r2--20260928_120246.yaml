        end_line: 39
        file: ''
      uid: 2aaf8e1a-17bb-4703-95ef-824fe9b12d81
    - text: Both 'Physical Activity Level' and 'Daily Steps' should vary across records
        (each should have a population standard deviation greater than zero). Otherwise
        the correlation is undefined, and a zero standard deviation for 'Physical
        Activity Level' also causes division by zero when estimating expected steps.
      sources:
