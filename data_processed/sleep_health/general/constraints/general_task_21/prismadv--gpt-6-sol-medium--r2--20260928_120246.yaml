      uid: 5dfff1d9-5fe2-4f5f-a2f6-e482e7154de6
    - text: For every record used in the apnea risk score, 'BMI Category' should be
        one of 'Normal', 'Normal Weight', 'Overweight', or 'Obese', and 'Blood Pressure'
        should contain two parseable integers in systolic/diastolic format, with systolic
        greater than diastolic. Validate these columns jointly so that neither an
        unrecognized BMI category nor a malformed pressure value is silently treated
        as lacking an apnea risk factor.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 65
        end_line: 69
