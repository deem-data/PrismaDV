        end_line: 39
        file: ''
      uid: ab860e4f-4f9c-43c5-aeae-9c7f9bf0a1dc
    - text: Across records, 'Physical Activity Level' and 'Daily Steps' should have
        a positive correlation so that the regression-based expected step count represents
        increasing steps with increasing activity level. This can be checked with
        a correlation constraint greater than zero.
      sources:
