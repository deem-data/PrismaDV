    assumptions:
    - text: Both 'Physical Activity Level' and 'Daily Steps' should contain finite
        numeric values on every row. Missing or nonnumeric values in either column
        can make the correlation and expected-step calculations invalid. This can
        be checked with a row-level constraint requiring both values to be non-null
        and finite.
      sources:
