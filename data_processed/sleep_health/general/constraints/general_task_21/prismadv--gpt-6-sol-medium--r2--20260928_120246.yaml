    - text: 'Every ''BMI Category'' value should be one of the four observed, case-sensitive
        strings: ''Normal'', ''Normal Weight'', ''Overweight'', or ''Obese''. The
        code treats only exact matches to ''Overweight'' and ''Obese'' as elevated-BMI
        indicators; unexpected spellings or categories would silently be treated as
        not elevated.'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 65
        end_line: 69
        file: ''
      uid: 241a08fe-c82e-4396-8964-bd9c00e38fce
