  '["Daily Steps","Physical Activity Level","Quality of Sleep","Sleep Duration","Stress Level"]':
    code:
    - suggestion: .satisfies("try_cast(`Sleep Duration` AS DOUBLE) IS NOT NULL AND
        NOT isnan(try_cast(`Sleep Duration` AS DOUBLE)) AND try_cast(`Quality of Sleep`
        AS DOUBLE) IS NOT NULL AND NOT isnan(try_cast(`Quality of Sleep` AS DOUBLE))
        AND try_cast(`Stress Level` AS DOUBLE) IS NOT NULL AND NOT isnan(try_cast(`Stress
        Level` AS DOUBLE)) AND try_cast(`Physical Activity Level` AS DOUBLE) IS NOT
        NULL AND NOT isnan(try_cast(`Physical Activity Level` AS DOUBLE)) AND try_cast(`Daily
        Steps` AS DOUBLE) IS NOT NULL AND NOT isnan(try_cast(`Daily Steps` AS DOUBLE))",
        "numeric_non_null_risk_inputs")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 1f054570-f6ae-4fe7-acee-783bc53a2f14
      source_assumptions:
      - 7a8ce386-d897-478b-bb17-a2199bacc972
    - suggestion: .satisfies("try_cast(`Sleep Duration` AS DOUBLE) >= 0 AND try_cast(`Quality
        of Sleep` AS DOUBLE) BETWEEN 0 AND 10 AND try_cast(`Sleep Duration` AS DOUBLE)
        * try_cast(`Quality of Sleep` AS DOUBLE) / 10.0 BETWEEN 0 AND try_cast(`Sleep
        Duration` AS DOUBLE)", "valid_restful_hours_bounds")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b878a036-fd2e-43cc-b043-0af01fd0727c
      source_assumptions:
      - 67fe1398-5e4f-4b3a-8207-9df26cb48be6
    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: 0 < x <= 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: c520bda3-3685-4d5e-950b-1cc1d3126fff
      source_assumptions:
      - 57b4aaab-13a0-4848-9203-fdb039cdf185
    assumptions:
    - text: Every record should have numeric, non-null values for 'Sleep Duration',
        'Quality of Sleep', 'Stress Level', 'Physical Activity Level', and 'Daily
        Steps'. These values are combined into row-level risk scores; a missing or
        nonnumeric value could produce an undefined score. This can be checked with
        a row-level constraint requiring all five parsed values to be non-null.
      sources:
      - start_line: 22
        end_line: 26
        file: ''
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 57
        end_line: 63
        file: ''
      uid: 7a8ce386-d897-478b-bb17-a2199bacc972
    - text: "For each record, 'Sleep Duration' should be a nonnegative number of hours\
        \ and 'Quality of Sleep' should be a rating from 0 to 10. Together, these\
        \ bounds ensure that the calculated restful hours (`Sleep Duration` \xD7 `Quality\
        \ of Sleep` / 10) are between zero and the recorded sleep duration. A row-level\
        \ constraint can check both bounds and the resulting inequality."
      sources:
      - start_line: 22
        end_line: 29
        file: ''
      - start_line: 67
        end_line: 67
        file: ''
      uid: 67fe1398-5e4f-4b3a-8207-9df26cb48be6
    - text: '''Physical Activity Level'' and ''Daily Steps'' should each vary across
        records, and their paired values should have a positive, finite correlation.
        Otherwise the regression-based expected step count is undefined or does not
        support interpreting steps below that expectation as an activity shortfall.
        This can be checked with positive standard deviations for both columns and
        a positive finite correlation between them.'
      sources:
      - start_line: 31
        end_line: 41
        file: ''
      uid: 57b4aaab-13a0-4848-9203-fdb039cdf185
