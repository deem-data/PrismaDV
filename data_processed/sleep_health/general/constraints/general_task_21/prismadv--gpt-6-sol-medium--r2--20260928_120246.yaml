      sources:
      - start_line: 18
        end_line: 21
        file: ''
      uid: 989393bf-52d0-4257-bb94-a70a4ab3343b
    - text: Every 'Blood Pressure' value should be a string containing exactly two
        base-10 integer components separated by one slash, such as '120/80'. The first
        component is parsed as systolic pressure and the second as diastolic pressure;
        malformed or non-integer components would cause parsing to fail. This can
        be validated with a pattern such as `^[0-9]+/[0-9]+$`.
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: ae494493-47f3-4df7-9266-01d1b10fcf92
    - text: 'The two components of each ''Blood Pressure'' value should represent
        physiologically meaningful pressures: both should be positive, and the systolic
        component should exceed the diastolic component. Otherwise, the threshold-based
        sleep-apnea risk flag could be misleading.'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      - start_line: 66
        end_line: 69
        file: ''
      uid: b0d31947-92c1-49e8-b2d2-3a91cdc72aad
