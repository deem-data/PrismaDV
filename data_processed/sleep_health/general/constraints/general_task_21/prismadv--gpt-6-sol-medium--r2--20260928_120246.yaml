    assumptions:
    - text: 'For every record, ''Sleep Duration'' and ''Quality of Sleep'' should
        both be present and valid together: duration should be numeric and between
        0 and 24 hours, and quality should be an integer from 1 to 10. Otherwise,
        their product and the low-quality/long-sleep indicator may be missing or misleading.
        This can be checked with a row-level constraint on both columns.'
      sources:
