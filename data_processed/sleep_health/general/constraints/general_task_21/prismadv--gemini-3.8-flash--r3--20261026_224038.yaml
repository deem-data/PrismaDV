        end_line: 67
        file: ''
      uid: 1ad08ab5-356d-44ad-99d8-d7f8a5c9bce7
    - text: 'Both ''Quality of Sleep'' and ''Sleep Duration'' are assumed to be non-negative
        values (with ''Quality of Sleep'' typically between 1 and 10 and ''Sleep Duration''
        > 0) so that the computed ''restful_hours'' produces a non-negative and physically
        plausible value when calculating ''restful_deficit''. We could represent this
        assumption as a Deequ constraint like: .satisfies("`Quality of Sleep` >= 0
        AND `Sleep Duration` >= 0", "Sleep duration and quality of sleep must be non-negative")'
      sources:
      - start_line: 26
        end_line: 29
        file: ''
