  '["Quality of Sleep","Sleep Duration"]':
    code: []
    assumptions:
    - text: 'Both ''Quality of Sleep'' and ''Sleep Duration'' must be non-null and
        valid numeric values for all records, as they are used together to compute
        ''restful_hours'' (restful_hours = sleep_duration * (qos / 10.0)) and the
        indicator ''low_qos_long_sleep'' ((qos <= 6) & (sleep_duration >= 7)). Missing
        or coerced NaN values in either column will propagate NaN into the risk scores
        and comparisons. We could represent this assumption as a Deequ constraint
        like: .satisfies("`Quality of Sleep` IS NOT NULL AND `Sleep Duration` IS NOT
        NULL", "Sleep columns must be non-null")'
      sources:
