        \n\n\ndef build_spark():\n    \"\"\"A Spark session whose Deequ classpath\
        \ is pinned to already-resolved jars.\n\n    The default session config asks\
        \ Spark to fetch `spark.jars.packages` through\n    Ivy. That cannot work\
        \ here: Ivy writes its resolution cache under $HOME, and\n    inside the agent's\
