prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 3
constraints:
  BMI Category:
    code:
    - suggestion: .isContainedIn('BMI Category', ['Overweight', 'Normal', 'Obese',
        'Normal Weight'])
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 168c7962-6604-47a0-9591-3ca014ccdcd1
      source_assumptions:
      - fb8f0c9d-a450-448d-8938-960d2e594fa1
    - suggestion: .isComplete('BMI Category')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 8c2612ff-470c-40ff-bc22-7d32e3510f97
      source_assumptions:
      - f06084b7-9d3d-47fa-8ef2-362e1f87e43c
    assumptions:
    - text: 'The ''BMI Category'' column should be of string type and contain valid
        BMI classification values, predominantly including ''Overweight'', ''Obese'',
        ''Normal'', and ''Normal Weight'', as the downstream logic specifically checks
        membership in [''Overweight'', ''Obese''] to calculate apnea risk factors
        and proportions.

        We could represent this assumption as a deequ constraint like this:

        .isContainedIn(''BMI Category'', [''Overweight'', ''Normal'', ''Obese'', ''Normal
        Weight''])'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 65
        end_line: 65
        file: ''
      uid: fb8f0c9d-a450-448d-8938-960d2e594fa1
    - text: 'The ''BMI Category'' column should have high completeness (no missing
        values) so that risk flags and proportions can be accurately evaluated.

        We could represent this assumption as a deequ constraint like this:

        .isComplete(''BMI Category'')'
      sources:
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 65
        end_line: 65
        file: ''
      uid: f06084b7-9d3d-47fa-8ef2-362e1f87e43c
  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 3ee28726-97bf-413c-888b-b5f167a69a75
      source_assumptions:
      - ea5f3629-c845-4048-987d-856bd23ccf86
    - suggestion: .hasPattern('Blood Pressure', r'^[0-9]+/[0-9]+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7667423c-3ff7-4a2d-aa1e-5e6f06b53ad0
      source_assumptions:
      - 3703f648-72b5-4d06-9663-35f082572a21
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values because
        it is directly split and converted to integer types (Systolic and Diastolic)
        without null handling or error coercion. We could represent this assumption
        as a deequ constraint like this: .isComplete("Blood Pressure")'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: ea5f3629-c845-4048-987d-856bd23ccf86
    - text: 'The ''Blood Pressure'' column must follow a format of two integer numbers
        separated by a slash (e.g., ''120/80'') so that splitting on ''/'' yields
        integer-convertible systolic and diastolic values. We could represent this
        assumption as a deequ constraint like this: .hasPattern("Blood Pressure",
        "^[0-9]+/[0-9]+$")'
      sources:
      - start_line: 20
        end_line: 21
        file: ''
      uid: 3703f648-72b5-4d06-9663-35f082572a21
  Daily Steps:
