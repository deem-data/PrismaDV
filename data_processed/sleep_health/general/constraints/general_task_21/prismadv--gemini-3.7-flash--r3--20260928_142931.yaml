  '["Quality of Sleep","Sleep Duration"]':
    code: []
    assumptions:
    - text: 'The columns ''Sleep Duration'' and ''Quality of Sleep'' must both contain
        non-null, non-negative numeric values for all records, so that calculations
        such as restful hours (''Sleep Duration'' * (''Quality of Sleep'' / 10.0))
        and multi-condition evaluations (''Quality of Sleep'' <= 6 and ''Sleep Duration''
        >= 7) produce valid, non-null numerical and boolean values. This can be expressed
        as a constraint ensuring both columns are not null and non-negative: .satisfies("`Sleep
        Duration` IS NOT NULL AND `Quality of Sleep` IS NOT NULL AND `Sleep Duration`
        >= 0 AND `Quality of Sleep` >= 0", "Sleep Duration and Quality of Sleep must
        be non-null and non-negative")'
      sources:
      - start_line: 22
        end_line: 29
        file: ''
      - start_line: 67
        end_line: 67
        file: ''
      uid: 6d47036c-7149-44a0-8049-7140cd94e11b
  '["Sleep Disorder","Stress Level"]':
    code: []
    assumptions:
    - text: 'For records where ''Sleep Disorder'' is ''Insomnia'' or ''Sleep Apnea'',
        ''Stress Level'' should contain valid numeric values so that group mean stress
        levels (''ins_mean_stress'' and ''ap_mean_stress'') can be reliably computed
        without missing value distortion. We could represent this assumption as a
        Deequ constraint like: .satisfies("(`Sleep Disorder` NOT IN (''Insomnia'',
        ''Sleep Apnea'')) OR (`Stress Level` IS NOT NULL)", "Stress Level must not
        be null when Sleep Disorder is Insomnia or Sleep Apnea")'
      sources:
