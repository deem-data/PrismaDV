    - text: 'The columns ''Physical Activity Level'' and ''Daily Steps'' are expected
        to be numeric and have a non-zero variance with a positive correlation between
        them, as they are used together to calculate the Pearson correlation coefficient
        and linear regression expectations without handling zero variance or missing
        values in numpy operations. We could represent this assumption as a Deequ
