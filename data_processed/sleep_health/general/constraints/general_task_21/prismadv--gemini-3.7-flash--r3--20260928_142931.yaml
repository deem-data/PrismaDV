      level: warning
      uid: 97a5b6f4-e674-4dd8-88fd-e063428e0780
      source_assumptions:
      - 72d42bed-e800-4680-a9ef-1bab8233d612
    assumptions:
    - text: 'The ''Sleep Disorder'' column can contain missing or null values, as
        the code filters for specific labeled conditions (''Insomnia'' and ''Sleep
        Apnea'') using `.isin([''Insomnia'', ''Sleep Apnea''])` and handles cases
        where masks might be empty. When non-null, the values are expected to belong
        to the set {''Insomnia'', ''Sleep Apnea''}.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'',
        ''Sleep Apnea'') THEN 1 ELSE 0 END", "Sleep Disorder allowed values", lambda
        x: x == 1.0)'
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      uid: 7332723d-8da7-48ed-be47-aa77c3367c6b
    - text: 'The ''Sleep Disorder'' column should have a string data type to support
        string comparisons and category filtering.

        We could represent this assumption as a deequ constraint like this:

        .hasDataType(''Sleep Disorder'', ConstrainableDataTypes.String)'
      sources:
      - start_line: 42
        end_line: 44
        file: ''
      uid: 72d42bed-e800-4680-a9ef-1bab8233d612
