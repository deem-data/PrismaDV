  Sleep Disorder:
    code:
    - suggestion: .isContainedIn('Sleep Disorder', ['Insomnia', 'Sleep Apnea'])
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a66fe5e1-4e68-4e26-a360-5657c60191db
      source_assumptions:
      - 7332723d-8da7-48ed-be47-aa77c3367c6b
    - suggestion: .hasDataType('Sleep Disorder', ConstrainableDataTypes.String)
