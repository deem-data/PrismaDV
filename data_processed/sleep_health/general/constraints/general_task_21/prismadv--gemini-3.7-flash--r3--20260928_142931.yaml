      source_assumptions:
      - d1d2faa1-cace-44cb-b9cc-fc43a78d9281
    assumptions:
    - text: 'The ''Quality of Sleep'' column should not contain null values, because
        the code converts the column to numeric with errors=''raise'' and casts it
        to int using .astype(int), which would fail if any null or NaN values are
        present.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Quality of Sleep")'
      sources:
      - start_line: 22
        end_line: 22
        file: ''
      uid: 837747b1-be98-45b0-9d98-386eba98f17c
    - text: 'The ''Quality of Sleep'' column should be numeric and representable as
        integers, as it is parsed using pd.to_numeric(..., errors=''raise'').astype(int)
        and used in arithmetic calculations.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CAST(`Quality of Sleep` AS INT) IS NOT NULL", "Quality of Sleep
        is integer convertible", lambda x: x == 1)'
      sources:
