constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category').isContainedIn('BMI Category', ['Normal', 'Normal
        Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure').satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'",
        'parseable_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.isComplete(''Daily Steps'').satisfies(''`Daily Steps` BETWEEN 0 AND 100000'',
        ''valid_daily_steps'').hasStandardDeviation(''Daily Steps'', lambda value:
        value > 0)'
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID').isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.isComplete(''Physical Activity Level'').satisfies(''`Physical Activity Level`
        BETWEEN 0 AND 100'', ''valid_activity_level'').hasStandardDeviation(''Physical
        Activity Level'', lambda value: value > 0)'
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep').satisfies('`Quality of Sleep` BETWEEN 1 AND
        10 AND `Quality of Sleep` = FLOOR(`Quality of Sleep`)', 'valid_quality_of_sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia', 'Sleep
        Apnea')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration').satisfies('`Sleep Duration` > 0 AND `Sleep Duration`
        <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level').satisfies('`Stress Level` BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
