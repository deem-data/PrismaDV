      - start_line: 57
        end_line: 68
        file: ''
      - start_line: 125
        end_line: 128
        file: ''
      uid: 02504c05-d30b-456e-93a2-22c1b274fa61
    - text: For each 'Person ID', all input rows should have the same 'Age'. The code
        takes the first age in each person's group, so differing values would make
