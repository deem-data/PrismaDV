      reason_if_invalid: ''
      level: warning
      uid: 78c80aa3-9978-47d2-9ae7-0f139d09a3eb
      source_assumptions:
      - 53961918-8111-457c-ae60-368d974a75a4
    assumptions:
    - text: The 'Blood Pressure' column should be present and non-null for every input
        row. Missing values are not filled before parsing, and they would produce
        missing blood-pressure measurements that affect scores and weekly averages.
      sources:
      - start_line: 17
        end_line: 19
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 65
        end_line: 66
        file: ''
      uid: cb468a26-ec1c-4077-8a1a-799748b958c2
    - text: Every 'Blood Pressure' value should contain exactly two finite numeric
        measurements separated by a single '/', in systolic/diastolic order (for example,
        '120/80'). Values that cannot be parsed into both numbers are coerced to missing,
        affecting scoring, averages, and recommendations.
      sources:
      - start_line: 17
        end_line: 19
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 103
        end_line: 106
        file: ''
      uid: a2e308f6-6972-4664-bcdf-32f22244eaaa
    - text: Both measurements in each 'Blood Pressure' value should be positive, and
        the systolic measurement should be greater than the diastolic measurement.
        The code subtracts diastolic from systolic to calculate pulse pressure and
        treats the two measurements as distinct clinical quantities.
      sources:
      - start_line: 17
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 35
        file: ''
      uid: 53961918-8111-457c-ae60-368d974a75a4
