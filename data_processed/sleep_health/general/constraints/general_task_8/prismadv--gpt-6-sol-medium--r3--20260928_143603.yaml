    - text: For every record, the systolic value parsed from 'Blood Pressure' should
        be greater than its diastolic value, both values should be positive, and 'Heart
        Rate' should be positive. These are jointly used as cardiovascular measurements
        in scoring and recommendations. A row-level constraint can compare the two
        parsed blood-pressure values and check all three values are greater than zero.
