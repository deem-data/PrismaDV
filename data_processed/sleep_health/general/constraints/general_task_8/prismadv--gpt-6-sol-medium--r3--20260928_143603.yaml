        by '/', and the corresponding 'Heart Rate' should be a non-null numeric value.
        Otherwise, blood-pressure parsing can produce nulls while the code still calculates
        a cardiovascular score for that record. This can be checked with a row-level
        constraint requiring `Blood Pressure` to match `^[0-9]+/[0-9]+$` and `Heart
        Rate` to be non-null and numeric.
