    assumptions:
    - text: Every record used to calculate a sleep wellness score should have non-null,
        numeric values for Sleep Duration, Quality of Sleep, Daily Steps, Physical
        Activity Level, Heart Rate, and Stress Level, plus a Blood Pressure value
        that can be parsed into numeric systolic and diastolic readings. Sleep Disorder
        may be null because the code explicitly handles that case. This can be checked
        with a row-level conjunction of non-null and parseability conditions.
      sources:
      - start_line: 17
        end_line: 41
        file: ''
      - start_line: 45
        end_line: 54
        file: ''
      uid: 37cf3fec-be1e-4263-aaa5-33f494f7cb56
    - text: 'The two numbers in Blood Pressure should represent a valid pair: both
        must be positive, and systolic pressure must be greater than diastolic pressure.
        Otherwise, pulse pressure and the cardiovascular score would be misleading.
        For example, require Blood Pressure to match a two-number ''systolic/diastolic''
        format and assert parsed_systolic > parsed_diastolic > 0.'
      sources:
      - start_line: 17
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 103
        end_line: 106
        file: ''
      uid: aa85cec3-f466-402b-9a46-cdc8aff6c048
    - text: "Sleep Duration and Quality of Sleep should jointly contain valid inputs\
        \ for the sleep component: duration should be greater than 0 and at most 24\
        \ hours, and quality should be on the 0\u201310 scale implied by its division\
        \ by 10. Require both conditions on every scored record; low values must remain\
        \ allowed because they drive recommendations."
      sources:
      - start_line: 21
        end_line: 26
        file: ''
      - start_line: 61
        end_line: 62
        file: ''
      - start_line: 97
        end_line: 98
        file: ''
      uid: 71b12659-34d9-4203-bafb-105ce152ca84
    - text: 'Daily Steps and Physical Activity Level should jointly be valid activity
        inputs: steps must be nonnegative, and reported activity level must be between
        0 and 100, inclusive. Steps above 10,000 should remain allowed because the
        code explicitly clips their contribution rather than treating them as invalid.'
      sources:
      - start_line: 27
        end_line: 31
        file: ''
      - start_line: 63
        end_line: 63
        file: ''
      uid: 5642cc69-9118-41e0-aac3-029ca5f25cfd
