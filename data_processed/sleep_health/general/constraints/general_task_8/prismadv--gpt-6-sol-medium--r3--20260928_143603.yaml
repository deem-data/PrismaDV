      source_assumptions:
      - 02504c05-d30b-456e-93a2-22c1b274fa61
    assumptions:
    - text: The input data must contain an 'Age' column, because the code selects
        it during aggregation and includes it in the weekly scores output.
      sources:
      - start_line: 57
        end_line: 68
        file: ''
      - start_line: 125
        end_line: 128
        file: ''
      uid: 6b2fc583-5774-4bf1-8696-3217d56c26b9
    - text: The 'Age' column should have no null values. The code does not fill missing
