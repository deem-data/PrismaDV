      - start_line: 17
        end_line: 19
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      uid: 5968569a-aaca-4e2a-910b-68abece3aec1
    - text: 'The numeric measurements encoded in ''Blood Pressure'' should be physiologically
        meaningful: systolic and diastolic pressures should both be positive, and
        systolic pressure should exceed diastolic pressure. The code subtracts diastolic
        from systolic to calculate pulse pressure and uses the measurements for cardiovascular
        scoring and recommendations.'
      sources:
      - start_line: 17
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 103
        end_line: 106
        file: ''
