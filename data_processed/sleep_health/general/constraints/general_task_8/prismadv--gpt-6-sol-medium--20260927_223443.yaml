        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 57
        end_line: 66
        file: ''
      - start_line: 103
        end_line: 106
        file: ''
      uid: 195825c8-8575-49ec-8c4e-3853d8a6d3de
    - text: Every 'Blood Pressure' value should contain a systolic and a diastolic
        measurement separated by '/'. Both parts must be convertible to finite numbers
        by pandas.to_numeric; otherwise the code coerces them to missing values. A
        validation rule could split each input value on its first '/' and check that
        both resulting parts are numeric and finite.
