    assumptions:
    - text: The input data should contain a column named 'Stress Level', because the
        script accesses it directly for scoring and aggregation.
      sources:
      - start_line: 40
        end_line: 41
        file: ''
      - start_line: 57
        end_line: 67
        file: ''
      uid: dc0662d6-1bfa-4993-8e20-954fe3d11eb3
    - text: The 'Stress Level' column should contain no null values. The script does
        not fill missing stress values, so a null would leave that record's stress
        penalty and sleep wellness score missing.
      sources:
      - start_line: 40
        end_line: 41
        file: ''
      - start_line: 50
        end_line: 54
        file: ''
      uid: 3ce54576-892b-4037-964e-ae477d2e4e6b
    - text: Every 'Stress Level' value should be a finite numeric integer, consistent
        with the observed integral data. The script performs arithmetic on each value
        and calculates a per-person mean without converting the column to numeric.
      sources:
      - start_line: 40
        end_line: 41
        file: ''
      - start_line: 57
        end_line: 67
        file: ''
      uid: 8b9e968b-7250-4543-b7d8-4cdbd0c99e4c
    - text: Each 'Stress Level' value should be between 3 and 10, inclusive. The normalization
        treats 3 as the zero-penalty point and 10 as the full-penalty point; values
        outside that range are clipped and lose their relative magnitude. The observed
        values, 3 through 8, fall within this range.
      sources:
      - start_line: 40
        end_line: 41
        file: ''
      - start_line: 53
        end_line: 54
        file: ''
