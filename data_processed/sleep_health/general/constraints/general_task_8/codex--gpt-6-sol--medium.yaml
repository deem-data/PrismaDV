        \ consider a BP check this week and consult a clinician if elevated persists.')\n\
        \    if row['Primary Sleep Disorder'] == 'Insomnia':\n        recs.append(\n\
        \            'Consider CBT-I techniques: fixed wake time, stimulus control,\
