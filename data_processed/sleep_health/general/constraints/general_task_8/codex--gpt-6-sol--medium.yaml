      assumptions: []
      column_name: Sleep Disorder
    Sleep Duration:
      code:
      - - .isComplete('Sleep Duration')
        - Valid
      - - .satisfies('`Sleep Duration` > 0 AND `Sleep Duration` <= 24', 'valid_sleep_duration')
        - Valid
      assumptions: []
      column_name: Sleep Duration
    Stress Level:
      code:
      - - .isComplete('Stress Level')
        - Valid
      - - .satisfies('`Stress Level` >= 0 AND `Stress Level` <= 10', 'valid_stress_level')
        - Valid
      assumptions: []
      column_name: Stress Level
