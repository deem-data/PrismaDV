        \ = df['bp_sys'] - df['bp_dia']\ndf['sleep_duration_component'] = np.clip(1\
        \ - (np.abs(df['Sleep Duration'] - 8.0) / 5.0), 0, 1)\ndf['sleep_quality_component']\
        \ = df['Quality of Sleep'] / 10.0\n\n# Combine into sleep component\n# Emphasize\
        \ duration slightly\ndf['sleep_component'] = np.clip(0.6 * df['sleep_duration_component']\
