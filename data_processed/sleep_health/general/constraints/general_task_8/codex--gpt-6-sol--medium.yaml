prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_csv = os.path.join(args.input,\
  \ 'new_data.csv')\ndf = pd.read_csv(input_csv)\n\n# Prepare fields used later\n\
  # Parse blood pressure for downstream scoring\nbp_split = df['Blood Pressure'].str.split('/',\
  \ n=1, expand=True)\ndf['bp_sys'] = pd.to_numeric(bp_split[0], errors='coerce')\n\
  df['bp_dia'] = pd.to_numeric(bp_split[1], errors='coerce')\ndf['pulse_pressure']\
  \ = df['bp_sys'] - df['bp_dia']\ndf['sleep_duration_component'] = np.clip(1 - (np.abs(df['Sleep\
  \ Duration'] - 8.0) / 5.0), 0, 1)\ndf['sleep_quality_component'] = df['Quality of\
  \ Sleep'] / 10.0\n\n# Combine into sleep component\n# Emphasize duration slightly\n\
  df['sleep_component'] = np.clip(0.6 * df['sleep_duration_component'] + 0.4 * df['sleep_quality_component'],\
  \ 0, 1)\n# Activity score blends steps and reported activity level\n# Scale steps\
  \ to 0..1 around 10k steps\nsteps_component = np.clip(df['Daily Steps'] / 10000.0,\
  \ 0, 1)\nactivity_level_component = np.clip(df['Physical Activity Level'] / 100.0,\
  \ 0, 1)\ndf['activity_component'] = np.clip(0.8 * steps_component + 0.2 * activity_level_component,\
  \ 0, 1)\n# Cardio component derived from BP and HR\n# Penalize deviations from 120/80\
  \ and HR around 70\nsys_risk = np.clip((df['bp_sys'] - 120.0) / 40.0, 0, None) +\
  \ np.clip((110.0 - df['bp_sys']) / 40.0, 0, None)\ndia_risk = np.clip((df['bp_dia']\
  \ - 80.0) / 30.0, 0, None) + np.clip((70.0 - df['bp_dia']) / 30.0, 0, None)\nhr_risk\
  \ = np.clip(np.abs(df['Heart Rate'] - 70.0) / 30.0, 0, 1)\ncombined_bp_risk = np.clip(np.maximum(sys_risk,\
  \ dia_risk), 0, 1)\ndf['cardio_component'] = np.clip(1 - (0.6 * combined_bp_risk\
  \ + 0.4 * hr_risk), 0, 1)\n# Stress factor adjustment\nstress_norm = np.clip((df['Stress\
  \ Level'] - 3.0) / 7.0, 0, 1)\ndf['stress_penalty'] = stress_norm\n\n# Sleep disorder\
  \ constraints before use in recommendations and penalties\n# Sleep disorder penalty\n\
  disorder_map = {'Insomnia': 0.85, 'Sleep Apnea': 0.75}\ndf['disorder_factor'] =\
  \ 1.0\nhas_disorder = df['Sleep Disorder'].isin(disorder_map.keys())\ndf.loc[has_disorder,\
  \ 'disorder_factor'] = df.loc[has_disorder, 'Sleep Disorder'].map(disorder_map)\n\
  \n# Compute final per-record sleep wellness score (0-100)\nbase = 0.5 * df['sleep_component']\
  \ + 0.2 * df['activity_component'] + 0.3 * df['cardio_component']\nscore = 100.0\
  \ * np.clip(base, 0, 1)\nscore_adjusted = np.clip(score * df['disorder_factor']\
  \ - 10.0 * df['stress_penalty'], 0, 100)\ndf['sleep_wellness_score'] = score_adjusted\n\
  \n# Aggregate weekly by person\nagg = df.groupby('Person ID').agg({\n    'Gender':\
  \ 'first',\n    'Age': 'first',\n    'sleep_wellness_score': 'mean',\n    'Sleep\
  \ Duration': 'mean',\n    'Quality of Sleep': 'mean',\n    'Daily Steps': 'mean',\n\
  \    'Heart Rate': 'mean',\n    'bp_sys': 'mean',\n    'bp_dia': 'mean',\n    'Stress\
  \ Level': 'mean'\n}).reset_index()\n\n\n# Derive primary sleep disorder per person\
  \ (mode excluding NaN)\ndef primary_disorder(g):\n    vals = g.dropna()\n    if\
  \ len(vals) == 0:\n        return None\n    return vals.value_counts().idxmax()\n\
  \n\ndisorder_by_person = df.groupby('Person ID')['Sleep Disorder'].apply(primary_disorder).reset_index(\n\
  \    name='Primary Sleep Disorder')\nweekly = agg.merge(disorder_by_person, on='Person\
  \ ID', how='left')\nweekly.rename(columns={\n    'sleep_wellness_score': 'weekly_sleep_wellness_score',\n\
  \    'Sleep Duration': 'avg_sleep_hours',\n    'Quality of Sleep': 'avg_sleep_quality',\n\
  \    'Daily Steps': 'avg_daily_steps',\n    'Heart Rate': 'avg_heart_rate',\n  \
  \  'bp_sys': 'avg_systolic_bp',\n    'bp_dia': 'avg_diastolic_bp',\n    'Stress\
  \ Level': 'avg_stress_level'\n}, inplace=True)\n\n\n# Generate coaching recommendations\n\
  def gen_reco(row):\n    recs = []\n    if (row['avg_sleep_hours'] is not None) and\
  \ (row['avg_sleep_hours'] < 7.0 or row['avg_sleep_quality'] < 6.0):\n        recs.append('Target\
  \ a consistent 7-9 hours; set a fixed bedtime and reduce screens 60 minutes before\
  \ bed.')\n    if (row['avg_daily_steps'] is not None) and (row['avg_daily_steps']\
  \ < 8000):\n        recs.append('Increase activity: add 2k-3k steps per day with\
  \ short walking meetings or post-lunch walks.')\n    if (row['avg_stress_level']\
  \ is not None) and (row['avg_stress_level'] >= 7):\n        recs.append('Practice\
  \ 10 minutes of guided breathing or mindfulness twice daily to lower evening arousal.')\n\
  \    if (row['avg_systolic_bp'] is not None and row['avg_diastolic_bp'] is not None)\
  \ and (\n            row['avg_systolic_bp'] >= 140 or row['avg_diastolic_bp'] >=\
  \ 90 or row['avg_heart_rate'] >= 90):\n        recs.append(\n            'Monitor\
  \ cardiovascular health; consider a BP check this week and consult a clinician if\
  \ elevated persists.')\n    if row['Primary Sleep Disorder'] == 'Insomnia':\n  \
  \      recs.append(\n            'Consider CBT-I techniques: fixed wake time, stimulus\
  \ control, and sleep restriction under guidance.')\n    if row['Primary Sleep Disorder']\
  \ == 'Sleep Apnea':\n        recs.append(\n            'Ensure CPAP adherence and\
  \ side-sleeping; consult a sleep specialist for device fit if comfort issues.')\n\
  \    if not recs:\n        recs.append('Maintain current routines; prioritize wind-down,\
  \ daylight exposure, and regular activity.')\n    return ' '.join(recs)\n\n\nweekly['coaching_recommendations']\
  \ = weekly.apply(gen_reco, axis=1)\n\n# Persist outputs\nos.makedirs(args.output,\
  \ exist_ok=True)\nweekly_scores_path = os.path.join(args.output, 'weekly_sleep_scores.csv')\n\
  reco_path = os.path.join(args.output, 'coaching_recommendations.csv')\n\nweekly_scores_cols\
  \ = ['Person ID', 'Gender', 'Age', 'weekly_sleep_wellness_score', 'avg_sleep_hours',\n\
  \                      'avg_sleep_quality', 'avg_daily_steps', 'avg_heart_rate',\
  \ 'avg_systolic_bp', 'avg_diastolic_bp',\n                      'avg_stress_level',\
  \ 'Primary Sleep Disorder']\nweekly[weekly_scores_cols].to_csv(weekly_scores_path,\
  \ index=False)\n\nweekly[['Person ID', 'coaching_recommendations']].to_csv(reco_path,\
  \ index=False)\n\n```\n\nThe same program is on disk at `./code/general_task_8.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 121, 'Person ID': 294, 'Gender':\
  \ 'Female', 'Age': 50, 'Occupation': 'Nurse', 'Sleep Duration': 6.0, 'Quality of\
  \ Sleep': 6, 'Physical Activity Level': 90, 'Stress Level': 8, 'BMI Category': 'Overweight',\
  \ 'Blood Pressure': '140/95', 'Heart Rate': 75, 'Daily Steps': 10000, 'Sleep Disorder':\
  \ 'Sleep Apnea'}, {'id': 5, 'Person ID': 373, 'Gender': 'Female', 'Age': 59, 'Occupation':\
  \ 'Nurse', 'Sleep Duration': 8.1, 'Quality of Sleep': 9, 'Physical Activity Level':\
  \ 75, 'Stress Level': 3, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95',\
  \ 'Heart Rate': 68, 'Daily Steps': 7000, 'Sleep Disorder': 'Sleep Apnea'}, {'id':\
  \ 82, 'Person ID': 94, 'Gender': 'Male', 'Age': 35, 'Occupation': 'Lawyer', 'Sleep\
  \ Duration': 7.4, 'Quality of Sleep': 7, 'Physical Activity Level': 60, 'Stress\
  \ Level': 5, 'BMI Category': 'Obese', 'Blood Pressure': '135/88', 'Heart Rate':\
  \ 84, 'Daily Steps': 3300, 'Sleep Disorder': 'Sleep Apnea'}]\n\nThe full table is\
  \ on disk at `./data/tables/observed_data.csv`. You have complete access to it:\n\
  load it with pandas, profile it, plot it, run whatever analysis helps. It is a\n\
  throwaway copy -- nothing you do to it has any effect outside this workspace.\n\n\
  # Verifying your constraints\n\nYou can execute PyDeequ constraint code against\
  \ the staged table and read back\nthe result of every check:\n\n```\npython deequ_check.py\
  \ --table observed_data --constraints <your_constraints_file>\n```\n\nwhere the\
  \ constraints file is plain text with one PyDeequ `Check` call per line,\nfor example:\n\
  \n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"status\"\
  , [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`,\
  \ and a failure prints the reason,\nincluding compilation errors. Use it as often\
  \ as you like.\n\n# Output format\n\nWrite `constraints.json` in the current folder,\
  \ containing the union of what you\nsettled on for every column:\n\n{\n    \"constraints\"\
  : [\n        {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
