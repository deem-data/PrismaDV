        \ and write, not which interpreter runs.\n\nEverything you need is here. Work\
        \ only from it.\nimport argparse\nimport os\n\nimport numpy as np\nimport\
        \ pandas as pd\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--input',\
        \ type=str, required=True)\nparser.add_argument('--output', type=str, required=True)\n\
