      - - .isComplete('Daily Steps')
        - Valid
      - - .satisfies('`Daily Steps` >= 0', 'nonnegative_daily_steps')
        - Valid
      assumptions: []
      column_name: Daily Steps
    Gender:
      code:
      - - .isComplete('Gender')
        - Valid
      assumptions: []
      column_name: Gender
    Heart Rate:
      code:
      - - .isComplete('Heart Rate')
        - Valid
      - - .satisfies('`Heart Rate` >= 30 AND `Heart Rate` <= 220', 'valid_heart_rate')
        - Valid
      assumptions: []
      column_name: Heart Rate
    Person ID:
      code:
      - - .isComplete('Person ID')
        - Valid
      assumptions: []
      column_name: Person ID
    Physical Activity Level:
      code:
      - - .isComplete('Physical Activity Level')
        - Valid
      - - .satisfies('`Physical Activity Level` >= 0 AND `Physical Activity Level`
          <= 100', 'valid_activity_level')
        - Valid
      assumptions: []
      column_name: Physical Activity Level
    Quality of Sleep:
      code:
      - - .isComplete('Quality of Sleep')
        - Valid
      - - .satisfies('`Quality of Sleep` >= 0 AND `Quality of Sleep` <= 10', 'valid_sleep_quality')
        - Valid
      assumptions: []
      column_name: Quality of Sleep
    Sleep Disorder:
      code:
      - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia',
