        \ Sleep Disorder')\nweekly = agg.merge(disorder_by_person, on='Person ID',\
        \ how='left')\nweekly.rename(columns={\n    'sleep_wellness_score': 'weekly_sleep_wellness_score',\n\
        \    'Sleep Duration': 'avg_sleep_hours',\n    'Quality of Sleep': 'avg_sleep_quality',\n\
        \    'Daily Steps': 'avg_daily_steps',\n    'Heart Rate': 'avg_heart_rate',\n\
        \    'bp_sys': 'avg_systolic_bp',\n    'bp_dia': 'avg_diastolic_bp',\n   \
        \ 'Stress Level': 'avg_stress_level'\n}, inplace=True)\n\n\n# Generate coaching\
        \ recommendations\ndef gen_reco(row):\n    recs = []\n    if (row['avg_sleep_hours']\
        \ is not None) and (row['avg_sleep_hours'] < 7.0 or row['avg_sleep_quality']\
        \ < 6.0):\n        recs.append('Target a consistent 7-9 hours; set a fixed\
        \ bedtime and reduce screens 60 minutes before bed.')\n    if (row['avg_daily_steps']\
        \ is not None) and (row['avg_daily_steps'] < 8000):\n        recs.append('Increase\
        \ activity: add 2k-3k steps per day with short walking meetings or post-lunch\
        \ walks.')\n    if (row['avg_stress_level'] is not None) and (row['avg_stress_level']\
        \ >= 7):\n        recs.append('Practice 10 minutes of guided breathing or\
        \ mindfulness twice daily to lower evening arousal.')\n    if (row['avg_systolic_bp']\
