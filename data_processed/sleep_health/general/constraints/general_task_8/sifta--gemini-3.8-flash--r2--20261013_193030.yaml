  instructions:
    dataflow_inspector: "Carefully inspect the code script to identify every line\
      \ that touches the target column: reads it (e.g., df['column'], df.column, or\
      \ column included in a list of column names), writes or assigns to it, filters\
      \ on it, transforms it, merges on it, or outputs it.\n\nGuidelines:\n- Search\
      \ for the target column name (e.g., `'<target_column>'`, `\"<target_column>\"\
      `, or `.<target_column>`) and trace its complete dataflow through assignments,\
      \ aliases, and transformations.\n- Accurate line numbering: Count lines sequentially\
      \ starting from line 1 at the very top of the script (including all comments,\
      \ blank lines, and import statements). Verify line numbers against the actual\
      \ code lines rather than estimating.\n- Contiguous blocks and calculations:\n\
      \  - If the target column is declared within a list or tuple of column names\
      \ (e.g., `num_cols = [...]`), include the list definition and the loop that\
      \ iterates over and transforms the column.\n  - If the column is assigned to\
      \ an alias or variable (e.g., `sd = sleep_disorder` or `dur = df['Sleep Duration']`),\
      \ trace the downstream usage of that alias. Include the entire contiguous block\
      \ of statements computing derived features, risk components, or aggregations\
      \ from that alias (do not fragment contiguous calculation blocks into disjoint\
      \ 1-line ranges).\n  - Include closely coupled data structures: If an alias\
      \ is mapped against a dictionary or validated against a set (e.g., `disorder_risk_map\
      \ = {'Sleep Apnea': 1.0, 'Insomnia': 0.6}`), include the definition lines as\
      \ well as the mapping lines.\n  - Control flow and branching: When a column\
      \ or its alias is evaluated inside conditional branches or loops (e.g., `if\
      \ sd_i == 'Sleep Apnea': ...`), include the conditional check and the contiguous\
      \ body statements executed under that branch.\n- Group contiguous lines into\
      \ single ranges `[{ \"start_line\": int, \"end_line\": int }]`. Avoid fragmented\
      \ single-line entries when the lines form a coherent, contiguous block of logic\
      \ touching the column.\n\nOutput only JSON: { \"sources\": [{ \"start_line\"\
      : int, \"end_line\": int }, ...] }"
    assumption_generation: "Analyze how the target column is used in the code and\
      \ what the downstream task requires. Code relies on assumptions about its input\
      \ data—often unstated—where violations cause the script to crash or silently\
      \ produce corrupted, incorrect results.\n\nPrioritize precision over broad coverage.\
      \ Formulate assumptions whose violation truly breaks downstream code execution\
      \ or corrupts outputs. Avoid asserting properties that the code tolerates or\
      \ safely handles, while ensuring essential properties of active columns are\
      \ not skipped:\n\n1. Data Type & Format:\n   - What data type (Numeric, Integral,\
      \ String) is strictly required? For numeric columns used in arithmetic, mathematical\
      \ modeling (e.g., `np.polyfit`), rankings (`.rank()`), or threshold comparisons,\
      \ state that conforming numeric values are required. Non-numeric data causes\
      \ unhandled casting exceptions or coerces to NaNs that corrupt downstream aggregations\
      \ or risk assignments.\n   - String pattern constraints: For formatted strings\
      \ such as 'Blood Pressure' parsed with `.str.split('/', n=1, expand=True)` or\
      \ regex extraction, assume values must follow the expected pattern (e.g., systolic\
      \ and diastolic values separated by '/') because missing delimiters cause split\
      \ key index errors or unparseable values that corrupt calculations.\n2. Nullability\
      \ & Completeness:\n   - Fatal completeness: Completeness is required at error\
      \ level if missing values cause unhandled crashes (e.g., string splits on None,\
      \ uncoerced astype) or propagate NaNs through calculations, percentiles, and\
      \ rankings (e.g., `df['col'].rank()`, arithmetic `+`, `*` without `fillna`,\
      \ or `np.polyfit`) that contaminate final output columns.\n   - High completeness\
      \ vs Tolerated missingness: For primary biometric/activity measurements that\
      \ have 100% completeness in clean data (e.g., 'Sleep Duration', 'Heart Rate',\
      \ 'Daily Steps'), missing values that default to 0 in risk scores distort evaluation.\
      \ However, new safe partitions may contain a small number of missing values.\
      \ Assume the column must maintain high completeness (e.g., at least 80-90% non-null)\
      \ rather than strict 100% completeness, unless nulls are completely fatal.\n\
      \   - Naturally sparse/nullable columns: Columns such as 'Sleep Disorder' where\
      \ nulls represent the absence of disorder should NOT be assumed to be complete.\n\
      3. Categorical Domain & Conventions:\n   - For categorical columns mapped via\
      \ dictionaries or conditional branches:\n     - Recognize domain conventions:\
      \ In health and lifestyle datasets, absence of a disorder or condition is often\
      \ represented as Null/NaN, `'None'`, `'Normal'`, or `'No Disorder'`. Allowed\
      \ category assumptions must accommodate these absence-of-condition representations\
      \ alongside specific diagnoses (`'Sleep Apnea'`, `'Insomnia'`) to prevent false\
      \ alarms on safe partitions where absence of disorder is encoded as a string.\n\
      \     - If unmapped values are safely absorbed by a default (e.g., `.fillna(0.0)`)\
      \ without corrupting downstream risk logic, do not treat unmapped categories\
      \ as fatal errors.\n4. Value Domain & Bounded Scales:\n   - Assume value bounds\
      \ when downstream mathematical formulas explicitly depend on a specific bounded\
      \ scale (e.g., rating scales normalized by `x / 10.0` or `normalize(x, 0.0,\
      \ 10.0)` where values outside `[0, 10]` invert or break normalized indices).\n\
      \   - Do NOT assume strict non-negativity (`>= 0`) or tight real-world boundaries\
      \ if the code merely ranks (`.rank()`) or applies threshold comparisons, as\
      \ safe partitions may contain sentinel or slightly out-of-range values that\
      \ the code tolerates.\n5. Sample Size / Co-occurrence:\n   - When columns participate\
      \ in pairwise modeling without guards (e.g., `np.polyfit(x, y, 1)` requiring\
      \ at least 2 points), assume the dataset must contain at least 2 non-null rows.\n\
      6. Uniqueness / Keys:\n   - Do NOT assume uniqueness for identifier columns\
      \ (e.g., 'Person ID') unless downstream code explicitly performs operations\
      \ requiring distinctness (e.g., 1-to-1 merges or unique indexing). In row-by-row\
      \ scoring or tracking pipelines, repeated IDs across partitions are safe.\n\n\
      Explicitly indicate whether violating each assumption breaks the code or silently\
      \ invalidates results, versus something the code gracefully handles.\n\nOutput\
      \ only valid JSON (numbers without leading zeros): { \"assumptions\": [{ \"\
      text\": str, \"sources\": [{ \"start_line\": int, \"end_line\": int }] }, ...]\
      \ }"
    ir_generation: "Translate the assumptions into PyDeequ checks. Link each check\
      \ to the indices (from 0) of the assumptions it tests.\n\nAssigning Severity\
      \ Levels and Designing Constraints:\n- Set level \"error\" if data that fails\
      \ the check causes the code to crash OR silently produce incorrect/corrupted\
      \ results (e.g., propagating unexpected NaNs into calculations/rankings, unhandled\
      \ pattern splits, or out-of-bounds inputs distorting normalized index calculations).\n\
      - Set level \"warning\" if the code explicitly and safely handles the anomaly\
      \ with a fallback default without corrupting downstream outputs, or if unmapped\
      \ values safely absorb without invalidating results.\n\nCRITICAL: PREVENT FALSE\
      \ ALARMS ON SAFE PARTITIONS:\n- Completeness and Data Type:\n  - Enforce `.isComplete()`\
      \ at level \"error\" ONLY IF missing values cause unhandled crashes (e.g., string\
      \ splits on None) or catastrophic NaN propagation.\n  - For primary numeric\
      \ columns where safe partitions might tolerate a few missing values without\
      \ breaking execution, prefer `.hasCompleteness('col', lambda x: x >= 0.85)`\
      \ or `lambda x: x >= 0.90` instead of rigid `.isComplete('col')`. This catches\
      \ severely corrupted or empty columns while preventing false alarms on safe\
      \ partitions with minor missingness.\n  - Do NOT enforce `.isComplete()` or\
      \ completeness thresholds on naturally sparse or nullable columns (e.g., 'Sleep\
      \ Disorder' where nulls indicate absence of disorder).\n  - Enforce `.hasDataType('col',\
      \ ConstrainableDataTypes.Numeric)` (or `.hasDataType('col', ConstrainableDataTypes.Numeric,\
      \ lambda x: x >= 0.95)`) at level \"error\" for numeric features used in mathematical\
      \ operations, correlations, and comparisons to prevent unparseable strings from\
      \ contaminating results.\n- Categorical Columns and Domains:\n  - When asserting\
      \ `.isContainedIn('col', allowed_values)` for categorical columns representing\
      \ conditions or disorders (e.g., 'Sleep Disorder'), ensure allowed values include\
      \ absence-of-condition representations present in safe data (e.g., `['Sleep\
      \ Apnea', 'Insomnia', 'None']` or `['Normal', 'Normal Weight', 'Overweight',\
      \ 'Obese']`).\n  - If the code uses `.fillna(0.0)` or safe defaulting for unmapped\
      \ categories and does not crash or distort downstream results, assign level\
      \ \"warning\" rather than \"error\" to prevent false alarms on safe partitions.\n\
      - String Patterns:\n  - For structured string columns like 'Blood Pressure',\
      \ enforce `.hasPattern('Blood Pressure', r'^\\d+/\\d+$')` at level \"error\"\
