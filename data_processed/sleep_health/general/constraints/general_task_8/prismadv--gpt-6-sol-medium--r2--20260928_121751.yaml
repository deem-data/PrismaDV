        end_line: 29
        file: ''
      - start_line: 57
        end_line: 63
        file: ''
      uid: a4216e95-2b80-4271-805b-8f7652eb86d2
    - text: Every 'Daily Steps' value should be non-null and numeric. The script does
        not fill or convert this column before dividing it by 10000, and missing values
        would leave the per-record activity component undefined. This is consistent
        with the reported completeness of 1.0.
      sources:
      - start_line: 29
        end_line: 31
        file: ''
      - start_line: 50
        end_line: 54
        file: ''
      uid: a46c2825-b9d5-496d-b048-a538624614c8
    - text: Each 'Daily Steps' value should be a non-negative whole-number count of
        steps per day. Negative or fractional counts do not represent daily steps;
        negative values would be silently clipped to zero in the activity score. This
        is consistent with the column's reported integral data type.
      sources:
      - start_line: 27
        end_line: 31
        file: ''
      uid: adf8989c-08a1-4617-b6a1-02d5d2cfdaea
    - text: 'The column should contain raw daily step counts, rather than values already
        scaled to a fraction or a weekly total. The score divides each value by 10000,
        while the recommendation compares the per-person mean with 8000. Values above
        10000 are permitted: the scoring component clips them rather than rejecting
        them.'
      sources:
      - start_line: 27
        end_line: 31
        file: ''
      - start_line: 56
        end_line: 63
        file: ''
      - start_line: 95
        end_line: 100
        file: ''
      uid: 4ea3cfa3-3574-460f-aa68-b308234483f5
