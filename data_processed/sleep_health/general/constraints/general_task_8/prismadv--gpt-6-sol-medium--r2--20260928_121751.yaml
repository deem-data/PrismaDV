      reason_if_invalid: ''
      level: warning
      uid: ac3c95a3-8023-4e71-a714-dc8e18f4a48e
      source_assumptions:
      - 65325b16-adcc-4179-b3ca-fd0edeaef5ab
    - suggestion: '.satisfies("try_cast(trim(split(`Blood Pressure`, ''/'')[0]) AS
        DOUBLE) > try_cast(trim(split(`Blood Pressure`, ''/'')[1]) AS DOUBLE) AND
        try_cast(trim(split(`Blood Pressure`, ''/'')[1]) AS DOUBLE) > 0 AND try_cast(trim(split(`Blood
        Pressure`, ''/'')[0]) AS DOUBLE) <= 1.7976931348623157E308", ''finite_positive_systolic_above_diastolic'',
        lambda x: x == 1)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 435d73b8-2772-4a6b-87b9-0de309a2b7a0
      source_assumptions:
      - 65325b16-adcc-4179-b3ca-fd0edeaef5ab
      - c7a9a7ce-98c4-43d7-9fc9-b8dfbdcf3d12
    assumptions:
    - text: The input must contain a 'Blood Pressure' column, and every row should
        have a non-null value. The code does not fill missing blood pressures, so
        they would produce missing blood-pressure components and could affect scores
        and weekly averages.
      sources:
      - start_line: 17
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 57
        end_line: 66
        file: ''
      uid: 4ccbac07-cc34-44f6-b006-b93ffdf4c8d2
    - text: Every 'Blood Pressure' value should contain exactly one '/' separating
        two values that can each be parsed as finite numbers, in systolic/diastolic
        order (for example, '120/80'). Otherwise, numeric conversion produces missing
        values that propagate into scoring and aggregation.
      sources:
      - start_line: 17
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 65
        end_line: 66
        file: ''
      uid: 65325b16-adcc-4179-b3ca-fd0edeaef5ab
    - text: The parsed systolic and diastolic pressures should both be positive, and
        systolic pressure should exceed diastolic pressure. This keeps the calculated
        pulse pressure and the cardiovascular scoring inputs physiologically meaningful;
        elevated readings must still be allowed because the code uses them for risk
        scoring and recommendations.
      sources:
      - start_line: 20
        end_line: 20
        file: ''
      - start_line: 34
        end_line: 38
        file: ''
      - start_line: 103
        end_line: 106
        file: ''
      uid: c7a9a7ce-98c4-43d7-9fc9-b8dfbdcf3d12
