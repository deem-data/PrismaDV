prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Age:
    code:
    - suggestion: .satisfies('`Age` IS NULL OR `Age` IS NOT NULL', 'Age column exists')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 41087cdf-abac-427e-b810-db9fd830f49a
      source_assumptions:
      - b8cc83cc-56ce-4948-a302-5ea8c05f1e8c
    - suggestion: .isComplete('Age')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 9da9524b-5f73-4145-a1df-d0dc4fd5d3df
      source_assumptions:
      - 0a65dfba-adac-4dc3-859b-2f4bfc1c1142
    assumptions:
    - text: The input must contain an 'Age' column, because the code selects it during
        aggregation and includes it in the output.
      sources:
      - start_line: 57
        end_line: 59
        file: ''
      - start_line: 125
        end_line: 128
        file: ''
      uid: b8cc83cc-56ce-4948-a302-5ea8c05f1e8c
    - text: The 'Age' column should contain no null values. The code does not fill
        missing ages, and the per-person output is expected to carry an age.
      sources:
      - start_line: 57
        end_line: 59
        file: ''
      - start_line: 125
        end_line: 128
        file: ''
      uid: 0a65dfba-adac-4dc3-859b-2f4bfc1c1142
    - text: All records for the same 'Person ID' should have the same 'Age'. The code
        takes only the first age in each group to represent that person, so differing
        values would be silently discarded.
      sources:
      - start_line: 56
        end_line: 59
        file: ''
      uid: bb1605bf-7fef-4d42-85a6-1030072beb94
  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: ca016737-a97a-43a8-891a-beb7090f8cbf
      source_assumptions:
      - 4ccbac07-cc34-44f6-b006-b93ffdf4c8d2
