constraints:
  Age:
    code:
    - - .satisfies('`Age` >= 0', 'nonnegative_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(SPLIT(`Blood Pressure`, '/')[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, '/')[1] AS INT)", 'positive_pulse_pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{1,3}/[0-9]{1,3}$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` >= 0', 'nonnegative_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasStandardDeviation(''Physical Activity Level'', lambda value: value >
        0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` >= 0', 'nonnegative_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 0 AND 10 AND `Quality of Sleep` = FLOOR(`Quality
        of Sleep`)', 'valid_quality_penalty_index')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` > 0', 'positive_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .satisfies('`Stress Level` BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
