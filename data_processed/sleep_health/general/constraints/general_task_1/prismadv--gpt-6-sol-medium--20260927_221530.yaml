    - text: Every non-null, non-blank 'Sleep Disorder' value, after trimming leading
        and trailing whitespace, should be either 'Insomnia' or 'Sleep Apnea'. Other
        values would silently receive no sleep-disorder risk points, and these are
        the only non-null categories observed in the data.
      sources:
      - start_line: 56
        end_line: 57
        file: ''
      - start_line: 99
        end_line: 109
        file: ''
      uid: ec168d33-9b4d-419d-af9b-d5db7a6447ec
    - text: Non-null values in 'Sleep Disorder' should be strings so that trimming
        and category matching preserve their intended meaning.
      sources:
      - start_line: 56
        end_line: 57
        file: ''
      uid: e49af68a-3095-4daa-bcab-3f19509ad9e3
  Sleep Duration:
