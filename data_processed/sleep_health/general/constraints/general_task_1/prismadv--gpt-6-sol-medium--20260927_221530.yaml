        end_line: 81
        file: ''
      uid: c274389d-4b9c-4a61-bf54-c1739e9aa9b9
    - text: Non-null 'Stress Level' values should be integral ratings between 1 and
        10, inclusive. The observed values are integers from 3 through 8, and the
        calculation divides the rating by 10 to produce a stress contribution of up
        to 20 points.
