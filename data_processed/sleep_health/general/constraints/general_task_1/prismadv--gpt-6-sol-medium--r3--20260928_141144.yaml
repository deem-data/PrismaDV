    assumptions:
    - text: There should be at least two records with valid, finite values in both
        'Physical Activity Level' and 'Daily Steps', and 'Physical Activity Level'
        should have at least two distinct values among those records. Otherwise, the
        linear fit used to estimate expected steps cannot be reliably computed.
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      uid: c617004b-b497-4d2f-aeef-81addcd1f5fe
    - text: For every record, 'Sleep Duration' should be a positive finite number
        and 'Quality of Sleep' should be a non-null integer from 0 through 10. The
        duration is logarithmically transformed, the quality value indexes a penalty
        array, and both contribute to the same risk score.
