    assumptions:
    - text: Every record used to produce a risk score should have valid numeric values
        for both 'Daily Steps' and 'Physical Activity Level'. The regression excludes
        rows missing either value, but the activity score is calculated for every
        row; a missing value in either column can therefore produce a missing risk
        score. After numeric conversion, a row-level constraint could require `Daily
        Steps IS NOT NULL AND Physical Activity Level IS NOT NULL`.
      sources:
      - start_line: 19
        end_line: 31
        file: ''
      - start_line: 60
        end_line: 65
        file: ''
      - start_line: 99
        end_line: 120
        file: ''
      uid: d7bc64ec-cab3-448b-9b9e-5461f2f89725
    - text: 'The paired ''Physical Activity Level'' and ''Daily Steps'' values must
        support a linear fit: there should be at least two valid pairs, with at least
        two distinct ''Physical Activity Level'' values. Otherwise, the degree-one
        `np.polyfit` cannot estimate a meaningful slope.'
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      uid: 6fd3f95a-abcf-48eb-b6a1-4f81f834290a
    - text: Across records, higher 'Physical Activity Level' should generally correspond
        to at least as many 'Daily Steps', rather than a negative overall relationship.
        The fitted line is used as expected steps when calculating an activity mismatch
        penalty. A dataset-level constraint could check that the fitted slope on valid
        pairs is nonnegative.
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      - start_line: 60
        end_line: 65
        file: ''
      uid: df602246-4190-4003-96e3-3b9ef15c5d17
