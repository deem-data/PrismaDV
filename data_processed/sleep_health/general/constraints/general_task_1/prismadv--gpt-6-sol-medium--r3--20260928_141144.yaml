        end_line: 43
        file: ''
      - start_line: 54
        end_line: 55
        file: ''
      - start_line: 99
        end_line: 109
        file: ''
      uid: 86b9f55f-8e61-485b-982c-9d22b7f6b195
    - text: For every record, 'Blood Pressure' should contain exactly two parseable
        integers in 'systolic/diastolic' order, with systolic greater than diastolic
        and diastolic greater than zero. Both values are used together to calculate
        pulse pressure, whose logarithm requires a positive result.
      sources:
      - start_line: 44
        end_line: 51
        file: ''
      - start_line: 68
        end_line: 77
        file: ''
      uid: acb639fa-6023-4230-b751-2eb0a9d1a059
    - text: For every record, 'Daily Steps', 'Physical Activity Level', 'Sleep Duration',
        'Quality of Sleep', and 'Blood Pressure' should jointly have valid values
        for their calculations. Unlike missing 'Stress Level' or 'Age', missing values
        in these fields are not filled before their components are combined into the
        risk score.
