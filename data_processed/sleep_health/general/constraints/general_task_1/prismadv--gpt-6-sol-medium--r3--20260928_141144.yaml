    assumptions:
    - text: The input data must contain a 'Stress Level' column. The script accesses
        it directly when calculating the risk score.
      sources:
      - start_line: 80
        end_line: 81
        file: ''
      uid: b7c9a91a-8685-4e5d-a5e7-8ce2339df573
    - text: Every non-null 'Stress Level' value should be numeric or convertible to
        a number. Otherwise, conversion produces a null that is silently treated as
        zero stress.
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 80
        end_line: 81
        file: ''
      uid: 2386b1a5-7739-4c68-b423-3428f85ef6c8
    - text: Non-null 'Stress Level' values should be whole numbers on a 0-to-10 scale.
        The observed values are integers from 3 through 8, and the calculation divides
        stress by 10 to determine its contribution to the risk score.
      sources:
      - start_line: 80
        end_line: 81
        file: ''
      - start_line: 99
        end_line: 109
        file: ''
      uid: 67caaca5-0cf7-442c-96b0-0468af326a5a
    - text: Null 'Stress Level' values are permitted by the code and are scored as
        zero stress. Because the observed input column is complete, a validation rule
        should flag newly missing values for review rather than assume they have no
        effect on scoring.
