      uid: 0c722446-a8e3-43ae-bd4a-a01ad7e8ce1b
    - text: Non-null 'Stress Level' values should be numeric or convertible to numeric.
        Values that cannot be converted are coerced to null and then treated as zero
        stress, which could understate the risk score.
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 80
        end_line: 81
        file: ''
      uid: 8207ba6c-f246-4612-ba93-e9eccd8f6814
    - text: 'Null ''Stress Level'' values are permitted because the code replaces
        them with zero. For non-null values, assume an integer stress rating from
        1 to 10: the observed values are integers, and the calculation scales the
        rating by dividing it by 10. Values outside this range could produce unintended
        stress contributions.'
      sources:
