      reason_if_invalid: ''
      level: warning
      uid: 2359cc8b-a833-480e-b32e-250353279b79
      source_assumptions:
      - 15878a38-1494-4432-91f2-9ea0a3b3b1a1
    - suggestion: .isComplete('Age')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bd648103-950c-4b82-8a81-46b0a0f9e8be
      source_assumptions:
      - a2c260d3-0db2-461a-bd4a-bda9af5210fd
    assumptions:
    - text: The input data should contain an 'Age' column. The script accesses it
        directly when calculating the risk score.
      sources:
      - start_line: 91
        end_line: 95
        file: ''
      uid: c6c6ce22-40f1-4b16-83d9-9123b7678dec
    - text: Non-null 'Age' values should be numeric and represent whole-number ages.
        The input profile identifies 'Age' as integral; values that cannot be parsed
        as numbers are coerced to null and then treated as age 0.
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 91
        end_line: 95
        file: ''
      uid: 258faf50-de0a-4dca-9088-95290ed98eed
    - text: Non-null 'Age' values should be at least 0. Negative ages are not meaningful
        and would silently receive the same age-risk component as ages below 45.
      sources:
      - start_line: 91
        end_line: 95
        file: ''
      uid: 15878a38-1494-4432-91f2-9ea0a3b3b1a1
    - text: The 'Age' column is expected to be complete, consistent with its observed
        completeness of 1.0. Missing values will not crash the script, but they are
        treated as age 0 and receive no age-risk points.
      sources:
      - start_line: 91
        end_line: 95
        file: ''
      uid: a2c260d3-0db2-461a-bd4a-bda9af5210fd
