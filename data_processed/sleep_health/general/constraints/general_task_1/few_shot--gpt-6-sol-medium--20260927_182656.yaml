constraints:
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) > CAST(split(`Blood
        Pressure`, '/')[1] AS INT)", 'positive_pulse_pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]+/[0-9]+$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasNumberOfDistinctValues(''Physical Activity Level'', lambda x: x >= 2)'
      - Invalid
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 0 AND 10 AND `Quality of Sleep` = FLOOR(`Quality
        of Sleep`)', 'valid_quality_index')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .isPositive('Sleep Duration')
      - Invalid
    assumptions: []
    column_name: Sleep Duration
