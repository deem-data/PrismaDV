    - text: '''Physical Activity Level'' and ''Daily Steps'' should be concurrently
        non-null for records, because ''expected_steps'' is computed directly from
        ''Physical Activity Level'' and compared against ''Daily Steps'' across all
        rows without handling missing values in the risk score formula, which would
        propagate NaNs into the final risk score. We could represent this joint completeness
        constraint as a Deequ constraint: .satisfies("(`Physical Activity Level` IS
        NOT NULL AND `Daily Steps` IS NOT NULL) OR (`Physical Activity Level` IS NULL
        AND `Daily Steps` IS NULL)", "activity_columns_mutual_presence")'
