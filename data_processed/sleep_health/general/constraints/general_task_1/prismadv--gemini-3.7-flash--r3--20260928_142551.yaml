    assumptions:
    - text: 'The ''BMI Category'' column is expected to contain categorical values
        such as ''Obese'', ''Overweight'', ''Normal'', and ''Normal Weight''. However,
        missing or unmapped values are permitted because the code maps the column
        using a predefined dictionary and handles unmapped/null entries using .fillna(5.0).

        We could represent this assumption as a deequ constraint like this:

        .isContainedIn(''BMI Category'', [''Obese'', ''Overweight'', ''Normal'', ''Normal
        Weight''], lambda x: x >= 0.0)'
