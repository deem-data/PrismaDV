  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 650abb12-0e8d-4434-9288-1283508999ff
      source_assumptions:
      - 49cf95b0-fd3e-45cc-b0f9-979028314a74
    - suggestion: .hasPattern('Blood Pressure', r'^\d+/\d+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8824522b-28dd-4ae7-ba8e-7f6b3b15e8f0
      source_assumptions:
      - c05a0249-e280-4213-910b-7eb80c49b6e6
    - suggestion: .satisfies('CAST(SPLIT(`Blood Pressure`, "/")[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, "/")[1] AS INT)', 'systolic_greater_than_diastolic')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: a237db78-6339-4e26-9090-78fd807bdc85
      source_assumptions:
      - 08d7aac6-1799-47c0-8fdc-9d281996782a
    assumptions:
    - text: 'The ''Blood Pressure'' column should not contain null values, as the
        code splits the string and immediately converts both components to integers
        using `.astype(int)` without handling missing values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete(''Blood Pressure'')'
      sources:
      - start_line: 44
        end_line: 46
        file: ''
      uid: 49cf95b0-fd3e-45cc-b0f9-979028314a74
    - text: 'The ''Blood Pressure'' column values must follow the pattern of two integers
        separated by a slash (e.g., ''systolic/diastolic'', matching regex ''^[0-9]+/[0-9]+$''),
        because the code splits the string on ''/'' and casts the resulting columns
        to integers.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern(''Blood Pressure'', ''^\\d+/\\d+$'')'
      sources:
      - start_line: 44
        end_line: 46
        file: ''
      uid: c05a0249-e280-4213-910b-7eb80c49b6e6
    - text: 'The systolic value (the integer before the ''/'') in ''Blood Pressure''
        must be strictly greater than the diastolic value (the integer after the ''/''),
        because the code computes pulse pressure as systolic minus diastolic and applies
        the natural logarithm `np.log(pulse_pressure)`, which requires pulse pressure
        to be strictly positive (> 0).

        We could represent this assumption as a deequ constraint like this:

        .satisfies(''CAST(SPLIT(`Blood Pressure`, "/")[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, "/")[1] AS INT)'', ''Systolic Greater Than Diastolic'', lambda
        x: x == 1.0)'
      sources:
      - start_line: 44
        end_line: 51
        file: ''
      uid: 08d7aac6-1799-47c0-8fdc-9d281996782a
