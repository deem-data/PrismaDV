    assumptions:
    - text: 'The ''BMI Category'' column is expected to contain categorical values
        such as ''Obese'', ''Overweight'', ''Normal'', and ''Normal Weight'', which
        are explicitly mapped to risk score components.

        We could represent this assumption as a deequ constraint like this:

        .isContainedIn(''BMI Category'', [''Obese'', ''Overweight'', ''Normal'', ''Normal
