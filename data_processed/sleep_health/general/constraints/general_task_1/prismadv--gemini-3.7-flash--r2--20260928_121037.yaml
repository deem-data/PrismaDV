prismadv_config:
  model:
    use_async: true
    use_dataflow: true
    correlation_detection: true
    with_assumptions: true
    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gemini-3.7-flash
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  Age:
    code:
    - suggestion: .hasDataType('Age', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 896572df-aa03-47af-9fa4-3b740b9cff34
      source_assumptions:
      - 37c69893-36b9-4f60-a4b7-00edc33c972a
    assumptions:
    - text: The 'Age' column could contain missing (null) values because the downstream
        code handles them by filling null values with 0 using `fillna(0)` before calculating
        the age risk component.
      sources:
      - start_line: 91
        end_line: 91
        file: ''
      uid: bb909346-33aa-4f17-ad34-1a005cbb13c4
    - text: The 'Age' column should be numeric or convertible to numeric format, as
        the code converts it to numeric using `pd.to_numeric` and performs numerical
        comparisons (e.g., `age >= 60`, `age >= 45`).
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 91
        end_line: 96
        file: ''
      uid: 37c69893-36b9-4f60-a4b7-00edc33c972a
  BMI Category:
    code:
    - suggestion: .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal',
        'Normal Weight'])
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3135aa33-c7b8-4731-acad-2f2101c2d527
      source_assumptions:
      - 1db84138-56fc-4413-bfbc-1a2c52c25bbe
    assumptions:
    - text: 'The ''BMI Category'' column is expected to contain categorical string
        values such as ''Obese'', ''Overweight'', ''Normal'', and ''Normal Weight''.
        However, unmapped or missing values are allowed since the code handles them
        using fillna(5.0). We could represent this assumption as a deequ constraint
        like this: .isContainedIn(''BMI Category'', [''Obese'', ''Overweight'', ''Normal'',
        ''Normal Weight''])'
      sources:
      - start_line: 83
        end_line: 89
        file: ''
      uid: 1db84138-56fc-4413-bfbc-1a2c52c25bbe
    - text: The 'BMI Category' column can contain null values because the code uses
        fillna(5.0) after mapping to handle missing or unmapped categories.
      sources:
      - start_line: 89
        end_line: 89
        file: ''
      uid: 8db5cd93-7e78-420c-bd5d-a8c4d1da48d5
  Blood Pressure:
    code:
    - suggestion: .isComplete('Blood Pressure')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 20eaebf6-db34-40d6-908e-ab404447f9a3
      source_assumptions:
      - fdad177c-835a-4186-8894-c9f2e005f485
    - suggestion: .hasPattern('Blood Pressure', r'^\d+/\d+$')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 80331e24-77a7-47c6-a347-24933f6ee0b8
      source_assumptions:
      - 6a55036b-fd85-4f85-88a6-0dc177b2ffea
    - suggestion: .satisfies("CAST(SPLIT(`Blood Pressure`, '/')[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, '/')[1] AS INT)", "Systolic Greater Than Diastolic")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a9b2c3e2-85b1-41e4-ba64-625ae0540b4d
      source_assumptions:
      - 496b3b80-70f9-4abf-addf-d15c65b5971f
    assumptions:
    - text: 'The ''Blood Pressure'' column must not contain null values, because the
        code splits the string and casts the resulting parts directly to integers
        using `.astype(int)` without handling missing values.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 44
        end_line: 46
        file: ''
      uid: fdad177c-835a-4186-8894-c9f2e005f485
    - text: 'The ''Blood Pressure'' column must follow the format ''<systolic>/<diastolic>'',
        where both parts are integers separated by a forward slash (''/''), so that
        `df[''Blood Pressure''].str.split(''/'', expand=True).astype(int)` splits
        into exactly two integer columns.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("`Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''", "Valid Blood Pressure
        Format", lambda x: x == 1.0)'
      sources:
      - start_line: 44
        end_line: 46
        file: ''
      uid: 6a55036b-fd85-4f85-88a6-0dc177b2ffea
    - text: 'In the ''Blood Pressure'' column, the systolic value (before ''/'') must
        be strictly greater than the diastolic value (after ''/''), because the code
        computes `pulse_pressure = systolic - diastolic` and subsequently applies
        the logarithm `np.log(pulse_pressure)`, which requires `pulse_pressure > 0`.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CAST(SPLIT(`Blood Pressure`, ''/'')[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, ''/'')[1] AS INT)", "Systolic Greater Than Diastolic", lambda x:
        x == 1.0)'
      sources:
      - start_line: 44
        end_line: 51
        file: ''
      uid: 496b3b80-70f9-4abf-addf-d15c65b5971f
  Daily Steps:
    code:
    - suggestion: .hasDataType('Daily Steps', ConstrainableDataTypes.Numeric)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 8d4198f8-6c9e-40ff-81e9-c645f5f48d1c
      source_assumptions:
      - 0db5a9ae-0fb0-4908-9252-9554c28c88e0
    - suggestion: .isComplete('Daily Steps')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 244835e9-6fe4-4ff0-bac0-a29d8efcd31f
      source_assumptions:
      - 74d37058-86f1-4ab2-801d-b8f40c156b64
    - suggestion: .isNonNegative('Daily Steps')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 492846bb-02c2-4527-842c-16c6325566bb
      source_assumptions:
      - 9a008704-6a0f-4609-9a35-a3c4da3c8ab2
    assumptions:
    - text: 'The ''Daily Steps'' column should contain numeric values (or values that
        can be parsed as numeric) because it is converted using `pd.to_numeric` and
        used in mathematical operations like `np.polyfit` and risk component calculations.

        We could represent this assumption as a deequ constraint like this:

        .isDataType("Daily Steps", org.apache.spark.sql.types.IntegerType)'
      sources:
      - start_line: 19
        end_line: 25
        file: ''
      - start_line: 29
        end_line: 32
        file: ''
      - start_line: 60
        end_line: 65
        file: ''
      uid: 0db5a9ae-0fb0-4908-9252-9554c28c88e0
    - text: 'The ''Daily Steps'' column should not contain null values, because it
        is used directly in calculating ''shortfall_ratio'', ''mismatch_component'',
        and the aggregated ''risk_score'' without any `.fillna()` fallback, which
        would propagate NaNs into the output risk scores and tiers.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Daily Steps")'
      sources:
      - start_line: 60
        end_line: 65
        file: ''
      - start_line: 99
        end_line: 109
        file: ''
      uid: 74d37058-86f1-4ab2-801d-b8f40c156b64
    - text: 'The ''Daily Steps'' column should contain non-negative values (>= 0),
        as step count is a non-negative measure and is compared against target values
        like 8000 steps.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Daily Steps` >= 0 THEN 1 ELSE 0 END", "Non-negative
        Daily Steps", lambda x: x == 1.0)'
      sources:
      - start_line: 60
        end_line: 65
        file: ''
      uid: 9a008704-6a0f-4609-9a35-a3c4da3c8ab2
  Heart Rate:
    code: []
    assumptions:
    - text: The 'Heart Rate' column is optional and may contain null or non-numeric
