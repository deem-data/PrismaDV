    - suggestion: '.satisfies(''`Quality of Sleep` >= 0 AND `Quality of Sleep` <=
        10'', ''Quality of Sleep Valid Index Range'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 2c0faa9b-1736-4e31-8e56-878abc030a50
      source_assumptions:
      - 1c061dd8-3f22-4e16-975b-534dba9e9d03
    assumptions:
    - text: 'The ''Quality of Sleep'' column must not contain null or missing values,
        because calling `q.astype(int)` will raise a `ValueError: Cannot convert non-finite
        values (NA or inf) to integer` if there are any NaN values. We can represent
        this assumption as a Deequ constraint: .isComplete(''Quality of Sleep'')'
      sources:
      - start_line: 23
        end_line: 25
        file: ''
      - start_line: 39
        end_line: 41
        file: ''
      uid: d8f6e86f-874c-4b64-a3a6-ec1765950aeb
    - text: 'The ''Quality of Sleep'' column must contain integer values in the range
        [0, 10], because its integer values are used directly to index into `quality_penalty_map`,
        which is a 1D NumPy array of length 11 (indices 0 to 10). Any value outside
        this range or non-integer value will raise an IndexError or casting error.
        We can represent this assumption as a Deequ constraint: .satisfies(''`Quality
        of Sleep` >= 0 AND `Quality of Sleep` <= 10'', ''Quality of Sleep Valid Index
        Range'', lambda x: x == 1.0)'
      sources:
      - start_line: 41
        end_line: 43
        file: ''
