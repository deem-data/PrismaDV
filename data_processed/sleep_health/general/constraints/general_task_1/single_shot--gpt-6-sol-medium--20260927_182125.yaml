constraints:
  '*':
    code:
    - - '.hasSize(lambda n: n >= 2)'
      - Valid
    assumptions: []
    column_name: '*'
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .satisfies('CAST(`Age` AS DOUBLE) >= 0', 'nonnegative_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(SPLIT(`Blood Pressure`, '/')[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, '/')[1] AS INT) AND CAST(SPLIT(`Blood Pressure`, '/')[1] AS INT)
        > 0", 'positive_pulse_pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]+/[0-9]+$'", 'blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('CAST(`Daily Steps` AS DOUBLE) >= 0', 'nonnegative_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasStandardDeviation(''Physical Activity Level'', lambda sd: sd > 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) BETWEEN 0 AND 100',
        'valid_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 0 AND 10 AND CAST(`Quality
        of Sleep` AS DOUBLE) = FLOOR(CAST(`Quality of Sleep` AS DOUBLE))', 'valid_quality_index')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR TRIM(`Sleep Disorder`) IN ('', 'Insomnia',
        'Sleep Apnea')", 'recognized_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) > 0 AND CAST(`Sleep Duration`
        AS DOUBLE) <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
