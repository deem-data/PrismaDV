constraints:
  Age:
    code:
    - - .satisfies('`Age` IS NULL OR `Age` >= 0', 'nonnegative_age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category').isContainedIn('BMI Category', ['Obese', 'Overweight',
        'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure').satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'",
        'blood_pressure_format')
      - Valid
    - - .satisfies("CAST(SPLIT(`Blood Pressure`, '/')[0] AS INT) > CAST(SPLIT(`Blood
        Pressure`, '/')[1] AS INT)", 'positive_pulse_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps').isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasNumberOfDistinctValues(''Physical Activity Level'', lambda n: n >= 2)'
      - Invalid
    - - .isComplete('Physical Activity Level').isNonNegative('Physical Activity Level')
      - Invalid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep').satisfies('`Quality of Sleep` BETWEEN 0 AND
        10 AND `Quality of Sleep` = CAST(`Quality of Sleep` AS INT)', 'valid_quality_index')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR TRIM(`Sleep Disorder`) IN ('Insomnia',
        'Sleep Apnea')", 'recognized_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration').isPositive('Sleep Duration')
      - Invalid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .satisfies('`Stress Level` IS NULL OR `Stress Level` BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
