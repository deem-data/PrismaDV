constraints:
  constraints:
    Age:
      code:
      - - .isComplete('Age')
        - Valid
      - - .satisfies('CAST(`Age` AS DOUBLE) > 0 AND CAST(`Age` AS DOUBLE) < 130',
          'valid age')
        - Valid
      assumptions: []
      column_name: Age
    BMI Category:
      code:
      - - .isComplete('BMI Category')
        - Valid
      - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal
          Weight'])
        - Valid
      assumptions: []
      column_name: BMI Category
    Blood Pressure:
      code:
      - - .isComplete('Blood Pressure')
        - Valid
      - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) > CAST(split(`Blood
          Pressure`, '/')[1] AS INT) AND CAST(split(`Blood Pressure`, '/')[1] AS INT)
          > 0", 'positive pulse pressure')
        - Valid
      - - .satisfies("`Blood Pressure` RLIKE '^[0-9]+/[0-9]+$'", 'parseable systolic/diastolic
          pressure')
        - Valid
      assumptions: []
      column_name: Blood Pressure
    Daily Steps:
      code:
      - - .isComplete('Daily Steps')
        - Valid
      - - .satisfies('CAST(`Daily Steps` AS DOUBLE) >= 0', 'nonnegative numeric daily
          steps')
        - Valid
      assumptions: []
      column_name: Daily Steps
    Person ID:
      code:
      - - .isComplete('Person ID')
        - Valid
      - - .isUnique('Person ID')
        - Valid
      assumptions: []
      column_name: Person ID
    Physical Activity Level:
      code:
      - - '.hasApproxCountDistinct(''Physical Activity Level'', lambda count: count
          > 1)'
        - Valid
      - - .isComplete('Physical Activity Level')
        - Valid
      - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) BETWEEN 0 AND 100',
          'valid activity level')
        - Valid
      assumptions: []
      column_name: Physical Activity Level
    Quality of Sleep:
      code:
      - - .isComplete('Quality of Sleep')
        - Valid
      - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 0 AND 10 AND CAST(`Quality
          of Sleep` AS DOUBLE) = FLOOR(CAST(`Quality of Sleep` AS DOUBLE))', 'integer
          quality index from 0 to 10')
        - Valid
      assumptions: []
      column_name: Quality of Sleep
    Sleep Disorder:
      code:
      - - .satisfies("`Sleep Disorder` IS NULL OR TRIM(`Sleep Disorder`) IN ('Insomnia',
          'Sleep Apnea')", 'recognized sleep disorder or missing')
        - Valid
      assumptions: []
      column_name: Sleep Disorder
    Sleep Duration:
      code:
      - - .isComplete('Sleep Duration')
        - Valid
      - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) > 0 AND CAST(`Sleep Duration`
          AS DOUBLE) <= 24', 'valid sleep duration')
        - Valid
      assumptions: []
      column_name: Sleep Duration
    Stress Level:
      code:
      - - .isComplete('Stress Level')
        - Valid
      - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid stress
          level')
        - Valid
      assumptions: []
      column_name: Stress Level
