      uid: 1bd1b845-31c5-4ac3-b0c3-4ab5f5ea7a3a
    - text: 'The ''Blood Pressure'' column must follow the format ''Systolic/Diastolic''
        containing two integer values separated by a forward slash (matching regex
        ''^\d+/\d+$''). The code splits the string on ''/'' and accesses index 0 and
        1, then converts them to integers via astype(int). If a value lacks a slash,
        accessing bp_parts[1] will raise a KeyError; if the values are not valid numeric
        strings, to_numeric returns NaN and astype(int) will raise a ValueError. We
        could represent this assumption as a Deequ constraint like this: .satisfies("CASE
        WHEN `Blood Pressure` RLIKE ''^\\d+/\\d+$'' THEN 1 ELSE 0 END", "Valid Blood
        Pressure format", lambda x: x == 1.0)'
