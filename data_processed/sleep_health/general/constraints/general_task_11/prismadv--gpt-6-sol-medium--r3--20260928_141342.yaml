        end_line: 96
        file: ''
      uid: ee246d75-f993-4d38-b32a-a35b82c6949a
    - text: Both numbers in each 'Blood Pressure' value should be positive, and the
        systolic number should exceed the diastolic number. Otherwise, the blood-pressure
        risk classification and clinician recommendation could be based on a physiologically
        implausible reading.
