    - text: Higher 'Physical Activity Level' values should generally correspond to
        higher 'Daily Steps' values. The activity-mismatch calculation treats a linear
        fit between the two columns as an expected step count; a positive correlation
        between the columns is an actionable dataset-level check of that assumption.
      sources:
