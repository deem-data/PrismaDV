    assumptions:
    - text: 'Every record should have usable values for all seven risk inputs: ''Sleep
        Duration'', ''Quality of Sleep'', ''Physical Activity Level'', ''Daily Steps'',
        ''Stress Level'', ''BMI Category'', and ''Blood Pressure''. In particular,
        the numeric inputs must remain non-null after numeric conversion, and both
        numbers in ''Blood Pressure'' must parse successfully. Otherwise, the combined
        risk score can be missing or blood-pressure parsing can fail. This can be
        checked with a row-level conjunction of completeness and parseability conditions.'
      sources:
      - start_line: 72
        end_line: 76
        file: ''
      - start_line: 91
        end_line: 96
        file: ''
      - start_line: 133
        end_line: 143
        file: ''
      uid: 91140195-7035-41c1-9942-9647074af941
    - text: 'The systolic and diastolic values parsed from each ''Blood Pressure''
        value should form a physiologically coherent pair: systolic pressure should
        be greater than diastolic pressure. A row-level constraint can split the value
        on ''/'', cast both parts to numbers, and require the first to exceed the
        second; the code uses the pair together to assign blood-pressure risk.'
      sources:
      - start_line: 91
        end_line: 96
        file: ''
      - start_line: 8
        end_line: 21
        file: ''
      - start_line: 123
        end_line: 123
        file: ''
      uid: 01fa1ced-a950-4e54-a7c3-354e56f18c84
    - text: '''Physical Activity Level'' and ''Daily Steps'' should have a positive
        aggregate relationship, so that the fitted linear model treats higher activity
        levels as predicting more steps. This can be checked with an aggregate correlation
        constraint such as `.hasCorrelation("Physical Activity Level", "Daily Steps",
        _ > 0)`. It is not a requirement that every more-active individual have more
        steps.'
      sources:
      - start_line: 98
        end_line: 107
        file: ''
      uid: 0ea2339c-c2d0-4054-a7e2-a5da9a9d55d7
