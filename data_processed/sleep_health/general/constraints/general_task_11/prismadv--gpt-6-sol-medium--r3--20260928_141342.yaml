    assumptions:
    - text: Every record should have both a valid numeric 'Physical Activity Level'
        and a valid numeric 'Daily Steps' value. The script fits a model using both
        columns and calculates a per-record mismatch without filling missing values.
        This can be checked by requiring both columns to be non-null and finite on
        every row.
