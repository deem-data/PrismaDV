        end_line: 96
        file: ''
      uid: ca2b19c3-a6dd-4592-b890-fa8000fd0e22
    - text: Every 'Blood Pressure' value should consist of exactly two base-10 integer
        components, systolic followed by diastolic, separated by one '/'; optional
        surrounding whitespace is acceptable. For example, '120/80' is valid. Missing
