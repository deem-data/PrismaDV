        valid integers, ''pd.to_numeric(..., errors=''coerce'')'' produces NaN values
        which causes ''.astype(int)'' to fail. We could represent this assumption
        as a deequ constraint like this: .satisfies("`Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''",
