constraints:
  Age:
    code:
    - - '.hasMax(''Age'', lambda maximum: maximum <= 120)'
      - Valid
    - - '.hasMin(''Age'', lambda minimum: minimum >= 0)'
      - Valid
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) BETWEEN 60 AND 250
        AND CAST(split(`Blood Pressure`, '/')[1] AS INT) BETWEEN 40 AND 150", 'plausible_blood_pressure_values')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasMin(''Daily Steps'', lambda minimum: minimum >= 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isComplete('Gender')
      - Valid
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasMin(''Physical Activity Level'', lambda minimum: minimum >= 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` = floor(`Quality of Sleep`) AND `Quality of
        Sleep` BETWEEN 0 AND 10', 'valid_integer_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Duration:
    code:
    - - '.hasMax(''Sleep Duration'', lambda maximum: maximum <= 24)'
      - Valid
    - - '.hasMin(''Sleep Duration'', lambda minimum: minimum >= 0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('`Stress Level` BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
