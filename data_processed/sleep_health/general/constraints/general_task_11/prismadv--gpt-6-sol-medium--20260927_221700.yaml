    assumptions:
    - text: Every record should have a non-null, numeric Sleep Duration and a non-null,
        integer-valued Quality of Sleep. Both values are needed to calculate the same
        record's risk score; a missing Quality of Sleep also prevents the integer
        conversion. This can be checked with a row-level constraint requiring both
        columns to be present and valid.
