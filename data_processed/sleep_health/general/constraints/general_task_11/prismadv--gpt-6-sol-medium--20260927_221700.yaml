        end_line: 91
        file: ''
      uid: 3f851c84-05a4-469a-90a6-a12ae56bfa04
    - text: Every 'Blood Pressure' value must be non-null and contain exactly one
        '/' separating a systolic value from a diastolic value. Missing or malformed
