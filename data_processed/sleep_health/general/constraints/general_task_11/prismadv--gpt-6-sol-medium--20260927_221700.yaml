        file: ''
      - start_line: 133
        end_line: 143
        file: ''
      uid: c9d8598e-b5cb-485f-9995-60aa0b156cd8
    - text: For each record, Sleep Duration should be nonnegative and Quality of Sleep
        should be between 0 and 10 inclusive. These domains keep the two sleep inputs
        meaningful when they are combined in the risk calculation; Quality of Sleep
        is divided by 10, while Sleep Duration is interpreted as hours. A row-level
        constraint can require `Sleep Duration >= 0 AND Quality of Sleep BETWEEN 0
        AND 10`. The code does not require longer sleep to imply higher sleep quality.
