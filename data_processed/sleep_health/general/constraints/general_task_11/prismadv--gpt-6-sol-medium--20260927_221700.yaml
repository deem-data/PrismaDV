      - start_line: 48
        end_line: 49
        file: ''
      - start_line: 113
        end_line: 120
        file: ''
      uid: 306baefd-cc53-4eb9-b2ad-4eddabf33847
    - text: After converting to lowercase, every 'BMI Category' value should be one
        of 'normal', 'normal weight', 'overweight', or 'obese'. These are the four
        observed categories and the only ones with explicit risk values. Other values,
        including values with leading or trailing spaces, receive the fallback risk
        of 0.1; they also cannot trigger the overweight/obese recommendation.
      sources:
      - start_line: 48
        end_line: 49
        file: ''
      - start_line: 113
        end_line: 120
        file: ''
      uid: c4009a16-1936-4eb2-a62a-5c57d399e1fd
