        file: ''
      uid: ecf577ee-a763-41c2-861d-ceae4ae7c893
    - text: When the dataset has at least two rows, 'Physical Activity Level' should
        vary across rows, and its fitted linear relationship with 'Daily Steps' should
        have a positive slope. Otherwise, the activity-alignment model cannot meaningfully
        estimate the expected increase in steps with activity level. This can be checked
        by requiring variance of 'Physical Activity Level' > 0 and a positive slope
        for the regression of 'Daily Steps' on 'Physical Activity Level'.
