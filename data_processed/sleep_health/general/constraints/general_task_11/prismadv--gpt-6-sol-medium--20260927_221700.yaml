    assumptions:
    - text: Every row should have a finite numeric value for both 'Physical Activity
        Level' and 'Daily Steps'. The linear fit and per-row mismatch calculation
        use these columns as paired observations without handling missing or non-finite
        values. This can be checked with a joint row-level constraint requiring both
        values to be non-null and finite.
