        end_line: 96
        file: ''
      uid: 1caedfda-f4ec-46b8-ba6d-dc9884ed03ec
    - text: Both components of every 'Blood Pressure' value must be numeric and represent
        whole-number measurements. Non-numeric components cause integer conversion
        to fail, while fractional measurements would be truncated by that conversion.
      sources:
      - start_line: 93
        end_line: 96
        file: ''
      uid: 8797f895-1037-4b2a-ae67-d258135d9a26
    - text: The parsed systolic and diastolic values should be positive, and systolic
        should exceed diastolic. The code treats these numbers as blood-pressure measurements
        when assigning clinical risk stages and recommendations.
      sources:
      - start_line: 12
        end_line: 21
        file: ''
      - start_line: 50
        end_line: 51
        file: ''
      - start_line: 123
        end_line: 123
        file: ''
      uid: 4ec09766-a931-44d9-9092-0b27e83bc350
