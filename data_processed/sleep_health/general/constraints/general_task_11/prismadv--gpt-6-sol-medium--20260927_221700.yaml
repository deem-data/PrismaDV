    assumptions:
    - text: For every record, 'Sleep Duration', 'Quality of Sleep', 'Physical Activity
        Level', 'Daily Steps', and 'Stress Level' should all be present and numeric.
        These columns contribute together to a risk score; a missing or nonnumeric
        value can cause conversion to fail or propagate a missing score. This can
        be checked with a row-level constraint requiring all five values to be non-null
        after numeric conversion.
      sources:
      - start_line: 72
        end_line: 88
        file: ''
      - start_line: 98
        end_line: 111
        file: ''
      - start_line: 133
        end_line: 143
        file: ''
      uid: f90bc009-0d2d-4795-a3ba-9bd0362bcb1f
    - text: Each 'Blood Pressure' value should yield numeric systolic and diastolic
        components separated by '/', with systolic pressure greater than diastolic
        pressure. Both components must be available together because the code converts
        both to integers and jointly classifies blood-pressure risk. This can be checked
        by parsing the two components and applying a row-level constraint such as
        `systolic IS NOT NULL AND diastolic IS NOT NULL AND systolic > diastolic`.
      sources:
      - start_line: 8
        end_line: 21
        file: ''
      - start_line: 91
        end_line: 96
        file: ''
      - start_line: 123
        end_line: 123
        file: ''
      uid: cfc98e48-8a15-46cd-a9df-65d89089c6c2
    - text: When the dataset has at least two records, 'Physical Activity Level' should
        have at least two distinct numeric values, and both it and 'Daily Steps' should
        contain finite values. Otherwise the linear fit used to estimate steps from
        activity level may be undefined or unreliable. The intended activity alignment
        also assumes a positive aggregate relationship between these columns; this
        can be checked with a positive fitted slope or correlation, without requiring
        every individual record to follow the trend.
      sources:
      - start_line: 98
        end_line: 107
