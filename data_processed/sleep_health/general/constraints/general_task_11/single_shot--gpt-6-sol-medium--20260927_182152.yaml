constraints:
  Age:
    code:
    - - .isComplete('Age').isPositive('Age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category').isContainedIn('BMI Category', ['Normal', 'Normal
        Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure').satisfies("`Blood Pressure` RLIKE '^[0-9]+/[0-9]+$'",
        'parseable_blood_pressure').satisfies("CAST(split(`Blood Pressure`, '/')[0]
        AS INT) > 0 AND CAST(split(`Blood Pressure`, '/')[1] AS INT) > 0", 'positive_blood_pressure_values')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps').isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isComplete('Gender').isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Person ID:
    code:
    - - .isComplete('Person ID').isPositive('Person ID')
      - Invalid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level').satisfies('`Physical Activity Level`
        BETWEEN 0 AND 100', 'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep').satisfies('`Quality of Sleep` BETWEEN 1 AND
        10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration').isPositive('Sleep Duration')
      - Invalid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level').satisfies('`Stress Level` BETWEEN 1 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
