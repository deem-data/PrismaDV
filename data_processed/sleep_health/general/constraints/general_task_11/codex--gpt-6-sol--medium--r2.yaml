prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef bp_stage_risk(sys_arr:\
  \ np.ndarray, dia_arr: np.ndarray) -> np.ndarray:\n    sys = sys_arr\n    dia =\
  \ dia_arr\n    risk = np.zeros(len(sys), dtype=float)\n    normal = (sys < 120)\
  \ & (dia < 80)\n    elevated = (sys >= 120) & (sys <= 129) & (dia < 80)\n    stage1\
  \ = ((sys >= 130) & (sys <= 139)) | ((dia >= 80) & (dia <= 89))\n    stage2 = ((sys\
  \ >= 140) & (sys <= 180)) | ((dia >= 90) & (dia <= 120))\n    crisis = (sys > 180)\
  \ | (dia > 120)\n    risk[normal] = 0.05\n    risk[elevated] = 0.2\n    risk[stage1]\
  \ = 0.5\n    risk[stage2] = 0.8\n    risk[crisis] = 1.0\n    return risk\n\n\ndef\
  \ build_recommendations(row: pd.Series) -> str:\n    recs = []\n    # Sleep duration\
  \ coaching\n    if row['Sleep Duration'] < 6.0:\n        recs.append(\"Target 7–9\
  \ hours nightly; add a 15–30 min wind-down before bed.\")\n    elif row['Sleep Duration']\
  \ > 9.0:\n        recs.append(\"Keep time-in-bed under 9 hours; maintain a consistent\
  \ wake time.\")\n\n    # Quality of sleep\n    if row['qos'] <= 6:\n        recs.append(\"\
  Optimize sleep hygiene: dim lights, avoid screens 60 min pre-bed, keep bedroom cool\
  \ and dark.\")\n\n    # Stress management\n    if row['Stress Level'] >= 7:\n  \
  \      recs.append(\"Practice 10 minutes of breathing or body-scan each evening;\
  \ consider CBT-I techniques.\")\n\n    # Activity alignment\n    if row['Physical\
  \ Activity Level'] < 60:\n        recs.append(\"Add 2000–3000 steps/day via 3x10-min\
  \ brisk walks.\")\n    elif row['Physical Activity Level'] >= 90:\n        recs.append(\"\
  Maintain vigorous activity days with >9000 steps and 1–2 easy recovery days.\")\n\
  \n    # BMI and blood pressure considerations\n    if str(row['BMI Category']).lower()\
  \ in {\"overweight\", \"obese\"}:\n        recs.append(\"Pair sleep regularity with\
  \ nutrition planning to support weight management.\")\n    if (row['Systolic'] >=\
  \ 140) or (row['Diastolic'] >= 90):\n        recs.append(\"Discuss blood pressure\
  \ with your clinician; consider home BP monitoring.\")\n\n    # High-risk escalation\n\
  \    if row['risk_score'] >= 70:\n        recs.append(\"Consider a sleep study to\
  \ evaluate for apnea; use snore/SpO2 tracking if available.\")\n\n    return \"\
  \ • \".join(recs[:6])\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    os.makedirs(args.output,\
  \ exist_ok=True)\n    input_csv = os.path.join(args.input, 'new_data.csv')\n\n \
  \   df = pd.read_csv(input_csv)\n\n    # Normalize dtypes used downstream\n    numeric_cols\
  \ = ['Sleep Duration', 'Quality of Sleep', 'Physical Activity Level', 'Stress Level',\
  \ 'Daily Steps',\n                    'Heart Rate', 'Age']\n    for c in numeric_cols:\n\
  \        if c in df.columns:\n            df[c] = pd.to_numeric(df[c], errors='coerce')\n\
  \n    # Prepare series references used across assertions and logic\n    dur = df['Sleep\
  \ Duration']\n    # Sleep duration features\n    typical_min, typical_max = 5.0,\
  \ 9.0\n    sleep_adequacy = np.clip((dur.values - typical_min) / (typical_max -\
  \ typical_min), 0.0, 1.0)\n    duration_risk = 1.0 - sleep_adequacy\n\n    qos =\
  \ df['Quality of Sleep']\n    df['qos'] = qos.astype(int)\n    qos_norm = df['qos']\
  \ / 10.0\n    qos_risk = 1.0 - qos_norm.values\n\n    # Blood Pressure parsing prepared\
  \ before guard\n    bp_str = df['Blood Pressure'].astype(str)\n    bp_parts = bp_str.str.split('/',\
  \ expand=True)\n    sys_vals = pd.to_numeric(bp_parts[0], errors='coerce')\n   \
  \ dia_vals = pd.to_numeric(bp_parts[1], errors='coerce')\n    df['Systolic'] = sys_vals.astype(int)\n\
  \    df['Diastolic'] = dia_vals.astype(int)\n\n    pal = df['Physical Activity Level']\n\
  \    steps = df['Daily Steps']\n    # Activity alignment model (simple linear fit)\n\
  \    if len(df) >= 2:\n        slope, intercept = np.polyfit(pal.values, steps.values,\
  \ 1)\n    else:\n        slope, intercept = 100.0, 0.0\n    expected_steps = slope\
  \ * pal.values + intercept\n    expected_steps = np.maximum(expected_steps, 1.0)\n\
  \    activity_mismatch = np.clip(np.abs(steps.values - expected_steps) / expected_steps,\
  \ 0.0, 1.0)\n\n    # Additional risk contributors\n    stress = df['Stress Level'].values\n\
  \    stress_risk = np.clip((stress - 3.0) / 7.0, 0.0, 1.0)\n\n    bmi = df['BMI\
  \ Category'].astype(str).str.lower()\n    bmi_risk_map = {\n        'normal': 0.05,\n\
  \        'normal weight': 0.05,\n        'overweight': 0.3,\n        'obese': 0.6,\n\
  \    }\n    bmi_risk = bmi.map(bmi_risk_map).fillna(0.1).values\n\n    # Blood pressure\
  \ risk\n    bp_risk = bp_stage_risk(df['Systolic'].values, df['Diastolic'].values)\n\
  \n    # Combine risk components (weights sum to 1.0)\n    w_duration = 0.25\n  \
  \  w_qos = 0.20\n    w_bp = 0.25\n    w_stress = 0.15\n    w_activity = 0.10\n \
  \   w_bmi = 0.05\n\n    risk_raw = (\n            w_duration * duration_risk +\n\
  \            w_qos * qos_risk +\n            w_bp * bp_risk +\n            w_stress\
  \ * stress_risk +\n            w_activity * activity_mismatch +\n            w_bmi\
  \ * bmi_risk\n    )\n\n    risk_raw = np.clip(risk_raw, 0.0, 1.0)\n    risk_score\
  \ = (risk_raw * 100.0).round(1)\n\n    # Bands\n    bands = pd.cut(risk_score, bins=[-0.1,\
  \ 33.3, 66.6, 100.0], labels=['Low', 'Moderate', 'High'])\n\n    out = df.copy()\n\
  \    out['risk_score'] = risk_score\n    out['risk_band'] = bands.astype(str)\n\n\
  \    # Recommendations\n    out['recommendations'] = out.apply(build_recommendations,\
  \ axis=1)\n\n    # Select output columns\n    cols = [\n        'Person ID', 'Gender',\
  \ 'Age', 'BMI Category', 'Blood Pressure', 'Systolic', 'Diastolic',\n        'Sleep\
  \ Duration', 'Quality of Sleep', 'Physical Activity Level', 'Daily Steps',\n   \
  \     'Stress Level', 'risk_score', 'risk_band', 'recommendations'\n    ]\n    cols\
  \ = [c for c in cols if c in out.columns]\n    output_df = out[cols]\n\n    output_csv\
  \ = os.path.join(args.output, 'member_risk_scores.csv')\n    output_df.to_csv(output_csv,\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_11.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 99, 'Person ID': 249, 'Gender': 'Male', 'Age': 44, 'Occupation': 'Salesperson',\
  \ 'Sleep Duration': 6.4, 'Quality of Sleep': 6, 'Physical Activity Level': 45, 'Stress\
  \ Level': 7, 'BMI Category': 'Overweight', 'Blood Pressure': '130/85', 'Heart Rate':\
  \ 72, 'Daily Steps': 6000, 'Sleep Disorder': nan}, {'id': 72, 'Person ID': 269,\
  \ 'Gender': 'Female', 'Age': 49, 'Occupation': 'Nurse', 'Sleep Duration': 6.0, 'Quality\
  \ of Sleep': 6, 'Physical Activity Level': 90, 'Stress Level': 8, 'BMI Category':\
  \ 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate': 75, 'Daily Steps': 10000,\
  \ 'Sleep Disorder': 'Sleep Apnea'}, {'id': 138, 'Person ID': 71, 'Gender': 'Male',\
  \ 'Age': 33, 'Occupation': 'Doctor', 'Sleep Duration': 6.1, 'Quality of Sleep':\
  \ 6, 'Physical Activity Level': 30, 'Stress Level': 8, 'BMI Category': 'Normal',\
  \ 'Blood Pressure': '125/80', 'Heart Rate': 72, 'Daily Steps': 5000, 'Sleep Disorder':\
  \ nan}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`. You have\
  \ complete access to it:\nload it with pandas, profile it, plot it, run whatever\
  \ analysis helps. It is a\nthrowaway copy -- nothing you do to it has any effect\
  \ outside this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ\
  \ constraint code against the staged table and read back\nthe result of every check:\n\
  \n```\npython deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
