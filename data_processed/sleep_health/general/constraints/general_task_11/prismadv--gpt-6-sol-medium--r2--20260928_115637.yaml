  ? '["BMI Category","Blood Pressure","Daily Steps","Physical Activity Level","Quality
    of Sleep","Sleep Duration","Stress Level"]'
  : code:
    - suggestion: '.satisfies("CASE WHEN `Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''
        THEN CAST(split(`Blood Pressure`, ''/'')[0] AS DOUBLE) > CAST(split(`Blood
        Pressure`, ''/'')[1] AS DOUBLE) AND CAST(split(`Blood Pressure`, ''/'')[1]
        AS DOUBLE) > 0 ELSE FALSE END", "valid_systolic_diastolic_pair", lambda x:
        x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: deb574cf-5603-4d38-aca3-c780280b06db
      source_assumptions:
      - 8e77cd17-fe4e-48ec-9cb7-0d21164c48b4
    - suggestion: '.satisfies("`Physical Activity Level` IS NOT NULL AND `Daily Steps`
        IS NOT NULL AND NOT isnan(CAST(`Physical Activity Level` AS DOUBLE)) AND NOT
        isnan(CAST(`Daily Steps` AS DOUBLE)) AND abs(CAST(`Physical Activity Level`
        AS DOUBLE)) <= 1.7976931348623157E308 AND abs(CAST(`Daily Steps` AS DOUBLE))
        <= 1.7976931348623157E308", "finite_activity_and_steps", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 7456c0c5-5bfe-4be6-b152-b4e1e0f1ef85
      source_assumptions:
      - 1910e0af-fa88-438b-a2f7-9729be9d4484
    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 1f8d4cd5-b063-4ad2-b1d3-b250500ea808
      source_assumptions:
      - 1910e0af-fa88-438b-a2f7-9729be9d4484
      - c1314516-c87b-40ac-a70b-ceb861baa48c
    assumptions:
    - text: Each 'Blood Pressure' value should contain a numeric systolic/diastolic
        pair separated by '/', with both numbers positive and systolic greater than
        diastolic. Both components must parse successfully because the code converts
        them to integers and evaluates them together to assign blood-pressure risk.
        A row-level constraint could check `Blood Pressure` against `^[0-9]+/[0-9]+$`
        and check `Systolic > Diastolic AND Diastolic > 0` after parsing.
      sources:
      - start_line: 91
        end_line: 96
        file: ''
      - start_line: 8
        end_line: 21
        file: ''
      - start_line: 123
        end_line: 123
        file: ''
      uid: 8e77cd17-fe4e-48ec-9cb7-0d21164c48b4
    - text: When the dataset has at least two rows, 'Physical Activity Level' and
        'Daily Steps' should both be non-null, finite numeric values on every row,
        and 'Physical Activity Level' should vary across rows. Otherwise the linear
        fit used to compare activity level with steps is invalid or uninformative.
        A dataset-level check could require joint completeness of the two columns
        and at least two distinct activity levels when row count is at least two.
      sources:
      - start_line: 72
        end_line: 76
        file: ''
      - start_line: 98
        end_line: 107
        file: ''
      uid: 1910e0af-fa88-438b-a2f7-9729be9d4484
    - text: 'The data should support a positive fitted relationship between ''Physical
        Activity Level'' and ''Daily Steps'': the slope fitted from these two columns
        should be greater than zero. The code treats fitted steps as the expected
        step count at a given activity level and uses deviations from it as an activity-mismatch
        risk; a nonpositive slope would make that interpretation unreliable. This
        is an aggregate constraint, not a requirement that every row match the fitted
        line.'
      sources:
      - start_line: 98
        end_line: 107
        file: ''
      - start_line: 133
        end_line: 139
        file: ''
      uid: c1314516-c87b-40ac-a70b-ceb861baa48c
  '["Daily Steps","Physical Activity Level"]':
    code:
    - suggestion: '.satisfies("TRY_CAST(`Physical Activity Level` AS DOUBLE) IS NOT
        NULL AND TRY_CAST(`Daily Steps` AS DOUBLE) IS NOT NULL AND NOT isnan(TRY_CAST(`Physical
        Activity Level` AS DOUBLE)) AND NOT isnan(TRY_CAST(`Daily Steps` AS DOUBLE))
        AND ABS(TRY_CAST(`Physical Activity Level` AS DOUBLE)) <= 1.7976931348623157E308
        AND ABS(TRY_CAST(`Daily Steps` AS DOUBLE)) <= 1.7976931348623157E308", "activity_and_steps_finite_numeric",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: f64f0490-95ac-4dee-b228-cd0ec474b142
      source_assumptions:
      - d40b38ca-bb08-42af-a0b4-716a0ee17cd8
    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 47790ca5-38a8-447a-bcd1-55ec6012b9a2
      source_assumptions:
      - 4e39f623-4893-4fd6-9a0c-1ec73ba12dc3
    assumptions:
    - text: For every record, 'Physical Activity Level' and 'Daily Steps' should both
        be present and convertible to finite numeric values. The code fits a model
        using both columns and uses its prediction in the risk score; a nonnumeric
        or missing value in either column can invalidate that calculation.
      sources:
      - start_line: 72
        end_line: 76
        file: ''
      - start_line: 98
        end_line: 107
        file: ''
      - start_line: 133
        end_line: 143
        file: ''
      uid: d40b38ca-bb08-42af-a0b4-716a0ee17cd8
    - text: When the dataset has at least two records, 'Physical Activity Level' should
        vary across records, and higher activity levels should generally correspond
        to more daily steps. The linear fit requires variation in its predictor, while
        its predicted steps are used as the baseline for measuring activity mismatch.
        This can be checked with a nonzero standard deviation for 'Physical Activity
        Level' and a positive association between 'Physical Activity Level' and 'Daily
        Steps'.
      sources:
      - start_line: 98
        end_line: 107
        file: ''
      - start_line: 133
        end_line: 139
        file: ''
      uid: 4e39f623-4893-4fd6-9a0c-1ec73ba12dc3
    - text: Records with 'Physical Activity Level' of at least 90 should generally
        have higher 'Daily Steps' than records with lower activity levels. The recommendation
        associates this activity category with days exceeding 9,000 steps, but explicitly
        allows recovery days, so exceeding 9,000 should not be required for every
        such record. A group-level comparison of step distributions is more appropriate
        than a row-level rule.
      sources:
      - start_line: 42
        end_line: 45
        file: ''
      - start_line: 98
        end_line: 107
        file: ''
      uid: d750dded-38aa-487f-a667-d7c1f8834ae7
  '["Quality of Sleep","Sleep Duration"]':
    code:
    - suggestion: .satisfies('`Sleep Duration` IS NOT NULL AND NOT isnan(CAST(`Sleep
        Duration` AS DOUBLE)) AND abs(CAST(`Sleep Duration` AS DOUBLE)) <= 1.7976931348623157E308
        AND `Quality of Sleep` IS NOT NULL AND CAST(`Quality of Sleep` AS DOUBLE)
        IS NOT NULL', 'sleep_inputs_present_and_numeric')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 9c4724e9-6500-4606-9c4f-04aa34e2284f
      source_assumptions:
      - 9f6ab276-3bc8-4438-8997-3573bcf723c5
    - suggestion: .satisfies('`Sleep Duration` >= 0 AND `Quality of Sleep` BETWEEN
        0 AND 10 AND `Quality of Sleep` = floor(`Quality of Sleep`)', 'sleep_duration_and_quality_domains')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0b4b8387-a2a8-41b4-85d0-2b5a1ab8ff4d
      source_assumptions:
      - 9f6ab276-3bc8-4438-8997-3573bcf723c5
      - c3df4d05-392b-49ee-9c6f-bdf9990ad82e
    assumptions:
    - text: Every record should have both a finite numeric 'Sleep Duration' and a
        non-null, integer-valued 'Quality of Sleep'. The script converts both columns
        to numeric values, casts quality to an integer, and combines their row-aligned
        contributions in the risk score. A row-level constraint can require both values
        to be present and valid after numeric parsing.
      sources:
      - start_line: 72
        end_line: 88
        file: ''
      - start_line: 133
        end_line: 140
        file: ''
      uid: 9f6ab276-3bc8-4438-8997-3573bcf723c5
    - text: For each record, 'Sleep Duration' should be nonnegative and 'Quality of
        Sleep' should be between 0 and 10 inclusive. These paired domains keep the
        duration-based and quality-based terms interpretable as risk contributions;
        the quality term is calculated as 1 minus the quality score divided by 10.
      sources:
      - start_line: 79
        end_line: 88
        file: ''
      - start_line: 126
        end_line: 143
        file: ''
      uid: c3df4d05-392b-49ee-9c6f-bdf9990ad82e
