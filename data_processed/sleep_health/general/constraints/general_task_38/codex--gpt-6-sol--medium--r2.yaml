prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    os.makedirs(args.output, exist_ok=True)\n\n    input_file = os.path.join(args.input,\
  \ 'new_data.csv')\n    df = pd.read_csv(input_file)\n\n    # Basic type coercion\
  \ for numeric fields\n    num_cols = ['Sleep Duration', 'Quality of Sleep', 'Physical\
  \ Activity Level', 'Stress Level', 'Daily Steps', 'Age',\n                'Heart\
  \ Rate']\n    for c in num_cols:\n        if c in df.columns:\n            df[c]\
  \ = pd.to_numeric(df[c], errors='coerce')\n\n    # Parse blood pressure into systolic/diastolic\n\
  \    bp_str = df['Blood Pressure'].astype(str)\n    bp_parts = bp_str.str.extract(r'(?P<SBP>\\\
  d{2,3})/(?P<DBP>\\d{2,3})')\n    df['SBP'] = pd.to_numeric(bp_parts['SBP'], errors='coerce')\n\
  \    df['DBP'] = pd.to_numeric(bp_parts['DBP'], errors='coerce')\n    # Blood pressure\
  \ derived metrics\n    df['PP'] = df['SBP'] - df['DBP']\n    df['MAP'] = df['DBP']\
  \ + df['PP'] / 3.0\n\n    # Sleep duration range guard before computing debt and\
  \ regression features\n    sleep_hours = df['Sleep Duration'].astype(float)\n  \
  \  # Sleep debt relative to 8 hours (clipped at [-2, 5] to bound effect)\n    df['sleep_debt']\
  \ = np.clip(8.0 - sleep_hours, -2.0, 5.0)\n    df['sleep_debt_pos'] = np.maximum(df['sleep_debt'],\
  \ 0.0)\n\n    # Relationship between sleep duration and quality; compute correlation\
  \ then guard before regression-based features\n    qual = df['Quality of Sleep'].astype(float)\n\
  \    # Handle potential constant vectors safely\n    if sleep_hours.std(ddof=0)\
  \ == 0 or qual.std(ddof=0) == 0:\n        corr_sleep_qual = np.nan\n    else:\n\
  \        corr_sleep_qual = float(np.corrcoef(sleep_hours, qual)[0, 1])\n    slope_sq\
  \ = corr_sleep_qual * (qual.std(ddof=0) / (sleep_hours.std(ddof=0) + 1e-9))\n  \
  \  intercept_sq = qual.mean() - slope_sq * sleep_hours.mean()\n    pred_quality\
  \ = slope_sq * sleep_hours + intercept_sq\n    df['restfulness_residual'] = qual\
  \ - pred_quality\n\n    # Steps vs physical activity calibration\n    steps = df['Daily\
  \ Steps'].astype(float)\n    pal = df['Physical Activity Level'].astype(float)\n\
  \    if steps.std(ddof=0) == 0 or pal.std(ddof=0) == 0:\n        corr_steps_pal\
  \ = np.nan\n    else:\n        corr_steps_pal = float(np.corrcoef(steps, pal)[0,\
  \ 1])\n    slope_sp = corr_steps_pal * (pal.std(ddof=0) / (steps.std(ddof=0) + 1e-9))\n\
  \    intercept_sp = pal.mean() - slope_sp * steps.mean()\n    pal_from_steps = slope_sp\
  \ * steps + intercept_sp\n    df['activity_blend'] = 0.5 * pal + 0.5 * pal_from_steps\n\
  \n    # Validate apnea-BMI coupling before using apnea factor in scoring\n    #\
  \ Scoring helpers\n    def scale01(x, lo, hi):\n        return np.clip((x - lo)\
  \ / (hi - lo + 1e-9), 0.0, 1.0)\n\n    # Risk components\n    df['bp_index'] = scale01(df['MAP'],\
  \ 85.0, 130.0)\n\n    bmi_map = {\n        'Normal': 0.0,\n        'Normal Weight':\
  \ 0.0,\n        'Overweight': 0.6,\n        'Obese': 1.0,\n    }\n    df['bmi_risk']\
  \ = df['BMI Category'].astype(str).map(bmi_map).fillna(0.3)\n\n    df['age_index']\
  \ = scale01(df['Age'].astype(float), 30.0, 70.0)\n    df['hr_index'] = scale01(df['Heart\
  \ Rate'].astype(float), 55.0, 95.0)\n    df['stress_index'] = scale01(df['Stress\
  \ Level'].astype(float), 3.0, 8.0)\n\n    # Sleep risk combines debt and negative\
  \ residuals (i.e., worse-than-expected QoS for the hours slept)\n    sleep_debt_index\
  \ = scale01(df['sleep_debt_pos'], 0.0, 5.0)\n    resid_penalty = np.clip(-df['restfulness_residual'],\
  \ 0.0, None)\n    resid_index = scale01(resid_penalty, 0.0, max(1.0, float(resid_penalty.quantile(0.9))))\n\
  \    df['sleep_risk'] = 0.6 * sleep_debt_index + 0.4 * resid_index\n\n    # Activity\
  \ protection (higher activity lowers risk)\n    act_index = scale01(df['activity_blend'],\
  \ float(df['activity_blend'].quantile(0.1)),\n                        float(df['activity_blend'].quantile(0.9)))\n\
  \    df['activity_protect'] = 1.0 - act_index\n\n    # Apnea factor\n    apnea_mask\
  \ = df['Sleep Disorder'].astype(str) == 'Sleep Apnea'\n    overweight_obese = df['BMI\
  \ Category'].astype(str).isin(['Overweight', 'Obese'])\n    apnea_cnt = int(apnea_mask.sum())\n\
  \    if apnea_cnt > 0:\n        apnea_ratio = ((apnea_mask & overweight_obese).sum())\
  \ / max(apnea_cnt, 1)\n    else:\n        apnea_ratio = 0.60\n    apnea_multiplier\
  \ = 1.0 + max(0.0, apnea_ratio - 0.60)\n    df['apnea_component'] = apnea_multiplier\
  \ * (\n            apnea_mask.astype(float) * (0.05 + 0.05 * overweight_obese.astype(float)))\n\
  \n    # Aggregate cardiometabolic risk [0,1]\n    df['risk_score'] = (\n       \
  \     0.25 * df['bp_index'] +\n            0.20 * df['bmi_risk'] +\n           \
  \ 0.15 * df['age_index'] +\n            0.10 * df['stress_index'] +\n          \
  \  0.10 * df['hr_index'] +\n            0.15 * df['sleep_risk'] +\n            0.10\
  \ * df['activity_protect'] +\n            df['apnea_component']\n    )\n    df['risk_score']\
  \ = df['risk_score'].clip(0.0, 1.0)\n\n    # Prioritization: top quartile of risk\n\
  \    threshold = float(df['risk_score'].quantile(0.75))\n    df['prioritized_for_outreach']\
  \ = df['risk_score'] >= threshold\n\n    # Save outputs\n    out_full = df[['Person\
  \ ID', 'risk_score', 'prioritized_for_outreach']].copy()\n    out_full.sort_values(by=['prioritized_for_outreach',\
  \ 'risk_score', 'Person ID'], ascending=[False, False, True],\n                \
  \         inplace=True)\n    out_full.to_csv(os.path.join(args.output, 'prioritized_members.csv'),\
  \ index=False)\n\n    detail_cols = [\n        'Person ID', 'SBP', 'DBP', 'MAP',\
  \ 'PP', 'bp_index', 'bmi_risk', 'age_index',\n        'hr_index', 'stress_index',\
  \ 'sleep_risk', 'activity_protect', 'apnea_component', 'risk_score'\n    ]\n   \
  \ df[detail_cols].to_csv(os.path.join(args.output, 'risk_scores_detailed.csv'),\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_38.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 99, 'Person ID': 249, 'Gender': 'Male', 'Age': 44, 'Occupation': 'Salesperson',\
  \ 'Sleep Duration': 6.4, 'Quality of Sleep': 6, 'Physical Activity Level': 45, 'Stress\
  \ Level': 7, 'BMI Category': 'Overweight', 'Blood Pressure': '130/85', 'Heart Rate':\
  \ 72, 'Daily Steps': 6000, 'Sleep Disorder': nan}, {'id': 72, 'Person ID': 269,\
  \ 'Gender': 'Female', 'Age': 49, 'Occupation': 'Nurse', 'Sleep Duration': 6.0, 'Quality\
  \ of Sleep': 6, 'Physical Activity Level': 90, 'Stress Level': 8, 'BMI Category':\
  \ 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate': 75, 'Daily Steps': 10000,\
  \ 'Sleep Disorder': 'Sleep Apnea'}, {'id': 138, 'Person ID': 71, 'Gender': 'Male',\
  \ 'Age': 33, 'Occupation': 'Doctor', 'Sleep Duration': 6.1, 'Quality of Sleep':\
  \ 6, 'Physical Activity Level': 30, 'Stress Level': 8, 'BMI Category': 'Normal',\
  \ 'Blood Pressure': '125/80', 'Heart Rate': 72, 'Daily Steps': 5000, 'Sleep Disorder':\
  \ nan}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`. You have\
  \ complete access to it:\nload it with pandas, profile it, plot it, run whatever\
  \ analysis helps. It is a\nthrowaway copy -- nothing you do to it has any effect\
  \ outside this workspace.\n\n# Verifying your constraints\n\nYou can execute PyDeequ\
  \ constraint code against the staged table and read back\nthe result of every check:\n\
  \n```\npython deequ_check.py --table observed_data --constraints <your_constraints_file>\n\
  ```\n\nwhere the constraints file is plain text with one PyDeequ `Check` call per\
  \ line,\nfor example:\n\n```\n.isComplete(\"age\")\n.isNonNegative(\"age\")\n.isContainedIn(\"\
  status\", [\"active\", \"closed\"])\n```\n\nEach line comes back as `[HOLDS]` or\
  \ `[FAILS]`, and a failure prints the reason,\nincluding compilation errors. Use\
  \ it as often as you like.\n\n# Output format\n\nWrite `constraints.json` in the\
  \ current folder, containing the union of what you\nsettled on for every column:\n\
  \n{\n    \"constraints\": [\n        {\n            \"column_name\": \"some_column\"\
  ,\n            \"code_for_constraint\": \".isComplete('some_column')\"\n       \
  \ },\n        {\n            \"column_name\": \"another_column\",\n            \"\
  code_for_constraint\": \".isPositive('another_column')\"\n        }\n    ]\n}\n\n\
  Use only the PyDeequ `Check` object's methods in `code_for_constraint`. Each\nentry\
  \ names the single column it constrains; for a constraint spanning several\ncolumns,\
  \ name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
