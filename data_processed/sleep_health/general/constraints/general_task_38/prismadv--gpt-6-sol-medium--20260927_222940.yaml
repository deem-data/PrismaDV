  '["BMI Category","Sleep Disorder"]':
    code:
    - suggestion: '.satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` <> ''Sleep
        Apnea'' OR `BMI Category` IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'')", ''valid_bmi_category_for_sleep_apnea'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 04da8031-01da-4525-8693-f24c5de8fd4d
      source_assumptions:
      - 0c2490a9-fde2-45c2-a830-c7c8950019ee
    assumptions:
    - text: "When at least one record has 'Sleep Disorder' equal to 'Sleep Apnea',\
        \ at least 60% of those records should have 'BMI Category' equal to 'Overweight'\
        \ or 'Obese'. The code uses 0.60 as the baseline for the apnea\u2013BMI coupling;\
        \ a lower observed proportion would suggest that this relationship or the\
        \ category values have changed. This can be checked as count(Sleep Disorder\
        \ = 'Sleep Apnea' AND BMI Category IN ('Overweight', 'Obese')) / count(Sleep\
        \ Disorder = 'Sleep Apnea') >= 0.60 when the denominator is nonzero."
      sources:
      - start_line: 65
        end_line: 65
        file: ''
      - start_line: 97
        end_line: 106
        file: ''
      uid: 151ea581-26dd-40e0-aeb1-ecd264ddb694
    - text: 'For records with ''Sleep Disorder'' equal to ''Sleep Apnea'', ''BMI Category''
        should be one of ''Normal'', ''Normal Weight'', ''Overweight'', or ''Obese''.
        Otherwise, the BMI risk receives the fallback value while the apnea component
        still uses the category to determine whether to apply the overweight/obese
        increment. This can be checked with the conditional constraint: Sleep Disorder
        != ''Sleep Apnea'' OR BMI Category IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'').'
      sources:
      - start_line: 73
        end_line: 79
        file: ''
      - start_line: 97
        end_line: 106
        file: ''
      uid: 0c2490a9-fde2-45c2-a830-c7c8950019ee
