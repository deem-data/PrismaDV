    assumptions:
    - text: The 'Blood Pressure' column should exist and contain no null values. The
        code does not fill missing blood pressures; a null becomes the string 'nan',
        which cannot be parsed and leads to a missing blood-pressure contribution
        to the risk score.
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 71
        file: ''
      - start_line: 109
        end_line: 119
        file: ''
      uid: 13a7308e-5b77-489e-b224-53f0a39c2452
    - text: 'Every ''Blood Pressure'' value should contain a parseable systolic/diastolic
        pair: two or three digits, a slash, then two or three digits (for example,
        ''120/80''). Values without a match produce missing SBP, DBP, MAP, and blood-pressure
        risk values. This can be checked with the regular expression ''\d{2,3}/\d{2,3}''.'
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 71
        file: ''
      uid: da716a96-85e9-41d9-b10f-82983df6dad1
    - text: In each parsed 'Blood Pressure' pair, systolic pressure should be greater
        than diastolic pressure. Otherwise the derived pulse pressure is zero or negative
        and the MAP-based risk component is clinically misleading.
      sources:
      - start_line: 28
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 71
        file: ''
      uid: a185d0ee-055b-408f-b316-34ec6b8ee0a0
