constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - '.satisfies(''CAST(`Age` AS DOUBLE) > 0'', ''positive_age'', lambda x: x ==
        1.0)'
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - '.hasPattern(''Blood Pressure'', ''^[0-9]{2,3}/[0-9]{2,3}$'', lambda x: x
        == 1.0)'
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    - - '.satisfies("CAST(split(`Blood Pressure`, ''/'')[0] AS INT) > CAST(split(`Blood
        Pressure`, ''/'')[1] AS INT)", ''systolic_exceeds_diastolic'', lambda x: x
        == 1.0)'
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasStandardDeviation(''Daily Steps'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    - - '.satisfies(''CAST(`Daily Steps` AS DOUBLE) >= 0'', ''nonnegative_daily_steps'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - '.satisfies(''CAST(`Heart Rate` AS DOUBLE) > 0'', ''positive_heart_rate'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasStandardDeviation(''Physical Activity Level'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - '.satisfies(''CAST(`Physical Activity Level` AS DOUBLE) >= 0'', ''nonnegative_physical_activity'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.hasStandardDeviation(''Quality of Sleep'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    - - '.satisfies(''CAST(`Quality of Sleep` AS DOUBLE) >= 1 AND CAST(`Quality of
        Sleep` AS DOUBLE) <= 10'', ''valid_sleep_quality'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'',
        ''Sleep Apnea'')", ''valid_optional_sleep_disorder'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasStandardDeviation(''Sleep Duration'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    - - '.satisfies(''CAST(`Sleep Duration` AS DOUBLE) > 0 AND CAST(`Sleep Duration`
        AS DOUBLE) <= 24'', ''valid_sleep_duration'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - '.satisfies(''CAST(`Stress Level` AS DOUBLE) >= 1 AND CAST(`Stress Level`
        AS DOUBLE) <= 10'', ''valid_stress_level'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Stress Level
