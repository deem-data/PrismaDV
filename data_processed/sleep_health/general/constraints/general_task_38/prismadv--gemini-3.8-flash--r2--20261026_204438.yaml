    assumptions:
    - text: 'The ''Blood Pressure'' column is expected to follow the format of systolic
        over diastolic blood pressure, matching the regular expression of two to three
        digits followed by a slash and two to three digits (e.g., ''120/80''). The
        downstream code extracts ''SBP'' and ''DBP'' using regex `(?P<SBP>\d{2,3})/(?P<DBP>\d{2,3})`.
        If the string does not match this format, SBP and DBP will be coerced to NaN,
        causing missing values in downstream MAP, bp_index, and risk score calculations.

        We could represent this assumption as a deequ constraint like this:

        .satisfies("CASE WHEN `Blood Pressure` RLIKE ''^[0-9]{2,3}/[0-9]{2,3}$'' THEN
        1 ELSE 0 END", "Blood Pressure Format", lambda x: x == 1.0)'
      sources:
      - start_line: 27
        end_line: 30
        file: ''
      uid: 1a3846e0-e666-4d8e-8d39-5c7dfc10ddba
    - text: 'The ''Blood Pressure'' column should not contain null or missing values.
        Although `.astype(str)` handles NaNs by converting them to the string ''nan'',
        this does not match the regex pattern and will result in NaN values for ''SBP'',
        ''DBP'', ''MAP'', and ''risk_score''.

        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      uid: f1ea1c34-8bc7-4bab-97a7-fb1facf9ee1a
