        ''120/80'') so that SBP and DBP components can be extracted into valid numeric
        values.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("`Blood Pressure`", "^\\d{2,3}/\\d{2,3}$", lambda x: x == 1.0)

