constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - '.satisfies(''`Age` BETWEEN 0 AND 120'', ''valid_age'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - '.satisfies("CAST(split(`Blood Pressure`, ''/'')[0] AS INT) > CAST(split(`Blood
        Pressure`, ''/'')[1] AS INT)", ''systolic_exceeds_diastolic'', lambda x: x
        == 1.0)'
      - Valid
    - - '.satisfies("`Blood Pressure` RLIKE ''^[0-9]{2,3}/[0-9]{2,3}$''", ''blood_pressure_format'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasStandardDeviation(''Daily Steps'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    - - '.satisfies(''`Daily Steps` >= 0'', ''nonnegative_daily_steps'', lambda x:
        x == 1.0)'
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - '.satisfies(''`Heart Rate` BETWEEN 30 AND 220'', ''valid_heart_rate'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasStandardDeviation(''Physical Activity Level'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - '.satisfies(''`Physical Activity Level` >= 0'', ''nonnegative_activity_level'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.hasStandardDeviation(''Quality of Sleep'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    - - '.satisfies(''`Quality of Sleep` BETWEEN 1 AND 10'', ''valid_sleep_quality'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'',
        ''Sleep Apnea'')", ''valid_sleep_disorder_or_missing'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasStandardDeviation(''Sleep Duration'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    - - '.satisfies(''`Sleep Duration` > 0 AND `Sleep Duration` <= 24'', ''valid_sleep_duration'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - '.satisfies(''`Stress Level` BETWEEN 1 AND 10'', ''valid_stress_level'', lambda
        x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Stress Level
