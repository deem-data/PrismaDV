        end_line: 24
        file: ''
      - start_line: 81
        end_line: 81
        file: ''
      uid: ab306643-bf48-4fdd-9b6b-d4c64e5c90c6
    - text: Every 'Age' value should be non-null and parseable as a finite number.
        Unparseable values are coerced to null, and there is no missing-value handling
