    - suggestion: .satisfies("CASE WHEN `Blood Pressure` RLIKE '[0-9]{2,3}/[0-9]{2,3}'
        THEN CAST(regexp_extract(`Blood Pressure`, '([0-9]{2,3})/([0-9]{2,3})', 1)
        AS INT) > CAST(regexp_extract(`Blood Pressure`, '([0-9]{2,3})/([0-9]{2,3})',
        2) AS INT) ELSE FALSE END", "systolic_exceeds_diastolic")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 94217acd-e86e-4350-99e6-c55eba628884
      source_assumptions:
      - 5a0cbea6-5784-485a-9cd1-7892f7f5b280
    assumptions:
    - text: For every record used in risk scoring, 'Blood Pressure' should parse into
        numeric systolic and diastolic values, and 'Age', 'Heart Rate', and 'Stress
        Level' should be numeric. These inputs should be jointly present so that a
        missing component does not make the row's combined risk score null. This can
        be checked with a row-level completeness constraint over the parsed blood-pressure
        values and the three numeric columns.
      sources:
      - start_line: 20
        end_line: 33
        file: ''
      - start_line: 81
        end_line: 83
        file: ''
      - start_line: 109
        end_line: 119
        file: ''
      uid: fea9c3b3-ff3a-4387-925b-30a2af03d9b3
    - text: "For each parsed 'Blood Pressure' value, systolic pressure (SBP) should\
        \ exceed diastolic pressure (DBP). Otherwise the derived pulse pressure (SBP\
        \ \u2212 DBP) is zero or negative and the blood-pressure contribution to the\
        \ combined risk score is not physiologically meaningful. This is a row-level\
        \ constraint: SBP > DBP."
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      - start_line: 70
        end_line: 71
        file: ''
      - start_line: 109
        end_line: 110
        file: ''
      uid: 5a0cbea6-5784-485a-9cd1-7892f7f5b280
    - text: If the dataset contains records whose 'Sleep Disorder' is 'Sleep Apnea',
        at least 60% of those records should have 'BMI Category' equal to 'Overweight'
        or 'Obese'. This is the coupling baseline used when calculating the apnea
        multiplier; it can be checked as a conditional aggregate ratio rather than
        a rule requiring every apnea record to have elevated BMI.
      sources:
      - start_line: 97
        end_line: 106
