      sources:
      - start_line: 20
        end_line: 24
        file: ''
      - start_line: 81
        end_line: 81
        file: ''
      - start_line: 109
        end_line: 123
        file: ''
      uid: 0294abf3-133f-43f4-9e6a-3c3df1d18300
    - text: "Age values should represent whole years, consistent with the column's\
        \ integral data type. Values outside 30\u201370 are permitted by the code:\
