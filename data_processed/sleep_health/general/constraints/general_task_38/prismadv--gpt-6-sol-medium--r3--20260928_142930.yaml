  '["Age","BMI Category","Blood Pressure","Heart Rate","Stress Level"]':
    code:
    - suggestion: .satisfies("`Blood Pressure` RLIKE '[0-9]{2,3}/[0-9]{2,3}' AND CAST(`Age`
        AS DOUBLE) IS NOT NULL AND CAST(`Heart Rate` AS DOUBLE) IS NOT NULL AND CAST(`Stress
        Level` AS DOUBLE) IS NOT NULL", "risk_inputs_parseable")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 11cf2ec8-929a-46f1-94f3-5a1c6a1daded
      source_assumptions:
