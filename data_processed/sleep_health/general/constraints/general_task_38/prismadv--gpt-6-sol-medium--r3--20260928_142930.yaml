        file: ''
      - start_line: 98
        end_line: 98
        file: ''
      uid: ca096574-dc00-4391-b4cb-afb6c774883c
    - text: At least 95% of 'BMI Category' values should exactly match one of 'Normal',
        'Normal Weight', 'Overweight', or 'Obese'. These are the four categories observed
        in the input data. Other values receive a default BMI risk of 0.3 and are
        not counted as overweight or obese in the apnea calculation; capitalization
        and whitespace therefore matter. This is a data-quality expectation, not a
        requirement for the code to run.
      sources:
      - start_line: 73
        end_line: 79
        file: ''
      - start_line: 97
        end_line: 106
        file: ''
      uid: 068fb4a6-c5bf-4eb0-8fde-337c90294bc1
    - text: The 'BMI Category' column should remain highly complete (for example,
        at least 95% non-null), consistent with the observed 100% completeness. Nulls
        will not stop the code, but they will be treated as unrecognized categories
        and assigned the default BMI risk.
      sources:
      - start_line: 79
        end_line: 79
        file: ''
      - start_line: 98
        end_line: 98
        file: ''
      uid: 08cc4598-1b2d-4800-a4eb-5e18791d2be0
