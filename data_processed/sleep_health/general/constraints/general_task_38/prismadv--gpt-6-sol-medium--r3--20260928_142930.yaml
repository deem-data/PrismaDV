      sources:
      - start_line: 27
        end_line: 27
        file: ''
      uid: c3592ac3-acfc-4361-9acc-e5660fe8f2f3
    - text: Every 'Blood Pressure' value should be non-null and match the full pattern
        of two or three digits, a slash, and two or three digits (for example, '120/80').
        Missing or nonmatching values produce null SBP and DBP values, which propagate
        into the risk score; the code does not fill them. Requiring a full match also
        prevents the extraction of an unintended substring from a malformed value.
      sources:
      - start_line: 27
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 71
        file: ''
      - start_line: 109
        end_line: 123
        file: ''
      uid: 3c2c1e7c-9be5-4bf6-88a9-8aa4c011cb16
    - text: In each 'Blood Pressure' value, the number before the slash (systolic
        pressure) should be greater than the number after it (diastolic pressure).
        This keeps the derived pulse pressure positive and makes the blood-pressure
        risk component clinically coherent.
      sources:
      - start_line: 28
        end_line: 33
        file: ''
      - start_line: 71
        end_line: 71
        file: ''
      uid: 0425b1c8-2736-47d4-b608-f98f856efd54
