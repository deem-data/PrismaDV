prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\nimport re\n\nimport numpy as np\nimport pandas as pd\n\nparser = argparse.ArgumentParser()\n\
  parser.add_argument('--input', type=str, required=True)\nparser.add_argument('--output',\
  \ type=str, required=True)\nargs = parser.parse_args()\n\ninput_file = os.path.join(args.input,\
  \ 'new_data.csv')\nos.makedirs(args.output, exist_ok=True)\n\ndf = pd.read_csv(input_file)\n\
  \n# Select and coerce relevant columns\nsleep_duration = pd.to_numeric(df['Sleep\
  \ Duration'], errors='coerce')\nqos = pd.to_numeric(df['Quality of Sleep'], errors='coerce')\n\
  stress = pd.to_numeric(df['Stress Level'], errors='coerce')\nhr = pd.to_numeric(df['Heart\
  \ Rate'], errors='coerce')\nsteps = pd.to_numeric(df['Daily Steps'], errors='coerce')\n\
  pal = pd.to_numeric(df['Physical Activity Level'], errors='coerce')\nbp_series =\
  \ df['Blood Pressure']\nbmi_cat = df['BMI Category']\nsleep_disorder = df['Sleep\
  \ Disorder'] if 'Sleep Disorder' in df.columns else pd.Series([np.nan] * len(df))\n\
  # Use Sleep Duration in scoring\noptimal_sleep = 7.5\nsleep_duration_dev = (sleep_duration\
  \ - optimal_sleep).abs()\nduration_component = np.clip(sleep_duration_dev / 4.5,\
  \ 0.0, 1.0)\nqos_component = np.clip((10 - qos) / 9.0, 0.0, 1.0)\n\n# Correlation-based\
  \ calibration between Sleep Duration and Quality of Sleep\nmask_dq = sleep_duration.notna()\
  \ & qos.notna()\nif mask_dq.sum() >= 2:\n    corr_dur_qos = sleep_duration[mask_dq].corr(qos[mask_dq])\n\
  else:\n    corr_dur_qos = np.nan\n# Use regression only after correlation check\
  \ to predict expected QoS from duration\ncoef_dq = np.polyfit(sleep_duration[mask_dq].values,\
  \ qos[mask_dq].values, 1)\nqos_pred = coef_dq[0] * sleep_duration + coef_dq[1]\n\
  qos_gap = np.clip((qos_pred - qos) / 4.0, -1.0, 1.0)\nqos_gap_penalty = np.clip(-qos_gap,\
  \ 0.0, 1.0)\n\n# Stress correlations and usage\nmask_sq = stress.notna() & qos.notna()\n\
  mask_sd = stress.notna() & sleep_duration.notna()\nif mask_sq.sum() >= 2:\n    corr_stress_qos\
  \ = stress[mask_sq].corr(qos[mask_sq])\nelse:\n    corr_stress_qos = np.nan\nif\
  \ mask_sd.sum() >= 2:\n    corr_stress_sleep = stress[mask_sd].corr(sleep_duration[mask_sd])\n\
  else:\n    corr_stress_sleep = np.nan\n# Stress penalty scaled to [0,1]\nstress_component\
  \ = np.clip((stress - 3.0) / 5.0, 0.0, 1.0)\n# Heart rate risk: 0 in [55,95], rising\
  \ to 1 at 40 or 120\nhr_low_pen = np.where(hr < 55, (55 - hr) / (55 - 40), 0.0)\n\
  hr_high_pen = np.where(hr > 95, (hr - 95) / (120 - 95), 0.0)\nhr_component = np.clip(hr_low_pen\
  \ + hr_high_pen, 0.0, 1.0)\n# Parse BP and validate ranges\nbp_split = bp_series.astype(str).str.split('/',\
  \ n=1, expand=True)\nsystolic = pd.to_numeric(bp_split[0], errors='coerce')\ndiastolic\
  \ = pd.to_numeric(bp_split[1], errors='coerce')\n# Blood pressure risk relative\
  \ to 120/80 baseline\nbp_sys_pen = np.clip((systolic - 120) / (200 - 120), 0.0,\
  \ 1.0)\nbp_dia_pen = np.clip((diastolic - 80) / (120 - 80), 0.0, 1.0)\nbp_component\
  \ = np.maximum(bp_sys_pen, bp_dia_pen)\n\n# Daily Steps and Physical Activity Level\
  \ relationships\nmask_ps = steps.notna() & pal.notna()\nif mask_ps.sum() >= 2:\n\
  \    corr_steps_pal = steps[mask_ps].corr(pal[mask_ps])\nelse:\n    corr_steps_pal\
  \ = np.nan\n# Linear fit steps ~ a*pal + b for residual-based activity risk\ncoef_sp\
  \ = np.polyfit(pal[mask_ps].values, steps[mask_ps].values, 1)\npred_steps = coef_sp[0]\
  \ * pal + coef_sp[1]\nactivity_component = np.clip((pred_steps - steps) / 4000.0,\
  \ 0.0, 1.0)\n\n# BMI Category assumptions and usage\nvalid_bmi = {'Overweight',\
  \ 'Normal', 'Obese', 'Normal Weight'}\nbmi_risk_map = {\n    'Normal': 0.0,\n  \
  \  'Normal Weight': 0.0,\n    'Overweight': 0.4,\n    'Obese': 1.0,\n}\nbmi_component\
  \ = bmi_cat.map(bmi_risk_map).fillna(0.0)\n\nsd = sleep_disorder\nmask_sd_nonnull\
  \ = sd.notna()\nsa_mask = mask_sd_nonnull & (sd == 'Sleep Apnea')\nobese_over_mask\
  \ = bmi_cat.isin(['Overweight', 'Obese'])\nsa_count = sa_mask.sum()\nratio_ok =\
  \ True if sa_count == 0 else ((sa_mask & obese_over_mask).sum() / sa_count) >= 0.60\n\
  disorder_risk_map = {'Sleep Apnea': 1.0, 'Insomnia': 0.6}\nbase_disorder_component\
  \ = sd.map(disorder_risk_map).fillna(0.0)\n# Amplify apnea risk when paired with\
  \ higher BMI\napnea_with_weight = ((sd == 'Sleep Apnea') & bmi_cat.isin(['Overweight',\
  \ 'Obese'])).astype(float)\ndisorder_component = np.clip(base_disorder_component\
  \ + 0.2 * apnea_with_weight, 0.0, 1.0)\n\n# Aggregate risk score [0,1]\nrisk_score\
  \ = (\n        0.20 * duration_component +\n        0.15 * qos_component +\n   \
  \     0.05 * qos_gap_penalty +\n        0.10 * stress_component +\n        0.10\
  \ * hr_component +\n        0.15 * bp_component +\n        0.10 * activity_component\
  \ +\n        0.07 * bmi_component +\n        0.08 * disorder_component\n)\nrisk_score\
  \ = np.clip(risk_score, 0.0, 1.0)\n\n# Coaching alert logic\nalerts = []\nfor i\
  \ in range(len(df)):\n    pid = df.loc[i, 'Person ID'] if 'Person ID' in df.columns\
  \ else i\n    score = float(risk_score.iloc[i])\n    msg = None\n    alert_type\
  \ = None\n\n    sys_i = float(systolic.iloc[i]) if not pd.isna(systolic.iloc[i])\
  \ else np.nan\n    dia_i = float(diastolic.iloc[i]) if not pd.isna(diastolic.iloc[i])\
  \ else np.nan\n    hr_i = float(hr.iloc[i]) if not pd.isna(hr.iloc[i]) else np.nan\n\
  \    sd_i = sleep_disorder.iloc[i] if not pd.isna(sleep_disorder.iloc[i]) else None\n\
  \    bmi_i = bmi_cat.iloc[i] if not pd.isna(bmi_cat.iloc[i]) else None\n\n    if\
  \ score >= 0.70:\n        alert_type = 'HIGH_RISK'\n        if (sd_i == 'Sleep Apnea')\
  \ or ((sys_i >= 140 or dia_i >= 90) and bmi_i in ['Overweight', 'Obese']):\n   \
  \         msg = 'High sleep risk with cardiometabolic flags; suggest apnea screening\
  \ and clinical review.'\n        else:\n            msg = 'High sleep risk; intensive\
  \ coaching and evaluation recommended.'\n    elif score >= 0.40:\n        alert_type\
  \ = 'MODERATE_RISK'\n        if sd_i == 'Insomnia':\n            msg = 'Moderate\
  \ sleep risk; deliver CBT-I micro-lessons and wind-down routine.'\n        elif\
  \ steps.iloc[i] < 7000 and pal.iloc[i] < 60:\n            msg = 'Moderate sleep\
  \ risk; increase daytime activity and maintain sleep schedule.'\n        else:\n\
  \            msg = 'Moderate sleep risk; personalized sleep hygiene tips.'\n   \
  \ else:\n        alert_type = 'LOW_RISK'\n        msg = 'Maintain current habits;\
  \ reinforce consistency and recovery days.'\n\n    alerts.append({'Person ID': pid,\
  \ 'risk_score': round(score, 4), 'alert_type': alert_type, 'coaching_message': msg})\n\
  \n# Outputs\nscores_out = pd.DataFrame(\n    {'Person ID': df['Person ID'] if 'Person\
  \ ID' in df.columns else range(len(df)), 'risk_score': risk_score})\nalerts_out\
  \ = pd.DataFrame(alerts)\n\nscores_out.to_csv(os.path.join(args.output, 'risk_scores.csv'),\
  \ index=False)\nalerts_out.to_csv(os.path.join(args.output, 'coaching_alerts.csv'),\
  \ index=False)\n\n```\n\nThe same program is on disk at `./code/general_task_2.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 73, 'Person ID': 332, 'Gender': 'Female',\
  \ 'Age': 53, 'Occupation': 'Engineer', 'Sleep Duration': 8.4, 'Quality of Sleep':\
  \ 9, 'Physical Activity Level': 30, 'Stress Level': 3, 'BMI Category': 'Normal',\
  \ 'Blood Pressure': '125/80', 'Heart Rate': 65, 'Daily Steps': 5000, 'Sleep Disorder':\
  \ nan}, {'id': 223, 'Person ID': 206, 'Gender': 'Male', 'Age': 43, 'Occupation':\
  \ 'Engineer', 'Sleep Duration': 7.7, 'Quality of Sleep': 8, 'Physical Activity Level':\
  \ 90, 'Stress Level': 5, 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart\
  \ Rate': 70, 'Daily Steps': 8000, 'Sleep Disorder': nan}, {'id': 85, 'Person ID':\
  \ 215, 'Gender': 'Male', 'Age': 43, 'Occupation': 'Engineer', 'Sleep Duration':\
  \ 7.8, 'Quality of Sleep': 8, 'Physical Activity Level': 90, 'Stress Level': 5,\
  \ 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart Rate': 70, 'Daily\
  \ Steps': 8000, 'Sleep Disorder': nan}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
