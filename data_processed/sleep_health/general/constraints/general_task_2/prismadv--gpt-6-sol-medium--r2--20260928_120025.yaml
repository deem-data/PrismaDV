    - suggestion: .hasDataType('Stress Level', ConstrainableDataTypes.Integral)
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 59d98376-a429-4e8d-95b8-b45e7cee139f
      source_assumptions:
      - 5adcacc0-2dd5-465b-9803-a851d6bfe63d
      - 703cbe90-aaa5-4bee-ad95-34d6b00478b2
    - suggestion: .satisfies('`Stress Level` BETWEEN 3 AND 8', 'stress_level_in_expected_range')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 3d42231f-6afc-4fd2-9742-88c887501f0a
      source_assumptions:
      - 703cbe90-aaa5-4bee-ad95-34d6b00478b2
    - suggestion: '.hasNumberOfDistinctValues(''Stress Level'', lambda x: x >= 2,
        binningUdf=None, maxBins=1000)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 893f1c9e-5e7a-4c6f-ae66-5ed8d7a88007
      source_assumptions:
      - 143d8ff4-f8e8-413d-a100-4aca5695a4c9
    assumptions:
    - text: The input must contain a 'Stress Level' column, because the code accesses
        it directly.
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      uid: 3e0160ab-b3d4-40ac-abd2-6a615b7f1a39
    - text: Every 'Stress Level' value should be non-null and convertible to a numeric
        value. Invalid or missing values become NaN after coercion and can produce
        NaN risk scores, which the alert logic does not handle explicitly.
      sources:
      - start_line: 21
        end_line: 21
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      - start_line: 106
        end_line: 123
        file: ''
      - start_line: 133
        end_line: 149
        file: ''
      uid: 5adcacc0-2dd5-465b-9803-a851d6bfe63d
    - text: The 'Stress Level' values should be integers from 3 through 8, inclusive,
        consistent with the observed data and the scoring formula that maps 3 to a
        zero stress penalty and 8 to a full penalty. Values outside this range are
        clipped and lose their relative severity.
      sources:
      - start_line: 58
        end_line: 58
        file: ''
      uid: 703cbe90-aaa5-4bee-ad95-34d6b00478b2
    - text: The 'Stress Level' column should contain at least two distinct values
        so its correlations with sleep quality and sleep duration can be meaningful
        when sufficient paired observations are available.
      sources:
      - start_line: 47
        end_line: 56
        file: ''
      uid: 143d8ff4-f8e8-413d-a100-4aca5695a4c9
  '["BMI Category","Blood Pressure"]':
    code:
    - suggestion: '.satisfies("`BMI Category` IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'') AND `Blood Pressure` RLIKE ''^[0-9]+([.][0-9]+)?/[0-9]+([.][0-9]+)?$''",
        "valid_bmi_and_blood_pressure", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
