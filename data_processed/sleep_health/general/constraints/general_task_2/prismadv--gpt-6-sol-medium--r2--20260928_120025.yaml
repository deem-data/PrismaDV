        calculation and the 7,000-step alert condition.'
      sources:
      - start_line: 79
        end_line: 81
        file: ''
      - start_line: 143
        end_line: 143
        file: ''
      uid: 53b24a1f-1783-4574-a860-df7e4a196bea
    - text: At least two rows should have numeric, non-null values in both 'Daily
