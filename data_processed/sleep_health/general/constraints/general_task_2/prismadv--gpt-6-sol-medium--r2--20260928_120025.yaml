        and 'Quality of Sleep' values, and the 'Sleep Duration' values in those rows
        should not all be identical. The code fits a linear relationship between the
        two columns without checking that the fit has enough observations or variation
        in sleep duration.
      sources:
      - start_line: 35
        end_line: 43
        file: ''
      uid: 18ecf8bf-e53c-45d3-b999-7838c1862890
    - text: Each 'Sleep Duration' value should be between 0 and 24 hours. The scoring
        formula treats the value as a duration in hours relative to a 7.5-hour target;
        values outside a possible daily duration would produce misleading scores,
        even though the component is clipped.
      sources:
      - start_line: 29
        end_line: 31
        file: ''
      uid: 9134ee77-8660-4a92-a4e7-6149d79fc971
  Stress Level:
    code:
    - suggestion: .isComplete('Stress Level')
      validity: true
      reason_if_invalid: ''
