    - suggestion: .hasPattern('Blood Pressure', r'^\s*[+-]?(?:[0-9]+(?:[.][0-9]*)?|[.][0-9]+)\s*/\s*[+-]?(?:[0-9]+(?:[.][0-9]*)?|[.][0-9]+)\s*$')
