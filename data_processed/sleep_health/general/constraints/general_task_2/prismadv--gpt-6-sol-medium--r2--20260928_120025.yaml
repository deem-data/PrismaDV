      source_assumptions:
      - 7de3f0e3-79be-408c-8558-bec2f00f0288
    assumptions:
    - text: Every record should have both a finite numeric 'Sleep Duration' and a
        finite numeric 'Quality of Sleep'. The code coerces nonnumeric values to null,
        but does not fill missing values before computing their combined penalty and
        risk score. This can be checked with a row-level constraint requiring both
        values to be non-null after numeric parsing.
      sources:
      - start_line: 19
        end_line: 20
        file: ''
      - start_line: 29
        end_line: 43
        file: ''
      - start_line: 106
        end_line: 117
        file: ''
      uid: 1970cb8b-2aba-4390-8db7-f46eeb8b6fc9
    - text: Among records with valid values for both columns, there should be at least
        two records, at least two distinct 'Sleep Duration' values, and at least two
        distinct 'Quality of Sleep' values. The duration variation is needed for the
        linear fit; variation in both columns is needed for a defined Pearson correlation.
      sources:
      - start_line: 35
        end_line: 43
        file: ''
      uid: 7de3f0e3-79be-408c-8558-bec2f00f0288
