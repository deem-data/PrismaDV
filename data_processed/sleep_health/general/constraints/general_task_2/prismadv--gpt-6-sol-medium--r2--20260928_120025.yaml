      - start_line: 64
        end_line: 70
        file: ''
      - start_line: 106
        end_line: 123
        file: ''
      uid: 2a293bcd-2af1-4efd-aef8-30708ebd8aa1
    - text: The two measurements in each 'Blood Pressure' value should be positive,
        with systolic pressure greater than diastolic pressure. The script treats
        them as clinically meaningful blood-pressure measurements when calculating
        risk and selecting coaching messages.
      sources:
      - start_line: 68
        end_line: 70
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      uid: a93c9413-7855-4514-b4f7-cadebbd0cfc0
