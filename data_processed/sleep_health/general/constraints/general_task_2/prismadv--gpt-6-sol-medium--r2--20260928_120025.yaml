    downstream_task_description: No specific description provided. The script can
      be used for any task.
  llm:
    model_name: gpt-6-sol-medium
    temperature: 0.6
    max_tokens: null
    seed: null
  io:
    overwrite: false
replicate: 2
constraints:
  BMI Category:
    code:
    - suggestion: .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight',
        'Obese'])
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: cee22c22-eb31-445e-adb4-01965593e769
      source_assumptions:
      - 26157c7f-dc9c-4304-8674-f6dca166dc00
    - suggestion: .isComplete('BMI Category')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: f3610fac-537e-45c2-b45e-dfddf451a4a5
      source_assumptions:
      - 88d29f79-b5c3-4e7c-bdb9-c2d5e81dc83f
    assumptions:
    - text: The input must contain a 'BMI Category' column with string values drawn
        from exactly 'Normal', 'Normal Weight', 'Overweight', and 'Obese'. The risk
        mapping and higher-BMI checks use exact, case-sensitive matches; other values
        would be treated as zero BMI risk and would not trigger higher-BMI flags.
      sources:
      - start_line: 26
        end_line: 26
        file: ''
      - start_line: 83
        end_line: 96
        file: ''
      - start_line: 131
        end_line: 135
        file: ''
      uid: 26157c7f-dc9c-4304-8674-f6dca166dc00
    - text: The 'BMI Category' column should have no null values. Although a missing
        value would not stop the script, it would receive zero BMI risk and would
        not trigger higher-BMI flags; the observed input is fully populated.
      sources:
      - start_line: 26
        end_line: 26
        file: ''
      - start_line: 91
        end_line: 96
        file: ''
      - start_line: 131
        end_line: 135
        file: ''
      uid: 88d29f79-b5c3-4e7c-bdb9-c2d5e81dc83f
    - text: If any rows have 'Sleep Disorder' equal to 'Sleep Apnea', at least 60%
        of those rows should have 'BMI Category' equal to 'Overweight' or 'Obese'.
        The script calculates this condition as `ratio_ok`, although it does not enforce
        it.
      sources:
      - start_line: 93
        end_line: 98
        file: ''
      uid: 6916d988-b10b-4b83-a01c-373ec1559888
  Blood Pressure:
