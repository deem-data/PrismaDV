      sources:
      - start_line: 25
        end_line: 25
        file: ''
      uid: 256ec340-fbb8-4a71-9bd8-2115030b9b65
    - text: Every 'Blood Pressure' value should be non-null and contain two numeric
        measurements separated by a forward slash, in systolic/diastolic order (for
        example, '120/80'). Both parts must be parseable as numbers; otherwise the
        blood-pressure component of the risk score can become missing and affect the
        output.
