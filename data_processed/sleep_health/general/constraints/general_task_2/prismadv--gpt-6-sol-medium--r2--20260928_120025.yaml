  '["BMI Category","Sleep Disorder"]':
    code:
    - suggestion: '.satisfies("`BMI Category` IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'') AND (`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Sleep Apnea'',
        ''Insomnia''))", ''recognized_bmi_and_sleep_disorder_values'', lambda x: x
        == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 790bc344-2aee-401a-a4b1-c0d0c75ee6dd
      source_assumptions:
      - 807f3288-2b0d-4e2b-8ec0-5196bcf3fba1
    assumptions:
    - text: When at least one record has 'Sleep Disorder' = 'Sleep Apnea', at least
        60% of those records should have 'BMI Category' equal to 'Overweight' or 'Obese'.
        If there are no Sleep Apnea records, this condition is satisfied. This can
        be checked as count(Sleep Disorder = 'Sleep Apnea' AND BMI Category IN ('Overweight',
        'Obese')) / count(Sleep Disorder = 'Sleep Apnea') >= 0.60 when the denominator
        is nonzero.
      sources:
      - start_line: 93
        end_line: 98
        file: ''
      uid: b4e3aa32-cb14-45aa-8cfe-da80e95b64e6
    - text: For each record, 'BMI Category' should be one of 'Normal', 'Normal Weight',
        'Overweight', or 'Obese', and 'Sleep Disorder' should be either null, 'Sleep
        Apnea', or 'Insomnia'. This joint-domain check prevents an unrecognized value
        in either column from silently receiving the default risk contribution when
        the columns are scored together.
      sources:
      - start_line: 83
        end_line: 103
        file: ''
      uid: 807f3288-2b0d-4e2b-8ec0-5196bcf3fba1
  '["Daily Steps","Physical Activity Level"]':
    code:
    - suggestion: '.satisfies(''`Daily Steps` IS NOT NULL AND `Physical Activity Level`
        IS NOT NULL AND TRY_CAST(`Daily Steps` AS DOUBLE) IS NOT NULL AND TRY_CAST(`Physical
        Activity Level` AS DOUBLE) IS NOT NULL'', ''paired_numeric_activity_values'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0824a7b1-650b-411b-827b-0923118debf0
      source_assumptions:
      - 49382872-f5fd-4a02-a78d-18bfbf56d11b
    - suggestion: '.hasCorrelation(''Daily Steps'', ''Physical Activity Level'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: e8a5f187-c7d1-4fe8-8bc9-e81238a570ce
      source_assumptions:
      - 1b1a6817-d587-4a8a-8dbd-9f0028ef5cfc
      - 6fdfa427-6418-4253-945e-a377a3249807
    assumptions:
    - text: Every record should have numeric, non-null values for both 'Daily Steps'
        and 'Physical Activity Level'. The script uses them together to calculate
        an activity-risk component for each record and, for moderate-risk records,
        to select a coaching message. This can be checked with a row-level constraint
        requiring both columns to be non-null and numeric.
      sources:
      - start_line: 23
        end_line: 24
        file: ''
      - start_line: 79
        end_line: 81
        file: ''
      - start_line: 139
        end_line: 145
        file: ''
      uid: 49382872-f5fd-4a02-a78d-18bfbf56d11b
    - text: At least two records should have paired, numeric values for 'Daily Steps'
        and 'Physical Activity Level', and 'Physical Activity Level' should have at
        least two distinct values among those records. Otherwise, the linear fit of
        steps against activity level cannot be reliably computed.
      sources:
      - start_line: 73
        end_line: 79
        file: ''
      uid: 1b1a6817-d587-4a8a-8dbd-9f0028ef5cfc
    - text: Among records with paired values, 'Daily Steps' and 'Physical Activity
        Level' should be positively associated. The activity-risk calculation treats
        step counts below the value predicted from physical activity level as a penalty;
        a non-positive relationship would undermine that interpretation. This can
        be checked with a positive correlation constraint, such as `.hasCorrelation("Daily
        Steps", "Physical Activity Level", _ > 0)`.
      sources:
      - start_line: 72
        end_line: 81
        file: ''
      uid: 6fdfa427-6418-4253-945e-a377a3249807
  '["Quality of Sleep","Sleep Duration"]':
    code:
    - suggestion: '.satisfies(''try_cast(`Sleep Duration` AS DOUBLE) BETWEEN -1.7976931348623157E308
        AND 1.7976931348623157E308 AND try_cast(`Quality of Sleep` AS DOUBLE) BETWEEN
        -1.7976931348623157E308 AND 1.7976931348623157E308'', ''finite_sleep_duration_and_quality'',
        lambda x: x == 1.0)'
      validity: true
