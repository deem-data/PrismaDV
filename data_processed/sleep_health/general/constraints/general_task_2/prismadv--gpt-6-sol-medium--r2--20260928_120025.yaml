      source_assumptions:
      - 3f7b3f89-7654-4afb-9874-b12f9f27163f
    assumptions:
    - text: For each record, 'BMI Category' should be one of 'Normal', 'Normal Weight',
        'Overweight', or 'Obese', and 'Blood Pressure' should contain two numeric
        values in 'systolic/diastolic' format. Both values are needed on the same
        record so the script can calculate BMI and blood-pressure risk together and
        evaluate the combined cardiometabolic alert condition. This can be checked
        with a row-level constraint on both columns.
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 64
