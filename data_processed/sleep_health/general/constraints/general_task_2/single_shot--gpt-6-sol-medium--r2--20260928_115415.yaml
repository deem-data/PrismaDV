constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category').isContainedIn('BMI Category', ['Normal', 'Normal
        Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - '.isComplete(''Blood Pressure'').satisfies("`Blood Pressure` RLIKE ''^[0-9]{2,3}/[0-9]{2,3}$''
        AND CAST(split(`Blood Pressure`, ''/'')[0] AS INT) BETWEEN 70 AND 250 AND
        CAST(split(`Blood Pressure`, ''/'')[1] AS INT) BETWEEN 40 AND 150", ''valid_blood_pressure'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.isComplete(''Daily Steps'').satisfies(''`Daily Steps` >= 0'', ''valid_daily_steps'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - '.isComplete(''Heart Rate'').satisfies(''`Heart Rate` BETWEEN 30 AND 220'',
        ''valid_heart_rate'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID').isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.isComplete(''Physical Activity Level'').satisfies(''`Physical Activity Level`
        BETWEEN 0 AND 100'', ''valid_physical_activity_level'', lambda x: x == 1.0).hasStandardDeviation(''Physical
        Activity Level'', lambda x: x > 0)'
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.isComplete(''Quality of Sleep'').satisfies(''`Quality of Sleep` BETWEEN
        1 AND 10'', ''valid_quality_of_sleep'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Sleep Apnea'',
        ''Insomnia'')", ''valid_sleep_disorder'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.isComplete(''Sleep Duration'').satisfies(''`Sleep Duration` BETWEEN 0 AND
        24'', ''valid_sleep_duration'', lambda x: x == 1.0).hasStandardDeviation(''Sleep
        Duration'', lambda x: x > 0)'
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - '.isComplete(''Stress Level'').satisfies(''`Stress Level` BETWEEN 1 AND 10'',
        ''valid_stress_level'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Stress Level
  __dataset__:
    code:
    - - '.hasSize(lambda n: n >= 2)'
      - Valid
    assumptions: []
    column_name: __dataset__
