    assumptions:
    - text: Both 'Daily Steps' and 'Physical Activity Level' should have numeric,
        non-null values for every record. The script uses them together to calculate
        an activity-risk component and, for moderate-risk records, to select a coaching
        message; a missing value can make the score invalid or prevent the activity-specific
        message from being selected. A row-level constraint can require `Daily Steps
        IS NOT NULL AND Physical Activity Level IS NOT NULL` after numeric parsing.
      sources:
      - start_line: 23
        end_line: 24
        file: ''
      - start_line: 79
        end_line: 81
        file: ''
      - start_line: 143
        end_line: 144
        file: ''
      uid: c7d97b07-fbcb-4d9c-8a06-c5bc936b639f
    - text: There should be at least two records with valid values in both 'Daily
        Steps' and 'Physical Activity Level', and 'Physical Activity Level' should
        vary among those records. The linear fit uses the paired records and needs
        variation in its predictor to produce a meaningful expected step count.
      sources:
      - start_line: 73
        end_line: 81
        file: ''
      uid: 56d7f8fd-0c27-4fc6-98b1-9fe3b797fbf0
    - text: Among records with valid values in both columns, 'Daily Steps' should
        generally increase as 'Physical Activity Level' increases. The fitted expected
        step count is used to penalize steps that fall below expectation, so a negative
        fitted slope would reverse the intended interpretation. This can be checked
        by requiring a positive fitted slope for `Daily Steps ~ Physical Activity
        Level`.
      sources:
      - start_line: 72
        end_line: 81
        file: ''
