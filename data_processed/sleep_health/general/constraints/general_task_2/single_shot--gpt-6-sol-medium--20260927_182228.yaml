constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Overweight', 'Normal', 'Obese', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) BETWEEN 70 AND 200
        AND CAST(split(`Blood Pressure`, '/')[1] AS INT) BETWEEN 40 AND 120 AND CAST(split(`Blood
        Pressure`, '/')[0] AS INT) > CAST(split(`Blood Pressure`, '/')[1] AS INT)",
        'plausible_blood_pressure_values')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'", 'valid_blood_pressure_format')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` BETWEEN 0 AND 50000', 'plausible_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('`Heart Rate` BETWEEN 40 AND 120', 'plausible_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasApproxCountDistinct(''Physical Activity Level'', lambda n: n >= 2)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` BETWEEN 0 AND 100', 'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 1 AND 10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasApproxCountDistinct(''Sleep Duration'', lambda n: n >= 2)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` BETWEEN 3 AND 12', 'plausible_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('`Stress Level` BETWEEN 1 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
