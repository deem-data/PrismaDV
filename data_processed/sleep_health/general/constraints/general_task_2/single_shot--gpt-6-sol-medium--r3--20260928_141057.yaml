constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$' AND CAST(split(`Blood
        Pressure`, '/')[0] AS INT) BETWEEN 70 AND 200 AND CAST(split(`Blood Pressure`,
        '/')[1] AS INT) BETWEEN 40 AND 120", 'valid_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('CAST(`Daily Steps` AS DOUBLE) BETWEEN 0 AND 30000', 'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('CAST(`Heart Rate` AS DOUBLE) BETWEEN 40 AND 120', 'valid_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasNumberOfDistinctValues(''Physical Activity Level'', lambda n: n >= 2)'
      - Invalid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) BETWEEN 0 AND 100',
        'valid_physical_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 1 AND 10', 'valid_quality_of_sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia', 'Sleep
        Apnea')", 'valid_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasNumberOfDistinctValues(''Sleep Duration'', lambda n: n >= 2)'
      - Invalid
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) > 0 AND CAST(`Sleep Duration`
        AS DOUBLE) <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
