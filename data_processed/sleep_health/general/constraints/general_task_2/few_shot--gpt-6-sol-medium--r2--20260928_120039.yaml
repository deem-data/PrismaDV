constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[0-9]+/[0-9]+$'", 'parseable_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('CAST(`Daily Steps` AS DOUBLE) >= 0', 'nonnegative_numeric_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('CAST(`Heart Rate` AS DOUBLE) > 0', 'positive_numeric_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasNumberOfDistinctValues(''Physical Activity Level'', lambda x: x >= 2)'
      - Invalid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('CAST(`Physical Activity Level` AS DOUBLE) >= 0', 'nonnegative_numeric_activity_level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('CAST(`Quality of Sleep` AS DOUBLE) BETWEEN 1 AND 10', 'valid_quality_of_sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Sleep Apnea',
        'Insomnia')", 'recognized_sleep_disorder_or_null')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasNumberOfDistinctValues(''Sleep Duration'', lambda x: x >= 2)'
      - Invalid
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('CAST(`Sleep Duration` AS DOUBLE) > 0', 'positive_numeric_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .satisfies('CAST(`Stress Level` AS DOUBLE) BETWEEN 0 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
