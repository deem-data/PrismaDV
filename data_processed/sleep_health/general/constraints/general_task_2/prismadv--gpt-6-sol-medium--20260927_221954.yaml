        end_line: 100
        file: ''
      - start_line: 130
        end_line: 142
        file: ''
      uid: c18e06d0-357c-4134-8715-9d67856e1bf8
    - text: If any rows have 'Sleep Disorder' equal to 'Sleep Apnea', at least 60%
