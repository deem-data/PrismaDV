      uid: 8dcc3918-381b-4b1a-8e24-98aec25faf67
    - text: '''Stress Level'' should contain integer values from 3 through 8, consistent
        with the observed data and the scoring formula, which maps 3 to a zero stress
        penalty and 8 to a full penalty. Values outside that range are clipped and
        lose their distinct effect on the score.'
      sources:
