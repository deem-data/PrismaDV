      source_assumptions:
      - 5e0b0822-fa63-423a-a2a5-a2dd7c257f56
    assumptions:
    - text: The input data must contain a 'Sleep Duration' column, because the code
        accesses it by name.
      sources:
      - start_line: 16
        end_line: 19
        file: ''
      uid: 7a0fb50b-b6e0-4d96-a8bd-f007b0c747c2
    - text: Every 'Sleep Duration' value should be present and convertible to a finite
        number. The code coerces invalid values to missing but does not fill them,
        so missing or invalid durations would produce missing risk scores. This is
        consistent with the column's reported completeness of 1.0.
      sources:
      - start_line: 19
        end_line: 31
        file: ''
      - start_line: 106
        end_line: 123
        file: ''
      uid: afb055c3-4a2d-404c-9f2d-b1a7ff0ff34a
    - text: '''Sleep Duration'' should represent hours of sleep per day, with values
        between 0 and 24 inclusive. The scoring calculation compares it with an optimal
        duration of 7.5 hours; values outside a day''s possible duration would be
        implausible even though the resulting component is clipped.'
      sources:
      - start_line: 28
        end_line: 31
        file: ''
      uid: 5e0b0822-fa63-423a-a2a5-a2dd7c257f56
    - text: Among rows with a valid 'Quality of Sleep' value, at least two rows must
        have valid 'Sleep Duration' values, and those durations must include at least
        two distinct values. The unguarded linear fit requires paired observations
        and variation in duration. The reported approximately 27 distinct values for
        the full column do not by themselves guarantee variation among the paired
        rows.
      sources:
      - start_line: 35
        end_line: 42
        file: ''
      uid: 1be26f63-ea0e-4b01-bb27-b4f31fb0a4d5
