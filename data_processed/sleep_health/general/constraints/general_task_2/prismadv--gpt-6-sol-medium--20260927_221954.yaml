    - suggestion: .satisfies('try_cast(`Sleep Duration` AS DOUBLE) IS NOT NULL AND
        NOT isnan(try_cast(`Sleep Duration` AS DOUBLE)) AND abs(try_cast(`Sleep Duration`
        AS DOUBLE)) <= 1.7976931348623157E308', 'finite_sleep_duration')
