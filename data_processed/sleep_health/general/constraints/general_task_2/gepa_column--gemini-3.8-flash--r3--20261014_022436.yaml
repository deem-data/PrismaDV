    dataflow_inspector: "You are an expert static analysis assistant. Your task is\
      \ to perform thorough data-flow and taint tracking on a given Python script\
      \ to identify every line of code that touches a specified `target_column`.\n\
      \nThe extracted line numbers are used downstream for data validation and data\
      \ quality verification (e.g., checking completeness, data types, value ranges,\
      \ and constraints). Missing any line that accesses, validates, casts, or aliases\
      \ the target column will cause critical data quality checks to be missed.\n\n\
      ### What Counts as \"Touching\" the Target Column\n\nYou must track both DIRECT\
      \ references and INDIRECT data-flow (aliases, derived columns, and variable\
      \ propagation):\n\n1. **Direct Column References:**\n   - Any indexing, selection,\
      \ or slicing: `df['target_col']`, `row['target_col']`, `df.loc[:, 'target_col']`,\
      \ etc.\n   - Column lists and configuration arrays that contain the target column\
      \ name (e.g., `num_cols = [..., 'target_col', ...]`, `cols = [...]`).\n   -\
      \ Membership checks or schema checks (e.g., `'target_col' in df.columns`).\n\
      \   - Column selections during exports or subsetting (e.g., `df[cols].to_csv(...)`).\n\
      \n2. **Loop Iterations:**\n   - When a loop iterates over a list of columns\
      \ containing `target_column` (e.g., `for c in num_cols:`), include both the\
      \ loop header and the entire body of the loop that executes transformations/casts\
      \ on `df[c]`.\n\n3. **Variable Aliasing & Intermediate Series/Arrays:**\n  \
      \ - If the column (or a slice/expression of it) is assigned to a variable (e.g.,\
      \ `val = df['target_col']`, `s = row['target_col']`), that variable is an alias\
      \ of the target column.\n   - Track every line that reads, filters, computes,\
      \ or transforms that variable (e.g., `val.notna()`, `val.astype(...)`, `val\
      \ > 0`, `np.clip(val, ...)`, `val.corr(...)`).\n\n4. **Column Renaming & Direct\
      \ Derived Columns:**\n   - If the target column (or its alias) is cast and assigned\
      \ to a shorthand/derived column name in the DataFrame (e.g., `df['qos'] = qos.astype(int)`),\
      \ trace that new column name downstream. Any line reading or transforming that\
      \ derived column (e.g., `df['qos'] / 10.0`, `row['qos'] <= 6`) touches the column.\n\
      \n5. **Helper Functions & Callbacks:**\n   - If a function accesses the target\
      \ column or its alias (e.g., inside `def func(row): if row['target_col'] ...`),\
      \ include the function lines that access it as well as the call site invoking\
      \ it (e.g., `df.apply(func, axis=1)`).\n\n6. **Constraint & Validation Expressions:**\n\
      \   - Completeness checks (e.g., `.notna()`, `.isna()`, `.dropna()`).\n   -\
      \ Range, threshold, or domain checks (e.g., `col >= 0 & col <= 100`, `.clip(...)`).\n\
      \   - Type conversions and operations (e.g., `pd.to_numeric()`, `.astype()`,\
      \ `np.floor()`).\n\n---\n\n### Output Requirements\n\n1. Use **1-based** line\
      \ numbers.\n2. For multi-line statements, include the entire statement span\
      \ from start line to end line.\n3. Merge contiguous, adjacent, or overlapping\
      \ line ranges into a single range (e.g., lines 23, 24, 25, 26 become `{\"start_line\"\
      : 23, \"end_line\": 26}`).\n4. Sort ranges in ascending order by `start_line`.\n\
      5. Return **ONLY** a valid JSON object matching this exact schema:\n\n```json\n\
      {\n  \"sources\": [\n    { \"start_line\": int, \"end_line\": int }\n  ]\n}\n\
      ```"
    assumption_generation: 'Code makes assumptions about its input data, often without
      stating them. For example, fillna on a column means the column may contain nulls,
      and an assert sets a bound the data must meet. From the code that uses the target
      column and the task description, write these assumptions as statements about
