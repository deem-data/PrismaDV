      - start_line: 84
        end_line: 91
        file: ''
      uid: a0f2d85f-4f7d-42fd-9045-93998b2b5ea6
    - text: 'The ''BMI Category'' column may contain missing or null values, as the
        downstream code handles missing values by calling `.fillna(0.0)` during risk
        score mapping and checking `pd.isna()` during alert evaluation.

        We could represent this assumption as a deequ constraint like this:

        .satisfies(''`BMI Category` IS NOT NULL OR `BMI Category` IS NULL'', ''Null
        values allowed'', lambda x: x == 1.0)'
      sources:
      - start_line: 91
        end_line: 91
        file: ''
      - start_line: 131
        end_line: 131
        file: ''
