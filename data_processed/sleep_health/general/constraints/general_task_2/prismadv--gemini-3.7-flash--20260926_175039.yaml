    assumptions:
    - text: 'The ''BMI Category'' column is expected to contain categorical string
        values primarily from the set {''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese''}.

        We could represent this assumption as a deequ constraint like this:

        .isContainedIn(''BMI Category'', [''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese''])'
