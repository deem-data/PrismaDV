  '["BMI Category","Blood Pressure"]':
    code: []
    assumptions:
    - text: 'Both ''Blood Pressure'' and ''BMI Category'' are assumed to be non-null
        across all records, as they are jointly used to compute the overall risk score
        (weighted at 15% and 7% respectively) and evaluated together to identify cardiometabolic
        risk (checking if systolic >= 140 or diastolic >= 90 when BMI Category is
        ''Overweight'' or ''Obese''). We can express this constraint in Deequ as:
        .satisfies("`Blood Pressure` IS NOT NULL AND `BMI Category` IS NOT NULL",
        "BP_and_BMI_non_null")'
      sources:
      - start_line: 25
        end_line: 26
        file: ''
      - start_line: 106
        end_line: 117
        file: ''
      - start_line: 133
        end_line: 136
        file: ''
      uid: 8a3dfd8a-4490-4fd9-b3c7-210e59dd2167
    - text: '''Blood Pressure'' is assumed to follow the ''systolic/diastolic'' integer
        format whenever ''BMI Category'' is defined within valid clinical categories
