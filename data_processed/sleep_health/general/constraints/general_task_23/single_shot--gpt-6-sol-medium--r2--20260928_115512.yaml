constraints:
  Age:
    code:
    - - .satisfies('`Age` BETWEEN 18 AND 100', 'plausible_age')
      - Valid
    assumptions: []
    column_name: Age
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("`Blood Pressure` RLIKE '^[ ]*[0-9]{2,3}[ ]*/[ ]*[0-9]{2,3}[ ]*$'",
        'parseable_blood_pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .satisfies('`Daily Steps` BETWEEN 0 AND 100000', 'valid_daily_steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Daily Steps, Physical Activity Level:
    code:
    - - '.hasCorrelation(''Daily Steps'', ''Physical Activity Level'', lambda x: x
        > 0)'
      - Valid
    assumptions: []
    column_name: Daily Steps, Physical Activity Level
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .satisfies('`Heart Rate` BETWEEN 30 AND 220', 'plausible_heart_rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .satisfies('`Physical Activity Level` BETWEEN 0 AND 180', 'valid_physical_activity')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .satisfies('`Quality of Sleep` BETWEEN 1 AND 10', 'valid_sleep_quality')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda x: 0.2 <= x <= 0.7)'
      - Valid
    - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia', 'Sleep
        Apnea')", 'recognized_sleep_disorder')
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .satisfies('`Sleep Duration` > 0 AND `Sleep Duration` <= 24', 'valid_sleep_duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Sleep Duration, Quality of Sleep:
    code:
    - - '.hasCorrelation(''Sleep Duration'', ''Quality of Sleep'', lambda x: x > 0)'
      - Valid
    assumptions: []
    column_name: Sleep Duration, Quality of Sleep
  Stress Level:
    code:
    - - .satisfies('`Stress Level` BETWEEN 1 AND 10', 'valid_stress_level')
      - Valid
    assumptions: []
    column_name: Stress Level
