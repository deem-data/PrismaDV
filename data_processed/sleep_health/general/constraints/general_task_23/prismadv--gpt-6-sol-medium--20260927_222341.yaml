      - start_line: 42
        end_line: 48
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      uid: 9390c7f3-2096-43e1-9b79-913984a701f5
    - text: Every 'Blood Pressure' value should match two 2- or 3-digit numbers separated
        by '/', with optional whitespace (for example, '120/80'). Values containing
        units, decimals, or other formats will not parse and will lose their blood-pressure
        stage and derived measurements.
      sources:
      - start_line: 42
        end_line: 48
        file: ''
      - start_line: 147
        end_line: 157
        file: ''
      uid: 9d4d98f8-9334-4df2-bd42-7437c333d43e
    - text: For each parsed 'Blood Pressure' value, the first number should be greater
        than the second. The code interprets them as systolic and diastolic pressure,
        respectively, when calculating mean arterial pressure and assigning clinical
        stages.
      sources:
      - start_line: 9
        end_line: 22
        file: ''
      - start_line: 43
        end_line: 48
        file: ''
      uid: 3dc1158b-d092-4fea-8fa1-0dd6c26c2283
