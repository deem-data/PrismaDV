      uid: b5e625af-4c40-4f4c-bf68-dbf727c6675c
    - text: The input 'Physical Activity Level' column should have no null values.
        The code does not impute missing or unparseable values before using the column
        to calculate expected steps and member scores; the dataset description also
        reports full completeness.
      sources:
