    - text: '''Daily Steps'' should contain nonnegative whole-number counts of steps
        taken per day. Negative or fractional values do not represent step counts,
        and the scoring code would clip negative values rather than reject them. Values
        should use individual steps, not thousands of steps, so comparisons with 5000,
        7000, and 10000 have their intended meaning.'
