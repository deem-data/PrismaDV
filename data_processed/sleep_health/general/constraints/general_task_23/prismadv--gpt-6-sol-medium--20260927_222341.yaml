        end_line: 42
        file: ''
      uid: c99ca61f-b0e0-470d-8581-54096cd0c218
    - text: The 'Blood Pressure' column should be non-null, consistent with its observed
        100% completeness. Although the code assigns a fallback penalty to unparseable
        values, nulls would prevent blood-pressure staging and mean arterial pressure
        calculation for those rows.
