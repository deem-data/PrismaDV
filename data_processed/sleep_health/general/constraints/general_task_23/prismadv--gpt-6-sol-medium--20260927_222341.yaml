      - start_line: 93
        end_line: 93
        file: ''
      - start_line: 115
        end_line: 117
        file: ''
      - start_line: 155
        end_line: 157
        file: ''
      uid: 797e80db-5681-4856-b2bf-c485a02f65b2
    - text: '''Daily Steps'' should have more than one distinct valid value, with
