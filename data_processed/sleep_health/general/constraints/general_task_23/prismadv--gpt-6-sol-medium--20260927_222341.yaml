        file: ''
      - start_line: 95
        end_line: 101
        file: ''
      - start_line: 116
        end_line: 118
        file: ''
      uid: 3fbfba5f-3bef-4819-9e19-881bfe322dd1
    - text: The input 'Physical Activity Level' column should contain at least two
        distinct values and at least two non-null observations. Otherwise its variance
        is zero or undefined, the steps-versus-activity correlations cannot be calculated
        meaningfully, and the expected-steps model falls back to a zero slope.
