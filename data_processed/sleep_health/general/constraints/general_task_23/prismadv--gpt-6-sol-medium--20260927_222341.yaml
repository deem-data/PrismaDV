        end_line: 85
        file: ''
      - start_line: 95
        end_line: 100
        file: ''
      uid: 80f4c1bd-78ec-4d7e-babb-72363f9776a3
    - text: 'The input ''Physical Activity Level'' values should be nonnegative: they
        represent an amount of activity and are used as an ordered quantity in quantiles,
        a linear steps expectation, and low-activity triage. Values below zero would
        make those calculations misleading.'
