        \ 7.4, 'Quality of Sleep': 7, 'Physical Activity Level': 60, 'Stress Level':\
        \ 5, 'BMI Category': 'Obese', 'Blood Pressure': '135/88', 'Heart Rate': 84,\
        \ 'Daily Steps': 3300, 'Sleep Disorder': 'Sleep Apnea'}]\n\nThe full table\
