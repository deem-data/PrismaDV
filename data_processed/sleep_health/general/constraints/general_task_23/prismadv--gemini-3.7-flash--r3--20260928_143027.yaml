  '["Daily Steps","Physical Activity Level"]':
    code: []
    assumptions:
    - text: '''Daily Steps'' and ''Physical Activity Level'' are expected to have
        a positive correlation, as physical activity level directly relates to the
        number of steps taken, and the pipeline models ''Daily Steps'' as a linear
        function of ''Physical Activity Level'' to calculate expected steps and alignment
        metrics. This assumption can be represented as a Deequ correlation constraint:
        .hasCorrelation(''Daily Steps'', ''Physical Activity Level'', lambda c: c
        > 0.0).'
      sources:
