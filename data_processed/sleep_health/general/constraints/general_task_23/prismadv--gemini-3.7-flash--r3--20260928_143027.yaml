    - text: 'Both ''Sleep Duration'' and ''Quality of Sleep'' columns should be present
        and complete (non-null) across the records in order to accurately compute
        linear regression coefficients, mean cohort quality thresholds, and individual
        sleep wellness components without dropped observations. We could represent
        this assumption as Deequ constraints: .isComplete("Sleep Duration").isComplete("Quality
