        end_line: 101
        file: ''
      - start_line: 115
        end_line: 118
        file: ''
      uid: d925f570-6925-44f1-97b8-9cac695ccdd9
    - text: '''Daily Steps'' and ''Physical Activity Level'' should both be non-null
        across records to allow accurate covariance calculation, linear prediction,
        and activity component score alignment without producing NaN values.'
