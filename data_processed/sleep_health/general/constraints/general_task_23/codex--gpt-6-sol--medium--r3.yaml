prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import json\nimport os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef classify_bp(sys,\
  \ dia):\n    if pd.isna(sys) or pd.isna(dia):\n        return np.nan\n    if sys\
  \ >= 180 or dia >= 120:\n        return \"crisis\"\n    if sys >= 140 or dia >=\
  \ 90:\n        return \"stage2\"\n    if (130 <= sys <= 139) or (80 <= dia <= 89):\n\
  \        return \"stage1\"\n    if (120 <= sys <= 129) and (dia < 80):\n       \
  \ return \"elevated\"\n    if (sys < 120) and (dia < 80):\n        return \"normal\"\
  \n    return \"normal\"\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
  \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
  \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_csv = os.path.join(args.input,\
  \ 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\n    # Ensure expected numeric\
  \ types; coerce invalid to NaN for safe assertions\n    numeric_cols = ['Sleep Duration',\
  \ 'Quality of Sleep', 'Physical Activity Level', 'Stress Level', 'Heart Rate',\n\
  \                    'Daily Steps']\n    for c in numeric_cols:\n        if c in\
  \ df.columns:\n            df[c] = pd.to_numeric(df[c], errors='coerce')\n\n   \
  \ # Blood Pressure parsing\n    bp_series = df['Blood Pressure'].astype(str)\n \
  \   bp_match = bp_series.str.extract(r'^\\s*(\\d{2,3})\\s*/\\s*(\\d{2,3})\\s*$')\n\
  \    df['bp_sys'] = pd.to_numeric(bp_match[0], errors='coerce')\n    df['bp_dia']\
  \ = pd.to_numeric(bp_match[1], errors='coerce')\n    # BP derived features\n   \
  \ df['bp_stage'] = [classify_bp(s, d) for s, d in zip(df['bp_sys'], df['bp_dia'])]\n\
  \    df['map'] = df['bp_dia'] + (df['bp_sys'] - df['bp_dia']) / 3.0  # Mean Arterial\
  \ Pressure\n\n    # Heart Rate quality checks and derived factors\n    hr_midband_prop\
  \ = ((df['Heart Rate'] >= 50) & (df['Heart Rate'] <= 100)).mean()\n    hr_outlier_weight\
  \ = 1.0 / hr_midband_prop if hr_midband_prop > 0 else 1.0\n\n    # Sleep Disorder\
  \ label distribution checks\n    sd_non_null = df['Sleep Disorder'].dropna()\n \
  \   total_rows = len(df)\n    nn = len(sd_non_null)\n    p_non_null = nn / total_rows\
  \ if total_rows > 0 else 0.0\n    sd_counts = sd_non_null.value_counts(dropna=False)\n\
  \    p_insomnia = (sd_counts.get('Insomnia', 0)) / nn if nn > 0 else np.nan\n  \
  \  p_apnea = (sd_counts.get('Sleep Apnea', 0)) / nn if nn > 0 else np.nan\n    #\
  \ Use distribution to set condition weights (mean weight ~ 1)\n    disorder_weights\
  \ = {\n        'Insomnia': 0.5 / p_insomnia if p_insomnia > 0 else 1.0,\n      \
  \  'Sleep Apnea': 0.5 / p_apnea if p_apnea > 0 else 1.0,\n    }\n\n    # Sleep Duration\
  \ vs Quality relationships\n    sleep_qs = df[['Sleep Duration', 'Quality of Sleep']].dropna()\n\
  \    dur_quality_corr = sleep_qs['Sleep Duration'].corr(sleep_qs['Quality of Sleep'],\
  \ method='pearson')\n    short_mask = df['Sleep Duration'] < 6.0\n    long_mask\
  \ = df['Sleep Duration'] >= 8.0\n    short_mean_q = df.loc[short_mask, 'Quality\
  \ of Sleep'].mean()\n    long_mean_q = df.loc[long_mask, 'Quality of Sleep'].mean()\n\
  \    # Build a simple linear predictor of Quality from Duration (used in scoring)\n\
  \    x = sleep_qs['Sleep Duration']\n    y = sleep_qs['Quality of Sleep']\n    var_x\
  \ = float(x.var()) if len(x) > 1 else 0.0\n    slope = (float(x.cov(y)) / var_x)\
  \ if var_x > 1e-12 else 0.0\n    intercept = float(y.mean() - slope * x.mean())\
  \ if len(x) > 0 else 0.0\n    pred_quality = intercept + slope * df['Sleep Duration']\n\
  \n    # Daily Steps vs Physical Activity Level relationships\n    pearson_steps_pa\
  \ = df['Daily Steps'].corr(df['Physical Activity Level'], method='pearson')\n  \
  \  spearman_steps_pa = df['Daily Steps'].corr(df['Physical Activity Level'], method='spearman')\n\
  \    pa_low = df['Physical Activity Level'].quantile(1.0 / 3.0)\n    pa_high = df['Physical\
  \ Activity Level'].quantile(2.0 / 3.0)\n    top_pa = df[df['Physical Activity Level']\
  \ >= pa_high]\n    bottom_pa = df[df['Physical Activity Level'] <= pa_low]\n   \
  \ top_steps_mean = top_pa['Daily Steps'].mean()\n    bottom_steps_mean = bottom_pa['Daily\
  \ Steps'].mean()\n    pa60 = df[df['Physical Activity Level'] >= 60]\n    pa60_prop_steps7000\
  \ = (pa60['Daily Steps'] >= 7000).mean() if len(pa60) > 0 else np.nan\n    # Linear\
  \ expectation of steps given PA\n    pa = df['Physical Activity Level']\n    steps\
  \ = df['Daily Steps']\n    var_pa = float(pa.var()) if len(pa) > 1 else 0.0\n  \
  \  beta = (float(pa.cov(steps)) / var_pa) if var_pa > 1e-12 else 0.0\n    alpha\
  \ = float(steps.mean() - beta * pa.mean()) if len(pa) > 0 else 0.0\n    expected_steps\
  \ = alpha + beta * pa\n    expected_steps = expected_steps.clip(lower=1.0)\n\n \
  \   # Subscores and penalties\n    qual_norm = (df['Quality of Sleep'] / 10.0).clip(0.0,\
  \ 1.0)\n    dur_norm = ((df['Sleep Duration'] - 5.0) / (8.0 - 5.0)).clip(0.0, 1.0)\n\
  \    w_dur = float(np.clip(dur_quality_corr, 0.0, 1.0))\n    w_qual = 1.0 - w_dur\n\
  \    sleep_component = 100.0 * (w_qual * qual_norm + w_dur * dur_norm)\n\n    #\
  \ Bonuses calibrated by cohort behavior\n    resilience_bonus = np.where(short_mask\
  \ & (df['Quality of Sleep'] >= (short_mean_q + 0.5)), 3.0, 0.0)\n    long_bonus\
  \ = np.where(long_mask & (df['Quality of Sleep'] >= long_mean_q), 2.0, 0.0)\n  \
  \  sleep_component = (sleep_component + resilience_bonus + long_bonus).clip(0.0,\
  \ 100.0)\n\n    steps_norm = (df['Daily Steps'] / 10000.0).clip(0.0, 1.0)\n    alignment\
  \ = (df['Daily Steps'] / expected_steps).clip(0.0, 2.0)\n    alignment_norm = alignment.clip(0.0,\
  \ 1.0)\n    activity_component = 100.0 * (0.5 * steps_norm + 0.5 * alignment_norm)\n\
  \n    # Penalties\n    hr = df['Heart Rate']\n    hr_penalty = (\n             \
  \            np.where(hr < 50, (50 - hr) / 50.0, 0.0) +\n                      \
  \   np.where(hr > 100, (hr - 100) / 100.0, 0.0)\n                 ) * (0.15 * hr_outlier_weight)\n\
  \n    bp_penalty_map = {\n        'normal': 0.0,\n        'elevated': 0.05,\n  \
  \      'stage1': 0.10,\n        'stage2': 0.20,\n        'crisis': 0.40,\n     \
  \   np.nan: 0.15,\n    }\n    bp_penalty = df['bp_stage'].map(bp_penalty_map).fillna(0.15)\n\
  \n    sd_base_penalty = df['Sleep Disorder'].map({'Insomnia': 0.12, 'Sleep Apnea':\
  \ 0.18}).fillna(0.0)\n    sd_weight_series = df['Sleep Disorder'].map(disorder_weights).fillna(1.0)\n\
  \    sd_penalty = sd_base_penalty * sd_weight_series\n\n    penalty_points = 100.0\
  \ * (hr_penalty + bp_penalty + sd_penalty)\n\n    overall_score = (0.6 * sleep_component\
  \ + 0.4 * activity_component) - penalty_points\n    overall_score = overall_score.clip(0.0,\
  \ 100.0)\n\n    # Triage logic\n    crisis_condition = (df['bp_stage'] == 'crisis')\
  \ | (df['bp_sys'] >= 180) | (df['bp_dia'] >= 120) | (hr > 120)\n    high_condition\
  \ = (\n            crisis_condition |\n            ((df['bp_stage'] == 'stage2')\
  \ & ((sleep_component < 65) | (activity_component < 60))) |\n            (df['Sleep\
  \ Disorder'].isin(['Insomnia', 'Sleep Apnea']) & (sleep_component < 60))\n    )\n\
  \    medium_condition = (\n            (~high_condition) & (\n            (overall_score\
  \ < 75) |\n            ((df['Daily Steps'] < 5000) & (df['Physical Activity Level']\
  \ < 30)) |\n            ((df['bp_stage'] == 'stage1') & (sleep_component < 70))\n\
  \    )\n    )\n    triage_level = np.where(high_condition, 'High', np.where(medium_condition,\
  \ 'Medium', 'None'))\n\n    # Output artifacts\n    out_df = pd.DataFrame({\n  \
  \      'Person ID': df['Person ID'],\n        'Sleep Duration': df['Sleep Duration'],\n\
  \        'Quality of Sleep': df['Quality of Sleep'],\n        'Daily Steps': df['Daily\
  \ Steps'],\n        'Physical Activity Level': df['Physical Activity Level'],\n\
  \        'Heart Rate': df['Heart Rate'],\n        'Blood Pressure': df['Blood Pressure'],\n\
  \        'bp_sys': df['bp_sys'],\n        'bp_dia': df['bp_dia'],\n        'bp_stage':\
  \ df['bp_stage'],\n        'sleep_component': np.round(sleep_component, 2),\n  \
  \      'activity_component': np.round(activity_component, 2),\n        'sleep_wellness_score':\
  \ np.round(overall_score, 2),\n        'triage_level': triage_level,\n        'Sleep\
  \ Disorder': df['Sleep Disorder']\n    })\n\n    os.makedirs(args.output, exist_ok=True)\n\
  \    scores_path = os.path.join(args.output, 'member_sleep_scores.csv')\n    out_df.to_csv(scores_path,\
  \ index=False)\n\n    diagnostics = {\n        'sleep_duration_quality': {\n   \
  \         'pearson_corr': float(dur_quality_corr),\n            'short_sleep_mean_quality':\
  \ float(short_mean_q) if not np.isnan(short_mean_q) else None,\n            'long_sleep_mean_quality':\
  \ float(long_mean_q) if not np.isnan(long_mean_q) else None\n        },\n      \
  \  'steps_vs_pa': {\n            'pearson_corr': float(pearson_steps_pa) if not\
  \ np.isnan(pearson_steps_pa) else None,\n            'spearman_corr': float(spearman_steps_pa)\
  \ if not np.isnan(spearman_steps_pa) else None,\n            'top_pa_mean_steps':\
  \ float(top_steps_mean) if not np.isnan(top_steps_mean) else None,\n           \
  \ 'bottom_pa_mean_steps': float(bottom_steps_mean) if not np.isnan(bottom_steps_mean)\
  \ else None,\n            'pa60_prop_steps7000': float(pa60_prop_steps7000) if not\
  \ np.isnan(pa60_prop_steps7000) else None\n        },\n        'sleep_disorder_distribution':\
  \ {\n            'prop_non_null': float(p_non_null),\n            'p_insomnia_within_non_null':\
  \ float(p_insomnia),\n            'p_apnea_within_non_null': float(p_apnea)\n  \
  \      },\n        'heart_rate': {\n            'midband_prop_50_100': float(hr_midband_prop)\n\
  \        }\n    }\n    with open(os.path.join(args.output, 'dataset_diagnostics.json'),\
  \ 'w') as f:\n        json.dump(diagnostics, f, indent=2)\n\n\nif __name__ == '__main__':\n\
  \    main()\n\n```\n\nThe same program is on disk at `./code/general_task_23.py`,\
  \ so you can run it against the\nstaged table, step through it, or search it, rather\
  \ than working from the\nlisting alone.\n\n# The data\n\nThree rows sampled from\
  \ the dataset the program consumes:\n\n[{'id': 73, 'Person ID': 332, 'Gender': 'Female',\
  \ 'Age': 53, 'Occupation': 'Engineer', 'Sleep Duration': 8.4, 'Quality of Sleep':\
  \ 9, 'Physical Activity Level': 30, 'Stress Level': 3, 'BMI Category': 'Normal',\
  \ 'Blood Pressure': '125/80', 'Heart Rate': 65, 'Daily Steps': 5000, 'Sleep Disorder':\
  \ nan}, {'id': 223, 'Person ID': 206, 'Gender': 'Male', 'Age': 43, 'Occupation':\
  \ 'Engineer', 'Sleep Duration': 7.7, 'Quality of Sleep': 8, 'Physical Activity Level':\
  \ 90, 'Stress Level': 5, 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart\
  \ Rate': 70, 'Daily Steps': 8000, 'Sleep Disorder': nan}, {'id': 85, 'Person ID':\
  \ 215, 'Gender': 'Male', 'Age': 43, 'Occupation': 'Engineer', 'Sleep Duration':\
  \ 7.8, 'Quality of Sleep': 8, 'Physical Activity Level': 90, 'Stress Level': 5,\
  \ 'BMI Category': 'Normal', 'Blood Pressure': '130/85', 'Heart Rate': 70, 'Daily\
  \ Steps': 8000, 'Sleep Disorder': nan}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
