        \ 0.20,\n        'crisis': 0.40,\n        np.nan: 0.15,\n    }\n    bp_penalty\
        \ = df['bp_stage'].map(bp_penalty_map).fillna(0.15)\n\n    sd_base_penalty\
        \ = df['Sleep Disorder'].map({'Insomnia': 0.12, 'Sleep Apnea': 0.18}).fillna(0.0)\n\
        \    sd_weight_series = df['Sleep Disorder'].map(disorder_weights).fillna(1.0)\n\
        \    sd_penalty = sd_base_penalty * sd_weight_series\n\n    penalty_points\
        \ = 100.0 * (hr_penalty + bp_penalty + sd_penalty)\n\n    overall_score =\
        \ (0.6 * sleep_component + 0.4 * activity_component) - penalty_points\n  \
        \  overall_score = overall_score.clip(0.0, 100.0)\n\n    # Triage logic\n\
        \    crisis_condition = (df['bp_stage'] == 'crisis') | (df['bp_sys'] >= 180)\
        \ | (df['bp_dia'] >= 120) | (hr > 120)\n    high_condition = (\n         \
        \   crisis_condition |\n            ((df['bp_stage'] == 'stage2') & ((sleep_component\
        \ < 65) | (activity_component < 60))) |\n            (df['Sleep Disorder'].isin(['Insomnia',\
        \ 'Sleep Apnea']) & (sleep_component < 60))\n    )\n    medium_condition =\
        \ (\n            (~high_condition) & (\n            (overall_score < 75) |\n\
        \            ((df['Daily Steps'] < 5000) & (df['Physical Activity Level']\
        \ < 30)) |\n            ((df['bp_stage'] == 'stage1') & (sleep_component <\
        \ 70))\n    )\n    )\n    triage_level = np.where(high_condition, 'High',\
