        \        'bp_sys': df['bp_sys'],\n        'bp_dia': df['bp_dia'],\n      \
        \  'bp_stage': df['bp_stage'],\n        'sleep_component': np.round(sleep_component,\
        \ 2),\n        'activity_component': np.round(activity_component, 2),\n  \
        \      'sleep_wellness_score': np.round(overall_score, 2),\n        'triage_level':\
        \ triage_level,\n        'Sleep Disorder': df['Sleep Disorder']\n    })\n\n\
        \    os.makedirs(args.output, exist_ok=True)\n    scores_path = os.path.join(args.output,\
        \ 'member_sleep_scores.csv')\n    out_df.to_csv(scores_path, index=False)\n\
        \n    diagnostics = {\n        'sleep_duration_quality': {\n            'pearson_corr':\
        \ float(dur_quality_corr),\n            'short_sleep_mean_quality': float(short_mean_q)\
        \ if not np.isnan(short_mean_q) else None,\n            'long_sleep_mean_quality':\
        \ float(long_mean_q) if not np.isnan(long_mean_q) else None\n        },\n\
        \        'steps_vs_pa': {\n            'pearson_corr': float(pearson_steps_pa)\
        \ if not np.isnan(pearson_steps_pa) else None,\n            'spearman_corr':\
