        \n    # Penalties\n    hr = df['Heart Rate']\n    hr_penalty = (\n       \
        \                  np.where(hr < 50, (50 - hr) / 50.0, 0.0) +\n          \
        \               np.where(hr > 100, (hr - 100) / 100.0, 0.0)\n            \
        \     ) * (0.15 * hr_outlier_weight)\n\n    bp_penalty_map = {\n        'normal':\
