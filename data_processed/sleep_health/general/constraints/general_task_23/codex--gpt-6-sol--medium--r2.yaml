        \ json.JSONDecodeError as exc:\n            print(f\"warning: {path.name}\
        \ is not valid JSON ({exc}); \"\n                  f\"falling back to one-constraint-per-line\
        \ parsing.\")\n            payload = None\n        if payload is not None:\n\
        \            if isinstance(payload, dict):\n                payload = payload.get(\"\
        constraints\", [])\n            codes = []\n            for item in payload:\n\
        \                if isinstance(item, str):\n                    codes.append(item)\n\
        \                else:\n                    codes.append(item.get(\"code_for_constraint\"\
        ) or item.get(\"suggestion\"))\n            return [code for code in codes\
        \ if code]\n    codes = []\n    for line in text.splitlines():\n        line\
        \ = line.strip()\n        if not line or line.startswith(\"#\"):\n       \
        \     continue\n        codes.append(line)\n    return codes\n\n\ndef main()\
        \ -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n   \
        \ parser.add_argument(\"--table\", required=True, help=\"Table name (file\
        \ stem under data/tables).\")\n    parser.add_argument(\"--constraints\",\
        \ required=True,\n                        help='JSON: [\"<code>\", ...] or\
        \ {\"constraints\": [{\"code_for_constraint\": ...}]}')\n    args = parser.parse_args()\n\
        \n    csv_path = TABLES_DIR / f\"{args.table}.csv\"\n    if not csv_path.exists():\n\
        \        available = sorted(p.stem for p in TABLES_DIR.glob(\"*.csv\"))\n\
        \        print(f\"no such table: {args.table}. available: {available}\")\n\
        \        return 2\n\n    codes = load_codes(Path(args.constraints))\n    if\
        \ not codes:\n        print(\"no constraint code found in the given file\"\
        )\n        return 2\n\n    dataframe = pd.read_csv(csv_path)\n    manager\
        \ = DeequDataQualityManager()\n    spark_df, spark = manager.spark_df_from_pandas_df(dataframe,\
        \ spark_session=build_spark())\n    results = manager.validate_constraints_with_reasons(spark,\
        \ spark_df, codes, isolated_check=True)\n\n    held = 0\n    for code, (is_valid,\
        \ reason) in zip(codes, results):\n        held += int(bool(is_valid))\n \
        \       print(f\"[{'HOLDS' if is_valid else 'FAILS'}] {code}\")\n        if\
        \ not is_valid:\n            print(f\"          reason: {reason}\")\n    print(f\"\
        \\n{held}/{len(codes)} constraint(s) hold on table '{args.table}' \"\n   \
        \       f\"({len(dataframe)} rows).\")\n\n    try:\n        spark.sparkContext._gateway.shutdown_callback_server()\n\
        \    except Exception:\n        pass\n    try:\n        spark.stop()\n   \
        \ except Exception:\n        pass\n    return 0\n\n\nif __name__ == \"__main__\"\
        :\n    code = main()\n    sys.stdout.flush()\n    os._exit(code)\n"
