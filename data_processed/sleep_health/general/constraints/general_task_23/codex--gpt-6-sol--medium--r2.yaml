        \    parser.add_argument('--input', type=str, required=True)\n    parser.add_argument('--output',\
        \ type=str, required=True)\n    args = parser.parse_args()\n\n    input_csv\
        \ = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\
        \n    # Ensure expected numeric types; coerce invalid to NaN for safe assertions\n\
        \    numeric_cols = ['Sleep Duration', 'Quality of Sleep', 'Physical Activity\
        \ Level', 'Stress Level', 'Heart Rate',\n                    'Daily Steps']\n\
        \    for c in numeric_cols:\n        if c in df.columns:\n            df[c]\
        \ = pd.to_numeric(df[c], errors='coerce')\n\n    # Blood Pressure parsing\n\
        \    bp_series = df['Blood Pressure'].astype(str)\n    bp_match = bp_series.str.extract(r'^\\\
        s*(\\d{2,3})\\s*/\\s*(\\d{2,3})\\s*$')\n    df['bp_sys'] = pd.to_numeric(bp_match[0],\
        \ errors='coerce')\n    df['bp_dia'] = pd.to_numeric(bp_match[1], errors='coerce')\n\
        \    # BP derived features\n    df['bp_stage'] = [classify_bp(s, d) for s,\
        \ d in zip(df['bp_sys'], df['bp_dia'])]\n    df['map'] = df['bp_dia'] + (df['bp_sys']\
        \ - df['bp_dia']) / 3.0  # Mean Arterial Pressure\n\n    # Heart Rate quality\
        \ checks and derived factors\n    hr_midband_prop = ((df['Heart Rate'] >=\
        \ 50) & (df['Heart Rate'] <= 100)).mean()\n    hr_outlier_weight = 1.0 / hr_midband_prop\
        \ if hr_midband_prop > 0 else 1.0\n\n    # Sleep Disorder label distribution\
        \ checks\n    sd_non_null = df['Sleep Disorder'].dropna()\n    total_rows\
        \ = len(df)\n    nn = len(sd_non_null)\n    p_non_null = nn / total_rows if\
        \ total_rows > 0 else 0.0\n    sd_counts = sd_non_null.value_counts(dropna=False)\n\
        \    p_insomnia = (sd_counts.get('Insomnia', 0)) / nn if nn > 0 else np.nan\n\
        \    p_apnea = (sd_counts.get('Sleep Apnea', 0)) / nn if nn > 0 else np.nan\n\
        \    # Use distribution to set condition weights (mean weight ~ 1)\n    disorder_weights\
        \ = {\n        'Insomnia': 0.5 / p_insomnia if p_insomnia > 0 else 1.0,\n\
        \        'Sleep Apnea': 0.5 / p_apnea if p_apnea > 0 else 1.0,\n    }\n\n\
        \    # Sleep Duration vs Quality relationships\n    sleep_qs = df[['Sleep\
        \ Duration', 'Quality of Sleep']].dropna()\n    dur_quality_corr = sleep_qs['Sleep\
        \ Duration'].corr(sleep_qs['Quality of Sleep'], method='pearson')\n    short_mask\
        \ = df['Sleep Duration'] < 6.0\n    long_mask = df['Sleep Duration'] >= 8.0\n\
        \    short_mean_q = df.loc[short_mask, 'Quality of Sleep'].mean()\n    long_mean_q\
        \ = df.loc[long_mask, 'Quality of Sleep'].mean()\n    # Build a simple linear\
