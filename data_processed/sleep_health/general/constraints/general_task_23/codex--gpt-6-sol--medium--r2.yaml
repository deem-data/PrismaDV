        \ = (df['Quality of Sleep'] / 10.0).clip(0.0, 1.0)\n    dur_norm = ((df['Sleep\
        \ Duration'] - 5.0) / (8.0 - 5.0)).clip(0.0, 1.0)\n    w_dur = float(np.clip(dur_quality_corr,\
