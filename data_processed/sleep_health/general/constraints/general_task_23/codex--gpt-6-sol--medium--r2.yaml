        \ Duration']\n    y = sleep_qs['Quality of Sleep']\n    var_x = float(x.var())\
        \ if len(x) > 1 else 0.0\n    slope = (float(x.cov(y)) / var_x) if var_x >\
        \ 1e-12 else 0.0\n    intercept = float(y.mean() - slope * x.mean()) if len(x)\
        \ > 0 else 0.0\n    pred_quality = intercept + slope * df['Sleep Duration']\n\
        \n    # Daily Steps vs Physical Activity Level relationships\n    pearson_steps_pa\
        \ = df['Daily Steps'].corr(df['Physical Activity Level'], method='pearson')\n\
        \    spearman_steps_pa = df['Daily Steps'].corr(df['Physical Activity Level'],\
        \ method='spearman')\n    pa_low = df['Physical Activity Level'].quantile(1.0\
        \ / 3.0)\n    pa_high = df['Physical Activity Level'].quantile(2.0 / 3.0)\n\
        \    top_pa = df[df['Physical Activity Level'] >= pa_high]\n    bottom_pa\
        \ = df[df['Physical Activity Level'] <= pa_low]\n    top_steps_mean = top_pa['Daily\
        \ Steps'].mean()\n    bottom_steps_mean = bottom_pa['Daily Steps'].mean()\n\
        \    pa60 = df[df['Physical Activity Level'] >= 60]\n    pa60_prop_steps7000\
        \ = (pa60['Daily Steps'] >= 7000).mean() if len(pa60) > 0 else np.nan\n  \
        \  # Linear expectation of steps given PA\n    pa = df['Physical Activity\
        \ Level']\n    steps = df['Daily Steps']\n    var_pa = float(pa.var()) if\
        \ len(pa) > 1 else 0.0\n    beta = (float(pa.cov(steps)) / var_pa) if var_pa\
        \ > 1e-12 else 0.0\n    alpha = float(steps.mean() - beta * pa.mean()) if\
        \ len(pa) > 0 else 0.0\n    expected_steps = alpha + beta * pa\n    expected_steps\
        \ = expected_steps.clip(lower=1.0)\n\n    # Subscores and penalties\n    qual_norm\
        \ = (df['Quality of Sleep'] / 10.0).clip(0.0, 1.0)\n    dur_norm = ((df['Sleep\
        \ Duration'] - 5.0) / (8.0 - 5.0)).clip(0.0, 1.0)\n    w_dur = float(np.clip(dur_quality_corr,\
        \ 0.0, 1.0))\n    w_qual = 1.0 - w_dur\n    sleep_component = 100.0 * (w_qual\
        \ * qual_norm + w_dur * dur_norm)\n\n    # Bonuses calibrated by cohort behavior\n\
        \    resilience_bonus = np.where(short_mask & (df['Quality of Sleep'] >= (short_mean_q\
        \ + 0.5)), 3.0, 0.0)\n    long_bonus = np.where(long_mask & (df['Quality of\
        \ Sleep'] >= long_mean_q), 2.0, 0.0)\n    sleep_component = (sleep_component\
        \ + resilience_bonus + long_bonus).clip(0.0, 100.0)\n\n    steps_norm = (df['Daily\
        \ Steps'] / 10000.0).clip(0.0, 1.0)\n    alignment = (df['Daily Steps'] /\
        \ expected_steps).clip(0.0, 2.0)\n    alignment_norm = alignment.clip(0.0,\
