constraints:
  Blood Pressure:
    code:
    - - .isComplete('Blood Pressure')
      - Valid
    - - '.satisfies("`Blood Pressure` RLIKE ''^[[:space:]]*[0-9]{2,3}[[:space:]]*/[[:space:]]*[0-9]{2,3}[[:space:]]*$''",
        ''parseable_blood_pressure'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .isPositive('Heart Rate')
      - Invalid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .isNonNegative('Physical Activity Level')
      - Invalid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.hasStandardDeviation(''Quality of Sleep'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    - - '.satisfies(''`Quality of Sleep` BETWEEN 0 AND 10'', ''valid_quality_of_sleep'',
        lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'',
        ''Sleep Apnea'')", ''recognized_sleep_disorder'', lambda x: x == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasStandardDeviation(''Sleep Duration'', lambda x: x > 0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    - - .isPositive('Sleep Duration')
      - Invalid
    assumptions: []
    column_name: Sleep Duration
