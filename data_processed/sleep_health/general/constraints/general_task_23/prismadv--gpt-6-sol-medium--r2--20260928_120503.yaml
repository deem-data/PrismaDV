        file: ''
      - start_line: 143
        end_line: 144
        file: ''
      uid: cee27b3a-364a-4241-a0e4-b9c372d52ef2
    - text: '''Physical Activity Level'' should be nonnegative. Negative activity
        levels are not meaningful for the comparisons used by the script and could
        incorrectly satisfy the low-activity triage condition.'
