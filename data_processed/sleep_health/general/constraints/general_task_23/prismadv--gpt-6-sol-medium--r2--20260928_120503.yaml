    assumptions:
    - text: The input must contain a 'Blood Pressure' column, because the script accesses
        it directly and includes it in the output.
      sources:
      - start_line: 42
        end_line: 42
        file: ''
      - start_line: 170
        end_line: 170
        file: ''
      uid: 5d7b092c-7674-4834-8868-09358aa717ec
    - text: The 'Blood Pressure' column should remain fully non-null, consistent with
        its observed completeness of 1.0. Although the code handles missing readings
        with a default score penalty, they cannot receive a blood-pressure-based stage
        or triage assessment.
      sources:
      - start_line: 42
        end_line: 47
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      - start_line: 147
        end_line: 157
        file: ''
      uid: a30892a6-3917-494e-8179-22c278135558
    - text: 'Each ''Blood Pressure'' value should be a string matching ^\s*\d{2,3}\s*/\s*\d{2,3}\s*$:
        a two- or three-digit systolic reading, a slash, and a two- or three-digit
        diastolic reading, with optional whitespace. Values in other formats are coerced
        to missing components and cannot be classified correctly.'
      sources:
      - start_line: 42
        end_line: 47
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      uid: 75486fe5-420e-41ad-91e9-75bd2e8304db
    - text: For each parsed 'Blood Pressure' value, the systolic number should be
        greater than the diastolic number. Otherwise, the derived mean arterial pressure
        and blood-pressure classification would be based on an implausible reading.
      sources:
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 9
        end_line: 22
        file: ''
      uid: 626f8cc2-16da-4b7b-9c9b-6e4b54a6a3a7
