        end_line: 93
        file: ''
      - start_line: 153
        end_line: 160
        file: ''
      uid: 4e467549-ce8e-49be-8fde-55e23a988cba
    - text: '''Physical Activity Level'' should have at least two distinct values,
        so its variance is positive. Otherwise, its correlations with ''Daily Steps''
        are undefined, its lower and upper quantiles coincide, and the steps-on-activity
        regression falls back to a zero slope.'
      sources:
