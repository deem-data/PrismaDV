    - text: Null values are allowed in 'Sleep Disorder'. The code excludes them from
        label-frequency calculations and assigns them no disorder penalty or disorder-based
        high-triage condition. The observed non-null proportion is about 41.5%; a
        substantial change in that proportion should be flagged because it changes
        how many members receive disorder-based scoring and triage.
      sources:
      - start_line: 55
        end_line: 59
        file: ''
      - start_line: 137
        end_line: 138
        file: ''
      - start_line: 151
        end_line: 151
        file: ''
      - start_line: 198
        end_line: 201
        file: ''
      uid: e90f5a95-7dd0-4414-9825-2af8adf70da1
    - text: Every non-null 'Sleep Disorder' value should be exactly 'Insomnia' or
        'Sleep Apnea'. Other values, including alternate spellings, receive a zero
        disorder penalty and do not trigger disorder-based high triage, even though
        they are included in the non-null denominator used to calculate condition
        weights.
      sources:
      - start_line: 55
        end_line: 65
        file: ''
      - start_line: 137
        end_line: 139
        file: ''
      - start_line: 148
        end_line: 152
        file: ''
      uid: 3ea27dc4-8aaf-410c-b474-ef9ce2f0b9be
    - text: Both 'Insomnia' and 'Sleep Apnea' should occur at least once among non-null
        values. Otherwise the absent category's proportion cannot be estimated and
        the code substitutes a default weight. In the observed data, the two categories
        are approximately balanced (47 and 46 records, respectively); substantial
        changes in their relative frequencies should be flagged because those frequencies
        determine scoring weights.
      sources:
      - start_line: 59
        end_line: 66
        file: ''
      - start_line: 137
        end_line: 139
        file: ''
      - start_line: 198
        end_line: 201
        file: ''
