    - text: '''Physical Activity Level'' should be complete and contain numeric values
        that remain valid after pd.to_numeric(..., errors=''coerce''). Invalid or
        missing values would propagate into expected steps and the activity and overall
        scores. The dataset description reports complete, integral values.'
