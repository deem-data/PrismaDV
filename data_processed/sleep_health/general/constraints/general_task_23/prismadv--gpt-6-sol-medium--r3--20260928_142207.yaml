        end_line: 156
        file: ''
      uid: d1e188e6-b707-4d5e-889f-b84e7a1a8779
    - text: The column should have at least two distinct values, so its variance is
        positive and the correlations and linear estimate of expected steps are informative
        rather than degenerate.
