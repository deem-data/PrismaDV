      reason_if_invalid: ''
      level: warning
      uid: 27a317af-ad9d-49cb-a12c-dacc7a9437d0
      source_assumptions:
      - ae60b0e9-d2ff-41b2-aa97-57a2229ddf58
    - suggestion: .satisfies("CASE WHEN `Blood Pressure` RLIKE '^\\s*[0-9]{2,3}\\s*/\\s*[0-9]{2,3}\\s*$'
        THEN CAST(regexp_extract(`Blood Pressure`, '^\\s*([0-9]{2,3})\\s*/\\s*([0-9]{2,3})\\s*$',
        2) AS INT) > 0 AND CAST(regexp_extract(`Blood Pressure`, '^\\s*([0-9]{2,3})\\s*/\\s*([0-9]{2,3})\\s*$',
        1) AS INT) > CAST(regexp_extract(`Blood Pressure`, '^\\s*([0-9]{2,3})\\s*/\\s*([0-9]{2,3})\\s*$',
        2) AS INT) ELSE TRUE END", 'positive_diastolic_and_systolic_exceeds_diastolic')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 4b8e2e3a-6eb0-4e35-8d91-8ec4ab711d7c
      source_assumptions:
      - 666109b5-00e5-416d-862f-f2caa08a163d
    assumptions:
    - text: The input data should contain a 'Blood Pressure' column. The code accesses
        it directly and will fail if it is absent.
      sources:
      - start_line: 42
        end_line: 42
        file: ''
      uid: fbd83824-d03f-4254-a654-3a3a59462f59
    - text: The 'Blood Pressure' column should remain complete. The dataset reports
        no null values; although the code assigns a fallback penalty to unparseable
        values, nulls would prevent blood-pressure classification and could conceal
        a crisis in the triage logic.
      sources:
      - start_line: 42
        end_line: 47
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      - start_line: 147
        end_line: 152
        file: ''
      uid: c5ce32cb-f6a7-4086-acce-54363ddaf74b
    - text: Every 'Blood Pressure' value should be a string containing a two- or three-digit
        systolic number, a slash, and a two- or three-digit diastolic number, with
        optional whitespace (for example, '120/80'). Values that do not match ^\s*\d{2,3}\s*/\s*\d{2,3}\s*$
        become missing parsed measurements, affecting the score and triage.
      sources:
      - start_line: 42
        end_line: 48
        file: ''
      - start_line: 127
        end_line: 135
        file: ''
      - start_line: 147
        end_line: 157
        file: ''
      uid: ae60b0e9-d2ff-41b2-aa97-57a2229ddf58
    - text: For each parsed 'Blood Pressure' value, both measurements should be positive
        and the systolic measurement should exceed the diastolic measurement. This
        preserves the intended meaning of the systolic/diastolic fields used in staging,
        mean arterial pressure, and triage.
      sources:
      - start_line: 9
        end_line: 22
        file: ''
      - start_line: 43
        end_line: 48
        file: ''
      - start_line: 147
        end_line: 157
        file: ''
      uid: 666109b5-00e5-416d-862f-f2caa08a163d
