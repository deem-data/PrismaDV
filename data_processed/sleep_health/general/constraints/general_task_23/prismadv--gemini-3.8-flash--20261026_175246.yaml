    assumptions:
    - text: 'The ''Blood Pressure'' column values are expected to follow the format
        of systolic and diastolic readings separated by a forward slash, matching
        the regular expression ''^\s*\d{2,3}\s*/\s*\d{2,3}\s*$''. We could represent
        this assumption as a deequ constraint like this: .hasPattern("Blood Pressure",
        r"^\s*\d{2,3}\s*/\s*\d{2,3}\s*$")'
      sources:
      - start_line: 42
        end_line: 45
        file: ''
      uid: e702e8be-e509-4fe4-b65e-98d56bad3c95
    - text: 'The ''Blood Pressure'' column could contain missing or unparseable values
        because the code explicitly handles NaN systolic/diastolic components in ''classify_bp''
        and maps NaN bp_stages to a default penalty of 0.15 in ''bp_penalty_map''.
        However, to meaningfully compute derived features like ''bp_sys'', ''bp_dia'',
        and ''map'', the column is expected to be largely complete. We could represent
        this assumption as a deequ constraint like this: .hasCompleteness("Blood Pressure",
        lambda x: x >= 0.95)'
