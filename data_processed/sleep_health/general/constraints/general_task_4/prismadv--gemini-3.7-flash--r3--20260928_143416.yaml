        We could represent this assumption as a deequ constraint like this:

        .isComplete("Blood Pressure")'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: d1759fe4-0149-4618-a2f5-f48aac6af96b
    - text: 'The ''Blood Pressure'' column values must follow the format of two integer
        values separated by a forward slash ''/'' (e.g., ''120/80''), matching the
        regex pattern ''^\d+/\d+$''. If a value does not contain ''/'' or contains
        non-integer components, splitting and converting the components to integers
        with `.astype(int)` will raise an exception.

        We could represent this assumption as a deequ constraint like this:

        .hasPattern("Blood Pressure", "^\\d+/\\d+$")'
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: 005865e1-e2af-4e5f-8a35-bf2369f519cd
