      source_assumptions:
      - 6bf4e402-49b2-4c9d-ad18-c2300bd87bde
    assumptions:
    - text: 'The ''BMI Category'' column should not contain null values because it
        is mapped using a dictionary without a fillna fallback, unlike other columns,
        and missing values would propagate NaNs into downstream score calculations.
        We could represent this assumption as a deequ constraint like this: .isComplete(''BMI
        Category'')'
      sources:
      - start_line: 45
        end_line: 51
        file: ''
      uid: a2e75947-54ff-464e-96f8-d8af727bc884
    - text: 'The ''BMI Category'' column should only contain values from the predefined
        set: ''Normal'', ''Normal Weight'', ''Overweight'', and ''Obese'', as values
        outside this mapping will result in NaN values during penalty calculation.
        We could represent this assumption as a deequ constraint like this: .isContainedIn(''BMI
        Category'', [''Normal'', ''Normal Weight'', ''Overweight'', ''Obese''])'
      sources:
      - start_line: 45
        end_line: 51
        file: ''
      uid: 6bf4e402-49b2-4c9d-ad18-c2300bd87bde
  Blood Pressure:
