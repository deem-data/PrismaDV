    - text: 'The columns ''Physical Activity Level'' and ''Daily Steps'' should have
        a positive correlation, as physical activity duration/level directly relates
        to the number of steps taken. The code computes the Pearson correlation between
        them and fits a linear regression of ''Daily Steps'' on ''Physical Activity
        Level'' for scoring and calibration. We could represent this assumption as
        a Deequ constraint like this: .hasCorrelation(''Physical Activity Level'',
        ''Daily Steps'', lambda c: c > 0.0)'
