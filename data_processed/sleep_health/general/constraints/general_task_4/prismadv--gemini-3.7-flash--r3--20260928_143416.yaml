  '["BMI Category","Sleep Disorder"]':
    code: []
    assumptions:
    - text: The columns 'BMI Category' and 'Sleep Disorder' are jointly used to compute
        the total penalty ('penalty_total') for the Sleep Health Index calculation.
        The code assumes that 'BMI Category' only contains mapped values ('Normal',
        'Normal Weight', 'Overweight', 'Obese') with non-null values, while 'Sleep
        Disorder' values (either 'Insomnia', 'Sleep Apnea', or null/unknown) map to
        numerical penalties, ensuring that combining both columns results in valid,
        non-null numeric penalty scores between 0.0 and 1.0 for every record.
      sources:
