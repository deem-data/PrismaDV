      - dcbe68a5-6b5f-475b-b914-af09376bea17
    assumptions:
    - text: The input must contain a 'Stress Level' column, because the script reads
        it directly without checking whether it exists.
      sources:
      - start_line: 28
        end_line: 28
        file: ''
      uid: 1470a313-603d-4335-bf78-1da8d1c1e46b
    - text: Every 'Stress Level' value should be non-null and convertible to a finite
        number. The script does not fill missing or invalid values before using stress
        in the per-row SleepHealthIndex.
      sources:
      - start_line: 28
        end_line: 28
        file: ''
      - start_line: 34
        end_line: 36
        file: ''
      - start_line: 72
        end_line: 82
        file: ''
      uid: 8b5152a1-e19f-463e-b483-d720490babf8
    - text: '''Stress Level'' should contain integer scale values in the observed
        set {3, 4, 5, 6, 7, 8}. Values outside this set would change the data-derived
        minimum and maximum used to score every row.'
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      uid: e2d907a2-eaeb-4049-b3f2-303975f5f286
    - text: '''Stress Level'' should have at least two distinct values so that its
        correlation with ''Quality of Sleep'' is defined for weight calibration and
        the persisted calibration summary.'
      sources:
      - start_line: 29
        end_line: 29
        file: ''
      - start_line: 62
        end_line: 62
        file: ''
      - start_line: 120
        end_line: 132
        file: ''
      uid: dcbe68a5-6b5f-475b-b914-af09376bea17
  '["BMI Category","Sleep Disorder"]':
    code:
    - suggestion: '.satisfies("`BMI Category` IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'') AND (`Sleep Disorder` IS NULL OR `Sleep Disorder` IN (''Insomnia'',
        ''Sleep Apnea''))", "recognized_bmi_and_sleep_disorder", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 71d5addf-bb8c-4afb-8767-05e1a587d64e
      source_assumptions:
      - fe3c39b6-dc44-4cd1-8a45-f194e47f930a
    - suggestion: '.satisfies("0.5 * (CASE WHEN `BMI Category` IN (''Normal'', ''Normal
        Weight'') THEN 0.0 WHEN `BMI Category` = ''Overweight'' THEN 0.10 WHEN `BMI
        Category` = ''Obese'' THEN 0.20 ELSE -1.0 END) + 0.5 * (CASE WHEN `Sleep Disorder`
        = ''Insomnia'' THEN 0.20 WHEN `Sleep Disorder` = ''Sleep Apnea'' THEN 0.30
        ELSE 0.05 END) BETWEEN 0.025 AND 0.25", "combined_penalty_in_range", lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: dad114f7-bc7a-4dcb-af8b-d6d2934c1678
      source_assumptions:
      - 37b8aad6-997d-4570-88c9-c692b034c4df
    assumptions:
    - text: For every row, 'BMI Category' should be non-null and one of 'Normal',
        'Normal Weight', 'Overweight', or 'Obese'. In the same row, 'Sleep Disorder'
        may be null, but any non-null value should be 'Insomnia' or 'Sleep Apnea'.
        This ensures both columns produce the intended penalties; unlike a missing
        sleep disorder, an unmapped BMI category would produce a null penalty. A row-level
        constraint can check both conditions together.
      sources:
      - start_line: 45
        end_line: 56
        file: ''
      - start_line: 79
        end_line: 82
        file: ''
      uid: fe3c39b6-dc44-4cd1-8a45-f194e47f930a
    - text: The combined penalty derived from 'BMI Category' and 'Sleep Disorder'
        should be finite and between 0.025 and 0.25 for every row, before clipping.
        Under the specified mappings, this checks that the two categorical inputs
        jointly yield the intended contribution to 'SleepHealthIndex'.
      sources:
      - start_line: 45
        end_line: 56
        file: ''
      - start_line: 79
        end_line: 82
        file: ''
      uid: 37b8aad6-997d-4570-88c9-c692b034c4df
  '["Daily Steps","Physical Activity Level"]':
    code:
    - suggestion: '.satisfies(''`Physical Activity Level` IS NOT NULL AND `Daily Steps`
        IS NOT NULL AND NOT isnan(CAST(`Physical Activity Level` AS DOUBLE)) AND NOT
        isnan(CAST(`Daily Steps` AS DOUBLE)) AND ABS(CAST(`Physical Activity Level`
        AS DOUBLE)) <= 1.7976931348623157E308 AND ABS(CAST(`Daily Steps` AS DOUBLE))
        <= 1.7976931348623157E308'', ''paired_finite_activity_and_steps'', lambda
        x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 263fb5eb-6a0c-480f-b914-a9dea161c98b
      source_assumptions:
      - 84c250e2-e753-4084-b0e0-872183756f79
    - suggestion: '.satisfies(''`Physical Activity Level` >= 0 AND `Daily Steps` >=
        0'', ''nonnegative_activity_and_steps'', lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 0e2fd7fa-0058-49c1-a01d-ecd37f80c1be
      source_assumptions:
      - 6b8a69f6-b4f8-481e-a2bc-0409eaf8e2ba
    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: x > 0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 35522554-c9d5-4d30-867d-500e8b5bb52b
      source_assumptions:
      - 37a18141-33fb-45f9-a95e-ba08794f5d0f
    assumptions:
    - text: Every row should contain finite numeric values for both 'Physical Activity
        Level' and 'Daily Steps'. The code converts and uses the two columns together
        without filling missing values; a missing or non-finite value can invalidate
        the correlation, regression, or activity score. Validate paired completeness
        and numeric finiteness for both columns.
      sources:
      - start_line: 20
        end_line: 25
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      uid: 84c250e2-e753-4084-b0e0-872183756f79
    - text: '''Physical Activity Level'' and ''Daily Steps'' should both be nonnegative,
        as they represent activity and step counts. A row-level constraint can require
        `Physical Activity Level >= 0 AND Daily Steps >= 0`.'
      sources:
      - start_line: 20
        end_line: 25
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      uid: 6b8a69f6-b4f8-481e-a2bc-0409eaf8e2ba
    - text: Both columns should vary across records and have a positive, finite Pearson
        correlation. The script records their correlation and fits a linear relationship
        from physical activity level to daily steps; constant columns make the correlation
        undefined, while a nonpositive association would undermine the intended activity-based
        prediction. Validate that each column's standard deviation is greater than
        zero and that their correlation is greater than zero.
      sources:
      - start_line: 20
        end_line: 25
        file: ''
      - start_line: 120
        end_line: 127
        file: ''
      uid: 37a18141-33fb-45f9-a95e-ba08794f5d0f
  '["Quality of Sleep","Sleep Duration"]':
    code:
    - suggestion: .satisfies('try_cast(`Sleep Duration` AS DOUBLE) IS NOT NULL AND
        try_cast(`Quality of Sleep` AS DOUBLE) IS NOT NULL', 'sleep_values_present_and_numeric')
      validity: true
      reason_if_invalid: ''
      level: error
      uid: fcfac789-ebc2-459f-9203-f3bfbc7dbf5e
      source_assumptions:
      - 14dcb952-9294-49b2-b1b6-ae6d1c829692
    - suggestion: .satisfies('try_cast(`Sleep Duration` AS DOUBLE) BETWEEN 3 AND 12
        AND try_cast(`Quality of Sleep` AS DOUBLE) BETWEEN 4 AND 9', 'sleep_normalization_bounds')
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 00f0ee64-c802-4d65-88f0-ccc3fd67ac27
      source_assumptions:
      - 7e39de3f-d173-469c-a84f-2b79ac0ff08b
    - suggestion: '.hasCorrelation(''Sleep Duration'', ''Quality of Sleep'', lambda
        x: x == x and -1.0 <= x <= 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e54337fb-f96a-4ee6-89b1-87d294e416d8
      source_assumptions:
      - 524abf49-d281-4983-ac71-12766347bf43
    assumptions:
    - text: For every row, 'Sleep Duration' and 'Quality of Sleep' should both be
        present and numeric. They are converted to floats together for correlation
        and combined in a row-level sleep score; a missing or nonnumeric value can
        produce an invalid score. A row-level constraint could require both columns
        to be non-null and castable to numeric values.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 14dcb952-9294-49b2-b1b6-ae6d1c829692
    - text: For every row, 'Sleep Duration' should be between 3 and 12 inclusive,
        and 'Quality of Sleep' should be between 4 and 9 inclusive. Together, these
        bounds keep both normalized values in [0, 1] and their product nonnegative
        for the square root in the synergy score. A row-level constraint could require
        `Sleep Duration >= 3 AND Sleep Duration <= 12 AND Quality of Sleep >= 4 AND
        Quality of Sleep <= 9`.
      sources:
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 7e39de3f-d173-469c-a84f-2b79ac0ff08b
    - text: Across rows, 'Sleep Duration' and 'Quality of Sleep' should each have
        nonzero variance so their Pearson correlation is finite for weight calibration.
        This can be checked with a finite-correlation constraint on the two columns.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 61
        end_line: 61
        file: ''
      uid: 524abf49-d281-4983-ac71-12766347bf43
