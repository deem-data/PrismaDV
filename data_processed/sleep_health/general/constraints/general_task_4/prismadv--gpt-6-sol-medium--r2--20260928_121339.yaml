    - text: 'For every row, the normalized ''Sleep Duration'' and ''Quality of Sleep''
        values should have a nonnegative product: ((`Sleep Duration` - 3.0) / 9.0)
        * ((`Quality of Sleep` - 4.0) / 5.0) >= 0. This is required for the square
        root in the synergy calculation to be real. If both normalized inputs are
        intended to be scores between zero and one, validate the stronger joint condition
        `Sleep Duration` BETWEEN 3 AND 12 AND `Quality of Sleep` BETWEEN 4 AND 9.'
