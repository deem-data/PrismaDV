    - text: The relationship between 'Physical Activity Level' and 'Daily Steps' should
        be monitored for a positive correlation. The activity score treats steps predicted
        from physical activity as a meaningful baseline; a nonpositive correlation
        would make that interpretation questionable. This is a calibration-quality
        check, not a requirement for the arithmetic to run.
