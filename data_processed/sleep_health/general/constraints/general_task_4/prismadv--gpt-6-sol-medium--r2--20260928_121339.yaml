    - text: "For the three correlation pairs\u2014('Physical Activity Level', 'Daily\
        \ Steps'), ('Sleep Duration', 'Quality of Sleep'), and ('Stress Level', 'Quality\
        \ of Sleep')\u2014each pair should have at least two jointly non-null numeric\
        \ observations, and neither column in a pair should be constant. Otherwise\
        \ a correlation can be NaN, which can propagate into calibration or the output\
        \ summary."
      sources:
      - start_line: 20
        end_line: 29
        file: ''
      - start_line: 61
        end_line: 62
        file: ''
      - start_line: 120
        end_line: 129
