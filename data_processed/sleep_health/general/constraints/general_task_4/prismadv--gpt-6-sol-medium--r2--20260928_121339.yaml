    assumptions:
    - text: Every 'Blood Pressure' value should split into exactly two numeric components
        representing systolic and diastolic pressure, with systolic pressure greater
        than diastolic pressure. This supports both the BP score and the rule that
        flags a row when either component crosses its threshold. A row-level check
        can validate the format and compare the two parsed integers.
