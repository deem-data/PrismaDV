    assumptions:
    - text: The input must contain a 'BMI Category' column, and every row should have
        a non-null value. Missing values are not filled; they map to a null penalty,
        which can propagate into SleepHealthIndex.
      sources:
      - start_line: 45
        end_line: 51
        file: ''
      - start_line: 79
