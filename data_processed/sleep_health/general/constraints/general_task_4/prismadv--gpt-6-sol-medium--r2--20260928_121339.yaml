        integers without handling missing values.
      sources:
      - start_line: 15
        end_line: 18
        file: ''
      uid: 1c6cda25-313c-41df-9fcd-9341e4153061
    - text: Every 'Blood Pressure' value should contain exactly two base-10 integer
        components separated by one slash, such as '120/80'. Whitespace around the
        components is acceptable. Each component must be convertible by Python's int(),
        because the code uses the first two split components without a fallback.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      uid: ca78e51a-f59a-4c67-9e76-31466e39e8b1
    - text: The first component (systolic pressure) and second component (diastolic
        pressure) should both be positive, and systolic pressure should be at least
        diastolic pressure. These values are treated as blood-pressure measurements
        when calculating the health score and high-pressure risk flag; values at or
        above 140 systolic or 90 diastolic are valid inputs that the code is designed
        to flag, not reject.
      sources:
      - start_line: 38
        end_line: 40
        file: ''
      - start_line: 85
        end_line: 85
        file: ''
      uid: cc49732d-676b-4fca-9d6a-8369bbe1a7ca
