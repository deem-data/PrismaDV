    usage: *id001
  stderr_tail: 'Reading additional input from stdin...

    '
constraints:
  constraints:
    BMI Category:
      code:
      - - .isComplete('BMI Category')
        - Valid
      - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight',
          'Obese'])
        - Valid
      assumptions: []
      column_name: BMI Category
    Blood Pressure:
      code:
      - - .isComplete('Blood Pressure')
        - Valid
      - - .satisfies("CAST(split(`Blood Pressure`, '/')[0] AS INT) BETWEEN 60 AND
          250 AND CAST(split(`Blood Pressure`, '/')[1] AS INT) BETWEEN 40 AND 150",
          'blood_pressure_components')
        - Valid
      - - .satisfies("`Blood Pressure` RLIKE '^[0-9]{2,3}/[0-9]{2,3}$'", 'blood_pressure_format')
        - Valid
      assumptions: []
      column_name: Blood Pressure
    Daily Steps:
      code:
      - - '.hasStandardDeviation(''Daily Steps'', lambda deviation: deviation > 0)'
        - Valid
      - - .isComplete('Daily Steps')
        - Valid
      - - .satisfies('`Daily Steps` >= 0', 'nonnegative_daily_steps')
        - Valid
      assumptions: []
      column_name: Daily Steps
    Person ID:
      code:
      - - '.hasMax(''Person ID'', lambda maximum: maximum <= 1000000)'
        - Valid
      - - .isComplete('Person ID')
        - Valid
      - - .isUnique('Person ID')
        - Valid
      - - .satisfies('`Person ID` >= 1 AND `Person ID` = FLOOR(`Person ID`)', 'positive_integer_person_id')
        - Valid
      assumptions: []
      column_name: Person ID
    Physical Activity Level:
      code:
      - - '.hasStandardDeviation(''Physical Activity Level'', lambda deviation: deviation
          > 0)'
        - Valid
      - - .isComplete('Physical Activity Level')
        - Valid
      - - .satisfies('`Physical Activity Level` >= 0', 'nonnegative_physical_activity')
        - Valid
      assumptions: []
      column_name: Physical Activity Level
    Quality of Sleep:
      code:
      - - '.hasStandardDeviation(''Quality of Sleep'', lambda deviation: deviation
          > 0)'
        - Valid
      - - .isComplete('Quality of Sleep')
        - Valid
      - - .satisfies('`Quality of Sleep` BETWEEN 4 AND 9', 'quality_of_sleep_scale')
        - Valid
      assumptions: []
      column_name: Quality of Sleep
    Sleep Disorder:
      code:
      - - .satisfies("`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia',
          'Sleep Apnea')", 'known_sleep_disorder_or_missing')
        - Valid
      assumptions: []
      column_name: Sleep Disorder
    Sleep Duration:
      code:
      - - '.hasStandardDeviation(''Sleep Duration'', lambda deviation: deviation >
          0)'
        - Valid
      - - .isComplete('Sleep Duration')
        - Valid
      - - .satisfies('`Sleep Duration` BETWEEN 3.0 AND 12.0', 'sleep_duration_scale')
        - Valid
      assumptions: []
      column_name: Sleep Duration
    Stress Level:
      code:
      - - '.hasStandardDeviation(''Stress Level'', lambda deviation: deviation > 0)'
        - Valid
      - - .isComplete('Stress Level')
        - Valid
      - - .satisfies('`Stress Level` BETWEEN 1 AND 10', 'stress_level_scale')
        - Valid
      assumptions: []
      column_name: Stress Level
