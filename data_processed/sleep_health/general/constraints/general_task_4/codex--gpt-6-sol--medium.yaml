prompt_text: "# Task\n\nYou are writing a **data unit test**: a set of PyDeequ constraints\
  \ describing what\nthe program below assumes about its input data. If new data arrived\
  \ that violated\none of your constraints, the program should be expected to misbehave\
  \ -- crash,\nsilently produce a wrong number, or drop records it should have kept.\n\
  \nYour output is a single file, `constraints.json`, in the current folder.\n\n#\
  \ The program\n\nThis program consumes the dataset.\n\n```python\nimport argparse\n\
  import os\n\nimport numpy as np\nimport pandas as pd\n\n\ndef main():\n    parser\
  \ = argparse.ArgumentParser()\n    parser.add_argument('--input', type=str, required=True)\n\
  \    parser.add_argument('--output', type=str, required=True)\n    args = parser.parse_args()\n\
  \n    input_csv = os.path.join(args.input, 'new_data.csv')\n    df = pd.read_csv(input_csv)\n\
  \    bp_split = df[\"Blood Pressure\"].str.split(\"/\", expand=True)\n    df[\"\
  BP_SYS\"] = bp_split[0].astype(int)\n    df[\"BP_DIA\"] = bp_split[1].astype(int)\n\
  \    # Correlation checks and preparation for model calibration\n    pa = df[\"\
  Physical Activity Level\"].astype(float)\n    steps = df[\"Daily Steps\"].astype(float)\n\
  \    corr_pa_steps = pa.corr(steps)\n    slope = ((pa - pa.mean()) * (steps - steps.mean())).mean()\
  \ / (pa.var(ddof=0) if pa.var(ddof=0) != 0 else 1.0)\n    intercept = steps.mean()\
  \ - slope * pa.mean()\n    steps_pred = slope * pa + intercept\n\n    corr_sd_q\
  \ = df[\"Sleep Duration\"].astype(float).corr(df[\"Quality of Sleep\"].astype(float))\n\
  \    stress = df[\"Stress Level\"].astype(float)\n    corr_stress_q = stress.corr(df[\"\
  Quality of Sleep\"].astype(float))\n    # Feature scaling\n    duration_norm = (df[\"\
  Sleep Duration\"].astype(float) - 3.0) / 9.0\n    qos_norm = (df[\"Quality of Sleep\"\
  ].astype(float) - 4.0) / 5.0\n\n    smin, smax = float(stress.min()), float(stress.max())\n\
  \    stress_range = (smax - smin) if (smax - smin) > 0 else 1.0\n    stress_score\
  \ = 1.0 - (stress - smin) / stress_range\n\n    sys_dev = (df[\"BP_SYS\"].astype(float)\
  \ - 120.0).abs() / 80.0\n    dia_dev = (df[\"BP_DIA\"].astype(float) - 80.0).abs()\
  \ / 50.0\n    bp_score = 1.0 - np.clip(0.5 * sys_dev + 0.5 * dia_dev, 0.0, 1.0)\n\
  \n    steps_mean = max(steps.mean(), 1.0)\n    activity_score = 1.0 - np.clip((steps\
  \ - steps_pred).abs() / steps_mean, 0.0, 1.0)\n\n    bmi_penalty_map = {\n     \
  \   \"Normal\": 0.0,\n        \"Normal Weight\": 0.0,\n        \"Overweight\": 0.10,\n\
  \        \"Obese\": 0.20,\n    }\n    bmi_penalty = df[\"BMI Category\"].map(bmi_penalty_map).astype(float)\n\
  \n    unknown_penalty = 0.05\n    disorder_penalty = (\n        df[\"Sleep Disorder\"\
  ].map({\"Insomnia\": 0.20, \"Sleep Apnea\": 0.30}).fillna(unknown_penalty)\n   \
  \ ).astype(float)\n\n    synergy = np.clip(0.6 * (qos_norm + duration_norm) / 2.0\
  \ + 0.4 * np.sqrt(qos_norm * duration_norm), 0.0, 1.0)\n\n    # Weight calibration\
  \ using correlations\n    w_synergy = 0.35 + 0.10 * float(min(max((corr_sd_q - 0.2)\
  \ / 0.6, 0.0), 1.0))\n    w_stress = 0.20 + 0.10 * float(min(max(((-corr_stress_q)\
  \ - 0.3) / 0.5, 0.0), 1.0))\n    w_activity = 0.20\n    w_bp = 0.15\n\n    w_sum\
  \ = w_synergy + w_stress + w_activity + w_bp\n    w_synergy /= w_sum\n    w_stress\
  \ /= w_sum\n    w_activity /= w_sum\n    w_bp /= w_sum\n\n    base_score = (\n \
  \           w_synergy * synergy +\n            w_activity * activity_score +\n \
  \           w_bp * bp_score +\n            w_stress * stress_score\n    )\n\n  \
  \  penalty_total = np.clip(0.5 * bmi_penalty + 0.5 * disorder_penalty, 0.0, 1.0)\n\
  \    shi = np.clip(100.0 * (base_score * (1.0 - penalty_total)), 0.0, 100.0)\n\n\
  \    df[\"SleepHealthIndex\"] = shi.round(2)\n\n    # Risk rules\n    high_bp =\
  \ (df[\"BP_SYS\"] >= 140) | (df[\"BP_DIA\"] >= 90)\n    low_sleep = (df[\"Sleep\
  \ Duration\"] < 5.5) | (df[\"Quality of Sleep\"] <= 5)\n    low_index = df[\"SleepHealthIndex\"\
  ] < 60\n\n    reasons = []\n    for i in range(len(df)):\n        r = []\n     \
  \   if high_bp.iat[i]:\n            r.append(\"bp\")\n        if low_sleep.iat[i]:\n\
  \            r.append(\"sleep\")\n        if low_index.iat[i]:\n            r.append(\"\
  index\")\n        reasons.append(\";\".join(r) if r else \"\")\n\n    df[\"RiskAlert\"\
  ] = high_bp | low_sleep | low_index\n    df[\"RiskReasons\"] = reasons\n\n    #\
  \ Array-based write relying on positive, unique Person IDs\n    max_id = int(df[\"\
  Person ID\"].max())\n    shi_array = np.zeros(max_id + 1, dtype=float)\n    alert_array\
  \ = np.zeros(max_id + 1, dtype=np.int8)\n\n    for pid, s, a in df[[\"Person ID\"\
  , \"SleepHealthIndex\", \"RiskAlert\"]].itertuples(index=False):\n        shi_array[int(pid)]\
  \ = float(s)\n        alert_array[int(pid)] = 1 if bool(a) else 0\n\n    os.makedirs(args.output,\
  \ exist_ok=True)\n    df_out = df[[\"Person ID\", \"SleepHealthIndex\", \"RiskAlert\"\
  , \"RiskReasons\"]].copy()\n    df_out.to_csv(os.path.join(args.output, 'sleep_health_index.csv'),\
  \ index=False)\n\n    alerts = df_out[df_out[\"RiskAlert\"]]\n    alerts.to_csv(os.path.join(args.output,\
  \ 'alerts.csv'), index=False)\n\n    # Persist simple calibration summary\n    calib\
  \ = pd.DataFrame({\n        \"metric\": [\n            \"corr_physicalActivity_dailySteps\"\
  ,\n            \"corr_sleepDuration_qualityOfSleep\",\n            \"corr_stress_qualityOfSleep\"\
  \n        ],\n        \"value\": [\n            round(float(corr_pa_steps), 4),\n\
  \            round(float(corr_sd_q), 4),\n            round(float(corr_stress_q),\
  \ 4)\n        ]\n    })\n    calib.to_csv(os.path.join(args.output, 'calibration_summary.csv'),\
  \ index=False)\n\n\nif __name__ == '__main__':\n    main()\n\n```\n\nThe same program\
  \ is on disk at `./code/general_task_4.py`, so you can run it against the\nstaged\
  \ table, step through it, or search it, rather than working from the\nlisting alone.\n\
  \n# The data\n\nThree rows sampled from the dataset the program consumes:\n\n[{'id':\
  \ 121, 'Person ID': 294, 'Gender': 'Female', 'Age': 50, 'Occupation': 'Nurse', 'Sleep\
  \ Duration': 6.0, 'Quality of Sleep': 6, 'Physical Activity Level': 90, 'Stress\
  \ Level': 8, 'BMI Category': 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate':\
  \ 75, 'Daily Steps': 10000, 'Sleep Disorder': 'Sleep Apnea'}, {'id': 5, 'Person\
  \ ID': 373, 'Gender': 'Female', 'Age': 59, 'Occupation': 'Nurse', 'Sleep Duration':\
  \ 8.1, 'Quality of Sleep': 9, 'Physical Activity Level': 75, 'Stress Level': 3,\
  \ 'BMI Category': 'Overweight', 'Blood Pressure': '140/95', 'Heart Rate': 68, 'Daily\
  \ Steps': 7000, 'Sleep Disorder': 'Sleep Apnea'}, {'id': 82, 'Person ID': 94, 'Gender':\
  \ 'Male', 'Age': 35, 'Occupation': 'Lawyer', 'Sleep Duration': 7.4, 'Quality of\
  \ Sleep': 7, 'Physical Activity Level': 60, 'Stress Level': 5, 'BMI Category': 'Obese',\
  \ 'Blood Pressure': '135/88', 'Heart Rate': 84, 'Daily Steps': 3300, 'Sleep Disorder':\
  \ 'Sleep Apnea'}]\n\nThe full table is on disk at `./data/tables/observed_data.csv`.\
  \ You have complete access to it:\nload it with pandas, profile it, plot it, run\
  \ whatever analysis helps. It is a\nthrowaway copy -- nothing you do to it has any\
  \ effect outside this workspace.\n\n# Verifying your constraints\n\nYou can execute\
  \ PyDeequ constraint code against the staged table and read back\nthe result of\
  \ every check:\n\n```\npython deequ_check.py --table observed_data --constraints\
  \ <your_constraints_file>\n```\n\nwhere the constraints file is plain text with\
  \ one PyDeequ `Check` call per line,\nfor example:\n\n```\n.isComplete(\"age\")\n\
  .isNonNegative(\"age\")\n.isContainedIn(\"status\", [\"active\", \"closed\"])\n\
  ```\n\nEach line comes back as `[HOLDS]` or `[FAILS]`, and a failure prints the\
  \ reason,\nincluding compilation errors. Use it as often as you like.\n\n# Output\
  \ format\n\nWrite `constraints.json` in the current folder, containing the union\
  \ of what you\nsettled on for every column:\n\n{\n    \"constraints\": [\n     \
  \   {\n            \"column_name\": \"some_column\",\n            \"code_for_constraint\"\
  : \".isComplete('some_column')\"\n        },\n        {\n            \"column_name\"\
  : \"another_column\",\n            \"code_for_constraint\": \".isPositive('another_column')\"\
  \n        }\n    ]\n}\n\nUse only the PyDeequ `Check` object's methods in `code_for_constraint`.\
  \ Each\nentry names the single column it constrains; for a constraint spanning several\n\
  columns, name the one it is primarily about.\n\n# Workspace boundary\n\nYour workspace\
  \ is the current folder, and for this task nothing else exists.\n\n- Read, list,\
  \ search and write only inside this folder: `./data`, `./code`,\n  `deequ_check.py`,\
  \ `task.txt`, and whatever you create here.\n- Do not touch anything outside it.\
  \ That means no parent directory (`..`), no\n  other folder under /tmp, no home\
  \ directory (`~`, $HOME), and no absolute path\n  anywhere else on the filesystem.\n\
  - Do not search the wider filesystem -- no `rg`, `grep`, `find`, `ls` or\n  `python`\
  \ over `/`, `/tmp`, `..`, `~` or any path outside this folder -- for\n  related\
  \ data, prompts, examples, other runs, or previous answers. There is\n  nothing\
  \ out there you are allowed to use, and a run that looks is discarded.\n- Running\
  \ `python`, `deequ_check.py` and the tools on your PATH is fine; the\n  boundary\
  \ is about what you read and write, not which interpreter runs.\n\nEverything you\
  \ need is here. Work only from it.\n"
