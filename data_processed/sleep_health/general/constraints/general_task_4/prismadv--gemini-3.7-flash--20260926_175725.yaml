  '["Daily Steps","Physical Activity Level"]':
    code: []
    assumptions:
    - text: 'The columns ''Physical Activity Level'' and ''Daily Steps'' are expected
        to be non-null and numeric across the dataset, as they are jointly used to
        compute correlation and fit a linear regression line (slope, intercept, and
        predicted daily steps) to derive the ''activity_score''. Missing or non-numeric
        values in either column would propagate NaNs into the Sleep Health Index calculations.
        This can be represented in Deequ as completeness and type checks or a correlation
        check: .hasCompleteness(''Physical Activity Level'', _ == 1.0).hasCompleteness(''Daily
        Steps'', _ == 1.0)'
