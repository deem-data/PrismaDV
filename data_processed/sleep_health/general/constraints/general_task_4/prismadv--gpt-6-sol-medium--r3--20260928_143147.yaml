        end_line: 31
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 68c44eac-9258-4295-aabb-48ce53cf5d98
    - text: Sleep Duration should have at least two distinct values among rows usable
        for its correlation with Quality of Sleep. A constant Sleep Duration produces
        an undefined correlation, which is then used to calibrate the index weight.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 61
        end_line: 72
        file: ''
      uid: d8dbe0d1-3088-425d-a369-2a24551ec09f
