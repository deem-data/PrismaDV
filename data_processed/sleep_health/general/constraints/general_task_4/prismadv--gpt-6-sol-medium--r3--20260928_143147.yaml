        end_line: 18
        file: ''
      uid: 009f8863-0f60-426f-b53f-ede2a0afd2a0
    - text: Every 'Blood Pressure' value should contain exactly two integer-convertible
        components separated by a single slash, in systolic/diastolic order (for example,
        '120/80'). A validation rule could require the full value to match `^\s*[+-]?\d+\s*/\s*[+-]?\d+\s*$`.
