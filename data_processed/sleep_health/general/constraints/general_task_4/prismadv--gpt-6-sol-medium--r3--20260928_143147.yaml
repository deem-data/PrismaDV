      source_assumptions:
      - d8dbe0d1-3088-425d-a369-2a24551ec09f
    assumptions:
    - text: The 'Sleep Duration' column should be present, non-null, and contain finite
        numeric values. The code converts it to float, uses it in arithmetic and a
        correlation, and also compares the original values directly with 5.5; it does
        not fill missing values.
      sources:
      - start_line: 27
        end_line: 31
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      uid: 1f762df1-d912-4619-935d-ae138d3a6b46
    - text: Sleep Duration should be between 3.0 and 12.0 hours, inclusive. The normalization
        `(Sleep Duration - 3.0) / 9.0` treats that interval as a 0-to-1 scale. Values
        below 3.0 can also make the square-root term invalid when normalized Quality
        of Sleep is positive.
