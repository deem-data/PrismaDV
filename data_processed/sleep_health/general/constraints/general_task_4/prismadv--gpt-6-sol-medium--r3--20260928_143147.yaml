        file: ''
      uid: 55629f6e-4891-4189-bfc5-5e05476b2f0d
    - text: '''Stress Level'' should use the observed integer scale of 3 through 8.
        Values outside this scale would change the dataset-wide minimum and maximum
        used to normalize every row''s stress score.'
      sources:
      - start_line: 34
        end_line: 36
        file: ''
      - start_line: 72
        end_line: 77
        file: ''
      uid: 8bdd37c5-9df7-4fe1-95da-27a3ad3200a1
    - text: '''Stress Level'' should have at least two distinct values. If it is constant,
        its correlation with ''Quality of Sleep'' is undefined, which can make the
        calibrated stress weight and resulting health scores missing. The fallback
        for a zero normalization range does not address that correlation.'
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 34
        end_line: 36
        file: ''
      - start_line: 62
        end_line: 82
        file: ''
      uid: 72b83e84-8803-4dd9-85ea-2772f700d020
  '["BMI Category","Sleep Disorder"]':
    code:
    - suggestion: .satisfies("`BMI Category` IN ('Normal', 'Normal Weight', 'Overweight',
        'Obese') AND (`Sleep Disorder` IS NULL OR `Sleep Disorder` IN ('Insomnia',
        'Sleep Apnea'))", "valid_bmi_category_and_sleep_disorder")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: bf6571b4-22fd-476e-8fbc-c41e6466a199
      source_assumptions:
      - e10b0133-6e12-4ee9-a51b-ac2e23d037e2
    assumptions:
    - text: 'Each row should have a BMI Category of ''Normal'', ''Normal Weight'',
        ''Overweight'', or ''Obese'', paired with a Sleep Disorder that is either
        null, ''Insomnia'', or ''Sleep Apnea''. The code assigns a BMI penalty from
        the listed categories and combines it with a disorder penalty; null Sleep
        Disorder values are supported by the 0.05 fallback. This can be checked with
        a row-level constraint: `BMI Category IN (''Normal'', ''Normal Weight'', ''Overweight'',
        ''Obese'') AND (Sleep Disorder IS NULL OR Sleep Disorder IN (''Insomnia'',
        ''Sleep Apnea''))`.'
      sources:
      - start_line: 45
        end_line: 56
        file: ''
      - start_line: 79
        end_line: 82
        file: ''
      uid: e10b0133-6e12-4ee9-a51b-ac2e23d037e2
  '["Blood Pressure","Quality of Sleep","Sleep Duration"]':
    code:
    - suggestion: '.satisfies("CASE WHEN `Blood Pressure` RLIKE ''^[0-9]+/[0-9]+$''
        AND CAST(SPLIT(`Blood Pressure`, ''/'')[0] AS BIGINT) > CAST(SPLIT(`Blood
        Pressure`, ''/'')[1] AS BIGINT) AND CAST(SPLIT(`Blood Pressure`, ''/'')[1]
        AS BIGINT) > 0 THEN true ELSE false END", "valid_systolic_diastolic_pressure",
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d6b5fe8c-73af-47ff-b871-fb640f8e9602
      source_assumptions:
      - 81e6bcf4-a9b1-4eb5-a361-23a657526688
    - suggestion: '.satisfies("`Sleep Duration` BETWEEN 3.0 AND 12.0 AND `Quality
        of Sleep` BETWEEN 4 AND 9", "sleep_scaling_ranges", lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: d04dcdfc-9dac-475b-98f5-fd47844de1e1
      source_assumptions:
      - 568297f9-df69-48f0-9d96-46815a58a025
    - suggestion: '.hasCorrelation(''Sleep Duration'', ''Quality of Sleep'', lambda
        x: x is not None and -1.0 <= x <= 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: 6207a8ce-8c1d-42d0-8f0f-1be5747459ed
      source_assumptions:
      - 3380507a-82f0-4712-907f-6e9e83571493
    assumptions:
    - text: Each 'Blood Pressure' value should contain exactly two integer components
        in systolic/diastolic order, separated by '/', with both components positive
        and systolic pressure greater than diastolic pressure. This can be checked
        with a row-level constraint that parses both components and verifies 0 < BP_DIA
        < BP_SYS.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 38
        end_line: 40
        file: ''
      - start_line: 85
        end_line: 85
        file: ''
      uid: 81e6bcf4-a9b1-4eb5-a361-23a657526688
    - text: '''Sleep Duration'' and ''Quality of Sleep'' should jointly fall within
        their scaling ranges on every row: 3.0 <= Sleep Duration <= 12.0 and 4 <=
        Quality of Sleep <= 9. This keeps both normalized values in [0, 1], including
        a nonnegative product for the square root in the synergy calculation.'
      sources:
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 568297f9-df69-48f0-9d96-46815a58a025
    - text: The paired 'Sleep Duration' and 'Quality of Sleep' values should include
        at least two valid observations, and each column should vary across those
        observations. Otherwise their correlation is undefined and can propagate a
        NaN into the calibrated score. A dataset-level check can require at least
        two complete pairs and a positive standard deviation for each column.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 61
        end_line: 61
        file: ''
      - start_line: 72
        end_line: 82
        file: ''
