      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 38
        end_line: 40
        file: ''
      - start_line: 85
        end_line: 85
        file: ''
      uid: 95c4a17e-0002-4914-a7e7-0a81bd0423e1
    - text: The systolic and diastolic numbers encoded in 'Blood Pressure' should
        both be positive, and the systolic number should be greater than the diastolic
        number. Otherwise, the calculated blood-pressure score and high-blood-pressure
        alert would be based on an invalid measurement.
      sources:
      - start_line: 16
        end_line: 18
        file: ''
      - start_line: 38
        end_line: 40
        file: ''
      - start_line: 85
        end_line: 85
        file: ''
      uid: 5ef5843a-84e2-42cd-9b82-3722599846ee
