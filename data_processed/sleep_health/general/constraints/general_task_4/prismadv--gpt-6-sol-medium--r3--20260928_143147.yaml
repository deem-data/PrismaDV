    - suggestion: '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda
        x: x > 0.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: b3a93dac-14f2-42ee-b830-950da2128130
      source_assumptions:
      - f399fe7b-c321-47c7-a65d-65fd123ff387
    assumptions:
    - text: Every row should have non-null, finite numeric values for both 'Physical
        Activity Level' and 'Daily Steps'. The code uses them as paired observations
        to calculate a correlation, fit a regression, and compute a per-row activity
        score. This can be checked with a row-level constraint requiring both columns
        to be non-null and finite.
      sources:
      - start_line: 20
        end_line: 25
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      uid: 25d81524-45ec-4a20-9c67-9067812e0d7e
    - text: Both 'Physical Activity Level' and 'Daily Steps' should vary across the
        dataset, and their correlation should be positive. Otherwise the persisted
        correlation may be undefined or the regression-based activity score may not
        reflect the expected relationship between activity level and steps. This can
        be checked with positive-variance constraints for both columns and a Deequ
        constraint such as .hasCorrelation("Physical Activity Level", "Daily Steps",
        _ > 0.0).
      sources:
      - start_line: 20
        end_line: 25
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      - start_line: 120
        end_line: 132
        file: ''
      uid: f399fe7b-c321-47c7-a65d-65fd123ff387
  '["Quality of Sleep","Sleep Duration"]':
    code:
    - suggestion: .satisfies("`Sleep Duration` IS NOT NULL AND `Quality of Sleep`
        IS NOT NULL AND NOT isnan(CAST(`Sleep Duration` AS DOUBLE)) AND NOT isnan(CAST(`Quality
        of Sleep` AS DOUBLE)) AND abs(CAST(`Sleep Duration` AS DOUBLE)) <= 1.7976931348623157e308
        AND abs(CAST(`Quality of Sleep` AS DOUBLE)) <= 1.7976931348623157e308", "finite_paired_sleep_values")
      validity: true
      reason_if_invalid: ''
      level: error
      uid: a0a1d65c-efb3-4552-bdf2-b7c23000a636
      source_assumptions:
      - c46ed413-3ccb-4175-bfb1-541a6e389dca
    - suggestion: .satisfies("`Sleep Duration` BETWEEN 3 AND 12 AND `Quality of Sleep`
        BETWEEN 4 AND 9", "sleep_normalization_ranges")
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: d43d9bf2-df24-4cbb-8410-310be882e2a6
      source_assumptions:
      - 16c59177-53b8-4a6f-a8da-58a96b693bc3
    - suggestion: '.hasCorrelation(''Sleep Duration'', ''Quality of Sleep'', lambda
        x: x == x and -1.0 <= x <= 1.0)'
      validity: true
      reason_if_invalid: ''
      level: error
      uid: e81a2f23-5fdd-4662-b325-56e150d8c0ab
      source_assumptions:
      - 371b0ef1-2aa5-40c2-8ecb-9ec6c7f984a2
    assumptions:
    - text: For every record, 'Sleep Duration' and 'Quality of Sleep' should both
        be present and finite numeric values. They are paired for correlation and
        combined in the sleep-synergy score; a missing or non-finite value would make
        those results unreliable. This can be checked with a row-level constraint
        requiring both values to be non-null and finite.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: c46ed413-3ccb-4175-bfb1-541a6e389dca
    - text: For every record, 'Sleep Duration' should be between 3 and 12 inclusive,
        and 'Quality of Sleep' should be between 4 and 9 inclusive. These are the
        ranges mapped to [0, 1] by the two normalizations before the values are combined
        in the sleep-synergy calculation. A row-level constraint can require `Sleep
        Duration >= 3 AND Sleep Duration <= 12 AND Quality of Sleep >= 4 AND Quality
        of Sleep <= 9`.
      sources:
      - start_line: 31
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 16c59177-53b8-4a6f-a8da-58a96b693bc3
    - text: Across records where both columns are present, there should be at least
        two paired observations, and both 'Sleep Duration' and 'Quality of Sleep'
        should vary. Otherwise their correlation is undefined and the resulting calibration
        weight may become non-finite. This can be checked by requiring at least two
        paired rows and more than one distinct value for each column among those rows.
      sources:
      - start_line: 27
        end_line: 27
        file: ''
      - start_line: 61
        end_line: 61
        file: ''
      uid: 371b0ef1-2aa5-40c2-8ecb-9ec6c7f984a2
