        end_line: 56
        file: ''
      - start_line: 79
        end_line: 82
        file: ''
      uid: d518a337-1f16-42dc-a475-4f7869377a99
  Sleep Duration:
    code:
    - suggestion: .satisfies("`Sleep Duration` IS NOT NULL AND CAST(`Sleep Duration`
        AS DOUBLE) BETWEEN -1.7976931348623157E308 AND 1.7976931348623157E308", "sleep_duration_finite_numeric")
