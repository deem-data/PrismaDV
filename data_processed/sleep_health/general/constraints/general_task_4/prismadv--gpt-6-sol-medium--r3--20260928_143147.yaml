      - start_line: 27
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      uid: 87ca550d-0b7c-4d90-a0fd-e3d87d5d6f4a
    - text: Every 'Quality of Sleep' value should be numeric and convertible to a
        finite float. The observed data contains integral ratings, and the code converts
        the column to float for correlations and scoring while also comparing its
        input values directly with 5.
      sources:
      - start_line: 27
        end_line: 32
        file: ''
      - start_line: 86
        end_line: 86
        file: ''
      uid: 3dcc9eb9-2875-40d1-9628-ccf9947e309d
    - text: '''Quality of Sleep'' should contain ratings from 4 through 9, inclusive.
        These are the observed ratings; the normalization maps 4 to 0 and 9 to 1.
        Values below 4 could also make the square-root term invalid when normalized
        sleep duration is positive.'
      sources:
      - start_line: 32
        end_line: 32
        file: ''
      - start_line: 58
        end_line: 58
        file: ''
      uid: 08facc48-9b99-4c66-a1a0-2885c0c4c16e
    - text: '''Quality of Sleep'' should have at least two distinct values among rows
        with usable Sleep Duration and Stress Level values. Otherwise, one or both
        quality correlations used for weight calibration would be undefined.'
