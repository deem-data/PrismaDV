        end_line: 25
        file: ''
      - start_line: 42
        end_line: 43
        file: ''
      - start_line: 72
        end_line: 82
        file: ''
      uid: 01f6ac51-6ff4-47b4-84a4-1b9b124fb15d
    - text: Every 'Daily Steps' value should be a nonnegative whole number, consistent
        with a count of steps. Negative or fractional counts would make the activity
        calibration and score misleading.
