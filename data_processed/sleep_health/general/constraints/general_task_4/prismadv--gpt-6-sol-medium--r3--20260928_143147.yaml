    - suggestion: '.hasCorrelation(''Stress Level'', ''Quality of Sleep'', lambda
        x: x <= -0.3)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 781b9ab5-06ef-4873-b325-09c10ec11694
      source_assumptions:
      - 63fda508-5a6e-43ad-9197-c091b7c05189
    assumptions:
    - text: "\u2018Quality of Sleep\u2019 and \u2018Stress Level\u2019 should be present\
        \ together on every record so their correlation and combined scoring can use\
        \ the intended population. This can be checked with a constraint equivalent\
        \ to .satisfies(\"`Quality of Sleep` IS NOT NULL AND `Stress Level` IS NOT\
        \ NULL\", \"complete_sleep_stress_pairs\", 1.0)."
      sources:
      - start_line: 27
        end_line: 29
        file: ''
      - start_line: 72
        end_line: 77
        file: ''
      uid: e9a99ad8-7f0f-42a5-b459-419014e96880
    - text: "\u2018Stress Level\u2019 and \u2018Quality of Sleep\u2019 should have\
        \ a negative Pearson correlation: higher stress should generally correspond\
        \ to lower sleep quality. The stress-weight calibration begins increasing\
        \ its weight when this correlation falls below -0.3; a task-specific validation\
        \ threshold could therefore require correlation at or below -0.3."
      sources:
      - start_line: 28
        end_line: 29
        file: ''
      - start_line: 61
        end_line: 62
        file: ''
      uid: 63fda508-5a6e-43ad-9197-c091b7c05189
