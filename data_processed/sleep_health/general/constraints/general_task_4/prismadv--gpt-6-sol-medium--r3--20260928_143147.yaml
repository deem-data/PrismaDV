        -1.7976931348623157E308 AND 1.7976931348623157E308 AND CAST(`Daily Steps`
        AS DOUBLE) BETWEEN -1.7976931348623157E308 AND 1.7976931348623157E308'', ''finite_paired_activity_and_steps'',
        lambda x: x == 1.0)'
      validity: true
      reason_if_invalid: ''
      level: warning
      uid: 346c170a-6b44-4f8f-b268-e12fc51d0a54
      source_assumptions:
