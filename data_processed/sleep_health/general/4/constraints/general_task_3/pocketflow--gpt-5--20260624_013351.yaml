constraints:
  Age:
    code:
    - - .isComplete('Age')
      - Valid
    - - .isContainedInRange('Age', lower=0, upper=120)
      - Invalid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Overweight', 'Normal', 'Obese', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - '.hasPattern(''Blood Pressure'', ''\\d{2,3}/\\d{2,3}'', lambda v: v >= 0.99)'
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .isComplete('Daily Steps')
      - Valid
    - - .isContainedInRange('Daily Steps', lower=0, upper=100000)
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isComplete('Gender')
      - Valid
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Heart Rate:
    code:
    - - .isComplete('Heart Rate')
      - Valid
    - - .isContainedInRange('Heart Rate', lower=40, upper=200)
      - Invalid
    assumptions: []
    column_name: Heart Rate
  Occupation:
    code:
    - - .isComplete('Occupation')
      - Valid
    - - .isContainedIn('Occupation', ['Nurse', 'Engineer', 'Lawyer', 'Teacher', 'Accountant',
        'Salesperson', 'Doctor', 'Scientist', 'Software Engineer', 'Sales Representative'])
      - Valid
    assumptions: []
    column_name: Occupation
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .isContainedInRange('Quality of Sleep', lower=3, upper=9)
      - Invalid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda v: v >= 0.4)'
      - Valid
    - - .isContainedIn('Sleep Disorder', ['Sleep Apnea', 'Insomnia'])
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .isComplete('Sleep Duration')
      - Valid
    - - .isContainedInRange('Sleep Duration', lower=0.0, upper=24.0)
      - Invalid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .isComplete('Stress Level')
      - Valid
    - - .isContainedInRange('Stress Level', lower=0, upper=10)
      - Invalid
    assumptions: []
    column_name: Stress Level
