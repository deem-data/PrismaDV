- MissingCategoricalValueCorruption:
    Columns:
    - BMI Category
    Params:
      severity: 0.05
      sampling: CAR
      random_state: 400
      max_unique_num: 30
      corrupt_strategy: to_nan
- RegexPatternViolation:
    Columns:
    - Blood Pressure
    Params:
      severity: 0.1
      sampling: CAR
      random_state: 401
      pattern:
        Blood Pressure: ^\d{2,3}/\d{2,3}$
      strategy: format_breaking
