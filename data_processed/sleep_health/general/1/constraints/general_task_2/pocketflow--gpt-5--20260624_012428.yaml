constraints:
  Age:
    code:
    - - '.hasMax(''Age'', lambda v: v <= 90)'
      - Valid
    - - '.hasMin(''Age'', lambda v: v >= 18)'
      - Valid
    - - .isComplete('Age')
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Overweight','Normal','Obese','Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', '^\\d{2,3}/\\d{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    - - .satisfies("cast(split(`Blood Pressure`, '/')[0] as int) between 80 and 220
        and cast(split(`Blood Pressure`, '/')[1] as int) between 40 and 120", 'bp_within_plausible_ranges')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasMax(''Daily Steps'', lambda v: v <= 40000)'
      - Valid
    - - '.hasMin(''Daily Steps'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isComplete('Gender')
      - Valid
    - - .isContainedIn('Gender', ['Male','Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Heart Rate:
    code:
    - - '.hasMax(''Heart Rate'', lambda v: v <= 120)'
      - Valid
    - - '.hasMin(''Heart Rate'', lambda v: v >= 40)'
      - Valid
    - - .isComplete('Heart Rate')
      - Valid
    assumptions: []
    column_name: Heart Rate
  Occupation:
    code:
    - - .isComplete('Occupation')
      - Valid
    - - .isContainedIn('Occupation', ['Nurse','Software Engineer','Sales Representative','Engineer','Lawyer','Teacher','Accountant','Salesperson','Scientist','Doctor'])
      - Valid
    assumptions: []
    column_name: Occupation
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isPositive('Person ID')
      - Invalid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasMax(''Physical Activity Level'', lambda v: v <= 100)'
      - Valid
    - - '.hasMin(''Physical Activity Level'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - '.hasMax(''Quality of Sleep'', lambda v: v <= 10)'
      - Valid
    - - '.hasMin(''Quality of Sleep'', lambda v: v >= 1)'
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda c: c >= 0.4)'
      - Valid
    - - .isContainedIn('Sleep Disorder', ['Sleep Apnea','Insomnia'], where='`Sleep
        Disorder` IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasMax(''Sleep Duration'', lambda v: v <= 12.0)'
      - Valid
    - - '.hasMin(''Sleep Duration'', lambda v: v >= 3.0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - '.hasMax(''Stress Level'', lambda v: v <= 10)'
      - Valid
    - - '.hasMin(''Stress Level'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Stress Level')
      - Valid
    assumptions: []
    column_name: Stress Level
  id:
    code:
    - - .isComplete('id')
      - Valid
    assumptions: []
    column_name: id
