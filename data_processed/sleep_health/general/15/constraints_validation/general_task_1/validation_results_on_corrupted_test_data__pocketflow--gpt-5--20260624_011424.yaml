results:
  Age:
    code:
    - suggestion: .hasDataType('Age', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMax(''Age'', lambda v: v <= 120)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Age'', lambda v: v >= 0)'
      status: true
      reason_if_failed: ''
      level: error
  BMI Category:
    code:
    - suggestion: .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal',
        'Normal Weight'])
      status: true
      reason_if_failed: ''
      level: error
  Blood Pressure:
    code:
    - suggestion: .containsPattern('Blood Pressure', '^[0-9]{2,3}/[0-9]{2,3}$')
      status: false
      reason_if_failed: 'Unable to instantiate constraint ''.containsPattern(''Blood
        Pressure'', ''^[0-9]{2,3}/[0-9]{2,3}$'')'': ''Check'' object has no attribute
        ''containsPattern'''
      level: error
    - suggestion: .isComplete('Blood Pressure')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies(''cast(split(`Blood Pressure`, "/")[0] as int) > cast(split(`Blood
        Pressure`, "/")[1] as int)'', ''bp_systolic_gt_diastolic'', lambda d: d ==
        1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Daily Steps:
    code:
    - suggestion: .hasDataType('Daily Steps', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Daily Steps'', lambda v: v >= 0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Daily Steps')
      status: true
      reason_if_failed: ''
      level: error
  Gender:
    code:
    - suggestion: .isContainedIn('Gender', ['Male', 'Female'])
      status: true
      reason_if_failed: ''
      level: error
  Heart Rate:
    code:
    - suggestion: .hasDataType('Heart Rate', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMax(''Heart Rate'', lambda v: v <= 220)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Heart Rate'', lambda v: v >= 30)'
      status: true
      reason_if_failed: ''
      level: error
  Person ID:
    code:
    - suggestion: .isComplete('Person ID')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isUnique('Person ID')
      status: true
      reason_if_failed: ''
      level: error
  Physical Activity Level:
    code:
    - suggestion: .hasDataType('Physical Activity Level', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Physical Activity Level')
      status: true
      reason_if_failed: ''
      level: error
  Quality of Sleep:
    code:
    - suggestion: .hasDataType('Quality of Sleep', ConstrainableDataTypes.Integral)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMax(''Quality of Sleep'', lambda v: v <= 10)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.hasMin(''Quality of Sleep'', lambda v: v >= 0)'
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Quality of Sleep')
      status: true
      reason_if_failed: ''
      level: error
  Sleep Disorder:
    code:
    - suggestion: '.satisfies(''(`Sleep Disorder` IS NULL) OR (`Sleep Disorder` IN
        (\''Insomnia\'', \''Sleep Apnea\''))'', ''sleep_disorder_domain'', lambda
        d: d == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Sleep Duration:
    code:
    - suggestion: .hasDataType('Sleep Duration', ConstrainableDataTypes.Fractional)
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: .isComplete('Sleep Duration')
      status: true
      reason_if_failed: ''
      level: error
    - suggestion: '.satisfies(''`Sleep Duration` > 0'', ''sleep_duration_positive'',
        lambda d: d == 1.0)'
      status: true
      reason_if_failed: ''
      level: error
  Stress Level:
    code:
    - suggestion: .hasDataType('Stress Level', ConstrainableDataTypes.Integral)
      status: false
      reason_if_failed: 'Constraint ''.hasDataType(''Stress Level'', ConstrainableDataTypes.Integral)''
        failed on data sample: Value: 0.0 does not meet the constraint requirement!'
      level: error
