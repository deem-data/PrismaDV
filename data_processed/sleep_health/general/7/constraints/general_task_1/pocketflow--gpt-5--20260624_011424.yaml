constraints:
  Age:
    code:
    - - .hasDataType('Age', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMax(''Age'', lambda v: v <= 120)'
      - Valid
    - - '.hasMin(''Age'', lambda v: v >= 0)'
      - Valid
    assumptions: []
    column_name: Age
  BMI Category:
    code:
    - - .isContainedIn('BMI Category', ['Obese', 'Overweight', 'Normal', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .containsPattern('Blood Pressure', '^[0-9]{2,3}/[0-9]{2,3}$')
      - Invalid
    - - .isComplete('Blood Pressure')
      - Valid
    - - '.satisfies(''cast(split(`Blood Pressure`, "/")[0] as int) > cast(split(`Blood
        Pressure`, "/")[1] as int)'', ''bp_systolic_gt_diastolic'', lambda d: d ==
        1.0)'
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .hasDataType('Daily Steps', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMin(''Daily Steps'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Heart Rate:
    code:
    - - .hasDataType('Heart Rate', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMax(''Heart Rate'', lambda v: v <= 220)'
      - Valid
    - - '.hasMin(''Heart Rate'', lambda v: v >= 30)'
      - Valid
    assumptions: []
    column_name: Heart Rate
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - .hasDataType('Physical Activity Level', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .hasDataType('Quality of Sleep', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMax(''Quality of Sleep'', lambda v: v <= 10)'
      - Valid
    - - '.hasMin(''Quality of Sleep'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.satisfies(''(`Sleep Disorder` IS NULL) OR (`Sleep Disorder` IN (\''Insomnia\'',
        \''Sleep Apnea\''))'', ''sleep_disorder_domain'', lambda d: d == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .hasDataType('Sleep Duration', ConstrainableDataTypes.Fractional)
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    - - '.satisfies(''`Sleep Duration` > 0'', ''sleep_duration_positive'', lambda
        d: d == 1.0)'
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - .hasDataType('Stress Level', ConstrainableDataTypes.Integral)
      - Valid
    assumptions: []
    column_name: Stress Level
