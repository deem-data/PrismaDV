constraints:
  BMI Category:
    code:
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Overweight', 'Obese', 'Normal Weight'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .hasPattern('Blood Pressure', r'^[0-9]{2,3}/[0-9]{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - '.hasMax(''Daily Steps'', lambda v: v <= 50000)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    - - .isNonNegative('Daily Steps')
      - Invalid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .isComplete('Gender')
      - Valid
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Person ID:
    code:
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasMax(''Physical Activity Level'', lambda v: v <= 100)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    - - .isNonNegative('Physical Activity Level')
      - Invalid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .isComplete('Quality of Sleep')
      - Valid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - .isContainedIn('Sleep Disorder', ['Insomnia', 'Sleep Apnea'], where='`Sleep
        Disorder` IS NOT NULL')
      - Invalid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - '.hasMax(''Sleep Duration'', lambda v: v < 14.01)'
      - Valid
    - - '.hasMin(''Sleep Duration'', lambda v: v > 2.99)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - '.hasMax(''Stress Level'', lambda v: v <= 8)'
      - Valid
    - - '.hasMin(''Stress Level'', lambda v: v >= 3)'
      - Valid
    - - .isComplete('Stress Level')
      - Valid
    assumptions: []
    column_name: Stress Level
