constraints:
  BMI Category:
    code:
    - - .hasDataType('BMI Category', ConstrainableDataTypes.String)
      - Valid
    - - .isComplete('BMI Category')
      - Valid
    - - .isContainedIn('BMI Category', ['Normal', 'Normal Weight', 'Overweight', 'Obese'])
      - Valid
    assumptions: []
    column_name: BMI Category
  Blood Pressure:
    code:
    - - .hasDataType('Blood Pressure', ConstrainableDataTypes.String)
      - Valid
    - - .hasPattern('Blood Pressure', '^\\d{2,3}/\\d{2,3}$')
      - Valid
    - - .isComplete('Blood Pressure')
      - Valid
    assumptions: []
    column_name: Blood Pressure
  Daily Steps:
    code:
    - - .hasDataType('Daily Steps', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMin(''Daily Steps'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Daily Steps')
      - Valid
    assumptions: []
    column_name: Daily Steps
  Gender:
    code:
    - - .hasDataType('Gender', ConstrainableDataTypes.String)
      - Valid
    - - .isComplete('Gender')
      - Valid
    - - .isContainedIn('Gender', ['Male', 'Female'])
      - Valid
    assumptions: []
    column_name: Gender
  Occupation:
    code:
    - - .hasDataType('Occupation', ConstrainableDataTypes.String)
      - Valid
    - - .isComplete('Occupation')
      - Valid
    - - .isContainedIn('Occupation', ['Nurse', 'Software Engineer', 'Sales Representative',
        'Engineer', 'Lawyer', 'Teacher', 'Accountant', 'Salesperson', 'Scientist',
        'Doctor'])
      - Valid
    assumptions: []
    column_name: Occupation
  Person ID:
    code:
    - - .hasDataType('Person ID', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMin(''Person ID'', lambda v: v > 0)'
      - Valid
    - - .isComplete('Person ID')
      - Valid
    - - .isUnique('Person ID')
      - Valid
    assumptions: []
    column_name: Person ID
  Physical Activity Level:
    code:
    - - '.hasCorrelation(''Physical Activity Level'', ''Daily Steps'', lambda c: c
        >= 0.2)'
      - Valid
    - - .hasDataType('Physical Activity Level', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMin(''Physical Activity Level'', lambda v: v >= 0)'
      - Valid
    - - .isComplete('Physical Activity Level')
      - Valid
    assumptions: []
    column_name: Physical Activity Level
  Quality of Sleep:
    code:
    - - .hasDataType('Quality of Sleep', ConstrainableDataTypes.Integral)
      - Valid
    - - .isComplete('Quality of Sleep')
      - Valid
    - - .isContainedIn('Quality of Sleep', [4, 5, 6, 7, 8, 9])
      - Invalid
    assumptions: []
    column_name: Quality of Sleep
  Sleep Disorder:
    code:
    - - '.hasCompleteness(''Sleep Disorder'', lambda v: v >= 0.35)'
      - Valid
    - - .isContainedIn('Sleep Disorder', ['Insomnia', 'Sleep Apnea'])
      - Valid
    assumptions: []
    column_name: Sleep Disorder
  Sleep Duration:
    code:
    - - .hasDataType('Sleep Duration', ConstrainableDataTypes.Fractional)
      - Valid
    - - '.hasMax(''Sleep Duration'', lambda v: v <= 12.0)'
      - Valid
    - - '.hasMin(''Sleep Duration'', lambda v: v >= 3.0)'
      - Valid
    - - .isComplete('Sleep Duration')
      - Valid
    assumptions: []
    column_name: Sleep Duration
  Stress Level:
    code:
    - - '.hasCorrelation(''Stress Level'', ''Quality of Sleep'', lambda c: c <= 0.0)'
      - Valid
    - - .hasDataType('Stress Level', ConstrainableDataTypes.Integral)
      - Valid
    - - '.hasMax(''Stress Level'', lambda v: v <= 8)'
      - Valid
    - - '.hasMin(''Stress Level'', lambda v: v >= 3)'
      - Valid
    - - .isComplete('Stress Level')
      - Valid
    assumptions: []
    column_name: Stress Level
