- MissingCategoricalValueCorruption:
    Columns:
      - BMI Category
    Params:
      random_state: 42
      severity: 0.05
      sampling: CAR
      max_unique_num: 30
      corrupt_strategy: to_nan
- RegexPatternViolation:
    Columns:
      - Blood Pressure
    Params:
      random_state: 42
      severity: 0.1
      sampling: CAR
      pattern:
        Blood Pressure: "^\\d{2,3}/\\d{2,3}$"
      strategy: format_breaking
