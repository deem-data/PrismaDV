[workspace]
name = "realetlbench-omop-cdm-databricks-r"
description = "Example-local R environment for the CHF cohort downstream script"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
# Pinned to r-base 4.4 because r-rsqlite-3.52 on osx-arm64 ships against r44.
# r-duckdb has no osx-arm64 build in conda-forge, so we use SQLite instead;
# the upstream's Spark-SQL CTEs run on SQLite with minor syntax tweaks.
r-base = ">=4.4,<4.5"
r-dplyr = "*"
r-glue = "*"
r-jsonlite = "*"
r-dbi = "*"
r-rsqlite = "*"

[tasks]
chf-cohort = { cmd = "Rscript adapter/source_repo/5-CHF-cohort-building.r" }
