example_id: bank_marketing_analysis
display_name: Bank Marketing Analysis
source_repo: https://github.com/UBC-MDS/bank-marketing-analysis
source_commit: c58fbc0cb389d734fe257cdc4396bd3c01abfa3e
source_license: MIT
domain: bank_marketing
primary_runtime: python
primary_language: python
task_type: feature_pipeline
clean_should_pass: true
corruption_mode: generated
environment:
  runner: uv
  project_dir: benchmarks/EIDBench-real/bank_marketing_analysis
  command_prefix: ["uv", "run", "--project", "benchmarks/EIDBench-real/bank_marketing_analysis"]
  dependencies_file: pyproject.toml
notes_on_repairs: |
  Repaired the upstream CSV read/write behavior so `age` remains a normal
  feature column. The upstream script used `index_col=0` when reading
  the raw CSV, which made `age` the dataframe index and removed it from
  model features. The benchmark source copy also writes processed CSVs with
  `index=False` and reads them without `index_col=0` to avoid accidental
  `Unnamed: 0` feature columns.
upstream_entrypoints:
  - scripts/split_and_process.py
  - scripts/eda.py
  - scripts/fit_bank_classifier.py
  - scripts/feat_imp.py
benchmark_adapter_files:
  - adapter/case.py
  - adapter/run_script.py
  - adapter/source_repo/scripts/split_and_process.py
  - adapter/source_repo/scripts/eda.py
  - adapter/source_repo/scripts/fit_bank_classifier.py
  - adapter/source_repo/scripts/feat_imp.py
  - adapter/source_repo/src/compute_and_plot_roc_curve.py
  - adapter/source_repo/src/data_viz.py
  - adapter/source_repo/src/model_report.py
  - adapter/source_repo/src/resample.py
  - pyproject.toml
external_dependencies:
  - pandas
  - scikit-learn
  - imbalanced-learn
  - altair
  - matplotlib
data_provenance: |
  `bank_marketing.csv` is the full UCI Bank Marketing dataset by Moro, Rita,
  and Cortez, normalized to a single benchmark table filename.
license_notes: |
  Upstream software is MIT. The Bank Marketing dataset is documented by the
  upstream project as Creative Commons Attribution 4.0 International.
input_layout:
  observed_tables_dir: files/observed/tables
  clean_input_dir: files/clean/input
  clean_tables_dir: files/clean/tables
  corrupted_root_dir: files/corrupted
expected_outputs:
  preprocess:
    clean_summary_path: expected/preprocess/clean_summary.json
  eda:
    clean_summary_path: expected/eda/clean_summary.json
  fit_classifier:
    clean_summary_path: expected/fit_classifier/clean_summary.json
  feature_importance:
    clean_summary_path: expected/feature_importance/clean_summary.json
tables:
  bank_marketing:
    format: csv
    observed_path: files/observed/tables/bank_marketing.csv
    clean_path: files/clean/tables/bank_marketing.csv
    primary_key: null
scripts:
  preprocess:
    entrypoint: adapter/run_script.py
    reads: [bank_marketing]
    writes:
      - bank_train.csv
      - bank_test.csv
      - X_train.csv
      - X_test.csv
      - y_train.csv
      - y_test.csv
      - X_train_resmp.csv
      - y_train_resmp.csv
      - X_train_trans.csv
      - bank_preprocessor.pickle
      - summary.json
    depends_on: []
    timeout_seconds: 120
    clean_should_pass: true
  eda:
    entrypoint: adapter/run_script.py
    reads: [bank_marketing]
    writes:
      - eda_categorical_variables.png
      - eda_continuous_variables.png
      - eda_log_variables.png
      - summary.json
    depends_on: [preprocess]
    timeout_seconds: 120
    clean_should_pass: true
  fit_classifier:
    entrypoint: adapter/run_script.py
    reads: [bank_marketing]
    writes:
      - logistic_pipeline.pickle
      - all_models.csv
      - lr_model.csv
      - summary.json
    depends_on: [preprocess]
    timeout_seconds: 600
    clean_should_pass: true
  feature_importance:
    entrypoint: adapter/run_script.py
    reads: [bank_marketing]
    writes:
      - feat_imp.png
      - summary.json
    depends_on: [preprocess, fit_classifier]
    timeout_seconds: 120
    clean_should_pass: true
