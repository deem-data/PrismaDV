$schema: https://json-schema.org/draft/2020-12/schema
title: EIDBench-real manifest
type: object
additionalProperties: true

required:
  - example_id
  - display_name
  - source_repo
  - domain
  - primary_runtime
  - primary_language
  - task_type
  - tables
  - scripts
  - input_layout
  - expected_outputs
  - clean_should_pass
  - corruption_mode
  - notes_on_repairs

properties:
  example_id:
    type: string
    pattern: ^[a-z0-9][a-z0-9_-]*$
  display_name:
    type: string
  source_repo:
    type: string
  source_commit:
    type: [string, "null"]
  domain:
    type: string
  primary_runtime:
    enum: [python, pyspark, spark-scala, mixed]
  primary_language:
    enum: [python, scala, sql, mixed]
  task_type:
    enum: [etl, ingestion, feature_pipeline, aggregation, analytics, mixed]
  clean_should_pass:
    type: boolean
  corruption_mode:
    enum: [materialized, generated, mixed]
  notes_on_repairs:
    type: string

  tables:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [format, observed_path, clean_path]
      additionalProperties: true
      properties:
        format:
          enum: [csv, json, jsonl, parquet, xml]
        observed_path:
          type: string
        clean_path:
          type: string
        primary_key:
          type: [string, array, "null"]
        corrupted_paths:
          type: object

  scripts:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [entrypoint, reads, writes]
      additionalProperties: true
      properties:
        entrypoint:
          type: string
        reads:
          type: array
          items:
            type: string
        writes:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer

  input_layout:
    type: object
    additionalProperties:
      type: string

  expected_outputs:
    type: object
    additionalProperties:
      type: object
      additionalProperties: true

  corruptions:
    type: object
    additionalProperties:
      type: object
      required: [expected_effect, rationale]
      additionalProperties: true
      properties:
        table:
          type: string
        column:
          type: string
        expected_effect:
          enum: [execution_failure, validation_failure, constraint_failure, silent_semantic_failure]
        rationale:
          type: string
