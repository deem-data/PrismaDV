example_id: healthy_diet_dashboard
display_name: Global Cost of a Healthy Diet Dashboard
source_repo: https://github.com/UBC-MDS/DSCI-532_2026_29_healthy-diet
source_commit: null
source_license: MIT
domain: public_health_economics
primary_runtime: python
primary_language: python
task_type: etl_pipeline
clean_should_pass: true
corruption_mode: generated
environment:
  runner: uv
  project_dir: benchmarks/EIDBench-real/healthy_diet_dashboard
  command_prefix: ["uv", "run", "--project", "benchmarks/EIDBench-real/healthy_diet_dashboard"]
  dependencies_file: pyproject.toml
notes_on_repairs: |
  Parameterized `src/scripts/clean_data.py` with Click CLI options
  (`--raw_data`, `--country_codes`, `--continent_lookup`, `--save_to`) so the
  benchmark adapter can point the script at arbitrary input/output directories.
  The original script hard-coded relative paths under `src/data/{raw,lookups,
  processed}`. No data transformations were changed; only I/O wiring.

  `src/app.py` was stripped of the AI Chatbot panel and its server handlers
  (`querychat`, `chatlas`, `anthropic`, `python-dotenv`) and the
  on-startup `download_dataset()` / `clean_dataset()` calls (which depended on
  Kaggle and the old no-arg `clean_dataset` signature). The dashboard charts,
  filters, KPI cards, and click-to-filter handlers are preserved verbatim.
  `src/scripts/download_data.py` is kept in-tree for reference but is not
  imported or invoked by the benchmark or by `app.py`.
upstream_entrypoints:
  - src/scripts/clean_data.py
benchmark_adapter_files:
  - adapter/case.py
  - adapter/run_script.py
  - adapter/source_repo/src/scripts/clean_data.py
  - adapter/source_repo/src/scripts/__init__.py
  - adapter/source_repo/src/scripts/download_data.py
  - adapter/source_repo/src/app.py
  - adapter/source_repo/src/requirements.txt
  - pyproject.toml
external_dependencies:
  - click
  - duckdb
  - numpy
  - pandas
  - plotly
  - pyarrow
  - shiny
data_provenance: |
  Source dataset: "Price of Healthy Diet (Clean)" by Hassan Jameel Ahmed on
  Kaggle (derived from FAO/World Bank statistics 2017-2024). Country code
  lookup (`country_codes.csv`) and continent lookup
  (`countries_by_continents.csv`) are reference tables shipped with the
  upstream dashboard repo.
license_notes: |
  Upstream software is MIT. Dataset provenance is FAO/World Bank; consult the
  upstream Kaggle listing for redistribution terms.
input_layout:
  observed_tables_dir: files/observed/tables
  clean_input_dir: files/clean/input
  clean_tables_dir: files/clean/tables
  corrupted_root_dir: files/corrupted
expected_outputs:
  clean_data:
    clean_summary_path: expected/clean_data/clean_summary.json
tables:
  price_of_healthy_diet:
    format: csv
    observed_path: files/observed/tables/price_of_healthy_diet.csv
    clean_path: files/clean/tables/price_of_healthy_diet.csv
    primary_key: null
  country_codes:
    format: csv
    observed_path: files/observed/tables/country_codes.csv
    clean_path: files/clean/tables/country_codes.csv
    primary_key: Numeric
  countries_by_continents:
    format: csv
    observed_path: files/observed/tables/countries_by_continents.csv
    clean_path: files/clean/tables/countries_by_continents.csv
    primary_key: Country
scripts:
  clean_data:
    entrypoint: adapter/run_script.py
    reads: [price_of_healthy_diet, country_codes, countries_by_continents]
    writes:
      - cleaned_price_of_healthy_diet.csv
      - cleaned_price_of_healthy_diet.parquet
      - summary.json
    depends_on: []
    timeout_seconds: 120
    clean_should_pass: true
